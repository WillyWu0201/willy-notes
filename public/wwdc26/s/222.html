<script id="d" type="application/json">{"s":{"id":"222","title":"Meet the new MetricKit","gloss":"認識全新的 MetricKit","category":"other","categoryLabel":"其他","duration":1063,"url":"https://developer.apple.com/videos/play/wwdc2026/222/","takeaway":"用全新以 async 串流為核心的 MetricKit 接收效能指標與診斷資料，並透過 State Reporting 加上自訂情境，更快找出並修正效能問題。","chapters":[[1,"Introduction"],[247,"Metrics"],[299,"Receive metrics from MetricKit"],[325,"Send your metrics to the server"],[344,"Access your performance metrics"],[433,"Diagnostics"],[539,"Receive diagnostics"],[554,"Send your diagnostic data to the server"],[579,"Access your diagnostic data"],[603,"Context"],[837,"Receive MetricKit data with states"],[861,"Define custom structured types"],[929,"Send encoded metric reports to the server"]],"points":[{"text":"用 `MetricManager` 的 **async 串流**（`metricReports`、`diagnosticReports`）接收效能指標與診斷，取代舊有的 delegate 模式。","hot":true},{"text":"指標報告可直接以 **`JSONEncoder` 編碼**並上傳到自家伺服器，方便集中分析。","hot":false},{"text":"診斷資料涵蓋**當機（crash）與卡頓（hang）**，並提供 `callStackTree`、終止原因與分類等細節。","hot":false},{"text":"透過 **State Reporting**（`StateReporter`、`@ReportableMetadata`）為指標加上自訂情境，把資料對應到 App 內的狀態與畫面。","hot":false}],"apis":["MetricKit","MetricManager","MetricReport","StateReporting","StateReportingDomain","StateReporter","ReportableMetadata"],"audience":"**重視 App 效能、想建立指標與當機監控管線的開發者**。","gloss_en":"Meet the new MetricKit","takeaway_en":"Receive performance metrics and diagnostics with the new async-stream-based MetricKit, and use State Reporting to add custom context so you can find and fix performance problems faster.","points_en":[{"text":"Receive performance metrics and diagnostics via `MetricManager`'s **async streams** (`metricReports`, `diagnosticReports`), replacing the old delegate pattern.","hot":true},{"text":"Metric reports can be encoded directly with **`JSONEncoder`** and uploaded to your own server for centralized analysis.","hot":false},{"text":"Diagnostics cover **crashes and hangs**, with details like `callStackTree`, termination reason, and classification.","hot":false},{"text":"Use **State Reporting** (`StateReporter`, `@ReportableMetadata`) to attach custom context to metrics, mapping data to in-app states and screens.","hot":false}],"audience_en":"**Developers who care about app performance and want to build a metrics and crash monitoring pipeline**.","summary":["**MetricKit** 是 Apple 用來在真實裝置上監測 app 效能品質的框架，由 MetricKit 團隊的 Yonni 主講。效能優化是一個循環：收集資料、分析找問題、triage 找根因、修正、再回到收集。MetricKit 負責「收集」這一環，提供兩種資料：**metrics**（告訴你某面向是變好還變壞的整體趨勢）與 **diagnostics**（告訴你哪條 code path 造成問題）。**iOS 27** 把整個框架以現代、Swift-first 的全新 API 從頭重寫，所有新進展都僅限這套新 API（舊的 `MXMetricManager` 應遷移到新的 **`MetricManager`**）。","取得 metrics 很簡單：建立 `MetricManager`，在 app 啟動時就 `for await report in manager.metricReports` 訂閱，避免延遲訂閱造成資料遺失。每日 report 內含一個涵蓋全天的 entry 與數個數小時的細分 entry；每個 interval 內的 metrics 依 **metric group**（`.cpu`、`.memory`、`.display`、`.gpu`）組織。`MetricReport` 是 **Codable**，可直接用 `JSONEncoder` 編碼送到伺服器做跨裝置聚合分析；也可逐層 filter 到特定 group 再 switch 取出如 `peakMemory` 的值。iOS 27 新增 **Metal frame rate** metric。","Diagnostics 在 triage 階段特別有用：當 crash、hang 發生，系統在裝置上擷取診斷並立即透過 `manager.diagnosticReports` 送達 app。crash diagnostic 提供 backtrace、termination reason、exception type，iOS 27 還加上 **termination category**（標示該 crash 如何被計入 metrics，方便與趨勢對照）；新增 **memory exception diagnostics**。最強大的是 **context**：透過 **StateReporting** 框架以 `reportTransition(to:)` 回報 app 狀態（如不同 tab、實驗開關），MetricKit 便能把 metric 依狀態切分——例如 scroll hitch 在 Spending tab 僅 1 ms/s 但 Reports tab 飆到 71 ms/s，直接指出優化重點。每個 state 屬於一個 **domain**（同時只有一個 active state），可用 `@ReportableMetadata` 加結構化細節，並用 `encodingFormatKey = .byStateReportingDomain` 把報告依 domain 分組送出。最佳實務：domain 要窄、state 要代表穩定且有意義的階段、別過度細分。"],"deepdive":[{"t":1,"title":"Introduction","body":"由 MetricKit 團隊的 Yonni 開場，介紹框架與 **iOS 27** 新功能。效能優化是循環：收集→分析→triage→修正→再收集，MetricKit 負責**收集**。它提供 **metrics**（效能趨勢的整體訊號）與 **diagnostics**（指出問題 code path），iOS 27 以現代 Swift-first API 全新重寫，所有新進展皆專屬這套新 API。"},{"t":247,"title":"Metrics","body":"說明 metrics 是 app 的持續健康訊號：launch time、hangs、animation 反映流暢度，CPU／GPU／disk／network 反映資源消耗。以 time to first draw 的 histogram 與由 hang 資料推導 hang rate 為例；iOS 27 可把每個 metric 依 app **state** 切分，並新增 **Metal frame rate** metric。"},{"t":299,"title":"Receive metrics from MetricKit","body":"入口是 **`MetricManager`** 類別，透過 `for await report in manager.metricReports` 接收 report。應在 app 啟動時就建立並保持存活，避免延遲訂閱造成資料遺失，讓串流持續送達後續報告。"},{"t":325,"title":"Send your metrics to the server","body":"`MetricReport` 是 **Codable**，可用 `JSONEncoder` 直接把整份報告編碼成 JSON 送到伺服器，方便跨多裝置檢視 app 健康狀況。"},{"t":344,"title":"Access your performance metrics","body":"若只想取特定資料，可遍歷 **`intervalEntries`**（含全天彙總與細分窗口），filter 到目標 **metric group**（如 `.memory`），再 switch 各 metric case 取值（範例只處理 `peakMemory`）。建議在 app 啟動時於 detached task 或專屬 service class 執行。接著進入分析階段：在伺服器聚合、建立 baseline 並監測趨勢。"},{"t":433,"title":"Diagnostics","body":"metrics 用於監測，**diagnostics** 用於 triage。當 crash 或 hang 發生，系統在裝置上擷取診斷並立即送達 app。多數 diagnostics 含 **backtrace**；crash diagnostic 還提供終止原因與 exception type，iOS 27 新增 **termination category** 對應 metrics 計入方式，可與異常終止趨勢相關聯。"},{"t":539,"title":"Receive diagnostics","body":"透過 `manager.diagnosticReports` await 取得診斷報告，同樣應在 app 啟動時於 detached task 或專屬 service class 開始監聽。"},{"t":554,"title":"Send your diagnostic data to the server","body":"`DiagnosticReport` 與 metric report 一樣是 **Codable**，可用 `JSONEncoder` 編碼成 JSON，把所有診斷資訊送到分析伺服器。"},{"t":579,"title":"Access your diagnostic data","body":"診斷報告為結構化，可 switch 不同 case 取用：crash case 取出 **backtrace、reason、category**，hang case 則另行處理。讓 app 能針對不同診斷類型分流並上傳。"},{"t":603,"title":"Context","body":"前述資料是整體圖像；要調查個別問題需更細緻的 **context**。以費用報帳 app 為例，scroll hitch 的平均值（15 ms/s）橫跨 Reports 與 Spending 兩 tab，無法看出問題出在哪。可用 **StateReporting** 框架回報 app 狀態，讓 MetricKit 依狀態聚合 metric。"},{"t":837,"title":"Receive MetricKit data with states","body":"建立 **`StateReportingDomain`**（reverse-DNS 字串）並在設定 `MetricManager` 時以 `enabledStateReportingDomains` 註冊，再用 `StateReporter.reporter(for:)` 的 **`reportTransition(to:)`** 回報轉換（如 \"Reports\"）。state 採 transition 模型，無 start/end 配對，只回報當下狀態。"},{"t":861,"title":"Define custom structured types","body":"可用 **`@ReportableMetadata`** 巨集定義自訂 struct（如 `ViewConfiguration` 含 listSize、isSorted），建立帶 `stableMetadata:` 的 reporter，並在 `reportTransition` 時附上該結構，為每個狀態加上更細的結構化資訊。"},{"t":929,"title":"Send encoded metric reports to the server","body":"送出時可把資料依 **state reporting domain** 分組：在 `JSONEncoder` 的 `userInfo` 設定 `MetricReport.encodingFormatKey` 為 **`.byStateReportingDomain`**，編碼後 state entries 與 interval entries 都會依 domain 與 state 分組。最佳實務：domain 要窄、state 代表穩定有意義的階段、避免過度細分，並用 Points of Interest instrument 驗證。"}],"summary_en":["**MetricKit** is Apple's framework for monitoring real-world app performance quality on real devices, presented by Yonni from the MetricKit team. Performance optimization is a loop: collect data, analyze to find problems, triage to find root cause, fix, and return to collecting. MetricKit handles the collection piece, providing two kinds of data: **metrics** (telling you whether an area is trending better or worse overall) and **diagnostics** (telling you which code path caused a problem). **iOS 27** rebuilds the framework from the ground up with a modern, Swift-first API; all new advances are exclusive to it (migrate the old `MXMetricManager` to the new **`MetricManager`**).","Getting metrics is simple: create a `MetricManager` and subscribe at app startup via `for await report in manager.metricReports` to avoid data loss from delayed subscription. Each daily report contains a full-day entry plus smaller multi-hour breakdown entries; within each interval, metrics are organized into **metric groups** (`.cpu`, `.memory`, `.display`, `.gpu`). `MetricReport` is **Codable**, so encode it with `JSONEncoder` and send it to a server for cross-device aggregation; or drill down by filtering to a group and switching over cases to read values like `peakMemory`. iOS 27 adds a **Metal frame rate** metric.","Diagnostics shine in the triage phase: when a crash or hang occurs, the system captures a diagnostic on device and delivers it immediately via `manager.diagnosticReports`. A crash diagnostic provides a backtrace, termination reason, and exception type, and iOS 27 adds a **termination category** (indicating how the crash was accounted for in metrics, to correlate with trends); it also adds **memory exception diagnostics**. The most powerful capability is **context**: via the **StateReporting** framework you report app states with `reportTransition(to:)` (e.g., different tabs, an experiment flag), so MetricKit can intersect metrics with state—for example scroll hitch was just 1 ms/s on the Spending tab but spiked to 71 ms/s on the Reports tab, pinpointing where to optimize. Each state belongs to a **domain** (only one active state at a time), can carry structured detail via `@ReportableMetadata`, and reports can be grouped by domain on send via `encodingFormatKey = .byStateReportingDomain`. Best practices: keep domains narrow, make states represent stable meaningful phases, and avoid over-granularity."],"deepdive_en":[{"t":1,"title":"Introduction","body":"Yonni from the MetricKit team opens by introducing the framework and **iOS 27** updates. Optimization is a loop: collect → analyze → triage → fix → collect, with MetricKit handling **collection**. It provides **metrics** (an overall performance trend signal) and **diagnostics** (pinpointing the problem code path); iOS 27 rewrites it with a modern Swift-first API, and all new advances are exclusive to it."},{"t":247,"title":"Metrics","body":"Explains metrics as the app's ongoing health signal: launch time, hangs, and animation reflect smoothness, while CPU/GPU/disk/network reflect resource consumption. Uses a time-to-first-draw histogram and a derived hang rate as examples; iOS 27 can intersect each metric with app **state** and adds a **Metal frame rate** metric."},{"t":299,"title":"Receive metrics from MetricKit","body":"The entry point is the **`MetricManager`** class; receive reports via `for await report in manager.metricReports`. Set this up at app startup and keep it alive to avoid data loss from delayed subscription, so the stream keeps delivering subsequent reports."},{"t":325,"title":"Send your metrics to the server","body":"`MetricReport` is **Codable**, so use `JSONEncoder` to encode the entire report to JSON and send it to a server, making it easy to examine app health across many devices."},{"t":344,"title":"Access your performance metrics","body":"To access specific data, iterate **`intervalEntries`** (full-day aggregate plus breakdown windows), filter to the target **metric group** (e.g. `.memory`), then switch over metric cases to read values (the example handles only `peakMemory`). Do this in a detached task or dedicated service class at launch. Then enter analysis: aggregate on a server, establish a baseline, and monitor trends."},{"t":433,"title":"Diagnostics","body":"Metrics are for monitoring; **diagnostics** are for triage. When a crash or hang occurs, the system captures a diagnostic on device and delivers it immediately. Most diagnostics include a **backtrace**; crash diagnostics also provide a termination reason and exception type, and iOS 27 adds a **termination category** matching how it's accounted for in metrics, to correlate with abnormal-termination trends."},{"t":539,"title":"Receive diagnostics","body":"Await diagnostic reports via `manager.diagnosticReports`, again starting the listener at app launch in a detached task or dedicated service class."},{"t":554,"title":"Send your diagnostic data to the server","body":"Like metric reports, `DiagnosticReport` is **Codable**, so encode it to JSON with `JSONEncoder` and send all the diagnostic information to your analytics server."},{"t":579,"title":"Access your diagnostic data","body":"Diagnostic reports are structured, so switch over cases to pick what you need: the crash case extracts **backtrace, reason, and category**, while the hang case is handled separately, letting the app route and upload different diagnostic types."},{"t":603,"title":"Context","body":"The data so far is the overall picture; investigating individual issues needs richer **context**. Using an expense app, the average scroll hitch (15 ms/s) blends the Reports and Spending tabs, hiding where the problem is. Report app states via the **StateReporting** framework so MetricKit can aggregate metrics by state."},{"t":837,"title":"Receive MetricKit data with states","body":"Create a **`StateReportingDomain`** (a reverse-DNS string), register it via `enabledStateReportingDomains` when setting up `MetricManager`, then use `StateReporter.reporter(for:)`'s **`reportTransition(to:)`** to report transitions (e.g. \"Reports\"). States follow a transition model with no start/end pairs—you report the current condition."},{"t":861,"title":"Define custom structured types","body":"Use the **`@ReportableMetadata`** macro to define a custom struct (e.g. `ViewConfiguration` with listSize, isSorted), create a reporter with `stableMetadata:`, and pass that struct in `reportTransition` to attach finer structured info to each state."},{"t":929,"title":"Send encoded metric reports to the server","body":"On send, group data by **state reporting domain**: set `MetricReport.encodingFormatKey` to **`.byStateReportingDomain`** on the `JSONEncoder`'s `userInfo`, so encoded state and interval entries are grouped by domain and state. Best practices: keep domains narrow, make states stable and meaningful, avoid over-granularity, and validate with the Points of Interest instrument."}],"code":[]},"related":[{"id":"388","title":"Find and fix performance issues in your Metal games","gloss":"找出並修復 Metal 遊戲的效能問題","gloss_en":"Find and fix performance issues in your Metal games","category":"graphics","categoryLabel":"圖形與遊戲"},{"id":"101","title":"Keynote","gloss":"主題演講","gloss_en":"Keynote","category":"other","categoryLabel":"其他"},{"id":"102","title":"Platforms State of the Union","gloss":"平台現況報告","gloss_en":"Platforms State of the Union","category":"other","categoryLabel":"其他"},{"id":"111","title":"Keynote (ASL)","gloss":"主題演講(美國手語版)","gloss_en":"Keynote (American Sign Language)","category":"other","categoryLabel":"其他"},{"id":"112","title":"Platforms State of the Union (ASL)","gloss":"平台現況報告（美國手語版）","gloss_en":"Platforms State of the Union (American Sign Language)","category":"other","categoryLabel":"其他"}]}</script>
