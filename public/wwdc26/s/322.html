<script id="d" type="application/json">{"s":{"id":"322","title":"Compose advanced graphics effects with SwiftUI","gloss":"用 SwiftUI 組合進階圖形效果","category":"swiftui","categoryLabel":"SwiftUI","duration":1075,"url":"https://developer.apple.com/videos/play/wwdc2026/322/","takeaway":"結合 SwiftUI 的 layerEffect、Metal shader 與 TimelineView、對齊指南等版面 API，把複雜視覺拆解成可組合、可動畫的圖形效果。","chapters":[[0,"Introduction"],[100,"Design breakdown"],[251,"Cover art and shader effects"],[258,"Cover art image"],[264,"Blurred cover art image"],[429,"Applying layer effect in SwiftUI"],[441,"Writing layer effect shader in Metal"],[459,"Metal shader with offset parameter"],[475,"SwiftUI layer effect with offset parameter"],[484,"SwiftUI layer effect with full-width offset"],[517,"SwiftUI layer effect with noise sampling"],[535,"Metal shader with noise sampling"],[622,"Metal shader with domain warping"],[667,"Driving animation with time"],[676,"SwiftUI layer effect with static visual"],[697,"SwiftUI layer effect with animated visual"],[720,"Time-synced transcript view"],[735,"Basic transcript view"],[753,"Time-synced transcript view"],[798,"Floating timestamps with alignment guides"],[833,"Overlay with center alignment"],[846,"Overlay with bottom leading alignment"],[872,"Overlay with alignment guide override"],[976,"Creative pipelines"],[1033,"Next steps"]],"points":[{"text":"示範如何把設計**拆解（design breakdown）**成可組合的 SwiftUI 版面與圖形 API。","hot":false},{"text":"以 **layerEffect** 搭配 Metal 的 `[[stitchable]]` shader 套用自訂效果（如背景扭曲）。","hot":true},{"text":"透過 noise texture 取樣與 **domain warping** 在 shader 中產生豐富的視覺變化。","hot":false},{"text":"用 **TimelineView(.animation)** 把經過時間傳入 shader，驅動動畫化的視覺。","hot":false},{"text":"以 **ScrollViewReader** 做時間同步逐字稿，並用 **alignmentGuide** 讓時間戳浮動對齊。","hot":false}],"apis":["SwiftUI","layerEffect","ShaderLibrary","Metal","TimelineView","ScrollViewReader","alignmentGuide","GeometryReader"],"audience":"**想為 SwiftUI App 打造客製化視覺與動畫效果的開發者**，對 shader 與圖形組合有興趣的人。","gloss_en":"Compose advanced graphics effects with SwiftUI","takeaway_en":"Combine SwiftUI's layerEffect, Metal shaders, and layout APIs like TimelineView and alignment guides to break complex visuals down into composable, animatable graphics effects.","points_en":[{"text":"Demonstrates how to do a **design breakdown** into composable SwiftUI layout and graphics APIs.","hot":false},{"text":"Apply custom effects (such as background distortion) using **layerEffect** paired with Metal's `[[stitchable]]` shaders.","hot":true},{"text":"Produce rich visual variation in the shader through noise texture sampling and **domain warping**.","hot":false},{"text":"Use **TimelineView(.animation)** to pass elapsed time into a shader, driving animated visuals.","hot":false},{"text":"Build a time-synced transcript with **ScrollViewReader**, and use **alignmentGuide** to float the timestamps into alignment.","hot":false}],"audience_en":"**Developers who want to craft custom visuals and animation effects for their SwiftUI apps** and are interested in shaders and graphics composition.","summary":["由 UI Frameworks 團隊的 Haotian 主講,核心觀念是:**SwiftUI 的進階效果不在於複雜,而在於「組裝」**。他把 SwiftUI app 比喻成一條 **pipeline**——資料流經一連串標準「管子」(modifier 與 API),每個管子各自就能運作,而你可以串接、分支或合流它們,創意就發生在這裡。整場以一個 podcast app 為例,把陽春的逐字稿畫面,改造成像 Apple Music live lyrics 那樣有動態封面與時間同步捲動字幕的效果。","前景與背景兩條主線。背景用 **shader** 把封面圖轉成視覺特效:先用 **`.blur`** 柔化,再用 **`.layerEffect`**(三種 shader effect 中最具彈性、可取樣整層的一種)套上 Metal 寫的 `backgroundWarp` shader。從單純取樣、加上 **`float2` offset**、引入 **NoiseTexture**(以 RGB 的紅綠通道當作每像素的 organic offset),到二次取樣的 **domain warping** 產生流動的有機團塊;最後因為 shader 是 stateless,改用 **`TimelineView(.animation)`** 每幀傳入 elapsed 時間,讓畫面動起來。","前景是時間同步的逐字稿。用 `ScrollView` + `LazyVStack` 排出每行 `Text`,用 playback 的 timestamp 判斷 current line(粗體高亮、其餘淡出),再以 **`onChange`** 搭配 **`ScrollViewReader`** 的 `scrollTo(anchor: .center)` 讓目前行置中。浮動時間戳則用 **alignment** 觀念解決:把 timestamp 放進 **`.overlay`**,改用 `.bottomLeading` 對齊,再用 **`alignmentGuide`** 把 subview 的 bottom 覆寫成它自己的 top,純語意地讓子視圖上緣貼齊容器下緣,完全不用手動 offset。","實務收尾:這些效果全來自簡單管子的組合,且跨 Apple 裝置皆可運作。同一條 pipeline 換掉輸入(用陀螺儀取代音訊)、換掉 shader(用漣漪取代扭曲)、換掉前景(用自由 canvas 取代 scroll view),就能得到完全不同的成果——API 一樣,**你餵進什麼、怎麼串接,才是你的創意**。建議下載 sample project 動手調整 shader、noise 與速度。"],"deepdive":[{"t":0,"title":"Introduction","body":"Haotian 提出全片主軸:SwiftUI 進階效果其實是一條 **pipeline**——資料流經一系列標準管子,各自可運作,而你能串接、分支或合流它們。**「advanced」在於組裝,而非複雜度**。路線圖為:拆解設計、打造進階效果、再以 creative pipeline 應用到自己的 app。"},{"t":100,"title":"Design breakdown","body":"以自製 podcast app 為例,要把陽春逐字稿變成像 Apple Music live lyrics 的樣子。重點是現有 UI **已含所有需要的資料**(封面、播放資訊、逐字稿),問題不在缺資料,而在如何用 pipeline **轉換**它:封面接 shader pipe 再合流 time pipe 做動態視覺;逐字稿接同一條 time pipe 做時間同步捲動。"},{"t":251,"title":"Cover art and shader effects","body":"從封面開始。原料就是一張封面圖,因為它會墊在逐字稿後面,需要先處理讓它不搶戲,再施加 shader 魔法。"},{"t":258,"title":"Cover art image","body":"最基本的起點:`Image(\"CoverArt\")`,直接顯示原始封面圖作為後續所有變換的素材。"},{"t":264,"title":"Blurred cover art image","body":"用 **`.blur(radius: 30)`** 柔化封面,讓它退到背景不與前景的逐字稿競爭。接著解釋 shader 是什麼:向量圖被 GPU 點陣化成像素後,可在 GPU 上跑一支 shader 程式決定每個像素的顏色,且**每像素平行、彼此無感知**地獨立執行。"},{"t":429,"title":"Applying layer effect in SwiftUI","body":"介紹三種 shader effect:**colorEffect**(改每像素顏色,適合黑白化)、**distortionEffect**(改取樣位置,適合幾何變形如 shear)、**layerEffect**(最具彈性,提供整層 layer 可取樣鄰近或整片像素,適合 blur)。此用例選 **layerEffect**,並在 `GeometryReader` 中套上 `ShaderLibrary.backgroundWarp()`。"},{"t":441,"title":"Writing layer effect shader in Metal","body":"對應的 Metal 端 `backgroundWarp` 標上 `[[stitchable]]`,先只做 `layer.sample(position)` 原位取樣,得到一張和原圖一樣的影像——但這就是可往上堆疊的 shader 起點。"},{"t":459,"title":"Metal shader with offset parameter","body":"為 shader 增加一個 **`float2 offset`** 參數,改成 `layer.sample(position + offset)`——告訴 SwiftUI「我要這個位置的顏色去跟隨另一個位置」,讓取樣位置可被位移。"},{"t":475,"title":"SwiftUI layer effect with offset parameter","body":"在 SwiftUI 端對應傳入 `.float2(.init(x: 0, y: 0))`。當 offset 為零時影像不變;增加 offset 時每個像素都以相同位移取樣,整體均勻平移。"},{"t":484,"title":"SwiftUI layer effect with full-width offset","body":"把 offset 改為 `.float2(.init(x: proxy.size.width, y: 0))`,以整個視圖寬度位移。但因為是**均勻 offset**,只會得到固定模式的平移,缺乏 organic 變化,需要某種能隨像素變動的東西。"},{"t":517,"title":"SwiftUI layer effect with noise sampling","body":"改傳入視圖 size 與一張 **NoiseTexture**(`.image`)——一張預先算好、平滑隨機值的圖,用來產生有機的、隨像素變化的位移。"},{"t":535,"title":"Metal shader with noise sampling","body":"Metal 端以 `texture2d` 接收 NoiseTexture。用 position 與 size 算出 **uv**(相對位置),建立 repeat 模式的 sampler 取樣 noise;noise 的**紅、綠通道**各含不同雜訊模式,組成二維 offset,縮放後加到 position 取樣原圖,使影像產生輕微扭轉。"},{"t":622,"title":"Metal shader with domain warping","body":"進一步**取樣兩次 noise**:第一次得到初始 offset `q`,再在被 `q` 位移過的 uv 位置取樣第二次,得到流動的有機團塊。這個分層雜訊技巧就是知名的 **domain warping**,sample app 附 preview 可自行調參。"},{"t":667,"title":"Driving animation with time","body":"shader 是 **stateless**——沒有前一幀記憶,輸出只取決於參數,因此要動畫就得傳入隨時間變化的值。**`TimelineView`** 正是需要的 pipe,以 `.animation` schedule 每幀觸發並帶 timestamp。"},{"t":676,"title":"SwiftUI layer effect with static visual","body":"目前的 shader 效果雖酷但仍是**靜止**的,因為沒有任何隨時間變化的輸入,凸顯了需要引入 time pipe 才能讓它動起來。"},{"t":697,"title":"SwiftUI layer effect with animated visual","body":"用 `TimelineView(.animation)` 算出 `elapsed = timeline.date.timeIntervalSince(startDate)`,把它以 `.float(elapsed)` 傳進 shader,加到取樣 noise 的位置上,圖樣便開始流動——這就是 time 驅動的 shader 動畫。"},{"t":720,"title":"Time-synced transcript view","body":"轉到逐字稿:同樣要把 time 加進來,讓目前播放的那一行被高亮並置中於 scroll view。"},{"t":735,"title":"Basic transcript view","body":"起點是熟悉的 SwiftUI:`ScrollView` 內一個 `LazyVStack`,以 `ForEach` 對每行逐字稿放一個 `Text`,每行各自是獨立 view。"},{"t":753,"title":"Time-synced transcript view","body":"用 `PlaybackState` 的 timestamp 判斷 current line(用 `transcriptLineStyle(isCurrent:)` 讓目前行清晰、其餘淡出),再以 **`onChange`** 監看 `currentLineIndex` 變化,透過 **`ScrollViewReader`** 的 `scrollTo(i, anchor: .center)` 讓目前行保持置中。"},{"t":798,"title":"Floating timestamps with alignment guides","body":"聚焦目前行旁的小時間戳。每行都在 `.overlay` 裡放了 timestamp,但只有 current line 的會顯示,如此不干擾版面、隨時待命。這個子視圖貼在容器邊緣的需求,無法用 `offset`(需同時知道兩視圖大小)解決,引出 alignment。"},{"t":833,"title":"Overlay with center alignment","body":"解釋 alignment:每個視圖都有由兩軸定義的對齊點,布局系統用它定位。當 subview 放進 overlay,預設用 **center alignment** 把兩者對齊——就像一根針同時穿過兩視圖的對齊點,把它們釘在一起。"},{"t":846,"title":"Overlay with bottom leading alignment","body":"把 overlay 的 alignment 改成 **`.bottomLeading`**,針改穿過兩視圖的 bottom-leading 點並鎖在那裡。此時布局系統向 subview 詢問它的 bottom-leading 對齊點。"},{"t":872,"title":"Overlay with alignment guide override","body":"目標是讓 subview 的**上緣貼齊容器的下緣**。用 **`alignmentGuide(.bottom) { $0[.top] }`** 覆寫:當布局系統詢問 bottom 對齊時,改回傳該 subview 的 top,於是針依此點穿過。純語意覆寫即達成,無需手動 offset;此 API 還可定義自訂 alignment,closure 提供 `ViewDimensions` 以依實際大小計算。"},{"t":976,"title":"Creative pipelines","body":"回顧:把設計拆成層、為每層找對的 API 把原始資料變成 view,每一階段的輸出餵給下一階段,這種串接就是 **creative pipeline**。但這只是此 app 的選擇——換成陀螺儀輸入、漣漪 shader、或自由 canvas 前景,就得到完全不同結果,**API 相同,你餵什麼、怎麼接才是你的創意**。"},{"t":1033,"title":"Next steps","body":"鼓勵觀眾下載 sample project,動手調整 shader、改 noise、調速度、換圖,並在自己 app 中尋找「一個小視覺效果能帶來大不同」的機會——串起這些管子,簡單的東西很快就變得進階。"}],"summary_en":["Presented by Haotian from the UI Frameworks team, the core idea is that **SwiftUI's advanced effects are about composition, not complexity**. He frames a SwiftUI app as a **pipeline** — data flows through a series of standard \"pipes\" (modifiers and APIs), each of which works on its own, and you connect, branch, or merge them; that's where creativity happens. The running example is a podcast app whose bare-bones transcript view is reworked into something like Apple Music's live lyrics, with animated cover art and a time-synced scrolling transcript.","There are two main threads: background and foreground. The background uses a **shader** to turn the cover art into a visual effect: soften it with **`.blur`**, then apply a Metal `backgroundWarp` shader via **`.layerEffect`** (the most flexible of the three shader effects, able to sample the whole layer). It progresses from a plain sample, to a **`float2` offset**, to a **NoiseTexture** (using the red/green channels as a per-pixel organic offset), to a second sample producing **domain warping** with flowing organic blobs; finally, because shaders are stateless, a **`TimelineView(.animation)`** feeds in elapsed time each frame to make it move.","The foreground is a time-synced transcript. A `ScrollView` + `LazyVStack` lays out each `Text`, the playback timestamp decides the current line (bold and clear, the rest faded), and **`onChange`** with **`ScrollViewReader`**'s `scrollTo(anchor: .center)` keeps it centered. The floating timestamp is solved with **alignment**: place the timestamp in an **`.overlay`**, switch to `.bottomLeading`, then use **`alignmentGuide`** to override the subview's bottom to its own top — purely semantically pinning the subview's top edge to the container's bottom edge, with no manual offset.","The practical takeaway: these effects all come from composing simple pipes, and they work across Apple devices. The same pipeline with different inputs (gyroscope instead of audio), a different shader (ripple instead of twist), or a different foreground (a freeform canvas instead of a scroll view) yields something entirely different — the APIs are the same; **what you feed in and how you connect them is yours**. Download the sample project and experiment with the shader, noise, and speed."],"deepdive_en":[{"t":0,"title":"Introduction","body":"Haotian sets the theme: SwiftUI's advanced effects are really a **pipeline** — data flows through a series of standard pipes that each work on their own, and you connect, branch, or merge them. **The \"advanced\" lies in the construction, not the complexity.** The roadmap: break down a design, build advanced effects, then apply them via a creative pipeline."},{"t":100,"title":"Design breakdown","body":"Using a homemade podcast app, the goal is to turn a bare-bones transcript into something like Apple Music's live lyrics. The key insight: the existing UI **already contains all the data** (cover art, playback info, transcript). The question isn't what data is needed but how to **transform** it — the cover art feeds a shader pipe merged with a time pipe for dynamic visuals; the transcript feeds the same time pipe for synced scrolling."},{"t":251,"title":"Cover art and shader effects","body":"Starting with the cover art. The raw material is just an image, and because it will sit behind the transcript it must first be tamed so it doesn't compete, then have shader magic applied."},{"t":258,"title":"Cover art image","body":"The most basic starting point: `Image(\"CoverArt\")`, simply displaying the raw cover image as the material for all subsequent transformations."},{"t":264,"title":"Blurred cover art image","body":"A **`.blur(radius: 30)`** softens the cover so it recedes and doesn't compete with the foreground transcript. The talk then explains what a shader is: after the GPU rasterizes vectors into pixels, a shader program runs on the GPU to decide each pixel's color, executing **per-pixel in parallel with no awareness of neighbors**."},{"t":429,"title":"Applying layer effect in SwiftUI","body":"Introduces the three shader effects: **colorEffect** (transforms each pixel's color, good for black-and-white), **distortionEffect** (changes the sampled position, good for geometric effects like shear), and **layerEffect** (the most flexible, providing the whole layer to sample neighbors or the entire region, good for blur). This use case picks **layerEffect**, applying `ShaderLibrary.backgroundWarp()` inside a `GeometryReader`."},{"t":441,"title":"Writing layer effect shader in Metal","body":"The Metal `backgroundWarp`, marked `[[stitchable]]`, first just does `layer.sample(position)` to return the same image — but it's a shader you can now build on."},{"t":459,"title":"Metal shader with offset parameter","body":"A **`float2 offset`** parameter is added, changing to `layer.sample(position + offset)` — telling SwiftUI \"I want this position's color to follow that position's color,\" so the sampled position can be shifted."},{"t":475,"title":"SwiftUI layer effect with offset parameter","body":"The SwiftUI side passes `.float2(.init(x: 0, y: 0))`. At zero offset the image is unchanged; increasing it makes every pixel sample with the same shift, uniformly translating the whole image."},{"t":484,"title":"SwiftUI layer effect with full-width offset","body":"The offset becomes `.float2(.init(x: proxy.size.width, y: 0))`, shifting by the full view width. But because the **offset is uniform**, you only get a fixed-pattern shift lacking organic variation — something that varies per pixel is needed."},{"t":517,"title":"SwiftUI layer effect with noise sampling","body":"The view size and a **NoiseTexture** (`.image`) are passed in — a pre-computed image of smooth random values used to produce organic, per-pixel variation."},{"t":535,"title":"Metal shader with noise sampling","body":"The Metal side receives the NoiseTexture as `texture2d`. It computes a **uv** (relative position) from position and size, makes a repeat-mode sampler to sample the noise; the **red and green channels** each hold a different noise pattern, forming a 2D offset that's scaled and added to position to sample the original — twisting the image slightly."},{"t":622,"title":"Metal shader with domain warping","body":"Going further, the noise is **sampled twice**: the first gives an initial offset `q`, then a second sample is taken at the uv shifted by `q`, yielding flowing organic blobs. This layered-noise technique is the well-known **domain warping**, and the sample app ships a preview to tweak parameters."},{"t":667,"title":"Driving animation with time","body":"Shaders are **stateless** — no memory of the previous frame, output depends only on parameters — so animation requires passing a value that changes over time. **`TimelineView`** is exactly the pipe needed, firing each frame with a timestamp on the `.animation` schedule."},{"t":676,"title":"SwiftUI layer effect with static visual","body":"The current shader effect, though cool, is still **frozen** because nothing time-varying drives it, underscoring the need to connect the time pipe to make it move."},{"t":697,"title":"SwiftUI layer effect with animated visual","body":"Using `TimelineView(.animation)`, `elapsed = timeline.date.timeIntervalSince(startDate)` is computed and passed into the shader as `.float(elapsed)`, added to the noise-sampling position so the pattern starts flowing — shader animation driven by time."},{"t":720,"title":"Time-synced transcript view","body":"Switching to the transcript: time must be added here too, so the currently playing line is highlighted and centered in the scroll view."},{"t":735,"title":"Basic transcript view","body":"The starting point is familiar SwiftUI: a `LazyVStack` inside a `ScrollView`, with `ForEach` placing a `Text` per transcript line, each its own view."},{"t":753,"title":"Time-synced transcript view","body":"A `PlaybackState` timestamp determines the current line (styled with `transcriptLineStyle(isCurrent:)` so it's clear and the rest fade), and **`onChange`** watches `currentLineIndex`, using **`ScrollViewReader`**'s `scrollTo(i, anchor: .center)` to keep the current line centered."},{"t":798,"title":"Floating timestamps with alignment guides","body":"Focusing on the small timestamp by the current line. Every line has a timestamp in its `.overlay`, but only the current one is visible so it doesn't interfere with layout — always there, waiting. Pinning this subview to the container's edge can't be done with `offset` (which needs both views' sizes), motivating alignment."},{"t":833,"title":"Overlay with center alignment","body":"Explains alignment: every view has an alignment point defined by both axes, which the layout system uses to position it. When a subview goes into an overlay, the default **center alignment** lines them up — like a pin punching through both views' alignment points to hold them together."},{"t":846,"title":"Overlay with bottom leading alignment","body":"Changing the overlay's alignment to **`.bottomLeading`** makes the pin go through each view's bottom-leading point and lock there. The layout system then asks the subview for its bottom-leading alignment point."},{"t":872,"title":"Overlay with alignment guide override","body":"The goal is the subview's **top edge touching the container's bottom edge**. The override **`alignmentGuide(.bottom) { $0[.top] }`** makes the subview return its top when asked for its bottom, so the pin punches through there. A purely semantic override achieves it with no manual offset; the API also supports custom alignments, with the closure giving `ViewDimensions` to compute points from actual size."},{"t":976,"title":"Creative pipelines","body":"Recap: take a design, break it into layers, find the right API per layer to turn raw data into views, and feed each stage's output into the next — that chaining is a **creative pipeline**. But these were this app's choices — swap in gyroscope input, a ripple shader, or a freeform canvas foreground and you get something entirely different. **The APIs are the same; what you feed in and how you connect them is yours.**"},{"t":1033,"title":"Next steps","body":"Viewers are encouraged to download the sample project and experiment — tweak the shader, change the noise, adjust the speed, try a different image — and to look for spots in their own app where a small visual effect makes a big difference. Connecting these pipes turns something simple into something advanced surprisingly fast."}],"code":[]},"related":[{"id":"269","title":"What’s new in SwiftUI","gloss":"SwiftUI 的新功能","gloss_en":"What's new in SwiftUI","category":"swiftui","categoryLabel":"SwiftUI"},{"id":"271","title":"Code-along: Build powerful drag and drop in SwiftUI","gloss":"程式碼共做：在 SwiftUI 打造強大的拖放功能","gloss_en":"Code-along: Build powerful drag and drop in SwiftUI","category":"swiftui","categoryLabel":"SwiftUI"},{"id":"272","title":"Use SwiftUI with AppKit and UIKit","gloss":"在 AppKit 與 UIKit 中使用 SwiftUI","gloss_en":"Use SwiftUI with AppKit and UIKit","category":"swiftui","categoryLabel":"SwiftUI"},{"id":"8002","title":"SwiftUI for Beginners Group Lab","gloss":"SwiftUI 新手團體實驗室","gloss_en":"SwiftUI for Beginners Group Lab","category":"swiftui","categoryLabel":"SwiftUI"},{"id":"8006","title":"SwiftUI Group Lab","gloss":"SwiftUI 小組實驗室","gloss_en":"SwiftUI Group Lab","category":"swiftui","categoryLabel":"SwiftUI"}]}</script>
