<script id="d" type="application/json">{"s":{"id":"315","title":"Rediscover the HTML select element","gloss":"重新認識 HTML select 元素","category":"other","categoryLabel":"其他","duration":570,"url":"https://developer.apple.com/videos/play/wwdc2026/315/","takeaway":"透過 appearance: base-select 與新的 CSS 偽元素，全面自訂網頁 select 選單的外觀與下拉內容。","chapters":[[0,"Introduction"],[71,"Basic markup"],[152,"Style the select button"],[157,"Native form control"],[170,"appearance: base-select"],[187,"Style the select button"],[188,"Picker icon"],[209,"Picker icon open state"],[227,"Customize the drop-down"],[248,"Picker select"],[261,"Picker select spacing"],[268,"Picker select border and shadow"],[276,"Custom option styles"],[282,"Picker option checkmark"],[300,"Go beyond text options"],[331,"Images in option"],[352,"Custom option highlight"],[380,"Grid layout in drop downs"],[403,"Select with image options"],[410,"The selectedcontent element"],[431,"Select menu"],[433,"Select menu button"],[449,"SelectedContent Element"],[466,"Fallback for unsupported browsers"],[529,"Next steps"]],"points":[{"text":"新的 **appearance: base-select** 解鎖對原生 select 表單控制項的完整樣式控制。","hot":true},{"text":"可用 **::picker(select)** 與 **:open** 狀態自訂下拉面板的邊框、陰影與圖示。","hot":false},{"text":"透過 **option::checkmark** 與 option:checked 自訂選項勾選標記與選取樣式。","hot":false},{"text":"選項可放入 **圖片** 並以 grid 版面排列，超越純文字選單。","hot":false},{"text":"用 **selectedcontent** 元素自訂按鈕顯示，並為不支援的瀏覽器準備 fallback。","hot":false}],"apis":["appearance: base-select","::picker(select)","::checkmark","selectedcontent"],"audience":"需要 **深度自訂網頁表單下拉選單** 樣式與互動的前端 Web 開發者。","gloss_en":"Rediscover the HTML select element","takeaway_en":"Use appearance: base-select and new CSS pseudo-elements to fully customize the appearance and dropdown content of web select menus.","points_en":[{"text":"The new **appearance: base-select** unlocks full styling control over the native select form control.","hot":true},{"text":"Use **::picker(select)** with the **:open** state to customize the dropdown panel's border, shadow, and icons.","hot":false},{"text":"Use **option::checkmark** and option:checked to customize the option checkmark and selected styling.","hot":false},{"text":"Options can contain **images** and be laid out with grid, going beyond plain-text menus.","hot":false},{"text":"Use the **selectedcontent** element to customize the button display, and prepare a fallback for browsers that don't support it.","hot":false}],"audience_en":"Front-end web developers who need to **deeply customize the styling and interaction of web form dropdowns**.","summary":["這場由 Safari 工程師主講，介紹 web 上 HTML `\u003cselect>` 元素的重大升級——**Customizable select**（可自訂下拉選單）。過去要做出超越預設樣式的下拉選單，得靠大量 JavaScript 函式庫或一堆 `\u003cdiv>`，無障礙也很棘手。現在從 **Safari 27 與 Chrome 135** 起，只用 HTML 與 CSS 就能完全自訂 `\u003cselect>`，同時保留語意化 HTML 的好處：鍵盤導覽、螢幕閱讀器支援與基本無障礙都是開箱即用。講者以替攝影師客戶打造作品集網站、做出排序與篩選選單為例貫穿全場。","啟用的關鍵是新的 **`appearance: base-select`**：套在 `\u003cselect>` 上即從原生控制項（在 Apple 平台稱 pull-down button）切換成可大量自訂的較小樣式集，並開始繼承 body 的 font-family。接著可自訂按鈕本身的 background、border、padding；用新的 **`::picker-icon`** 偽元素改箭頭（設 content 與 width），並用 **`:open`** 偽類在下拉開啟時改變顏色。要自訂下拉選單則用 **`::picker(select)`** 選取選單、同樣設 `appearance: base-select` 以脫離原生選單，再調整 padding、margin、border、box-shadow；用 `:checked` 強調已選 option，並用 **`::checkmark`** 偽元素自訂預設打勾（一樣設 content 與 width）。","Customizable select 最強之處是能**超越純文字選項**——option 內可放任何內容：images、videos、emojis、SVG。講者在每個 option 放 SVG 加 label 做出分類瀏覽（圖片 alt 留空以免螢幕閱讀器重複念出標籤），用 `:checked` 凸顯選中項。當符號讓下拉太長時，改用 **grid layout**（`grid-template` 定義行列、`gap` 定義間距）排成整齊網格——這正是重用其他 CSS 能力的好處。","若想讓選中 option 的豐富內容（如 SVG）也出現在按鈕中，需要兩個工具：把一個 `\u003cbutton>` 放進 `\u003cselect>` 作為第一個子元素來**取代內建按鈕**（過去 HTML 不允許），以及用新的 **`\u003cselectedcontent>`** 元素在按鈕內顯示選中 option 的豐富內容。最後強調**漸進增強（progressive enhancement）**：不支援此功能的瀏覽器會回退到原生彈出選單，因為重用了語意化 `\u003cselect>`，內建無障礙特性依然保留。講者也提到用 Safari 的 **Grid Lanes** 排版圖片，並建議用 Safari Technology Preview 或 Beta 試用、務必在不支援的瀏覽器與輔助工具上測試。"],"deepdive":[{"t":0,"title":"Introduction","body":"Safari 工程師 Tim 開場，點出 web 開發者長年在下拉選單上的掙扎：超越預設 `\u003cselect>` 得靠重量級 JavaScript 或一堆 `\u003cdiv>`，無障礙也難處理。介紹 **Customizable select**——從 **Safari 27 與 Chrome 135** 起只用 HTML 與 CSS 就能完全自訂，並以替攝影師客戶打造作品集網站、加入排序篩選為示範。"},{"t":71,"title":"Basic markup","body":"回顧 `\u003cselect>` 加 label 的 HTML 標記。強調原生 `\u003cselect>` 開箱即具基本無障礙：可用鍵盤導覽 option、與螢幕閱讀器良好搭配，無需外部函式庫，並用它建立頁面的 Sort by 按鈕。"},{"t":152,"title":"Style the select button","body":"說明可點擊以顯示選單的部分即「按鈕」，將從這最基本的部分開始自訂樣式。"},{"t":157,"title":"Native form control","body":"展示原生控制項（在 Apple 平台稱 pull-down button）——它匹配平台上其他控制項給使用者熟悉感，但放到攝影網站上會顯得格格不入，引出 Customizable select 的需求。"},{"t":170,"title":"appearance: base-select","body":"自訂第一步是套用 **`appearance: base-select`**，從原生控制項切換成較小、可自訂的樣式集。因先前在 body 設了 Gill Sans，按鈕現在會繼承 body 字型，與旁邊的 label 一致。"},{"t":187,"title":"Style the select button","body":"進一步調整按鈕的 background、border 與 padding，讓它更貼合網站設計。"},{"t":188,"title":"Picker icon","body":"用新的 **`::picker-icon`** 選擇器改箭頭：設 content 屬性換成新字符、設 width 調整大小。"},{"t":209,"title":"Picker icon open state","body":"用 **`:open`** 偽類在下拉選單開啟時為按鈕設不同顏色，並把箭頭更新成符合開啟狀態的文字色。"},{"t":227,"title":"Customize the drop-down","body":"介紹下拉選單本身的可樣式化部件：用 **`::picker(select)`** 樣式化選單、用 option 上的 **`::checkmark`** 樣式化打勾。"},{"t":248,"title":"Picker select","body":"用 **`::picker(select)`** 並設 `appearance: base-select` 來脫離原生選單、取得乾淨起點，準備自訂下拉。"},{"t":261,"title":"Picker select spacing","body":"用 padding 與 margin 安排下拉選單的間距。"},{"t":268,"title":"Picker select border and shadow","body":"處理下拉選單的 border 與 box-shadow。"},{"t":276,"title":"Custom option styles","body":"強調已選 option 讓使用者清楚自己選了什麼：在 `:checked` 的 option 設粗體字、把其他 option 變灰。"},{"t":282,"title":"Picker option checkmark","body":"用 **`::checkmark`** 選擇器設 content 與 width 改變預設打勾，做法與 `::picker-icon` 類似。"},{"t":300,"title":"Go beyond text options","body":"介紹 Customizable select 能超越純文字選項，option 內可放 images、videos、emojis 等任何內容，並以加入熱門攝影分類瀏覽的功能為例。"},{"t":331,"title":"Images in option","body":"在每個 option 放 SVG 與 label 讓使用者更易探索分類；圖片 alt 留空，避免螢幕閱讀器重複念出標籤（如 Flowers）。"},{"t":352,"title":"Custom option highlight","body":"因移除了打勾，用 `:checked` 選擇器改變顏色，更醒目地凸顯選中的 option。"},{"t":380,"title":"Grid layout in drop downs","body":"符號讓下拉太長、版面不合視窗時，改用 **grid layout**：`grid-template` 定義行列數、`gap` 定義格間距，把下拉排成整齊網格，這也展現重用其他 CSS 能力的好處。"},{"t":403,"title":"Select with image options","body":"整合前述樣式做出含圖片選項的 select，呈現分類瀏覽的完整效果。"},{"t":410,"title":"The selectedcontent element","body":"想讓選中 option 的 SVG 也出現在按鈕中——但內建按鈕只顯示文字，引出 **`\u003cselectedcontent>`** 元素來顯示選中 option 的豐富內容。"},{"t":431,"title":"Select menu","body":"說明 select 自帶一個供點擊以開啟下拉的按鈕，作為自訂按鈕內容的鋪陳。"},{"t":433,"title":"Select menu button","body":"把一個 `\u003cbutton>` 放進 `\u003cselect>` 作為第一個子元素來**取代內建按鈕**（過去 HTML 不允許），即可在按鈕內放自訂內容，如 label 或 `\u003cselectedcontent>`。"},{"t":449,"title":"SelectedContent Element","body":"**`\u003cselectedcontent>`** 的特別之處是它會顯示選中 option 的豐富內容，例如 Everything 標籤旁的 SVG，讓按鈕反映選取結果。"},{"t":466,"title":"Fallback for unsupported browsers","body":"強調**漸進增強**：不支援的瀏覽器仍可用，使用者拿到原生彈出選單。這正是重用 `\u003cselect>` 的好處——因為是語意化元素，內建無障礙特性依然保留。"},{"t":529,"title":"Next steps","body":"總結 select 元素與網站融為一體、並提到加了用 Customizable select 做的徑向色彩選擇器、用 Safari 的 **Grid Lanes** 排版圖片。功能將隨 Safari 27 推出，可用 Safari Technology Preview 或 Beta 試用,並務必在不支援的瀏覽器與輔助工具上測試,參考 webkit.org 的最佳實務。"}],"summary_en":["Presented by a Safari engineer, this session covers a major upgrade to the HTML `\u003cselect>` element on the web: **Customizable select**. Previously, going beyond the default required heavy JavaScript libraries or piles of `\u003cdiv>`s, and accessibility was tricky. Now, starting in **Safari 27 and Chrome 135**, you can fully customize `\u003cselect>` using just HTML and CSS while keeping the benefits of semantic HTML—keyboard navigation, screen reader support, and basic accessibility are there out of the box. The presenter runs through building sort and filter menus for a photographer client's portfolio site.","The key is the new **`appearance: base-select`**: applied to `\u003cselect>`, it switches from the native control (called a pull-down button on Apple platforms) to a smaller, customizable set of styles and inherits the body font-family. You can then style the button's background, border, and padding; change the arrow with the new **`::picker-icon`** pseudo-element (setting content and width); and use the **`:open`** pseudo-class to change colors when the drop-down is open. To customize the drop-down, use **`::picker(select)`** with `appearance: base-select` to opt out of the native menu, then adjust padding, margin, border, and box-shadow; emphasize the selected option with `:checked` and customize the default checkmark with the **`::checkmark`** pseudo-element (also content and width).","The most powerful aspect is going **beyond text-only options**—an option can hold any content: images, videos, emojis, SVG. The presenter places an SVG and label in each option for category browsing (leaving image alt empty so screen readers don't read the label twice) and highlights the selection with `:checked`. When symbols make the drop-down too long, a **grid layout** (`grid-template` for rows/columns, `gap` for spacing) arranges it neatly—exactly the benefit of reusing other CSS features.","To get the selected option's rich content (like its SVG) into the button, two tools are needed: place a `\u003cbutton>` as the first child of `\u003cselect>` to **replace the built-in button** (previously disallowed in HTML), and use the new **`\u003cselectedcontent>`** element to show the selected option's rich content inside the button. Finally, it stresses **progressive enhancement**: unsupported browsers fall back to the native pop-up, and because the semantic `\u003cselect>` is reused, built-in accessibility features remain. The presenter also mentions using Safari's **Grid Lanes** to lay out images, and recommends trying it in Safari Technology Preview or Beta and testing in unsupported browsers and with assistive tools."],"deepdive_en":[{"t":0,"title":"Introduction","body":"Safari engineer Tim opens, noting web developers' long struggle with drop-downs: going beyond the default `\u003cselect>` meant heavy JavaScript or many `\u003cdiv>`s, with tricky accessibility. Introduces **Customizable select**—fully customizable with just HTML and CSS starting in **Safari 27 and Chrome 135**—demoed by building sort and filter controls for a photographer client's portfolio site."},{"t":71,"title":"Basic markup","body":"Reviews the `\u003cselect>` markup with its label, stressing that the native `\u003cselect>` has basic accessibility out of the box: keyboard navigation of options and good screen reader support with no external libraries, used to build the page's Sort by button."},{"t":152,"title":"Style the select button","body":"Identifies the clickable part that shows the menu as the 'button', the most basic part to start styling."},{"t":157,"title":"Native form control","body":"Shows the native control (a pull-down button on Apple platforms)—it matches other platform controls for familiarity but feels out of place on the photo site, motivating Customizable select."},{"t":170,"title":"appearance: base-select","body":"The first customization step is applying **`appearance: base-select`**, switching from the native control to a smaller, customizable style set. Since Gill Sans was set on the body, the button now inherits the body font, matching the adjacent label."},{"t":187,"title":"Style the select button","body":"Adjusts the button's background, border, and padding to better match the site's design."},{"t":188,"title":"Picker icon","body":"Uses the new **`::picker-icon`** selector to change the arrow: set the content property to a new glyph and a width to size it."},{"t":209,"title":"Picker icon open state","body":"Uses the **`:open`** pseudo-class to set different button colors when the drop-down is open, updating the arrow to match the open state's text color."},{"t":227,"title":"Customize the drop-down","body":"Introduces the drop-down's styleable parts: **`::picker(select)`** for the menu and **`::checkmark`** on the option for the check."},{"t":248,"title":"Picker select","body":"Uses **`::picker(select)`** with `appearance: base-select` to opt out of the native menu for a clean slate before customizing the drop-down."},{"t":261,"title":"Picker select spacing","body":"Arranges the drop-down's spacing with padding and margin."},{"t":268,"title":"Picker select border and shadow","body":"Handles the drop-down's borders and box-shadow."},{"t":276,"title":"Custom option styles","body":"Emphasizes the selected option so the choice is clear: set bold font on the `:checked` option and gray out the others."},{"t":282,"title":"Picker option checkmark","body":"Uses the **`::checkmark`** selector with content and width to change the default checkmark, similar to `::picker-icon`."},{"t":300,"title":"Go beyond text options","body":"Introduces going beyond text-only options—an option can hold any content like images, videos, and emojis—exemplified by adding browsing of popular photography categories."},{"t":331,"title":"Images in option","body":"Places an SVG and label in each option so customers can explore categories; image alt is left empty to avoid screen readers announcing the label (e.g., Flowers) twice."},{"t":352,"title":"Custom option highlight","body":"Since the checkmark was removed, uses the `:checked` selector to change colors and highlight the selected option more prominently."},{"t":380,"title":"Grid layout in drop downs","body":"When symbols make the drop-down too long for the window, a **grid layout** (`grid-template` for rows/columns, `gap` for spacing) arranges it into a neat grid, showing the benefit of reusing other CSS features."},{"t":403,"title":"Select with image options","body":"Combines the prior styling into a select with image options, showing the complete category-browsing result."},{"t":410,"title":"The selectedcontent element","body":"Wants the selected option's SVG in the button too—but the built-in button shows only text—introducing the **`\u003cselectedcontent>`** element to display the selected option's rich content."},{"t":431,"title":"Select menu","body":"Notes that select comes with a button people click to open the drop-down, setting up custom button content."},{"t":433,"title":"Select menu button","body":"Places a `\u003cbutton>` as the first child of `\u003cselect>` to **replace the built-in button** (previously disallowed in HTML), letting you put custom content inside, like labels or `\u003cselectedcontent>`."},{"t":449,"title":"SelectedContent Element","body":"What's special about **`\u003cselectedcontent>`** is that it shows the selected option's rich content—like the SVG next to the Everything label—so the button reflects the selection."},{"t":466,"title":"Fallback for unsupported browsers","body":"Stresses **progressive enhancement**: unsupported browsers stay usable, giving customers the native pop-up. That's a benefit of reusing `\u003cselect>`—being a semantic element, built-in accessibility features remain."},{"t":529,"title":"Next steps","body":"Wraps up with the select elements blending into the site, plus a radial color picker built with Customizable select and images laid out with Safari's **Grid Lanes**. The features arrive in Safari 27; try them in Safari Technology Preview or Beta, test in unsupported browsers and with assistive tools, and see webkit.org for best practices."}],"code":["\u003clabel for=\"sort-select\">Sort by\u003c/label>\n\u003cselect id=\"sort-select\">\n    \u003coption>Newest\u003c/option>\n    \u003coption>Oldest\u003c/option>\n\u003c/select>","body {\n    font-family: Gill Sans, sans-serif;\n}\n\nselect {\n    appearance: base-select;\n}","select {\n    appearance: base-select;\n    background-color: var(--green-10);\n    border: none;\n    padding: 0.6em 1em;\n}","select:open {\n    background-color: var(--green-100);\n    color: white;\n}","select:open {\n    background-color: var(--green-100);\n    color: white;\n}\n\nselect:open::picker-icon {\n    content: url(icons/arrow-white.svg);\n}","::picker(select) {\n\n}","::picker(select) {\n    appearance: base-select;\n    padding: 4px;\n    margin-top: 0.5em;\n}","::picker(select) {\n    appearance: base-select;\n    padding: 4px;\n    margin-top: 0.5em;\n    border: 1px solid rgba(0,0,0,0.2);\n    border-radius: 9px;\n    box-shadow: 0 4px 20px rgba(0,0,0,0.2);\n}","option:checked {\n    font-weight: 600;\n}\n\noption:not(:checked) {\n    color: #777;\n}","option::checkmark {\n    content: url(checkmark.svg);\n    width: 0.65em;\n}","\u003coption value=\"flower\">\n    \u003cimg src=\"flowers.svg\" alt=\"\">\n    \u003cspan class=\"text\">Flowers\u003c/span>\n\u003c/option>","option::checkmark {\n    display: none;\n}\n\noption:checked {\n    background: #00857e;\n    color: white;\n}"]},"related":[{"id":"101","title":"Keynote","gloss":"主題演講","gloss_en":"Keynote","category":"other","categoryLabel":"其他"},{"id":"102","title":"Platforms State of the Union","gloss":"平台現況報告","gloss_en":"Platforms State of the Union","category":"other","categoryLabel":"其他"},{"id":"111","title":"Keynote (ASL)","gloss":"主題演講(美國手語版)","gloss_en":"Keynote (American Sign Language)","category":"other","categoryLabel":"其他"},{"id":"112","title":"Platforms State of the Union (ASL)","gloss":"平台現況報告（美國手語版）","gloss_en":"Platforms State of the Union (American Sign Language)","category":"other","categoryLabel":"其他"},{"id":"122","title":"WWDC26 Platforms State of the Union Recap","gloss":"WWDC26 平台現況演講重點回顧","gloss_en":"WWDC26 Platforms State of the Union recap","category":"other","categoryLabel":"其他"}]}</script>
