<script id="d" type="application/json">{"s":{"id":"359","title":"Build real-time neural rendering pipelines with Metal","gloss":"用 Metal 打造即時神經渲染管線","category":"graphics","categoryLabel":"圖形與遊戲","duration":1336,"url":"https://developer.apple.com/videos/play/wwdc2026/359/","takeaway":"用 Metal 4 將機器學習整合進即時渲染管線，透過 MetalFX 降噪、相機運動向量與內嵌神經網路（tensorOps）提升畫質與效能。","chapters":[[0,"Introduction"],[136,"MetalFX Denoising"],[526,"Compute camera-only motion vectors"],[597,"Deploy custom ML networks with Metal 4"],[820,"Inline neural networks with tensorOps"],[1255,"Next steps"]],"points":[{"text":"用 **Metal 4** 把機器學習整合進**即時渲染管線**，提供實務導入建議。","hot":false},{"text":"採用 **MetalFX Denoising** 降噪，提升渲染畫面品質。","hot":true},{"text":"在 shader 中計算**僅相機（camera-only）運動向量**，並扣除前後幀的 jitter 子像素偏移。","hot":false},{"text":"以 Metal 4 **部署自訂 ML 網路**，整合進渲染流程。","hot":false},{"text":"透過 **tensorOps** 把神經網路**內嵌（inline）**到 shader 中執行。","hot":false}],"apis":["Metal","MetalFX","tensorOps"],"audience":"**開發高效能遊戲與即時 3D 渲染的 Metal 開發者**，想把 ML 導入渲染管線的人。","gloss_en":"Build real-time neural rendering pipelines with Metal","takeaway_en":"Integrate machine learning into a real-time rendering pipeline with Metal 4, improving quality and performance through MetalFX denoising, camera motion vectors, and inline neural networks (tensorOps).","points_en":[{"text":"Integrate machine learning into a **real-time rendering pipeline** with **Metal 4**, with practical adoption recommendations.","hot":false},{"text":"Use **MetalFX Denoising** to reduce noise and improve rendered frame quality.","hot":true},{"text":"Compute **camera-only motion vectors** in the shader, subtracting the sub-pixel jitter offset between consecutive frames.","hot":false},{"text":"**Deploy custom ML networks** with Metal 4 and integrate them into the rendering flow.","hot":false},{"text":"Run neural networks **inline** within shaders via **tensorOps**.","hot":false}],"audience_en":"**Metal developers building high-performance games and real-time 3D rendering** who want to bring ML into their rendering pipeline.","summary":["這場由 Apple GPU 軟體工程師 Yulia 主講，主題是如何用 **Metal 4** 把機器學習帶進即時算繪管線。核心訊息是：許多過去靠解析法（analytical methods）實作的算繪技術——降噪、neural textures、學習式 tone mapping 等——如今都能改用 ML 來提升畫質、效能或記憶體佔用。Apple 平台提供一整套由淺入深的工具：最高層是 **MetalFX** 開箱即用的神經降噪與升頻；中間是 **Metal 4 ML command encoder**，能在 command buffer 裡直接跑預訓練模型；最底層是 **TensorOps API**，讓你在 shader 內手刻小型網路，充分發揮 M5 與 A19 Pro 上的 neural accelerator。","第一層以 Maxon 的 **Redshift Live**（Cinema 4D 中的即時 path tracer viewport）為例示範 **MetalFX Denoising**。在互動式 viewport 裡每像素往往只能取一個 sample，畫面天生有雜訊，MetalFX 把它升頻並降噪成接近最終品質的影像。講者整理出 Maxon 採用的三條最佳實務：一是**保持輔助輸入乾淨**，其中 diffuse albedo 是最強的降噪訊號，並善用 transparency overlay 與 denoiser strength mask 處理天空、煙霧等無須降噪的區域；二是**儲存觀者實際看到的內容**，鏡面要存反射面的材質屬性，玻璃則用 Fresnel 項混合反射與折射的 albedo（primary surface replacement）；三是**算對 motion vectors**，MetalFX 需要去除 jitter 的 dejittered motion vectors，否則邊緣會閃爍。","第二層談如何**部署自己離線訓練的模型**。講者以 tone mapping 為例：傳統後處理管線由多個階段串接、可任意複雜，而最佳結果來自理解影像內容，正適合用神經網路學習。以 **HDRNet**（Gharbi 等人 2017）為例，網路在降採樣影像上做全域與局部分析，為 16x16 的 tile 產生色彩轉換並以 edge-aware 方式套用。流程是先在 PyTorch 等框架訓練，匯出成 **MTLPackage**，再透過 ML command encoder 在同一個 command buffer 裡執行——path tracer、MetalFX 降噪與 neural tone mapper 全在同一幀完成，一次神經評估取代整條多階段後處理鏈。","第三層是用 **TensorOps API** 在 shader 內手刻 tiny network。這類網路只有數千個參數以下、針對單一場景訓練、甚至每幾幀就**線上訓練（online training）**一次，因此不需泛化。講者以 image-based lighting 的 skybox probe 為例：在動態日夜循環下，離線預算的照明會失準，於是改用一個 3-4-4-3 的 **MLP**（fully connected multilayer perceptron），每幀做一到多次訓練迭代（取樣方向、推論、算解析解誤差、反向傳播）來持續修正。實作上把 input 批次成 2D 矩陣，逐層用 **matmul** 2D tensor operation 加上 activation function 前向傳播；在 compute stage 用 **SIMD group execution scope** 搭配 **cooperative tensors**，讓中間結果留在快速的 thread storage、避免往返主記憶體。總結是三個層級各給你不同的控制權，挑最適合你 app 的那一層採用即可。"],"deepdive":[{"t":0,"title":"Introduction","body":"由 GPU 軟體工程師 Yulia 開場，點出機器學習正從研究走向即時算繪的量產應用：**neural denoising**、neural textures、學習式 tone mapping 等過去靠解析法的技術都能改用 ML 來改善畫質、效能或記憶體。並預告 Apple 平台的三層工具：最高層的 **MetalFX**、中層的 **Metal 4 ML command encoder**，與最底層在 shader 內運作的 **TensorOps API**，三者由淺入深、控制權遞增。"},{"t":136,"title":"MetalFX Denoising","body":"說明 path tracer 在互動式 viewport 中每像素只能取一個 sample、畫面天生有雜訊，**MetalFX Denoising** 是結合神經升頻與降噪、為 Apple silicon 最佳化的方案。需餵入 diffuse albedo、depth 等輔助輸入。以 Maxon 的 **Redshift Live** 為例：開啟降噪後畫面從 1spp 的雜訊轉為穩定、接近最終品質的即時影像，可即時看到光影、陰影與 global illumination 的變化。並帶出三條最佳實務作為後續主軸。"},{"t":526,"title":"Compute camera-only motion vectors","body":"聚焦第三條最佳實務：正確的 **motion vectors** 是時間穩定性的關鍵，它回答「此像素上一幀在哪」。MetalFX 需要去除 jitter 的 **dejittered motion vectors**，否則可能誤差達一像素造成邊緣閃爍。程式碼示範靜態物體的 camera-only 算法：用當前與前一幀的 view-projection 矩陣各投影一次取差，再減去兩幀的 jitter delta。會動或變形的物體須存前一幀世界座標或 skin 兩次,快速運動的粒子則改用 reactive mask。"},{"t":597,"title":"Deploy custom ML networks with Metal 4","body":"進入第二層：用 **Metal 4 ML command encoder** 部署自己離線訓練的模型，以 **tone mapping** 為例。傳統後處理管線多階段串接、可任意複雜，而理解影像內容正是神經網路所長。介紹 **HDRNet** 架構（在降採樣影像上做全域＋局部分析、為 16x16 tile 產生 edge-aware 的色彩轉換），流程為 PyTorch 訓練、匯出 **MTLPackage**、用 function descriptor 與 ML pipeline descriptor 設定後 dispatch，讓一次神經評估取代整條後處理鏈，且與 compute、render 同在一個 command buffer 執行。"},{"t":820,"title":"Inline neural networks with tensorOps","body":"第三層用 **TensorOps API** 在 shader 內 inline 跑 tiny network（數千參數以下、針對單一場景、可**線上訓練**）。以 skybox 的 image-based lighting probe 為例，動態日夜循環會讓離線預算的照明失準，故用 3-4-4-3 的 **MLP** 每幀做訓練迭代（取樣方向、推論、算解析解誤差、反向傳播）。實作把 input 批次成 2D 矩陣，逐層 **matmul** 加 activation 前向傳播；在 compute stage 用 **SIMD group execution scope** 與 **cooperative tensors** 把中間結果留在快速 thread storage，避免往返主記憶體。"},{"t":1255,"title":"Next steps","body":"總結三個層級：**MetalFX** 提供平台整合的神經降噪（三條最佳實務：輸入乾淨、存觀者所見、算對 motion vectors）；**MTLPackage** 讓你部署離線訓練模型、以一次評估取代整條後處理；**TensorOps API** 讓你在 shader 內建構跑在 neural accelerator 上的 tiny network。建議：pro-app 與遊戲的即時 viewport 先採用 MetalFX，再嘗試 neural tone mapper，並用 tensor API 實驗小型專用網路。"}],"summary_en":["Presented by Apple GPU software engineer Yulia, this session shows how to bring machine learning into your real-time rendering pipeline with **Metal 4**. The core message is that many techniques that traditionally relied on analytical methods—denoising, neural textures, learned tone mapping and more—can now be implemented with ML to improve quality, performance, or memory footprint. Apple platforms offer a complete, layered toolset: at the top, **MetalFX** provides ready-to-use neural denoising and upscaling; in the middle, the **Metal 4 ML command encoder** runs pre-trained models directly in your command buffer; and at the most flexible level, the **TensorOps API** lets you hand-build tiny networks inside your shaders, fully leveraging the neural accelerator in M5 and A19 Pro Apple silicon GPUs.","The first layer demonstrates **MetalFX Denoising** using Maxon's **Redshift Live**, a real-time path-tracing viewport in Cinema 4D. With only one sample per pixel to stay interactive, frames are naturally noisy; MetalFX upscales and denoises them into near-final quality in real time. Yulia distills three best practices Maxon followed: first, keep your auxiliary inputs clean—diffuse albedo is the strongest denoising signal—and use the transparency overlay and denoiser strength mask for noise-free regions like sky, fog, and volumetrics; second, store what the viewer actually sees—mirrors store the reflected surface's material properties, while glass blends reflected and refracted albedo by the Fresnel term (primary surface replacement); third, get your motion vectors right—MetalFX expects dejittered motion vectors, or edges will shimmer.","The second layer covers deploying your own offline-trained models, using tone mapping as the example. A traditional post-processing chain concatenates many parameterized stages and can grow arbitrarily complex, yet the best results come from understanding image content—exactly what a neural network can learn. Using **HDRNet** (Gharbi et al., 2017) as an example, the network analyzes a downsampled image both globally and locally, producing edge-aware color transforms for 16x16 tiles. The workflow is to train in a framework like PyTorch, export to an **MTLPackage**, then run it via the ML command encoder in the same command buffer—path tracer, MetalFX denoising, and the neural tone mapper all in one frame, replacing the entire multi-stage chain with a single neural evaluation.","The third layer uses the **TensorOps API** to hand-build tiny networks inside shaders. These have a few thousand parameters or fewer, are trained on one specific scene, and can even be trained **online** every few frames, so they never need to generalize. Yulia's example is a skybox probe for image-based lighting: under a dynamic day-night cycle an offline-precomputed signal goes out of sync, so a 3-4-4-3 **MLP** (fully connected multilayer perceptron) runs one or more training iterations per frame—sample a direction, run inference, compute the error against the analytical solution, then back-propagate. Inputs are batched into a 2D matrix and evaluated layer by layer with **matmul** 2D tensor operations plus an activation function; in a compute stage, **SIMD group execution scope** with **cooperative tensors** keeps intermediate results in fast thread storage, avoiding a round trip to main memory. The takeaway: each layer grants more control—pick the one that's right for your app."],"deepdive_en":[{"t":0,"title":"Introduction","body":"GPU software engineer Yulia opens by noting that ML is moving from research into production for real-time rendering: **neural denoising**, neural textures, and learned tone mapping that once relied on analytical methods can now be done with ML to improve quality, performance, or memory. She previews Apple's three-layer toolset—the top-level **MetalFX**, the mid-level **Metal 4 ML command encoder**, and the lowest-level **TensorOps API** that runs inside shaders—ordered from easiest to most flexible, with increasing control at each step."},{"t":136,"title":"MetalFX Denoising","body":"Explains that a path tracer in an interactive viewport can afford only one sample per pixel, so frames are inherently noisy; **MetalFX Denoising** is a combined neural upscaler and denoiser optimized for Apple silicon, fed auxiliary inputs like diffuse albedo and depth. Using Maxon's **Redshift Live** as the example, enabling the denoiser turns a noisy 1spp image into a stable, near-final real-time result, letting artists see ray-traced lighting, shadows, and global illumination update live. This sets up the three best practices that follow."},{"t":526,"title":"Compute camera-only motion vectors","body":"Focuses on the third best practice: correct **motion vectors** are essential for temporal stability—each answers 'where was this pixel last frame?' MetalFX expects **dejittered motion vectors**, otherwise they can be up to a pixel off and cause edge shimmering. The code computes camera-only motion for static objects: project the vertex through the current and previous view-projection matrices and take the difference, then subtract the per-frame jitter deltas. Moving or deforming geometry must store previous-frame world positions or skin twice, while fast alpha-blended particles use the reactive mask instead."},{"t":597,"title":"Deploy custom ML networks with Metal 4","body":"Enters the second layer: deploying your own offline-trained models via the **Metal 4 ML command encoder**, with tone mapping as the example. A traditional post-processing chain concatenates many parameterized stages and can grow arbitrarily complex, but understanding image content is exactly what a network learns. It introduces **HDRNet** (global plus local analysis on a downsampled image, producing edge-aware color transforms per 16x16 tile), with a workflow of training in PyTorch, exporting an **MTLPackage**, configuring it with a function descriptor and ML pipeline descriptor, then dispatching—so one neural evaluation replaces the entire chain, running alongside compute and render in the same command buffer."},{"t":820,"title":"Inline neural networks with tensorOps","body":"The third layer uses the **TensorOps API** to run a tiny network inline inside a shader (a few thousand parameters or fewer, trained per-scene, even **online**). The example is a skybox probe for image-based lighting; a dynamic day-night cycle makes an offline-precomputed signal go stale, so a 3-4-4-3 **MLP** runs training iterations each frame (sample a direction, infer, compute the error against the analytical solution, back-propagate). Implementation batches inputs into a 2D matrix and evaluates layer by layer with **matmul** plus activation; in a compute stage, **SIMD group execution scope** with **cooperative tensors** keeps intermediate results in fast thread storage, avoiding a round trip to main memory."},{"t":1255,"title":"Next steps","body":"Recaps the three levels: **MetalFX** offers platform-integrated neural denoising (three best practices: keep inputs clean, store what the viewer sees, get motion vectors right); the **MTLPackage** lets you deploy offline-trained models and replace an entire post-processing chain with one evaluation; and the **TensorOps API** lets you build tiny networks in shaders running on the neural accelerator. The advice: adopt MetalFX first for real-time viewports in pro apps and games, then try a neural tone mapper, and experiment with small specialized networks using the tensor API."}],"code":[]},"related":[{"id":"330","title":"Optimize custom machine learning operations with Metal tensors","gloss":"用 Metal tensors 最佳化自訂機器學習運算","gloss_en":"Optimize custom machine learning operations with Metal tensors","category":"graphics","categoryLabel":"圖形與遊戲"},{"id":"356","title":"Bringing Cyberpunk 2077 to Mac","gloss":"將《電馭叛客 2077》帶上 Mac","gloss_en":"Bringing Cyberpunk 2077 to Mac","category":"graphics","categoryLabel":"圖形與遊戲"},{"id":"357","title":"Speedrun your game port with agentic coding","gloss":"用代理式編碼加速遊戲移植","gloss_en":"Speedrun your game port with agentic coding","category":"graphics","categoryLabel":"圖形與遊戲"},{"id":"388","title":"Find and fix performance issues in your Metal games","gloss":"找出並修復 Metal 遊戲的效能問題","gloss_en":"Find and fix performance issues in your Metal games","category":"graphics","categoryLabel":"圖形與遊戲"},{"id":"322","title":"Compose advanced graphics effects with SwiftUI","gloss":"用 SwiftUI 組合進階圖形效果","gloss_en":"Compose advanced graphics effects with SwiftUI","category":"swiftui","categoryLabel":"SwiftUI"}]}</script>
