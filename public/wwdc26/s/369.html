<script id="d" type="application/json">{"s":{"id":"369","title":"Find your accessory with Bluetooth Channel Sounding","gloss":"用藍牙通道測距找到你的配件","category":"other","categoryLabel":"其他","duration":492,"url":"https://developer.apple.com/videos/play/wwdc2026/369/","takeaway":"用 Bluetooth Channel Sounding 透過 Core Bluetooth 或 Nearby Interaction，為藍牙配件帶來距離與方向感知。","chapters":[[0,"Introduction"],[50,"Overview"],[197,"Core Bluetooth API"],[223,"Start a Core Bluetooth Channel Sounding session"],[249,"Receive distance results and cancel a session"],[274,"Nearby Interaction API"],[281,"Start a Nearby Interaction Channel Sounding session"],[319,"Run a Nearby Interaction Channel Sounding session"],[425,"Hardware tips"]],"points":[{"text":"**Channel Sounding** 為藍牙配件帶來**距離與方向**感知，可用於尋找配件等情境。","hot":true},{"text":"在 **Core Bluetooth** 中先以 **supportsFeatures(.channelSounding)** 檢查支援，再用 **CBChannelSoundingSessionConfiguration** 啟動測距 session。","hot":false},{"text":"透過 delegate 接收 **CBChannelSoundingProcedureResults** 取得 **distance**，並可隨時取消 session。","hot":false},{"text":"用 **Nearby Interaction** 的 **NINearbyAccessoryConfiguration** 並啟用**相機輔助（camera assistance）**，可額外取得方向（水平角）。","hot":false}],"apis":["CoreBluetooth","NearbyInteraction","CBCentralManager","CBChannelSoundingSessionConfiguration","CBChannelSoundingProcedureResults","NISession","NINearbyAccessoryConfiguration"],"audience":"開發**藍牙配件或尋物類 App、需要距離與方向定位**的硬體與 iOS 開發者。","gloss_en":"Find your accessory with Bluetooth Channel Sounding","takeaway_en":"Use Bluetooth Channel Sounding through Core Bluetooth or Nearby Interaction to bring distance and direction awareness to Bluetooth accessories.","points_en":[{"text":"**Channel Sounding** brings **distance and direction** awareness to Bluetooth accessories, useful for scenarios like finding an accessory.","hot":true},{"text":"In **Core Bluetooth**, first check support with **supportsFeatures(.channelSounding)**, then start a ranging session with **CBChannelSoundingSessionConfiguration**.","hot":false},{"text":"Receive **CBChannelSoundingProcedureResults** through the delegate to get **distance**, and cancel the session at any time.","hot":false},{"text":"Use **Nearby Interaction**'s **NINearbyAccessoryConfiguration** with **camera assistance** enabled to additionally obtain direction (azimuth).","hot":false}],"audience_en":"Hardware and iOS developers building **Bluetooth accessories or item-finder apps that need distance and direction positioning**.","summary":["這場由 Core Bluetooth 團隊的 Gretchen 主講，介紹如何用 **Bluetooth Channel Sounding** 為你的 Bluetooth 配件加上距離與方向感知。講者以辦派對為例：屋內烤箱與後院煙燻爐各放一支 Bluetooth 溫度探針，當某支達到設定溫度時，app 能告訴你它「在你右邊 8 公尺」，讓你不會搞混兩支探針。相較於過去用 **RSSI** 粗估距離，Channel Sounding 是真正「測量」距離。","原理上，已配對連線的 iPhone 為 **initiator**、配件為 **reflector**：iPhone 送出 tone，配件把它反射回來，iPhone 量測訊號往返過程中的變化，並在 2.4GHz 頻段的各個 channel 重複此過程，依據反射 tone 在 channel 間的變化率估算距離，這個量測過程稱為一次 **procedure**。實作上有兩條路：若只需距離，用 **Core Bluetooth**——先以 `CBCentralManager.supportsFeatures` 確認本機支援，對已連線的 `CBPeripheral` 呼叫 `startChannelSoundingSession`，iOS 會反覆執行 procedure 並透過 `didReceive results` delegate 回傳以公尺為單位的距離，結束時呼叫 `cancelChannelSoundingSession`。","若同時需要距離與方向，改用 **Nearby Interaction**：以 `supportsBluetoothChannelSounding` 確認支援後，用 peripheral 的 identifier 建立 `NINearbyAccessoryConfiguration`，方向需要啟用 **CameraAssistance**，再建立 `NISession` 並 run。可透過 `updateMotionState` 告知配件是移動或靜止以改善方向估算，delegate 回傳的 `NINearbyObjects` 與 UWB 完全相同，距離與方向皆為 optional（量測失敗時 distance 可能為 nil），iOS 會自動過濾離群值並平滑結果。需注意 iOS 27 僅在 app 前景時可用、進背景會暫停，且其他 Bluetooth／Wi-Fi 活動增加時 iOS 可能降低量測頻率；此功能需具備 **N1 chip** 的 iPhone。","硬體方面，配件必須支援 **Bluetooth 6.3** 並具備 **inline PCT** 功能；由於 iOS 採用 phase-based ranging，chipset 還須支援 spec 定義的 **mode-0** 與 **mode-2**，且 tone 之間的間隔時間 **T_FCS** 至少要 100µs。"],"deepdive":[{"t":0,"title":"Introduction","body":"由 Core Bluetooth 團隊的 Gretchen 開場，介紹用 **Channel Sounding** 尋找鄰近 Bluetooth 配件的方法。她先預告本場架構：先給出使用情境與運作原理，再說明如何用 **Core Bluetooth** 取得距離、或用 **Nearby Interaction** 同時取得距離與方向，接著是打造支援 Channel Sounding 硬體的提示，最後是 next steps。"},{"t":50,"title":"Overview","body":"以派對情境說明價值：屋內烤箱與後院煙燻爐各有一支 Bluetooth 溫度探針，app 能指出達溫的探針「在右邊 8 公尺」，避免搞混。講者比較三種測距方式：最高精度是加上 **Ultra Wideband** chipset 搭配 Nearby Interaction；若配件只有 Bluetooth chipset，則 **Channel Sounding** 是最佳選項；它比過去用 **RSSI** 粗估更準，是真正的距離量測。"},{"t":197,"title":"Core Bluetooth API","body":"說明若只需要距離就用 **Core Bluetooth**。前置條件是配件已透過 **AccessorySetupKit** 配對設定、並經 Core Bluetooth 連線，細節可參閱文件。這段帶出接下來測距的程式碼流程。"},{"t":223,"title":"Start a Core Bluetooth Channel Sounding session","body":"先用 **`CBCentralManager.supportsFeatures`** 確認本機 iOS 裝置支援 Channel Sounding，再對已連線的 **`CBPeripheral`** 呼叫 **`startChannelSoundingSession`**。呼叫後 iOS 會反覆執行 Channel Sounding 的 **procedure**，持續產出量測結果。"},{"t":249,"title":"Receive distance results and cancel a session","body":"每完成一次 procedure，delegate 方法 **`peripheral didReceive results`** 就會帶著以公尺為單位的距離被呼叫。當你準備結束時呼叫 **`cancelChannelSoundingSession`**，session 結束後會觸發 `peripheral didCompleteChannelSoundingSession` delegate 通知。"},{"t":274,"title":"Nearby Interaction API","body":"若要同時取得距離與方向，改用 **Nearby Interaction**。同樣需先讓配件透過 **AccessorySetupKit** 配對設定、並經 Core Bluetooth 連線，作為建立 Channel Sounding session 的前置條件。"},{"t":281,"title":"Start a Nearby Interaction Channel Sounding session","body":"先以 **`supportsBluetoothChannelSounding`** 確認本機支援，再建立 **`NINearbyAccessoryConfiguration`**，把 Core Bluetooth 的 `peripheral.identifier` 當作 `bluetoothChannelSoundingIdentifier` 傳入。要取得方向必須啟用 **CameraAssistance**，需要時務必開啟。"},{"t":319,"title":"Run a Nearby Interaction Channel Sounding session","body":"建立 **`NISession`**、設定 delegate，並以剛才的 accessory configuration 執行 `run`。若 app 知道配件正在移動或靜止，可呼叫 **`updateMotionState`** 並帶上 `object.discoveryToken`（牆上固定的 tag 傳 `.stationary`、移動物件傳 `.moving`）以改善方向估算。delegate 回傳的 **`NINearbyObjects`** 與 UWB 完全相同，距離與方向皆為 optional，量測失敗時 distance 可能為 nil；iOS 會自動過濾離群值並平滑結果。iOS 27 中此功能僅在前景可用、進背景會暫停，且其他 Bluetooth／Wi-Fi 活動增加時可能降低量測頻率，需具備 **N1 chip** 的 iPhone。"},{"t":425,"title":"Hardware tips","body":"配件必須支援 **Bluetooth 6.3** 且具備 **inline PCT** 功能。由於 iOS 採用 phase-based ranging，chipset 還須支援 Bluetooth spec 定義的 **mode-0** 與 **mode-2**；tone 之間的間隔時間 **T_FCS** 至少需達 100µs。"}],"summary_en":["Presented by Gretchen of the Core Bluetooth team, this session introduces **Bluetooth Channel Sounding** for adding distance and direction awareness to your Bluetooth accessories. Using a party example, two Bluetooth temperature probes sit in an indoor oven and a backyard smoker; when one hits its target temperature, the app can say it's \"8 meters to my right,\" so you never mix up your probes. Unlike using **RSSI** to estimate distance, Channel Sounding actually measures it.","Mechanically, a paired and connected iPhone is the **initiator** and the accessory is the **reflector**: the iPhone sends a tone, the accessory reflects it back, and the iPhone measures how the signal changes in transit. Repeating this across the channels of the 2.4GHz band, it observes the rate of change in the reflected tones to estimate distance — each such measurement is called a **procedure**. There are two implementation paths: if you only need distance, use **Core Bluetooth** — check support with `CBCentralManager.supportsFeatures`, call `startChannelSoundingSession` on a connected `CBPeripheral`, and iOS repeatedly runs procedures and returns the distance in meters via the `didReceive results` delegate; call `cancelChannelSoundingSession` to finish.","If you need distance and direction, use **Nearby Interaction**: after confirming support with `supportsBluetoothChannelSounding`, build an `NINearbyAccessoryConfiguration` using the peripheral's identifier, enable **CameraAssistance** (required for direction), then create and run an `NISession`. You can call `updateMotionState` to tell it whether the accessory is moving or stationary for better direction estimates; the `NINearbyObjects` delegate callback is identical to UWB, with both distance and direction optional (distance may be nil if a measurement fails), and iOS automatically filters outliers and smooths results. Note that in iOS 27 it works only in the foreground (sessions pause in the background), iOS may reduce measurement frequency when other Bluetooth/Wi-Fi activity increases, and it requires iPhones with the **N1 chip**.","On the hardware side, the accessory must support **Bluetooth 6.3** with the **inline PCT** feature; because iOS uses phase-based ranging, the chipset must also support **mode-0** and **mode-2** as defined by the Bluetooth spec, and the inter-tone timing **T_FCS** must be at least 100µs."],"deepdive_en":[{"t":0,"title":"Introduction","body":"Gretchen of the Core Bluetooth team opens by introducing how to find nearby Bluetooth accessories with **Channel Sounding**. She previews the agenda: use cases and how it works, how to implement it with **Core Bluetooth** for distance or **Nearby Interaction** for distance and direction, tips for building supporting hardware, and finally next steps."},{"t":50,"title":"Overview","body":"A party scenario illustrates the value: with Bluetooth temperature probes in an indoor oven and a backyard smoker, the app can say the probe that reached temperature is \"8 meters to my right,\" so you don't mix them up. The talk compares ranging options: highest accuracy comes from adding an **Ultra Wideband** chipset with Nearby Interaction; if the accessory only has Bluetooth, **Channel Sounding** is the best option, and unlike **RSSI** estimation it actually measures distance."},{"t":197,"title":"Core Bluetooth API","body":"Explains that if you only need distance, use **Core Bluetooth**. The prerequisite is that the accessory is paired and set up with **AccessorySetupKit** and connected through Core Bluetooth, with details in the documentation. This sets up the code flow for measuring distance that follows."},{"t":223,"title":"Start a Core Bluetooth Channel Sounding session","body":"First check that the local iOS device supports Channel Sounding with **`CBCentralManager.supportsFeatures`**, then call **`startChannelSoundingSession`** on a connected **`CBPeripheral`**. Once started, iOS repeatedly performs Channel Sounding **procedures**, continuously producing measurements."},{"t":249,"title":"Receive distance results and cancel a session","body":"Each completed procedure invokes the **`peripheral didReceive results`** delegate method with the measured distance in meters. When you're ready to finish, call **`cancelChannelSoundingSession`**; when the session ends, the `peripheral didCompleteChannelSoundingSession` delegate is called."},{"t":274,"title":"Nearby Interaction API","body":"To get both distance and direction, use **Nearby Interaction**. As before, the accessory must be paired and set up through **AccessorySetupKit** and connected via Core Bluetooth as the prerequisite for creating a Channel Sounding session."},{"t":281,"title":"Start a Nearby Interaction Channel Sounding session","body":"Check support with **`supportsBluetoothChannelSounding`**, then create an **`NINearbyAccessoryConfiguration`**, passing the Core Bluetooth `peripheral.identifier` as the `bluetoothChannelSoundingIdentifier`. Getting direction requires **CameraAssistance**, so be sure to enable it if you need direction."},{"t":319,"title":"Run a Nearby Interaction Channel Sounding session","body":"Create an **`NISession`**, set its delegate, and `run` it with the accessory configuration. If the app knows whether the accessory is moving or stationary, call **`updateMotionState`** with `object.discoveryToken` (`.stationary` for a wall-mounted tag, `.moving` for a moving object) to improve direction estimates. The **`NINearbyObjects`** callback is identical to UWB, with distance and direction both optional and distance possibly nil on a failed measurement; iOS filters outliers and smooths results. In iOS 27 it works only in the foreground (pausing in the background), iOS may reduce measurement frequency under heavier Bluetooth/Wi-Fi activity, and it requires iPhones with the **N1 chip**."},{"t":425,"title":"Hardware tips","body":"The accessory must support **Bluetooth 6.3** and have the **inline PCT** feature. Because iOS uses phase-based ranging, the chipset must also support **mode-0** and **mode-2** as defined by the Bluetooth spec, and the inter-tone timing **T_FCS** must be at least 100µs."}],"code":[]},"related":[{"id":"101","title":"Keynote","gloss":"主題演講","gloss_en":"Keynote","category":"other","categoryLabel":"其他"},{"id":"102","title":"Platforms State of the Union","gloss":"平台現況報告","gloss_en":"Platforms State of the Union","category":"other","categoryLabel":"其他"},{"id":"111","title":"Keynote (ASL)","gloss":"主題演講(美國手語版)","gloss_en":"Keynote (American Sign Language)","category":"other","categoryLabel":"其他"},{"id":"112","title":"Platforms State of the Union (ASL)","gloss":"平台現況報告（美國手語版）","gloss_en":"Platforms State of the Union (American Sign Language)","category":"other","categoryLabel":"其他"},{"id":"122","title":"WWDC26 Platforms State of the Union Recap","gloss":"WWDC26 平台現況演講重點回顧","gloss_en":"WWDC26 Platforms State of the Union recap","category":"other","categoryLabel":"其他"}]}</script>
