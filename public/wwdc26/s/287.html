<script id="d" type="application/json">{"s":{"id":"287","title":"Build next-generation experiences with visionOS 27","gloss":"用 visionOS 27 打造次世代體驗","category":"visionos","categoryLabel":"visionOS","duration":1955,"url":"https://developer.apple.com/videos/play/wwdc2026/287/","takeaway":"visionOS 27 提供多條建構空間體驗的路徑，涵蓋 RealityKit、第三方遊戲引擎、Foveated Streaming、物件追蹤與沉浸式媒體等新能力。","chapters":[[0,"Introduction"],[120,"visionOS overview"],[193,"Paths to build a visionOS experience"],[399,"RealityKit and Reality Composer Pro"],[822,"Third-party game engines"],[947,"Spatial Preview"],[1048,"Foveated Streaming"],[1236,"Object tracking and spatial accessories"],[1532,"Immersive media"],[1846,"Other visionOS 27 updates"],[1925,"Next steps"]],"points":[{"text":"介紹建構 visionOS 體驗的多條路徑，從 **RealityKit** 與 **Reality Composer Pro** 到第三方遊戲引擎皆可選擇。","hot":false},{"text":"**Foveated Streaming** 依注視點優化串流畫質，提升沉浸式內容的效能與品質。","hot":true},{"text":"新增 **object tracking** 與 **spatial accessories** 支援，擴展實體互動的可能性。","hot":false},{"text":"強化 **immersive media** 與 **Spatial Preview**，讓沉浸式媒體製作與預覽更順暢。","hot":false}],"apis":["RealityKit","Reality Composer Pro","Foveated Streaming","Spatial Preview"],"audience":"適合**想在 visionOS 27 上開發 App、遊戲或空間體驗的開發者**，尤其想了解整體建構路徑者。","gloss_en":"Build next-generation experiences with visionOS 27","takeaway_en":"visionOS 27 offers multiple pathways for building spatial experiences, spanning new capabilities like RealityKit, third-party game engines, Foveated Streaming, object tracking, and immersive media.","points_en":[{"text":"Introduces the multiple pathways for building visionOS experiences, from **RealityKit** and **Reality Composer Pro** to third-party game engines.","hot":false},{"text":"**Foveated Streaming** optimizes streaming quality based on the gaze point, improving the performance and quality of immersive content.","hot":true},{"text":"Adds support for **object tracking** and **spatial accessories**, expanding the possibilities for physical interaction.","hot":false},{"text":"Enhances **immersive media** and **Spatial Preview**, making immersive media production and previewing smoother.","hot":false}],"audience_en":"**Developers who want to build apps, games, or spatial experiences on visionOS 27**, especially those wanting to understand the overall building pathways.","summary":["這場由 Vision Products Group 的 Norman 主講，是 visionOS 27 的總覽性場次，把「該怎麼把你的內容搬上 Apple Vision Pro」這件事拆成清楚的路徑圖。最新一代 Apple Vision Pro 改用 **M5** 晶片提供桌機級即時算繪、每眼超過 4K 的超高解析度顯示、90Hz 手部追蹤，並與 Apple 生態系深度整合。系統提供 **Shared Space**（window 或 volume，可與其他 app 並存）與 **Immersive Space**（獨佔執行，含 Mixed／Progressive／Full 三種沉浸風格）兩大算繪場景。","建立 visionOS 體驗有三條主要路徑。第一條給既有 iOS／iPadOS app：透過 App Store Connect 勾選相容性，或把 visionOS 加進 Xcode 的 deployment target 重新編譯。第二條是為空間運算從零打造：用 **SwiftUI**、**RealityKit** 與 **Reality Composer Pro**，或自帶算繪引擎搭配 **CompositorServices**，也可用 **Unity**、**Unreal**、**Godot** 等第三方引擎。第三條是全新的路徑，把既有 macOS／PC 內容帶上來：用 **Spatial Preview** framework 從 Mac 延伸影像與 3D 內容，或用 **Foveated Streaming** framework 串流 PC 的 OpenXR 沉浸內容。","在工具與框架更新上，RealityKit 新增 **physical space lighting**、**Projective Textures**、**Cloth Simulation**、**Custom Reverb Mesh** 與 **Gaussian Splatting**；Reality Composer Pro 升級為第三版，帶來 AI 的 **Reality Composer Pro Assistant**、**Animation Graph**、**Script Graph**、**Navigation Meshes** 與 subsurface scattering 等 shader graph 強化。互動方面，**object tracking** 支援高幀率追蹤、Create ML 延伸訓練與 metric space 姿態，並擴及 iOS；**spatial accessories** 開放開發者自製（LED constellation＋IMU＋Bluetooth）。","媒體管線方面，**Apple Immersive Video (AIV)** 以 90fps、每幀超過 100 megapixels 的立體 180 度規格交付最高保真度，並透過 **Immersive Media Support (IMS)** framework 新增 camera presentation override、**ImmersivePreviewRenderer** 與 wide-aspect-ratio portal，還有 static foveation 範例與 ASAF 音訊套件更新。其餘更新包含 Safari 的更寬視窗與預設啟用的 Web Environments、改良的 Control Center、4K High Quality Capture 與 accessory widget。實務結論是：無論你從 iOS、原生空間、第三方引擎或既有 Mac／PC 出發，visionOS 27 都備好了對應的路徑。"],"deepdive":[{"t":0,"title":"Introduction","body":"由 Vision Products Group 的 director Norman 開場，回顧過去一年開發者在平台上的成果，包括 YouTube、Valve 把 **Steam Link** 帶上來、Resolution Games，以及 Kia、Innoactive 用 **Autodesk VRED**、Nvidia **CloudXR SDK** 與新的 **Foveated Streaming** framework 設計次世代車輛、Laminar Research 用 X-Plane 打造沉浸式訓練。強調開發者回饋持續形塑 visionOS 的未來方向。"},{"t":120,"title":"visionOS overview","body":"說明最新 Apple Vision Pro 的硬體：**M5** 晶片提供桌機級即時算繪、每眼超過 4K 解析度、90Hz 手部追蹤與跨 Apple 生態整合。算繪場景分為 **Shared Space**（window 或 volume，可與其他 app 並存於 infinite canvas）與 **Immersive Space**（獨佔執行），後者提供 Mixed、Progressive、Full 三種 immersion style，構成一整段沉浸光譜。"},{"t":193,"title":"Paths to build a visionOS experience","body":"提出三條建構路徑：既有 iOS／iPadOS app 透過 App Store Connect 勾選相容性或加 visionOS deployment target 重新編譯；為空間運算原生打造則用 SwiftUI／**RealityKit**／Reality Composer Pro 或自帶引擎搭 **CompositorServices**，亦可用 Unity／Unreal／Godot；第三條全新路徑用 **Spatial Preview** 從 Mac 延伸內容、用 **Foveated Streaming** 串流 PC 的 OpenXR 內容（如駕駛艙用 RealityKit 原生算繪、遠端串流高耗效的地景）。"},{"t":399,"title":"RealityKit and Reality Composer Pro","body":"RealityKit 新增 **physical space lighting**、為 spotlight 加紋理的 **Projective Textures**（可模擬彩繪玻璃投影或水下焦散）、即時 **Cloth Simulation**、模擬聲音被木石金屬吸收散射的 **Custom Reverb Mesh**，以及可掃描實物的 **Gaussian Splatting**。Reality Composer Pro 升級為第三版，導入 AI 的 **Reality Composer Pro Assistant**、狀態機式的 **Animation Graph**、節點式邏輯的 **Script Graph**、可生成微調的 **Navigation Meshes**，以及把 subsurface scattering 開放到 Shader Graph 來做出逼真皮膚、眼睛、毛髮。"},{"t":822,"title":"Third-party game engines","body":"說明第三方引擎支援：Unity 自始即相容，windowed 遊戲用 RealityKit 原生算繪、immersive 遊戲可選 RealityKit 或 **CompositorServices**，並提供 PSVR 2 Sense controller 等 spatial accessory 外掛。Unreal 支援 immersive 模式（Polyarc 的 Glassbreakers 用 static foveation 提升銳利度），Godot 則支援 CompositorServices 算繪、RealityKit 外掛與 **PHASE** 空間音訊外掛，這些引擎外掛皆可從 GitHub 下載。"},{"t":947,"title":"Spatial Preview","body":"介紹全新的 macOS framework **Spatial Preview**：無需建立 visionOS app，即可把 Mac 上的空間內容（spatial photo、Apple immersive video、USD 3D 內容）直接在 Apple Vision Pro 上預覽，並透過 **SharePlay** 協作。它建立在 visionOS 的 **Quick Look** 之上，可即時編輯、移動、調整材質覆寫、加註解，並直接內建於 macOS 27 的 Preview，apps 如 Cinema4D、SketchUp 可做即時協作 3D 工作流。"},{"t":1048,"title":"Foveated Streaming","body":"**Foveated Streaming** 讓 Apple Vision Pro 連到 PC 等外部裝置串流 **OpenXR** 內容，系統自動回傳手部、控制器位置與麥克風輸入。已於 visionOS 26.4 推出，案例包含 X-Plane 12、iRacing（ARKit 對齊實體方向盤）、Innoactive 帶來的 Autodesk VRED ray tracing。它依注視點智慧壓縮——焦點區高畫質、周邊低頻寬，協定由 **NVIDIA CloudXR** 驅動，可在 Wi-Fi 上串流、無需傳輸線。"},{"t":1236,"title":"Object tracking and spatial accessories","body":"object tracking 自 visionOS 2.0 起可把實物變成虛擬 anchor（以 USDZ 在 Create ML 訓練 reference object）。新增高幀率追蹤、Create ML 的延伸訓練（改善手持物精度）、metric space 姿態 API（高精度空間量測，如醫療探針的手術導航訓練），並擴及 iOS。**spatial accessories** 則開放自製：裝置需含可被追蹤的 **LED constellation**、**IMU** 與 **Bluetooth** 晶片，DFRobot、MikroE 將推出參考硬體與開發套件，且支援按鈕與觸覺回饋、能在遮蔽或低光下穩定追蹤。"},{"t":1532,"title":"Immersive media","body":"**Apple Immersive Video (AIV)** 是 visionOS 上最高保真的沉浸影片，以 metadata 驅動的鏡頭校正維持真實立體尺度，90fps、每幀超過 100 megapixels（每秒逾百億像素）、立體 180 度，支援 VOD 與 live broadcast。**Immersive Media Support (IMS)** framework 可讀寫 AIV 的 metadata，新增 camera presentation override 指令、即時預覽的 **ImmersivePreviewRenderer**、wide-aspect-ratio portal（用 AVPlayerViewController 或 RealityKit 的 VideoPlayerComponent 設定），並提供 static foveation 範例與 **ASAF** 音訊製作套件更新。"},{"t":1846,"title":"Other visionOS 27 updates","body":"收尾的其他更新：Safari 視窗可調更寬、超大視窗自然彎曲、**Web Environments** 預設啟用讓網站可有背景（以 Apple TV 影集 Severance 環境為例）；改良的 **Control Center** 整合通知、系統狀態與環境；**High Quality Capture** 可在裝置上直接擷取 4K 影片、無需 Mac；以及 accessory widget 支援，讓你用小型可一眼掌握的 widget 延伸 app 到 Apple Vision Pro。另外還有 Siri 強化、全新 Iceland 環境、Spatial Panoramas、Personal Environments 與 Freeform 更新。"},{"t":1925,"title":"Next steps","body":"總結 visionOS 27 從更深的沉浸、更豐富的媒體到強大的新互動方式，給開發者大量可建構的素材，並以期待開發者接下來的作品作結。"}],"summary_en":["Presented by Norman from the Vision Products Group, this is an overview session for visionOS 27 that frames \"how to bring your content to Apple Vision Pro\" as a clear set of pathways. The latest Apple Vision Pro is powered by the **M5** chip for desktop-class real-time rendering, with ultra-high-resolution displays of over 4K pixels per eye, 90Hz hand tracking, and deep Apple-ecosystem integration. The system offers two rendering scene types: the **Shared Space** (a window or volume that coexists with other apps) and the **Immersive Space** (your app runs exclusively, with Mixed, Progressive, and Full immersion styles).","There are three main paths to build for visionOS. The first is for existing iOS/iPadOS apps: check a box in App Store Connect for compatibility, or recompile by adding visionOS as a deployment target in Xcode. The second is building natively for spatial computing using **SwiftUI**, **RealityKit**, and **Reality Composer Pro**, a custom engine with **CompositorServices**, or third-party engines like **Unity**, **Unreal**, and **Godot**. The third is a new path that brings existing macOS/PC content over: the **Spatial Preview** framework extends images and 3D content from a Mac, while the **Foveated Streaming** framework streams immersive OpenXR content from a PC.","On tools and frameworks, RealityKit adds **physical space lighting**, **Projective Textures**, **Cloth Simulation**, **Custom Reverb Mesh**, and **Gaussian Splatting**; Reality Composer Pro 3 brings the AI-powered **Reality Composer Pro Assistant**, **Animation Graph**, **Script Graph**, **Navigation Meshes**, and subsurface scattering through Shader Graph. For interaction, **object tracking** gains high-frame-rate tracking, extended Create ML training, and metric-space poses, and is extended to iOS; **spatial accessories** open up to developers building their own (an LED constellation plus IMU and Bluetooth).","On the media pipeline, **Apple Immersive Video (AIV)** delivers the highest fidelity at 90fps and over 100 megapixels per frame in stereoscopic 180 degrees, and the **Immersive Media Support (IMS)** framework adds camera presentation override commands, the **ImmersivePreviewRenderer**, and wide-aspect-ratio portals, plus a static foveation sample and ASAF audio suite updates. Other updates include wider Safari windows with Web Environments enabled by default, an improved Control Center, 4K High Quality Capture, and accessory widgets. The practical takeaway: wherever you start from — iOS, native spatial, a third-party engine, or existing Mac/PC content — visionOS 27 has a path ready for you."],"deepdive_en":[{"t":0,"title":"Introduction","body":"Norman, a director in the Vision Products Group, opens by reviewing a year of developer work on the platform, including YouTube, Valve bringing **Steam Link**, Resolution Games, and companies like Kia and Innoactive using **Autodesk VRED**, Nvidia's **CloudXR SDK**, and the new **Foveated Streaming** framework to design next-generation vehicles, plus Laminar Research's immersive training with X-Plane. He stresses that developer feedback continues to shape the future of visionOS."},{"t":120,"title":"visionOS overview","body":"Covers the latest Apple Vision Pro hardware: the **M5** chip for desktop-class real-time rendering, over 4K pixels per eye, 90Hz hand tracking, and deep Apple-ecosystem integration. Rendering scene types are split into the **Shared Space** (a window or volume that coexists with other apps on the infinite canvas) and the **Immersive Space** (exclusive execution), the latter offering Mixed, Progressive, and Full immersion styles that form a full spectrum of immersion."},{"t":193,"title":"Paths to build a visionOS experience","body":"Lays out three build paths: existing iOS/iPadOS apps via an App Store Connect checkbox or by adding a visionOS deployment target and recompiling; building natively for spatial computing with SwiftUI/**RealityKit**/Reality Composer Pro or a custom engine with **CompositorServices**, or Unity/Unreal/Godot; and a new third path using **Spatial Preview** to extend Mac content and **Foveated Streaming** to stream a PC's OpenXR content (e.g., a cockpit rendered natively with RealityKit while a processor-intensive landscape is streamed remotely)."},{"t":399,"title":"RealityKit and Reality Composer Pro","body":"RealityKit adds **physical space lighting**, **Projective Textures** that add textures to spotlights (simulating stained glass or underwater caustics), real-time **Cloth Simulation**, a **Custom Reverb Mesh** that simulates how sound is absorbed and scattered by wood, metal, and stone, and **Gaussian Splatting** for scanning real-world objects. Reality Composer Pro becomes version 3, introducing the AI **Reality Composer Pro Assistant**, state-machine **Animation Graph**, node-based **Script Graph**, generatable **Navigation Meshes**, and subsurface scattering exposed through Shader Graph for lifelike skin, eyes, and hair."},{"t":822,"title":"Third-party game engines","body":"Explains third-party engine support: Unity has been compatible since launch, with windowed games using RealityKit for native rendering and immersive games choosing RealityKit or **CompositorServices**, plus plugins for spatial accessories like the PSVR 2 Sense controller. Unreal supports immersive mode (Polyarc's Glassbreakers uses static foveation for sharper visuals), and Godot supports CompositorServices rendering, a RealityKit plugin, and a **PHASE** spatial-audio plugin — all downloadable from GitHub."},{"t":947,"title":"Spatial Preview","body":"Introduces the new macOS framework **Spatial Preview**: without building a visionOS app, you can preview spatial content from a Mac (spatial photos, Apple immersive video, USD 3D content) directly on Apple Vision Pro and collaborate via **SharePlay**. Built on **Quick Look** in visionOS, it supports real-time editing, moving around scenes, material overrides, and annotations, and is built directly into Preview on macOS 27, enabling real-time collaborative 3D workflows for apps like Cinema4D and SketchUp."},{"t":1048,"title":"Foveated Streaming","body":"**Foveated Streaming** lets Apple Vision Pro connect to external devices like a PC to stream **OpenXR** content, with the system automatically sending hands, controller positions, and microphone input. Launched in visionOS 26.4, examples include X-Plane 12, iRacing (ARKit aligning a physical racing wheel), and Innoactive bringing Autodesk VRED with ray tracing. It compresses video by gaze — high quality in focus, lower bandwidth in the periphery — powered by **NVIDIA CloudXR**, streaming over Wi-Fi with no cables."},{"t":1236,"title":"Object tracking and spatial accessories","body":"Object tracking (since visionOS 2.0) turns physical objects into virtual anchors by training a reference object from a USDZ in Create ML. New features add high-frame-rate tracking, extended Create ML training (better accuracy for handheld objects), a metric-space pose API for high-precision spatial measurement (e.g., a medical probe for surgical navigation training), and iOS support. **Spatial accessories** open up to custom builds: a device needs an **LED constellation**, an **IMU**, and a **Bluetooth** chip, with DFRobot and MikroE shipping reference hardware, plus buttons and haptics and robust tracking under occlusion or low light."},{"t":1532,"title":"Immersive media","body":"**Apple Immersive Video (AIV)** is the highest-fidelity immersive video on visionOS, using metadata-driven lens calibration to maintain real stereoscopic scale, at 90fps and over 100 megapixels per frame (over ten billion pixels per second) in stereoscopic 180 degrees, supporting VOD and live broadcast. The **Immersive Media Support (IMS)** framework reads and writes AIV metadata and adds camera presentation override commands, the real-time **ImmersivePreviewRenderer**, and wide-aspect-ratio portals (set via AVPlayerViewController or RealityKit's VideoPlayerComponent), plus a static foveation sample and **ASAF** production suite updates."},{"t":1846,"title":"Other visionOS 27 updates","body":"Final additions: Safari windows can go wider, very large windows naturally curve, and **Web Environments** are enabled by default so websites can have backgrounds (shown with the Apple TV show Severance). An improved **Control Center** unifies notifications, system status, controls, and environments; **High Quality Capture** records 4K video right on the device with no Mac; and accessory widget support lets you extend your app to Apple Vision Pro with small, glanceable widgets. Also mentioned: Siri enhancements, a new Iceland environment, Spatial Panoramas, Personal Environments, and Freeform updates."},{"t":1925,"title":"Next steps","body":"Wraps up by summarizing that visionOS 27 gives developers a lot to build with — from deeper immersion to richer media to powerful new ways to add interactivity — and closes by looking forward to what developers will build next."}],"code":[]},"related":[{"id":"280","title":"Iterate your spatial scenes faster with Reality Composer Pro 3","gloss":"用 Reality Composer Pro 3 更快迭代空間場景","gloss_en":"Iterate your spatial scenes faster with Reality Composer Pro 3","category":"visionos","categoryLabel":"visionOS"},{"id":"393","title":"Supercharge your spatial workflows with Reality Composer Pro 3","gloss":"用 Reality Composer Pro 3 強化你的空間工作流","gloss_en":"Supercharge your spatial workflows with Reality Composer Pro 3","category":"visionos","categoryLabel":"visionOS"},{"id":"279","title":"Explore advances in RealityKit","gloss":"探索 RealityKit 的最新進展","gloss_en":"Explore advances in RealityKit","category":"visionos","categoryLabel":"visionOS"},{"id":"283","title":"Explore enhancements to visionOS object tracking","gloss":"探索 visionOS 物件追蹤的強化功能","gloss_en":"Explore enhancements to visionOS object tracking","category":"visionos","categoryLabel":"visionOS"},{"id":"284","title":"Collaborate on structured 3D models in visionOS","gloss":"在 visionOS 中協作操作結構化 3D 模型","gloss_en":"Collaborate on structured 3D models in visionOS","category":"visionos","categoryLabel":"visionOS"}]}</script>
