<script id="d" type="application/json">{"s":{"id":"213","title":"Translate your app using agents in Xcode","gloss":"在 Xcode 中運用 agent 翻譯你的 App","category":"swift","categoryLabel":"Swift","duration":892,"url":"https://developer.apple.com/videos/play/wwdc2026/213/","takeaway":"利用 Xcode 的 coding agent 結合 App 上下文翻譯 String Catalog，並透過審閱與迭代產出高品質的在地化字串。","chapters":[[0,"Introduction"],[109,"Add translations"],[182,"Localizing strings in SwiftUI"],[191,"Localizing strings in SwiftUI with custom table name"],[491,"Review and iterate"],[662,"Best practices"],[681,"Localizing strings in SwiftUI"],[685,"Localizing strings elsewhere"],[819,"Field for machine-translated strings in the XLIFF"]],"points":[{"text":"**Xcode 與 coding agent** 能依據 App 的上下文翻譯 **String Catalog**，加速多語系在地化流程。","hot":true},{"text":"在 SwiftUI 中善用 **Text** 的 comment 參數（及 tableName）提供翻譯語境，是讓機器翻譯更準確的關鍵實務。","hot":false},{"text":"其他位置可用 **String(localized:)** 與 **LocalizedStringResource** 搭配 comment 標記可在地化字串。","hot":false},{"text":"翻譯後需**審閱與迭代**（review and iterate）；XLIFF 會以 state-qualifier=\"leveraged-mt\" 標示**機器翻譯**字串以利辨識。","hot":false}],"apis":["String Catalog","Text","String(localized:)","LocalizedStringResource","XLIFF"],"audience":"**需要將 App 在地化為多種語言**、並想用 AI agent 加速翻譯 String Catalog 的開發者。","gloss_en":"Translate your app using agents in Xcode","takeaway_en":"Use Xcode's coding agents together with your app's context to translate String Catalogs, then review and iterate to produce high-quality localized strings.","points_en":[{"text":"**Xcode and coding agents** can translate **String Catalogs** based on your app's context, accelerating multi-language localization.","hot":true},{"text":"In SwiftUI, make good use of **Text**'s comment parameter (and tableName) to provide translation context, a key practice for more accurate machine translation.","hot":false},{"text":"Elsewhere, use **String(localized:)** and **LocalizedStringResource** with comment to mark localizable strings.","hot":false},{"text":"After translating, you need to **review and iterate**; XLIFF marks **machine-translated** strings with state-qualifier=\"leveraged-mt\" to make them easy to identify.","hot":false}],"audience_en":"Developers who **need to localize their app into multiple languages** and want to use AI agents to speed up translating String Catalogs.","summary":["傳統機器學習翻譯與一般 LLM 在軟體在地化上常因缺乏上下文而出錯——例如英文的 **book** 究竟是「書」還是「訂房」，沒有語境就可能選錯。這場由 Localization 團隊的 Avery 主講，重點是：**String Catalogs** 多年來已逐步累積了字串的上下文（出現在程式碼何處、如何被使用、自動產生的註解），而 **Xcode 27** 起，可以直接在 Xcode 內透過 **coding agents** 把這些上下文一併交給模型來翻譯你的 app。","實際流程是用 Xcode 工具列的 New Conversation 請 agent 把整個專案翻成某個語言（示範為加拿大法語）。agent 先請 Xcode **prepare for localization**：加入語言、建置所有目標平台以確保字串被完整探索、把新字串加進 String Catalogs（沒有的話自動建立，預設表名 Localizable，也可用自訂表名）。接著 agent 選出待譯字串、分批委派給 **subagents**，並由 Xcode 餵給每個 subagent 上下文——字串在程式碼的用法、用語相近的字串清單、甚至其他語言已有的譯法，並確保複數變化（如 `%lld items`）在各語言都正確產生。要調整風格（如把 landmarks 從 lieux d'intérêt 改成更口語的 attraits）也只需再請 agent 修改，且新功能翻譯時 agent 會自動沿用先前確立的術語，維持一致性。","review 與迭代同樣關鍵：可請 agent 用目標語言 render UI 並偵測截斷（法語平均句子較長、Thai 的垂直裁切、Arabic 的 RTL 對齊都能這樣檢查），形成緊密回饋迴圈；但翻成自己不熟的語言時，務必靠 **TestFlight** 找母語者測試與回報。最佳實務包括：確保字串可在地化（SwiftUI 預設可，其餘用 `String(localized:)`）、在 **AGENTS.md** 或獨立的 **TRANSLATION.md** 提供詞彙表／不譯清單／語氣指南、選用 context window 大且擅長長任務的模型，並注意某些語言在訓練資料中較少見可能品質較差；最後可用 XLIFF 的 **leveraged-mt** state qualifier 辨識哪些是機器翻譯的字串。"],"deepdive":[{"t":0,"title":"Introduction","body":"由 Localization 團隊的 Avery 開場，點出在地化能讓 app 觸及全球數百萬人。傳統 ML 模型難以處理軟體在地化，現代 **LLM** 雖擅長一般翻譯但缺乏上下文時仍會出錯（如 book 的多義）；好消息是 **String Catalogs** 多年來已累積字串的用法與位置上下文，**Xcode 27** 起可直接用 coding agents 翻譯。"},{"t":109,"title":"Add translations","body":"示範用 Xcode 工具列的 New Conversation 請 agent 把專案翻成加拿大法語。agent 先請 Xcode **prepare the project**：加入語言、建置所有支援平台的目標以完整探索可在地化字串、再把新字串加進 **String Catalogs**（沒有則自動建立，預設表名 Localizable）。"},{"t":182,"title":"Localizing strings in SwiftUI","body":"強調 SwiftUI 程式碼預設即可在地化：`Text`、`Button` 等 API 會自動把字串暴露給在地化流程。範例以 `Text(\"Hello, world!\", comment:)` 帶 comment 提供翻譯上下文。"},{"t":191,"title":"Localizing strings in SwiftUI with custom table name","body":"說明可用 **自訂表名** 來組織字串：在 `Text` 加上 `tableName:` 參數（如 \"Greetings\"），Xcode 就會自動把這些字串放進名為 Greetings 的 String Catalog，方便分類管理。"},{"t":491,"title":"Review and iterate","body":"翻譯只是第一步，還要確認在執行期各語言都正確。可請 agent 用目標語言 **render UI 並找截斷**（法語句子較長易超出版面），藉此判斷是實作 bug、需重新設計版面，或該請模型給較短譯法；同理可檢查 Thai 的垂直裁切與 Arabic 的 RTL 對齊，形成緊密回饋迴圈。另強調用 **TestFlight** 讓母語者測試與回報，彌補開發者不懂該語言的盲點。"},{"t":662,"title":"Best practices","body":"進入最佳實務段落，核心是讓所有面向使用者的字串都可在地化，並善用上下文與翻譯指南來提升品質與一致性。"},{"t":681,"title":"Localizing strings in SwiftUI","body":"再次提醒 **SwiftUI 預設可在地化**，這是讓翻譯流程順利的前提；只要使用標準 API，字串就會自動被探索並納入 String Catalogs。"},{"t":685,"title":"Localizing strings elsewhere","body":"非 SwiftUI 的程式碼通常需明確使用 **`String(localized:)`** 或 **`LocalizedStringResource`** 等 API 才能讓字串可在地化。並建議在 **AGENTS.md** 或獨立的 **TRANSLATION.md** 提供詞彙表、不譯清單（產品名／商標）與語氣描述；選模型時偏好 context window 大、擅長長任務者，並注意低資源語言品質可能較差。"},{"t":819,"title":"Field for machine-translated strings in the XLIFF","body":"處理從 Xcode 匯出的在地化檔時，可檢查 XLIFF 中 `target` 的 **`state-qualifier=\"leveraged-mt\"`** 來辨識哪些譯文是由 agent（機器翻譯）提供，方便後續人工審閱與篩選。"}],"summary_en":["Traditional ML translation and general LLMs often get software localization wrong because they lack context—for example, does English **book** mean something to read or to reserve a room? Presented by Avery from the Localization team, the key message is that **String Catalogs** have been accumulating string context for years (where in code a string is used, how it's used, auto-generated comments), and starting in **Xcode 27** you can translate your app directly in Xcode using **coding agents** that receive all of that context.","The flow uses Xcode's New Conversation to ask an agent to translate the whole project into a language (demoed in Canadian French). The agent first asks Xcode to **prepare for localization**: add the language, build all target platforms so every localizable string is discovered, and add new strings to **String Catalogs** (auto-creating them if needed, default table Localizable, with custom table names also supported). The agent then selects strings, splits them into batches delegated to **subagents**, and Xcode feeds each subagent context—how the string is used in code, lists of strings with similar terminology, even how it was translated in other languages—while ensuring plural variations (like `%lld items`) are generated correctly per language. Style adjustments (e.g., changing landmarks from lieux d'intérêt to the more colloquial attraits) just take another request, and when translating new features the agent automatically reuses previously established terminology for consistency.","Review and iteration matter just as much: you can ask the agent to render the UI in the target language and detect truncation (longer French sentences, vertical clipping in Thai, RTL alignment in Arabic all checkable this way) for a tight feedback loop—but for languages you don't speak, rely on **TestFlight** to get native speakers testing and reporting. Best practices include making strings localizable (SwiftUI by default, otherwise `String(localized:)`), providing a glossary / do-not-translate list / tone guidance in **AGENTS.md** or a dedicated **TRANSLATION.md**, choosing a model with a large context window suited to long-running tasks, and being aware that low-resource languages may yield lower quality; finally, you can identify machine-translated strings via the **leveraged-mt** state qualifier in the exported XLIFF."],"deepdive_en":[{"t":0,"title":"Introduction","body":"Avery from the Localization team opens by noting that localizing reaches millions more people. Traditional ML struggled with software localization; modern **LLMs** are great at general translation but still err without context (the book ambiguity). The good news: **String Catalogs** have accumulated usage and location context for years, and **Xcode 27** lets you translate using coding agents directly."},{"t":109,"title":"Add translations","body":"Demonstrates asking an agent to translate the project into Canadian French via New Conversation. The agent first has Xcode **prepare the project**: add the language, build all supported-platform targets to fully discover localizable strings, then add new strings to **String Catalogs** (auto-created if absent, default table Localizable)."},{"t":182,"title":"Localizing strings in SwiftUI","body":"Stresses that SwiftUI code is localizable by default: APIs like `Text` and `Button` automatically expose their strings. The example uses `Text(\"Hello, world!\", comment:)` to provide translation context via a comment."},{"t":191,"title":"Localizing strings in SwiftUI with custom table name","body":"Shows organizing strings with a **custom table name**: adding `tableName:` (e.g. \"Greetings\") to `Text` makes Xcode place those strings in a String Catalog called Greetings for cleaner organization."},{"t":491,"title":"Review and iterate","body":"Translation is only step one—verify runtime behavior per language. Ask the agent to **render the UI and find truncations** (French sentences run longer), helping decide whether it's an implementation bug, a needed redesign, or a request for a shorter translation; the same checks catch vertical clipping in Thai and RTL alignment in Arabic, forming a tight feedback loop. Also use **TestFlight** so native speakers can test and report, covering the developer's blind spot in unfamiliar languages."},{"t":662,"title":"Best practices","body":"Begins the best-practices segment, centered on making every user-facing string localizable and leveraging context and translation guidance to raise quality and consistency."},{"t":681,"title":"Localizing strings in SwiftUI","body":"Reiterates that **SwiftUI is localizable by default**, a prerequisite for smooth translation; using standard APIs ensures strings are discovered and added to String Catalogs automatically."},{"t":685,"title":"Localizing strings elsewhere","body":"Non-SwiftUI code typically needs explicit APIs like **`String(localized:)`** or **`LocalizedStringResource`** to be localizable. Recommends providing a glossary, do-not-translate list (product names/trademarks), and tone description in **AGENTS.md** or a dedicated **TRANSLATION.md**; prefer models with a large context window suited to long tasks, and note that low-resource languages may be lower quality."},{"t":819,"title":"Field for machine-translated strings in the XLIFF","body":"When handling localizations exported from Xcode, check the XLIFF `target`'s **`state-qualifier=\"leveraged-mt\"`** to identify which translations were provided by an agent (machine translation), aiding later human review and filtering."}],"code":["// Localizing strings in SwiftUI\n\nText(\"Hello, world!\", comment: \"A standard greeting\")","// Localizing strings in SwiftUI with custom table name\n\nText(\"Hello, world!\", tableName: \"Greetings\", comment: \"A standard greeting\")","// Localizing strings in SwiftUI\n\nText(\"Hello, world!\", comment: \"A standard greeting\")","// Localizing strings elsewhere\n\nString(localized: \"Hello, world!\", comment: \"A standard greeting\")\n\nLocalizedStringResource(\"Hello World!\", bundle: #bundle, comment: \"A standard greeting\")","// Field for machine-translated strings in the XLIFF\n\n\u003ctrans-unit id=\"Grand Canyon\" xml:space=\"preserve\">\n  \u003csource>Grand Canyon\u003c/source>\n  \u003ctarget state=\"translated\" state-qualifier=\"leveraged-mt\">Grand Canyon\u003c/target>\n  \u003cnote>Name of the ‘Grand Canyon’ landmark.\u003c/note>\n\u003c/trans-unit>"]},"related":[{"id":"201","title":"Secure your apps with App Attest","gloss":"運用 App Attest 保護你的 App","gloss_en":"Protect your app with App Attest","category":"swift","categoryLabel":"Swift"},{"id":"258","title":"What’s new in Xcode 27","gloss":"Xcode 27 的新功能","gloss_en":"What's new in Xcode 27","category":"swift","categoryLabel":"Swift"},{"id":"262","title":"What's new in Swift","gloss":"Swift 有什麼新東西","gloss_en":"What's new in Swift","category":"swift","categoryLabel":"Swift 語言"},{"id":"265","title":"Build real-time apps and services with gRPC and Swift","gloss":"用 gRPC 與 Swift 打造即時 App 與服務","gloss_en":"Build real-time apps and services with gRPC and Swift","category":"swift","categoryLabel":"Swift"},{"id":"268","title":"Profile, fix, and verify: Improve app responsiveness with Instruments","gloss":"用 Instruments 剖析、修正並驗證 App 反應速度","gloss_en":"Profile, fix, and verify: Improve app responsiveness with Instruments","category":"swift","categoryLabel":"Swift"}]}</script>
