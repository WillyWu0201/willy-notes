<script id="d" type="application/json">{"s":{"id":"265","title":"Build real-time apps and services with gRPC and Swift","gloss":"用 gRPC 與 Swift 打造即時 App 與服務","category":"swift","categoryLabel":"Swift","duration":1465,"url":"https://developer.apple.com/videos/play/wwdc2026/265/","takeaway":"用 grpc-swift 與雙向串流 RPC，在 Swift App 與後端之間打造高效的即時體驗。","chapters":[[0,"Introduction"],[99,"Meet gRPC"],[133,"App overview and demo setup"],[210,"Defining the ListRaces RPC"],[218,"ListRaces RPC definition"],[270,"Setting up Xcode to generate gRPC code"],[355,"grpc-swift-proto-generator-config.json"],[384,"Add gRPC imports"],[398,"Create a gRPC client connected to a local server"],[434,"Call the ListRaces RPC and update the view"],[470,"Managing the gRPC client lifecycle"],[510,"ClientManager.swift"],[519,"Propagate ClientManager to child views"],[532,"Disconnect ClientManager when the scene enters the background phase"],[552,"Inject ClientManager into the view via @Environment"],[561,"Replace withGRPCClient with manager.withClient"],[576,"Protobuf message format and binary efficiency"],[581,"Using SwiftProtobuf"],[752,"Server"],[753,"Implementing a bidirectional streaming RPC"],[765,"Service"],[800,"swift_kart_service.proto"],[856,"FollowRace stub"],[878,"Implement the FollowRace RPC"],[999,"swift_kart_service.proto"],[1000,"swift_kart_service.proto"],[1016,"Navigation link to LiveStreamView"],[1052,"Call the FollowRace RPC in the LiveStreamView"],[1211,"Deploying the service"],[1255,"Containerfile"],[1316,"Deploy service"],[1342,"Target deployed service"],[1391,"Next steps"]],"points":[{"text":"介紹開源 RPC 框架 **gRPC**，以 **.proto** 定義服務與訊息（如 ListRaces），並在 Xcode 用 **grpc-swift-proto-generator** 產生 Swift 程式碼。","hot":false},{"text":"用 **withGRPCClient** 搭配 **HTTP2ClientTransport** 建立連線，並把產生的 client 包進服務 stub 呼叫 RPC。","hot":false},{"text":"以 **@Observable 的 ClientManager** 管理連線生命週期，透過 **@Environment** 注入並在 **scenePhase** 進入背景時斷線。","hot":false},{"text":"實作 **FollowRace 雙向串流 RPC**，用 **withThrowingTaskGroup** 同時讀取請求與推送即時的賽車位置與排名更新。","hot":true},{"text":"用 **SwiftProtobuf** 取得高效的二進位序列化，並以 **Containerfile** 打包後部署到 Cloud Run。","hot":false}],"apis":["GRPCCore","GRPCNIOTransportHTTP2","SwiftProtobuf","withGRPCClient","GRPCClient","HTTP2ClientTransport","GRPCServer","RPCAsyncSequence","RPCWriter","withThrowingTaskGroup","Mutex"],"audience":"想用 **gRPC 串接 Swift App 與後端、打造即時串流功能**的全端 Swift 開發者。","gloss_en":"Build real-time apps and services with gRPC and Swift","takeaway_en":"Use grpc-swift and bidirectional streaming RPCs to build high-performance real-time experiences between your Swift app and backend.","points_en":[{"text":"Introduces the open-source RPC framework **gRPC**, defining services and messages (like ListRaces) in **.proto** and generating Swift code in Xcode with **grpc-swift-proto-generator**.","hot":false},{"text":"Use **withGRPCClient** together with **HTTP2ClientTransport** to establish the connection, then wrap the generated client in a service stub to call RPCs.","hot":false},{"text":"Manage the connection lifecycle with an **@Observable ClientManager**, inject it via **@Environment**, and disconnect when **scenePhase** enters the background.","hot":false},{"text":"Implement the **FollowRace bidirectional streaming RPC**, using **withThrowingTaskGroup** to read requests and push live race position and ranking updates concurrently.","hot":true},{"text":"Use **SwiftProtobuf** for efficient binary serialization, then package with a **Containerfile** and deploy to Cloud Run.","hot":false}],"audience_en":"Full-stack Swift developers who want to **connect a Swift app and backend with gRPC to build real-time streaming features**.","summary":["由 Swift Server 團隊的 George 主講，示範如何用 **gRPC Swift** 在 app 與後端之間打造即時體驗。手寫網路程式碼既耗時又容易出錯，且文件未必同步；而 **gRPC** 這類框架讓你從規格產生程式碼，省時且消除錯誤。gRPC 是 CNCF 專案、業界廣泛採用的標準，與 OpenAPI 不同之處在於 API 是以「具輸入輸出的函式（remote procedure call）」而非 HTTP 來定義。整場以一個 go-kart 賽車聯盟 app（SwiftKart）為例，串連定義服務、產生程式碼、實作與部署。","服務以 **Protocol Buffers（Protobuf）** 的 .proto 檔定義。先定義一個 unary 的 **ListRaces** RPC，請求帶 limit、回應為 repeated Race，並 import Protobuf Well-Known Type 的 timestamp。在 Xcode 中加入 **grpc-swift-nio-transport** 與 **grpc-swift-protobuf** 兩個相依套件，於 Build Phases 掛上 **GRPCProtobufGenerator** build plugin，並以 JSON config 設定只產生 messages 與 clients。接著在 RaceScheduleView 用 withGRPCClient 建立連向本機 server 的 client，呼叫 listRaces 並把回應映射到 view 的資料模型。為避免每個 view 都各自建立連線，課程引入 **ClientManager**（@Observable、以 Mutex 管理連線狀態），透過 environment 傳遞並在 scene 進入 background 時 disconnect 以釋放資源。Protobuf 以欄位編號做二進位序列化，訊息大小約為等價 JSON 的一半，對行動裝置與網路不佳時特別有利。","重點段落示範 gRPC 的一級串流支援。RPC 分為 unary、client streaming、server streaming 與 **bidirectional streaming** 四種。課程以雙向串流的 **FollowRace** 提供即時賽事更新：請求串流告知要追蹤的賽事與訂閱的 event types，回應串流則回傳 KartLocations 或 Standings（以 Protobuf 的 oneof 表達，類似帶關聯值的 Swift enum）。server 端以 SimpleServiceProtocol 實作，FollowRace 用 **withThrowingTaskGroup** 同時處理兩個資料流：一個 task 從 tracker 取得事件並依目前訂閱過濾、寫回 client，另一邊持續消費請求串流以更新訂閱集合（以 Mutex 保護），請求串流結束即 cancelAll。app 端在 LiveStreamView 用 AsyncStream 追蹤 showLeaderboard 變化、於 FollowRace 的兩個 closure 分別寫請求與處理回應，把 kart 位置畫到地圖、把 standings 顯示在排行榜。","最後示範部署到雲端。撰寫 **Containerfile**：以 swift:latest 為 builder，release 模式建置 server，再用 multi-stage build 把 binary 複製到較小的 swift:slim runtime image，expose 8080 並設定 entrypoint。用 **gcloud run deploy** 部署到 Google Cloud Run（指定 --use-http2 與 --allow-unauthenticated），取得 URL 後在 ClientManager 把 transport 目標改為服務的 DNS 名稱，並把 transportSecurity 由 plaintext 改為 **TLS**。實務takeaway：gRPC Swift 從定義、產生、實作到部署都讓 app-to-server 流程更簡單，並具備與 Swift OTel、service lifecycle 整合及自訂 transport、name resolver、client-side load balancing 等進階功能。"],"deepdive":[{"t":0,"title":"Introduction","body":"Swift Server 團隊的 **George** 開場，指出動態 app 體驗仰賴向 server 取資料，但手寫網路程式碼耗時且容易因文件過時或失誤而出錯。更好的做法是從作為 source of truth 的規格產生程式碼，省時並消除錯誤，這種效益能擴展到所有要互動的 API。"},{"t":99,"title":"Meet gRPC","body":"介紹 **gRPC** 是一個做 remote procedure call 的框架，為 CNCF 專案且業界廣泛採用。和 OpenAPI 一樣是從規格產生程式碼，但 gRPC 的 API 以具輸入輸出的「函式」而非 HTTP 來定義，讓你能快速開始與服務互動。"},{"t":133,"title":"App overview and demo setup","body":"以一個附近新成立的 go-kart 賽車聯盟為情境，其後端追蹤賽程與即時賽事資料。George 已備好 iOS app 的幾個 view 並填入範例資料（可列出賽事、點入看細節），目標是改用 **gRPC** 從 server 取得內容。並以 listRaces 這個概念性函式說明 request 由 client 送出、server 執行後回傳賽事清單。"},{"t":210,"title":"Defining the ListRaces RPC","body":"規劃流程：先定義服務 API，再加相依套件、設定 gRPC build plugin 產生程式碼，最後更新 app 呼叫 server。最常見的 gRPC 服務規格格式即 **Protocol Buffers**。"},{"t":218,"title":"ListRaces RPC definition","body":"在 .proto 中定義服務與一個 **ListRaces** RPC：輸入 ListRacesRequest、輸出 ListRacesResponse。request 有一個 int 欄位 limit（預設 100），每個欄位都有唯一 field number；response 含 repeated Race。Race 另以 message 定義，含 name、location、championship（string）、laps（int）與 start_time（timestamp），timestamp 屬 Protobuf **Well-Known Types**，需 import 其定義。"},{"t":270,"title":"Setting up Xcode to generate gRPC code","body":"在 Xcode 的 Project Editor 的 Package Dependencies 加入兩個相依套件：提供高效能網路（基於 SwiftNIO）的 **grpc-swift-nio-transport**，與提供程式碼產生 build plugin 的 **grpc-swift-protobuf**。接著在 app target 的 Build Phases 展開 Run Build Tool Plug-ins，加入 **GRPCProtobufGenerator**。"},{"t":355,"title":"grpc-swift-proto-generator-config.json","body":"plugin 會掃描 target 目錄中的 proto 檔，並以 JSON config 設定要產生什麼。因為這是 app，只需 **clients** 與 **messages**，不需 servers。設定完成後重新編譯即可產生程式碼，首次使用時基於安全會要求信任該 plugin。"},{"t":384,"title":"Add gRPC imports","body":"在 RaceScheduleView 匯入所需模組：提供共用 runtime 元件的 **GRPCCore**、提供網路程式碼的 **GRPCNIOTransportHTTP2**，以及讓你操作 Protobuf 訊息的 **SwiftProtobuf**。"},{"t":398,"title":"Create a gRPC client connected to a local server","body":"在 view 加上 **task** modifier，於其中用 **withGRPCClient** 建立 client，並包在 do-catch 中先 print 錯誤。透過設定可選擇網路實作，此處用 SwiftNIO 連到本機 Mac 上 127.0.0.1:8080 的 server。傳入 closure 的 client 只知道 server、不知道 service。"},{"t":434,"title":"Call the ListRaces RPC and update the view","body":"用產生的程式碼建立 **SwiftKartService.Client** 並以 gRPC client 初始化，接著建立 ListRacesRequest、await 呼叫 **listRaces**，最後把 server 回應 map 成 view 使用的資料模型 RaceInfo，便取得了賽程（例如 Finite Loops 即將開賽）。"},{"t":470,"title":"Managing the gRPC client lifecycle","body":"目前每次 view 出現都建立新 client，使每個 view 各自建立連線、徒增延遲。改善做法是建立一個 client 並透過 app environment 共享以重用連線，同時在 app 進入背景時 disconnect 以釋放資源。"},{"t":510,"title":"ClientManager.swift","body":"加入事先寫好的 **ClientManager**：標註 @Observable 與 Sendable，內部用 **Mutex** 保護連線狀態（connected/disconnected）。withClient 會 lazily 連線（connectIfNecessary），建立 GRPCClient 並以 Task 執行 runConnections；disconnect 則取出 client 並呼叫 beginGracefulShutdown 做優雅關閉。"},{"t":519,"title":"Propagate ClientManager to child views","body":"在 app entry point 的 SwiftKartApp 建立一個 ClientManager 實例，並透過 **.environment(manager)** modifier 將其提供給子 view 使用。"},{"t":532,"title":"Disconnect ClientManager when the scene enters the background phase","body":"新增 **@Environment(\\.scenePhase)** 屬性並以 onChange 監看；當 newPhase 為 **.background** 時呼叫 manager.disconnect()。因為 manager 是被請求 client 時才 lazily 連線，所以進入 active 狀態時不需特別處理。"},{"t":552,"title":"Inject ClientManager into the view via @Environment","body":"在 RaceScheduleView 以 **@Environment(ClientManager.self) var manager** 取得共享的 manager，並讓它在 preview 中也可用。"},{"t":561,"title":"Replace withGRPCClient with manager.withClient","body":"把原本直接呼叫 withGRPCClient 的程式碼改為 **manager.withClient { client in ... }**，讓請求改走共享、可重用連線的 manager，listRaces 的呼叫與映射邏輯維持不變。"},{"t":576,"title":"Protobuf message format and binary efficiency","body":"除了服務 API，Protobuf 也提供訊息交換格式。gRPC 在 client 與 server 間傳送時會序列化成二進位，且以唯一的 **field number**（而非名稱）識別欄位，因此 Protobuf 訊息約為等價 JSON 的一半大小，對行動 app 在網路不佳時尤其有利。"},{"t":581,"title":"Using SwiftProtobuf","body":"**SwiftProtobuf** 有程式碼產生器，讓你直接以 Swift 型別操作訊息。示範建立一個 Race 訊息、填入 name、location、start_time、laps、championship 與 drivers，並呼叫 **serializedBytes()** 取得其二進位表示。此效率也利於 service-to-service、IPC（如 Apple 開源的 Containerization framework 透過 virtual socket 在主機與 Linux VM 間溝通），gRPC Swift 亦是 Private Cloud Compute、iCloud Keychain/Photos、SharePlay 檔案分享乃至內部 OS build/release 系統的關鍵元件。"},{"t":752,"title":"Server","body":"示範 server 端：建立一個以 transport 與 services 初始化的 **GRPCServer**（此處 http2NIOPosix、plaintext、127.0.0.1:8080），呼叫 **serve()** 啟動。"},{"t":753,"title":"Implementing a bidirectional streaming RPC","body":"介紹 gRPC 的一級串流支援與四種 RPC：unary、client streaming（如每台 kart 串流遙測）、server streaming（如即時文字賽評）與 **bidirectional streaming**（雙方皆可送任意數量訊息）。George 計畫以雙向串流提供即時賽事更新：請求訊息告知訂閱的事件類型，回應訊息回傳相關事件，客戶端可隨需求變更再送訊息。"},{"t":765,"title":"Service","body":"service 是一個實作 build plugin 產生之協定的型別。展示先前實作的 listRaces：一個 async function，接受 request、查詢 RaceDB 後填入 ListRacesResponse 並回傳。"},{"t":800,"title":"swift_kart_service.proto","body":"更新服務定義加入 **FollowRace** RPC，因為串流請求與回應，需在輸入輸出前加上 **stream** 關鍵字。同時定義訊息：FollowRaceRequest 含 race_name 與以 enum 表示的 event_types；FollowRaceResponse 以 **oneof**（類似帶關聯值的 Swift enum）承載 KartLocations 或 Standings 兩種訊息之一。"},{"t":856,"title":"FollowRace stub","body":"在 server 重新建置以產生程式碼後，因協定新增了未實作的需求而出現 build error，先填出一個 stub：丟出 code 為 **.unimplemented** 的 RPCError，作為後續實作的起點。"},{"t":878,"title":"Implement the FollowRace RPC","body":"實作雙向串流的 FollowRace：request 是請求訊息的 async sequence、response 是寫回訊息的 writer。用 **withThrowingTaskGroup** 同時處理兩個資料流：先 await 第一個請求訊息取得賽事名與訂閱（以 **Mutex** 保護的 Set 儲存事件型別）；一個 task 從 tracker 取得事件、依目前訂閱過濾、填入 FollowRaceResponse（map kart locations 與 standings）後 write 給 client。主流程持續消費請求串流以更新訂閱集合，請求串流結束即視為不再需要事件，呼叫 **cancelAll** 停止送出。"},{"t":999,"title":"swift_kart_service.proto","body":"切回 app 端，更新 app 專案的 proto 檔以納入新的 FollowRace RPC 與相關訊息，使 app 端與 server 端的服務定義一致。"},{"t":1000,"title":"swift_kart_service.proto","body":"在 app 中重新建置專案以重新產生 gRPC 程式碼，讓 client 取得呼叫 FollowRace 與處理新訊息（含 drivers 欄位）所需的型別。"},{"t":1016,"title":"Navigation link to LiveStreamView","body":"在 RaceInfoView 加入一個 **NavigationLink** 導向事先建立的 **LiveStreamView**，作為進入即時串流畫面的入口（Text 標示為 \"Live stream\"）。"},{"t":1052,"title":"Call the FollowRace RPC in the LiveStreamView","body":"在 **LiveStreamView**（顯示繪出各 kart 位置標註的地圖，並有開啟 leaderboard sheet 的工具列按鈕）中呼叫 FollowRace。透過 environment 注入 manager，於 task 中 manager.withClient 建立 kart client；FollowRace 有兩個 closure，一個寫請求、一個處理回應。以 **AsyncStream** 追蹤 showLeaderboard 變化（並 yield 初始值），在請求 closure 依其值組裝 event_types（顯示排行榜時加上 .standings）並寫給 server；回應 closure 則迭代訊息，用 handleEvent 把 kart locations 更新到地圖、把 standings 更新到排行榜。"},{"t":1211,"title":"Deploying the service","body":"由於服務只跑在本機，需部署到雲端讓所有使用者可用。George 使用 Google Cloud Platform（也可選 AWS、Fly.io 等），目標是 Linux：把 server 執行檔打包成含 runtime 相依的 container image、推到 registry、建立 deployment，最後更新 app 指向已部署的服務。"},{"t":1255,"title":"Containerfile","body":"撰寫 **Containerfile**：以 swift:latest 為 base image，設定工作目錄、複製套件 manifest 與原始碼，以 release 模式 swift build 出 server 並複製到已知位置。再以 **multi-stage build** 把 binary 複製進較小的 **swift:slim** runtime image，避免帶上整個 Swift toolchain，最後 expose 8080 並設定 entrypoint 為 server。"},{"t":1316,"title":"Deploy service","body":"在終端機用 **gcloud run deploy** 部署，提供 deployment 名稱、image 名稱與 region，並指定服務使用 **http2**（--use-http2）與允許未驗證請求（--allow-unauthenticated）。部署完成後印出服務 URL，供更新 client 時使用。"},{"t":1342,"title":"Target deployed service","body":"回到 app 開啟 ClientManager，把 makeTransport 的連線目標改為服務的 **DNS 名稱**（.dns(host:)），並把 transportSecurity 由 plaintext 改為 **TLS**，讓 app 連向雲端已部署的服務（成功觀賞到 Finite Loops 賽事即時畫面）。"},{"t":1391,"title":"Next steps","body":"總結 gRPC Swift 如何從定義服務、產生程式碼到實作與部署，讓即時體驗與 app-to-server 溝通更簡單。並提及進階能力：與 **Swift OTel**、**Swift service lifecycle** 等套件整合，以及自訂 transport、name resolver 與 client-side load balancing。建議動手把部分 app 互動原型化，或試用 GitHub 上開源專案的教學與範例，甚至參與貢獻。"}],"summary_en":["Presented by George of the Swift Server team, this session shows how to build real-time experiences between an app and its backend with **gRPC Swift**. Hand-crafting networking code is time-consuming and error-prone, and docs aren't always up to date; frameworks like **gRPC** let you generate code from a specification, saving time and eliminating mistakes. gRPC is a CNCF project and widely adopted standard, and unlike OpenAPI it defines APIs in terms of functions (remote procedure calls) with inputs and outputs rather than HTTP. The whole talk uses a go-kart racing league app (SwiftKart) to connect defining a service, generating code, implementing it, and deploying.","The service is defined in a **Protocol Buffers (Protobuf)** .proto file. A unary **ListRaces** RPC is defined first, with a request carrying limit and a response of repeated Race, importing Protobuf's Well-Known timestamp type. In Xcode you add two dependencies, **grpc-swift-nio-transport** and **grpc-swift-protobuf**, attach the **GRPCProtobufGenerator** build plugin in Build Phases, and use a JSON config to generate only messages and clients. RaceScheduleView then uses withGRPCClient to connect to a local server, calls listRaces, and maps the response into the view's model. To avoid each view making its own connection, the session introduces **ClientManager** (an @Observable that guards connection state with a Mutex), propagated via the environment and disconnected when the scene enters the background to free resources. Because Protobuf serializes to binary keyed by field numbers, messages are roughly half the size of equivalent JSON, which is especially valuable for mobile apps on poor networks.","A central section demonstrates gRPC's first-class streaming support. RPCs come in four kinds: unary, client streaming, server streaming, and **bidirectional streaming**. The bidirectional **FollowRace** RPC delivers live race updates: request messages declare which event types to subscribe to, and response messages return KartLocations or Standings (expressed with Protobuf's oneof, like a Swift enum with associated values). The server implements it via SimpleServiceProtocol, using **withThrowingTaskGroup** to handle two streams at once: one task pulls events from the tracker, filters them to the current subscriptions, and writes them back, while the main flow keeps consuming request messages to update the subscription set (guarded by a Mutex) and calls cancelAll when the request stream ends. On the app side, LiveStreamView uses an AsyncStream to track showLeaderboard changes and the RPC's two closures to write requests and handle responses, drawing kart positions on a map and standings in a leaderboard.","Finally it shows cloud deployment. A **Containerfile** uses swift:latest as the builder, builds the server in release mode, then uses a multi-stage build to copy the binary into a smaller swift:slim runtime image, exposing 8080 and setting an entrypoint. **gcloud run deploy** ships it to Google Cloud Run (with --use-http2 and --allow-unauthenticated); after getting the URL, ClientManager's transport target is changed to the service's DNS name and transportSecurity is switched from plaintext to **TLS**. The takeaway: gRPC Swift simplifies the whole app-to-server workflow from definition to deployment, and offers advanced features like integration with Swift OTel and service lifecycle, plus custom transports, name resolvers, and client-side load balancing."],"deepdive_en":[{"t":0,"title":"Introduction","body":"**George** of the Swift Server team opens by noting that dynamic app experiences depend on fetching data from a server, but hand-crafting networking code is time-consuming and error-prone when docs go stale or mistakes creep in. A better approach is to generate code from a specification that acts as the source of truth, saving time and eliminating errors, with benefits that scale across all the APIs you interact with."},{"t":99,"title":"Meet gRPC","body":"**gRPC** is introduced as a framework for making remote procedure calls, a CNCF project and widely adopted standard. Like OpenAPI it works with code generated from a specification, but gRPC defines APIs in terms of functions with inputs and outputs rather than HTTP, letting you start working with services quickly."},{"t":133,"title":"App overview and demo setup","body":"The scenario is a new nearby go-kart racing league whose backend tracks the schedule and live race data. George has prepared several app views populated with example data (listing races and tapping in for details) and wants to use **gRPC** to fetch this from the server. He illustrates listRaces conceptually: the client sends a request, the server executes the function, and replies with the list of races."},{"t":210,"title":"Defining the ListRaces RPC","body":"The plan: define the service API, add dependencies, configure the gRPC build plugin to generate code, then update the app to call the server. The most common format for specifying gRPC services is **Protocol Buffers**."},{"t":218,"title":"ListRaces RPC definition","body":"In the .proto, a service is defined with one **ListRaces** RPC taking a ListRacesRequest and returning a ListRacesResponse. The request has one int field limit (default 100), and every field is assigned a unique field number; the response contains a repeated Race. Race is a separate message with name, location, championship (strings), laps (int), and start_time (a timestamp). The timestamp is one of Protobuf's **Well-Known Types**, so its definition must be imported."},{"t":270,"title":"Setting up Xcode to generate gRPC code","body":"In Xcode's Project Editor, Package Dependencies, add two dependencies: **grpc-swift-nio-transport** for high-performance networking built on SwiftNIO, and **grpc-swift-protobuf** which provides a build plugin to generate gRPC code from the proto. Then, in the app target's Build Phases, expand Run Build Tool Plug-ins and add **GRPCProtobufGenerator**."},{"t":355,"title":"grpc-swift-proto-generator-config.json","body":"The plugin scans the target directory for proto files and is configured with a JSON config that controls what gets generated. Because this is an app, only **clients** and **messages** are needed, not servers. Recompiling then generates the code, and the first time you use it you're asked to trust the plug-in as a security measure."},{"t":384,"title":"Add gRPC imports","body":"In RaceScheduleView, import the needed modules: **GRPCCore** for common gRPC runtime components, **GRPCNIOTransportHTTP2** for networking code, and **SwiftProtobuf** to interact with Protobuf messages."},{"t":398,"title":"Create a gRPC client connected to a local server","body":"A **task** modifier is added to the view, inside which **withGRPCClient** creates a client within a do-catch that just prints errors for now. gRPC lets you configure the networking implementation; here a SwiftNIO-based one connects to a server running locally at 127.0.0.1:8080. The client passed to the closure only knows about the server, not the service."},{"t":434,"title":"Call the ListRaces RPC and update the view","body":"Using the generated code, a **SwiftKartService.Client** is created wrapping the gRPC client, a ListRacesRequest is built, **listRaces** is awaited, and the server's response is mapped into the view's RaceInfo model, fetching the race schedule (for example, Finite Loops starting soon)."},{"t":470,"title":"Managing the gRPC client lifecycle","body":"Currently the app creates a new client every time the view appears, so each view establishes its own connection and adds latency. The fix is to create one client and share it via the app's environment so connections can be reused, and to disconnect clients when the app enters the background to free resources."},{"t":510,"title":"ClientManager.swift","body":"A previously written **ClientManager** is added: marked @Observable and Sendable, it guards connection state (connected/disconnected) with a **Mutex**. withClient connects lazily (connectIfNecessary), creating a GRPCClient and running its connections in a Task; disconnect takes the client and calls beginGracefulShutdown for an orderly shutdown."},{"t":519,"title":"Propagate ClientManager to child views","body":"In the app entry point SwiftKartApp, a ClientManager instance is created and made available to child views via the **.environment(manager)** modifier."},{"t":532,"title":"Disconnect ClientManager when the scene enters the background phase","body":"A **@Environment(\\.scenePhase)** property is added and watched with onChange; when newPhase is **.background**, manager.disconnect() is called. Since the manager connects lazily when asked for a client, nothing special is needed for the active state."},{"t":552,"title":"Inject ClientManager into the view via @Environment","body":"RaceScheduleView obtains the shared manager with **@Environment(ClientManager.self) var manager**, and it is also made available in the preview."},{"t":561,"title":"Replace withGRPCClient with manager.withClient","body":"The direct withGRPCClient call is replaced with **manager.withClient { client in ... }** so requests use the shared, reusable connection, while the listRaces call and mapping logic stay the same."},{"t":576,"title":"Protobuf message format and binary efficiency","body":"Beyond the service API, Protobuf provides a message interchange format. gRPC serializes messages to binary between client and server, identifying each field by its unique **field number** rather than name, so a Protobuf message is roughly half the size of the equivalent JSON, which is especially helpful for mobile apps on poor networks."},{"t":581,"title":"Using SwiftProtobuf","body":"**SwiftProtobuf** has a code generator so you can work directly with Swift types representing your messages. The demo creates a Race message, populates name, location, start_time, laps, championship, and drivers, then calls **serializedBytes()** to get its binary form. This efficiency also benefits service-to-service and IPC (like Apple's open-source Containerization framework communicating over virtual sockets between host and a Linux VM), and gRPC Swift is a key component in Private Cloud Compute, iCloud Keychain/Photos, SharePlay file sharing, and internal OS build/release systems."},{"t":752,"title":"Server","body":"The server side: a **GRPCServer** is created with a transport and the services it offers (here http2NIOPosix, plaintext, 127.0.0.1:8080) and started by calling **serve()**."},{"t":753,"title":"Implementing a bidirectional streaming RPC","body":"gRPC's first-class streaming is introduced with four RPC kinds: unary, client streaming (each kart streaming telemetry), server streaming (a live commentary feed), and **bidirectional streaming** (both sides send any number of messages). George plans bidirectional streaming for live race updates: request messages declare which event types the client subscribes to, response messages return the relevant events, and the client can send more messages when its interests change."},{"t":765,"title":"Service","body":"A service is a type implementing a protocol generated by the build plugin. The earlier listRaces is shown: an async function that takes a request, queries the RaceDB, populates ListRacesResponse, and returns it."},{"t":800,"title":"swift_kart_service.proto","body":"The service definition is updated to add the **FollowRace** RPC; because it streams requests and responses, the **stream** keyword is added before input and output. The messages are defined: FollowRaceRequest holds race_name and event_types as an enum; FollowRaceResponse uses a **oneof** (like a Swift enum with associated values) carrying either KartLocations or Standings."},{"t":856,"title":"FollowRace stub","body":"After rebuilding the server to regenerate code, a build error appears because the protocol has a new unimplemented requirement, so a stub is filled in that throws an **RPCError** with code .unimplemented as the starting point for the implementation."},{"t":878,"title":"Implement the FollowRace RPC","body":"FollowRace is implemented for bidirectional streaming: the request is an async sequence of messages and the response is a writer. A **withThrowingTaskGroup** handles both streams: it awaits the first request to learn the race name and subscriptions (stored in a Set guarded by a **Mutex**); one task pulls events from the tracker, filters to the current subscriptions, populates FollowRaceResponse (mapping kart locations and standings), and writes to the client. The main flow keeps consuming request messages to update the subscriptions, and treats the end of the request stream as a signal to **cancelAll** and stop sending."},{"t":999,"title":"swift_kart_service.proto","body":"Back on the app side, the app project's proto file is updated to include the new FollowRace RPC and messages, keeping the app's and server's service definitions in sync."},{"t":1000,"title":"swift_kart_service.proto","body":"The app project is rebuilt to regenerate the gRPC code, giving the client the types needed to call FollowRace and handle the new messages (including the drivers field)."},{"t":1016,"title":"Navigation link to LiveStreamView","body":"A **NavigationLink** to the previously created **LiveStreamView** is added in RaceInfoView as the entry point to the live streaming screen, with its Text labeled \"Live stream\"."},{"t":1052,"title":"Call the FollowRace RPC in the LiveStreamView","body":"In **LiveStreamView** (which shows a map drawing each kart's position and a toolbar button opening a leaderboard sheet), FollowRace is called. The manager is injected via the environment, and within a task manager.withClient creates a kart client; FollowRace has two closures, one to write requests and one to handle responses. An **AsyncStream** tracks showLeaderboard changes (yielding the initial value); the request closure assembles event_types based on it (adding .standings when the leaderboard is shown) and writes to the server, while the response closure iterates messages and uses handleEvent to update kart locations on the map and standings in the leaderboard."},{"t":1211,"title":"Deploying the service","body":"Since the service runs locally, it must be deployed to the cloud so all users can reach it. George uses Google Cloud Platform (AWS or Fly.io would also work) targeting Linux: package the server executable into a container image with its runtime dependencies, publish to a registry, create a deployment, then update the app to target the deployed service."},{"t":1255,"title":"Containerfile","body":"A **Containerfile** uses swift:latest as the base image, sets the working directory, copies the package manifest and sources, builds the server in release mode, and copies it to a known location. A **multi-stage build** then copies the binary into a smaller **swift:slim** runtime image to avoid shipping the whole Swift toolchain, exposes 8080, and sets the entry point to the server."},{"t":1316,"title":"Deploy service","body":"In the terminal, **gcloud run deploy** deploys the service with the deployment name, image name, and region, specifying that it uses **http2** (--use-http2) and allows unauthenticated requests (--allow-unauthenticated). When deployment finishes it prints the service URL needed to update the client."},{"t":1342,"title":"Target deployed service","body":"Back in the app, ClientManager is opened and makeTransport's connect target is changed to the service's **DNS name** (.dns(host:)), and transportSecurity is switched from plaintext to **TLS**, so the app connects to the deployed cloud service (successfully showing the Finite Loops race live)."},{"t":1391,"title":"Next steps","body":"The session recaps how gRPC Swift goes from defining a service and generating code to implementing and deploying it, simplifying real-time experiences and app-to-server communication. It mentions advanced capabilities: integration with packages like **Swift OTel** and **Swift service lifecycle**, plus custom transports, name resolvers, and client-side load balancing. The suggestion is to prototype part of your app-to-server interactions, try the tutorials and examples in the open-source GitHub project, and even contribute."}],"code":["edition = \"2024\";\n\nimport \"google/protobuf/timestamp.proto\";\n\nservice SwiftKartService {\n  rpc ListRaces(ListRacesRequest) returns (ListRacesResponse);\n}\n\nmessage ListRacesRequest {\n  int32 limit = 1 [default = 100];\n}\n\nmessage ListRacesResponse {\n  repeated Race races = 1;\n}\n\nmessage Race {\n  string name = 1;\n  string location = 2;\n  google.protobuf.Timestamp start_time = 3;\n  int32 laps = 4;\n  string championship = 5;\n}","{\n    \"generate\": {\n        \"clients\": true,\n        \"servers\": false,\n        \"messages\": true\n    }\n}","import GRPCCore\nimport GRPCNIOTransportHTTP2\nimport SwiftProtobuf",".task {\n    do {\n        try await withGRPCClient(\n            transport: .http2NIOTS(\n                address: .ipv4(host: \"127.0.0.1\", port: 8080),\n                transportSecurity: .tls\n            )\n        ) { client in\n            \u003c#code#>\n        }\n    } catch {\n        print(\"gRPC error: \\(error)\")\n    }\n}",".task {\n    do {\n        try await withGRPCClient(\n            transport: .http2NIOTS(\n                address: .ipv4(host: \"127.0.0.1\", port: 8080),\n                transportSecurity: .tls\n            )\n        ) { client in\n            let kart = SwiftKartService.Client(wrapping: client)\n            let request = ListRacesRequest()\n            let response = try await kart.listRaces(request)\n            self.races = response.races.map { race in\n                RaceInfo(\n                    name: race.name,\n                    location: race.location,\n                    startTime: race.startTime.date,\n                    championship: race.championship,\n                    laps: Int(race.laps),\n                    drivers: race.drivers\n                )\n            }\n        }\n    } catch {\n        print(\"gRPC error: \\(error)\")\n    }\n}","import GRPCCore\nimport GRPCNIOTransportHTTP2\nimport Synchronization\nimport SwiftUI\n\n@Observable\nfinal class ClientManager: Sendable {\n    fileprivate let state = Mutex(State.disconnected)\n\n    static func makeTransport() throws -> HTTP2ClientTransport.TransportServices {\n        try .http2NIOTS(\n            target: .ipv4(address: \"127.0.0.1\", port: 8080),\n            transportSecurity: .plaintext\n        )\n    }\n\n    func withClient(\n        body: (_ client: GRPCClient\u003cHTTP2ClientTransport.TransportServices>) async throws -> Void\n    ) async throws {\n        let client = try connectIfNecessary()\n        try await body(client)\n    }\n\n    private func connectIfNecessary() throws -> GRPCClient\u003cHTTP2ClientTransport.TransportServices> {\n        try self.state.withLock { state in\n            try state.connectIfNecessary()\n        }\n    }\n\n    func disconnect() {\n        let client = self.state.withLock { state in\n            state.disconnect()\n        }\n\n        client?.beginGracefulShutdown()\n    }\n}\n\nextension ClientManager {\n    enum State {\n        case connected(GRPCClient\u003cHTTP2ClientTransport.TransportServices>, Task\u003cVoid, any Error>)\n        case disconnected\n    }\n}\n\nextension ClientManager.State {\n    mutating func connectIfNecessary() throws -> GRPCClient\u003cHTTP2ClientTransport.TransportServices> {\n        switch self {\n        case .connected(let client, _):\n            return client\n\n        case .disconnected:\n            let client = try GRPCClient(transport: ClientManager.makeTransport())\n            let task = Task { try await client.runConnections() }\n            self = .connected(client, task)\n            return client\n        }\n    }\n\n    mutating func disconnect() -> GRPCClient\u003cHTTP2ClientTransport.TransportServices>? {\n        switch self {\n        case .connected(let client, _):\n            self = .disconnected\n            return client\n        case .disconnected:\n            return nil\n        }\n    }\n}","import SwiftUI\n\n@main\nstruct SwiftKartApp: App {\n    let manager = ClientManager()\n\n    var body: some Scene {\n        WindowGroup {\n            RaceScheduleView()\n                .environment(manager)\n        }\n    }\n}","import SwiftUI\n\n@main\nstruct SwiftKartApp: App {\n    let manager = ClientManager()\n    @Environment(\\.scenePhase) private var scenePhase\n\n    var body: some Scene {\n        WindowGroup {\n            RaceScheduleView()\n                .environment(manager)\n        }\n        .onChange(of: scenePhase) { _, newPhase in\n            switch newPhase {\n            case .background :\n                manager.disconnect()\n            case .inactive, .active:\n                break\n            @unknown default:\n                break\n            }\n        }\n    }\n}","@Environment(ClientManager.self) var manager",".task {\n    do {\n        try await manager.withClient { client in\n            let kart = SwiftKartService.Client(wrapping: client)\n            let request = ListRacesRequest()\n            let response = try await kart.listRaces(request)\n            self.races = response.races.map { race in\n                RaceInfo(\n                    name: race.name,\n                    location: race.location,\n                    startTime: race.startTime.date,\n                    championship: race.championship,\n                    laps: Int(race.laps),\n                    drivers: race.drivers\n                )\n            }\n        }\n    } catch {\n        print(\"gRPC error: \\(error)\")\n    }\n}","var race = Race()\nrace.name = \"Duck Pond Dash\"\nrace.location = \"Apple Park, Cupertino\"\nrace.startTime = .init(roundingTimeIntervalSince1970: 1_781_198_600)\nrace.laps = 6\nrace.championship = \"Corporate Cup\"\nrace.drivers = [\"Monty\", \"Pepper\", \"Mycroft\", \"Pancakes\", \"Duke\", \"Kiko\", \"Sissi\", \"Bo\"]\n\ntry race.serializedBytes()","let server = GRPCServer(\n    transport: .http2NIOPosix(\n        address: .ipv4(host: \"127.0.0.1\", port: 8080),\n        transportSecurity: .plaintext\n    ),\n    services: [Service()]\n)\ntry await server.serve()"]},"related":[{"id":"201","title":"Secure your apps with App Attest","gloss":"運用 App Attest 保護你的 App","gloss_en":"Protect your app with App Attest","category":"swift","categoryLabel":"Swift"},{"id":"213","title":"Translate your app using agents in Xcode","gloss":"在 Xcode 中運用 agent 翻譯你的 App","gloss_en":"Translate your app using agents in Xcode","category":"swift","categoryLabel":"Swift"},{"id":"258","title":"What’s new in Xcode 27","gloss":"Xcode 27 的新功能","gloss_en":"What's new in Xcode 27","category":"swift","categoryLabel":"Swift"},{"id":"262","title":"What's new in Swift","gloss":"Swift 有什麼新東西","gloss_en":"What's new in Swift","category":"swift","categoryLabel":"Swift 語言"},{"id":"268","title":"Profile, fix, and verify: Improve app responsiveness with Instruments","gloss":"用 Instruments 剖析、修正並驗證 App 反應速度","gloss_en":"Profile, fix, and verify: Improve app responsiveness with Instruments","category":"swift","categoryLabel":"Swift"}]}</script>
