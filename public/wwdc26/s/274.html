<script id="d" type="application/json">{"s":{"id":"274","title":"What’s new in SwiftData","gloss":"SwiftData 的新功能","category":"swift","categoryLabel":"Swift","duration":773,"url":"https://developer.apple.com/videos/play/wwdc2026/274/","takeaway":"SwiftData 新增分區擷取、以 Codable 持久化自訂與第三方型別，以及 ResultsObserver 與 HistoryObserver 來觀察資料變動與同步歷史。","chapters":[[0,"Introduction"],[1,"Sectioned fetching"],[53,"Sectioning your fetches"],[176,"Using custom types"],[299,"Using Codable"],[386,"Observing data stores with ResultsObserver"],[500,"// Use observation to update map bounds"],[501,"// Using HistoryObserver to sync with a server"],[581,"Observing history with HistoryObserver"],[740,"Next steps"]],"points":[{"text":"新的**分區擷取**：在 **@Query** 中用 sectionBy 直接依屬性分組，搭配 ForEach 走訪 sections 渲染分區 List。","hot":true},{"text":"可用 **@Attribute(.codable)** 與 Codable 巢狀型別持久化**自訂及第三方型別**（如 MKMapItem.Identifier）。","hot":false},{"text":"**ResultsObserver** 讓你在 SwiftUI 之外觀察查詢結果變動（例如更新地圖邊界）。","hot":false},{"text":"**HistoryObserver** 搭配 withContinuousObservation 追蹤資料變更歷史，適合與伺服器同步。","hot":false}],"apis":["SwiftData","Query","Attribute","Codable","ResultsObserver","HistoryObserver","ModelContext","withContinuousObservation"],"audience":"**使用 SwiftData 做資料持久化**、需要分區顯示、自訂型別儲存或與後端同步的 App 開發者。","gloss_en":"What's new in SwiftData","takeaway_en":"SwiftData adds sectioned fetching, persisting custom and third-party types with Codable, and ResultsObserver and HistoryObserver for observing data changes and sync history.","points_en":[{"text":"New **sectioned fetching**: use sectionBy in **@Query** to group directly by a property, then iterate sections with ForEach to render a sectioned List.","hot":true},{"text":"Use **@Attribute(.codable)** with nested Codable types to persist **custom and third-party types** (such as MKMapItem.Identifier).","hot":false},{"text":"**ResultsObserver** lets you observe changes to query results outside of SwiftUI (for example, to update map bounds).","hot":false},{"text":"**HistoryObserver** with withContinuousObservation tracks the history of data changes, ideal for syncing with a server.","hot":false}],"audience_en":"App developers **using SwiftData for data persistence** who need sectioned display, custom type storage, or backend syncing.","summary":["本場由 SwiftData 團隊工程師 Thomas 介紹 Apple 2027 版本中 SwiftData 的新功能，並以多年來持續開發、用於追蹤旅行計畫的範例 app **SampleTrips** (採 SwiftData 持久化、SwiftUI 介面) 貫穿全場。第一個主題是 **sectioned fetching**：`@Query` 新增 `sectionBy` 參數，只要傳入從 model root 指向字串的 KeyPath (例如 `\\.destination`)，即可把結果依該屬性分組。Query 的 wrapped value 仍是 `[Trip]`，但透過底線前綴的 `_trips` 可取得 `sections`，搭配巢狀 `ForEach` 與 `Section`，並以每個 section 的 `id` (KeyPath 對應值) 當作標題，輕鬆做出依目的地分組的清單。","第二個主題是儲存自訂型別。範例想把 MapKit 搜尋到的座標與 **MKMapItem.Identifier** 存入 Trip model，但因為 `MKMapItem.Identifier` 是無法標註 `@Model`、SwiftData 也無法自動檢視的 class，啟動時會丟出「Class property within Persisted Struct/Enum is not supported」的 fatal error。解法是 Apple 2027 新增的 **`.codable` attribute**：由於該型別符合 **Codable**，將屬性標為 `@Attribute(.codable)` 即可讓 SwiftData 委派序列化、儲存其編碼後的表示。但要注意 codable 內容對 SwiftData 是不透明的，無法用於 Predicate 過濾或 Sort Descriptor 排序，型別結構改變也不會觸發 migration，因此它是儲存「你不擁有的型別」的逃生艙，自有型別仍應建模為 SwiftData model 以享有排序、過濾與索引。","第三個主題是監看資料變化的全新 API。`@Query` 雖好，但僅限 SwiftUI 視圖;Apple 2027 推出 **ResultsObserver**,可在 app 任何地方 (非 SwiftUI、甚至 SceneKit 遊戲) 運作，同樣支援 filtering、sorting 與 sectioning,透過 **Swift Observation** 反應變化。範例用 `MapCameraController` 持有 `ResultsObserver\u003cTrip, Never>`,以 `withContinuousObservation(options: [.didSet])` 在 trip 變動時重算地圖的 `MapCameraBounds`,並把回傳的 **ObservationTracking token** 存於 class 以維持觀察生命週期。","最後是 **HistoryObserver**。SwiftData 每次儲存都會記錄一筆 history transaction (包含變更內容、來源 author 與唯一 token),可用於與外部伺服器同步或反應 app extension 等外部變更。HistoryObserver 讓你輕鬆反應 persistent history 的新交易,並可依 model 型別與 transaction author 過濾;它只有一個可觀察屬性 **eventCounter**,有新交易時遞增。範例的 `ServerSync` 以 `authors: [\"App\"]` 建立 observer (避免把伺服器來的變更又回傳),在觀察閉包中存取 `eventCounter` 讓 Observation 追蹤,再呼叫 `processChanges()` 透過 `ModelContext.fetchHistory` 取得並上傳變更。總結:用 sections 客製 fetch、用 codable 儲存他人框架型別、用 ResultsObserver 在 SwiftUI 外反應查詢結果變化、用 HistoryObserver 反應 persistent history 變化。"],"deepdive":[{"t":0,"title":"Introduction","body":"SwiftData 團隊工程師 **Thomas** 開場,介紹 Apple 2027 版本帶來的 SwiftData 新功能,並建議 SwiftData 新手先看 code-along「Add persistence with SwiftData」。他預告三大主題:用 `Query` 在 SwiftUI 視圖中分段擷取資料、在 model 中儲存自訂型別的強化,以及觀察 model 與 history 變化的全新 API。"},{"t":1,"title":"Sectioned fetching","body":"以範例 app **SampleTrips** 說明 SwiftUI 與 SwiftData 的緊密整合:在視圖加上 `@Query` 即可擷取依 start date 排序的所有 trips 並用於 list。Thomas 提出需求 — 想把 trips 依目的地分組,讓同地點的旅行相鄰顯示,引出 Apple 2027 中 **Query 對 sectioning 的支援**。"},{"t":53,"title":"Sectioning your fetches","body":"建立 sectioned query 只需把從 Trip model root 指向字串的 KeyPath 傳給 Query 新的 **`sectionBy`** 參數 (此處用 `\\.destination`),wrapped value 仍是 `[Trip]`。要分段顯示時,透過底線前綴的 **`_trips`** 存取 query 的 `sections` 屬性,用 `ForEach` 走訪各 section,每個 section 的 **`id`** (即 KeyPath 對應值,如目的地) 當作 `Section` 標題,內層再以 `ForEach` 走訪該 section 的 trips 建立 `TripListItem`。"},{"t":176,"title":"Using custom types","body":"聚焦於 SampleTrips 核心的 **Trip** model (含 name、destination、起訖日期)。Thomas 想加入 MapKit 找地點的功能,為每個 location 取得名稱、座標與 **MKMapItem.Identifier** 並存入 model,但加上這些屬性後啟動 app 會丟出 fatal error「Class property within Persisted Struct/Enum is not supported」,因為 SwiftData 載入時會自動為 model 產生 schema,而未標 `@Model` 的 class 無法被自動檢視。"},{"t":299,"title":"Using Codable","body":"由於 `MKMapItem.Identifier` 來自 MapKit、無法修改或標 `@Model`,但它符合 **Codable**,Apple 2027 可將 attribute 標為 **`.codable`** 讓 SwiftData 委派序列化並儲存編碼表示 (示範 `@Attribute(.codable) var mapItemIdentifier`),app 即可正常啟動。需注意 codable 內容對 SwiftData 不透明:無法用於 **Predicate** 過濾或 **Sort Descriptor** 排序,型別結構變動也不觸發 migration (Codable 實作須前後相容)。它是儲存非自有型別的「逃生艙」,自有型別仍應建模為 SwiftData model 以享有排序、過濾與索引。"},{"t":386,"title":"Observing data stores with ResultsObserver","body":"回顧 `@Query` 會在視圖出現時擷取資料並持續監看 store 變化使視圖重繪,但僅限 SwiftUI。Apple 2027 推出 **ResultsObserver**,如同 Query 般擷取並觀察 store,卻能在 app 任何地方運作 (獨立於 SwiftUI、甚至 SceneKit 遊戲),透過 **Swift Observation** 反應變化,並支援既有的 filtering、sorting 與 sectioning。講者以資料流圖說明:把 Query 換成 ResultsObserver、View 換成任意程式碼即可。"},{"t":500,"title":"// Use observation to update map bounds","body":"示範用 **`MapCameraController`** 為地圖計算合適的 **`MapCameraBounds`**。它建立一個不帶 predicate 或 sectioning 的 `ResultsObserver\u003cTrip, Never>` 以涵蓋所有 trips,並用 **`withContinuousObservation(options: [.didSet])`** 在每次 trip 變動時重算 bounds。回傳的 **ObservationTracking token** 存於 class 以維持整個生命週期的觀察;實際操作中刪除 Toronto 行程後,observer 偵測到變化並讓控制器重算地圖相機範圍。"},{"t":501,"title":"// Using HistoryObserver to sync with a server","body":"對應到與外部伺服器同步的程式碼:`ServerSync` 以 **`HistoryObserver(authors: [\"App\"], modelContainer:)`** 建立 observer,只關注 app 自身的變更以避免把伺服器來的變更又回傳。它同樣用 `withContinuousObservation(options: .didSet)` 並把 token 存於 class,在觀察閉包中存取 **`eventCounter`** 讓 Swift Observation 知道要追蹤什麼,再呼叫 `processChanges()`。"},{"t":581,"title":"Observing history with HistoryObserver","body":"先複習 SwiftData 在每次儲存時記錄 **history transaction** (含變更內容、來源 author 與唯一 token,可配合 `ModelContext.fetchHistory` 取得較新交易),並推薦觀看 WWDC 2024「Track Model Changes with SwiftData History」。新的 **HistoryObserver** 讓你輕鬆反應 persistent history 的新交易,可依 model 型別與 transaction author 過濾,其唯一可觀察屬性 **`eventCounter`** 在有新交易時遞增,程式碼可觀察它並用 `ModelContext.fetchHistory` 取得最新變更上傳伺服器。"},{"t":740,"title":"Next steps","body":"Thomas 總結四大新功能:用 **sections** 客製 SwiftData fetch、用 **codable** attribute 儲存來自其他框架的型別、用 **ResultsObserver** 在 SwiftUI 視圖外反應查詢結果變化,以及用 **HistoryObserver** 反應 SwiftData persistent history 的變化,並感謝觀看。"}],"summary_en":["SwiftData engineer Thomas introduces the new SwiftData features in Apple's 2027 releases, using **SampleTrips** — a long-running sample app for tracking planned adventures (SwiftData for persistence, SwiftUI for UI) — throughout. The first topic is **sectioned fetching**: `@Query` gains a `sectionBy` parameter that takes a KeyPath from the model root to a string (e.g. `\\.destination`) to group results by that property. The query's wrapped value is still `[Trip]`, but the underscore-prefixed `_trips` exposes a `sections` property; combined with nested `ForEach` and `Section`, using each section's `id` (the KeyPath value) as the header, you get a list grouped by destination.","The second topic is storing custom types. The example wants to persist coordinates and an **MKMapItem.Identifier** from MapKit search in the Trip model, but because `MKMapItem.Identifier` is a class that can't be annotated `@Model` and can't be inspected by SwiftData, the app throws a fatal error at launch: 'Class property within Persisted Struct/Enum is not supported.' The fix is the new **`.codable` attribute** in Apple's 2027 releases: since the type conforms to **Codable**, marking the property `@Attribute(.codable)` tells SwiftData to delegate serialization and store the encoded representation. Note that codable contents are opaque to SwiftData — they can't be used in Predicates for filtering or Sort Descriptors for sorting, and shape changes won't trigger a migration — so it's an escape hatch for types you don't own, while your own types should be modeled as SwiftData models for sorting, filtering, and indexing.","The third topic is new APIs for observing data changes. `@Query` is great but limited to SwiftUI views; Apple's 2027 releases introduce **ResultsObserver**, which works anywhere in your app (outside SwiftUI, even a SceneKit game), supports the same filtering, sorting, and sectioning, and reacts to changes via **Swift Observation**. The example has a `MapCameraController` hold a `ResultsObserver\u003cTrip, Never>`, using `withContinuousObservation(options: [.didSet])` to recalculate the map's `MapCameraBounds` whenever a trip changes, and stores the returned **ObservationTracking token** on the class to keep the observation alive.","Finally, **HistoryObserver**. Every save records a history transaction (with what changed, the source author, and a unique token), useful for syncing with external servers or reacting to changes made outside the app such as in an app extension. HistoryObserver makes it easy to react to new transactions in the persistent history and can filter by model type and transaction author; it has a single observable property, **eventCounter**, which increments when new transactions arrive. The example's `ServerSync` creates the observer with `authors: [\"App\"]` (to avoid replaying server-originated changes back to the server), accesses `eventCounter` inside the observation closure so Observation tracks it, and calls `processChanges()` to fetch and upload via `ModelContext.fetchHistory`. The takeaways: tailor fetches with sections, store other frameworks' types with codable, react to query-result changes outside SwiftUI with ResultsObserver, and react to persistent-history changes with HistoryObserver."],"deepdive_en":[{"t":0,"title":"Introduction","body":"SwiftData engineer **Thomas** opens by introducing the new SwiftData features in Apple's 2027 releases and recommends newcomers watch the code-along 'Add persistence with SwiftData' first. He previews three topics: fetching data in sections with `Query` in SwiftUI views, enhancements for storing custom types in your model, and new APIs for observing model and history changes."},{"t":1,"title":"Sectioned fetching","body":"Using the sample app **SampleTrips**, Thomas shows how tightly SwiftUI and SwiftData integrate: adding `@Query` to a view fetches all trips sorted by start date for use in a list. He motivates the need to group trips by destination so trips to the same place appear together, introducing **Query's support for sectioning** in Apple's 2027 releases."},{"t":53,"title":"Sectioning your fetches","body":"Creating a sectioned query just means passing a KeyPath from the Trip model root to a string into Query's new **`sectionBy`** parameter (here `\\.destination`); the wrapped value is still `[Trip]`. To display sections, access the query's `sections` property via the underscore-prefixed **`_trips`**, iterate with `ForEach`, use each section's **`id`** (the KeyPath value, e.g. destination) as the `Section` header, and use an inner `ForEach` over the section's trips to build a `TripListItem` for each."},{"t":176,"title":"Using custom types","body":"The focus turns to SampleTrips' central **Trip** model (name, destination, start/end dates). Thomas wants to add MapKit location lookup, storing each location's name, coordinates, and **MKMapItem.Identifier** in the model, but adding these properties makes the app throw the fatal error 'Class property within Persisted Struct/Enum is not supported,' because SwiftData auto-generates a schema at load time and can't inspect classes not annotated with `@Model`."},{"t":299,"title":"Using Codable","body":"Since `MKMapItem.Identifier` comes from MapKit and can't be modified or marked `@Model` but conforms to **Codable**, Apple's 2027 releases let you mark an attribute **`.codable`** so SwiftData delegates serialization and stores the encoded representation (demoed as `@Attribute(.codable) var mapItemIdentifier`), letting the app launch cleanly. Keep in mind codable contents are opaque to SwiftData: they can't be used in **Predicates** for filtering or **Sort Descriptors** for sorting, and shape changes don't trigger a migration (the Codable implementation must be forward- and backward-compatible). It's an escape hatch for types you don't own; model your own types as SwiftData models to get sorting, filtering, and indexing."},{"t":386,"title":"Observing data stores with ResultsObserver","body":"Recapping that `@Query` fetches when the view appears and continuously monitors the store to re-render the view, but only in SwiftUI. Apple's 2027 releases introduce **ResultsObserver**, which fetches and observes the store like Query but works anywhere in your app (independent of SwiftUI, even a SceneKit game), reacting to changes via **Swift Observation** and supporting the same filtering, sorting, and sectioning. The presenter shows the data-flow diagram with Query replaced by ResultsObserver and the View replaced by any code you like."},{"t":500,"title":"// Use observation to update map bounds","body":"The demo uses a **`MapCameraController`** to compute fitting **`MapCameraBounds`** for a map. It creates a `ResultsObserver\u003cTrip, Never>` with no predicate or sectioning to cover all trips, and uses **`withContinuousObservation(options: [.didSet])`** to recalculate the bounds whenever a trip changes. The returned **ObservationTracking token** is stored on the class to keep the observation alive for its lifetime; deleting the Toronto trip in the demo triggers the observer and recalculates the map camera bounds."},{"t":501,"title":"// Using HistoryObserver to sync with a server","body":"This corresponds to syncing with an external server: `ServerSync` creates an observer with **`HistoryObserver(authors: [\"App\"], modelContainer:)`**, interested only in the app's own changes so it doesn't replay server-originated changes back to the server. Like the camera controller it uses `withContinuousObservation(options: .didSet)` and stores the token on the class, accessing **`eventCounter`** inside the closure so Swift Observation knows what to track before calling `processChanges()`."},{"t":581,"title":"Observing history with HistoryObserver","body":"A quick recap that SwiftData records a **history transaction** on each save (with what changed, the source author, and a unique token usable with `ModelContext.fetchHistory` to fetch newer transactions), with a pointer to WWDC 2024's 'Track Model Changes with SwiftData History.' The new **HistoryObserver** makes it easy to react to new transactions in the persistent history, can filter by model type and transaction author, and exposes a single observable property, **`eventCounter`**, which increments when new transactions arrive so code can observe it and use `ModelContext.fetchHistory` to fetch and upload the latest changes."},{"t":740,"title":"Next steps","body":"Thomas summarizes the four new features: tailor SwiftData fetches with **sections**, use **codable** attributes to store types from other frameworks, use **ResultsObserver** to react to query-result changes outside SwiftUI views, and use **HistoryObserver** to react to changes in SwiftData's persistent history, then thanks the audience."}],"code":["// Sectioned fetching\n\nstruct TripListView: View {   \n    @Query(sort: \\Trip.startDate,\n           sectionBy: \\.destination)\n    var trips: [Trip]\n\n    var body: some View: {\n        List(selection: $selection) {\n            ForEach(_trips.sections) {section in\n                Section(section.id) {\n                    ForEach(trips) {trip in\n                        TripListItem(trip: trip)\n                    }\n               }\n            }\n        }\n    }\n}","// Using Codable\n\nimport SwiftData\n\n@Model class Trip {\n\n    struct Location: Codable {\n        var latitude: Double\n        var longitude: Double\n    }\n\n    var name: String\n    var destination: String\n\n    var startDate: Date\n    var endDate: Date\n\n    var location: Location?\n    @Attribute(.codable) var mapItemIdentifier: MKMapItem.Identifier?\n}","// Use observation to update map bounds\n\n@Observable @MainActor final class MapCameraController {\n    private let resultsObserver: ResultsObserver\u003cTrip, Never>\n    var bounds: MapCameraBounds?\n    private var token: ObservationTracking.Token?\n\n    init(modelContext: ModelContext) throws {\n        resultsObserver = try ResultsObserver\u003cTrip, Never>(modelContext: modelContext)\n\n        token = withContinuousObservation(options: [.didSet]) {[weak self], event in\n            self?.bounds = self?.calculateBounds(trips: resultsObserver.results)\n       }\n    }\n\n    private func calculateBounds(trips: [Trip]) -> MapCameraBounds? { / * */ }\n}","// Using HistoryObserver to sync with a server\n\n@SyncActor final class ServerSync {\n    private let observer: HistoryObserver\n    private var token: ObservationTracking.Token?\n\n    func start() throws {\n        self.observer = try HistoryObserver(authors: [\"App\"], modelContainer: modelContainer)\n        token = withContinuousObservation(options: .didSet) {[weak self] _ in\n            _ = self?.observer.eventCounter\n            self?.processChanges()\n        }\n    }\n\n    private func processChanges() {\n        // Fetch and process history transactions\n    }\n}"]},"related":[{"id":"8017","title":"SwiftData Group Lab","gloss":"SwiftData 團體實驗室","gloss_en":"SwiftData Group Lab","category":"swift","categoryLabel":"Swift"},{"id":"240","title":"Build intelligent Siri experiences with App Schemas","gloss":"用 App Schemas 打造智慧 Siri 體驗","gloss_en":"Build intelligent Siri experiences with App Schemas","category":"ai","categoryLabel":"AI 與機器學習"},{"id":"275","title":"Code-along: Add persistence with SwiftData","gloss":"程式碼實作：用 SwiftData 加入持久化","gloss_en":"Code-along: Add persistence with SwiftData","category":"swiftui","categoryLabel":"SwiftUI"},{"id":"321","title":"Dive into lazy stacks and scrolling with SwiftUI","gloss":"深入 SwiftUI 的 lazy stacks 與捲動","gloss_en":"Dive into lazy stacks and scrolling with SwiftUI","category":"swiftui","categoryLabel":"SwiftUI"},{"id":"201","title":"Secure your apps with App Attest","gloss":"運用 App Attest 保護你的 App","gloss_en":"Protect your app with App Attest","category":"swift","categoryLabel":"Swift"}]}</script>
