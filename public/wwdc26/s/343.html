<script id="d" type="application/json">{"s":{"id":"343","title":"Explore advanced App Intents features for Siri and Apple Intelligence","gloss":"探索 Siri 與 Apple Intelligence 的進階 App Intents 功能","category":"ai","categoryLabel":"AI 與機器學習","duration":1448,"url":"https://developer.apple.com/videos/play/wwdc2026/343/","takeaway":"用進階 App Intents 打磨與 Siri/Apple Intelligence 的整合:自訂對話與澄清提問、視覺片段回應、互動捐贈、語意索引、結構化搜尋與螢幕內容感知。","chapters":[[0,"Introduction"],[119,"Customize how Siri responds"],[162,"Custom dialog response"],[222,"Ask a clarifying question within an inten"],[260,"Visual responses"],[266,"Enhanced DisplayRepresentation"],[305,"Return a custom snippet view"],[382,"Interaction donations"],[464,"Donate a UI interaction"],[586,"Confirmations and entity ownership"],[603,"Declare entity ownership for confirmations"],[690,"Index entities with IndexedEntity"],[719,"Semantic index with IndexedEntity"],[812,"Structured search with IntentValueQuery"],[818,"Structured search with IntentValueQuer"],[889,"Re-run Siri search in your app"],[927,"In-app search"],[982,"Onscreen awareness"],[987,"Onscreen awareness annotations"],[1043,"Component-based display representation query"],[1251,"Leverage existing integrations"],[1267,"Entity annotations on system integrations"],[1410,"Next steps"]],"points":[{"text":"自訂 Siri 回應:用 **ProvidesDialog 的 IntentDialog** 給出完整/簡短對話,並可用 **$param.requestValue** 在 intent 中向使用者**反問澄清問題**。","hot":false},{"text":"視覺回應:強化 **DisplayRepresentation**(title/subtitle/image),並以 **ShowsSnippetView** 回傳自訂 snippet 視圖。","hot":false},{"text":"用 **IntentDonationManager.donate** 捐贈互動(含參數與結果),讓 Siri 學習使用者偏好。","hot":false},{"text":"語意整合:用 **IndexedEntity + CSSearchableIndex** 建語意索引,用 **IntentValueQuery** 做結構化搜尋,並以 .system.searchInApp 把 Siri 搜尋導回 App 內。","hot":true},{"text":"**螢幕內容感知(onscreen awareness)**:用 **EntityIdentifier / appEntityIdentifier** 在 NSUserActivity、視圖、清單、通知、Now Playing、AlarmKit 等處標註螢幕上的實體。","hot":false}],"apis":["AppIntents","IntentDialog","ProvidesDialog","requestValue","DisplayRepresentation","ShowsSnippetView","IntentDonationManager","OwnershipProvidingEntity","IndexedEntity","CSSearchableIndex","IntentValueQuery","EntityIdentifier","appEntityIdentifier","AlarmKit"],"audience":"**已導入 App Intents、想把 Siri 與 Apple Intelligence 整合做到更深(澄清提問、語意索引、螢幕感知)的開發者。**","gloss_en":"Explore advanced App Intents features for Siri and Apple Intelligence","takeaway_en":"Use advanced App Intents to polish your Siri/Apple Intelligence integration: custom dialog and clarifying questions, visual snippet responses, interaction donations, semantic indexing, structured search, and onscreen awareness.","points_en":[{"text":"Customize Siri responses: use **ProvidesDialog's IntentDialog** to give full/short dialog, and use **$param.requestValue** to **ask the user a clarifying question** within the intent.","hot":false},{"text":"Visual responses: enhance **DisplayRepresentation** (title/subtitle/image), and return a custom snippet view with **ShowsSnippetView**.","hot":false},{"text":"Use **IntentDonationManager.donate** to donate interactions (including parameters and results) so Siri learns user preferences.","hot":false},{"text":"Semantic integration: build a semantic index with **IndexedEntity + CSSearchableIndex**, do structured search with **IntentValueQuery**, and route Siri search back into your app with .system.searchInApp.","hot":true},{"text":"**Onscreen awareness**: use **EntityIdentifier / appEntityIdentifier** to annotate onscreen entities across NSUserActivity, views, lists, notifications, Now Playing, AlarmKit, and more.","hot":false}],"audience_en":"**Developers who have already adopted App Intents and want to deepen their Siri and Apple Intelligence integration (clarifying questions, semantic indexing, onscreen awareness).**","summary":["本場帶你超越 **App Intents** 的基礎，讓 app 在 **Siri** 與 **Apple Intelligence** 裡的體驗更精緻、更個人化，也更像你 app 自己的樣子。內容假設你已具備 App Intents 與 App Schemas 的基本概念，並以三個範例 app 貫穿全場：音樂播放與計時器的 CosmoTunes、訊息 app UnicornChat、行事曆 app CometCal。整體分三大主題：塑造 Siri 對話、讓內容更容易被找到、以及把系統各處的整合串連起來。","第一部分聚焦**塑造 Siri 對話**。透過 `ProvidesDialog` 回傳含 full 與 supporting 字串的 **IntentDialog**，讓回覆符合 app 個性（例如把歌曲叫 track、播放清單叫 mix tape），其中 full 字串要能在 AirPods 等純語音裝置上獨立成立。可在 perform 中用 `requestValue` 適時提出**澄清問題**；用 **DisplayRepresentation**（title／subtitle／image）與 `ShowsSnippetView` 自訂視覺呈現。**Interaction Donations** 則是把使用者在 app UI 內的操作（如送出訊息）以符合 schema 的 intent 捐贈給系統，讓 Apple Intelligence 學習偏好；最後在執行有副作用的 intent 前，可讓符合 **OwnershipProvidingEntity** 的實體回報 ownership 狀態，使 Siri 在更新公開或共享內容時適時要求確認。","第二部分讓 Siri **找得到你的內容**，有三條路徑。採用 **IndexedEntity** 並以 `CSSearchableIndex.indexAppEntities` 寫入 **Spotlight 語意索引**，依網域可獲得語意搜尋；並記得在內容新增、變更、刪除時同步維護索引（可用新的 **IndexedEntityQuery** 支援重新索引）。若資料量大或變動頻繁無法事先索引，改用 **IntentValueQuery**：接收系統的結構化搜尋輸入（如 AudioSearch，含 searchQuery／unspecified／url 等 criteria），並可回傳多種實體型別。要把結果顯示在自家搜尋介面，則採用 `.system.searchInApp` schema，由 intent 的 perform 在 app 內呈現結果。","第三部分是**畫面感知與系統整合**。**Onscreen awareness** 讓 Siri 把畫面上看得到的內容對應到可理解的實體與動作，解析「播放第三個」「那段對話」這類指稱：用 **NSUserActivity** 標註單一主要內容、用 **View Entity annotation**（`appEntityIdentifier`）標註多項中的一項、用 **Collection annotation** 處理清單與集合、用 custom canvas view annotation 處理非標準子視圖。再以 component-based display representation query 讓 Siri 只取文字表示、快速理解畫面。最後把實體標註延伸到既有系統整合：**UserNotifications**、**Now Playing**（依最具體到最不具體排序）與 **AlarmKit**，都用同一套 `appEntityIdentifiers` 模式（注意不可用 TransientAppEntity），讓人能在通知、播放中與鬧鐘等各處對你的內容採取行動。"],"deepdive":[{"t":0,"title":"Introduction","body":"由 App Intents 團隊工程師 Antonio Cancio 開場，目標是把 app 在 **Siri** 與 **Apple Intelligence** 的體驗推進到「精緻、個人化、明顯是你 app 樣子」的層次。本場假設已懂 App Intents 與 App Schemas 基礎，並介紹三個貫穿範例 app：CosmoTunes、UnicornChat、CometCal，可下載原始碼跟著操作。"},{"t":119,"title":"Customize how Siri responds","body":"說明 Siri 已負責理解自然語言、選對動作、產生回覆，而 **App Intents** 讓你塑造它做什麼、精煉它怎麼回應，讓 app 個性展現出來。以 CosmoTunes 的 `AddToPlaylistIntent` 為例，先在 perform 中加入歌曲並回傳空的 IntentResult，代表交由 Siri 處理回覆。"},{"t":162,"title":"Custom dialog response","body":"為讓回覆貼近 app 用語（歌曲叫 track、清單叫 mix tape），在 perform 加上 **ProvidesDialog** 協定，並回傳含 **full 與 supporting** 兩種字串的 **IntentDialog**。Siri 可用 supporting 字串搭配 UI，並在 AirPods 等純語音裝置朗讀 full 字串，因此 full 必須能獨立描述發生了什麼事。"},{"t":222,"title":"Ask a clarifying question within an inten","body":"示範在 intent 執行中提出**澄清問題**：CosmoTunes 可建立會啟停播放的計時器，採用含必填與選填參數的 schema。若已有計時器在跑，便在未提供 label 時用 `$label.requestValue(...)` 請使用者為新計時器命名，以避免混淆；其他如選單選擇或確認等對話請求可參考範例與文件。"},{"t":260,"title":"Visual responses","body":"說明實體的 display representation 與回應中的自訂視圖，是在對話旁呈現資訊並彰顯 app 識別的好機會。這些視覺可用於建立／更新實體的回應、在相似實體間請使用者選擇、回答 app 內容相關問題，Spotlight 與 Shortcuts 也會用到。"},{"t":266,"title":"Enhanced DisplayRepresentation","body":"教你定義更豐富的 **DisplayRepresentation**：基本只需 title，但可加上 **subtitle 與 image** 讓呈現更完整。以 SongEntity 為例提供 artwork 圖片，當人問起 app 內歌曲時 Siri 即可顯示，藉此精煉實體在系統各處的視覺識別。"},{"t":305,"title":"Return a custom snippet view","body":"回到 `AddToPlaylistIntent`，在 perform 加上 **ShowsSnippetView** 回傳型別，即可回傳含 SwiftUI 視圖（如 PlaylistSnippetView）的 IntentResult，以熟悉色彩顯示播放清單細節。講者提醒：審慎決定哪裡值得客製化，確保回覆在所有平台（含純語音裝置）都準確自然，並少用澄清問題以免造成摩擦。"},{"t":382,"title":"Interaction donations","body":"引入 **Interaction Donations**：系統已知道人透過 Siri 或 Shortcuts 的互動，但 Apple Intelligence 無法從 app UI 內的操作學習，除非你協助。每筆捐贈是「人在 app UI 做了某動作」的提示，系統以符合 schema 的 App Intent 存入暫時的 transcript，給 Siri 更聰明判斷的脈絡。"},{"t":464,"title":"Donate a UI interaction","body":"以 UnicornChat 示範：ConversationView 與 sendMessage intent 共用同一個送訊息 helper，於是在 helper 加上 `donateIntent` 參數區分來源（只需捐贈 UI 互動，Siri 互動系統已會學習）。接著建立 intent、填入參數與結果，再透過 **IntentDonationManager** 捐贈，讓系統學到使用者何時偏好用 UnicornChat；此模式也讓 Siri 掌握 app 中進行中的活動（如 Maps 的 NavigationSession、Clock 的碼錶起停）。提醒：捐贈須真實反映使用者行為，過度捐贈系統可能忽略。"},{"t":586,"title":"Confirmations and entity ownership","body":"說明 Siri 蒐集完參數、準備呼叫 intent 前的最後一步是**確認**，可讓人知情並避免 LLM 帶來的非預期副作用。對有意義副作用的 intent（如取消行程）Siri 會自動確認；對更新已公開或與他人共享內容的 intent 更應確認（更新私人事件可能不確認，更新有與會者的 Crew Lunch 則可能確認）。"},{"t":603,"title":"Declare entity ownership for confirmations","body":"教你以新的 **OwnershipProvidingEntity** 協定告訴 Siri 實體已被公開或共享。Siri 預設假設實體屬個人私有、可能略過確認；只對人能在 app 中共享或公開的實體加上此協定並提供 ownership 狀態（如有與會者則為 .shared），且每次系統索取實體時保持狀態最新，Siri 也會用稍早自訂的 display representation 作為確認視覺。"},{"t":690,"title":"Index entities with IndexedEntity","body":"進入讓 Siri「找到內容」主題，先談語意索引。CosmoTunes 的播放清單都在裝置本機，採用 **IndexedEntity** 即可讓 Apple Intelligence 找到它們，並用 `CSSearchableIndex.indexAppEntities` 寫入 Spotlight 語意索引。"},{"t":719,"title":"Semantic index with IndexedEntity","body":"示範索引後即可「在 CosmoTunes 播放我的 WWDC 播放清單」並在 Spotlight 搜尋。依 App Intents 網域，Spotlight 索引可提供**語意搜尋**——依意義而非完全關鍵字理解實體。強調維護索引同樣關鍵：新增時索引、關鍵屬性變更時更新、刪除時移除；可採用新的 **IndexedEntityQuery** 支援重新索引（若已用 Core Spotlight 層級 API 則不需另定義）。"},{"t":812,"title":"Structured search with IntentValueQuery","body":"說明若資料量大、在伺服器或變動太頻繁而無法事先索引（如 CosmoTunes 選擇索引播放清單但不索引歌曲），可改用 **IntentValueQuery**，仍讓人能用 Siri 播放歌曲。"},{"t":818,"title":"Structured search with IntentValueQuer","body":"深入 **IntentValueQuery**：類似 EntityQuery，但差別在 app 收到系統的**結構化搜尋輸入**且可回傳多種實體型別。Siri 為 PlayAudioIntent 的 audioEntity 參數呼叫此 query 並帶入 **AudioSearch**，其 `.criteria` 描述查詢：`.searchQuery` 含相關語句、`.unspecified`（如「播放 CosmoTunes」）直接播放先前喜歡的歌、還有 `.url` 處理連結指稱；回傳的 AudioEntity 是含歌曲與播放清單的 UnionValue。"},{"t":889,"title":"Re-run Siri search in your app","body":"說明有時人不是要動作、只想找東西（如「顯示 CosmoTunes 裡的跑步播放清單」）。Siri 預設會列出實體結果，但若想用自家精心打造的搜尋介面呈現，可採用系統的 **searchInApp** schema。"},{"t":927,"title":"In-app search","body":"iOS 17 推出的 system search schema 現更名為 **`.system.searchInApp`**，屬 System App Schema 網域，讓人不論採用哪些其他網域、甚至未索引實體，都能用 Siri 在 app 內搜尋。Siri 以它搜尋的同一字串呼叫此 intent，perform 方法便設定 searchText 與分頁、在 app 內找到並顯示結果。"},{"t":982,"title":"Onscreen awareness","body":"引入 **Onscreen awareness**：把畫面上看得到的內容連到系統可理解的結構化資訊與動作，讓 Siri 解析「播放第三個」「那段對話」等指稱。Siri 預設只懂畫面像素中的文字（無法對顯示的 track 採取行動，也可能說不出未顯示的歌手），採用相關 API 才能提供畫面上有哪些實體、位於何處的脈絡。"},{"t":987,"title":"Onscreen awareness annotations","body":"示範起手式：用 **NSUserActivity** 的 `.userActivity` 標註代表主要內容的視圖（如 NowPlayingView 整個畫面就是當前播放項），用 **View Entity annotation** 的 `.appEntityIdentifier` 標註多項中的一項（如 AlbumView 同時顯示專輯與曲目）。UIKit 與 AppKit 同樣支援所有 onscreen awareness API。"},{"t":1043,"title":"Component-based display representation query","body":"說明畫面一次顯示多個實體時，Siri 需快速判斷它們是否與請求相關，否則可能改問或播錯。稍早自訂的 display representation 可幫上忙：在 PlaylistQuery 實作 `displayRepresentations(for:requestedComponents:)`，讓 Siri 只查實體的**文字表示**，跳過從資料庫取完整內容的開銷。此段也涵蓋處理清單與集合的 **Collection annotation**（`appEntityIdentifier(forSelectionType:)`，系統延遲取得識別碼、可發現已選但捲出畫面的實體）與 custom canvas view annotation（如 PianoRollView 的非標準子視圖）。"},{"t":1251,"title":"Leverage existing integrations","body":"說明除了畫面之外，app 已與系統其他部分緊密整合，可把實體連到既有整合給 Siri 更多脈絡。app 實體像是一種通用語言，讓 Siri 不只懂畫面、也懂其他系統整合與時間敏感事件如何與你的內容相關。"},{"t":1267,"title":"Entity annotations on system integrations","body":"示範把實體標註延伸到三個既有整合，皆用同一套 **entity annotations** 模式。**UserNotifications**：把訊息的 EntityIdentifier 指派給 UNMutableNotificationContent 的 `appEntityIdentifiers`，讓 AirPods 朗讀通知時能直接回覆。**Now Playing**：把歌曲、歌手、播放清單實體依最具體到最不具體加入，支援「播放現場版」。**AlarmKit**：在 AlarmConfiguration 的 `appEntityIdentifier` 加單一識別碼以對響鈴鬧鐘採取行動。注意這三種 API 都不能用 TransientAppEntity（暫時實體無持久識別碼）。"},{"t":1410,"title":"Next steps","body":"總結建議的下一步：先自訂 entity display representation（系統各處都會用到），再把實體加入語意索引並持續維護，接著考慮以 IntentValueQuery 與 in-app search 讓實體可被 Siri 取用，並為視圖、活動與既有系統整合加上實體標註，最後捐贈 UI 互動以更個人化。並指向 App Schemas 的 Code-Along 與相關範例專案。"}],"summary_en":["This session takes you beyond the basics of **App Intents** so your app feels polished, personal, and unmistakably yours in **Siri** and **Apple Intelligence**. It assumes a basic understanding of App Intents and App Schemas and runs through three sample apps: CosmoTunes (music, alarms, timers), UnicornChat (messaging), and CometCal (calendar). The plan has three parts: shaping the Siri conversation, making your content easier to find, and connecting existing system integrations.","Part one shapes the **Siri conversation**. Adopt `ProvidesDialog` and return an **IntentDialog** with full and supporting strings so responses match your app's personality (calling songs tracks and playlists mix tapes), where the full string must stand on its own for voice-only devices like AirPods. Ask a **clarifying question** mid-perform with `requestValue`, and customize visuals via **DisplayRepresentation** (title/subtitle/image) and `ShowsSnippetView`. **Interaction Donations** donate UI actions (such as sending a message) as schema-conforming intents so Apple Intelligence can learn preferences, and before intents with side effects, entities conforming to **OwnershipProvidingEntity** report their ownership state so Siri confirms when updating public or shared content.","Part two helps Siri **find your content** via three paths. Adopt **IndexedEntity** and call `CSSearchableIndex.indexAppEntities` to populate the **Spotlight semantic index** (semantic search depending on domain), keeping the index updated as content is added, changed, or removed (support reindexing with the new **IndexedEntityQuery**). When data is large or changes too often to index ahead of time, use **IntentValueQuery**: it receives a structured search input from the system (e.g. AudioSearch with searchQuery/unspecified/url criteria) and can return multiple entity types. To show results in your own search UI, adopt the `.system.searchInApp` schema, whose perform method presents results in the app.","Part three covers **onscreen awareness and system integrations**. Onscreen awareness connects what's visible on screen to entities and actions the system understands, resolving references like \"play the third one\" or \"that conversation\": use **NSUserActivity** for a single primary item, the **View Entity annotation** (`appEntityIdentifier`) for one item among many, **Collection annotation** for lists and collections, and a custom canvas view annotation for non-standard subviews. A component-based display representation query lets Siri query just the text representation to understand the screen quickly. Finally, extend entity annotations to existing integrations: **UserNotifications**, **Now Playing** (ordered most to least specific), and **AlarmKit**, all using the same `appEntityIdentifiers` pattern (TransientAppEntity is not allowed), so people can act on your content wherever they encounter it."],"deepdive_en":[{"t":0,"title":"Introduction","body":"Antonio Cancio, an App Intents engineer, opens with the goal of taking your app's experience in **Siri** and **Apple Intelligence** beyond the basics to feel polished, personal, and unmistakably yours. The talk assumes familiarity with App Intents and App Schemas and introduces three sample apps to follow along with: CosmoTunes, UnicornChat, and CometCal."},{"t":119,"title":"Customize how Siri responds","body":"Notes that Siri already understands natural language, picks the right action, and crafts a response, while **App Intents** lets you shape what it does and refine how it responds so your app's personality shows. Using CosmoTunes' `AddToPlaylistIntent`, the perform method first adds the song and returns an empty IntentResult, telling Siri to handle the response."},{"t":162,"title":"Custom dialog response","body":"To make responses match the app's vocabulary (tracks and mix tapes), the perform method adopts **ProvidesDialog** and returns an **IntentDialog** with both **full and supporting** strings. Siri can show the supporting string with UI and read the full string on voice-only devices like AirPods, so the full string must describe what happened on its own."},{"t":222,"title":"Ask a clarifying question within an inten","body":"Demonstrates asking a **clarifying question** while the intent runs: CosmoTunes timers that start or stop playback adopt a schema with required and optional parameters. If a timer is already running, it calls `$label.requestValue(...)` to ask the person to name the new timer when no label was provided; other dialog requests (choosing from a list, confirmations) are covered in the sample and docs."},{"t":260,"title":"Visual responses","body":"Explains that entity display representations and custom views in responses are a great opportunity to present information visually and surface the app's identity alongside the dialog. They're used in responses when entities are created or updated, when asking someone to choose between similar entities, and when answering questions about content, and Spotlight and Shortcuts use them too."},{"t":266,"title":"Enhanced DisplayRepresentation","body":"Shows defining a richer **DisplayRepresentation**: a basic one needs just a title, but adding a **subtitle and image** makes it fuller. The SongEntity example provides artwork that Siri can show when people ask about songs, refining the visual identity of entities across the system."},{"t":305,"title":"Return a custom snippet view","body":"Back in `AddToPlaylistIntent`, adding the **ShowsSnippetView** return type lets the perform method return an IntentResult with a SwiftUI view (like PlaylistSnippetView) showing playlist details in familiar colors. The speaker advises deciding where customization actually makes sense, ensuring responses are accurate and natural on all platforms including voice-only devices, and asking clarifying questions sparingly to avoid friction."},{"t":382,"title":"Interaction donations","body":"Introduces **Interaction Donations**: the system already knows about Siri and Shortcuts interactions, but Apple Intelligence can't learn from actions taken through the app's own UI without your help. Each donation is a hint that a person took a specific action in your UI, stored by the system as a schema-conforming App Intent in a temporary transcript that gives Siri context for smarter decisions."},{"t":464,"title":"Donate a UI interaction","body":"Using UnicornChat: ConversationView and the sendMessage intent share the same send helper, so a `donateIntent` parameter is added to distinguish the caller (only UI interactions need donating, since Siri interactions are already learned). It then creates the intent, populates parameters and result, and donates via **IntentDonationManager** so the system learns when the person prefers UnicornChat; the pattern also keeps Siri aware of ongoing activities (Maps NavigationSession, Clock stopwatches). Donations must reflect real behavior, as excessive donations may be ignored."},{"t":586,"title":"Confirmations and entity ownership","body":"Explains that once Siri has gathered parameters and is ready to call your intent, the final step is **confirmation**, keeping people informed and protecting against the unintended side effects that are a known LLM risk. Siri can automatically confirm intents with meaningful side effects (like canceling a trip), and confirmation matters even more for updates to content made public or shared (it may skip a private event but confirm updating a Crew Lunch with attendees)."},{"t":603,"title":"Declare entity ownership for confirmations","body":"Shows conforming relevant entities to the new **OwnershipProvidingEntity** protocol to tell Siri an entity is public or shared. Siri assumes entities are private by default and may skip confirmations, so only add the protocol to entities people can share or make public, provide the ownership state (e.g. .shared when there are attendees), and keep it current whenever the system requests the entity; Siri can reuse the earlier display representations as confirmation visuals."},{"t":690,"title":"Index entities with IndexedEntity","body":"Begins the \"help Siri find content\" topic with the semantic index. CosmoTunes playlists are all on device, so adopting **IndexedEntity** and calling `CSSearchableIndex.indexAppEntities` populates the Spotlight semantic index so Apple Intelligence can find them."},{"t":719,"title":"Semantic index with IndexedEntity","body":"Demonstrates that once indexed you can say \"Play my WWDC playlist in CosmoTunes\" and search in Spotlight. Depending on the App Intents domain, Spotlight indexing provides **semantic search** that understands entities by meaning, not just exact keywords. It stresses maintaining the index: index on add, update when key properties change, delete on removal; support reindexing with the new **IndexedEntityQuery** (not needed if you already reindex via Core Spotlight-level APIs)."},{"t":812,"title":"Structured search with IntentValueQuery","body":"Explains that when data is large, server-side, or changes too frequently to index ahead of time (CosmoTunes indexes playlists but not songs), you can reach for an **IntentValueQuery** to still let people play songs with Siri."},{"t":818,"title":"Structured search with IntentValueQuer","body":"Dives into **IntentValueQuery**: similar to EntityQuery, but the app receives a **structured search input** from the system and can return more than one entity type. Siri calls it for the PlayAudioIntent's audioEntity parameter with an **AudioSearch** whose `.criteria` describes the query: `.searchQuery` holds the relevant phrase, `.unspecified` (\"Play CosmoTunes\") plays previously liked songs, and `.url` handles link references; the returned AudioEntity is a UnionValue of songs and playlists."},{"t":889,"title":"Re-run Siri search in your app","body":"Notes that sometimes people just want to find something rather than act (\"Show me running playlists in CosmoTunes\"). Siri shows a list of entity results by default, but to present them in your own crafted search experience you can adopt the system **searchInApp** schema."},{"t":927,"title":"In-app search","body":"The iOS 17 system search schema is now named **`.system.searchInApp`**, part of the System App Schema domain, letting people search in your app with Siri regardless of which other domains you adopt and even without indexed entities. Siri calls the intent with the same string it searched, and the perform method sets the search text and tab to find and show the results in the app."},{"t":982,"title":"Onscreen awareness","body":"Introduces **onscreen awareness**: connecting what's visible on screen to structured information and actions the system understands so Siri can resolve references like \"play the third one\" or \"that conversation.\" By default Siri only understands text in the pixels (it can't act on shown tracks and may not know an off-screen artist), so adopting these APIs provides context on which entities are on screen and where."},{"t":987,"title":"Onscreen awareness annotations","body":"Demonstrates the starting points: use **NSUserActivity** (`.userActivity`) on the view representing primary content (NowPlayingView is a whole screen dedicated to the current item) and the **View Entity annotation** (`.appEntityIdentifier`) when an entity is one item among many (AlbumView shows both the album and its tracks). UIKit and AppKit support all of the onscreen awareness APIs too."},{"t":1043,"title":"Component-based display representation query","body":"Explains that when many entities show at once, Siri must quickly judge whether they relate to a request or it may ask to clarify or play the wrong thing. The earlier display representations help: implementing `displayRepresentations(for:requestedComponents:)` on PlaylistQuery lets Siri query just the **text representation**, skipping the cost of fetching full content from the database. This section also covers the **Collection annotation** for lists (`appEntityIdentifier(forSelectionType:)`, with lazy identifier fetching that finds selected, scrolled-off entities) and the custom canvas view annotation for non-standard subviews like PianoRollView."},{"t":1251,"title":"Leverage existing integrations","body":"Notes that beyond the UI, the app already integrates closely with other parts of the system, and connecting entities to those existing integrations gives Siri more context. App entities act as a universal language so Siri understands not just what's on screen but how other system integrations and time-sensitive events relate to your content."},{"t":1267,"title":"Entity annotations on system integrations","body":"Adds entity annotations to three existing integrations using the same **entity annotations** pattern. **UserNotifications**: assign the message's EntityIdentifier to UNMutableNotificationContent's `appEntityIdentifiers` so a notification announced on AirPods can be replied to. **Now Playing**: add song, artist, and playlist entities ordered most to least specific, enabling \"Play the live version.\" **AlarmKit**: add a single EntityIdentifier to AlarmConfiguration's `appEntityIdentifier` to act on firing alarms. None of these three APIs allow TransientAppEntity, which has no persistent identifier."},{"t":1410,"title":"Next steps","body":"Summarizes recommended next steps: start by customizing entity display representations (used across the system), then add entities to the semantic index and keep it updated, consider making entities accessible via IntentValueQuery and in-app search, annotate views, activities, and existing integrations with entities, and finally donate UI interactions for a more personalized experience. It points to the App Schemas Code-Along and the sample projects."}],"code":["@AppIntent(schema: .audio.addToPlaylist)\n  struct AddToPlaylistIntent {\n\n      func perform() async throws -> some IntentResult & ProvidesDialog {\n          // Adds song to playlist and responds\n          return .result(\n              dialog: IntentDialog(\n                  full: \"\"\"\n                        Added \\(song.title) to the \\\n                        \\(playlist.title) mix tape.\n                        \"\"\",\n                  supporting: \"Added\"\n              )\n          )\n      }\n  }","@AppIntent(schema: .clock.createTimer)\n  struct CreateTimerIntent {\n      // MARK: Schema Parameters\n      var duration: Duration\n      var label: String?\n      var isSleepTimer: Bool\n\n      func perform() async throws -> some ReturnsValue\u003cTimerEntity> {\n          // Checks active timers and requests label parameter\n          label = try await $label.requestValue(\n              \"\"\"\n              You already have a timer running. \\\n              What should we call this one?\n              \"\"\"\n          )\n          return .result(value: timerEntity)\n      }\n  }","// Enhanced DisplayRepresentation\n  @AppEntity(schema: .audio.song)\n  struct SongEntity {\n\n      var displayRepresentation: DisplayRepresentation {\n          DisplayRepresentation(\n              title: \"\\(title)\",\n              subtitle: \"\\(artistName)\",\n              image: artworkImage\n          )\n      }\n  }","@AppIntent(schema: .audio.addToPlaylist)\n  struct AddToPlaylistIntent {\n\n      var audioEntity: AudioEntity\n      var playlist: PlaylistEntity\n\n      func perform() async throws -> some IntentResult & ProvidesDialog & ShowsSnippetView {\n          // Adds to playlist and shows dialog and snippet\n          let view = PlaylistSnippetView(\n              playlist: updatedEntity,\n              tracks: updated.tracks\n          )\n          return .result(dialog: dialog, view: view)\n      }\n  }","@ModelActor\n  actor ModelManager {\n      func sendMessage(_ /* ... */, donateIntent: Bool = false) async throws -> [Message.ID] {\n\n          // Donate intent with parameters and result so Siri can learn user preferences\n          if donateIntent {\n              let intent = SendMessageIntent()\n              intent.destination = .recipients(conversation.recipients.map(\\.entity))\n\n              let result = messages.map(\\.entity)\n              Task {\n                  try await IntentDonationManager.shared.donate(\n                      intent: intent,\n                      result: .result(value: result)\n                  )\n              }\n          }\n      }\n  }","// Informs system if entity is public or shared with others\n  @AppEntity(schema: .calendar.event)\n  struct EventEntity: OwnershipProvidingEntity {\n\n      var ownership: EntityOwnership {\n          // isShared used to compute ownership state: .shared, .public, or .unknown\n          attendees.isEmpty ? .unknown : .shared\n      }\n  }","// Indexing IndexedEntity with CSSearchableIndex\n  struct EntityIndexingHelper {\n      // Indexes playlist entities\n      func indexPlaylist(_ playlist: Playlist) async throws {\n          let entity = PlaylistEntity(playlist: playlist)\n          try await CSSearchableIndex(name: indexName)\n              .indexAppEntities([entity])\n      }\n  }","// Structured search of songs and playlists\n  struct AudioIntentValueQuery: IntentValueQuery {\n\n      // AudioSearch, IntentPerson, and other system types may be supported as input\n      func values(for input: AudioSearch) async throws -> [AudioEntity] {\n          switch input.criteria {\n          case .searchQuery(let query):\n              return try await searchResults(for: query)\n          case .unspecified:\n              return try await likedSongResults()\n          // ... also a .url case\n          }\n      }\n  }","// Intent that re-runs the Siri search in app\n  @AppIntent(schema: .system.searchInApp)\n  struct SearchAudioLibraryIntent {\n\n      var criteria: StringSearchCriteria\n\n      func perform() async throws -> some IntentResult {\n          // Perform in-app search with Siri search string\n          navigation.searchText = criteria.term\n          navigation.selectedTab = .library\n          return .result()\n      }\n  }","// (a) Single primary entity on screen — NSUserActivity\n  struct NowPlayingView: View {\n      @Environment(PlaybackController.self) private var playback\n\n      var body: some View {\n          VStack {\n              // Player UI\n          }\n          .userActivity(\"cosmotunes.nowPlaying\", isActive: playback.currentTrack) { activity in\n              activity.title = playback.currentTrack?.title\n              activity.appEntityIdentifier = EntityIdentifier(\n                  for: SongEntity.self,\n                  identifier: playback.currentTrack.id\n              )\n          }\n      }\n  }\n\n  // (b) One entity among many — View Entity annotation\n  struct AlbumView: View {\n      private var header: some View {\n          VStack(alignment: .leading, spacing: 6) {\n              // ...\n          }\n          .appEntityIdentifier(\n              EntityIdentifier(for: AlbumEntity.self, identifier: session.id.uuidString)\n          )\n      }\n  }\n  \n  // (c) Lists and collections — Collection annotation\n  struct PlaylistDetailView: View {\n      var body: some View {\n          List {\n              ForEach(playlist.tracks) { track in\n                  PlaylistTrackRow(track: track)\n              }\n          }\n          .appEntityIdentifier(forSelectionType: GeneratedTrack.ID.self) { trackID in\n              EntityIdentifier(for: SongEntity.self, identifier: trackID)\n          }\n      }\n  }","// Component-based display representation queries\n  extension PlaylistQuery {\n      func displayRepresentations(\n          for identifiers: [PlaylistEntity.ID],\n          requestedComponents: DisplayRepresentation.Components = .text\n      ) async throws -> [PlaylistEntity.ID: DisplayRepresentation] {\n          let entities = try await model.playlistEntities(for: identifiers)\n\n          // Fetch display representations for fetched entities\n          var result: [PlaylistEntity.ID: DisplayRepresentation] = [:]\n          for entity in entities {\n              result[entity.id] = await entity.displayRepresentation(with: requestedComponents)\n          }\n          return result\n      }\n  }","// (a) User notifications\n  import AppIntents\n  import UserNotifications\n\n  func scheduleNotification(message: Message, author: Contact, conversation: Conversation) {\n      let content = UNMutableNotificationContent()\n      content.title = author.name\n      content.body = message.body\n\n      // Annotate with entity identifier\n      content.appEntityIdentifiers = [\n          EntityIdentifier(for: MessageEntity.self, identifier: message.id)\n      ]\n      // Schedule the notification\n  }\n\n  // (b) Now Playing — most specific to least specific\n  import NowPlaying\n\n  final class CosmoTunesMediaSession: MediaSessionRepresentable {\n      var content: (any MediaContentRepresentable)? {\n          var content = MusicContent(id: track.id.uuidString, songTitle: track.title /* ... */)\n          content.appEntityIdentifiers = [\n              EntityIdentifier(for: SongEntity.self, identifier: track.id),\n              EntityIdentifier(for: ArtistEntity.self, identifier: track.session.artistName),\n              EntityIdentifier(for: PlaylistEntity.self, identifier: currentPlaylist.id),\n          ]\n          return content\n      }\n  }\n\n  // (c) AlarmKit\n  import AlarmKit\n\n  func scheduleAlarm(_ alarm: Alarm) async throws {\n      let configuration = AlarmManager.AlarmConfiguration\u003cCosmoTunesAlarmMetadata>.alarm(\n          schedule: schedule,\n          attributes: attributes,\n          appEntityIdentifier: EntityIdentifier(for: AlarmEntity.self, identifier: alarm.id),\n          stopIntent: DismissAlarmIntent(),\n          secondaryIntent: SnoozeAlarmIntent(),\n          sound: sound\n      )\n      // Schedule alarm\n  }"]},"related":[{"id":"240","title":"Build intelligent Siri experiences with App Schemas","gloss":"用 App Schemas 打造智慧 Siri 體驗","gloss_en":"Build intelligent Siri experiences with App Schemas","category":"ai","categoryLabel":"AI 與機器學習"},{"id":"297","title":"Best practices for integrating visual intelligence in your app","gloss":"在 App 中整合視覺智慧的最佳實務","gloss_en":"Best practices for integrating visual intelligence in your app","category":"ai","categoryLabel":"AI 與機器學習"},{"id":"310","title":"What’s new in Shortcuts","gloss":"捷徑有什麼新東西","gloss_en":"What's new in Shortcuts","category":"ai","categoryLabel":"AI 與機器學習"},{"id":"344","title":"Code-along: Make your app available to Siri","gloss":"程式碼實作：讓你的 App 可被 Siri 使用","gloss_en":"Code-along: Make your app available to Siri","category":"ai","categoryLabel":"AI 與機器學習"},{"id":"347","title":"Secure your app: mitigate risks to agentic features","gloss":"保護你的 App：降低 agentic 功能的風險","gloss_en":"Secure your app: mitigate risks to agentic features","category":"ai","categoryLabel":"AI 與機器學習"}]}</script>
