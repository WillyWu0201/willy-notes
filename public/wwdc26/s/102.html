<script id="d" type="application/json">{"s":{"id":"102","title":"Platforms State of the Union","gloss":"平台現況報告","category":"other","categoryLabel":"其他","duration":3698,"url":"https://developer.apple.com/videos/play/wwdc2026/102/","takeaway":"這是 WWDC26 開發者方向的總覽，先看它能快速掌握各平台與框架的年度重點。","chapters":[],"points":[{"text":"**Platforms State of the Union** 是 WWDC 開發者場次的開場，集中介紹 Apple 各平台最新的技術進展。","hot":true},{"text":"內容定位為**年度總覽**，適合用來規劃接下來要深入觀看哪些主題的細部場次。","hot":false},{"text":"原始資料未提供章節與程式碼，**細節需搭配各專題場次**補齊。","hot":false}],"apis":[],"audience":"所有 Apple 平台開發者，特別是想**先綜覽今年技術重點**再決定深入方向的人。","gloss_en":"Platforms State of the Union","takeaway_en":"This is the developer-focused overview for WWDC26; watch it first to quickly grasp the year's highlights across each platform and framework.","points_en":[{"text":"**Platforms State of the Union** opens the developer sessions at WWDC, focusing on the latest technical advancements across Apple's platforms.","hot":true},{"text":"It is framed as an **annual overview**, ideal for planning which deep-dive topic sessions to watch next.","hot":false},{"text":"The source material provides no chapters or code, so the **details need to be filled in from the individual topic sessions**.","hot":false}],"audience_en":"All Apple platform developers, especially those who want to **get a broad overview of this year's technical highlights** before deciding where to dig deeper.","summary":["2026 年的 **Platforms State of the Union** 圍繞三大主軸：**Apple Intelligence**、平台改進，以及開發者生產力。今年的 Apple Foundation Models 與 Google 的 **Gemini** 技術合作打造，並在裝置端與 Private Cloud Compute 上執行。**Foundation Models 框架**大幅擴充：支援多模態 prompt（文字＋影像）、整合 Vision 的 OCR 與 barcode reader 等 on-device 工具，並可呼叫 **Claude、Gemini 等 server model**（任何供應商都能做一個符合 Language Model protocol 的 Swift 套件）。為了降低門檻，首次下載量低於 200 萬的開發者可免費使用跑在 Private Cloud Compute 上的 Apple Foundation Model（無雲端 API 成本）。框架還引入新的 **Dynamic Profiles** 宣告式 API、開源 Swift 工具套件（含 skills 與 context 管理）、Evaluations 框架、升級的 Foundation Models instrument、**fm 命令列工具**、Python SDK、影像 tool calling 與 Core Spotlight 驅動的 RAG 工具——且框架本身今夏將**開源**。","除了在 app 內建構，Apple Intelligence 也能透過 **App Intents** 把你的 app 推到系統各處。**App Schemas**（entity schema 描述內容、intent schema 描述動作）讓整合 Siri 變簡單：把內容貢獻到 **Spotlight 語意索引**即可被語意理解並導回你的 app，而 intent schema 由系統定義、會隨 Siri 語言能力更新自動受惠，使用者不必記特定指令。新的 **View Annotations API** 讓使用者能引用畫面上的內容（「第二則訊息」「這張照片」）並對其採取動作。Demo 以 Origami app 示範用 `@AppEntity`／`@AppIntent` macro conform schema、索引到 Spotlight，再用 Siri 查訊息、傳訊與傳送畫面上的照片。想在裝置上跑自己的模型則有全新的 **Core AI** 框架（memory-safe Swift API、PyTorch 轉換工具、專屬 instruments 與視覺除錯器），研究／訓練則有支援 Metal 4、可跨多台 Mac 訓練的 **MLX**。","平台改進方面，用新 SDK 重新編譯後 app 啟動更快、更靈敏。**Liquid Glass** 持續精修：更有效擴散背後內容、加入暗邊與更亮的鏡面高光、設定中可從 ultra clear 到 fully tinted 調整，且自動適配 reduce transparency 等無障礙設定；macOS 的 sidebar 延伸到邊緣並恢復 accent color、視窗圓角統一、scroll edge effect 自動套用，Icon Composer 可用多層 Liquid Glass 設計圖示。iOS app 現可在 iPhone Mirroring 與 iPad 上**調整大小**（用新 SDK 重編即自動加入，可用 resizable simulator 與 Previews 測試，並有 coding agent 的 skill 協助修常見問題）。**SwiftUI** 帶來可重排序容器（`.reorderable()`／`.reorderContainer()`）、任意容器的 swipe actions、更彈性的文字選取、更快的 layout 與 lazy state、AsyncImage HTTP 快取、toolbar 的 `visibilityPriority`／overflow／`topBarPinnedTrailing`、新文件基礎建設，以及把 Mac app 內容延伸到 Vision Pro 的 Spatial Preview。**Swift 6.4** 則改善可抑制／升級的警告、`anyAppleOS`、defer 中可 await，並大幅減少「無法在合理時間內 type check」的錯誤。","Swift 正成為橫跨整個技術堆疊的語言：Apple 已在 WebKit、QUIC、TrueType 字型引擎、甚至部分 OS kernel 用 Swift 改寫，並支援 Linux、Windows、Android、Web。最後是開發者生產力：去年帶到 Xcode 的 AI 編碼能力今年加快釋出節奏，支援 **Model Context Protocol**（連 Figma、GitHub 等）、內建 Anthropic／OpenAI／Google 的 agent，並新增 **Agent Client Protocol** 支援任何相容 agent（ACP 與 Gemini 整合於今日的 Xcode 26 更新提供）。Xcode 27 體積縮小 30%、僅支援 Apple silicon，載入更快、修了主要當機、debug 更可靠，且設定會自動同步到 iCloud。另外 macOS 完成轉向 Apple silicon（可上架 Apple silicon-only binary），舊版設計選項將被移除——以 Xcode 27 重編後即自動採用 Liquid Glass。"],"deepdive":[],"summary_en":["The 2026 **Platforms State of the Union** is organized around three themes: **Apple Intelligence**, platform improvements, and developer productivity. This year's Apple Foundation Models were built in collaboration with Google leveraging its **Gemini** technology, running on device and on Private Cloud Compute. The **Foundation Models framework** expands significantly: multimodal prompts (text + images), integration of on-device Vision tools like OCR and a barcode reader, and the ability to call **server models like Claude and Gemini** (any provider can ship a Swift package conforming to the Language Model protocol). To lower the barrier, developers with fewer than 2 million first-time downloads can use the Apple Foundation Model on Private Cloud Compute for free (no cloud API cost). It also introduces the new declarative **Dynamic Profiles** API, an open-source Swift package (with skills and context management), an Evaluations framework, an upgraded Foundation Models instrument, the **fm command line tool**, a Python SDK, image tool calling, and a Core Spotlight-powered RAG tool—and the framework itself will be **open sourced** this summer.","Beyond in-app features, Apple Intelligence can surface your app across the system through **App Intents**. **App Schemas** (entity schemas describe content, intent schemas describe actions) make Siri integration easy: contribute content to the **Spotlight semantic index** for semantic understanding with attribution back to your app, while intent schemas are system-defined and automatically benefit as Siri's language understanding evolves, so users don't have to memorize phrases. The new **View Annotations API** lets users reference onscreen content ('the second message', 'this photo') and act on it. The Origami app demo shows conforming to schemas with the `@AppEntity`/`@AppIntent` macros, indexing into Spotlight, then using Siri to query messages, send a text, and send an onscreen photo. To run your own models on device there's the new **Core AI** framework (memory-safe Swift API, PyTorch conversion tools, dedicated instruments and visual debugger), and for research/training there's **MLX** (Metal 4 support, training across multiple Macs).","On platform improvements, recompiling with the new SDK makes apps launch faster and feel more responsive. **Liquid Glass** is refined: it diffuses complex content behind it more effectively, adds a darkened edge and brighter specular highlights, a Settings slider ranges from ultra clear to fully tinted, and it adapts automatically to accessibility settings like reduce transparency; on macOS, sidebars extend to the edges and regain accent color, window corner radii are unified, the scroll edge effect applies automatically, and Icon Composer can design icons from multiple Liquid Glass layers. iOS apps can now be **resized** in iPhone Mirroring and on iPad (auto opted-in when recompiled, testable with a resizable simulator and Previews, with a coding-agent skill to fix common issues). **SwiftUI** brings reorderable containers (`.reorderable()`/`.reorderContainer()`), swipe actions in any container, more flexible text selection, faster layout and lazy state, AsyncImage HTTP caching, toolbar `visibilityPriority`/overflow/`topBarPinnedTrailing`, new document infrastructure, and Spatial Preview to extend Mac app content to Vision Pro. **Swift 6.4** improves suppressible/promotable warnings, `anyAppleOS`, await in defer, and greatly reduces the 'unable to type check in reasonable time' error.","Swift is becoming the language across the entire stack: Apple has rewritten parts of WebKit, QUIC, the TrueType font engine, and even portions of the OS kernel in Swift, with support for Linux, Windows, Android, and the web. Finally, developer productivity: the AI coding brought to Xcode last year ships faster this year, supporting **Model Context Protocol** (connecting Figma, GitHub, etc.), built-in agents from Anthropic/OpenAI/Google, and the new **Agent Client Protocol** for any compatible agent (ACP and Gemini integration ship in today's Xcode 26 update). Xcode 27 is 30% smaller, Apple silicon-only, loads faster, fixes top crashes, debugs more reliably, and syncs settings to iCloud. macOS has completed its transition to Apple silicon (you can ship Apple silicon-only binaries), and the old design opt-out will be removed—recompiling with Xcode 27 automatically adopts Liquid Glass."],"deepdive_en":[],"code":[]},"related":[{"id":"101","title":"Keynote","gloss":"主題演講","gloss_en":"Keynote","category":"other","categoryLabel":"其他"},{"id":"111","title":"Keynote (ASL)","gloss":"主題演講(美國手語版)","gloss_en":"Keynote (American Sign Language)","category":"other","categoryLabel":"其他"},{"id":"112","title":"Platforms State of the Union (ASL)","gloss":"平台現況報告（美國手語版）","gloss_en":"Platforms State of the Union (American Sign Language)","category":"other","categoryLabel":"其他"},{"id":"122","title":"WWDC26 Platforms State of the Union Recap","gloss":"WWDC26 平台現況演講重點回顧","gloss_en":"WWDC26 Platforms State of the Union recap","category":"other","categoryLabel":"其他"},{"id":"204","title":"What’s new in WebKit for Safari 27","gloss":"Safari 27 中 WebKit 的新功能","gloss_en":"What's new in WebKit for Safari 27","category":"other","categoryLabel":"其他"}]}</script>
