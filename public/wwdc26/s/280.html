<script id="d" type="application/json">{"s":{"id":"280","title":"Iterate your spatial scenes faster with Reality Composer Pro 3","gloss":"用 Reality Composer Pro 3 更快迭代空間場景","category":"visionos","categoryLabel":"visionOS","duration":1004,"url":"https://developer.apple.com/videos/play/wwdc2026/280/","takeaway":"Reality Composer Pro 3 用原型/實例、即時預覽與光照貼圖，大幅加速空間場景的製作迭代。","chapters":[[0,"Introduction"],[145,"Overview"],[237,"Entities and components"],[525,"Prototypes and instances"],[666,"Live preview"],[717,"Lightmaps"],[883,"Reality Composer Pro Assistant"],[967,"Next steps"]],"points":[{"text":"以 **entities 與 components** 的概念組構場景內容，是 Reality Composer Pro 的基礎工作流程。","hot":false},{"text":"新的**原型（prototypes）與實例（instances）**機制讓重複內容可一處修改、處處更新。","hot":true},{"text":"**即時預覽（Live preview）**能在裝置上即時看到編輯結果，縮短調整迴圈。","hot":false},{"text":"支援**光照貼圖（Lightmaps）**提升場景視覺品質，並新增 **Reality Composer Pro Assistant** 協助製作。","hot":false}],"apis":["Reality Composer Pro","RealityKit"],"audience":"使用 Reality Composer Pro 製作 **visionOS 空間體驗與 3D 場景**的開發者與美術。","gloss_en":"Iterate your spatial scenes faster with Reality Composer Pro 3","takeaway_en":"Reality Composer Pro 3 uses prototypes/instances, live preview, and lightmaps to dramatically speed up iteration when building spatial scenes.","points_en":[{"text":"Compose scene content with the concepts of **entities and components**, the foundational workflow of Reality Composer Pro.","hot":false},{"text":"The new **prototypes and instances** mechanism lets you edit repeated content in one place and update it everywhere.","hot":true},{"text":"**Live preview** shows editing results in real time on device, shortening the iteration loop.","hot":false},{"text":"Supports **Lightmaps** to improve scene visual quality, and adds the **Reality Composer Pro Assistant** to help with authoring.","hot":false}],"audience_en":"Developers and artists using Reality Composer Pro to build **visionOS spatial experiences and 3D scenes**.","summary":["Reality Composer Pro 工程師 JP 示範 **Reality Composer Pro 3** 如何讓你更快地迭代空間內容。最重要的轉變是：RCP 3 不再是 Xcode 的開發者工具，而可直接從 developer.apple.com 下載、從應用程式資料夾啟動，整個工具是為快速、迭代、協作的工作流而生，讓你在不需碰 Xcode 的情況下走得更遠。他以互動遊戲 Chaparral Village 的鍊金區（Alchemy Area）為範例，逐步加入功能，並帶出三大新能力：**Live preview**、**Lightmaps**，以及能用 AI 生成 3D 內容的 **Reality Composer Pro Assistant**。","基礎仍是 **entities 與 components**：匯入 USD 檔會被整理優化成 import bundle，拖入視埠後成為帶 Transform Component 的 entity；可在 hierarchy 中巢狀排列，並用 Add Component 加入光源、physics、audio 等。範例為桌上的魔法效果加入 Point Light 與新的 **Compute Simulation** component（選用 node-based 的 Compute Graph，讓 GPU 程式設計人人可用）。按 Play 進入 **simulation tab** 即可即時預覽 compute graph、物理、腳本與動畫——更棒的是能把 simulation tab 與 scene tab 並排停靠，在遊戲執行的同時繼續編輯，幾乎零部署摩擦。新的 **prototypes 與 instances** 系統則讓你把 entity 拖進 Project Browser 變成 prototype，多次實例化並對個別 instance 提供 override；不滿意可 Reset 回原值，或把 override 反向 propagate 回來源，一切非破壞性。","**Live Preview**（今年稍晚推出）可把 simulation 投放到連接 Mac 的任一 Vision Pro 上，在 RCP 編輯的同時於裝置即時反映，所見即所得，大幅縮短迭代時間。**Lightmaps** 則用來預烘焙不會移動的光源所產生的**間接光照**（indirect lighting），把光線在場景中的彈跳結果存成貼圖，填補如桌下等無直接光照的暗部；可選 Indirect Lighting、Ambient Occlusion 與 Beauty 三種光照項，並用 Bake Settings 與 Lightmap Preview tab 調整品質、預覽後再正式烘焙。最後是 **Reality Composer Pro Assistant**：永遠在右側面板待命，能以生成式模型按需打造 3D 物件與材質（範例直接生成工作檯上的物品與蠟燭），也能回答 RCP 的使用問題。"],"deepdive":[{"t":0,"title":"Introduction","body":"Reality Composer Pro 工程師 JP 開場，說明 **Reality Composer Pro 3** 主打更快、迭代、協作的工作流，讓你不必碰 Xcode 就能走得更遠。本場以互動遊戲 Chaparral Village 為例，逐步加入功能，並預告 **Live preview**、**Lightmaps** 與能用 AI 生成 3D 內容的 **RCP Assistant**。"},{"t":145,"title":"Overview","body":"重點轉變：RCP 3 不再是 Xcode 開發者工具，可直接從 developer.apple.com 下載並從應用程式資料夾啟動。以鍊金區（在 Blender 建模、匯入為 USD、在 RCP 佈局）為範例，用 import asset 匯入桌上的 Cauldron USD——匯入時內容會整理優化成 **import bundle**，拖入視埠即成 entity。"},{"t":237,"title":"Entities and components","body":"**entities 與 components** 是一切的核心構件。hierarchy 列出所有 entity，可重排與巢狀；選取 entity 用 Transform Component 調整位置角度，並用 Add Component 加入光源、physics、audio 等。範例建立 Magic Effect 子 entity，加入 Point Light 與新的 **Compute Simulation** component（選 Magic Graph），其 node-based 的 Compute Graph 讓 GPU 程式設計人人可用，但只在 simulation 階段執行。"},{"t":525,"title":"Prototypes and instances","body":"新增的 **prototypes** 用來建立可重用物件：把 entity 從 hierarchy 拖進 Project Browser 即成 prototype asset，再拖回視埠實例化。可對個別 instance 提供 override（如改用 Brewing Graph、調整顏色與衰減），不滿意可在 context menu 選 Reset 回原值，或把 override propagate 回來源——一切非破壞性，在一處編輯、系統處理其餘。"},{"t":666,"title":"Live preview","body":"**Live Preview**（今年稍晚推出）可用 launch control 把 simulation 投放到連接 Mac 的任一 **Vision Pro**，開啟 visionOS 上的伴隨 app。之後在 RCP 編輯即於裝置即時反映（如新的 physical space lighting 的藍色填充光），在裝置上即時感受空間效果、所見即所得，大幅縮短迭代並去除猜測。"},{"t":717,"title":"Lightmaps","body":"做完光照編輯後，原本的間接光照不再相符。**Lightmaps** 用來預計算不會移動之光源的**間接光照**並存成貼圖：捕捉光線在場景中的彈跳、填補如桌下等無直接光的暗部。可選 Indirect Lighting、Ambient Occlusion 與 Beauty 三種光照項，於 Bake Settings 調品質（low→high），並用 Lightmap Preview tab 即時預覽後再正式烘焙。"},{"t":883,"title":"Reality Composer Pro Assistant","body":"**Reality Composer Pro Assistant** 永遠在右側面板待命，使用強大的生成式模型按需打造 3D 物件與材質（範例直接生成工作檯上的物品與蠟燭），讓你更快迭代、自由實驗、把點子化為現實，也能回答任何 RCP 使用問題。"},{"t":967,"title":"Next steps","body":"總結今天只觸及 RCP 3 的皮毛，建議先從 developer.apple.com 下載並探索內附的 sample projects，並參考其他 Reality Composer Pro 場次（如「Supercharge your spatial workflows with Reality Composer Pro 3」）深入學習。"}],"summary_en":["Reality Composer Pro engineer JP shows how **Reality Composer Pro 3** lets you iterate on spatial content faster than ever. The biggest shift: RCP 3 is no longer an Xcode developer tool — you download it from developer.apple.com and launch it from your Applications folder, and the whole tool is built for fast, iterative, collaborative workflows that get you further without touching Xcode. Using the Alchemy Area of the interactive game Chaparral Village as a running example, he adds features step by step and highlights three new capabilities: **Live preview**, **Lightmaps**, and the **Reality Composer Pro Assistant**, which generates 3D content with AI.","The foundation is still **entities and components**: importing a USD file organizes and optimizes it into an import bundle, and dragging it into the viewport makes it an entity with a Transform Component; entities can be nested in the hierarchy, and Add Component adds lights, physics, audio, and more. The example adds a Point Light and the new **Compute Simulation** component (choosing a node-based Compute Graph that makes GPU programming accessible) to a table's magic effect. Pressing Play enters the **simulation tab** for real-time preview of compute graphs, physics, scripts, and animation — and crucially, you can dock the simulation tab next to the scene tab to keep authoring while the game runs, with virtually no deployment friction. The new **prototypes and instances** system lets you drag an entity into the Project Browser to make a prototype, instantiate it multiple times, and override individual instances; reset overrides to source values or propagate them back, all non-destructively.","**Live Preview** (shipping later this year) casts a simulation to any Vision Pro connected to your Mac, reflecting RCP edits on-device in real time — what you see is what you get — dramatically cutting iteration time. **Lightmaps** pre-bake the **indirect lighting** from non-moving lights, saving the way light bounces around the scene to a texture to fill in unlit areas like under a table; you can choose Indirect Lighting, Ambient Occlusion, and Beauty terms, tune quality in Bake Settings, and preview in the Lightmap Preview tab before a full bake. Finally, the **Reality Composer Pro Assistant** is always available in the right panel, using powerful generative models to craft 3D objects and materials on demand (the example generates workbench items and candles) and to answer RCP questions."],"deepdive_en":[{"t":0,"title":"Introduction","body":"Reality Composer Pro engineer JP opens, explaining that **Reality Composer Pro 3** is built for faster, iterative, collaborative workflows that get you further without touching Xcode. Using the interactive game Chaparral Village, he adds features step by step and previews **Live preview**, **Lightmaps**, and the AI-powered **RCP Assistant** for generating 3D content."},{"t":145,"title":"Overview","body":"Key shift: RCP 3 is no longer an Xcode developer tool — download it from developer.apple.com and launch from Applications. With the Alchemy Area (modeled in Blender, imported as USD, laid out in RCP) as the example, he imports a Cauldron USD via import asset — importing organizes and optimizes content into an **import bundle**, and dragging it into the viewport makes it an entity."},{"t":237,"title":"Entities and components","body":"**Entities and components** are the core building blocks. The hierarchy lists all entities, reorderable and nestable; select an entity to adjust position/angle via the Transform Component, and use Add Component for lights, physics, audio, and more. The example creates a Magic Effect child entity, adds a Point Light and the new **Compute Simulation** component (choosing the Magic Graph), whose node-based Compute Graph makes GPU programming accessible but runs only during simulation."},{"t":525,"title":"Prototypes and instances","body":"The new **prototypes** create reusable objects: drag an entity from the hierarchy into the Project Browser to make a prototype asset, then drag it back into the viewport to instantiate. Override individual instances (e.g. switch to the Brewing Graph, adjust color and attenuation), and if unhappy, Reset to source values via the context menu or propagate overrides back to source — all non-destructive: edit in one place and the system handles the rest."},{"t":666,"title":"Live preview","body":"**Live Preview** (shipping later this year) uses launch control to cast a simulation to any **Vision Pro** connected to the Mac, opening the companion app on visionOS. RCP edits then reflect on-device in real time (e.g. the new physical space lighting's blue fill light), letting you feel spatial effects instantly — what you see is what you get — dramatically cutting iteration and removing guesswork."},{"t":717,"title":"Lightmaps","body":"After lighting edits, the original indirect lighting no longer matches. **Lightmaps** pre-calculate the **indirect lighting** of non-moving lights and save it to a texture: capturing how light bounces and filling in unlit areas like under a table. Choose Indirect Lighting, Ambient Occlusion, and Beauty terms, set quality in Bake Settings (low→high), and use the Lightmap Preview tab to preview before committing to a full bake."},{"t":883,"title":"Reality Composer Pro Assistant","body":"The **Reality Composer Pro Assistant** is always available in the right panel, using powerful generative models to craft 3D objects and materials on demand (the example generates workbench items and candles), letting you iterate faster and experiment freely, and it can answer any RCP usage questions."},{"t":967,"title":"Next steps","body":"Wraps up noting this only scratches the surface of RCP 3, recommending downloading it from developer.apple.com, exploring the included sample projects, and checking out other Reality Composer Pro sessions (like \"Supercharge your spatial workflows with Reality Composer Pro 3\") to learn more."}],"code":[]},"related":[{"id":"287","title":"Build next-generation experiences with visionOS 27","gloss":"用 visionOS 27 打造次世代體驗","gloss_en":"Build next-generation experiences with visionOS 27","category":"visionos","categoryLabel":"visionOS"},{"id":"393","title":"Supercharge your spatial workflows with Reality Composer Pro 3","gloss":"用 Reality Composer Pro 3 強化你的空間工作流","gloss_en":"Supercharge your spatial workflows with Reality Composer Pro 3","category":"visionos","categoryLabel":"visionOS"},{"id":"279","title":"Explore advances in RealityKit","gloss":"探索 RealityKit 的最新進展","gloss_en":"Explore advances in RealityKit","category":"visionos","categoryLabel":"visionOS"},{"id":"283","title":"Explore enhancements to visionOS object tracking","gloss":"探索 visionOS 物件追蹤的強化功能","gloss_en":"Explore enhancements to visionOS object tracking","category":"visionos","categoryLabel":"visionOS"},{"id":"284","title":"Collaborate on structured 3D models in visionOS","gloss":"在 visionOS 中協作操作結構化 3D 模型","gloss_en":"Collaborate on structured 3D models in visionOS","category":"visionos","categoryLabel":"visionOS"}]}</script>
