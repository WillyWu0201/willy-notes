<script id="d" type="application/json">{"s":{"id":"298","title":"Meet the Evaluations framework","gloss":"認識 Evaluations 框架","category":"ai","categoryLabel":"AI 與機器學習","duration":1546,"url":"https://developer.apple.com/videos/play/wwdc2026/298/","takeaway":"在機率性的 AI 世界裡，用 Evaluations 框架以資料集、metrics 與 model judge 系統化評估模型驅動功能的品質。","chapters":[[0,"Introduction"],[190,"Demo app Book Tacker: a manual evaluation"],[271,"Building your first evaluation"],[294,"Define an Evaluation"],[482,"Run with Swift Testing and an optimization target"],[486,"Running the evaluation and reading the report"],[609,"Constrain output with a Generable @Guide"],[657,"Building robust datasets"],[675,"Define the dataset with ModelSample"],[773,"Synthesize more samples with a SampleGenerator"],[842,"More evaluators: word count and genre"],[843,"Define a Metric and Evaluator"],[860,"Refining metrics and evaluators"],[867,"Aggregate metrics across samples"],[933,"Iterate the feature's instructions (hill-climbing)"],[941,"Evaluation-driven development and hill-climbing"],[972,"Model judges: qualitative metrics"],[1122,"Building a model judge"],[1133,"Build a model judge"],[1279,"Refining with score dimensions"],[1337,"Split into score dimensions"],[1352,"Add dimensions to the judge"],[1397,"Add app context with a ModelJudgePrompt"],[1425,"Reviewing dimension results"],[1460,"Best practices"],[1538,"Next steps"]],"points":[{"text":"在機率性世界中，**單元測試不足以驗證模型行為**，需要專門的 Evaluations 框架。","hot":true},{"text":"用 **Evaluation** 搭配 **ModelSample** 資料集定義要評估的功能，並可用 SampleGenerator 合成更多樣本。","hot":false},{"text":"透過 **Metric** 與 **Evaluator** 定義通過／失敗條件，並用 MetricsAggregator 跨樣本彙總統計。","hot":false},{"text":"可用 **.evaluates** 與 Swift Testing 整合，設定 optimization target 並以 hill-climbing 迭代 instructions。","hot":false},{"text":"以 **ModelJudgeEvaluator** 進行質性評分，並用 ScoreDimension 與 ModelJudgePrompt 細分維度。","hot":false}],"apis":["Evaluations","Evaluation","ModelSample","Metric","Evaluator","MetricsAggregator","ModelJudgeEvaluator","ScoreDimension","ModelJudgePrompt","Generable"],"audience":"正在打造 **模型驅動或生成式 AI 功能**、需要系統化衡量輸出品質的開發者。","gloss_en":"Meet the Evaluations framework","takeaway_en":"In a probabilistic AI world, use the Evaluations framework to systematically assess the quality of model-driven features with datasets, metrics, and a model judge.","points_en":[{"text":"In a probabilistic world, **unit tests alone aren't enough to verify model behavior**; a dedicated Evaluations framework is needed.","hot":true},{"text":"Use **Evaluation** with a **ModelSample** dataset to define the feature to evaluate, and use SampleGenerator to synthesize more samples.","hot":false},{"text":"Define pass/fail criteria with **Metric** and **Evaluator**, and use MetricsAggregator to aggregate statistics across samples.","hot":false},{"text":"Integrate with Swift Testing via **.evaluates**, set an optimization target, and iterate on instructions with hill-climbing.","hot":false},{"text":"Use **ModelJudgeEvaluator** for qualitative scoring, and break it down by dimension with ScoreDimension and ModelJudgePrompt.","hot":false}],"audience_en":"Developers building **model-driven or generative AI features** who need to systematically measure output quality.","summary":["這場由 Yada 與 Rob 主講，介紹全新的 **Evaluations framework**——用來衡量「由模型驅動的功能」品質的測試工具。承接去年的 **Foundation Models framework**，講者點出生成式 AI 打破了傳統軟體測試的根本契約：同一輸入不再保證產生同一輸出，因此 **unit test 不足以驗證機率性行為**。我們需要新的測試形式，回答諸如「功能多常產生非預期結果」、「在什麼情況下會產生不安全結果」這類問題。","全片以一個書籍管理 app **Book Tracker** 的 **BookTaggingService**（依使用者書評自動產生標籤）為範例，示範建立 evaluation 的五個步驟：定義要衡量的程式（`subject(from:)`）、定義輸入資料（**`ModelSample`**，含 prompt 與 expected）、定義量測（**`Metric`** 與 **`Evaluator`** closure 回傳 passing／failing）、彙總量測（`aggregateMetrics(using:)`），最後用 **Swift Testing** 的 `@Test` 搭配 **`.evaluates`** trait 設定 optimization target 跑起來。Xcode 提供專屬的 evaluation report，可逐一檢視每個 sample 的 prompt、量測與模型完整回應。","接著談如何擴大規模。好的 evaluation 需要數千筆、且涵蓋不同類型、長度、體裁與夾雜個人意見的 dataset；框架內建 **`SampleGenerator`**（`makeSamples`）可用模型合成更多樣本。量化指標之外，講者引入 **model judge**：用一個「至少和受評模型一樣強」的模型（此處用 **Private Cloud Compute** 的模型）對輸出做主觀評分。**`ModelJudgeEvaluator`** 與量化 evaluator 共用相同協定與 `Metric` 型別，可自由混用；rationale（評分理由）是關鍵,讓你看見判斷依據。","當 judge 的判斷與你不一致時，代表問題問得太籠統。解法是拆成多個 **`ScoreDimension`**（例如把模糊的 quality 拆成 relevance 與 usefulness），並用 **`ModelJudgePrompt`** 補上 app 脈絡（告訴 judge 這是個人書庫而非評論平台）。整套流程的精神是 **hill-climbing**：讀 rationale、改 instructions、重跑、看分數變化，把它放在開發核心就成了 **evaluation-driven development**。最佳實務是從 20–30 筆小 dataset 起步、能用程式量的就用量化指標、只能用文字描述的才用 model judge，並從單次執行的 rationale 學習下一步。"],"deepdive":[{"t":0,"title":"Introduction","body":"Yada 與 Rob 開場介紹 **Evaluations framework**，並回顧去年的 **Foundation Models framework**。核心論點是生成式 AI **打破了「同一輸入產生同一輸出」的測試契約**，導致 unit test 不足以驗證行為。未經驗證的行為會侵蝕使用者信任，因此需要一種更穩健、能回答「多常出錯」「何時產生不安全結果」的新測試形式。"},{"t":190,"title":"Demo app Book Tacker: a manual evaluation","body":"以 **Book Tracker** app 的 **BookTaggingService** 為例，用 `#Playground` macro 對《Pride & Prejudice》與《Dracula》兩篇書評手動試跑。講者用人類判斷列出期望（標籤數不該過多、不要書名當標籤、避免多字詞標籤、要能辨識文學 genre），這其實就是**第一次人工 evaluation**——但人類判斷無法規模化。"},{"t":271,"title":"Building your first evaluation","body":"說明自動化的入口只需 `import Evaluations` 並實作 **`Evaluation`** 協定。建立與執行一個 evaluation 有五個步驟：定義受測程式、定義輸入資料、定義量測方式、彙總量測、建立測試來執行。"},{"t":294,"title":"Define an Evaluation","body":"在 `subject(from:)` 中呼叫 `BookTaggingService` 並回傳其輸出作為評估的 **subject**。用 **`ModelSample`** 包裝先前的書評作為輸入，並同時定義 **expected**（理想標籤）。接著用 **`Metric`**（如 `TagCount`）與 **`Evaluator`** closure 檢查標籤數是否落在 3–8 之間，回傳 passing 或 failing。"},{"t":482,"title":"Run with Swift Testing and an optimization target","body":"Evaluations 整合 **Swift Testing**，可在測試 target 內執行。在 `@Suite` 中實例化 evaluation 並加上 notes 以便日後比較不同執行；再用 `@Test` 搭配新的 **`.evaluates`** trait 取得結果 bundle，對 `tagCount` 的平均值用 `#expect` 斷言。此處設定 **optimization target 為 80%**——低於此即視為功能退步,失敗測試正是好訊號。"},{"t":486,"title":"Running the evaluation and reading the report","body":"跑測試後（如預期）未通過,`TagCount` 只有 50% 通過率。講者示範用 Xcode 的 **evaluation report**:從 report navigator 點進 Evaluations,雙擊列展開,看到《Pride & Prejudice》失敗而《Dracula》通過,並在 assistant editor 的細節面板檢視 prompt、各項量測與模型完整回應。"},{"t":609,"title":"Constrain output with a Generable @Guide","body":"為了改善表現,講者回看 `@Generable` 的 `BookTags` 型別,在 `tags` 屬性的 **`@Guide`** 上加入 **`.count(3...8)`** range,指示模型只產生 3 到 8 個標籤。這是一次 hill-climbing 假設,改完重跑驗證。"},{"t":657,"title":"Building robust datasets","body":"改完後測試通過、`TagCount` 達 100%,但出現怪行為:服務**永遠產生 8 個標籤**。講者指出一開始只有兩筆樣本、量測太少無法看出趨勢,好的 evaluation 需要數千筆樣本並涵蓋多樣性。"},{"t":675,"title":"Define the dataset with ModelSample","body":"說明 dataset 要刻意製造多樣性:不同 genre、不同長度的書評、fiction 與 non-fiction 的不同分類、以及小說／短篇／散文等不同體裁。並刻意夾雜個人意見,測量服務能否忽略它們;若想教模型用你的風格寫標籤,就在 expected 值放入更多個人風格。"},{"t":773,"title":"Synthesize more samples with a SampleGenerator","body":"人工建資料同樣無法規模化。框架內建 **`SampleGenerator`**,可直接對 `ModelSample` 陣列呼叫 **`makeSamples`**,指定 prompt 與 `targetCount`,用你選的模型合成更多樣本(範例為 sentence-completion 配對)。更進階用法請見另一場「Create robust evaluations for agentic apps」。"},{"t":842,"title":"More evaluators: word count and genre","body":"把 dataset 擴充到整個書庫後重跑,測試仍通過、平均仍 100%,但 8 個標籤的怪行為持續存在。這促使講者新增更多 evaluator 來更細緻地追蹤行為,而不只看是否落在範圍內。"},{"t":843,"title":"Define a Metric and Evaluator","body":"新增 **`TagTotal`** metric 記錄實際標籤數量,並用 scoring 值(而非 pass/fail)記錄,以便看出**分布**而非只看是否合規。同樣的模式可用來檢查標籤是否含空白(多字詞)以及是否含已知 genre。"},{"t":860,"title":"Refining metrics and evaluators","body":"示範字數檢查:逐一檢查每個標籤是否含空白,有就回傳 `wordCount.failing`。genre 檢查同樣直接:向 `BookTaggingService` 取得 `knownGenres`,比對每個生成標籤是否命中。"},{"t":867,"title":"Aggregate metrics across samples","body":"Evaluator 一次只跑一個 sample,但可在 `aggregateMetrics(using:)` 中用 **`MetricsAggregator`** 跨所有樣本看趨勢。範例計算 `tagCount` 的平均,並用 `group` 對 `tagTotal` 計算標準差、平均與變異數,得到「服務多常正確」的比率與標籤總數的分布。"},{"t":933,"title":"Iterate the feature's instructions (hill-climbing)","body":"evaluation 逐漸完整,已能用五個 aggregate metric 衡量原本五個期望中的三個,report 呈現標籤分布、範圍合規與含 genre 的豐富樣貌。講者透過迭代 `BookTaggingService` 的 instructions 持續改善。"},{"t":941,"title":"Evaluation-driven development and hill-climbing","body":"展示從最初到多次迭代後的 instructions 變化,並用「每次改動都對應新增一個 evaluation 期望來驗證」的方式追蹤每次變更。把這個 **hill-climbing** 回饋迴圈放到開發流程的核心,就是 **evaluation-driven development**。"},{"t":972,"title":"Model judges: qualitative metrics","body":"由 Yada 接手講 **model judge**,用來規模化衡量**質化指標**。以《Alice in Wonderland》為例:量化指標全過,但 'overrated'、'pretentious' 描述的是讀者感受而非書,'whodunit' 甚至是錯的 genre——模型只抓住評論的字面語言而沒理解書。指標通過卻給錯訊號,因此需要請模型來幫忙評分。"},{"t":1122,"title":"Building a model judge","body":"**Model judge 是用一個語言模型來替你的功能輸出評分**,給出像人一樣的主觀評價,但能一致套用到整個 dataset。受評功能 `BookTaggingService` 在 on-device 模型跑以求快速與本地;judge 則應**至少和受評模型一樣強**,此處改用 **Private Cloud Compute** 的更強模型。"},{"t":1133,"title":"Build a model judge","body":"model judge 有幾個關鍵元件:instruction(告訴模型要評什麼)、feature input(書評 prompt)、feature output(生成標籤)、與 scoring guide。框架替你處理大部分,你只需專注 scoring guide。範例用 **`ModelJudgeEvaluator`** 定義 1–4 的 `TagQuality` 量表(偶數級距避免落在中性中間值),並指定 Private Cloud Compute 為 judge。"},{"t":1279,"title":"Refining with score dimensions","body":"跑出來每個 sample 都得 3 或 4 分,《Alice in Wonderland》得 3 分。但細看 rationale,judge 只標出部分不相關標籤——因為**依我們寫的量表,judge 其實是對的**:每個標籤都連到使用者寫的東西。問題在於量表太籠統、同時問了兩個不同的問題,需要拆開。"},{"t":1337,"title":"Split into score dimensions","body":"把籠統的問題拆成不同的 **`ScoreDimension`**。先定義 **Relevance**:每個標籤是否描述書本身的特質、主題或調性,而非細節或讀者的個人反應,並把這段寫成 dimension 的 description 與 1–4 的 scale。"},{"t":1352,"title":"Add dimensions to the judge","body":"用同樣方式定義 **Usefulness**,再把 relevance 與 usefulness 兩個 dimension 一起加進 **`ModelJudgeEvaluator`**。但光有 dimension 不夠——它們告訴 judge 要量什麼,卻沒告訴它如何理解你的 app。"},{"t":1397,"title":"Add app context with a ModelJudgePrompt","body":"用 **`ModelJudgePrompt`** 補上 app 脈絡:在 instructions 告訴 judge 這是個人書庫 app(而非評論平台,以免把讀者的批評當成有效書本描述),用 `evaluationTarget` 格式化回應,並用 `reference` 把 expectedTags 當作比對參考傳入。"},{"t":1425,"title":"Reviewing dimension results","body":"補上脈絡後重跑,原本的 Quality 換成 relevance 與 usefulness 兩個分數。以《Alice in Wonderland》為例,兩段 rationale 把診斷分開:Relevance 指出哪種標籤錯了,Usefulness 指出錯標籤如何在瀏覽上失敗,給出清楚的改進方向。"},{"t":1460,"title":"Best practices","body":"收尾的最佳實務:從 20–30 筆的小而聚焦 dataset 起步;先想清楚你要模型怎麼表現;能用程式量的特質就用量化指標(rule of thumb:能在程式裡量就是量化,只能用文字描述就需要 `ModelJudgeEvaluator`);model judge 也從簡單開始,定義 dimension、跑、讀 rationale——一次執行學到的比數小時規劃還多;用 rationale 驅動下一步改動。"},{"t":1538,"title":"Next steps","body":"請觀眾查閱文件與 sample code,並推薦延伸場次:「Improve your prompts by hill climbing with Evaluations」與「Create robust evaluations for agentic apps」。"}],"summary_en":["Presented by Yada and Rob, this session introduces the new **Evaluations framework** for measuring the quality of model-driven features. Building on last year's **Foundation Models framework**, the speakers note that generative AI breaks software testing's fundamental contract: the same input no longer guarantees the same output, so **unit tests are insufficient** to verify probabilistic behavior. We need a new form of testing that answers questions like how often a feature produces unexpected results and under what circumstances it produces unsafe ones.","The whole talk uses **Book Tracker**'s **BookTaggingService** (which auto-tags books from a user's review) as the running example, walking through the five steps to build an evaluation: define the code under test (`subject(from:)`), define the input data (**`ModelSample`** with prompt and expected), define measurements (**`Metric`** and an **`Evaluator`** closure returning passing/failing), aggregate them (`aggregateMetrics(using:)`), and finally run it with **Swift Testing**'s `@Test` plus the new **`.evaluates`** trait to set an optimization target. Xcode provides a dedicated evaluation report to inspect each sample's prompt, measurements, and the model's full response.","Next comes scaling. A good evaluation needs thousands of samples spanning different types, lengths, forms, and sprinkled-in personal opinions; the framework's built-in **`SampleGenerator`** (`makeSamples`) synthesizes more. Beyond quantitative metrics, the speakers introduce the **model judge**: a model at least as capable as the one under test (here a **Private Cloud Compute** model) that scores outputs subjectively. A **`ModelJudgeEvaluator`** conforms to the same protocol and produces the same `Metric` type as quantitative evaluators, so they mix freely; the rationale is essential — it shows you why the judge scored what it did.","When the judge disagrees with you, your question is too broad. The fix is to split it into multiple **`ScoreDimension`**s (e.g. break a vague \"quality\" into relevance and usefulness) and add app context with a **`ModelJudgePrompt`** (telling the judge this is a personal library, not a review platform). The spirit of the whole loop is **hill-climbing**: read the rationale, change the instructions, re-run, watch the scores move — and centering development on it is **evaluation-driven development**. Best practices: start with 20–30 samples, use quantitative metrics for anything measurable in code and model judges only for what you can only describe in words, and learn your next change from the rationales."],"deepdive_en":[{"t":0,"title":"Introduction","body":"Yada and Rob open by introducing the **Evaluations framework** and recapping last year's **Foundation Models framework**. The core argument is that generative AI **breaks the \"same input, same output\" testing contract**, making unit tests insufficient. Unverified behavior erodes user trust, so a more robust new form of testing is needed — one that answers how often a feature errs and when it produces unsafe results."},{"t":190,"title":"Demo app Book Tacker: a manual evaluation","body":"Using Book Tracker's **BookTaggingService**, they run a `#Playground` macro against two reviews — Pride & Prejudice and Dracula. Listing expectations by human judgment (not too many tags, no book title, avoid multi-word tags, recognize literary genres) is in fact a **first manual evaluation** — but human judgment doesn't scale."},{"t":271,"title":"Building your first evaluation","body":"Automating it requires only `import Evaluations` and conforming to the **`Evaluation`** protocol. Building and running an evaluation has five steps: define the code under test, the input data, the measurements, the aggregation, and finally a test to run it."},{"t":294,"title":"Define an Evaluation","body":"In `subject(from:)` they call `BookTaggingService` and return its output as the evaluation's **subject**. **`ModelSample`** wraps the earlier reviews as input, with **expected** ideal tags defined too. A **`Metric`** (`TagCount`) and an **`Evaluator`** closure then check whether the tag count is within 3–8, returning passing or failing."},{"t":482,"title":"Run with Swift Testing and an optimization target","body":"Evaluations integrates with **Swift Testing**, runnable in test targets. They instantiate the evaluation in a `@Suite` with notes for later comparison, then use `@Test` with the new **`.evaluates`** trait to get a results bundle and assert against `tagCount`'s mean with `#expect`. The **optimization target is 80%** — dipping below means a regression, and a failing test is great signal."},{"t":486,"title":"Running the evaluation and reading the report","body":"The test (as expected) fails with `TagCount` passing only 50%. They demo Xcode's **evaluation report**: open Evaluations from the report navigator, double-click a row, and see Pride & Prejudice failing while Dracula passes, inspecting prompt, measurements, and full model response in the assistant editor's detail panel."},{"t":609,"title":"Constrain output with a Generable @Guide","body":"To improve results, they revisit the `@Generable` `BookTags` type and add **`.count(3...8)`** to the `tags` property's **`@Guide`**, instructing the model to produce only 3 to 8 tags. This is a hill-climbing hypothesis, re-run to verify."},{"t":657,"title":"Building robust datasets","body":"The change makes the test pass at 100% `TagCount`, but reveals a strange behavior: the service now **always produces 8 tags**. With only two samples there were too few measurements to spot trends — a good evaluation needs thousands of samples and real variety."},{"t":675,"title":"Define the dataset with ModelSample","body":"A dataset should be deliberately diverse: different genres, review lengths, fiction vs non-fiction categories, and forms like novels, short stories, and essays. Personal opinions are sprinkled in to test whether the service ignores them; to teach the model your style, put more personal style into the samples' expected values."},{"t":773,"title":"Synthesize more samples with a SampleGenerator","body":"Human data creation doesn't scale either. The built-in **`SampleGenerator`** is called directly on a `ModelSample` array via **`makeSamples`**, with a prompt and `targetCount`, synthesizing more samples with a model of your choice (the example uses sentence-completion pairs). Advanced uses are covered in \"Create robust evaluations for agentic apps.\""},{"t":842,"title":"More evaluators: word count and genre","body":"After expanding the dataset to the whole library, the test still passes at 100% but the always-8-tags behavior persists. This motivates adding more evaluators to track behavior more finely rather than just checking the count range."},{"t":843,"title":"Define a Metric and Evaluator","body":"A new **`TagTotal`** metric records the actual number of tags using a scoring value (not pass/fail), so you can see the **distribution** rather than mere compliance. The same pattern checks whether tags contain spaces (multi-word) and whether they include a known genre."},{"t":860,"title":"Refining metrics and evaluators","body":"The word-count check inspects each tag for a space, returning `wordCount.failing` if found. The genre check is equally direct: fetch `knownGenres` from `BookTaggingService` and compare each generated tag for a match."},{"t":867,"title":"Aggregate metrics across samples","body":"Evaluators run one sample at a time, but `aggregateMetrics(using:)` with a **`MetricsAggregator`** spots trends across all samples. The example computes the mean of `tagCount` and uses `group` to compute standard deviation, mean, and variance of `tagTotal`, yielding a how-often-correct ratio and the tag-total distribution."},{"t":933,"title":"Iterate the feature's instructions (hill-climbing)","body":"The evaluation fills out, now measuring three of the five original expectations via five aggregate metrics, with the report showing tag distribution, range compliance, and genre presence. The speakers keep improving by iterating the `BookTaggingService` instructions."},{"t":941,"title":"Evaluation-driven development and hill-climbing","body":"They show how the instructions evolved across runs, tracking each change by the new expectation added to verify it. Centering development on this **hill-climbing** feedback loop is **evaluation-driven development**."},{"t":972,"title":"Model judges: qualitative metrics","body":"Yada takes over to cover the **model judge** for scaling **qualitative metrics**. With Alice in Wonderland: every quantitative metric passes, yet 'overrated' and 'pretentious' describe the reader's feelings, not the book, and 'whodunit' is the wrong genre — the model latched onto the review's language without understanding the book. Metrics pass but give the wrong signal, so a model is asked to help."},{"t":1122,"title":"Building a model judge","body":"**A model judge is a language model used to score your feature's output**, giving a person-like subjective rating applied consistently across the dataset. The feature `BookTaggingService` runs on-device for speed and locality; the judge should be **at least as capable** as the model under test, here a more capable **Private Cloud Compute** model."},{"t":1133,"title":"Build a model judge","body":"A model judge has key components: instruction (what to evaluate), feature input (the review prompt), feature output (the generated tags), and the scoring guide. The framework handles most of it, so you focus on the scoring guide. The example uses a **`ModelJudgeEvaluator`** with a 1–4 `TagQuality` scale (an even count avoids a neutral middle) and specifies Private Cloud Compute as the judge."},{"t":1279,"title":"Refining with score dimensions","body":"Every sample scores 3 or 4; Alice in Wonderland gets a 3. But reading the rationale, the judge flagged only some irrelevant tags — because **by the scale we wrote, the judge is right**: every tag connects to something the user wrote. The scale was too broad, asking two different questions at once, and needs splitting."},{"t":1337,"title":"Split into score dimensions","body":"The broad question is split into separate **`ScoreDimension`**s. First, **Relevance**: whether each tag describes a quality, theme, or tone of the book itself rather than incidental details or the reader's personal reactions — written as the dimension's description with a 1–4 scale."},{"t":1352,"title":"Add dimensions to the judge","body":"**Usefulness** is defined the same way, and both relevance and usefulness dimensions are added to the **`ModelJudgeEvaluator`**. But dimensions alone aren't enough — they tell the judge what to measure, not how to think about your app."},{"t":1397,"title":"Add app context with a ModelJudgePrompt","body":"A **`ModelJudgePrompt`** supplies app context: the instructions tell the judge this is a personal library app (not a review platform, so a reader's criticism isn't treated as a valid descriptor), `evaluationTarget` formats the response, and `reference` passes the expectedTags for comparison."},{"t":1425,"title":"Reviewing dimension results","body":"After adding context and re-running, the single Quality is replaced by separate relevance and usefulness scores. For Alice in Wonderland, two rationales separate the diagnosis: Relevance says what kind of tag is wrong, Usefulness says how the wrong tags fail at browsing — giving a clear path forward."},{"t":1460,"title":"Best practices","body":"Closing best practices: start with a focused 20–30 sample dataset; spec out how you want the model to behave; use heuristics for quantifiable traits (rule of thumb: measurable in code = quantitative; only describable in words = needs a `ModelJudgeEvaluator`); start simple with the judge — define a dimension, run it, read the rationales; and use rationales to drive your next change (too-uniform scores mean the question is too broad)."},{"t":1538,"title":"Next steps","body":"Viewers are pointed to the documentation and sample code, plus two follow-up sessions: \"Improve your prompts by hill climbing with Evaluations\" and \"Create robust evaluations for agentic apps.\""}],"code":[]},"related":[{"id":"299","title":"Create robust evaluations for agentic apps","gloss":"為 agentic App 建立穩健的評估","gloss_en":"Create robust evaluations for agentic apps","category":"ai","categoryLabel":"AI 與機器學習"},{"id":"335","title":"Improve your prompts by hill-climbing with Evaluations","gloss":"用評估爬坡法改進你的提示詞","gloss_en":"Improve your prompts by hill-climbing with Evaluations","category":"ai","categoryLabel":"AI 與機器學習"},{"id":"241","title":"What’s new in the Foundation Models framework","gloss":"Foundation Models 框架的新功能","gloss_en":"What's new in the Foundation Models framework","category":"ai","categoryLabel":"AI 與機器學習"},{"id":"246","title":"LLM search using Core Spotlight","gloss":"使用 Core Spotlight 的 LLM 搜尋","gloss_en":"LLM search using Core Spotlight","category":"ai","categoryLabel":"AI 與機器學習"},{"id":"319","title":"Build with the new Apple Foundation Model on Private Cloud Compute","gloss":"在 Private Cloud Compute 上使用全新 Apple Foundation Model 開發","gloss_en":"Build with the new Apple Foundation Model on Private Cloud Compute","category":"ai","categoryLabel":"AI 與機器學習"}]}</script>
