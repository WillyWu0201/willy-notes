<script id="d" type="application/json">{"s":{"id":"250","title":"Principles of great design","gloss":"卓越設計的原則","category":"design","categoryLabel":"設計","duration":1036,"url":"https://developer.apple.com/videos/play/wwdc2026/250/","takeaway":"以目的、能動性、責任、熟悉感、彈性、簡潔、工藝與愉悅這幾項基本原則，作為打造優秀 Apple 平台體驗的設計準則。","chapters":[[0,"Intro"],[68,"Purpose"],[112,"Agency"],[218,"Responsibility"],[364,"Familiarity"],[532,"Flexibility"],[673,"Simplicity"],[822,"Craft"],[947,"Delight"]],"points":[{"text":"深入探討 Apple 平台的**基本設計原則**，建立判斷好設計的共同語言。","hot":false},{"text":"從**目的（Purpose）與能動性（Agency）**出發，讓設計服務使用者的意圖。","hot":false},{"text":"強調**責任（Responsibility）、熟悉感（Familiarity）與彈性（Flexibility）**，兼顧信任與適應力。","hot":false},{"text":"以**簡潔（Simplicity）、工藝（Craft）與愉悅（Delight）**收尾，追求細節品質與情感體驗。","hot":false}],"apis":[],"audience":"**設計師與在意產品體驗的開發者**，想建立紮實設計判斷力的人。","gloss_en":"Principles of great design","takeaway_en":"Use the fundamental principles of purpose, agency, responsibility, familiarity, flexibility, simplicity, craft, and delight as the design guidelines for building great Apple platform experiences.","points_en":[{"text":"Dive deep into the **fundamental design principles** for Apple platforms, building a shared language for judging good design.","hot":false},{"text":"Start from **purpose and agency** so design serves the user's intent.","hot":false},{"text":"Emphasize **responsibility, familiarity, and flexibility**, balancing trust and adaptability.","hot":false},{"text":"Close with **simplicity, craft, and delight**, pursuing detail quality and emotional experience.","hot":false}],"audience_en":"**Designers and developers who care about product experience** and want to build solid design judgment.","summary":["這場由 Apple Design Evangelists Linda 與 Doug 主講的設計專題，回到最根本的問題：什麼是設計？他們的答案是「**帶著意圖去製作（making something with intention）**」——聚焦對人最重要的事，做出真正有價值的東西。每加一個功能，都在向使用者索取時間、注意力與信任，因此設計常常是「決定不做什麼」。整場圍繞八個可在 Apple 平台上打造優秀體驗的**基礎設計原則**，並強調沒有公式或唯一正解，原則之間甚至會互相拉扯，最終要靠你的知識與直覺找到最佳路徑。","八大原則依序為：**Purpose**（在動筆寫程式前先想清楚要做的東西有沒有目的）、**Agency**（把控制權交給人、提供選擇與不阻擋使用者；並以 **forgiveness** 讓人能 undo、在破壞性操作前確認來支撐自主性）、**Responsibility**（以使用者最佳利益行事，從隱私這項人權出發，只在對的時機要求必要資料並透明說明用途，並認真思考功能如何被濫用、AI 可能產生不準確或有害結果，必要時加上預覽／確認／免責，甚至移除風險過高的功能）。","接著是 **Familiarity**（建立在人們既有的知識上，善用恰到好處的 metaphor、保持行為與位置的 consistency）、**Flexibility**（承認人們以各自獨特的方式使用產品，支援不同情境與裝置、照顧不同能力與無障礙需求，並允許個人化）、**Simplicity**（簡單不等於極簡，而是 frictionless 與 intuitive，靠 concise 的用語與 clear 的階層；有時讓介面更簡單反而需要補上 context）、**Craft**（對細節的執著，用高品質的字型、色彩、圖像、流暢動畫與可靠 SDK，並持續迭代與維護），最後是 **Delight**（從你希望使用者感受到的情緒出發，是把所有原則都做對後自然湧現的成果）。建議以 **Human Interface Guidelines** 與新的設計原則頁面作為起點。"],"deepdive":[{"t":0,"title":"Intro","body":"Design Evangelists Linda 與 Doug 開場，拋出「什麼是設計」的問題。他們主張設計不只是外觀或行為，而是 **making something with intention**——聚焦對人最重要的事。每個功能都在索取時間、注意力與信任，因此選擇做什麼，往往是決定不做什麼。"},{"t":68,"title":"Purpose","body":"第一個原則 **Purpose**：在畫下任何草圖或寫下任何程式碼之前，先思考你要做的東西是否有目的。並強調這些原則沒有公式或唯一正解，偏重某一原則時可能在另一原則上有所取捨，最終要靠知識與直覺找到最佳路徑。"},{"t":112,"title":"Agency","body":"**Agency** 是把人放在掌控位置：提供選擇、讓介面不阻擋使用者想做的事，給予自主探索的空間。也談 **forgiveness**——人會誤觸、誤刪，要讓 undo 容易，並在破壞性操作前確認；謹慎使用 interruption，只在快要鑄成大錯時介入，讓人安心探索。"},{"t":218,"title":"Responsibility","body":"**Responsibility** 是以人的最佳利益行事，起點是隱私這項人權：不要一啟動就丟權限提示、只要求必要資料並透明說明用途。也要保護安全，認真自問功能如何被濫用、誰會受害；負責任地加入 AI 時須預期模型可能產生不準確或有害內容（如過敏食譜），用預覽／確認／免責減緩，風險過高則移除。"},{"t":364,"title":"Familiarity","body":"**Familiarity** 建立在人們既有的知識上：善用 **metaphor**（如垃圾桶代表刪除），但別太字面也別太抽象；保持 **consistency**——外觀相同者行為應相同、相同動作放在相同位置（如 Mac 視窗永遠在左上角關閉），讓人能預測接下來會發生什麼。"},{"t":532,"title":"Flexibility","body":"**Flexibility** 承認人們以如同自身一樣獨特的方式使用產品：支援不同情境（在家用喇叭、跑步用 AirPods、開車免持），為每種裝置發揮其獨特優勢；照顧年齡、語言、熟練度與無障礙等不同能力，並在無法滿足所有人時允許 **個人化**（如重排或隱藏控制項）。"},{"t":673,"title":"Simplicity","body":"**Simplicity** 是去蕪存菁讓核心目的凸顯，但簡單不等於極簡——把功能全藏起來只是看起來極簡。簡單的設計 frictionless 且 intuitive，靠 **concise**（平實用語、減少步驟）與 **clear**（用 hierarchy、間距、對比建立階層）。有時讓介面更簡單反而要**補上 context**（如顯示剩餘時間），剛剛好就是簡單。"},{"t":822,"title":"Craft","body":"**Craft** 是對細節的執著，讓人感受到你真的在乎。粗製濫造的軟體（按鈕卡頓、捲動抖動、圖示錯位、旋轉後版面亂掉）讓人質疑成果品質；精心打磨則帶來信心。要素包括高品質字型、適應明暗的色彩、清晰圖像、流暢動畫與可靠安全的 SDK，並靠 **iteration** 與持續**維護**讓設計具備 longevity。"},{"t":947,"title":"Delight","body":"**Delight** 難以定義卻一眼可辨：令人滿足、豐富，並建立真實的情感連結。它不是事後灑彩帶或加花飾，而是先**界定你希望使用者感受到的情緒**（放鬆、自信、興奮）再透過設計強化。Delight 是把前述所有原則都做對後自然湧現的結果。最後建議以 **Human Interface Guidelines** 與新的設計原則頁面作為起點。"}],"summary_en":["Presented by Apple Design Evangelists Linda and Doug, this design talk returns to the most basic question: what is design? Their answer is **making something with intention**—focusing on what's most important to people so you build something they truly value. Every feature you add asks for the user's time, attention, and trust, so design is often a matter of deciding what not to include. The talk centers on eight foundational **design principles** for building great experiences on Apple platforms, stressing there's no formula or single right way—principles can even pull against each other, and ultimately you use your knowledge and intuition to find the best path.","The eight principles, in order: **Purpose** (before sketching or coding, ask whether what you're making has purpose); **Agency** (put people in control with choices and an interface that never stands in the way, supported by **forgiveness**—make undo easy and double-check destructive actions); and **Responsibility** (act in people's best interest, starting with privacy as a human right—ask for necessary data only at the right moment and be transparent about its use, think hard about how features could be misused and how AI might produce inaccurate or harmful results, adding previews/confirmations/disclaimers or removing features whose risks outweigh their value).","Then **Familiarity** (build on what people know with well-judged metaphors and consistent behavior and placement); **Flexibility** (recognize people use your design in ways as unique as they are—support different contexts and devices, cater to a range of abilities and accessibility needs, and allow personalization); **Simplicity** (simple isn't minimal but frictionless and intuitive, achieved through concise language and clear hierarchy—sometimes simplicity even means adding context); **Craft** (an uncompromising attention to detail using high-quality fonts, colors, graphics, fluid animation, and reliable SDKs, sustained through iteration and maintenance); and finally **Delight** (start from the emotion you want people to feel—it's the natural result of getting all the principles right). They recommend the **Human Interface Guidelines** and the new design principles page as a starting point."],"deepdive_en":[{"t":0,"title":"Intro","body":"Design Evangelists Linda and Doug open with the question 'what is design?' They argue design isn't just look or behavior but **making something with intention**—focusing on what's most important to people. Every feature asks for time, attention, and trust, so choosing what to build is often deciding what not to include."},{"t":68,"title":"Purpose","body":"The first principle, **Purpose**: before drawing a sketch or writing a line of code, think about whether what you're making has purpose. They stress there's no formula or single right answer—leaning into one principle may mean compromising another, and you find the best path with knowledge and intuition."},{"t":112,"title":"Agency","body":"**Agency** puts people in control: offer choices, let the interface not stand in the way, and give autonomy to explore. It also covers **forgiveness**—people mis-tap and mis-delete, so make undo easy and confirm before destructive actions; use interruptions sparingly, only when a big mistake is imminent, so people feel free to explore."},{"t":218,"title":"Responsibility","body":"**Responsibility** means acting in people's best interest, starting with privacy as a human right: don't throw permission prompts on launch, ask only for what's necessary, and be transparent about its use. Keep people safe by asking how features could be misused and who could be harmed; when adding AI, anticipate inaccurate or harmful output (like an allergy-triggering recipe), mitigate with previews/confirmations/disclaimers, or remove features when risks outweigh value."},{"t":364,"title":"Familiarity","body":"**Familiarity** builds on what people already know: use **metaphors** (a trash can for delete) that are neither too literal nor too abstract, and keep **consistency**—things that look the same should behave the same, and the same action should live in the same place (a Mac window always closes top-left)—so people can predict what happens next."},{"t":532,"title":"Flexibility","body":"**Flexibility** recognizes people use your design in ways as unique as they are: support different contexts (speakers at home, AirPods on a run, hands-free while driving) and play to each device's strengths; cater to differences in age, language, expertise, and accessibility; and when you can't satisfy everyone, allow **personalization** (rearranging or hiding controls)."},{"t":673,"title":"Simplicity","body":"**Simplicity** strips away the unnecessary so the core purpose shines, but simple isn't minimal—hiding everything just looks minimal. Simple designs are frictionless and intuitive through being **concise** (plain language, fewer steps) and **clear** (hierarchy via order, spacing, contrast). Sometimes making an interface simpler means **adding context** (like remaining time); simplicity is having exactly enough."},{"t":822,"title":"Craft","body":"**Craft** is attention to detail that shows you care. Shoddy software (laggy buttons, jittery scrolling, misaligned icons, broken rotation layouts) makes people question the results; meticulous craft inspires confidence. Ingredients: high-quality fonts, light/dark-adapting colors, clear graphics, fluid animation, and reliable secure SDKs, achieved through **iteration** and ongoing **maintenance** for longevity."},{"t":947,"title":"Delight","body":"**Delight** is hard to define but instantly recognizable: satisfying, enriching, and emotionally connecting. It's not confetti tacked on at the end but starts by **identifying the emotion** you want people to feel (relaxed, confident, excited) and reinforcing it through design. Delight is the natural result of getting all the other principles right. They close by recommending the **Human Interface Guidelines** and the new design principles page."}],"code":[]},"related":[{"id":"220","title":"Refine accessibility for custom controls","gloss":"為自訂控制項優化無障礙體驗","gloss_en":"Refine accessibility for custom controls","category":"design","categoryLabel":"設計"},{"id":"251","title":"Communicate your brand identity on iOS","gloss":"在 iOS 上傳達品牌識別","gloss_en":"Communicate your brand identity on iOS","category":"design","categoryLabel":"設計"},{"id":"290","title":"Craft clear names for features and labels in your app","gloss":"為 App 的功能與標籤取清楚的名稱","gloss_en":"Craft clear names for features and labels in your app","category":"design","categoryLabel":"設計"},{"id":"292","title":"Design intuitive search experiences","gloss":"設計直覺的搜尋體驗","gloss_en":"Design intuitive search experiences","category":"design","categoryLabel":"設計"},{"id":"8005","title":"Accessibility Technologies Group Lab","gloss":"無障礙技術小組實驗室","gloss_en":"Accessibility Technologies Group Lab","category":"design","categoryLabel":"設計"}]}</script>
