<script id="d" type="application/json">{"s":{"id":"275","title":"Code-along: Add persistence with SwiftData","gloss":"程式碼實作：用 SwiftData 加入持久化","category":"swiftui","categoryLabel":"SwiftUI","duration":1355,"url":"https://developer.apple.com/videos/play/wwdc2026/275/","takeaway":"跟著實作把現有 App 加上 SwiftData 持久化：以 @Model 定義模型與關聯，再用 @Query 在 SwiftUI 中動態查詢資料。","chapters":[[0,"Introduction"],[65,"Identify relevant state"],[197,"Define your schemas"],[219,"Convert Activity to a persistent model with @Model"],[366,"Add Codable conformance to TripCollection"],[581,"Define model relationships"],[632,"Set up model relationships between Trip, TripImage, and Activity"],[801,"Enable interoperability between your schema and SwiftUI views"],[813,"Update the view layer"],[987,"Fetch achieved and upcoming goals"],[1009,"Fetch recent trips"],[1046,"Dynamically construct a query in the initializer of TripCollectionView"],[1093,"Search for trips and activities by name"],[1182,"Capture and report errors from ActivityItemView"],[1264,"Update dateEdited and propagate side effects on property changes"],[1307,"Next steps"]],"points":[{"text":"跟著實作為現有 App 加上持久化：用 **@Model** 把 Activity、Trip 等類別轉成持久化模型。","hot":true},{"text":"以 **@Relationship**（含 deleteRule 與 inverse）定義 Trip、TripImage、Activity 之間的關聯。","hot":false},{"text":"在 SwiftUI 中用 **@Query** 搭配 **#Predicate** 與 **FetchDescriptor** 動態查詢、排序與限制筆數，並支援依名稱搜尋。","hot":false},{"text":"用 **ModelContainer** 設定容器與種子資料，並在 View 中捕捉與回報儲存錯誤。","hot":false},{"text":"透過 **withContinuousObservation** 觀察屬性變更，更新 dateEdited 並連動處理副作用。","hot":false}],"apis":["SwiftData","@Model","@Query","@Relationship","#Predicate","FetchDescriptor","ModelContainer"],"audience":"**想為 SwiftUI App 加入本地持久化**、正要上手或深入 SwiftData 的開發者。","gloss_en":"Code-along: Add persistence with SwiftData","takeaway_en":"Follow along to add SwiftData persistence to an existing app: define models and relationships with @Model, then query data dynamically in SwiftUI with @Query.","points_en":[{"text":"Follow along to add persistence to an existing app: use **@Model** to turn classes like Activity and Trip into persistent models.","hot":true},{"text":"Use **@Relationship** (including deleteRule and inverse) to define the relationships between Trip, TripImage, and Activity.","hot":false},{"text":"In SwiftUI, use **@Query** with **#Predicate** and **FetchDescriptor** to dynamically query, sort, and limit results, with support for searching by name.","hot":false},{"text":"Use **ModelContainer** to configure the container and seed data, and catch and report save errors in the view.","hot":false},{"text":"Use **withContinuousObservation** to observe property changes, update dateEdited, and handle side effects in tandem.","hot":false}],"audience_en":"**Developers who want to add local persistence to a SwiftUI app** and are just getting started with or going deeper into SwiftData.","summary":["這場 code-along 由 SwiftData 工程師 Matthew Turk 主講，以一個名為 Wishlist 的旅遊清單 app 為範例，示範如何把原本只存在記憶體裡的動態資料，改造成跨 Apple 平台、可永久保存的持久層。原始 app 透過 SwiftUI environment 注入一個 **DataSource** 類別，所有 trip、goal、搜尋結果都在記憶體中即時過濾與排序;這對小範例可行,但會持續占用 RAM,而且 app 一關閉、新增的資料就全部消失,回到預載內容。SwiftData 正是為解決這類問題而生:把 app 狀態連到持久化儲存,並透過 **ModelContext** 來存取。","改造的第一步是辨識相關狀態(trip collections、goal 狀態、搜尋結果),並把這些資料型別重構成 SwiftData 的 schema。具體做法是 import SwiftData,把 **@Observable** 換成 **@Model**(SwiftData 會自動產生 observable conformance)。過程中要逐一修正編譯錯誤:`creationDate` 必須改成 `var` 才能由資料庫填值、所有 model 屬性都必須是 **Codable** 才能序列化成資料庫欄位。原本以 enum 定義的 **Goal** 因為是封閉值集合,無法當持久 model,要改成 class,並用 SwiftData 的 **model inheritance** 拆出 TripGoal 與 ActivityGoal 子類別。","接著定義 model 之間的關係。每個 Trip 對多個 Activity 屬於 to-many relationship,以宣告陣列加上 **@Relationship(deleteRule: .cascade)** 來表達,刪除 trip 時連帶清掉其 activities。圖片處理也重新設計:用 `thumbnailData` 把低解析縮圖以原始 bytes 內嵌資料庫,完整解析圖則透過 external file reference 存成獨立的 **TripImage** model。由於 SwiftUI view 可直接綁定 SwiftData model,TripEditModel 與 DataSource 等檔案得以刪除,移除了數百行狀態管理、儲存、過濾、排序與搜尋的程式碼。","view 層則改用 **@Query** 搭配 **#Predicate**,等同於對 model context 呼叫 fetch,但能在結果變動時自動更新 UI。講者強調用 predicate 在資料庫端就篩選(像直接請圖書館員只拿你要的書),比起把全部抓回來再丟掉,能在記憶體與磁碟 I/O 間取得最佳平衡;查詢可在 view 的 initializer 內依參數動態建構(如 TripCollectionView 依季節、SearchResultsListView 依搜尋字串)。最後以 view modifier 捕捉並呈現執行期錯誤(如磁碟空間不足),並用 2027 版本新增的 **withContinuousObservation**(Continuous Observation)重新讓 `dateEdited` 即時更新,取代與 SwiftData 不相容的 didSet property observers。整體 takeaway:先設計出 app 狀態的恰當表示並宣告 Model schema,再用 predicate 寫精準查詢平衡記憶體與儲存,並持續調整 SwiftUI view 以與 SwiftData 達到最佳互通。"],"deepdive":[{"t":0,"title":"Introduction","body":"由 SwiftData 團隊工程師 **Matthew Turk** 開場,目標是把現有 SwiftUI app 的動態資料連到跨 Apple 平台的現代持久層。範例 app **Wishlist** 用清單管理旅遊計畫,把 trips 分成各季節主題的 collection。影片會逐步走過專案檔案,辨識可做為 model 與 schema 的型別,定義 model 間關係,並以效能、互通性與擴充性為考量更新 view。"},{"t":65,"title":"Identify relevant state","body":"示範現有資料流:view 透過 SwiftUI environment 取得 **DataSource**,所有 trip、goal、搜尋結果都在記憶體中即時過濾排序。問題在於這仰賴 RAM 處理與儲存,並非穩定的保存位置——關閉 app 再開,新增的 \"Northern Lights\" trip 就消失、重設回預載內容。這正是 **SwiftData** 透過 model context 連到持久儲存所要解決的問題。"},{"t":197,"title":"Define your schemas","body":"確立相關狀態(trip collections、goal 狀態、搜尋結果)後,下一步是在程式碼中找到這些資料結構,並重構成帶 SwiftData schema 的 model。這會為後續用持久化的 **ModelContext** 取代記憶體中的 DataSource、進而寫出高效資料庫查詢來驅動 view 鋪路。"},{"t":219,"title":"Convert Activity to a persistent model with @Model","body":"以 **Activity** 為例,持久化第一步是 import SwiftData 並把 **@Observable** 換成 **@Model**,SwiftData 會自動產生 observable conformance。講者也指出 name 與 isComplete 上的 didSet observers 會在屬性變動時更新 `dateEdited`,但 property observer 與 computed property 不一定相容,因此先移除這些 didSet 區塊、保留 dateEdited,稍後再用別的技術補回。"},{"t":366,"title":"Add Codable conformance to TripCollection","body":"輪到 **Trip** class,同樣 import SwiftData 並換 macro。檢視編譯錯誤:`creationDate` 必須改成 **var**,SwiftData 才能在執行期以資料庫載入的值填入;另一錯誤指出所有 model 屬性都必須 **Codable**,因為 SwiftData 要把屬性序列化成資料庫欄位。於是跳到 **TripCollection** 宣告處明確加上 Codable conformance,讓季節主題能納入 schema 並持久化。"},{"t":581,"title":"Define model relationships","body":"說明 goal tracking:原本 **Goal** 是 enum,因 enum 定義的是封閉值集合而無法做持久 model,須改成可儲存屬性、可任意實例化的 **class**。重新設計後保留 name、kind、targetCount,並新增 `completedCount` 與 `isComplete` 儲存屬性(達標時存 true),方便日後查詢時區分已完成與待完成 goal。再以 **model inheritance** 把 kind 的差異拆成 **TripGoal** 與 **ActivityGoal** 子類別。"},{"t":632,"title":"Set up model relationships between Trip, TripImage, and Activity","body":"把原本用 dictionary 與迴圈近似的 to-many 關係,改成正式的 model relationship:在 Trip 宣告 activities 陣列並加上 **@Relationship(deleteRule: .cascade, inverse: \\Activity.trip)**,刪 trip 時連帶清除其 activities。圖片方面新增 `thumbnailData` 內嵌低解析縮圖原始 bytes,完整圖則以 external file reference 存成獨立的 **TripImage** model;photoURL 經 refactor 重新命名為 photo,並以 multi-cursor 一次更新多個檔案。"},{"t":801,"title":"Enable interoperability between your schema and SwiftUI views","body":"因為 SwiftUI view 能直接綁定 SwiftData model 並即時傳遞編輯,**TripEditModel** 已無存在必要;DataSource 的所有職責也由 ModelContext、query 與 relationship 自動處理,可直接刪除。講者強調這一步移除了專案中數百行的狀態管理、儲存、過濾、排序、關係走訪與搜尋程式碼。"},{"t":813,"title":"Update the view layer","body":"schema 與 model container 就位後,自動儲存預設啟用。接下來要為每個呈現 model 的子 view 加上精準、針對性的查詢,再用 SwiftUI view modifier 捕捉與呈現執行期可能發生的錯誤(如磁碟空間不足或不支援的 predicate),最後補回缺少的 property observer 讓 UI 事件正確傳遞資料與副作用。WindowGroup 上的 **.modelContainer** scene modifier 則告訴 SwiftUI 採用新 schema。"},{"t":987,"title":"Fetch achieved and upcoming goals","body":"對比兩種取資料方式:抓全部 goal 再丟掉不要的,記憶體用得少但 I/O 多(像請圖書館員把每本書都搬來);用 **#Predicate** 則像事先告訴館員你要什麼,只取所需。在 GoalsView 中 import SwiftData,把 dataSource environment 換成兩個 **@Query**:一個依 dateAchieved 反向排序抓已達成 goal,另一個抓剩餘的待完成 goal,並能在結果變動時自動更新 view。"},{"t":1009,"title":"Fetch recent trips","body":"同樣的概念套用到 **RecentTripsPageView**:import SwiftData,以 **@Query** 搭配 FetchDescriptor 取代 dataSource,依 creationDate 反向排序並設 `fetchLimit: 5`,取得最近 5 筆 trip 直接餵進 ForEach。這展示 SwiftData 如何以針對性查詢取代全域變數、降低持續的記憶體占用。"},{"t":1046,"title":"Dynamically construct a query in the initializer of TripCollectionView","body":"**TripCollectionView** 要依季節分段 trip,每個 tripCollection 對應一個 view 實例,但 view 在 init 前並不知道要顯示哪個季節,因此先宣告 query 再於 initializer 內動態建構。重點是 predicate 直接從 initializer 捕捉 tripCollection 參數,於送往資料庫前完成過濾,結果再進入 ForEach。"},{"t":1093,"title":"Search for trips and activities by name","body":"第三個分頁的 **SearchResultsListView** 由上層 view 持有搜尋欄與文字並傳入 initializer。同樣把 dataSource 換成 query 宣告,依參數建構 predicate:搜尋字串為空時 fallback 抓最近 3 筆 trip;否則以 `localizedStandardContains` 比對 trip 與隸屬於 trip 的 activity 名稱並排序。List 的 overlay 則改用 `trips.isEmpty` 與 `activities.isEmpty` 直接判斷,無結果時顯示 **ContentUnavailableView**。"},{"t":1182,"title":"Capture and report errors from ActivityItemView","body":"**ActivityItemView** 的 `updateGoalAchievements` 會在使用者完成 activity 時更新進度且可能丟出錯誤。講者把錯誤捕捉到 state 變數,送進 telemetry 系統以利日後改進 app,並在合理時以 **.alert** 呈現,告知使用者如何從錯誤中恢復。這處理了持久層的錯誤案例。"},{"t":1264,"title":"Update dateEdited and propagate side effects on property changes","body":"重現先前移除 didSet 造成的 bug:依 \"Date Edited\" 排序時勾選 activity,卻不會移到最上方。改用 2027 版本 Observation 框架新增的 **withContinuousObservation** 在 ActivityItemView 的 initializer 設定觀察:當 name 或 isComplete 改變時更新 `dateEdited`,觸發 query 自動更新清單;同時順帶更新 Trip 的 `isComplete`——當所有 activity 都完成時整個 trip 視為完成。"},{"t":1307,"title":"Next steps","body":"總結整套流程:先思考 app 狀態的恰當表示並宣告構成 schema 的 **Model** 型別,接著用 predicate 寫針對性查詢來平衡記憶體與磁碟儲存,並持續調整 SwiftUI view 以與 SwiftData 達到最佳互通。講者最後勾掉今天的最後一項 activity、贏得 badge 作結。"}],"summary_en":["In this code-along, SwiftData engineer Matthew Turk uses a travel-planning app called Wishlist to show how to take in-memory, dynamic SwiftUI data and turn it into a persistent layer that works across all of Apple's platforms. The original app injects a **DataSource** class through the SwiftUI environment, filtering and sorting every trip, goal, and search result in memory on demand. That works for a small example but keeps an elevated memory footprint and, crucially, loses any newly added data the moment the app closes, resetting to preinstalled content. This is precisely the problem **SwiftData** solves by connecting app state to persistent storage via a **ModelContext**.","The first step is to identify the relevant state (trip collections, goal statuses, search results) and refactor those types into SwiftData schemas. Concretely, you import SwiftData and replace **@Observable** with **@Model** (SwiftData auto-generates observable conformance). Build errors guide the rest: `creationDate` must become a `var` so the database can populate it, and every model property must be **Codable** to be serialized into columns. The enum-based **Goal** can't be a persistent model because an enum is a closed set of values, so it becomes a class, and **model inheritance** splits it into TripGoal and ActivityGoal subclasses.","Next come relationships. Each Trip-to-many-Activity is a to-many relationship, declared as an array annotated with **@Relationship(deleteRule: .cascade)** so deleting a trip cascades to its activities. Image handling is redesigned too: `thumbnailData` inlines a low-resolution thumbnail's raw bytes in the database, while the full-resolution image is stored as an external file reference behind a dedicated **TripImage** model. Because SwiftUI views bind directly to SwiftData models, files like TripEditModel and DataSource are deleted, removing hundreds of lines of state management, storage, filtering, sorting, and search code.","The view layer then switches to **@Query** with **#Predicate**, equivalent to calling fetch on a model context but auto-updating the UI when results change. Turk stresses filtering at the database with a predicate (like asking a librarian only for the books you want) to balance memory against disk I/O, and shows queries built dynamically in a view's initializer (by season in TripCollectionView, by search text in SearchResultsListView). Finally, view modifiers capture and surface runtime errors like low disk space, and the new **withContinuousObservation** (Continuous Observation, added in the 2027 releases) restores live `dateEdited` updates that the SwiftData-incompatible didSet observers used to provide. The takeaway: model your state into a proper schema, write targeted predicate-based queries to balance memory and storage, and keep tuning SwiftUI views for interoperability with SwiftData."],"deepdive_en":[{"t":0,"title":"Introduction","body":"SwiftData engineer **Matthew Turk** opens with the goal of connecting an existing SwiftUI app's dynamic data to a modern, cross-platform persistence layer. The sample app **Wishlist** organizes travel plans in lists, grouping trips into seasonal collections. The video walks the project files to identify types for models and schemas, define relationships between them, and update the views with an eye toward performance, interoperability, and extensibility."},{"t":65,"title":"Identify relevant state","body":"The current data flow is demoed: views pull a **DataSource** from the SwiftUI environment, and all trips, goals, and search results are filtered and sorted in memory on demand. The problem is that this relies on RAM for both processing and storage, which isn't stable—close and relaunch the app and the new \"Northern Lights\" trip is gone, reset to preinstalled content. This is exactly what **SwiftData** addresses by connecting state to persistent storage through a model context."},{"t":197,"title":"Define your schemas","body":"Having identified the relevant state (trip collections, goal statuses, search results), the next move is to find where those data structures live in the code and refactor them as models with SwiftData schemas. This sets up replacing the in-memory DataSource with a persistent **ModelContext** to drive the views with efficient database queries."},{"t":219,"title":"Convert Activity to a persistent model with @Model","body":"Using **Activity** as the example, the first persistence step is to import SwiftData and replace **@Observable** with **@Model**; SwiftData auto-generates observable conformance. Turk notes the didSet observers on name and isComplete that update `dateEdited`, but since property observers and computed properties aren't always compatible, he removes the didSet blocks for now (leaving dateEdited) and restores the behavior later with a different technique."},{"t":366,"title":"Add Codable conformance to TripCollection","body":"The **Trip** class is next—same import-and-swap-macro treatment. Build errors reveal that `creationDate` must become a **var** so SwiftData can populate it at runtime from the database, and that all model properties must be **Codable** so SwiftData can serialize them into columns. He jumps to the **TripCollection** declaration and adds Codable conformance explicitly so the trip's seasonal theme is included in the schema and persisted."},{"t":581,"title":"Define model relationships","body":"Goal tracking is explained: **Goal** was an enum, but because an enum defines a closed set of values it can't be a persistent model—it needs to be a **class** that stores properties and can be instantiated freely. The redesign keeps name, kind, and targetCount and adds stored `completedCount` and `isComplete` (true once the target is met), which helps later when querying to separate completed from upcoming goals. **Model inheritance** then splits the kind differences into **TripGoal** and **ActivityGoal** subclasses."},{"t":632,"title":"Set up model relationships between Trip, TripImage, and Activity","body":"The to-many relationships previously approximated with dictionaries and loops become proper model relationships: Trip declares an activities array annotated with **@Relationship(deleteRule: .cascade, inverse: \\Activity.trip)** so deleting a trip clears its activities. For images, a new `thumbnailData` inlines low-resolution raw bytes in the database, while the full image is stored via an external file reference behind a dedicated **TripImage** model; photoURL is refactor-renamed to photo, updating multiple files at once with multi-cursor editing."},{"t":801,"title":"Enable interoperability between your schema and SwiftUI views","body":"Because SwiftUI views bind directly to SwiftData models and propagate edits in real time, **TripEditModel** is no longer needed; DataSource's responsibilities are all handled automatically by ModelContext, queries, and relationships, so both can be deleted. Turk highlights that this step removes hundreds of lines of state management, storage, filtering, sorting, relationship traversal, and search code."},{"t":813,"title":"Update the view layer","body":"With the schemas and model container in place, automatic saving is enabled by default. Next, each subview that presents models gets efficient, targeted queries; SwiftUI view modifiers then capture and surface possible runtime errors like low disk capacity or unsupported predicates; and finally, missing property observers are added back so UI events propagate the right data and side effects. The **.modelContainer** scene modifier on WindowGroup tells SwiftUI to use the new schema."},{"t":987,"title":"Fetch achieved and upcoming goals","body":"Two fetching approaches are contrasted: fetching all goals then discarding the irrelevant ones uses less memory but incurs more I/O (like asking a librarian to grab every book), whereas using a **#Predicate** is like asking upfront for exactly what you want. In GoalsView, import SwiftData and replace the dataSource environment with two **@Query** declarations—one fetching achieved goals sorted by dateAchieved in reverse, the other fetching the remaining upcoming goals—both auto-updating the view when results change."},{"t":1009,"title":"Fetch recent trips","body":"The same idea applies to **RecentTripsPageView**: import SwiftData and replace dataSource with an **@Query** using a FetchDescriptor that sorts by creationDate in reverse with `fetchLimit: 5`, yielding the five most recent trips fed straight into a ForEach. This demonstrates how SwiftData replaces global variables with targeted queries that reduce ongoing memory use."},{"t":1046,"title":"Dynamically construct a query in the initializer of TripCollectionView","body":"**TripCollectionView** segments trips by season, with one view instance per tripCollection, but the view doesn't know which season it'll show until initialized—so the query is declared and then constructed dynamically in the initializer. The key point is that the predicate captures the tripCollection parameter directly from the initializer before heading to the database, with results flowing into the ForEach."},{"t":1093,"title":"Search for trips and activities by name","body":"The third tab's **SearchResultsListView** receives the search field and text from its superview's initializer. Again dataSource is replaced with query declarations whose predicates are built from the parameters: an empty search string falls back to the three most recent trips, otherwise it matches trip names and trip-owned activity names with `localizedStandardContains` and sorts them. The List's overlay uses direct `trips.isEmpty` and `activities.isEmpty` checks to show a **ContentUnavailableView** when there are no results."},{"t":1182,"title":"Capture and report errors from ActivityItemView","body":"**ActivityItemView**'s `updateGoalAchievements` updates progress as people complete activities and can throw errors. Turk captures those errors in a state variable, passes them to a telemetry system to improve the app, and—when reasonable—presents an **.alert** letting people know how to recover. That handles the persistence layer's error case."},{"t":1264,"title":"Update dateEdited and propagate side effects on property changes","body":"The bug from removing didSet is reproduced: sorting by \"Date Edited\" and checking off an activity doesn't move it to the top. The fix uses **withContinuousObservation**, added to the Observation framework in the 2027 releases, set up in ActivityItemView's initializer: whenever name or isComplete changes, it updates `dateEdited`, triggering the query to refresh the list; it also updates the Trip's `isComplete` as a side effect when all activities are complete."},{"t":1307,"title":"Next steps","body":"The workflow is summarized: start by considering the appropriate representation of your app's state and declaring the **Model** types that make up your schema, then write targeted queries using predicates to balance memory use against on-disk storage, and stay current on adjusting SwiftUI views for optimal interoperability with SwiftData. Turk closes by checking off the day's last activity and earning his badge."}],"code":[]},"related":[{"id":"240","title":"Build intelligent Siri experiences with App Schemas","gloss":"用 App Schemas 打造智慧 Siri 體驗","gloss_en":"Build intelligent Siri experiences with App Schemas","category":"ai","categoryLabel":"AI 與機器學習"},{"id":"274","title":"What’s new in SwiftData","gloss":"SwiftData 的新功能","gloss_en":"What's new in SwiftData","category":"swift","categoryLabel":"Swift"},{"id":"8017","title":"SwiftData Group Lab","gloss":"SwiftData 團體實驗室","gloss_en":"SwiftData Group Lab","category":"swift","categoryLabel":"Swift"},{"id":"223","title":"Live Activities essentials","gloss":"Live Activities 核心要點","gloss_en":"Live Activities essentials","category":"swiftui","categoryLabel":"SwiftUI"},{"id":"269","title":"What’s new in SwiftUI","gloss":"SwiftUI 的新功能","gloss_en":"What's new in SwiftUI","category":"swiftui","categoryLabel":"SwiftUI"}]}</script>
