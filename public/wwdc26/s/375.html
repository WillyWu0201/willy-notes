<script id="d" type="application/json">{"s":{"id":"375","title":"Create high-quality images using Image Playground","gloss":"用 Image Playground 產生高品質影像","category":"ai","categoryLabel":"AI 與機器學習","duration":851,"url":"https://developer.apple.com/videos/play/wwdc2026/375/","takeaway":"用 **Image Playground** 在 App 中產生高品質影像，新模型運行於 Private Cloud Compute，並可透過 concepts、參考相片與樣式客製化。","chapters":[[0,"Introduction"],[123,"Capabilities"],[302,"Adopt Image Playground"],[328,"Adopt Image Playground in SwiftUI"],[339,"Add Image Playground sheet with binding to @State"],[389,"Seeding the sheet with context from your card"],[431,"Starting from a reference photo"],[462,"Providing a visual suggestion using a drawing"],[486,"Adopt Image Playground in UIKit or AppKit"],[509,"Options"],[542,"Size Specification"],[579,"Styles"],[627,"External Provider Style"],[662,"Generating an expressive icon for the card thumbnail"],[721,"Disabling personalization when it doesn't fit your context"],[735,"Availability"],[752,"Supports image generation"]],"points":[{"text":"新的生成式模型運行於 **Private Cloud Compute**，可產出更高品質的影像。","hot":true},{"text":"在 SwiftUI 用 **`imagePlaygroundSheet`** 綁定 `@State` 呈現；UIKit／AppKit 則用 `ImagePlaygroundViewController`。","hot":false},{"text":"用 `ImagePlaygroundConcept`（`.text`、`.extracted`、`.drawing`）與 `sourceImage` 以情境、參考相片或塗鴉引導生成。","hot":false},{"text":"以 `ImagePlaygroundOptions` 設定尺寸（`sizeSpecification`）與樣式（`imagePlaygroundGenerationStyle`，含 `.emoji`、`.externalProvider`），並可關閉個人化。","hot":false},{"text":"用 `@Environment(\\.supportsImageGeneration)` 檢查裝置是否支援影像生成，再決定提供哪種 UI。","hot":false}],"apis":["ImagePlayground","imagePlaygroundSheet","ImagePlaygroundConcept","ImagePlaygroundOptions","ImagePlaygroundViewController","imagePlaygroundGenerationStyle","supportsImageGeneration","PKDrawing"],"audience":"**想在 App 中加入生成式影像建立功能**的 SwiftUI 或 UIKit 開發者。","gloss_en":"Create high-quality images using Image Playground","takeaway_en":"Use **Image Playground** to create high-quality images in your app, with a new model running on Private Cloud Compute and customization via concepts, reference photos, and styles.","points_en":[{"text":"A new generative model runs on **Private Cloud Compute** to produce higher-quality images.","hot":true},{"text":"In SwiftUI, present it with **`imagePlaygroundSheet`** bound to `@State`; in UIKit/AppKit, use `ImagePlaygroundViewController`.","hot":false},{"text":"Guide generation by context, reference photo, or sketch using `ImagePlaygroundConcept` (`.text`, `.extracted`, `.drawing`) and `sourceImage`.","hot":false},{"text":"Set size (`sizeSpecification`) and style (`imagePlaygroundGenerationStyle`, including `.emoji` and `.externalProvider`) with `ImagePlaygroundOptions`, and optionally disable personalization.","hot":false},{"text":"Check whether the device supports image generation with `@Environment(\\.supportsImageGeneration)` before deciding which UI to offer.","hot":false}],"audience_en":"SwiftUI or UIKit developers who want to **add generative image creation to their app**.","summary":["本場由 Image Playground 團隊的工程師 Antonio 主講，介紹如何把 **Image Playground** 的完整體驗帶進你自己的 app。今年 Apple 以更強大的影像模型重新打造了體驗，能在幾乎任何風格下生成高品質影像，甚至包含逼真的 **photorealistic** 照片級結果。所有運算都跑在 **Private Cloud Compute** 上，Apple 隱私保護的雲端基礎設施，使用者資料不會被儲存或分享，連 Apple 也看不到。由於改用伺服器模型，原本的非 UI API **ImageCreator** 已被 deprecated，取而代之的是一套品質更高、內建隱私且提供完整使用者體驗的新 API。","採用方式極為簡單：在 SwiftUI 中只需對按鈕加上 **.imagePlaygroundSheet** 修飾器，並綁定一個 @State 布林值即可叫出 sheet，完成後 completion closure 會回傳一個指向 app 容器內暫存檔的 **URL**(需自行另存)。你可以用 **ImagePlaygroundConcept** 的 .text 與 .extracted 工廠方法把 app 情境(如卡片主題與訊息)注入 sheet,也能傳入 **sourceImage** 作為視覺靈感,或透過 PencilKit 的 **PKDrawing** 以 .drawing 概念提供構圖建議。UIKit/AppKit 則使用對應的 **ImagePlaygroundViewController** 取得相同體驗。","在設定方面,**ImagePlaygroundOptions** 與 **ImagePlaygroundStyle** 可管理尺寸、長寬比、可選與預設風格,以及個人化。尺寸用 .closest(to:) 讓系統對應到最接近的支援解析度;風格透過 **imagePlaygroundGenerationStyle** 指定預設值與允許清單(如 illustration、sketch、animation、emoji),其中 **externalProvider** 是選擇加入的第三方供應商風格(例如 ChatGPT)。emoji 風格會改觸發 onAdaptiveImageGlyphCreation 並回傳可內嵌於文字的 **NSAdaptiveImageGlyph**。","Image Playground 由於依賴強大的伺服器模型而有用量限制,但這完全不需開發者操心:沒有伺服器要架設、沒有用量 UI 要做,系統會代為管理,部分 iCloud+ 方案還能提升額度。最後在可用性處理上,只要讀取 **supportsImageGeneration** 這個環境值,即可在裝置支援 Apple Intelligence、語言地區受支援且使用者已啟用時顯示完整體驗,否則優雅地退回到一般的 Photos 選擇器,無需任何 entitlement 或額外檢查。"],"deepdive":[{"t":0,"title":"Introduction","body":"工程師 **Antonio** 開場說明人們已在 Messages、Freeform 與各類 app 中使用 **Image Playground** 創作影像。今年以更強大的影像模型重新打造,能在幾乎任何風格下生成高品質、甚至 **photorealistic** 的影像。**ImagePlayground.framework** 把同樣的模型、風格與品質直接帶進你的 app,支援 iOS、iPadOS、macOS 與 visionOS 上具備 **Apple Intelligence** 的裝置。"},{"t":123,"title":"Capabilities","body":"模型可依文字描述生成對應影像,描述可具體可開放(如「生日派對有狗、氣球與彩帶」或單純「慶祝」)。啟用 **personalization** 後,使用者可從 Photos 帶入人物或以文字描述外貌,讓結果更具個人感。風格涵蓋 animation、illustration、sketch 與 **Genmoji**,並支援橫向、直向、方形等多種尺寸與長寬比;所有運算皆跑在 **Private Cloud Compute**,資料不被儲存或分享。"},{"t":302,"title":"Adopt Image Playground","body":"講者以自製的 **Postcards** 賀卡 app 為示範情境,卡片正面的客製藝術圖正是 Image Playground 的切入點。採用無需 SDK 初始化、API key 或伺服器端點,一切從單一 view modifier 開始。由於模型移至伺服器,非 UI 的 **ImageCreator** 已被 deprecated,改用提供完整體驗的新 API。"},{"t":328,"title":"Adopt Image Playground in SwiftUI","body":"在 SwiftUI 中對按鈕加上 **.imagePlaygroundSheet** 修飾器即可採用,sheet 會處理 UI、模型互動與風格選擇器。當使用者接受影像,completion closure 會收到一個指向檔案的 **URL**。"},{"t":339,"title":"Add Image Playground sheet with binding to @State","body":"以綁定到 **@State** 布林值的方式呈現 sheet:當綁定翻為 true 時 sheet 出現。回傳的 URL 指向 app 容器內的暫存位置,務必在 session 結束前另存到別處,之後即可顯示這張生成影像。"},{"t":389,"title":"Seeding the sheet with context from your card","body":"sheet 可空白開啟,也能用 app 情境預先填入以獲得更豐富的起點。**ImagePlaygroundConcept** 提供 .text(包裝直接描述,如卡片主題 cherry blossoms)與 .extracted(從較長文字如卡片訊息中萃取最相關概念)兩個工廠方法,讓 sheet 一開啟就針對該卡片做好準備。"},{"t":431,"title":"Starting from a reference photo","body":"可透過 **sourceImage** 參數傳入任一 SwiftUI Image(使用者選的照片或卡片既有影像),Image Playground 會將其與 concepts 一起作為視覺靈感。使用者仍能在 sheet 內替換或調整,它是起點而非限制。"},{"t":462,"title":"Providing a visual suggestion using a drawing","body":"在 iPad 上 Postcards 於卡片正面下方顯示小畫布。**ImagePlaygroundConcept.drawing** 接受 PencilKit 的 **PKDrawing** 並作為 concept 加入,模型把筆畫視為視覺建議來引導構圖而不鎖死。"},{"t":486,"title":"Adopt Image Playground in UIKit or AppKit","body":"UIKit 或 AppKit app 可用 **ImagePlaygroundViewController** 取得相同體驗:呈現前先設定 concepts 與 options 屬性,再於 delegate 實作 imagePlaygroundViewController(_:didCreateImageAt:) 接收結果。整體 API 與 SwiftUI 版本對應一致。"},{"t":509,"title":"Options","body":"**ImagePlaygroundOptions** 與 **ImagePlaygroundStyle** 用來管理設定:尺寸與長寬比、可用與預選的風格,以及個人化。無論是生成卡片藝術圖、鎖定畫面桌布、橫幅或 Genmoji 圖示,同一套 API 都能適配。"},{"t":542,"title":"Size Specification","body":"Postcards 支援橫向、直向、方形三種卡片格式,各自儲存一個 CGSize,直接傳給 **.closest(to:)**,系統便會對應到最接近的支援長寬比與解析度。由於格式是卡片的屬性,尺寸請求會自動隨之調整,透過 **.imagePlaygroundOptions** 傳入 sheet。"},{"t":579,"title":"Styles","body":"**imagePlaygroundGenerationStyle** 接受兩個參數:選擇器開啟時的預設風格,以及限制可見風格的允許清單(如 illustration、sketch、animation、emoji)。若允許清單只給單一風格,選擇器會鎖定在該風格。Postcards 中每張卡片帶有 **StylePreset** 對應這些值,選擇器會自動反映當前開啟的卡片。"},{"t":627,"title":"External Provider Style","body":"**externalProvider** 是選擇加入的風格,會帶出使用者在設定中配置的第三方供應商(例如 **ChatGPT**)。只要把它附加到 .allowedStyles 清單即可提供;若使用者已配置供應商,該分頁就會出現,若未配置則由系統處理設定,開發者無需自行檢查,也可將其設為預設風格。"},{"t":662,"title":"Generating an expressive icon for the card thumbnail","body":"**ImagePlaygroundStyle.emoji** 專為 emoji 尺度的表情角色調校。啟用時 sheet 會改觸發 **onAdaptiveImageGlyphCreation**,交給你一個 **NSAdaptiveImageGlyph** 而非 URL。這種自適應影像字符可像 emoji 一樣內嵌於文字中,正適合顯示在收件人名稱旁的卡片縮圖。"},{"t":721,"title":"Disabling personalization when it doesn't fit your context","body":"個人化預設為啟用,可讓人從 Photos 帶入人物,使賀卡更具個人感。若你的情境不需要(如產品圖生成器),可將 **options.personalization** 設為 .disabled,人物選擇器與名稱偵測就會從 sheet 中完全消失。"},{"t":735,"title":"Availability","body":"Image Playground 在支援 **Apple Intelligence** 的裝置、受支援的語言與地區,且使用者已於設定中啟用影像生成時可用。透過 **supportsImageGeneration** 環境值即可判斷:為 true 時導向完整的 CardEditorView,為 false 時導向 CardPickerView 的 Photos 選擇器後備方案,無需 entitlement 或額外能力檢查。"},{"t":752,"title":"Supports image generation","body":"以 **@Environment(\\.supportsImageGeneration)** 讀取單一環境值即可乾淨地支援兩條路徑。講者最後鼓勵開發者思考影像在自家設計中的位置,以及只有你的 app 才知道的關係、回憶與情境,把這些帶入畫面,讓結果真正為特定的人而生成。Image Playground 提供模型,你提供故事。"}],"summary_en":["Presented by Antonio, an engineer on the Image Playground team, this session shows how to bring the full **Image Playground** experience into your own app. This year Apple rebuilt the experience around powerful image models that can generate high-quality images in virtually any style, including genuinely true-to-life **photorealistic** results. Everything runs on **Private Cloud Compute**, Apple's privacy-preserving cloud infrastructure, where user data is never stored or shared, even with Apple. Because it moved to server models, the old non-UI **ImageCreator** API is deprecated in favor of a new API with greater image quality, built-in privacy, and a complete user experience.","Adoption is remarkably simple: in SwiftUI you just add the **.imagePlaygroundSheet** modifier to a button with a binding to a @State boolean to present the sheet, and the completion closure returns a **URL** to a temporary file inside your app container (save it elsewhere yourself). You can seed the sheet with app context using **ImagePlaygroundConcept**'s .text and .extracted factory methods (e.g. a card's theme and message), pass a **sourceImage** for visual inspiration, or supply composition hints via PencilKit's **PKDrawing** as a .drawing concept. UIKit/AppKit uses the matching **ImagePlaygroundViewController** for the same experience.","For configuration, **ImagePlaygroundOptions** and **ImagePlaygroundStyle** manage size, aspect ratio, available and default styles, and personalization. Size uses .closest(to:) so the system maps to the nearest supported resolution; styles are set via **imagePlaygroundGenerationStyle** with a default and an allowed list (illustration, sketch, animation, emoji), where **externalProvider** is an opt-in third-party provider style (e.g. ChatGPT). The emoji style instead fires onAdaptiveImageGlyphCreation and returns an **NSAdaptiveImageGlyph** you can embed inline with text.","Because it relies on powerful server models, Image Playground has a usage limit, but none of this is the developer's problem: there's no server to provision and no usage UI to build, the system manages it, and most iCloud+ plans raise the limit. Finally, for availability you only need to read the **supportsImageGeneration** environment value, which is true when the device supports Apple Intelligence, the language and region are supported, and the user has it enabled; otherwise you fall back gracefully to a Photos picker, with no entitlement or extra check required."],"deepdive_en":[{"t":0,"title":"Introduction","body":"Engineer **Antonio** opens by noting people already create images with **Image Playground** in Messages, Freeform, and apps. This year it was rebuilt around more powerful image models that produce high-quality, even **photorealistic** images in virtually any style. **ImagePlayground.framework** brings the same models, styles, and quality directly into your app across iOS, iPadOS, macOS, and visionOS on devices with **Apple Intelligence**."},{"t":123,"title":"Capabilities","body":"The model creates an image from a text description, which can be specific or open-ended (e.g. \"a birthday celebration with dogs, balloons and confetti\" or just \"celebration\"). With **personalization** enabled, users can bring in someone from Photos or describe an appearance in text for a personal result. Styles include animation, illustration, sketch, and **Genmoji**, with multiple sizes and aspect ratios; all of it runs on **Private Cloud Compute** with no data stored or shared."},{"t":302,"title":"Adopt Image Playground","body":"The presenter uses a self-built greeting-card app, **Postcards**, as the demo context, where custom front artwork is where Image Playground fits in. Adoption needs no SDK initialization, API keys, or server endpoints and starts with a single view modifier. Because the models moved to the server, the non-UI **ImageCreator** is deprecated in favor of the new full-experience API."},{"t":328,"title":"Adopt Image Playground in SwiftUI","body":"In SwiftUI you adopt it by adding the **.imagePlaygroundSheet** modifier to a button, and the sheet handles the UI, model interaction, and style picker. When someone accepts an image, the completion closure receives a **URL** to the generated file."},{"t":339,"title":"Add Image Playground sheet with binding to @State","body":"The sheet is presented via a binding to a **@State** boolean: when the binding flips to true, the sheet appears. The returned URL points to a temporary location inside the app container, so save it elsewhere before the session ends, then display the generated image."},{"t":389,"title":"Seeding the sheet with context from your card","body":"The sheet can open empty or be seeded with app context for a richer start. **ImagePlaygroundConcept** offers .text (wrapping a direct description like the card theme \"cherry blossoms\") and .extracted (pulling the most relevant ideas from longer text like the card message), so the sheet opens already primed for that specific card."},{"t":431,"title":"Starting from a reference photo","body":"You can pass any SwiftUI Image via the **sourceImage** parameter (a photo the person picked or an image the card already has), and Image Playground uses it as visual inspiration alongside the concepts. The user can still replace or refine it inside the sheet, so it's a starting point, not a constraint."},{"t":462,"title":"Providing a visual suggestion using a drawing","body":"On iPad, Postcards shows a small canvas below the card front. **ImagePlaygroundConcept.drawing** takes a PencilKit **PKDrawing** and adds it as a concept, and the model treats the strokes as a visual suggestion that guides composition without locking it in."},{"t":486,"title":"Adopt Image Playground in UIKit or AppKit","body":"A UIKit or AppKit app uses **ImagePlaygroundViewController** for the same experience: set concepts and options as properties before presentation, then implement imagePlaygroundViewController(_:didCreateImageAt:) on the delegate to receive the result. The API mirrors the SwiftUI version."},{"t":509,"title":"Options","body":"**ImagePlaygroundOptions** and **ImagePlaygroundStyle** manage configuration: size and aspect ratio, available and preselected styles, and personalization. Whether generating card artwork, a lock screen wallpaper, a banner, or a Genmoji icon, the same API adapts to fit."},{"t":542,"title":"Size Specification","body":"Postcards supports landscape, portrait, and square formats, each storing a CGSize passed directly to **.closest(to:)**, which the system maps to the closest supported aspect ratio and resolution. Since format is a property of the card, the size request adapts automatically and is passed to the sheet via **.imagePlaygroundOptions**."},{"t":579,"title":"Styles","body":"**imagePlaygroundGenerationStyle** takes two arguments: the default style the picker opens on and an allowed list limiting which styles appear (illustration, sketch, animation, emoji). Passing a single style in the allowed list locks the picker to it. In Postcards each card carries a **StylePreset** mapping to these values, and the picker automatically reflects whichever card is open."},{"t":627,"title":"External Provider Style","body":"**externalProvider** is an opt-in style that surfaces whatever third-party provider the person configured in Settings (for example **ChatGPT**). To offer it, append it to your .allowedStyles list; if a provider is configured the tab appears, and if not the system handles setup, requiring no check on your side. It can also be passed as the default style."},{"t":662,"title":"Generating an expressive icon for the card thumbnail","body":"**ImagePlaygroundStyle.emoji** is tuned for expressive, emoji-scale characters. When active, the sheet fires a separate **onAdaptiveImageGlyphCreation** completion and hands you an **NSAdaptiveImageGlyph** instead of a URL. This adaptive image glyph can be embedded inline with text like an emoji, ideal for a card thumbnail next to the recipient's name."},{"t":721,"title":"Disabling personalization when it doesn't fit your context","body":"Personalization is enabled by default and lets people include someone from Photos to make a card feel personal. If your context doesn't call for it (say, a product image generator), set **options.personalization** to .disabled and the people picker and name detection disappear from the sheet entirely."},{"t":735,"title":"Availability","body":"Image Playground is available on devices that support **Apple Intelligence**, across supported languages and regions, and when the user has image generation enabled in Settings. The **supportsImageGeneration** environment value is all you need: when true, navigate to the full CardEditorView, and when false, navigate to a CardPickerView Photos fallback, with no entitlement or extra capability check."},{"t":752,"title":"Supports image generation","body":"Reading the single **@Environment(\\.supportsImageGeneration)** value cleanly supports both paths. The presenter closes by encouraging developers to consider where images live in their design and what only their app knows, the relationships, memories, and context to bring into the picture so the result feels made for that specific person. Image Playground brings the models, you bring the story."}],"code":[]},"related":[{"id":"372","title":"Unwrap PaperKit","gloss":"深入了解 PaperKit","gloss_en":"Unwrap PaperKit","category":"uikit","categoryLabel":"UIKit"},{"id":"121","title":"Announcing Apple’s next big step for Siri and iPhone","gloss":"宣布 Apple 為 Siri 與 iPhone 邁出的下一大步","gloss_en":"Announcing Apple's next big step for Siri and iPhone","category":"ai","categoryLabel":"AI 與機器學習"},{"id":"227","title":"Create UI prototypes using agents in Xcode","gloss":"在 Xcode 用代理人打造 UI 原型","gloss_en":"Prototype UI with agents in Xcode","category":"ai","categoryLabel":"AI 與機器學習"},{"id":"232","title":"Run local agentic AI on the Mac using MLX","gloss":"用 MLX 在 Mac 上執行本機 agentic AI","gloss_en":"Run local agentic AI on the Mac using MLX","category":"ai","categoryLabel":"AI 與機器學習"},{"id":"233","title":"Explore distributed inference and training with MLX","gloss":"用 MLX 探索分散式推論與訓練","gloss_en":"Explore distributed inference and training with MLX","category":"ai","categoryLabel":"AI 與機器學習"}]}</script>
