<script id="d" type="application/json">{"s":{"id":"241","title":"What’s new in the Foundation Models framework","gloss":"Foundation Models 框架的新功能","category":"ai","categoryLabel":"AI 與機器學習","duration":1273,"url":"https://developer.apple.com/videos/play/wwdc2026/241/","takeaway":"Foundation Models framework 新增影像理解、Private Cloud Compute、第三方模型整合與 Dynamic Profiles，打造更強大的 agentic App。","chapters":[[0,"Introduction"],[154,"New on-device model"],[166,"Context size and token counting"],[201,"Vision: image understanding"],[232,"Attachable image types"],[260,"Private Cloud Compute"],[406,"Model abstraction layer"],[452,"Partner model integrations"],[525,"Inspecting usage"],[580,"System tools: Vision and Spotlight"],[657,"Dynamic Profiles for agentic apps"],[715,"Routing between craft analysis and brainstorm"],[762,"Describing the profile for craft app"],[826,"Composing models and configurations"],[876,"Describing the profile for craft app"],[930,"Evaluations framework"],[962,"The fm command line tool"],[1033,"Foundation Models Python SDK"],[1075,"Open source and framework utilities"],[1109,"Foundation Models SDK for Python"],[1164,"Next steps"]],"points":[{"text":"新的 **on-device 模型** 提供更大的 context size，並可用 **tokenCount** 預估輸入長度。","hot":false},{"text":"支援 **影像理解（Vision）**，可在 respond 中透過 **Attachment** 附加 UIImage 等影像類型發問。","hot":true},{"text":"可存取 **Private Cloud Compute**，並透過模型抽象層整合第三方與開源模型。","hot":false},{"text":"以 **DynamicProfile** 為 agentic App 動態組合 instructions、tools 與模型設定，並支援模式切換。","hot":false},{"text":"提供 **fm 命令列工具**、Evaluations framework 與 **Foundation Models Python SDK** 等開發配套。","hot":false}],"apis":["FoundationModels","SystemLanguageModel","LanguageModelSession","Attachment","ContextOptions","DynamicProfile","Tool","Generable","PrivateCloudComputeLanguageModel"],"audience":"想在 App 中加入 **裝置端生成式 AI 與 agentic 功能** 的 Apple 平台開發者。","gloss_en":"What's new in the Foundation Models framework","takeaway_en":"The Foundation Models framework adds image understanding, Private Cloud Compute, third-party model integration, and Dynamic Profiles to build more powerful agentic apps.","points_en":[{"text":"The new **on-device model** offers a larger context size, and you can estimate input length with **tokenCount**.","hot":false},{"text":"Supports **image understanding (Vision)**: attach images such as UIImage via an **Attachment** in respond to ask questions about them.","hot":true},{"text":"Access **Private Cloud Compute**, and integrate third-party and open source models through a model abstraction layer.","hot":false},{"text":"Use **DynamicProfile** to dynamically compose instructions, tools, and model settings for agentic apps, with support for mode switching.","hot":false},{"text":"Ships developer tooling including the **fm command-line tool**, the Evaluations framework, and the **Foundation Models Python SDK**.","hot":false}],"audience_en":"Apple platform developers who want to add **on-device generative AI and agentic features** to their apps.","summary":["繼去年推出 Foundation Models 框架（guided generation、snapshot streaming、tool protocol）後，今年的重點是「深入並超越 OS 的整合、更多元的模型，以及打造 agentic 體驗的新基礎元件」。最大的消息是 **Foundation Models 框架正式開源**，同時推出會在 OS 版本之間持續更新的 **Foundation Models framework utilities** 套件，提供新興與實驗性的建構積木。框架本身也帶來全新、從頭打造、在邏輯與工具呼叫上更強的**裝置端模型**，並沿用 iOS 26.4 起的 contextSize 與 tokenCount API 讓 App 依硬體調整。","模型能力大幅擴張。裝置端模型新增**視覺（Vision）能力**：只要在 prompt builder 中插入 Attachment 影像即可詢問圖片內容，可由 UIImage、NSImage、CGImage、Core Image、CoreVideo Pixel Buffer 或檔案 URL 建立，支援任意尺寸與比例（但越大越耗 token 與延遲）。需要更多算力時，可用全新的 **PrivateCloudComputeLanguageModel**——與 Apple Intelligence 同源的大型模型，具 32,000 token 上下文與**推理（reasoning）**能力，透過 contextOptions 的 reasoningLevel 控制思考深度；它無需帳號設定、驗證或 API key，完全私密（不儲存 prompt 且可供獨立研究者驗證），並讓框架登陸 watchOS。此外開放**模型抽象層**（LanguageModel protocol），既有的 SystemLanguageModel 與 PrivateCloudComputeLanguageModel 皆符合此協定，並開源 CoreAILanguageModel 與 MLXLanguageModel；Anthropic 與 Google 也將發佈 Swift 套件提供前沿伺服器模型，用法只需 import、初始化模型再傳入 session，下游程式碼不變。使用第三方模型需自理驗證與計費，務必以 OAuth 取得 token 並存於 KeyChain，並可用 session／response 的 usage 屬性追蹤 token 用量（含 cache 與 reasoning token）。","在系統工具方面，框架內建多個由 **Vision 框架**支援的原生工具：**BarcodeReaderTool** 讀取條碼、**OCRTool** 從影像擷取結構化文字；以及由 **Spotlight** 支援的 search tool，可實作完全本機的 **RAG（Retrieval-Augmented Generation）**。Agentic 體驗的核心則是全新的宣告式 API **dynamic profiles**：以 DynamicProfile 協定宣告 body，其中的 Profile 由 instructions 與 tools 組成，可在單一 LanguageModelSession 內依 App 狀態（如 craftAnalysis 與 brainstorm 兩種模式）切換，並用 modifier 指定不同模型（如 .model(PCC)）與 .reasoningLevel，同時保留對話歷史；框架負責在任一時刻將 DynamicProfile 解析為單一 active Profile 並處理轉換。另推出 **Evaluations 框架**量化智慧功能品質，讓你在調整 prompt 時以統計方式衡量準確度。","最後是 Mac 生產力與開源。macOS 27 帶來全新的 **fm 命令列工具**，可在終端機存取裝置端模型與 PCC，支援 fm chat 互動、也能接入 shell script 做文件摘要、資訊擷取或依影像內容生成檔名。**Foundation Models SDK for Python** 讓資料科學家以幾行 Python 存取同一個裝置端模型、檢查可用性並產生結構化回應。開源方面，utilities 套件提供 transcript 管理的 profile modifier、載入程序知識的 skill API，以及支援 Chat Completions 標準的 language model；框架核心開源後也能在 Linux 等任何 Swift 執行環境運作。整體而言，搭配 Anthropic、Google、CoreAI 與 MLX，你將能「在任何地方執行任何模型」。"],"deepdive":[{"t":0,"title":"Introduction","body":"Erik 與 Zhen 回顧去年 Foundation Models 框架的 guided generation、snapshot streaming 與 tool protocol，並定調今年主題：深入與超越 OS 的整合、更多元模型，以及 agentic 新基礎元件。最重磅消息是**框架正式開源**，並推出會在 OS 版本間持續更新的 **Foundation Models framework utilities** 套件提供實驗性建構積木。"},{"t":154,"title":"New on-device model","body":"介紹全新、從頭打造的**裝置端模型**，在智慧度、邏輯與工具呼叫上全面更強，並持續改進 guardrails 以減少 iOS 26.4 起已降低的誤判。此模型是今年諸多模型更新的起點，後續再疊加視覺能力與伺服器模型。"},{"t":166,"title":"Context size and token counting","body":"說明 iOS 26.4 起推出的 **contextSize** 與 **tokenCount** API，可檢視模型上下文大小並計算 instructions、prompt 與 transcript 的 token 數（範例顯示 contextSize 為 8192）。建議用這些 API 讓 App 依執行硬體調整行為。"},{"t":201,"title":"Vision: image understanding","body":"裝置端模型新增**視覺能力**，API 是既有 prompt builder 的自然延伸：在 prompt 中插入影像 **Attachment** 並搭配文字，模型即可回答關於圖片的問題（示範詢問桌上 origami 照片）。這解鎖了全新類別的應用。"},{"t":232,"title":"Attachable image types","body":"列出可建立影像 attachment 的型別：**UIImage**、**NSImage**、**CGImage**、Core Image 型別、**CoreVideo Pixel Buffer** 與檔案 URL。模型支援任意尺寸與比例、無需裁切或填補，但需留意較大影像會消耗更多 token 並增加延遲。"},{"t":260,"title":"Private Cloud Compute","body":"推出全新 **PrivateCloudComputeLanguageModel**——與 Apple Intelligence 同源的大型模型，具 **32,000 token** 上下文與**推理**能力，透過 contextOptions 的 **reasoningLevel** 控制思考深度。使用無需帳號設定、驗證或 API key，完全私密（不儲存 prompt、可供獨立驗證），並讓框架登陸 watchOS；首次下載量低於 200 萬的開發者免雲端 API 費用，iCloud+ 訂閱用戶額度更高。"},{"t":406,"title":"Model abstraction layer","body":"開放**模型抽象層**，核心是新的 **LanguageModel** 協定，讓本機與伺服器模型都能支撐 LanguageModelSession。既有的 **SystemLanguageModel** 與 **PrivateCloudComputeLanguageModel** 已符合此協定，並額外開源 **CoreAILanguageModel** 與 **MLXLanguageModel**，可在 Mac 的 Apple Neural Engine 與 GPU 上執行各式本機模型。"},{"t":452,"title":"Partner model integrations","body":"**Anthropic** 與 **Google** 將發佈 Swift 套件提供前沿伺服器模型。用法極簡：以 Swift Package Manager import 套件、初始化想用的模型，再於建立 session 時傳入，下游程式碼維持不變。但須注意第三方伺服器模型通常需自行處理驗證與計費。"},{"t":525,"title":"Inspecting usage","body":"提醒安全實務：勿在 App binary 儲存私鑰，應以 **OAuth** 取得 access token 並存於 **KeyChain**。第三方模型多為**按 token 計費**，因此 session 與 response 新增 **usage** 屬性，可得知輸入／輸出 token 數，並區分讀自 cache 的 token 與用於 reasoning 的 token。"},{"t":580,"title":"System tools: Vision and Spotlight","body":"介紹內建系統工具：由 **Vision 框架**支援的 **BarcodeReaderTool**（讀條碼）與 **OCRTool**（從影像擷取結構化文字），增強模型對視覺資訊的推理；以及由 **Spotlight** 支援的 search tool，用於實作完全本機的 **RAG**，是社群最常被要求的功能之一。"},{"t":657,"title":"Dynamic Profiles for agentic apps","body":"由 Zhen 介紹 agentic 體驗的新基礎元件 **dynamic profiles**。以 crafts App 為例：先在 craft analysis 模式分析 origami 照片並透過 tool call 記錄結果，再切換到 brainstorm 模式運用 PCC 的推理能力建議創作點子。傳統做多 session 與情境調度需大量 boilerplate，dynamic profiles 改以宣告式方式解決。"},{"t":715,"title":"Routing between craft analysis and brainstorm","body":"示範未使用 dynamic profiles 前的命令式做法：以 @Observable 物件儲存 mode，於 craftAnalysis 與 brainstorm 分支各自建立帶不同 instructions、tools 的 LanguageModelSession，並沿用 dropFirstInstructions 後的 transcript 保留歷史。範例還包含讓模型自行呼叫的 **SwitchModeTool**，以及用 withObservationTracking 在 mode 改變時更新 session。"},{"t":762,"title":"Describing the profile for craft app","body":"展示 dynamic profiles 最簡形式：宣告 struct 並符合 **DynamicProfile** 協定，body 回傳一個由 **Instructions** 與工具（如 RecordImageAnalysisTool）組成的 **Profile**，再用 `LanguageModelSession(profile:)` 初始化 session。這把當下情境中應存在的 instructions 與 tools 以宣告式描述出來。"},{"t":826,"title":"Composing models and configurations","body":"說明除了管理情境，還可為不同任務指定不同模型與設定並保留對話歷史。crafts App 的 craftAnalysis 與 brainstorm 各有不同 instructions／tools，前者用 **SystemLanguageModel** 即可，後者以 modifier 指定 **PCC** 並設定 deep reasoning，最終得到動態配置 model、tools 與 instructions 的單一 session。"},{"t":876,"title":"Describing the profile for craft app","body":"以更完整的 **CraftProfile** 範例呈現：body 內依 states.mode 以 switch 在 craftAnalysis 與 brainstorm 分支回傳不同 Profile，brainstorm 分支再鏈上 `.model(privateCloudCompute)` 與 `.reasoningLevel(.deep)`。關鍵概念是 DynamicProfile 在任一時刻只解析為單一 active Profile，開發者用條件選擇，轉換由框架處理。"},{"t":930,"title":"Evaluations framework","body":"因語言模型本質上非確定性、行為難預測，推出全新的 **Evaluations 框架**量化智慧功能的品質。它讓開發者在調整 prompt 時以統計方式衡量準確度、理解變更的影響，進而更有信心交付 App。"},{"t":962,"title":"The fm command line tool","body":"macOS 27 把模型帶到命令列：全新 **fm** 工具可在終端機存取裝置端模型與 PCC，內建 helper 列出支援功能。示範以 **fm chat** 詢問 origami 的 valley fold 含義，並能接入 shell script 做文件摘要、資訊擷取，或依影像內容生成描述性檔名。"},{"t":1033,"title":"Foundation Models Python SDK","body":"預告 **Foundation Models SDK for Python**，讓 Python 生態的資料科學家與研究者直接存取與 Swift 框架同一個裝置端模型，能檢查模型可用性並以幾行程式碼從 prompt 產生結構化回應。"},{"t":1075,"title":"Open source and framework utilities","body":"介紹 **Foundation Models framework utilities** 開源套件，提供探索 LLM 新興實務的建構積木：transcript 管理的 profile modifier、載入程序知識的 **skill API**，以及支援 **Chat Completions** 標準的 language model。此套件會隨工具與趨勢演進而持續成長。"},{"t":1109,"title":"Foundation Models SDK for Python","body":"以 Python 程式碼示範 SDK 用法：import 套件、建立 SystemLanguageModel、以 is_available() 檢查可用性，再建立 LanguageModelSession 並 await session.respond 產生回應。涵蓋 Swift 框架的核心功能，可快速從 prompt 走到結構化結果。"},{"t":1164,"title":"Next steps","body":"Erik 與 Zhen 收尾，強調本場只是冰山一角，建議觀看 Evaluations、Private Cloud Compute、強化版 Xcode instrument 與 dynamic profiles 等深入場次。下一步可探索範例 App 學習 dynamic profiles，並開始熟悉 Evaluations 框架。"}],"summary_en":["Following last year's Foundation Models framework (guided generation, snapshot streaming, the tool protocol), this year focuses on integrations into and beyond the OS, a wider variety of models, and new primitives for agentic experiences. The headline news is that the **Foundation Models framework is going open source**, alongside a new **Foundation Models framework utilities** package that updates between OS releases to deliver emerging and experimental building blocks. The framework also ships a new, ground-up **on-device model** that is better at logic and tool calling, and continues to use the contextSize and tokenCount APIs (from iOS 26.4) so apps can adapt to their hardware.","Model capabilities expand significantly. The on-device model gains **Vision**: just insert an image Attachment into the prompt builder to ask about a picture, created from UIImage, NSImage, CGImage, Core Image, CoreVideo Pixel Buffers, or file URLs, with any size or aspect ratio supported (though larger images cost more tokens and latency). For more horsepower, the new **PrivateCloudComputeLanguageModel** is the same large model that powers Apple Intelligence, with a 32,000-token context window and **reasoning**, controlled via reasoningLevel on contextOptions. It needs no account setup, authentication, or API keys, is fully private (no prompts stored, independently verifiable), and brings the framework to watchOS. The framework also opens a **model abstraction layer** (the LanguageModel protocol); SystemLanguageModel and PrivateCloudComputeLanguageModel already conform, and CoreAILanguageModel and MLXLanguageModel are open-sourced. Anthropic and Google are publishing Swift packages for frontier server models—just import, initialize, and pass the model into the session, with downstream code unchanged. Third-party server models require your own auth and billing, so use OAuth and store tokens in KeyChain, and track token usage via the new usage property on sessions and responses (including cached and reasoning tokens).","For system tools, the framework adds native tools backed by the **Vision framework**: **BarcodeReaderTool** to read barcodes and **OCRTool** to extract structured text from images, plus a **Spotlight**-powered search tool for fully local **RAG (Retrieval-Augmented Generation)**. The core of agentic experiences is the new declarative **dynamic profiles** API: declare a DynamicProfile with a body whose Profile is composed of instructions and tools, switch within a single LanguageModelSession based on app state (e.g. craftAnalysis vs. brainstorm modes), and use modifiers to specify different models (e.g. .model(PCC)) and .reasoningLevel while preserving conversation history. A DynamicProfile resolves to a single active Profile at any moment; you pick it with conditionals and the framework handles the transition. The new **Evaluations framework** quantifies the quality of your intelligence features so you can measure accuracy statistically as you tweak prompts.","Finally, Mac productivity and open source. macOS 27 brings the new **fm command-line tool** to access the on-device model and PCC from the terminal, supporting interactive fm chat and shell-script integration for document summaries, information extraction, or generating file names from image content. The **Foundation Models SDK for Python** lets data scientists access the same on-device model in a few lines of Python, check availability, and generate structured responses. On open source, the utilities package provides profile modifiers for transcript management, a skill API for procedural knowledge loading, and a language model that speaks the Chat Completions standard; with the framework core open-sourced it can run anywhere Swift runs, including Linux servers. Together with Anthropic, Google, CoreAI, and MLX, you'll be able to run any model, anywhere."],"deepdive_en":[{"t":0,"title":"Introduction","body":"Erik and Zhen recap last year's guided generation, snapshot streaming, and tool protocol, then frame this year's themes: integrations into and beyond the OS, a wider variety of models, and new agentic primitives. The biggest news is that the **framework is going open source**, alongside a new **Foundation Models framework utilities** package that updates between OS releases with experimental building blocks."},{"t":154,"title":"New on-device model","body":"Introduces a new, ground-up **on-device model** that is better across the board, especially at logic and tool calling, with continued guardrail refinements that reduce the false positives already lowered in iOS 26.4. This model is the starting point for the many model updates that follow, layering on vision and server models."},{"t":166,"title":"Context size and token counting","body":"Covers the **contextSize** and **tokenCount** APIs introduced in iOS 26.4 for inspecting the model's context size and counting tokens in instructions, prompts, and transcripts (the example shows a contextSize of 8192). The advice is to use these going forward so apps adapt to the hardware they run on."},{"t":201,"title":"Vision: image understanding","body":"The on-device model gains **Vision**, with an API that is a natural extension of the existing prompt builders: insert an image **Attachment** alongside text and the model can answer questions about the image (demoed with a photo of origami). This unlocks entire new categories of applications."},{"t":232,"title":"Attachable image types","body":"Lists the types an image attachment can be created from: **UIImage**, **NSImage**, **CGImage**, Core Image types, **CoreVideo Pixel Buffers**, and file URLs. The model supports any size and aspect ratio with no cropping or padding, but larger images consume more tokens and add latency."},{"t":260,"title":"Private Cloud Compute","body":"Introduces the new **PrivateCloudComputeLanguageModel**, the same large model that powers Apple Intelligence, with a **32,000-token** context window and **reasoning**, controlled via the **reasoningLevel** argument on contextOptions. It requires no account setup, authentication, or API keys and is fully private (no prompts stored, independently verifiable), and it brings the framework to watchOS; developers with under 2 million first-time downloads pay no cloud API costs, and iCloud+ subscribers get higher limits."},{"t":406,"title":"Model abstraction layer","body":"Opens up the **model abstraction layer**, built on a new **LanguageModel** protocol that lets both local and server models back a LanguageModelSession. **SystemLanguageModel** and **PrivateCloudComputeLanguageModel** already conform, and two more implementations are open-sourced: **CoreAILanguageModel** and **MLXLanguageModel**, for running many local models on the Apple Neural Engine and your Mac's GPU."},{"t":452,"title":"Partner model integrations","body":"**Anthropic** and **Google** are publishing Swift packages providing frontier server models. Usage is simple: import the package with Swift Package Manager, initialize the model you want, and pass it when creating the session, with downstream code unchanged. Note that third-party server models typically require you to handle both authentication and billing."},{"t":525,"title":"Inspecting usage","body":"Stresses security practices: never store private keys in your app binary, fetch access tokens via **OAuth**, and store them in **KeyChain**. Since third-party models are usually billed per token, sessions and responses gain a **usage** property reporting input and output token counts, distinguishing tokens read from cache and tokens used for reasoning."},{"t":580,"title":"System tools: Vision and Spotlight","body":"Introduces built-in system tools: the **Vision framework**-backed **BarcodeReaderTool** (read barcodes) and **OCRTool** (extract structured text from images), which strengthen the model's reasoning about visual information, plus a **Spotlight**-powered search tool for implementing fully local **RAG**, one of the most requested features."},{"t":657,"title":"Dynamic Profiles for agentic apps","body":"Zhen introduces **dynamic profiles**, the new primitive for agentic experiences. In the crafts app, a session starts in craft analysis mode to analyze origami photos and record findings via a tool call, then switches to brainstorm mode using PCC's reasoning to suggest creative projects. Doing this with multiple sessions and orchestration involves a lot of boilerplate, which dynamic profiles solve declaratively."},{"t":715,"title":"Routing between craft analysis and brainstorm","body":"Shows the imperative approach before dynamic profiles: an @Observable object stores the mode, and craftAnalysis and brainstorm branches each create a LanguageModelSession with different instructions and tools, reusing the transcript (after dropFirstInstructions) to keep history. The example includes a **SwitchModeTool** the model can call and uses withObservationTracking to update the session when mode changes."},{"t":762,"title":"Describing the profile for craft app","body":"Demonstrates the simplest dynamic profile: declare a struct conforming to **DynamicProfile** with a body returning a **Profile** composed of **Instructions** and tools (e.g. RecordImageAnalysisTool), then initialize the session with `LanguageModelSession(profile:)`. This declaratively describes the instructions and tools that should be present in the context at that moment."},{"t":826,"title":"Composing models and configurations","body":"Explains that beyond managing context, you can specify different models and configurations per task while keeping conversation history. The crafts app's craftAnalysis and brainstorm each have their own instructions and tools; the former is fine with **SystemLanguageModel**, while the latter uses modifiers to specify **PCC** with deep reasoning, yielding a single session with dynamically configured model, tools, and instructions."},{"t":876,"title":"Describing the profile for craft app","body":"Shows a fuller **CraftProfile** example: the body switches on states.mode to return different Profiles for craftAnalysis and brainstorm, with the brainstorm branch chaining `.model(privateCloudCompute)` and `.reasoningLevel(.deep)`. The key concept is that a DynamicProfile resolves to a single active Profile at any time; you pick it with conditionals and the framework handles the transition."},{"t":930,"title":"Evaluations framework","body":"Because language models are inherently non-deterministic and hard to predict, the new **Evaluations framework** measures the quality of your intelligence features. It helps app developers quantify accuracy as they tweak prompts, understand the statistical impact of changes, and deliver with confidence."},{"t":962,"title":"The fm command line tool","body":"macOS 27 brings the models to the command line with the new **fm** tool, which accesses the on-device model and PCC from the terminal and lists its supported features via a helper. The demo uses **fm chat** to ask what a valley fold means in origami, and shows plugging fm into shell scripts to summarize documents, extract information, or generate descriptive file names from image content."},{"t":1033,"title":"Foundation Models Python SDK","body":"Previews the **Foundation Models SDK for Python**, giving data scientists and researchers in the Python ecosystem direct access to the same on-device model as the Swift framework, with the ability to check availability and generate structured responses in a few lines of code."},{"t":1075,"title":"Open source and framework utilities","body":"Introduces the open-source **Foundation Models framework utilities** package, a collection of building blocks for exploring emerging LLM practices: profile modifiers for transcript management, a **skill API** for procedural knowledge loading, and a language model that interfaces with servers using the **Chat Completions** standard. The package is designed to grow as tools and trends evolve."},{"t":1109,"title":"Foundation Models SDK for Python","body":"Walks through the Python SDK in code: import the package, create a SystemLanguageModel, check availability with is_available(), then create a LanguageModelSession and await session.respond to generate a response. It carries the core features of the Swift framework, taking you from prompt to structured result quickly."},{"t":1164,"title":"Next steps","body":"Erik and Zhen wrap up, noting this session only scratches the surface and pointing to deep dives on the Evaluations framework, Private Cloud Compute, the enhanced Xcode instrument, and dynamic profiles. Suggested next steps are to explore the sample app to learn about dynamic profiles and to start getting familiar with the Evaluations framework."}],"code":[]},"related":[{"id":"319","title":"Build with the new Apple Foundation Model on Private Cloud Compute","gloss":"在 Private Cloud Compute 上使用全新 Apple Foundation Model 開發","gloss_en":"Build with the new Apple Foundation Model on Private Cloud Compute","category":"ai","categoryLabel":"AI 與機器學習"},{"id":"242","title":"Build agentic app experiences with the Foundation Models framework","gloss":"用 Foundation Models 框架打造 agentic App 體驗","gloss_en":"Build agentic app experiences with Foundation Models","category":"ai","categoryLabel":"AI 與機器學習"},{"id":"347","title":"Secure your app: mitigate risks to agentic features","gloss":"保護你的 App：降低 agentic 功能的風險","gloss_en":"Secure your app: mitigate risks to agentic features","category":"ai","categoryLabel":"AI 與機器學習"},{"id":"237","title":"What’s new in image understanding","gloss":"影像理解的新功能","gloss_en":"What's new in image understanding","category":"ai","categoryLabel":"AI 與機器學習"},{"id":"326","title":"Integrate on-device AI models into your app using Core AI","gloss":"用 Core AI 把裝置端 AI 模型整合進你的 App","gloss_en":"Integrate on-device AI models with Core AI","category":"ai","categoryLabel":"AI 與機器學習"}]}</script>
