<script id="d" type="application/json">{"s":{"id":"219","title":"Enhance the accessibility of your reading app","gloss":"強化你閱讀類 App 的無障礙體驗","category":"uikit","categoryLabel":"UIKit","duration":1200,"url":"https://developer.apple.com/videos/play/wwdc2026/219/","takeaway":"運用文字導覽 API、連結群組與自訂 UITextInput，為 VoiceOver 與 Speak Screen 打造順暢、可選取且能自動翻頁的閱讀體驗。","chapters":[[1,"Introduction"],[86,"Characteristics"],[225,"Standard views"],[449,"Link text elements together with navigation APIs"],[479,"Link text elements together with a linked group"],[590,"Turn pages automatically after reading"],[705,"Add actions to the editor rotor"],[845,"Custom text"],[970,"Adopt UITextInput"]],"points":[{"text":"為 **VoiceOver**、**Speak Screen** 等輔助技術打造穩固的閱讀體驗，提供直覺的文字選取。","hot":false},{"text":"用 **accessibilityNextTextNavigationElement**／**accessibilityPreviousTextNavigationElement** 把段落串連，讓導覽依閱讀順序前後移動。","hot":false},{"text":"以 **accessibilityLinkedGroup** 在 SwiftUI 中把同一頁的文字元素群組起來。","hot":false},{"text":"插入 **causesPageTurn** 特徵並回應 **accessibilityScroll**，朗讀完畢後自動翻頁。","hot":false},{"text":"為自訂文字（如掃描頁面）採用 **UITextInput**，讓輔助技術能正確選取與讀取內容。","hot":true}],"apis":["UIAccessibility","accessibilityNextTextNavigationElement","accessibilityPreviousTextNavigationElement","accessibilityLinkedGroup","UIAccessibilityTraits.causesPageTurn","accessibilityScroll","UIAccessibilityCustomAction","UITextInput","UITextInteraction"],"audience":"**開發閱讀、文件或電子書類 App 的 UIKit／SwiftUI 工程師**，想完善無障礙閱讀體驗的人。","gloss_en":"Enhance the accessibility of your reading app","takeaway_en":"Use text navigation APIs, linked groups, and custom UITextInput to build a smooth, selectable reading experience with automatic page turns for VoiceOver and Speak Screen.","points_en":[{"text":"Build robust reading experiences for assistive technologies like **VoiceOver** and **Speak Screen**, with intuitive text selection.","hot":false},{"text":"Use **accessibilityNextTextNavigationElement**/**accessibilityPreviousTextNavigationElement** to chain paragraphs so navigation moves forward and backward in reading order.","hot":false},{"text":"Use **accessibilityLinkedGroup** in SwiftUI to group the text elements on a single page together.","hot":false},{"text":"Add the **causesPageTurn** trait and respond to **accessibilityScroll** to turn the page automatically once reading finishes.","hot":false},{"text":"Adopt **UITextInput** for custom text (such as scanned pages) so assistive technologies can correctly select and read the content.","hot":true}],"audience_en":"**UIKit/SwiftUI engineers building reading, document, or e-book apps** who want to perfect the accessible reading experience.","deepdive":[{"t":1,"title":"Introduction","body":"由 Accessibility 團隊的 Josh 開場，點出**長篇閱讀內容**與一般 UI 導覽的本質差異：閱讀是在文字間「流暢移動」，而非在控制項之間跳轉。講者以一個 Chicago 旅遊導覽 app 為範例，貫穿全場示範如何讓使用 **VoiceOver** 與 **Speak Screen** 的人也能順暢閱讀。"},{"t":86,"title":"Characteristics","body":"說明兩種內建輔助技術：**VoiceOver** 是給失明／弱視者的螢幕報讀器，朗讀游標所在處；**Speak Screen** 則從上到下朗讀整頁並同步高亮。講者據此訂出三個目標：**granular text navigation**（逐行／逐字導覽）、**continuous reading**（不被頁面打斷的連續閱讀）、與 **comprehensive text selection**（完整的文字選取）。"},{"t":225,"title":"Standard views","body":"建議優先採用系統內建、開箱即無障礙的文字 view：UIKit 的 `UITextView`、SwiftUI 開啟 selection 的 `Text` 或 `TextEditor`、AppKit 的 `NSTextView`，它們皆採用較高保真度的 **`UITextInput`** 協定，免費提供逐行／字導覽與選取。講者在旅遊 app 中因版面需求，為每個段落各用一個 `UITextView`。"},{"t":449,"title":"Link text elements together with navigation APIs","body":"當段落各自是獨立 view 時，VoiceOver 只能在單一段落內逐行移動，跨段落會卡住。iOS 18 的 text navigation API 透過 `accessibilityNextTextNavigationElement` 與 `accessibilityPreviousTextNavigationElement` 互相指向，就能讓游標越過一段落末尾接到下一段開頭。"},{"t":479,"title":"Link text elements together with a linked group","body":"對 SwiftUI，iOS 27 起可改用 **`accessibilityLinkedGroup`** modifier 取得同樣效果：把多個可選取的 `Text` 用相同 id 與 `@Namespace` 連結即可。macOS 上對應的是 `accessibilitySharedTextUIElements`。"},{"t":590,"title":"Turn pages automatically after reading","body":"分頁內容若要像有聲書般連續朗讀，需在最後一段套用 **`causesPageTurn`** trait，並實作 `accessibilityScroll`。如此當 Speak Screen 或 VoiceOver 讀到頁尾時會自動翻頁並 post `.pageScrolled` 通知，避免 read all 在頁底停住。"},{"t":705,"title":"Add actions to the editor rotor","body":"為了讓「儲存選取」這類動作能被 VoiceOver 使用者發現，講者覆寫 `UITextView` 子類的 `accessibilityCustomActions`，建立 `UIAccessibilityCustomAction` 並設定其 `category` 為 edit category，使其出現在 VoiceOver 的 **edit rotor** 中而非一般動作清單。"},{"t":845,"title":"Custom text","body":"說明何時無法使用標準 view：進階排版、跨 app 共用程式碼、或顯示掃描頁面等。講者把文字 view 換成手寫筆記掃描圖後，失去了 `UITextView` 免費提供的無障礙行為，連朗讀都沒有，引出採用 `UITextInput` 的必要。"},{"t":970,"title":"Adopt UITextInput","body":"在 accessibility element 上完整實作 **`UITextInput`** 協定，可讓圖片中的文字與標準 view 一樣可逐行觸控探索、rotor 導覽與選取。重點包括在 `selectionRects` 用已知行高行寬計算選取矩形、`text(in:)` 回傳正確子字串、提供（此處子類化 `UITextInputStringTokenizer` 的）tokenizer，並加上 `UITextInteraction` 與回呼 input delegate 來補齊選取視覺。"}],"summary":["這場由 Apple Accessibility 團隊主講，核心訊息是：**長篇閱讀內容**的無障礙體驗，和一般 UI 導覽是兩回事——閱讀重在文字之間流暢移動，而非在控制項間跳轉。講者 Josh 以一個 Chicago 旅遊導覽 app 為範例，鎖定 **VoiceOver** 與 **Speak Screen** 兩種輔助技術，訂出三個目標：逐行的細緻導覽、不被分頁打斷的連續朗讀，以及完整的文字選取。","第一條路是盡量採用系統內建、開箱即無障礙的標準文字 view：iOS 的 `UITextView`、SwiftUI 的 `TextEditor` 或開啟 selection 的 `Text`、macOS 的 `NSTextView`，它們都採用了 **`UITextInput`** 協定。在此基礎上再用 API 補強：跨段落導覽用 iOS 18 的 **text navigation APIs**（`accessibilityNextTextNavigationElement` 系列）或 SwiftUI iOS 27 的 **`accessibilityLinkedGroup`**；分頁連續朗讀靠 **`causesPageTurn`** trait 搭配 `accessibilityScroll` 自動翻頁；要讓選取後的動作（如「Save Recommendation」）被發現，則用帶 edit category 的 `UIAccessibilityCustomAction` 加進 VoiceOver 的 edit rotor。","當 app 必須使用**自訂繪製的文字**（例如進階排版、跨 app 共用程式碼，或顯示掃描頁面）時，會失去標準 view 免費提供的無障礙行為，連最基本的朗讀都沒有。此時應在 accessibility element 上完整實作 **`UITextInput`** 協定：管理文字幾何、在 `selectionRects` 計算選取矩形、在 `text(in:)` 回傳指定範圍的子字串，並提供 tokenizer 處理逐行／句／字導覽。搭配 `UITextInteraction` 再回呼 input delegate，就能補上選取把手與高亮等視覺體驗。","實務上的收尾建議是：開啟 VoiceOver 親自稽核自己的 app，試試 read all 手勢、用 lines rotor 導覽、並做文字選取。用標準 view 的人應採用 `causesPageTurn` 與 text navigation element API 取得跨頁順暢閱讀；用自訂文字的人則應完整採用 `UITextInput`。這些改善也會讓 iOS 26 的 **Accessibility Reader** 一併受惠。"],"summary_en":["Presented by Apple's Accessibility team, the core message is that accessibility for **long-form reading content** is fundamentally different from navigating ordinary UI: reading is about moving fluidly through text, not jumping between controls. Using a Chicago travel-guide app, presenter Josh focuses on two assistive technologies, **VoiceOver** and **Speak Screen**, and sets three goals: granular line-by-line navigation, continuous reading uninterrupted by pagination, and comprehensive text selection.","The first approach is to reach for system text views that are accessible out of the box: `UITextView` on iOS, SwiftUI's `TextEditor` or a `Text` with selection enabled, and `NSTextView` on macOS — all of which adopt the **`UITextInput`** protocol. On top of that, extend with APIs: cross-paragraph navigation via iOS 18's **text navigation APIs** (`accessibilityNextTextNavigationElement` and friends) or SwiftUI's iOS 27 **`accessibilityLinkedGroup`**; continuous read-all across pages via the **`causesPageTurn`** trait paired with `accessibilityScroll`; and surfacing selection actions like \"Save Recommendation\" through a `UIAccessibilityCustomAction` placed in VoiceOver's edit rotor using the edit category.","When the app must use **custom-rendered text** (for advanced typography, shared code, or scanned pages), it loses the free accessibility that standard views provide — even basic reading. The fix is to fully adopt the **`UITextInput`** protocol on your accessibility elements: manage text geometry, compute selection rectangles in `selectionRects`, return the right substring in `text(in:)`, and supply a tokenizer for line/sentence/word/character navigation. Adding a `UITextInteraction` and calling the input delegate rounds out selection handles and highlights.","The practical takeaway is to audit your app with VoiceOver on — try the read-all gesture, navigate with the lines rotor, and select text. If you use standard views, adopt `causesPageTurn` and the text navigation element APIs for smooth cross-page reading; if you use custom text, adopt `UITextInput` in its entirety. These improvements also benefit iOS 26's **Accessibility Reader**."],"deepdive_en":[{"t":1,"title":"Introduction","body":"Josh from the Accessibility team opens by contrasting **long-form reading content** with ordinary UI navigation: reading is about fluidly moving through text, not jumping between controls. A Chicago travel-guide app serves as the running example for making the experience great for **VoiceOver** and **Speak Screen** users."},{"t":86,"title":"Characteristics","body":"Explains the two built-in assistive technologies: **VoiceOver** is the screen reader for blind/low-vision users that reads what the cursor highlights; **Speak Screen** reads the whole page top-to-bottom with synchronized highlighting. From these, three goals are set: **granular text navigation**, **continuous reading**, and **comprehensive text selection**."},{"t":225,"title":"Standard views","body":"Recommends reaching first for system text views that are accessible out of the box — UIKit's `UITextView`, SwiftUI's selectable `Text` or `TextEditor`, AppKit's `NSTextView` — all adopting the higher-fidelity **`UITextInput`** protocol. The travel app uses a separate `UITextView` per paragraph due to its layout."},{"t":449,"title":"Link text elements together with navigation APIs","body":"Because each paragraph is a separate view, VoiceOver gets stuck navigating line-by-line within one paragraph. iOS 18's text navigation APIs let each element return its next/previous accessible element via `accessibilityNextTextNavigationElement` and `accessibilityPreviousTextNavigationElement`, so the cursor crosses from one paragraph's end to the next paragraph's first line."},{"t":479,"title":"Link text elements together with a linked group","body":"For SwiftUI, iOS 27 offers the **`accessibilityLinkedGroup`** modifier for the same effect: link multiple selectable `Text` elements with the same id and `@Namespace`. The AppKit equivalent on Mac is `accessibilitySharedTextUIElements`."},{"t":590,"title":"Turn pages automatically after reading","body":"For paginated content to read continuously like an audiobook, apply the **`causesPageTurn`** trait to the last paragraph and implement `accessibilityScroll`. Speak Screen and VoiceOver then auto-advance pages at the end and post a `.pageScrolled` notification, preventing read-all from stopping at the page bottom."},{"t":705,"title":"Add actions to the editor rotor","body":"To make a \"Save Recommendation\" action discoverable, the presenter overrides `accessibilityCustomActions` on a `UITextView` subclass and creates a `UIAccessibilityCustomAction` whose `category` is the edit category, so it appears in VoiceOver's **edit rotor** rather than the generic actions list."},{"t":845,"title":"Custom text","body":"Covers when standard views aren't possible: advanced typography, shared code across apps, or displaying scanned pages. Swapping text views for scanned handwriting images loses the free accessibility `UITextView` provided — even basic reading — motivating adoption of `UITextInput`."},{"t":970,"title":"Adopt UITextInput","body":"Fully implementing **`UITextInput`** on accessibility elements makes rendered or image text as accessible as a native text view: line touch-exploration, rotor/Speak Screen navigation, and selection. Key pieces include computing selection rectangles in `selectionRects` from known line geometry, returning the right substring in `text(in:)`, providing a tokenizer (here a `UITextInputStringTokenizer` subclass), and adding a `UITextInteraction` plus input-delegate callbacks for selection visuals."}],"code":[]},"related":[{"id":"203","title":"Read between the strokes with PencilKit","gloss":"用 PencilKit 解讀筆跡內容","gloss_en":"Read handwriting content with PencilKit","category":"uikit","categoryLabel":"UIKit"},{"id":"212","title":"Rev up your CarPlay app","gloss":"強化你的 CarPlay App","gloss_en":"Rev up your CarPlay app","category":"uikit","categoryLabel":"UIKit"},{"id":"221","title":"Prepare your tvOS apps for Dynamic Type","gloss":"讓你的 tvOS App 支援動態字型","gloss_en":"Prepare your tvOS app for Dynamic Type","category":"uikit","categoryLabel":"UIKit"},{"id":"226","title":"Create live communication experiences","gloss":"打造即時通訊體驗","gloss_en":"Build live communication experiences","category":"uikit","categoryLabel":"UIKit"},{"id":"278","title":"Modernize your UIKit app","gloss":"現代化你的 UIKit App","gloss_en":"Modernize your UIKit app","category":"uikit","categoryLabel":"UIKit"}]}</script>
