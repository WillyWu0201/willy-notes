<script id="d" type="application/json">{"s":{"id":"230","title":"What’s new in assessment on macOS","gloss":"macOS 評量功能的新變化","category":"other","categoryLabel":"其他","duration":841,"url":"https://developer.apple.com/videos/play/wwdc2026/230/","takeaway":"透過 Automatic Assessment Configuration 框架的新選項，可在 macOS 上為教育 App 設定前置檢查、無障礙限制與系統體驗，打造安全的考試環境。","chapters":[[0,"Introduction"],[94,"Precondition checks"],[150,"Set up precondition checks"],[180,"Accessibility restrictions"],[241,"Restrict accessibility features"],[273,"System experience customization"],[332,"Customize the Menu Bar items"],[421,"Define input restrictions"],[458,"Enable dock appearance"],[515,"Set allowed directories and files"],[556,"Application launch restrictions"],[598,"Set application launch restrictions"],[651,"Best practices"],[755,"Next steps"]],"points":[{"text":"以 **precondition checks** 在進入評量前要求 SIP、受管理裝置、單一使用者等條件，確保環境安全。","hot":false},{"text":"可精細控制 **accessibility restrictions**，個別允許或停用 VoiceOver、Switch Control、Zoom 等無障礙功能。","hot":true},{"text":"透過 **system experience customization** 自訂 Menu Bar 項目、輸入限制（聽寫、自動填寫、Emoji 鍵盤）與 Dock 外觀。","hot":false},{"text":"可設定允許存取的目錄檔案，並以 **application launch restrictions** 限制可啟動的程式與腳本執行。","hot":false}],"apis":["AutomaticAssessmentConfiguration","AEAssessmentConfiguration"],"audience":"適合**開發教育與考試類 App、需在 macOS 上提供安全評量環境的開發者**。","gloss_en":"What's new in assessment on macOS","takeaway_en":"New options in the Automatic Assessment Configuration framework let you set up precondition checks, accessibility restrictions, and the system experience for education apps on macOS to create a secure testing environment.","points_en":[{"text":"Use **precondition checks** to require conditions such as SIP, a managed device, or a single user before entering assessment, ensuring a secure environment.","hot":false},{"text":"Fine-tune **accessibility restrictions** to individually allow or disable assistive features like VoiceOver, Switch Control, and Zoom.","hot":true},{"text":"Use **system experience customization** to customize Menu Bar items, input restrictions (Dictation, autofill, Emoji keyboard), and the Dock's appearance.","hot":false},{"text":"Configure which directories and files can be accessed, and use **application launch restrictions** to limit which apps can launch and which scripts can run.","hot":false}],"audience_en":"For **developers building education and exam apps who need to provide a secure assessment environment on macOS**.","summary":["這場由 Apple Education Technologies 團隊主講，介紹 macOS 27 在 **Automatic Assessment Configuration**（AAC）框架上的強化。這個框架的用途，是替教育測驗或證照認證機構打造一個安全、鎖定的考試環境。要使用它，你的 app 必須先透過 Apple Developer portal 申請受限制的 **Automatic Assessment Configuration entitlement**。整場示範都圍繞一個範例考試 app，逐一展示各項 API 能力。","內容分成五大塊。第一是**系統前置條件檢查**（precondition checks）：在考試開始前，app 可要求 Mac 已啟用 System Integrity Protection、已 MDM 註冊、只有單一帳號登入且為指定帳號類型（如 standard），並要求關閉 Lockdown Mode 與 iCloud Private Relay，確保裝置處於難以竄改的硬化狀態。第二是**無障礙限制**：預設既有的輔助功能會在考試中持續運作以確保公平，但對於沒有核可需求的學生，可逐項以 `allowsAccessibility*` 屬性關閉如 Switch Control 等可載入使用者內容的功能（設為 true 只是允許、並非強制開啟）。第三是**系統體驗客製化**，可透過 `allowsMenuBar`、`allowedMenuBarItems`、`allowedAppleMenuItems` 篩選選單列；以 `allowsDictation`、`allowsAutoFill`、`allowsStructuralInput`、`allowsEmojiKeyboard` 關閉可能洩漏答案的輸入法；用 `allowsDock` 提供聚焦的 Dock；並以 `allowedDirectoriesAndFiles` 把 Finder 加為 participant 後限制可存取的目錄與檔案。","第四是**應用程式啟動限制**：把 `allowOnlyParticipantsToRun` 設為 true，系統會在考試開始時關閉所有非必要的 process，只留下主考試 app、明確允許的 participant 與必要系統 process；再以 `allowsUserScriptExecution = false` 阻擋 Shortcut 與 Automator 腳本執行，避免螢幕擷取、按鍵側錄或外傳資料等威脅。最後是**最佳實務**：讓框架替你處理安全工作而非自己重造輪子、只限制考試真正需要的最小範圍、把無障礙視為必要需求而非事後例外、用框架的 transition callback 來驅動 app 狀態（因為 session 不是在呼叫 begin/end 當下立即轉換）、並在每個 macOS beta 推出當天就用完整測試矩陣重新驗證並立即回報 Feedback。整體而言，AAC 用單一統一的 API，就能驗證系統安全前提、調整無障礙配套、客製使用者體驗並鎖定執行環境。"],"deepdive":[{"t":0,"title":"Introduction","body":"由 Education Technologies 團隊的工程師 Chris 開場，說明 **Automatic Assessment Configuration** 框架在 macOS 27 的強化，目的是替交付教育測驗或證照的機構打造安全、鎖定的環境。使用前須透過 Apple Developer portal 申請受限制的 **AAC entitlement**。本場將涵蓋五大主題：系統前置條件、無障礙限制、系統體驗客製化、應用程式啟動限制與最佳實務，全程以一個範例考試 app 示範。"},{"t":94,"title":"Precondition checks","body":"說明在考試開始前做**系統前置條件檢查**對於確保 Mac 處於硬化狀態的重要性。app 可要求啟用 **System Integrity Protection**、已 **MDM 註冊**、只有單一帳號登入、且帳號為指定類型（如 standard）這四項，共同確保裝置難以竄改；另可要求關閉 **Lockdown Mode** 與 **iCloud Private Relay**，避免這些隱私安全功能干擾考試的基礎設施需求。"},{"t":150,"title":"Set up precondition checks","body":"示範在 **`AEAssessmentConfiguration`** 物件上設定屬性來加入前置條件，此物件即定義一場 assessment session 參數的核心。範例程式碼要求登入帳號必須是 standard 帳號。若學生裝置不符合一項或多項要求，系統會顯示警示，告知必須先解決哪些問題才能繼續。"},{"t":180,"title":"Accessibility restrictions","body":"說明 macOS 內建完整的無障礙功能，是讓視覺、聽覺、肢體或認知需求者公平參與考試的關鍵，毋須第三方輔助軟體。預設情況下選單列與 Dock 被隱藏，但既有已啟用的無障礙功能會在 session 中持續運作（如示範中的 **Switch Control**）。不過某些功能可載入使用者自訂內容，因此對沒有核可配套需求的學生關閉它們是重要的安全措施。"},{"t":241,"title":"Restrict accessibility features","body":"示範一個允許所有無障礙功能、僅限制 **Switch Control** 的設定。重點提醒：把屬性設為 true 並不會「啟用」對應功能，只是允許它在使用者已開啟時於考試中可用。當 session 開始時，被限制的 Switch Control 會被自動結束，且在 session 期間無法再次啟動。"},{"t":273,"title":"System experience customization","body":"介紹框架最強大的領域之一——**系統體驗客製化**，調整學生在考試中與 macOS 互動的方式。macOS 透過選單列、選單列項目（如 Wi-Fi、Volume）、Dock、Dictation 與 AutoFill 等輸入技術、以及 Finder 與開啟／儲存對話框等熟悉元素提供流暢環境，這些都是可被裁切調整的對象。"},{"t":332,"title":"Customize the Menu Bar items","body":"示範以 **`allowsMenuBar`** 開啟選單列讓學生取用必要的 app 功能，並用 **`allowedMenuBarItems`** 定義允許清單（如 battery、clock、volume），移除可能成為資訊外洩管道的項目。這些 menu extra 不會被強制開啟，而是在原本就存在時才於 session 中持續可用；另以 **`allowedAppleMenuItems`** 客製 Apple 選單（範例只顯示 sleep，設空陣列則只留「About This Mac」）。"},{"t":421,"title":"Define input restrictions","body":"說明哪些輸入法可能不慎提供提示或正確答案：**Dictation** 會自動產生正確拼字、emoji picker 提供可搜尋的符號庫、structural input 揭露字元組成線索，**AutoFill** 則可能從 Contacts 等來源帶入預載答案或參考資料。把 `allowsDictation`、`allowsAutoFill`、`allowsStructuralInput`、`allowsEmojiKeyboard` 設為 false，即可在 Edit 選單與支援這些功能的 UI 控制項中隱藏並阻止其使用。"},{"t":458,"title":"Enable dock appearance","body":"示範把 **`allowsDock`** 設為 true 來啟用篩選過的 Dock 體驗，提供學生聚焦的工作區以便尋找與切換 app。考試中 Dock 只顯示被允許的 app，除了恆常存在的 Finder 與 Trash 錨點外，僅出現該 session 允許的 app；但即使 Finder 出現，除非明確加為 participant，否則仍無法存取。"},{"t":515,"title":"Set allowed directories and files","body":"說明若考試 app 需與指定檔案互動，可允許存取 Finder 並使用標準開啟／儲存對話框。示範先把 **Finder 加為 participant**，再以 **`allowedDirectoriesAndFiles`** 將 Documents 目錄列入允許清單供學生儲存草稿。此設定也會同步篩選標準 Open/Save 面板中可見的目錄與檔案，學生只看得到被允許的目錄。"},{"t":556,"title":"Application launch restrictions","body":"說明對考試完整性的最後一層控制——限制考試中可執行的 process。非必要的 process 可能被用來擷取螢幕內容、側錄按鍵、向外部傳輸資料或以其他方式破壞安全測試環境。因此你可能會想把允許執行的範圍限縮到只剩考試 app 與你允許的 participant app，並一併關閉 Shortcuts 與 Automator 動作的執行。"},{"t":598,"title":"Set application launch restrictions","body":"示範把 **`allowOnlyParticipantsToRun`** 設為 true，告訴系統在考試開始時關閉非必要 process，只允許主考試 app、明確允許的 participant 與必要系統 process 執行。同時把 **`allowsUserScriptExecution`** 設為 false 以阻止 Shortcut 與 Automator 腳本。示範中考試前 Safari、Notes 與一個長時間執行的 Shortcut 都在運作，開始後只剩範例 app 與其 participant（Finder），其餘背景 process 皆被停止且無法存取。"},{"t":651,"title":"Best practices","body":"整理每位開發者都應考量的最佳實務：善用框架深度系統整合替你保護環境，別自己重造等效功能而應採用框架 API 並刪除冗餘程式碼；只限制考試真正需要的最小範圍，從寬鬆開始再刻意收緊；把無障礙視為必要需求、從第一天起就設計支援輔助技術。此外要記得 session 轉換不是在呼叫 begin/end 當下立即發生，應註冊框架的 **transition callback** 來驅動 app 狀態；並在每個 macOS beta 推出當天就用完整測試矩陣重新驗證並立即回報 Feedback。"},{"t":755,"title":"Next steps","body":"總結建議的後續步驟：用系統預檢驗證裝置完整性、啟用無障礙功能提供公平的考試體驗、客製選單列項目／Dock／檔案系統以提供熟悉直覺的體驗、封鎖非必要 process 來保護執行環境，並以真實考試流程在 macOS 上測試你的方案。無論是課堂測驗 app 或全國標準化測驗平台，**AutomaticAssessmentConfiguration** 框架都能透過單一統一的 API 驗證安全前提、調整無障礙配套、客製體驗並鎖定執行環境。"}],"summary_en":["Presented by Apple's Education Technologies team, this session covers the enhancements to the **Automatic Assessment Configuration** (AAC) framework in macOS 27. The framework exists to create a secure, locked-down environment for organizations delivering education assessments or certifications. To use it, your app needs the restricted **Automatic Assessment Configuration entitlement**, requestable through the Apple Developer portal. The whole talk demonstrates the API capabilities through a sample assessment app.","The content breaks into five areas. First, **precondition checks**: before an exam begins, your app can require that System Integrity Protection is enabled, the Mac is MDM enrolled, only a single account is signed in, and that account is a specific type (such as standard), plus require Lockdown Mode and iCloud Private Relay to be disabled—together ensuring a hardened, tamper-resistant device. Second, **accessibility restrictions**: already-enabled features keep working during a session for fairness, but for students without an approved accommodation you can disable customizable features like Switch Control via the `allowsAccessibility*` properties (setting true only allows, it does not force-enable). Third, **system experience customization** via `allowsMenuBar`, `allowedMenuBarItems`, and `allowedAppleMenuItems` to filter the Menu Bar; `allowsDictation`, `allowsAutoFill`, `allowsStructuralInput`, and `allowsEmojiKeyboard` to disable answer-leaking input methods; `allowsDock` for a focused Dock; and `allowedDirectoriesAndFiles` (after adding Finder as a participant) to restrict file access.","Fourth, **application launch restrictions**: setting `allowOnlyParticipantsToRun` to true shuts down all non-essential processes at session start, leaving only the main app, allowlisted participants, and essential system processes, while `allowsUserScriptExecution = false` blocks Shortcuts and Automator scripts—mitigating screen capture, keystroke logging, and data exfiltration threats. Finally, **best practices**: let the framework do the security work rather than rolling your own, restrict only the minimum the assessment requires, treat accessibility as a requirement rather than an afterthought, drive app state off the framework's transition callbacks (sessions don't transition the instant you call begin/end), and re-validate against every macOS beta the day it drops with your full test matrix, filing Feedback immediately. Overall, AAC verifies security prerequisites, tailors accessibility, customizes the experience, and locks down the runtime through a single unified API."],"deepdive_en":[{"t":0,"title":"Introduction","body":"Chris, an engineer on the Education Technologies team, opens by explaining the enhancements to the **Automatic Assessment Configuration** framework in macOS 27, which helps create a secure, locked-down environment for organizations delivering education assessments or certifications. Using it requires the restricted **AAC entitlement** from the Apple Developer portal. The session covers five areas—system preconditions, accessibility restrictions, system experience customization, application launch restrictions, and best practices—all demonstrated with a sample assessment app."},{"t":94,"title":"Precondition checks","body":"Explains why running **system precondition checks** before an exam matters for ensuring the Mac is in a hardened state. An app can require that **System Integrity Protection** is enabled, the Mac is **MDM enrolled**, only a single account is signed in, and the account is a specific type (such as standard)—four checks that together ensure a tamper-resistant device. It can additionally require that **Lockdown Mode** and **iCloud Private Relay** are disabled so these privacy and security features don't interfere with the assessment's infrastructure requirements."},{"t":150,"title":"Set up precondition checks","body":"Demonstrates adding preconditions by setting properties on the **`AEAssessmentConfiguration`** object, which defines an assessment session's parameters. The example code requires the signed-in account to be a standard account. If a student's device fails one or more requirements, an alert is shown informing them which issues must be resolved before continuing."},{"t":180,"title":"Accessibility restrictions","body":"Notes that macOS includes a comprehensive suite of accessibility features essential for equitable exam access without third-party assistive software. By default the Menu Bar and Dock are hidden, but currently enabled accessibility features keep working during the session (as shown with **Switch Control**). However, some features can be customized with user-generated content, so disabling them for students without an approved accommodation is an important security measure."},{"t":241,"title":"Restrict accessibility features","body":"Shows a configuration that allows every accessibility feature except **Switch Control**. The key caveat: setting a property to true does not enable the corresponding feature—it merely allows it to be used during an assessment when the user has it on. When the session starts, the restricted Switch Control is automatically quit and cannot be relaunched for the duration of the session."},{"t":273,"title":"System experience customization","body":"Introduces one of the framework's most powerful areas—**system experience customization**, tailoring how students interact with macOS during an assessment. The familiar macOS experience comes from the Menu Bar, Menu Bar items (Wi-Fi, Volume), the Dock, input technologies like Dictation and AutoFill, and filesystem interaction via Finder and the Open/Save dialogs—all of which can be tailored."},{"t":332,"title":"Customize the Menu Bar items","body":"Demonstrates enabling the Menu Bar with **`allowsMenuBar`** so students can access essential app functions, and using **`allowedMenuBarItems`** to define an allowlist (such as battery, clock, volume) while removing items that could leak content. These menu extras aren't forced on—they remain available only if already present. The Apple menu is also customized via **`allowedAppleMenuItems`** (the example shows only sleep; an empty array leaves only \"About This Mac\")."},{"t":421,"title":"Define input restrictions","body":"Explains which input methods could inadvertently provide hints or answers: **Dictation** auto-produces correct spelling, the emoji picker exposes a searchable symbol library, structural input reveals character composition clues, and **AutoFill** can inject pre-loaded answers or reference material from sources like Contacts. Setting `allowsDictation`, `allowsAutoFill`, `allowsStructuralInput`, and `allowsEmojiKeyboard` to false hides them in menus and prevents their use in UI controls that normally support them."},{"t":458,"title":"Enable dock appearance","body":"Demonstrates setting **`allowsDock`** to true for a filtered Dock that gives students a focused workspace to find and switch between apps. During the assessment the Dock shows only the allowed apps; beyond the always-present Finder and Trash anchors, only the session's allowed apps appear. Even though Finder is shown, it isn't accessible unless explicitly added as a participant."},{"t":515,"title":"Set allowed directories and files","body":"Explains that if the app needs to interact with designated files, you can allow Finder access and use the standard Open/Save dialogs. The demo first adds **Finder as a participant**, then uses **`allowedDirectoriesAndFiles`** to allowlist the Documents directory for saving scratch work. The same setting filters the directories and files shown in the standard Open and Save panels, so students see only the allowlisted directory."},{"t":556,"title":"Application launch restrictions","body":"Covers the final layer of control—restricting which processes may run during an assessment. Non-essential processes can capture screen content, log keystrokes, transmit data to external parties, or otherwise undermine the secure testing environment. Accordingly, you may want to restrict allowed processes to just your assessment app and allowlisted participants, and also shut down Shortcuts and Automator actions."},{"t":598,"title":"Set application launch restrictions","body":"Demonstrates setting **`allowOnlyParticipantsToRun`** to true, telling the system to shut down non-essential processes at session start so only the main app, explicitly allowlisted participants, and essential system processes run. It also sets **`allowsUserScriptExecution`** to false to block Shortcut and Automator scripts. In the demo, Safari, Notes, and a long-running Shortcut are running before the exam; afterward only the sample app and its participant (Finder) remain, with all user-initiated background processes stopped."},{"t":651,"title":"Best practices","body":"Rounds up practices every developer should consider: let the framework's deep system integration secure the environment rather than rolling your own equivalents, adopting its APIs and deleting redundant code; restrict only the minimum the assessment requires, starting permissive and tightening deliberately; and treat accessibility as a requirement, designing for assistive technologies from day one. It also stresses that sessions don't transition the instant you call begin/end, so register for the framework's **transition callbacks** to drive app state, and re-validate on every macOS beta the day it drops, filing Feedback immediately."},{"t":755,"title":"Next steps","body":"Summarizes the recommended next steps: use system pre-checks to validate device integrity, enable accessibility features for an equitable experience, provide a familiar experience by customizing Menu Bar items, the Dock, and the file system, secure the runtime by blocking non-essential processes, and test with real exam workflows on macOS. Whether building a classroom quiz app or a nationwide standardized testing platform, the **AutomaticAssessmentConfiguration** framework verifies security prerequisites, tailors accessibility, customizes the experience, and locks down the runtime through a single unified API."}],"code":[]},"related":[{"id":"101","title":"Keynote","gloss":"主題演講","gloss_en":"Keynote","category":"other","categoryLabel":"其他"},{"id":"102","title":"Platforms State of the Union","gloss":"平台現況報告","gloss_en":"Platforms State of the Union","category":"other","categoryLabel":"其他"},{"id":"111","title":"Keynote (ASL)","gloss":"主題演講(美國手語版)","gloss_en":"Keynote (American Sign Language)","category":"other","categoryLabel":"其他"},{"id":"112","title":"Platforms State of the Union (ASL)","gloss":"平台現況報告（美國手語版）","gloss_en":"Platforms State of the Union (American Sign Language)","category":"other","categoryLabel":"其他"},{"id":"122","title":"WWDC26 Platforms State of the Union Recap","gloss":"WWDC26 平台現況演講重點回顧","gloss_en":"WWDC26 Platforms State of the Union recap","category":"other","categoryLabel":"其他"}]}</script>
