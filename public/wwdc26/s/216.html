<script id="d" type="application/json">{"s":{"id":"216","title":"Create web extensions for Safari","gloss":"為 Safari 建立 Web 擴充功能","category":"other","categoryLabel":"其他","duration":1602,"url":"https://developer.apple.com/videos/play/wwdc2026/216/","takeaway":"從零打造一個 Safari Web 擴充功能，涵蓋 manifest、內容封鎖、修改網頁、儲存資料、打包發佈，並透過 native messaging 與 App 溝通。","chapters":[[0,"Introduction"],[203,"Get started"],[224,"Manifest file"],[269,"Adding an extension icon"],[330,"Adding an action button"],[377,"Adding custom UI to your extension"],[390,"Including the UI in the extension manifest"],[400,"Hello World"],[443,"Block content"],[498,"Adding declarativeNetRequest permission"],[502,"Blocking network requests"],[521,"Modifying network requests"],[530,"Updating dynamic rules"],[559,"Wiring up the static declarativeNetRequest rules"],[580,"Adding block rules dynamically"],[610,"Handling adding hosts to the settings"],[648,"Redirecting network requests"],[677,"Declaring optional host permissions"],[714,"Declaring optional host permissions for all sites"],[792,"Add the redirect rule"],[822,"Dynamically ask for host permissions"],[880,"Modify webpages"],[895,"Defining content scripts"],[913,"Dynamically registering content scripts"],[931,"Adding the scripting permission"],[941,"Registering content scripts"],[962,"Adding a host"],[1026,"Web extensions storage APIs"],[1041,"Adding storage permission to the web extension manifest.json"],[1050,"Saving data with storage"],[1061,"Persisting hosts to storage"],[1071,"Reading from storage"],[1080,"Switching block modes"],[1141,"Adding a background script"],[1179,"Background script"],[1193,"Package and distribute"],[1353,"Communicate with your app"],[1369,"Package your web extension into an app for Xcode"],[1412,"Adding the nativeMessaging permission"],[1420,"Sending a native message"],[1435,"Handling native messages"],[1465,"Replying to a native message"],[1564,"Next steps"]],"points":[{"text":"可以**不需 Xcode**，直接從 manifest.json 開始建立並測試 Safari Web 擴充功能。","hot":true},{"text":"透過 **declarativeNetRequest** 權限可封鎖、修改與重新導向網路請求，並支援動態規則。","hot":false},{"text":"使用 **content scripts** 搭配 **scripting** 權限可動態註冊腳本以修改網頁內容。","hot":false},{"text":"以 **storage** API 持久化設定，並用 **background script** 在更新時還原狀態。","hot":false},{"text":"打包成 App 後可透過 **nativeMessaging** 與原生程式溝通，例如以 LocalAuthentication 做生物辨識驗證。","hot":false}],"apis":["manifest_version","declarativeNetRequest","browser.scripting.registerContentScripts","browser.storage","nativeMessaging","browser.runtime.sendNativeMessage","SafariWebExtensionHandler","LocalAuthentication","safari-web-extension-packager"],"audience":"適合**想開發或移植 Safari Web 擴充功能的網頁與 App 開發者**，特別是初次接觸者。","gloss_en":"Create web extensions for Safari","takeaway_en":"Build a Safari web extension from scratch, covering the manifest, content blocking, modifying pages, storing data, packaging for distribution, and communicating with an app via native messaging.","points_en":[{"text":"You can build and test Safari web extensions starting straight from manifest.json, **without Xcode**.","hot":true},{"text":"The **declarativeNetRequest** permission lets you block, modify, and redirect network requests, with support for dynamic rules.","hot":false},{"text":"Use **content scripts** together with the **scripting** permission to dynamically register scripts that modify page content.","hot":false},{"text":"Persist settings with the **storage** API, and use a **background script** to restore state on update.","hot":false},{"text":"Once packaged into an app, the extension can communicate with native code via **nativeMessaging**, for example using LocalAuthentication for biometric authentication.","hot":false}],"audience_en":"For **web and app developers who want to build or port Safari web extensions**, especially first-timers.","summary":["Safari 團隊工程師 Kiara 帶領從零打造一個 **Safari web extension**，並完整走過開發、測試與發佈流程——而且不需要 Xcode、甚至不需要 Mac。核心訊息是：web extension 本質上就是 HTML、CSS 與 JavaScript，且 Apple 正與 W3C **WebExtensions** 工作組推動跨瀏覽器標準化，因此為其他瀏覽器寫的擴充功能能直接帶到 Safari。她實作的範例「Shiny OnTrack」可封鎖讓人分心的網站，提供允許瀏覽 10 分鐘的 **Light mode** 與一進站就轉址的 **Full mode**。","開發從 **manifest.json**（擴充功能的「身分證」，含 name、description、version）起步，加入 SVG 圖示與 UI——可用 action button 的 popup，本例改用完整的 **options page** 來顯示封鎖清單。內容封鎖靠 **declarativeNetRequest** API：先在 manifest 宣告權限，再以 ID／priority／action／condition 定義規則，本例因事先不知封鎖哪些站而採**動態規則**（`updateDynamicRules`）。要把錯誤頁換成自訂頁面則用 **redirect rule**，並改用 `declarativeNetRequestWithHostAccess` 搭配 **optional host permissions**，在執行時以 `permissions.request` 向使用者請求單一網站存取——權限模型以使用者隱私為核心。Light mode 的 10 分鐘倒數計時則透過**動態註冊的 content scripts**（`scripting.registerContentScripts`）注入頁面。","為了讓資料在重新載入後仍存在，改用 **storage** API 的 local storage 把封鎖清單與模式寫入磁碟；又因註冊的 content scripts 不會跨擴充功能更新存活，加入 **background page** 監聽 `onInstalled` 事件，在更新後從 storage 重讀並重新註冊。發佈方面，**App Store Connect** 的 **Safari Web Extension Packager** 可在任何瀏覽器上把資源打包成內含 app，再透過 **TestFlight** 發測試版、最終送審上架。最後示範以 **native messaging** 讓擴充功能與內含 app 協作：擴充功能送訊息給 App Extension，由原生 app 用 **LocalAuthentication**（`LAContext.evaluatePolicy`）要求 Touch ID／Face ID 生物辨識後回傳結果，藉此保護擴充功能的設定。"],"deepdive":[{"t":0,"title":"Introduction","body":"Safari 團隊工程師 Kiara 開場，說明 **web extension** 就是 HTML／CSS／JavaScript，且 Apple 與 W3C 工作組推動跨瀏覽器標準化，讓既有擴充功能可帶到 Safari。她將從零打造一個封鎖分心網站的擴充功能（含 Light 與 Full 兩種模式），並涵蓋打包發佈與和內含 app 協作。"},{"t":203,"title":"Get started","body":"建議先下載本場 sample code project 跟著做。開始時在編輯器（Xcode 或任何編輯器皆可）建立一個資料夾來放擴充功能的所有檔案。"},{"t":224,"title":"Manifest file","body":"每個擴充功能都需要 **manifest** 檔——JSON 格式，像擴充功能的「身分證」，包含 name、description、version 等資訊，告訴瀏覽器這個擴充功能是什麼、能做什麼。"},{"t":269,"title":"Adding an extension icon","body":"新增 images 資料夾放圖示，並在 manifest 的 `icons` 指定。本例用 **SVG**，Safari 會完美處理縮放，使其在工具列或 Extensions Settings 等不同位置都正確顯示。"},{"t":330,"title":"Adding an action button","body":"多數擴充功能需要 UI。一種方式是 **action button**：在 manifest 用 `action.default_popup` 指定 popup.html，點擊工具列按鈕時 Safari 會顯示該 popup。"},{"t":377,"title":"Adding custom UI to your extension","body":"因為封鎖清單放在 popup 會顯得擁擠，改用擴充功能的 **options page**——一個完整頁面讓使用者設定擴充功能。"},{"t":390,"title":"Including the UI in the extension manifest","body":"在 manifest 用 `options_ui.page`（後續改為 `options_page`）指定 options 頁面的 HTML 檔，Safari 便知道如何使用該資源。"},{"t":400,"title":"Hello World","body":"先用最簡單的 Hello World 頁面測試。在 Safari 的 Advanced 設定勾選「Show features for web developers」啟用開發者面板，允許未簽章擴充功能後選取資料夾即可載入；重新載入後出現 Settings 按鈕並開啟 options 頁面。"},{"t":443,"title":"Block content","body":"進入封鎖內容的核心——使用 **declarativeNetRequest** API，讓擴充功能能封鎖、修改或轉址網路請求，這正是過濾廣告與追蹤器的能力來源。"},{"t":498,"title":"Adding declarativeNetRequest permission","body":"權限是擴充功能向 Safari 宣告所需存取的方式。要使用內容封鎖，需在 manifest 的 `permissions` 加入 **declarativeNetRequest**。"},{"t":502,"title":"Blocking network requests","body":"一條規則包含 ID、priority、action 型別與符合條件。範例規則以 `urlFilter: \"||webkit.org\"` 與 `action.type: \"block\"` 封鎖對 webkit.org 的所有導覽。"},{"t":521,"title":"Modifying network requests","body":"規則有兩種定義方式：在 manifest 內定義的**靜態規則**（已知規則時很合適），以及執行時用 JavaScript 加入的**動態規則**。本例因事先不知要封鎖哪些站，採動態方式。"},{"t":530,"title":"Updating dynamic rules","body":"用 `browser.declarativeNetRequest.updateDynamicRules({ addRules: [...] })` 在執行時加入規則。把這段邏輯放在 utilities 資料夾的 rules.js。"},{"t":559,"title":"Wiring up the static declarativeNetRequest rules","body":"在 rules.js 中加入 helper 把 host 映射成唯一整數 ID（`hostToRuleID`），再以 ID、type 為 block、`urlFilter` 比對 host 建立規則，並透過 `updateDynamicRules` 加入。"},{"t":580,"title":"Adding block rules dynamically","body":"在 host.js 的 `addHost` 中，當使用者把網站加入清單且為 full 模式時建立封鎖規則。在 Safari 重新載入後把 webkit.org 加入清單，前往該站即被封鎖。"},{"t":610,"title":"Handling adding hosts to the settings","body":"示範把網站加入封鎖清單後的封鎖效果，但內建錯誤頁不理想，於是改用轉址規則導向自訂頁面，引出下一段的 redirect。"},{"t":648,"title":"Redirecting network requests","body":"**redirect rule** 與 block rule 類似，但 `action.type` 為 redirect，並以 `extensionPath` 指定使用者導向的自訂頁面（如 /blocked.html）。"},{"t":677,"title":"Declaring optional host permissions","body":"封鎖請求不需頁面存取，但**轉址需要**。因此改用 `declarativeNetRequestWithHostAccess` 權限，並以 **optional host permissions** 在執行時才請求網站存取。"},{"t":714,"title":"Declaring optional host permissions for all sites","body":"host permissions 由 scheme、host、path 組成的 match pattern 陣列定義。因任何站都可能被加入，採用可比對所有 URL 的 `*://*/*` 模式。Safari 的權限模型以使用者隱私為核心，由使用者決定授權哪些站。"},{"t":792,"title":"Add the redirect rule","body":"在 rules.js 建立 redirect 規則，type 為 redirect 並帶自訂頁面路徑；資源頁面放進擴充功能資料夾。如此不再封鎖導覽，而是轉址到自訂頁面。"},{"t":822,"title":"Dynamically ask for host permissions","body":"用 `browser.permissions.request` 在執行時向使用者請求網域與子網域的存取。在 Safari 加入 webkit.org 時會先跳出授權提示，允許並重新整理後導覽即被轉址到自訂頁面。"},{"t":880,"title":"Modify webpages","body":"為實作 Light mode 允許瀏覽 10 分鐘並顯示倒數，需要把內容直接注入頁面，這正是 **content scripts** 的用途。"},{"t":895,"title":"Defining content scripts","body":"content scripts 讓擴充功能能讀取與修改網頁內容。可在 manifest 以檔案與 match pattern **靜態**宣告（已知目標站時合適），本例因事先未知改採動態。"},{"t":913,"title":"Dynamically registering content scripts","body":"用 registered content scripts API 動態註冊，運作如靜態 script 但多了 ID 與 persistence flag；將 flag 設為 true 可讓 script 在 Safari 重啟後仍存在。"},{"t":931,"title":"Adding the scripting permission","body":"要使用此 API，需在 manifest 加入 **scripting** 權限，並在 utilities 新增 scripting.js。"},{"t":941,"title":"Registering content scripts","body":"在 scripting.js 定義 content script（ID、計時器的 js、樣式 css、涵蓋網域與子網域的 match pattern、`persistAcrossSessions: true`），再以 `browser.scripting.registerContentScripts` 註冊。"},{"t":962,"title":"Adding a host","body":"在 `addHost` 中，當使用者加入網站時為其註冊顯示計時器的 content script；full 模式下轉址會在頁面載入前觸發，故總是可註冊。Light 模式下加入 webkit.org 後前往該站，頁面上會顯示 10 分鐘計時器。"},{"t":1026,"title":"Web extensions storage APIs","body":"目前資料存在記憶體中，重新載入即遺失，故改用 **storage** API。Safari 支援 session storage（適合不需跨重啟的暫存）與 local storage（寫入磁碟），封鎖清單需保留故選 local。"},{"t":1041,"title":"Adding storage permission to the web extension manifest.json","body":"要使用 storage API，需在 manifest 的 `permissions` 加入 **storage**。"},{"t":1050,"title":"Saving data with storage","body":"在 utilities 新增 storage.js，定義更新／取得 hosts 與儲存／取得 block mode 的 helper（`browser.storage.local.set`／`get`）。"},{"t":1061,"title":"Persisting hosts to storage","body":"在 `addHost` 中，使用者加入新站時更新 storage 內的 hosts 清單，讓封鎖清單之後總能完整呈現所有已加入的站。"},{"t":1071,"title":"Reading from storage","body":"在 options.js 啟動時從 storage 讀取既有 hosts 與 block mode，並用以渲染封鎖清單。"},{"t":1080,"title":"Switching block modes","body":"切換模式時將變更存入 storage；若為 full 模式則為所有站建立轉址規則，否則移除所有規則。改成 Full 並加站後重新載入，變更仍在。"},{"t":1141,"title":"Adding a background script","body":"註冊的 content scripts 能跨 Safari 重啟，但**不跨擴充功能更新**。因此需要 background page 或 service worker 來得知更新；講者偏好可存取 DOM 的 background page，在 manifest 以 `background.scripts` 指定。"},{"t":1179,"title":"Background script","body":"在 background.js 註冊 `runtime.onInstalled` 事件，當偵測到更新（reason 為 update）時從 storage 讀取 hosts 並重新註冊 content scripts，修復更新後遺失 script 的問題。"},{"t":1193,"title":"Package and distribute","body":"可用 **App Store Connect** 上傳、送審與管理擴充功能，且能在任何瀏覽器上進行、無需 Mac。它會替你建立內含 app，再用 **Safari Web Extension Packager** 上傳資源並在數分鐘內完成打包。"},{"t":1353,"title":"Communicate with your app","body":"標準 WebExtension API 之外，擴充功能還能透過 **native messaging** 取用平台原生功能，讓擴充功能與內含 app 協作。"},{"t":1369,"title":"Package your web extension into an app for Xcode","body":"在 Terminal 執行 `xcrun safari-web-extension-packager --copy-resources` 會建立並開啟一個含 app 與 web extension 的 Xcode 專案，供後續收發訊息。"},{"t":1412,"title":"Adding the nativeMessaging permission","body":"要使用 native messaging，需在擴充功能 manifest 的 `permissions` 加入 **nativeMessaging**。"},{"t":1420,"title":"Sending a native message","body":"在 background page 用 `browser.runtime.sendNativeMessage` 送出訊息（例如 requestBioAuth），回傳結果會告知驗證是否成功。"},{"t":1435,"title":"Handling native messages","body":"在 packager 產生的 **SafariWebExtensionHandler** 中解析訊息的 requestBioAuth key，再以 **LocalAuthentication** 的 `LAContext.evaluatePolicy(.deviceOwnerAuthenticationWithBiometrics)` 請求生物辨識。"},{"t":1465,"title":"Replying to a native message","body":"驗證完成後，原生 app 透過 `reply` 把含 success 結果的 `NSExtensionItem` 以 `context.completeRequest` 回傳給擴充功能。在 Safari 加入網站前會先要求 Touch ID 驗證，通過後才加入清單。"},{"t":1564,"title":"Next steps","body":"總結整個從零打造到發佈的流程，鼓勵下載 sample code 把玩 API，到 MDN 查閱跨瀏覽器文件，並透過 Feedback Assistant 或 bugs.webkit.org 回報問題。"}],"summary_en":["Safari engineer Kiara builds a **Safari web extension** from the ground up and walks through development, testing, and distribution — with no Xcode and not even a Mac required. The core message: web extensions are just HTML, CSS, and JavaScript, and Apple is standardizing across browsers through the W3C **WebExtensions** group, so an extension built for another browser can come straight to Safari. Her sample, \"Shiny OnTrack,\" blocks distracting sites with a **Light mode** that allows 10 minutes of browsing and a **Full mode** that redirects the moment you navigate there.","Development starts with the **manifest.json** (the extension's \"ID card\" with name, description, version), then adds an SVG icon and UI — either an action button popup or, as here, a full **options page** to show the blocklist. Content blocking uses the **declarativeNetRequest** API: declare the permission, then define rules with ID/priority/action/condition. Since the sites aren't known up front, the example uses **dynamic rules** (`updateDynamicRules`). To replace the error page with a custom one, it switches to a **redirect rule** and to `declarativeNetRequestWithHostAccess` with **optional host permissions**, requesting per-site access at runtime via `permissions.request` — a permission model built around user privacy. The Light-mode 10-minute countdown is injected via **dynamically registered content scripts** (`scripting.registerContentScripts`).","To survive reloads, the extension moves data into local **storage** so the blocklist and mode persist to disk; and because registered content scripts don't survive extension updates, a **background page** listens for `onInstalled` to re-read storage and re-register scripts after an update. For distribution, **App Store Connect**'s **Safari Web Extension Packager** packages resources into a containing app from any browser, then **TestFlight** distributes betas before App Store submission. Finally, **native messaging** lets the extension collaborate with its containing app: the extension sends a message that the native app handles with **LocalAuthentication** (`LAContext.evaluatePolicy`) to require Face ID/Touch ID before changes, protecting the extension's settings."],"deepdive_en":[{"t":0,"title":"Introduction","body":"Safari engineer Kiara opens, noting that a **web extension** is just HTML/CSS/JavaScript and that Apple and the W3C group are standardizing across browsers, so existing extensions can come to Safari. She'll build a distraction-blocking extension (Light and Full modes) and cover packaging, distribution, and collaborating with a containing app."},{"t":203,"title":"Get started","body":"Recommends downloading the session's sample code project to follow along. To begin, create a folder in your editor (Xcode or any editor) to hold all the extension's files."},{"t":224,"title":"Manifest file","body":"Every extension needs a **manifest** file — JSON-formatted, like an ID card — containing the name, description, and version, telling the browser what the extension is and what it can do."},{"t":269,"title":"Adding an extension icon","body":"Add an images folder for the icon and reference it via `icons` in the manifest. The example uses an **SVG**; Safari handles scaling perfectly so it shows correctly in the toolbar, Extensions Settings, and elsewhere."},{"t":330,"title":"Adding an action button","body":"Most extensions need UI. One option is an **action button**: in the manifest, set `action.default_popup` to popup.html so Safari shows the popup when the toolbar button is clicked."},{"t":377,"title":"Adding custom UI to your extension","body":"Because a blocklist would look cramped in a popup, the extension uses an **options page** instead — a full page where users configure settings."},{"t":390,"title":"Including the UI in the extension manifest","body":"Specify the options page HTML via `options_ui.page` (later `options_page`) in the manifest so Safari knows how to use the resource."},{"t":400,"title":"Hello World","body":"Test with a simple Hello World page first. In Safari's Advanced settings, check \"Show features for web developers\" to enable the developer pane, allow unsigned extensions, then select the folder to load it; after reloading, a Settings button appears and opens the options page."},{"t":443,"title":"Block content","body":"Gets into the core of content blocking using the **declarativeNetRequest** API, which lets the extension block, modify, or redirect network requests — the power behind ad and tracker filtering."},{"t":498,"title":"Adding declarativeNetRequest permission","body":"Permissions are how an extension tells Safari what it needs. To block content, add the **declarativeNetRequest** permission to the manifest's `permissions`."},{"t":502,"title":"Blocking network requests","body":"A rule has an ID, priority, action type, and condition. The example rule blocks all navigations to webkit.org using `urlFilter: \"||webkit.org\"` and `action.type: \"block\"`."},{"t":521,"title":"Modifying network requests","body":"Rules can be defined two ways: **static rules** in the manifest (good when rules are known) and **dynamic rules** added at runtime via JavaScript. Since the sites aren't known up front, the example goes dynamic."},{"t":530,"title":"Updating dynamic rules","body":"Use `browser.declarativeNetRequest.updateDynamicRules({ addRules: [...] })` to add rules at runtime, placing this logic in rules.js inside a utilities folder."},{"t":559,"title":"Wiring up the static declarativeNetRequest rules","body":"In rules.js, a helper maps the host to a unique integer ID (`hostToRuleID`), then builds a rule with that ID, type block, and a `urlFilter` matching the host, added via `updateDynamicRules`."},{"t":580,"title":"Adding block rules dynamically","body":"In host.js's `addHost`, create the block rule when a user adds a site in full mode. After reloading in Safari and adding webkit.org, navigating there is blocked."},{"t":610,"title":"Handling adding hosts to the settings","body":"Shows the blocking effect after adding a site, but the built-in error page isn't ideal, motivating a switch to redirect rules pointing at a custom page."},{"t":648,"title":"Redirecting network requests","body":"A **redirect rule** resembles a block rule but with `action.type` of redirect and an `extensionPath` specifying the custom page (e.g. /blocked.html) the user lands on."},{"t":677,"title":"Declaring optional host permissions","body":"Blocking requests doesn't need page access, but **redirecting does**. So the manifest switches to `declarativeNetRequestWithHostAccess` and uses **optional host permissions** to request site access at runtime."},{"t":714,"title":"Declaring optional host permissions for all sites","body":"Host permissions are an array of match patterns (scheme, host, path). Since any site might be added, the example uses `*://*/*` to match all URLs. Safari's permission model centers on user privacy — the user decides which sites to grant."},{"t":792,"title":"Add the redirect rule","body":"Create the redirect rule in rules.js with type redirect and the custom page path, with the page resources in the extension folder. Now navigations are redirected rather than blocked."},{"t":822,"title":"Dynamically ask for host permissions","body":"Use `browser.permissions.request` to ask the user for access to the domain and subdomains at runtime. Adding webkit.org in Safari now prompts for access; allowing and refreshing redirects the navigation to the custom page."},{"t":880,"title":"Modify webpages","body":"To implement Light mode's 10-minute browsing with a countdown, content must be injected directly into the page — the job of **content scripts**."},{"t":895,"title":"Defining content scripts","body":"Content scripts let an extension read and modify page content. They can be declared **statically** in the manifest with files and match patterns (good for known sites); the example goes dynamic since sites aren't known up front."},{"t":913,"title":"Dynamically registering content scripts","body":"Use the registered content scripts API to register dynamically; it works like static scripts but adds an ID and persistence flag — set the flag to true so scripts survive Safari restarts."},{"t":931,"title":"Adding the scripting permission","body":"To use this API, add the **scripting** permission to the manifest and create scripting.js in utilities."},{"t":941,"title":"Registering content scripts","body":"In scripting.js, define the content script (ID, the timer's js, styling css, match patterns covering the domain and subdomains, `persistAcrossSessions: true`), then register it with `browser.scripting.registerContentScripts`."},{"t":962,"title":"Adding a host","body":"In `addHost`, register a timer content script when a user adds a site; in full mode the redirect fires before the page loads, so scripts can always be registered. In Light mode, adding webkit.org and visiting shows a 10-minute timer on the page."},{"t":1026,"title":"Web extensions storage APIs","body":"Data currently lives in memory and is lost on reload, so the extension moves to the **storage** API. Safari supports session storage (for transient data) and local storage (written to disk); the blocklist needs to persist, so local is the right call."},{"t":1041,"title":"Adding storage permission to the web extension manifest.json","body":"To use the storage API, add the **storage** permission to the manifest's `permissions`."},{"t":1050,"title":"Saving data with storage","body":"Add storage.js in utilities defining helpers to update/get hosts and save/get the block mode using `browser.storage.local.set`/`get`."},{"t":1061,"title":"Persisting hosts to storage","body":"In `addHost`, update the stored hosts list when a user adds a new site, so the blocklist always renders the full set of added sites afterward."},{"t":1071,"title":"Reading from storage","body":"In options.js at startup, read the existing hosts and block mode from storage and use them to render the blocklist."},{"t":1080,"title":"Switching block modes","body":"When switching modes, save the change to storage; if full mode, create redirect rules for all sites, otherwise remove all rules. After switching to Full, adding a site, and reloading, the changes persist."},{"t":1141,"title":"Adding a background script","body":"Registered content scripts survive Safari restarts but **not extension updates**. So a background page or service worker is needed to detect updates; the speaker prefers a background page (DOM access), specified via `background.scripts` in the manifest."},{"t":1179,"title":"Background script","body":"In background.js, register the `runtime.onInstalled` event; when an update is detected (reason update), read hosts from storage and re-register content scripts, fixing the lost-script problem after updates."},{"t":1193,"title":"Package and distribute","body":"Use **App Store Connect** to upload, submit, and manage the extension — from any browser, no Mac required. It creates the containing app for you, then the **Safari Web Extension Packager** uploads resources and packages the extension in minutes."},{"t":1353,"title":"Communicate with your app","body":"Beyond standard WebExtension APIs, the extension can reach native platform features via **native messaging**, letting the extension and its containing app work together."},{"t":1369,"title":"Package your web extension into an app for Xcode","body":"Running `xcrun safari-web-extension-packager --copy-resources` in Terminal creates and launches an Xcode project containing the app and web extension, ready to send and receive messages."},{"t":1412,"title":"Adding the nativeMessaging permission","body":"To use native messaging, add the **nativeMessaging** permission to the extension's manifest `permissions`."},{"t":1420,"title":"Sending a native message","body":"In the background page, send a message (e.g. requestBioAuth) with `browser.runtime.sendNativeMessage`; the reply indicates whether authentication succeeded."},{"t":1435,"title":"Handling native messages","body":"In the packager-generated **SafariWebExtensionHandler**, parse the message's requestBioAuth key, then request biometrics via **LocalAuthentication**'s `LAContext.evaluatePolicy(.deviceOwnerAuthenticationWithBiometrics)`."},{"t":1465,"title":"Replying to a native message","body":"After authentication, the native app replies via `reply`, returning an `NSExtensionItem` with the success result through `context.completeRequest`. In Safari, adding a site now prompts for Touch ID first, and only adds it after passing."},{"t":1564,"title":"Next steps","body":"Wraps up the full build-to-distribution journey, encouraging downloading the sample code to explore the APIs, consulting cross-browser docs on MDN, and filing feedback via Feedback Assistant or bugs.webkit.org."}],"code":[]},"related":[{"id":"101","title":"Keynote","gloss":"主題演講","gloss_en":"Keynote","category":"other","categoryLabel":"其他"},{"id":"102","title":"Platforms State of the Union","gloss":"平台現況報告","gloss_en":"Platforms State of the Union","category":"other","categoryLabel":"其他"},{"id":"111","title":"Keynote (ASL)","gloss":"主題演講(美國手語版)","gloss_en":"Keynote (American Sign Language)","category":"other","categoryLabel":"其他"},{"id":"112","title":"Platforms State of the Union (ASL)","gloss":"平台現況報告（美國手語版）","gloss_en":"Platforms State of the Union (American Sign Language)","category":"other","categoryLabel":"其他"},{"id":"122","title":"WWDC26 Platforms State of the Union Recap","gloss":"WWDC26 平台現況演講重點回顧","gloss_en":"WWDC26 Platforms State of the Union recap","category":"other","categoryLabel":"其他"}]}</script>
