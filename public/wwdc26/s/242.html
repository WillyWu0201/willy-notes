<script id="d" type="application/json">{"s":{"id":"242","title":"Build agentic app experiences with the Foundation Models framework","gloss":"用 Foundation Models 框架打造 agentic App 體驗","category":"ai","categoryLabel":"AI 與機器學習","duration":1303,"url":"https://developer.apple.com/videos/play/wwdc2026/242/","takeaway":"透過 DynamicProfile、動態指令、transcript 管理與多 agent 編排（baton-pass、phone-a-friend、skills），用 Foundation Models 打造可隨階段切換模型與行為的 agentic 體驗。","chapters":[[0,"Introduction"],[167,"The example app and agents"],[227,"Declaring a dynamic profile"],[285,"Dynamic instructions"],[304,"DynamicInstructions"],[336,"Configuring models per phase"],[401,"DynamicProfile"],[403,"Initialize your session with your dynamic profile"],[441,"Transcript management and history transforms"],[513,"Transcript management"],[530,"Custom modifiers"],[555,"Custom modifiers"],[567,"History management modifiers"],[579,"Lifecycle modifiers and session properties"],[648,"Lifecycle modifiers"],[700,"Declare a custom session property"],[744,"Read and write session properties in a profile"],[772,"Orchestration: baton-pass"],[782,"Orchestration: baton-pass"],[846,"Orchestration: phone-a-friend and skills"],[854,"Orchestration: phone-a-friend"],[915,"The skills pattern"],[918,"Tool calling mode"],[931,"Tool calling mode"],[1007,"Escaping a tool call loop"],[1017,"Define a tool that throws an error"],[1032,"Transcript error handling"],[1048,"Set the transcript error handling policy"],[1071,"Transcript mutation"],[1107,"Performance, accuracy, and evaluations"],[1284,"Next steps"]],"points":[{"text":"新的 **DynamicProfile** 與 **DynamicInstructions** 能依 App 階段動態切換**指令、模型（on-device 或 PCC）、溫度與推理層級**。","hot":true},{"text":"提供 **historyTransform**、rollingWindow、lifecycle modifiers 與 **@SessionProperty** 來管理 transcript 歷史與自訂工作階段狀態。","hot":false},{"text":"多 agent 編排模式：**baton-pass**（交棒切換模式）、**phone-a-friend**（委派子 session）與 **Skills**（依需求注入知識）。","hot":false},{"text":"可用 **toolCallingMode**（.required/.disallowed）控制工具呼叫並跳出迴圈，並以 **transcriptErrorHandlingPolicy** 決定錯誤後保留或還原 transcript。","hot":false},{"text":"最後涵蓋 **效能、準確度與評估**（evaluations），協助衡量 agentic 流程的品質。","hot":false}],"apis":["FoundationModels","LanguageModelSession","DynamicProfile","DynamicInstructions","SessionProperty","ToolCallingMode","Tool","GenerationOptions","PrivateCloudComputeLanguageModel","historyTransform","transcriptErrorHandlingPolicy"],"audience":"**已熟悉 Foundation Models 基礎、想進一步打造多階段 agentic 流程**的進階 AI 功能開發者。","gloss_en":"Build agentic app experiences with Foundation Models","takeaway_en":"Use DynamicProfile, dynamic instructions, transcript management, and multi-agent orchestration (baton-pass, phone-a-friend, skills) to build agentic experiences with Foundation Models that switch models and behavior by stage.","points_en":[{"text":"The new **DynamicProfile** and **DynamicInstructions** let you dynamically switch **instructions, model (on-device or PCC), temperature, and reasoning level** based on your app's stage.","hot":true},{"text":"Provides **historyTransform**, rollingWindow, lifecycle modifiers, and **@SessionProperty** to manage transcript history and customize session state.","hot":false},{"text":"Multi-agent orchestration patterns: **baton-pass** (handing off between modes), **phone-a-friend** (delegating to a sub-session), and **Skills** (injecting knowledge on demand).","hot":false},{"text":"Use **toolCallingMode** (.required/.disallowed) to control tool calls and break out of loops, and **transcriptErrorHandlingPolicy** to decide whether to keep or restore the transcript after an error.","hot":false},{"text":"Finally covers **performance, accuracy, and evaluations** to help you measure the quality of your agentic flows.","hot":false}],"audience_en":"Advanced AI feature developers who **already know the Foundation Models basics and want to build multi-stage agentic flows**.","summary":["本場介紹 **Foundation Models framework** 的新一組 API——**Dynamic profiles**，用來解決 agentic 體驗的兩大難題：在長時間 session 中做 **context management**（修剪或摘要 transcript 以守住模型的 context window），以及在多模型間建立**邊界**（依能力與成本選用最適模型）。Apple 把這些設計成低階且彈性的 primitive，並同步推出開源 Swift 套件 **Foundation Models framework utilities**，內含建構 agentic 體驗的可重用元件，會在 OS 版本之間持續更新。","**`DynamicProfile`** 讓你在同一個 `LanguageModelSession` 內切換模型。每個 **Profile** 代表一種設定狀態或 agent，由 instructions、tools 與 modifiers（控制 model、temperature、samplingMode、reasoningLevel 等）組成。範例 Origami 手作 app 依 brainstorm／planning／reviewing 三個階段，分別搭配 **PrivateCloudComputeLanguageModel**（需廣博知識與創意，溫度設 1、reasoning 設 deep）與 **SystemLanguageModel**（省下伺服器呼叫）。可重用的指令與工具用 **`DynamicInstructions`** 打包並可組合巢狀；由於 profile 的 body 每次 prompt 都會重新求值，切換 mode 就像「換帽子」般切換 agent。","切換模型也意味著要管理 **transcript**：可用 **`historyTransform`**（prompt 前對 history 做局部、不永久變更的轉換，例如丟掉 tool call 以省 context）或內建的 **history** session property（會跨所有 profile 生效、且有損）來修剪、聚焦或在轉到較不私密模型時 redact PII。**Lifecycle modifiers**（如 `onResponse`）讓你在 session 各時點插入命令式程式，搭配自訂的 **session properties**（用 `@SessionPropertyEntry` 宣告、跨工具與 profile 共享）可在每次回應後摘要並保存。","orchestration 介紹兩種模式：**baton-pass**（協作——多個 profile 共享完整 transcript，靠工具切換 active 變數來交棒，接棒者產出最終回答）與 **phone-a-friend**（諮詢——工具 spawn 一個 transcript 獨立的短命子 session，回傳結果後消失，由父 profile 給最終答案）；utilities 套件另提供 Skills 型別。新增的 **Tool calling mode**（allowed／disallowed／required）讓你控制何時呼叫工具；用 required 時要自備跳出條件（用變數條件化，或讓 final-answer tool 丟錯中止迴圈）。丟錯或取消預設會 **revertTranscript**，新的 **`transcriptErrorHandlingPolicy`** 可改為 **preserveTranscript** 並手動修整可變的 transcript。最後提醒：改寫 history 會使 **KV cache** 失效進而增加延遲，也可能讓模型混淆而影響準確度，務必用 Foundation Models Instrument 量測、並用 **Evaluations framework** 以資料驅動驗證。"],"deepdive":[{"t":0,"title":"Introduction","body":"Erik 與 Oliver 開場，點出 **Dynamic profiles** 要解的兩個問題：長 session 的 **context management**（修剪或摘要 transcript 守住 context window），以及用多模型時依**能力與成本**建立邊界。強調這領域週週在變，故把 API 設計成彈性 primitive，並宣布開源 Swift 套件 **Foundation Models framework utilities**，收納新興或實驗性的 agentic 模式、在 OS 版本間更新。"},{"t":167,"title":"The example app and agents","body":"以手作 app **Origami** 為貫穿範例：可做摺紙與鉤針教學，使用者上傳照片發想點子、回饋後生成教學、過程中再上傳進度照取得技巧建議。各階段共享 context 但優先順序不同，可受益於不同模型、指令與設定——這些設定就是 **agents**，代表 app 行事、各有目標與能力。"},{"t":227,"title":"Declaring a dynamic profile","body":"**`DynamicProfile`** 讓你在 `LanguageModelSession` 內宣告多個 **Profile**（各代表一種設定狀態或 agent），由 instructions、tools 與 modifiers 組成。先聚焦 brainstorming 階段：給它說明目標的指令與一個產生標題的工具，並在使用者做摺紙時額外加入相關指令與工具。"},{"t":285,"title":"Dynamic instructions","body":"引入 **`DynamicInstructions`**：把相關的 tools 與 instructions 打包成可在程式各處重用的單一元件（如 `OrigamiExpert` 收納摺紙知識與工具），且可組合——巢狀於另一個 DynamicInstructions 的 body 內會把指令與工具串接起來。"},{"t":304,"title":"DynamicInstructions","body":"示範以 `DynamicInstructions` 建立 `BrainstormFacilitator` 來承載 profile 的指令，藉此把 brainstorming profile 的宣告整理乾淨。"},{"t":336,"title":"Configuring models per phase","body":"說明各階段可配不同模型：brainstorming 需廣博手作知識與創意，故用 **PrivateCloudComputeLanguageModel** 並把 temperature 設為 1 以鼓勵更有創意的回應。"},{"t":401,"title":"DynamicProfile","body":"把三個階段補齊：planning 同樣用 PCC 並把 **reasoningLevel** 設為 deep（生成教學較複雜）；reviewing 改用 **SystemLanguageModel** 以省下不必要的伺服器呼叫。至此完成整個手作 DynamicProfile 的宣告。"},{"t":403,"title":"Initialize your session with your dynamic profile","body":"用新的 `LanguageModelSession` initializer 帶入 DynamicProfile 即可。重點：profile 的 body 每次 prompt 都會重新求值，所以隨 app 在各 mode 間移動，session 的人格也隨之改變——像換帽子或切換 agent，可在 brainstorming／planning／reviewing 間流轉。"},{"t":441,"title":"Transcript management and history transforms","body":"切換模型時各模型 context 上限不同，可能需修剪多餘 entry 以守住上限；此外移除不相關 entry 可提升模型專注，轉到較不私密的模型時也可 redact 私密資訊。transcript 是 session 對模型 context 的表示，DynamicInstructions 可改 instructions entry，其餘 entry 則透過名為 history 的視窗處理（如丟掉 tool call 即為簡單的修剪法）。"},{"t":513,"title":"Transcript management","body":"示範 **`historyTransform`**：可套在 profile 上、在 prompt 模型前轉換 history，正是過濾非必要 entry 的時機（範例套在 reviewing profile 上以守住 on-device 模型的 context 上限）。重點：transform 不會永久變更 session transcript，只是 prompt 前的局部轉換，故不怕弄丟日後可能有用的 context。"},{"t":530,"title":"Custom modifiers","body":"因 historyTransform 內容繁雜，可用 custom modifier 把複雜度藏起來：宣告一個符合 `DynamicProfileModifier` 的新型別並套用該 historyTransform。"},{"t":555,"title":"Custom modifiers","body":"再以 `DynamicProfile` 的 extension 把此 modifier 開放重用，任何想減少 context 的新 Profile 都能套用。並指出 utilities 套件已內建多個好用 modifier，值得參考。"},{"t":567,"title":"History management modifiers","body":"除了 transform，還有更具狀態的作法：在 session 某些時點需摘要較早的 entry 以回收 context，於每次模型回應後做能形成清楚的生命週期邊界。引出用一組新 modifier 在每次回應後執行摘要操作。"},{"t":579,"title":"Lifecycle modifiers and session properties","body":"**Lifecycle modifiers** 讓你在 profile 宣告中直接跑命令式程式、取得 profile 進度，可用於更新 session 外部狀態（如 UI 反映進度）或內部狀態（如切換 craft profile 的 mode、改 history）。並預告搭配 session properties 一起用。"},{"t":648,"title":"Lifecycle modifiers","body":"用 `onResponse` modifier 在回應邊界改寫 history（前述的摘要時機）；同時帶出另一概念 session properties——此處用到框架內建的 history property。"},{"t":700,"title":"Declare a custom session property","body":"**Session properties** 讓你定義可被任何 Tool 或 Profile 存取的狀態。history 是框架內建的 property（會擷取 session history、可作為 historyTransform 的替代），但它有損且變更會跨所有 profile 生效；要做無損且針對特定 profile 的轉換則應用 historyTransform。亦可用 `@SessionPropertyEntry` 巨集在 `SessionPropertyValues` 的 extension 內宣告自訂 property（皆可變、需有初始值）。"},{"t":744,"title":"Read and write session properties in a profile","body":"示範用自訂的 summary property 在 `onResponse` 時儲存對話摘要：各 Profile 可讀取其值並把摘要放進指令，讓模型掌握被丟掉的 entry 之 context；任何 profile 都能寫入、且變更跨整個 session 可見。小結：用 lifecycle modifier 在特定時點跑程式、用 history property 為所有 profile 更新 history、用自訂 session property 儲存共享狀態。"},{"t":772,"title":"Orchestration: baton-pass","body":"Erik 接手講 orchestration 的兩種模式。**baton-pass** 是協作：有兩個以上各用不同模型的 profile、一個控制 active profile 的變數，並給每個 profile 一個能設定該變數的工具，三者組成此模式。"},{"t":782,"title":"Orchestration: baton-pass","body":"舉例：在 brainstorming 時問「怎麼摺紙鶴」，brainstorm profile 會呼叫工具把棒子交給 tutorial profile，tool output 表示交接成功，由 tutorial profile 完成最終回答。關鍵屬性：完整 transcript history 對兩個 profile 皆可見，且接棒者能一路把答案送到終點。"},{"t":846,"title":"Orchestration: phone-a-friend and skills","body":"**phone-a-friend** 是諮詢，同樣靠 tool calling，關鍵差異是工具不切換變數，而是 spawn 一個短命 session。"},{"t":854,"title":"Orchestration: phone-a-friend","body":"舉例：問「適合小孩的有趣專案」時，模型可能判斷需要一個標題、呼叫 phone-a-friend 工具去諮詢 title profile——該工具 spawn 一個 transcript 獨立的新 session、prompt 它、把回應當 tool output 送回，子 session 隨即消失，由父 session 給最終回答。關鍵屬性：各 profile 的 transcript 彼此隔離，且父 profile 永遠負責最終答案。"},{"t":915,"title":"The skills pattern","body":"指出 baton-pass 與 phone-a-friend 外還有其他選項，例如 utilities 套件提供的 **Skills** 型別，是 procedural context loading 的常見模式。"},{"t":918,"title":"Tool calling mode","body":"介紹新的 **Tool calling mode** 來控制工具呼叫時機，有三個選項：allowed、disallowed、required。"},{"t":931,"title":"Tool calling mode","body":"逐一說明：預設 **allowed**（既有行為，模型可呼叫工具也可直接回應，最常見）；**disallowed** 禁止呼叫工具（如使用者進入工具明顯無關的畫面時）；**required** 只能呼叫工具（適合把所有動作都表示成 tool call 的 agentic 系統）。用 profile 時以 modifier 指定，否則可在 `respond(to:)` 的 GenerationOptions 設定。"},{"t":1007,"title":"Escaping a tool call loop","body":"強調 required 時模型形同處於 while loop，**必須自備跳出條件**。一種作法是用變數條件化 tool call mode（例如要求呼叫工具直到模型呼叫 database 工具為止）。"},{"t":1017,"title":"Define a tool that throws an error","body":"更強硬的第二種作法：給模型一個會丟錯的 final-answer 工具，丟錯會中止 tool calling 迴圈並立即把控制權交還給你。"},{"t":1032,"title":"Transcript error handling","body":"預設情況下，工具丟錯或取消回應時 session transcript 會回滾到先前狀態。但若進階情境想允許中途取消後再續跑，就需在錯誤後保留 transcript，框架為此新增了相關 API。"},{"t":1048,"title":"Set the transcript error handling policy","body":"用 profile 時以 modifier 設定 **`transcriptErrorHandlingPolicy`**，否則直接設在 session 上。兩個選項：`.revertTranscript` 與 `.preserveTranscript`；用 preserve 時若要續用 session，得自行把 transcript 還原到良好狀態。"},{"t":1071,"title":"Transcript mutation","body":"為配合上述，session 的 **transcript property 現在可變**。但只能在 session 的 `isResponding` 為 false 時修改——在回應期間嘗試變更 transcript 屬程式設計錯誤。"},{"t":1107,"title":"Performance, accuracy, and evaluations","body":"談變更 transcript 對效能與準確度的影響。**KV cache** 是重要最佳化，會被 transcript 變更失效：一般 append 可保留 cache、降低 time-to-first-token，但改寫 history（移除 entry、改工具、改 instructions）通常觸發 cache 失效、增加延遲，唯一確定方式是用升級版 **Foundation Models Instrument** 量測。準確度上，改寫 history 可能讓模型混淆（如先前未用工具就產生標題，之後加了工具仍可能依樣行事），故進入細緻的 transcript 修改時更應用 **Evaluations framework** 建立 eval set 量化效果，做資料驅動的最佳化。"},{"t":1284,"title":"Next steps","body":"收尾回顧：dynamic profiles 可操控模型行為與管理 transcript，並走過 phone-a-friend、baton-pass、tool calling mode、手動 transcript 管理與 KV cache。鼓勵試玩 sample app、在 revamped Xcode instrument 中測試 PCC，並擁抱 Foundation Models framework utilities。"}],"summary_en":["This session introduces a new set of **Foundation Models framework** APIs—**Dynamic profiles**—that solve two problems for agentic experiences: **context management** in long-running sessions (trimming or summarizing the transcript to stay within the model's context window) and establishing **boundaries** across multiple models (choosing the best one by capability and cost). Apple designs these as low-level, flexible primitives and ships an open-source Swift package, **Foundation Models framework utilities**, with reusable components for building agentic experiences, updated between OS releases.","**`DynamicProfile`** lets you switch models within a single `LanguageModelSession`. Each **Profile** represents a configuration state or agent, made up of instructions, tools, and modifiers (controlling model, temperature, samplingMode, reasoningLevel, and more). The Origami craft example uses three phases—brainstorm/planning/reviewing—pairing **PrivateCloudComputeLanguageModel** (broad knowledge and creativity, temperature 1, reasoning deep) with **SystemLanguageModel** (to save server calls). Reusable instructions and tools are packaged with **`DynamicInstructions`**, which is composable and nestable; since a profile's body is re-evaluated on every prompt, switching mode swaps the session's persona like changing hats.","Switching models means managing the **transcript**: use **`historyTransform`** (a local, non-permanent transformation applied before prompting—e.g., dropping tool calls to save context) or the built-in **history** session property (lossy and applied across all profiles) to trim, focus, or redact PII when moving to a less private model. **Lifecycle modifiers** (like `onResponse`) let you run imperative code at points in the session, and combined with custom **session properties** (declared with `@SessionPropertyEntry`, shared across tools and profiles) you can summarize and persist state after each response.","Orchestration covers two patterns: **baton-pass** (collaboration—multiple profiles share the full transcript and hand off by toggling an active variable, with the receiver producing the final answer) and **phone-a-friend** (consultation—a tool spawns a short-lived child session with an isolated transcript, returns its result, then disappears, with the parent giving the final answer); the utilities package also offers a Skills type. The new **Tool calling mode** (allowed/disallowed/required) controls when tools run; with required you must provide an exit condition (conditionalize on a variable, or give a final-answer tool that throws to abort the loop). Throwing or cancelling defaults to **revertTranscript**, but the new **`transcriptErrorHandlingPolicy`** can switch to **preserveTranscript** with manual cleanup of the now-mutable transcript. The talk closes by warning that rewriting history invalidates the **KV cache** (raising latency) and can confuse the model (hurting accuracy), so measure with the Foundation Models Instrument and validate data-driven with the **Evaluations framework**."],"deepdive_en":[{"t":0,"title":"Introduction","body":"Erik and Oliver open by framing the two problems **Dynamic profiles** solve: **context management** in long sessions (trimming or summarizing the transcript to fit the context window) and establishing boundaries by **capability and cost** when using multiple models. Noting the field changes week to week, they designed the APIs as flexible primitives and announce the open-source Swift package **Foundation Models framework utilities** for emerging, experimental agentic patterns, updated between OS releases."},{"t":167,"title":"The example app and agents","body":"The running example is the craft app **Origami**, which makes origami and crochet tutorials: users upload photos to brainstorm ideas, give feedback, get a generated tutorial, and upload progress photos for technique advice. Each stage shares context but has different priorities, benefiting from different models, instructions, and options—these configurations are **agents** that act on the app's behalf with a particular goal and capabilities."},{"t":227,"title":"Declaring a dynamic profile","body":"**`DynamicProfile`** lets you declare multiple **Profiles** (each a configuration state or agent) in a `LanguageModelSession`, made of instructions, tools, and modifiers. Focusing on the brainstorming phase: it gets instructions explaining its goal and a tool to generate titles, plus extra origami-specific instructions and tools when the user works on an origami project."},{"t":285,"title":"Dynamic instructions","body":"Introduces **`DynamicInstructions`**: it packages related tools and instructions into a single reusable component (e.g., `OrigamiExpert` holding origami knowledge and tools), and it's composable—nesting it inside another DynamicInstructions body concatenates the instructions and tools."},{"t":304,"title":"DynamicInstructions","body":"Shows building `BrainstormFacilitator` with `DynamicInstructions` to hold the profile's instructions, cleaning up the brainstorming profile declaration."},{"t":336,"title":"Configuring models per phase","body":"Explains configuring different models per phase: brainstorming needs broad craft knowledge and creativity, so it uses **PrivateCloudComputeLanguageModel** with temperature set to 1 to encourage more creative responses."},{"t":401,"title":"DynamicProfile","body":"Completes the three phases: planning also uses PCC with **reasoningLevel** set to deep (generating a tutorial is complex), while reviewing switches to **SystemLanguageModel** to save unnecessary server calls—finishing the full craft DynamicProfile declaration."},{"t":403,"title":"Initialize your session with your dynamic profile","body":"Use the new `LanguageModelSession` initializer with the DynamicProfile. Key point: the profile's body is re-evaluated on every prompt, so as the app moves between modes the session's persona changes—like swapping hats or switching agents—flowing from brainstorming to planning to reviewing."},{"t":441,"title":"Transcript management and history transforms","body":"Switching models means different context limits, possibly needing to trim entries to stay within them; removing irrelevant entries also improves focus, and you can redact private info when moving to a less private model. The transcript is the session's representation of the model's context—DynamicInstructions can change the instructions entry, while the rest is handled via a window called history (dropping tool calls being one easy trim)."},{"t":513,"title":"Transcript management","body":"Demonstrates **`historyTransform`**: applied to a profile to transform history before prompting, the right time to filter unnecessary entries (the example applies it to the reviewing profile to fit the on-device model's context). Crucially, transforms don't permanently mutate the session transcript—they're local, pre-prompt transformations—so you don't lose context that may matter later."},{"t":530,"title":"Custom modifiers","body":"Since a historyTransform can get complex, custom modifiers hide that complexity: declare a new type conforming to `DynamicProfileModifier` and apply the historyTransform."},{"t":555,"title":"Custom modifiers","body":"Expose the modifier for reuse via an extension on `DynamicProfile` so any new Profile that wants to reduce context can use it. Notes the utilities package already includes several useful modifiers worth reviewing."},{"t":567,"title":"History management modifiers","body":"Beyond transforms, a more stateful approach: at certain points you summarize earlier entries to reclaim context, and doing it after each response creates a clear lifecycle boundary—leading to a new set of modifiers that run summarization after each response."},{"t":579,"title":"Lifecycle modifiers and session properties","body":"**Lifecycle modifiers** let you run imperative code directly in a profile declaration with access to the profile's progress—useful for updating state external to the session (reflecting progress in UI) or internal state (changing the craft profile's mode, modifying history). Previews using them with session properties."},{"t":648,"title":"Lifecycle modifiers","body":"Uses the `onResponse` modifier to mutate history at the response boundary (the earlier summarization moment), while introducing session properties—here the framework's built-in history property."},{"t":700,"title":"Declare a custom session property","body":"**Session properties** define state accessible from any Tool or Profile. history is a built-in property (capturing session history, an alternative to historyTransform), but it's lossy and its changes apply across all profiles; for lossless, profile-targeted transformations prefer historyTransform. You can also declare custom properties with the `@SessionPropertyEntry` macro in an extension on `SessionPropertyValues` (all mutable, all needing an initial value)."},{"t":744,"title":"Read and write session properties in a profile","body":"Demonstrates storing a conversation summary in a custom summary property on `onResponse`: each Profile can read it and include the summary in its instructions so it has context on dropped entries; any profile can write, and changes are visible across the session. Recap: use lifecycle modifiers to run code at specific points, the history property to update history for all profiles, and custom session properties to store shared state."},{"t":772,"title":"Orchestration: baton-pass","body":"Erik takes over orchestration with two patterns. **baton-pass** is collaboration: two or more profiles each using different models, a variable controlling which profile is active, and a tool on each profile to set that variable—together making up the pattern."},{"t":782,"title":"Orchestration: baton-pass","body":"Example: while brainstorming, asking how to fold a crane has the brainstorm profile call a tool to pass the baton to the tutorial profile; tool output signals a successful handoff, and the tutorial profile produces the final answer. Key attributes: the full transcript history is visible to both profiles, and the receiver can carry it across the finish line."},{"t":846,"title":"Orchestration: phone-a-friend and skills","body":"**phone-a-friend** is consultation, also relying on tool calling, but the key difference is the tool doesn't toggle a variable—it spawns a short-lived session."},{"t":854,"title":"Orchestration: phone-a-friend","body":"Example: asked for a fun kids' project, the model may reason it needs a title and call its phone-a-friend tool to consult the title profile—the tool spawns a new session with an independent transcript, prompts it, returns the response as tool output, and the child session disappears, with the parent giving the final answer. Key attributes: each profile's transcript is isolated, and the parent is always responsible for the final answer."},{"t":915,"title":"The skills pattern","body":"Notes that beyond baton-pass and phone-a-friend there are other options, such as the utilities package's **Skills** type, a popular pattern for procedural context loading."},{"t":918,"title":"Tool calling mode","body":"Introduces the new **Tool calling mode** to control when tool calls happen, with three options: allowed, disallowed, and required."},{"t":931,"title":"Tool calling mode","body":"Explains each: default **allowed** (existing behavior—the model may call a tool or respond directly, the most common case); **disallowed** prevents tool calls (e.g., when the user is in a part of the app where tools are irrelevant); **required** means only tool calls (good for agentic systems representing all actions as tool calls). With profiles, set it via a modifier; otherwise via GenerationOptions on `respond(to:)`."},{"t":1007,"title":"Escaping a tool call loop","body":"Stresses that with required, the model is essentially in a while loop and you **must provide an exit condition**. One option is conditionalizing the tool call mode on a variable (e.g., requiring tool calls until the model calls the database tool)."},{"t":1017,"title":"Define a tool that throws an error","body":"A more forceful second option: equip the model with a final-answer tool that throws an error—throwing aborts the tool-calling loop and immediately returns control to you."},{"t":1032,"title":"Transcript error handling","body":"By default, when a tool throws or a response is cancelled, the session transcript rolls back to its previous state. But for advanced cases where you want to cancel partway and then resume, you need to keep the transcript after an error, and the framework adds new API for this."},{"t":1048,"title":"Set the transcript error handling policy","body":"With profiles, set **`transcriptErrorHandlingPolicy`** via a modifier, otherwise directly on the session. The two options are `.revertTranscript` and `.preserveTranscript`; with preserve, it's on you to put the transcript back into a good state if you intend to keep using the session."},{"t":1071,"title":"Transcript mutation","body":"To support this, the session's **transcript property is now mutable**—but you can only modify it when the session's `isResponding` is false; mutating during a response is a programmer error."},{"t":1107,"title":"Performance, accuracy, and evaluations","body":"Discusses the performance and accuracy impact of mutating the transcript. The **KV cache** is a key optimization invalidated by transcript mutations: appending generally preserves it and minimizes time-to-first-token, but rewriting history (removing entries, changing tools, updating instructions) typically triggers invalidation and raises latency—the only way to be sure is measuring with the upgraded **Foundation Models Instrument**. For accuracy, rewriting history can confuse the model (e.g., having generated titles without a tool, it may keep doing so after a tool is added), so for nuanced modifications use the **Evaluations framework** to build eval sets and quantify effects for data-driven optimization."},{"t":1284,"title":"Next steps","body":"Wrap-up: dynamic profiles steer model behavior and manage the transcript, having covered phone-a-friend, baton-pass, tool calling mode, manual transcript management, and KV caches. They encourage trying the sample app, testing PCC in the revamped Xcode instrument, and embracing Foundation Models framework utilities."}],"code":["// DynamicInstructions\n  \n  struct BrainstormFacilitator: DynamicInstructions {\n      var orchestrator: CraftOrchestrator\n      var body: some DynamicInstructions {\n          Instructions {\n              \"You are a warm and friendly expert crafting brainstorm facilitator.\"\n          }\n          // Tools\n          GenerateProjectTitle()\n          // Conditionally include Origami knowledge\n          if orchestrator.techniques.contains(.origami) {\n              OrigamiExpert()\n          }\n      }\n  }","// DynamicProfile\n\n  struct CraftProfile: LanguageModelSession.DynamicProfile {\n      var orchestrator: CraftOrchestrator\n      var body: some DynamicProfile {\n          switch orchestrator.mode {\n          case .brainstorming:\n              Profile { BrainstormFacilitator(orchestrator: orchestrator) }\n                  .model(orchestrator.pccLanguageModel)\n                  .temperature(1)\n          case .planning:\n              Profile { TutorialAuthor(orchestrator: orchestrator) }\n                  .model(orchestrator.pccLanguageModel)\n                  .reasoningLevel(.deep)\n          case .reviewing:\n              Profile { CraftCoach() }\n                  .model(orchestrator.systemLanguageModel)\n          }\n      }\n  }","// Initialize your session with your dynamic profile\n  let session = LanguageModelSession(profile: CraftProfile(orchestrator: orchestrator))","// Transcript management\n  \n  struct CraftProfile: LanguageModelSession.DynamicProfile {\n      var orchestrator: CraftOrchestrator\n      var body: some DynamicProfile {\n          switch orchestrator.mode {\n          case .reviewing:\n              Profile { CraftCoach() }\n                  .model(orchestrator.systemLanguageModel)\n                  .historyTransform { history in\n                      // Update the history for your profile\n                      guard let latestResponseIndex = lastResponseEntryIndex(history) else {\n                          return history\n                      }\n                      let filteredHistory = history[0..\u003clatestResponseIndex].filter { entry in\n                          isToolCallsOrToolOutput(entry)\n                      }\n                      return filteredHistory + history[latestResponseIndex...]\n                  }\n          }\n      }\n  }","// Custom modifiers\n  \n  struct DroppingToolCallsProfileModifier: LanguageModelSession.DynamicProfileModifier {\n      func body(content: Content) -> some DynamicProfile {\n          content\n              .historyTransform { history in\n                  guard let latestResponseIndex = lastResponseEntryIndex(history) else {\n                      return history\n                  }\n                  let filteredHistory = history[0..\u003clatestResponseIndex].filter { entry in\n                      isToolCallsOrToolOutput(entry)\n                  }\n                  return filteredHistory + history[latestResponseIndex...]\n              }\n      }\n  }\n\n  extension LanguageModelSession.DynamicProfile {\n      func droppingCompletedToolCalls() -> some DynamicProfile {\n          self.modifier(DroppingToolCallsProfileModifier())\n      }\n  }","// History management modifiers\n\n  import FoundationModelsUtilities\n\n  struct CraftProfile: LanguageModelSession.DynamicProfile {\n      var orchestrator: CraftOrchestrator\n      var body: some DynamicProfile {\n          switch orchestrator.mode {\n          case .reviewing:\n              Profile { CraftCoach() }\n                  // Keep the most recent 10 entries\n                  // after dropping finished tool calls\n                  .rollingWindow(size: .entries(10))\n                  .droppingCompletedToolCalls()\n          }\n      }\n  }","// Lifecycle modifiers\n  \n  struct CraftProfile: LanguageModelSession.DynamicProfile {\n      @SessionProperty(\\.history) var history\n      var orchestrator: CraftOrchestrator\n      var body: some DynamicProfile {\n          switch orchestrator.mode {\n          case .planning:\n              Profile { TutorialAuthor(orchestrator: orchestrator) }\n                  .model(orchestrator.pccLanguageModel)\n                  .reasoningLevel(.deep)\n                  .onResponse {\n                      // Update history\n                      if history.count > 50, let responseIndex = lastResponseIndex(history) {\n                          history = history[responseIndex...]\n                      }\n                  }\n          }\n      }\n  }","// Session properties — declaration\n\n  extension SessionPropertyValues {\n      @SessionPropertyEntry var summary: String?\n  }","// Session properties\n  \n  struct CraftProfile: LanguageModelSession.DynamicProfile {\n      @SessionProperty(\\.history) var history\n      @SessionProperty(\\.summary) var summary\n      var orchestrator: CraftOrchestrator\n      var body: some DynamicProfile {\n          switch orchestrator.mode {\n          case .planning:\n              Profile {\n                  TutorialAuthor(orchestrator: orchestrator)\n                  if let summary {\n                      Instructions { \"Summary: \\(summary)\" }\n                  }\n              }\n              .onResponse {\n                  if history.count > 50, let responseIndex = lastResponse(history.prefix(40)) {\n                      summary = try await summarize(history[0..\u003cresponseIndex])\n                      history = history[responseIndex...]\n                  }\n              }\n          }\n      }\n  }","// Baton-pass\n  \n  struct CraftProfile: LanguageModelSession.DynamicProfile {\n      var orchestrator: CraftOrchestrator\n      var body: some DynamicProfile {\n          switch orchestrator.mode {\n          case .brainstorm:\n              Profile {\n                  BrainstormInstructions()\n                  BatonPassTool()\n              }\n              .onToolCall { orchestrator.mode = .tutorial }\n              .model(orchestrator.serverModel)\n          case .tutorial:\n              Profile {\n                  TutorialInstructions()\n                  BatonPassTool()\n              }\n              .onToolCall { orchestrator.mode = .brainstorm }\n              .model(orchestrator.systemModel)\n          }\n      }\n  }","// Phone-a-friend\n\n  struct CraftProfile: LanguageModelSession.DynamicProfile {\n      var body: some DynamicProfile {\n          Profile {\n              BrainstormInstructions()\n              PhoneFriendTool(\n                  name: \"generate_title\",\n                  description: \"Generate a creative project title\",\n                  profile: TitleProfile()\n              )\n          }\n      }\n  }\n\n  struct PhoneFriendTool\u003cP: LanguageModelSession.DynamicProfile>: Tool {\n      func call(arguments: GeneratedContent) async throws -> String {\n          let session = LanguageModelSession(profile: profile())\n          let response = try await session.respond(to: arguments)\n          return response.content\n      }\n  }","// The skills pattern\n  \n  struct CraftingSkills: LanguageModelSession.DynamicInstructions {\n      var activations: SkillActivations\n      var body: some DynamicInstructions {\n          Skills(activations: activations) {\n              Skill(\n                  name: \"origami_folds\",\n                  description: \"Details about specific types of folds\",\n                  prompt: \"\"\"\n                      Valley Fold: Paper is folded toward you, creating a V-shaped crease\n                      Mountain Fold: Paper is folded away from you, creating an inverted V\n                      ...\n                      \"\"\"\n              )\n              Skill(...)\n              Skill(...)\n          }\n      }\n  }"]},"related":[{"id":"241","title":"What’s new in the Foundation Models framework","gloss":"Foundation Models 框架的新功能","gloss_en":"What's new in the Foundation Models framework","category":"ai","categoryLabel":"AI 與機器學習"},{"id":"347","title":"Secure your app: mitigate risks to agentic features","gloss":"保護你的 App：降低 agentic 功能的風險","gloss_en":"Secure your app: mitigate risks to agentic features","category":"ai","categoryLabel":"AI 與機器學習"},{"id":"319","title":"Build with the new Apple Foundation Model on Private Cloud Compute","gloss":"在 Private Cloud Compute 上使用全新 Apple Foundation Model 開發","gloss_en":"Build with the new Apple Foundation Model on Private Cloud Compute","category":"ai","categoryLabel":"AI 與機器學習"},{"id":"237","title":"What’s new in image understanding","gloss":"影像理解的新功能","gloss_en":"What's new in image understanding","category":"ai","categoryLabel":"AI 與機器學習"},{"id":"246","title":"LLM search using Core Spotlight","gloss":"使用 Core Spotlight 的 LLM 搜尋","gloss_en":"LLM search using Core Spotlight","category":"ai","categoryLabel":"AI 與機器學習"}]}</script>
