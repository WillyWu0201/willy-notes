<script id="d" type="application/json">{"s":{"id":"232","title":"Run local agentic AI on the Mac using MLX","gloss":"用 MLX 在 Mac 上執行本機 agentic AI","category":"ai","categoryLabel":"AI 與機器學習","duration":817,"url":"https://developer.apple.com/videos/play/wwdc2026/232/","takeaway":"在 Mac 上以 MLX-LM 啟動本機 OpenAI 相容伺服器，讓 AI agent 兼顧隱私、低延遲與離線運作，並可透過分散式推論擴展更大模型。","chapters":[[0,"Introduction"],[32,"The chat and agentic loop"],[162,"Local agentic AI stack"],[276,"Setting up your own agent"],[280,"Set up MLX-LM and start the local server"],[318,"Configure an agent to use your local MLX server"],[339,"Making agents fast"],[413,"Concurrency and distributed inference"],[513,"Launch distributed inference with MLX"],[560,"More examples"],[781,"Next steps"]],"points":[{"text":"在本機執行 AI agent，兼顧**隱私、低延遲與離線存取**，由 MLX 進展與 Mac 硬體共同支撐。","hot":false},{"text":"用 **mlx_lm.server** 啟動本機伺服器，提供與 **OpenAI 相容**的 `/v1/chat/completions` 端點。","hot":true},{"text":"把 agent（例如 **opencode**）的 baseURL 指向 `http://127.0.0.1:8080/v1` 即可改用本機模型。","hot":false},{"text":"說明如何**讓 agent 變快**，並透過並行處理提升吞吐。","hot":false},{"text":"以 **mlx.launch** 搭配 hostfile 與 jaccl backend 進行**分散式推論**，跑更大的模型。","hot":false}],"apis":["MLX","mlx-lm","mlx_lm.server","mlx.launch"],"audience":"**想在 Mac 上自建本機 LLM／agent 服務的開發者與 ML 工程師**，重視隱私與離線運作的人。","gloss_en":"Run local agentic AI on the Mac using MLX","takeaway_en":"Launch a local OpenAI-compatible server with MLX-LM on the Mac so AI agents get privacy, low latency, and offline operation, and scale to larger models with distributed inference.","points_en":[{"text":"Run AI agents locally with **privacy, low latency, and offline access**, backed by MLX advances and Mac hardware.","hot":false},{"text":"Use **mlx_lm.server** to launch a local server that exposes an **OpenAI-compatible** `/v1/chat/completions` endpoint.","hot":true},{"text":"Point an agent's (for example, **opencode**) baseURL at `http://127.0.0.1:8080/v1` to switch to the local model.","hot":false},{"text":"Explains how to **make your agent faster** and increase throughput through concurrency.","hot":false},{"text":"Run **distributed inference** with **mlx.launch** plus a hostfile and the jaccl backend to run larger models.","hot":false}],"audience_en":"**Developers and ML engineers who want to self-host a local LLM/agent service on the Mac** and care about privacy and offline operation.","summary":["這場由 MLX 團隊主講，示範如何**完全在 Mac 本機上**跑起 agentic AI 工作流程——不靠雲端、不需 API key，資料全程留在自己的機器上。講者先區分傳統 chat 與 **agentic loop** 的差別：chat 是你發 prompt、模型回應，後續動作得自己來；agent 則由它自行與模型對話決定要做什麼，再呼叫工具（執行指令、讀檔、打 API），觀察結果後回到模型推理下一步，如此循環直到任務完成。這整個 loop 在 Apple silicon 上能在本機跑完，帶來隱私、零成本與隨時可用的好處。","核心是 **local agentic AI stack** 四層：底層是為 Apple silicon 打造的開源陣列框架 **MLX**（負責 Metal 加速與記憶體管理）；其上是 **MLX-LM**，可載入、執行、量化、微調來自 HuggingFace 的數千個模型；再上是 **MLX-LM Server**，一個 OpenAI 相容的 HTTP server，支援結構化 tool calling 與 reasoning 模型，是任何雲端 LLM API 的 drop-in 替代品；最頂層則是 agent 本身，凡是會講 OpenAI chat completions 協定的（Xcode、OpenCode、自訂腳本等）都能直接接上。設定只要三步：`pip install mlx-lm`、用支援 tool calling 的模型啟動 `mlx_lm.server`、再把 agent 的 base URL 指向本機 server。","最後講解 MLX 如何榨乾硬體效能、解決本機跑 agent 的三大挑戰。**Prompt processing**：agentic session 動輒數十萬 token 且多為輸入，M5 的 **Neural Accelerators** 讓矩陣乘法比 M4 快四倍，prompt 處理也近乎同步加速，且無需改任何程式。**Concurrency**：agent 常派多個 subagent 並行，MLX-LM Server 以 **continuous batching** 動態分組同時處理，避免請求排隊卡住。**Model size**：超大模型（如 1.6 兆參數的 DeepSeek）單機放不下時，MLX 的 distributed 支援可跨多台 Mac（Thunderbolt 或 Ethernet）分片模型；macOS 26.2 起的 **Thunderbolt RDMA** 讓四節點分散式推論最高快三倍。講者以從零打造 SwiftUI 繪圖 app、並在 Xcode 中修 bug 等實機 demo 收尾。"],"deepdive":[{"t":0,"title":"Introduction","body":"MLX 團隊工程師 Angelos 開場，主旨是讓你**完全在 Mac 本機**建構並執行 agentic AI 工作流程——不靠雲端、不需 API key。強調過去一年 AI agent 從研究原型走入日常生產力工具，而 Apple silicon 讓整個流程能在本機完成，兼顧隱私、低延遲與無使用成本。"},{"t":32,"title":"The chat and agentic loop","body":"對比兩種模式：傳統 **chat** 是你發 prompt、模型回應，要採取行動得自己來；**agent** 則由它與模型對話決定動作，再呼叫工具（執行指令、讀檔、打 API），觀察結果後回到模型推理下一步。這個「user→agent→model→tools」的循環就是 **agentic loop**，會持續到任務完成。講者展示本機 demo：請 agent 抓取 MLX repo 的近期 PR、摘要變更並標出需注意處，模型在本機推理、只有 git 指令會連網。"},{"t":162,"title":"Local agentic AI stack","body":"拆解四層 stack：底層 **MLX**（為 Apple silicon 打造的開源陣列框架，負責低階運算、Metal 加速與記憶體管理）；其上 **MLX-LM**（載入、執行、量化、微調 HuggingFace 上數千模型，提供 CLI 與 Python API）；再上 **MLX-LM Server**（OpenAI 相容 HTTP server，支援 tool calling 與 reasoning 模型，是雲端 LLM API 的 drop-in 替代）；最頂為 agent。並指出 Ollama、LM Studio、vLLM 等熱門工具其實都建在 MLX 之上。"},{"t":276,"title":"Setting up your own agent","body":"概述只要三步就能從零到完整本機 agentic 工作流程，接著逐步示範。"},{"t":280,"title":"Set up MLX-LM and start the local server","body":"第一步 `pip install mlx-lm` 安裝所需一切；第二步用支援 tool calling 的模型啟動 `mlx_lm.server`（建議先用小模型測試），server 載入模型後即在 localhost 接受請求。"},{"t":318,"title":"Configure an agent to use your local MLX server","body":"第三步把 agent 的 base URL 指向本機 server 即可，agent 不在意模型跑在 Mac 還是雲端。以 **OpenCode** 設定為例：定義一個 local provider、把 URL 設為 localhost、設定 server 預期的模型名稱，並要 OpenCode 一律使用此本機模型。"},{"t":339,"title":"Making agents fast","body":"進入效能主題，說明 MLX 如何因應本機跑 agent 的關鍵挑戰。第一個挑戰是 **prompt processing**：agentic loop 每次收到 tool 輸出都得重新處理大量 context，且 session 動輒數十萬 token、多數非生成。M5 的 **Neural Accelerators** 讓矩陣乘法比 M4 快四倍，配合 MLX 專用 kernel 幾乎等比加速 prompt 處理，且**無需任何程式改動**，MLX 會自動選最佳 kernel。"},{"t":413,"title":"Concurrency and distributed inference","body":"第二個挑戰 **concurrency**：agent 常派多個 subagent 並行（讀文件、搜程式、寫測試），形成多請求同時打本機模型。MLX-LM Server 以 **continuous batching** 動態把進來的請求分組在 GPU 上一起處理，新請求可中途加入而不需等待，避免排隊卡住。第三個挑戰 **model size**：超大模型單機放不下時，MLX 的 distributed 支援可跨多台 Mac 分片，既能跑更大模型也能並行加速 prompt 處理。"},{"t":513,"title":"Launch distributed inference with MLX","body":"示範以 `mlx.launch` 搭配描述節點與連線型態的 hostfile 啟動分散式 server，模型會自動分片到所有裝置。並指出 macOS 26.2 起支援 **Thunderbolt RDMA**，提供低延遲、高頻寬通訊，使分散式推論最高快三倍（四節點）。延伸推薦「Explore distributed inference and training with MLX」一場。"},{"t":560,"title":"More examples","body":"進階實機 demo：請 agent 在空白 Xcode 專案中從零打造一個 iPad 繪圖 app——agent 先看目錄結構、擬定計畫、寫程式並自行 build、邊修錯誤，兩分鐘就出第一版；再請它把筆刷改成圓角端點並重編。最後示範在 Xcode 的 Intelligence 設定中接上本機 MLX server（Locally Hosted provider、設定 port），讓模型直接讀專案、理解 build 錯誤並修復刻意植入的 bug。全程程式不離開 Mac。"},{"t":781,"title":"Next steps","body":"總結：今天展示了從 MLX 到 agent 的完整本機 stack，以及 Neural Accelerators、continuous batching、distributed inference 如何讓它變快。起步只需安裝 MLX-LM、啟動 server、把你愛用的 agent 指向它，且所有內容皆為開源、即刻可用。"}],"summary_en":["Presented by the MLX team, this session shows how to run agentic AI workflows **entirely on your Mac**—no cloud, no API keys, with your data never leaving the machine. The speaker contrasts traditional chat with the **agentic loop**: in chat you send a prompt and the model replies, but acting on it is on you; an agent talks to the model to decide what to do, calls tools (run commands, read files, hit APIs), observes results, and loops back until the task is done. On Apple silicon the whole loop runs locally, giving privacy, zero usage cost, and always-on availability.","The core is the four-layer **local agentic AI stack**: at the bottom, **MLX**, the open-source array framework for Apple silicon handling Metal acceleration and memory; above it, **MLX-LM** to load, run, quantize, and fine-tune thousands of HuggingFace models; then **MLX-LM Server**, an OpenAI-compatible HTTP server with structured tool calling and reasoning models that's a drop-in replacement for any cloud LLM API; and at the top, the agent itself—anything speaking the OpenAI chat completions protocol (Xcode, OpenCode, custom scripts) plugs in directly. Setup is three steps: `pip install mlx-lm`, launch `mlx_lm.server` with a tool-calling model, and point the agent's base URL at the local server.","Finally, the talk covers how MLX squeezes the hardware to solve three challenges of local agents. **Prompt processing**: agentic sessions run to hundreds of thousands of (mostly input) tokens, and M5's **Neural Accelerators** make matrix multiply 4x faster than M4, translating almost directly to prompt-processing speedup with no code changes. **Concurrency**: agents spawn parallel subagents, and MLX-LM Server uses **continuous batching** to dynamically group simultaneous requests so they don't stall in a queue. **Model size**: when a model (like the 1.6-trillion-parameter DeepSeek) won't fit on one machine, MLX's distributed support shards it across multiple Macs over Thunderbolt or Ethernet, and **Thunderbolt RDMA** (macOS 26.2) makes four-node distributed inference up to 3x faster. Live demos—building a SwiftUI drawing app from scratch and fixing an Xcode bug—close the session."],"deepdive_en":[{"t":0,"title":"Introduction","body":"MLX engineer Angelos opens with the goal of building and running agentic AI workflows **entirely on your Mac**—no cloud, no API keys. He notes AI agents have gone from research prototypes to everyday productivity tools, and Apple silicon lets the whole loop run locally with privacy, low latency, and no usage costs."},{"t":32,"title":"The chat and agentic loop","body":"Contrasts two modes: in **chat** you send a prompt and the model replies, but acting is on you; an **agent** talks to the model to decide actions, calls tools (run commands, read files, hit APIs), observes results, and reasons about the next step. This user→agent→model→tools cycle is the **agentic loop**, repeating until the task is done. A local demo has the agent fetch recent PRs from the MLX repo, summarize changes, and flag what needs attention—reasoning locally, with only git commands hitting the network."},{"t":162,"title":"Local agentic AI stack","body":"Breaks down the four layers: **MLX** at the bottom (open-source array framework for Apple silicon, handling low-level compute, Metal acceleration, memory); **MLX-LM** above (load, run, quantize, fine-tune thousands of HuggingFace models, with CLI and Python API); then **MLX-LM Server** (OpenAI-compatible HTTP server with tool calling and reasoning models, a drop-in for cloud LLM APIs); and the agent on top. Notes that Ollama, LM Studio, and vLLM all build on MLX."},{"t":276,"title":"Setting up your own agent","body":"Overview that just three steps take you from zero to a fully local agentic workflow, which the session then walks through."},{"t":280,"title":"Set up MLX-LM and start the local server","body":"Step one, `pip install mlx-lm` gets everything; step two, launch `mlx_lm.server` with a tool-calling model (start small to test), which loads the model and accepts requests on localhost."},{"t":318,"title":"Configure an agent to use your local MLX server","body":"Step three: point the agent's base URL at the local server—the agent doesn't care whether the model runs on the Mac or the cloud. The **OpenCode** example defines a local provider, sets the URL to localhost, names the model the server expects, and tells OpenCode to use this local model for everything."},{"t":339,"title":"Making agents fast","body":"Enters performance, explaining how MLX addresses the key challenges. First is **prompt processing**: the loop reprocesses large context every time it receives tool output, and sessions run to hundreds of thousands of mostly non-generated tokens. M5's **Neural Accelerators** make matrix multiply 4x faster than M4, and MLX's specialized kernels translate that almost directly to prompt-processing speedup—with **no code changes**, since MLX auto-selects the best kernel."},{"t":413,"title":"Concurrency and distributed inference","body":"Second challenge, **concurrency**: agents spawn parallel subagents (reading docs, searching code, writing tests), hitting the local model with multiple simultaneous requests. MLX-LM Server uses **continuous batching** to dynamically group incoming requests on the GPU, letting new ones join mid-batch without waiting, so nothing stalls in a queue. Third challenge, **model size**: when a model won't fit on one machine, MLX's distributed support shards it across multiple Macs, running larger models and parallelizing prompt processing."},{"t":513,"title":"Launch distributed inference with MLX","body":"Shows launching a distributed server with `mlx.launch` plus a hostfile describing nodes and connection type, with the model auto-sharded across devices. Notes **Thunderbolt RDMA** (macOS 26.2) provides low-latency, high-bandwidth communication, making distributed inference up to 3x faster on four nodes, and points to the companion session 'Explore distributed inference and training with MLX'."},{"t":560,"title":"More examples","body":"Advanced live demos: the agent builds an iPad drawing app from scratch in a blank Xcode project—inspecting the directory, planning, writing code, building itself, and fixing errors, with a first version in two minutes—then adds rounded end caps and recompiles. Finally, in Xcode's Intelligence settings it connects to the running MLX server (a Locally Hosted provider with a port) so the model reads project files, understands build errors, and fixes a deliberately introduced bug—all without code leaving the Mac."},{"t":781,"title":"Next steps","body":"Wrap-up: the session showed the full local stack from MLX up to the agent, and how Neural Accelerators, continuous batching, and distributed inference make it fast. To start, install MLX-LM, launch the server, and point your favorite agent at it—everything shown is open-source and available now."}],"code":["# Step 1: Install MLX-LM\npip install mlx-lm\n\n# Step 2: Start the server\nmlx_lm.server --model mlx-community/Qwen-3.5-4B-8bit\n\n# Step 3: Point your agent to the server\ncurl -X POST \\\n  http://127.0.0.1:8080/v1/chat/completions \\\n  -H \"Content-Type: application/json\" \\\n  -d '{\"model\":\"default_model\",\"messages\":[{\"role\":\"user\",\"content\":\"Hello!\"}]}'","{\n  \"$schema\": \"https://opencode.ai/config.json\",\n  \"model\": \"mlx/default_model\",\n  \"small_model\": \"mlx/default_model\",\n  \"provider\": {\n    \"mlx\": {\n      \"npm\": \"@ai-sdk/openai-compatible\",\n      \"name\": \"MLX (local)\",\n      \"options\": {\n        \"baseURL\": \"http://127.0.0.1:8080/v1\"\n      },\n      \"models\": {\n        \"default_model\": {\n          \"name\": \"Default MLX Model\"\n        }\n      }\n    }\n  }\n}","mlx.launch --hostfile hosts.json \\\n  --backend jaccl \\\n  /remote/path/to/mlx_lm.server \\\n  --model mlx-community/Qwen-3.5-122B-A3B-8bit"]},"related":[{"id":"233","title":"Explore distributed inference and training with MLX","gloss":"用 MLX 探索分散式推論與訓練","gloss_en":"Explore distributed inference and training with MLX","category":"ai","categoryLabel":"AI 與機器學習"},{"id":"328","title":"Explore numerical computing in Swift with MLX","gloss":"用 MLX 探索 Swift 的數值計算","gloss_en":"Explore numerical computing in Swift with MLX","category":"ai","categoryLabel":"AI 與機器學習"},{"id":"382","title":"Inside Apple Intelligence and Xcode: Special Presentation","gloss":"深入 Apple Intelligence 與 Xcode：特別發表","gloss_en":"Inside Apple Intelligence and Xcode: Special Presentation","category":"ai","categoryLabel":"AI 與機器學習"},{"id":"121","title":"Announcing Apple’s next big step for Siri and iPhone","gloss":"宣布 Apple 為 Siri 與 iPhone 邁出的下一大步","gloss_en":"Announcing Apple's next big step for Siri and iPhone","category":"ai","categoryLabel":"AI 與機器學習"},{"id":"227","title":"Create UI prototypes using agents in Xcode","gloss":"在 Xcode 用代理人打造 UI 原型","gloss_en":"Prototype UI with agents in Xcode","category":"ai","categoryLabel":"AI 與機器學習"}]}</script>
