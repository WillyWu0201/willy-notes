<script id="d" type="application/json">{"s":{"id":"394","title":"Get ready for WWDC26","gloss":"為 WWDC26 做好準備","category":"other","categoryLabel":"其他","duration":84,"url":"https://developer.apple.com/videos/play/wwdc2026/394/","takeaway":"這是一段簡短的前導影片，幫你了解 WWDC26 提供的內容，把每場 session、lab 與活動的價值發揮到最大。","chapters":[],"points":[{"text":"簡短的**前導影片**，介紹 WWDC26 期間有哪些內容可參與。","hot":false},{"text":"協助你規劃如何充分運用每場 **session、lab 與活動**。","hot":false},{"text":"適合在大會開始前先觀看，掌握整體節奏與重點。","hot":false}],"apis":[],"audience":"**準備參與 WWDC26 的所有開發者**，想事先規劃觀看與參與計畫的人。","gloss_en":"Get ready for WWDC26","takeaway_en":"A short intro video to help you understand what WWDC26 has to offer and get the most out of every session, lab, and moment.","points_en":[{"text":"A short **intro video** covering what's available to take part in during WWDC26.","hot":false},{"text":"Helps you plan how to make the most of every **session, lab, and event**.","hot":false},{"text":"Worth watching before the conference begins to get a feel for the overall pace and highlights.","hot":false}],"audience_en":"**All developers planning to attend WWDC26** who want to plan their viewing and participation in advance.","summary":["這是一支簡短的 **WWDC26** 行前準備宣傳影片，告訴開發者如何在大會開始前做好準備。WWDC26 將於 6 月 8 日至 12 日線上免費舉行，是一整週的技術、創意與社群盛會。最直接的準備是下載 **Apple Developer app**——可在其中體驗整場大會，並取得包含經典 dogcow Clarus 在內的新貼圖；同時確保你有免費的 Apple Developer 帳號，以獲得個人化推薦與 developer.apple.com 上超過 100 場 session 的存取。","影片也提醒設定重要時程的提醒：6 月 8 日（週一）太平洋時間上午 10 點的 **Keynote**，以及下午 1 點接續的 **Platforms State of the Union**。此外可報名 **Group Labs** 參加由 Apple 工程師與設計師主持的即時串流問答、在 **Apple Developer Forums** 提問、透過全週線上與全球各地的活動找到自己的社群，並順道看看今年的 **Apple Design Award** 入圍名單、取得 WWDC26 桌布與 Apple Music 製作的播放清單。"],"deepdive":[],"summary_en":["This is a short **WWDC26** get-ready promo telling developers how to prepare before the conference begins. WWDC26 runs June 8–12, online and free — a full week of technology, creativity, and community. The most direct step is to download the **Apple Developer app**, where you can experience the entire conference and grab new stickers including the classic dogcow Clarus; also make sure you have a free Apple Developer account for personalized recommendations and access to more than 100 sessions on developer.apple.com.","The video also reminds you to set reminders for the key moments: the **Keynote** on Monday, June 8th at 10 a.m. Pacific, followed by the **Platforms State of the Union** at 1 p.m. Beyond that, sign up for **Group Labs** for live-streamed Q&As hosted by Apple engineers and designers, get answers on the **Apple Developer Forums**, find your community through activities happening all week online and around the world, and check out this year's **Apple Design Award** finalists, the WWDC26 wallpaper, and the playlist made by Apple Music."],"deepdive_en":[],"code":[]},"related":[{"id":"101","title":"Keynote","gloss":"主題演講","gloss_en":"Keynote","category":"other","categoryLabel":"其他"},{"id":"102","title":"Platforms State of the Union","gloss":"平台現況報告","gloss_en":"Platforms State of the Union","category":"other","categoryLabel":"其他"},{"id":"111","title":"Keynote (ASL)","gloss":"主題演講(美國手語版)","gloss_en":"Keynote (American Sign Language)","category":"other","categoryLabel":"其他"},{"id":"112","title":"Platforms State of the Union (ASL)","gloss":"平台現況報告（美國手語版）","gloss_en":"Platforms State of the Union (American Sign Language)","category":"other","categoryLabel":"其他"},{"id":"122","title":"WWDC26 Platforms State of the Union Recap","gloss":"WWDC26 平台現況演講重點回顧","gloss_en":"WWDC26 Platforms State of the Union recap","category":"other","categoryLabel":"其他"}]}</script>
