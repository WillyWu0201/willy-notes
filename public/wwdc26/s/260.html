<script id="d" type="application/json">{"s":{"id":"260","title":"Get the most out of Device Hub","gloss":"充分發揮 Device Hub 的效益","category":"other","categoryLabel":"其他","duration":1029,"url":"https://developer.apple.com/videos/play/wwdc2026/260/","takeaway":"Device Hub 能集中控制、組織與設定你的測試裝置，加速開發流程並協助重現難解的 bug。","chapters":[[0,"Introduction"],[64,"Device Hub overview"],[180,"Control"],[279,"Organize"],[364,"Configure"],[488,"Reproducing a bug"],[952,"devicectl"],[990,"Next steps"]],"points":[{"text":"**Device Hub** 提供集中介面來控制、組織與設定多台開發測試裝置。","hot":false},{"text":"可在 Device Hub 中**控制**裝置狀態，並依需求加以**組織與分類**，方便團隊管理。","hot":false},{"text":"示範如何運用 Device Hub 一步步**重現 bug**，縮短除錯時間。","hot":true},{"text":"搭配命令列工具 **devicectl** 可自動化裝置相關操作，融入既有開發工作流程。","hot":false}],"apis":["devicectl"],"audience":"適合**需要管理多台測試裝置、想加速除錯與開發流程的 iOS／Apple 平台開發者**。","gloss_en":"Get the most out of Device Hub","takeaway_en":"Device Hub centralizes control, organization, and configuration of your test devices, accelerating development and helping reproduce hard-to-crack bugs.","points_en":[{"text":"**Device Hub** provides a centralized interface to control, organize, and configure multiple development and test devices.","hot":false},{"text":"In Device Hub you can **control** device state and **organize and categorize** devices as needed, making team management easier.","hot":false},{"text":"Demonstrates how to use Device Hub to **reproduce bugs** step by step, cutting down debugging time.","hot":true},{"text":"Pair it with the **devicectl** command-line tool to automate device-related operations and fit them into your existing development workflow.","hot":false}],"audience_en":"For **iOS/Apple platform developers who need to manage multiple test devices and want to speed up debugging and development**.","summary":["**Device Hub** 是隨 **Xcode 27** 一同推出的全新 app，是你處理實機與 simulator 的統一入口。由 Devices 團隊的 Matt 與 Hassan 主講，重點在於它不需開啟 Xcode 也能使用，且對裝置與 simulator 提供一致的工具。在 Xcode 中 build and run 到 simulator 時，Device Hub 會自動啟動並以 **compact mode** 呈現精簡視窗：只有螢幕與少數依裝置而變的情境式控制（如 Apple TV 的播放/導覽、Vision Pro 的環境/相機、Apple Watch 的側邊鍵與 Digital Crown），需要更多功能時可展開為 full window。","full window 的功能分為三大領域。**Control**：中央 canvas 提供螢幕的即時顯示與直接互動（點擊、拖曳、捲動、trackpad 手勢），並有放大縮小、snap 到 1:1 實體尺寸、resize mode、以及把 Mac 鍵盤輸入直送裝置的 **capture keyboard**。**Organize**：sidebar 列出所有裝置與 simulator 的完整 inventory，可用 filter 篩選、排序、分組，context-click 做快速動作（如配對 iPhone 與 Apple Watch simulator），並用 tabs 或多個 compact window 同時比對多種螢幕尺寸。**Configure**：右側 inspector 有五個面板，可即時調整外觀（dark mode、文字大小）、模擬條件（如地點變更）、音訊，並查看 diagnostic reports（crash、spin），以及 Info、Apps、Profiles 等管理面板。","session 後段以真實情境串起所有功能：Hassan 在實機上發現「橫向模式下海拔復原建議文字被截斷」的 bug，他先無線 **pair** Apple Watch、安裝 CoreLocation logging 的 configuration profile（並重開機以符合隱私），重現 bug 後截圖、啟動 **sysdiagnose** 收集系統層診斷、複製被截斷的字串，並下載 app data container 一併交給 Matt。Matt 則在對應的 iPhone 17e simulator 上重現：替換成 Hassan 的 data container、依截圖鏡像設定（橫向、Johannesburg 高海拔位置、最大文字大小），三者同時成立才重現出截斷，凸顯 Device Hub 讓比對與重現變得直接。","最後提到自動化可改用 **devicectl** 命令列工具，與 Device Hub 基於相同底層技術，適合在測試環境與 CI 中列出裝置、安裝 app、切換深淺色等，並支援 json-output 以利整合腳本。延伸可參考「Modernize your UIKit app」（resizability）與 WWDC 2019 的「Getting the Most Out of Simulator」。"],"deepdive":[{"t":0,"title":"Introduction","body":"由 Devices 團隊的 **Matt** 開場（稍後 Hassan 加入），點出讓 app 在每種裝置、外觀、文字大小下都好看是件繁瑣的事。本場將介紹隨 Xcode 27 推出的 **Device Hub**，並依「介紹、功能走查（organize/control/configure）、實際工作流程示範」的順序展開。"},{"t":64,"title":"Device Hub overview","body":"**Device Hub** 是處理裝置與 simulator 的統一入口，隨 Xcode 27 出貨但不需開啟 Xcode 即可使用。在 Xcode build and run 到 simulator 時會自動啟動，並以 **compact mode** 呈現：精簡視窗只有螢幕與少數情境式控制（home、截圖、旋轉），且會依裝置改變（Apple TV、Vision Pro、Apple Watch 各不同）。點上方 expand 可切到功能更完整的 full window。"},{"t":180,"title":"Control","body":"由 Hassan 介紹中央 **canvas**：提供螢幕的即時顯示，可直接點擊、拖曳、捲動或用 trackpad 手勢操作，實機與 simulator 體驗一致（示範以 Mac 操控連線的 Apple Watch）。canvas 上方有 compact 沒有的控制：縮放、snap 到 **1:1 實體尺寸**、自由變形的 resize mode（細節見「Modernize your UIKit app」）、以及把 Mac 鍵盤直送裝置以測試 key commands 的 **capture keyboard**。"},{"t":279,"title":"Organize","body":"Matt 介紹 **sidebar**：集中顯示所有裝置與 simulator 的完整 inventory，頂端 filter 可切換可見項目、排序與分組，context-click 提供快速動作（如重啟、配對 iPhone 與 Apple Watch simulator）。為了快速比對，可用 tabs 或多個獨立 compact window 同時檢視多台裝置，例如選取數種 iPhone 尺寸後雙擊，逐一開出 compact window 對照 app 表現。"},{"t":364,"title":"Configure","body":"右側 **inspector** 提供五個面板做深度設定。device settings 含外觀（dark mode、文字大小，變更即時生效）、條件模擬（如地點變更）、音訊。diagnostic reports 收錄 crash、spin 等裝置記錄，是調查 hang 或 crash 的起點。第三個 tab 含 Info（儲存、型號、序號）、Apps（安裝/移除、下載與替換 data container）、Profiles（管理 configuration 與 provisioning profiles）。"},{"t":488,"title":"Reproducing a bug","body":"Hassan 走查實際工作流程：在 workout app 中發現「橫向模式下，依目前海拔顯示的復原建議文字被截斷」。他聚焦三件事：**pair** 裝置（示範無線配對 Apple Watch）、確保足夠的 log（安裝 CoreLocation logging 的 configuration profile 並重開機）、以及收集診斷（重現 bug 後截圖、啟動 **sysdiagnose**、複製被截斷字串，並下載 app data container 交給 Matt）。"},{"t":952,"title":"devicectl","body":"針對腳本與自動化，介紹命令列工具 **devicectl**，與 Device Hub 基於相同底層技術。適合在測試環境管理裝置與 app、擷取診斷，例如列出裝置、安裝 app、切換深淺色或查詢裝置資訊，並可用 **json-output** 取得結構化輸出以整合進腳本或 CI 流程。"},{"t":990,"title":"Next steps","body":"總結 Device Hub 對實機與 simulator 提供一致體驗，從即時螢幕、硬體控制到 app 管理、外觀設定與診斷收集一應俱全。行動建議是下載 **Xcode 27** 試用 Device Hub、自動化情境改用 devicectl，並參考「Modernize your UIKit app」(resizability) 與 WWDC 2019「Getting the Most Out of Simulator」。"}],"summary_en":["**Device Hub** is a new app shipping alongside **Xcode 27** that serves as your home for working with both devices and simulators. Presented by Matt and Hassan of the Devices team, the key point is that you don't need to launch Xcode to use it, and it offers a consistent set of tools across devices and simulators. When you build and run to a simulator in Xcode, Device Hub launches automatically in **compact mode**, a focused window with just the screen and a few contextual controls that change per device (play/navigation on Apple TV, environment/camera on Vision Pro, side button and Digital Crown on Apple Watch); click expand to reach the full window.","The full window's features fall into three areas. **Control**: the central canvas gives a live, interactive view of the screen (click, drag, scroll, trackpad gestures), plus zoom, snap to 1:1 physical size, resize mode, and **capture keyboard** to route Mac keystrokes to the device. **Organize**: the sidebar shows your full inventory of devices and simulators, with filtering, sorting, grouping, context-click quick actions (like pairing an iPhone and Apple Watch simulator), and the ability to open tabs or multiple compact windows to compare screen sizes at once. **Configure**: the right-side inspector has five panels to adjust appearance (dark mode, text size) instantly, simulate conditions like location, manage audio, view diagnostic reports (crashes, spins), and manage Info, Apps, and Profiles.","The session ties it together with a real scenario: Hassan finds a bug where altitude-based recovery advice text gets cut off in landscape. He wirelessly **pairs** an Apple Watch, installs a CoreLocation logging configuration profile (rebooting for privacy), reproduces the bug, takes a screenshot, kicks off a **sysdiagnose** for system-level diagnostics, copies the clipped string, and downloads the app's data container to hand to Matt. Matt reproduces it on a matching iPhone 17e simulator by replacing his data container with Hassan's and mirroring the config from the screenshot (landscape, Johannesburg's high elevation, maximum text size); only with all three together does the truncation appear, showing how directly Device Hub supports comparison and reproduction.","Finally, for scripting and automation it points to **devicectl**, a command-line tool built on the same underlying technology, ideal in test environments and CI for listing devices, installing apps, and switching dark/light modes, with json-output for easy script integration. Related sessions include \"Modernize your UIKit app\" (resizability) and WWDC 2019's \"Getting the Most Out of Simulator.\""],"deepdive_en":[{"t":0,"title":"Introduction","body":"**Matt** from the Devices team opens (Hassan joins later), noting how much work it is to make an app look great on every device, appearance, and text size. The session introduces **Device Hub**, shipping with Xcode 27, and follows a plan of introduction, a feature walkthrough (organize/control/configure), and a real workflow demo."},{"t":64,"title":"Device Hub overview","body":"**Device Hub** is your home for working with devices and simulators; it ships with Xcode 27 but doesn't require launching Xcode. It launches automatically when you build and run to a simulator, appearing in **compact mode**, a lightweight window with just the screen and a few contextual controls (home, screenshots, rotation) that change per device (different on Apple TV, Vision Pro, Apple Watch). Clicking expand transitions to the more capable full window."},{"t":180,"title":"Control","body":"Hassan covers the central **canvas**: a live display of the screen you can interact with directly via click, drag, scroll, or trackpad gestures, working the same for a device or simulator (demoed controlling a connected Apple Watch from the Mac). Above the canvas are controls not in compact mode: zoom, snap to **1:1 physical size**, a freely transforming resize mode (detailed in \"Modernize your UIKit app\"), and **capture keyboard** to route Mac keystrokes straight to the device for testing key commands."},{"t":279,"title":"Organize","body":"Matt introduces the **sidebar**, which shows your full inventory of every device and simulator in one place, with a top filter menu to change visibility, sort, and group, and context-click quick actions (restarting, pairing an iPhone and Apple Watch simulator). For quick access and comparison, you can view many devices at once with tabs or standalone compact windows, for example selecting several iPhone sizes and double-clicking to get a compact window for each."},{"t":364,"title":"Configure","body":"The right-side **inspector** offers five panels for deep configuration. Device settings include appearance (dark mode, text size, applied instantly), condition simulation (like a location change), and audio. Diagnostic reports collect crashes, spins, and other logs and are where you start investigating hangs or crashes. A third tab holds Info (storage, model, serial), Apps (install/uninstall, download and replace data containers), and Profiles (configuration and provisioning profiles)."},{"t":488,"title":"Reproducing a bug","body":"Hassan walks through a real workflow: in the workout app, altitude-based recovery advice text gets cut off in landscape. He focuses on three things: **pairing** devices (demoing wireless pairing of an Apple Watch), ensuring enough logs (installing a CoreLocation logging configuration profile and rebooting), and capturing diagnostics (reproducing the bug, taking a screenshot, starting a **sysdiagnose**, copying the clipped string, and downloading the app data container to send to Matt)."},{"t":952,"title":"devicectl","body":"For scripts and automation, the session introduces the command-line tool **devicectl**, built on the same underlying technology as Device Hub. It's great for managing devices and apps and capturing diagnostics in a test environment, for example listing devices, installing an app, switching between dark and light modes, or getting device info, with a **json-output** option for structured output to integrate into scripts or CI workflows."},{"t":990,"title":"Next steps","body":"The session concludes that Device Hub gives a consistent experience across simulators and devices, from live screens and hardware controls to app management, appearance settings, and diagnostics collection. The call to action is to download **Xcode 27** and try Device Hub, use devicectl for scripts and CI, and see \"Modernize your UIKit app\" (resizability) and WWDC 2019's \"Getting the Most Out of Simulator.\""}],"code":[]},"related":[{"id":"101","title":"Keynote","gloss":"主題演講","gloss_en":"Keynote","category":"other","categoryLabel":"其他"},{"id":"102","title":"Platforms State of the Union","gloss":"平台現況報告","gloss_en":"Platforms State of the Union","category":"other","categoryLabel":"其他"},{"id":"111","title":"Keynote (ASL)","gloss":"主題演講(美國手語版)","gloss_en":"Keynote (American Sign Language)","category":"other","categoryLabel":"其他"},{"id":"112","title":"Platforms State of the Union (ASL)","gloss":"平台現況報告（美國手語版）","gloss_en":"Platforms State of the Union (American Sign Language)","category":"other","categoryLabel":"其他"},{"id":"122","title":"WWDC26 Platforms State of the Union Recap","gloss":"WWDC26 平台現況演講重點回顧","gloss_en":"WWDC26 Platforms State of the Union recap","category":"other","categoryLabel":"其他"}]}</script>
