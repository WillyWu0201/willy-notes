<script id="d" type="application/json">{"s":{"id":"254","title":"Integrate MusicKit into your app","gloss":"將 MusicKit 整合進你的 App","category":"other","categoryLabel":"其他","duration":1266,"url":"https://developer.apple.com/videos/play/wwdc2026/254/","takeaway":"用 **MusicKit** 把 Apple Music 帶進 App，涵蓋授權、訂閱檢查、音樂選取、播放控制與目錄請求。","chapters":[[0,"Introduction"],[131,"Project setup and authorization"],[287,"Presents the Apple Music subscription offer"],[359,"Adds subscription button to main view"],[430,"Music items and music picker"],[528,"Add .musicPicker() modifier"],[654,"Music players and playback"],[889,"Artwork"],[906,"Current entry info"],[914,"Playback controls (play, pause)"],[938,"Playback controls (next, previous)"],[986,"Catalog requests"],[1138,"Music catalog resource request"],[1211,"Next steps"]],"points":[{"text":"完成專案設定與**授權**，並以 `MusicSubscription.current` 與 `subscriptionUpdates` 檢查訂閱狀態。","hot":false},{"text":"用 `musicSubscriptionOffer` 呈現 Apple Music 訂閱提示，讓尚未訂閱者可以升級。","hot":false},{"text":"透過新的 **`.musicPicker()`** 修飾器讓使用者挑選歌曲，再以 `ArtworkImage` 顯示封面。","hot":true},{"text":"使用 `ApplicationMusicPlayer.shared` 控制播放、暫停與上一首／下一首，並讀取 `queue.currentEntry` 顯示資訊。","hot":false},{"text":"以 `MusicCatalogResourceRequest` 依 ID 取得目錄歌曲，並可用 `.findEquivalents` 取得對應版本。","hot":false}],"apis":["MusicKit","MusicSubscription","musicSubscriptionOffer","musicPicker","ApplicationMusicPlayer","ArtworkImage","MusicCatalogResourceRequest","MusicItemID"],"audience":"**想在 App 中整合 Apple Music 播放與目錄功能**的 iOS 開發者。","gloss_en":"Integrate MusicKit into your app","takeaway_en":"Use **MusicKit** to bring Apple Music into your app, covering authorization, subscription checks, music selection, playback control, and catalog requests.","points_en":[{"text":"Complete project setup and **authorization**, then check subscription status with `MusicSubscription.current` and `subscriptionUpdates`.","hot":false},{"text":"Present an Apple Music subscription prompt with `musicSubscriptionOffer` so non-subscribers can upgrade.","hot":false},{"text":"Let users pick songs with the new **`.musicPicker()`** modifier, then show artwork with `ArtworkImage`.","hot":true},{"text":"Control play, pause, and previous/next with `ApplicationMusicPlayer.shared`, and read `queue.currentEntry` to display info.","hot":false},{"text":"Fetch catalog songs by ID with `MusicCatalogResourceRequest`, and use `.findEquivalents` to get matching versions.","hot":false}],"audience_en":"iOS developers **who want to integrate Apple Music playback and catalog features into their app**.","summary":["MusicKit 團隊的 Cathy 與 Alan 示範如何把 **MusicKit** 整合進 app，並以一個健身（騎車）app 作為貫穿範例，讓使用者在運動時挑選並播放音樂。**MusicKit** 是專為 Apple 平台設計的 Swift 框架，圍繞 Swift concurrency 與 SwiftUI 打造，能存取與播放 Apple Music 目錄與使用者媒體庫。整合前的設定包括：在 developer portal 的 App ID 勾選 MusicKit 以自動產生 developer token、確認 Xcode 登入同一帳號，並在 Signing & Capabilities 加入 **Media Library** capability 以提供音樂存取的說明文字。","授權與訂閱方面，用 **MusicAuthorization** 的非同步 request 方法取得使用者許可。Apple Music 訂閱並非必要（無訂閱僅能存取已購買或同步的音樂），但可用 **`.musicSubscriptionOffer`** view modifier 讓使用者不離開 app 即可訂閱，並透過 `MusicSubscriptionOffer.Options`（含 messageIdentifier，如 `.playMusic`）客製化。app 以 `@State` 追蹤 `MusicSubscription`，並在授權後用 `.task` 取得當前值並監聽 `subscriptionUpdates`，僅在 `canBecomeSubscriber` 時顯示訂閱按鈕。選曲則靠 **`.musicPicker`** modifier——它在單一介面整合 Apple Music 目錄與媒體庫，不需訂閱（無訂閱時只顯示媒體庫內容），並可將 selection 改為陣列以支援多選。","播放由 Alan 接手：MusicKit 提供 **SystemMusicPlayer**（控制系統 Music app、背景持續播放）與 **ApplicationMusicPlayer**（在 app 內播放、可完整讀寫 queue）兩種 player。queue 由可播放的 music items 組成，呼叫 `play()`／`pause()` 控制，並可用 `prepareToPlay()` 預先緩衝以縮短輸出延遲；`affectsListeningHistory` 決定是否出現在 Recently Played。兩個 player 的 state 與 queue 都是 observable，可直接用於 SwiftUI——範例以 `ArtworkImage` 顯示封面、用 currentEntry 的 title／subtitle 顯示資訊，並以 `skipToNextEntry`／`skipToPreviousEntry` 切歌。最後是 **catalog requests**：用 **`MusicCatalogResourceRequest`** 依 ID 抓取歌曲，加上 `.findEquivalents` option 處理跨地區／清淨版的資源等價，呼叫 `response()` 取回強型別的 `MusicItemCollection`（支援 `nextBatch()` 分頁），用以在運動畫面提供可一鍵播放的推薦歌曲。"],"deepdive":[{"t":0,"title":"Introduction","body":"MusicKit 工程師 Cathy 開場，介紹 **MusicKit** 是專為 Apple 平台、圍繞 Swift concurrency 與 SwiftUI 設計的 Swift 框架，可存取與播放 Apple Music 目錄與媒體庫。她與 Alan 將在一個健身 app 中走過授權、music item 與 music picker、播放，以及 catalog requests。"},{"t":131,"title":"Project setup and authorization","body":"專案設定包含在 developer portal 的 App ID（App Services 分頁）勾選 **MusicKit** 以自動產生 developer token，並確認 Xcode 登入同一帳號。授權用 **MusicAuthorization** 的非同步 request 方法，系統會跳出許可提示；在 Signing & Capabilities 加入 **Media Library** capability 並填寫說明，該文字會出現在提示底部。"},{"t":287,"title":"Presents the Apple Music subscription offer","body":"Apple Music 訂閱非必要，但無訂閱只能存取已購買或同步的音樂。用 **`.musicSubscriptionOffer`** view modifier（接受 `isPresented` binding）讓使用者不離開 app 即可訂閱；透過 `MusicSubscriptionOffer.Options` 設定 Performance Partner Program 資訊與 messageIdentifier（本例為 `.playMusic`）來客製 UI 與潛在抽成。"},{"t":359,"title":"Adds subscription button to main view","body":"在主畫面以 `@State` 宣告 `MusicSubscription` 狀態，僅在使用者尚未訂閱且 `canBecomeSubscriber` 時顯示訂閱按鈕。用授權成功時觸發的 `.task` 取得 `MusicSubscription.current` 並持續監聽 `subscriptionUpdates` 以即時更新狀態。"},{"t":430,"title":"Music items and music picker","body":"**MusicItem** 是使用 MusicKit API 的基礎，為 model 層的 value type。每個 item 有 **Attributes**（如 Album 的 title、contentRating）、**Relationships**（如 Album 的 tracks）與較弱關聯的 **Associations**（如 otherVersions）。除了 Album 還有 Genre、Station、Playlist 等型別。"},{"t":528,"title":"Add .musicPicker() modifier","body":"用 **`.musicPicker`** SwiftUI view modifier 在單一統一介面同時呈現 Apple Music 目錄與媒體庫。需加上是否顯示的 toggle 與 selected song 狀態（預設 nil）。picker 不需訂閱（無訂閱時只顯示媒體庫），並可把 selection 改為陣列以支援多選整張專輯或播放清單。"},{"t":654,"title":"Music players and playback","body":"由 Alan 接手介紹兩種 player：**SystemMusicPlayer**（控制系統 Music app、背景／結束後持續播放、queue 唯讀）與 **ApplicationMusicPlayer**（在 app 內播放、queue 可完整讀寫）。queue 由可播放 music items 組成，`play()`／`pause()` 控制，`prepareToPlay()` 預先緩衝以縮短延遲，`affectsListeningHistory` 決定是否進 Recently Played；state 與 queue 皆 observable 可直接用於 SwiftUI。"},{"t":889,"title":"Artwork","body":"從 player 的 queue 取得正在播放的歌曲，若其有 artwork 則用 MusicKit 的 **`ArtworkImage`** SwiftUI view 顯示封面，否則顯示 placeholder 的 RoundedRectangle。"},{"t":906,"title":"Current entry info","body":"用 queue 的 `currentEntry` 顯示目前歌曲的 title 與（若有）subtitle，分別套用 title3.bold 與 secondary 樣式。"},{"t":914,"title":"Playback controls (play, pause)","body":"讀取 `ApplicationMusicPlayer` 的 state，以 `playbackStatus == .playing` 判斷是否播放中，按鈕在播放時呼叫 `pause()`、否則在 Task 中呼叫 `play()`。"},{"t":938,"title":"Playback controls (next, previous)","body":"Back 按鈕呼叫 `skipToPreviousEntry`、Next 按鈕呼叫 `skipToNextEntry` 來切換上一首／下一首；切歌後 `ArtworkImage` 會即時反映新歌的封面。"},{"t":986,"title":"Catalog requests","body":"**catalog requests** 讓 app 直接查詢 Apple Music、提供與使用者媒體庫無關的內容（如為 app 策展的歌曲）。MusicKit 提供多種結構化請求（依 filter 取得、搜尋、策展與個人化內容等），詳見文件。"},{"t":1138,"title":"Music catalog resource request","body":"**`MusicCatalogResourceRequest`** 是針對特定資源的結構化請求，可設 options、指定要一併取得的 relationships／associations 與回傳數量上限。呼叫非同步 `response()` 取回 `MusicCatalogResourceResponse`，內含強型別的 `MusicItemCollection`，支援以 `hasNextBatch` 與 `nextBatch()` 分頁。範例 `fetchSongs` 依 ID 抓歌、加上 `.findEquivalents` 處理跨地區／清淨版等價，並以 `item(for:)` 取出 featured 與其餘歌曲。"},{"t":1211,"title":"Next steps","body":"總結建議：採用 music picker view modifier 提供統一熟悉的選曲體驗，善用 Apple Music 目錄豐富內容（如為 app 加入背景音樂），並探索其他 MusicKit API（瀏覽與修改媒體庫見「Explore more content with MusicKit」；Android／web 整合見「Meet Apple Music API and MusicKit」）。"}],"summary_en":["MusicKit team members Cathy and Alan show how to integrate **MusicKit** into an app, using a fitness (cycling) workout app as the running example so people can pick and play music during workouts. **MusicKit** is a Swift framework for Apple platforms, designed around Swift concurrency and SwiftUI, that accesses and plays the Apple Music catalog and a person's media library. Setup before integration includes checking MusicKit on your App ID in the developer portal to auto-generate a developer token, confirming Xcode is signed into the same account, and adding the **Media Library** capability in Signing & Capabilities with a usage description.","For authorization and subscriptions, use **MusicAuthorization**'s async request method to get permission. An Apple Music subscription isn't required (without one, only purchased or synced music is accessible), but the **`.musicSubscriptionOffer`** view modifier lets people subscribe without leaving the app, customized via `MusicSubscriptionOffer.Options` (including a messageIdentifier like `.playMusic`). The app tracks a `MusicSubscription` with `@State`, fetching the current value and listening for `subscriptionUpdates` in a `.task` after authorization, showing the subscribe button only when `canBecomeSubscriber`. Selection uses the **`.musicPicker`** modifier — a single unified interface over the catalog and library that needs no subscription (showing only library content without one) and supports multi-selection by making the selection an array.","Alan takes over playback: MusicKit offers **SystemMusicPlayer** (controls the system Music app, keeps playing in the background) and **ApplicationMusicPlayer** (plays from your app, with full read/write queue access). A queue is a collection of playable music items, controlled with `play()`/`pause()`, with `prepareToPlay()` to buffer ahead and reduce latency, while `affectsListeningHistory` governs whether it appears in Recently Played. Both players' state and queue are observable for direct use in SwiftUI — the example shows the cover with `ArtworkImage`, the title/subtitle from currentEntry, and skips via `skipToNextEntry`/`skipToPreviousEntry`. Finally, **catalog requests**: use **`MusicCatalogResourceRequest`** to fetch songs by ID with the `.findEquivalents` option for cross-region/clean equivalency, calling `response()` to get a strongly-typed `MusicItemCollection` (paginated via `nextBatch()`), used to offer one-tap recommended songs on the workout screen."],"deepdive_en":[{"t":0,"title":"Introduction","body":"MusicKit engineer Cathy opens, introducing **MusicKit** as a Swift framework for Apple platforms designed around Swift concurrency and SwiftUI that accesses and plays the Apple Music catalog and media library. She and Alan will walk through authorization, music items and the music picker, playback, and catalog requests in a fitness app."},{"t":131,"title":"Project setup and authorization","body":"Setup includes checking **MusicKit** on the App ID (App Services tab) in the developer portal to auto-generate a developer token, and confirming Xcode is signed into the same account. Authorization uses **MusicAuthorization**'s async request method, which prompts the user; add the **Media Library** capability in Signing & Capabilities with a description that appears at the bottom of the prompt."},{"t":287,"title":"Presents the Apple Music subscription offer","body":"A subscription isn't required, but without one only purchased or synced music is accessible. Use the **`.musicSubscriptionOffer`** view modifier (taking an `isPresented` binding) to let people subscribe without leaving the app; configure `MusicSubscriptionOffer.Options` with Performance Partner Program info and a messageIdentifier (here `.playMusic`) to customize the UI and potential commissions."},{"t":359,"title":"Adds subscription button to main view","body":"In the main view, declare a `MusicSubscription` state with `@State` and show the subscribe button only when the user isn't subscribed and `canBecomeSubscriber`. Use a `.task` triggered when authorization succeeds to fetch `MusicSubscription.current` and keep listening to `subscriptionUpdates` for live updates."},{"t":430,"title":"Music items and music picker","body":"A **MusicItem** is the building block for MusicKit APIs, a value type in the model layer. Each has **Attributes** (e.g. an Album's title, contentRating), **Relationships** (e.g. an Album's tracks), and more loosely-tied **Associations** (e.g. otherVersions). Beyond Album there are Genre, Station, Playlist, and more."},{"t":528,"title":"Add .musicPicker() modifier","body":"Use the **`.musicPicker`** SwiftUI view modifier to surface the Apple Music catalog and the library in a single unified interface. Add a toggle for whether it's shown and a selected song state (nil by default). The picker needs no subscription (showing only library content without one) and supports multi-selection by making the selection an array to pick whole albums or playlists."},{"t":654,"title":"Music players and playback","body":"Alan introduces the two players: **SystemMusicPlayer** (controls the system Music app, keeps playing in the background/after quit, read-only queue) and **ApplicationMusicPlayer** (plays from your app, full read/write queue). A queue is a collection of playable music items, controlled by `play()`/`pause()`, with `prepareToPlay()` to buffer ahead and `affectsListeningHistory` governing Recently Played; state and queue are observable for direct SwiftUI use."},{"t":889,"title":"Artwork","body":"Get the currently playing song from the player's queue, and if it has artwork, display the cover with MusicKit's **`ArtworkImage`** SwiftUI view; otherwise show a placeholder RoundedRectangle."},{"t":906,"title":"Current entry info","body":"Use the queue's `currentEntry` to display the current song's title and (if present) subtitle, styled with title3.bold and secondary respectively."},{"t":914,"title":"Playback controls (play, pause)","body":"Read `ApplicationMusicPlayer`'s state, derive whether it's playing via `playbackStatus == .playing`, and have the button call `pause()` when playing or `play()` in a Task otherwise."},{"t":938,"title":"Playback controls (next, previous)","body":"The Back button calls `skipToPreviousEntry` and the Next button calls `skipToNextEntry` to change tracks; after skipping, `ArtworkImage` reflects the new song's cover instantly."},{"t":986,"title":"Catalog requests","body":"**Catalog requests** let the app query Apple Music directly and provide content independent of the user's library (such as curated songs for your app). MusicKit offers several structured requests (filtered fetches, search, curated and personalized content); see the docs for the full list."},{"t":1138,"title":"Music catalog resource request","body":"**`MusicCatalogResourceRequest`** is a structured request for a specific resource; you can set options, specify relationships/associations to also fulfill, and a result limit. Calling the async `response()` returns a `MusicCatalogResourceResponse` containing a strongly-typed `MusicItemCollection`, paginated via `hasNextBatch` and `nextBatch()`. The `fetchSongs` example fetches by ID, adds `.findEquivalents` for cross-region/clean equivalency, and uses `item(for:)` to pull the featured and remaining songs."},{"t":1211,"title":"Next steps","body":"Closing advice: adopt the music picker view modifier for a unified, familiar picking experience, leverage the rich Apple Music catalog (e.g. add background music to your app), and explore other MusicKit APIs (browsing/modifying the library in \"Explore more content with MusicKit\"; Android/web integration in \"Meet Apple Music API and MusicKit\")."}],"code":["@State var showSubscriptionOffer = false\n\nlet options = MusicSubscriptionOffer.Options(\n    messageIdentifier: .playMusic\n)\n\n@ViewBuilder\nvar musicSubsriptionButton: some View {\n    Button(\"Subscribe to Apple Music\", systemImage: \"music.note\") {\n        showSubscriptionOffer = true\n    }\n    .musicSubscriptionOffer(isPresented: $showSubscriptionOffer, options: options)\n}","@State var subscription: MusicSubscription?\n\nvar body: some View {\n  \tVStack {\n        // ...\n        if let subscription, subscription.canBecomeSubscriber {\n            musicSubscriptionButton\n        }\n    }\n    .task(id: isAuthorized) {\n\t      self.subscription = try? await MusicSubscription.current\n        for await subscription in MusicSubscription.subscriptionUpdates {\n            self.subscription = subscription\n        }\n    }\n}","@State var showMusicPicker = false\n@State var selectedSong: Song? = nil\n\n@ViewBuilder\nvar musicPickerButton: some View {\n    Button(\"Pick some Music\", systemImage: \"music.note.list\") {\n        showMusicPicker = true\n    }\n    .musicPicker(isPresented: $showMusicPicker, selection: $selectedSong)\n}\n\nvar body: some View {\n    VStack {\n        if let subscription, subscription.canBecomeSubscriber {\n            musicSubscriptionButton\n        }\n        musicPickerButton\n    }\n}","@State var queue = ApplicationMusicPlayer.shared.queue\n\nvar body: some View {\n    VStack {\n        if let artwork = queue.currentEntry?.artwork {\n            ArtworkImage(artwork, width: 200, height: 200)\n        } else {\n            // Placeholder artwork\n            RoundedRectangle(cornerRadius: 16)\n                .fill(.quaternary)\n                .frame(width: 200, height: 200)\n        }\n    }\n}","@State var queue = ApplicationMusicPlayer.shared.queue\n\nvar body: some View {\n    VStack {\n        // ...\n        if let currentSong = queue.currentEntry {\n            Text(currentSong.title)\n                .font(.title3.bold())\n              \n            if let subtitle = currentSong.subtitle {\n                Text(subtitle)\n                    .font(.subheadline)\n                    .foregroundStyle(.secondary)\n            }\n        }\n    }\n}","let player = ApplicationMusicPlayer.shared\n@State var state = ApplicationMusicPlayer.shared.state\n\nvar isPlaying: Bool {\n    state.playbackStatus == .playing\n}\n\nvar playPause: some View {\n    Button (\n        isPlaying ? \"Pause\": \"Play\",\n        systemImage: isplaying ? \"pause.fill\" : \"play.fill\"\n    ) {\n        if isPlaying {\n            player.pause()\n        } else {\n            Task {\n                try await player.play()\n            }\n        }\n    }\n}","let player = ApplicationMusicPlayer.shared\n\nvar controls: some View {\n    HStack {\n        Button(\"Back\", systemImage: \"backward.fill\") {\n            Task {\n                try await player.skipToPreviousEntry()\n            }\n        }\n        // ...\n        Button(\"Next\", systemImage: \"forward.fill\") {\n            Task {\n                try await player.skipToNextEntry()\n            }\n        }\n    }\n}","func fetchSongs(songIDs: [MusicItemID]) async throws -> (featured: Song?, other: [Song]) {\n    var request = MusicCatalogResourceRequest‹Song>(matching: \\.id, memberOf: songIDs)\n    request.options = [.findEquivalents]\n    \n    let response = try await request.response()\n    \n    let featuredSongID = songIDs[0]\n    let featuredSong = response.item(for: featuredSongID)\n    \n    let others: [Song] = songIDs[1...].compactMap { songID in\n        return response.item(for: songID)\n    }\n    \n    return (featuredSong, others)\n}"]},"related":[{"id":"101","title":"Keynote","gloss":"主題演講","gloss_en":"Keynote","category":"other","categoryLabel":"其他"},{"id":"102","title":"Platforms State of the Union","gloss":"平台現況報告","gloss_en":"Platforms State of the Union","category":"other","categoryLabel":"其他"},{"id":"111","title":"Keynote (ASL)","gloss":"主題演講(美國手語版)","gloss_en":"Keynote (American Sign Language)","category":"other","categoryLabel":"其他"},{"id":"112","title":"Platforms State of the Union (ASL)","gloss":"平台現況報告（美國手語版）","gloss_en":"Platforms State of the Union (American Sign Language)","category":"other","categoryLabel":"其他"},{"id":"122","title":"WWDC26 Platforms State of the Union Recap","gloss":"WWDC26 平台現況演講重點回顧","gloss_en":"WWDC26 Platforms State of the Union recap","category":"other","categoryLabel":"其他"}]}</script>
