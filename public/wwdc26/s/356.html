<script id="d" type="application/json">{"s":{"id":"356","title":"Bringing Cyberpunk 2077 to Mac","gloss":"將《電馭叛客 2077》帶上 Mac","category":"graphics","categoryLabel":"圖形與遊戲","duration":1674,"url":"https://developer.apple.com/videos/play/wwdc2026/356/","takeaway":"CD PROJEKT RED 分享如何運用 Game Porting Toolkit 將《電馭叛客 2077》移植到 macOS，並透過「For this Mac」預設樹立 AAA 遊戲新標竿。","chapters":[[0,"Introduction"],[44,"What is Cyberpunk 2077"],[177,"Why bring it to Mac"],[225,"How we brought it to Mac"],[290,"Game Porting Toolkit evaluation"],[785,"What we did to stand out"],[796,"\"For this Mac\" preset"],[1619,"Next steps"]],"points":[{"text":"**CD PROJEKT RED** 分享將 AAA 大作《電馭叛客 2077》移植至 **macOS** 的幕後歷程與決策。","hot":true},{"text":"說明**為何要登上 Mac**，以及整體的移植策略與工程流程。","hot":false},{"text":"使用 **Game Porting Toolkit** 進行可行性評估，加速從 Windows 到 Mac 的移植。","hot":false},{"text":"推出 **「For this Mac」預設**，依機型自動最佳化畫質設定，做出與眾不同的體驗。","hot":false}],"apis":["Game Porting Toolkit","Metal"],"audience":"**遊戲開發者與想將大型遊戲移植到 macOS** 的工作室，特別是關注 AAA 等級效能與最佳化者。","gloss_en":"Bringing Cyberpunk 2077 to Mac","takeaway_en":"CD PROJEKT RED shares how they used the Game Porting Toolkit to bring Cyberpunk 2077 to macOS, setting a new bar for AAA gaming with the \"For this Mac\" preset.","points_en":[{"text":"**CD PROJEKT RED** shares the behind-the-scenes story and decisions of porting the AAA blockbuster Cyberpunk 2077 to **macOS**.","hot":true},{"text":"Explains **why bring it to the Mac**, along with the overall porting strategy and engineering process.","hot":false},{"text":"Uses the **Game Porting Toolkit** for feasibility assessment, accelerating the port from Windows to Mac.","hot":false},{"text":"Introduces the **\"For this Mac\" preset**, which automatically optimizes graphics settings per model to deliver a distinctive experience.","hot":false}],"audience_en":"**Game developers and studios looking to port large games to macOS**, especially those focused on AAA-class performance and optimization.","summary":["Apple Game Performance 團隊的 Garrett Austin 與 CD PROJEKT RED 副遊戲總監 Paweł Sasko，分享如何把 **Cyberpunk 2077: Ultimate Edition** 帶上 Mac，並成為 macOS 上 AAA 遊戲的新標竿。Cyberpunk 2077 是設定在 Night City 的開放世界 RPG，無讀取畫面、海量資料持續處理，混合光照無處不在，並支援 ray tracing 與 path tracing；它從一開始就以可擴展（scaleable）為設計，這在移植 Mac 時幫了大忙。","團隊為自己訂下三項品質標準：維持視覺保真與遊戲識別（光照、材質）、在重 CPU/GPU 場景下的穩定效能，以及讓體驗感覺原生的收尾。實際開發前，先用 **Game Porting Toolkit** 在 macOS 的轉譯環境評估 Windows build，目的不是最終效能數字，而是了解 frame time 花在哪、瓶頸在 CPU 還是 GPU、該優先處理什麼。評估時從三個角度看資料：引擎內 profiler 的統計 frame time、**Metal HUD**、以及依執行緒拆解的引擎內部 profiling。訊號顯示高階硬體上 GPU 健康，重度遊玩則受 CPU 壓力影響；live shader translation 與 audio middleware 等問題在轉為 native binary 後解決。","production roadmap 分為：把 Mac 變成真正目標（native build、資料管線、架構橋接與單元測試）、用 **Metal API** 與 **Metal shader converter** 取得可玩 build、再加上原生功能、最佳化與打磨。Metal 後端逐步從單元測試、靜態場景到動態場景帶起；效能擴展靠 **MetalFX Upscaling** 搭配 **Dynamic Resolution Scaling**，以較低內部解析度重建高解析輸出。亮點是 **\"For this Mac\"** preset：偵測硬體並自動設定最佳設定（目標 30 或 60 FPS、MetalFX+DRS、解析度上下界、VSync、依顯示器能力開 HDR），讓玩家首次啟動即獲穩定體驗。","團隊還採用多項平台原生功能：用 NSNotification 回應 app 切換與顯示變更（如 `NSWindowDidChangeOcclusionStateNotification` 在背景時暫停 render）、Game Mode 自動啟用、Game Controller framework 支援第三方控制器與 Magic Mouse/trackpad、透過 Apple 的 **EDR** pipeline 用 `maximumExtendedDynamicRangeColorComponentValue` 自動校準 HDR、用 AVAudioEngine 的 `listenerHeadTrackingEnabled` 為 AirPods 啟用頭部追蹤的 spatial audio，以及 iCloud Drive 與跨平台存檔。成果是榮獲 Apple 2025 App Store Awards 的 Mac 年度遊戲。"],"deepdive":[{"t":0,"title":"Introduction","body":"Apple Game Performance 團隊的 Garrett Austin 開場，介紹特別來賓——CD PROJEKT RED 副遊戲總監 Paweł Sasko，將分享把 **Cyberpunk 2077: Ultimate Edition** 帶上 Mac 的歷程，並善用平台特性、在多種 Mac 上提供良好效能。"},{"t":44,"title":"What is Cyberpunk 2077","body":"說明 Cyberpunk 2077 是設定在 Night City、扮演傭兵 V 的開放世界 RPG：龐大世界、無讀取畫面、海量資料持續處理。大量 CPU 壓力來自人群、交通、AI、物理、動畫與任務；混合光照無處不在，並支援 ray tracing 與 path tracing 等隨 GPU 能力擴展的進階模式。"},{"t":177,"title":"Why bring it to Mac","body":"說明帶上 Mac 的理由：CD PROJEKT RED 在 Apple 平台有長久歷史，隨 Apple silicon 演進，硬體能力已足以在認真的品質水準上承載 Cyberpunk 規模的遊戲，並能觸及更多玩家。"},{"t":225,"title":"How we brought it to Mac","body":"訂出三項品質標準：維持視覺保真與遊戲識別（光照、材質）、在重 CPU/GPU 場景（大量人群、screen space reflections、密集區域駕駛、戰鬥）下的穩定效能，以及讓體驗感覺原生的收尾。"},{"t":290,"title":"Game Porting Toolkit evaluation","body":"正式寫 native 程式碼前，用 **Game Porting Toolkit** 在 macOS 轉譯環境評估 Windows build，取得「是否可行、壓力在哪、該先做什麼」的洞見。以預設 hotspot 序列從三角度看資料：引擎 profiler 的統計 frame time、**Metal HUD**、依執行緒拆解的內部 profiling。高階硬體 GPU 健康，重度遊玩受 CPU 壓力；live shader translation 與 audio middleware 等為評估環境 artifact，轉 native 後解決。"},{"t":785,"title":"What we did to stand out","body":"帶出讓 Mac 版脫穎而出的收尾：預設設定（首次啟動的樣貌）、用平台原生功能差異化，以及整體體驗打磨。"},{"t":796,"title":"\"For this Mac\" preset","body":"introduces **\"For this Mac\"** preset：偵測 Mac 硬體並自動配置最佳設定，讓任何支援的 Mac 一啟動即獲穩定起點。流程包含為每台裝置挑選維持影像保真的設定、目標 30 或 60 FPS、用 MetalFX+Dynamic Resolution Scaling 並調最小/最大解析度、設定輸出解析度與 VSync、依顯示器能力開 HDR，再逐項調校。示範以 M5 Max MacBook Pro 載入 Dogtown 的 Black Market 重場景，於 out-of-box 設定下穩定 60 FPS，並聊到把創辦人掃描進遊戲的彩蛋。最後總結採用 windowing/app 切換、控制器、顯示與音訊、雲端存檔等平台原生功能：用 `NSWindowDidChangeOcclusionStateNotification` 在背景暫停 render、用 `NSApplicationDidChangeScreenParametersNotification` 與 `NSWindowDidChangeScreenNotification` 回應顯示變更、用 resign/become key 通知切換游標；Game Mode 自動啟用以提高 CPU/GPU 優先權並降低無線延遲；Game Controller framework 支援第三方控制器與 Magic Mouse/trackpad；透過 EDR 以 `maximumExtendedDynamicRangeColorComponentValue` 自動校準 HDR、以 `maximumPotential...` 大於 2.0 自動開 HDR；用 AVAudioEngine 的 `listenerHeadTrackingEnabled` 為 AirPods 啟用頭追 spatial audio；並支援 iCloud Drive 與跨平台存檔。"},{"t":1619,"title":"Next steps","body":"Garrett 收尾，鼓勵試用 Game Porting Toolkit 評估環境（無需程式碼、設定快速）、用 Metal HUD 評估效能，並透過優化設定與啟用 EDR、AirPods 頭追 spatial audio 等原生功能打造出色首次啟動體驗。並推薦「Speedrun your game port with agentic coding」與「Find and fix performance issues in your Metal games」兩場延伸。"}],"summary_en":["Apple's Game Performance team (Garrett Austin) and CD PROJEKT RED's Associate Game Director (Paweł Sasko) share how they brought **Cyberpunk 2077: Ultimate Edition** to Mac, setting a new standard for AAA gaming on macOS. Cyberpunk 2077 is an open-world RPG set in Night City with no loading screens, constant heavy data processing, mixed lighting everywhere, and support for ray tracing and path tracing; it was designed from the start to be scaleable, which helped greatly on Mac.","The team set three quality bars: preserving visual fidelity and the game's identity (lighting, materials), stable performance in heavy CPU/GPU scenes, and finishing touches that feel native. Before writing native code, they used the **Game Porting Toolkit** to evaluate the Windows build in a translated environment on macOS — the goal was information (where frame time goes, CPU vs. GPU pressure, what to build first), not final numbers. They looked at data three ways: in-engine profiler frame-time stats, the **Metal HUD**, and per-thread engine profiling. Signals showed healthy GPU on high-spec hardware, with CPU pressure in heavy gameplay; live shader translation and audio middleware artifacts were resolved once native.","The production roadmap: make Mac a real target (native builds, data pipeline, architecture bridge with unit tests), reach a playable build with the **Metal API** and **Metal shader converter**, then add native features, optimize, and polish. The Metal backend was brought up incrementally from unit tests to stationary then dynamic scenes; performance scaling relied on **MetalFX Upscaling** with **Dynamic Resolution Scaling**, rendering at a lower internal resolution and reconstructing a higher-resolution output. The highlight is the **\"For this Mac\"** preset: it detects the hardware and auto-configures the best settings (target 30 or 60 FPS, MetalFX+DRS, resolution bounds, VSync, HDR per display capability) so players get a stable experience on first launch.","The team also adopted many platform-native features: NSNotifications for app switching and display changes (e.g. `NSWindowDidChangeOcclusionStateNotification` to pause rendering in the background), automatic Game Mode, the Game Controller framework for third-party controllers and Magic Mouse/trackpad, automatic HDR calibration via Apple's **EDR** pipeline using `maximumExtendedDynamicRangeColorComponentValue`, head-tracked spatial audio for AirPods via AVAudioEngine's `listenerHeadTrackingEnabled`, and iCloud Drive plus cross-platform saves. The result earned Mac Game of the Year at Apple's 2025 App Store Awards."],"deepdive_en":[{"t":0,"title":"Introduction","body":"Apple Game Performance's Garrett Austin opens, introducing special guest Paweł Sasko, Associate Game Director at CD PROJEKT RED, who will share bringing **Cyberpunk 2077: Ultimate Edition** to Mac while leveraging platform features and delivering good performance across many Macs."},{"t":44,"title":"What is Cyberpunk 2077","body":"Describes Cyberpunk 2077 as an open-world RPG set in Night City as mercenary V: a massive world, no loading screens, constant heavy data processing. Much CPU pressure comes from crowds, traffic, AI, physics, animation, and quests; mixed lighting is everywhere, with ray tracing and path tracing scaling with GPU capability."},{"t":177,"title":"Why bring it to Mac","body":"Explains the reasons: CD PROJEKT RED has a long history on Apple platforms, and as Apple silicon evolved, hardware became capable enough to carry a Cyberpunk-scale game at a serious quality level — and reach more players."},{"t":225,"title":"How we brought it to Mac","body":"Sets three quality bars: preserving visual fidelity and the game's identity (lighting, materials), stable performance in heavy CPU/GPU scenes (large crowds, screen-space reflections, dense-area driving, combat), and finishing touches that feel native."},{"t":290,"title":"Game Porting Toolkit evaluation","body":"Before native code, they used the **Game Porting Toolkit** to evaluate the Windows build in a translated macOS environment for insight on feasibility, pressure points, and what to build first. Predetermined hotspot sequences were viewed three ways: engine profiler frame-time stats, the **Metal HUD**, and per-thread internal profiling. GPU was healthy on high-spec hardware, with CPU pressure in heavy gameplay; live shader translation and audio middleware were evaluation-environment artifacts resolved once native."},{"t":785,"title":"What we did to stand out","body":"Introduces the finishing work that makes the Mac version stand out: default settings (how it looks on first launch), differentiating with platform-native features, and overall polish."},{"t":796,"title":"\"For this Mac\" preset","body":"Introduces the **\"For this Mac\"** preset: it detects the Mac's hardware and auto-configures the best settings so any supported Mac gets a stable starting point on launch. The process picks fidelity-preserving settings per device, targets 30 or 60 FPS, uses MetalFX+Dynamic Resolution Scaling with tuned min/max resolution, sets output resolution and VSync, and enables HDR per display capability, then tunes each setting. The demo loads Dogtown's Black Market on an M5 Max MacBook Pro at a steady 60 FPS out of the box, with an easter egg of the founders scanned in. It then covers platform-native features: `NSWindowDidChangeOcclusionStateNotification` to pause rendering in the background; `NSApplicationDidChangeScreenParametersNotification` and `NSWindowDidChangeScreenNotification` for display changes; resign/become-key notifications for cursor handling; automatic Game Mode for CPU/GPU priority and lower wireless latency; the Game Controller framework for third-party controllers and Magic Mouse/trackpad; automatic HDR calibration via EDR using `maximumExtendedDynamicRangeColorComponentValue` and auto-enabling HDR when `maximumPotential...` exceeds 2.0; head-tracked spatial audio for AirPods via AVAudioEngine's `listenerHeadTrackingEnabled`; and iCloud Drive with cross-platform saves."},{"t":1619,"title":"Next steps","body":"Garrett closes, encouraging trying the Game Porting Toolkit evaluation environment (no code, fast setup), using Metal HUD to evaluate performance, and building a great first-launch experience with optimized settings and native features like EDR and AirPods head-tracked spatial audio. Recommends 'Speedrun your game port with agentic coding' and 'Find and fix performance issues in your Metal games'."}],"code":[]},"related":[{"id":"330","title":"Optimize custom machine learning operations with Metal tensors","gloss":"用 Metal tensors 最佳化自訂機器學習運算","gloss_en":"Optimize custom machine learning operations with Metal tensors","category":"graphics","categoryLabel":"圖形與遊戲"},{"id":"357","title":"Speedrun your game port with agentic coding","gloss":"用代理式編碼加速遊戲移植","gloss_en":"Speedrun your game port with agentic coding","category":"graphics","categoryLabel":"圖形與遊戲"},{"id":"359","title":"Build real-time neural rendering pipelines with Metal","gloss":"用 Metal 打造即時神經渲染管線","gloss_en":"Build real-time neural rendering pipelines with Metal","category":"graphics","categoryLabel":"圖形與遊戲"},{"id":"388","title":"Find and fix performance issues in your Metal games","gloss":"找出並修復 Metal 遊戲的效能問題","gloss_en":"Find and fix performance issues in your Metal games","category":"graphics","categoryLabel":"圖形與遊戲"},{"id":"322","title":"Compose advanced graphics effects with SwiftUI","gloss":"用 SwiftUI 組合進階圖形效果","gloss_en":"Compose advanced graphics effects with SwiftUI","category":"swiftui","categoryLabel":"SwiftUI"}]}</script>
