<script id="d" type="application/json">{"s":{"id":"299","title":"Create robust evaluations for agentic apps","gloss":"為 agentic App 建立穩健的評估","category":"ai","categoryLabel":"AI 與機器學習","duration":1288,"url":"https://developer.apple.com/videos/play/wwdc2026/299/","takeaway":"運用 Evaluations 框架以 makeSamples 產生合成資料、驗證樣本，並用 TrajectoryExpectation 評估工具呼叫的順序與引數，打造穩健的 agentic 評估。","chapters":[[0,"Introduction"],[141,"The dataset problem in BookTracker"],[226,"Generating synthetic data with makeSamples"],[316,"Generate synthetic data with makeSamples"],[353,"Configure a custom SampleGenerator"],[387,"Customizing generation with SampleGenerator"],[518,"Sampling strategies"],[611,"Validating synthetic samples"],[637,"Validate generated samples"],[658,"Access valid and invalid results"],[784,"Comparing evaluation results"],[909,"Tool calling and tool evaluations"],[930,"Define a tool's Generable argument"],[997,"A basic trajectory expectation"],[1027,"Match arguments by intent (naturalLanguage)"],[1054,"Expect tool calls in order"],[1075,"Disallow specific tool calls"],[1094,"Build a tool call evaluation"],[1134,"Trajectory expectations"],[1160,"Synthesize tool-evaluation samples"],[1191,"Validate tool-evaluation samples"],[1286,"Building a tool call evaluation"],[1322,"Synthetic data for tool evaluations"],[1429,"Next steps"]],"points":[{"text":"用 **makeSamples** 與自訂 **SampleGenerator** 產生多樣化的**合成資料**，解決評估資料集不足的問題。","hot":true},{"text":"透過 **validator** 閉包驗證樣本，並可分別存取 valid 與 **invalidSamples**，再比較不同評估結果。","hot":false},{"text":"以 **TrajectoryExpectation** 與 **ToolExpectation** 評估工具呼叫，支援 ordered／unordered 與 disallowed。","hot":false},{"text":"引數比對提供 **.exact、.naturalLanguage、.keyOnly、.range、.contains** 等 matcher，可依語意而非字面匹配。","hot":false},{"text":"用 **ToolCallEvaluator** 搭配 Metric（allPass／percentagePass）建立完整的工具呼叫評估流程。","hot":false}],"apis":["Evaluations","makeSamples","SampleGenerator","ModelSample","TrajectoryExpectation","ToolExpectation","ToolCallEvaluator","Metric","Generable","Guide","PrivateCloudComputeLanguageModel"],"audience":"**建構 agentic 或工具呼叫型 AI 功能**、需要系統化評估模型行為與品質的開發者。","gloss_en":"Create robust evaluations for agentic apps","takeaway_en":"Use the Evaluations framework to generate synthetic data with makeSamples, validate samples, and assess the order and arguments of tool calls with TrajectoryExpectation to build robust agentic evaluations.","points_en":[{"text":"Use **makeSamples** with a custom **SampleGenerator** to generate diverse **synthetic data**, solving the problem of insufficient evaluation datasets.","hot":true},{"text":"Validate samples with a **validator** closure, access valid and **invalidSamples** separately, and compare different evaluation results.","hot":false},{"text":"Evaluate tool calls with **TrajectoryExpectation** and **ToolExpectation**, supporting ordered/unordered and disallowed.","hot":false},{"text":"Argument matching offers matchers like **.exact, .naturalLanguage, .keyOnly, .range, .contains**, matching by meaning rather than literal text.","hot":false},{"text":"Use **ToolCallEvaluator** with a Metric (allPass/percentagePass) to build a complete tool-call evaluation flow.","hot":false}],"audience_en":"**Developers building agentic or tool-calling AI features** who need to systematically evaluate model behavior and quality.","summary":["本場由 Evaluations 團隊的 Ada 與 Kyle 主講，聚焦 **Evaluations 框架**的進階用法，目標是為智慧型（intelligence-powered）功能打造穩固且可擴充的評估。框架是 Xcode 27 的新成員，支援 macOS、iOS、watchOS 與 visionOS。內容延續 hill-climbing 流程中的 Develop 與 Evaluate 步驟，分兩大主題：用合成資料擴充評估資料集，以及為含 **tool calling** 的代理式（agentic）工作流建立評估。","第一部分以 BookTracker（依書評自動產生標籤的個人書庫 App）說明「資料集問題」：手寫的 13 筆樣本只能看見功能表現的一小角，評估結果可能漂亮卻具誤導性。框架提供純程式碼的合成資料 API：最簡單的 **makeSamples** 需要 prompt、初始 dataset 與 targetCount（含初始樣本在內的最終總量），回傳一串非同步產生的新樣本；預設使用裝置端模型。需要更多控制時改用 **SampleGenerator**，可透過 **sessionProvider** 指定模型（例如 context 較大的 **PrivateCloudComputeLanguageModel**）與系統指令；框架自動處理 batch size，並在 context window 用盡時重新呼叫 sessionProvider，因此指令必須自足。還能設定 **samplingStrategy**（random 或 sliding window）決定如何挑選 in-context 範例，並用 **validator** 閉包逐筆驗證（如書評至少 100 字、3–8 個標籤、全小寫），有效樣本進 samples、失敗的自動歸入 invalidSamples。","把資料集從 13 筆擴到 100 筆後，用 Xcode 27 新的 **Evaluations Report** 與 **Compare** 功能比較，分數如預期下滑——這揭示原本只是因資料不夠全面才顯得表現良好。分數變化可能來自 prompt/指令問題、功能本身的缺口、評估設計，或資料仍不夠代表性，可繼續用合成資料 API 增量或補邊界案例。","第二部分由 Kyle 講 **tool 評估**：模型可能給出聽起來合理卻沒呼叫正確工具的答案，因此要驗證「怎麼做」而非只看「做出什麼」。核心是 **TrajectoryExpectation**，它檢查一段 LanguageModelSession transcript 中工具呼叫的種類與順序。可用 unordered／ordered 表達是否在意順序、用 **disallowed** 指定不該出現的工具，並以多種 argument matcher 比對參數：**.exact**、**.naturalLanguage**（比對意圖而非字串）、.keyOnly、.range、.contains 等。完整評估用 **ToolCallEvaluator** 把 LanguageModelSession 與工具組合、取得回應並擷取結構化 transcript 來計分。由於 TrajectoryExpectation 也是 Generable，同樣能用 SampleGenerator 合成 tool 評估樣本，但須在指令中說明可用工具、順序與情境，並以 validator 確認每筆都有 expectation、至少含一個工具、且工具名皆屬已定義集合。把書籤標籤評估（檢查產出）與 tool 評估（檢查路徑）放進同一套件，即可對功能建立端到端信心。"],"deepdive":[{"t":0,"title":"Introduction","body":"Ada 與 Kyle 介紹 **Evaluations 框架**——在 Swift App 中評估智慧型功能、追蹤長期改善並確保上線品質的方式，為 **Xcode 27** 新增、支援 macOS／iOS／watchOS／visionOS。本場聚焦如何處理評估的複雜度與可擴充性，分為合成資料與 tool 評估兩大主題，並建議先看「Meet the Evaluations framework」與 hill climbing 兩部影片。"},{"t":141,"title":"The dataset problem in BookTracker","body":"以 **BookTracker**（依書評自動產生標籤的個人書庫 App）為例，Book 類別含 title、author、review、tags、rating，並有 13 筆 sampleBooks。講者指出這 13 筆只能呈現功能表現的一小角——書籍、類型與書寫方式千變萬化，小資料集無法涵蓋，評估結果可能看似亮眼卻誤導。"},{"t":226,"title":"Generating synthetic data with makeSamples","body":"提出以合成資料解決資料集問題。框架以純程式碼定義樣本生成，支援文字資料並透過 **@Generable** 巨集產生結構化合成資料，可自建生成流程、由命令列執行或接進既有工作流。"},{"t":316,"title":"Generate synthetic data with makeSamples","body":"**makeSamples** 需要三項：prompt、dataset 與 targetCount。範例 prompt 要求模型產生涵蓋多元類型、年代、文化與讀者樣貌的書評；dataset 傳入 13 筆 sampleBooks，以新的 **ModelSample** 把書評當 prompt、標籤當 expected。targetCount 設 100，但因為它是「含初始樣本的最終總量」，模型實際只會新生成 87 筆。"},{"t":353,"title":"Configure a custom SampleGenerator","body":"預設用裝置端模型生成已適用多數情況，但若想自帶模型或自訂指令，框架提供 **SampleGenerator** 給予完整控制。本章引入超越 prompt／dataset／targetCount 的進階配置入口。"},{"t":387,"title":"Customizing generation with SampleGenerator","body":"重點是 **sessionProvider**——回傳 LanguageModelSession 的閉包，用來決定驅動生成的模型與系統指令；範例採 context 較大的 **PrivateCloudComputeLanguageModel** 並寫入規則（書評至少 100 字、3–8 個小寫標籤等）。框架自動管理 batch size，生成開始時呼叫一次 sessionProvider 並跨批次重用以維持 context；若 context window 中途耗盡會擲錯並重新取得一個全新（無前文）session，因此指令必須自足。"},{"t":518,"title":"Sampling strategies","body":"**samplingStrategy** 控制如何從初始 dataset 挑選展示給模型的 in-context 範例。**random** 隨機挑不重複的子集，適合初始樣本無特定順序時；**sliding window** 依序逐步走過樣本並跳過重複，適合資料有意義順序時。本例因初始樣本無意義順序而用 random，也是預設值故無需明寫。"},{"t":611,"title":"Validating synthetic samples","body":"即使在 sessionProvider 指令裡寫了規則，也不保證輸出真的遵守，因此用 **validator** 閉包逐筆接受或拒絕生成樣本。validator 是「逐筆隔離」驗證、無法看到其他樣本，所以多元性與跨樣本的長度分布等需要更多判斷，無法只靠它檢查。"},{"t":637,"title":"Validate generated samples","body":"把規則拆成可系統化檢查的項目：書評至少 100 字（以 Frankenstein 為例示範長度檢查）、標籤數量介於 3 到 8 之間、所有標籤皆為小寫。這三項已定義為 SampleGenerator 的驗證 metric，用來確認樣本符合預期結構。"},{"t":658,"title":"Access valid and invalid results","body":"生成過程中通過驗證的樣本收進 generator 的 **samples** 屬性，未通過者自動歸入 **invalidSamples**；兩者即時更新，可在迭代中（檢查進度）或迴圈結束後存取。結果可直接用於 App 或在本地存成資料集。"},{"t":784,"title":"Comparing evaluation results","body":"Xcode 27 新增 **Evaluations Report** 視覺化結果。先看 13 筆樣本的 BookTaggingEvaluation（相關性與實用性分數很高），再用 **Compare** 與 100 筆新資料集比較，分數如預期下滑。這代表先前的好表現只是因為沒用更全面的資料集測試。"},{"t":909,"title":"Tool calling and tool evaluations","body":"Kyle 接手 **tool 評估**。當 App 變複雜、需要多個步驟才能完成像搜尋這樣的任務時就會用到工具；模型可能給出聽起來合理卻沒呼叫正確工具的答案，最終輸出看似正確但取得路徑不對。tool 評估讓你驗證「怎麼做」——正確的工具、正確的參數、正確的順序，並檢查中途有無非預期的工具呼叫。"},{"t":930,"title":"Define a tool's Generable argument","body":"BookTracker 加入 library assistant，串接 **searchBooks**、**getBookDetails**、**findSimilarBooks** 多個自訂工具。以 SearchBooksTool 為例，它符合 Tool 協定、有名稱與描述，參數是 **@Generable** struct 且全為 optional，讓模型依使用者意圖決定填哪些篩選（例如「找 gothic 書」填 tag、「找開心的」生成 mood 搜尋）。"},{"t":997,"title":"A basic trajectory expectation","body":"tool 評估的主角是 **TrajectoryExpectation**，它檢查一段 session transcript 中每個工具呼叫的種類與順序——像檢視規劃路線時做過的決策清單。最簡單的例子：prompt「Find books tagged gothic」期望一次 searchBooks 呼叫，用 **unordered** 表示不在意何時發生、只在意它發生。"},{"t":1027,"title":"Match arguments by intent (naturalLanguage)","body":"可在 expectation 加 arguments 進一步約束。**.exact** 比對精確值（如 tag「gothic」），但精確比對未必合適——prompt「Find something cheerful」時模型可能傳 uplifting／happy／cheerful，此時用 **.naturalLanguage** 比對意圖而非字串，並提供判定 criteria。框架另有 .contains、.oneOf、.pattern、.range 等多種 matcher。"},{"t":1054,"title":"Expect tool calls in order","body":"多步驟任務需要順序。用 **ordered** 指定模型必須先呼叫 searchBooks、再呼叫 getBookDetails；若代理先取詳情就還沒有 bookId，那是個 bug，而 TrajectoryExpectation 因為檢查的是「過程」而非只看終點，能抓到這種錯。"},{"t":1075,"title":"Disallow specific tool calls","body":"有時「不該做什麼」同樣重要。當 prompt 含「別找相似書」之類意圖時，模型應遵守，**disallowed** 參數指定不得出現在 transcript 中的工具；若代理仍呼叫了 findSimilarBooks，即判定失敗。"},{"t":1094,"title":"Build a tool call evaluation","body":"把各種 trajectory expectation 整合進完整評估：定義一組各含 prompt 與 TrajectoryExpectation 的樣本，用 **ToolCallEvaluator** 計分。ToolCallEvaluator 會把 LanguageModelSession 與工具結合、取得回應並擷取結構化 transcript，結果顯示在 Xcode assistant 中與其他結果並陳。"},{"t":1134,"title":"Trajectory expectations","body":"本章彙整 TrajectoryExpectation 的能力——它在 transcript 中找出所有工具呼叫，再逐一對照你寫進評估的 ordered／unordered／disallowed 與 argument matcher，全面驗證代理的決策路徑而非只看最終輸出。"},{"t":1160,"title":"Synthesize tool-evaluation samples","body":"由於 ModelSample 與 **TrajectoryExpectation 也是 Generable**，可像先前一樣用 SampleGenerator 合成更多 tool 評估樣本。關鍵差異是模型不知道你定義了哪些工具或順序需求，因此 sessionProvider 的指令須明列可用工具、用途、順序期望與其他必要情境，並用既有 dataset 當初始樣本、targetCount 設 100。"},{"t":1191,"title":"Validate tool-evaluation samples","body":"為 tool 評估樣本指定驗證 metric：每筆都必須有 expectations、至少參照一個工具（ordered 與 unordered 數量相加大於 0），且所有被參照的工具名都屬於已定義的有效集合（searchBooks、getBookDetails、findSimilarBooks）。如此即可合成並驗證 tool 評估樣本。"},{"t":1286,"title":"Building a tool call evaluation","body":"回到整合視角：稍早建的書籤標籤評估檢查「模型產出什麼」（標籤數、類型涵蓋、品質分數），tool 評估檢查「模型怎麼達成」（正確工具、參數、順序）。把兩者放進同一評估套件執行，即可對功能建立端到端的信心。"},{"t":1322,"title":"Synthetic data for tool evaluations","body":"再次強調合成資料 API 在 tool 評估上的威力：因 TrajectoryExpectation 為 Generable，可大幅簡化原本複雜的 tool 評估資料集擴充；資料越具代表性，分數就越貼近真實。"},{"t":1429,"title":"Next steps","body":"結語鼓勵把這些做法應用到自己的 App 與評估資料集：試著製作合成資料、評估 App 中的自訂工具，並查閱範例 App 與開發者文件中的相關文章，將檢查「產出」與檢查「路徑」結合以提升評估的穩固度。"}],"summary_en":["Presented by Ada and Kyle from the Evaluations team, this session covers advanced use of the **Evaluations framework** to build robust, scalable evaluations for intelligence-powered features. New in Xcode 27, the framework supports macOS, iOS, watchOS, and visionOS. Continuing the hill-climbing process's Develop and Evaluate steps, it has two themes: growing your evaluation dataset with synthetic data, and building evaluations for agentic workflows that involve **tool calling**.","The first part uses BookTracker — a personal library app that auto-tags books from reviews — to frame the dataset problem: 13 hand-written samples give only a narrow window, so results can look great yet mislead. The framework exposes code-first synthetic-data APIs. The simplest, **makeSamples**, takes a prompt, an initial dataset, and a targetCount (the final total including your starting samples) and returns an async stream of new samples, using the on-device model by default. For more control, **SampleGenerator** lets you set a **sessionProvider** to choose the model (e.g. the larger-context **PrivateCloudComputeLanguageModel**) and system instructions; the framework manages batch size and re-calls sessionProvider if the context window is exhausted mid-run, so instructions must be self-contained. You can also set a **samplingStrategy** (random or sliding window) for in-context examples and a **validator** closure to check each sample in isolation (review ≥100 chars, 3–8 tags, all lowercase); valid samples go to samples and failures to invalidSamples automatically.","After expanding from 13 to 100 samples, the new Xcode 27 **Evaluations Report** and **Compare** show the scores drop as expected — revealing the earlier feature only looked good because it wasn't tested comprehensively. Score changes could signal prompt/instruction issues, gaps in the feature, the evaluation design, or a dataset that's still not representative, which you can keep improving with the synthetic-data APIs.","In the second part Kyle covers **tool evaluations**: a model can give a reasonable-sounding answer without ever calling the right tool, so you must verify the how, not just the what. The core is a **TrajectoryExpectation**, which checks the kind and order of tool calls in a LanguageModelSession transcript. Use unordered/ordered to express whether sequence matters, **disallowed** to forbid tools, and argument matchers — **.exact**, **.naturalLanguage** (matching intent not exact string), .keyOnly, .range, .contains and more. A full evaluation uses **ToolCallEvaluator** to combine a LanguageModelSession with the tools, get a response, and capture the structured transcript for scoring. Because TrajectoryExpectation is Generable, you can synthesize tool-evaluation samples with SampleGenerator too — but your instructions must spell out available tools, order, and context, and a validator should confirm each sample has expectations, references at least one tool, and uses only defined tool names. Running tag evaluations (checking output) and tool evaluations (checking the path) in one suite gives end-to-end confidence in the feature."],"deepdive_en":[{"t":0,"title":"Introduction","body":"Ada and Kyle introduce the **Evaluations framework** — a way to assess intelligence features in Swift apps, track improvements, and ensure production quality — new in **Xcode 27** and supporting macOS/iOS/watchOS/visionOS. The session targets complexity and scalability, split into synthetic data and tool evaluations, and points to the \"Meet the Evaluations framework\" and hill-climbing videos for fundamentals."},{"t":141,"title":"The dataset problem in BookTracker","body":"Using **BookTracker** (auto-tags books from reviews), the Book class holds title, author, review, tags, and rating, with 13 sampleBooks. The presenters stress those 13 samples give only a narrow view — books, genres, and review styles vary enormously — so a small dataset can't capture the variety and results may look great yet mislead."},{"t":226,"title":"Generating synthetic data with makeSamples","body":"Synthetic data is proposed as the answer. The framework defines sample generation entirely in code, supports text data, and uses the **@Generable** macro to produce structured synthetic data, so you can build a pipeline, run it from the command line, or plug it into existing workflows."},{"t":316,"title":"Generate synthetic data with makeSamples","body":"**makeSamples** needs three things: a prompt, a dataset, and a targetCount. The example prompt asks for diverse reviews across genres, eras, cultures, and reader personas; the dataset is the 13 sampleBooks wrapped as **ModelSample** (review as prompt, tags as expected). targetCount is 100, but since it's the final total including starting samples, the model actually generates 87 new ones."},{"t":353,"title":"Configure a custom SampleGenerator","body":"The on-device model suits most cases, but to bring your own model or customize instructions the framework provides **SampleGenerator** for full control over generation, introducing configurations beyond prompt/dataset/targetCount."},{"t":387,"title":"Customizing generation with SampleGenerator","body":"The key is **sessionProvider** — a closure returning a LanguageModelSession that sets which model drives generation and the system instructions; the example uses the larger-context **PrivateCloudComputeLanguageModel** with rules (review ≥100 chars, 3–8 lowercase tags, etc.). The framework auto-manages batch size and reuses one session across batches, but if the context window is exhausted mid-run it throws and gets a fresh session with no prior context — so instructions must be self-contained."},{"t":518,"title":"Sampling strategies","body":"**samplingStrategy** controls how in-context examples are picked from the initial dataset. **random** selects a non-duplicate subset, good when initial samples have no meaningful order; **sliding window** steps through samples sequentially, skipping duplicates, for ordered datasets. The example uses random — also the default, so it isn't stated explicitly — since its samples aren't meaningfully ordered."},{"t":611,"title":"Validating synthetic samples","body":"Rules in the sessionProvider instructions don't guarantee compliant output, so a **validator** closure accepts or rejects each generated sample. The validator runs per-sample in isolation with no view of other samples, so diversity and cross-sample length distribution need more judgment and can't be checked by it alone."},{"t":637,"title":"Validate generated samples","body":"Rules are turned into systematically checkable items: review at least 100 characters (demoed with Frankenstein), tag count between 3 and 8, and all tags lowercase. These three validation metrics are defined on the SampleGenerator to confirm samples meet the expected structure."},{"t":658,"title":"Access valid and invalid results","body":"During a run, samples passing validation collect in the generator's **samples** property while failures go automatically to **invalidSamples**; both update in real time and can be accessed mid-iteration (to check progress) or after the loop. Results can be used directly in the app or saved locally as a dataset."},{"t":784,"title":"Comparing evaluation results","body":"Xcode 27 adds an **Evaluations Report** to visualize results. The 13-sample BookTaggingEvaluation scores high on relevance and usefulness, but the **Compare** button against the 100-sample dataset shows the scores drop as expected — proving the earlier strong performance only reflected an insufficiently comprehensive dataset."},{"t":909,"title":"Tool calling and tool evaluations","body":"Kyle takes over for **tool evaluations**. As an app grows complex and needs multiple steps to complete a task like search, tools come in; a model may give a reasonable-sounding answer without calling the right tool, so the output can look correct while the path is wrong. Tool evaluations verify the how — correct tools, correct arguments, correct order — and check for unexpected tool calls along the way."},{"t":930,"title":"Define a tool's Generable argument","body":"BookTracker adds a library assistant chaining **searchBooks**, **getBookDetails**, and **findSimilarBooks**. SearchBooksTool conforms to the Tool protocol with a name and description, and its arguments are a **@Generable** struct of all-optional fields, letting the model choose filters by intent (e.g. \"find gothic books\" populates tag; \"something cheerful\" generates a mood search)."},{"t":997,"title":"A basic trajectory expectation","body":"The main component is a **TrajectoryExpectation**, which checks the kind and order of each tool call in a session transcript — like reviewing the list of decisions you made planning a route. The simplest case: prompt \"Find books tagged gothic\" expects one searchBooks call, with **unordered** meaning you don't care when it happens, just that it does."},{"t":1027,"title":"Match arguments by intent (naturalLanguage)","body":"Arguments refine the expectation. **.exact** matches a precise value (tag \"gothic\"), but exact isn't always right — for \"Find something cheerful\" the model might pass uplifting/happy/cheerful, so **.naturalLanguage** matches intent rather than the exact string, with judging criteria. Other matchers include .contains, .oneOf, .pattern, and .range."},{"t":1054,"title":"Expect tool calls in order","body":"Multistep tasks need order. **ordered** requires searchBooks before getBookDetails; if an agent gets details first it has no bookId yet — a bug — and TrajectoryExpectation catches it because it checks the journey, not just the destination."},{"t":1075,"title":"Disallow specific tool calls","body":"Sometimes what an agent shouldn't do matters just as much. When a prompt says something like don't look for similar books, the model should comply; the **disallowed** parameter names tools that must not appear in the transcript, and if the agent calls findSimilarBooks anyway it's a failure."},{"t":1094,"title":"Build a tool call evaluation","body":"The trajectory expectations come together in a full evaluation: define a dataset of samples each with a prompt and a TrajectoryExpectation, and score them with **ToolCallEvaluator**. It combines a LanguageModelSession with the tools, gets a response, captures the structured transcript, and surfaces results in the Xcode assistant alongside the rest."},{"t":1134,"title":"Trajectory expectations","body":"This chapter ties together what trajectory expectations do — they find all tool calls in the transcript and run each against the ordered/unordered/disallowed rules and argument matchers you wrote, verifying the agent's decision path rather than just the final output."},{"t":1160,"title":"Synthesize tool-evaluation samples","body":"Because ModelSample and **TrajectoryExpectation are Generable**, you can synthesize more tool-evaluation samples with SampleGenerator as before. The key difference: the model doesn't know your tools or order requirements, so the sessionProvider instructions must list available tools, their purpose, order expectations, and other context, using the existing dataset as initial samples with a targetCount of 100."},{"t":1191,"title":"Validate tool-evaluation samples","body":"Validation metrics for tool-evaluation samples: each must have expectations, must reference at least one tool (ordered plus unordered count greater than 0), and all referenced tool names must belong to the defined valid set (searchBooks, getBookDetails, findSimilarBooks). That covers synthesizing and validating tool-evaluation samples."},{"t":1286,"title":"Building a tool call evaluation","body":"Back to the integrated view: the earlier book-tagging evaluation checks what the model produces (tag count, genre coverage, quality scores), while tool evaluations check how it gets there (right tools, arguments, order). Running both in the same evaluation suite builds end-to-end confidence in the feature."},{"t":1322,"title":"Synthetic data for tool evaluations","body":"The session reiterates the power of synthetic-data APIs for tool evaluations: because TrajectoryExpectation is Generable, expanding an otherwise complex tool-evaluation dataset is much easier, and the more representative the data, the more the scores reflect reality."},{"t":1429,"title":"Next steps","body":"The closing encourages applying these ideas to your own apps and datasets: make your own synthetic data, evaluate your app's custom tools, and check the sample app and developer documentation, combining checks on output with checks on the path to make evaluations more robust."}],"code":[]},"related":[{"id":"298","title":"Meet the Evaluations framework","gloss":"認識 Evaluations 框架","gloss_en":"Meet the Evaluations framework","category":"ai","categoryLabel":"AI 與機器學習"},{"id":"241","title":"What’s new in the Foundation Models framework","gloss":"Foundation Models 框架的新功能","gloss_en":"What's new in the Foundation Models framework","category":"ai","categoryLabel":"AI 與機器學習"},{"id":"246","title":"LLM search using Core Spotlight","gloss":"使用 Core Spotlight 的 LLM 搜尋","gloss_en":"LLM search using Core Spotlight","category":"ai","categoryLabel":"AI 與機器學習"},{"id":"319","title":"Build with the new Apple Foundation Model on Private Cloud Compute","gloss":"在 Private Cloud Compute 上使用全新 Apple Foundation Model 開發","gloss_en":"Build with the new Apple Foundation Model on Private Cloud Compute","category":"ai","categoryLabel":"AI 與機器學習"},{"id":"242","title":"Build agentic app experiences with the Foundation Models framework","gloss":"用 Foundation Models 框架打造 agentic App 體驗","gloss_en":"Build agentic app experiences with Foundation Models","category":"ai","categoryLabel":"AI 與機器學習"}]}</script>
