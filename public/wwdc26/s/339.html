<script id="d" type="application/json">{"s":{"id":"339","title":"Bring an LLM provider to the Foundation Models framework","gloss":"把 LLM 供應商接入 Foundation Models 框架","category":"ai","categoryLabel":"AI 與機器學習","duration":1241,"url":"https://developer.apple.com/videos/play/wwdc2026/339/","takeaway":"實作 LanguageModel 與 LanguageModelExecutor，把自家或開源 LLM 接入 Foundation Models，串流 token、對應 Transcript、處理錯誤並支援自訂段落與伺服器端工具。","chapters":[[0,"Introduction"],[120,"Choose a language model"],[217,"Packaging"],[226,"Configure Package.swift for your model package"],[288,"Protocol"],[296,"LanguageModel and LanguageModelExecutor protocols"],[385,"Implement LanguageModel and Executor conformances"],[448,"Manage model resources with prewarm and respond"],[540,"Map Transcript entries to model messages"],[642,"Read generation and context options from the request"],[707,"Stream tokens and metadata through the channel"],[813,"Honor the developer's intent or throw"],[837,"Built-in errors that any model can throw"],[854,"Handle errors from your model executor"],[890,"Authentication"],[951,"Customization"],[968,"Attach custom metadata to responses"],[1025,"Define and use custom Transcript segments"],[1089,"Implement server-side tools in your model"],[1187,"Next steps"]],"points":[{"text":"可選擇多種模型來源：on-device、**Private Cloud Compute**、Core AI 或從 HuggingFace 來的開源 **MLX** 模型。","hot":false},{"text":"透過實作 **LanguageModel** 與 **LanguageModelExecutor** 協定，把新模型接入 Foundation Models 框架。","hot":true},{"text":"以 **prewarm／respond** 管理模型資源，並把 **Transcript** 條目對應成模型訊息。","hot":false},{"text":"透過 channel **串流 token 與 metadata**，回報用量；無法滿足需求時拋出 **LanguageModelError**。","hot":false},{"text":"支援**自訂 Transcript 段落**與**伺服器端工具**（如 web search），擴充回應內容。","hot":false}],"apis":["FoundationModels","LanguageModel","LanguageModelExecutor","LanguageModelSession","SystemLanguageModel","MLXLanguageModel","Transcript","LanguageModelError","Transcript.CustomSegment"],"audience":"**想把自家或第三方 LLM 整合進 Apple Foundation Models 框架的開發者與模型供應商**。","gloss_en":"Bring an LLM provider to the Foundation Models framework","takeaway_en":"Implement LanguageModel and LanguageModelExecutor to bring your own or open-source LLMs into Foundation Models, streaming tokens, mapping the Transcript, handling errors, and supporting custom segments and server-side tools.","points_en":[{"text":"Choose from multiple model sources: on-device, **Private Cloud Compute**, Core AI, or open-source **MLX** models from HuggingFace.","hot":false},{"text":"Bring new models into the Foundation Models framework by implementing the **LanguageModel** and **LanguageModelExecutor** protocols.","hot":true},{"text":"Manage model resources with **prewarm / respond**, and map **Transcript** entries into model messages.","hot":false},{"text":"**Stream tokens and metadata** through a channel and report usage; throw a **LanguageModelError** when a request can't be satisfied.","hot":false},{"text":"Support **custom Transcript segments** and **server-side tools** (such as web search) to extend response content.","hot":false}],"audience_en":"**Developers and model providers who want to integrate their own or third-party LLMs into Apple's Foundation Models framework**.","summary":["這場由 Machine Learning Research 團隊的 Christopher Webb 主講，核心訊息是 **Foundation Models** 框架不再只服務 Apple 的內建模型，而是開放給「幾乎任何 LLM」——本地或伺服器端皆可。除了重新打造、更聰明且能直接吃影像的 **System Language Model**，框架還新增了具推理與 32K context 的 **Private Cloud Compute**、可吃 ANE 跑本地模型的 **Core AI**，以及解鎖 Hugging Face 上數千個社群模型的 **MLX**。關鍵在於這些都建立在一個全新的公開協定上，因此 Anthropic（Claude）與 Google（Gemini）很快也會以各自的 Swift package 擴充框架。對 app 開發者而言重點是：不論用哪個模型，呼叫方式完全一樣——只要換掉 model 物件即可。","對「模型提供者」而言，把模型帶進框架分成四步：**packaging、protocol、authentication、customization**。打包建議用 Swift Package Manager，並儘量支援 iOS／macOS／visionOS／watchOS（甚至因框架開源而支援 Linux），同時謹慎控制 dependencies，因為每個相依都是使用者要下載的位元組；發佈只需打一個 git tag。協定是模型與框架之間的橋樑，分兩塊：**`LanguageModel`** 描述模型（capabilities 與 executorConfiguration），**`LanguageModelExecutor`** 才是真正幹活的地方（init、prewarm、respond）。框架會用 model 提供的 **Configuration**（Hashable）作為查找鍵，在每個 session 的 executor store 中快取對應的 executor，相同 configuration 解析到同一個 executor。","executor 的工作是把對話 **Transcript**（六種 entry：instructions、prompt、toolCalls、toolOutput、response、reasoning 等）翻譯成模型原生的 message 格式，並從每個 request 讀出 **ContextOptions**（reasoning level、schema）與 **GenerationOptions**（sampling、temperature、最大 token 數）。回傳時透過 channel 串流事件，且有刻意的順序：先送 metadata（model／request ID 供 logging）、再送 usage（prompt token 計數），最後逐 token 送 textDelta 讓使用者看到逐字浮現。stateful 整合（KV cache 或持久連線）可比對新舊 transcript，只處理 append 的新內容，若 entry 被刪改則回退到分歧點。當模型無法滿足開發者意圖時，原則是「能近似就近似、不能就 throw」，框架提供內建 **`LanguageModelError`**（context 溢位、rate limit、refusal 等），僅在只有你的服務才會發生的失敗時才自訂 error。","authentication 部分強調讓開發者「容易做對的事」：別只收 API key 字串，改提供 token provider 或登入流程，並用 **Keychain** 安全保存 token；雲端模型還應做 **device attestation**（見「Secure your apps with App Attest」）。最後是 customization：可用 response metadata 附帶 tokensPerSecond 等資訊、用 **custom segments** 擴充協定支援新模態（如音訊），並為 web search、程式碼執行、圖片生成等 **server-side tools** 設計三種揭露層級——僅回傳答案、附帶 citation metadata，或透過 custom segment 把工具的結構化產出整個攤給 app。講者也提醒，鏈上每個人都要清楚模型的隱私特性（on-device 與 cloud 差異極大）。"],"deepdive":[{"t":0,"title":"Introduction","body":"由 Machine Learning Research 團隊工程師 Christopher Webb 開場，宣布 **Foundation Models** 框架從只提供 Apple 內建模型，擴大到能搭配「幾乎任何 LLM」，本地或伺服器端皆可。內建 **System Language Model** 已重新打造，更聰明、更擅長指令遵循、並能直接在 prompt 吃影像。另新增 **Private Cloud Compute**（含推理與 32K context）、可用 ANE 的 **Core AI**、以及解鎖 Hugging Face 社群模型的 **MLX**。"},{"t":120,"title":"Choose a language model","body":"因為這些選項都建立在全新的公開協定上，開發者能用同一套框架引進前沿模型；**Anthropic 的 Claude** 與 **Google 的 Gemini** 很快會以各自的 Swift package 擴充框架。預覽顯示用法極簡：建立 on-device model、傳進 session、呼叫 respond；要更多算力換成 **Private Cloud Compute**、要出貨自家模型把 **Core AI** 指向資源、要試開源模型則傳入 model ID。所有模型都遵循同一個 **LanguageModel** 協定，因此能輕易互換並取得 Dynamic Profiles 等功能。"},{"t":217,"title":"Packaging","body":"把模型帶進框架共四步：**packaging、protocol、authentication、customization**。本段先談打包——一個精心設計的 Swift package 能讓開發者輕鬆上手。"},{"t":226,"title":"Configure Package.swift for your model package","body":"建議用 **Swift Package Manager**，讓開發者把你的 package 直接加為 app 的相依。要考慮支援哪些平台——框架支援 iOS／macOS／visionOS／watchOS，建議比照辦理，且因框架開源也可考慮支援 **Linux**（伺服器端 Swift）。每個 **dependency** 都是使用者要下載的位元組，務必謹慎；發佈只需建立一個 **git tag**，因 SPM 去中心化，你的 repo URL 就是發行管道。"},{"t":288,"title":"Protocol","body":"協定是你的模型與 Foundation Models 框架之間的橋樑，是把模型接進來的核心步驟。"},{"t":296,"title":"LanguageModel and LanguageModelExecutor protocols","body":"協定分兩塊：**`LanguageModel`** 向框架描述模型——透過 capabilities 宣告能力，並提供框架建立 executor 所需的 configuration；**`LanguageModelExecutor`** 是真正幹活的地方，有吃 Configuration 的 init、用於事先準備資源的 prewarm，以及把生成串流回 session 的 respond。**Configuration** 是連接兩者的關鍵：Model 提供它、框架用它來建構 executor。"},{"t":385,"title":"Implement LanguageModel and Executor conformances","body":"每個 session 持有一個 **executor store**：當 Model 到來，框架用其 configuration 查 store，沒有對應的 executor 就新建並存入。因 **Configuration 是 Hashable**，相同 configuration 會解析到同一個 executor，不同的則各有一個——查找鍵是 configuration 而非 model。程式上 LanguageModel 宣告 capabilities 並回傳 configuration，executor 才負責載入權重、管理資源與串流 token；session 釋放時 store 連同所有 executor 自動釋放、deinit 執行、權重釋放、連線關閉，開發者無需自寫拆解程式。"},{"t":448,"title":"Manage model resources with prewarm and respond","body":"executor 還有 **prewarm**：在 request 抵達前，開發者可請框架預熱，讓你預先做昂貴設定（載入權重、開啟連線）以免拖慢首個回應。一種作法是把設定放進一個只載入一次並快取的私有 helper，prewarm 提前呼叫它；但 **prewarm 不保證執行**，無論如何權重都只載入一次，而像伺服器後端這種無昂貴設定的模型，prewarm 可直接是 no-op。"},{"t":540,"title":"Map Transcript entries to model messages","body":"respond 被呼叫時，executor 居中把 **Transcript**（至今的對話，由一連串 entry 組成）翻譯成推論引擎能讀的原生 message，回傳時再反向翻譯串回 session。Foundation Models 定義六種 entry 類型，模型則有自己的 role；executor 的工作就是兩者間映射，例如把 instructions／prompt／response 對到 system／user／assistant，把 toolCalls、toolOutput、reasoning 都對到 assistant（若模型有專屬 tool role 也可改路由過去）。"},{"t":642,"title":"Read generation and context options from the request","body":"每個 request 除了歷史，還帶有開發者對「該如何回應」的意圖，由兩個屬性表達：**ContextOptions** 控制進到 prompt 的內容（如 reasoning level 或 response schema），**GenerationOptions** 控制解碼迴圈（sampling 策略、temperature、最大回應長度）。在 respond 內把兩種 options 從 request 取出，於呼叫模型時一併傳入。"},{"t":707,"title":"Stream tokens and metadata through the channel","body":"回應端透過 channel 送出事件，每個 chunk（token 或 tool-call 片段）成為一個 textDelta、toolCallDelta 等事件，框架寫入 transcript；一次性與串流 API 都以串流實作，one-shot 只是內部收集 deltas。順序是刻意的：先送 **metadata**（model／request ID 供 logging 與除錯）、再送 **usage**（prompt token 計數供計費），最後每產生一個 token 就立刻送 **textDelta**，讓使用者看到回應逐字浮現而非一次全出。"},{"t":813,"title":"Honor the developer's intent or throw","body":"stateful 整合（持有 KV cache 或持久 session）能靠框架依 configuration 快取 executor 來保存跨呼叫的工作。executor 每次都收到完整 transcript，可比對新舊：多半只是 append 了新 entry，便可保留既有狀態只處理新增；若發現 entry 被刪改（如開發者裁修舊內容），則回退到分歧點重算。當模型無法完全照辦時——能近似就近似、honor 開發者意圖，無法時就 **throw**（例如 token 預算太小無法滿足 schema 的必填欄位）。"},{"t":837,"title":"Built-in errors that any model can throw","body":"Foundation Models 提供內建的 **`LanguageModelError`** 涵蓋常見情況：context window 溢位、rate limit、refusal、guardrail violation、unsupportedCapability、unsupportedTranscriptContent、timeout 等。丟出其中之一，任何用過框架的開發者都已知道如何處理。"},{"t":854,"title":"Handle errors from your model executor","body":"當內建錯誤不夠用時可自訂 error 類型——有些失敗只在你的服務情境中才有意義（訂閱層級、帳號狀態、功能授權），有意義的 case 名稱能讓開發者一接到就明白發生什麼。但每個自訂錯誤都是開發者要額外學習、catch、處理的負擔，因此能用內建 **LanguageModelError** 就優先用，自訂留給只有你的服務才會產生的失敗。"},{"t":890,"title":"Authentication","body":"你身為 package 作者的任務是讓開發者「容易做對的事」。若 init 只收 API key 字串，開發者會走捷徑；應改提供 **token provider 或登入流程**。若你的 package 代開發者取得 access token，務必用 **Keychain** 安全保存。憑證只是一半，另一半是 **device attestation**——若要出貨雲端模型 package，建議深入「Secure your apps with App Attest」，了解驗證裝置、攔截被竄改的 build、簽署 payload 與運用 Apple 詐欺訊號。"},{"t":951,"title":"Customization","body":"完成打包、協定、authentication 後就有了基礎扎實的 package，接著是差異化。協定保留空間讓你圍繞只有你的模型才有的能力來形塑 **LanguageModelSession**——從附加 response metadata，一路到定義全新的模態。"},{"t":968,"title":"Attach custom metadata to responses","body":"**Response metadata** 是輕量選項，可在回應上附加額外資訊並給開發者清楚的存取方式。範例中串流結束後 executor 透過 channel 送出 **tokensPerSecond** 與 **timeToFirstToken**。底層 metadata 就是個字典，可裝字串、數字等內建型別；建議提供工具或文件（清楚的 key、typed accessor）讓開發者好用。"},{"t":1025,"title":"Define and use custom Transcript segments","body":"當需要比字典更有彈性時，**custom segments** 是答案：定義新的 segment 型別、在 executor 接收、再經同一條 channel 串回結果，開發者全程不必離開 LanguageModelSession。因 custom segment 須符合 **PromptRepresentable**，開發者能像文字一樣直接放進 prompt（範例為 `AudioSegment`）；segment ID 決定你是新增 segment 還是更新一個已開始串流的 segment，讓你完全掌控結果如何串入 app。這也是新模態（音訊、影片）進來時的 typed、結構化途徑。"},{"t":1089,"title":"Implement server-side tools in your model","body":"**Server-side tools** 是模型自行執行的能力（web search、程式碼執行、圖片生成）：開發者建構模型時帶入想要的工具，executor 每次 request 都透過 model 收到。揭露分三層：最簡單是私下執行工具、只把答案串回（工具痕跡留在 executor 內）；其次是讓 text delta 帶上 metadata（如 citation），與文字一併 forward；最完整是用 **custom segment** 把工具的結構化產出整個攤給 app。透過這一條 channel，你 forward 的事件、附加的 metadata 與設計的 custom segment，共同決定使用你 package 的 app 能向使用者呈現什麼。"},{"t":1187,"title":"Next steps","body":"提醒鏈上每個人都要清楚模型背後的隱私特性——**on-device 與 cloud 模型的隱私特性截然不同**，使用者有權知道用的是哪一種。並推薦延伸 session：「Integrate On-Device AI Models into Your App Using Core AI」、「Build with the new Apple Foundation Model on Private Cloud Compute」、「Build agentic app experiences with the Foundation Models framework」。講者期待看到蓬勃的 LanguageModel package 生態。"}],"summary_en":["Presented by Christopher Webb of the Machine Learning Research team, the core message is that the **Foundation Models** framework no longer serves only Apple's built-in model — it now works with nearly any LLM, local or server-based. Beyond a rebuilt **System Language Model** that's smarter, better at instruction following, and accepts images directly in prompts, the framework adds **Private Cloud Compute** (with reasoning and a 32K context window), **Core AI** for running local models efficiently on the ANE, and **MLX** to unlock thousands of community models on Hugging Face. Because all of these are built on a brand-new public protocol, Anthropic (Claude) and Google (Gemini) will soon extend the framework with their own Swift packages. For app developers the key point is that whichever model you use, you call it the same way — you just swap the model object.","For model providers, bringing a model into the framework takes four steps: **packaging, protocol, authentication, and customization**. Packaging is done with Swift Package Manager, ideally supporting iOS/macOS/visionOS/watchOS (and even Linux since the framework is open source), while keeping dependencies minimal because every dependency is bytes shipped to users; publishing is just a git tag. The protocol is the bridge and has two pieces: **`LanguageModel`** describes the model (capabilities and executorConfiguration), while **`LanguageModelExecutor`** does the real work (init, prewarm, respond). The framework uses the model's **Configuration** (which is Hashable) as a lookup key to cache an executor per configuration in each session's executor store, so the same configuration resolves to the same executor.","The executor's job is to translate the conversation **Transcript** (six entry types: instructions, prompt, toolCalls, toolOutput, response, reasoning) into the model's native message format, and to read **ContextOptions** (reasoning level, schema) and **GenerationOptions** (sampling, temperature, max tokens) from each request. Responses stream back through a channel in a deliberate order: first metadata (model/request IDs for logging), then usage (prompt token counts), then per-token textDeltas so users see the response appear word-by-word. Stateful integrations (holding a KV cache or persistent connection) can diff the new transcript against the saved one and process only appended entries, invalidating back to the divergence point if entries were removed or modified. When the model can't satisfy the developer's intent, the rule is approximate where you can and otherwise throw, using the built-in **`LanguageModelError`** (context overflow, rate limits, refusals, and more), reserving custom errors for failures only your service can produce.","On authentication, the emphasis is making it easy for developers to do the right thing: don't take a bare API key string — offer a token provider or sign-in flow, and persist tokens securely with **Keychain**; cloud models should also do **device attestation** (see \"Secure your apps with App Attest\"). Finally, customization: attach response metadata such as tokensPerSecond, use **custom segments** to extend the protocol for new modalities like audio, and design **server-side tools** (web search, code execution, image generation) with three levels of disclosure — return only the answer, attach citation metadata, or surface the tool's structured output via a custom segment. The speaker also stresses that everyone in the chain should understand the privacy characteristics of the model behind a package, since on-device and cloud models differ greatly."],"deepdive_en":[{"t":0,"title":"Introduction","body":"Christopher Webb, an engineer on the Machine Learning Research team, opens by announcing that the **Foundation Models** framework now works with nearly any LLM, local or server-based, instead of only Apple's built-in model. The on-device **System Language Model** has been rebuilt to be smarter, better at instruction following, and able to accept images directly in prompts. Three more options join it: **Private Cloud Compute** (with reasoning and a 32K context window), **Core AI** to run local models on the ANE, and **MLX** to unlock community models on Hugging Face."},{"t":120,"title":"Choose a language model","body":"Because these options are built on a brand-new public protocol, developers can bring frontier models into their apps with the same framework, and **Anthropic's Claude** and **Google's Gemini** will soon extend it with their own Swift packages. A preview shows how simple usage is: create an on-device model, pass it into a session, call respond; swap to **Private Cloud Compute** for more horsepower, point **Core AI** at your resources to ship your own model, or pass a model ID to try open-source models. Every model conforms to the same **LanguageModel** protocol, so models swap easily and unlock features like Dynamic Profiles."},{"t":217,"title":"Packaging","body":"Bringing a model into the framework takes four steps: **packaging, protocol, authentication, and customization**. This section starts with packaging — a well-crafted Swift package makes it easy for developers to get started."},{"t":226,"title":"Configure Package.swift for your model package","body":"Use **Swift Package Manager** so developers can add your package as a dependency. Decide which platforms to support — the framework supports iOS/macOS/visionOS/watchOS, and you should do the same, with **Linux** worth considering since the framework is open source and useful for server-side Swift. Every **dependency** is bytes shipped to users, so choose carefully; publishing is as easy as creating a **git tag**, and because SPM is decentralized your repo URL is your distribution channel."},{"t":288,"title":"Protocol","body":"The protocol is the bridge between your model and the Foundation Models framework, and is the core step in connecting a model into it."},{"t":296,"title":"LanguageModel and LanguageModelExecutor protocols","body":"The protocol has two pieces: **`LanguageModel`** describes the model to the framework — declaring what it can do via capabilities and providing the configuration the framework needs to set up the executor — while **`LanguageModelExecutor`** is where the work happens, with an init that takes a Configuration, a prewarm for preparing resources ahead of time, and a respond that streams generation back to the session. The **Configuration** is the link between the two: the Model provides it and the framework uses it to construct the executor."},{"t":385,"title":"Implement LanguageModel and Executor conformances","body":"Each session holds an **executor store**: when a Model arrives, the framework checks the store by its configuration and, if there's no match, creates and stores a new executor. Because **Configuration is Hashable**, the same configuration resolves to the same executor while a different one gets its own — the lookup key is the configuration, not the model. In code, LanguageModel declares capabilities and returns a configuration, while the executor loads weights, manages resources, and streams tokens; when the session deallocates, the store and every stored executor are released automatically, with deinit running, weights freed, and connections closed — no teardown code needed."},{"t":448,"title":"Manage model resources with prewarm and respond","body":"The executor also has **prewarm**: before a request arrives, the developer can ask the framework to prewarm so you can do expensive setup (loading weights, opening connections) ahead of the first response. One approach puts that setup in a private helper that loads weights once and caches them, with prewarm calling it eagerly; but **prewarm isn't guaranteed to run**, weights load exactly once either way, and for a server-backed model with no expensive setup prewarm can simply be a no-op."},{"t":540,"title":"Map Transcript entries to model messages","body":"When respond is called, the executor sits in the middle, translating the **Transcript** (the conversation so far, a sequence of entries) into messages your inference engine understands, then running the same translation in reverse to stream back to the session. Foundation Models defines six entry types and your model defines its own roles; the executor maps between them — for example instructions/prompt/response to system/user/assistant, and toolCalls, toolOutput, and reasoning all to assistant (routing to a dedicated tool role instead if your model has one)."},{"t":642,"title":"Read generation and context options from the request","body":"Beyond history, every request carries the developer's intent for how the model should respond via two properties: **ContextOptions** control what goes into the prompt (like reasoning level or a response schema), and **GenerationOptions** control the decoder loop (sampling strategy, temperature, maximum response length). Inside respond you pull both out of the request and pass them along when calling the model."},{"t":707,"title":"Stream tokens and metadata through the channel","body":"On the response side, each chunk the inference engine emits (a token or tool-call fragment) becomes an event — a textDelta, a toolCallDelta — which the framework writes to the transcript; both one-shot and streaming APIs are implemented as streaming, with one-shot just collecting deltas internally. The order is deliberate: first a **metadata** update (model and request IDs for logging and debugging), then a **usage** update (prompt token counts for accounting), then a **textDelta** the moment each token arrives so users see the response appear word-by-word rather than all at once."},{"t":813,"title":"Honor the developer's intent or throw","body":"Stateful integrations (holding a KV cache or persistent session) can preserve work across calls thanks to the framework caching executors by configuration. The executor receives the full transcript every call and diffs new against saved: usually entries are just appended, so you keep existing state and process only the new; if entries were removed or modified (e.g., the developer trims older context) you invalidate back to where they diverge. When the model can't do exactly what's asked, approximate and honor the intent where possible, and otherwise **throw** (for example when the token budget is too small to satisfy a schema's required fields)."},{"t":837,"title":"Built-in errors that any model can throw","body":"Foundation Models ships a built-in **`LanguageModelError`** covering common cases: context window overflows, rate limits, refusals, guardrail violations, unsupportedCapability, unsupportedTranscriptContent, timeouts, and more. Throw one of these and any developer who's used the framework already knows how to handle it."},{"t":854,"title":"Handle errors from your model executor","body":"When the built-in cases don't cover your situation, define your own error type — some failures only make sense in your service's context (subscription tiers, account states, feature provisioning), and a purpose-built case name carries the intent so a developer catching it knows exactly what happened. But each custom error is a new case developers must learn, catch, and handle, so prefer a built-in **LanguageModelError** when it fits and save custom ones for failures only your service can produce."},{"t":890,"title":"Authentication","body":"As a package author your job is to make it easy for developers to do the right thing. If your initializer takes an API key string, developers take the path of least resistance, so offer a **token provider or sign-in flow** instead. If your package fetches access tokens on developers' behalf, persist them securely with **Keychain**. Credentials are half the story; the other half is **device attestation** — if you ship a cloud-based model package, dig into \"Secure your apps with App Attest\" to verify the device, catch tampered builds, sign payloads, and use Apple's fraud signal."},{"t":951,"title":"Customization","body":"Having packaged the model, implemented the protocol, and handled authentication, you have a solid package with the fundamentals covered — now it's time to differentiate. The protocol gives you room to shape **LanguageModelSession** around abilities only your model offers, from attaching response metadata all the way to defining entirely new modalities."},{"t":968,"title":"Attach custom metadata to responses","body":"**Response metadata** is a lightweight way to attach extra information to responses and give developers clear ways to access it. In the example, after streaming completes the executor sends **tokensPerSecond** and **timeToFirstToken** through the channel. Underneath, metadata is just a dictionary of strings, numbers, and other built-in types, and you should provide utilities or documentation — clear keys, typed accessors — to make it easy to work with."},{"t":1025,"title":"Define and use custom Transcript segments","body":"When you need more flexibility than a dictionary, **custom segments** are the answer: define a new segment type, receive it in the executor, and stream results back through the same channel, with the developer never leaving LanguageModelSession. Because custom segments must be **PromptRepresentable**, developers can pass them directly in prompts just like text (the example is an `AudioSegment`); the segment ID controls whether you're adding a new segment or updating one you've already started streaming, giving full control over how results stream into the app — and a typed, structured path for new modalities like audio or video."},{"t":1089,"title":"Implement server-side tools in your model","body":"**Server-side tools** are capabilities the model runs itself (web search, code execution, image generation): the developer constructs the model with the tools they want and the executor receives them through the model on every request. Disclosure comes in three levels — run the tool privately and stream only the answer (its work stays inside the executor), or attach metadata like a citation to a text delta and forward both, or surface the tool's structured output via a **custom segment**. Through this one channel, the events you forward, the metadata you attach, and the custom segments you design shape what apps using your package can show their users."},{"t":1187,"title":"Next steps","body":"A final reminder that everyone in the chain should understand the privacy implications of the model behind a package — **on-device and cloud models have very different privacy characteristics**, and users deserve to know which they're getting. The talk points to follow-up sessions: \"Integrate On-Device AI Models into Your App Using Core AI,\" \"Build with the new Apple Foundation Model on Private Cloud Compute,\" and \"Build agentic app experiences with the Foundation Models framework,\" closing with hope for a thriving ecosystem of LanguageModel packages."}],"code":[]},"related":[{"id":"241","title":"What’s new in the Foundation Models framework","gloss":"Foundation Models 框架的新功能","gloss_en":"What's new in the Foundation Models framework","category":"ai","categoryLabel":"AI 與機器學習"},{"id":"319","title":"Build with the new Apple Foundation Model on Private Cloud Compute","gloss":"在 Private Cloud Compute 上使用全新 Apple Foundation Model 開發","gloss_en":"Build with the new Apple Foundation Model on Private Cloud Compute","category":"ai","categoryLabel":"AI 與機器學習"},{"id":"242","title":"Build agentic app experiences with the Foundation Models framework","gloss":"用 Foundation Models 框架打造 agentic App 體驗","gloss_en":"Build agentic app experiences with Foundation Models","category":"ai","categoryLabel":"AI 與機器學習"},{"id":"246","title":"LLM search using Core Spotlight","gloss":"使用 Core Spotlight 的 LLM 搜尋","gloss_en":"LLM search using Core Spotlight","category":"ai","categoryLabel":"AI 與機器學習"},{"id":"326","title":"Integrate on-device AI models into your app using Core AI","gloss":"用 Core AI 把裝置端 AI 模型整合進你的 App","gloss_en":"Integrate on-device AI models with Core AI","category":"ai","categoryLabel":"AI 與機器學習"}]}</script>
