<script id="d" type="application/json">{"s":{"id":"206","title":"What’s new in managing Apple devices","gloss":"管理 Apple 裝置的新功能","category":"other","categoryLabel":"其他","duration":1382,"url":"https://developer.apple.com/videos/play/wwdc2026/206/","takeaway":"若你負責企業或教育環境的裝置管理，這場涵蓋宣告式裝置管理、App 派送與身分整合的最新更新。","chapters":[[0,"Introduction"],[41,"Apple services"],[154,"Device management"],[573,"App management"],[896,"Identity Integrations"],[1186,"Education"]],"points":[{"text":"介紹**宣告式裝置管理（declarative device management）**的最新更新，是裝置管理的核心方向。","hot":true},{"text":"涵蓋 **Apple Business Manager** 與 **Apple School Manager** 在服務面的進展。","hot":false},{"text":"說明 **App management** 派送與管理的改進，便於大規模佈署應用程式。","hot":false},{"text":"包含 **Identity Integrations** 身分整合，以及針對**教育（Education）**情境的更新。","hot":false}],"apis":[],"audience":"負責 MDM、企業 IT 或教育機構**大規模裝置與 App 佈署**的管理者與開發者。","gloss_en":"What's new in managing Apple devices","takeaway_en":"If you manage devices in enterprise or education environments, this session covers the latest updates to declarative device management, app distribution, and identity integration.","points_en":[{"text":"Introduces the latest updates to **declarative device management**, the core direction for device management.","hot":true},{"text":"Covers service-side advancements in **Apple Business Manager** and **Apple School Manager**.","hot":false},{"text":"Explains improvements to **App management** distribution and management, making it easier to deploy apps at scale.","hot":false},{"text":"Includes **Identity Integrations** as well as updates for **Education** scenarios.","hot":false}],"audience_en":"Administrators and developers responsible for MDM, enterprise IT, or educational institutions who handle **large-scale device and app deployment**.","summary":["本場次由 Device Management 團隊全面盤點今年管理 Apple 裝置的新功能。在 Apple 服務層面，**Apple Business** 是一套整合大小型組織營運工具的全新平台，已擴展到超過 200 個國家與地區，提供零接觸部署、Managed Apple Accounts 與內建裝置管理功能；並推出新的 API 可建立 Blueprints 與 Configurations、管理使用者與群組、查詢 App 授權與稽核事件。同時 App Store App 訂閱也新增**大量授權（volume licensing）**機制，IT 管理者能像散發 App 一樣，把訂閱指派給群組與組織，稍後將在 Apple Business 與 Apple School Manager 上線。","在裝置管理上，講者重申「裝置管理的標準就是 **declarative management**（宣告式管理）」——它已不是路線圖而是正在生產環境運行。本次新增多項宣告式能力：搭配新 Mac 硬體的**受管理遷移（managed migration）**，在 enrollment 後立即部署一個宣告式設定，讓 IT 控制要遷移哪些帳號、檔案與隱私安全設定；針對 Apple Intelligence、Siri 與鍵盤的細緻控制；以及更有效率的**憑證管理**——因為宣告式模型支援多對多關係，多個設定可引用同一份 credential asset，刷新憑證時伺服器只需更換 asset，裝置便會自動更新所有相依設定。**status channel** 也大幅擴充，新增 enrollment type、Lockdown Mode、**裝置系統健康（device system health）**等狀態項目，並新增 TriggerEnhancedLogCollection 指令與 Content Caching 的宣告式設定與狀態。","App 管理方面，宣告式 App 設定擴展到 macOS 27，支援硬體綁定金鑰與 Managed Device Attestation；package 移除時可一併清除安裝的檔案；新增**整合式隱私同意提示**，App 首次啟動或網站首次出現於 Safari 時一次說明組織與理由，使用者按 Allow 即套用所有預設，避免反覆彈窗；並透過 Endpoint Security 框架推出**二進位執行控管（binary execution）**，依程式碼簽章規則允許或拒絕執行。這些都歸入新的 app.settings 與既有 safari.settings 宣告式設定。","身分整合上，**Platform SSO** 進一步強化：全新登入與解鎖體驗、可要求 Touch ID 作為內建第二因素（涵蓋登入、螢幕解鎖與 FileVault），並導入**以網頁為基礎的驗證**，在 login window 與 screen unlock 中以受系統控管的 secure web view 執行任意現代驗證流程，包含一次性碼、推播與 QR code 無密碼登入；QR 掃描在隔離的系統程序中進行，網頁僅取得解碼資料。**Authenticated Guest Mode** 現可在 FileVault 保護的 Mac 上解鎖磁碟，並將於本版稍後登陸 Shared iPad。教育方面，Classroom App 新增**引導式瀏覽（guided browsing）**，教師可把學生鎖定在指定的一或多個分頁。所有 schema 與文件皆已開源於 GitHub 與 developer.apple.com。"],"deepdive":[{"t":0,"title":"Introduction","body":"Device Management 團隊工程師 Cyrus Daboo 開場，預告本場涵蓋 **Apple 服務**更新、多項 **declarative management** 新增能力、**App 管理**更新、新的**身分管理**功能，以及教育相關技術的快速更新。整體定調為今年管理 Apple 裝置的全面 what's new。"},{"t":41,"title":"Apple services","body":"介紹整合式新平台 **Apple Business**，已擴展至超過 200 個國家與地區，提供零接觸部署、Managed Apple Accounts 與內建裝置管理。推出新 API 可建立 Blueprints 與 Configurations、修改使用者與群組、查詢 App 授權與稽核事件，並與既有的伺服器、裝置、庫存與 AppleCare 保固 API 並用。另預告 App Store App 訂閱的**大量授權**機制，IT 可沿用既有散發流程把訂閱指派給群組與組織。"},{"t":154,"title":"Device management","body":"重申「裝置管理的標準就是 **declarative management**」——已在全球生產環境運行。搭配 MacBook Neo／Air／Pro 等新硬體，推出 enrollment 後立即部署的**受管理遷移**設定（由 Migration Assistant 回報狀態），以及 Apple Intelligence、Siri、鍵盤的細緻控制。**憑證管理**改用宣告式 asset 並利用多對多關係，刷新時只需更換 asset；**status channel** 新增 enrollment type、Lockdown Mode、**device system health**（baseband、相機、Face ID、Touch ID 等硬體）等狀態，並加入 TriggerEnhancedLogCollection 指令與 Content Caching 的宣告式設定與狀態回報。"},{"t":573,"title":"App management","body":"宣告式 **App 設定**擴展到 macOS 27，支援硬體綁定金鑰與 **Managed Device Attestation**，鼓勵企業 App 採用 ManagedApp 框架；package 移除時可一併清除其安裝的檔案與目錄。推出**整合式隱私同意提示**，App 首次啟動或 Safari 首次載入網站時一次列出組織、理由與各隱私元件，按 Allow（預設按鈕）即套用所有預設、避免反覆彈窗。並以 **Endpoint Security** 框架推出**二進位執行控管**，依程式碼簽章規則允許／拒絕並可關閉相關程序，受管理 App 可自動允許；這些歸入新的 app.settings 與既有 safari.settings 設定。"},{"t":896,"title":"Identity Integrations","body":"強化 **Platform SSO**：全新登入／解鎖體驗讓使用者清楚是用組織憑證，並可要求 **Touch ID** 作為內建第二因素，涵蓋登入、螢幕解鎖與 FileVault。導入**網頁式驗證**，在 login window 與 screen unlock 以受系統嚴格控管的 secure web view 執行任意現代驗證流程（一次性碼、推播、QR code 無密碼登入），且 QR 掃描在隔離系統程序進行、網頁僅得解碼資料；支援離線驗證。**Authenticated Guest Mode** 現可解鎖 FileVault 保護的 Mac，確保訪客工作階段也有全磁碟加密。"},{"t":1186,"title":"Education","body":"教育更新包含 **Authenticated Guest Mode** 將登陸 **Shared iPad**：iPad 開機進入暫時工作階段並顯示登入畫面，使用者以 Managed Apple Account（支援原生或聯合驗證與 SSO）登入，工作階段與系統共享容量、無硬性配額，登出後本機資料與帳號自動移除。Classroom App 新增**引導式瀏覽**，教師可把學生鎖定在指定的一或多個分頁、限制站內外導覽並控管相機與麥克風存取。最後指出所有 schema 與文件已開源，並建議參考 App Attest 與 Assessment mode 相關場次。"}],"summary_en":["The Device Management team gives a full tour of what's new in managing Apple devices this year. On the services side, **Apple Business** is a new all-in-one platform for organizations of any size, now available in over 200 countries and regions, offering zero-touch deployment, Managed Apple Accounts, and built-in device management. New APIs let you create Blueprints and Configurations, modify users and groups, query app license info, and fetch audit events. A new **volume licensing** mechanism for App Store app subscriptions also lets IT administrators assign subscriptions to groups and organizations using existing distribution workflows, coming later to Apple Business and Apple School Manager.","For device management, the speaker reaffirms that \"the standard for device management is **declarative management**\"—it is shipping in production, not a roadmap item. New declarative capabilities include **managed migration** that pairs with new Mac hardware by deploying a declarative configuration right after enrollment to control which accounts, files, and privacy/security settings migrate; granular controls for Apple Intelligence, Siri, and keyboard settings; and far more efficient **credential management**, since the many-to-many model lets multiple configurations reference one credential asset, so refreshing a credential only requires changing the asset. The **status channel** is greatly expanded with items like enrollment type, Lockdown Mode, and **device system health**, plus a new TriggerEnhancedLogCollection command and declarative Content Caching configuration and status.","For app management, declarative app configuration extends to macOS 27 with hardware-bound keys and Managed Device Attestation; packages can remove the files they installed when removed; a new **consolidated privacy consent prompt** explains the organization and rationale once at first launch (or first website appearance in Safari), so tapping Allow applies all defaults and avoids repeated prompts; and **binary execution control** via the Endpoint Security framework allows or denies execution based on code-signing rules. These live in the new app.settings and existing safari.settings declarative configurations.","On identity, **Platform SSO** is enhanced with a new login and unlock experience, the option to require Touch ID as a built-in second factor (across login, screen unlock, and FileVault), and a new **web-based authentication** option that runs any modern auth flow in a system-controlled secure web view at the login window and screen unlock, including one-time codes, push notifications, and QR-code passwordless sign-in, with QR scanning isolated in a system process so the web page only receives decoded data. **Authenticated Guest Mode** can now unlock FileVault-protected Macs and is coming to Shared iPad later in the release. In education, the Classroom app adds **guided browsing** so teachers can lock students to one or more tabs. All schema and documentation are open source on GitHub and developer.apple.com."],"deepdive_en":[{"t":0,"title":"Introduction","body":"Device Management engineer Cyrus Daboo opens, previewing updates to **Apple services**, several additions to **declarative management**, **app management** changes, new **identity management** features, and a quick education update. The session is framed as a comprehensive what's-new for managing Apple devices this year."},{"t":41,"title":"Apple services","body":"Introduces the new all-in-one **Apple Business** platform, now available in over 200 countries and regions, with zero-touch deployment, Managed Apple Accounts, and built-in device management. New APIs create Blueprints and Configurations, modify users and groups, query app licenses, and get audit events, joining existing server, device, inventory, and AppleCare APIs. It also previews a **volume licensing** mechanism for App Store app subscriptions, letting IT assign subscriptions to groups and organizations via existing distribution workflows."},{"t":154,"title":"Device management","body":"Reaffirms that \"the standard for device management is **declarative management**,\" already running in production worldwide. Alongside new MacBook Neo/Air/Pro hardware, it adds **managed migration** (a configuration deployed right after enrollment, with status reported by Migration Assistant) and granular Apple Intelligence, Siri, and keyboard controls. **Credential management** moves to declarative assets using the many-to-many model so refreshing only swaps the asset, and the **status channel** gains items like enrollment type, Lockdown Mode, and **device system health** (baseband, camera, Face ID, Touch ID), plus the TriggerEnhancedLogCollection command and declarative Content Caching configuration and status."},{"t":573,"title":"App management","body":"Declarative **app configuration** extends to macOS 27 with hardware-bound keys and **Managed Device Attestation**, encouraging adoption of the ManagedApp framework; package removal can now also delete installed files and directories. A new **consolidated privacy consent prompt** lists the organization, justification, and each privacy component once at first launch (or first website appearance in Safari), so tapping Allow (the default button) applies all defaults and avoids repeated prompts. **Binary execution control** via the **Endpoint Security** framework allows or denies execution by code-signing rules and can shut down associated processes, with managed apps auto-allowed; these live in the new app.settings and existing safari.settings configurations."},{"t":896,"title":"Identity Integrations","body":"Enhances **Platform SSO** with a new login/unlock experience that makes organizational credentials clear, and the option to require **Touch ID** as a built-in second factor across login, screen unlock, and FileVault. A new **web-based authentication** option runs any modern auth flow in a tightly controlled secure web view at the login window and screen unlock (one-time codes, push, QR-code passwordless sign-in), with QR scanning isolated in a system process so the page only gets decoded data; offline authentication is supported. **Authenticated Guest Mode** can now unlock FileVault-protected Macs so guest sessions still have full-disk encryption."},{"t":1186,"title":"Education","body":"Education updates include **Authenticated Guest Mode** coming to **Shared iPad**: the iPad boots into a temporary session with a login screen where users sign in with a Managed Apple Account (native or federated auth with SSO), the session shares device capacity with no hard quotas, and signing out automatically removes local data and the account. The Classroom app adds **guided browsing**, letting teachers lock students to one or more tabs, restrict navigation in and out of sites, and control camera and microphone access. It closes by noting all schema and documentation are open source and points to the App Attest and Assessment mode sessions."}],"code":[]},"related":[{"id":"101","title":"Keynote","gloss":"主題演講","gloss_en":"Keynote","category":"other","categoryLabel":"其他"},{"id":"102","title":"Platforms State of the Union","gloss":"平台現況報告","gloss_en":"Platforms State of the Union","category":"other","categoryLabel":"其他"},{"id":"111","title":"Keynote (ASL)","gloss":"主題演講(美國手語版)","gloss_en":"Keynote (American Sign Language)","category":"other","categoryLabel":"其他"},{"id":"112","title":"Platforms State of the Union (ASL)","gloss":"平台現況報告（美國手語版）","gloss_en":"Platforms State of the Union (American Sign Language)","category":"other","categoryLabel":"其他"},{"id":"122","title":"WWDC26 Platforms State of the Union Recap","gloss":"WWDC26 平台現況演講重點回顧","gloss_en":"WWDC26 Platforms State of the Union recap","category":"other","categoryLabel":"其他"}]}</script>
