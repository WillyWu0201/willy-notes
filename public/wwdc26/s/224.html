<script id="d" type="application/json">{"s":{"id":"224","title":"Expand the capabilities of your Virtualization app","gloss":"擴充你的 Virtualization App 能力","category":"other","categoryLabel":"其他","duration":1229,"url":"https://developer.apple.com/videos/play/wwdc2026/224/","takeaway":"在 macOS 27 中透過自動化佈建、USB 存取、自訂網路與 DiskImageKit 大幅擴充虛擬機的能力。","chapters":[[1,"Introduction"],[64,"macOS guest provisioning"],[117,"Provision a macOS guest"],[274,"Accessory Access"],[432,"Register an Accessory Access listener"],[459,"Respond to USB accessory connection"],[506,"Advanced network topologies"],[604,"Create a custom vmnet network"],[695,"DiskImageKit"],[894,"Use DiskImageKit with Virtualization"],[957,"Custom Virtio"],[1061,"Configure a custom Virtio device"],[1100,"Attach a delegate to a VZCustomVirtioDevice"],[1122,"Process Virtio queue elements"]],"points":[{"text":"使用 **VZMacGuestProvisioningOptions** 自動完成 macOS guest 的使用者設定與自動登入佈建。","hot":false},{"text":"透過 **AccessoryAccess** 與 **VZUSBPassthroughDevice** 讓虛擬機回應並直通 USB 配件。","hot":false},{"text":"以 **vmnet** API 建立自訂網路拓撲，並用 VZVmnetNetworkDeviceAttachment 接上虛擬機。","hot":false},{"text":"新的 **DiskImageKit** 支援以分層（base/cache/overlay）方式組合磁碟映像檔。","hot":true},{"text":"可透過 **VZCustomVirtioDevice** 自訂 Virtio 裝置並處理其佇列元素。","hot":false}],"apis":["Virtualization","VZMacGuestProvisioningOptions","VZMacOSVirtualMachineStartOptions","AccessoryAccess","AAUSBAccessoryManager","VZUSBPassthroughDevice","vmnet","VZVmnetNetworkDeviceAttachment","DiskImageKit","VZCustomVirtioDevice"],"audience":"在 macOS 上開發 **虛擬化或 VM 管理工具** 並想採用 macOS 27 新能力的開發者。","gloss_en":"Expand the capabilities of your Virtualization app","takeaway_en":"In macOS 27, greatly expand your VM's capabilities through automated provisioning, USB access, custom networking, and DiskImageKit.","points_en":[{"text":"Use **VZMacGuestProvisioningOptions** to automate user setup and auto-login provisioning for a macOS guest.","hot":false},{"text":"Let VMs respond to and pass through USB accessories via **AccessoryAccess** and **VZUSBPassthroughDevice**.","hot":false},{"text":"Build custom network topologies with the **vmnet** API and attach them to a VM using VZVmnetNetworkDeviceAttachment.","hot":false},{"text":"The new **DiskImageKit** supports composing disk images in layers (base/cache/overlay).","hot":true},{"text":"Customize Virtio devices and handle their queue elements with **VZCustomVirtioDevice**.","hot":false}],"audience_en":"Developers building **virtualization or VM management tools** on macOS who want to adopt the new macOS 27 capabilities.","summary":["這場由 Virtualization 團隊主講，聚焦 macOS 27 為 **Virtualization** app 帶來的進階能力。**Virtualization** framework 能打造完整桌面體驗或開發者工作流（例如測試協作型 Mac app、裝置間網路測試、以及在受控環境裡做一致性自動化測試）。講者依序帶過五大主題：自動化佈建 Virtual Mac、用 **Accessory Access** 把 USB 裝置接進 VM、設定進階網路拓樸、用 **DiskImageKit** 做高效磁碟映像，以及用 **custom Virtio** 打造高效能虛擬裝置。","在 **macOS guest provisioning** 上，過去得手動走 Setup Assistant，現在可用 **`VZMacGuestProvisioningOptions`** 設定 full name、username、password，並選擇開啟 auto-login 或 SSH remote login，包進 **`VZMacOSVirtualMachineStartOptions`** 後於首次開機自動套用（僅在 guest 尚未設定過時生效）。**Accessory Access** 是新 framework，app 用 **`AAUSBAccessoryManager`** 註冊帶 matching criteria 的 listener，使用者由選單明確授權後，於 `usbAccessoryDidConnect` 中以 **`VZUSBPassthroughDevice`** 在 VM queue 上熱插到 USB controller；需加上 Claim USB Accessory capability，且裝置可隨時被接上或卸下。","網路方面，**vmnet** framework 讓你建立自訂拓樸：用 `vmnet_network_configuration_create` 與 `vmnet_network_create` 造出網路物件，包成 **`VZVmnetNetworkDeviceAttachment`** 再掛到 VZVirtioNetworkDeviceConfiguration；可設定 DHCP、port forwarding，並用 serialization API 跨 XPC 讓多個程序中的 VM 共用同一網路。**DiskImageKit** 用 **ASIF** 稀疏格式與 base／cache／overlay 分層堆疊取代一對一的 raw image，達成稀疏化、copy-on-write 快照與多 VM 共用唯讀層（淺堆疊效能較佳）。最後 **custom Virtio** 透過 **`VZCustomVirtioDevice`** 讓你在 host app 與 Linux guest 間建立低延遲、高吞吐的自訂通訊通道，於 delegate 的 `didReceiveNotificationFor` 中處理 Virtio queue 元素（需自備 guest driver）。"],"deepdive":[{"t":1,"title":"Introduction","body":"由 Virtualization 團隊的 Ronnie Misra 開場，說明 **Virtualization** framework 可用來打造完整桌面體驗、精密的開發者工作流（測試協作型 Mac app、裝置間網路）以及命令列工具與自動化測試。本場將依序帶過 macOS guest 自動佈建、Accessory Access、進階網路拓樸、DiskImageKit 與 custom Virtio 五大主題。"},{"t":64,"title":"macOS guest provisioning","body":"說明安裝 macOS 到 Virtual Mac 後，過去得像實體 Mac 一樣手動走 **Setup Assistant**；對自動化情境而言，能以程式設定才方便。新 API 讓 app 在啟動 Virtual Mac 時指定佈建選項——full name、username、password，並可選擇開啟 auto-login 或經 SSH 的 remote login——首次開機便自動傳給 Setup Assistant 建立帳號。"},{"t":117,"title":"Provision a macOS guest","body":"展示實作流程：建立 **`VZMacGuestProvisioningOptions`** 設定帳號、auto-login 與 SSH，再構造 **`VZMacOSVirtualMachineStartOptions`** 並 `setGuestProvisioning`，最後以這些 startOptions 啟動 VM。Demo 中 Setup Assistant 自動建立 jappleseed 帳號並完成自動登入與 Remote Login。重點提醒：這些設定只在 guest 尚未設定過時生效，且密碼應從 Keychain／設定檔／環境變數讀取，勿硬編碼。"},{"t":274,"title":"Accessory Access","body":"介紹新的 **Accessory Access** framework，用來把 host 上的 USB 裝置提供給 macOS 與 Linux VM（例如在 VM 內使用 USB 隨身碟）。核心原則是使用者明確掌控哪些裝置接到哪個 app，可隨時接上或卸下，並支援 hot plugging——授權後即可在執行期動態接上，無需更動 VM 的靜態設定。Demo 示範把磁碟從 host 卸載、接進 guest，再釋放回 host 重新掛載。"},{"t":432,"title":"Register an Accessory Access listener","body":"說明使用流程：先建立 **`AAUSBAccessoryMatchingCriteria`** 陣列描述感興趣的裝置（可依 device class／subclass、vendor／product ID 過濾，空陣列代表所有 USB 裝置），再用 **`AAUSBAccessoryManager.shared.registerListener`** 註冊實作 `AAUSBAccessoryListener` 的 listener。registerListener 會回傳先前已接上的 accessories 供處理。"},{"t":459,"title":"Respond to USB accessory connection","body":"當使用者把裝置接到 app，listener 的 **`usbAccessoryDidConnect`** 會被呼叫。因 VZVirtualMachine 的修改必須在其專屬 queue 上進行，範例在 `virtualMachine.queue.async` 中用 **`VZUSBPassthroughDeviceConfiguration`** 建立 **`VZUSBPassthroughDevice`**，再 attach 到 VM 的 USB controller。提醒需加上 Claim USB Accessory capability，並優雅處理使用者隨時接上／卸下的事件。"},{"t":506,"title":"Advanced network topologies","body":"說明 macOS 26 起可用 **vmnet** framework 設定虛擬網路介面。Virtualization 本身已能輕鬆做基本 NAT 或 bridge 的隔離網路，但進階情境（例如從同網段或不同網段的 client 測試到 server VM 的連線）需要更多控制。vmnet 讓你建立自訂拓樸，控制 VM 之間如何通訊，並設定 DHCP、TCP／UDP port forwarding 等參數。"},{"t":604,"title":"Create a custom vmnet network","body":"展示程式步驟：用 `vmnet_network_configuration_create`（搭配如 `.VMNET_SHARED_MODE`）建立設定物件並可客製 DHCP／port forwarding，再以 `vmnet_network_create` 造出網路物件，包成 **`VZVmnetNetworkDeviceAttachment`**、掛到 `VZVirtioNetworkDeviceConfiguration` 後加入 VM configuration。重點：vmnet network 是 reference counted 的 Objective-C 物件、app 結束即消失；要跨程序共用同一網路可用 `vmnet_network_copy_serialization` 與 `vmnet_network_create_with_serialization` 透過 XPC 傳遞。"},{"t":695,"title":"DiskImageKit","body":"對比傳統 raw 磁碟映像：格式雖通用但無法表達稀疏（100GB 磁碟就是 100GB 檔），且快照需整碟複製。新 framework **DiskImageKit**（macOS 27）支援 macOS 26 引入的 **ASIF** 稀疏格式，並可堆疊 base／cache／overlay 多層——cache 層加速慢速儲存的讀取、overlay 層實作快照的 copy-on-write、唯讀層可被多個 stack 共用。講者並以一個含 block 0/1/4 的範例逐步說明讀寫如何沿層遍歷與快取。"},{"t":894,"title":"Use DiskImageKit with Virtualization","body":"展示整合方式：先建立 **`DiskImage`** 物件，若要分層則建立多個並依序 `appending`（如 `.asifLayer` 的 cache 層、再疊 overlay），由 stackedImage 構造 **`VZDiskImageStorageDeviceAttachment`**，掛到 `VZVirtioBlockDeviceConfiguration` 後加入 VM configuration。提醒：淺堆疊效能較佳；複製 VM 共用 base 層時，別忘了一併複製 auxiliary storage 與 EFI variable store 等其他檔案。"},{"t":957,"title":"Custom Virtio","body":"介紹 **custom Virtio** API，讓你在 host app 與 Linux VM 間建立自訂通訊通道，適用效能關鍵情境——自訂協定、Virtio crypto 之類的協處理器、或讓 guest 高效存取 ML 加速器。Virtio 是 paravirtualized 裝置的業界標準，透過 guest 與 host 共用的記憶體緩衝（組織成 **Virtio queues**）並以通知／中斷溝通，盡量減少 context switch。macOS 27 起可用 **`VZCustomVirtioDevice`** 實作自己的裝置。"},{"t":1061,"title":"Configure a custom Virtio device","body":"展示設定：建立 **`VZCustomVirtioDeviceConfiguration`**，設定 deviceID、PCI class／subclass 與 virtioQueueCount（範例為單一 queue 的 entropy 裝置），並設定 **`VZCustomVirtioDeviceDelegateProvider`**（帶 deviceQueue 與 delegate），最後加入 VM configuration 的 customVirtioDevices 陣列。"},{"t":1100,"title":"Attach a delegate to a VZCustomVirtioDevice","body":"說明 VM 啟動後 **`VZCustomVirtioDevice`** 物件被建立，configuration delegate 的 **`didCreateDevice`** 會被呼叫。在此函式中應設定 device 的 delegate（實作 `VZCustomVirtioDeviceDelegate`），並保留 device 參考，以便日後對 guest 觸發中斷。"},{"t":1122,"title":"Process Virtio queue elements","body":"說明 `VZCustomVirtioDeviceDelegate` 的 **`didReceiveNotificationFor`** 是處理裝置 queue 的核心：以 `while let element = queue.nextElement()` 逐一取出元素、處理後再 `element.returnToQueue()`。提醒自訂裝置需搭配自備的 guest driver，並遵循 Virtio queue 的最佳實務以發揮高效通訊。結尾另提及 iCloud 支援、EFI Secure Boot、以及 macOS guest 的 Metal argument／indirect command buffers 等其他進展。"}],"summary_en":["Presented by the Virtualization team, this session focuses on the advanced capabilities macOS 27 brings to **Virtualization** apps. The **Virtualization** framework can power full desktop experiences or developer workflows — testing collaborative Mac apps, networking between devices, and consistent automated testing in controlled environments. The speaker walks through five themes: automating Virtual Mac setup, attaching USB devices with **Accessory Access**, configuring advanced network topologies, building efficient disk images with **DiskImageKit**, and creating high-performance virtual devices with **custom Virtio**.","For **macOS guest provisioning**, what previously required manually walking through Setup Assistant can now be configured via **`VZMacGuestProvisioningOptions`** — full name, username, password, and optional auto-login or SSH remote login — wrapped in **`VZMacOSVirtualMachineStartOptions`** and applied automatically on first boot (only honored if the guest hasn't been set up yet). **Accessory Access** is a new framework where the app registers a listener with matching criteria via **`AAUSBAccessoryManager`**; after the user explicitly grants access from a menu, `usbAccessoryDidConnect` hot-plugs the device to a USB controller using **`VZUSBPassthroughDevice`** on the VM queue. It requires the Claim USB Accessory capability, and devices can be attached or detached at any time.","On networking, the **vmnet** framework lets you build custom topologies: `vmnet_network_configuration_create` and `vmnet_network_create` produce a network object that is wrapped in a **`VZVmnetNetworkDeviceAttachment`** and attached to a VZVirtioNetworkDeviceConfiguration; you can configure DHCP and port forwarding, and use serialization APIs to share one network across processes via XPC. **DiskImageKit** replaces one-to-one raw images with the sparse **ASIF** format and stacked base/cache/overlay layers, enabling sparsity, copy-on-write snapshots, and read-only layers shared across multiple VMs (shallower stacks perform better). Finally, **custom Virtio** via **`VZCustomVirtioDevice`** lets you build low-latency, high-throughput custom communication channels between the host app and Linux guests, processing Virtio queue elements in the delegate's `didReceiveNotificationFor` (a custom guest driver is required)."],"deepdive_en":[{"t":1,"title":"Introduction","body":"Ronnie Misra from the Virtualization team opens, explaining that the **Virtualization** framework can power full desktop experiences, sophisticated developer workflows (testing collaborative Mac apps, networking between devices), and command-line tools and automated testing. The session covers five themes in order: automated macOS guest provisioning, Accessory Access, advanced network topologies, DiskImageKit, and custom Virtio."},{"t":64,"title":"macOS guest provisioning","body":"After installing macOS into a Virtual Mac, you previously had to walk through **Setup Assistant** manually like a physical Mac; for automation, being able to set it up programmatically is far more convenient. The new API lets the app specify provisioning options when starting a Virtual Mac — full name, username, password, with optional auto-login or SSH remote login — which are passed automatically to Setup Assistant on first boot to create the account."},{"t":117,"title":"Provision a macOS guest","body":"Demonstrates the flow: create **`VZMacGuestProvisioningOptions`** configuring the account, auto-login, and SSH, then construct **`VZMacOSVirtualMachineStartOptions`** and call `setGuestProvisioning`, and finally start the VM with those startOptions. In the demo, Setup Assistant automatically creates the jappleseed account and enables automatic login and Remote Login. Key notes: these settings only apply if the guest hasn't been set up yet, and passwords should be read from the Keychain, a config file, or an environment variable rather than hardcoded."},{"t":274,"title":"Accessory Access","body":"Introduces the new **Accessory Access** framework for making host USB devices available to macOS and Linux VMs (e.g. using a USB drive from inside a VM). A key principle is that people have explicit control over which devices attach to which apps and can attach or detach at any time, with support for hot plugging — once granted, a device attaches at runtime without changing the VM's static configuration. The demo unmounts a drive from the host, attaches it to the guest, then releases it back to the host."},{"t":432,"title":"Register an Accessory Access listener","body":"Explains the usage flow: build an array of **`AAUSBAccessoryMatchingCriteria`** describing the devices of interest (filterable by device class/subclass, vendor/product ID; an empty array means all USB devices), then register a listener implementing `AAUSBAccessoryListener` via **`AAUSBAccessoryManager.shared.registerListener`**. registerListener returns any accessories previously attached to the app for handling."},{"t":459,"title":"Respond to USB accessory connection","body":"When the user attaches a device to the app, the listener's **`usbAccessoryDidConnect`** is called. Because modifications to VZVirtualMachine must happen on its own queue, the example uses `virtualMachine.queue.async` to create a **`VZUSBPassthroughDevice`** via **`VZUSBPassthroughDeviceConfiguration`** and attach it to a USB controller. It notes the Claim USB Accessory capability is required and that attach/detach events should be handled gracefully."},{"t":506,"title":"Advanced network topologies","body":"Explains that since macOS 26 the **vmnet** framework can configure virtual network interfaces. Virtualization already makes basic NAT or bridge isolated networks easy, but advanced cases (e.g. testing connections to a server VM from clients on the same or a different network) need more control. vmnet lets you build custom topologies controlling how VMs communicate and configuring parameters like DHCP and TCP/UDP port forwarding."},{"t":604,"title":"Create a custom vmnet network","body":"Walks through the code: use `vmnet_network_configuration_create` (with e.g. `.VMNET_SHARED_MODE`) to make a configuration object you can customize for DHCP/port forwarding, then `vmnet_network_create` to build the network object, wrap it in a **`VZVmnetNetworkDeviceAttachment`**, set it on a `VZVirtioNetworkDeviceConfiguration`, and add to the VM configuration. Key point: a vmnet network is a reference-counted Objective-C object that goes away when the app quits; to share one network across processes, use `vmnet_network_copy_serialization` and `vmnet_network_create_with_serialization` over XPC."},{"t":695,"title":"DiskImageKit","body":"Contrasts traditional raw disk images — widely supported but unable to represent sparsity (a 100GB disk is a 100GB file) and expensive to snapshot (a full copy). The new **DiskImageKit** framework (macOS 27) supports the sparse **ASIF** format introduced in macOS 26 and lets you stack base/cache/overlay layers — cache layers speed reads from slow storage, overlay layers implement copy-on-write snapshots, and read-only layers can be shared across stacks. The speaker steps through an example stack (with blocks 0/1/4) showing how reads and writes traverse and cache across layers."},{"t":894,"title":"Use DiskImageKit with Virtualization","body":"Shows integration: create a **`DiskImage`** object, or for a layered image create several and `append` them in order (e.g. an `.asifLayer` cache layer, then an overlay), build a **`VZDiskImageStorageDeviceAttachment`** from the stackedImage, attach to a `VZVirtioBlockDeviceConfiguration`, and add to the VM configuration. Notes that shallower stacks perform better, and that cloning a VM with a shared base layer requires duplicating the other files too, such as auxiliary storage and the EFI variable store."},{"t":957,"title":"Custom Virtio","body":"Introduces the **custom Virtio** API for building custom communication channels between the host app and Linux VMs, useful for performance-critical cases — custom protocols, coprocessors like a Virtio crypto device, or efficient guest access to ML accelerators. Virtio is the industry standard for paravirtualized devices, using memory buffers shared between guest and host organized into **Virtio queues**, with notifications/interrupts to minimize context switches. In macOS 27, **`VZCustomVirtioDevice`** lets you implement your own device."},{"t":1061,"title":"Configure a custom Virtio device","body":"Shows configuration: create a **`VZCustomVirtioDeviceConfiguration`**, set its deviceID, PCI class/subclass, and virtioQueueCount (the example is a single-queue entropy device), set a **`VZCustomVirtioDeviceDelegateProvider`** (with a deviceQueue and delegate), and add it to the VM configuration's customVirtioDevices array."},{"t":1100,"title":"Attach a delegate to a VZCustomVirtioDevice","body":"Explains that once the VM starts, a **`VZCustomVirtioDevice`** object is created and the configuration delegate's **`didCreateDevice`** is called. In that function you should set the device's delegate (implementing `VZCustomVirtioDeviceDelegate`) and hold onto the device itself so it can later trigger guest interrupts."},{"t":1122,"title":"Process Virtio queue elements","body":"Explains that `VZCustomVirtioDeviceDelegate`'s **`didReceiveNotificationFor`** is where you process the device's queue: dequeue with `while let element = queue.nextElement()`, process each, then call `element.returnToQueue()`. Notes that custom devices require a custom guest driver and that you should follow Virtio queue best practices for efficient communication. It closes by mentioning other advances like iCloud support, EFI Secure Boot, and Metal argument/indirect command buffers for macOS guests."}],"code":[]},"related":[{"id":"101","title":"Keynote","gloss":"主題演講","gloss_en":"Keynote","category":"other","categoryLabel":"其他"},{"id":"102","title":"Platforms State of the Union","gloss":"平台現況報告","gloss_en":"Platforms State of the Union","category":"other","categoryLabel":"其他"},{"id":"111","title":"Keynote (ASL)","gloss":"主題演講(美國手語版)","gloss_en":"Keynote (American Sign Language)","category":"other","categoryLabel":"其他"},{"id":"112","title":"Platforms State of the Union (ASL)","gloss":"平台現況報告（美國手語版）","gloss_en":"Platforms State of the Union (American Sign Language)","category":"other","categoryLabel":"其他"},{"id":"122","title":"WWDC26 Platforms State of the Union Recap","gloss":"WWDC26 平台現況演講重點回顧","gloss_en":"WWDC26 Platforms State of the Union recap","category":"other","categoryLabel":"其他"}]}</script>
