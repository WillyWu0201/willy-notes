<script id="d" type="application/json">{"s":{"id":"227","title":"Create UI prototypes using agents in Xcode","gloss":"在 Xcode 用代理人打造 UI 原型","category":"ai","categoryLabel":"AI 與機器學習","duration":1091,"url":"https://developer.apple.com/videos/play/wwdc2026/227/","takeaway":"善用 Xcode 內的 AI 代理人快速探索 UI 可能性、迭代版面，並打磨關鍵互動時刻，加速原型製作。","chapters":[[0,"Introduction"],[176,"Exploring UI possibilities"],[451,"Making your app feel lived in"],[679,"Tuning key moments"],[1051,"Next steps"]],"points":[{"text":"示範如何在 **Xcode** 用 **AI 代理人（agents）**為 App 製作原型，快速嘗試互動與版面。","hot":true},{"text":"藉代理人**探索 UI 的多種可能性**，在動手寫死實作前先比較不同設計方向。","hot":false},{"text":"透過填入擬真內容讓 App「**感覺像真的在使用**」（feel lived in），原型更貼近真實情境。","hot":false},{"text":"聚焦**調校關鍵時刻（tuning key moments）**，打磨動畫與互動細節提升質感。","hot":false}],"apis":[],"audience":"**想用 AI 加速 UI 原型與設計迭代**的 iOS 開發者與設計師。","gloss_en":"Prototype UI with agents in Xcode","takeaway_en":"Use AI agents in Xcode to quickly explore UI possibilities, iterate on layouts, and polish key interaction moments, accelerating prototyping.","points_en":[{"text":"Demonstrates how to prototype your app in **Xcode** with **AI agents**, quickly trying out interactions and layouts.","hot":true},{"text":"Use agents to **explore multiple UI possibilities**, comparing different design directions before committing to a hardcoded implementation.","hot":false},{"text":"Make the app **feel lived in** by populating it with realistic content, so prototypes more closely match real scenarios.","hot":false},{"text":"Focus on **tuning key moments**, polishing animation and interaction details to raise the quality.","hot":false}],"audience_en":"iOS developers and designers who want to **use AI to accelerate UI prototyping and design iteration**.","summary":["這場由 Apple Design Team 的 prototyper Sam 主講，主軸是用 **Xcode 裡的 coding agents** 搭配 **Xcode previews** 來做 UI **prototyping**（原型設計）。講者的核心立場是：產出 app 從未如此容易，因此要脫穎而出，「有意圖的設計」更顯關鍵；prototyping 讓你快速試很多方向，而 agents 能把你描述的點子直接變成**真實的原生程式碼**，可一路帶進正式開發。但他反覆強調：**別把批判性思考外包給工具**，agent 是協作者，最終判斷與決定權永遠在你手上。","第一個階段是 **explore UI possibilities**。講者示範模糊的 prompt（「做一個讀書會 app」）會讓 agent 自行臆測功能與版面，使你被錨定在有缺陷的起點、最終淪為 feature creep。改進三原則：**先想清楚要的功能與重點**、給予**風格／氛圍線索**（咖啡店暖色調？紙張與漂亮字體？），最重要的是**一次要多個方案**，並要求每個變體各自擁有具名的 Swift preview。範例一口氣產生 10 個方案（Club Hub、Cozy、Editorial、Blueprint Atelier 等），接著用 follow-up prompt 指名喜歡的元素去 **remix** 混搭。口訣是 **go wide, remix, repeat**。","第二階段是讓 app **feel lived in**（有真實使用感）。在還無法給人試用時，可請 agent 扮演使用者、搭配匯入的圖片，把空白模板填成貼近真實的內容。prompting 訣竅包括：一樣要**多個 preview**、自己**停下來想 edge cases**（沒排定聚會時詳情頁長怎樣）、確保**範例內容對你的受眾合理**（讀書會就要圍繞書）、特別注意**會無上限成長的元素**（成員數、訊息長度、書單長度）並決定截斷或換行，以及請 agent 把 sample model 放進**可重用、可讀的獨立檔案**。範例藉此補上空白狀態 UI、處理過長文字 truncation、把過長排行榜改成顯示相對名次＋展開控制，甚至讓詳情頁配色隨書封變化。","第三階段是 **tune key moments**——動畫與互動的微調。講者先概覽幾種動態元素：**ease**（加速／減速，可調時長）、**spring**（可調 stiffness、damping、mass）、拖曳時的 **friction & inertia**（感知重量）、**device motion**（如 Wallet 卡片的視差光澤）與 **haptics**（如 Find My 漸近提示）。關鍵技巧是：與其在散落各處的常數間來回切換，不如請 agent **打造一個 tuning panel**（調校面板）。最佳做法是盡量詳述要調的東西、把動畫拆成**phases**（建立共通詞彙）、並指定面板能在較寬視窗**並排顯示**而非用會擋住內容的 modal。範例用兩階段（轉場進詳情頁、隨後各列交錯進場）的調校面板，降低 delay 與 staggered 時序、改用 bouncy preset，把轉場調到順暢愉悅。整場大主題：把 agent 當協作者、**縮短回饋迴圈**，而你的判斷才是關鍵。"],"deepdive":[{"t":0,"title":"Introduction","body":"Apple Design Team 的 prototyper Sam 開場，指出生態系裡令人喜愛的互動多半來自反覆迭代與細心調校；既然產出 app 已非常容易，**有意圖的設計**才是脫穎而出的關鍵，而這正是 **prototyping** 的價值。他預告會用 Xcode 的新工具，把一個未經雕琢、第一版生成的介面，推進到目的明確、量身打造的設計，並涵蓋探索、注入真實內容、調校關鍵時刻三大主題。先建立兩個基礎能力：**coding agents**（用自然語言描述就能實作功能）與 **Xcode previews**（不必每次重建即可預覽互動）。講者強調 agent 產出**真實原生程式碼**可帶進後續開發，但**不要把批判性思考外包**——agent 是協作者，你有最終決定權。"},{"t":176,"title":"Exploring UI possibilities","body":"以打造讀書會 app 為例，示範**模糊 prompt**（「做一個定期聚會的讀書會 UI」）的問題：agent 自行臆測功能與版面、產生任意的導覽元素，讓你被**錨定在有缺陷的起點**並逐漸 feature creep。改進三原則：**先想清楚功能與高層重點**、給予**風格／氛圍線索**（咖啡店暖色調 vs. 紙張與字體質感），以及最重要的——**一次要求多個發散方案**、且每個變體各有具名的 Swift preview。範例因此產生 10 個方案（Club Hub、Cozy 用 New York 字體、Editorial、Blueprint Atelier 等），再以 follow-up 指名喜歡的元素去 **remix**。口訣：**go wide, remix, repeat**。"},{"t":451,"title":"Making your app feel lived in","body":"談如何在還無法讓人實際試用時，讓 app **有真實使用感**：請 agent 扮演使用者、搭配匯入的圖片，把鬆散的空白模板填成豐富、貼近真實的內容。prompting 訣竅：一樣要**多個 preview**；自己**停下來想 edge cases**（例如尚未排定聚會時詳情頁怎麼呈現）並具體指明要迭代的介面狀態；確保**範例內容對受眾合理**（讀書會內容要圍繞書）；特別留意**會無上限成長**的元素（成員數、對話長度、過往書單）並決定截斷或多行；並請 agent 把 sample model 放進**可重用、可讀的獨立檔案**以便修改。範例據此補上帳號管理與 call-to-action 的空白狀態 UI、處理過長聚會描述的 truncation、把過長排行榜改成顯示相對名次＋展開控制，甚至讓詳情頁配色隨書封顏色變化。"},{"t":679,"title":"Tuning key moments","body":"聚焦動畫與互動的微調——SwiftUI 讓你超越靜態，進入互動、動畫與轉場。先概覽幾種動態元素：**ease**（加速／減速，自選時長）、**spring**（可調 stiffness、damping、mass）、拖曳的 **friction & inertia**（如 Music 關閉 sheet 的感知重量）、**device motion**（如 Wallet 卡片的虹彩視差）與 **haptics**（如 Find My 漸近提示）。本例專注動畫。關鍵技巧：與其在散落各處的常數間 context switch，不如請 agent **打造一個 tuning panel** 來即時試不同參數。最佳做法：盡量詳述要調什麼、把動畫拆成 **phases**（建立共通詞彙）、並指定面板能在**較寬視窗並排顯示**而非用會擋住內容的 modal。範例以兩階段（轉場進詳情頁、隨後各列交錯進場）的調校面板，降低 delay 與 staggered 時序、改用 **bouncy** preset，把轉場調到順暢愉悅。"},{"t":1051,"title":"Next steps","body":"總結全場大主題：**不要把 agent 當設計師，而要當協作者**，協助你找到對自己 app 最好的體驗。任何時候在管理一個 view 的多種設定、或在不同動畫／互動參數間抉擇，就**做一個 tuning panel、縮短回饋迴圈**，迭代到感覺最對為止。並推薦延伸觀看「Xcode, agents, and you」。最後重申：工具終究是幫你為使用者找到最佳體驗，**你的判斷才是關鍵拼圖**。"}],"summary_en":["Presented by Sam, a prototyper on the Apple Design Team, this session centers on using **coding agents in Xcode** together with **Xcode previews** to **prototype** UI. The core stance: since producing an app has never been easier, designing with intention is what makes you stand out, and prototyping lets you quickly try many directions. Agents turn what you describe into **real native code** you can carry forward into actual development — but the talk repeatedly insists you **not delegate critical thinking** to the tools. Agents are collaborators; your judgment and final say always remain yours.","The first stage is **exploring UI possibilities**. A vague prompt (\"make a book club app\") leads the agent to guess at features and layout, anchoring you to a flawed start that drifts into feature creep. Three fixes: **think through the features and high-level points up front**, give **stylistic cues** (the warm palette of a coffee shop? the feel of paper and beautiful typography?), and — most importantly — **ask for multiple divergent options**, each with its own named Swift preview. The sample generates 10 variations at once (Club Hub, Cozy, Editorial, Blueprint Atelier, and more), then a follow-up prompt names favorite elements to **remix** together. The mantra: **go wide, remix, repeat**.","The second stage is making the app **feel lived in**. When it's not yet ready for real users, have the agent play the role of someone using the app, combined with imported images, to fill a blank template with rich, plausible content. Prompting tips: again ask for **many previews**; **stop and reason through edge cases** yourself (how does the detail area look with no meeting scheduled?); make sure **sample content is plausible for your audience** (a book club's discussions should be about books); watch elements that can **grow unbounded** (member count, message length, past-books list) and decide on truncation or multiple lines; and ask the agent to keep sample models in a **reusable, readable separate file**. The sample uses this to add blank-slate UI, truncate overlong text, replace a runaway leaderboard with a relative-rank view plus an expand control, and even adapt the detail page's colors to book covers.","The third stage is **tuning key moments** — animation and interaction. The talk surveys dynamic elements: **ease** (accelerate/decelerate, choose the duration), **spring** (tune stiffness, damping, mass), **friction & inertia** when dragging (perceived weight), **device motion** (like the iridescent parallax of a Wallet card), and **haptics** (like Find My's proximity cues). The key technique: rather than context-switching between constants scattered across the code, ask the agent to **build a tuning panel**. Best practices: be detailed about what you're iterating on, break the animation into **phases** (a shared vocabulary), and specify a **side-by-side layout** on a wider window instead of a content-obscuring modal. The sample tunes a two-phase transition (into the detail page, then staggered row entrances), lowers the delay and stagger timings, switches to the **bouncy** preset, and lands a smooth, delightful result. The overarching theme: treat the agent as a collaborator, **shorten the feedback loop**, and let your judgment lead."],"deepdive_en":[{"t":0,"title":"Introduction","body":"Sam, a prototyper on the Apple Design Team, opens by noting that the loved interactions across the ecosystem come from relentless iteration and careful tuning; since producing an app is now easy, **designing with intention** is what stands out — which is where **prototyping** comes in. He previews using new Xcode tools to move from an unrefined, first-pass generated interface to a purposeful, tailored one, across three themes: exploring, bringing in real content, and tuning key moments. He establishes two foundations: **coding agents** (describe what you want and they implement it) and **Xcode previews** (visualize and interact without rebuilding). He stresses that agents produce **real native code** you can carry forward, but warns you to **not delegate critical thinking** — they are collaborators and you have final say."},{"t":176,"title":"Exploring UI possibilities","body":"Using a book club app as the example, he shows the problem with a **vague prompt** (\"create a UI for managing a book club that meets regularly\"): the agent guesses features and layout, creates arbitrary navigation, and **anchors you to a flawed start** that drifts into feature creep. Three fixes: **think through features and high-level points first**, give **stylistic cues** (a coffee shop's warm palette vs. the feel of paper and typography), and — most importantly — **ask for multiple divergent options**, each with its own named Swift preview. The sample produces 10 variations (Club Hub, Cozy in the New York typeface, Editorial, Blueprint Atelier, and more), then a follow-up names favorite elements to **remix**. The mantra: **go wide, remix, repeat**."},{"t":451,"title":"Making your app feel lived in","body":"Covers giving an app a sense of **real use** before it's ready for real users: have the agent play the role of a user, combined with imported images, to fill a loosely populated template with rich, realistic content. Prompting tips: ask for **many previews**; **stop and think through edge cases** yourself (e.g. the detail page with no meeting scheduled) and be specific about which interface states to iterate; make **sample content plausible for the audience** (a book club's discussions should center on books); watch elements that can **grow unbounded** (member count, conversation length, past-books list) and decide on truncation or multiple lines; and have the agent keep sample models in a **reusable, readable separate file**. The sample then adds account-management and call-to-action blank-slate UI, truncates overlong meeting descriptions, replaces a too-long leaderboard with a relative-rank view plus an expand control, and adapts the detail page's colors to the book covers."},{"t":679,"title":"Tuning key moments","body":"Focuses on tuning animation and interaction — SwiftUI takes you beyond the static into interaction, animation, and transitions. He surveys dynamic elements: **ease** (accelerate/decelerate, choose the duration), **spring** (tune stiffness, damping, mass), **friction & inertia** when dragging (the perceived weight, like closing a sheet in Music), **device motion** (the iridescent parallax of a Wallet card), and **haptics** (Find My's proximity cues). This app's key moments are animations. The key technique: instead of context-switching among constants scattered across the code, ask the agent to **build a tuning panel** to try parameters live. Best practices: be detailed about what to iterate on, break the animation into **phases** (a shared vocabulary), and specify a **side-by-side layout** on a wider window rather than a content-obscuring modal. The sample tunes a two-phase transition (into the detail page, then staggered row entrances), reduces the delay and stagger timings, switches to the **bouncy** preset, and reaches a smooth, delightful result."},{"t":1051,"title":"Next steps","body":"Wraps up the big theme: **don't think of agents as designers, but as collaborators** that help you arrive at the best possible experience for your app. Whenever you're managing multiple configurations of a view or choosing between animation/interaction parameters, **make a tuning panel, shorten the feedback loop**, and iterate to what feels optimal. He recommends the related talk \"Xcode, agents, and you,\" and closes by reiterating that the tools exist to help you find the best experiences for people — and **your judgment is the key piece of the puzzle**."}],"code":[]},"related":[{"id":"121","title":"Announcing Apple’s next big step for Siri and iPhone","gloss":"宣布 Apple 為 Siri 與 iPhone 邁出的下一大步","gloss_en":"Announcing Apple's next big step for Siri and iPhone","category":"ai","categoryLabel":"AI 與機器學習"},{"id":"232","title":"Run local agentic AI on the Mac using MLX","gloss":"用 MLX 在 Mac 上執行本機 agentic AI","gloss_en":"Run local agentic AI on the Mac using MLX","category":"ai","categoryLabel":"AI 與機器學習"},{"id":"233","title":"Explore distributed inference and training with MLX","gloss":"用 MLX 探索分散式推論與訓練","gloss_en":"Explore distributed inference and training with MLX","category":"ai","categoryLabel":"AI 與機器學習"},{"id":"237","title":"What’s new in image understanding","gloss":"影像理解的新功能","gloss_en":"What's new in image understanding","category":"ai","categoryLabel":"AI 與機器學習"},{"id":"240","title":"Build intelligent Siri experiences with App Schemas","gloss":"用 App Schemas 打造智慧 Siri 體驗","gloss_en":"Build intelligent Siri experiences with App Schemas","category":"ai","categoryLabel":"AI 與機器學習"}]}</script>
