<script id="d" type="application/json">{"s":{"id":"226","title":"Create live communication experiences","gloss":"打造即時通訊體驗","category":"uikit","categoryLabel":"UIKit","duration":1038,"url":"https://developer.apple.com/videos/play/wwdc2026/226/","takeaway":"用 LiveCommunicationKit 的 ConversationManager 與動作委派模型，將即時通話整合進系統體驗，並支援來電、去電、群組與合併等場景。","chapters":[[1,"Introduction"],[401,"Set up a conversation manager"],[476,"Incoming conversations"],[562,"Report the incoming conversation to the system"],[597,"Implement the delegate"],[613,"Fulfill the join action"],[677,"Route end actions"],[689,"Outgoing conversations"],[734,"Create a start action"],[743,"Perform the action"],[749,"Route start actions"],[798,"Groups"],[831,"Start group conversations"],[841,"Report group membership updates"],[926,"Route merge actions"],[933,"Handle the merge action"]],"points":[{"text":"**LiveCommunicationKit** 透過 **ConversationManager** 與其 Configuration（鈴聲、圖示、視訊支援、handle 類型等）把即時通訊整合進系統。","hot":true},{"text":"來電以 **PushKit** 收到 VoIP 推播後，呼叫 **reportNewIncomingConversation** 回報系統，再於 delegate 處理 **JoinConversationAction**。","hot":false},{"text":"去電建立 **StartConversationAction** 並以 manager.perform 執行；通話狀態用 **reportConversationEvent** 回報連線進度。","hot":false},{"text":"支援**群組通話**：以 Conversation.Update 回報成員變動，並處理 **MergeConversationAction** 合併多通對話。","hot":false}],"apis":["LiveCommunicationKit","ConversationManager","ConversationManagerDelegate","JoinConversationAction","StartConversationAction","MergeConversationAction","Conversation.Update","PushKit","PKPushRegistry"],"audience":"**開發 VoIP、視訊或語音通話 App** 並希望深度整合系統來電 UI 與群組通話的工程師。","gloss_en":"Build live communication experiences","takeaway_en":"Use LiveCommunicationKit's ConversationManager and action delegate model to integrate real-time calls into the system experience, with support for incoming, outgoing, group, and merged call scenarios.","points_en":[{"text":"**LiveCommunicationKit** integrates real-time communication into the system through **ConversationManager** and its Configuration (ringtone, icon, video support, handle types, and more).","hot":true},{"text":"For incoming calls, after receiving a VoIP push via **PushKit**, call **reportNewIncomingConversation** to report it to the system, then handle the **JoinConversationAction** in the delegate.","hot":false},{"text":"For outgoing calls, create a **StartConversationAction** and execute it with manager.perform; report connection progress with **reportConversationEvent**.","hot":false},{"text":"Supports **group calls**: report membership changes with Conversation.Update and handle **MergeConversationAction** to merge multiple conversations.","hot":false}],"audience_en":"Engineers **building VoIP, video, or voice calling apps** who want deep integration with the system call UI and group calling.","summary":["Apple 工程師 Yaseen 介紹 **LiveCommunicationKit**——打造即時通訊 app 的現代框架。當 app 採用此 API，其通話／通訊就能取得與電話 app 完全相同的系統級體驗：來電時在 **Lock Screen** 全螢幕呈現聯絡人姓名與照片、標準控制項，並出現在 Phone app 的 **Recents** 與聯絡人詳情中，也能在 **Dynamic Island** 多工。若你的 app 仍使用 `CXProvider` 等傳統做法，現在正是遷移到更彈性、功能更豐富的 LiveCommunicationKit 的好時機。","核心概念是 **conversation**：代表人與人之間的即時互動，只在有人參與時存在。它由兩部分組成——**handles**（識別參與者，含 kind／value／display name，正確設定 kind 可讓系統比對通訊錄並顯示姓名照片）與 **capabilities**（描述對話能做什麼，如 video、pausing、merging，系統據此決定顯示哪些控制項與手勢）。對話會經歷 idle → joining → joined →（可 pause／resume）→ leaving → left 的生命週期。架構上，app 透過 **ConversationManager** 回報對話與事件，並在其 **delegate** 中回應系統；無論互動來自系統 UI 或 app 自身 UI，都透過同一個 `perform action` callback 流動，確保 app 與系統狀態不會脫節。","在實作上：先以 `ConversationManager.Configuration`（鈴聲、圖示、群組上限、是否進 Recents、是否支援視訊、支援的 handle 類型）建立 manager 並設定 delegate，並在 Xcode 開啟 Audio 與 VoIP 背景模式。**來電**靠 **PushKit** 的 VoIP push 喚醒 app，必須在 delegate 方法返回前以 `reportNewIncomingConversation` 回報，否則系統會終止 app；使用者接聽後系統送來 `JoinConversationAction`，app 回報 connecting、完成媒體設定後 fulfill。**去電**則由 app 建立 `StartConversationAction` 並 `perform`，並可捐贈 intent 讓 Siri 與 Recents 重撥。**群組對話**追蹤 members 與 activeRemoteMembers 兩種成員，並支援以 `MergeConversationAction` 合併兩個對話、以 unmerge 拆回，皆遵循相同的 delegate 模式。"],"deepdive":[{"t":1,"title":"Introduction","body":"Apple 工程師 Yaseen 開場，說明採用 **LiveCommunicationKit** 後，app 的對話可在 **Lock Screen** 全螢幕呈現（姓名、照片、標準控制項），並出現在 Recents 與 Dynamic Island，與電話 app 一致。接著鋪陳核心概念——**conversation** 由 handles 與 capabilities 組成、其生命週期，以及 app 如何透過 ConversationManager 與其 delegate 用 actions 與系統溝通。建議從 `CXProvider` 遷移過來。"},{"t":401,"title":"Set up a conversation manager","body":"用 `ConversationManager.Configuration` 設定鈴聲、app 圖示、conversation group 上限、是否進 Recents、是否支援視訊與支援的 handle 類型，再建立 **ConversationManager** 並指派 delegate。因為整個 app 生命週期都需要它，應在啟動時建立；並在 Xcode target 開啟 Audio 與 Voice over IP 背景模式以在背景或鎖定時維持對話。"},{"t":476,"title":"Incoming conversations","body":"以「David 在 Adam 鎖定的裝置上發起對話」為例：發起端 app 組出含 handle 與 conversation UUID 的 payload，經伺服器轉送到 Adam 裝置；收到後 app 解碼並用 handle 與 capabilities 建立 `Conversation.Update`，再回報給系統，系統更新 Lock Screen UI。"},{"t":562,"title":"Report the incoming conversation to the system","body":"**PushKit** 在 app 未執行時以 VoIP push 喚醒並把 payload 送到 delegate 方法。app 必須在該方法返回前回報對話，否則系統會終止 app。範例在 PushKit delegate 中解出 handle 與 UUID，組 `Conversation.Update`（含 video、pausing、merging）並以 `reportNewIncomingConversation` 回報。"},{"t":597,"title":"Implement the delegate","body":"每當有人接聽、暫停或合併對話，系統都會以 action 送到 app 的 `perform action` delegate callback。app 在其中用 switch 依 action 型別路由到對應 handler；無法處理的型別則呼叫 `action.fail()`。這個單一程式路徑確保 app 與系統狀態同步、不重複管理。"},{"t":613,"title":"Fulfill the join action","body":"處理 `JoinConversationAction` 時，先確認 manager 正追蹤符合 UUID 的對話，否則 fail。接著回報 `conversationStartedConnecting`（狀態轉 joining），在 Task 中非同步完成連線與媒體串流設定，成功後回報 `conversationConnected` 並 `action.fulfill(dateConnected:)`；失敗則 `action.fail()` 讓系統清理。"},{"t":677,"title":"Route end actions","body":"當使用者點 End，對話轉入 leaving 狀態，系統送來 `EndConversationAction`。在 delegate 的 switch 中新增此型別並交給 handler 拆除媒體串流、fulfill action，對話便從系統 UI 消失。"},{"t":689,"title":"Outgoing conversations","body":"從 app 內部發起對話時，應回報給系統，讓使用者在使用其他 app 時也能維持通話。做法是建立 start action 撥打對方裝置，呼叫 manager 的 `perform`，再在 delegate 中以與 join 相同的方式處理；對方接聽，或 app 回報未接聽／失敗。"},{"t":734,"title":"Create a start action","body":"建立 `StartConversationAction`，帶上全新的 conversation UUID、對方的 `Handle`（type、value、displayName）與是否視訊。"},{"t":743,"title":"Perform the action","body":"呼叫 `manager.perform([startAction])`：manager 先更新系統 UI，再把 action 轉給 delegate，之後便與 join action 相同方式處理。"},{"t":749,"title":"Route start actions","body":"在 delegate 的 switch 中加入 `StartConversationAction` 並交給 `handleStartAction`。對話結束後，使用者可從 Spotlight 或 Recents 重撥——透過支援 start call intent（以 `NSUserActivity` 傳入 scene）並在每次對話結束時捐贈自家 intent 來支援。"},{"t":798,"title":"Groups","body":"群組對話追蹤兩種成員：**members** 包含所有受邀者（系統用以得知人數），**activeRemoteMembers** 只含實際有媒體流動者（系統用以得知誰在主動傳送媒體）。"},{"t":831,"title":"Start group conversations","body":"回報群組對話時，為每位參與者建立 `Handle`，組一個含所有受邀成員的 `StartConversationAction` 並回報。"},{"t":841,"title":"Report group membership updates","body":"當成員加入時，建立 `Conversation.Update` 指定 localMember、新的 activeRemoteMembers，以及支援的 capabilities（含 merging、pausing、unmerging），再用 `reportConversationEvent(.conversationUpdated(...))` 回報，系統據此更新成員顯示。"},{"t":926,"title":"Route merge actions","body":"當兩個對話合併，系統送來 `MergeConversationAction`。在 delegate 的 switch 加入此型別並交給 `handleMergeAction`；unmerge 遵循相同的 delegation 模式。"},{"t":933,"title":"Handle the merge action","body":"merge action 帶有兩個 UUID（來源與目標）。handler 以此查出兩個對話的本地表示，任一不存在即 fail。接著在 Task 中以 `combineStreams` 合併伺服器端媒體串流，回報更新後的成員並 fulfill；若拋錯則 fail，系統隨後更新為合併後的對話 UI。"}],"summary_en":["Apple engineer Yaseen introduces **LiveCommunicationKit**, the modern framework for building real-time communication apps. When an app adopts it, its conversations get the same system-level experience as the Phone app: a full-screen Lock Screen presentation with the contact's name and photo and standard controls, appearances in the Phone app's Recents and contact details, and seamless multitasking in the Dynamic Island. If your app still uses traditional approaches like `CXProvider`, now is a great time to move to the more flexible, feature-rich LiveCommunicationKit.","The core concept is a **conversation**: a single real-time interaction between people that lives only while someone is in it. It has two parts — **handles** (identifying participants via kind/value/display name, where setting the right kind lets the system match a contact and show their name and photo) and **capabilities** (what the conversation can do, like video, pausing, merging, which the system uses to decide which controls and gestures to show). A conversation moves through idle → joining → joined → (pause/resume) → leaving → left. Architecturally, the app reports conversations and events through the **ConversationManager** and responds to the system in its **delegate**; whether an interaction starts from system UI or the app's own UI, it flows through the same `perform action` callback, keeping app and system state in sync.","In practice: create the manager with a `ConversationManager.Configuration` (ringtone, icon, group limits, whether to appear in Recents, video support, supported handle types), set its delegate, and enable the Audio and VoIP background modes in Xcode. **Incoming** conversations are woken via **PushKit** VoIP push and must be reported with `reportNewIncomingConversation` before the delegate method returns or the system terminates the app; after the user answers, the system sends a `JoinConversationAction`, and the app reports connecting, sets up media, then fulfills. **Outgoing** conversations are made by creating a `StartConversationAction` and calling `perform`, plus donating intents so Siri and Recents can redial. **Group conversations** track both members and activeRemoteMembers and support merging two conversations with `MergeConversationAction` (and unmerging back), all following the same delegate pattern."],"deepdive_en":[{"t":1,"title":"Introduction","body":"Apple engineer Yaseen opens, explaining that adopting **LiveCommunicationKit** gives an app's conversations a full-screen **Lock Screen** presentation (name, photo, standard controls), plus Recents and Dynamic Island, matching the Phone app. He then lays out the core concepts — a **conversation** of handles and capabilities, its lifecycle, and how the app talks to the system through the ConversationManager and its delegate using actions. Migrating from `CXProvider` is encouraged."},{"t":401,"title":"Set up a conversation manager","body":"Configure a `ConversationManager.Configuration` with ringtone, app icon, conversation group limits, whether to appear in Recents, video support, and supported handle types, then create the **ConversationManager** and assign a delegate. Since it's needed for the app's entire lifetime, create it at launch; enable the Audio and Voice over IP background modes in the Xcode target to keep conversations going in the background or when locked."},{"t":476,"title":"Incoming conversations","body":"Using \"David starts a conversation with the locked Adam\": the caller's app builds a payload with a handle and conversation UUID, the server forwards it to Adam's device, and on receipt the app decodes it and builds a `Conversation.Update` with the handle and capabilities, reporting it so the system updates the Lock Screen UI."},{"t":562,"title":"Report the incoming conversation to the system","body":"**PushKit** wakes the app with a VoIP push when it isn't running and delivers the payload to the delegate method. The app must report the conversation before the method returns or the system terminates it. The example extracts the handle and UUID in the PushKit delegate, builds a `Conversation.Update` (video, pausing, merging), and reports it via `reportNewIncomingConversation`."},{"t":597,"title":"Implement the delegate","body":"Whenever someone answers, pauses, or merges a conversation, the system sends an action to the app's `perform action` delegate callback. The app routes by action type with a switch; unhandled types call `action.fail()`. This single code path keeps app and system state in sync with no duplicated management."},{"t":613,"title":"Fulfill the join action","body":"To handle a `JoinConversationAction`, first confirm the manager is tracking a conversation matching the UUID, otherwise fail. Then report `conversationStartedConnecting` (state goes to joining), do async connection and media-stream setup in a Task, and on success report `conversationConnected` and `action.fulfill(dateConnected:)`; on failure call `action.fail()` so the system cleans up."},{"t":677,"title":"Route end actions","body":"When the user taps End, the conversation enters leaving and the system sends an `EndConversationAction`. Add this type to the delegate's switch and hand it to a handler that tears down the media stream and fulfills the action, removing the conversation from the system UI."},{"t":689,"title":"Outgoing conversations","body":"When starting a conversation from inside the app, report it to the system so people can keep it going while using other apps. Create a start action to ring the recipient, call `perform` on the manager, and handle it in the delegate the same way as a join; the recipient answers, or the app reports unanswered/failed."},{"t":734,"title":"Create a start action","body":"Build a `StartConversationAction` with a fresh conversation UUID, the recipient's `Handle` (type, value, displayName), and whether it's video."},{"t":743,"title":"Perform the action","body":"Call `manager.perform([startAction])`: the manager first updates the system UI, then forwards the action to the delegate, where it's handled the same way as a join action."},{"t":749,"title":"Route start actions","body":"Add `StartConversationAction` to the delegate's switch, handled by `handleStartAction`. After a conversation ends, users can redial from Spotlight or Recents — supported by handling the start call intent (delivered to your scene as an `NSUserActivity`) and donating your own intent at the end of each conversation."},{"t":798,"title":"Groups","body":"Group conversations track two member types: **members** includes everyone invited (so the system knows how many participants there are), while **activeRemoteMembers** includes only those with media actively flowing (so the system knows who's actively sending media)."},{"t":831,"title":"Start group conversations","body":"To report a group conversation, create a `Handle` for each participant, build a `StartConversationAction` with all invited members, and report it."},{"t":841,"title":"Report group membership updates","body":"When members join, build a `Conversation.Update` naming the localMember, the new activeRemoteMembers, and supported capabilities (including merging, pausing, unmerging), then report it via `reportConversationEvent(.conversationUpdated(...))` so the system updates the displayed membership."},{"t":926,"title":"Route merge actions","body":"When two conversations merge, the system sends a `MergeConversationAction`. Add this type to the delegate's switch, handled by `handleMergeAction`; unmerging follows the same delegation pattern."},{"t":933,"title":"Handle the merge action","body":"The merge action carries two UUIDs (source and target). The handler looks up both conversations' local representations and fails if either is missing. It then combines the server-side media streams with `combineStreams`, reports the updated membership, and fulfills; if anything throws, it fails, and the system updates to the merged conversation UI."}],"code":[]},"related":[{"id":"203","title":"Read between the strokes with PencilKit","gloss":"用 PencilKit 解讀筆跡內容","gloss_en":"Read handwriting content with PencilKit","category":"uikit","categoryLabel":"UIKit"},{"id":"212","title":"Rev up your CarPlay app","gloss":"強化你的 CarPlay App","gloss_en":"Rev up your CarPlay app","category":"uikit","categoryLabel":"UIKit"},{"id":"219","title":"Enhance the accessibility of your reading app","gloss":"強化你閱讀類 App 的無障礙體驗","gloss_en":"Enhance the accessibility of your reading app","category":"uikit","categoryLabel":"UIKit"},{"id":"221","title":"Prepare your tvOS apps for Dynamic Type","gloss":"讓你的 tvOS App 支援動態字型","gloss_en":"Prepare your tvOS app for Dynamic Type","category":"uikit","categoryLabel":"UIKit"},{"id":"278","title":"Modernize your UIKit app","gloss":"現代化你的 UIKit App","gloss_en":"Modernize your UIKit app","category":"uikit","categoryLabel":"UIKit"}]}</script>
