<script id="d" type="application/json">{"s":{"id":"334","title":"Build AI-powered scripts with the fm CLI and Python SDK","gloss":"用 fm CLI 與 Python SDK 打造 AI 腳本","category":"ai","categoryLabel":"AI 與機器學習","duration":996,"url":"https://developer.apple.com/videos/play/wwdc2026/334/","takeaway":"macOS 上新的 fm 命令列工具與 Foundation Models Python SDK，讓你在腳本與 Python 中使用裝置端／PCC 模型，支援結構化輸出、工具呼叫與評估流程。","chapters":[[0,"Introduction"],[82,"Introducing the fm CLI and Python SDK"],[203,"Command line tool"],[302,"fm respond and structured output"],[307,"Prompt the on-device model with fm respond"],[371,"Automating file management with fm"],[475,"Sort files with fm respond and a schema"],[532,"Python SDK"],[534,"Install the Foundation Models Python SDK"],[582,"Prompting, tool calling and guided generation"],[600,"Create a session and respond to a prompt"],[621,"Define a Tool for the language model"],[635,"Generate structured output with @fm.generable"],[644,"Building an evaluation pipeline in Python"],[920,"Next steps"]],"points":[{"text":"新的 **fm CLI** 可用 `fm respond` 直接在終端機提示模型，支援 `--model pcc`、`--image` 影像輸入與 `--schema` 結構化輸出。","hot":true},{"text":"可結合 **fm schema** 與 jq 撰寫 shell 腳本，例如自動**分類與整理檔案**（final 與 draft）。","hot":false},{"text":"**Foundation Models Python SDK**（pip install apple_fm_sdk）提供 LanguageModelSession，可在 Python 中提示模型。","hot":false},{"text":"Python 中以 **fm.Tool** 定義工具、用 **@fm.generable** 與 fm.guide 產生結構化輸出，並可建構評估管線。","hot":false}],"apis":["fm","apple_fm_sdk","LanguageModelSession","fm.Tool","fm.generable","fm.guide","GenerationSchema"],"audience":"**想在 macOS 腳本或 Python 中整合 Apple Foundation Models** 的開發者與自動化工作流程使用者。","gloss_en":"Build AI-powered scripts with the fm CLI and Python SDK","takeaway_en":"The new fm command-line tool and Foundation Models Python SDK on macOS let you use on-device/PCC models in scripts and Python, with support for structured output, tool calling, and evaluation flows.","points_en":[{"text":"The new **fm CLI** lets you prompt the model directly in the terminal with `fm respond`, supporting `--model pcc`, `--image` image input, and `--schema` structured output.","hot":true},{"text":"Combine **fm schema** with jq to write shell scripts, for example to automatically **classify and organize files** (final and draft).","hot":false},{"text":"The **Foundation Models Python SDK** (pip install apple_fm_sdk) provides LanguageModelSession to prompt the model from Python.","hot":false},{"text":"In Python, define tools with **fm.Tool**, produce structured output with **@fm.generable** and fm.guide, and build evaluation pipelines.","hot":false}],"audience_en":"**Developers and automation-workflow users who want to integrate Apple Foundation Models into macOS scripts or Python.**","summary":["由 Foundation Models 框架團隊工程師 Eric Gourlaouen 主講，介紹在 macOS 上運用 **Apple Foundation Models** 的全新方式。WWDC25 推出的 Foundation Models 框架原本只能從 Swift 程式碼存取；macOS 27／iOS 27 帶來 image 輸入與 server model 支援，而本場重點是兩個新管道：macOS 27 內建的 **fm 命令列工具**，以及全新的 **Foundation Models Python SDK**。兩者都無需 API key、無雲端 API 成本，且 API 風格與 Swift 框架高度相似。","**fm CLI** 隨 macOS 27 預裝、直接在 Terminal 使用。`fm` 列出可用指令：`fm respond` 一次性 prompt 並回傳輸出（適合腳本，支援 `--model` 切換 Private Cloud Compute、`--image` 帶入影像、`--schema` 套用結構化輸出）、`fm chat` 啟動互動式對話（含 `/model` 切到 PCC、`/save` 存檔續談等指令）、`fm schema` 建立 schema。預設用裝置端模型（永遠可用），也可切到能力更強但有用量限制的 **Private Cloud Compute** 模型。講者示範用 fm 寫自動化腳本整理檔案：先列出工作目錄檔案，用 `fm schema object` 定義含 final／draft 兩個清單的結構，再用 `fm respond --schema` 讓模型把雜亂檔名分類成草稿與定稿，腳本據此把定稿備份、草稿移到封存碟。","**Python SDK** 讓你從 Python 程式碼存取裝置端模型，需 Python 3.10+、安裝 Xcode、Apple Silicon Mac，用 `pip` 安裝。它涵蓋框架核心功能：text／image 輸入、串流回應、tool calling 與 guided generation，且 API 與 Swift 幾乎一致——建立 `LanguageModelSession`、呼叫 `session.respond`、用 **`@fm.generable`** decorator 定義結構化輸出並傳給 `fm.respond` 的 generating 參數、定義 tool 供模型呼叫。對偏好 Python 的機器學習工程師特別友善。","Python SDK 最大好處是能輕鬆接上 Python 生態系。講者以「預測使用者下一筆雜貨訂單」功能做 case study：在 **Jupyter Notebook** 中先用大型 server model 產生評估資料（含 input 與期望 output），對三種不同 prompt（極簡、較詳細、最完整規則）各跑出 output 存進 **Pandas DataFrame**，再用第三方 server model 當 **judge** 依準則評分，最後用 **matplotlib** 畫圖比較。圖表顯示：過於詳細的 prompt 易超出 context window 而出錯、較簡略的 prompt 易多加品項與幻覺、詳細的則易漏掉應有品項——據此快速在 notebook 內迭代 prompt，無需重 build 整個專案。Swift 開發者則可用 Xcode 27 的 Evaluations 框架。"],"deepdive":[{"t":0,"title":"Introduction","body":"由框架團隊工程師 Eric 開場。WWDC25 推出 **Foundation Models** 框架（含 guided generation 與 tool calling），可在 app 中 prompt 裝置端 Apple Foundation Model。macOS 27／iOS 27 新增 prompt 帶 image、以及存取 server model 等功能。框架無需 API key、無雲端成本，但此前僅能從 Swift 存取。"},{"t":82,"title":"Introducing the fm CLI and Python SDK","body":"宣布兩個在 macOS 上存取 Apple Foundation Models 的新方式：macOS 27 內建的 **fm 命令列工具**（適合在 Terminal 快速測 prompt 或做自動化），以及 **Foundation Models Python SDK**（支援 tool calling、guided generation，API 與 Swift 框架相似，方便 ML 工程師用 Python 接入並建立評估 pipeline）。"},{"t":203,"title":"Command line tool","body":"深入 **fm** CLI：macOS 27 起預裝，於 Terminal 輸入 `fm` 即列出可用指令——`respond`（prompt 並回應）、`chat`（互動介面）、`schema`（建立 schema）等。示範 `fm chat` 與裝置端模型對話、可用 `/model` 切到 **Private Cloud Compute**、`/save` 存檔續談；想要 inline 回應（如腳本中）則用 `fm respond`。"},{"t":302,"title":"fm respond and structured output","body":"說明 `fm respond` 的選項：`--model` 改用 PCC 模型、`--image` 帶入影像。預設用裝置端模型（永遠可用），PCC 模型更大、複雜問題表現更佳但有用量限制。並可用 `fm schema object` 建 schema、配合 `fm respond --schema` 產生結構化輸出。"},{"t":307,"title":"Prompt the on-device model with fm respond","body":"示範最基本用法：在 Terminal 執行 `fm respond` 加上 prompt，稍候即得模型回應。用 `--help` 可查看所有選項。"},{"t":371,"title":"Automating file management with fm","body":"提出實際問題：簡報專案資料夾塞滿草稿，想清理只留定稿、備份並把舊檔移到封存碟，且希望寫成可重跑的腳本。用 fm 在腳本中呼叫語言模型來分辨草稿與定稿，即使檔名雜亂難以規則化排序也能處理。"},{"t":475,"title":"Sort files with fm respond and a schema","body":"逐步解析腳本：先載入工作目錄檔案清單，用 `fm schema object` 定義含 final files 與 draft files 兩個清單的結構化輸出，再用 `fm respond --schema` 與 prompt 讓模型分類。`fm respond` 輸出的是模型生成的 JSON 結果，腳本據此把定稿複製到備份、草稿移到封存。"},{"t":532,"title":"Python SDK","body":"轉向 **Python SDK**：從 Python 程式碼存取裝置端 Apple Foundation Models，涵蓋 prompt（text／image 輸入）、串流、guided generation 與 tool calling。對用過 Swift 框架者，API 與抽象很快上手。"},{"t":534,"title":"Install the Foundation Models Python SDK","body":"安裝需求：Python 3.10 以上、已安裝 Xcode、Apple Silicon Mac，透過 `pip`（或其他套件管理器）安裝。SDK 含框架核心功能，Swift 用過者會覺得 API 與抽象熟悉。"},{"t":582,"title":"Prompting, tool calling and guided generation","body":"以雜貨訂購 app 為例，要評估 prompt 準確度，先在 Python 原型化再實作到 Swift。概覽三項能力：prompt 模型、定義 tool 供模型呼叫（如抓最近幾筆訂單做個人化）、以及 guided generation 限制結構化輸出。"},{"t":600,"title":"Create a session and respond to a prompt","body":"如同 Swift：建立 `LanguageModelSession`（可傳 instructions），呼叫 `session.respond` 帶入 prompt，方法結果即模型輸出。"},{"t":621,"title":"Define a Tool for the language model","body":"如同 Swift 框架，可向模型暴露 tool 以與使用者 context 互動。例如定義一個讓模型呼叫以抓取最近幾筆訂單的 tool，讓回應更個人化。"},{"t":635,"title":"Generate structured output with @fm.generable","body":"用 **`@fm.generable`** decorator 定義想要的輸出結構（如 `ItemsSuggestion` 物件），並把它傳給 `fm.respond` 的 generating 參數，即可用 guided generation 確保模型輸出符合該結構。"},{"t":644,"title":"Building an evaluation pipeline in Python","body":"案例：設計「預測使用者下一筆要加入購物車的品項」功能，需確保預測可靠地基於歷史訂單、並考量購物車既有品項。先用大型 server model 產生評估資料（input 與期望 output），準備三種不同 prompt 的實作（極簡、較詳細、含規則清單最完整），對每筆評估資料各跑出 output 存進 **Pandas DataFrame**，再用 server model 當 **judge** 依準則評分、存回 DataFrame，最後用 **matplotlib** 畫圖。圖表顯示詳細 prompt 易達 context window 上限而生錯、簡略 prompt 易多加與幻覺品項、詳細的易漏品項，據此在 notebook 快速迭代。"},{"t":920,"title":"Next steps","body":"總結新管道並給下一步：先在 Terminal 探索 fm 的選項與功能；再到 GitHub repo 學 Python SDK（含範例片段與文件）；最後實作評估 pipeline——想個模型用法、找出可行 prompt 後，對評估資料集量化效果以衡量 prompt 成效。"}],"summary_en":["Presented by Foundation Models framework engineer Eric Gourlaouen, this session introduces new ways to use **Apple Foundation Models** on macOS. The framework introduced at WWDC25 was previously accessible only from Swift; macOS 27/iOS 27 add image inputs and server-model support, and this session focuses on two new channels: the **fm command line tool** preinstalled on macOS 27, and a new **Foundation Models Python SDK**. Both need no API key and incur no cloud API costs, and their APIs closely mirror the Swift framework.","The **fm CLI** ships with macOS 27 and runs in Terminal. Typing `fm` lists commands: `fm respond` for one-shot prompting that returns output (great for scripts, supporting `--model` to switch to Private Cloud Compute, `--image` to include an image, and `--schema` for structured output), `fm chat` for an interactive conversation (with `/model` to switch to PCC, `/save` to resume later, etc.), and `fm schema` to create a schema. By default it uses the on-device model (always available), but you can switch to the more capable **Private Cloud Compute** model (with usage limits). The presenter automates file cleanup with fm: list the working directory, define a structure with two lists (final/draft) via `fm schema object`, then use `fm respond --schema` to classify messy filenames into drafts and finals, with the script backing up finals and moving drafts to an archive disk.","The **Python SDK** gives Python code access to the on-device model, requiring Python 3.10+, Xcode installed, and an Apple Silicon Mac, installed via `pip`. It covers the framework's core features—text/image inputs, streaming responses, tool calling, and guided generation—and the API is nearly identical to Swift: create a `LanguageModelSession`, call `session.respond`, define structured output with the **`@fm.generable`** decorator passed to `fm.respond`'s generating argument, and define tools for the model to call. It's especially friendly to ML engineers who prefer Python.","The SDK's biggest benefit is easy integration with the Python ecosystem. The presenter's case study—predicting a user's next grocery order—runs in a **Jupyter Notebook**: first generate evaluation data (inputs and expected outputs) with a large server model, run three different prompts (minimal, more descriptive, most comprehensive with rules) to produce outputs stored in a **Pandas DataFrame**, score each with a third-party server model as a **judge**, and chart the results with **matplotlib**. The charts show that overly detailed prompts tend to hit the context window and error, less detailed prompts tend to add excess and hallucinated items, and detailed ones tend to miss expected items—letting you iterate quickly right in the notebook without rebuilding the whole project. Swift developers can instead use Xcode 27's Evaluations framework."],"deepdive_en":[{"t":0,"title":"Introduction","body":"Framework engineer Eric opens. WWDC25 introduced the **Foundation Models** framework (with guided generation and tool calling) for prompting the on-device Apple Foundation Model in apps. macOS 27/iOS 27 add image inputs in prompts and access to server models. The framework needs no API key and incurs no cloud costs, but until now was accessible only from Swift."},{"t":82,"title":"Introducing the fm CLI and Python SDK","body":"Announces two new ways to access Apple Foundation Models on macOS: the **fm command line tool** built into macOS 27 (great for quickly testing prompts in Terminal or for automation), and the **Foundation Models Python SDK** (supporting tool calling and guided generation, with a Swift-like API, easy for ML engineers to use in Python and build evaluation pipelines)."},{"t":203,"title":"Command line tool","body":"Dives into the **fm** CLI: preinstalled with macOS 27, typing `fm` in Terminal lists commands—`respond` (prompt and respond), `chat` (interactive interface), `schema` (create a schema), and more. Demos `fm chat` conversing with the on-device model, switching to **Private Cloud Compute** via `/model`, and `/save` to resume later; for inline responses (as in scripts) use `fm respond`."},{"t":302,"title":"fm respond and structured output","body":"Covers `fm respond` options: `--model` to use the PCC model, `--image` to include an image. The on-device model is the default (always available); the PCC model is bigger and better on complex problems but has usage limits. You can build a schema with `fm schema object` and use it via `fm respond --schema` for structured output."},{"t":307,"title":"Prompt the on-device model with fm respond","body":"Demos the most basic use: run `fm respond` with a prompt in Terminal and shortly get the model's response. Use `--help` to see all options."},{"t":371,"title":"Automating file management with fm","body":"Poses a practical problem: a presentation folder is full of drafts, and you want to keep only finals, back them up, and move old ones to an archive disk—as a re-runnable script. Calling a language model from the script via fm sorts drafts from finals even when the names are messy and hard to sort predictably."},{"t":475,"title":"Sort files with fm respond and a schema","body":"Walks through the script: load the working directory's file list, define structured output with two lists (final and draft files) via `fm schema object`, then use `fm respond --schema` with a prompt to classify. `fm respond` outputs the model-generated JSON result, which the script uses to copy finals to backup and move drafts to the archive."},{"t":532,"title":"Python SDK","body":"Turns to the **Python SDK**: accessing the on-device Apple Foundation Models from Python code, covering prompting (text/image inputs), streaming, guided generation, and tool calling. Those familiar with the Swift framework will pick up the API and abstractions quickly."},{"t":534,"title":"Install the Foundation Models Python SDK","body":"Install requirements: Python 3.10 or later, Xcode installed, and an Apple Silicon Mac, via `pip` (or another package manager). The SDK includes the framework's core features, and the API and abstractions feel familiar to Swift users."},{"t":582,"title":"Prompting, tool calling and guided generation","body":"Using a grocery-ordering app to evaluate prompt accuracy, prototype in Python before implementing in Swift. Overviews three capabilities: prompting the model, defining tools the model can call (e.g., fetch recent orders for personalization), and guided generation to constrain structured output."},{"t":600,"title":"Create a session and respond to a prompt","body":"Just like Swift: create a `LanguageModelSession` (optionally passing instructions), call `session.respond` with a prompt, and the method's result holds the model's output."},{"t":621,"title":"Define a Tool for the language model","body":"As in the Swift framework, you can expose tools to the model to interact with the user's context. For example, define a tool the model can call to fetch the last few orders so it can provide more personalized information."},{"t":635,"title":"Generate structured output with @fm.generable","body":"Use the **`@fm.generable`** decorator to define the desired output structure (such as an `ItemsSuggestion` object) and pass it to `fm.respond`'s generating argument, applying guided generation to ensure the model's output matches that structure."},{"t":644,"title":"Building an evaluation pipeline in Python","body":"Case study: designing a feature that predicts items to add to the user's cart, ensuring predictions reliably reflect previous orders and account for items already in the cart. First generate evaluation data (inputs and expected outputs) with a large server model, prepare three implementations with different prompts (minimal, more descriptive, most comprehensive with a rules list), run outputs for each input into a **Pandas DataFrame**, score with a server model as a **judge** saved back to the DataFrame, then chart with **matplotlib**. Charts show detailed prompts hit the context window and error, minimal ones add excess and hallucinated items, and detailed ones miss items—iterating quickly in the notebook."},{"t":920,"title":"Next steps","body":"Recaps the new channels and gives next steps: first explore fm's options and features in Terminal; then learn the Python SDK from its GitHub repo (with example snippets and docs); finally build an evaluation pipeline—think of a model use, find working prompts, and quantify effectiveness against an evaluation dataset."}],"code":[]},"related":[{"id":"241","title":"What’s new in the Foundation Models framework","gloss":"Foundation Models 框架的新功能","gloss_en":"What's new in the Foundation Models framework","category":"ai","categoryLabel":"AI 與機器學習"},{"id":"242","title":"Build agentic app experiences with the Foundation Models framework","gloss":"用 Foundation Models 框架打造 agentic App 體驗","gloss_en":"Build agentic app experiences with Foundation Models","category":"ai","categoryLabel":"AI 與機器學習"},{"id":"246","title":"LLM search using Core Spotlight","gloss":"使用 Core Spotlight 的 LLM 搜尋","gloss_en":"LLM search using Core Spotlight","category":"ai","categoryLabel":"AI 與機器學習"},{"id":"319","title":"Build with the new Apple Foundation Model on Private Cloud Compute","gloss":"在 Private Cloud Compute 上使用全新 Apple Foundation Model 開發","gloss_en":"Build with the new Apple Foundation Model on Private Cloud Compute","category":"ai","categoryLabel":"AI 與機器學習"},{"id":"326","title":"Integrate on-device AI models into your app using Core AI","gloss":"用 Core AI 把裝置端 AI 模型整合進你的 App","gloss_en":"Integrate on-device AI models with Core AI","category":"ai","categoryLabel":"AI 與機器學習"}]}</script>
