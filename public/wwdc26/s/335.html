<script id="d" type="application/json">{"s":{"id":"335","title":"Improve your prompts by hill-climbing with Evaluations","gloss":"用評估爬坡法改進你的提示詞","category":"ai","categoryLabel":"AI 與機器學習","duration":1601,"url":"https://developer.apple.com/videos/play/wwdc2026/335/","takeaway":"用比較式評估（Evaluation）為提示詞建立基準、以 Cohen's kappa 校準模型評審與人類，再逐步迭代改進提示與選擇模型。","chapters":[[0,"Introduction"],[162,"BookTracker's tagging problem"],[234,"The BookTaggingEvaluation"],[245,"Refined Relevance & Usefulness score dimensions"],[327,"Analyzing the evaluation results"],[506,"Drift between judge and human"],[577,"Measuring drift with Cohen's kappa"],[716,"The alignment dataset, extracted to JSON"],[746,"Building a judge alignment evaluation"],[751,"The judge alignment evaluation: dataset, subject, evaluator"],[780,"Cohen's kappa aggregation"],[804,"The judge calibration test"],[916,"Analyzing alignment failures"],[993,"The experimental judge prompt"],[1036,"Comparative evaluation: control vs experimental"],[1152,"Refining the scoring dimensions"],[1212,"Few-shot worked examples in the judge prompt"],[1283,"Adding few-shot examples to the judge"],[1323,"The BookLookupTool"],[1356,"BookTaggingService with a tools parameter"],[1377,"Evaluation with the lookup tool"],[1389,"Compare with/without the tool in one suite"],[1418,"Going beyond prompts: adding a tool"],[1637,"Next steps"]],"points":[{"text":"用**比較式評估（Evaluation）**搭配 **ScoreDimension** 與 **ModelJudgeEvaluator** 為提示詞建立可量化基準，逐步**爬坡（hill-climbing）**改進。","hot":true},{"text":"以 **Cohen's kappa** 量測模型評審與人類專家之間的**漂移（drift）**，並用對齊資料集校準評審提示。","hot":false},{"text":"用 **.evaluates** 把評估包進 **Swift Testing** 套件，以 **#expect** 設定對齊門檻並做校準測試。","hot":false},{"text":"比較控制組與實驗組的評審提示，並透過**少樣本範例（few-shot examples）**精修評分維度。","hot":false},{"text":"超越單純調提示：為 **BookTaggingService** 加入 **BookLookupTool**（Tool 協定），在同一套件中比較有無工具的差異。","hot":false}],"apis":["Evaluation","ModelJudgeEvaluator","ScoreDimension","Tool","SystemLanguageModel","LanguageModelSession","Swift Testing"],"audience":"**用 Foundation Models 開發功能、想系統化評估與改進提示詞**並挑選合適模型的開發者。","gloss_en":"Improve your prompts by hill-climbing with Evaluations","takeaway_en":"Use comparative Evaluation to baseline your prompts, calibrate the model judge against humans with Cohen's kappa, then iteratively improve prompts and select models.","points_en":[{"text":"Use **comparative Evaluation** with **ScoreDimension** and **ModelJudgeEvaluator** to build a quantifiable baseline for your prompts and improve them step by step through **hill-climbing**.","hot":true},{"text":"Measure the **drift** between the model judge and human experts with **Cohen's kappa**, and calibrate the judge prompt using an alignment dataset.","hot":false},{"text":"Use **.evaluates** to wrap evaluations into a **Swift Testing** suite, setting alignment thresholds and running calibration tests with **#expect**.","hot":false},{"text":"Compare control and experimental judge prompts, and refine score dimensions with **few-shot examples**.","hot":false},{"text":"Go beyond simply tuning prompts: add a **BookLookupTool** (Tool protocol) to **BookTaggingService**, and compare results with and without the tool in the same suite.","hot":false}],"audience_en":"Developers **building features with Foundation Models who want to systematically evaluate and improve their prompts** and pick the right model.","summary":["這場由 Evaluations 框架團隊的 Marcus 主講，核心是 **hill-climbing**（爬坡）這套迭代改善流程：以 develop → run → analyze 為循環，用評估分數當作指南，一次只改一個變數，把每次迭代當成一場**科學實驗**（control 對照組 vs experimental 實驗組）來思考。範例是 Book Tracker 的標籤產生功能——它用 on-device model 依讀者書評產生標籤，但常產出像 poignant（讀者情緒）或 quiet-steadiness（直接抄自書評、不利搜尋）這類不理想的標籤。","整場最關鍵的洞見是 **drift**（漂移）：當 **model judge** 與人類專家對同一批樣本評分時，若兩者傾向不一致，平均分數會隨資料集成長而越拉越遠，最終讓你無法判斷功能是否被正確評估。講者指出單純用 **accuracy** 不夠，因為資料集分數分布不均（樣本多為高品質），judge 只要傾向給高分就會「看似對齊」。解法是引入 **Cohen's kappa**——以 accuracy 減去隨機巧合一致的機率、再除以「有意一致」的可能性，得出真正的 alignment 分數；統計學上 0.6 代表有意義的一致水準。","技術實作上，講者示範用 **Evaluations 框架** 寫一個 judge 對齊評估，由 dataset、subject、evaluators、aggregation 四部分組成：dataset 重用先前評估產生的 Xcode 附件（summary/tag pairs）並加上專家評分，subject 直接回傳已生成的標籤，evaluator 沿用同一個 **ModelJudgeEvaluator**，aggregation 則以自訂方法計算 Cohen's kappa 及各 **ScoreDimension** 的 mean 與 standard deviation。對齊不足時就回到 develop 階段改進 judge 的 prompt：先加入 app 情境與好壞標籤範例，再細化 relevance／usefulness 的 **scoring dimensions**，最後補上少量 **few-shot worked examples**（刻意保持精簡以避免 overfit），在 Xcode 27 的並排 **comparison view** 中比對 control 與 experimental 的結果。","最後，講者示範**超越 prompt** 的改善方式：為標籤服務新增一個 **BookLookupTool**，讓模型能依書評中的角色、場景、引文等線索查出書名與作者，藉此取得更多上下文。做法是讓 `BookTaggingService.generateTags` 多收一個 `tools` 參數（預設空陣列、不影響舊評估），再寫一個帶 tool 的新評估，於同一個 suite 中比較「有 tool」與「無 tool」的品質差異。實務心法：一次只改一個變數、失敗的實驗和成功的一樣有價值、保持實驗的創造力（prompt、tool、模型、dataset、aggregation、evaluator 都可調），並持續留意 drift——讓 judge 與你對齊，才能在資料集成長時持續取得可信的訊號。"],"deepdive":[{"t":0,"title":"Introduction","body":"Evaluations 框架團隊的 Marcus 開場，說明 AI 功能難以驗證在所有情況下是否如預期運作，因此推出 **Evaluations 框架**。核心方法是 **hill-climbing**：develop（做出想衡量的改動）→ run（執行評估）→ analyze（分析結果）的迭代循環，並強調有效的爬坡還需要一點「科學思維」。本場聚焦在「對已有評估管線進行爬坡」，若還沒建好管線，建議先看 \"Meet the Evaluations framework\"。"},{"t":162,"title":"BookTracker's tagging problem","body":"以 **Book Tracker** 為例，其 tagging service 用模型依讀者書評產生標籤。講者示範問題：Little Women 出現 poignant 這類描述讀者**感受**而非書本內容的標籤，以及 quiet-steadiness 這種直接抄自書評、日後搜尋幾乎用不到的標籤。結論是標籤產生器沒有想像中好，而這正是 hill-climbing 的起點。"},{"t":234,"title":"The BookTaggingEvaluation","body":"檢視既有的 **BookTaggingEvaluation**，重點看品質如何被評判。質性面由 **score dimensions** 捕捉：**Relevance** 衡量標籤多能代表書本的情節、主題等資訊，**Usefulness** 衡量標籤作為搜尋詞的好壞。**ModelJudgeEvaluator** 用這些維度加上一段 prompt 為每組標籤評分。講者計畫把 Treasure Island 與 Little Women 兩本書加進資料集再觀察結果。"},{"t":245,"title":"Refined Relevance & Usefulness score dimensions","body":"細看 **ScoreDimension** 的定義：Relevance 區分「書本屬性」（如 suspenseful）與「讀者反應」（如 exhausted），並把標錯 genre 視為嚴重失敗；Usefulness 要求標籤當作 library shelf label——夠廣能讓多本書共用、又夠精確能縮小搜尋，排除自創詞、角色名與過度籠統的字。兩者皆用 1–4 的 **numeric scale** 並對每個分數給出明確判準。"},{"t":327,"title":"Analyzing the evaluation results","body":"進入 analyze 階段，用 Xcode 新的 **evaluations report** 檢視上次執行結果，頂部是 aggregate metric charts、下方是結果表，並開啟 Assistant Editor 比對模型產出與自己預期的標籤。講者對 Treasure Island 給 relevance 4、usefulness 2，但 judge 卻給 usefulness 4；Little Women 也出現同樣分歧，顯示自己與 model judge 的評分有明顯落差。"},{"t":506,"title":"Drift between judge and human","body":"把模型與人類評分的落差定義為 **drift**，並解釋其危害：假設 10 個樣本由 judge 與人各評 1–4 分再取平均，若兩者傾向不一致，平均分會彼此發散；隨資料集成長，drift 會越來越寬，最終難以判斷功能是否被正確評估。解方是把 judge 對齊到專家的判斷。"},{"t":577,"title":"Measuring drift with Cohen's kappa","body":"討論如何量化 drift。最直觀是對齊兩者評分算出 **accuracy**（一致百分比），但它只在每個分數等機率出現時才可靠；實際資料集分布不均（多為高品質、人類傾向給高分），judge 也傾向給高分就會「假性對齊」，放到更大資料集仍會 drift。因此需要一個能考慮加權分布與運氣巧合的替代方案。"},{"t":716,"title":"The alignment dataset, extracted to JSON","body":"為了讓 judge 與人類評同一批資料，講者重用先前評估的產物：因為評估在測試中執行，Xcode 產生了含所有評估資料的 attachment，可從中抽取 summary 與 tag pairs 成 JSON。接著在每筆加上自己的專家評分，這份檔案就成為對齊評估的輸入。"},{"t":746,"title":"Building a judge alignment evaluation","body":"說明對齊評估由四個元件構成：**dataset**、**subject**、**evaluators**、以及結果的 **aggregation**。重點在於 judge 與人必須評估**完全相同**的資料集，才能公平比較兩者的評分傾向。"},{"t":751,"title":"The judge alignment evaluation: dataset, subject, evaluator","body":"逐一實作：dataset 載入抽取出的 summary/tag pairs；subject 因標籤已生成，直接回傳既有標籤而非重新呼叫 API；evaluator 則沿用與 book-tags 評估**完全相同**的 ModelJudgeEvaluator，讓 judge 在此給出它的評分。"},{"t":780,"title":"Cohen's kappa aggregation","body":"在 aggregation 階段比較自己與 judge 的評分，用自訂 aggregation method 計算 **Cohen's kappa**：以 accuracy 減去兩者隨機一致的機率，再除以隨機一致的反面（即有意一致的機率），得出 alignment。除了 kappa，也一併算出每個 score dimension 的 **mean** 與 **standard deviation**，方便觀察 judge 分數的升降趨勢。"},{"t":804,"title":"The judge calibration test","body":"用 Swift Testing 設定測試，期望 relevance 與 usefulness 的 alignment 分數都大於 **0.6**（統計學上代表有意義的一致水準）。執行後測試**失敗**，代表期望未達成，於是再次進入 analyze 階段檢視細節。"},{"t":916,"title":"Analyzing alignment failures","body":"在 evaluation report 中發現 relevance 與 usefulness 對齊分數都偏低。開 Assistant 細看樣本：Frankenstein 的 judge 與人分歧很大（judge 竟認為 self-help、self-improvement 相關）；The Ramakien 則在 usefulness 上分歧，visual-dimension、quaint-dignity 等標籤過度具體。講者判斷問題在於 judge 的 prompt 缺乏足夠 context。"},{"t":993,"title":"The experimental judge prompt","body":"改進方向是寫一個新 prompt 來和現行 prompt 比較。借用科學實驗概念：**control group** 用原本的 judge prompt 當基準，**experimental group** 用改寫後更詳盡的 prompt——先給 judge 關於 app 與評判對象的 context，再給好標籤的範例與辨識壞標籤的方式。"},{"t":1036,"title":"Comparative evaluation: control vs experimental","body":"把兩個評估放進同一 test suite 一起執行並比較。結果 relevance 的 alignment 改善、但 usefulness 大幅下滑；測試仍未通過。講者決定**保留**這次 prompt 改動，把下一輪焦點放在改善 usefulness——體現「一次處理一個 trade-off」的爬坡精神。"},{"t":1152,"title":"Refining the scoring dimensions","body":"用 Xcode 的 comparison view 並排檢視，發現 Picture of Dorian Gray 的 usefulness 分歧大、experimental judge 的分數全是 2 或 3，判得太嚴。為了只變動一個變數，講者先把 experimental 的 prompt 套回 baseline，再單獨修改 scoring dimensions：relevance 加強需要 genre 標籤、usefulness 則更嚴格看待過度具體的標籤。重跑後兩者分數都大幅優於 baseline。"},{"t":1212,"title":"Few-shot worked examples in the judge prompt","body":"雖然已改善但仍未達標。細看 Moby Dick 的 relevance 開始對齊、usefulness 仍需加強，而 Frankenstein 持續讓 judge 出錯。講者判斷 judge 需要一些「自己如何評分」的範例，好讓它依照同一套標準的 pattern 來評判。"},{"t":1283,"title":"Adding few-shot examples to the judge","body":"重寫主 judge prompt，加入更多功能目標說明以 ground 模型，再寫出數個評分範例（worked examples A–F，附上 librarian 給的 Relevance/Usefulness 分數）。刻意只給**少量**範例，避免清單過長導致 overfit 對齊分數而誤判 judge 已對齊。重跑後分數終於超過期望值、測試通過，得以退出爬坡循環。"},{"t":1323,"title":"The BookLookupTool","body":"開始示範超越 prompt 的改善：因標籤用 on-device model 生成（讓使用者隨處皆可用），講者想給模型更多書本 context。Book Tracker 已存有作者與書名，於是建立 **BookLookupTool**，依書評中的角色、場景、引文、情節等 distinguishing details 查出書名與作者；加 tool 本身也是一種 hill-climbing。"},{"t":1356,"title":"BookTaggingService with a tools parameter","body":"為了比較「有 tool」與「無 tool」的品質，修改 **BookTaggingService**，讓 generateTags 多收一個 `tools` 參數並預設為**空陣列**——如此既能傳入新 tool，又能讓既有評估完全不必改動。session 也用 `permissiveContentTransformations` guardrails 建立 LanguageModelSession。"},{"t":1377,"title":"Evaluation with the lookup tool","body":"寫一個新評估 BookTaggingWithLookupEvaluation，內容與原評估**完全相同**，唯一差別是在 subject 中把 `BookLookupTool()` 傳入 tools 陣列。dataset、evaluators、aggregation 全部沿用，確保比較公平。"},{"t":1389,"title":"Compare with/without the tool in one suite","body":"定義兩個評估實例（一個不帶 tool、一個帶 tool）放進同一 suite 執行比較。帶 tool 的服務通過了所有期望、且整體表現較佳，看來可以準備出貨。"},{"t":1418,"title":"Going beyond prompts: adding a tool","body":"但講者指出兩個隱憂：Book Tracker 的 dataset 只有 13 對書評，無法涵蓋使用者可能提交的多樣性；而且觀察到 tool 並未在所有該被呼叫的情境被呼叫，缺乏驗證 tool 是否在正確時機被使用的方法。框架對這兩點都有解，詳見 \"Create robust evaluations for agentic apps\"（tool call evaluators 與 Sample Generator API）。"},{"t":1637,"title":"Next steps","body":"總結爬坡四大心法：一次只改一個變數、把每次迭代當科學實驗來隔離變因；過程需要時間，失敗的實驗和成功的一樣有價值；好實驗需要創造力，instructions、tools、模型、dataset、aggregation、evaluator 全都可調；最後務必留意 **drift**——對齊良好的 model judge 能比人類更快產生評分，在資料集成長時持續提供可信訊號。並提供 Book Tracker app 與對齊評估的範例與文件連結。"}],"summary_en":["Hosted by Marcus from the Evaluations framework team, this session centers on **hill-climbing**: an iterative develop → run → analyze loop that uses evaluation scores as a guide, changing one variable at a time and treating every iteration like a **science experiment** with a control group and an experimental group. The running example is Book Tracker's tag generator, which uses an on-device model to produce tags from a reader's review but often emits poor ones like poignant (a reader emotion) or quiet-steadiness (lifted straight from the review and useless for search).","The key insight is **drift**: when a **model judge** and a human expert rate the same samples but tend to disagree, their averaged scores diverge further as the dataset grows, until you can no longer tell whether your feature is being evaluated correctly. Plain **accuracy** isn't enough, because datasets skew toward high-quality samples, so a judge that simply tends to score high can look aligned while still drifting on larger data. The fix is **Cohen's kappa** — accuracy minus the chance of coincidental agreement, divided by the chance of intentional agreement — yielding a true alignment score, where 0.6 is considered a meaningful level of agreement.","Implementation-wise, the speaker writes a judge-alignment evaluation with the **Evaluations framework**, composed of dataset, subject, evaluators, and aggregation: the dataset reuses the Xcode attachment from a prior run (summary/tag pairs) annotated with expert ratings, the subject simply returns the already-generated tags, the evaluator reuses the same **ModelJudgeEvaluator**, and a custom aggregation computes Cohen's kappa plus the mean and standard deviation of each **ScoreDimension**. When alignment falls short, he returns to develop and improves the judge's prompt — adding app context and good/bad tag examples, refining the relevance/usefulness **scoring dimensions**, and finally adding a few **few-shot worked examples** (kept small to avoid overfitting) — comparing control vs experimental side by side in Xcode 27's new comparison view.","Finally he shows how to improve a feature **beyond prompts** by adding a **BookLookupTool** that resolves a book's title and author from clues in the review (character names, settings, quoted lines), giving the model more context. He adds a `tools` parameter to `BookTaggingService.generateTags` defaulting to an empty array (so existing evaluations are untouched), then writes a new evaluation passing the tool, and compares with-tool vs without-tool in one suite. The practical takeaways: change one variable at a time, treat failed experiments as just as informative as successful ones, stay creative (prompt, tools, model, dataset, aggregation, evaluator are all fair game), and watch for drift — keeping the judge aligned yields trustworthy signal as the dataset grows."],"deepdive_en":[{"t":0,"title":"Introduction","body":"Marcus from the Evaluations framework team opens by noting how hard it is to verify that an AI feature behaves as expected in all cases, motivating the **Evaluations framework**. Its core method is **hill-climbing**: an iterative loop of develop (make a change you want to measure), run (execute the evaluation), and analyze (understand the results), with the reminder that effective hill-climbing also takes some scientific thinking. The session assumes you already have an evaluation pipeline; if not, watch \"Meet the Evaluations framework\" first."},{"t":162,"title":"BookTracker's tagging problem","body":"Using **Book Tracker** as the example, its tagging service generates tags from reader reviews. The speaker shows the problem: Little Women yields poignant (describing the reader's **feelings**, not the book) and quiet-steadiness (lifted from the review and nearly useless for later search). The conclusion is that the tag generator isn't as good as it could be — which is exactly where hill-climbing begins."},{"t":234,"title":"The BookTaggingEvaluation","body":"He reviews the existing **BookTaggingEvaluation**, focusing on how quality is judged. The qualitative side is captured by **score dimensions**: **Relevance** measures how well tags represent the book's plot and themes, and **Usefulness** measures how good the tags are as search terms. A **ModelJudgeEvaluator** uses those dimensions plus a prompt to score each tag set. The plan is to add Treasure Island and Little Women to the dataset and inspect the results."},{"t":245,"title":"Refined Relevance & Usefulness score dimensions","body":"A closer look at the **ScoreDimension** definitions: Relevance distinguishes book properties (e.g. suspenseful) from reader reactions (e.g. exhausted) and treats a mislabeled genre as a serious failure; Usefulness requires tags to act as library shelf labels — broad enough to group several books, specific enough to narrow a search — excluding made-up phrases, character names, and overly generic words. Both use a 1–4 numeric scale with explicit criteria per score."},{"t":327,"title":"Analyzing the evaluation results","body":"In the analyze phase he uses Xcode's new **evaluations report** to inspect the last run — aggregate metric charts on top, a results table below — and opens the Assistant Editor to compare model output against his expected tags. He'd score Treasure Island relevance 4, usefulness 2, but the judge gave usefulness 4; Little Women shows the same divergence, revealing a clear gap between his ratings and the model judge's."},{"t":506,"title":"Drift between judge and human","body":"He names the model-vs-human gap **drift** and explains its danger: with 10 samples each rated 1–4 by a judge and a person, if the two tend to disagree their averages diverge, and as the dataset grows drift widens until you can't tell whether the feature is properly evaluated. The remedy is to align the judge to the expert's opinion."},{"t":577,"title":"Measuring drift with Cohen's kappa","body":"How to quantify drift: the obvious approach is **accuracy** (percent agreement), but it's only reliable when every score is equally likely; real datasets are skewed (mostly high-quality, humans rate high), so a judge that also rates high looks falsely aligned and still drifts on larger data. So an alternative is needed that accounts for the weighted distribution and the chance of lucky agreement."},{"t":716,"title":"The alignment dataset, extracted to JSON","body":"To have judge and human rate the same data, he reuses the prior run's output: because the evaluation ran in a test, Xcode produced an attachment with all the evaluation data, from which he extracts summary and tag pairs into JSON. He then adds his expert ratings to each entry, and this file becomes the input to the alignment evaluation."},{"t":746,"title":"Building a judge alignment evaluation","body":"He explains the alignment evaluation has four components: **dataset**, **subject**, **evaluators**, and **aggregation** of results. The crucial point is that the judge and the human must evaluate the exact same dataset so their rating tendencies can be compared fairly."},{"t":751,"title":"The judge alignment evaluation: dataset, subject, evaluator","body":"Implementing each piece: the dataset loads the extracted summary/tag pairs; the subject simply returns the already-generated tags rather than re-calling the API; and the evaluator reuses the **exact same** ModelJudgeEvaluator as the book-tags evaluation, which is where the judge produces its rating."},{"t":780,"title":"Cohen's kappa aggregation","body":"In aggregation he compares his ratings against the judge's via a custom method computing **Cohen's kappa**: start from accuracy, subtract the chance of random agreement, then divide by the inverse of random agreement (the chance of intentional agreement). Alongside kappa he also computes each score dimension's **mean** and **standard deviation** to track whether the judge's scores rise or fall."},{"t":804,"title":"The judge calibration test","body":"Using Swift Testing he sets an expectation that both relevance and usefulness alignment exceed **0.6** (statistically a meaningful level of agreement). The test **fails**, meaning the expectation isn't met, so he returns to the analyze phase to inspect the details."},{"t":916,"title":"Analyzing alignment failures","body":"The report shows both relevance and usefulness alignment are low. In the Assistant he inspects samples: Frankenstein has a large gap (the judge even thinks self-help and self-improvement are relevant), and The Ramakien diverges on usefulness with overly specific tags like visual-dimension and quaint-dignity. He concludes the judge's prompt lacks sufficient context."},{"t":993,"title":"The experimental judge prompt","body":"The improvement is to write a new prompt and compare it against the current one, borrowing the science-experiment idea: the **control group** uses the original judge prompt as baseline, while the **experimental group** uses a more thorough prompt — first giving the judge context about the app and what it's judging, then examples of good tags and ways to identify bad ones."},{"t":1036,"title":"Comparative evaluation: control vs experimental","body":"Both evaluations run in one test suite for comparison. Relevance alignment improves but usefulness drops considerably, and the test still doesn't pass. He decides to **keep** this prompt change and focus the next round on improving usefulness — embodying the hill-climbing habit of handling one trade-off at a time."},{"t":1152,"title":"Refining the scoring dimensions","body":"Using Xcode's comparison view he spots a big usefulness gap on Picture of Dorian Gray, with the experimental judge scoring everything 2 or 3 — too harsh. To change only one variable, he first applies the experimental prompt back into the baseline, then modifies the scoring dimensions alone: relevance emphasizes needing a genre tag, usefulness becomes more critical of overly specific tags. The rerun shows both scores greatly improved over baseline."},{"t":1212,"title":"Few-shot worked examples in the judge prompt","body":"Improved but still short of the goal. Inspecting Moby Dick shows relevance aligning while usefulness still needs work, and Frankenstein keeps tripping up the judge. He concludes the judge needs examples of how he himself rates, giving it a pattern to judge by his scale."},{"t":1283,"title":"Adding few-shot examples to the judge","body":"He reworks the main judge prompt with more detail about the feature's goal to ground the model, then writes several worked examples (A–F, each with the librarian's Relevance/Usefulness scores). He deliberately uses only a **few** examples to avoid overfitting the alignment score, which would mask whether the judge is truly aligned. The rerun finally exceeds the expected value and the test passes, so he can exit the loop."},{"t":1323,"title":"The BookLookupTool","body":"He moves beyond prompts: since tags are generated on-device (so users can tag books anywhere), he wants to give the model more context. Book Tracker already stores the author and title, so he builds a **BookLookupTool** that resolves a book's title and author from distinguishing details in the review — character names, settings, quoted lines, plot points. Adding the tool is itself a form of hill-climbing."},{"t":1356,"title":"BookTaggingService with a tools parameter","body":"To compare with-tool vs without-tool quality, he modifies **BookTaggingService** so generateTags takes a `tools` parameter defaulting to an **empty array** — letting him pass the new tool while leaving existing evaluations unchanged. The session is built with `permissiveContentTransformations` guardrails on the LanguageModelSession."},{"t":1377,"title":"Evaluation with the lookup tool","body":"He writes a new evaluation, BookTaggingWithLookupEvaluation, identical to the original except that its subject passes `BookLookupTool()` in the tools array. The dataset, evaluators, and aggregation are all reused to keep the comparison fair."},{"t":1389,"title":"Compare with/without the tool in one suite","body":"He defines two evaluation instances — one without the tool, one with — and runs them in the same suite to compare. The tool-using service meets all expectations and performs better overall, so things look ready to ship."},{"t":1418,"title":"Going beyond prompts: adding a tool","body":"But he flags two concerns: Book Tracker's dataset has only 13 review pairs, too few to cover the variety users might submit, and the tool isn't being called in every situation it should be, with no way to verify it fires at the right moments. The framework addresses both — see \"Create robust evaluations for agentic apps\" for tool-call evaluators and the Sample Generator API."},{"t":1637,"title":"Next steps","body":"He recaps four lessons: change one thing at a time and treat each iteration as a science experiment to isolate variables; the process takes time and failed experiments tell you as much as successful ones; good experiments need creativity — instructions, tools, models, dataset, aggregation, and evaluators are all fair game; and finally watch out for **drift**, since a well-tuned model judge rates far faster than humans and keeps providing useful signal as the dataset grows. Links to the Book Tracker app, the alignment evaluations, and the docs are provided."}],"code":[]},"related":[{"id":"241","title":"What’s new in the Foundation Models framework","gloss":"Foundation Models 框架的新功能","gloss_en":"What's new in the Foundation Models framework","category":"ai","categoryLabel":"AI 與機器學習"},{"id":"298","title":"Meet the Evaluations framework","gloss":"認識 Evaluations 框架","gloss_en":"Meet the Evaluations framework","category":"ai","categoryLabel":"AI 與機器學習"},{"id":"319","title":"Build with the new Apple Foundation Model on Private Cloud Compute","gloss":"在 Private Cloud Compute 上使用全新 Apple Foundation Model 開發","gloss_en":"Build with the new Apple Foundation Model on Private Cloud Compute","category":"ai","categoryLabel":"AI 與機器學習"},{"id":"242","title":"Build agentic app experiences with the Foundation Models framework","gloss":"用 Foundation Models 框架打造 agentic App 體驗","gloss_en":"Build agentic app experiences with Foundation Models","category":"ai","categoryLabel":"AI 與機器學習"},{"id":"339","title":"Bring an LLM provider to the Foundation Models framework","gloss":"把 LLM 供應商接入 Foundation Models 框架","gloss_en":"Bring an LLM provider to the Foundation Models framework","category":"ai","categoryLabel":"AI 與機器學習"}]}</script>
