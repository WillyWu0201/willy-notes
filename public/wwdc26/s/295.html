<script id="d" type="application/json">{"s":{"id":"295","title":"Validate your App Intents adoption with AppIntentsTesting","gloss":"用 AppIntentsTesting 驗證你的 App Intents","category":"testing","categoryLabel":"測試","duration":1557,"url":"https://developer.apple.com/videos/play/wwdc2026/295/","takeaway":"用全新的 AppIntentsTesting 框架，透過與 Siri、Shortcuts 相同的基礎架構來自動化測試你的 App Intents、entity 查詢、Spotlight 索引與畫面標註。","chapters":[[16,"Introduction"],[121,"Meet CometCal: your first test"],[149,"How AppIntentsTesting works"],[408,"Your first test: execute an intent"],[579,"Testing entity queries"],[745,"Test an entity string query"],[780,"Implement the EntityStringQuery under test"],[829,"Combining multiple intents"],[942,"Chain multiple intents in one test"],[987,"Test-only intents"],[1065,"Make an intent test-only"],[1102,"Testing Spotlight indexing"],[1227,"Test Spotlight indexing"],[1256,"Testing view annotations"],[1353,"Test view annotations"],[1440,"The App Intents testing workflow"],[1519,"Next steps"]],"points":[{"text":"全新的 **AppIntentsTesting** 框架透過 Siri 與 Shortcuts 相同的基礎架構執行測試，用 `IntentDefinitions` 取得並 `run()` 你的 intent。","hot":true},{"text":"可測試 **entity 查詢**（含 `EntityStringQuery` 的 `entities(matching:)`），驗證搜尋結果是否正確。","hot":false},{"text":"支援在單一測試中**串接多個 intent**（如建立後再更新事件），並可用 `isDiscoverable = false` 建立僅供測試的 intent。","hot":false},{"text":"能驗證 **Spotlight 索引**（`spotlightQuery`）與**畫面標註（view annotations）**，搭配 `XCUIApplication` 確認 UI 呈現正確內容。","hot":false}],"apis":["AppIntentsTesting","IntentDefinitions","AppIntent","EntityStringQuery","spotlightQuery","viewAnnotations","XCUIApplication"],"audience":"**已採用或正在採用 App Intents、想為 Siri 與 Shortcuts 整合建立自動化測試的開發者**。","gloss_en":"Validate your App Intents with AppIntentsTesting","takeaway_en":"Use the new AppIntentsTesting framework to automate testing of your App Intents, entity queries, Spotlight indexing, and view annotations through the same infrastructure as Siri and Shortcuts.","points_en":[{"text":"The new **AppIntentsTesting** framework runs tests through the same infrastructure as Siri and Shortcuts, using `IntentDefinitions` to obtain and `run()` your intent.","hot":true},{"text":"You can test **entity queries** (including `EntityStringQuery`'s `entities(matching:)`) to verify that search results are correct.","hot":false},{"text":"Supports **chaining multiple intents** in a single test (such as creating an event and then updating it), and lets you create test-only intents with `isDiscoverable = false`.","hot":false},{"text":"Can validate **Spotlight indexing** (`spotlightQuery`) and **view annotations**, using `XCUIApplication` to confirm the UI presents the correct content.","hot":false}],"audience_en":"**Developers who have adopted or are adopting App Intents and want to build automated tests for their Siri and Shortcuts integration**.","summary":["App Intents 已是 app 與系統整合的核心，每年驅動越來越多體驗——Siri、Shortcuts 自動化、Spotlight 全系統搜尋、主畫面 Widget 都仰賴它。既然這麼多介面都靠 intent、entity 與 query 運作，這些程式碼一旦回歸就會讓使用者遇到難以預期的系統行為。本場介紹全新的 **AppIntentsTesting** 框架，讓你能透過 Siri 與 Shortcuts 使用的同一套基礎設施來驗證 App Intents。","AppIntentsTesting 是一個**整合測試**框架，類似 UI 測試:測試以字串尋找你的 intent，不需存取 app 內部。測試住在標準的 **XCUITest** bundle、在獨立行程執行，app 在另一個行程跨行程邊界**在裝置上實際執行** intent 並回傳結果，雙方不共享狀態。實務意義是:測試走過完整的 App Intents 堆疊(無 mock、無 stub)、不需把 app 程式碼編譯進測試 target(只傳入 bundle identifier)、CI 會自動納入、且因不依賴任何 UI 而能跨版本穩定。最小範例只需五行:建立 **IntentDefinitions**(傳入 bundle id)、以 `intents[\"CreateCalendarIntent\"]` 取得定義、`makeIntent(...)` 填入參數、`.run()` 執行、再用 dynamic member lookup 對 `result.value` 斷言。","進階部分示範測試 **entity query**:用 `entities(matching:)` 觸發 **EntityStringQuery** 並以 TDD 方式先寫測試再實作 query;以及**串接多個 intent**:把前一個 intent 的結果(EventEntity)直接餵給下一個 intent,且 calendar 這類 entity 參數只要傳字串、執行階段就會自動呼叫對應的 EntityStringQuery 補上——正是 Shortcuts 中組合 intent 的方式。為了讓測試自我隔離,講者介紹 **test-only intents**:標上 `isDiscoverable = false` 並包在 `#if DEBUG`,可用來播種已知資料(如 SeedSampleEventsIntent)或直接跳轉到任一畫面,甚至包裝尚未採用 App Intents 的功能。","最後是觸及 app 之外的**系統層整合**測試:用 `spotlightQuery()` 驗證 entity 是否正確索引進 **Spotlight**(範例抓到一個被註解掉、未重新啟用的索引呼叫並寫測試防止回歸);用 `viewAnnotations()` 驗證 **view annotation** 是否正確告訴系統當前畫面顯示哪個 entity,讓 Siri 能回答「這個活動是幾點?」(範例修正了誤把 calendar id 當識別碼的 bug)。整體工作流是:先用 AppIntentsTesting 為 actions／data／queries 等基礎型別寫單元測試,再為 Spotlight、view annotation、跨 app 傳遞等系統整合寫整合測試,最後仍記得用 Siri 與 Shortcuts 親手實測一次。"],"deepdive":[{"t":16,"title":"Introduction","body":"App Intents 團隊的 Venkatesh 開場,說明 **App Intents** 是 app 與系統整合的核心,逐年驅動更多體驗:**Siri** 互動、**Shortcuts** 自動化、**Spotlight** 全系統搜尋與主畫面 **Widget**。正因如此,每個 intent、entity 與 query 都必須正確運作,而全新的 **AppIntentsTesting** 框架就是用來測試這一切。並指引新手與想了解新進展者分別參考 WWDC25／WWDC26 的相關場次。"},{"t":121,"title":"Meet CometCal: your first test","body":"介紹貫穿全場的範例 app **CometCal**——一個以 SwiftUI 打造、管理行事曆／活動／參與者並完整整合 App Intents 的太空主題日曆 app。講者將以它示範如何用 AppIntentsTesting 測試,並指向同事 Justin 講解如何讓 CometCal 支援 Siri 的 code-along。"},{"t":149,"title":"How AppIntentsTesting works","body":"說明開始測試只需一個 **UI Testing bundle**:建立時須選對 development team(測試 runner 與 app 必須用同一個團隊簽章)、bundle identifier 與 target。隨後示範第一個測試的骨架:`import AppIntentsTesting`、標準 **XCTestCase**,建立 **IntentDefinitions**(傳入 CometCal 的 bundle id),即可在**不 import app** 的情況下取用其所有 intent、entity 與 query。"},{"t":408,"title":"Your first test: execute an intent","body":"完整走一遍執行 intent:以 `definitions.intents[\"CreateCalendarIntent\"]` 取得定義,呼叫 `makeIntent(name:color:)` 填入參數(這裡建立名為 Occupy Saturn、紅色的行事曆),其中 color 是 **AppEnum**,只要傳入其 raw string 值框架就會自動轉型。接著 `.run()` 在裝置上實際執行,用 `result.value` 取回 **CalendarEntity** 並以 dynamic member lookup 斷言 title。講者特別提醒:測試不對 app 編譯,故參數名稱與型別**沒有自動完成**,須自行填對;自訂型別則參考 IntentValueConvertibleWrapper。實機驗證確認新行事曆確實出現,僅五行程式碼即執行了一個 on-device intent。"},{"t":579,"title":"Testing entity queries","body":"說明 entity query 是 App Intents 整合的基石,負責在 Shortcuts、Siri 或任何 App Intents 浮現 entity 之處回傳正確結果,一旦回歸就會造成異常的系統行為。AppIntentsTesting 可驗證 **string query**、**識別碼查詢**與 **suggested entities**。以「把 Cosmic Ray Calibration 活動改名」的情境鋪陳,並指出在 Shortcuts 搜尋時因 string query 尚未實作而「No Options Available」,接著用 TDD 補上。"},{"t":745,"title":"Test an entity string query","body":"撰寫測試:先建立 entity／intent 定義並執行 **SeedSampleEventsIntent** 來重置並植入已知活動,接著用 EventEntity 定義的 `entities(matching: \"Cosmic Ray\")` 在裝置上執行 string query,對回傳的 EventEntity 陣列斷言 count 與 title。講者建議把定義抽離測試函式、把資料植入移到 setUp 以利重用。此時測試**如預期失敗**,精準指出接下來該實作什麼。"},{"t":780,"title":"Implement the EntityStringQuery under test","body":"回到 **EventEntityQuery**——它原本只能依識別碼回傳活動與提供 suggested entities,缺少 string query 能力。講者新增 **EntityStringQuery** 的 conformance 並實作 `entities(matching:)`,以 `localizedCaseInsensitiveContains` 依 title 過濾活動再映射成 entity。重新執行測試即通過,並到 Shortcuts 實機確認這次能搜到活動——先寫測試、再做功能,正是搭配 AppIntentsTesting 的 TDD。"},{"t":829,"title":"Combining multiple intents","body":"說明複雜的 Shortcuts 常把一個 intent 的結果當作另一個 intent 的參數,這種串接是許多自動化的基礎。以「原本為團隊安排 Asteroid Dodgeball 練習、後改為講解規則」的情境,說明要為這個核心工作流寫一個模擬測試。"},{"t":942,"title":"Chain multiple intents in one test","body":"示範串接:先以 **CreateEventIntent** 建立活動,其中 calendar 參數雖型別為 **CalendarEntity**,但只要傳入字串,App Intents 執行階段就會自動呼叫對應的 EntityStringQuery 填入首個符合值。接著把第一個 run 回傳的 **EventEntity** 直接餵給 **UpdateEventIntent** 更新 title,最後斷言更新後的標題——完全對應人們在 Shortcuts 中組合 intent 的方式。此次 setUp 還啟動了 app 以便目視確認建立與更新流程。"},{"t":987,"title":"Test-only intents","body":"強調 AppIntentsTesting 測試輕量、快速、可在每次 commit 執行,而可靠的前提是每個測試**自我隔離**,**test-only intents** 正是為此而生。它們是只為測試存在的聚焦型 intent,可精確建立測試所需資料(避免前次殘留造成 flaky)、不經 UI 直接跳轉到任一畫面,甚至能包裝 app 中**尚未採用 App Intents** 的功能(內部導覽、資料管理、狀態操作)以便透過 AppIntentsTesting 測試。"},{"t":1065,"title":"Make an intent test-only","body":"示範作法:把 intent 標上 `static let isDiscoverable = false`(避免系統在任何地方曝露它),再包進 `#if DEBUG` 編譯指令(讓只有測試能存取)。以稍早 string query 測試用到的 **SeedSampleEventsIntent** 為例,它會在行事曆建立一組已知活動。"},{"t":1102,"title":"Testing Spotlight indexing","body":"轉向觸及 app 之外的系統整合。**Spotlight** 讓人從單一入口搜尋全系統,索引 entity 後使用者不必開 app 就能找到內容。以「指揮官急問 Dark Matter Symposium 何時舉行、但 Spotlight 卻搜不到」的情境揭露 bug:開發期間索引程式碼被註解掉且從未重新啟用,因 app 行為沒變而未被察覺。修法是取消註解,並要寫測試防止再次發生。"},{"t":1227,"title":"Test Spotlight indexing","body":"撰寫防回歸測試:用 `spotlightQuery(\"Supernova Viewing Party\")` 與 Spotlight 對話,先斷言結果為空、再以 **CreateEventIntent** 建立活動,然後再查一次並斷言恰好一筆且 title 相符。測試通過後即可在每次 commit 執行,Spotlight 整合若再壞掉就會立即被攔截。"},{"t":1256,"title":"Testing view annotations","body":"**View annotation** 告訴系統你的畫面當前顯示哪個 entity,讓 **Siri** 理解螢幕內容並直接行動。CometCal 每次導覽到活動都會告訴 Siri 對應的 **EventEntity**,於是即使手機被「蟲洞」拽走也能喊「Siri,這個活動是幾點?」。若 annotation 壞了 Siri 就無從得知,講者藉此引出要修的 bug。"},{"t":1353,"title":"Test view annotations","body":"撰寫測試:先用 **OpenEventIntent** 導覽到活動頁,因測試位於 XCUITest bundle,可用 **XCUI Automation**(`app.staticTexts[...]` 加 `waitForExistence`)確認畫面確實渲染正確活動。接著呼叫 `viewAnnotations()` 取回系統回報的 view annotation 清單,斷言只有一個,並透過 ViewAnnotation 的 `entity` 屬性以 dynamic member lookup 斷言 title。測試先失敗,於 EventDetailView 發現**誤把 calendar id 當識別碼**,改成 event id 後通過,Siri 便能正確回答活動時間與地點。"},{"t":1440,"title":"The App Intents testing workflow","body":"總覽如何把 AppIntentsTesting 納入開發流程:先實作 actions／data／queries 等基礎型別,用 AppIntentsTesting 為其撰寫驗證——這些等同 App Intents 整合的**單元測試**;接著做更深的系統整合(view annotation、Spotlight 捐贈、跨 app 傳資料),再用 AppIntentsTesting 撰寫**整合測試**。各層都有覆蓋後,別忘了仍要用 **Siri** 與 **Shortcuts** 親手實測,體驗真實使用情境。"},{"t":1519,"title":"Next steps","body":"收尾:**AppIntentsTesting** 是單一框架,能在 app 之外、全自動地測試你的 intent、entity、enum、query 與系統整合。鼓勵下載 **CometCal** 範例專案試做並查閱完整測試集,參考文件取得完整 API,並指向學習用 App Intents 打造 Siri 體驗的場次。"}],"summary_en":["App Intents is a core part of how your app integrates with the system, powering more experiences every year—Siri, Shortcuts automations, system-wide Spotlight search, and Home Screen Widgets all depend on it. Because so many surfaces rely on your intents, entities, and queries, a regression in that code can leave people facing unexpected system behavior. This session introduces the brand-new **AppIntentsTesting** framework, which validates your App Intents through the same infrastructure used by Siri and Shortcuts.","AppIntentsTesting is an **integration testing** framework that, like UI tests, finds your intents by string without any access to the app's internals. Your tests live in a standard **XCUITest** bundle and run in their own process; the app runs separately and **executes intents on-device** across the process boundary, returning results without sharing state. In practice this means tests run through the full App Intents stack (no mocks, no stubs), never compile your app code into the test target (you only pass a bundle identifier), are picked up automatically by CI, and stay stable across releases since they depend on no UI. The minimal example is five lines: build an **IntentDefinitions** with the bundle id, fetch a definition via `intents[\"CreateCalendarIntent\"]`, call `makeIntent(...)` with parameters, `.run()` it, then assert on `result.value` using dynamic member lookup.","More advanced tests cover **entity queries**—`entities(matching:)` triggers an **EntityStringQuery**, demonstrated TDD-style by writing the test before implementing the query—and **chaining multiple intents**, feeding one intent's result (an EventEntity) directly into the next, where an entity parameter like calendar can be passed as a plain string and the runtime automatically calls its EntityStringQuery to fill it in, mirroring how people compose intents in Shortcuts. To keep tests self-contained, the talk introduces **test-only intents**: mark them `isDiscoverable = false` and wrap them in `#if DEBUG` to seed known data (like SeedSampleEventsIntent), jump directly to any view, or even wrap functionality you haven't yet adopted App Intents for.","Finally it covers **system-level integration** tests that reach beyond your app: `spotlightQuery()` verifies entities are correctly indexed in **Spotlight** (an example catches a commented-out indexing call and adds a regression test), and `viewAnnotations()` verifies that **view annotations** correctly tell the system which entity is on screen so Siri can answer \"what time is this event?\" (an example fixes a bug where the calendar id was used as the identifier). The overall workflow: write AppIntentsTesting unit tests for foundational actions/data/queries, then integration tests for Spotlight, view annotations, and cross-app data passing—and still test manually with Siri and Shortcuts to experience them as people would."],"deepdive_en":[{"t":16,"title":"Introduction","body":"Venkatesh from the App Intents team opens by framing **App Intents** as a core part of system integration that powers more experiences each year: **Siri** interactions, **Shortcuts** automations, system-wide **Spotlight** search, and Home Screen **Widgets**. Because every intent, entity, and query must work correctly, the new **AppIntentsTesting** framework exists to test all of it. He points new and returning developers to the relevant WWDC25/WWDC26 talks."},{"t":121,"title":"Meet CometCal: your first test","body":"Introduces the running sample app **CometCal**—a space-themed SwiftUI calendar app managing calendars, events, and attendees with full App Intents integration. The session will use it to demonstrate AppIntentsTesting, and points to a colleague's code-along on making CometCal available to Siri."},{"t":149,"title":"How AppIntentsTesting works","body":"Getting started needs only a **UI Testing bundle**: when creating it you must pick the correct development team (the test runner and app must use the same team for code signing), bundle identifier, and target. The first test's skeleton is shown: `import AppIntentsTesting`, a standard **XCTestCase**, and an **IntentDefinitions** object built from CometCal's bundle id, giving access to every intent, entity, and query **without importing the app**."},{"t":408,"title":"Your first test: execute an intent","body":"A full walk-through of executing an intent: fetch the definition via `definitions.intents[\"CreateCalendarIntent\"]`, call `makeIntent(name:color:)` (creating a red calendar named Occupy Saturn) where color is an **AppEnum**—pass its raw string value and the framework converts it. Then `.run()` executes on-device; `result.value` returns the **CalendarEntity** and dynamic member lookup asserts its title. The speaker warns that because the test doesn't build against the app, parameter names and types offer **no auto-completion** and must be filled in correctly; custom types use IntentValueConvertibleWrapper. On-device verification confirms the new calendar appears—an on-device intent executed in just five lines."},{"t":579,"title":"Testing entity queries","body":"Entity queries are a building block of App Intents integration, responsible for returning the right results wherever entities are looked up—in Shortcuts, via Siri, or anywhere—so a regression causes unexpected system behavior. AppIntentsTesting verifies **string queries**, **identifier lookups**, and **suggested entities**. The \"rename the Cosmic Ray Calibration event\" scenario sets up the problem: searching in Shortcuts shows \"No Options Available\" because the string query isn't implemented yet, to be added via TDD."},{"t":745,"title":"Test an entity string query","body":"The test first builds entity/intent definitions and runs **SeedSampleEventsIntent** to reset and seed known events, then calls `entities(matching: \"Cosmic Ray\")` on the EventEntity definition to run the string query on-device, asserting on the returned array's count and title. The speaker recommends lifting the definitions out of the function and moving seeding into setUp for reuse. The test **fails as expected**, telling you exactly what to build."},{"t":780,"title":"Implement the EntityStringQuery under test","body":"Back in **EventEntityQuery**—which previously only returned events by identifier and suggested entities—the speaker adds an **EntityStringQuery** conformance and implements `entities(matching:)`, filtering events by title with `localizedCaseInsensitiveContains` and mapping to entities. Re-running the test now passes, confirmed on-device in Shortcuts: write the test first, then build the feature—TDD with AppIntentsTesting."},{"t":829,"title":"Combining multiple intents","body":"Complex Shortcuts often take one intent's result and pass it as a parameter into another—this chaining underpins many automations. With the scenario of an Asteroid Dodgeball practice session repurposed to a rules overview, the speaker sets up a test to simulate this core workflow."},{"t":942,"title":"Chain multiple intents in one test","body":"Chaining is demonstrated: run **CreateEventIntent** where the calendar parameter, though typed as a **CalendarEntity**, accepts a plain string—the App Intents runtime automatically calls the associated EntityStringQuery and fills in the first match. The **EventEntity** returned by the first run is then passed directly into **UpdateEventIntent** to change the title, with a final assertion on the updated title—exactly how people compose intents in Shortcuts. This time setUp launches the app to visually confirm creation and update."},{"t":987,"title":"Test-only intents","body":"AppIntentsTesting tests are lightweight, fast, and runnable on every commit, but reliability requires each test to be **self-contained**—which **test-only intents** enable. These focused intents exist only for tests: they create exactly the data a test needs (no leftover state causing flakiness), jump directly to any view without UI navigation, and can even wrap functionality you **haven't yet adopted App Intents** for (internal navigation, data management, state manipulation) to test it through AppIntentsTesting."},{"t":1065,"title":"Make an intent test-only","body":"The recipe: mark the intent `static let isDiscoverable = false` (so the system never exposes it anywhere) and wrap it in an `#if DEBUG` compiler directive (so only tests can access it). The example is **SeedSampleEventsIntent** from the earlier string-query test, which creates a known set of events in the calendar."},{"t":1102,"title":"Testing Spotlight indexing","body":"The session moves to system integrations beyond the app. **Spotlight** lets people search the whole system from one place; once entities are indexed they appear in results without opening the app. The scenario—a commander urgently asking when the Dark Matter Symposium is, but Spotlight surfaces nothing—exposes a bug: indexing code was commented out during development and never re-enabled, undetected because the app's behavior didn't change. The fix is to uncomment it, plus a test to prevent recurrence."},{"t":1227,"title":"Test Spotlight indexing","body":"The regression test uses `spotlightQuery(\"Supernova Viewing Party\")` to talk to Spotlight: first assert the result is empty, then create the event with **CreateEventIntent**, then query again and assert exactly one result with a matching title. Once passing, it runs on every commit and will immediately catch any future break in the Spotlight integration."},{"t":1256,"title":"Testing view annotations","body":"A **view annotation** tells the system which entity your view is currently showing, so **Siri** can understand what's on screen and act on it. CometCal reports the on-screen **EventEntity** every time you navigate to an event, so even when a wormhole yanks the phone away you can ask \"Siri, what time is this event?\". If the annotation is broken, Siri has no idea—motivating the bug to fix."},{"t":1353,"title":"Test view annotations","body":"The test navigates to an event with **OpenEventIntent**, and because it lives in an XCUITest bundle uses **XCUI Automation** (`app.staticTexts[...]` with `waitForExistence`) to confirm the right event renders. It then calls `viewAnnotations()` to retrieve the on-screen annotations the system reports, asserts there is exactly one, and uses the ViewAnnotation's `entity` property with dynamic member lookup to assert the title. The test first fails; in EventDetailView the bug is that the **calendar id was used as the identifier**—changed to the event id, the test passes and Siri can correctly answer the event's time and location."},{"t":1440,"title":"The App Intents testing workflow","body":"An overview of folding AppIntentsTesting into your workflow: first implement the foundational types—actions, data, queries—and write AppIntentsTesting coverage for them as **unit tests** for your App Intents integration; then integrate more deeply with the system (annotate views, donate to Spotlight, pass data between apps) and cover those as **integration tests**. With coverage at every layer, still test manually with **Siri** and **Shortcuts** to experience the intents as people would."},{"t":1519,"title":"Next steps","body":"The wrap-up: **AppIntentsTesting** is a single framework for testing your intents, entities, enums, queries, and system integrations—all out-of-process and automated. The speaker encourages downloading the **CometCal** sample project to try it and explore the full test suite, consulting the documentation for the complete API, and points to a talk on building Siri experiences with App Intents."}],"code":[]},"related":[{"id":"240","title":"Build intelligent Siri experiences with App Schemas","gloss":"用 App Schemas 打造智慧 Siri 體驗","gloss_en":"Build intelligent Siri experiences with App Schemas","category":"ai","categoryLabel":"AI 與機器學習"},{"id":"267","title":"Migrate to Swift Testing","gloss":"遷移到 Swift Testing","gloss_en":"Migrate to Swift Testing","category":"testing","categoryLabel":"測試"}]}</script>
