compute-intensive processing within the editor.","hot":false},{"text":"**Shader Graph enhancements** boost the expressiveness of materials and visual effects.","hot":false}],"audience_en":"**visionOS creators and developers who want to complete interactivity, animation, and visual effects entirely within Reality Composer Pro 3.**","summary":["這場由 Reality Composer Pro 工程師 Vincent 主講，主軸是 **Reality Composer Pro 3** 全新的視覺化、節點式工具如何讓空間運算的工作流程更快——動畫、互動、粒子特效、外觀客製全都能在編輯器內完成，無需 build cycle 就能快速原型與迭代。全程以 Chaparral Village 遊戲中的「alchemy area」場景為範例：讓鍊金術士走到桌邊準備材料並等待，被點擊時轉身走向大鍋開始煉藥。","角色行為的建構分三層協作：**Animation Graph** 是執行期控制角色動畫的節點式編輯器，講者用 **State Machine**（含 Idle／Walk 兩個 Animation State、雙向 transition、以 `isWalking` Bool Condition 觸發切換）讓角色在 idle 與 walk 間平滑 blend，且支援 motion warping、blend space、IK 等能力；**Behavior Tree** 以由上而下、由左而右評估的 Composite 節點（**Sequence**／**Selector**／**Parallel**）搭配 Action 節點（Move To、Rotate To Face、Wait、Parameter Setter）定義角色自主的多步驟例行動作；**Script Graph** 則是事件驅動的視覺腳本系統，用 On Initialize、subgraph、On Tap 與 Set Entity Parameter 把 tap 手勢接上 Behavior Tree 的 `readyToBrew` precondition，讓角色在被點擊前停在桌邊。","場景導航與特效則靠兩個新工具：**Navigation Mesh** 定義場景中的可行走表面，navigation controller 依此為角色在樹木、水域等障礙間自動 pathfind，並可用 **off-mesh connection**（如梯子、橋）連接彼此不相連的網格；其元件含 Shapes 的 bounding box、Off-Mesh Connections、以及如 cell size 等 Generation Parameters，且能與 Behavior Tree、Animation Graph 或自訂 Swift system 透過 navigation component 搭配使用。**Compute Graph** 則是以 Metal 為後端、GPU 驅動的粒子模擬工具，依 Emitter／Initialize／Simulate／Output 四個階段組織；講者用 Continuous Emit、Spawn in Sphere（來自 custom bundle 節點）、負重力等做出大鍋向上飄升的煙霧效果。","最後分享 **Shader Graph** 今年的多項增強：**Subsurface Scattering** 提升如 Jupiter 環境中冰面的真實感、**RealityKit PBR Surface 2** 新增 sheen 等表面屬性與更精確的 diffuse／occlusion、專用的 **Hair surface** 模擬毛髮光線散射、以及可調 per-pixel opacity 與頂點動畫的 **Portal surface** 與 Portal Geometry Modifier。整體訊息是：用這些視覺化節點工具，能在編輯器內就把場景從動畫、行為、互動到特效全部活起來，且這只是 Reality Composer Pro 3 能力的冰山一角。"],"deepdive":[{"t":0,"title":"Introduction","body":"Reality Composer Pro 工程師 Vincent 開場，介紹 **Reality Composer Pro** 是用於組合 3D 場景、製作材質、加入視覺效果與互動的視覺編輯器，今年的第 3 版更強大。以完全用 RCP 3 與 Swift 打造的 Chaparral Village 遊戲為例，他將帶大家走訪其中的 alchemy area 場景，做出可互動的鍊金術士角色與大鍋的粒子特效，並預告本場會依序介紹 Animation Graph、Behavior Tree、Script Graph、Navigation Mesh、Compute Graph 與 Shader Graph 增強。"},{"t":130,"title":"Animation Graph","body":"**Animation Graph** 是在執行期控制角色動畫的視覺節點編輯器，支援 motion warping、blend space、inverse kinematics 等。講者示範用 **State Machine** 混合 idle 與 walk：從預設的 **Final Pose** 節點接上 State Machine，內部建立 Idle 與 Walk 兩個 Animation State 並建立雙向 transition，再於 Inputs Inspector 新增 `isWalking` boolean，分別為兩條 transition 加上 **Bool Condition**（isWalking 為 true／false）。最後各接一個 Animation Clip 指定 idle／walk 動畫；按 Play 後切換 isWalking 即可看角色平滑 blend，且作用中的 state 節點會即時 highlight，方便除錯。"},{"t":381,"title":"Behavior Tree","body":"**Behavior Tree** 讓你在編輯器內定義自主、多步驟的行為，且無需寫程式即可測試。樹由上而下、同層由左而右評估，分為控制流程的 **Composite** 節點（**Sequence** 依序執行、任一失敗即停；**Selector** 直到一個成功為止；**Parallel** 同時執行全部）與實際做事的 **Action** 節點。講者用 Sequence 包住 Rotate To Face、Move To、Wait（1 秒）建立「轉向桌子→走過去→準備材料」，以 tablePosition／rotationRate／movementRate 為輸入，並在 Rotate 前後加 **Parameter Setter** 把 isWalking 設為 true／false，再用 Parent Sequence 串接桌子與大鍋兩個 sub-sequence。"},{"t":682,"title":"Script Graph","body":"**Script Graph** 是事件驅動的視覺腳本系統，定義場景或特定 entity 上的互動與功能，因全視覺化所以原型與迭代很快、團隊任何人都能直接在編輯器建測。講者用 **On Initialize** 節點接上一個現成的 \"Setup Behavior Tree Position\" **subgraph**（如同函式，會找出桌子與大鍋 entity 並把世界座標寫入 entity parameter）。執行後角色完整跑完例行動作。接著為了加入 tap 互動，回到 Behavior Tree 刪掉 Wait 節點、新增 `readyToBrew` boolean 輸入並把大鍋 sub-sequence 加上 Bool **Precondition**，再回 Script Graph 用 On Tap 接 Set Entity Parameter 把 readyToBrew 設為 true；透過 Mac Virtual Display 與 Live Preview 在 Apple Vision Pro 上沉浸式驗證，點擊角色即轉身走向大鍋。"},{"t":886,"title":"Navigation Mesh","body":"**Navigation Mesh** 定義場景中的可行走表面，navigation controller 依此把角色從一點路由到另一點並自動避開樹木、水域等障礙；當網格本身不相連時（如橋），可用 **off-mesh connection** 連接。以 village 場景為例，其元件含 Shapes 區（定義 mesh 生成的 bounding box）、Off-Mesh Connections（如讓角色爬上屋頂的梯子，每條連線有起訖點、可用 gizmo 在視埠調整）、以及 Generation Parameters（如 cell size 設定取樣的 voxel 大小）。設定好後可與 Behavior Tree、Animation Graph 或自訂 Swift system 透過 navigation component 搭配，讓角色自主導航至點擊位置並能爬梯上屋頂。"},{"t":1028,"title":"Compute Graph","body":"**Compute Graph** 是以 Metal 為後端、GPU 驅動的視覺粒子模擬工具，可完整控制 spawn、simulate 與 render，並支援 custom shader。它分四個階段：**Emitter**（控制粒子何時誕生，可連續、爆發或單發）、**Initialize**（每顆粒子出生時設定 velocity、lifetime、size）、**Simulate**（每幀施加重力、亂流等力）、**Output**（控制粒子隨年齡與移動的外觀）。講者的大鍋煙霧效果用 Continuous Emit 維持密集流動，Initialize 設定 size 與隨機 lifetime、用 custom bundle 的 **Spawn in Sphere** 配 Set Position 把 Y 夾為 0 使粒子在表面成圈生成；Simulate 施加負重力讓煙上飄；Output 讓粒子隨生命淡入淡出、縮放並依高度變色，並以 Shader Graph 材質（billboard 上畫圓）渲染。"},{"t":1183,"title":"Shader Graph enhancements","body":"**Shader Graph** 今年多項增強：**Subsurface Scattering** 提升真實感（如 Jupiter 環境中月面冰層）；**RealityKit PBR Surface 2** 擴充原本的 PBR surface 節點，新增 sheen、Subsurface Scattering 等表面屬性與更精確的 diffuse／occlusion shading；**Hair surface** 是專為毛髮設計的 surface shader，模擬光線沿髮絲反射與散射；**Portal surface** 與 Portal Geometry Modifier 也已加入，可調整 portal 的 per-pixel opacity 並驅動頂點動畫的 portal 幾何。新手可參考 \"Explore materials in Reality Composer Pro\"。"},{"t":1272,"title":"Next steps","body":"講者總結：本場示範了如何用 Reality Composer Pro 3 的視覺節點工具——Animation Graph、Behavior Tree、Script Graph、Navigation Mesh、Compute Graph 與 Shader Graph——把場景的動畫、複雜行為、互動與粒子特效全部活起來，而這只是冰山一角。鼓勵大家從 developer.apple.com 下載 RCP 3 動手建構，並推薦延伸觀看 \"Design No-Code Games with Reality Composer Pro 3\" 與 \"Explore Advances in RealityKit\"。"}],"summary_en":["Hosted by Reality Composer Pro engineer Vincent, this session is about how **Reality Composer Pro 3**'s new visual, node-based tools supercharge spatial workflows — authoring animation, interactivity, particle effects, and look customization entirely inside the editor, so you can prototype and iterate fast with no build cycle. It runs through the \"alchemy area\" scene from the Chaparral Village game: the alchemist walks to a table to prepare ingredients and waits, then turns and walks to the cauldron to brew when tapped.","Character behavior is built across three cooperating tools: **Animation Graph** is a node-based, runtime animation editor where a **State Machine** (Idle and Walk Animation States, two-way transitions, an `isWalking` Bool Condition) blends idle and walk, with support for motion warping, blend spaces, and IK; **Behavior Tree** authors autonomous, multi-step routines using **Composite** nodes (**Sequence**, **Selector**, **Parallel**, evaluated top-to-bottom and left-to-right) plus Action nodes (Move To, Rotate To Face, Wait, Parameter Setter); and **Script Graph** is an event-driven visual scripting system that wires the tap gesture to the Behavior Tree's `readyToBrew` precondition via On Initialize, a subgraph, On Tap, and Set Entity Parameter, so the character waits at the table until tapped.","Navigation and effects rely on two new tools: a **Navigation Mesh** defines the walkable surfaces so the navigation controller pathfinds around obstacles like trees and water, with **off-mesh connections** linking otherwise-disconnected meshes (ladders, bridges); its component includes a Shapes bounding box, Off-Mesh Connections, and Generation Parameters like cell size, and it works with Behavior Tree, Animation Graph, or a custom Swift system via the navigation component. **Compute Graph** is a GPU-driven, Metal-backed particle simulation tool organized into Emitter, Initialize, Simulate, and Output phases; the cauldron's rising-smoke effect uses Continuous Emit, a Spawn in Sphere node (from a custom bundle), and negative gravity.","Finally, several **Shader Graph** enhancements are shared: **Subsurface Scattering** boosts realism (such as ice in the Jupiter environment), **RealityKit PBR Surface 2** adds surface properties like sheen plus more accurate diffuse/occlusion, a dedicated **Hair surface** models light scattering through strands, and **Portal surface** with the Portal Geometry Modifier allows per-pixel opacity and vertex-animated portal geometry. The overall message: these visual node tools let you bring a scene to life — animation, behavior, interactivity, and effects — entirely in the editor, and it only scratches the surface of Reality Composer Pro 3."],"deepdive_en":[{"t":0,"title":"Introduction","body":"Reality Composer Pro engineer Vincent opens by introducing **Reality Composer Pro** as a visual editor for composing 3D scenes, materials, visual effects, and interactivity, now even more capable in version 3. Using the Chaparral Village game (built entirely with RCP 3 and Swift) as the example, he'll bring its alchemy area scene to life with an interactive alchemist character and a cauldron particle effect, previewing the agenda: Animation Graph, Behavior Tree, Script Graph, Navigation Mesh, Compute Graph, and Shader Graph enhancements."},{"t":130,"title":"Animation Graph","body":"**Animation Graph** is a visual, node-based runtime editor for character animation, supporting motion warping, blend spaces, inverse kinematics, and more. He demonstrates blending idle and walk with a **State Machine**: from the default **Final Pose** node he connects a State Machine, adds Idle and Walk Animation States with two-way transitions, then adds an `isWalking` boolean in the Inputs Inspector and a **Bool Condition** on each transition (isWalking true/false). Each state input gets an Animation Clip; pressing Play and toggling isWalking blends the character smoothly, and the active state node highlights in real time for easy debugging."},{"t":381,"title":"Behavior Tree","body":"**Behavior Tree** lets you author autonomous, multi-step behavior in the editor and test it without code. The tree evaluates top-to-bottom and left-to-right, split into flow-controlling **Composite** nodes (**Sequence** runs children in order and stops on any failure; **Selector** runs until one succeeds; **Parallel** runs all at once) and work-doing **Action** nodes. He uses a Sequence wrapping Rotate To Face, Move To, and Wait (1 second) for \"turn toward the table → walk → prepare ingredients,\" with tablePosition/rotationRate/movementRate inputs, and adds **Parameter Setter** nodes around the move to flip isWalking true/false, then a Parent Sequence chaining the table and cauldron sub-sequences."},{"t":682,"title":"Script Graph","body":"**Script Graph** is an event-driven visual scripting system for defining interactivity on the scene or specific entities, fast to prototype and usable by anyone on the team without a build cycle. He starts with an **On Initialize** node feeding a ready-made \"Setup Behavior Tree Position\" **subgraph** (function-like; it finds the table and cauldron entities and writes their world positions to entity parameters). To add tap interaction he returns to the Behavior Tree, deletes the Wait node, adds a `readyToBrew` boolean input, and puts a Bool **Precondition** on the cauldron sub-sequence; back in Script Graph, On Tap connects to Set Entity Parameter to set readyToBrew true. Using Mac Virtual Display and Live Preview, he verifies it immersively on Apple Vision Pro — tapping the character makes it walk to the cauldron."},{"t":886,"title":"Navigation Mesh","body":"A **Navigation Mesh** defines the walkable surfaces so the navigation controller routes characters point-to-point while avoiding obstacles like trees and water; where meshes aren't connected (e.g. a bridge), an **off-mesh connection** links them. Using the village scene, its component includes a Shapes section (the bounding box for mesh generation), Off-Mesh Connections (such as a ladder to a rooftop, each with start/end points adjustable via gizmo), and Generation Parameters (e.g. cell size sets the sampling voxel size). Once set up, it works with Behavior Tree, Animation Graph, or a custom Swift system via the navigation component, letting a character autonomously navigate to a tap location and even climb a ladder to the roof."},{"t":1028,"title":"Compute Graph","body":"**Compute Graph** is a visual, GPU-driven, Metal-backed particle simulation tool with full control over spawning, simulation, and rendering, including custom shaders. It's organized into four phases: **Emitter** (when particles are born — continuous, burst, or single shot), **Initialize** (per-particle birth values like velocity, lifetime, size), **Simulate** (forces like gravity and turbulence each frame), and **Output** (appearance as particles age and move). His cauldron smoke uses Continuous Emit for a dense flow, randomized size and lifetime in Initialize, a custom-bundle **Spawn in Sphere** node with Set Position clamping Y to zero so particles ring the surface, negative gravity in Simulate to drift upward, and Output fading/scaling/color-shifting by height, rendered with a Shader Graph material drawing a circle on a billboard."},{"t":1183,"title":"Shader Graph enhancements","body":"**Shader Graph** gets several upgrades this year: **Subsurface Scattering** improves realism (e.g. the ice in the Jupiter environment); **RealityKit PBR Surface 2** expands the original PBR surface node with new properties like sheen and subsurface scattering plus more accurate diffuse and occlusion shading; **Hair surface** is a dedicated shader modeling how light reflects along and scatters through fine strands; and **Portal surface** with the Portal Geometry Modifier lets you modify per-pixel portal opacity and drive vertex-animated portal geometry. Newcomers are pointed to \"Explore materials in Reality Composer Pro.\""},{"t":1272,"title":"Next steps","body":"He wraps up: the session showed how to bring a scene to life with Reality Composer Pro 3's visual node tools — Animation Graph, Behavior Tree, Script Graph, Navigation Mesh, Compute Graph, and Shader Graph — covering animation, complex behavior, interactivity, and particle effects, and this only scratches the surface. He encourages downloading RCP 3 from developer.apple.com to start building, and recommends the related sessions \"Design No-Code Games with Reality Composer Pro 3\" and \"Explore Advances in RealityKit.\""}],"code":[]},"related":[{"id":"280","title":"Iterate your spatial scenes faster with Reality Composer Pro 3","gloss":"用 Reality Composer Pro 3 更快迭代空間場景","gloss_en":"Iterate your spatial scenes faster with Reality Composer Pro 3","category":"visionos","categoryLabel":"visionOS"},{"id":"287","title":"Build next-generation experiences with visionOS 27","gloss":"用 visionOS 27 打造次世代體驗","gloss_en":"Build next-generation experiences with visionOS 27","category":"visionos","categoryLabel":"visionOS"},{"id":"279","title":"Explore advances in RealityKit","gloss":"探索 RealityKit 的最新進展","gloss_en":"Explore advances in RealityKit","category":"visionos","categoryLabel":"visionOS"},{"id":"283","title":"Explore enhancements to visionOS object tracking","gloss":"探索 visionOS 物件追蹤的強化功能","gloss_en":"Explore enhancements to visionOS object tracking","category":"visionos","categoryLabel":"visionOS"},{"id":"284","title":"Collaborate on structured 3D models in visionOS","gloss":"在 visionOS 中協作操作結構化 3D 模型","gloss_en":"Collaborate on structured 3D models in visionOS","category":"visionos","categoryLabel":"visionOS"}]}</script>
