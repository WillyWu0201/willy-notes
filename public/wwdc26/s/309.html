<script id="d" type="application/json">{"s":{"id":"309","title":"Explore Retention Messaging in App Store Connect","gloss":"探索 App Store Connect 的挽留訊息","category":"appstore","categoryLabel":"App Store","duration":910,"url":"https://developer.apple.com/videos/play/wwdc2026/309/","takeaway":"用 Retention Messaging 在訂閱者取消前即時提供訊息、替代方案或促銷優惠，提高續訂率。","chapters":[[0,"Introduction"],[158,"Retention Messaging in App Store Connect"],[368,"Signed transaction updates"],[398,"Real-time Retention Messaging"],[470,"Retention Messaging API"],[514,"Real-time requests"],[537,"Real-time requests with message"],[551,"Real-time request with alternate product"],[564,"Real-time request with promotional offer"],[706,"Retention Messaging comparison"]],"points":[{"text":"**Retention Messaging** 讓你在訂閱者按下取消前主動觸及他們，是降低流失的新工具。","hot":true},{"text":"可在 **App Store Connect** 直接設定挽留訊息，無需改動 App 即可上線基本情境。","hot":false},{"text":"**即時（Real-time）** 模式會在取消當下向你的伺服器發出請求，由你動態決定回應內容。","hot":false},{"text":"回應可選擇純**訊息（message）**、**替代產品（alternateProduct）**，或帶簽章的**促銷優惠（promotionalOffer）**。","hot":false},{"text":"透過 **Retention Messaging API** 設定 URL、訊息與圖片，並可在 Sandbox 進行效能測試。","hot":false}],"apis":["Retention Messaging API","App Store Connect","StoreKit","promotionalOfferSignatureV2"],"audience":"經營**自動續訂訂閱、想在取消前挽留訂閱者**的 App Store 開發者與營運團隊。","gloss_en":"Explore Retention Messaging in App Store Connect","takeaway_en":"Use Retention Messaging to deliver a timely message, an alternate product, or a promotional offer to subscribers before they cancel, improving renewal rates.","points_en":[{"text":"**Retention Messaging** lets you proactively reach subscribers before they tap cancel, a new tool for reducing churn.","hot":true},{"text":"Configure retention messages directly in **App Store Connect**, with no app changes needed to launch the basic scenarios.","hot":false},{"text":"**Real-time** mode sends a request to your server at the moment of cancellation, letting you decide the response dynamically.","hot":false},{"text":"The response can be a plain **message**, an **alternateProduct**, or a signed **promotionalOffer**.","hot":false},{"text":"Set the URL, message, and image via the **Retention Messaging API**, and run performance testing in Sandbox.","hot":false}],"audience_en":"App Store developers and operations teams running **auto-renewable subscriptions who want to retain subscribers before they cancel**.","summary":["由 App Store server 團隊工程師 Tori 主講，介紹 **Retention Messaging**——一個在訂閱者考慮取消、抵達 manage subscriptions 取消確認頁時，向他們展示有說服力的價值訊息或優惠，以挽留訂閱的全新功能。它支援三種版面：純訊息、訊息加圖片、訊息加 offer；當顧客符合 offer 資格時，圖片會被 offer 取代。Apple 觀察到採用後平均 **save rate 提升 +1.4 分（約 82%）**，其中 promotional offer 訊息表現最佳達 +5.5 分（約 223%），但結果因開發者而異。","第一條路是 **Retention Messaging in App Store Connect**：在 Subscriptions 頁點 Get Started 建立 retention message，左側編輯訊息文字、圖片（取自 **Asset Library**）、適用訂閱與 offer，右側即時預覽。訊息文字為必填、圖片與 offer 選填，並可選多種 localization；一則訊息可關聯多個訂閱，也可選多個 offer，App Store 會自動為符合資格的顧客挑選最佳 offer。這些都可透過 **App Store Connect API** 設定，並可在 sandbox 完整測試取消流程。新增的 **retention offer**（offerType 值為 5）會出現在 signed transaction 與 renewal info 中，連同 offer identifier、discount type、period 等欄位。","若想在顧客將取消當下更直接互動，第二條路是 **real-time Retention Messaging**：你架設一個端點，回應 App Store 發來的 server-to-server HTTP 請求，即時決定要顯示哪則訊息。請求會帶 `originalTransactionId`、顧客 locale、`requestIdentifier` 等；回應可採三種格式——回 `messageIdentifier`（訊息或訊息加圖片）、回 `messageIdentifier` ＋ `productId` 的 **alternateProduct**（同訂閱群組內換方案，real-time 獨有的 switch plan 版面）、或回 `messageIdentifier` ＋ `promotionalOfferSignature` 的 promotional offer。它由 **Retention Messaging API** 驅動（管理 URL、訊息、預設訊息與圖片），上線前須通過 sandbox 的 performance test，且 iOS 26.5 的「12 個月承諾月訂閱」也可用 `billingPlanType` 作 switch plan。","兩者的關鍵差異是**決策權**：App Store Connect 版設定後由 App Store 自動決定顯示什麼，real-time 版則由你即時為每位顧客選擇。設定管道（ASC／ASC API vs Retention Messaging API server-to-server）、offer 類型（retention offer vs promotional offer）與版面（前者三種、後者多 switch plan）也不同。實務上 real-time 建立於 ASC 版之上：當你的伺服器逾時或回應錯誤，App Store 會 fallback 到 ASC 偏好（含合格 offer），再不行才用 API 預設訊息——因此即使用 real-time 也應同時設好 ASC Retention Messaging 作後援。real-time 需填寫 interest form 申請存取。"],"deepdive":[{"t":0,"title":"Introduction","body":"由 App Store server 團隊的 Tori 開場。販售自動續訂訂閱很有回報，但在顧客考慮取消的關鍵時刻接觸他們具挑戰性，而那正是提醒價值的理想時機。本場介紹 **Retention Messaging**：先概覽功能與在 App Store Connect 的設定，再說明 real-time Retention Messaging 如何與之搭配。"},{"t":158,"title":"Retention Messaging in App Store Connect","body":"以 Exercise app 示範取消流程：取消頁會顯示取消的影響（如家庭將失去存取），這正是提供訊息或 offer 的機會。**Retention Messaging** 在取消流程加入有說服力的價值主張，支援三種版面：純訊息、訊息＋圖片、訊息＋offer（例如 Yoga+ 三個月免費）。並引用數據：平均 save rate +1.4 分（約 82%），promotional offer 訊息最高達 +5.5 分（約 223%），結果因開發者而異。"},{"t":368,"title":"Signed transaction updates","body":"說明在 ASC 設定 Retention Messaging：可建立 retention message 映射到任何訂閱、從 **Asset Library** 選圖、設定 retention offer，且 **App Store Connect API** 亦支援。可在 **sandbox** 完整測試取消流程；若設了 retention offer，可驗證 signed transaction 或 renewal info 中的 offer 欄位。新增的 retention offer 以 **offerType 值 5** 標示，連同 offer identifier、discount type、period 等欄位一併出現。"},{"t":398,"title":"Real-time Retention Messaging","body":"示範在 ASC 建立 Yoga Message 的流程：點 Get Started、命名、在左側編輯文字（可多語系，如標題「Launching Next Month: Guided Yoga」與描述）、選 Asset Library 圖片、選 Yoga+ 訂閱（可多個）、加入符合資格的 retention offer（可多個，App Store 自動挑最佳），右側即時預覽。並說明顧客符合 offer 時圖片會被 offer 取代，可用下拉切換預覽不同或無 offer。"},{"t":470,"title":"Retention Messaging API","body":"介紹 **real-time Retention Messaging**：你架設端點回應 App Store 的 server-to-server HTTP 請求，提供即時訊息偏好；可回傳自設的 message／image 配對，或指向 ASC 中設定的訊息。相較 ASC 版，real-time 還支援 **switch plan** 版面，可在同訂閱群組內提供不同方案（例示提供年訂閱）作為取消的替代。"},{"t":514,"title":"Real-time requests","body":"說明驅動它的 **Retention Messaging API**——一組 server-to-server 端點，可設定 Exercise app 端點 URL、建立訊息、為各訂閱選預設訊息、上傳管理圖片。僅 **sandbox** 環境支援 performance test，提供啟動與查結果的端點；通過 performance test 是上 production 使用 real-time 的必要條件。App Store 發請求時會帶 `originalTransactionId`、顧客 locale、`requestIdentifier` 等資訊。"},{"t":537,"title":"Real-time requests with message","body":"回應的第一種格式：以 **`messageIdentifier`** 回傳一則訊息或訊息加圖片。講者選了一個指向 yoga 訂閱訊息並搭配對應圖片的 messageIdentifier。"},{"t":551,"title":"Real-time request with alternate product","body":"第二種格式 **alternateProduct**：提供 `messageIdentifier` ＋ `productId`，在同訂閱群組內提供 switch plan。講者選擇提供 Yoga+ 的年訂閱方案作為取消的替代。"},{"t":564,"title":"Real-time request with promotional offer","body":"第三種格式 **promotional offer**：提供 `messageIdentifier` ＋ `promotionalOfferSignature` 給顧客 offer（例如 Yoga+ 三個月免費；promotional offer 仍需 signature）。並提醒 real-time 需快速回應的伺服器：逾時或回應錯誤時，App Store 會先 fallback 到 ASC 偏好（含合格 offer），再不行才用 API 預設訊息。也說明 sandbox 上線流程：設訊息與圖片、設端點、跑 performance test、通過後再設 production。"},{"t":706,"title":"Retention Messaging comparison","body":"比較兩者。關鍵差異是**決策**：ASC 版設定後由 App Store 自動顯示，real-time 版由你即時為每位顧客選擇。設定管道、offer 類型（ASC 用 retention offer、real-time 用 promotional offer）、版面（real-time 多 switch plan）皆不同。ASC 版適合無伺服器或想讓 App Store 決定者，real-time 適合想掌控每位顧客訊息與 offer 者；real-time 建於 ASC 之上，應同時設 ASC 作後援，並需填 interest form 申請存取。"}],"summary_en":["Presented by Tori, an App Store server team engineer, this session introduces **Retention Messaging**—a new feature that shows a compelling value-proposition message or offer to subscribers when they reach the cancel confirmation page in manage subscriptions, helping you retain them. It supports three views: message only, message with an image, or message with an offer; when a customer is eligible for an offer, the image is replaced by the offer. Apple observed an average **save-rate increase of +1.4 points (≈82%)** after adoption, with promotional-offer messages highest at +5.5 points (≈223%), though results vary across developers.","The first path is **Retention Messaging in App Store Connect**: on the Subscriptions page, tap Get Started to create a retention message, edit the message text, image (from **Asset Library**), applicable subscriptions, and offers on the left, with a live preview on the right. Message text is required; image and offer are optional, and multiple localizations are supported; one message can map to many subscriptions, and you can select multiple offers—the App Store automatically picks the best one for eligible customers. All of this is configurable via the **App Store Connect API** and fully testable in sandbox during cancellation. A new **retention offer** (offerType value 5) appears in the signed transaction and renewal info alongside offer identifier, discount type, and period.","To interact more directly the moment a customer is about to cancel, the second path is **real-time Retention Messaging**: you stand up an endpoint that responds to a server-to-server HTTP request from the App Store, deciding in real time which message to show. The request includes the `originalTransactionId`, customer locale, and a `requestIdentifier`; you can respond in three formats—a `messageIdentifier` (message or message with image), an **alternateProduct** with `messageIdentifier` + `productId` (a switch plan within the same subscription group, a view unique to real-time), or a promotional offer with `messageIdentifier` + `promotionalOfferSignature`. It's powered by the **Retention Messaging API** (managing the URL, messages, default messages, and images), requires passing a sandbox performance test before going live, and iOS 26.5's monthly subscriptions with a 12-month commitment can be offered as a switch plan via `billingPlanType`.","The key difference is **decisioning**: the App Store Connect version decides what to show automatically once configured, while the real-time version lets you choose for each customer in real time. The configuration channels (ASC/ASC API vs server-to-server Retention Messaging API), offer types (retention offer vs promotional offer), and views (the former three, the latter adding switch plan) also differ. In practice real-time builds on top of the ASC version: if your server times out or responds malformed, the App Store falls back to your ASC preference (including eligible offers), then to API default messaging—so you should always set up ASC Retention Messaging as a fallback even when using real-time. Real-time requires filling out an interest form to request access."],"deepdive_en":[{"t":0,"title":"Introduction","body":"Tori of the App Store server team opens. Selling auto-renewable subscriptions can be rewarding but reaching customers at the critical moment they consider canceling is challenging—and that's the ideal time to remind them of value. This session introduces **Retention Messaging**: first an overview and setup in App Store Connect, then how real-time Retention Messaging works alongside it."},{"t":158,"title":"Retention Messaging in App Store Connect","body":"An Exercise app demos the cancellation flow: the cancel page shows the impact of canceling (e.g., the family loses access), which is the moment to provide a message or offer. **Retention Messaging** adds a compelling value proposition, supporting three views: message only, message + image, and message + offer (e.g., three months free of Yoga+). Cited data: average save rate +1.4 points (≈82%), promotional-offer messages highest at +5.5 points (≈223%), results varying by developer."},{"t":368,"title":"Signed transaction updates","body":"Setup in ASC: create retention messages mapped to any subscription, pick images from **Asset Library**, configure retention offers, and the **App Store Connect API** supports it too. The cancellation flow is fully testable in **sandbox**; with a retention offer set, you can verify offer fields in the signed transaction or renewal info. The new retention offer is indicated by **offerType value 5**, alongside offer identifier, discount type, and period fields."},{"t":398,"title":"Real-time Retention Messaging","body":"Demos creating a Yoga Message in ASC: tap Get Started, name it, edit text on the left (multiple localizations—e.g., title 'Launching Next Month: Guided Yoga' and a description), choose an Asset Library image, select the Yoga+ subscription (multiple allowed), add eligible retention offers (multiple, App Store picks the best), with a live preview. When a customer is eligible the image is replaced by the offer, and a dropdown previews different or no offers."},{"t":470,"title":"Retention Messaging API","body":"Introduces **real-time Retention Messaging**: you set up an endpoint to provide a real-time message preference in response to the App Store's server-to-server HTTP request; you can return your own message/image pairs or point to a message configured in ASC. Compared to the ASC version, real-time also supports a **switch plan** view, offering a different plan in the same subscription group (an annual subscription in the example) as an alternative to canceling."},{"t":514,"title":"Real-time requests","body":"The **Retention Messaging API** powers it—a server-to-server set of endpoints to configure the app's endpoint URL, set up messages, choose default messages per subscription, and upload/manage images. Only the **sandbox** environment supports performance testing, with endpoints to initiate and check results; passing a performance test is required before using real-time in production. The App Store's request includes the `originalTransactionId`, customer locale, and a `requestIdentifier`."},{"t":537,"title":"Real-time requests with message","body":"The first response format: respond with a **`messageIdentifier`** to show a message or message with an image. The presenter chose a messageIdentifier indicating a yoga-subscription message paired with a corresponding image."},{"t":551,"title":"Real-time request with alternate product","body":"The second format, **alternateProduct**: provide a `messageIdentifier` + `productId` to offer a switch plan in the same subscription group. The presenter chose to offer an annual tier of Yoga+ as the alternative to canceling."},{"t":564,"title":"Real-time request with promotional offer","body":"The third format, **promotional offer**: provide a `messageIdentifier` + `promotionalOfferSignature` to give an offer (e.g., three months free of Yoga+; promotional offers still need a signature). Real-time requires a fast server: on timeout or malformed response, the App Store falls back first to the ASC preference (with eligible offers), then to API default messaging. The sandbox go-live flow: set messages and images, set the endpoint, run a performance test, then set up production once it passes."},{"t":706,"title":"Retention Messaging comparison","body":"Compares the two. The key difference is **decisioning**: ASC shows automatically once configured, while real-time lets you choose per customer in real time. Configuration channels, offer types (ASC uses retention offers, real-time uses promotional offers), and views (real-time adds switch plan) all differ. ASC suits those without a server or who want the App Store to decide; real-time suits those wanting per-customer control of messages and offers. Real-time builds on top of ASC, so set up ASC as a fallback, and request access via the interest form."}],"code":["// Signed transaction updates\n\n{\n    \"bundleId\": \"com.example.app\",\n    \"productId\": \"Yoga_summer_2026\",\n    \"type\": \"Auto-Renewable Subscription\",\n    \"transactionReason\": \"RENEWAL\",\n    \"inAppOwnershipType\": \"PURCHASED\",\n    \"quantity\": 1,\n    \"price\": 0,\n    \"currency\": \"USD\",\n    \"offerType\": 5, // retention offer\n    \"offerIdentifier\": \"Yoga_2026_cancel_free_3m\",\n    \"offerDiscountType\": \"FREE_TRIAL\",\n    \"offerPeriod\": \"P3M\", \n    \"transactionId\": \"1000098916194\"\n    \"originalTransactionId\": \"1000011859217\",\n    \"appAccountToken\": \"23a91ca7-06f3-425f-bff6-820904b510a9\",\n    ...\n}","// Retention Messaging API: https://api.storekit.apple.com/inApps/v1/messaging\n\n// URL configuration\nPUT /realtime/url\nGET /realtime/url\nDELETE /realtime/url\n\n// Message configuration\nPUT /message/{messageIdentifier}\nDELETE /message/{messageIdentifier}\nGET /message/list\nPUT /default/{productId}/{locale}\nDELETE /default/{productId}/{locale}\nGET /default/{productId}/{locale}\n\n// Image configuration\nPUT /image/{imageIdentifier}\nDELETE /image/{imageIdentifier}\nGET /image/list\n\n// Performance testing - Sandbox only\nPOST /performanceTest // initiate test\nGET /performanceTest/result/{requestId} // get results","// Real-time requests\n\n// Request from the App Store\n{\n    \"originalTransactionId\": \"123456789\",\n    \"appAppleId\": 6745974591,\n    \"productId\": \"Yoga_summer_2026\",\n    \"userLocale\": \"en-US\",\n    \"requestIdentifier\": \"c03248af-dd76-4e9b-9c1e-4489cd19a768\",\n    \"environment\": \"Production\", // or Sandbox\n    \"signedDate\": 1780920000000\n}","// Real-time requests\n\n// Request from the App Store\n{\n    \"originalTransactionId\": \"123456789\",\n    \"appAppleId\": 6745974591,\n    \"productId\": \"Yoga_summer_2026\",\n    \"userLocale\": \"en-US\",\n    \"requestIdentifier\": \n        \"c03248af-dd76-4e9b-9c1e-4489cd19a768\",\n    \"environment\": \"Production\", // or Sandbox\n    \"signedDate\": 1780920000000\n}\n\n// Your response\n{\n    \"message\": {\n        \"messageIdentifier\": \n            \"551ee7c0-c097-418e-9dd5-2a98533a7390\"\n    }\n}","// Real-time requests\n\n// Request from the App Store\n{\n    \"originalTransactionId\": \"123456789\",\n    \"appAppleId\": 6745974591,\n    \"productId\": \"Yoga_summer_2026\",\n    \"userLocale\": \"en-US\",\n    \"requestIdentifier\": \n        \"c03248af-dd76-4e9b-9c1e-4489cd19a768\",\n    \"environment\": \"Production\", // or Sandbox\n    \"signedDate\": 1780920000000\n}\n\n// Your response\n{\n    \"alternateProduct\": {\n        \"messageIdentifier\":\n            \"ed7f25fc-5741-46a3-8502-062e0fb8afd0\",\n        \"productId\": \"Yoga_summer_2026_annual\"\n    }\n}","// Real-time requests\n\n// Request from the App Store\n{\n    \"originalTransactionId\": \"123456789\",\n    \"appAppleId\": 6745974591,\n    \"productId\": \"Yoga_summer_2026\",\n    \"userLocale\": \"en-US\",\n    \"requestIdentifier\":          \"c03248af-dd76-4e9b-9c1e-4489cd19a768\",\n    \"environment\": \"Production\", // or Sandbox\n    \"signedDate\": 1780920000000\n}\n\n// Your response\n{\n    \"promotionalOffer\": {\n        \"messageIdentifier\": \n            \"80135e2b-ae15-4ec4-8c5c-9ecc8045c0dc\",\n        \"promotionalOfferSignatureV2\": \"eyJhbGciOiJFUzI…\"\n    }\n}"]},"related":[{"id":"210","title":"What’s new in Apple In-App Purchase","gloss":"Apple App 內購買的新功能","gloss_en":"What's new in Apple In-App Purchase","category":"appstore","categoryLabel":"App Store"},{"id":"378","title":"Unlock in-game content with StoreKit and Background Assets","gloss":"用 StoreKit 與 Background Assets 解鎖遊戲內容","gloss_en":"Unlock in-game content with StoreKit and Background Assets","category":"appstore","categoryLabel":"App Store"},{"id":"391","title":"Offer subscriptions to groups and organizations","gloss":"向群組與組織提供訂閱","gloss_en":"Offer subscriptions to groups and organizations","category":"appstore","categoryLabel":"App Store"},{"id":"8010","title":"App Store Connect Group Lab","gloss":"App Store Connect 團體實驗室","gloss_en":"App Store Connect Group Lab","category":"appstore","categoryLabel":"App Store"},{"id":"205","title":"Enhance your presence on the App Store","gloss":"強化你在 App Store 上的呈現","gloss_en":"Enhance your presence on the App Store","category":"appstore","categoryLabel":"App Store"}]}</script>
