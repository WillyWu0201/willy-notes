<script id="d" type="application/json">{"s":{"id":"341","title":"Support the Center Stage front camera in your iOS app","gloss":"在 iOS App 中支援人物居中前置鏡頭","category":"other","categoryLabel":"其他","duration":1064,"url":"https://developer.apple.com/videos/play/wwdc2026/341/","takeaway":"用 AVCapture 的動態長寬比與智慧取景 API，讓你的相機 App 支援 iPhone 17 等機型的 Center Stage 前置鏡頭。","chapters":[[0,"Introduction"],[67,"Center Stage front camera"],[129,"Center Stage for photos"],[189,"Capture session setup"],[236,"Dynamic aspect ratio"],[329,"Support dynamic aspect ratio"],[407,"Smart framing monitor"],[459,"Support smart framing monitor"],[564,"Sensor orientation compensation"],[713,"Center Stage for video recordings"],[796,"Center Stage for video calls"],[884,"Support Center Stage for video calls"]],"points":[{"text":"在 iPhone 17、iPhone 17 Pro 與 iPhone Air 上，以 **builtInUltraWideCamera** 前置鏡頭支援 Center Stage 拍照。","hot":false},{"text":"用 **supportedDynamicAspectRatios** 與 **setDynamicAspectRatio** 在拍攝中切換 4:3 等**動態長寬比**。","hot":false},{"text":"透過 **smartFramingMonitor** 觀察 **recommendedFraming**，自動調整長寬比與 **videoZoomFactor** 完成智慧取景。","hot":true},{"text":"需處理**感光元件方向補償（sensor orientation compensation）**，確保畫面方向正確。","hot":false},{"text":"錄影與視訊通話情境可用 **centerStageControlMode = .cooperative** 與 **isCenterStageEnabled** 開啟 Center Stage。","hot":false}],"apis":["AVFoundation","AVCaptureDevice","AVCaptureDevice.DiscoverySession","setDynamicAspectRatio","supportedDynamicAspectRatios","smartFramingMonitor","isSmartFramingSupported","isCenterStageSupported","videoZoomFactor"],"audience":"開發 **iOS 相機或視訊 App、想支援前置鏡頭 Center Stage 與智慧取景**的開發者。","gloss_en":"Support the Center Stage front camera in your iOS app","takeaway_en":"Use AVCapture's dynamic aspect ratio and smart framing APIs to support the Center Stage front camera on devices like iPhone 17 in your camera app.","points_en":[{"text":"On iPhone 17, iPhone 17 Pro, and iPhone Air, support Center Stage photo capture with the **builtInUltraWideCamera** front camera.","hot":false},{"text":"Use **supportedDynamicAspectRatios** and **setDynamicAspectRatio** to switch **dynamic aspect ratios** like 4:3 during capture.","hot":false},{"text":"Observe **recommendedFraming** via **smartFramingMonitor** to automatically adjust the aspect ratio and **videoZoomFactor** for smart framing.","hot":true},{"text":"Handle **sensor orientation compensation** to ensure the image is oriented correctly.","hot":false},{"text":"For video recording and video calling, enable Center Stage with **centerStageControlMode = .cooperative** and **isCenterStageEnabled**.","hot":false}],"audience_en":"Developers building **iOS camera or video apps who want to support front-camera Center Stage and smart framing**.","summary":["iPhone 17、iPhone Air 與 iPhone 17 Pro 上的 **Center Stage 前置鏡頭**徹底改變了自拍與視訊通話的取景方式。傳統前鏡頭感光元件是 4x3 比例，框景會受手機方向限制；新的前鏡頭改採**正方形感光元件**搭配 **95 度超廣角鏡頭**（iPhone 前鏡頭史上最廣），讓你不用旋轉手機就能拍出直幅或橫幅自拍，握持更穩、視線接觸也更自然。本場以 **AVCapture** API 為主軸，示範如何在自己的 app 裡支援這顆鏡頭的照片、錄影與視訊通話體驗。","照片取景的核心是 **Auto Zoom 與 Auto Rotate**，由兩個 API 組成。基礎是 iOS 26 新增的 **dynamicAspectRatio**：在不重建 capture session、不中斷預覽的前提下，從正方形感光元件即時裁切出你要的比例（支援 3x4、4x3、9x16、16x9、1x1），可用來實作「點一下旋轉」按鈕。建立在它之上的是 **AVCaptureSmartFramingMonitor**，會依臉部與視線偵測週期性給出含 aspectRatio 與 zoomFactor 的取景建議，app 透過 KVO 觀察 `recommendedFraming` 後套用，達成有人加入或離開鏡頭時自動縮放與旋轉；此監視器僅在 4032 照片格式下提供建議。鏡頭選取一律使用 `.builtInUltraWideCamera`、`.front` 的 discovery session。","照片部分還需注意**感光元件方向補償**：新前鏡頭改以 Portrait 方向安裝，與過去的 Landscape Left 不同。**AVCapturePhotoOutput** 預設會自動旋轉照片並更新 EXIF，讓輸出與舊機種一致，因此沿用既有旋轉值即可；但補償只套用於 HEIC、JPEG 與未壓縮處理過的照片，永遠不套用於 Bayer RAW 或 Apple ProRAW，且可用 `cameraSensorOrientationCompensationEnabled` 控制（建議測試關閉以求最佳效能）。","錄影與視訊通話同樣受惠。錄影可用 dynamicAspectRatio「點一下旋轉」，但因 QuickTime 軌道要求所有 sample 尺寸一致，改變比例時會自動停止錄影（改用 **AVCaptureVideoDataOutput** 搭 **AVAssetWriter** 可用完成 timestamp 無縫接續），並支援臉部感知的 **cinematicExtended** 穩定模式。視訊通話方面，若 app 已使用 VoIP 背景模式則自動支援 Center Stage；否則可採用 Center Stage API，先設定 `centerStageControlMode`（cooperative 或 app）再開啟 `isCenterStageEnabled`，並可把 AVCaptureConnection 的 `preferredVideoStabilizationMode` 設為 `lowLatency` 取得即時低延遲穩定。"],"deepdive":[{"t":0,"title":"Introduction","body":"由 Camera Software 團隊工程師 Tracy 開場，點出自拍取景的痛點（自拍棒、找手臂長的朋友幫忙）。**Center Stage 前置鏡頭**搭載於 iPhone 17、iPhone Air 與 iPhone 17 Pro，能更彈性地框住畫面。全場路線為：先總覽鏡頭特性，再講照片、錄影與視訊通話三種情境的 API。"},{"t":67,"title":"Center Stage front camera","body":"說明硬體本質：傳統前鏡頭是 **4x3 感光元件**，框景受手機方向限制；新鏡頭改用**正方形感光元件**，可自由選任意比例，直幅或橫幅自拍都不必旋轉手機，握持更穩、視線更自然。再搭配 **95 度超廣角鏡頭**（iPhone 前鏡頭最廣視野），有利於團體自拍、影片穩定與通話置中。"},{"t":129,"title":"Center Stage for photos","body":"進入照片取景主題，核心是 **Auto Zoom 與 Auto Rotate**：結合正方形感光元件、廣角與自動臉部／視線偵測，鏡頭會智慧調整方向並在窄景與廣景間切換。以實例示範朋友 Karen 加入時畫面自動拉遠、更多人入鏡時自動旋轉，並預告接下來會講 capture session 設定、dynamic aspect ratio 與 smart framing monitor 兩個 API，最後是感光元件方向補償。"},{"t":189,"title":"Capture session setup","body":"說明典型照片拍攝設定：建立 **AVCaptureSession**，以 `.builtInUltraWideCamera` 取得前鏡頭並建立 **AVCaptureDeviceInput**，加入 **AVCaptureVideoPreviewLayer** 取得預覽、加入 **AVCapturePhotoOutput** 接收照片。加入 input/output 時 session 會在相容媒體型別間隱含建立 **AVCaptureConnection**。"},{"t":236,"title":"Dynamic aspect ratio","body":"介紹 iOS 26 新增的 **dynamicAspectRatio** 屬性，是手動與自動取景的共同基礎：設定後相機直接從正方形感光元件裁切出指定比例，不必重建 session 或中斷預覽，切換無縫快速。支援格式須為前置 `.builtInUltraWideCamera` 的正方形格式，解析度 1280 至 4032，提供 3x4、4x3、9x16、16x9、1x1 五種比例；其中 4032 照片格式只支援 3x4 與 4x3 以取得最高解析度。"},{"t":329,"title":"Support dynamic aspect ratio","body":"以「點一下旋轉」按鈕示範實作：用 **AVCaptureDevice.DiscoverySession** 指定 `.builtInUltraWideCamera` 與 `.front` 取得唯一裝置，遍歷 `format.supportedDynamicAspectRatios` 找到支援 4x3 的格式並設為 `activeFormat`。鎖定設定後呼叫 `setDynamicAspectRatio(.ratio4x3)`，回傳值為變更生效的第一個 buffer **timestamp**。"},{"t":407,"title":"Smart framing monitor","body":"介紹 iOS 26 的 **AVCaptureSmartFramingMonitor**，與 dynamicAspectRatio 協作，依自動臉部與視線偵測週期性提供取景建議。每筆建議含 **aspectRatio 與 zoomFactor**，app 可套用或忽略；由於專為照片拍攝設計，僅在 **4032 照片格式**下提供建議。"},{"t":459,"title":"Support smart framing monitor","body":"示範監視器設定流程：找到同時支援目標比例與 smart framing 的格式並設為 activeFormat，取得 `smartFramingMonitor` 並把 `enabledFramings` 設為 `supportedFramings`（也可只取子集，如 4x3 的窄／廣兩種）。接著以 **KVO** 觀察 `recommendedFraming`，於回呼中先設 aspectRatio 再設 zoomFactor 以求預覽平滑過渡，可隨時 `startMonitoring`；關閉自動取景時則註銷觀察並 `stopMonitoring`。"},{"t":564,"title":"Sensor orientation compensation","body":"說明方向差異：過去前鏡頭感光元件以 Landscape Left 安裝，直拍照片會帶 EXIF 旋轉 270 度標記；新鏡頭改以 **Portrait 方向**安裝，若沿用舊旋轉值照片可能歪斜。**AVCapturePhotoOutput** 預設自動補償（實體旋轉並更新 EXIF，輸出維持 landscape left），但僅套用於 **HEIC、JPEG 與未壓縮處理照片**，絕不套用於 Bayer RAW 或 Apple ProRAW，並可用 `cameraSensorOrientationCompensationEnabled` 控制，建議測試關閉以求效能。"},{"t":713,"title":"Center Stage for video recordings","body":"錄影同樣可用 dynamicAspectRatio「點一下旋轉」，但 QuickTime 軌道要求所有 sample 尺寸一致，故改變比例時錄影會自動停止。用 **AVCaptureMovieFileOutput** 時會自動停錄；用 **AVCaptureVideoDataOutput** 搭 **AVAssetWriter** 則可用 `setDynamicAspectRatio` 的完成 timestamp 結束目前錄影並以新比例接續。錄影也受惠於臉部感知的 **cinematicExtended** 與 **cinematicExtendedEnhanced** 穩定模式。"},{"t":796,"title":"Center Stage for video calls","body":"以 FaceTime 為例示範朋友加入時鏡頭自動拉廣納入兩人。若 app 使用 **VoIP 背景模式**，Center Stage 已自動支援，使用者可從控制中心的視訊效果直接開啟；如同 Portrait、Studio Light 等系統視訊效果，Center Stage 是以行程為單位啟用，啟用後套用到 app 內任何支援的鏡頭。"},{"t":884,"title":"Support Center Stage for video calls","body":"說明未用 VoIP 背景模式時如何採用 Center Stage API：視訊通話通常用 video data output 串流取得 buffer，先找支援格式並設為 active format，再設定 `centerStageControlMode`（**cooperative** 讓 app 內按鈕也能控制，或 **app**），最後設 `isCenterStageEnabled = true`。另介紹 iOS 26 的即時低延遲穩定，把 AVCaptureConnection 的 `preferredVideoStabilizationMode` 設為 **lowLatency** 即可，預設為關閉。"}],"summary_en":["The **Center Stage front camera** on iPhone 17, iPhone Air, and iPhone 17 Pro changes how people take selfies and make video calls. Traditional front sensors are 4x3, so framing depends on phone orientation; the new camera uses a **square image sensor** paired with a **95-degree wide lens** (the widest on any iPhone front camera), letting you shoot portrait or landscape selfies without rotating the phone, with a more secure grip and more natural eye contact. The session walks through the **AVCapture** APIs to support this camera for photos, video recordings, and video calls.","Photo framing centers on **Auto Zoom and Auto Rotate**, built from two APIs. The foundation is iOS 26's **dynamicAspectRatio**: it crops your chosen ratio (3x4, 4x3, 9x16, 16x9, 1x1) out of the square sensor without rebuilding the session or interrupting preview, ideal for a Tap to Rotate button. On top of that sits **AVCaptureSmartFramingMonitor**, which uses face and gaze detection to periodically recommend a framing (aspectRatio plus zoomFactor); the app key-value observes `recommendedFraming` and applies it to auto-zoom and auto-rotate as people enter or leave the shot. The monitor only provides recommendations on the 4032 photo format, and the camera is always selected via a `.builtInUltraWideCamera`, `.front` discovery session.","Photos also require **sensor orientation compensation**: the new front sensor is mounted in Portrait rather than the old Landscape Left. **AVCapturePhotoOutput** automatically rotates photos and updates EXIF by default so output matches older devices, letting you keep your existing rotation values. Compensation applies only to HEIC, JPEG, and uncompressed processed photos, never to Bayer RAW or Apple ProRAW, and can be controlled via `cameraSensorOrientationCompensationEnabled` (test with it off for best performance).","Recordings and video calls benefit too. Recording supports Tap to Rotate via dynamicAspectRatio, but since QuickTime tracks require uniform sample dimensions, changing the ratio stops recording automatically (use **AVCaptureVideoDataOutput** with **AVAssetWriter** plus the completion timestamp to stitch segments seamlessly), and face-aware **cinematicExtended** stabilization is available. For video calls, apps using the VoIP background mode get Center Stage automatically; otherwise adopt the Center Stage API by setting `centerStageControlMode` (cooperative or app) then `isCenterStageEnabled`, and set the AVCaptureConnection's `preferredVideoStabilizationMode` to `lowLatency` for real-time low-latency stabilization."],"deepdive_en":[{"t":0,"title":"Introduction","body":"Tracy, an engineer on the Camera Software team, opens by naming the pain of selfie framing (selfie sticks, friends with long arms). The **Center Stage front camera** on iPhone 17, iPhone Air, and iPhone 17 Pro gives more flexibility in framing. The roadmap: overview the camera, then cover the APIs for photos, video recordings, and video calls."},{"t":67,"title":"Center Stage front camera","body":"Explains the hardware: traditional front cameras use a **4x3 sensor** whose framing is constrained by phone orientation, while the new camera has a **square image sensor** that lets you pick any aspect ratio, shooting portrait or landscape without rotating the phone for a more secure one-handed grip and natural eye contact. It is paired with a **95-degree field-of-view lens** (the widest of any iPhone front camera), helping with group selfies, video stabilization, and staying centered on calls."},{"t":129,"title":"Center Stage for photos","body":"Begins the photo topic, where the key feature is **Auto Zoom and Auto Rotate**: combining the square sensor, wide field of view, and automatic face and gaze detection, the camera adapts its orientation and switches between narrow and wide views. A live demo shows the frame zooming out as Karen joins and rotating as more friends enter, then previews the agenda: capture session setup, the dynamic aspect ratio and smart framing monitor APIs, and finally sensor orientation compensation."},{"t":189,"title":"Capture session setup","body":"Walks through a typical photo setup: create an **AVCaptureSession**, find the front camera via `.builtInUltraWideCamera` and create an **AVCaptureDeviceInput**, add an **AVCaptureVideoPreviewLayer** for preview and an **AVCapturePhotoOutput** to receive photos. As inputs and outputs are added, the session implicitly forms **AVCaptureConnections** between compatible media types."},{"t":236,"title":"Dynamic aspect ratio","body":"Introduces iOS 26's **dynamicAspectRatio** property, the building block for both manual and automatic framing: setting it crops the chosen ratio out of the square sensor without rebuilding the session or interrupting preview, making the switch seamless and quick. Supported formats require the front `.builtInUltraWideCamera`, are square, span resolutions 1280 to 4032, and offer five ratios (3x4, 4x3, 9x16, 16x9, 1x1); the 4032 photo format only supports 3x4 and 4x3 for the highest photo resolution."},{"t":329,"title":"Support dynamic aspect ratio","body":"Demonstrates implementing a Tap to Rotate button: use an **AVCaptureDevice.DiscoverySession** with `.builtInUltraWideCamera` and `.front` to get the single device, iterate `format.supportedDynamicAspectRatios` to find a 4x3 format, and set it as `activeFormat`. After locking for configuration, call `setDynamicAspectRatio(.ratio4x3)`, which returns the **timestamp** of the first buffer where the change takes effect."},{"t":407,"title":"Smart framing monitor","body":"Introduces iOS 26's **AVCaptureSmartFramingMonitor**, which works alongside dynamicAspectRatio to give periodic framing recommendations based on automatic face and gaze detection. Each recommendation contains an **aspectRatio and a zoomFactor** the app can apply or ignore; because it is designed for photo capture, it only provides recommendations on the **4032 photo format**."},{"t":459,"title":"Support smart framing monitor","body":"Shows the monitor setup: find a format supporting both the desired ratios and smart framing and set it as the active format, get the `smartFramingMonitor`, and set `enabledFramings` to `supportedFramings` (or a subset such as 4x3 narrow and wide). Then **key-value observe** `recommendedFraming`, applying it by setting aspectRatio first then zoomFactor for a smooth preview transition; you can `startMonitoring` at any time, and unregister the observation plus `stopMonitoring` when turning automatic framing off."},{"t":564,"title":"Sensor orientation compensation","body":"Explains the orientation difference: older front sensors were mounted Landscape Left, so a portrait selfie carried an EXIF tag to rotate 270 degrees, whereas the new sensor is mounted in **Portrait**, so reusing old rotation values can make photos appear sideways. **AVCapturePhotoOutput** compensates by default (physically rotating and updating EXIF so output stays landscape left), but only for **HEIC, JPEG, and uncompressed processed photos**, never Bayer RAW or Apple ProRAW; control it via `cameraSensorOrientationCompensationEnabled` and test with it off for best performance."},{"t":713,"title":"Center Stage for video recordings","body":"Recording also supports Tap to Rotate via dynamicAspectRatio, but QuickTime tracks require all samples to share dimensions, so changing the ratio stops recording automatically. With **AVCaptureMovieFileOutput** recording stops automatically; with **AVCaptureVideoDataOutput** plus **AVAssetWriter** you can use the `setDynamicAspectRatio` completion timestamp to end the current recording and start a new one. Recordings also benefit from face-aware **cinematicExtended** and **cinematicExtendedEnhanced** stabilization modes."},{"t":796,"title":"Center Stage for video calls","body":"Demonstrates a FaceTime call where the camera widens to include a friend who joins. Apps using the **VoIP background mode** already support Center Stage, which people can turn on from Control Center's Video Effects; like other system video effects (Portrait, Studio Light), Center Stage is enabled per process and, once active, applies to any supported camera in the app."},{"t":884,"title":"Support Center Stage for video calls","body":"Shows how apps not using the VoIP background mode adopt the Center Stage API: video calling apps typically use a video data output stream, so find a supported format and set it as active, set `centerStageControlMode` (**cooperative** so an in-app button can also control it, or **app**), then set `isCenterStageEnabled = true`. It also covers iOS 26's real-time low-latency stabilization, enabled by setting the AVCaptureConnection's `preferredVideoStabilizationMode` to **lowLatency** (off by default)."}],"code":[]},"related":[{"id":"303","title":"Build a responsive camera app that launches quickly","gloss":"打造啟動快速且反應靈敏的相機 App","gloss_en":"Build a responsive camera app that launches quickly","category":"other","categoryLabel":"其他"},{"id":"256","title":"Discover generated subtitles and subtitle styles","gloss":"認識自動產生字幕與字幕樣式","gloss_en":"Discover generated subtitles and subtitle styles","category":"graphics","categoryLabel":"圖形與遊戲"},{"id":"304","title":"Implement high resolution photo capture","gloss":"實作高解析度照片拍攝","gloss_en":"Implement high resolution photo capture","category":"graphics","categoryLabel":"圖形與遊戲"},{"id":"101","title":"Keynote","gloss":"主題演講","gloss_en":"Keynote","category":"other","categoryLabel":"其他"},{"id":"102","title":"Platforms State of the Union","gloss":"平台現況報告","gloss_en":"Platforms State of the Union","category":"other","categoryLabel":"其他"}]}</script>
