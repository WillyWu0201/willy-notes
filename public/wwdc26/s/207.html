<script id="d" type="application/json">{"s":{"id":"207","title":"Deliver workout insights with HealthKit workout zones","gloss":"用 HealthKit 運動區間呈現訓練洞察","category":"other","categoryLabel":"其他","duration":735,"url":"https://developer.apple.com/videos/play/wwdc2026/207/","takeaway":"HealthKit 新增 workout zones,讓你能直接讀取已完成訓練的心率區間、即時接收區間更新,並為使用者建立預設或自訂的區間設定。","chapters":[[1,"Introduction"],[137,"Accessing workout zones"],[234,"Reading Heart Rate Zones from a completed workout"],[379,"Live zone updates"],[477,"Handling Live Zone Updates"],[491,"Preferred zones"],[540,"Custom zones"],[559,"Check if Preferred Zone has been set"],[564,"Create Zone Boundaries"],[573,"Create Default Workout Zone Configuration"],[598,"Set Custom Zone Configuration"],[603,"Begin Data Collection"]],"points":[{"text":"HealthKit 讓你更容易提供訓練洞察,例如**心率與騎乘功率區間(workout zones)**。","hot":true},{"text":"可從已完成的訓練透過 **workout.zoneGroupsByType** 讀取各區間的數量與停留時間(zoneDurations)。","hot":false},{"text":"即時訓練可實作 **HKLiveWorkoutBuilder 的 didUpdateWorkoutZone**,在 @MainActor 上更新目前所在區間。","hot":false},{"text":"支援 **preferred zones**:先用 zoneConfiguration(for:) 檢查使用者是否已設定。","hot":false},{"text":"可用 **HKWorkoutZoneConfiguration** 以心率邊界陣列建立自訂區間,再以 setCustomZoneConfiguration 套用後 beginCollection。","hot":false}],"apis":["HealthKit","HKWorkoutZoneConfiguration","HKLiveWorkoutBuilder","HKLiveWorkoutZoneUpdate","zoneGroupsByType","HKQuantityType","HKQuantity","HKUnit"],"audience":"**開發健身、運動或健康類 App,想呈現心率/功率區間訓練數據的開發者。**","gloss_en":"Surface workout insights with HealthKit workout zones","takeaway_en":"HealthKit adds workout zones, letting you read heart rate zones from completed workouts, receive live zone updates, and set up preferred or custom zone configurations for users.","points_en":[{"text":"HealthKit makes it easier to deliver workout insights, such as **heart rate and cycling power zones (workout zones)**.","hot":true},{"text":"From a completed workout, read each zone's count and time spent (zoneDurations) via **workout.zoneGroupsByType**.","hot":false},{"text":"For live workouts, implement **HKLiveWorkoutBuilder's didUpdateWorkoutZone** to update the current zone on the @MainActor.","hot":false},{"text":"Support **preferred zones**: first check whether the user has configured them with zoneConfiguration(for:).","hot":false},{"text":"Use **HKWorkoutZoneConfiguration** to build custom zones from an array of heart rate boundaries, then apply with setCustomZoneConfiguration before beginCollection.","hot":false}],"audience_en":"**Developers building fitness, workout, or health apps who want to surface heart rate / power zone training data.**","summary":["這場由 HealthKit 團隊主講，主題是把 **workout zones**（運動區間）正式整合進 HealthKit。所謂區間，是把心率或騎乘功率這類原始數據，依強度切成數個帶狀範圍——例如典型的 **5 個 heart rate zones**，每筆心率樣本（如 135 bpm）會落在某一區（如 Zone 3）代表當下的努力程度；心率區間依年齡與靜止心率個人化計算，cycling power 區間則以個人化的 FTP（功能性閾值功率）換算瓦數。iOS 27／watchOS 27 起，HealthKit 會自動依運動期間湧入的樣本計算各區間的累計時間，讓 app 不必自行推算。","整場以一個能建立、追蹤並彙整運動的範例 app 貫穿，示範四件事。其一是讀取已完成運動的區間：透過 **`HKWorkout`** 或 **`HKWorkoutActivity`** 上的 **`zoneGroupsByType`** 字典，傳入對應的 `HKQuantityType` 取得 **`HKWorkoutZoneGroup`**，它含一份 **`HKWorkoutZoneConfiguration`**（描述區間集合與來源 source）與一個 `zoneDurations` 陣列（各區間及其停留時間），可直接拿來畫圖表。各區間保證**連續且不重疊**，第一區無下界、最後一區無上界。其二是即時更新：實作 **`HKLiveWorkoutBuilderDelegate`** 的 **`didUpdateWorkoutZone`**，僅在當前區間變動（如 Zone 2 → Zone 3）時觸發，帶入 current／previous 區間、整組 zone group 與最後一筆樣本時戳，可即時高亮當前區間並提醒使用者。","後半談區間設定的來源。預設使用 Health Settings 裡的 **preferred zones**，它會跨裝置透過 HealthKit 同步，並能由系統依使用者指標自動計算或由使用者手動設定，提供跨 app 一致的體驗；開始運動前可先在 `HKHealthStore` 或 `HKWorkoutBuilder` 查詢是否已設定。當 app 有專屬區間模型（如自家訓練平台）時則改用 **custom zones**：建立 `HKQuantity` 邊界陣列、組成 **`HKWorkoutZoneConfiguration`**，並在 `beginCollection` 之前用 `setCustomZoneConfiguration` 餵給 builder。","實務上要留意幾點：區間數須介於 **3 到 9 之間**；custom 設定只存在於該次運動的脈絡，app 需自行負責儲存與同步；不同運動可能有不同的區間數（cycling power 系統預設 6 區，有些 app 用 5、7 或 8 區），因此跨運動比較 time-in-zone 時不能直接對齊區間編號，而要**回到原始樣本、依各自的區間數與邊界重新分桶 normalize**。整體而言，這套 API 讓 post-workout 摘要、即時教練回饋與長期訓練儀表板都能更輕鬆取得可付諸行動的訓練指引。"],"deepdive":[{"t":1,"title":"Introduction","body":"由 HealthKit 工程師 Seth 開場，說明取得授權後 app 即可利用 HealthKit 集中、安全的資料庫與 API。重點介紹 **workout zones** 概念：心率區間依個人**年齡與靜止心率**計算，通常分 **5 區**，每筆樣本落在某區代表強度，可用於跑步、騎乘、HIIT、划船等；cycling power 區間則以個人化 **FTP** 衡量瓦數。並預告本場以心率區間為例，涵蓋讀取已完成運動、live 更新、preferred zones 與 custom zones 四大主題。"},{"t":137,"title":"Accessing workout zones","body":"說明區間如何把原始數據轉成可付諸行動的訓練指引：耐力訓練要求低於某門檻、間歇訓練則需停在特定強度以上，而長時間落在 Zone 4／5 代表高強度努力，可用來分類運動強度或做負荷平衡。iOS 27／watchOS 27 起區間整合進 HealthKit 後，**time in each zone 由 HealthKit 依湧入樣本自動計算**，並遵循與其他資料型別相同的授權流程——需先為 workouts、heart rate、cycling power 等 quantity type 請求授權。"},{"t":234,"title":"Reading Heart Rate Zones from a completed workout","body":"示範運動結束後在摘要頁畫出各心率區間的停留時間。作法是存取 `HKWorkout` 或 `HKWorkoutActivity` 上的 **`zoneGroupsByType`** 字典並傳入 `HKQuantityType(.heartRate)`（改傳 cycling power 即取得功率區間），若有資料會回傳 **`HKWorkoutZoneGroup`**。該結構含一份 `HKWorkoutZoneConfiguration`（內含 quantity type、表示來源的 **source** enum，以及依邊界排序、保證**連續不重疊**且首尾無界的 zones 陣列）與一個 `zoneDurations` 陣列，範例直接 `map(\\.duration)` 餵進圖表。因為區間同時存在於 workout 與 activity 上，多項目運動可整體顯示或依各 activity 拆開。"},{"t":379,"title":"Live zone updates","body":"處理運動進行中的即時區間變化，讓 app 能顯示當前區間並在改變時提醒使用者調整強度。HealthKit 在 live 運動期間逐筆處理湧入的心率樣本、判定所屬區間，當發生變動（如 Zone 2 → Zone 3）便通知 app。接收更新的協定是 **`HKLiveWorkoutBuilderDelegate`**：HealthKit 追蹤運動，遇到新 activity 或被追蹤資料更新等重要事件時轉交 delegate，app 即可更新 UI。"},{"t":477,"title":"Handling Live Zone Updates","body":"具體實作 **`didUpdateWorkoutZone`** 方法處理區間變更。每次更新**僅在當前區間真正改變時送出**，帶有 current 與 previous 區間、含完整設定與各區當前累計時間的 zone group，以及最後處理樣本的時戳（可用來顯示停留於當前區間的計時器）。範例取出 `currentZoneDuration?.zone.index`，組成 `ZoneDisplayData` 後在 `@MainActor` 上更新狀態以高亮新的當前區間。"},{"t":491,"title":"Preferred zones","body":"預設情況下 HealthKit 使用 Health Settings 裡設定的 **preferred zone thresholds**。preferred zones 會透過 HealthKit **跨裝置同步**，提供跨 app 與跨裝置的一致體驗；它可由系統依使用者指標（如心率區間依年齡與靜止心率）**週期性自動計算**，也可由使用者在 Health Settings 中**手動設定**。重點提醒：開始區間運動前，應先確認使用者已有 preferred zone 設定。"},{"t":540,"title":"Custom zones","body":"當 app 有別於 Health Settings 的專屬區間定義時（例如採用自家專有區間模型的訓練平台），應改用 **custom zones**。本段帶出整體策略：先檢查是否已有 preferred 設定，若無則提供一組自訂區間，串起後續建立邊界、組裝設定、餵給 builder 的流程。"},{"t":559,"title":"Check if Preferred Zone has been set","body":"示範如何判斷是否需要提供 custom 設定：以 `try await builder.zoneConfiguration(for: HKQuantityType(.heartRate))` 查詢 preferred 心率設定，當回傳 **`nil`** 代表尚未設定，便進入建立自訂區間的分支。此查詢可在 `HKHealthStore` 或 `HKWorkoutBuilder` 上進行。"},{"t":564,"title":"Create Zone Boundaries","body":"從一組門檻值（範例為 `[91.0, 114.0, 136.0, 158.0]`）與對應的 **`HKUnit`**（心率用 `count()/minute()` 得 bpm）出發，`map` 成一個 **`HKQuantity`** 邊界陣列。強調邊界的單位必須與區間設定的 quantity type **相容且一致**。"},{"t":573,"title":"Create Default Workout Zone Configuration","body":"用上一步的 boundaries 與 `HKQuantityType(.heartRate)` 建立 **`HKWorkoutZoneConfiguration`**。HealthKit 會依提供的邊界產生區間，**第一區從 0 起、最後一區不設上界**，且區間數必須介於 **3 到 9** 之間。"},{"t":598,"title":"Set Custom Zone Configuration","body":"透過 `try await builder.setCustomZoneConfiguration(_:for:)` 把自訂設定交給 **`HKWorkoutBuilder`**。關鍵限制：custom zone 設定**必須在呼叫 `beginCollection` 之前加入** builder。"},{"t":603,"title":"Begin Data Collection","body":"設定就緒後以 `try await builder.beginCollection(at: startDate)` 開始收集資料。本段並總結幾個重要注意事項：custom 設定**只存在於該次運動脈絡**，儲存與同步需由 app 自行負責；不同運動可能有不同區間數（cycling power 預設 6 區，有些用 5、7 或 8），因此跨運動比較 time-in-zone 時**不可直接對齊區間編號**，而要回到原始樣本、依各自區間數與邊界重新 **normalize** 分桶。"}],"summary_en":["Presented by the HealthKit team, this session is about bringing **workout zones** fully into HealthKit. A zone slices intensity data such as heart rate or cycling power into contiguous bands — typically **5 heart rate zones** — so each sample (e.g. 135 bpm) lands in a zone (e.g. Zone 3) that signals current effort. Heart rate zones are personalized from age and resting heart rate, while cycling power zones convert watts against a personalized FTP. Starting in iOS 27 / watchOS 27, HealthKit automatically computes time-in-zone from the samples arriving during a workout, so apps no longer have to derive it themselves.","A sample app that creates, tracks, and summarizes workouts runs through the whole talk, demonstrating four things. First, reading zones from a completed workout: via the **`zoneGroupsByType`** dictionary on **`HKWorkout`** or **`HKWorkoutActivity`**, pass the relevant `HKQuantityType` to get an **`HKWorkoutZoneGroup`**, which carries an **`HKWorkoutZoneConfiguration`** (the set of zones plus a source enum) and a `zoneDurations` array (each zone and its dwell time) — ready to chart. Zones are guaranteed **contiguous and non-overlapping**, with no lower bound on the first and no upper bound on the last. Second, live updates: implement **`HKLiveWorkoutBuilderDelegate`**'s **`didUpdateWorkoutZone`**, which fires only when the current zone changes (e.g. Zone 2 → Zone 3) and supplies current/previous zones, the full zone group, and the last sample timestamp — enough to highlight the active zone and nudge the user.","The latter half covers where zone definitions come from. By default HealthKit uses the **preferred zones** configured in Health Settings, which sync across devices via HealthKit and can be either system-calculated from user metrics or manually set, giving a consistent cross-app experience; check for them on `HKHealthStore` or `HKWorkoutBuilder` before starting. When an app has its own zone model (e.g. a proprietary training platform), use **custom zones**: build an array of `HKQuantity` boundaries, assemble an **`HKWorkoutZoneConfiguration`**, and hand it to the builder with `setCustomZoneConfiguration` *before* `beginCollection`.","Practical caveats: a configuration must have between **3 and 9 zones**; custom configurations exist only within that workout's context, so the app is responsible for saving and syncing them; and different workouts can use different zone counts (cycling power defaults to 6, but apps use 5, 7, or 8). Because of that, comparing time-in-zone across workouts can't just align zone indices — you must go back to the raw samples and **re-bucket (normalize)** them to each workout's zone count and boundaries. Overall the API makes post-workout summaries, live coaching, and long-term training dashboards far easier to power with actionable guidance."],"deepdive_en":[{"t":1,"title":"Introduction","body":"HealthKit engineer Seth opens by noting that, with permission, apps can leverage HealthKit's centralized, secure database and APIs. He introduces **workout zones**: heart rate zones are computed from a person's **age and resting heart rate**, usually split into **5 zones**, with each sample's zone signaling intensity for activities like running, cycling, HIIT, and rowing; cycling power zones measure watts against a personalized **FTP**. He previews the four topics — reading completed workouts, live updates, preferred zones, and custom zones — using heart rate as the example."},{"t":137,"title":"Accessing workout zones","body":"Explains how zones turn raw data into actionable guidance: endurance plans want you below a threshold, intervals want you at or above one, and lots of time in Zone 4/5 signals a hard effort useful for classifying intensity and load balancing. With zones integrated in iOS 27 / watchOS 27, **time in each zone is computed automatically by HealthKit** from incoming samples, following the same authorization flow as other types — request access for workouts, heart rate, and cycling power up front."},{"t":234,"title":"Reading Heart Rate Zones from a completed workout","body":"Demonstrates charting per-zone dwell time on a post-workout summary. Access the **`zoneGroupsByType`** dictionary on `HKWorkout` or `HKWorkoutActivity` with `HKQuantityType(.heartRate)` (swap in cycling power for power zones); if available it returns an **`HKWorkoutZoneGroup`**. That holds an `HKWorkoutZoneConfiguration` (quantity type, a **source** enum, and a boundary-ordered `zones` array that is **contiguous, non-overlapping**, and unbounded at the ends) plus a `zoneDurations` array, which the sample feeds to a chart via `map(\\.duration)`. Since zones live on both workout and activity, multi-sport workouts can show totals or break them out per activity."},{"t":379,"title":"Live zone updates","body":"Covers handling zone changes during a live workout so the app can show the current zone and alert the user to adjust intensity. HealthKit processes each incoming heart rate sample, identifies its zone, and notifies the app when it changes (e.g. Zone 2 → Zone 3). The protocol for these updates is **`HKLiveWorkoutBuilderDelegate`**: HealthKit tracks the workout and hands important events — a new activity, or an update to a tracked type — to the delegate so the app can update its UI."},{"t":477,"title":"Handling Live Zone Updates","body":"Implements the **`didUpdateWorkoutZone`** method. Each update is sent **only when the current zone actually changes** and carries current and previous zones, the zone group with full configuration and current per-zone totals, plus the timestamp of the last processed sample (handy for a running timer in the current zone). The sample reads `currentZoneDuration?.zone.index`, builds a `ZoneDisplayData`, and updates state on the `@MainActor` to highlight the new current zone."},{"t":491,"title":"Preferred zones","body":"By default HealthKit uses the **preferred zone thresholds** set in Health Settings. Preferred zones **sync across devices** via HealthKit for a consistent cross-app, cross-device experience; they can be **periodically calculated by the system** from user metrics (heart rate zones from age and resting heart rate) or **manually configured** in Health Settings. The reminder: make sure a preferred zone configuration is set before starting a zone workout."},{"t":540,"title":"Custom zones","body":"When an app's zone definitions differ from Health Settings — such as a training platform with a proprietary zone model — use **custom zones**. This section sets up the strategy: check whether preferred zones are set, and if not, supply a custom set, chaining into building boundaries, assembling the configuration, and handing it to the builder."},{"t":559,"title":"Check if Preferred Zone has been set","body":"Shows how to decide whether a custom configuration is needed: query the preferred heart rate configuration with `try await builder.zoneConfiguration(for: HKQuantityType(.heartRate))`, and when it returns **`nil`**, branch into building custom zones. This query can be run on either `HKHealthStore` or `HKWorkoutBuilder`."},{"t":564,"title":"Create Zone Boundaries","body":"Starting from a set of thresholds (the sample uses `[91.0, 114.0, 136.0, 158.0]`) and the matching **`HKUnit`** (bpm built from `count()/minute()`), `map` them into an array of **`HKQuantity`** boundaries. The boundary units must be **compatible with and match** the configuration's quantity type."},{"t":573,"title":"Create Default Workout Zone Configuration","body":"Use the boundaries and `HKQuantityType(.heartRate)` to construct an **`HKWorkoutZoneConfiguration`**. HealthKit creates zones from the boundaries with the **first zone starting at 0 and the last unbounded**, and the count must be between **3 and 9** zones."},{"t":598,"title":"Set Custom Zone Configuration","body":"Hand the custom configuration to the **`HKWorkoutBuilder`** via `try await builder.setCustomZoneConfiguration(_:for:)`. The key constraint: a custom zone configuration **must be added before calling `beginCollection`**."},{"t":603,"title":"Begin Data Collection","body":"With everything set, start collecting with `try await builder.beginCollection(at: startDate)`. The section also wraps up the caveats: custom configurations exist **only within that workout's context**, so saving and syncing is the app's responsibility; and because workouts can use different zone counts (cycling power defaults to 6, others use 5, 7, or 8), comparing time-in-zone across workouts **must not align zone indices directly** — instead go back to the raw samples and **normalize** by re-bucketing to each workout's zone count and boundaries."}],"code":[]},"related":[{"id":"101","title":"Keynote","gloss":"主題演講","gloss_en":"Keynote","category":"other","categoryLabel":"其他"},{"id":"102","title":"Platforms State of the Union","gloss":"平台現況報告","gloss_en":"Platforms State of the Union","category":"other","categoryLabel":"其他"},{"id":"111","title":"Keynote (ASL)","gloss":"主題演講(美國手語版)","gloss_en":"Keynote (American Sign Language)","category":"other","categoryLabel":"其他"},{"id":"112","title":"Platforms State of the Union (ASL)","gloss":"平台現況報告（美國手語版）","gloss_en":"Platforms State of the Union (American Sign Language)","category":"other","categoryLabel":"其他"},{"id":"122","title":"WWDC26 Platforms State of the Union Recap","gloss":"WWDC26 平台現況演講重點回顧","gloss_en":"WWDC26 Platforms State of the Union recap","category":"other","categoryLabel":"其他"}]}</script>
