<script id="d" type="application/json">{"s":{"id":"272","title":"Use SwiftUI with AppKit and UIKit","gloss":"在 AppKit 與 UIKit 中使用 SwiftUI","category":"swiftui","categoryLabel":"SwiftUI","duration":843,"url":"https://developer.apple.com/videos/play/wwdc2026/272/","takeaway":"藉助 Observation 框架，把 SwiftUI 視圖、手勢、選單與場景漸進式地嵌入既有的 AppKit 或 UIKit App。","chapters":[[0,"Introduction"],[153,"Observation in AppKit"],[219,"Observation in AppKit"],[341,"Hosting SwiftUI in AppKit"],[388,"Circular color picker"],[441,"Hosting SwiftUI in AppKit"],[468,"AppKit gestures in SwiftUI"],[494,"Mix NSGestureRecognizer with SwiftUI"],[556,"SwiftUI in the main menu"],[582,"Adding ColorMenu to the Main Menu"],[690,"SwiftUI scenes in AppKit"],[696,"Adding SwiftUI scenes dynamically"],[784,"Next steps"]],"points":[{"text":"用 **@Observable** 模型讓 AppKit 與 SwiftUI 共享同一份狀態，達成漸進式採用。","hot":false},{"text":"透過 **NSHostingView** 將 SwiftUI 視圖（如自訂色彩選擇器）嵌入 AppKit 介面。","hot":false},{"text":"以 **NSGestureRecognizerRepresentable** 把 NSGestureRecognizer（如 Force Click）橋接進 SwiftUI。","hot":false},{"text":"使用 **NSHostingMenu** 把 SwiftUI 定義的選單放進 macOS 主選單列。","hot":false},{"text":"透過 **NSHostingSceneRepresentation** 動態加入 MenuBarExtra、Settings 等 SwiftUI 場景。","hot":true}],"apis":["SwiftUI","Observation","NSHostingView","NSGestureRecognizerRepresentable","NSHostingMenu","NSHostingSceneRepresentation","MenuBarExtra"],"audience":"維護既有 **AppKit 或 UIKit App**、想逐步導入 SwiftUI 的 macOS／iOS 開發者。","gloss_en":"Use SwiftUI with AppKit and UIKit","takeaway_en":"Leverage the Observation framework to incrementally embed SwiftUI views, gestures, menus, and scenes into an existing AppKit or UIKit app.","points_en":[{"text":"Use an **@Observable** model to share the same state between AppKit and SwiftUI, enabling incremental adoption.","hot":false},{"text":"Embed SwiftUI views (such as a custom color picker) into an AppKit interface via **NSHostingView**.","hot":false},{"text":"Bridge an NSGestureRecognizer (such as Force Click) into SwiftUI with **NSGestureRecognizerRepresentable**.","hot":false},{"text":"Use **NSHostingMenu** to place a SwiftUI-defined menu into the macOS main menu bar.","hot":false},{"text":"Dynamically add SwiftUI scenes like MenuBarExtra and Settings via **NSHostingSceneRepresentation**.","hot":true}],"audience_en":"macOS/iOS developers maintaining an existing **AppKit or UIKit app** who want to adopt SwiftUI incrementally.","summary":["這場由 UI Frameworks 團隊的 David Nadoba 主講，核心訊息是：**SwiftUI 從一開始就被設計成能與 AppKit、UIKit 共存**，就像 Swift 與 Objective-C 一樣，因此你可以**漸進式採用**，不必整個 app 重寫或從零開始。講者強調連 Apple 自己也走這條路（Logic Pro 的外掛、Xcode 的 Coding Assistant），而且在 2026 的新設計下，即使你用 NSSlider、NSSwitch 這類 AppKit 控制項，底層其實也是用 SwiftUI 與 **Liquid Glass** 來繪製。全程以一個能透過網路控制檯燈的 AppKit app（含一個三滑桿的自訂顏色選擇器）作為範例。","起點是**先用 @Observable，連 SwiftUI 都還沒登場**。原本當 hue 改變時要手動對其他滑桿設 `needsDisplay = true` 才會重繪；只要把 model 標上 **@Observable**，AppKit 會追蹤在 `draw`、`drawKnob`、`drawBar` 等繪製方法中存取了哪些屬性，並在它們變動時自動重繪。除了 `NSView.draw(_:)`，**updateConstraints()、layout()、updateLayer()** 與對應的 NSViewController 方法也都支援；UIKit 涵蓋更廣，延伸到 UIButton、UICollectionViewCell 等。此功能可透過 Info.plist 的 **NSObservationTrackingEnabled**（macOS 15）與 **UIObservationTrackingEnabled**（iOS 18）回溯部署，2026 版起預設開啟。","接著是**何時改用 SwiftUI 與如何嵌入 NSView 階層**。當畫法與互動會整個改變時（例如把三個直線滑桿改成圓環式顏色選擇器），就是換用 SwiftUI 的好時機——可沿用同一個 @Observable ColorModel，並用 **Canvas** 這個 immediate-mode 繪圖 API（類似 drawRect，也能用 withCGContext 沿用既有 CoreGraphics 程式碼）。要放回既有 NSView 階層，就把 SwiftUI view 包進 **NSHostingView**（它是 NSView 子類）。此外可用 **NSGestureRecognizerRepresentable** 把既有的 NSGestureRecognizer 子類（示範中的 ForceClickGestureRecognizer，偵測 trackpad 用力按的 force click）直接以 `.gesture` 加到 SwiftUI view，與既有的 DragGesture 共存無需改動。","最後兩段把 SwiftUI 帶進**主選單與 Scene**。force click 並非所有輸入裝置都支援，所以講者用 SwiftUI 寫了含 Button、keyboardShortcut 與 palette 風格 Picker 的 **ColorMenu** view，再用 **NSHostingMenu**（NSMenu 子類）包起來、設成 NSMenuItem 的 submenu 加進既有主選單。完整的 SwiftUI **Scene** 也能從既有 app delegate 動態加入：用 **NSHostingSceneRepresentation** 包住 MenuBarExtra 與 Settings 兩個 scene，在 `applicationWillFinishLaunching` 呼叫 `addSceneRepresentation`，並透過其 environment 的 `openSettings()` 從 @IBAction 程式化開啟設定視窗。結語提醒：app 不需要全部變成 SwiftUI 才能受惠，先試 @Observable、在新元件採用 SwiftUI，就是很好的第一步。"],"deepdive":[{"t":0,"title":"Introduction","body":"David Nadoba 開場說明 **SwiftUI 自設計之初就能與 AppKit／UIKit 良好共存**，適合漸進式採用而不必重寫。他舉 Logic Pro 外掛、Xcode 27 的 Coding Assistant 為例，並指出即便你用 NSSlider、NSSwitch 等 AppKit 控制項，底層也已用 **SwiftUI** 與 **Liquid Glass** 繪製。本場聚焦 macOS（概念通用於各平台），以一個能控制桌上環形燈的 AppKit app 為範例。"},{"t":153,"title":"Observation in AppKit","body":"拆解現有顏色選擇器的痛點：三個滑桿以自訂 track 漸層與 knob 繪製，移動 hue 的 knob 時其他滑桿的外觀也需更新，但 AppKit 不會自動重繪。目前必須在 hue 改變時手動對 saturation、brightness 滑桿設 **needsDisplay = true**，且每個值與外部變動都得照做。"},{"t":219,"title":"Observation in AppKit","body":"提出解法：在 Swift class 加上 **@Observable** 巨集，所有可變屬性即納入觀察系統。滑桿是 NSSliderCell 子類，只要在 **drawKnob** 等繪製方法中存取新 ColorModel 的屬性，AppKit 就會追蹤存取並在屬性變動時自動重繪，不再需要手動 needsDisplay。除了 draw，**updateConstraints()、layout()、updateLayer()** 與 NSViewController 對應方法也支援；UIKit 更延伸到 UIButton、UICollectionViewCell 等，並可用 Info.plist 旗標回溯部署到 macOS 15／iOS 18。"},{"t":341,"title":"Hosting SwiftUI in AppKit","body":"講者構想一個全新的圓環式顏色選擇器：hue 為外圈色環、saturation 與 brightness 為內側兩個半圓、正中央以圓形預覽結果色。由於整個繪圖與互動都會改變，他認為這正是改用 SwiftUI 的好時機，並可沿用先前 NSSlider 版本相同的 @Observable ColorModel。"},{"t":388,"title":"Circular color picker","body":"在 view 的 body 使用 **Canvas**——一個 immediate-mode 繪圖 API，類似 AppKit／UIKit 的 drawRect：每次重繪都以新的 GraphicsContext 呼叫你的 closure，直接下 stroke、fill、transform、filter 等繪製指令。也可透過 **withCGContext** 沿用既有 CoreGraphics 繪圖程式碼，並引用 WWDC21 的 Canvas 介紹與 WWDC26 的 Metal Shader 講座。"},{"t":441,"title":"Hosting SwiftUI in AppKit","body":"因為顏色選擇器仍嵌在多處 NSView 階層中，講者把 SwiftUI view 包進 **NSHostingView**（NSView 的子類）即可放回原處。關鍵在於 model 早已改為 @Observable，所以幾乎不需其他改動；並指向 WWDC 2022 的「Use SwiftUI with AppKit／UIKit」做深入了解。"},{"t":468,"title":"AppKit gestures in SwiftUI","body":"在展示新選擇器前，他想加一個功能：用一次 **force click**（在 trackpad 上用力按）把 brightness 與 saturation 快速重設為 100%。他在 app 其他地方已有對應的 **NSGestureRecognizer**，希望直接沿用到新的 SwiftUI view。"},{"t":494,"title":"Mix NSGestureRecognizer with SwiftUI","body":"用 **NSGestureRecognizerRepresentable** 把既有手勢辨識器帶入 SwiftUI：在 makeNSGestureRecognizer 回傳 **ForceClickGestureRecognizer**（偵測 pressure stage 2），在 handleNSGestureRecognizerAction 把 saturation、brightness 重設為 1 並包進 withAnimation。回到 HSBColorPicker 後用 **.gesture** 修飾子加上去，與既有 DragGesture 共存無需其他改動；他也提到 NSViewRepresentable 等其他 representable 協定。"},{"t":556,"title":"SwiftUI in the main menu","body":"由於 Magic Mouse、MacBook Neo 的 trackpad 等裝置無法做 force click，需要另一種存取方式：帶 keyboard shortcut 的選單項目。app 主選單用的是 AppKit 的 **NSMenu**，講者接著說明如何用 SwiftUI 加入這個新選單項目。"},{"t":582,"title":"Adding ColorMenu to the Main Menu","body":"建立符合 View 協定、可存取共享 ColorModel 的 **ColorMenu**：body 中放 Button（含 label 與重設 action，並用 withAnimation 動畫化）、加上 **keyboardShortcut**，以及一個 **palette 風格的 Picker** 精準選常用色。再用 **NSHostingMenu**（NSMenu 子類，可設 title）包住此 view，建立 NSMenuItem、設為其 submenu 並加進 mainMenu。"},{"t":690,"title":"SwiftUI scenes in AppKit","body":"最後一步：用既有 app delegate 把完整的 **SwiftUI Scene** 帶進 app。講者想讓使用者能快速調整燈的顏色或亮度，因此打算加入一個 menu bar extra，而 SwiftUI 的 **MenuBarExtra** scene 只需幾行就能做到。"},{"t":696,"title":"Adding SwiftUI scenes dynamically","body":"用 **NSHostingSceneRepresentation** 包住 SwiftUI scene，讓既有 AppKit app 能動態加入；在 NSApplicationDelegate 的 **applicationWillFinishLaunching** 呼叫 **addSceneRepresentation** 傳入 scenes 即可。再用 **Settings** scene 放一個 Toggle 控制 MenuBarExtra 的插入與移除，並透過該 representation environment 的 **openSettings()**，從 @IBAction 程式化開啟設定視窗。"},{"t":784,"title":"Next steps","body":"總結混用 SwiftUI 與 AppKit 的多種方式，並強調正確做法取決於你的 app 與問題。建議：先試 **@Observable** 讓 model 與 NSView 自動同步；在實作或重寫元件時考慮 SwiftUI；把既有 gesture recognizer 子類加到 SwiftUI view；新 scene 直接用 SwiftUI 起手。所有 API 在 2026 或更早版本即可使用，且 app 不需全面 SwiftUI 才能受惠。"}],"summary_en":["Presented by David Nadoba of the UI Frameworks team, the core message is that **SwiftUI was designed from the start to work alongside AppKit and UIKit** — much like Swift with Objective-C — so you can **adopt it incrementally** without rewriting your whole app or starting from scratch. He notes Apple itself follows this path (Logic Pro plugins, Xcode's Coding Assistant), and that with the 2026 design even AppKit controls like NSSlider and NSSwitch are rendered using SwiftUI and **Liquid Glass** under the hood. The running example is an AppKit app that controls a desk ring lamp over the network, with a custom three-slider color picker.","The starting point is **@Observable, before any SwiftUI at all**. Previously, when hue changed you had to manually set `needsDisplay = true` on the other sliders to redraw them; just adding **@Observable** to the model makes AppKit track which properties are accessed inside draw methods like `draw`, `drawKnob`, and `drawBar`, and redraw automatically when they change. Beyond `NSView.draw(_:)`, **updateConstraints(), layout(), updateLayer()** and the NSViewController equivalents also support it; UIKit goes further to UIButton, UICollectionViewCell, and more. It can be back-deployed via the Info.plist keys **NSObservationTrackingEnabled** (macOS 15) and **UIObservationTrackingEnabled** (iOS 18), and is on by default from the 2026 releases.","Next is **when to move to SwiftUI and how to embed it in an NSView hierarchy**. When the drawing and interaction will change completely (e.g. turning three linear sliders into a circular color picker), it's a great time to switch — reusing the same @Observable ColorModel and SwiftUI's **Canvas**, an immediate-mode drawing API (like drawRect, and able to reuse existing CoreGraphics code via withCGContext). To place it back in an existing NSView hierarchy, wrap the SwiftUI view in **NSHostingView** (an NSView subclass). You can also use **NSGestureRecognizerRepresentable** to add an existing NSGestureRecognizer subclass (the demo's ForceClickGestureRecognizer, detecting a firm trackpad force click) directly to a SwiftUI view via `.gesture`, coexisting with the existing DragGesture without other changes.","The last two parts bring SwiftUI into the **main menu and Scenes**. Since force click isn't available on every input device, he builds a SwiftUI **ColorMenu** view with a Button, keyboardShortcut, and a palette-style Picker, then wraps it in **NSHostingMenu** (an NSMenu subclass) as a submenu added to the existing main menu. Full SwiftUI **Scenes** can be added dynamically from an existing app delegate too: wrap MenuBarExtra and Settings scenes in **NSHostingSceneRepresentation**, call `addSceneRepresentation` in `applicationWillFinishLaunching`, and use its environment's `openSettings()` from an @IBAction to open Settings programmatically. The closing reminder: an app needn't be entirely SwiftUI to benefit — trying @Observable and adopting SwiftUI for new components are great first steps."],"deepdive_en":[{"t":0,"title":"Introduction","body":"David Nadoba opens by explaining that **SwiftUI was designed from the beginning to work great alongside AppKit and UIKit**, ideal for incremental adoption without rewriting everything. He cites Logic Pro plugins and Xcode 27's Coding Assistant, and notes that even AppKit controls like NSSlider and NSSwitch are now rendered using **SwiftUI** and **Liquid Glass** under the hood. The talk focuses on macOS (concepts apply to all platforms), using an AppKit app that controls a desk ring lamp."},{"t":153,"title":"Observation in AppKit","body":"He walks through the current color picker's pain point: three sliders with a custom track gradient and knob, where moving the hue knob must also update the other sliders' appearance, but AppKit doesn't redraw them automatically. Today he must manually set **needsDisplay = true** on the saturation and brightness sliders whenever hue changes, and similarly for every value and external change."},{"t":219,"title":"Observation in AppKit","body":"The fix: add the **@Observable** macro to a Swift class so all mutable variables participate in observation. The sliders are NSSliderCell subclasses, and simply accessing the new ColorModel's properties inside draw methods like **drawKnob** lets AppKit track the access and redraw automatically when they change — no more manual needsDisplay. Besides draw, **updateConstraints(), layout(), updateLayer()** and NSViewController equivalents support it; UIKit extends to UIButton, UICollectionViewCell, and more, with Info.plist flags to back-deploy to macOS 15 / iOS 18."},{"t":341,"title":"Hosting SwiftUI in AppKit","body":"He envisions a new circular color picker: hue as an outer color ring, saturation and brightness as two inner semicircles, with a circular preview of the resulting color in the middle. Because the whole drawing and interaction will change, he sees this as a great time to move to SwiftUI, reusing the same @Observable ColorModel from the NSSlider-based picker."},{"t":388,"title":"Circular color picker","body":"In the view's body he uses **Canvas** — an immediate-mode drawing API like AppKit/UIKit's drawRect: each redraw calls your closure with a fresh GraphicsContext where you issue strokes, fills, transforms, and filters directly. Existing CoreGraphics drawing code can be reused via **withCGContext**, and he references WWDC21's Canvas intro and WWDC26's Metal Shaders session."},{"t":441,"title":"Hosting SwiftUI in AppKit","body":"Since the picker is still embedded in many NSView hierarchies, he wraps the SwiftUI view in **NSHostingView** (an NSView subclass) to drop it back in. Because the model was already moved to @Observable, that's essentially all that's needed; he points to WWDC 2022's \"Use SwiftUI with AppKit/UIKit\" for a deeper tour."},{"t":468,"title":"AppKit gestures in SwiftUI","body":"Before showing the new picker he wants one more feature: reset brightness and saturation to 100% with a single **force click** (a firm press on the trackpad). He already has an **NSGestureRecognizer** for this used elsewhere in the app and wants to reuse it in the new SwiftUI view."},{"t":494,"title":"Mix NSGestureRecognizer with SwiftUI","body":"Using **NSGestureRecognizerRepresentable**, he brings the existing recognizer into SwiftUI: makeNSGestureRecognizer returns his **ForceClickGestureRecognizer** (recognizing pressure stage 2), and handleNSGestureRecognizerAction resets saturation and brightness to 1 inside withAnimation. Back in HSBColorPicker he adds it with the **.gesture** modifier, coexisting with the existing DragGesture without other changes; he also mentions other representables like NSViewRepresentable."},{"t":556,"title":"SwiftUI in the main menu","body":"Because devices like the Magic Mouse and MacBook Neo trackpad can't do a force click, another access path is needed: a menu item with a keyboard shortcut. The app's main menu uses AppKit's **NSMenu**, and he explains how to add the new menu item using SwiftUI."},{"t":582,"title":"Adding ColorMenu to the Main Menu","body":"He creates a **ColorMenu** conforming to View with access to the shared ColorModel: the body has a Button (with label and reset action wrapped in withAnimation), a **keyboardShortcut**, and a **palette-style Picker** to precisely select common colors. He then wraps it in **NSHostingMenu** (an NSMenu subclass with a title), creates an NSMenuItem, sets the color menu as its submenu, and adds it to the mainMenu."},{"t":690,"title":"SwiftUI scenes in AppKit","body":"The final step: bring complete **SwiftUI Scenes** to the app using the existing app delegate. He wants to give people quick access to change the lights' color or brightness via a menu bar extra, which SwiftUI's **MenuBarExtra** scene makes possible in just a few lines."},{"t":696,"title":"Adding SwiftUI scenes dynamically","body":"He wraps SwiftUI scenes in **NSHostingSceneRepresentation** so an existing AppKit app can add them dynamically, calling **addSceneRepresentation** in the NSApplicationDelegate's **applicationWillFinishLaunching**. A **Settings** scene adds a Toggle to control inserting/removing the MenuBarExtra, and the representation's environment exposes **openSettings()**, used from an @IBAction to open the settings window programmatically."},{"t":784,"title":"Next steps","body":"He sums up the various ways to mix SwiftUI and AppKit, noting the right approach depends on your app and problem. Recommendations: try **@Observable** to keep model and NSViews in sync; consider SwiftUI when implementing or rewriting a component; add existing gesture recognizer subclasses to SwiftUI views; start new scenes with SwiftUI. All APIs are available on the 2026 releases or earlier, and an app needn't be entirely SwiftUI to benefit."}],"code":[]},"related":[{"id":"269","title":"What’s new in SwiftUI","gloss":"SwiftUI 的新功能","gloss_en":"What's new in SwiftUI","category":"swiftui","categoryLabel":"SwiftUI"},{"id":"271","title":"Code-along: Build powerful drag and drop in SwiftUI","gloss":"程式碼共做：在 SwiftUI 打造強大的拖放功能","gloss_en":"Code-along: Build powerful drag and drop in SwiftUI","category":"swiftui","categoryLabel":"SwiftUI"},{"id":"322","title":"Compose advanced graphics effects with SwiftUI","gloss":"用 SwiftUI 組合進階圖形效果","gloss_en":"Compose advanced graphics effects with SwiftUI","category":"swiftui","categoryLabel":"SwiftUI"},{"id":"8002","title":"SwiftUI for Beginners Group Lab","gloss":"SwiftUI 新手團體實驗室","gloss_en":"SwiftUI for Beginners Group Lab","category":"swiftui","categoryLabel":"SwiftUI"},{"id":"8006","title":"SwiftUI Group Lab","gloss":"SwiftUI 小組實驗室","gloss_en":"SwiftUI Group Lab","category":"swiftui","categoryLabel":"SwiftUI"}]}</script>
