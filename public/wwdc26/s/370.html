<script id="d" type="application/json">{"s":{"id":"370","title":"Elevate your app’s text experience with TextKit","gloss":"用 TextKit 提升 App 的文字體驗","category":"uikit","categoryLabel":"UIKit","duration":1426,"url":"https://developer.apple.com/videos/play/wwdc2026/370/","takeaway":"結合內建文字視圖的便利與 TextKit 的掌控力,用新 API 做出行號、可折疊段落與可重用的文字附件視圖等進階文字體驗。","chapters":[[0,"Introduction"],[189,"TextKit architecture"],[557,"What's new in TextKit"],[587,"NSTextViewportRenderingSurface conformance"],[625,"NSTextViewportRenderingSurfaceKey and NSMapTable"],[687,"Extending framework text views"],[759,"UITextView/NSTextView in SwiftUI via ViewRepresentable"],[778,"Example: Code editor with line numbers"],[813,"ContainerView with TextView and line number view"],[882,"Three NSTextViewportLayoutControllerDelegate overrides"],[959,"startingLineNumber(for:) using enumerateTextElements"],[1022,"DidLayout: convert frames to viewport coordinates"],[1036,"Draw line numbers in ContainerView closure"],[1072,"Example: Collapsible recipe sections"],[1162,"Collapsible sections: full TextView class"],[1196,"Text attachments and view provider reuse"],[1326,"Text attachment view provider reuse policy"],[1380,"Next steps"]],"points":[{"text":"用新 API**結合內建文字視圖的便利與 TextKit 的底層掌控力**,提升 App 的文字體驗。","hot":false},{"text":"新增 **NSTextViewportRenderingSurface** conformance,讓自訂 UIView 直接作為 viewport 的渲染表面(搭配 NSMapTable 快取)。","hot":true},{"text":"可在 SwiftUI 中以 **UIViewRepresentable / NSViewRepresentable** 包裝 UITextView/NSTextView。","hot":false},{"text":"範例:用 **NSTextViewportLayoutControllerDelegate** 的三個 override + enumerateTextElements 算出起始行號,在 ContainerView 畫行號;另示範可折疊段落。","hot":false},{"text":"文字附件可用 **register(_:forTextAttachmentViewProviderType:)** 設定 view provider 的重用策略(如 .onEditingInlineParagraphs)。","hot":false}],"apis":["TextKit","NSTextViewportRenderingSurface","NSTextViewportLayoutController","NSTextViewportLayoutControllerDelegate","NSTextContentStorage","NSTextLayoutFragment","NSTextContentStorageDelegate","UITextView","NSTextView","UIViewRepresentable","NSMapTable"],"audience":"**需要進階文字排版(程式碼編輯器、行號、可折疊段落、自訂附件)、想善用 TextKit 的 UIKit/AppKit 開發者。**","gloss_en":"Elevate your app's text experience with TextKit","takeaway_en":"Combine the convenience of built-in text views with the control of TextKit, using new APIs to build advanced text experiences like line numbers, collapsible paragraphs, and reusable text attachment views.","points_en":[{"text":"Use new APIs to **combine the convenience of built-in text views with the low-level control of TextKit**, elevating your app's text experience.","hot":false},{"text":"Adds **NSTextViewportRenderingSurface** conformance, letting a custom UIView serve directly as the viewport's rendering surface (with NSMapTable caching).","hot":true},{"text":"In SwiftUI, wrap UITextView/NSTextView with **UIViewRepresentable / NSViewRepresentable**.","hot":false},{"text":"Example: use **NSTextViewportLayoutControllerDelegate**'s three overrides plus enumerateTextElements to compute the starting line number and draw line numbers in a ContainerView; also demonstrates collapsible paragraphs.","hot":false},{"text":"For text attachments, use **register(_:forTextAttachmentViewProviderType:)** to set the view provider's reuse policy (such as .onEditingInlineParagraphs).","hot":false}],"audience_en":"**UIKit/AppKit developers who need advanced text layout (code editors, line numbers, collapsible paragraphs, custom attachments) and want to make the most of TextKit.**","summary":["本場由 TextKit 團隊工程師 Tarun Uday 主講,主題是如何結合「內建文字視圖的便利」與「**TextKit** 的掌控力」。**TextKit** 是 Apple 跨平台的次世代文字引擎,SwiftUI、UIKit 與 AppKit 的文字控制項皆以它進行排版與渲染。長久以來,開發者面臨「便利 vs 掌控」的兩難:一條路是使用框架文字視圖(**NSTextView**、**UITextView**、**TextEditor**),可免費獲得文字輸入、選取、無障礙、復原重做、聽寫、行內預測等大量功能,但難以客製繪製方式;另一條路是直接以 TextKit 當引擎、在自有 view 或 layer 上渲染的 custom text view,雖有完全掌控卻得放棄前述所有內建功能。本場目標就是兼得兩者之長。","講者先回顧 **TextKit 的四層架構**:最底層是 **text storage**(封裝所有文字資料,由 NSTextContentStorage 將 attributed string 拆成 NSTextParagraph)、其上是 **layout** 層(NSTextLayoutManager 量測字形並產生不可變的 NSTextLayoutFragment)、再上是 **viewport** 層(追蹤哪些 chunk 可見)、最頂是 **view** 層。storage、layout、viewport 三層跨所有 UI 框架共用。關鍵在於 TextKit 圍繞 **viewport** 組織工作、只渲染使用者看得見的文字,並由 **NSTextViewportLayoutController** 協調 layout manager 與 text view,在每次捲動、編輯或選取時重複此 viewport layout process。","在新 API 方面,2027 版前 TextKit 雖能追蹤 layout fragment,卻無法追蹤它們被繪製到哪些 view。新增的 **NSTextViewportRenderingSurface** 協定代表 viewport 內可繪製的視覺元素(可讓 UIView、NSView 或 CALayer 遵循),搭配 **NSTextViewportRenderingSurfaceKey** 作為跨 viewport layout cycle 唯一識別 surface 的 key(如 NSTextLayoutFragment),可用於在 map table 或 dictionary 中快取 rendering surface。此外,**UITextView 與 NSTextView 現在遵循 NSTextViewportLayoutControllerDelegate**,讓你可以 subclass 並 override delegate 方法來加入自訂行為。","講者以三個範例展示在 UITextView 中擴充的威力:第一個是為 iPad 程式編輯器加上 **行號**,透過 override willLayout、configureRenderingSurfaceFor 與 didLayout 三個 delegate 方法收集每段落 bounds 並換算到 viewport 座標,再用 enumerateTextElements 算出起始行號;第二個是 **可摺疊的食譜段落**,額外遵循 **NSTextContentStorageDelegate** 並以 shouldEnumerate 跳過已摺疊段落的排版;第三個是 **text attachment 的重用**,針對行內動畫在編輯時重啟的問題,以 **register(forTextAttachmentViewProviderType:)** 搭配 **onEditingInlineParagraphs** 與 onScrollingOutOfViewport 兩種重用政策,在編輯與捲動時保留 view provider 與其狀態。最後建議:想要便利又強大就以 UITextView/NSTextView 起步(SwiftUI 用 ViewRepresentable),想要更多掌控則用新的 Rendering Surface API 自建 custom text view。"],"deepdive":[{"t":0,"title":"Introduction","body":"由 TextKit 團隊工程師 **Tarun Uday** 開場,點出 **TextKit** 是 Apple 跨所有平台的次世代文字引擎,也是 SwiftUI、UIKit、AppKit 文字控制項排版與渲染的基礎。講者直指開發者長期反映的「便利 vs 掌控」張力:一條路是用框架文字視圖(**NSTextView**、**UITextView**、**TextEditor**),免費獲得輸入、選取、無障礙、復原重做、聽寫、行內預測等,但客製繪製能力有限;另一條是用 TextKit 當引擎、自行渲染的 custom text view,有完全掌控卻得從零打造量產品質的編輯體驗。本場目標是兼得兩者之長。"},{"t":189,"title":"TextKit architecture","body":"回顧理解 custom text 體驗的關鍵——**TextKit 四層架構**。最底是 **text storage** 層(封裝待渲染的所有文字資料)、其上是 **layout** 層(將文字拆成 chunk)、再上是 **viewport** 層(追蹤哪些 chunk 可見)、最頂是 **view** 層(文字在 app 中出現之處)。storage、layout、viewport 三層跨所有 UI 框架共用,可在任何 view 或類 view 的可繪製元素上渲染文字。講者以渲染長 NSAttributedString 為例逐層說明。"},{"t":557,"title":"What's new in TextKit","body":"在回顧架構後,轉入 2027 版 TextKit 引入的新 API。重點是補足過去的缺口:先前 TextKit 雖能追蹤 layout fragment,卻沒有跨 TextKit 指涉「文字被渲染到的目標 view」的方式,接下來介紹的 rendering surface 系列 API 正是為此而生。"},{"t":587,"title":"NSTextViewportRenderingSurface conformance","body":"介紹新協定 **NSTextViewportRenderingSurface**,代表 viewport 內一個你可繪製的視覺元素,亦即實際渲染 layout fragment 文字的 view,提供共通抽象。你可讓自己的 **UIView、NSView 或 CALayer** 遵循此協定,並在 viewport controller 的 delegate 方法中用它來追蹤 viewport 內有哪些 view 可見。"},{"t":625,"title":"NSTextViewportRenderingSurfaceKey and NSMapTable","body":"說明 rendering surface 的搭檔協定 **NSTextViewportRenderingSurfaceKey**:任何能跨 viewport layout process 週期唯一識別 rendering surface 的 class(如 **NSTextLayoutFragment**)皆可作為 key,因此可用 layout fragment 當 key 在 **NSMapTable** 或 dictionary 中快取 rendering surface。viewport layout process 內部大量使用此 key 對 surface 的映射;可在 layout 過程以 renderingSurfaceFor delegate 方法指派 surface(每次 process 開始時會清除),並在 didLayout 階段以 viewport controller 的 renderingSurfaceFor 方法查詢。"},{"t":687,"title":"Extending framework text views","body":"轉向說明驅動 Apple 預設文字體驗的框架文字視圖如何運作。**UITextView** 與 **NSTextView** 撐起平台上數千個長文體驗,包括 Messages、TextEdit、Notes 與 Journal。接下來將示範如何透過它們的 TextKit hooks 來擴充這些視圖。"},{"t":759,"title":"UITextView/NSTextView in SwiftUI via ViewRepresentable","body":"說明在 SwiftUI app 中,實作長文體驗最方便的是 **TextEditor**,但也可透過 **ViewRepresentable** 納入 UITextView 或 NSTextView。講者建立名為 MyTextView 的 view,以 TextViewRepresentable 填入 body,並依平台條件編譯:macOS 為 **NSViewRepresentable**(於 makeNSView 回傳 NSTextView)、其他平台為 **UIViewRepresentable**(於 makeUIView 回傳 UITextView)。"},{"t":778,"title":"Example: Code editor with line numbers","body":"第一個範例:為 iPad 打造可隨手寫程式的程式編輯器。講者先以 **UITextView** subclass 起步,初始化並把字型設為 **monospacedSystemFont**。但缺少行號就稱不上好的程式編輯體驗,因此下一步要開始建構行號功能。"},{"t":813,"title":"ContainerView with TextView and line number view","body":"建立名為 **ContainerView** 的 view 來同時容納 TextView 與 lineNumberView——前者是 UITextView subclass、後者是顯示行號的 UIView。目標是在 viewport 變動時,重新計算並顯示 viewport 內 layout fragment 對應的 NSTextParagraph 索引,而這需要 text view 在其 viewport controller 完成一次 viewport layout process 時被通知。"},{"t":882,"title":"Three NSTextViewportLayoutControllerDelegate overrides","body":"重點宣布:自 2027 版起,**UITextView 與 NSTextView 現在遵循 NSTextViewportLayoutControllerDelegate**,因此可 subclass 並 override delegate 方法加入自訂行為。講者將 override 三個方法:**willLayout** 做前置設定(清空 lines、計算起始行號)、**configureRenderingSurfaceFor** 擷取待渲染段落的 bounds(以 layoutFragmentFrame),以及 **didLayout** 把累積資訊回傳給 ContainerView 以繪製行號。每個方法都務必先呼叫 super。subclass 並加入 lines 陣列、startingLineNumber 整數與一個 closure 等狀態。"},{"t":959,"title":"startingLineNumber(for:) using enumerateTextElements","body":"示範以獨立函式計算起始行號——即 viewport 開始前所有段落的數量。先做 nil 檢查,取得 textContentManager 並轉型為 **NSTextContentStorage**,再從 documentRange 的起點以 **enumerateTextElements** 列舉元素並遞增 count,直到元素範圍不再小於 viewportRange 的位置為止。講者提到 sample code 會以快取改良,避免每次 layout pass 都重付此成本。"},{"t":1022,"title":"DidLayout: convert frames to viewport coordinates","body":"在 **didLayout** 中,此時已握有 viewport 內每個段落的 bounds,要傳給 ContainerView。觸發 closure 前,需把 fragment frame 從 text container 座標換算為 viewport 座標——做法是減去 **viewportBounds.origin**(以 offsetBy 在 y 軸位移 -origin.y)。接著把起始行號與調整後的 frames 一併傳給 ContainerView。"},{"t":1036,"title":"Draw line numbers in ContainerView closure","body":"回到 **ContainerView** 設定該 closure:對每個 frame,以起始行號加上索引算出實際行號,並用設定好的屬性(monospacedSystemFont、secondaryLabel 顏色)以 NSString 的 draw(at:withAttributes:) 在正確位置繪製行號。執行後即成功為 UITextView 加上行號,只用了寥寥數行程式碼,是打造程式編輯器的良好起點。"},{"t":1072,"title":"Example: Collapsible recipe sections","body":"第二個範例涉及修改多段落的排版:把顯示多份食譜的 UITextView 改成可逐份摺疊、只剩標題。講者沿用上一例的三個 viewport delegate 方法,但在摺疊段落時要避免對其排版。為此讓 TextView 額外遵循 **NSTextContentStorageDelegate**,以取得 **textContentManager:shouldEnumerate** 方法來標記 textElement 是否摺疊。"},{"t":1162,"title":"Collapsible sections: full TextView class","body":"展示完整 TextView class:除三個 viewport delegate override 外,以一個 **Set\u003cInt>**(collapsedSections)記錄段落 offset 來唯一識別各段落,並加入處理使用者點按切換的 **toggleSection** 方法。摺疊時於 **shouldEnumerate** 跳過排版,切換後則透過 viewport controller 的 delegate 呼叫 **textViewportLayoutControllerReceivedSetNeedsLayout** 觸發重新排版。NSTextContentManager 是 NSTextContentStorage 的抽象版、NSTextElement 是 NSTextParagraph 的抽象版。最終可在 UITextView 中點三角形圖示把食譜摺疊成單一標題。"},{"t":1196,"title":"Text attachments and view provider reuse","body":"退一步說明文字視圖顯示的不只是文字——還有 Messages 的行內照片與貼圖、Notes 的塗鴉與掃描,這些非文字內容稱為 **text attachment**,遵循與一般文字相同的架構。attachment 如同一般字元般存於 text storage(以 **NSTextAttachment** 物件),layout manager 遇到它時會索取對應的 **NSTextAttachmentViewProvider** 來渲染。問題在於這些物件不可變:編輯段落時所有實例都得丟棄重建,導致行內動畫在每次編輯時重啟。"},{"t":1326,"title":"Text attachment view provider reuse policy","body":"為解決動畫重啟問題,在 UITextView 新增 API:初始化後以 **register(forTextAttachmentViewProviderType:)** 為特定 NSTextAttachmentViewProvider 子類別註冊重用政策。第一個引數傳入 **onEditingInlineParagraphs** 政策,可在段落編輯時保留 view provider,讓按鍵不致拆除 provider;第二個引數提供 view provider 子類別型別。sample code 另展示 **onScrollingOutOfViewport** 政策(attachment 捲出畫面時快取其 rendering surface、回到畫面時還原),兩種政策可視情境組合。如此編輯時 UITextView 會重用 view provider、維持狀態、避免動畫閃爍。"},{"t":1380,"title":"Next steps","body":"總結三個 UITextView 中使用 TextKit 的範例:程式編輯器的行號、食譜 app 的可摺疊段落,以及簡單文字視圖的行內 attachment 重用。建議想要便利又強大的富文字編輯體驗者,在 UIKit 以 **UITextView**、AppKit 以 **NSTextView** 起步,SwiftUI 則用 **ViewRepresentable** 納入;想要更多渲染掌控者,則以 TextKit 自建 custom text view 並善用新的 **Rendering Surface** API。並可下載 sample app 參考細節。"}],"summary_en":["Presented by Tarun Uday, an engineer on the TextKit team, this session is about combining the convenience of built-in text views with the control of **TextKit**. **TextKit** is Apple's next-generation text engine, the foundation of text layout and rendering across all platforms, used internally by SwiftUI, UIKit, and AppKit text controls. Developers have long faced a tension between convenience and control: one path is using a framework text view (**NSTextView**, **UITextView**, **TextEditor**), which gives text input, selection, accessibility, undo/redo, dictation, inline predictions, and more for free but limits how text is drawn; the other path is a custom text view using TextKit as the engine and rendering into your own view or layer, which gives total control but gives up all those built-in features. This session aims to get the best of both worlds.","The presenter first recaps **TextKit's four-layer architecture**: at the base is **text storage** (encapsulating all text data, with NSTextContentStorage breaking an attributed string into NSTextParagraph objects), above it the **layout** layer (NSTextLayoutManager measuring glyphs and producing immutable NSTextLayoutFragment objects), then the **viewport** layer (tracking which chunks are visible), and at the top the **view** layer. The storage, layout, and viewport layers are shared across all UI frameworks. Crucially, TextKit organizes its work around the **viewport**, rendering only the text the user can see, with the **NSTextViewportLayoutController** coordinating the layout manager and text view through a viewport layout process that repeats on every scroll, edit, or selection.","On new APIs, before the 2027 releases TextKit could track layout fragments but not the views they were drawn into. The new **NSTextViewportRenderingSurface** protocol represents a drawable visual element inside the viewport (which UIView, NSView, or CALayer can conform to), paired with **NSTextViewportRenderingSurfaceKey** as a key that uniquely identifies a surface across viewport layout cycles (like NSTextLayoutFragment), enabling rendering surfaces to be cached in a map table or dictionary. Additionally, **UITextView and NSTextView now conform to NSTextViewportLayoutControllerDelegate**, so you can subclass them and override delegate methods to add custom behavior.","The presenter shows three examples of extending UITextView: first, adding **line numbers** to an iPad code editor by overriding the willLayout, configureRenderingSurfaceFor, and didLayout delegate methods to collect each paragraph's bounds and convert them to viewport coordinates, using enumerateTextElements to compute the starting line number; second, **collapsible recipe sections** by additionally conforming to **NSTextContentStorageDelegate** and using shouldEnumerate to skip layout on collapsed paragraphs; third, **text attachment reuse**, solving inline animations restarting on edit by using **register(forTextAttachmentViewProviderType:)** with the **onEditingInlineParagraphs** and onScrollingOutOfViewport reuse policies to preserve view providers and their state across edits and scrolling. The closing advice: for a convenient yet powerful experience start with UITextView/NSTextView (or a ViewRepresentable in SwiftUI), and for more control build a custom text view with the new Rendering Surface APIs."],"deepdive_en":[{"t":0,"title":"Introduction","body":"Engineer **Tarun Uday** from the TextKit team opens by noting **TextKit** is Apple's next-generation text engine across all platforms and the foundation of layout and rendering for SwiftUI, UIKit, and AppKit text controls. He names the long-standing tension between convenience and control: one path uses a framework text view (**NSTextView**, **UITextView**, **TextEditor**) for free input, selection, accessibility, undo/redo, dictation, and inline predictions but with limited drawing customization; the other builds a custom text view with TextKit as the engine for total control but must build a production-quality editing experience from scratch. The session aims to get the best of both."},{"t":189,"title":"TextKit architecture","body":"Recaps the key to a great custom text experience — **TextKit's four-layer architecture**. At the base is the **text storage** layer (encapsulating all text data to render), above it the **layout** layer (breaking text into chunks), then the **viewport** layer (tracking which chunks are visible), and at the top the **view** layer (where text appears in your app). The storage, layout, and viewport layers are shared across all UI frameworks, letting you render text on any view or view-like drawable element. The presenter walks through each layer using the example of rendering a long NSAttributedString."},{"t":557,"title":"What's new in TextKit","body":"After recapping the architecture, the talk turns to the new APIs introduced in the 2027 TextKit. The key gap being filled: previously TextKit could track layout fragments but had no way to refer to the destination views where text is rendered across TextKit. The rendering surface APIs introduced next exist precisely to address this."},{"t":587,"title":"NSTextViewportRenderingSurface conformance","body":"Introduces the new **NSTextViewportRenderingSurface** protocol, representing a visual element inside the viewport you can draw into — the view that actually renders a layout fragment's text — providing a common abstraction. You can conform your **UIView, NSView, or CALayer** to it and use it in the viewport controller's delegate methods to track which views are visible in the viewport."},{"t":625,"title":"NSTextViewportRenderingSurfaceKey and NSMapTable","body":"Explains the companion **NSTextViewportRenderingSurfaceKey** protocol: any class that can uniquely identify a rendering surface across viewport layout process cycles (like **NSTextLayoutFragment**) can serve as a key, so you can use a layout fragment as a key to cache rendering surfaces in an **NSMapTable** or dictionary. The viewport layout process uses this key-to-surface mapping extensively internally; you can assign a surface during layout via the renderingSurfaceFor delegate method (cleared at the start of each process) and query it during didLayout via the viewport controller's renderingSurfaceFor method."},{"t":687,"title":"Extending framework text views","body":"Turns to how the framework text views powering Apple's default text experiences work. **UITextView** and **NSTextView** power thousands of long-form text experiences on Apple's platforms, including Messages, TextEdit, Notes, and Journal. The talk will next demonstrate how to extend these views through their TextKit hooks."},{"t":759,"title":"UITextView/NSTextView in SwiftUI via ViewRepresentable","body":"Explains that in a SwiftUI app the most convenient long-form text experience is **TextEditor**, but you can also include a UITextView or NSTextView via a **ViewRepresentable**. The presenter creates a view called MyTextView, populating its body with a TextViewRepresentable that conditionally compiles as an **NSViewRepresentable** on macOS (returning NSTextView in makeNSView) and a **UIViewRepresentable** otherwise (returning UITextView in makeUIView)."},{"t":778,"title":"Example: Code editor with line numbers","body":"First example: building an iPad code editor for quick coding away from the Mac. The presenter starts with a **UITextView** subclass, initializing it and setting its font to the **monospacedSystemFont**. But without line numbers it isn't a great code editor experience, so the next step is to start building line number support."},{"t":813,"title":"ContainerView with TextView and line number view","body":"Creates a view called **ContainerView** to hold both the TextView and a lineNumberView — the former a UITextView subclass, the latter a UIView for displaying line numbers. The goal is to recompute and show the NSTextParagraph index for the layout fragments in the viewport whenever the viewport changes, which requires the text view to be notified whenever its viewport controller completes a viewport layout process."},{"t":882,"title":"Three NSTextViewportLayoutControllerDelegate overrides","body":"Announces the key change: starting with the 2027 releases, **UITextView and NSTextView now conform to NSTextViewportLayoutControllerDelegate**, so you can subclass them and override the delegate methods to add custom behavior. The presenter overrides three methods: **willLayout** for setup (clearing lines and computing the starting line number), **configureRenderingSurfaceFor** to capture the bounds of paragraphs to be rendered (via layoutFragmentFrame), and **didLayout** to share accumulated info back to the ContainerView for drawing line numbers. Each must call super first. The subclass adds state: a lines array, a startingLineNumber integer, and a closure."},{"t":959,"title":"startingLineNumber(for:) using enumerateTextElements","body":"Demonstrates computing the starting line number in its own function — essentially a count of all paragraphs before the viewport starts. After nil checks, it gets the textContentManager cast to **NSTextContentStorage**, then enumerates elements from the documentRange location via **enumerateTextElements**, incrementing the count until an element's range is no longer ordered before the viewportRange location. The presenter notes the sample code improves this with caching so you don't pay this cost on every layout pass."},{"t":1022,"title":"DidLayout: convert frames to viewport coordinates","body":"In **didLayout**, with the bounds of every paragraph in the viewport now in hand, the info is passed to the ContainerView. Before firing the closure, the fragment frames must be converted from text container coordinates to viewport coordinates — done by subtracting the **viewportBounds.origin** (offsetting by -origin.y). Then the starting line number and adjusted frames are passed to the ContainerView."},{"t":1036,"title":"Draw line numbers in ContainerView closure","body":"Back in the **ContainerView**, the closure is set: for each frame, the actual line number is computed by adding the index to the starting line number, then drawn at the right position using configured attributes (monospacedSystemFont, secondaryLabel color) via NSString's draw(at:withAttributes:). Running the app successfully adds line numbers to a UITextView with just a few lines of code — a great first step toward building a code editor."},{"t":1072,"title":"Example: Collapsible recipe sections","body":"The second example involves modifying layout across multiple paragraphs: turning a UITextView showing several recipes into one that collapses each into just its heading. The presenter reuses the three viewport delegate methods from the last example but adds the goal of avoiding layout on collapsed paragraphs. To do this, the TextView additionally conforms to **NSTextContentStorageDelegate** to gain the **textContentManager:shouldEnumerate** method for marking text elements as collapsed or not."},{"t":1162,"title":"Collapsible sections: full TextView class","body":"Shows the full TextView class: beyond the three viewport delegate overrides, it uses a **Set\u003cInt>** (collapsedSections) of paragraph offsets to uniquely identify each paragraph and adds a **toggleSection** method to handle user taps. Layout is skipped in **shouldEnumerate** for collapsed paragraphs, and after toggling, relayout is triggered via the viewport controller's delegate calling **textViewportLayoutControllerReceivedSetNeedsLayout**. NSTextContentManager is the abstract version of NSTextContentStorage, and NSTextElement of NSTextParagraph. The result lets you tap a triangle to collapse any recipe into just its heading, right in UITextView."},{"t":1196,"title":"Text attachments and view provider reuse","body":"Steps back to note text views display much more than text — Messages' inline photos and stickers, Notes' drawings and scans — non-text content called **text attachments** that follow the same architecture as regular text. An attachment is stored in text storage like any character (as an **NSTextAttachment** object), and when the layout manager encounters it, it asks for the corresponding **NSTextAttachmentViewProvider** to render it. The challenge: because these objects are immutable, editing a paragraph discards and recreates all instances, causing inline animations to restart on every edit."},{"t":1326,"title":"Text attachment view provider reuse policy","body":"To solve the animation restart, a new API is added on UITextView: after initialization, **register(forTextAttachmentViewProviderType:)** registers a reuse policy for a particular NSTextAttachmentViewProvider subclass. The first argument takes the **onEditingInlineParagraphs** policy, preserving the view provider across paragraph edits so keystrokes don't tear it down; the second provides the view provider subclass type. The sample code shows a second policy, **onScrollingOutOfViewport** (caching the attachment's rendering surface when it scrolls off screen and restoring it on return), and the two can be combined. Now on editing, UITextView reuses the view provider, maintaining state and avoiding animation glitches."},{"t":1380,"title":"Next steps","body":"Recaps the three examples of using TextKit in UITextView: line numbers for a code editor, collapsible sections in a recipe app, and inline text attachment reuse in a simple text view. The advice: for a convenient but powerful rich text editor experience, start with **UITextView** on UIKit and **NSTextView** on AppKit, and use a **ViewRepresentable** to include these in a SwiftUI app; for those wanting much more control over rendering, build custom text views with TextKit and the new **Rendering Surface** APIs. A sample app is available to explore the details."}],"code":[]},"related":[{"id":"203","title":"Read between the strokes with PencilKit","gloss":"用 PencilKit 解讀筆跡內容","gloss_en":"Read handwriting content with PencilKit","category":"uikit","categoryLabel":"UIKit"},{"id":"212","title":"Rev up your CarPlay app","gloss":"強化你的 CarPlay App","gloss_en":"Rev up your CarPlay app","category":"uikit","categoryLabel":"UIKit"},{"id":"219","title":"Enhance the accessibility of your reading app","gloss":"強化你閱讀類 App 的無障礙體驗","gloss_en":"Enhance the accessibility of your reading app","category":"uikit","categoryLabel":"UIKit"},{"id":"221","title":"Prepare your tvOS apps for Dynamic Type","gloss":"讓你的 tvOS App 支援動態字型","gloss_en":"Prepare your tvOS app for Dynamic Type","category":"uikit","categoryLabel":"UIKit"},{"id":"226","title":"Create live communication experiences","gloss":"打造即時通訊體驗","gloss_en":"Build live communication experiences","category":"uikit","categoryLabel":"UIKit"}]}</script>
