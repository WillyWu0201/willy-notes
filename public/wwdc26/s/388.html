<script id="d" type="application/json">{"s":{"id":"388","title":"Find and fix performance issues in your Metal games","gloss":"找出並修復 Metal 遊戲的效能問題","category":"graphics","categoryLabel":"圖形與遊戲","duration":1261,"url":"https://developer.apple.com/videos/play/wwdc2026/388/","takeaway":"用 metalperftrace 收集與分析 Metal 效能追蹤，搭配 StateReporting 將指標對應到遊戲狀態，並以 MetricKit 蒐集實機現場資料，精準定位效能瓶頸。","chapters":[[0,"Introduction"],[111,"Metal performance metrics"],[212,"Trace collection"],[300,"Collect a trace with metalperftrace"],[398,"Analyze performance traces"],[422,"Print a trace overview"],[478,"Filter by process and emit JSON"],[608,"Contextualize with StateReporting"],[835,"Include full state transitions in overview"],[855,"Aggregate metrics by state"],[1068,"Collect field data with MetricKit"],[1181,"Next steps"]],"points":[{"text":"用命令列工具 **metalperftrace** 收集效能追蹤，可指定最近時段或明確時間範圍。","hot":true},{"text":"以 **overview** 檢視 FPS、Frame Time、On-GPU Time 等指標，並可依 process 過濾與輸出 JSON。","hot":false},{"text":"透過 **StateReporting** 的 **SRStateReporter** 回報狀態轉換與中繼資料，把效能指標對應到遊戲情境（如關卡、畫質）。","hot":false},{"text":"用 **--include-state-transitions** 與 **--aggregate** 依狀態彙總指標，找出哪些情境最耗效能。","hot":false},{"text":"搭配 **MetricKit** 蒐集使用者實機的現場效能資料，補足實驗室外的真實表現。","hot":false}],"apis":["Metal","metalperftrace","StateReporting","SRStateReporter","MetricKit"],"audience":"適合**開發 Metal 遊戲、需要診斷與優化 GPU 與整體效能的遊戲與圖形開發者**。","gloss_en":"Find and fix performance issues in your Metal games","takeaway_en":"Use metalperftrace to collect and analyze Metal performance traces, pair it with StateReporting to map metrics to game state, and gather on-device field data with MetricKit to pinpoint performance bottlenecks.","points_en":[{"text":"Collect performance traces with the command-line tool **metalperftrace**, targeting either a recent window or an explicit time range.","hot":true},{"text":"Use **overview** to inspect metrics like FPS, Frame Time, and On-GPU Time, with the ability to filter by process and output JSON.","hot":false},{"text":"Report state transitions and metadata via **StateReporting**'s **SRStateReporter** to map performance metrics to game context (such as level or quality settings).","hot":false},{"text":"Use **--include-state-transitions** and **--aggregate** to summarize metrics by state and find which contexts cost the most performance.","hot":false},{"text":"Pair with **MetricKit** to gather real on-device field performance data, filling in the gaps beyond the lab.","hot":false}],"audience_en":"**Game and graphics developers building Metal games who need to diagnose and optimize GPU and overall performance.**","summary":["本場由 Metal Tools 團隊主講，目標是幫你在**長時間遊戲 session** 中快速蒐集並定位效能問題，交付一致而流暢的幀率。打磨流暢體驗是個循環：在各種裝置與形態上實測、蒐集效能資料、分析、找出問題、修復，再重來。玩家連玩數小時時諸多條件會變（裝置升溫導致 thermal state 變化、調整畫質設定、在不同關卡與戰鬥間移動），因此必須跨多種情境長時間量測。講者依序介紹可用的 **Metal performance metrics**、蒐集與分析長時間 trace 的新工具、用 **StateReporting** 為 trace 加上脈絡，以及出貨後用 **MetricKit** 蒐集現場資料。","**Metric** 方面，Metal Tools 提供 FPS、GPU time、frame interval 等時序指標，以及 layer sizes、composition mode、MetalFX 等顯示相關指標。**Metal Performance HUD** 能在遊戲畫面上即時疊加顯示這些指標、可自訂或選 preset，但無法長時間儲存。要拿到細節就得蒐集長時間 **trace**：桌上實測可用 Instruments 的 **Game Performance Overview** 範本（擷取彙總的 Metal 指標與 Time Profiler CPU 取樣）。更強的是——系統其實**一直在背景記錄**並保存 Metal 效能與資源使用指標達數日，因此長 session 結束後仍能**回溯（look-back）蒐集**。macOS 用新 CLI 工具 **`metalperftrace collect --last`**（如近 5 小時）或指定起訖時間；iOS 需一次性在開發者設定啟用 Performance Trace、設定回溯時長、並把 Performance Trace 按鈕加到控制中心，玩完一按即蒐集，完成後可傳到 Mac 分析。","**分析** trace：macOS 可用 `metalperftrace overview` 印出（或 `--json` 輸出）每個 process 的資源使用統計與各 layer 的 Metal 指標（如平均記憶體約 2.1GB、平均 FPS 約 60，及 frame/GPU time 的統計值），JSON 適合餵 regression 腳本或 AI agent 自動分流；也可用 Instruments 在時間軸上視覺化，偏離過多的數值會以顏色標示，可框選時間範圍即時彙總（範例某段平均 FPS 掉到 26、GPU 使用率很低）。但光看平均 FPS 缺乏可行動的**脈絡**——不知掉幀那刻遊戲在做什麼。","解法是新 API **StateReporting**，用四個概念描述遊戲隨時間的狀態：**domain**（代表某功能領域的有限狀態機，如 level、graphics、network），各 domain 同時只處於一個 **state**（含 label、不可變的 stable metadata、可變的 volatile metadata），玩家進度推進時在 state 間 transition。把多個 domain 疊到時間軸上，就能立即看出 FPS 下降對應的脈絡（例如畫質切到 High 時平均 FPS 只剩約 24）。API 支援 Swift 與 Objective-C，用 `reportTransition`（帶 label 與 stableMetadata）回報狀態、`reportVolatileMetadataUpdate` 更新動態值，並與 HUD、metalperftrace（`--include-state-transitions`、可依 state 彙總指標）、Instruments（在 Points of Interest 為每個 domain 建 track）緊密整合。最佳實務：domain 彼此正交、勿在單一 domain 塞太多維度、transition 頻率勿過高（過高會被系統節流）、並用工具確認狀態正確。出貨後則靠 **MetricKit**——它每日把含 Metal 幀率（且可依 StateReporting 狀態分組）的效能與電力 metrics、以及記憶體例外等 diagnostics 送回遊戲 process，讓你在現場持續監控並定位問題。"],"deepdive":[{"t":0,"title":"Introduction","body":"Metal Tools 團隊工程師 Ruiwei 開場：流暢一致的幀率是給玩家最重要的體驗之一，而維持整段 session 的流暢是關鍵。打磨流暢是個循環——跨多裝置與形態實測、蒐集資料、分析、找問題、修復、再來。玩家連玩數小時時 thermal state、畫質設定、關卡與戰鬥都會變，故須跨多情境長時間量測。預告將依序講 Metal 指標、長時間 trace 的蒐集與分析、用 StateReporting 加脈絡、以及出貨後用 MetricKit 蒐集現場資料。"},{"t":111,"title":"Metal performance metrics","body":"介紹 Metal Tools 提供的各類指標作為比較不同 session 的基準：時序類如 frames per second、GPU time、frame interval 反映幀的節奏與 GPU 利用率；顯示相關如 layer sizes、composition mode、MetalFX 指標則用來確認顯示設定正確。**Metal Performance HUD** 能在遊戲內容上疊加顯示 FPS、記憶體、frame interval 等，可在設定面板逐項開關或選 preset，適合開發中快速掌握。"},{"t":212,"title":"Trace collection","body":"指出 HUD 雖好但無法長時間儲存指標，容易忘記掉幀發生在哪裡，要拿細節就得蒐集長時間 **trace**。桌上實測可用 Instruments 的 **Game Performance Overview** 範本：擷取彙總的 Metal 效能指標與 Time Profiler CPU 取樣，可從 Instruments 啟動遊戲或附加到已執行的 session，按錄製即可，適合數分鐘以上的 session。"},{"t":300,"title":"Collect a trace with metalperftrace","body":"揭示更強大之處：遊戲執行時系統**一直在記錄並保存** Metal 效能與資源使用指標（彙總與選用的 per-frame，如 CPU、GPU、FPS、Memory）達數日，因此長 session 結束後仍能**回溯蒐集**。macOS 用新 CLI 工具 `metalperftrace collect` 並傳 `--last`（如近 5 小時）或指定起訖時間，無需額外設定。"},{"t":398,"title":"Analyze performance traces","body":"蒐集完進入分析：macOS 可用 `metalperftrace` 印出或匯出指標概觀，或在 Instruments 中視覺化探索。兩者皆會示範。"},{"t":422,"title":"Print a trace overview","body":"用 `metalperftrace overview` 加 trace 檔印出整體效能：報告對每個 process 分兩段——資源使用統計（記憶體、CPU time、disk activity）與各 layer 的 Metal 指標。範例該 session 平均記憶體約 2.1GB、平均 FPS 約 60，並含 frame time 與 on-GPU time 的統計值，快速給出整體概況。"},{"t":478,"title":"Filter by process and emit JSON","body":"若 trace 含多個遊戲 session 或 Metal app，可用 predicate 只印出指定 process 的資料；亦可加 `--json` 讓 metalperftrace 輸出結構化格式，方便餵入 regression 測試腳本或 AI agent 自動分流潛在效能問題。Instruments 也能開啟並視覺化 trace 做更深入分析：資料畫在時間軸上、偏離過多者以不同顏色標示（如某段 FPS 掉幀標為黃色），詳情視圖顯示各指標的 min／max／平均／標準差，可框選時間範圍即時更新（範例該段平均 FPS 掉到 26、GPU 使用率很低）。"},{"t":608,"title":"Contextualize with StateReporting","body":"點出挑戰：知道掉幀約在第 12 分鐘，卻不知那時遊戲在做什麼——光看平均 FPS 缺乏可行動脈絡。為此引入新 API **StateReporting**，用四個核心概念描述遊戲隨時間的行為與狀態：**domain**（代表某功能領域的有限狀態機，如追蹤玩家進度的 level domain），各 domain 同時只處於一個 **state**（以 label 起始，可含不可變的 **stable metadata** 與會變的 **volatile metadata**），玩家推進時在 state 間 transition。可定義多個 domain（level、graphics、network），疊到時間軸後即能立即看出需改進處。並給出 Swift／Objective-C 範例：建立 domain（反向 DNS 字串）、取得 reporter，用 `reportTransition`（帶 label 與選用 stableMetadata）回報狀態，用 `reportVolatileMetadataUpdate` 在不轉換狀態下更新動態值。"},{"t":835,"title":"Include full state transitions in overview","body":"StateReporting 與所有工具緊密整合。在 **Metal Performance HUD**，state domain 清單會出現在指標設定分頁，啟用後疊加層會顯示 label、stable 與 volatile metadata（範例回報 level 狀態：biome 與 id 為 stable、玩家位置為每秒一次的 volatile），是檢查 StateReporting 採用最直接的方式。在 `metalperftrace` 印 overview 時，報告會列出 domain、transition 數與最後已知狀態；加 `--include-state-transitions` 則印出含起訖時間戳的完整狀態清單。"},{"t":855,"title":"Aggregate metrics by state","body":"metalperftrace 還能**依狀態自動彙總指標**：可對所有 domain 與 transition、特定 domain 的所有 transition、或某 domain 內特定 state label 彙總。例如想看畫質設為 High 時的平均 FPS，就請它彙總 graphics domain 的「High」label——報告顯示該狀態的詳情、作用時長與其他 domain 的重疊狀態（範例 High 時平均 FPS 僅約 24）。要更視覺化可在 Instruments 開啟：每個 domain 會在 Points of Interest 各成一條 track，繪出 state transition 與 volatile 更新，可選個別狀態檢視 metadata，結合 Metal 指標即可確認幀率隨畫質切到 High 而開始下降。"},{"t":1068,"title":"Collect field data with MetricKit","body":"工具不止於上市前。**MetricKit** 提供 metrics 與 diagnostics 兩類資料，讓遊戲在 process 內直接取得電力與效能報告：玩家遊玩時於背景持續蒐集、每日交付一份報告。macOS／iOS 27 起 MetricKit 揭露 Metal 幀率（及大量其他效能與電力指標），並可**依 StateReporting 狀態分組**幀率（範例報告含整體平均幀率，並依 level domain 各狀態細分）。這些資料送到遊戲 process 可做本機分析、或打包做離線彙總，以在現場監控效能、找出可調查修復的問題。MetricKit 也提供 diagnostics（如記憶體例外）幫你定位是哪段程式造成問題。"},{"t":1181,"title":"Next steps","body":"收尾回顧：iOS／macOS 27 中 Metal 效能指標一直被系統記錄，可回溯蒐集橫跨數小時數日的指標，並用 metalperftrace 與 Instruments 分析；新 **StateReporting** API 可為 trace 加脈絡，出貨後 **MetricKit** 從玩家裝置送回 metrics 與 diagnostics。並列出採用 StateReporting 的最佳實務：先審慎設計 domain 與 state（各 domain 應彼此正交、勿在單一 domain 塞太多維度）、勿有過多 transition（StateReporting 為長期脈絡而設、非高頻狀態變化，過高會被系統節流而丟失資訊）、並用 HUD 與 Instruments 確認狀態正確。建議從設計遊戲中最重要的 domain（level、graphics、network）開始回報，並整合 MetricKit 蒐集每日報告。"}],"summary_en":["Presented by the Metal Tools team, this session helps you quickly collect and pinpoint performance issues across **long game sessions** to deliver a consistent, smooth frame rate. Polishing smoothness is a cycle: play-test on many devices and form factors, collect performance data, analyze, identify issues, fix, and repeat. Over hours of play many conditions change (the device heats up and thermal state shifts, players adjust graphics settings, they move between levels and fights), so you must measure across many scenarios over long periods. The talk covers the available **Metal performance metrics**, new tools for collecting and analyzing long traces, **StateReporting** to contextualize traces, and **MetricKit** for collecting field data after shipping.","On **metrics**, Metal Tools provides timing metrics like FPS, GPU time, and frame interval, plus display-related ones like layer sizes, composition mode, and MetalFX. The **Metal Performance HUD** overlays these live on the game, customizable or via presets, but can't store them over long durations. For detail you need long **traces**: at the desk, use Instruments' **Game Performance Overview** template (aggregated Metal metrics plus Time Profiler CPU samples). More powerfully, the system is **always recording** and saving Metal performance and resource metrics for days, so you can **look back and collect** after a long session ends. On macOS, use the new CLI tool **`metalperftrace collect --last`** (e.g., the last 5 hours) or an explicit time range; on iOS, a one-time setup enables Performance Trace in developer settings, sets the look-back duration, and adds the Performance Trace button to Control Center—tap after playing to collect, then transfer to a Mac.","To **analyze** a trace, macOS can `metalperftrace overview` to print (or `--json` to emit) per-process resource-usage stats and per-layer Metal metrics (e.g., average memory ~2.1GB, average FPS ~60, plus stats for frame and GPU time), with JSON ideal for feeding regression scripts or AI agents for auto-triage. Or open it in Instruments for a timeline visualization where deviating values are color-highlighted and you can select a range for live aggregation (one stretch averaged 26 FPS with very low GPU usage). But average FPS alone lacks actionable **context**—you don't know what the game was doing when the drop happened.","The fix is the new **StateReporting** API, describing the game's state over time with four concepts: a **domain** (a finite state machine for an area of functionality, like level, graphics, network), each in one **state** at a time (with a label, immutable stable metadata, and mutable volatile metadata), transitioning between states as the player progresses. Overlaying multiple domains on the timeline immediately reveals the context of an FPS drop (e.g., average FPS of only ~24 when graphics is High). The API supports Swift and Objective-C, using `reportTransition` (with label and stableMetadata) and `reportVolatileMetadataUpdate`, and integrates tightly with the HUD, metalperftrace (`--include-state-transitions`, aggregate metrics by state), and Instruments (a track per domain in Points of Interest). Best practices: keep domains orthogonal, don't pack too many dimensions into one domain, don't transition too frequently (the system throttles excessive rates), and verify states with the tools. After shipping, **MetricKit** delivers daily performance and power metrics (Metal frame rate, grouped by StateReporting state) plus diagnostics like memory exceptions to your game process for ongoing field monitoring and triage."],"deepdive_en":[{"t":0,"title":"Introduction","body":"Metal Tools engineer Ruiwei opens: a smooth, consistent frame rate is one of the most important things for players, and maintaining it across a whole session is key. Polishing smoothness is a cycle—play-test across devices and form factors, collect data, analyze, identify issues, fix, repeat. Over hours of play, thermal state, graphics settings, and levels/fights all change, so you must measure across scenarios over long periods. He previews covering Metal metrics, collecting and analyzing long traces, adding context with StateReporting, and collecting field data with MetricKit after shipping."},{"t":111,"title":"Metal performance metrics","body":"Introduces Metal Tools metrics as a baseline for comparing sessions: timing metrics like frames per second, GPU time, and frame interval reflect frame pacing and GPU utilization; display-related ones like layer sizes, composition mode, and MetalFX metrics confirm display settings are correct. The **Metal Performance HUD** overlays FPS, memory, and frame interval on game content, with a config panel to toggle each metric or pick a preset—great for a quick read during development."},{"t":212,"title":"Trace collection","body":"Notes the HUD can't store metrics over long durations and it's easy to forget where drops happened, so you need long **traces** for detail. At the desk, use Instruments' **Game Performance Overview** template: it captures aggregated Metal metrics and Time Profiler CPU samples, can start the game from Instruments or attach to a running session, and records on a click—ideal for sessions of minutes or longer."},{"t":300,"title":"Collect a trace with metalperftrace","body":"Reveals the powerful part: while the game runs, the system is **always recording and saving** Metal performance and resource metrics (aggregated and optional per-frame, like CPU, GPU, FPS, Memory) for days, so you can **look back and collect** after a long session ends. On macOS, the new CLI tool `metalperftrace collect` with `--last` (e.g., the last 5 hours) or an explicit start/end range does this with no extra configuration."},{"t":398,"title":"Analyze performance traces","body":"After collecting, on to analysis: on macOS you can print or export an overview of metrics with `metalperftrace`, or open traces in Instruments to explore visually. Both are demonstrated."},{"t":422,"title":"Print a trace overview","body":"Run `metalperftrace overview` with a trace file to print overall performance: per process the report has two sections—resource-usage stats (memory, CPU time, disk activity) and per-layer Metal metrics. In the example, average memory is ~2.1GB and average FPS ~60, with statistical values for frame time and on-GPU time, giving a quick overall picture."},{"t":478,"title":"Filter by process and emit JSON","body":"If a trace has multiple sessions or Metal apps, a predicate prints data for a specific process; `--json` emits structured output ideal for regression scripts or AI agents to auto-triage issues. Instruments can also open and visualize traces for deeper analysis: data is plotted on a timeline with deviating values color-highlighted (e.g., an FPS drop marked yellow), the detail view shows min/max/average/standard deviation per metric, and selecting a range updates the aggregation live (one stretch averaged 26 FPS with very low GPU usage)."},{"t":608,"title":"Contextualize with StateReporting","body":"Highlights the challenge: knowing the drop happened around the 12-minute mark but not what the game was doing—average FPS lacks actionable context. Introduces the new **StateReporting** API with four core concepts: a **domain** (a finite state machine for an area of functionality, like a level domain tracking player progress), each in one **state** at a time (starting with a label, with optional immutable **stable metadata** and mutable **volatile metadata**), transitioning between states as the player progresses. You can define multiple domains (level, graphics, network) and overlay them to immediately spot areas to improve. The Swift/Objective-C example creates a domain (reverse-DNS string), gets a reporter, reports state with `reportTransition` (label plus optional stableMetadata), and updates dynamic values with `reportVolatileMetadataUpdate` without transitioning."},{"t":835,"title":"Include full state transitions in overview","body":"StateReporting integrates tightly with all tools. In the **Metal Performance HUD**, the list of state domains appears in the metrics config tab, and enabling them shows the label and stable/volatile metadata (the example reports level state with biome and id as stable and player position as volatile updated once per second)—the most direct way to check adoption. In `metalperftrace` overview, the report lists domains, transition counts, and the last known state; `--include-state-transitions` prints the full list with start/end timestamps."},{"t":855,"title":"Aggregate metrics by state","body":"metalperftrace can also **aggregate metrics by state automatically**: across all domains and transitions, all transitions for a specific domain, or a specific state label within a domain. For example, to see average FPS when graphics is High, aggregate the 'High' label of the graphics domain—the report shows state details, how long it was active, and overlapping states in other domains (average FPS only ~24 when High). For a visual look, open the trace in Instruments: each domain becomes a track in Points of Interest graphing transitions and volatile updates, with selectable states showing metadata, and combined with Metal metrics it confirms the frame rate started dropping as graphics changed to High."},{"t":1068,"title":"Collect field data with MetricKit","body":"The tools don't stop at launch. **MetricKit** provides metrics and diagnostics, giving the game in-process access to power and performance reports: it collects in the background as players play and delivers a daily report. In macOS/iOS 27, MetricKit exposes Metal frame rate (plus many other performance and power metrics) and can **group frame rate by StateReporting state** (the example report has overall average frame rate broken down by states in the level domain). These can be analyzed locally or packaged for off-device aggregation to monitor field performance and find issues; MetricKit also provides diagnostics (like memory exceptions) to identify which code path caused a problem."},{"t":1181,"title":"Next steps","body":"Recaps: in iOS/macOS 27 Metal performance metrics are always recorded by the system, so you can look back and collect metrics spanning hours and days and analyze with metalperftrace and Instruments; the new **StateReporting** API adds context, and after shipping **MetricKit** sends back metrics and diagnostics from player devices. It lists StateReporting best practices: carefully design orthogonal domains and states (don't pack too many dimensions into one), don't have too many transitions (it's for long-term context, not high-frequency changes—the system throttles excessive rates and loses information), and verify states with the HUD and Instruments. Start by reporting the domains that matter most (level, graphics, network) and integrate MetricKit for daily reports."}],"code":[]},"related":[{"id":"222","title":"Meet the new MetricKit","gloss":"認識全新的 MetricKit","gloss_en":"Meet the new MetricKit","category":"other","categoryLabel":"其他"},{"id":"330","title":"Optimize custom machine learning operations with Metal tensors","gloss":"用 Metal tensors 最佳化自訂機器學習運算","gloss_en":"Optimize custom machine learning operations with Metal tensors","category":"graphics","categoryLabel":"圖形與遊戲"},{"id":"356","title":"Bringing Cyberpunk 2077 to Mac","gloss":"將《電馭叛客 2077》帶上 Mac","gloss_en":"Bringing Cyberpunk 2077 to Mac","category":"graphics","categoryLabel":"圖形與遊戲"},{"id":"359","title":"Build real-time neural rendering pipelines with Metal","gloss":"用 Metal 打造即時神經渲染管線","gloss_en":"Build real-time neural rendering pipelines with Metal","category":"graphics","categoryLabel":"圖形與遊戲"},{"id":"322","title":"Compose advanced graphics effects with SwiftUI","gloss":"用 SwiftUI 組合進階圖形效果","gloss_en":"Compose advanced graphics effects with SwiftUI","category":"swiftui","categoryLabel":"SwiftUI"}]}</script>
