<script id="d" type="application/json">{"s":{"id":"328","title":"Explore numerical computing in Swift with MLX","gloss":"用 MLX 探索 Swift 的數值計算","category":"ai","categoryLabel":"AI 與機器學習","duration":871,"url":"https://developer.apple.com/videos/play/wwdc2026/328/","takeaway":"**MLX Swift** 把 NumPy 風格的陣列運算原生帶進 Swift，消除機器學習開發的跨語言摩擦並善用 Apple 晶片。","chapters":[[0,"Introduction"],[57,"MLX Swift and the Apple ecosystem"],[184,"MLX Swift"],[268,"Mandelbrot"],[309,"Mandelbrot set in plain Swift (scalar)"],[327,"Mandelbrot set in MLX Swift (array)"],[394,"Heat distribution"],[447,"Jacobi iteration with conv2d"],[492,"Faster convergence with SOR"],[557,"Successive Over-Relaxation (SOR)"],[617,"Curve fitting"],[673,"Curve fitting with automatic differentiation"],[737,"The full MLX toolkit and ecosystem"],[827,"Next steps"]],"points":[{"text":"**MLX Swift** 提供 NumPy 風格的 `MLXArray` 與向量化運算，讓數值計算原生寫在 Swift 裡。","hot":true},{"text":"以 Mandelbrot 為例，展示從 scalar 逐點迴圈改寫成**陣列式（array）**運算的巨大簡化與加速。","hot":false},{"text":"用 `conv2d` 做 Jacobi 迭代解熱傳導，再以 **SOR（Successive Over-Relaxation）** 加速收斂。","hot":false},{"text":"透過 **自動微分（`grad`）** 進行曲線擬合，以梯度下降更新參數。","hot":false},{"text":"MLX 採**延遲求值**，需以 `eval()` 強制計算，並串接完整的 MLX 工具鏈與生態系。","hot":false}],"apis":["MLX","MLXArray","MLXRandom","conv2d","matmul","grad","eval","linspace"],"audience":"**想在 Swift 中做數值計算或機器學習**、需善用 Apple 晶片的開發者與研究者。","gloss_en":"Explore numerical computing in Swift with MLX","takeaway_en":"**MLX Swift** brings NumPy-style array computing natively to Swift, eliminating cross-language friction in machine learning development and making full use of Apple silicon.","points_en":[{"text":"**MLX Swift** provides a NumPy-style `MLXArray` and vectorized operations, letting you write numerical computing natively in Swift.","hot":true},{"text":"Using Mandelbrot as an example, shows the dramatic simplification and speedup of rewriting a scalar point-by-point loop into **array** operations.","hot":false},{"text":"Solve heat conduction with Jacobi iteration using `conv2d`, then accelerate convergence with **SOR (Successive Over-Relaxation)**.","hot":false},{"text":"Perform curve fitting via **automatic differentiation (`grad`)**, updating parameters with gradient descent.","hot":false},{"text":"MLX uses **lazy evaluation**, requiring `eval()` to force computation, and connects to the full MLX toolchain and ecosystem.","hot":false}],"audience_en":"Developers and researchers who want to **do numerical computing or machine learning in Swift** while making full use of Apple silicon.","summary":["David Koski 介紹 **MLX Swift**：把 NumPy 風格的數值計算原生帶進 Swift，消除跨語言摩擦。數值計算（科學計算）用於化學、物理、金融模擬、音訊與訊號處理、渲染與光線追蹤，乃至大規模梯度下降所支撐的機器學習訓練。Apple 平台已有豐富生態（Accelerate、BNNS、Metal Performance Shaders、Swift Numerics），而當你的主要目標是「寫出貼近數學、又顧及效能」的程式碼時，MLX Swift 是理想選擇。","MLX Swift 以 **n 維陣列**為核心抽象，API 與 NumPy 高度相似，多數 NumPy 程式碼只需少量改動即可轉換。關鍵特性是 **lazy evaluation**：對 array 的運算建立 compute graph，直到呼叫 `eval` 或讀值才執行。這也使得兩件事成為可能——**自動 GPU 執行**與 **automatic differentiation（`grad`）**。整個 MLX 生態皆為 MIT 授權的開源專案。","講者以三個範例展示「把數學翻成程式碼」的便利：**Mandelbrot 集合**——純 Swift 需逐 pixel 在 CPU 上迴圈，MLX Swift 則在整個複數網格上一次套用 `z = z*z + c`，預設用 GPU，可快上約 10 倍且程式更短；**熱分布穩態**——Jacobi iteration 以 `conv2d` 套用 stencil、用 `which` 處理邊界條件，再用 **Successive Over-Relaxation（SOR）** 搭配 red/black checkerboard 的就地更新與最佳 omega 加速收斂；**曲線擬合**——定義 loss（MSE）後用 `grad` 取得自動微分梯度，跑梯度下降，毋須手寫導數。","最後講者說明 MLX 涵蓋完整數值計算工具箱（線性代數、FFT、N 維卷積、reductions、scans、indexing、亂數等），並有健全生態：核心 `mlx-swift`、語言模型的 `mlx-swift-lm`、範例的 `mlx-swift-examples`，皆可用 Swift Package Manager 安裝。MLX 同時有 Swift、Python、C++、C 四種前端，共享相同概念與 lazy evaluation 模型，因此可在 Python 原型、在 Swift 出貨。鼓勵大家試用並貢獻。"],"deepdive":[{"t":0,"title":"Introduction","body":"David Koski 開場定義**數值計算**（亦稱數值分析／科學計算）：用演算法解難以符號或手算的數學問題，應用涵蓋化學、物理、金融模擬、音訊訊號處理、渲染與光線追蹤，以及作為機器學習訓練基礎的大規模梯度下降。"},{"t":57,"title":"MLX Swift and the Apple ecosystem","body":"盤點 Apple 既有數值計算生態：**Accelerate**（CPU 向量原語）、**BNNS**（神經網路積木層）、**Metal Performance Shaders**（GPU kernel）、**Swift Numerics**（Complex 與泛型數值協定）。當主要目標是寫貼近數學又顧效能的程式碼時，MLX Swift 最合適。"},{"t":184,"title":"MLX Swift","body":"以 power iteration 為例展示 MLX Swift：`.T` 取轉置、`matmul` 做矩陣乘、`norm` 取 L2 norm，程式讀起來就像數學。並點出關鍵的 **lazy evaluation**——運算建立 compute graph，呼叫 `eval` 或讀值才執行；迴圈內每步 `eval` 讓 graph 保持精簡。"},{"t":268,"title":"Mandelbrot","body":"介紹 **Mandelbrot 集合**作為陣列計算的絕佳範例：對複數平面每個點 c 迭代 `z = z² + c`，若 magnitude 不超過 2 則屬於集合（塗黑），否則依逃逸速度上色。是把函式套用到大型網格的典型場景。"},{"t":309,"title":"Mandelbrot set in plain Swift (scalar)","body":"純 Swift scalar 版：逐 pixel 迴圈跑 Mandelbrot 迭代並檢查發散，雖然 idiomatic，但充斥與問題無關的 bookkeeping，且只在 CPU 上一次處理一個點。"},{"t":327,"title":"Mandelbrot set in MLX Swift (array)","body":"MLX Swift 版：先建好複數網格 c，迴圈只有兩行——`z = z * z + c` 一次套用到所有點、再計數仍 bounded 的迭代次數。是數學的直接翻譯，預設用 GPU，程式更小更簡單。"},{"t":394,"title":"Heat distribution","body":"下個範例是房間熱分布穩態：把溫度建模成 2D 網格，每次迭代用 stencil 平均鄰居值，反覆直到穩態。因為更新只看小鄰域且每點配方相同，這正是一個 convolution。"},{"t":447,"title":"Jacobi iteration with conv2d","body":"示範 **Jacobi iteration** 的 MLX Swift 核心：kernel 把四鄰各 0.25、中心與角為 0 的 stencil 寫出來；迴圈兩行——`conv2d` 一次套用 stencil，`which` 以 elementwise ternary 套用邊界條件（熱源／牆保持固定值，其餘取卷積新值）。"},{"t":492,"title":"Faster convergence with SOR","body":"說明 Jacobi 計算快但收斂慢（約需 N² 次迭代）。引出 **Successive Over-Relaxation（SOR）**：用相同 kernel 但加上 omega 參數，朝變化方向過衝以更快到達，過衝會在迭代中修正；最佳 omega 可使收斂降到 N 次。"},{"t":557,"title":"Successive Over-Relaxation (SOR)","body":"SOR 程式：先依網格大小算最佳 omega，再用 red/black **checkerboard** masks 交替更新——MLX 通常產生新陣列而非就地更新，但棋盤式交替處理可達到就地效果（黑格更新時其紅格鄰居已是新值）。視覺上 SOR 以漣漪狀快速填滿，需放慢 100 倍才看得清。"},{"t":617,"title":"Curve fitting","body":"第三個範例翻轉方向：已有資料點（輸出），要找出產生它們的參數。先決定函式結構（此處用二次多項式得拋物線），目標是最小化 loss——輸出與實際資料差的均方。這正是訓練每個 ML 模型的核心概念縮影。"},{"t":673,"title":"Curve fitting with automatic differentiation","body":"用 MLX Swift 的關鍵 function transformation **`grad`** 做 automatic differentiation：定義 f 與 loss（MSE），把 loss 轉成回傳對參數的精確梯度的函式，毋須手寫導數；最佳化迴圈每步算梯度、走一小步、`eval` 沖掉 compute graph。若需更多可用 SGD、Adam、RMSprop 等。"},{"t":737,"title":"The full MLX toolkit and ecosystem","body":"MLX 涵蓋完整數值計算工具箱：線性代數、FFT、N 維卷積、reductions、scans、indexing、亂數等。生態包含 `mlx-swift`、`mlx-swift-lm`、`mlx-swift-examples`（本場範例會放這），皆可用 SwiftPM 幾行安裝。MLX 亦有 Swift／Python／C++／C 四前端共享相同概念，可 Python 原型、Swift 出貨。"},{"t":827,"title":"Next steps","body":"鼓勵大家試用 `mlx-swift` 與 `mlx-swift-examples`（含 LLM 整合、stable diffusion、訓練與微調等範例），並參與貢獻——修開放 issue 或新增範例程式。"}],"summary_en":["David Koski introduces **MLX Swift**: bringing NumPy-style numerical computing natively to Swift to eliminate cross-language friction. Numerical (scientific) computing powers simulations in chemistry, physics, and finance, audio and signal processing, rendering and ray tracing, and the large-scale gradient descent behind machine-learning training. Apple platforms already have a rich ecosystem (Accelerate, BNNS, Metal Performance Shaders, Swift Numerics), and MLX Swift is the right reach when your primary goal is writing math-like code with an eye on performance.","MLX Swift uses **n-dimensional arrays** as its central abstraction, with an API very close to NumPy — most NumPy code translates with minimal changes. The key feature is **lazy evaluation**: operations build a compute graph and nothing runs until you call `eval` or read a value. This is what makes **automatic GPU execution** and **automatic differentiation (`grad`)** possible. The whole MLX ecosystem is open source under an MIT license.","Three examples show how easily math becomes code: **the Mandelbrot set** — plain Swift loops pixel-by-pixel on the CPU, while MLX Swift applies `z = z*z + c` across the whole complex grid at once, defaults to GPU, and can run ~10x faster in less code; **heat-distribution steady state** — Jacobi iteration applies a stencil via `conv2d` with `which` for boundary conditions, then **Successive Over-Relaxation (SOR)** uses a red/black checkerboard for in-place updates and an optimal omega to converge faster; and **curve fitting** — define a loss (MSE), get gradients via automatic differentiation with `grad`, and run gradient descent with no hand-written derivatives.","Finally, MLX covers the full numerical-computing toolkit (linear algebra, FFTs, N-dimensional convolutions, reductions, scans, indexing, random numbers, and more) with a healthy ecosystem: core `mlx-swift`, `mlx-swift-lm` for language models, and `mlx-swift-examples`, all installable via Swift Package Manager. MLX also has four front-ends — Swift, Python, C++, and C — sharing the same concepts and lazy-evaluation model, so you can prototype in Python and ship in Swift. The talk encourages trying it and contributing."],"deepdive_en":[{"t":0,"title":"Introduction","body":"David Koski opens by defining **numerical computing** (numerical analysis / scientific computing): algorithms to solve math problems impractical to do symbolically or by hand, spanning chemistry, physics, finance simulations, audio/signal processing, rendering and ray tracing, and the large-scale gradient descent underpinning ML training."},{"t":57,"title":"MLX Swift and the Apple ecosystem","body":"Surveys Apple's existing numerical ecosystem: **Accelerate** (CPU vector primitives), **BNNS** (neural-network building blocks), **Metal Performance Shaders** (GPU kernels), and **Swift Numerics** (Complex and generic numeric protocols). MLX Swift fits best when the primary goal is math-like code with performance in mind."},{"t":184,"title":"MLX Swift","body":"Walks through MLX Swift via power iteration: `.T` for transpose, `matmul` for matrix multiply, `norm` for the L2 norm — the code reads like the math. Highlights the key **lazy evaluation**: operations build a compute graph and run only on `eval` or read; calling `eval` each loop iteration keeps the graph small."},{"t":268,"title":"Mandelbrot","body":"Introduces the **Mandelbrot set** as an ideal array-computing showcase: for each point c, iterate `z = z² + c`; if the magnitude never exceeds 2 it's in the set (black), otherwise colored by escape speed — a classic apply-a-function-over-a-grid case."},{"t":309,"title":"Mandelbrot set in plain Swift (scalar)","body":"Plain scalar Swift loops over every pixel running the Mandelbrot iteration and checking divergence; idiomatic, but full of problem-irrelevant bookkeeping and processing one point at a time on the CPU."},{"t":327,"title":"Mandelbrot set in MLX Swift (array)","body":"The MLX Swift version sets up a complex grid c, then the loop is two lines — `z = z * z + c` applied to all points at once, then counting bounded iterations. A direct translation of the math, defaulting to the GPU, in smaller, simpler code."},{"t":394,"title":"Heat distribution","body":"The next example is steady-state heat in a room: model temperature as a 2D grid, each iteration averaging neighbors with a stencil, repeated until steady state. Because the update is a small same-recipe neighborhood, it's exactly a convolution."},{"t":447,"title":"Jacobi iteration with conv2d","body":"Shows the **Jacobi iteration** core in MLX Swift: the kernel writes out the stencil (0.25 on each of four neighbors, zeros on center/corners); the loop is two lines — `conv2d` applies the stencil at once, and `which` (an elementwise ternary) applies boundary conditions (keep fixed value at sources/walls, take the convolution elsewhere)."},{"t":492,"title":"Faster convergence with SOR","body":"Notes Jacobi is fast to compute but slow to converge (~N² iterations). Introduces **Successive Over-Relaxation (SOR)**: same kernel plus an omega parameter that overshoots toward the change to get there faster, with the overshoot correcting over iterations; an optimal omega cuts convergence to N iterations."},{"t":557,"title":"Successive Over-Relaxation (SOR)","body":"SOR code: compute the optimal omega from grid size, then use red/black **checkerboard** masks to update alternating cells — MLX usually produces new arrays, but the checkerboard alternation achieves the in-place effect (black cells update with already-fresh red neighbors). Visually SOR fills with a striking ripple, slowed 100x to be visible."},{"t":617,"title":"Curve fitting","body":"The third example flips direction: you have data points (outputs) and want the parameters that produce them. Choose the function structure (here a quadratic, giving a parabola), and minimize the loss — the mean squared difference between output and data. This is the core idea behind training every ML model, in miniature."},{"t":673,"title":"Curve fitting with automatic differentiation","body":"Uses MLX Swift's key function transformation **`grad`** for automatic differentiation: define f and the loss (MSE), transform loss into a function returning the exact gradient w.r.t. parameters — no hand-written derivatives; the optimization loop evaluates the gradient, takes a small step, and `eval`s to flush the graph. For more, MLX has SGD, Adam, RMSprop, and others."},{"t":737,"title":"The full MLX toolkit and ecosystem","body":"MLX covers the full numerical toolkit: linear algebra, FFTs, N-dimensional convolutions, reductions, scans, indexing, random numbers, and more. The ecosystem includes `mlx-swift`, `mlx-swift-lm`, and `mlx-swift-examples` (where this session's examples will live), all installable in a few lines via SwiftPM. MLX also has Swift/Python/C++/C front-ends sharing the same concepts, so you can prototype in Python and ship in Swift."},{"t":827,"title":"Next steps","body":"Encourages trying `mlx-swift` and `mlx-swift-examples` (with examples for LLM integration, stable diffusion, training and fine-tuning) and contributing — fixing open issues or adding new example programs."}],"code":["import MLX\nlet n = 100\nlet steps = 10\nlet B = MLXRandom.normal([n, n])\nvar v = MLXRandom.normal([n])\n\n// get symmetric matrix A = Bᵀ + B\nlet A = B.T + B\n\n// Power iteration → top eigenvector of A.\n//   v ← A v / ‖A v‖\nfor _ in 0 ..\u003c steps {\n    let Av = matmul(A, v)\n    v = Av / norm(Av)\n    eval(v)\n}\n\n// recover the eigenvalue.\n//   λ = vᵀ A v\nlet lambda = matmul(matmul(v.T, A), v)\n\nprint(lambda)","// Plain Swift, scalar-at-a-time\nvar counts = Array2D\u003cInt>(width: w, height: h)\n\nfor y in 0 ..\u003c h {\n    for x in 0 ..\u003c w {\n        let c = Complex(xMin + Float(x) * xStep, yMin + Float(y) * yStep)\n        var z = Complex\u003cFloat>.zero\n        var limit = maxIterations\n        for i in 0 ..\u003c maxIterations {\n            z = z * z + c\n            if z.lengthSquared > radiusSquared {\n                limit = i\n                break\n            }\n        }\n        counts[x, y] = limit\n    }\n}","// Compute the Mandelbrot set on a grid of complex numbers\nimport MLX\n\nlet x = linspace(Float(-2.0), 0.5, count: w)\nlet y = linspace(Float(-1.25), 1.25, count: h).reshaped(h, 1)\nlet c = x + y.asImaginary()\n\nvar z = MLXArray.zeros(like: c)\nvar counts = MLXArray.zeros(c.shape, dtype: .int16)\n\nfor _ in 0 ..\u003c maxIterations {\n    z = z * z + c                       // iterate z ← z² + c\n    counts = counts + (abs(z) .\u003c 2)     // count bounded iterations\n}","// Jacobi iteration: average the four neighbors\n\n// Convolution weights\nlet kernel = MLXArray(converting: [\n    0,    0.25, 0,\n    0.25, 0,    0.25,\n    0,    0.25, 0,\n]).reshaped(1, 3, 3, 1)\n\n// Initial value\nvar temperature = heatSources\n\n// Run this in a loop until convergence\nlet next = conv2d(temperature, kernel, padding: 1)\ntemperature = which(heatMask, heatSources, next)","// Successive Over-Relaxation: blend the previous and next state\nlet ω: Float = 2.0 / (1.0 + sin(Float.pi / Float(max(M, N))))\n\nlet redMask   = checkerboard(rows: M, cols: N, phase: 0)\nlet blackMask = checkerboard(rows: M, cols: N, phase: 1)\n\n// Update red cells using black neighbors\nlet sorRed  = ω * conv2d(temperature, kernel, padding: 1) + (1 - ω) * temperature\ntemperature = which(redMask, sorRed, temperature)\ntemperature = which(heatMask, heatSources, temperature)\n\n// Update black cells using (now-updated) red neighbors\nlet sorBlack = ω * conv2d(temperature, kernel, padding: 1) + (1 - ω) * temperature\ntemperature  = which(blackMask, sorBlack, temperature)\ntemperature  = which(heatMask, heatSources, temperature)","// Define a loss, then optimize it with autodiff\n// x, y: data points as MLXArrays\nfunc f(_ θ: MLXArray) -> MLXArray {\n    θ[0] + θ[1] * x + θ[2] * x ** 2\n}\n\nfunc loss(_ θ: MLXArray) -> MLXArray {\n    mean((f(θ) - y) ** 2)\n}\n\nvar θ = zeros([numParams])\nlet gradLoss = grad(loss)\n\nfor _ in 0 ..\u003c steps {\n    let g = gradLoss(θ)         // ∇L(θ)\n    θ = θ - learningRate * g    // parameter update\n    eval(θ)                     // force evaluation\n}"]},"related":[{"id":"232","title":"Run local agentic AI on the Mac using MLX","gloss":"用 MLX 在 Mac 上執行本機 agentic AI","gloss_en":"Run local agentic AI on the Mac using MLX","category":"ai","categoryLabel":"AI 與機器學習"},{"id":"233","title":"Explore distributed inference and training with MLX","gloss":"用 MLX 探索分散式推論與訓練","gloss_en":"Explore distributed inference and training with MLX","category":"ai","categoryLabel":"AI 與機器學習"},{"id":"382","title":"Inside Apple Intelligence and Xcode: Special Presentation","gloss":"深入 Apple Intelligence 與 Xcode：特別發表","gloss_en":"Inside Apple Intelligence and Xcode: Special Presentation","category":"ai","categoryLabel":"AI 與機器學習"},{"id":"121","title":"Announcing Apple’s next big step for Siri and iPhone","gloss":"宣布 Apple 為 Siri 與 iPhone 邁出的下一大步","gloss_en":"Announcing Apple's next big step for Siri and iPhone","category":"ai","categoryLabel":"AI 與機器學習"},{"id":"227","title":"Create UI prototypes using agents in Xcode","gloss":"在 Xcode 用代理人打造 UI 原型","gloss_en":"Prototype UI with agents in Xcode","category":"ai","categoryLabel":"AI 與機器學習"}]}</script>
