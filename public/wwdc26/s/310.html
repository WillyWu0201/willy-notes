<script id="d" type="application/json">{"s":{"id":"310","title":"What’s new in Shortcuts","gloss":"捷徑有什麼新東西","category":"ai","categoryLabel":"AI 與機器學習","duration":662,"url":"https://developer.apple.com/videos/play/wwdc2026/310/","takeaway":"Shortcuts 新增自動化與「Use Model」動作,讓你能用 App 的 AppEntity 內容串接 Apple Intelligence 模型,打造更強大的捷徑。","chapters":[[1,"Introduction"],[57,"Automations"],[205,"Use Model"],[372,"Soup Entity Example"],[418,"Storage"],[605,"Soup Entity Example"]],"points":[{"text":"用 App 的內容打造更強大的捷徑,**新的 automations** 解鎖更多整合 App 的方式。","hot":false},{"text":"新增 **Use Model** 動作,可在捷徑中直接呼叫模型處理 App 的資料。","hot":true},{"text":"示範以 **AppEntity(SoupEntity)** 暴露 App 內容,搭配 @Property 標註可被捷徑使用的屬性。","hot":false},{"text":"用 **TypeDisplayRepresentation 與 DisplayRepresentation** 定義 entity 在捷徑中的顯示(含 numericFormat)。","hot":false},{"text":"涵蓋 **Storage** 章節,說明捷徑如何存取與保存資料。","hot":false}],"apis":["AppIntents","AppEntity","@Property","TypeDisplayRepresentation","DisplayRepresentation","EntityQuery"],"audience":"**想讓 App 內容透過 Shortcuts 與 Apple Intelligence 模型串接、提供自動化能力的開發者。**","gloss_en":"What's new in Shortcuts","takeaway_en":"Shortcuts adds new automations and a \"Use Model\" action, letting you wire your app's AppEntity content into Apple Intelligence models to build more powerful shortcuts.","points_en":[{"text":"Build more powerful shortcuts with your app's content; **new automations** unlock additional ways to integrate your app.","hot":false},{"text":"Adds the **Use Model** action, letting you call a model directly within a shortcut to process your app's data.","hot":true},{"text":"Demonstrates exposing app content with an **AppEntity (SoupEntity)**, using @Property to annotate which properties are available to Shortcuts.","hot":false},{"text":"Use **TypeDisplayRepresentation and DisplayRepresentation** to define how an entity appears in Shortcuts (including numericFormat).","hot":false},{"text":"Covers the **Storage** chapter, explaining how shortcuts access and persist data.","hot":false}],"audience_en":"**Developers who want to wire their app's content into Apple Intelligence models through Shortcuts and provide automation capabilities.**","summary":["這場由 Shortcuts 團隊主講，主軸是讓你 app 的 actions 與內容更自然地融入 Shortcuts，並帶來三項重要更新。**Shortcuts** 能把你每天在 app 裡執行的動作組合起來，從 Siri、Control Center、Action Button 等系統各處快速執行；講者以一個叫 **Soup Chef** 的點湯 app 為貫穿範例，逐一示範新的 automation 設定方式、更強大的 **Use Model** action，以及全新的 **Storage** 功能。","第一塊是 **Automations**。自動化現在直接住進 Shortcuts editor，與 actions 並列、設定更簡單，只要在 editor 的「Automation」區即可瀏覽與加入。除了既有類型外，新增三種：**screenshot automation**（截圖存檔時觸發）、**keyboard automation**（外接鍵盤連接／中斷時觸發）、與 **notification automation**（收到特定 app 通知時觸發）。範例用 notification automation 在收到 Soup Chef「arriving」通知時自動開啟門廊燈並讓 HomePod 廣播，並強調遵循 Human Interface Guidelines 設計簡潔、具體、可操作的通知，使用者才能據以打造強大自動化。","第二塊是 **Use Model** action，現在可接上更強的 Apple Intelligence 模型、甚至能上網取得即時資訊，並能直接處理你 app 的內容。講者用 **EntityPropertyQuery** 搭配 App Intents 暴露的 Find Soups 與 Order Soup 串成「Soup of the Day」捷徑；當模型挑錯湯時，可用新的方式 **檢視 model transcript**——加上 Show Content action 並選取其輸出的 Transcript property，即可看到傳給模型的原始 **SoupEntity** 與屬性。診斷發現只有 name、availability 不足以判斷辣度，於是替 entity 補上 ingredients property，模型便挑出夠辣的 Tom Yum。","第三塊是 **Storage**，可在捷徑執行之間持久保存資料。editor 新增可建立、檢視、編輯儲存值的畫面，也能建立跨捷徑共享的 global value（例如 API key）；透過 getter／setter 等 action 在捷徑內讀寫資料。範例讓賽車冷知識捷徑記錄 Previous Facts 以避免重複，也讓 Soup of the Day 記住近期選擇而不再天天重複。實務重點：儲存值會 **跨裝置同步**，因此 App Entity 必須有跨裝置一致的 identity——講者改用線上資料庫的 row ID 作為穩定識別碼，確保 iPhone 存的湯在 iPad、Mac 上被辨識為同一個。"],"deepdive":[{"t":1,"title":"Introduction","body":"由 Shortcuts 團隊的 Duraid 開場，說明 **Shortcuts** 能組合你每天在 app 裡執行的動作，並從 **Siri**、**Control Center**、**Action Button** 等系統各處快速執行。講者預告本場三大主題：automations 的設定更新與新類型、更強大的 **Use Model** action 與其除錯方式、以及讓資料在捷徑執行間持久化的 **Storage**。"},{"t":57,"title":"Automations","body":"自動化現在直接整合進 **Shortcuts editor**，與 actions 並列、設定比以往更簡單，只要造訪 editor 的「Automation」區即可瀏覽與加入。除了既有類型，新增三種：**screenshot automation**（截圖存檔時）、**keyboard automation**（外接鍵盤連接／中斷時）、與 **notification automation**（收到特定 app 通知時）。講者以一個離開公司就算路線並傳訊給夥伴 Helen 的捷徑開場，說明事件觸發的概念。"},{"t":205,"title":"Use Model","body":"示範 notification automation 的實例：當 **Soup Chef** 送出含外送員姓名與抵達時間的通知時自動執行。為避免每則通知都觸發，講者加上對「**arriving**」一詞的 filter，只在湯快送到時才開門廊燈並讓 HomePod 廣播。重點是好的通知要簡潔、具體（動詞）且可操作（時間），並遵循 **Human Interface Guidelines**，使用者才容易在捷徑中解析運用。"},{"t":372,"title":"Soup Entity Example","body":"進入 **Use Model** 主題：此 action 可接上更強且能上網的 **Apple Intelligence** 模型，並處理 app 內容。講者用 **EntityPropertyQuery** 暴露的 Find Soups（可篩出今日供應）與 Order Soup 串成「Soup of the Day」捷徑，由模型依辣度偏好挑湯，但首次卻挑了偏溫和的 chicken tortilla soup，引出除錯需求。"},{"t":418,"title":"Storage","body":"示範新的除錯方式：可 **檢視 model transcript**，看到以原始格式傳給模型的全部內容。做法是在 Use Model 後加 **Show Content** action 並選取輸出的 **Transcript** property，即可展開每個傳入的 **SoupEntity** 與其屬性。診斷發現只有 name 與 availability 不足以判斷辣度，於是在 SoupEntity 加上 ingredients（每項成分與份量的字串陣列），模型便改挑出夠辣的 Tom Yum。"},{"t":605,"title":"Soup Entity Example","body":"進入 **Storage**：可在捷徑執行間持久保存資料，editor 新增建立／檢視／編輯儲存值的畫面，也支援跨捷徑共享的 **global value**（如 API key），並以 getter／setter action 讀寫。範例讓賽車冷知識捷徑保存 Previous Facts 避免重複、讓 Soup of the Day 記住近期選擇。關鍵在於儲存值會 **跨裝置同步**，因此 App Entity 需有一致 identity——講者改以線上資料庫的 row ID 作為穩定識別碼，確保各裝置辨識為同一個 entity。"}],"summary_en":["Presented by the Shortcuts team, this session is about making your app's actions and content fit naturally into Shortcuts, and it ships three big updates. **Shortcuts** lets you combine actions you perform in your apps every day and run them quickly from across the system, like Siri, Control Center, and the Action Button. Using a soup-ordering app called **Soup Chef** as a running example, the speaker walks through the new way automations are set up, a more powerful **Use Model** action, and a brand-new **Storage** feature.","The first part is **Automations**. They now live directly in the Shortcuts editor alongside your actions and are easier than ever to set up via the editor's \"Automation\" section. Beyond the existing types, three new ones arrive: the **screenshot automation** (fires when a screenshot is saved), the **keyboard automation** (fires when an external keyboard is connected or disconnected), and the **notification automation** (fires when a notification arrives from a specific app). The example uses a notification automation to turn on porch lights and have a HomePod announce when a Soup Chef \"arriving\" notification is received, and stresses following the Human Interface Guidelines to design concise, specific, actionable notifications so users can build powerful automations on them.","The second part is the **Use Model** action, which now taps more capable Apple Intelligence models that can even go to the web for fresh information, and can work with your app's content. Using **EntityPropertyQuery** with App Intents, the speaker exposes Find Soups and Order Soup and strings them into a \"Soup of the Day\" shortcut; when the model picks the wrong soup you can now **inspect the model transcript** by adding a Show Content action and selecting its Transcript property, revealing the raw **SoupEntity** values and properties passed in. The diagnosis shows that name and availability alone can't judge spice level, so adding an ingredients property leads the model to pick a properly spicy Tom Yum.","The third part is **Storage**, which persists data between runs of a shortcut. The editor gains a view to create, inspect, and edit stored values, plus a **global value** shared across shortcuts (handy for an API key), with getter/setter actions to read and write from within a shortcut. The examples keep a racing-fact shortcut from repeating itself via Previous Facts, and give Soup of the Day a memory of recent picks. The practical caveat: stored values **sync across devices**, so an App Entity needs a consistent identity across devices—the speaker uses each soup's online-database row ID as a stable identifier so a soup stored on iPhone is recognized as the same entity on iPad or Mac."],"deepdive_en":[{"t":1,"title":"Introduction","body":"Duraid from the Shortcuts team opens by explaining that **Shortcuts** combines actions you perform in your apps daily and runs them quickly from across the system—**Siri**, **Control Center**, the **Action Button**, and more. He previews the session's three themes: updates to how automations are set up plus new automation types, a more powerful **Use Model** action with a new way to debug it, and **Storage** for persisting data between runs."},{"t":57,"title":"Automations","body":"Automations now live directly in the **Shortcuts editor** alongside actions and are easier to set up than ever—just visit the editor's \"Automation\" section to browse and add one. Three new types join the existing set: the **screenshot automation** (when a screenshot is saved), the **keyboard automation** (when an external keyboard connects or disconnects), and the **notification automation** (when a notification arrives from a specific app). He frames the event-driven idea with a shortcut that, on leaving work, computes the route home and texts his partner Helen."},{"t":205,"title":"Use Model","body":"A concrete notification-automation example: when **Soup Chef** sends a notification with the driver's name and arrival time, a shortcut runs automatically. To avoid firing on every notification, he adds a filter for the word \"**arriving**,\" so it only turns on the porch lights and has the HomePod announce when soup is en route. The takeaway: good notifications are concise, specific (a clear verb), and actionable (the time), and following the **Human Interface Guidelines** makes them easy to parse inside a shortcut."},{"t":372,"title":"Soup Entity Example","body":"Into the **Use Model** topic: the action can now tap more capable, web-aware **Apple Intelligence** models and work with app content. Using Find Soups (filterable to those available today) and Order Soup—exposed via an **EntityPropertyQuery**—he builds a \"Soup of the Day\" shortcut that asks the model to pick by spice preference, but it first picks a mild chicken tortilla soup, motivating a way to debug the model."},{"t":418,"title":"Storage","body":"He demonstrates the new debugging path: you can **inspect the model transcript** to see everything passed to the model in raw form. Add a **Show Content** action after Use Model and select its **Transcript** property to expand each **SoupEntity** and its properties. The diagnosis: name and availability aren't enough to judge spice, so he adds an ingredients property (a string array of each ingredient and quantity), after which the model picks a genuinely spicy Tom Yum."},{"t":605,"title":"Soup Entity Example","body":"Into **Storage**: data can persist between runs, with a new editor view to create/inspect/edit stored values and a cross-shortcut **global value** (e.g., an API key), accessed via getter/setter actions. Examples keep a racing-fact shortcut from repeating via Previous Facts and give Soup of the Day a memory of recent picks. The key point is that stored values **sync across devices**, so an App Entity needs a consistent identity—he uses the soup's online-database row ID as a stable identifier so every device recognizes it as the same entity."}],"code":[]},"related":[{"id":"297","title":"Best practices for integrating visual intelligence in your app","gloss":"在 App 中整合視覺智慧的最佳實務","gloss_en":"Best practices for integrating visual intelligence in your app","category":"ai","categoryLabel":"AI 與機器學習"},{"id":"343","title":"Explore advanced App Intents features for Siri and Apple Intelligence","gloss":"探索 Siri 與 Apple Intelligence 的進階 App Intents 功能","gloss_en":"Explore advanced App Intents features for Siri and Apple Intelligence","category":"ai","categoryLabel":"AI 與機器學習"},{"id":"344","title":"Code-along: Make your app available to Siri","gloss":"程式碼實作：讓你的 App 可被 Siri 使用","gloss_en":"Code-along: Make your app available to Siri","category":"ai","categoryLabel":"AI 與機器學習"},{"id":"240","title":"Build intelligent Siri experiences with App Schemas","gloss":"用 App Schemas 打造智慧 Siri 體驗","gloss_en":"Build intelligent Siri experiences with App Schemas","category":"ai","categoryLabel":"AI 與機器學習"},{"id":"347","title":"Secure your app: mitigate risks to agentic features","gloss":"保護你的 App：降低 agentic 功能的風險","gloss_en":"Secure your app: mitigate risks to agentic features","category":"ai","categoryLabel":"AI 與機器學習"}]}</script>
