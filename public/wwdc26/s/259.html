<script id="d" type="application/json">{"s":{"id":"259","title":"Xcode, agents, and you","gloss":"Xcode、代理人與你","category":"ai","categoryLabel":"AI 與機器學習","duration":1443,"url":"https://developer.apple.com/videos/play/wwdc2026/259/","takeaway":"了解如何把 Xcode 的編碼代理人融入開發流程，從探索、建構、精修到協調多步驟任務。","chapters":[[0,"Introduction"],[74,"Meet the app"],[126,"Explore"],[458,"Build"],[824,"Refine"],[1105,"Orchestrate"],[1329,"Next steps"]],"points":[{"text":"示範把 **Xcode 的編碼代理人（coding agents）**融入日常開發流程的多種工作方式。","hot":true},{"text":"用代理人**探索（Explore）**既有 App，快速理解程式碼結構與行為。","hot":false},{"text":"從**建構（Build）到精修（Refine）**，由代理人協助實作功能並逐步打磨。","hot":false},{"text":"進一步**協調（Orchestrate）**多個步驟與任務，讓代理人處理更複雜的工作流程。","hot":false}],"apis":[],"audience":"**想把 AI 編碼代理人納入 Xcode 開發流程**、提升效率的 iOS 開發者。","gloss_en":"Xcode, agents, and you","takeaway_en":"Learn how to bring Xcode's coding agents into your development workflow, from exploring to building, refining, and orchestrating multi-step tasks.","points_en":[{"text":"Demonstrates multiple ways to bring **Xcode's coding agents** into your everyday development workflow.","hot":true},{"text":"Use agents to **Explore** an existing app and quickly understand its code structure and behavior.","hot":false},{"text":"From **Build to Refine**, agents help implement features and polish them step by step.","hot":false},{"text":"Go further and **Orchestrate** multiple steps and tasks, letting agents handle more complex workflows.","hot":false}],"audience_en":"iOS developers who want to **bring AI coding agents into their Xcode development workflow** and boost efficiency.","summary":["本場由 Xcode Intelligence 團隊的 Devin 與 Maxwell 以實際開發一款健身追蹤 app 為例，示範如何在 **Xcode 27** 中運用 **coding agents** 貫穿整個開發流程。Xcode 26.3 首度引入 coding agents 與處理多步驟任務的工具，Xcode 27 則擴充了工具集並重新設計與 agent 的互動方式，核心目標是讓你專注在自己喜歡的工作上：你掌握程式碼的願景，Xcode 幫你更快、更有信心地抵達。","整場圍繞四個工作模式展開。**Explore（探索）** 階段，agent 能讀取整個專案（原始碼、build settings、開啟的檔案與當前選取），可請它產出架構 walkthrough 並把知識沉澱成專案內的架構文件，同時透過 **Apple Document Search** 取得最新的 SwiftUI、SwiftData 文件。**Build（建構）** 階段使用 **plan mode** 先當架構師規劃，再透過 queued messages 與 agent 提問形成緊密溝通迴圈，approve 後 agent 以 artifacts 形式呈現 diff，並用 Build、Preview、Test 工具自我驗證（範例中寫出 12 個通過的測試）。","**Refine（精修）** 階段示範以 **Swift Charts** 加入視覺化，強調設計是主觀且會持續迭代的，可用圖片、Freeform 手繪 sketch 表達意圖，並以 **inline annotations** 直接在原始碼指定位置做精準、限定範圍的修改；previews 會被增量渲染以自我驗證結果是否符合預期。**Orchestrate（協調）** 階段以「把 app 在地化成 Filipino」與「為互動元素加上 VoiceOver labels」兩個並行對話為例，說明你只需描述高階目標，Xcode 便自動發現合適工具（如機器翻譯工具）並派出 sub-agents 並行執行。","實務takeaway：agent 讓「把想法變成功能」變得極快，因此工作重心自然轉向「先有好的計畫」。從探索、規劃、建構到精修與協調，Xcode 全程把你留在駕駛座，並提供與你相同的驗證工具（build、preview、test），讓你對程式碼的正確性保有信心。延伸可參考「Create UI Prototypes using Agents in Xcode」與「Translate your app with agents in Xcode」兩場 session。"],"deepdive":[{"t":0,"title":"Introduction","body":"由 Xcode Intelligence 團隊的 **Devin** 與 **Maxwell** 開場，說明 **Xcode 27** 在 26.3 引入 coding agents 的基礎上，擴充工具並重新設計 agent 互動方式。核心理念是讓你驅動程式碼願景、Xcode 助你更快達成，並能適應不同熟練度的使用者。整場將依 explore、build、refine、orchestrate 四個模式逐步示範。"},{"t":74,"title":"Meet the app","body":"兩人介紹他們正在打造的健身追蹤 app，目前已有追蹤練習的 workout 頁與顯示過往紀錄的 history 區。Maxwell 提出想看到隨時間的進步趨勢，因而催生新的 **insights view** 需求。Devin 先用 agent 把 app 起出基本架構，由此展開後續開發。"},{"t":126,"title":"Explore","body":"示範以 Option+Shift 點選工具列按鈕，在獨立編輯器面板開啟新對話來探索專案。agent 能看到整個專案 context，產出含 data flow 大綱、關鍵區域表格與原始碼參照的 **walkthrough**，並可把成果寫成兩份架構文件作為可隨程式碼演進的知識庫。畫面也區分左側 transcript（對話、工具呼叫、sub-agents）與右側 **artifacts**（檔案、編輯、preview）。同時透過 **Apple Document Search** 自動取得最新的 SwiftUI tables 與 SwiftData 文件。"},{"t":458,"title":"Build","body":"以 slash command 進入 **plan mode**，讓你先當架構師規劃要新增的 workout insights tab，並帶入 explore 階段學到的裝置呈現細節。透過 **queued messages** 與 agent 主動提問形成溝通迴圈（例如選擇 per-exercise 與 top-level summary 兩種呈現）。approve 計畫後，agent 以 artifacts 顯示 diff，並用 Xcode 的 **build、preview、test** 工具自我驗證，建置錯誤直接回饋給 agent 迭代修正，最終寫出並通過 12 個測試。"},{"t":824,"title":"Refine","body":"用 **Swift Charts** 為分析畫面加入視覺化，強調圖表外觀、動畫、配色是會持續變動的主觀偏好，因此每次變更都要留在迴圈中。示範先為各種圖表類型以假資料產生 preview 挑選（選定 volume over time），再用 iPad 的 **Freeform** 手繪 sketch 表達設計，agent 據此產出符合的折線圖。最後用 **inline annotations** 在原始碼精確指定位置加入淡入動畫、調整 trend line 顏色以符合主題。"},{"t":1105,"title":"Orchestrate","body":"示範 **orchestration**：以「把所有使用者可見字串翻成 Filipino 並設定 strings catalog」與「為所有互動元素加上 VoiceOver labels 與 accessibility identifiers」兩個並行對話。你只描述高階目標，Xcode 自動發現合適工具（如機器翻譯工具），主對話把工作拆成多個 **sub-agents** 並行執行、底層各自呼叫翻譯能力。最後啟用 VoiceOver 驗證每個主要元素都已標記且可導覽。"},{"t":1329,"title":"Next steps","body":"回顧整場用到的能力：以 Xcode Tools 與 Apple Document Search 探索程式碼與 API、用 plan mode 規劃架構、用 build/preview/test 驗證、用圖片與 inline annotations 精修、用 sub-agents 並行協調在地化與無障礙。行動建議是下載 **Xcode 27** 在自己的專案上試用 agents，並參考「Create UI Prototypes using Agents in Xcode」與「Translate your app with agents in Xcode」兩場 session。"}],"summary_en":["Hosted by Devin and Maxwell of the Xcode Intelligence team, this session walks through building a real fitness-tracking app to show how **coding agents** in **Xcode 27** can support your entire development process. Building on the agents introduced in Xcode 26.3, Xcode 27 expands the available tools and redesigns how you interact with agents, with the goal of keeping you focused on the work you enjoy: you drive the vision for your code, and Xcode helps you get there faster and with more confidence.","The talk is organized around four ways of working. In **Explore**, an agent can see your whole project (source, build settings, open files, active selection), produce an architecture walkthrough, and capture that knowledge into living architecture documents in the project, while **Apple Document Search** pulls in up-to-date SwiftUI and SwiftData docs. In **Build**, you use **plan mode** to act as the architect, refine the plan through queued messages and agent questions, then approve it so the agent makes changes as reviewable artifacts and validates them with Xcode's Build, Preview, and Test tools (writing 12 passing tests in the demo).","In **Refine**, they add visualizations with **Swift Charts**, emphasizing that visual design is subjective and iterative: you can express intent with images and Freeform sketches, and use **inline annotations** to make precise, scoped changes pointed right at a spot in your source, while previews are rendered incrementally as a self-verification loop. In **Orchestrate**, two parallel conversations localize the app into Filipino and add VoiceOver labels: you describe a high-level goal and Xcode automatically discovers the right tools (like machine translation) and deploys sub-agents to execute the work in parallel.","The practical takeaway is that because agents turn ideas into features so quickly, the center of gravity shifts toward having the right plan first. Across exploring, building, refining, and orchestrating, Xcode keeps you in the driver's seat and gives agents the same validation tools you have (build, preview, test) so you can trust the code is correct. For deeper dives, see the \"Create UI Prototypes using Agents in Xcode\" and \"Translate your app with agents in Xcode\" sessions."],"deepdive_en":[{"t":0,"title":"Introduction","body":"**Devin** and **Maxwell** from the Xcode Intelligence team open by explaining that **Xcode 27** builds on the coding agents introduced in 26.3 by expanding the tools and redesigning agent interaction. The core idea is that you drive the vision for your code while Xcode helps you get there faster, adapting to users of any experience level. The session is structured around four modes: explore, build, refine, and orchestrate."},{"t":74,"title":"Meet the app","body":"The pair introduce the fitness-tracking app they are building, which already has a workout page to track exercises and a history section for previous sessions. Maxwell wants to see progress over time, which motivates the new **insights view**. Devin first uses an agent to get the app off the ground, setting up the work that follows."},{"t":126,"title":"Explore","body":"They open a new conversation in a separate editor pane (Option+Shift on the toolbar button) to explore the project. The agent sees the whole project context and produces a **walkthrough** with data-flow outlines, tables of key areas, and source references, which can be saved as two architecture documents forming a living knowledge base. The UI distinguishes the left-side transcript (conversation, tool calls, sub-agents) from right-side **artifacts** (files, edits, previews). **Apple Document Search** is invoked automatically to gather current SwiftUI tables and SwiftData documentation."},{"t":458,"title":"Build","body":"Using a slash command, they enter **plan mode** to act as the architect and plan the new workout insights tab, bringing in device-presentation details learned during explore. **Queued messages** and agent questions create a tight communication loop (choosing per-exercise and top-level summary presentations). After approving the plan, the agent shows diffs as artifacts and validates with Xcode's **build, preview, and test** tools; build errors are fed straight back so it can iterate, ultimately writing and passing 12 tests."},{"t":824,"title":"Refine","body":"They add visualizations with **Swift Charts**, stressing that chart look, animation, and color are subjective preferences that keep changing, so staying in the loop for every change matters. The demo generates previews of multiple chart types with artificial data (picking volume over time), then uses a **Freeform** sketch on iPad to convey the design, which the agent turns into a matching line chart. Finally, **inline annotations** are placed directly in the source to add a fade-in animation and adjust the trend-line color to match the app's theme."},{"t":1105,"title":"Orchestrate","body":"This section demonstrates **orchestration** with two parallel conversations: one to translate every user-facing string into Filipino and configure the strings catalog, another to add VoiceOver labels and accessibility identifiers to all interactive elements. You describe a high-level goal and Xcode automatically discovers the right tools (such as machine translation); the main conversation breaks the work into pieces and deploys **sub-agents** that each call the needed capabilities in parallel. Enabling VoiceOver confirms every primary element is labeled and navigable."},{"t":1329,"title":"Next steps","body":"They recap the capabilities used: exploring code and APIs with Xcode Tools and Apple Document Search, planning architecture with plan mode, validating with build/preview/test, refining with images and inline annotations, and orchestrating localization and accessibility with parallel sub-agents. The call to action is to download **Xcode 27** and try agents on your own project, and to check out the \"Create UI Prototypes using Agents in Xcode\" and \"Translate your app with agents in Xcode\" sessions."}],"code":[]},"related":[{"id":"121","title":"Announcing Apple’s next big step for Siri and iPhone","gloss":"宣布 Apple 為 Siri 與 iPhone 邁出的下一大步","gloss_en":"Announcing Apple's next big step for Siri and iPhone","category":"ai","categoryLabel":"AI 與機器學習"},{"id":"227","title":"Create UI prototypes using agents in Xcode","gloss":"在 Xcode 用代理人打造 UI 原型","gloss_en":"Prototype UI with agents in Xcode","category":"ai","categoryLabel":"AI 與機器學習"},{"id":"232","title":"Run local agentic AI on the Mac using MLX","gloss":"用 MLX 在 Mac 上執行本機 agentic AI","gloss_en":"Run local agentic AI on the Mac using MLX","category":"ai","categoryLabel":"AI 與機器學習"},{"id":"233","title":"Explore distributed inference and training with MLX","gloss":"用 MLX 探索分散式推論與訓練","gloss_en":"Explore distributed inference and training with MLX","category":"ai","categoryLabel":"AI 與機器學習"},{"id":"237","title":"What’s new in image understanding","gloss":"影像理解的新功能","gloss_en":"What's new in image understanding","category":"ai","categoryLabel":"AI 與機器學習"}]}</script>
