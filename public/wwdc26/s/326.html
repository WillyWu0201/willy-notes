<script id="d" type="application/json">{"s":{"id":"326","title":"Integrate on-device AI models into your app using Core AI","gloss":"用 Core AI 把裝置端 AI 模型整合進你的 App","category":"ai","categoryLabel":"AI 與機器學習","duration":1424,"url":"https://developer.apple.com/videos/play/wwdc2026/326/","takeaway":"用 Core AI 取得並執行一系列為 Apple silicon 最佳化的開源模型（如 Qwen、Mistral、SAM3），透過 FoundationModels 介面在裝置端推論，並用 AOT 編譯加速部署。","chapters":[[0,"Introduction"],[76,"App concept: camera-based vocab learning"],[172,"Model discovery"],[460,"Getting models with the Core AI models repository"],[517,"Integration"],[655,"Writing the Swift integration code"],[661,"Load and run SAM3 image segmentation"],[688,"Load a language model and create a session"],[749,"Generate structured output with @Generable"],[785,"Diagnosing model specialization latency"],[880,"Deployment"],[1020,"Ahead-of-time (AOT) compilation"],[1042,"Compile a Core AI model ahead of time"],[1083,"iOS demo"],[1197,"Multiplatform"],[1386,"Next steps"]],"points":[{"text":"**Core AI** 提供一系列為 **Apple silicon 最佳化的開源模型**（Qwen、Mistral、SAM3 等），可透過 Core AI models repository 取得。","hot":true},{"text":"影像分割用 `CoreAIImageSegmenter`（SAM3）以文字 prompt 取得遮罩；語言模型用 `CoreAILanguageModel` 建立 `LanguageModelSession`。","hot":false},{"text":"Core AI 語言模型可直接搭配 **`FoundationModels` 的 `@Generable`** 產生結構化輸出，重用既有的 Foundation Models API。","hot":false},{"text":"可用 **AOT（ahead-of-time）編譯**（`xcrun coreai-build compile`）預先編譯模型以降低特化延遲，並支援跨平台部署。","hot":false}],"apis":["CoreAI","CoreAIImageSegmenter","CoreAILanguageModels","CoreAILanguageModel","FoundationModels","LanguageModelSession","Generable","coreai-build"],"audience":"**想在裝置端整合開源大型語言模型或視覺模型、又希望沿用 Foundation Models 開發體驗的開發者**。","gloss_en":"Integrate on-device AI models with Core AI","takeaway_en":"Use Core AI to obtain and run a collection of open-source models optimized for Apple silicon (such as Qwen, Mistral, SAM3), inferring on-device through the FoundationModels interface and accelerating deployment with AOT compilation.","points_en":[{"text":"**Core AI** offers a collection of **open-source models optimized for Apple silicon** (Qwen, Mistral, SAM3, and more), available through the Core AI models repository.","hot":true},{"text":"For image segmentation, use `CoreAIImageSegmenter` (SAM3) to obtain masks from a text prompt; for language models, use `CoreAILanguageModel` to create a `LanguageModelSession`.","hot":false},{"text":"Core AI language models work directly with **`FoundationModels`' `@Generable`** to produce structured output, reusing your existing Foundation Models API.","hot":false},{"text":"Use **AOT (ahead-of-time) compilation** (`xcrun coreai-build compile`) to precompile models and reduce specialization latency, with support for cross-platform deployment.","hot":false}],"audience_en":"**Developers who want to integrate open-source large language or vision models on-device while keeping the Foundation Models development experience**.","summary":["Core AI 團隊的 Carina 示範如何用 **Core AI** 把熱門開源模型（Qwen、Mistral、SAM3 等）整合進 app，並完全在裝置上執行——資料不離開裝置、無伺服器、無 token 費用、無雲端延遲。貫穿全場的範例是一個相機式語言學習 app：使用者對著物件拍照並輸入提示，app 用視覺模型把物件從場景裡分割出來當作字卡圖，再用語言模型生成翻譯、例句與英文釋義。","在**模型探索**上，講者把問題拆成兩個小於 10 億參數的小模型：影像分割用 **SAM 3**（vision-transformer，依提示精準分割物件），多語言生成用 **Qwen 0.6B**（支援 119 種語言、具推理能力可生成情境例句）。取得模型有兩條路：用 Core AI PyTorch extensions 與 optimization 套件自行轉換，或直接到 **Core AI Models repository** 取得已轉成 Core AI 格式（`.aimodel`）並附轉換腳本與平台變體的熱門模型。","**整合**部分，repo 還提供一個 Swift package（runtime libraries），把 SAM3 的文字編碼、mask 抽取與標註等前後處理抽象掉，讓你只需呼叫乾淨的 Swift API。語言模型則只要一行 `CoreAILanguageModel(resourcesAt:)` 載入，再用熟悉的 **`LanguageModelSession`**（與 Apple 內建模型相同的 FoundationModels API）來 `respond(to:)`，並支援串流與用 **`@Generable`** 做結構化輸出（VocabCard）。透過新的 Core AI Instruments，講者發現首次載入慢在 **specialization**（為裝置準備模型執行）。","**部署**策略強調：作為既有 app 的更新，功能要可被發現但非必要。模型約 1GB，因此改用 **Background Assets** 在使用者真的想試時才下載，並在 first-run experience 把 specialization 移出互動流程。更進一步用 **`coreai-build`** 在開發機做 **ahead-of-time（AOT）編譯**，把最耗時的 compilation 預先完成，使用者裝置上只需少量特化即可快速完成。最後示範**多平台**：同一份程式碼搬到 macOS，因記憶體與算力更充裕，可換用更大的 Qwen3 8B 變體做批次處理、生成 pinyin 與課程規劃。"],"deepdive":[{"t":0,"title":"Introduction","body":"Core AI 團隊的 Carina 開場，介紹 **Core AI** 是把進階裝置端 AI 能力帶進 app 的新技術集合，特色是資料不離開裝置、無伺服器、無 token 費用、無雲端延遲。建議先看「Meet Core AI」了解設計理念。"},{"t":76,"title":"App concept: camera-based vocab learning","body":"提出範例 app 概念：學生對著生活中的物件拍照並輸入提示，app 即時把該物件從場景中拉出並生成該語言的字卡（翻譯、例句、英文釋義），完全在裝置上執行，先以中文為起點。"},{"t":172,"title":"Model discovery","body":"定義三項需求：內容（廚房／街道／辦公室等真實場景）、語言（架構需支援多語言）、裝置限制（小儲存與記憶體佔用）。結論是把問題拆成兩個專用小模型，各自小於 10 億參數，以兼顧品質、體積與可獨立升級。"},{"t":460,"title":"Getting models with the Core AI models repository","body":"說明取得模型的兩條路：用 **Core AI PyTorch extensions** 自行從 PyTorch 轉換並可搭配 optimization 壓縮，或直接到 **Core AI Models repository** 取用已轉成 Core AI 格式的熱門模型（含 SAM 3 與 Qwen 家族）及其 export recipe。"},{"t":517,"title":"Integration","body":"在 Xcode 中檢視匯出的 `.aimodel`（SAM3 為 623MB，targets iOS/macOS 27.0），其 Functions tab 顯示 imageEncode、detect 等以 tensor 為介面的函式，凸顯直接使用需大量前後處理，引出 repo 提供的 runtime libraries。"},{"t":655,"title":"Writing the Swift integration code","body":"示範把 coreai-models 加為 Swift Package 並選用 CoreAILM 與 CoreAISegmentation，runtime library 把文字編碼、mask 抽取與標註抽象掉，讓你只呼叫乾淨的 Swift API。"},{"t":661,"title":"Load and run SAM3 image segmentation","body":"用 `CoreAIImageSegmenter` 從磁碟載入 SAM 3，呼叫 `segment(image:prompt:)` 以文字提示（如 \"flower\"）做分割，再取出最佳 segmentation mask 當作字卡圖。"},{"t":688,"title":"Load a language model and create a session","body":"語言模型只要一行 `CoreAILanguageModel(resourcesAt:)` 即完成資產載入、引擎建立與 tokenizer 設定。注意這裡 import 的是 **FoundationModels**，並用同一個 `LanguageModelSession` API，只是換成自己的模型。"},{"t":749,"title":"Generate structured output with @Generable","body":"用 **`@Generable`** macro 描述 VocabCard 的欄位（word、translation、example sentence），以 guided generation 讓模型可靠地填入型別化欄位，而非自由形式文字。"},{"t":785,"title":"Diagnosing model specialization latency","body":"示範首次拍照時轉圈很久，用新的 **Core AI Instruments** 追蹤發現有 model load 事件與龐大的 **specialization** 子事件。specialization 是為裝置準備模型執行的過程，大型模型首次會耗時，之後從快取載入則很快。"},{"t":880,"title":"Deployment","body":"規劃部署策略：作為既有 app 的更新，功能要可被發現但非必要。發現模型若直接打包會讓下載多出超過 1GB，因此用 first-run experience 介紹功能，並用按鈕在使用者想試時才觸發下載。"},{"t":1020,"title":"Ahead-of-time (AOT) compilation","body":"說明 specialization 含 compilation 與產生 device 專屬可執行 artifact 兩步，compilation 最耗時。Core AI toolchain 可在開發機**預先**做 compilation，產生已編譯模型，使用者裝置上只剩少量特化工作。"},{"t":1042,"title":"Compile a Core AI model ahead of time","body":"用 **`coreai-build compile`** 指令把模型針對特定裝置架構預先編譯，並為每個編譯版本建立 background asset；app 端加少量程式碼偵測裝置架構並下載對應 asset，使準備時間大幅縮短。詳見 developer.apple.com 的相關文章。"},{"t":1083,"title":"iOS demo","body":"在 iOS 上實機示範：對著旅途收集的石頭、朋友贈送的木片、妹妹的向日葵拍照，模型生成例句並存入收藏；因 AOT 編譯，準備步驟大幅縮短，後續推論用快取 asset 達到無縫體驗。"},{"t":1197,"title":"Multiplatform","body":"把功能帶到 macOS：重用同一份程式碼，加上批次處理層一次處理整個資料夾的照片；因記憶體與算力更充裕，可換用更大的 **Qwen3 8B** 變體取得更好推理與更高品質輸出，甚至生成 pinyin 並把整類詞彙排成由淺入深的課程。"},{"t":1386,"title":"Next steps","body":"總結 Core AI 讓你打造多平台、資料不離開裝置、無伺服器、無 token 費用、無雲端延遲的 app 體驗，並表示模型與工具都已就緒，鼓勵動手在裝置上打造強大且私密的智慧功能。"}],"summary_en":["Carina from the Core AI team shows how to integrate popular open-source models (Qwen, Mistral, SAM3, and more) into an app with **Core AI**, running entirely on device — data never leaves the device, with no server, no per-token cost, and no cloud latency. The running example is a camera-based language-learning app: the user points the camera at an object and types a prompt, a vision model segments the object out of the scene for the card graphic, and a language model generates the translation, example sentence, and English meaning.","For **model discovery**, the problem is split into two sub-billion-parameter models: **SAM 3** (a vision transformer) for promptable image segmentation, and **Qwen 0.6B** for multilingual generation (119 languages, with reasoning for contextual examples). There are two paths to get models: convert them yourself with the Core AI PyTorch extensions and optimization packages, or grab them ready-made from the **Core AI Models repository** in Core AI format (`.aimodel`) with conversion recipes and optional platform variants.","For **integration**, the repo also ships a Swift package of runtime libraries that abstract away SAM3's text encoding, mask extraction, and labeling, so you just call a clean Swift API. The language model loads in one line — `CoreAILanguageModel(resourcesAt:)` — then you use the familiar **`LanguageModelSession`** (the same FoundationModels API as Apple's built-in model) to `respond(to:)`, with streaming and structured output via **`@Generable`** (a VocabCard). Using the new Core AI Instruments, the presenter finds the slow first load is **specialization** (preparing the model to run on the device).","The **deployment** strategy stresses making the feature discoverable but not required as an app update. Since the models add over 1GB, it uses **Background Assets** to download only when the user opts in, and a first-run experience to move specialization out of the interactive flow. Going further, **`coreai-build`** does **ahead-of-time (AOT) compilation** on the dev machine so the most expensive compilation is done up front, leaving only light specialization on-device. Finally, **multiplatform**: the same code runs on macOS, where more memory and compute allow a larger Qwen3 8B variant for batch processing, pinyin generation, and curriculum planning."],"deepdive_en":[{"t":0,"title":"Introduction","body":"Carina from the Core AI team opens, introducing **Core AI** as a new set of technologies for advanced on-device AI in apps, where data never leaves the device, with no server, no per-token cost, and no cloud latency. Recommends watching 'Meet Core AI' for the design philosophy."},{"t":76,"title":"App concept: camera-based vocab learning","body":"Pitches the example app: a student photographs a real-world object and types a prompt, and the app pulls that object out of the scene and generates a vocab card (translation, example, English meaning) entirely on device, starting with Mandarin Chinese."},{"t":172,"title":"Model discovery","body":"Defines three requirements: content (real-world scenes like kitchens, streets, offices), languages (architecture supporting multiple languages), and device constraints (small storage and memory footprint). The conclusion is to decompose into two task-specific sub-billion-parameter models for quality, size, and independent upgrades."},{"t":460,"title":"Getting models with the Core AI models repository","body":"Two paths to obtain models: convert from PyTorch with the **Core AI PyTorch extensions** (optionally compressed via the optimization package), or pull ready-converted popular models (SAM 3, Qwen family) and their export recipes from the **Core AI Models repository**."},{"t":517,"title":"Integration","body":"Inspects the exported `.aimodel` in Xcode (SAM3 is 623MB, targets iOS/macOS 27.0); its Functions tab shows tensor-interface functions like imageEncode and detect, highlighting the heavy pre/post-processing direct use would require — motivating the repo's runtime libraries."},{"t":655,"title":"Writing the Swift integration code","body":"Adds coreai-models as a Swift Package and selects CoreAILM and CoreAISegmentation; the runtime libraries abstract text encoding, mask extraction, and labeling so you just call a clean Swift API."},{"t":661,"title":"Load and run SAM3 image segmentation","body":"Uses `CoreAIImageSegmenter` to load SAM 3 from disk, calls `segment(image:prompt:)` with a text prompt (e.g. \"flower\"), and extracts the best segmentation mask as the card graphic."},{"t":688,"title":"Load a language model and create a session","body":"The language model loads in one line — `CoreAILanguageModel(resourcesAt:)` — handling asset loading, engine creation, and tokenizer setup. Note the import is **FoundationModels**, using the same `LanguageModelSession` API, just with your own model."},{"t":749,"title":"Generate structured output with @Generable","body":"Uses the **`@Generable`** macro to describe a VocabCard's fields (word, translation, example sentence), so guided generation reliably fills typed fields instead of producing free-form text."},{"t":785,"title":"Diagnosing model specialization latency","body":"Demonstrates a long spinner on first photo; the new **Core AI Instruments** trace reveals a model load event with a large **specialization** sub-event. Specialization prepares a model to run on device, is slow the first time for large models, but fast from cache afterward."},{"t":880,"title":"Deployment","body":"Plans the deployment strategy: as an app update, the feature should be discoverable but not required. Bundling the models would add over 1GB, so a first-run experience introduces the feature and a button triggers the download only if the user wants to try it."},{"t":1020,"title":"Ahead-of-time (AOT) compilation","body":"Explains specialization has two steps — compilation and generating device-specific executable artifacts — with compilation being the most expensive. The Core AI toolchain can do compilation **ahead of time** on the dev machine, leaving only light specialization on the user's device."},{"t":1042,"title":"Compile a Core AI model ahead of time","body":"Uses the **`coreai-build compile`** command to pre-compile the model for specific device architectures and creates a background asset per compiled model; a little app code detects the device architecture and requests the right asset, sharply cutting preparation time. See the article on developer.apple.com."},{"t":1083,"title":"iOS demo","body":"Live iOS demo: photographs travel rocks, a friend's piece of wood, and a sister's sunflower; the model produces example usage saved to the collection. Thanks to AOT compilation the preparation step is much shorter, and later inferences use the cached asset for a seamless experience."},{"t":1197,"title":"Multiplatform","body":"Brings the feature to macOS: reuses the same code, adds a batch-processing layer to handle a whole folder of photos at once, and — with more memory and compute — steps up to a larger **Qwen3 8B** variant for better reasoning, higher-quality output, pinyin generation, and sequencing a whole word category into a structured curriculum."},{"t":1386,"title":"Next steps","body":"Wraps up: Core AI enables a multiplatform app experience where user data never leaves the device, with no server, no per-token cost, and no cloud latency. The models and tools are ready — go build powerful, private on-device intelligence."}],"code":[]},"related":[{"id":"241","title":"What’s new in the Foundation Models framework","gloss":"Foundation Models 框架的新功能","gloss_en":"What's new in the Foundation Models framework","category":"ai","categoryLabel":"AI 與機器學習"},{"id":"319","title":"Build with the new Apple Foundation Model on Private Cloud Compute","gloss":"在 Private Cloud Compute 上使用全新 Apple Foundation Model 開發","gloss_en":"Build with the new Apple Foundation Model on Private Cloud Compute","category":"ai","categoryLabel":"AI 與機器學習"},{"id":"242","title":"Build agentic app experiences with the Foundation Models framework","gloss":"用 Foundation Models 框架打造 agentic App 體驗","gloss_en":"Build agentic app experiences with Foundation Models","category":"ai","categoryLabel":"AI 與機器學習"},{"id":"246","title":"LLM search using Core Spotlight","gloss":"使用 Core Spotlight 的 LLM 搜尋","gloss_en":"LLM search using Core Spotlight","category":"ai","categoryLabel":"AI 與機器學習"},{"id":"339","title":"Bring an LLM provider to the Foundation Models framework","gloss":"把 LLM 供應商接入 Foundation Models 框架","gloss_en":"Bring an LLM provider to the Foundation Models framework","category":"ai","categoryLabel":"AI 與機器學習"}]}</script>
