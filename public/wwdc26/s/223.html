<script id="d" type="application/json">{"s":{"id":"223","title":"Live Activities essentials","gloss":"Live Activities 核心要點","category":"swiftui","categoryLabel":"SwiftUI","duration":916,"url":"https://developer.apple.com/videos/play/wwdc2026/223/","takeaway":"用 ActivityKit 從零打造、更新並最佳化 **Live Activity**，涵蓋 Dynamic Island、StandBy、新的 small 樣式與 App Intents 互動。","chapters":[[1,"Introduction"],[113,"Create and update"],[256,"Define initial Live Activity"],[335,"Create each Live Activity view"],[463,"Start and update a Live Activity"],[591,"Optimize"],[633,"Optimize for limited width in the Dynamic Island"],[694,"Extend background color in StandBy"],[750,"Add support for activityFamily small"],[763,"Optimize for small family"],[816,"Add interactivity with App Intents"],[846,"Associate an intent with a button"]],"points":[{"text":"以 `ActivityAttributes` 與 `ContentState` 定義資料，並用 `ActivityConfiguration` 與 **Dynamic Island** 各區域建立 Live Activity 視圖。","hot":false},{"text":"透過 `Activity.request` 啟動、`activity.update` 更新內容，先以 `ActivityAuthorizationInfo` 確認已啟用。","hot":false},{"text":"新增對 **`activityFamily` small** 樣式的支援（`supplementalActivityFamilies([.small])`），可依 `activityFamily` 環境值客製化呈現。","hot":true},{"text":"用 `isDynamicIslandLimitedInWidth` 與 `showsWidgetContainerBackground` 等環境值，最佳化 Dynamic Island 窄版與 **StandBy** 背景。","hot":false},{"text":"以 `LiveActivityIntent` 加入互動，將 intent 綁定到 `Button(intent:)` 直接在 Live Activity 上操作。","hot":false}],"apis":["ActivityKit","ActivityAttributes","ActivityConfiguration","DynamicIsland","WidgetKit","Activity","ActivityContent","LiveActivityIntent","supplementalActivityFamilies","activityFamily"],"audience":"**想加入或精進 Live Activity 與 Dynamic Island** 的 iOS 開發者。","gloss_en":"Live Activities essentials","takeaway_en":"Build, update, and optimize a **Live Activity** from scratch with ActivityKit, covering Dynamic Island, StandBy, the new small style, and App Intents interaction.","points_en":[{"text":"Define data with `ActivityAttributes` and `ContentState`, and build the Live Activity views with `ActivityConfiguration` and the **Dynamic Island** regions.","hot":false},{"text":"Start with `Activity.request` and update content with `activity.update`, after confirming it's enabled via `ActivityAuthorizationInfo`.","hot":false},{"text":"Adds support for the **`activityFamily` small** style (`supplementalActivityFamilies([.small])`), letting you customize presentation based on the `activityFamily` environment value.","hot":true},{"text":"Use environment values like `isDynamicIslandLimitedInWidth` and `showsWidgetContainerBackground` to optimize the narrow Dynamic Island and the **StandBy** background.","hot":false},{"text":"Add interactivity with `LiveActivityIntent`, binding the intent to `Button(intent:)` to act directly on the Live Activity.","hot":false}],"audience_en":"iOS developers **looking to add or refine Live Activities and Dynamic Island**.","deepdive":[{"t":1,"title":"Introduction","body":"由系統體驗工程師 Adi 開場，定義 **Live Activities** 是 app 提供「此刻正在發生」之即時、可一眼掌握資訊的方式（以 MLB 比分為例）。內容會出現在 Lock Screen 與 **Dynamic Island**，長按或有 alert 更新時可展開。iOS 27 起 Dynamic Island 在直向與橫向皆可見，並會自動延伸到 **StandBy**、Apple Watch Smart Stack、macOS 選單列與 CarPlay。"},{"t":113,"title":"Create and update","body":"本場路線圖：先規劃**資料模型**讓更新快速有效率，再建立各種呈現的基本 view，最後在 app 前景執行時或透過背景推播提供更新。以一個咖啡訂單 app 作為貫穿範例。"},{"t":256,"title":"Define initial Live Activity","body":"資料模型的核心是區分**靜態與動態資料**：永不改變的放進符合 **`ActivityAttributes`** 的 struct（咖啡店名、飲品、訂單 id），會隨時間變動的放進 **`ContentState`**（訂單階段、預估完成時間、評分）。只有 ContentState 能在 Live Activity 存活期間被更新，這樣才能做到高效更新。記得 `import ActivityKit`。"},{"t":335,"title":"Create each Live Activity view","body":"介面用 **WidgetKit** 建構：加入 widget extension 並提供 **`ActivityConfiguration`**，每個呈現都是讀取 `context`（attributes ＋ 最新 content state）的 SwiftUI view。Dynamic Island 需提供 `compactLeading`、`compactTrailing`、`minimal` 三種小型 view，以及由多個 **`DynamicIslandExpandedRegion`** 組成、環繞感測器的展開 view。"},{"t":463,"title":"Start and update a Live Activity","body":"啟動方式有三：app 前景時用 ActivityKit 直接啟動、預約於特定時間啟動、或由推播啟動。範例先檢查授權，建立 attributes 與初始 `contentState`（設定 ordered 階段與 15 分鐘的預估完成時間），並介紹 **`staleDate`** 用來標記內容何時過期。之後呼叫 `.update` 帶入新的 ContentState 與 staleDate 即可更新。"},{"t":591,"title":"Optimize","body":"進入最佳化主題的概觀：講者接著會示範如何加入更客製化的呈現，以及為 view 帶來互動性。"},{"t":633,"title":"Optimize for limited width in the Dynamic Island","body":"iOS 27 的 compact／minimal view 在直向與橫向都會顯示，但橫向時寬度無法增長。解法是讀取 **`isDynamicIslandLimitedInWidth`** environment 值，在寬度受限時改顯示較精簡的替代 trailing view（例如以進度圖示取代文字標籤）。"},{"t":694,"title":"Extend background color in StandBy","body":"**StandBy**（橫向充電）會把 Lock Screen view 放大到 200%，原本的漸層背景會留下大片空白。解法是讀取 **`showsWidgetContainerBackground`** environment 值：在 Lock Screen（值為 true）套用漸層 `.background`，其餘情境改用 **`.activityBackgroundTint`** 設定可辨識的背景色，讓 StandBy 呈現滿版色塊。"},{"t":750,"title":"Add support for activityFamily small","body":"Live Activities 也會出現在 Apple Watch 的 Smart Stack 與 CarPlay。預設會直接轉送 iPhone 的 view，但在小空間中並不合身，因此需先**宣告支援 small activity family**，向系統表明你的 view 已為較小格式調整過。"},{"t":763,"title":"Optimize for small family","body":"實作上讀取 **`activityFamily`** environment 值，當其為 `.small` 時提供專為此情境客製的 view，讓 Live Activity 在 Apple Watch 與 CarPlay 上也能呈現得宜。"},{"t":816,"title":"Add interactivity with App Intents","body":"用 **App Intents** 加入互動：每個按鈕關聯一個 intent，點擊時系統執行對應 intent。範例的 `RateDrinkIntent` 符合 **`LiveActivityIntent`**，帶入訂單 ID 與表示好評與否的布林值，實際邏輯（回傳評分給 server、更新資料庫）寫在 `perform` 方法中。"},{"t":846,"title":"Associate an intent with a button","body":"最後把 intent 接上按鈕：在同時用於 ActivityView 與 DynamicIslandExpandedRegion 的 `RatingButtons` view 中，為每個動作建立一個帶對應 `RateDrinkIntent` 的 `Button(intent:)`，使用者一點即觸發評分流程。"}],"summary":["**Live Activities** 讓 app 提供「此刻正在發生」的即時、可一眼掌握的更新。它顯示在 **Lock Screen** 與 **Dynamic Island**，長按或有 alert 時可展開；iOS 27 起在直向與橫向都看得到，並會自動延伸到 **StandBy**、Apple Watch 的 Smart Stack、macOS 選單列與 CarPlay，無需額外開發。","導入分三步。第一步規劃**資料模型**，關鍵是區分靜態與動態：不變的資料放進符合 **`ActivityAttributes`** 的 struct，會變的放進 **`ContentState`**（只有後者能在存活期間更新，以達成高效更新）。第二步用 **WidgetKit** 的 **`ActivityConfiguration`** 建立各種呈現的 SwiftUI view，包含 Lock Screen 與 Dynamic Island 的 `compactLeading`／`compactTrailing`／`minimal`／expanded 各區。第三步用 **ActivityKit** 在前景啟動並以 `.update` 更新，或改用推播（大量同時更新用 broadcast channel、其餘用個別 push token）。","最後是讓它在各處都好看的最佳化：橫向寬度受限時讀 **`isDynamicIslandLimitedInWidth`** 換精簡 view；StandBy 用 **`showsWidgetContainerBackground`** 搭配 **`.activityBackgroundTint`** 做滿版背景；要上 Apple Watch 與 CarPlay 則宣告並實作 **`activityFamily` `.small`**；並可用 **App Intents**（`LiveActivityIntent`）替按鈕加入即時互動，例如直接在 Live Activity 上替訂單評分。"],"summary_en":["**Live Activities** let apps surface timely, glanceable updates about something happening right now. They appear on the **Lock Screen** and in the **Dynamic Island**, expanding on long-press or alerting updates. In iOS 27 the Dynamic Island shows them in both portrait and landscape, and they automatically extend to **StandBy**, the Apple Watch Smart Stack, the macOS menu bar, and CarPlay with no extra work.","Adoption is three steps. First, plan the **data model**, separating static from dynamic data: unchanging values go in a struct conforming to **`ActivityAttributes`**, while changing values go in a separate **`ContentState`** (only the latter can be updated during the activity's lifetime, which keeps updates efficient). Second, build the SwiftUI views for each presentation with **WidgetKit**'s **`ActivityConfiguration`**, including the Lock Screen view and the Dynamic Island `compactLeading`/`compactTrailing`/`minimal` and expanded regions. Third, start and update with **ActivityKit** via `.update`, or use push (a broadcast channel for mass simultaneous updates, individual push tokens otherwise).","Finally, optimize for every surface: read **`isDynamicIslandLimitedInWidth`** to swap in a compact trailing view in landscape; use **`showsWidgetContainerBackground`** with **`.activityBackgroundTint`** for an edge-to-edge background in StandBy; declare and implement **`activityFamily` `.small`** for Apple Watch and CarPlay; and add live interactivity with **App Intents** (`LiveActivityIntent`), such as rating a drink order directly from the Live Activity."],"deepdive_en":[{"t":1,"title":"Introduction","body":"System Experience Engineer Adi opens by defining **Live Activities** as the way apps provide timely, glanceable info about what's happening now (MLB scores as the example). They appear on the Lock Screen and in the **Dynamic Island**, expanding on long-press or alerting updates. From iOS 27 the Dynamic Island shows them in portrait and landscape, and they extend automatically to **StandBy**, the Apple Watch Smart Stack, the macOS menu bar, and CarPlay."},{"t":113,"title":"Create and update","body":"The roadmap: plan a **data model** for fast, efficient updates, build the basic views for each key presentation, then deliver updates from the running app or via background push. A coffee-order app serves as the running example."},{"t":256,"title":"Define initial Live Activity","body":"The data model hinges on splitting **static vs. dynamic data**: never-changing values go in a struct conforming to **`ActivityAttributes`** (shop name, drink, order id), and values that change over time go in **`ContentState`** (order phase, estimated ready time, rating). Only ContentState can be updated while the activity is alive, enabling efficient updates. Remember `import ActivityKit`."},{"t":335,"title":"Create each Live Activity view","body":"The UI is built with **WidgetKit**: add a widget extension and provide an **`ActivityConfiguration`**, where each presentation is a SwiftUI view reading `context` (attributes plus latest content state). The Dynamic Island needs `compactLeading`, `compactTrailing`, and `minimal` views plus an expanded view composed of multiple **`DynamicIslandExpandedRegion`** blocks around the sensors."},{"t":463,"title":"Start and update a Live Activity","body":"Three ways to start: directly via ActivityKit while the app is foregrounded, scheduled in advance, or from a push. The example checks authorization, builds attributes and an initial `contentState` (ordered phase, 15-minute estimated ready time), and introduces **`staleDate`** to mark when content is out of date. Calling `.update` with a new ContentState and staleDate refreshes it."},{"t":591,"title":"Optimize","body":"A brief overview of the optimization section: the speaker will next show how to add more customized presentations and bring interactivity to the views."},{"t":633,"title":"Optimize for limited width in the Dynamic Island","body":"In iOS 27 compact/minimal views show in both orientations, but landscape can't grow in width. The fix is reading the **`isDynamicIslandLimitedInWidth`** environment value and, when constrained, showing a more compact alternate trailing view (e.g., a progress icon instead of a text label)."},{"t":694,"title":"Extend background color in StandBy","body":"**StandBy** (charging in landscape) scales the Lock Screen view to 200%, leaving the gradient background looking small with blank space. The fix reads the **`showsWidgetContainerBackground`** environment value: apply the gradient `.background` on the Lock Screen (true) and use **`.activityBackgroundTint`** elsewhere for a recognizable edge-to-edge color in StandBy."},{"t":750,"title":"Add support for activityFamily small","body":"Live Activities also appear in the Apple Watch Smart Stack and CarPlay. By default the iPhone view is forwarded but doesn't fit the smaller space, so you first **declare support for the small activity family** to tell the system your views are adapted for that format."},{"t":763,"title":"Optimize for small family","body":"In code, read the **`activityFamily`** environment value and, when it's `.small`, provide a view tailored to that context so the Live Activity looks great on Apple Watch and CarPlay."},{"t":816,"title":"Add interactivity with App Intents","body":"Add interactivity with **App Intents**: each button is associated with an intent the system runs on tap. The example's `RateDrinkIntent` conforms to **`LiveActivityIntent`** and takes an order ID and a boolean for positive/negative rating, with the real work (sending the rating to the server, updating the database) in `perform`."},{"t":846,"title":"Associate an intent with a button","body":"Finally wire the intent to a button: in the `RatingButtons` view used by both ActivityView and DynamicIslandExpandedRegion, add a `Button(intent:)` per action carrying its own `RateDrinkIntent`, so a single tap triggers the rating flow."}],"code":[]},"related":[{"id":"277","title":"WidgetKit foundations","gloss":"WidgetKit 基礎入門","gloss_en":"WidgetKit foundations","category":"swiftui","categoryLabel":"SwiftUI"},{"id":"269","title":"What’s new in SwiftUI","gloss":"SwiftUI 的新功能","gloss_en":"What's new in SwiftUI","category":"swiftui","categoryLabel":"SwiftUI"},{"id":"271","title":"Code-along: Build powerful drag and drop in SwiftUI","gloss":"程式碼共做：在 SwiftUI 打造強大的拖放功能","gloss_en":"Code-along: Build powerful drag and drop in SwiftUI","category":"swiftui","categoryLabel":"SwiftUI"},{"id":"272","title":"Use SwiftUI with AppKit and UIKit","gloss":"在 AppKit 與 UIKit 中使用 SwiftUI","gloss_en":"Use SwiftUI with AppKit and UIKit","category":"swiftui","categoryLabel":"SwiftUI"},{"id":"275","title":"Code-along: Add persistence with SwiftData","gloss":"程式碼實作：用 SwiftData 加入持久化","gloss_en":"Code-along: Add persistence with SwiftData","category":"swiftui","categoryLabel":"SwiftUI"}]}</script>
