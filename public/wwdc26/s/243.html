<script id="d" type="application/json">{"s":{"id":"243","title":"Debug and profile agentic app experiences with Instruments","gloss":"用 Instruments 除錯與分析代理式 App 體驗","category":"ai","categoryLabel":"AI 與機器學習","duration":860,"url":"https://developer.apple.com/videos/play/wwdc2026/243/","takeaway":"用 Xcode 強化版的 FoundationModels instrument 錄製追蹤、檢視代理流程行為並最佳化其效能。","chapters":[[0,"Introduction"],[117,"LLM app development mindset"],[239,"Inspect and diagnose an agentic experience"],[302,"Recording a trace with Instruments"],[364,"Navigating the Instruments UI"],[727,"Performance metrics"],[784,"Next steps"]],"points":[{"text":"使用 Xcode 中強化的 **FoundationModels instrument**，檢視並診斷**代理式（agentic）流程**的行為與效能。","hot":true},{"text":"建立適合 **LLM App 開發的心態**，理解非確定性流程需要不同的觀察與除錯方式。","hot":false},{"text":"用 **Instruments** 錄製追蹤（trace），並透過其 UI 逐步檢視代理執行的每個環節。","hot":false},{"text":"解讀**效能指標（performance metrics）**，找出延遲與瓶頸並加以最佳化。","hot":false}],"apis":["Instruments","FoundationModels"],"audience":"**正在用 Foundation Models 打造代理式或 LLM 功能**、需要除錯與最佳化效能的開發者。","gloss_en":"Debug and profile agentic app experiences with Instruments","takeaway_en":"Use Xcode's enhanced FoundationModels instrument to record traces, inspect agentic flow behavior, and optimize its performance.","points_en":[{"text":"Use the enhanced **FoundationModels instrument** in Xcode to inspect and diagnose the behavior and performance of **agentic flows**.","hot":true},{"text":"Build the right **mindset for LLM app development**, understanding that non-deterministic flows need a different approach to observation and debugging.","hot":false},{"text":"Record a trace with **Instruments** and step through every part of the agent's execution in its UI.","hot":false},{"text":"Interpret **performance metrics** to find latency and bottlenecks and optimize them.","hot":false}],"audience_en":"Developers **building agentic or LLM features with Foundation Models** who need to debug and optimize performance.","summary":["用 **Foundation Models** 框架打造的功能和傳統開發最大的不同，在於 LLM 的輸出是**非決定性的（probabilistic）**：同樣的輸入可能得到完全不同的回應，傳統的單元測試（斷言輸出等於固定字串）因此失效，你必須改為評估回應的品質與意圖。更棘手的是，強大的 agentic 功能往往倚賴**多模型協作**與**工具呼叫（tool calls）**，每多一個步驟就多一份延遲、也多一個可能失敗的環節，而失敗常常是「靜默」的——模型持續接受輸入、持續呼叫工具，卻從不拋出錯誤，讓問題極難追查。這正是本場次主角、Xcode 中強化版 **Foundation Models instrument** 要解決的觀測性（observability）問題。","講者以自製的 Craft 手作筆記 App 為例，示範一個互動式腦力激盪功能：使用者先與模型對話發想要做的手作，決定後 App 再切換到教學模式產生詳細步驟。這個功能用到兩組 instructions（brainstorming 與 tutorial generation）與兩個工具（**GenerateCraftIdeaTool** 與 **SwitchToTutorialModeTool**），都跑在 Private Cloud Compute 的伺服器模型上。透過 Product → Profile 選 Foundation Models 範本錄製 trace 後，timeline 的 **Instructions lane** 立刻揭露 bug：整個 session 只有一組 instructions 在作用，模式切換根本沒發生。","深入右側的 tree view（依 sessions、requests、model inferences、instructions、prompts、responses 階層展開）後，根因浮現：prompt 引用了 switchToTutorialMode 工具，但該工具其實沒有被掛進這組 instructions 的 toolset，模型因此卡在 brainstorm 迴圈裡。回到 Xcode 在 **BrainstormDynamicInstructions** 補上缺漏的工具、重新錄製，Instructions lane 就正確顯示兩組 instructions 接力，確認修復成功。","最後場次帶到效能優化的三個關鍵指標：**Time to First Token**（從送出 prompt 到開始產生回應的時間，太高代表使用者盯著空白畫面，可縮短 prompt 來改善）、**Tokens per Second**（整體產生速度，用來比較不同 prompt 設定並抓回歸）、以及 **Total Latency**（送出到收到完整回應的總時間，最能被使用者感受，建議用串流盡早呈現部分結果）。實務帶走的重點：先跑 trace，讓 model inference 節點的 token 與耗時數據告訴你時間花在哪，再對症下藥；安裝 Xcode 27 並把裝置更新到最新 OS 即可開始使用，且此 instrument 支援任何搭配 Foundation Models 使用的模型。"],"deepdive":[{"t":0,"title":"Introduction","body":"開場點出 **Foundation Models** API 讓 App 直接取用裝置端與伺服器端的生成式 AI，最好的體驗會依情境**動態調整**而非靜態。**DynamicInstructions** 讓你精準指定模型每次請求可存取的 instructions 與工具，並在每次請求前重新評估——這份彈性帶來回應性，卻也讓功能更難除錯。本場次目標就是教你用 Instruments 找出並修正這類問題。"},{"t":117,"title":"LLM app development mindset","body":"點明用 LLM 開發的三大挑戰：**probabilistic output**（同 prompt 可能有不同輸出，使傳統斷言式單元測試失效）、**model-to-model communication**（多模型協作時資料如何可靠流動與優雅復原），以及 **observability**（多模型管線出錯時難以定位）。並拆解 LLM 應用核心迴圈：使用者送 prompt、模型推理並呼叫工具、工具執行、模型彙整結果產生回應，這個迴圈是理解整個 instrument 的基礎。"},{"t":239,"title":"Inspect and diagnose an agentic experience","body":"以 Craft App 的腦力激盪功能為實例：使用者與模型對話發想手作，決定後切換到教學模式產生步驟。功能用到 brainstorming 與 tutorial generation 兩組 instructions、**GenerateCraftIdeaTool** 與 **SwitchToTutorialModeTool** 兩個工具，皆跑在 Private Cloud Compute 伺服器模型上，為後續用 Instruments 診斷鋪陳場景。"},{"t":302,"title":"Recording a trace with Instruments","body":"示範從 Product → Profile 讓 Xcode 在本機建置 App，於範本選擇器挑 **Foundation Models** 範本並 Record。特別提醒此 instrument 會擷取 prompt 與 response 資料、可能含敏感資訊，雖然正式環境關閉 logging，但 trace 期間會開啟，故 trace 檔需妥善保存。實測時模型選了 Paper Butterfly 卻沒進入教學模式、只給更多點子，顯示出 bug。"},{"t":364,"title":"Navigating the Instruments UI","body":"介紹 Instruments 介面：上方 tracks 在時間軸顯示活動、每個 track 含多條 lane，下方 detail view 顯示所選範圍摘要，點選後右側 inspector 展開細節。Foundation Models instrument 有 6 條 lane，其中 **Instructions lane** 顯示某組 instructions 與工具作用多久——此例只見一組 instructions 全程作用，揭露模式交接出錯；**Model Inference lane** 以黃色（處理輸入 prompt）與橘色（產生回應）長條呈現耗時。配合 tree view 逐層展開可追出 instruction set 從未改變的原因：prompt 引用了 switchToTutorialMode 但該工具未掛進這組 instructions，且這是無錯誤拋出的**靜默失敗**。"},{"t":727,"title":"Performance metrics","body":"在 model inference 節點檢視 metrics 與 duration，帶出三個效能指標：**Time to First Token**（開始回應前的等待，縮短 prompt 可降低）、**Tokens per Second**（產生速度，用於跨設定比較與抓回歸）、**Total Latency**（端到端總時間，使用者最有感，建議用串流提前呈現部分結果）。這些數字是定位時間與資源去向、決定優化方向的起點。"},{"t":784,"title":"Next steps","body":"建議除錯之後接著探索評估，可觀看「Meet the Evaluations framework」用結構化評估衡量並改善 prompt 品質。實作前置：安裝 **Xcode 27**、把要 profile 的裝置更新到最新 OS；此 instrument 支援任何搭配 Foundation Models 使用的模型，並建議搭配 agentic 相關場次與框架文件深入。"}],"summary_en":["Building features with the **Foundation Models** framework differs fundamentally from traditional development because LLM output is **probabilistic**: the same input can yield completely different responses, so traditional unit tests that assert against a fixed string break down, and you must instead evaluate the quality and intent of a response. Powerful agentic features compound this by relying on **model-to-model communication** and **tool calls**, where every extra step adds latency and a new place to fail—and failures are often silent, with the model accepting input and calling tools yet never throwing an error, making bugs very hard to catch. This is exactly the observability problem the enhanced **Foundation Models instrument** in Xcode is built to solve.","The speaker demonstrates with a homegrown Craft journaling app: an interactive brainstorming feature where the user converses with the model to refine craft ideas, then the app switches to tutorial mode to generate detailed steps. The feature uses two instruction sets (brainstorming and tutorial generation) and two tools (**GenerateCraftIdeaTool** and **SwitchToTutorialModeTool**), all running on the Private Cloud Compute server model. After recording a trace via Product → Profile with the Foundation Models template, the **Instructions lane** in the timeline immediately reveals the bug: only one instruction set was active for the whole session, so the mode switch never happened.","Digging into the tree view on the right (organized as sessions, requests, model inferences, instructions, prompts, and responses) surfaces the root cause: the prompt references the switchToTutorialMode tool, but that tool was never added to this instruction set's toolset, trapping the model in the brainstorm loop. Returning to Xcode to add the missing tool in **BrainstormDynamicInstructions** and re-recording makes the Instructions lane correctly show two instruction sets handing off, confirming the fix.","The session closes on three key performance metrics: **Time to First Token** (how long until the model begins responding—high values leave people staring at a blank screen, reducible by shortening the prompt), **Tokens per Second** (overall generation speed, useful for benchmarking prompt configurations and catching regressions), and **Total Latency** (full request-to-response time, the number people feel most, best mitigated with streaming to surface partial results sooner). The practical takeaway: run a trace first and let the model inference node's token and duration data show where time goes, then fix accordingly; install Xcode 27, update your device to the latest OS, and note this instrument supports any model you use with Foundation Models."],"deepdive_en":[{"t":0,"title":"Introduction","body":"The opening notes that **Foundation Models** APIs give your app direct access to on-device and server-based generative AI, and that the best experiences adapt to context rather than being static. **DynamicInstructions** lets you specify exactly which instructions and tools the model can access, re-evaluating before every request—flexibility that drives responsiveness but also makes features harder to debug. The session's goal is to teach you to identify and fix those issues with Instruments."},{"t":117,"title":"LLM app development mindset","body":"This chapter frames the three challenges of building with LLMs: **probabilistic output** (the same prompt can produce different results, breaking assertion-style unit testing), **model-to-model communication** (reliably flowing data between models and recovering gracefully), and **observability** (locating failures in a multi-model pipeline). It also breaks down the core LLM loop—prompt, reasoning plus tool call, tool action, final response—which is the basis for everything the instrument shows."},{"t":239,"title":"Inspect and diagnose an agentic experience","body":"Using the Craft app's brainstorming feature as a concrete case: the user converses with the model to refine craft ideas, then the app switches to tutorial mode. The feature relies on two instruction sets (brainstorming and tutorial generation), the **GenerateCraftIdeaTool** and **SwitchToTutorialModeTool**, all running on the Private Cloud Compute server model—setting the stage for diagnosis with Instruments."},{"t":302,"title":"Recording a trace with Instruments","body":"Demonstrates recording via Product → Profile, letting Xcode build locally, choosing the **Foundation Models** template, and clicking Record. It warns that this instrument captures prompt and response data that may contain sensitive information—logging is off in production but on during a trace, so trace files must be kept safe. In the run, the model picks Paper Butterfly but fails to enter tutorial mode and just offers more ideas, exposing the bug."},{"t":364,"title":"Navigating the Instruments UI","body":"Introduces the UI: tracks show activity on the timeline with multiple lanes each, the detail view below summarizes the selected range, and clicking opens the inspector on the right. The Foundation Models instrument has six lanes; the **Instructions lane** shows how long an instruction set and its tools were active—here only one set ran the whole session, revealing the broken handoff—while the **Model Inference lane** uses yellow bars (input prompt processing) and orange bars (response generation). The tree view then traces why the instruction set never changed: the prompt references switchToTutorialMode but that tool wasn't configured with these instructions, and it was a **silent failure** that threw no error."},{"t":727,"title":"Performance metrics","body":"Inspecting metrics and duration on the model inference node introduces three performance measures: **Time to First Token** (the wait before a response begins, reducible by shortening the prompt), **Tokens per Second** (generation speed, used to benchmark configurations and catch regressions), and **Total Latency** (end-to-end time people feel most, best improved with streaming to surface partial results). These numbers are the starting point for understanding where time and resources go and pointing toward the right fix."},{"t":784,"title":"Next steps","body":"Recommends exploring evaluation after debugging—watch \"Meet the Evaluations framework\" to measure and improve prompt quality with structured evaluation. To get started, install **Xcode 27** and update the device you profile on to the latest OS; the instrument supports any model used with the Foundation Models framework, and pairs with related agentic sessions and the full documentation."}],"code":[]},"related":[{"id":"237","title":"What’s new in image understanding","gloss":"影像理解的新功能","gloss_en":"What's new in image understanding","category":"ai","categoryLabel":"AI 與機器學習"},{"id":"241","title":"What’s new in the Foundation Models framework","gloss":"Foundation Models 框架的新功能","gloss_en":"What's new in the Foundation Models framework","category":"ai","categoryLabel":"AI 與機器學習"},{"id":"242","title":"Build agentic app experiences with the Foundation Models framework","gloss":"用 Foundation Models 框架打造 agentic App 體驗","gloss_en":"Build agentic app experiences with Foundation Models","category":"ai","categoryLabel":"AI 與機器學習"},{"id":"246","title":"LLM search using Core Spotlight","gloss":"使用 Core Spotlight 的 LLM 搜尋","gloss_en":"LLM search using Core Spotlight","category":"ai","categoryLabel":"AI 與機器學習"},{"id":"319","title":"Build with the new Apple Foundation Model on Private Cloud Compute","gloss":"在 Private Cloud Compute 上使用全新 Apple Foundation Model 開發","gloss_en":"Build with the new Apple Foundation Model on Private Cloud Compute","category":"ai","categoryLabel":"AI 與機器學習"}]}</script>
