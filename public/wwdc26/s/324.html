<script id="d" type="application/json">{"s":{"id":"324","title":"Meet Core AI","gloss":"認識 Core AI","category":"ai","categoryLabel":"AI 與機器學習","duration":1243,"url":"https://developer.apple.com/videos/play/wwdc2026/324/","takeaway":"Core AI 是 Apple 全新的裝置端 AI 模型部署框架，從 PyTorch 轉檔到 Swift 推論一條龍。","chapters":[[0,"Introduction"],[33,"What is Core AI"],[297,"Model conversion"],[308,"Convert a PyTorch model to Core AI"],[344,"Verify converted model numerics"],[376,"App integration"],[461,"Core AI framework core types"],[513,"Initialize ModelPlayer with AIModel"],[529,"Run inference with NDArray inputs"],[610,"Input features for the snake model"],[648,"Profiling with Instruments"],[675,"Optimizing performance"],[738,"Add KV cache buffers to PyTorch module"],[770,"Update forward pass to read/write KV caches"],[779,"Re-convert model with state names"],[797,"Store KV cache NDArrays in ModelPlayer"],[825,"Pass state views to inference function"],[853,"Additional features"],[934,"Specialization"],[982,"Check model cache before loading"],[1002,"Request model specialization"],[1207,"Next steps"]],"points":[{"text":"**Core AI** 是 Apple 全新的裝置端 AI 模型部署框架，涵蓋從轉檔、整合到推論的完整生態。","hot":true},{"text":"用 Python 的 **coreai_torch.TorchConverter** 把 PyTorch 模型轉成 **.aimodel** 資產，並可驗證轉檔前後的數值一致性。","hot":false},{"text":"App 端以 **AIModel** 載入模型、**InferenceFunction** 取得推論函式，並用 **NDArray** 餵入與取出資料。","hot":false},{"text":"為 Transformer 加上 **KV cache** 狀態並重新轉檔，可顯著優化逐 token 的推論效能。","hot":false},{"text":"透過 **AIModelCache** 檢查快取並用 **AIModel.specialize** 預先特化模型，搭配 Instruments 進行效能剖析。","hot":false}],"apis":["CoreAI","coreai_torch","TorchConverter","AIModel","InferenceFunction","NDArray","AIModelCache","ModelPlayer"],"audience":"想把 **PyTorch 模型部署到 Apple 裝置端執行**、追求效能與低延遲的 ML 與 App 開發者。","gloss_en":"Meet Core AI","takeaway_en":"Core AI is Apple's new on-device AI model deployment framework, end to end from PyTorch conversion to Swift inference.","points_en":[{"text":"**Core AI** is Apple's new on-device AI model deployment framework, covering the full ecosystem from conversion to integration to inference.","hot":true},{"text":"Use Python's **coreai_torch.TorchConverter** to convert PyTorch models into **.aimodel** assets, and verify numerical consistency before and after conversion.","hot":false},{"text":"On the app side, load the model with **AIModel**, get the inference function with **InferenceFunction**, and feed data in and out with **NDArray**.","hot":false},{"text":"Adding **KV cache** state to a Transformer and re-converting can significantly optimize per-token inference performance.","hot":false},{"text":"Inspect the cache with **AIModelCache** and pre-specialize models with **AIModel.specialize**, profiling performance with Instruments.","hot":false}],"audience_en":"ML and app developers **who want to deploy PyTorch models to run on-device on Apple platforms** and care about performance and low latency.","summary":["**Core AI** 是 Apple 全新的端側 AI 推論框架，也是驅動 on-device **Apple Intelligence** 的同一套引擎，如今開放給開發者使用。它從零為現代 AI 工作負載打造，能在 **CPU、GPU、Neural Engine** 上提供高效能推論，並且完全在裝置本地執行，沒有伺服器、也沒有 per-token 成本。Core AI 不只是一個框架，而是一整套涵蓋模型部署生命週期的技術，從模型最佳化、轉換、除錯到整合進 app，全程支援 AI 開發所需的快速迭代節奏。","本場以一個雙人貪食蛇遊戲為例，其中一條蛇由 Core AI 執行的模型操控。流程從 **Python/PyTorch** 端開始：用 **coreai-torch** 套件搭配 `torch.export`（並以 **dynamic_shapes** 標記動態序列長度）將模型匯出，再經 **TorchConverter** 轉成 `.aimodel` 資產；轉換後還能透過 Core AI 的 Python bindings 跑數值驗證，確認與原始 PyTorch 輸出的誤差在容許範圍內。進到 Xcode 後，可直接開啟 `.aimodel` 檢視模型大小、運算分布與函式簽章。","在 app 端，Core AI 提供現代化且漸進揭露的 **Swift API**：以 **AIModel** 載入模型、取得 **InferenceFunction**，用 **NDArray** 承載多維輸入輸出，再呼叫 `run` 執行推論。其中 **NDArray.MutableView** 等 non-escapable 型別在不犧牲效能的前提下提供記憶體安全。當遊戲序列愈來愈長導致推論變慢時（transformer 的二次方時間複雜度），講者透過 **States**（KV cache）解法：把 key/value 快取宣告為模型狀態（PyTorch 端用 `register_buffer`、轉換時加 `state_names`），讓快取在推論中就地讀寫，避免重算並省去傳入完整歷史，使延遲不再隨步數膨脹。","最後介紹進階能力：**Core AI Debugger** 可視覺化模型、檢視中間 tensor 並追溯回 Python 原始碼，配合 Instruments 與 debug gauge 找效能問題。重點概念是 **specialization**——出貨的是可跨裝置執行的來源表示，實際載入時須針對裝置特化並快取，首次可能耗時，建議透過 **AIModelCache** 檢查快取或用 `AIModel.specialize` 預先特化，避免卡在使用者互動流程；亦可在開發機做 ahead-of-time 編譯縮短時間。此外還有 **Core AI Models** repository、AI skills 與可接上 **Foundation Models** 的高階模型函式庫可運用。"],"deepdive":[{"t":0,"title":"Introduction","body":"由 Core AI 團隊工程師 **Ben** 開場，說明 AI 正以前所未有的速度演進，**Core AI** 就是用來駕馭這股動能、在 Apple 平台上打造進階 AI 功能的框架。他點出 Core AI 是驅動 on-device **Apple Intelligence** 的推論引擎，現在開放給開發者，並預告本場將涵蓋模型轉換、整合、效能最佳化與其他實用功能。"},{"t":33,"title":"What is Core AI","body":"定義 **Core AI** 是 Apple 端側 AI 執行的新一代演進，從零為現代工作負載打造，能跨 **CPU、GPU、Neural Engine** 提供高速推論，並配備兼顧效能與記憶體安全的現代 **Swift API**。它與既有 **Python/PyTorch** 工作流自然銜接，支援模型特化、custom GPU kernels 與全新工具鏈（AOT 編譯、專屬 Instruments、可視化 Debugger），可從小型 speaker diarization 模型一路擴展到 70B 參數的 LLM，全部本地執行且無 per-token 成本。"},{"t":297,"title":"Model conversion","body":"以一個雙人貪食蛇遊戲示範完整流程：其中一條蛇由模型操控，每個時間步看到描述棋盤狀態的特徵並累積成歷史，再預測最佳移動方向。講者用 AI coding assistant 在 PyTorch 快速搭出 **SnakeTransformer**，並以樸素模擬產生訓練資料，強調貪食蛇雖簡單，但所用工具與 API 可一路擴展到更大型用例。"},{"t":308,"title":"Convert a PyTorch model to Core AI","body":"示範用 **coreai-torch** 套件轉換：先載入訓練好的 checkpoint 與樣本輸入，再以 `torch.export` 匯出並透過 **dynamic_shapes** 指定序列長度為動態（避免被固定成樣本長度 5），接著用 Core AI 的 decomposition table 跑 `run_decompositions`。最後執行 **TorchConverter** 指定輸入輸出名稱，將模型存成 `.aimodel` 資產。"},{"t":344,"title":"Verify converted model numerics","body":"在離開 Python 環境前，用 Core AI 的 Python bindings 驗證轉換後模型與原始 PyTorch 的數值一致性。做法是載入兩邊模型、準備相同的貪食蛇輸入分別跑過 PyTorch module 與 Core AI **InferenceFunction**，再 assert 兩者輸出差距小於可接受的門檻（如 0.01）。"},{"t":376,"title":"App integration","body":"進到 Xcode，直接開啟 `.aimodel` 檔即可看到模型大小、運算分布等 metadata，**Functions** 分頁則顯示每個函式的精確簽章。此模型只有一個函式，輸入棋盤特徵、輸出代表移動方向的 logits；**NDArray** 維度中的問號代表動態形狀，對應先前以動態序列長度轉換的設定。"},{"t":461,"title":"Core AI framework core types","body":"介紹框架的核心型別與漸進揭露設計：**AIModel** 由 `.aimodel` 的 URL 初始化，用來檢視與載入一或多個 inference function；**InferenceFunction** 是代表單一已載入計算圖的可執行物件；**NDArray** 承載多維輸入輸出資料。並強調採用 non-escapable 等現代 Swift 語言特性，在不犧牲效能的前提下提供記憶體安全的 API。"},{"t":513,"title":"Initialize ModelPlayer with AIModel","body":"建立 **ModelPlayer** 型別，在 app 初始化時以模型檔 URL 建構：載入 **AIModel** 並從中取得名為 main 的 **InferenceFunction**。這類 AIModel 與 InferenceFunction 物件通常在準備 AI 功能時（例如 app 啟動階段）就建好，以便後續重複使用。"},{"t":529,"title":"Run inference with NDArray inputs","body":"ModelPlayer 遵循自訂的 **SnakePlayer** 協定，核心是 `chooseAction`：先建立二維 float32 的 **NDArray**（第一維為當前序列長度、第二維為固定 hidden dimension），用 `writeFeatures` 搭配 **NDArray.MutableView** 安全高效地寫入特徵。接著 `run` 執行推論、取出 logits NDArray，再以其 view 挑選對應 logit 最大的方向作為下一步動作。"},{"t":610,"title":"Input features for the snake model","body":"說明 `writeFeatures` 寫入的特徵內容：AI 蛇頭到四面牆的正規化距離、到最近食物的相對 X/Y 距離、以 one-hot 編碼的當前方向（四個元素）、到對手蛇的正規化距離，以及對手蛇的方向。這些特徵共同描述了每個時間步的棋盤狀態。"},{"t":648,"title":"Profiling with Instruments","body":"實測讓兩條蛇都由模型操控，發現遊戲愈到後面愈慢。用 Xcode 新的 Core AI **Instruments** 觀察，可見推論區間隨時間明顯變長、延遲增加。原因是 transformer 對序列長度有二次方時間複雜度，而遊戲中序列長度會隨每一步移動持續增長。"},{"t":675,"title":"Optimizing performance","body":"提出最佳化方向：transformer 每次序列變長都會為所有元素重算 key/value embeddings，常見對策是快取已算過的 keys/values 而非每次重算。在 Core AI 中可用 **States**——既被讀取、又在推論中就地更新的輸入——把 KV cache 變成模型狀態，如此既免重算，也不必每次傳入完整歷史，後續每步只需提供最新棋盤的新特徵。"},{"t":738,"title":"Add KV cache buffers to PyTorch module","body":"回到 PyTorch 端的 authoring 程式碼，在 transformer module 內以 `register_buffer` 新增 key 與 value cache 張量。使用 register_buffer 的用意是讓匯出的 torch program 把這些張量視為可變 buffer，之後便能被 Core AI 轉換成 **States**。"},{"t":770,"title":"Update forward pass to read/write KV caches","body":"在 module 的 `forward` 中加入實際使用快取的邏輯：逐層從 `k_cache`/`v_cache` 讀出先前的 keys/values，對新 token 計算 q/k/v 並在有效前綴上做注意力，再把更新後的 keys/values 寫回快取（以 `copy_` 就地更新堆疊後的張量）。"},{"t":779,"title":"Re-convert model with state names","body":"沿用先前的轉換程式碼重新轉換模型，但這次在 `torch.export` 傳入新增的 `position_ids` 輸入，並在 **TorchConverter** 呼叫中加上 **state_names** 參數（如 keyCache、valueCache）來指定新狀態引數的名稱，最後同樣存成 `.aimodel`。"},{"t":797,"title":"Store KV cache NDArrays in ModelPlayer","body":"更新 app 程式碼以配合新函式簽章：在 **ModelPlayer** 中新增 keyCache 與 valueCache 兩個 **NDArray** 屬性作為每次推論要傳入的狀態引數，並以 transformer 預期的形狀（layers、最大 context 長度、hidden dim）初始化。模型轉換時設定快取為涵蓋最大可能 context 長度的固定大小。"},{"t":825,"title":"Pass state views to inference function","body":"推論時建立 **InferenceFunction.MutableViews** 集合，分別 insert keyCache 與 valueCache 的可變 view，再透過 `run` 的 **states** 參數傳入，使快取在每次推論中被讀取並就地更新。重跑後遊戲維持穩定速度不再變慢，Instruments 也確認推論延遲的增長速率大幅趨緩。"},{"t":853,"title":"Additional features","body":"介紹貪食蛇未用到但實用的功能。**coreai-torch** 直接轉換雖簡單，但若需更多控制，Core AI Python 套件還支援直接以 Core AI API authoring 模型、針對 Apple Silicon 最佳化、以 **Metal 4** 定義 custom kernels（詳見 model authoring 與最佳化專場）。除錯方面，**Core AI Debugger** 可視覺化模型、檢視中間 tensor 值並追溯回 Python 原始碼，Xcode 中的 Core AI debug gauge 則即時顯示 Core AI 活動。"},{"t":934,"title":"Specialization","body":"解釋出貨的 AI 模型是可在任何 Apple 裝置執行的來源表示，但實際載入前必須針對當前裝置做 **specialization** 並快取。對非常大的模型，首次特化可能相當耗時，雖然後續從快取載入很快，這段首次延遲仍需事先規劃，且建議避免讓特化發生在使用者互動流程中。"},{"t":982,"title":"Check model cache before loading","body":"Core AI 提供對 app 預設模型快取的程式化存取：透過 **AIModelCache** 嘗試取得模型，若回傳 nil 代表尚未特化、需要先特化。可用此來把功能 gate 住，或在主執行緒提示使用者「正在準備 AI 功能，可能需要稍候」。"},{"t":1002,"title":"Request model specialization","body":"可用 `AIModel.specialize` 明確請求特化，與載入動作脫鉤，例如在下載完資產後或使用者開啟某功能時預先特化好。**SpecializationOptions** 可配置最佳化方式；**AIModelCache** 還能刪除不需要的項目、控制快取保存政策，甚至在同一 app group 的多個 app 間共享快取。特化過程含 compilation 與產生 device/OS 綁定的可執行 artifacts 兩步，其中 compilation 佔多數延遲，可透過開發機 ahead-of-time 編譯顯著縮短裝置端工作量。"},{"t":1207,"title":"Next steps","body":"總結 **Core AI** 在所有 Apple Silicon 上可用，與既有 Python 工具緊密整合、提供現代 Swift 框架高效執行模型，並附帶最先進的除錯工具。並指向 **Core AI Models** repository：內含可一鍵轉換最佳化的熱門模型、Core AI 相關 AI skills，以及含內建低階推論最佳化的 Swift 套件，其中還提供可接上 **Foundation Models** 框架的 Core AI Language model API，讓開發者帶入自訂模型與取樣策略。"}],"summary_en":["**Core AI** is Apple's new on-device AI inference framework, the same engine that powers on-device **Apple Intelligence**, now opened up for developers. Built from the ground up for modern AI workloads, it delivers high-performance inference across the **CPU, GPU, and Neural Engine**, running entirely on-device with no server and no per-token cost. It is more than a framework, it is a full set of technologies spanning the model deployment lifecycle, from optimization and conversion to debugging and app integration, all tuned for the fast iteration that building AI features requires.","The session uses a two-player snake game where one snake is driven by a Core AI model. The flow starts in **Python/PyTorch**: the model is exported with `torch.export` (marking the sequence length as dynamic via **dynamic_shapes**) and converted to a `.aimodel` asset using **TorchConverter** from the **coreai-torch** package, with numerics verified against the original PyTorch output via Core AI's Python bindings. In Xcode you can open the `.aimodel` directly to inspect model size, op distribution, and function signatures.","On the app side, Core AI offers a modern, progressively disclosing **Swift API**: load the model with **AIModel**, get an **InferenceFunction**, carry multi-dimensional data in **NDArray**, and call `run`. Non-escapable types like **NDArray.MutableView** provide memory safety without sacrificing performance. When the growing sequence makes inference slow (transformer quadratic time complexity), the speaker uses **States** to implement a KV cache: key/value caches are declared as model state (`register_buffer` in PyTorch, `state_names` at conversion) and read/written in-place during inference, avoiding recomputation and the need to pass the full history, so latency stops ballooning with each step.","Finally, the talk covers advanced capabilities: the **Core AI Debugger** visualizes the model, inspects intermediate tensors, and traces ops back to Python source, alongside Instruments and a debug gauge. A key concept is **specialization**, the shipped model is a portable source representation that must be specialized and cached for the device on first load, which can be slow, so use **AIModelCache** to check the cache or `AIModel.specialize` to prepare ahead of time and keep it out of user-interactive flows; ahead-of-time compilation on your dev machine reduces this further. The **Core AI Models** repository, AI skills, and higher-level libraries that plug into **Foundation Models** round out the ecosystem."],"deepdive_en":[{"t":0,"title":"Introduction","body":"Core AI engineer **Ben** opens by noting AI is advancing faster than ever and that **Core AI** is built to harness that momentum for advanced AI features on Apple platforms. He points out Core AI is the inference engine powering on-device **Apple Intelligence**, now available to developers, and previews the agenda: model conversion, app integration, performance optimization, and additional useful features."},{"t":33,"title":"What is Core AI","body":"Defines **Core AI** as the next evolution of on-device AI execution on Apple, built from the ground up for modern workloads, delivering fast inference across **CPU, GPU, and Neural Engine** with a modern, memory-safe **Swift API**. It fits existing **Python/PyTorch** workflows and supports specialization, custom GPU kernels, and a new toolchain (AOT compilation, dedicated Instruments, a visual Debugger), scaling from small speaker diarization models up to a 70B-parameter LLM, all running locally with no per-token cost."},{"t":297,"title":"Model conversion","body":"Demonstrates the full flow with a two-player snake game where one snake is model-driven: at each step it sees features describing the board, accumulates a history, and predicts the best direction. The speaker sketched a **SnakeTransformer** quickly in PyTorch with an AI coding assistant and trained it on naively simulated data, noting that although snake is simple, the same tools and APIs scale to far larger use cases."},{"t":308,"title":"Convert a PyTorch model to Core AI","body":"Shows conversion with the **coreai-torch** package: load the trained checkpoint and a sample input, export via `torch.export` while using **dynamic_shapes** to mark the sequence length as dynamic (so it isn't traced at the static sample length of 5), then run `run_decompositions` with Core AI's decomposition table. Finally **TorchConverter** is run with named inputs/outputs and the model is saved as a `.aimodel` asset."},{"t":344,"title":"Verify converted model numerics","body":"Before leaving Python, the converted model's numerics are validated against the original PyTorch using Core AI's Python bindings. Both models are loaded, the same snake input is run through the PyTorch module and the Core AI **InferenceFunction**, and a sufficiently small delta (e.g. 0.01) between outputs is asserted."},{"t":376,"title":"App integration","body":"In Xcode, opening the `.aimodel` file shows model size, op distribution, and other metadata, while the **Functions** tab shows each function's exact signature. This model has a single function taking board features as input and producing direction logits; the question marks in **NDArray** dimensions denote dynamic shapes, matching the dynamic sequence length used at conversion."},{"t":461,"title":"Core AI framework core types","body":"Introduces the core types and progressive disclosure: **AIModel** is initialized from a `.aimodel` URL and used to inspect and load one or more inference functions; **InferenceFunction** is the runnable object representing a single loaded compute graph; **NDArray** holds multi-dimensional input/output data. The API leans on modern Swift features like non-escapable types to stay memory-safe without sacrificing performance."},{"t":513,"title":"Initialize ModelPlayer with AIModel","body":"Creates a **ModelPlayer** type constructed at app init with the model file URL: it builds the **AIModel** and loads the main **InferenceFunction** from it. These AIModel and InferenceFunction objects are typically created when preparing the AI feature (for example at app startup) so they can be reused."},{"t":529,"title":"Run inference with NDArray inputs","body":"ModelPlayer conforms to a custom **SnakePlayer** protocol whose key method is `chooseAction`: it creates a 2D float32 **NDArray** (first dim the current sequence length, second the fixed hidden dimension) and writes features via `writeFeatures` using a safe, efficient **NDArray.MutableView**. It then `run`s inference, extracts the logits NDArray, and picks the direction with the largest corresponding logit from its view."},{"t":610,"title":"Input features for the snake model","body":"Explains the features `writeFeatures` writes: the AI snake head's normalized distance to all walls, the relative X/Y distance to the nearest food, four elements one-hot encoding the current direction, the normalized distance to the other snake, and the opponent's direction. Together these describe the board state at each time step."},{"t":648,"title":"Profiling with Instruments","body":"Running with both snakes model-driven, the game slows down over time. Using the new Core AI **Instruments**, the inference intervals are seen growing noticeably larger, meaning rising latency. This makes sense because transformers have quadratic time complexity in sequence length, and the game's sequence grows with every move."},{"t":675,"title":"Optimizing performance","body":"Proposes the fix: each longer input makes the transformer recompute key/value embeddings for the whole sequence, so a common strategy is to cache previously computed keys/values rather than recompute. In Core AI this is done with **States**, inputs that are both read and updated in-place during inference; making the KV caches states avoids recomputation and removes the need to pass the full history, so each later step only needs the latest board's new features."},{"t":738,"title":"Add KV cache buffers to PyTorch module","body":"Back in the PyTorch authoring code, key and value cache tensors are added inside the transformer module via `register_buffer`. Using register_buffer ensures the exported torch program treats them as mutable buffers, which Core AI will later convert into **States**."},{"t":770,"title":"Update forward pass to read/write KV caches","body":"The module's `forward` is updated to actually use the caches: per layer it reads previous keys/values from `k_cache`/`v_cache`, computes q/k/v for the new token and attends over the valid prefix, then writes the updated keys/values back into the caches (with `copy_` on the stacked tensors)."},{"t":779,"title":"Re-convert model with state names","body":"The same conversion code is rerun, now passing a new `position_ids` input to `torch.export` and adding the **state_names** argument (e.g. keyCache, valueCache) to the **TorchConverter** call to name the new state arguments, finally saving the `.aimodel` again."},{"t":797,"title":"Store KV cache NDArrays in ModelPlayer","body":"The app code is updated for the new signature: **ModelPlayer** gains keyCache and valueCache **NDArray** properties to pass as state arguments on each inference, initialized with the transformer's expected shape (layers, max context length, hidden dim). The model was converted so the caches are always a fixed size for a maximum possible context length."},{"t":825,"title":"Pass state views to inference function","body":"At inference time an **InferenceFunction.MutableViews** collection is built, inserting mutable views of keyCache and valueCache, and passed as the **states** argument of `run`, so the caches are read and updated in-place each inference. After this the game holds a steady speed, and Instruments confirms inference latency now grows much more slowly."},{"t":853,"title":"Additional features","body":"Highlights features unused in the snake game but broadly useful. Direct **coreai-torch** conversion is simple, but for more control the Core AI Python package also supports authoring models directly with Core AI APIs, optimizing for Apple Silicon, and defining custom kernels with **Metal 4** (see the model authoring and optimization talk). For debugging, the **Core AI Debugger** visualizes the model, inspects intermediate tensor values, and traces ops back to Python source, while Xcode's Core AI debug gauge streams live activity."},{"t":934,"title":"Specialization","body":"Explains the shipped AI model is a source representation runnable on any Apple device, but before loading it must be **specialized** for the current device and cached. For very large models the first specialization can take significant time, and although later loads from cache are fast, that first-time cost must be planned for and should be kept out of user-interactive flows."},{"t":982,"title":"Check model cache before loading","body":"Core AI gives programmatic access to the app's default model cache via **AIModelCache**: request the model from it, and if nil is returned it isn't present and needs specialization. This can gate features or inform users on the main thread that the app is preparing AI features and they may need to wait."},{"t":1002,"title":"Request model specialization","body":"You can explicitly request specialization with `AIModel.specialize`, decoupled from loading, for example after downloading assets or when a user opts into a feature. **SpecializationOptions** configures how the model is optimized; **AIModelCache** can also delete unneeded entries, control retention policy, and even share a cache across apps in the same app group. Specialization involves compilation plus generating device/OS-bound executable artifacts, with compilation incurring most of the latency, which ahead-of-time compilation on the dev machine can significantly reduce."},{"t":1207,"title":"Next steps","body":"Wraps up that **Core AI** is available on all Apple Silicon, integrates tightly with familiar Python tools, provides a modern Swift framework for efficient inference, and ships state-of-the-art debugging tools. It points to the **Core AI Models** repository: popular models a single command away from being converted and optimized, Core AI AI skills, and a Swift package with model-family libraries that bake in low-level inference optimizations, including a Core AI Language model API that plugs into the **Foundation Models** framework for custom models and sampling strategies."}],"code":[]},"related":[{"id":"325","title":"Dive into Core AI model authoring and optimization","gloss":"深入 Core AI 模型編寫與最佳化","gloss_en":"Dive into Core AI model authoring and optimization","category":"ai","categoryLabel":"AI 與機器學習"},{"id":"326","title":"Integrate on-device AI models into your app using Core AI","gloss":"用 Core AI 把裝置端 AI 模型整合進你的 App","gloss_en":"Integrate on-device AI models with Core AI","category":"ai","categoryLabel":"AI 與機器學習"},{"id":"121","title":"Announcing Apple’s next big step for Siri and iPhone","gloss":"宣布 Apple 為 Siri 與 iPhone 邁出的下一大步","gloss_en":"Announcing Apple's next big step for Siri and iPhone","category":"ai","categoryLabel":"AI 與機器學習"},{"id":"227","title":"Create UI prototypes using agents in Xcode","gloss":"在 Xcode 用代理人打造 UI 原型","gloss_en":"Prototype UI with agents in Xcode","category":"ai","categoryLabel":"AI 與機器學習"},{"id":"232","title":"Run local agentic AI on the Mac using MLX","gloss":"用 MLX 在 Mac 上執行本機 agentic AI","gloss_en":"Run local agentic AI on the Mac using MLX","category":"ai","categoryLabel":"AI 與機器學習"}]}</script>
