<script id="d" type="application/json">{"s":{"id":"212","title":"Rev up your CarPlay app","gloss":"強化你的 CarPlay App","category":"uikit","categoryLabel":"UIKit","duration":980,"url":"https://developer.apple.com/videos/play/wwdc2026/212/","takeaway":"運用 CarPlay framework 的新功能，為音訊、導航與對話式 App 打造更完整的車載體驗。","chapters":[[0,"Introduction"],[42,"Apps in CarPlay"],[171,"CarPlay framework"],[405,"Disable the MiniPlayer"],[714,"Navigation apps"],[906,"Enable route sharing"],[912,"Disable route sharing for this trip"],[919,"CarPlay Simulator"]],"points":[{"text":"全面檢視 **CarPlay framework** 對音訊、導航與語音對話式 App 的新支援能力。","hot":false},{"text":"可透過 **CPNowPlayingTemplate.allowsMiniPlayer** 停用 MiniPlayer，自訂正在播放畫面的呈現方式。","hot":false},{"text":"導航 App 可實作 **mapTemplateShouldProvideRouteSharing** 啟用路線分享，並針對單次行程選擇關閉。","hot":false},{"text":"新增 **CarPlay 視訊** 能力，拓展車載情境下可呈現的內容類型。","hot":true},{"text":"使用 **CarPlay Simulator** 在無實體車機的情況下開發與測試介面。","hot":false}],"apis":["CarPlay","CPNowPlayingTemplate","CPMapTemplate","mapTemplateShouldProvideRouteSharing"],"audience":"開發 **CarPlay 音訊、導航或對話式 App** 並想採用今年新功能的 iOS 開發者。","gloss_en":"Rev up your CarPlay app","takeaway_en":"Use the new capabilities in the CarPlay framework to build a more complete in-car experience for audio, navigation, and conversational apps.","points_en":[{"text":"A full look at the **CarPlay framework**'s new support for audio, navigation, and voice-based conversational apps.","hot":false},{"text":"Use **CPNowPlayingTemplate.allowsMiniPlayer** to disable the MiniPlayer and customize how the Now Playing screen is presented.","hot":false},{"text":"Navigation apps can implement **mapTemplateShouldProvideRouteSharing** to enable route sharing, opting out on a per-trip basis.","hot":false},{"text":"Adds **CarPlay video** support, expanding the kinds of content you can present in the in-car context.","hot":true},{"text":"Use the **CarPlay Simulator** to develop and test your interface without physical car hardware.","hot":false}],"audience_en":"iOS developers building **CarPlay audio, navigation, or conversational apps** who want to adopt this year's new features.","summary":["車體驗團隊工程師 Chris 介紹 **CarPlay** 在 iOS 27 的更新，主軸是替各類別的 CarPlay app 增添新能力。除了既有的音樂、通訊、導航類別，今年新增了**語音對話式 app**，以及最受矚目的 **CarPlay video apps**——在支援 video in car 功能的新車上，使用者可在停車等待時直接在 CarPlay 螢幕上瀏覽與播放影片。只要 app 已支援 **AirPlay** video streaming，搭配 **CarPlay framework** 提供瀏覽 UI 即可；若車輛當下不允許影片播放，內容會自動以 audio-only 形式繼續播放。建議同時宣告 CarPlay audio 與 video entitlement，讓 app 在任何車上都能出現。","在 CarPlay framework 層面，所有類別的 app 都有 UI 強化。清單（list）現在支援直式或橫式比例的圖片，**card** 元素可帶縮圖並疊加 overlay、播放進度與運動賽事資訊；新的 **`CPPlaybackConfiguration`** 提供播放中繼資料（elapsed time、duration、播放動作），需在播放狀態變化時同步更新縮圖。**details header** 可在清單頂端突顯單一項目，組合縮圖、標題、內文、播放設定與動作按鈕。iOS 27 也為 now playing 帶來新的 **MiniPlayer**（可用 `allowsMiniPlayer = false` 關閉），並把今年推出的 **Voice Control template** 開放給所有 app 類別，且可作為 overlay 疊在地圖等其他 template 之上。","針對導航 app 有兩項新功能。**Panels** 讓導航 app 自由掌控 Map template 的主要介面區，能組合 trips、grids、route choices、waypoints 等物件並加上底部按鈕（如 Go／End），在保持地圖可見的同時呈現更多內容。**Route sharing**（需 iOS 26.4 以上與支援車輛）則把 app 規劃的路線以 route segments 陣列分享給車輛，讓自動變換車道、電動車充電站建議等駕駛輔助功能也能在第三方導航 app 下運作；可用 `mapTemplateShouldProvideRouteSharing` 啟用，或對個別行程以 `routeSegmentsAvailableForRegion = false` 停用。最後，**CarPlay Simulator** 現已進駐 Device Hub，可在 Mac 上測試不同螢幕尺寸與車輛配置；影片 app 開發者可透過 Additional Tools for Xcode 取得。"],"deepdive":[{"t":0,"title":"Introduction","body":"車體驗團隊工程師 Chris 開場，定位 **CarPlay** 為在車內更聰明、更安全使用 iPhone 的方式。iOS 27 為所有類別的 CarPlay app 帶來新能力，本場將涵蓋新增的 app 類別、適用所有 app 的 framework 更新、導航 app 專屬功能，以及 CarPlay Simulator。"},{"t":42,"title":"Apps in CarPlay","body":"回顧 CarPlay 支援的類別（音樂、通訊、導航），並指出它們的共通點是讓人不必拿出 iPhone 就完成重要任務。今年新增**語音對話式 app**，並推出 **CarPlay video apps**：在支援 video in car 的車上可瀏覽與播放影片。只要支援 **AirPlay** video streaming 即可，當車輛不允許影片時會自動轉為 audio-only；建議同時宣告 audio 與 video entitlement。"},{"t":171,"title":"CarPlay framework","body":"說明使用 **CarPlay framework** 時由 iOS 統一管理 UI 佈局與車輛介面，app 不需處理不同解析度或輸入硬體（觸控、旋鈕、觸控板）。以範例 app Landmarks 展示新 UI：list 支援直／橫式圖片、card 縮圖可加 overlay／播放進度／運動資訊、**`CPPlaybackConfiguration`** 提供播放中繼資料，以及在清單頂端突顯單一項目的 **details header**。"},{"t":405,"title":"Disable the MiniPlayer","body":"iOS 27 為 now playing template 新增 **MiniPlayer**，所有顯示 now playing 的 app 都會自動顯示，在較大螢幕上甚至可直接播放、暫停、跳過。MiniPlayer 是 now playing 的最佳選擇，但若不想顯示，可將 `allowsMiniPlayer` 設為 `false`，now playing 圖示會改顯示在導覽列。"},{"t":714,"title":"Navigation apps","body":"導航 app 現在能用 **panels** 自由掌控 Map template 的主要介面區，把 trips、grids、route choices、route details、waypoints 等既有物件組合起來，並用 button configuration 在底部加上 Go／End 等動作按鈕，在保持地圖可見的同時呈現更多內容與控制。"},{"t":906,"title":"Enable route sharing","body":"介紹 **Route sharing**：app 以 route segments（地理座標陣列）把路線分享給車輛，讓自動變換車道、電動車依續航建議充電站等駕駛輔助功能在第三方導航 app 下也能運作。需 iOS 26.4 以上與支援車輛，並透過 Map template 以 `mapTemplateShouldProvideRouteSharing` 回傳 `true` 來 opt-in。"},{"t":912,"title":"Disable route sharing for this trip","body":"若 app 判斷某趟行程不適合分享路線，可針對個別 trip 將 `routeSegmentsAvailableForRegion` 設為 `false` 來停用 route sharing。整體而言，駕駛在配對車輛時的核准與 app 的 opt-in 共同決定 route sharing 何時發生。"},{"t":919,"title":"CarPlay Simulator","body":"**CarPlay Simulator** 讓測試 CarPlay app 只需連接 Mac，可模擬不同螢幕尺寸與車輛配置（如支援影片的車輛），現已進駐 **Device Hub**。導航 app 開發者可試用 route sharing 的新診斷工具，影片 app 開發者則透過 Additional Tools for Xcode 套件下載。"}],"summary_en":["Car experience engineer Chris covers what's new in **CarPlay** for iOS 27, focused on bringing new capabilities to every category of CarPlay app. Alongside the existing audio, communication, and navigation categories, this year adds **voice-based conversational apps** and, most notably, **CarPlay video apps** — on new cars that support the video-in-car feature, people can browse and play videos right on the CarPlay display while parked or waiting. If your app already supports **AirPlay** video streaming, you just add a browsing UI with the **CarPlay framework**; when the car indicates video isn't available, content plays back as audio-only. Declaring both the CarPlay audio and video entitlements ensures your app always appears.","At the CarPlay framework level, every app category gets UI enhancements. Lists can now show portrait or landscape images, **card** elements add thumbnails with overlays, playback progress, and sports info, and the new **`CPPlaybackConfiguration`** carries playback metadata (elapsed time, duration, playback action) that you update on state changes. A **details header** prominently features a single item at the top of a list, combining thumbnail, title, body text, playback configuration, and action buttons. iOS 27 also brings a new **MiniPlayer** for now playing (disable with `allowsMiniPlayer = false`) and opens this year's **Voice Control template** to all app categories, including as an overlay on top of templates like the Map template.","Navigation apps get two new features. **Panels** let a navigation app control the primary interface area of the Map template, combining objects like trips, grids, route choices, and waypoints with bottom buttons (Go/End) while keeping the map visible. **Route sharing** (requires iOS 26.4+ and a supported vehicle) shares the app's planned route to the car as an array of route segments, so driver-assistance features like automatic lane changes and EV charging-stop suggestions work even with third-party navigation apps; opt in via `mapTemplateShouldProvideRouteSharing`, or disable per-trip with `routeSegmentsAvailableForRegion = false`. Finally, **CarPlay Simulator** is now in Device Hub for testing different screen sizes and vehicle configurations on a Mac; video app developers get it via Additional Tools for Xcode."],"deepdive_en":[{"t":0,"title":"Introduction","body":"Car experience engineer Chris opens, framing **CarPlay** as the smarter, safer way to use iPhone in the car. iOS 27 brings new capabilities to all CarPlay app categories; the session covers new app categories, framework updates for all apps, navigation-specific features, and the CarPlay Simulator."},{"t":42,"title":"Apps in CarPlay","body":"Reviews supported categories (audio, communication, navigation), whose common thread is helping people accomplish tasks without taking out their iPhone. This year adds **voice-based conversational apps** and introduces **CarPlay video apps**: browse and play videos on cars supporting video-in-car. Supporting **AirPlay** video streaming is enough; when video isn't allowed, content falls back to audio-only. Declare both audio and video entitlements to always appear."},{"t":171,"title":"CarPlay framework","body":"Explains that with the **CarPlay framework**, iOS manages UI layout and the car interface, so apps don't handle resolutions or input hardware (touchscreens, knobs, touchpads). Using the Landmarks sample, it shows new UI: lists with portrait/landscape images, card thumbnails with overlays/progress/sports info, the **`CPPlaybackConfiguration`** for playback metadata, and the **details header** for featuring a single item atop a list."},{"t":405,"title":"Disable the MiniPlayer","body":"iOS 27 adds a **MiniPlayer** to the now playing template, shown automatically by all apps that display now playing and allowing play/pause/skip on larger displays. The MiniPlayer is the best option, but if you don't want it, set `allowsMiniPlayer` to `false` and the now playing icon appears in the navigation bar instead."},{"t":714,"title":"Navigation apps","body":"Navigation apps can now use **panels** to control the Map template's primary interface area, combining existing objects like trips, grids, route choices, route details, and waypoints, with a button configuration adding bottom actions like Go/End — showing more content and controls while keeping the map visible."},{"t":906,"title":"Enable route sharing","body":"Introduces **Route sharing**: the app shares its route to the vehicle as an array of route segments (geographic coordinates), enabling driver-assistance features like automatic lane changes and EV range-based charging suggestions to work with third-party navigation apps. Requires iOS 26.4+ and a supported vehicle; opt in through the Map template by returning `true` from `mapTemplateShouldProvideRouteSharing`."},{"t":912,"title":"Disable route sharing for this trip","body":"If the app determines a trip isn't eligible, it can disable route sharing per-trip by setting `routeSegmentsAvailableForRegion` to `false`. Overall, both the driver's approval at pairing time and the app's opt-in govern when route sharing occurs."},{"t":919,"title":"CarPlay Simulator","body":"**CarPlay Simulator** makes testing as easy as connecting to a Mac, simulating different screen sizes and vehicle configurations (like video-capable cars), and is now available in **Device Hub**. Navigation developers should try the new route-sharing diagnostic tools; video app developers download it via the Additional Tools for Xcode package."}],"code":[]},"related":[{"id":"203","title":"Read between the strokes with PencilKit","gloss":"用 PencilKit 解讀筆跡內容","gloss_en":"Read handwriting content with PencilKit","category":"uikit","categoryLabel":"UIKit"},{"id":"219","title":"Enhance the accessibility of your reading app","gloss":"強化你閱讀類 App 的無障礙體驗","gloss_en":"Enhance the accessibility of your reading app","category":"uikit","categoryLabel":"UIKit"},{"id":"221","title":"Prepare your tvOS apps for Dynamic Type","gloss":"讓你的 tvOS App 支援動態字型","gloss_en":"Prepare your tvOS app for Dynamic Type","category":"uikit","categoryLabel":"UIKit"},{"id":"226","title":"Create live communication experiences","gloss":"打造即時通訊體驗","gloss_en":"Build live communication experiences","category":"uikit","categoryLabel":"UIKit"},{"id":"278","title":"Modernize your UIKit app","gloss":"現代化你的 UIKit App","gloss_en":"Modernize your UIKit app","category":"uikit","categoryLabel":"UIKit"}]}</script>
