<script id="d" type="application/json">{"s":{"id":"251","title":"Communicate your brand identity on iOS","gloss":"在 iOS 上傳達品牌識別","category":"design","categoryLabel":"設計","duration":1046,"url":"https://developer.apple.com/videos/play/wwdc2026/251/","takeaway":"用字體、色彩、元件與互動表達品牌個性，同時保留 iOS 使用者熟悉的操作慣性。","chapters":[[0,"Intro"],[144,"Components"],[401,"Content"],[709,"Color"],[710,"Typography"],[857,"Iconography"]],"points":[{"text":"在**元件（Components）**層面客製外觀時，仍要維持系統行為與使用者的操作預期。","hot":false},{"text":"透過**內容（Content）**呈現語氣與個性，是傳達品牌的重要一環。","hot":false},{"text":"善用**色彩（Color）與字體（Typography）**建立一致而獨特的視覺識別。","hot":false},{"text":"以**圖示（Iconography）**強化品牌印象，在熟悉與獨特之間取得平衡。","hot":false}],"apis":[],"audience":"想在 iOS 上**強化品牌識別、又不犧牲系統一致性**的設計師與開發者。","gloss_en":"Communicate your brand identity on iOS","takeaway_en":"Express your brand's personality through typography, color, components, and interactions while preserving the operating conventions iOS users are familiar with.","points_en":[{"text":"When customizing the look of **Components**, still maintain system behavior and users' operating expectations.","hot":false},{"text":"Conveying tone and personality through **Content** is an important part of expressing your brand.","hot":false},{"text":"Make good use of **Color and Typography** to build a consistent yet distinctive visual identity.","hot":false},{"text":"Reinforce brand impression with **Iconography**, striking a balance between the familiar and the unique.","hot":false}],"audience_en":"Designers and developers who want to **strengthen brand identity on iOS without sacrificing system consistency**.","summary":["Design Evangelist Sarah 在這場 session 探討如何在 iOS app 上表達**品牌識別**，同時維持使用者熟悉的原生操作體驗。她提出的核心心法是：在重要之處保持熟悉、在需要之處才做客製，而品牌不只是視覺（字體、色彩、圖示），更是一種感受。她特別提醒，即使你的產品在網站、行銷、實體店或其他平台都有呈現，也不應預設讓各處長得一模一樣——iPhone 使用者期待 app 看起來、用起來都像 iOS。","她借用 iOS 26 **Liquid Glass** 的概念，把介面分成兩層：負責全域導航與動作的 **UI layer**（如 tab bar、top toolbar），以及承載 app 獨特功能的 **content layer**。品牌最適合表達的地方是 content layer，而 UI layer 應盡量沿用 iOS 既有的熟悉元件。透過 Gentler Streak、Slack、Moonlitt 等案例，她說明導航元件應維持原生、僅在最有影響力或最能凸顯內容之處才客製元件，並提醒像 context menu 這類常被忽略的標準元件（SwiftUI 開箱即用）能省下大量自建與維護成本。","在 content layer，她鼓勵把它當成畫布：Crumbl 用每週更換的全螢幕影片、Moonlitt 用 edge-to-edge 漸層與 3D 元素營造沉浸感；文案的 voice and tone 也是品牌的一環。她強調 app 是動態體驗，**Zoom Transitions**（NYT Cooking）與 spring 動畫（Gentler Streak）能強化層級與互動，但延遲或掉幀會傷害觀感。色彩方面，建議把品牌色移入 content area / scroll view，讓 Liquid Glass 控制項動態取色，並像 Slack 一樣節制地用 **accent / tint color** 來傳達層級、狀態與選取；同時務必支援 Dark Mode。","字體上，自訂字型（如 Crumbl Sans）可用於記憶點時刻，但必須支援並測試 **Dynamic Type**，讓文字放大時換行而非截斷；若不想自製，**San Francisco** 系列（SF Pro、SF Compact、SF Mono、New York、SF Rounded）已能營造豐富層級。圖示方面，自訂 iconography（如 NYT Cooking）應可辨識、一致且能縮放到小尺寸並尊重各平台慣例，而 **SF Symbols**（超過 7,000 個、內建於 Xcode、像字型一樣縮放）是免費好選擇。最後談到 logo 應低調不佔空間（NYT Cooking 僅在 Home tab 顯示並隨捲動淡出）。整體原則：讓品牌服務於體驗，別讓它凌駕系統行為或混淆熟悉慣例。"],"deepdive":[{"t":0,"title":"Intro","body":"Design Evangelist **Sarah** 開場點出核心問題：如何在表達品牌識別的同時，維持 iOS 熟悉典範的完整性。她說明品牌既有美學面（精煉的 typography、富表現力的 color、iconography 視覺語言），也是一種「感受」。她提醒不應讓 app 與網站、行銷、其他平台長得一模一樣，因為 iPhone 使用者期待 app 看起來、用起來都像 iOS，本場會分享在系統範圍內細緻表達品牌的方法。"},{"t":144,"title":"Components","body":"借用 iOS 26 **Liquid Glass** 概念，把介面分為負責導航與動作的 **UI layer**（tab bar、top toolbar）與承載獨特功能的 **content layer**。以 Gentler Streak（識別鮮明但導航全原生）、Slack（自訂 top toolbar 但按鈕尺寸與 popover 行為仍很 iOS）、Moonlitt（自訂月相日曆元件但採用 Liquid Glass 與 concentric edges）為例，主張僅在最有影響力處才客製元件，其餘用標準元件；並特別舉 SwiftUI 開箱即用的 **context menu** 說明過度客製功能性元件反而顯得不原生或過時。"},{"t":401,"title":"Content","body":"把 content layer 當成品牌的畫布，涵蓋影像、影片與文字。以 Crumbl 每週更換的全螢幕影片、Moonlitt edge-to-edge 漸層與動態 3D 月相為例，強調內容要有明確目的並可營造沉浸感；文案的 voice and tone 也能塑造品牌與情緒（並推薦觀看 UX writing 的相關 session）。她進一步指出 app 是動態體驗，NYT Cooking 用 SwiftUI 的 **Zoom Transitions** 連結點擊目標與轉場、Gentler Streak 用 spring 動畫讓內容生動，但延遲或掉幀會傷害使用者觀感。"},{"t":709,"title":"Color","body":"說明 iOS 26 前 app 常在 toolbar/tab bar 用實色背景，反而壓縮內容區並產生 letterbox。建議把品牌色移入 content area / scroll view，讓 Liquid Glass 控制項動態取色並隨捲動消失。強調色彩應創造意義（層級、分組、互動），多用於控制項與動作的 **accent / tint color**；以 Slack 節制用色（未讀徽章、選取狀態等）為例，並提醒 iPhone 是個人裝置，務必支援 **Dark Mode**，連 widget 也是品牌延伸的觸點。"},{"t":710,"title":"Typography","body":"說明 typography 可富表現力但必須維持功能性。以 Crumbl 自製的 **Crumbl Sans** 用於大標題等記憶點為例，強調自訂字型最須注意的是縮放：必須支援並測試 **Dynamic Type**，讓字級放大時換成多行而非截斷標籤。介紹系統字型 **San Francisco**（支援逾 150 種語言）及其變體 SF Pro、SF Compact、SF Mono、New York，並舉 Gentler Streak 全用系統字型（含 SF Rounded）也能做出層級與獨特感。"},{"t":857,"title":"Iconography","body":"說明自訂 iconography 可用於 app 各處，以 NYT Cooking 銳利邊緣、線條變體、能縮放到小尺寸且尊重各平台分享慣例的圖示為佳例，強調圖示應可辨識、一致、目的明確而非過度風格化。推薦免費的 **SF Symbols**（逾 7,000 個、像字型般動態縮放、內建於 Xcode、具無障礙與在地化支援）。最後談 logo 應低調，以 NYT Cooking 僅在 Home tab 顯示並隨捲動淡出為範例，總結品牌應服務體驗、別凌駕系統行為。"}],"summary_en":["Design Evangelist Sarah explores how to express **brand identity** in an iOS app while preserving the familiar, native experience users expect. Her core philosophy: be familiar where it matters and bespoke where needed—and remember that branding is not just visuals (typography, color, iconography) but also a feeling. She cautions that even if your product appears on a website, in marketing, in a retail store, or on other platforms, you shouldn't default to making everything identical—iPhone users expect apps to look and feel like iOS.","Borrowing the iOS 26 **Liquid Glass** concept, she divides the interface into two layers: the **UI layer** for global navigation and actions (tab bars, top toolbars) and the **content layer** that holds the features making an app unique. The content layer is the best place to express brand, while the UI layer should lean on familiar iOS components. Through examples like Gentler Streak, Slack, and Moonlitt, she argues that navigation should stay native and components should be customized only where they have the biggest impact, noting that often-overlooked standard components like context menus (free out of the box in SwiftUI) save significant build and maintenance cost.","In the content layer, she encourages treating it as a canvas: Crumbl uses weekly-changing full-bleed videos and Moonlitt uses edge-to-edge gradients and 3D elements for immersion; copy's voice and tone are part of the brand too. She stresses that apps are dynamic experiences—**Zoom Transitions** (NYT Cooking) and spring animations (Gentler Streak) reinforce hierarchy and interaction, but lag or dropped frames hurt perception. For color, she recommends moving brand color into the content area / scroll view so Liquid Glass controls pick it up dynamically, and using **accent / tint color** sparingly (as Slack does) to convey hierarchy, state, and selection—while always supporting Dark Mode.","On typography, custom fonts (like Crumbl Sans) work for memorable moments but must support and be tested for **Dynamic Type**, wrapping rather than truncating as text scales; if you'd rather not build your own, the **San Francisco** family (SF Pro, SF Compact, SF Mono, New York, SF Rounded) already creates rich hierarchy. For iconography, custom icons (like NYT Cooking's) should be recognizable, consistent, scale to small sizes, and respect platform conventions, while **SF Symbols** (over 7,000, built into Xcode, scaling like a font) is a great free option. Finally, logos should be understated (NYT Cooking shows its logo only on the Home tab, fading on scroll). The overriding principle: brand should serve the experience, not override system behavior or confuse familiar conventions."],"deepdive_en":[{"t":0,"title":"Intro","body":"Design Evangelist **Sarah** opens with the central question: how to express brand identity while keeping the integrity of familiar iOS paradigms. She notes branding has an aesthetic side (refined typography, expressive color, the visual language of iconography) but is also a feeling. She cautions against making an app identical to its website, marketing, or other platforms, since iPhone users expect apps to look and feel like iOS, and previews practical guidance for expressing brand within the bounds of the OS."},{"t":144,"title":"Components","body":"Borrowing the iOS 26 **Liquid Glass** concept, she splits the interface into the **UI layer** for navigation and actions (tab bars, top toolbars) and the **content layer** holding unique features. Using Gentler Streak (distinct identity but fully native navigation), Slack (custom top toolbar but iOS-like button sizes and popover behavior), and Moonlitt (custom lunar calendar component with Liquid Glass and concentric edges), she argues for customizing components only where impact is highest and using standard components elsewhere—citing SwiftUI's out-of-the-box **context menu** to show that over-customizing utilitarian components can feel non-native or dated."},{"t":401,"title":"Content","body":"She frames the content layer as the brand's canvas, spanning imagery, video, and words. Using Crumbl's weekly full-bleed videos and Moonlitt's edge-to-edge gradients and dynamic 3D moon, she stresses content needs clear purpose and can feel immersive; copy's voice and tone also shape brand and emotion (with a pointer to the UX writing session). She further notes apps are dynamic experiences—NYT Cooking uses SwiftUI's **Zoom Transitions** to connect tap target and transition state, and Gentler Streak uses spring animations to make content pop, but lag or dropped frames damage perception."},{"t":709,"title":"Color","body":"She explains that before iOS 26 apps often used solid backgrounds on toolbars and tab bars, which letterboxed and shrank the content area. The recommendation is to move brand color into the content area / scroll view so Liquid Glass controls pick it up dynamically and scroll away. Color should create meaning (hierarchy, grouping, interaction) and is best applied as **accent / tint color** on controls and actions; she cites Slack's sparing use (unread badges, selected states) and reminds that the iPhone is a personal device, so supporting **Dark Mode** is essential, with widgets being another brand touchpoint."},{"t":710,"title":"Typography","body":"She explains typography can be expressive but must stay functional. Using Crumbl's custom **Crumbl Sans** for memorable large headers, she stresses the key concern with custom fonts is scaling: you must support and test **Dynamic Type** so labels drop to multiple lines rather than truncate as size increases. She introduces the system font **San Francisco** (supporting over 150 languages) and its variants SF Pro, SF Compact, SF Mono, and New York, citing Gentler Streak's use of system fonts entirely (including SF Rounded) to achieve variety and a distinct feel."},{"t":857,"title":"Iconography","body":"She explains custom iconography can be used throughout an app, citing NYT Cooking's sharp-edged, line-weight icons that scale well to small sizes and respect each platform's sharing conventions, and stresses icons should be identifiable, consistent, and purposeful rather than heavily stylized. She recommends the free **SF Symbols** (over 7,000 symbols, scaling like a font, built into Xcode, with accessibility and localization support). She closes on logos being understated—NYT Cooking shows its logo only on the Home tab, fading on scroll—concluding that brand should serve the experience rather than override system behavior."}],"code":[]},"related":[{"id":"220","title":"Refine accessibility for custom controls","gloss":"為自訂控制項優化無障礙體驗","gloss_en":"Refine accessibility for custom controls","category":"design","categoryLabel":"設計"},{"id":"250","title":"Principles of great design","gloss":"卓越設計的原則","gloss_en":"Principles of great design","category":"design","categoryLabel":"設計"},{"id":"290","title":"Craft clear names for features and labels in your app","gloss":"為 App 的功能與標籤取清楚的名稱","gloss_en":"Craft clear names for features and labels in your app","category":"design","categoryLabel":"設計"},{"id":"292","title":"Design intuitive search experiences","gloss":"設計直覺的搜尋體驗","gloss_en":"Design intuitive search experiences","category":"design","categoryLabel":"設計"},{"id":"8005","title":"Accessibility Technologies Group Lab","gloss":"無障礙技術小組實驗室","gloss_en":"Accessibility Technologies Group Lab","category":"design","categoryLabel":"設計"}]}</script>
