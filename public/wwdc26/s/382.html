<script id="d" type="application/json">{"s":{"id":"382","title":"Inside Apple Intelligence and Xcode: Special Presentation","gloss":"深入 Apple Intelligence 與 Xcode：特別發表","category":"ai","categoryLabel":"AI 與機器學習","duration":5272,"url":"https://developer.apple.com/videos/play/wwdc2026/382/","takeaway":"在 Steve Jobs Theater 一次掌握 Xcode 27、App Intents、Foundation Models、Core AI 與 MLX 等 Apple Intelligence 與開發工具的最新進展。","chapters":[[1,"Welcome"],[450,"Xcode 27"],[1607,"App Intents"],[2604,"Foundation Models framework"],[3680,"Core AI"],[4426,"MLX"],[5161,"Next steps"]],"points":[{"text":"於 Steve Jobs Theater 舉行的特別發表，總覽 **Apple Intelligence** 與 **Xcode** 的最新進展。","hot":true},{"text":"介紹 **Xcode 27** 如何加速開發流程，是本場的重點段落之一。","hot":false},{"text":"說明 **App Intents** 與 **Foundation Models framework** 如何把智慧功能帶進你的 App。","hot":false},{"text":"涵蓋 **Core AI** 與 **MLX**，介紹底層 AI 能力與在 Apple 裝置上執行模型的方案。","hot":false}],"apis":["Xcode","App Intents","Foundation Models","Core AI","MLX"],"audience":"**想一次掌握 Apple Intelligence 與開發工具走向**的所有 Apple 平台開發者。","gloss_en":"Inside Apple Intelligence and Xcode: Special Presentation","takeaway_en":"At Steve Jobs Theater, get caught up all at once on the latest advancements in Apple Intelligence and developer tools, including Xcode 27, App Intents, Foundation Models, Core AI, and MLX.","points_en":[{"text":"A special presentation held at Steve Jobs Theater, surveying the latest advancements in **Apple Intelligence** and **Xcode**.","hot":true},{"text":"Introduces how **Xcode 27** accelerates the development workflow, one of the session's key segments.","hot":false},{"text":"Explains how **App Intents** and the **Foundation Models framework** bring intelligent features into your app.","hot":false},{"text":"Covers **Core AI** and **MLX**, introducing the underlying AI capabilities and ways to run models on Apple devices.","hot":false}],"audience_en":"All Apple platform developers who **want to get caught up all at once on the direction of Apple Intelligence and developer tools**.","summary":["這是一場在 **Steve Jobs Theater** 舉行的特別發表，主題環繞 **Apple Intelligence** 與 **Xcode** 的最新進展，目標是讓開發者了解如何運用 Apple 的裝置端智慧與升級後的開發工具來加速開發流程。內容從歡迎開場，貫穿 Xcode 27、App Intents、Foundation Models framework、Core AI 到 MLX，最後收尾於後續行動建議，整體像是一份把「智慧」如何滲透進整個開發與執行環節的全景導覽。","工具鏈方面，**Xcode 27** 是這場的重心之一，強調把生成式與輔助式的智慧能力直接整合進 IDE，讓寫程式、理解程式碼與除錯都更省力。緊接著的 **App Intents** 則把焦點移到讓 app 的功能被系統與智慧層理解、調用，使 Siri、Spotlight 等入口能更深度地驅動 app 行為。","在模型與執行層，**Foundation Models framework** 提供了直接在裝置上呼叫 Apple 大型語言模型的途徑，讓開發者以隱私優先、離線可用的方式把生成能力嵌入 app；**Core AI** 與 **MLX** 則分別代表系統層的 AI 基礎建設，以及在 Apple Silicon 上做機器學習研究與自訂模型訓練／推論的高效框架。","整體訊息很明確：Apple 正把智慧能力從系統一路延伸到開發工具與自訂模型，**Foundation Models**、**App Intents**、**Core AI** 與 **MLX** 構成一套可組合的堆疊。實務上的下一步，是評估自家 app 哪些環節能用裝置端模型強化、用 App Intents 暴露關鍵功能，並善用 Xcode 27 的智慧輔助加速落地。"],"deepdive":[{"t":1,"title":"Welcome","body":"在 **Steve Jobs Theater** 的開場歡迎，為這場 **Apple Intelligence** 與 **Xcode** 的特別發表定調，預告將涵蓋從開發工具到裝置端模型的多項進展。主軸是說明這些能力如何串連起來，協助開發者加速開發流程。"},{"t":450,"title":"Xcode 27","body":"聚焦 **Xcode 27** 如何把智慧輔助能力整合進 IDE，讓撰寫、理解與除錯程式碼更有效率。重點在於把生成式與輔助式工具帶到開發者日常的工作流程中。"},{"t":1607,"title":"App Intents","body":"介紹 **App Intents** 如何讓 app 的核心功能被系統與智慧層理解與調用，串接 Siri、Spotlight 等系統入口。透過清楚定義 intents，app 能更深度地參與裝置端的智慧體驗。"},{"t":2604,"title":"Foundation Models framework","body":"說明 **Foundation Models framework** 讓開發者直接在裝置上呼叫 Apple 的大型語言模型，以隱私優先、離線可用的方式把生成能力嵌入 app。這是把 Apple Intelligence 落地到第三方 app 的關鍵途徑。"},{"t":3680,"title":"Core AI","body":"介紹 **Core AI** 作為系統層的 AI 基礎建設，承載並協調裝置上的智慧能力。重點在於它如何為上層的 Foundation Models 與 app 功能提供統一的基礎。"},{"t":4426,"title":"MLX","body":"聚焦 **MLX** 這套針對 **Apple Silicon** 最佳化的機器學習框架，支援在 Mac 上做研究、訓練與推論。它讓開發者能高效地實驗與部署自訂模型。"},{"t":5161,"title":"Next steps","body":"收尾整理後續行動建議，引導開發者評估哪些 app 環節適合導入裝置端模型與 **App Intents**，並善用 **Xcode 27** 的智慧輔助。鼓勵把這套可組合的智慧堆疊實際應用到自家專案。"}],"summary_en":["This is a special presentation held in the **Steve Jobs Theater**, centered on the latest advancements in **Apple Intelligence** and **Xcode**, aimed at showing developers how to use Apple's on-device intelligence and upgraded tooling to accelerate their workflows. It runs from a welcome opening through Xcode 27, App Intents, the Foundation Models framework, Core AI, and MLX, closing with next steps — a panoramic tour of how intelligence threads through the entire development and runtime stack.","On the tooling side, **Xcode 27** is a key focus, emphasizing how generative and assistive intelligence is integrated directly into the IDE to make writing, understanding, and debugging code easier. **App Intents** then shifts the focus to making an app's capabilities understandable and invocable by the system and the intelligence layer, so entry points like Siri and Spotlight can drive app behavior more deeply.","At the model and runtime layer, the **Foundation Models framework** provides a path to call Apple's large language models directly on device, letting developers embed generative capabilities in a privacy-first, offline-capable way; **Core AI** and **MLX** represent the system-level AI foundation and an efficient framework for machine learning research and custom model training/inference on Apple Silicon, respectively.","The overall message is clear: Apple is extending intelligence from the system all the way into developer tools and custom models, with **Foundation Models**, **App Intents**, **Core AI**, and **MLX** forming a composable stack. Practically, the next step is to assess which parts of your app can be enhanced with on-device models, expose key functionality via App Intents, and use Xcode 27's intelligent assistance to ship faster."],"deepdive_en":[{"t":1,"title":"Welcome","body":"An opening welcome in the **Steve Jobs Theater** sets the stage for this special presentation on **Apple Intelligence** and **Xcode**, previewing advancements spanning from developer tools to on-device models. The throughline is how these capabilities connect to help developers accelerate their workflows."},{"t":450,"title":"Xcode 27","body":"Focuses on how **Xcode 27** integrates intelligent assistance into the IDE to make writing, understanding, and debugging code more efficient. The emphasis is on bringing generative and assistive tooling into developers' day-to-day workflow."},{"t":1607,"title":"App Intents","body":"Introduces how **App Intents** make an app's core capabilities understandable and invocable by the system and the intelligence layer, connecting entry points like Siri and Spotlight. By clearly defining intents, an app can participate more deeply in the device's intelligent experiences."},{"t":2604,"title":"Foundation Models framework","body":"Explains how the **Foundation Models framework** lets developers call Apple's large language models directly on device, embedding generative capabilities in a privacy-first, offline-capable way. This is the key path for bringing Apple Intelligence into third-party apps."},{"t":3680,"title":"Core AI","body":"Introduces **Core AI** as the system-level AI foundation that hosts and coordinates on-device intelligence. The focus is on how it provides a unified base for the higher-level Foundation Models and app features."},{"t":4426,"title":"MLX","body":"Focuses on **MLX**, a machine learning framework optimized for **Apple Silicon** that supports research, training, and inference on the Mac. It enables developers to experiment with and deploy custom models efficiently."},{"t":5161,"title":"Next steps","body":"Wraps up with next-step guidance, encouraging developers to assess which parts of their apps suit on-device models and **App Intents**, and to leverage **Xcode 27**'s intelligent assistance. It motivates applying this composable intelligence stack to real projects."}],"code":[]},"related":[{"id":"232","title":"Run local agentic AI on the Mac using MLX","gloss":"用 MLX 在 Mac 上執行本機 agentic AI","gloss_en":"Run local agentic AI on the Mac using MLX","category":"ai","categoryLabel":"AI 與機器學習"},{"id":"233","title":"Explore distributed inference and training with MLX","gloss":"用 MLX 探索分散式推論與訓練","gloss_en":"Explore distributed inference and training with MLX","category":"ai","categoryLabel":"AI 與機器學習"},{"id":"240","title":"Build intelligent Siri experiences with App Schemas","gloss":"用 App Schemas 打造智慧 Siri 體驗","gloss_en":"Build intelligent Siri experiences with App Schemas","category":"ai","categoryLabel":"AI 與機器學習"},{"id":"325","title":"Dive into Core AI model authoring and optimization","gloss":"深入 Core AI 模型編寫與最佳化","gloss_en":"Dive into Core AI model authoring and optimization","category":"ai","categoryLabel":"AI 與機器學習"},{"id":"328","title":"Explore numerical computing in Swift with MLX","gloss":"用 MLX 探索 Swift 的數值計算","gloss_en":"Explore numerical computing in Swift with MLX","category":"ai","categoryLabel":"AI 與機器學習"}]}</script>
