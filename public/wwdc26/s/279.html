<script id="d" type="application/json">{"s":{"id":"279","title":"Explore advances in RealityKit","gloss":"探索 RealityKit 的最新進展","category":"visionos","categoryLabel":"visionOS","duration":1431,"url":"https://developer.apple.com/videos/play/wwdc2026/279/","takeaway":"RealityKit 新增柔和陰影、導航網格、布料模擬、LOD、3D 高斯潑濺與沉浸式音訊等能力，讓 App 與遊戲更擬真、更具沉浸感。","chapters":[[0,"Introduction"],[120,"Lighting and shadows"],[242,"Soft shadows"],[373,"Projective textures"],[433,"Physical space lighting"],[464,"Navigation mesh"],[586,"Querying the navigation mesh"],[661,"Cloth simulation"],[771,"Pinning cloth to anchor points"],[822,"Performance"],[882,"LOD by camera distance"],[958,"LOD by screen area"],[986,"Responding to thermal state changes"],[1029,"3D Gaussian splats"],[1124,"Creating a Gaussian splat"],[1148,"Immersive audio"],[1249,"Creating a custom reverb mesh"],[1293,"Creating custom reverb materials"],[1362,"Next steps"]],"points":[{"text":"強化**光照與陰影**：以 **SpotLightComponent.Shadow** 啟用柔和陰影，並支援投影貼圖與實體空間光照。","hot":false},{"text":"新增**導航網格（navigation mesh）**，用 **NavigationController** 計算路徑，支援網格點與離網連結（如梯子）。","hot":false},{"text":"提供**布料模擬**，可將布料頂點以 kinematic 方式釘在錨點上。","hot":false},{"text":"用 **LevelOfDetailComponent** 依相機距離或螢幕面積切換 LOD，並監聽 thermalState 調整效能。","hot":false},{"text":"引入 **3D Gaussian splats（GaussianSplatComponent）**與沉浸式音訊的自訂 reverb 網格與材質。","hot":true}],"apis":["RealityKit","SpotLightComponent","SpotLightComponent.Shadow","SpotLightComponent.ProjectiveTexture","SpotLightComponent.SurroundingsLight","NavigationController","ClothSphereShape","LevelOfDetailComponent","ProcessInfo.thermalState","GaussianSplatResource","GaussianSplatComponent","ReverbMeshResource","ReverbComponent","Audio.Material"],"audience":"**開發 visionOS 沉浸式體驗與 3D 遊戲的 RealityKit 開發者**，想提升擬真度與效能的人。","gloss_en":"Explore advances in RealityKit","takeaway_en":"RealityKit adds soft shadows, navigation meshes, cloth simulation, LOD, 3D Gaussian splats, and immersive audio, making apps and games more realistic and immersive than ever.","points_en":[{"text":"Enhanced **lighting and shadows**: enable soft shadows with **SpotLightComponent.Shadow**, with support for projected textures and physical-space lighting.","hot":false},{"text":"Adds a **navigation mesh**, using **NavigationController** to compute paths, with support for mesh points and off-mesh links (such as ladders).","hot":false},{"text":"Provides **cloth simulation**, letting you pin cloth vertices to anchors in a kinematic manner.","hot":false},{"text":"Use **LevelOfDetailComponent** to switch LOD based on camera distance or screen area, and observe thermalState to adjust performance.","hot":false},{"text":"Introduces **3D Gaussian splats (GaussianSplatComponent)** and custom reverb meshes and materials for immersive audio.","hot":true}],"audience_en":"**RealityKit developers building visionOS immersive experiences and 3D games** who want to improve realism and performance.","summary":["這場由 RealityKit 團隊的工程師 Dennis 主講，串連今年一系列讓 3D 空間體驗更逼真、更沉浸的新功能，並以一款示範遊戲 **Chaparral Village**（玩家被縮小、穿越村莊前往煉金區）貫穿全場。RealityKit 可一次建置、部署到 visionOS、iOS、iPadOS、macOS 與 tvOS，今年並搭配 **Reality Composer Pro 3** 一同推出。","光影方面有三大進展：用 Reality Composer Pro 3 的 light baker 產生 **lightmap**（間接光、ambient occlusion、beauty）來補強靜態照明；以 **soft shadows** 讓有面積的動態光源產生帶 penumbra 的柔邊陰影（透過 shadow 的 **lightSize** 與 **quality**，quality 須為 medium 或 high）；以及 **projective textures** 搭配 **physical space lighting**（SpotLight 的 **SurroundingsLight** component）讓虛擬光線投射到真實房間的牆面。導航則引入 **navigation mesh**：用 **NavigationMeshResource** 定義可通行區域、區域成本與 **off-mesh connection**，餵進 **NavigationComponent**，再由 **NavigationController** 以 computePath 算出路徑（可區分 meshPoint 與梯子等 off-mesh 連結）。","進階模擬與效能是另一重點。**Cloth simulation** 以 mesh 的頂點為粒子、邊為彈簧，透過 cloth body／cloth collider／cloth simulation component 模擬窗簾、衣物與床單，並可把頂點設為 **kinematic** 把布料釘在固定點（如窗簾掛環）。為了顧及效能，可用 **LevelOfDetailComponent** 以 **addByCameraDistance** 或 **addByScreenArea** 設定 LOD，並監聽 **thermalStateDidChange**，在 serious／critical 時更積極切換 LOD 或降低陰影品質。","最後是擬真呈現與聲音。**3D Gaussian splats** 用一組帶不透明度的 3D 高斯橢球高效呈現真實世界擷取的體積資料，開發者提供 position／scale／rotation／opacity／spherical harmonics 等 buffer，組成 **GaussianSplatResource** 與 **GaussianSplatComponent** 後附加到 entity。沉浸式音訊則以 ray-traced geometrical acoustics 模擬反射與殘響：用 **ReverbMeshResource**（最簡單從 shoebox 開始）搭配 **Audio.Material**（preset 或以 **Audio.Absorption**／**Audio.Scattering** 自訂吸收與散射係數）建立 **ReverbComponent**；此功能僅在 immersive space 生效，shared space 則使用系統依真實環境建立的 room-sense 殘響。"],"deepdive":[{"t":0,"title":"Introduction","body":"由 RealityKit 團隊的軟體工程師 **Dennis** 開場。回顧 RealityKit 自 2019 年起讓開發者一次建置、跨 **visionOS／iOS／iPadOS／macOS／tvOS** 部署 3D 空間體驗，今年並推出 **Reality Composer Pro 3**。接著預告本場涵蓋光影、navigation mesh、cloth simulation、效能、3D Gaussian splats 與沉浸式音訊。"},{"t":120,"title":"Lighting and shadows","body":"以 **Chaparral Village** 煉金區為例，角落偏暗時可用 **lightmap** 補強照明。用 Reality Composer Pro 3 的 **light baker** 烘焙間接光 lightmap 套用後，角落與陰影因正確反映反射光而變亮。RealityKit API 支援自行附加 indirect lighting、ambient occlusion 與 beauty 的 lightmap，但建議用 light baker 產生以獲得最佳效果。"},{"t":242,"title":"Soft shadows","body":"lightmap 只處理靜態照明，**soft shadows** 則把柔邊陰影帶到動態光源。當光源有面積時陰影會出現 **penumbra**，光的面積越大 penumbra 越大。範例取得 hearth spotlight 的 shadow，把 **lightSize** 從 0 改為 0.7 公尺、並把 **quality** 設為 medium（low 仍會是硬陰影，須 medium 或 high 才有柔陰影），再 set 回 entity。"},{"t":373,"title":"Projective textures","body":"**Projective textures** 模擬「光透過底片投射到表面」的效果，可呈現窗花圖樣或海底 caustics 等。範例為虛擬天文館建立 **SpotLightComponent**（顏色設白以免染色），產生星雲貼圖後以 **SpotLightComponent.ProjectiveTexture** 附加，讓星星與星雲投射到虛擬牆面。"},{"t":433,"title":"Physical space lighting","body":"要讓投影打到真實房間，需啟用 **physical space lighting**：讓虛擬光透過 RealityKit 的 scene understanding mesh 與真實環境互動（目前僅支援 spotlight 與 point light）。做法只需對 spotlight entity 加上 **SpotLightComponent.SurroundingsLight** component，星雲便會投射到真實牆面。"},{"t":464,"title":"Navigation mesh","body":"以「從地圖一端走到旗幟、途中出現障礙」說明 **navigation mesh** 如何定義可通行區域並避開密林。可給區域不同的 **traversal cost** 以反映較慢的路徑，並用 **off-mesh connection**（如橋）連接被裂隙分開的兩塊 mesh。資料以 **NavigationMeshResource**（含標記區域、自訂 flag 與連結）定義，可用 Swift API 或 Reality Composer Pro 3 建立，再餵入帶 filter 的 **NavigationComponent**。"},{"t":586,"title":"Querying the navigation mesh","body":"在 Chaparral Village 的 navigate 擴充函式中，先以 entity 的 navigation component 建立 **NavigationController**，再用 async 的 **computePath** 算出由現位置到玩家點擊處的路徑。結果為 nil 表示找不到路、空陣列表示已到達；否則遍歷 path node，**meshPoint** 直接附加位置，**offMeshConnection** 則另行處理（如爬梯子）。"},{"t":661,"title":"Cloth simulation","body":"**Cloth simulation** 以 mesh 描述布料：頂點是粒子、連接的邊是彈簧，頂點夠多即可逼真模擬金色禮服或床單的皺褶與翻折。需加上 **cloth body component**（含材質與 cloth mesh resource）、選用 **cloth collider component**（可碰撞的剛體），再加 **cloth simulation component**（含材質陣列與 solver、gravity、time step 等模擬屬性）來實際運行。"},{"t":771,"title":"Pinning cloth to anchor points","body":"示範以自訂 curtain pin component 把窗簾釘在掛環。遍歷 pin 取得位置，建立 **ClothSphereShape** 代表釘子大小，用 `clothMesh.vertices(in:center:)` 取得範圍內頂點，再以 `motionTypes.set(vertexIndices:value: .kinematic)` 把這些頂點設為 **kinematic**——只受 entity transform 影響、不受布料模擬移動，藉此固定窗簾不致掉落。"},{"t":822,"title":"Performance","body":"前述功能若不謹慎使用可能影響效能。講者先介紹可改善效能的技術（mesh level of detail），再說明如何追蹤效能指標（thermal state）讓 app 與遊戲據以調整。"},{"t":882,"title":"LOD by camera distance","body":"**Mesh level of detail（LOD）** 以較低細節渲染幾何而視覺影響甚微，以煉金區的 cauldron 為例，遠看時 LOD 5 與 LOD 0 差異可忽略卻省下大量計算。範例用 **LevelOfDetailComponent.addByCameraDistance** 設定，依與相機的距離為各 LOD 指定 **maxDistance**，最後一個 LOD 設為 `.infinity`。"},{"t":958,"title":"LOD by screen area","body":"第二種切換演算法依 entity 佔據的螢幕面積：佔比越小可選越高的 LOD。範例用 **LevelOfDetailComponent.addByScreenArea**，以螢幕面積比例的 **minArea** 為各 LOD 指定門檻，低於該比例就切到下一級 LOD。"},{"t":986,"title":"Responding to thermal state changes","body":"除了用 LOD 改善效能，也應在效能吃緊時反應。可對 **thermalStateDidChange** 通知註冊 observer，查詢 `ProcessInfo.processInfo.thermalState`：nominal／fair 維持現狀；serious／critical 則採取措施，例如更積極的 LOD 切換門檻或降低陰影品質。"},{"t":1029,"title":"3D Gaussian splats","body":"**3D Gaussian splats** 是高效能、高品質呈現真實世界擷取體積資料的技術，以一組帶不同不透明度的 3D 高斯橢球（ellipsoid）表示場景，渲染時於每像素沿各 gaussian 評估射線，RealityKit API 會處理眾多最佳化。講者展示在 Apple Vision Pro 上渲染盆栽多肉的細節，並提供可從 developer.apple.com 下載的範例。"},{"t":1124,"title":"Creating a Gaussian splat","body":"RealityKit 不假設特定檔案格式，需自行提供描述 splat 的 buffer：**position、scale、rotation、opacity 與 spherical harmonics**（搭配 degree 控制隨視角變化的顏色，degree 0 為各方向同色）。將這些組成 **BufferResource** 建立 **GaussianSplatResource**，再建立 **GaussianSplatComponent** 並附加到場景中的 entity 即可渲染。"},{"t":1148,"title":"Immersive audio","body":"沉浸式音訊透過聲音強化 Apple Vision Pro 體驗的真實感。準確的直達與反射路徑方向與時序至關重要，且環境的幾何與材質大幅影響聽感（小客廳與大型博物館差異甚鉅）。RealityKit 以 **ray-traced geometrical acoustics** 模擬反射與殘響，並釋出一個可在博物館場景中聽到虛擬樂團、各樂器聲音獨立可控的範例。"},{"t":1249,"title":"Creating a custom reverb mesh","body":"建立 custom reverb mesh 先以 **ReverbMeshResource** 定義場景幾何，最簡單從 **shoebox**（面朝內的盒子）開始，範例設為 5×4×6 公尺。再把此 mesh 與 **dryWall** preset 材質組成 `.simulated` 的 **Reverb**，最後建立 **ReverbComponent** 附加到 entity 即可生效。"},{"t":1293,"title":"Creating custom reverb materials","body":"除了 preset，也可自訂 **Audio.Material**。範例以 `carpet.scalingAbsorption` 調高吸收度造出 thickCarpet；bookshelf 則從零定義，以 **Audio.Absorption** 指定 10 個中心頻段的吸收係數、以 **Audio.Scattering** 指定數個特定頻率的散射係數（RealityKit 會外插補滿頻譜）。須注意此功能僅在 immersive space 生效，shared space 則改用 Apple Vision Pro 依真實環境建立的 room-sense 殘響。"},{"t":1362,"title":"Next steps","body":"總結本場僅觸及今年 RealityKit 新功能的一部分，另有 coordinated multi-source audio、含 subsurface scattering 與進階毛髮 shader 的高品質角色渲染、可自訂 portal 材質等。建議到 developer.apple.com 下載範例實際體驗，並關注 **Reality Composer Pro 3** 這個重大新版本。"}],"summary_en":["Presented by RealityKit engineer Dennis, this session threads together this year's new features for more realistic, immersive 3D spatial experiences, using a demo game **Chaparral Village** (the player is shrunk and must traverse a village to reach an alchemy area) as a running example. RealityKit lets you build once and deploy to visionOS, iOS, iPadOS, macOS, and tvOS, and ships this year alongside **Reality Composer Pro 3**.","Lighting sees three advances: **lightmaps** baked with Reality Composer Pro 3's light baker (indirect lighting, ambient occlusion, beauty) to enhance static lighting; **soft shadows** that give area lights penumbra-edged shadows via the shadow's **lightSize** and **quality** (which must be medium or high); and **projective textures** combined with **physical space lighting** (the SpotLight's **SurroundingsLight** component) to cast virtual light onto real-world walls. Navigation introduces a **navigation mesh**: define traversable areas, area costs, and **off-mesh connections** with a **NavigationMeshResource**, feed it into a **NavigationComponent**, then have a **NavigationController** compute the path with computePath (distinguishing meshPoint nodes from off-mesh links like ladders).","Advanced simulation and performance are another focus. **Cloth simulation** treats mesh vertices as particles and edges as springs, simulating curtains, garments, and bedding via cloth body / cloth collider / cloth simulation components, and can pin cloth in place by setting vertices to **kinematic** (e.g. curtain hoops). To manage performance, use the **LevelOfDetailComponent** with **addByCameraDistance** or **addByScreenArea** to set up LODs, and observe **thermalStateDidChange** to switch LODs more aggressively or lower shadow quality when the state turns serious or critical.","Finally, realistic rendering and sound. **3D Gaussian splats** efficiently render real-world volumetric captures as a collection of opacity-bearing 3D Gaussian ellipsoids; developers supply position/scale/rotation/opacity/spherical-harmonics buffers, assemble a **GaussianSplatResource** and **GaussianSplatComponent**, and attach it to an entity. Immersive audio uses ray-traced geometrical acoustics to simulate reflections and reverb: build a **ReverbComponent** from a **ReverbMeshResource** (easiest starting from a shoebox) and **Audio.Material** (presets, or custom absorption/scattering via **Audio.Absorption** and **Audio.Scattering**). This only works in immersive spaces—in shared spaces the system's room-sense reverb built from your real surroundings is used instead."],"deepdive_en":[{"t":0,"title":"Introduction","body":"RealityKit software engineer **Dennis** opens. He recaps that since 2019 RealityKit has let developers build once and deploy 3D spatial experiences across **visionOS/iOS/iPadOS/macOS/tvOS**, and that **Reality Composer Pro 3** ships this year. He previews the session's topics: lighting, navigation mesh, cloth simulation, performance, 3D Gaussian splats, and immersive audio."},{"t":120,"title":"Lighting and shadows","body":"Using the **Chaparral Village** alchemy area, dark corners are enhanced with **lightmaps**. Baking an indirect-lighting lightmap with Reality Composer Pro 3's **light baker** brightens corners and shadows by correctly accounting for reflected light. The RealityKit API supports attaching your own indirect lighting, ambient occlusion, and beauty lightmaps, but the light baker is recommended for best results."},{"t":242,"title":"Soft shadows","body":"Lightmaps handle only static lighting; **soft shadows** bring soft edges to dynamic lights. When a light has area, the shadow exhibits a **penumbra** that grows with the light's area. The example gets the hearth spotlight's shadow, sets **lightSize** from 0 to 0.7 meters and **quality** to medium (low yields a hard shadow; medium or high is required for soft shadows), then sets it back on the entity."},{"t":373,"title":"Projective textures","body":"**Projective textures** emulate light shining through film onto a surface, rendering effects like intricate window patterns or seafloor caustics. The planetarium example creates a **SpotLightComponent** (color white to avoid tinting), generates a stars-and-nebulae texture, and attaches it via **SpotLightComponent.ProjectiveTexture** so the stars project onto virtual walls."},{"t":433,"title":"Physical space lighting","body":"To project onto a real room, enable **physical space lighting**, letting virtual lights interact with the real environment via RealityKit's scene understanding mesh (currently only spotlights and point lights). It's enabled simply by adding the **SpotLightComponent.SurroundingsLight** component to the spotlight entity, after which the stars project onto the real walls."},{"t":464,"title":"Navigation mesh","body":"Using a \"reach the flag while obstacles appear\" example, the **navigation mesh** defines traversable areas and avoids dense forests. Areas can be given different **traversal costs** to reflect slower routes, and an **off-mesh connection** (like a bridge) can join two meshes split by a rift. Data is defined in a **NavigationMeshResource** (labeled areas, custom flags, connections) via the Swift API or Reality Composer Pro 3, then fed into a filtered **NavigationComponent**."},{"t":586,"title":"Querying the navigation mesh","body":"In Chaparral Village's navigate extension, a **NavigationController** is created from the entity's navigation component, then the async **computePath** computes a path from the current position to where the player tapped. A nil result means no path; an empty array means the destination is reached; otherwise the path nodes are iterated, appending position for a **meshPoint** and handling an **offMeshConnection** separately (e.g. climbing a ladder)."},{"t":661,"title":"Cloth simulation","body":"**Cloth simulation** describes cloth as a mesh where vertices are particles and edges are springs; with enough vertices it realistically simulates a flowing gown or bed covers creasing and folding in real time. It requires a **cloth body component** (material plus cloth mesh resource), optionally a **cloth collider component** (rigid objects to collide with), and a **cloth simulation component** (material array plus properties like solver, gravity, and time step) to run."},{"t":771,"title":"Pinning cloth to anchor points","body":"Demonstrates pinning curtains to hoops with a custom pin component. It iterates over pins, builds a **ClothSphereShape** for the pin's size, gets the enclosed vertices via `clothMesh.vertices(in:center:)`, and sets them to **kinematic** with `motionTypes.set(vertexIndices:value: .kinematic)`—kinematic vertices move only with the entity's transform, not the simulation—keeping the curtains in place."},{"t":822,"title":"Performance","body":"The features above can cost performance if used carelessly. The presenter first covers a technique to improve performance (mesh level of detail) and then how to track a performance indicator (thermal state) so apps and games can adapt accordingly."},{"t":882,"title":"LOD by camera distance","body":"**Mesh level of detail (LOD)** renders geometry at lower detail with negligible visual impact—using the cauldron, LOD 5 viewed far away is indistinguishable from LOD 0 while requiring far less compute. The example uses **LevelOfDetailComponent.addByCameraDistance**, specifying a **maxDistance** per LOD and setting the last LOD to `.infinity`."},{"t":958,"title":"LOD by screen area","body":"The second switching algorithm is based on the screen area an entity occupies: the less area, the higher the LOD selected. The example uses **LevelOfDetailComponent.addByScreenArea**, specifying a **minArea** as a fraction of screen area per LOD; below that fraction it switches to the next LOD."},{"t":986,"title":"Responding to thermal state changes","body":"Beyond LODs, apps should react when performance is strained by registering an observer on the **thermalStateDidChange** notification and querying `ProcessInfo.processInfo.thermalState`: nominal/fair means stay the course; serious/critical means take steps like more aggressive LOD switching thresholds or lower shadow quality."},{"t":1029,"title":"3D Gaussian splats","body":"**3D Gaussian splats** are a high-performance, high-quality technique for rendering real-world volumetric captures, representing scenes as a collection of opacity-bearing 3D Gaussian ellipsoids; rendering evaluates a ray along all Gaussians per pixel, with RealityKit's API handling the optimizations. The presenter shows a potted succulent rendered flawlessly on Apple Vision Pro and points to a sample on developer.apple.com."},{"t":1124,"title":"Creating a Gaussian splat","body":"RealityKit assumes no specific file format; you supply buffers describing each splat's **position, scale, rotation, opacity, and spherical harmonics** (with a degree controlling color variation by viewing direction—degree 0 is a solid color). These are assembled into a **BufferResource** to create a **GaussianSplatResource**, then a **GaussianSplatComponent** is created and attached to an entity to render."},{"t":1148,"title":"Immersive audio","body":"Immersive audio enhances Apple Vision Pro realism through sound. Accurate direction and timing of the direct and reflection paths are essential, and the environment's geometry and materials heavily affect the sound (a small living room versus a large museum). RealityKit simulates reflections and reverb with **ray-traced geometrical acoustics**, and a sample lets you hear a virtual band in a museum with independently controllable instruments."},{"t":1249,"title":"Creating a custom reverb mesh","body":"To create a custom reverb mesh, first define the scene geometry with a **ReverbMeshResource**—easiest from a **shoebox** (a box with faces pointed inward), set here to 5×4×6 meters. Combine that mesh with the **dryWall** preset material to create a `.simulated` **Reverb**, then build a **ReverbComponent** and attach it to an entity to take effect."},{"t":1293,"title":"Creating custom reverb materials","body":"Beyond presets, you can create custom **Audio.Material**. The example uses `carpet.scalingAbsorption` to make a more absorbent thickCarpet, and builds a bookshelf from scratch by specifying absorption coefficients for the 10 center-frequency bands via **Audio.Absorption** and scattering coefficients for a few frequencies via **Audio.Scattering** (RealityKit extrapolates across the spectrum). Note this only works in immersive spaces; in shared spaces the Apple Vision Pro's room-sense reverb built from your real surroundings is used instead."},{"t":1362,"title":"Next steps","body":"The session only scratches the surface of this year's RealityKit features, with more such as coordinated multi-source audio, high-quality character rendering with subsurface scattering and advanced hair shaders, and custom portal materials. The recommendation is to download the samples from developer.apple.com and explore **Reality Composer Pro 3**, a major new release."}],"code":["// Enable soft shadows for the hearth spotlight\n    \nguard var shadow = hearthSpotlight.components[SpotLightComponent.Shadow.self] else {\n    // handle error\n}\nshadow.lightSize = 0.7 // meters\n    \nshadow.quality = .medium // or .high\n// shadow.quality = .low // will result in hard shadows\n    \nhearthSpotlight.components.set(shadow)","// Create one of the planetarium spotlights\n    \nlet spotLightEntity = Entity()\nspotLightEntity.components.set(SpotLightComponent(\n    color: .white,\n    intensity: intensity,\n    innerAngleInDegrees: innerAngle,\n    outerAngleInDegrees: outerAngle,\n    attenuationRadius: attenuationRadius,\n))\n    \nlet projectiveTexture: TextureResource = generateStarsAndNebulaeTexture()\nspotLightEntity.components.set(SpotLightComponent.ProjectiveTexture(\n    texture: projectiveTexture\n))","// Enable physical space lighting\n    \nspotLightEntity.components.set(SpotLightComponent.SurroundingsLight())","// Querying the navigation mesh in Chaparral Village\n\nextension Entity {\n    public func navigate(/* ... */) async {\n        let navigator = try! NavigationController(entity: self)\n        guard let result = await navigator.computePath(from: fromPosition, to: toPosition) \n        else {\n            return\n        }\n        if result.isEmpty {\n            return\n        }\n        for node in result {\n            switch node.category {\n                case .meshPoint:\n                    finalPath.append(node.position)\n                case .offMeshConnection:\n                    // handle ladders\n            }\n        }\n    }\n}","// Pin the curtains to the Alchemist's lab\n\nfor (pin, pinComponent) in pins {\n        let position = pin.position(relativeTo: event.entity)\n        let selectionSphere = ClothSphereShape(radius: pinComponent.radius)\n    \n        let vertices = clothMesh.vertices(in: .sphere(selectionSphere),\n                                    center: position)\n        clothBody.motionTypes.set(vertexIndices: vertices, value: .kinematic)\n}","// Create entity with LODs\n    \nlet lod0 = [ModelEntity(mesh: lodMesh0)]\nlet lod1 = [ModelEntity(mesh: lodMesh1)]\nlet lod2 = [ModelEntity(mesh: lodMesh2)]\n\nlet entity = Entity()\n\nLevelOfDetailComponent.addByCameraDistance(to: entity, levels: [\n    (entities: lod0, maxDistance: 1.0 /* meters */), // highest detail\n    (entities: lod1, maxDistance: 5.0),              // medium detail\n    (entities: lod2, maxDistance: .infinity),        // lowest detail\n])","// Create entity with LODs\n    \nlet lod0 = [ModelEntity(mesh: lodMesh0)]\nlet lod1 = [ModelEntity(mesh: lodMesh1)]\nlet lod2 = [ModelEntity(mesh: lodMesh2)]\n\nlet entity = Entity()\n\nLevelOfDetailComponent.addByScreenArea(to: entity, levels: [\n    (entities: lod0, minArea: 0.2 /* fraction of screen area */),  // highest detail\n    (entities: lod1, minArea: 0.1),                                // medium detail\n    (entities: lod2, minArea: 0.01),                               // lowest detail\n])","// Respond to changes in device thermal state\n    \nNotificationCenter.default.addObserver(of: ProcessInfo.self,\n                                       for: .thermalStateDidChange) {_ in\n    switch ProcessInfo.processInfo.thermalState {\n        case .nominal, .fair:\n            // Stay the course\n        case .serious, .critical:\n            // Improve performance by:\n            // More aggressive LOD switching\n            // Lower shadow quality\n    }\n}","// Create Gaussian splat resource and component\n\nlet resource = try GaussianSplatResource.BufferResource(count: splatCount,\n                                                        position: positionBuffer,\n                                                        scale: scaleBuffer,\n                                                        rotation: rotationBuffer,\n                                                        opacity: opacityBuffer,\n                                                        sphericalHarmonics:\n                                                                                                                    (sphericalHarmonicsBuffer, degree))\n\nlet splatResource = GaussianSplatResource(resource)\n\nlet splatComponent = GaussianSplatComponent(splatResource)\n\nsplatEntity.components.set(splatComponent)","// Create and use custom reverb mesh\n\nlet mesh: ReverbMeshResource = .shoebox(size: [5, 4, 6])\n    \nlet reverb: Reverb = .simulated(mesh: mesh, materials: [.dryWall])\n    \nentity.components.set(ReverbComponent(reverb: reverb))","// Create custom materials for custom reverb mesh\n    \nlet thickCarpet: Audio.Material = .carpet.scalingAbsorption {freq in 0.1 }\n    \nlet bookshelf: Audio.Material\n    \n// Absorption coefficients by center frequency:\n// 31.5Hz, 63Hz, 125Hz, 250Hz, 500Hz, 1kHz, 2kHz, 4kHz, 8kHz, 16kHz\nlet bookshelfAbsorption = Audio.Absorption(\n    [0.10, 0.15, 0.28, 0.20, 0.15, 0.10, 0.10, 0.07, 0.07, 0.05])\n    \n// Scattering coefficients for: 500Hz, 1000Hz, 4000Hz\nlet bookshelfScattering = Audio.Scattering([500: 0.5, 1000: 0.6, 4000: 0.7])\n    \nbookshelf = .init(absorption: bookshelfAbsorption,\n              scattering: bookshelfScattering)"]},"related":[{"id":"280","title":"Iterate your spatial scenes faster with Reality Composer Pro 3","gloss":"用 Reality Composer Pro 3 更快迭代空間場景","gloss_en":"Iterate your spatial scenes faster with Reality Composer Pro 3","category":"visionos","categoryLabel":"visionOS"},{"id":"283","title":"Explore enhancements to visionOS object tracking","gloss":"探索 visionOS 物件追蹤的強化功能","gloss_en":"Explore enhancements to visionOS object tracking","category":"visionos","categoryLabel":"visionOS"},{"id":"284","title":"Collaborate on structured 3D models in visionOS","gloss":"在 visionOS 中協作操作結構化 3D 模型","gloss_en":"Collaborate on structured 3D models in visionOS","category":"visionos","categoryLabel":"visionOS"},{"id":"286","title":"Use foveated streaming to bring immersive content to visionOS","gloss":"用注視點串流把沉浸式內容帶到 visionOS","gloss_en":"Use foveated streaming to bring immersive content to visionOS","category":"visionos","categoryLabel":"visionOS"},{"id":"287","title":"Build next-generation experiences with visionOS 27","gloss":"用 visionOS 27 打造次世代體驗","gloss_en":"Build next-generation experiences with visionOS 27","category":"visionos","categoryLabel":"visionOS"}]}</script>
