<script id="d" type="application/json">{"s":{"id":"204","title":"What’s new in WebKit for Safari 27","gloss":"Safari 27 中 WebKit 的新功能","category":"other","categoryLabel":"其他","duration":992,"url":"https://developer.apple.com/videos/play/wwdc2026/204/","takeaway":"Safari 27 的 WebKit 帶來 CSS Grid Lanes、可自訂 Select、HTML Model 元素與沉浸式網頁環境等新能力，讓網頁體驗更接近原生。","chapters":[[0,"Introduction"],[67,"A year of quality improvements"],[546,"CSS Grid Lanes"],[606,"Customizable Select"],[684,"HTML Model element"],[771,"Immersive Website Environments"],[818,"Web Extensions"],[918,"MapKit JS"],[940,"Next steps"]],"points":[{"text":"**CSS Grid Lanes** 提供更靈活的網格排版方式，簡化複雜版面的實作。","hot":false},{"text":"**Customizable Select** 讓開發者能完全自訂下拉選單的外觀與內容，不再受原生樣式限制。","hot":false},{"text":"新的 **HTML Model element** 可直接在網頁中嵌入並呈現 3D 模型內容。","hot":true},{"text":"**Immersive Website Environments** 帶來沉浸式網頁體驗，並持續強化 **Web Extensions** 與 **MapKit JS**。","hot":false}],"apis":["WebKit","CSS Grid","HTML Model","MapKit JS"],"audience":"適合**網頁開發者與 Safari 平台開發者**，想掌握 Safari 27 最新 Web 標準與能力的人。","gloss_en":"What's new in WebKit for Safari 27","takeaway_en":"WebKit in Safari 27 brings CSS Grid Lanes, customizable Select, the HTML Model element, and immersive web environments, making web experiences feel closer to native.","points_en":[{"text":"**CSS Grid Lanes** offers a more flexible way to lay out grids, simplifying the implementation of complex layouts.","hot":false},{"text":"**Customizable Select** lets developers fully customize the appearance and content of dropdown menus, no longer constrained by native styling.","hot":false},{"text":"The new **HTML Model element** can embed and render 3D model content directly in web pages.","hot":true},{"text":"**Immersive Website Environments** deliver immersive web experiences, with continued enhancements to **Web Extensions** and **MapKit JS**.","hot":false}],"audience_en":"For **web developers and Safari platform developers** who want to master the latest Web standards and capabilities in Safari 27.","summary":["Jen Simmons 帶來 Safari 27 的 **WebKit** 年度更新。今年最大的訊息不是「新功能很多」，而是 WebKit 團隊刻意把重心放在**品質**上：自去年秋天以來累積超過 1100 項功能改善與修復，創下團隊紀錄。品質工作可分為五個主題——**相容性**（例如修正網站用 `.fromCharCode` 處理 emoji 時超過 16-bit 而被截斷成錯字的問題，改由直接把 emoji 當文字送出）、**重建地基**（如從零改寫二十年歷史的 block-in-inline 排版）、**深耕特定領域**（媒體、捲動、SVG、無障礙、WebRTC、HTML 表格，其中 SVG 還重啟並主導了新的標準工作組，做了 75+ 項改善）、**對齊 web 標準**（例如把 CSS `random()` 的命名範圍從 per-instance 改為全域），以及**整合**（補上 `min()`／`max()`／`clamp()` 在 `sizes` 屬性裡缺失的支援）。","在品質之外，這場也介紹了五個值得關注的新功能。**CSS Grid Lanes** 已於 Safari 26.4 推出，能用純 CSS 完成經典的 masonry（瀑布流）版面，無需 JavaScript，並完整保有 CSS Grid 定義軌道的能力。**Customizable Select** 讓開發者用 `appearance: base-select` 接管 `\u003cselect>` 與 `::picker` 的外觀，並可在 `\u003coption>` 內放入圖片與描述文字，同時保有原生表單控制項的無障礙與健壯性。**HTML `\u003cmodel>` element** 把 3D 模型帶進 HTML，今年從 visionOS 擴展到 iOS、iPadOS、macOS，可搭配 `environmentmap`、`stagemode` 等屬性。","在 visionOS 27 上，`\u003cmodel>` 更進一步支援 **Immersive Website Environments**：使用者可在 Safari 點一下就步入你提供的沉浸場景，搭配仿照 Fullscreen API 設計的新 Immersive API 來操作模型。最後是 **Web Extensions** 的跨瀏覽器化——一套 HTML／CSS／JavaScript 與一份 manifest 即可通用，並推出 **Safari web extension packager**，讓開發者不需 Mac 或 Xcode，也能透過 App Store Connect 從任何瀏覽器打包與發佈。講者也提了一句 **MapKit JS**，可在任何瀏覽器嵌入兼顧隱私的互動地圖。實務建議：在最新的 Safari Technology Preview 或 Safari beta 測試你的專案，並到 bugs.webkit.org 回報問題。"],"deepdive":[{"t":0,"title":"Introduction","body":"由 **WebKit** 與 Safari 的對外代表 Jen Simmons 開場。她點出 Safari 27 第一個 beta 帶來超過 60 項新功能（如 Customizable Select、`img sizes=auto`、`stretch` 關鍵字），但本場真正的主軸是團隊今年投入的**品質**工作，之後才挑五個最值得一看的新功能深入。"},{"t":67,"title":"A year of quality improvements","body":"說明今年策略性地把資源投在改善既有功能而非狂推新功能，並歸納成五個主題：**相容性**（emoji 因 `.fromCharCode` 截斷成錯字，改由直接送出文字解決）、**重建地基**（重寫二十年的 block-in-inline 排版）、**深耕領域**（SVG 重啟標準工作組、做了 75+ 項改善）、**對齊標準**（CSS `random()` 命名改為全域）與**整合**（補齊 `sizes` 內的 `min()`／`max()`／`clamp()`）。總計超過 **1100 項**改善與修復。"},{"t":546,"title":"CSS Grid Lanes","body":"**CSS Grid Lanes** 已在 Safari 26.4 推出，用純 CSS 即可做出經典 masonry 瀑布流版面，完整保留 CSS Grid 定義軌道的能力且可雙向運作。建議到 gridlanes.webkit.org 的 Field Guide 互動體驗，並用 Web Inspector 開啟 Order Numbers 以調整 tab 順序與 flow tolerance。"},{"t":606,"title":"Customizable Select","body":"Safari 27 用 `appearance: base-select` 讓 `\u003cselect>` 開始繼承字型、文字與背景等 CSS，並對 `::picker` 同樣套用以自訂彈出選單；新增 `::checkmark`、`::picker-icon` 等 pseudo-element。還能在 `\u003coption>` 內放入子文字與圖片，並用 Grid／Flexbox 排版，同時保有原生表單控制項的**無障礙**與健壯性。"},{"t":684,"title":"HTML Model element","body":"去年先在 visionOS 推出的 `\u003cmodel>` 元素，Safari 27 起擴展到 iOS、iPadOS、macOS，把 3D 模型帶入 HTML，與 `\u003cimg>`、`\u003cvideo>`、`\u003caudio>` 並列為媒體元素。可用 `\u003csource>` 連結多種格式，並以 `environmentmap` 提供自訂光照、`stagemode` 設定預設互動，搭配 JavaScript 操控，或包進 `\u003ca>` 讓使用者在空間中預覽商品。"},{"t":771,"title":"Immersive Website Environments","body":"在 visionOS 27 上，`\u003cmodel>` 進一步支援沉浸式網站環境：使用者在 Safari 點一下即可步入你提供的場景（例如預覽劇院座位視野或沉浸式遊戲）。新的 **Immersive API** 運作方式與 Fullscreen API 類似，可參考「Explore immersive website environments in visionOS」深入了解。"},{"t":818,"title":"Web Extensions","body":"回顧擴充功能跨瀏覽器標準化的歷程，並強調如今可用單一 HTML／CSS／JavaScript 程式碼與一份 manifest 通用於各家瀏覽器。重點是新推出的 **Safari web extension packager**，讓開發者不需 Xcode 甚至不需 Mac，就能透過 App Store Connect 從任何瀏覽器、任何作業系統打包與發佈擴充功能。"},{"t":918,"title":"MapKit JS","body":"簡短帶到 **MapKit JS**：可在網站或 web app 中嵌入互動地圖，同時保護使用者隱私，且能在所有瀏覽器與任何作業系統上運作。詳情見 developer.apple.com。"},{"t":940,"title":"Next steps","body":"總結今年 WebKit 在品質與新功能上的投入，邀請開發者用最新的 Safari Technology Preview 或 Safari beta 測試專案，到 bugs.webkit.org 回報問題，並前往 webkit.org 了解每個 Safari 版本的新功能細節。"}],"summary_en":["Jen Simmons presents the annual **WebKit** update for Safari 27. The headline this year isn't a flood of new features but a deliberate focus on **quality**: over 1100 feature improvements and fixes since last fall, a team record. The quality work breaks into five themes — **compatibility** (e.g. fixing the bug where sites using `.fromCharCode` truncated emoji code points beyond 16 bits into the wrong character, now solved by delivering the emoji as text instead), **rebuilding foundations** (rewriting the two-decade-old block-in-inline layout from scratch), **going deep in specific areas** (media, scrolling, SVG, accessibility, WebRTC, HTML tables — SVG even meant reviving and leading a new standards effort, with 75+ improvements), **aligning with web standards** (e.g. redefining the scoping of CSS `random()` names from per-instance to global), and **integration** (closing the long-standing gap where `min()`/`max()`/`clamp()` weren't supported inside the `sizes` attribute).","Beyond quality, the session highlights five notable new features. **CSS Grid Lanes** (shipped in Safari 26.4) creates classic masonry layouts in pure CSS — no JavaScript — while keeping all the power of CSS Grid track definition. **Customizable Select** lets you take over the look of `\u003cselect>` and `::picker` via `appearance: base-select`, place images and descriptive text inside `\u003coption>`, and lay options out with Grid or Flexbox, all while keeping the accessibility and robustness of a real form control. The HTML **`\u003cmodel>` element** brings 3D models to HTML, expanding this year from visionOS to iOS, iPadOS, and macOS with attributes like `environmentmap` and `stagemode`.","On visionOS 27, `\u003cmodel>` goes further with **Immersive Website Environments**: users can tap in Safari to step into a scene you provide, manipulated through a new Immersive API designed to work just like the Fullscreen API. Finally, **Web Extensions** become truly cross-browser — one set of HTML/CSS/JavaScript and one manifest — backed by the new **Safari web extension packager**, which lets developers package and distribute via App Store Connect from any browser on any OS, without Xcode or even a Mac. The talk also briefly mentions **MapKit JS** for embedding privacy-preserving interactive maps in any browser. The practical takeaway: test your projects in the latest Safari Technology Preview or Safari beta and file issues at bugs.webkit.org."],"deepdive_en":[{"t":0,"title":"Introduction","body":"Jen Simmons, WebKit and Safari's public voice, opens. She notes Safari 27's first beta brings over 60 new features (Customizable Select, `img sizes=auto`, the `stretch` keyword), but the real spine of this session is the team's **quality** work this year, followed by a deep look at five standout new features."},{"t":67,"title":"A year of quality improvements","body":"Explains the strategic choice to invest in improving existing features rather than shipping many new ones, grouped into five themes: **compatibility** (emoji truncated by `.fromCharCode`, fixed by delivering text directly), **rebuilding foundations** (rewriting two-decade-old block-in-inline layout), **going deep** (reviving an SVG standards group, 75+ improvements), **aligning with standards** (CSS `random()` names made global), and **integration** (closing the `min()`/`max()`/`clamp()` gap inside `sizes`). Over **1100** improvements and fixes total."},{"t":546,"title":"CSS Grid Lanes","body":"**CSS Grid Lanes** shipped in Safari 26.4 and creates classic masonry layouts in pure CSS, keeping the full power of CSS Grid track definition and working in both directions. Explore the Field Guide at gridlanes.webkit.org and use Web Inspector's Order Numbers to fine-tune tab order and flow tolerance."},{"t":606,"title":"Customizable Select","body":"Safari 27 applies `appearance: base-select` to make `\u003cselect>` inherit CSS like font, text color, and background, and applies the same to `::picker` to style the popup; new pseudo-elements include `::checkmark` and `::picker-icon`. You can put subtext and images inside `\u003coption>`, lay them out with Grid or Flexbox, and still keep the **accessibility** and robustness of a real form control."},{"t":684,"title":"HTML Model element","body":"The `\u003cmodel>` element introduced last year on visionOS expands in Safari 27 to iOS, iPadOS, and macOS, bringing 3D models to HTML alongside `\u003cimg>`, `\u003cvideo>`, and `\u003caudio>`. Use `\u003csource>` for multiple formats, `environmentmap` for custom lighting, `stagemode` for default interaction, drive it with JavaScript, or wrap it in `\u003ca>` so users can preview a product in their space."},{"t":771,"title":"Immersive Website Environments","body":"On visionOS 27, `\u003cmodel>` supports immersive website environments: users tap in Safari to step into a scene you provide (e.g. previewing theater seats or an immersive game). The new **Immersive API** works just like the Fullscreen API; see \"Explore immersive website environments in visionOS\" for more."},{"t":818,"title":"Web Extensions","body":"Recaps the cross-browser standardization of extensions and stresses that one set of HTML/CSS/JavaScript and a single manifest now work across browsers. The key news is the new **Safari web extension packager**, which lets developers package and distribute through App Store Connect from any browser on any OS — no Xcode and no Mac required."},{"t":918,"title":"MapKit JS","body":"A brief mention of **MapKit JS**: embed interactive maps in a website or web app while preserving user privacy, working across all browsers and any operating system. Details at developer.apple.com."},{"t":940,"title":"Next steps","body":"Wraps up the year's investment in both quality and new features, inviting developers to test their projects in the latest Safari Technology Preview or Safari beta, file issues at bugs.webkit.org, and visit webkit.org to learn what's new in each Safari release."}],"code":[]},"related":[{"id":"101","title":"Keynote","gloss":"主題演講","gloss_en":"Keynote","category":"other","categoryLabel":"其他"},{"id":"102","title":"Platforms State of the Union","gloss":"平台現況報告","gloss_en":"Platforms State of the Union","category":"other","categoryLabel":"其他"},{"id":"111","title":"Keynote (ASL)","gloss":"主題演講(美國手語版)","gloss_en":"Keynote (American Sign Language)","category":"other","categoryLabel":"其他"},{"id":"112","title":"Platforms State of the Union (ASL)","gloss":"平台現況報告（美國手語版）","gloss_en":"Platforms State of the Union (American Sign Language)","category":"other","categoryLabel":"其他"},{"id":"122","title":"WWDC26 Platforms State of the Union Recap","gloss":"WWDC26 平台現況演講重點回顧","gloss_en":"WWDC26 Platforms State of the Union recap","category":"other","categoryLabel":"其他"}]}</script>
