<script id="d" type="application/json">{"s":{"id":"215","title":"Get started with the HTML Model Element","gloss":"開始使用 HTML model 元素","category":"graphics","categoryLabel":"圖形與遊戲","duration":952,"url":"https://developer.apple.com/videos/play/wwdc2026/215/","takeaway":"用新的 HTML \u003cmodel> 元素在網頁直接嵌入可互動的 3D USDZ 內容，支援 iOS、iPadOS、macOS 與 visionOS。","chapters":[[0,"Introduction"],[142,"Prepare the USDZ model asset"],[258,"Loading and fallbacks"],[259,"Load a model"],[279,"Image fallback"],[309,"Ready promise"],[339,"Polyfill fallback"],[373,"Model background"],[374,"Model background"],[407,"Stage mode"],[408,"Interactions"],[451,"Custom transforms"],[506,"Transition animation"],[515,"Transition animation"],[607,"Animation playback"],[608,"Animation playback"],[652,"AR and spatial"],[666,"AR Quick Look"],[749,"Optimize assets for production"],[893,"Next steps"]],"points":[{"text":"新的 HTML **\u003cmodel>** 元素讓你在網站中直接嵌入可互動的 **3D USDZ** 內容，橫跨 iOS、iPadOS、macOS 與 visionOS。","hot":true},{"text":"用 **src** 或 **\u003csource>** 載入模型，並提供 **\u003cimg>** 影像備援與 **ready** promise 處理載入成功或失敗。","hot":false},{"text":"可透過 **entityTransform** 套用 **DOMMatrix** 自訂旋轉與位移，並以 **stagemode** 控制軌道互動。","hot":false},{"text":"支援動畫播放（**playbackRate**、**play**）與 **AR Quick Look**（rel=\"ar\"），讓使用者在現實空間中檢視模型。","hot":false},{"text":"未支援瀏覽器可用 **polyfill** 備援，並建議在上線前最佳化 USDZ 資產。","hot":false}],"apis":["HTMLModelElement","model","entityTransform","DOMMatrix","USDZ","AR Quick Look"],"audience":"**想在網站中加入 3D 與空間內容的網頁開發者**，特別是要支援 Apple 平台與 Vision Pro 的團隊。","gloss_en":"Getting started with the HTML model element","takeaway_en":"Use the new HTML \u003cmodel> element to embed interactive 3D USDZ content directly in web pages, with support for iOS, iPadOS, macOS, and visionOS.","points_en":[{"text":"The new HTML **\u003cmodel>** element lets you embed interactive **3D USDZ** content directly in your website, across iOS, iPadOS, macOS, and visionOS.","hot":true},{"text":"Load models with **src** or **\u003csource>**, provide an **\u003cimg>** image fallback, and handle load success or failure with the **ready** promise.","hot":false},{"text":"Apply custom rotation and translation via **entityTransform** with a **DOMMatrix**, and control orbit interaction with **stagemode**.","hot":false},{"text":"Supports animation playback (**playbackRate**, **play**) and **AR Quick Look** (rel=\"ar\"), letting users view models in real space.","hot":false},{"text":"Use a **polyfill** as a fallback for unsupported browsers, and optimize your USDZ assets before shipping.","hot":false}],"audience_en":"**Web developers who want to add 3D and spatial content to their sites**, especially teams targeting Apple platforms and Vision Pro.","summary":["這場由 Safari 團隊主講，主題是把 **HTML Model element**（`\u003cmodel>`）從 visionOS 帶到 iOS、iPadOS 與 macOS。它是一個原生 HTML 元素，讓在網頁上嵌入互動式 3D 內容「像放一張圖片一樣簡單」：同一份 markup 在所有 Apple 平台的 Safari 都能運作，由系統直接算繪，毋需像過去用 `model-viewer` 這類 JavaScript 函式庫。講者以一個戶外用品電商網站為貫穿範例，從準備素材一路示範到上線優化。","素材方面建議採 **Capture、Convert、Create** 策略：用 iPhone 掃描實物、轉換既有檔案，或在 Blender 等工具建模；也可透過 Tripo3D、Meshy.ai 等生成式 AI 從照片或文字提示產生模型。最終輸出建議用 **USDZ** 格式，因為它把幾何、材質、貼圖與動畫全打包成單一檔案。嵌入時用 `src` 屬性或 `\u003csource>` 子元素指定 MIME type，並把 `\u003cimg>` 放進 `\u003cmodel>` 內作為舊版瀏覽器的 fallback；用 **ready promise** 在模型載入完成前顯示 spinner、失敗時走 catch 區塊；對尚未原生支援的瀏覽器則載入 **polyfill** 補足功能（但 visionOS 的立體算繪等特性無法被 polyfill）。","互動方面，最簡單的是 **`stagemode=\"orbit\"`**，一個屬性就能讓使用者自由旋轉模型、放手時自動回正並縮放避免裁切。若要精準控制視角，改用 **`entityTransform`** 屬性搭配 `DOMMatrix.rotateSelf` 設定旋轉（需先關閉 orbit），並用 `requestAnimationFrame` 加上 easing 做平滑過渡；內建動畫則用 `play()` 與 `playbackRate`（負值即倒播）控制。最後可把 `\u003cmodel>` 包進 `rel=\"ar\"` 的 `\u003ca>` 標籤即啟用 **AR Quick Look**。上線前用內建的 **usdcrush** 壓縮檔案（範例從 7.9 MB 降到 1.9 MB 且畫質不變）、用 **usdrecord** 批次產生縮圖，這兩個工具 Mac 已預裝。"],"deepdive":[{"t":0,"title":"Introduction","body":"Safari 工程師 Aleksei 開場，說明 **Model element** 原本在 visionOS 首發，現在擴展到 **iOS、iPadOS 與 macOS**，同一份 markup 與元素在各平台通用。相較於既有的 `model-viewer` JavaScript 函式庫，`\u003cmodel>` 是原生元素、由平台直接算繪、不需額外函式庫，且是 W3C 正在推進的新興 web 標準。講者以戶外用品電商網站為例，規劃出素材準備、逐項堆疊功能、再到產線優化三大段。"},{"t":142,"title":"Prepare the USDZ model asset","body":"建議用 **Capture、Convert、Create** 取得 3D 素材：iPhone 掃描、轉檔或用 Blender 建模，也可透過 Tripo3D、Meshy.ai 等生成式 AI 從照片或文字提示產生模型。講者示範用幾張露營木槌的照片，幾分鐘就生出可用模型並匯出成 **USDZ**。USDZ 是壓縮成單檔的 Universal Scene Description，把幾何、材質、貼圖與動畫全部打包，是最推薦的格式。"},{"t":258,"title":"Loading and fallbacks","body":"本段概觀如何嵌入模型、判斷何時可顯示，以及處理 fallback。講者將依序帶過載入、影像備援、ready promise 與 polyfill。"},{"t":259,"title":"Load a model","body":"如同 `\u003cimg>`，用 **`src` 屬性**指向檔案、瀏覽器自動處理，毋需外掛；也可用 `\u003csource>` 子元素並指定 `type=\"model/vnd.usdz+zip\"` 這類 MIME type。這種寫法與既有的圖片、影片標籤是相同模式，學習成本低。"},{"t":279,"title":"Image fallback","body":"最簡單的 fallback 是把 **`\u003cimg>` 放進 `\u003cmodel>` 元素內**：舊版 Safari 或尚未支援 Model element 的瀏覽器會改算繪該圖片，讓訪客仍能對產品有概念。這延續了 HTML 一貫的漸進增強做法。"},{"t":309,"title":"Ready promise","body":"3D 模型動輒數十 MB，載入需要時間，**`model.ready`** 這個 promise 會在模型真正載入完成可顯示時 resolve。實務上載入期間先顯示 spinner，resolve 後隱藏；若發生意外則在 **catch** 區塊顯示 fallback 內容。"},{"t":339,"title":"Polyfill fallback","body":"**polyfill** 用 JavaScript 補上新標準的 API，讓功能在尚未原生支援的平台也能使用；W3C 的 Model element 範例就示範若 `window` 上沒有原生元素就載入 polyfill 函式庫。講者提醒要同時測試 polyfill 與原生元素，並注意某些特性（如 Apple Vision Pro 的立體顯示）無法被 polyfill。"},{"t":373,"title":"Model background","body":"Model element 在自己的虛擬空間中算繪，不會繼承頁面背景。"},{"t":374,"title":"Model background","body":"要與頁面設計一致，直接在 `model` 上用 CSS 設定 **`background-color`**。要注意背景一律算繪為不透明，即使指定帶 alpha 的顏色也會被轉成不透明。"},{"t":407,"title":"Stage mode","body":"**`stagemode=\"orbit\"`** 讓訪客自由左右旋轉模型，上下傾斜放手後會輕輕彈回原始角度，互動同時又維持最佳呈現。此屬性也會把模型稍微縮小，重新調整尺寸以確保旋轉時不被裁切。"},{"t":408,"title":"Interactions","body":"本段帶出讓訪客互動探索模型是自然的下一步，並預告將示範自訂 transform 與播放動畫的做法。"},{"t":451,"title":"Custom transforms","body":"**`entityTransform`** 屬性可用 JavaScript 設定精確視角，講者加上「Side」與「Reset」兩顆按鈕示範。使用前需先停用 orbit（移除 `stagemode` 或設為 `none`），並注意手動旋轉可能讓部分模型裁切或消失、必要時要調整位置。實作上建立 **`DOMMatrix`** 並呼叫 `rotateSelf`（範例繞 Y 軸旋轉 135 度取側視），指派給 `model.entityTransform`；先存下初始 transform 以供 reset 還原。"},{"t":506,"title":"Transition animation","body":"直接切換 transform 是瞬間跳動的，要讓過渡平滑可用 **`requestAnimationFrame`** 動畫化旋轉。先設好狀態：目前角度、動畫時長（範例 500 毫秒，半秒既俐落又流暢）以及一個用來取消進行中動畫的參照。"},{"t":515,"title":"Transition animation","body":"`animateTo` 函式先取消任何進行中的動畫以免衝突，記下起始角度與起始時間，再用 step 函式逐影格計算進度、做 ease（範例用 cubic ease-out）並以新的 `DOMMatrix` 更新 `entityTransform`，未完成就請求下一影格。最後把 animateTo 綁到按鈕：側視動到 135 度、reset 回到 0；點擊後模型平滑旋轉再滑回原位。"},{"t":607,"title":"Animation playback","body":"模型也能播放內建動畫，這些動畫通常在 Blender、Maya 中製作並烘焙進 USDZ 檔。"},{"t":608,"title":"Animation playback","body":"Model element 播放第一個動畫軌，用幾行 JavaScript 即可控制 **`playbackRate`**，給負值就倒播。講者實作一個 `play` 函式設定 playbackRate 後呼叫 `play()`，範例用 5 與 -5 做較快的正播與倒播。"},{"t":652,"title":"AR and spatial","body":"本段把模型帶進真實環境與空間運算情境，預告接下來的 AR Quick Look 與 visionOS 體驗。"},{"t":666,"title":"AR Quick Look","body":"把 `\u003cmodel>` 包進帶 **`rel=\"ar\"`** 的 `\u003ca>` 標籤、指向同一資源，iOS 與 iPadOS 上即可獲得完整的 **AR Quick Look** 體驗。在 **visionOS** 上則有立體算繪讓模型具真實深度，使用者能把產品從頁面中「拉出來」端詳；visionOS 還支援沉浸式網站環境，詳見「Explore immersive website environments」場次。"},{"t":749,"title":"Optimize assets for production","body":"上線前用命令列工具 **usdcrush** 壓縮模型，範例把 boot 模型從 7.9 MB 降到 1.9 MB 且畫質不變，兩版並排在 Safari 中看起來完全相同。若有 3D 檔但缺圖，可用 **usdrecord** 直接產生縮圖或 fallback 影像（可指定輸出格式或自訂相機），且能寫腳本跨整個型錄批次執行。這兩個工具 Mac 已預裝，屬於更大的 USD 工具套件，詳見 WWDC24「What's new in USD and MaterialX」。"},{"t":893,"title":"Next steps","body":"行動建議：用文字提示或既有照片做一個自己的 3D 模型、在網站加上 `\u003cmodel>` 指向 USDZ 檔、用 USD 工具優化素材並在各平台試玩觀察元素如何適配。團隊正積極在 **W3C** 推進 Model 規格，鼓勵開發者加入 Immersive Web Community Group 提供回饋與使用情境，並參考「Immersive website environments」與 WWDC25「What's new for the spatial web」延伸學習。"}],"summary_en":["Presented by the Safari team, this session brings the native **HTML Model element** (`\u003cmodel>`) from visionOS to iOS, iPadOS, and macOS. It lets you embed interactive 3D content on a web page \"as easily as adding an image\": the same markup works across every Apple platform's Safari and is rendered directly by the platform, so you no longer need a JavaScript library like `model-viewer`. The speaker uses an outdoor-gear e-commerce site as a running example, walking from asset prep all the way to production optimization.","For assets, the recommended approach is **Capture, Convert, Create**: scan real objects with iPhone, convert existing files, or build from scratch in tools like Blender; you can also use generative AI apps such as Tripo3D and Meshy.ai to produce a model from photos or a text prompt. Export to **USDZ**, which packages geometry, materials, textures, and animations into a single file. To embed, point at a file with the `src` attribute or a `\u003csource>` child with a MIME type, and place an `\u003cimg>` inside `\u003cmodel>` as a fallback for older browsers; use the **ready promise** to show a spinner until loaded and handle failures in catch; for browsers without native support, load a **polyfill** (though features like visionOS stereoscopic rendering cannot be polyfilled).","For interaction, the simplest path is **`stagemode=\"orbit\"`**, a single attribute that lets users freely rotate the model, spring back when released, and rescale to avoid clipping. For precise control, use the **`entityTransform`** property with `DOMMatrix.rotateSelf` (after disabling orbit), and animate transitions smoothly with `requestAnimationFrame` plus easing; baked-in animations are driven with `play()` and `playbackRate` (a negative value reverses). Finally, wrap `\u003cmodel>` in an `\u003ca rel=\"ar\">` to enable **AR Quick Look**. Before shipping, compress files with the built-in **usdcrush** (the example drops from 7.9 MB to 1.9 MB with no quality loss) and batch-generate thumbnails with **usdrecord**; both tools ship with macOS."],"deepdive_en":[{"t":0,"title":"Introduction","body":"Safari engineer Aleksei opens by noting the **Model element** debuted on visionOS and now expands to **iOS, iPadOS, and macOS**, with the same markup and element working everywhere. Unlike the existing `model-viewer` JavaScript library, `\u003cmodel>` is native, rendered directly by the platform, requires no extra library, and is an emerging W3C web standard. He frames the talk with an outdoor-gear e-commerce site, organized into asset prep, building features one at a time, and production optimization."},{"t":142,"title":"Prepare the USDZ model asset","body":"The recommended path for getting 3D assets is **Capture, Convert, Create**: scan with iPhone, convert files, or build in Blender, plus generative AI apps like Tripo3D and Meshy.ai that turn photos or text prompts into models. The speaker generates a usable camping mallet model from a few photos in minutes and exports **USDZ**, a zipped Universal Scene Description that packages geometry, materials, textures, and animations into one file and is the recommended format."},{"t":258,"title":"Loading and fallbacks","body":"This section previews how to embed a model, know when it's ready to display, and handle fallbacks. The speaker will cover loading, image fallback, the ready promise, and polyfills in turn."},{"t":259,"title":"Load a model","body":"Like `\u003cimg>`, you point the element at a file with the **`src` attribute** and the browser handles the rest with no plugins; you can also use a `\u003csource>` child with `type=\"model/vnd.usdz+zip\"`. This mirrors the familiar image and video tag patterns, keeping the learning curve low."},{"t":279,"title":"Image fallback","body":"The simplest fallback is placing an **`\u003cimg>` inside the `\u003cmodel>` element**: older Safari versions and browsers that don't support Model element render the image instead, so visitors still get a sense of the product. This continues HTML's progressive-enhancement tradition."},{"t":309,"title":"Ready promise","body":"3D models can be tens of megabytes and take time to load, so the **`model.ready`** promise resolves once the model is actually loaded and ready to display. In practice show a spinner while loading, hide it on resolve, and in the **catch** block show fallback content if something unexpected happens."},{"t":339,"title":"Polyfill fallback","body":"A **polyfill** retrofits a new standard's API via JavaScript so features work even before native support lands; the W3C Model element samples load the polyfill library when the native element isn't defined on `window`. The speaker cautions you to test both the polyfill and the native element, and notes some features (like Apple Vision Pro stereoscopic display) can't be polyfilled."},{"t":373,"title":"Model background","body":"The Model element renders in its own virtual space, so it won't pick up the page's background."},{"t":374,"title":"Model background","body":"To match your page design, set **`background-color`** directly on the `model` via CSS. Note the background is always rendered opaque, so even a color with transparency gets converted to opaque."},{"t":407,"title":"Stage mode","body":"**`stagemode=\"orbit\"`** lets visitors freely rotate the model side to side, with a gentle spring back to the original angle when tilted up or down, staying interactive while always looking its best. The attribute also rescales the model slightly to ensure no parts get clipped during rotation."},{"t":408,"title":"Interactions","body":"This section frames letting visitors interact with and explore the model as a natural next step, previewing custom transforms and animation playback."},{"t":451,"title":"Custom transforms","body":"The **`entityTransform`** property sets exact viewing angles via JavaScript; the speaker adds \"Side\" and \"Reset\" buttons to demonstrate. You must first disable orbit (remove `stagemode` or set it to `none`), and watch for clipping or disappearance when rotating, adjusting position if needed. The implementation creates a **`DOMMatrix`** and calls `rotateSelf` (the example rotates 135 degrees around Y for a side view), assigns it to `model.entityTransform`, and captures the initial transform up front to reset."},{"t":506,"title":"Transition animation","body":"Switching transforms directly snaps instantly, so to make the transition smooth you animate the rotation with **`requestAnimationFrame`**. First set up state: the current angle, the animation duration (500 ms in the example, snappy yet smooth), and a reference to cancel any in-flight animation."},{"t":515,"title":"Transition animation","body":"The `animateTo` function first cancels any running animation to avoid conflicts, captures the starting angle and start time, then a step function computes progress each frame, eases the rotation (cubic ease-out in the example), and updates `entityTransform` with a new `DOMMatrix`, requesting the next frame until done. Finally the buttons call animateTo: side view animates to 135 degrees, reset to 0, smoothly rotating and gliding back."},{"t":607,"title":"Animation playback","body":"Models can also play built-in animations, typically authored in tools like Blender or Maya and baked into the USDZ file."},{"t":608,"title":"Animation playback","body":"The Model element plays the first animation track, and a couple of lines of JavaScript control **`playbackRate`**, with a negative value running it in reverse. The speaker implements a `play` function that sets playbackRate then calls `play()`, using 5 and -5 for faster forward and reverse playback."},{"t":652,"title":"AR and spatial","body":"This section brings models into the real environment and spatial computing, previewing AR Quick Look and the visionOS experience."},{"t":666,"title":"AR Quick Look","body":"Wrap `\u003cmodel>` in an `\u003ca>` tag with **`rel=\"ar\"`** pointing at the same resource, and on iOS and iPadOS customers get a full **AR Quick Look** experience. On **visionOS**, stereoscopic rendering gives models real depth so customers can pull the product out of the page to examine it; visionOS also supports immersive website environments, covered in the \"Explore immersive website environments\" session."},{"t":749,"title":"Optimize assets for production","body":"Before shipping, run the command-line tool **usdcrush**, which in the example shrinks the boot model from 7.9 MB to 1.9 MB with no quality change, looking identical side by side in Safari. If you have a 3D file but no image, **usdrecord** generates a thumbnail or fallback image directly (with options like output format or a custom camera) and can be scripted across an entire catalog. Both tools ship with macOS as part of a larger USD tool suite, detailed in WWDC24's \"What's new in USD and MaterialX.\""},{"t":893,"title":"Next steps","body":"Action items: create your own 3D model from a text prompt or existing photos, add `\u003cmodel>` pointing at a USDZ file, optimize assets with the USD tools, and try it across platforms to see how the element adapts. The team is actively advancing the Model spec at the **W3C** and encourages developers to join the Immersive Web Community Group with feedback and use cases, plus review \"Immersive website environments\" and WWDC25's \"What's new for the spatial web.\""}],"code":[]},"related":[{"id":"320","title":"Explore immersive website environments in visionOS","gloss":"探索 visionOS 的沉浸式網站環境","gloss_en":"Explore immersive website environments in visionOS","category":"visionos","categoryLabel":"visionOS"},{"id":"285","title":"Discover USDKit and what’s new in OpenUSD","gloss":"認識 USDKit 與 OpenUSD 的新功能","gloss_en":"Discover USDKit and what's new in OpenUSD","category":"graphics","categoryLabel":"圖形與遊戲"},{"id":"284","title":"Collaborate on structured 3D models in visionOS","gloss":"在 visionOS 中協作操作結構化 3D 模型","gloss_en":"Collaborate on structured 3D models in visionOS","category":"visionos","categoryLabel":"visionOS"},{"id":"252","title":"Design no-code games with Reality Composer Pro 3","gloss":"用 Reality Composer Pro 3 設計無程式碼遊戲","gloss_en":"Design no-code games with Reality Composer Pro 3","category":"graphics","categoryLabel":"圖形與遊戲"},{"id":"256","title":"Discover generated subtitles and subtitle styles","gloss":"認識自動產生字幕與字幕樣式","gloss_en":"Discover generated subtitles and subtitle styles","category":"graphics","categoryLabel":"圖形與遊戲"}]}</script>
