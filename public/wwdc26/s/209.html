<script id="d" type="application/json">{"s":{"id":"209","title":"What’s new in Wallet","gloss":"Apple Wallet 的新功能","category":"other","categoryLabel":"其他","duration":949,"url":"https://developer.apple.com/videos/play/wwdc2026/209/","takeaway":"用全新的 Poster Generic 樣式、更多條碼類型與 featured actions 翻新你的 Wallet 票券，並用 Pass Designer 與 PassBuilder 加速製作與簽署流程。","chapters":[[1,"Introduction"],[40,"Poster Generic"],[101,"Adopting Poster Generic"],[131,"Adopting Poster Generic with Generic fallback"],[156,"Barcodes"],[172,"Barcodes: Add new types for iOS 27"],[217,"Barcodes: Supporting iOS 26 and earlier"],[267,"Featured actions"],[288,"Featured actions"],[346,"Developer tools"],[347,"Pass Designer"],[640,"Pass Builder"],[656,"Package.swift"],[665,"CreatePass.swift"],[791,"CreatePass.swift"],[830,"Personalizing a pass template"],[901,"Next steps"]],"points":[{"text":"採用全新的 **Poster Generic** 票券樣式，並可同時保留 `generic` 欄位作為 iOS 26 以前的後備。","hot":true},{"text":"新增更多**條碼格式（barcodes）**，例如 `PKBarcodeFormatCodabar`，並可同時提供 QR 等格式以相容舊版系統。","hot":false},{"text":"透過 **featured actions** 在票券上加入會員權益、優惠等可點擊動作。","hot":false},{"text":"用新的 **Pass Designer** 視覺化設計票券模板，並用 **Pass Builder（PassBuilder）** 套件在伺服器端建立與簽署 `.pkpass`。","hot":false}],"apis":["PassBuilder","PassPackage","PassImage","PassCertificate","PassSigner","Pass.Barcode","Pass.Action","PKBarcodeFormatCodabar"],"audience":"**開發 Apple Wallet 票券（會員卡、票券、優惠券）的開發者**，想更新樣式並簡化後端產製流程的人。","gloss_en":"What's new in Wallet","takeaway_en":"Refresh your Wallet passes with the new Poster Generic style, more barcode types, and featured actions, and speed up authoring and signing with Pass Designer and PassBuilder.","points_en":[{"text":"Adopt the new **Poster Generic** pass style, while keeping a `generic` field as a fallback for systems prior to iOS 26.","hot":true},{"text":"Add more **barcode formats**, such as `PKBarcodeFormatCodabar`, while still offering formats like QR for compatibility with older systems.","hot":false},{"text":"Use **featured actions** to add tappable actions like membership benefits and offers onto a pass.","hot":false},{"text":"Design pass templates visually with the new **Pass Designer**, and build and sign `.pkpass` files server-side with the **Pass Builder (PassBuilder)** package.","hot":false}],"audience_en":"**Developers building Apple Wallet passes (membership cards, tickets, coupons)** who want to update styling and simplify their backend production pipeline.","summary":["這場由 Wallet 團隊主講，回顧 passes 如何讓人更快、更私密、更安全地完成日常——從買咖啡、過閘門到登機。iOS 27 把 passes 往前推了一大步，帶來四項重點：全新的 **Poster Generic** pass 樣式、四種新 barcode 類型、可在 pass face 下方浮現相關動作的 **featured actions**,以及一整套給 Mac 與 server 平台的開發者工具。整體訊息是：設計、個人化與建立 pass 從未如此容易。","在 pass 內容層面，**Poster Generic** 適合會員卡、集點與商店卡，由背景圖、primary logo、header／primary／footer fields 與 barcode 組成,只要在 pass.json 設定 `posterGeneric` top-level style key 即可；它需要 iOS 27 以上，建議同時保留 `generic` key 讓舊系統使用者仍能加入 Wallet。新增的 **EAN-13、Code 39、Codabar、ITF** 四種 barcode 透過既有的 `barcodes` 陣列以 `PKBarcodeFormatCodabar` 等 format 指定;因舊版不支援，務必以優先序提供多個 barcode 做 graceful fallback，無法多型時則把 credential ID 放進 primaryField 並訓練前線人員手動輸入。**featuredActions** 則在 top-level 以 action 物件陣列定義(unique ID、type 如 `membershipBenefits`、URL)，Wallet 會在 pass 下方畫出帶圖示的 call-to-action，每張 pass 最多兩個。","開發者工具是本場重頭戲。全新的 Mac app **Pass Designer** 是所見即所得編輯器，提供 true-to-iOS 的即時預覽，可在 sidebar 設定 identity & signing、style、images、barcodes、fields 與 semantics,並把成果存成 **pkpasstemplate** 範本檔。要把範本轉成個人化、已簽署的 pass，則用全新的 Swift on Server 套件 **Pass Builder**(可在 Mac 與 Linux 執行，提供 Swift API 與 `buildpass` 命令列)。講者以「狗狗日托會員卡」示範:用 **PassPackage** 載入範本、以 `setValue` 填欄位、設定 **PassImage** 背景與 **Pass.Barcode**(PDF417)、加上 **Pass.Action**,再用 **PassCertificate** 與 **PassSigner** 的 `signPass` 自動完成 manifest、簽章與打包。Pass Builder 也能透過 **swift-java** 從 Java 呼叫，或用 protobuf 定義從其他語言驅動 `buildpass`。"],"deepdive":[{"t":1,"title":"Introduction","body":"由 Shaun 開場，回顧 passes 如何讓人從買咖啡、過 transit 閘門到登機都更快、更私密、更安全。預告 iOS 27 的四大更新:全新 **Poster Generic** pass 樣式、四種新 barcode 類型、可在 pass face 下方浮現相關動作的新方式,以及給 Mac 與 server 的全新開發者工具套件。"},{"t":40,"title":"Poster Generic","body":"介紹全新 pass 樣式 **Poster Generic**,適合會員卡、loyalty 計畫、商店卡等想讓**大膽彩色藝術圖**佔據主視覺的場景。pass face 由背景圖、primary logo、header fields、primary fields、單一 footer field 與(若有提供的)barcode 組成,系統會自動把內容排版到整個 pass face 上。"},{"t":101,"title":"Adopting Poster Generic","body":"說明採用方式:在 pass bundle 的 **pass.json** 指定 `posterGeneric` top-level style key,再用一般的 pass fields 結構放入內容,系統就會處理排版。提醒 pass face **只支援單一 footer field**,若放多個,只會顯示第一個。"},{"t":131,"title":"Adopting Poster Generic with Generic fallback","body":"Poster Generic 需要 **iOS 27 以上**。為了支援 iOS 26 與更早的使用者,建議在 pass.json 中**同時保留既有的 `generic` top-level style key** 與 `posterGeneric`,各自放入對應欄位,讓尚未更新到 iOS 27 的使用者仍能把 pass 加入 Wallet。"},{"t":156,"title":"Barcodes","body":"宣布 iOS 27 支援**四種新 barcode 類型**:**EAN-13、Code 39、Codabar、ITF**,在出示時提供更大彈性。這些都沿用既有的 barcode 物件與 pass.json 中的 `barcodes` 陣列來指定。"},{"t":172,"title":"Barcodes: Add new types for iOS 27","body":"示範如何採用新類型:把 barcode 的 `format` 設為對應值(例如 Codabar 用 **PKBarcodeFormatCodabar**),完整 format 定義可在 Wallet Passes 文件查到。範例也包含 `message` 與 `messageEncoding` 欄位。"},{"t":217,"title":"Barcodes: Supporting iOS 26 and earlier","body":"因舊版 iOS 不支援新格式,**強烈建議以優先序提供一個 barcode 陣列**做 graceful fallback,讓系統有最大機會渲染出硬體可掃描的 barcode。若只提供單一新類型,iOS 26 與更早版本將**完全不顯示 barcode**;若實在無法多型,則應把 **credential ID** 放進醒目的 primaryField 或 headerField 供手動輸入,並訓練前線人員做手動輸入流程,避免顧客被卡住。"},{"t":267,"title":"Featured actions","body":"回顧 iOS 18 第二代 event ticket 可用 semantic URLs 在 pass 下方提供額外動作(如查看活動時程)。iOS 27 帶來**全新且更彈性的 API**,讓**所有 pass 樣式**都能提供 featured actions。"},{"t":288,"title":"Featured actions","body":"說明用法:在 pass.json top-level 定義 **featuredActions** key,接收 action 物件陣列,每個 action 由 unique ID、action **type**(如 `membershipBenefits`)與 value(如 URL)組成。Wallet 會在 pass 下方畫出帶彩色圖示與在地化 call-to-action 的按鈕,**每張 pass 最多兩個**,建議以優先序只提供最相關的動作。"},{"t":346,"title":"Developer tools","body":"點出痛點:過去十年 passes 累積大量功能,很難把 pass bundle 的描述對應到裝置上的視覺呈現。因此 Wallet 推出一套全新開發者工具,讓設計、個人化與建立 pass 變得更容易。"},{"t":347,"title":"Pass Designer","body":"介紹全新 Mac app **Pass Designer**,一個所見即所得編輯器,提供 **true-to-iOS** 的即時預覽:右側即時預覽、左側 sidebar 可設定 identity & signing、style、images、barcodes、fields 與 semantics。講者實地示範替「Stacey 狗狗日托」設計範本:套用 Poster Generic、拖入狗狗照片當背景、加入 header field(DOG_ID)、primary fields(省略第一個 label 取得粗體大標題)、PDF417 barcode、primary logo 與 footer,最後存成 **pkpasstemplate** 範本檔。"},{"t":640,"title":"Pass Builder","body":"介紹搭配 Pass Designer 的全新 **Swift on Server** 套件 **Pass Builder**,可在 **Mac 與 Linux** 執行,提供 Swift API 與名為 **buildpass** 的命令列執行檔,用來把範本轉成個人化、已簽署、可發佈的 pass。講者要在伺服器上大規模個人化先前做好的範本。"},{"t":656,"title":"Package.swift","body":"示範第一步:把 **PassBuilder** 加進 Swift package manifest 的 dependencies(以 `.package(path:)` 指向本地路徑)與 server target 的 `.product`,讓伺服器專案能使用 Pass Builder API。"},{"t":665,"title":"CreatePass.swift","body":"實作 `createPass` 函式:用 **PassPackage** 載入先前的範本(提供 type-safe 存取 pass bundle 與 pass.json),以 `setValue` 設定狗狗名字、會員 ID 與最愛玩具,建立 **PassImage** 設為 background,加入 PDF417 格式的 **Pass.Barcode**,並以 **Pass.Action** 設定 featuredActions 讓客戶查看會員資格。"},{"t":791,"title":"CreatePass.swift","body":"接續完成簽署:用 **PassCertificate** 載入 pass signing 憑證與 WWDR intermediate 憑證,建立 **PassSigner**,呼叫其 **signPass** 帶入個人化後的 package 與目標 URL。Pass Builder 自動處理產生 manifest、建立 detached signature、壓縮並加上 .pkpass 副檔名等所有步驟,開發者只需提供憑證,最後回傳寫出的 URL。"},{"t":830,"title":"Personalizing a pass template","body":"說明 Pass Builder 也能在其他語言使用:**swift-java** 專案可為 Swift API 產生原生 Java bindings,讓 Java runtime 呼叫 Pass Builder;同時也提供 pass package 格式的 **protobuf** 定義,可在偏好語言產生 type-safe 模型、產生 customization message,再呼叫 **buildpass** 命令列來個人化並簽署 pass。延伸參考「Explore Swift and Java interoperability」session。"},{"t":901,"title":"Next steps","body":"收尾的行動建議:下載 **Pass Designer** 並實驗 **Poster Generic** 樣式,評估是否適合你的 pass;若打算採用任何新 barcode 類型,先**規劃 graceful fallback**;並花點時間找出對顧客最有意義的動作,用 **featured actions** 實現。講者形容這是建立 Wallet Passes 的新篇章。"}],"summary_en":["Presented by the Wallet team, this session recaps how passes let people move through their day faster, more privately, and more securely—from buying coffee to tapping transit gates to boarding a flight. iOS 27 pushes passes further with four highlights: a brand-new **Poster Generic** pass style, four new barcode types, **featured actions** that surface relevant actions below the pass face, and a full suite of developer tools for Mac and server platforms. The overall message is that designing, personalizing, and building passes has never been easier.","At the content level, **Poster Generic** suits membership, loyalty, and store cards—composed of a background image, primary logo, header/primary/footer fields, and a barcode—and is adopted by setting the `posterGeneric` top-level style key in pass.json; it requires iOS 27, so keep the `generic` key alongside it so older-OS customers can still add the pass. The four new barcodes—**EAN-13, Code 39, Codabar, ITF**—are specified via the existing `barcodes` array with formats like `PKBarcodeFormatCodabar`; because older iOS doesn't support them, provide multiple barcodes in priority order for graceful fallback, and where multiple types aren't possible, surface the credential ID in a primaryField and train front-line staff for manual entry. **featuredActions** are defined as a top-level array of action objects (unique ID, type such as `membershipBenefits`, and a URL), drawn by Wallet below the pass with a localized call-to-action, up to two per pass.","The developer tools are the centerpiece. The new Mac app **Pass Designer** is a WYSIWYG editor with a true-to-iOS live preview, letting you configure identity & signing, style, images, barcodes, fields, and semantics in a sidebar and save the result as a **pkpasstemplate** file. To turn a template into a personalized, signed pass, use the new Swift on Server package **Pass Builder** (runs on Mac and Linux, with a Swift API and a `buildpass` command-line tool). The demo builds doggy-daycare membership cards: load the template with **PassPackage**, fill fields via `setValue`, set a **PassImage** background and a **Pass.Barcode** (PDF417), add a **Pass.Action**, then use **PassCertificate** and **PassSigner**'s `signPass` to auto-generate the manifest, signature, and package. Pass Builder can also be driven from Java via **swift-java** or from other languages via protobuf definitions and the `buildpass` executable."],"deepdive_en":[{"t":1,"title":"Introduction","body":"Shaun opens by recapping how passes let people move faster, more privately, and more securely—from buying coffee to tapping transit gates to boarding flights. He previews the four big iOS 27 updates: the new **Poster Generic** pass style, four new barcode types, a new way to surface relevant actions below the pass face, and a brand-new suite of developer tools for Mac and server."},{"t":40,"title":"Poster Generic","body":"Introduces the new **Poster Generic** pass style, a great fit for membership cards, loyalty programs, and store cards where **bold, colorful artwork** should take center stage. The pass face consists of a background image, a primary logo, header fields, primary fields, a single footer field, and a barcode if supplied, with the system laying everything out across the face."},{"t":101,"title":"Adopting Poster Generic","body":"Explains adoption: specify the `posterGeneric` top-level style key in the bundle's **pass.json**, then add content with the usual pass fields structure and the pass handles layout. Notes the pass face supports only a **single footer field**—if more than one is included, only the first is displayed."},{"t":131,"title":"Adopting Poster Generic with Generic fallback","body":"Poster Generic requires **iOS 27 or later**. To support iOS 26 and earlier, the recommendation is to include the existing **`generic` top-level style key alongside** `posterGeneric` in pass.json, with relevant fields under each, so customers who haven't updated can still add the pass to Wallet."},{"t":156,"title":"Barcodes","body":"Announces **four new barcode types** in iOS 27—**EAN-13, Code 39, Codabar, ITF**—giving more flexibility at the point of presentation. They're specified using the existing barcode object and the `barcodes` array in pass.json."},{"t":172,"title":"Barcodes: Add new types for iOS 27","body":"Demonstrates adopting a new type by setting a barcode's `format` to the corresponding value (e.g., **PKBarcodeFormatCodabar** for Codabar), with the full list of format definitions in the Wallet Passes documentation. The example also includes `message` and `messageEncoding` fields."},{"t":217,"title":"Barcodes: Supporting iOS 26 and earlier","body":"Because older iOS doesn't support the new formats, the strong recommendation is to provide an **array of barcodes in priority order** for graceful fallback so the system can render one the hardware can scan. Providing only a single new type means **no barcode renders on iOS 26 and earlier**; where multiple types aren't possible, surface the **credential ID** in a prominent primaryField or headerField for manual entry and train front-line staff so a customer is never blocked."},{"t":267,"title":"Featured actions","body":"Recaps that the iOS 18 second-generation event ticket could provide semantic URLs to expose extra actions below the pass (like viewing the event schedule). iOS 27 brings a **new, flexible API** that allows **all pass styles** to provide featured actions."},{"t":288,"title":"Featured actions","body":"Explains usage: define the **featuredActions** key at the top level of pass.json, taking an array of action objects, each with a unique ID, an action **type** (such as `membershipBenefits`), and a value (such as a URL). Wallet draws each below the pass with a colorful icon and localized call-to-action, **up to two per pass**, and the guidance is to provide only the most relevant actions in priority order."},{"t":346,"title":"Developer tools","body":"Names the pain point: a decade of accumulated pass features makes it hard to connect what's described in the pass bundle to the visual representation on device. Wallet responds with a brand-new suite of developer tools that make designing, personalizing, and building passes easier."},{"t":347,"title":"Pass Designer","body":"Introduces the new Mac app **Pass Designer**, a WYSIWYG editor with a **true-to-iOS** live preview: a live pass preview on the right and a sidebar on the left to configure identity & signing, style, images, barcodes, fields, and semantics. The walkthrough designs a 'Stacey's Doggy Day Care' template: apply Poster Generic, drag in a dog photo as background, add a header field (DOG_ID), primary fields (omitting the first label to get the bold title), a PDF417 barcode, a primary logo, and a footer, then save as a **pkpasstemplate** file."},{"t":640,"title":"Pass Builder","body":"Introduces the companion **Swift on Server** package **Pass Builder**, which runs on **Mac and Linux** and provides a Swift API plus a command-line executable called **buildpass** to turn a template into a personalized, signed, distributable pass. The plan is to personalize the earlier template at scale on a server."},{"t":656,"title":"Package.swift","body":"Demonstrates the first step: add **PassBuilder** to the Swift package manifest dependencies (via `.package(path:)` pointing at a local path) and to the server target's `.product`, so the server project can use the Pass Builder API."},{"t":665,"title":"CreatePass.swift","body":"Implements the `createPass` function: load the earlier template with **PassPackage** (a type-safe way to access the pass bundle and pass.json), use `setValue` to set the dog's name, member ID, and favorite toy, create a **PassImage** as the background, add a PDF417-format **Pass.Barcode**, and set a **Pass.Action** on featuredActions so clients can view their membership."},{"t":791,"title":"CreatePass.swift","body":"Continues to signing: load the pass signing certificate and the WWDR intermediate certificate with **PassCertificate**, create a **PassSigner**, and call its **signPass** with the personalized package and a destination URL. Pass Builder handles generating the manifest, creating a detached signature, compressing, and adding the .pkpass extension—you just provide the certificates—then returns the written URL."},{"t":830,"title":"Personalizing a pass template","body":"Notes Pass Builder can also be used from other languages: the **swift-java** project can generate native Java bindings for the Swift API so the Java runtime can invoke Pass Builder, and **protobuf** definitions of the pass package format let you generate type-safe models in your preferred language, produce a customization message, and call the **buildpass** command line. Points to the 'Explore Swift and Java interoperability' session for more."},{"t":901,"title":"Next steps","body":"Closing action items: check out **Pass Designer** and experiment with the **Poster Generic** style to see if it fits your pass; if adopting any new barcode types, make a plan for **graceful fallbacks**; and identify the most meaningful actions for your customers and bring them to life with **featured actions**. Shaun frames this as a new chapter for building Wallet Passes."}],"code":["// Adopting Poster Generic\n\"posterGeneric\": {\n  \"headerFields\": [\n    {\n      \"key\": \"memberID\",\n      \"label\": \"Guest No.\",\n      \"value\": \"102035\"\n    }\n  ],\n  \"footerFields\": [\n    {\n      \"key\": \"membershipType\",\n      \"value\": \"Family Pass\"\n    }\n  ]\n}","// Adopting Poster Generic and supporting Generic on iOS 26 and earlier\n\"posterGeneric\": {\n  \"headerFields\": [\n    {\n      \"key\": \"memberID\",\n      \"label\": \"Guest No.\",\n      \"value\": \"102035\"\n    }\n  ],\n  \"footerFields\": [\n    {\n      \"key\": \"membershipType\",\n      \"value\": \"Family Pass\"\n    }\n  ]\n},\n\"generic\": {\n  \"headerFields\": [\n    {\n      \"key\": \"memberID\",\n      \"label\": \"Guest No.\",\n      \"value\": \"102035\"\n    }\n  ],\n  \"footerFields\": [\n    {\n      \"key\": \"membershipType\",\n      \"value\": \"Family Pass\"\n    }\n  ]\n}","// Adopting new barcode types\n\"barcodes\": [\n  {\n    \"format\": \"PKBarcodeFormatCodabar\"\n    \"message\": \"…\"\n    \"messageEncoding\": \"…\"\n  }\n]","// Adopting new barcode types and supporting iOS 26 and earlier.\n\"barcodes\": [\n  {\n    \"format\": \"PKBarcodeFormatCodabar\"\n    \"message\": \"123456789\"\n    \"messageEncoding\": \"iso-8859-1\"\n  },\n  {\n    \"format\": \"PKBarcodeFormatQR\"\n    \"message\": \"123456789\"\n    \"messageEncoding\": \"iso-8859-1\"\n  }\n]","// Featured actions\n\"featuredActions\": [\n  {\n    \"identifier\": \"my-offer-id\",\n    \"type\": \"membershipBenefits\",\n    \"url\": \"www.example.com/offers\"\n  }\n]","// Package.swift\n\nimport PackageDescription\n\nlet package = Package(\n    name: \"MyServer\",\n    products: [\n          .library(\n              name: \"MyServer\",\n              targets: [\"MyServer\"]\n        ),\n    ],\n    dependencies: [\n        .package(path: \"./path/to/PassBuilder\")\n    ],\n    targets: [\n        .target(\n            name: \"MyServer\",\n            dependencies: [\n                .product(name: \"PassBuilder\", package: \"PassBuilder\")\n            ]\n        ),\n        …\n    ]","// CreatePass.swift\n\nimport PassBuilder\n\nfunc createPass(for doggo: MemeberModel) async throws -> URL {\n    var package = PassPackage(url: \"template.pkpasstemplate\")\n    \n    package.pass.fields.setValue(doggo.name, forKey: \"DOG_NAME\")\n    package.pass.fields.setValue(doggo.favoriteToy, forKey: \"LOVES\")\n    package.pass.fields.setValue(doggo.id, forKey: \"MEMBER_ID\")\n  \n    package.background = PassImage(url: doggo.photoURL)\n  \n    package.pass.barcodes = [\n        Pass.Barcode(message: doggo.id, format: .pdf417)\n    ]\n  \n    package.featuredActions = [\n        Pass.Action(id: \"action-1\", type: \"viewMembership\", url: doggo.membershipURL) \n    ]\n    …\n}","// CreatePass.swift\n\nimport PassBuilder\n\nfunc createPass(for doggo: MemeberModel) async throws -> URL {\n    var package = PassPackage(url: \"template.pkpasstemplate\")\n    \n    package.pass.fields.setValue(doggo.name, forKey: \"DOG_NAME\")\n    package.pass.fields.setValue(doggo.favoriteToy, forKey: \"LOVES\")\n    package.pass.fields.setValue(doggo.id, forKey: \"MEMBER_ID\")\n  \n    package.background = PassImage(url: doggo.photoURL)\n  \n    package.pass.barcodes = [\n        Pass.Barcode(message: doggo.id, format: .pdf417)\n    ]\n  \n    package.featuredActions = [\n        Pass.Action(id: \"action-1\", type: \"viewMembership\", url: doggo.membershipURL) \n    ]\n\n    let passCertificate = try PassCertificate(url: \"pass.p12\", password: \"s3cr3t\")\n    let wwdrCertificate = try PassCertificate(url: \"wwdr.cer\")\n  \n    let signer = PassSigner(\n        passCertificate: passCertificate,\n        wwdrCertifiate: wwdrCertificate\n    )\n  \n    let destinationURL = URL(string: \"/www/passes/\" + doggo.id)\n    try signer.signPass(package, writingTo: destinationURL)\n  \n    return destinationURL\n}"]},"related":[{"id":"101","title":"Keynote","gloss":"主題演講","gloss_en":"Keynote","category":"other","categoryLabel":"其他"},{"id":"102","title":"Platforms State of the Union","gloss":"平台現況報告","gloss_en":"Platforms State of the Union","category":"other","categoryLabel":"其他"},{"id":"111","title":"Keynote (ASL)","gloss":"主題演講(美國手語版)","gloss_en":"Keynote (American Sign Language)","category":"other","categoryLabel":"其他"},{"id":"112","title":"Platforms State of the Union (ASL)","gloss":"平台現況報告（美國手語版）","gloss_en":"Platforms State of the Union (American Sign Language)","category":"other","categoryLabel":"其他"},{"id":"122","title":"WWDC26 Platforms State of the Union Recap","gloss":"WWDC26 平台現況演講重點回顧","gloss_en":"WWDC26 Platforms State of the Union recap","category":"other","categoryLabel":"其他"}]}</script>
