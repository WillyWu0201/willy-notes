<script id="d" type="application/json">{"s":{"id":"284","title":"Collaborate on structured 3D models in visionOS","gloss":"在 visionOS 中協作操作結構化 3D 模型","category":"visionos","categoryLabel":"visionOS","duration":1516,"url":"https://developer.apple.com/videos/play/wwdc2026/284/","takeaway":"在 visionOS 中準備結構化 USDZ 模型，並透過 ManipulationComponent 操作個別零件、組裝、裁切與自動展開。","chapters":[[0,"Introduction"],[175,"Asset preparation"],[305,"Manipulating the hierarchy"],[430,"Opening an assembly"],[431,"Closing an assembly"],[495,"Interactive clipping"],[1096,"Autoexpansion"],[1450,"Next steps"]],"points":[{"text":"說明如何 **準備結構化 USDZ 資產**，讓模型的各個零件可被個別辨識與操作。","hot":false},{"text":"透過操作 **entity hierarchy**，使用者可逐一抓取與移動模型中的子零件。","hot":false},{"text":"以 **ManipulationComponent** 搭配 InputTargetComponent 實作組裝的開啟與關閉，並用 releaseBehavior 控制放開後行為。","hot":true},{"text":"支援 **互動式裁切（interactive clipping）**，可剖視模型內部結構。","hot":false},{"text":"提供 **自動展開（autoexpansion）** 讓複雜組件以爆炸圖方式呈現。","hot":false}],"apis":["RealityKit","ManipulationComponent","InputTargetComponent","USDZ"],"audience":"在 **visionOS 上開發 3D 模型檢視或協作體驗** 的開發者與 3D 內容製作者。","gloss_en":"Collaborate on structured 3D models in visionOS","takeaway_en":"Prepare structured USDZ models in visionOS and use ManipulationComponent to manipulate individual parts, assemble, clip, and auto-expand them.","points_en":[{"text":"Explains how to **prepare structured USDZ assets** so each part of the model can be individually identified and manipulated.","hot":false},{"text":"By manipulating the **entity hierarchy**, users can grab and move individual sub-parts of the model one by one.","hot":false},{"text":"Use **ManipulationComponent** with InputTargetComponent to implement opening and closing of an assembly, and control post-release behavior with releaseBehavior.","hot":true},{"text":"Supports **interactive clipping** to cut away and inspect the model's internal structure.","hot":false},{"text":"Provides **autoexpansion** to present complex assemblies as exploded views.","hot":false}],"audience_en":"Developers and 3D content creators **building 3D model viewing or collaboration experiences on visionOS**.","summary":["這場由 Bill 主講，示範如何在 Apple Vision Pro 上協作操作**結構化 3D 模型（structured 3D models）**，做出在平面螢幕上不可能的設計審查體驗。開場以一段 SharePlay 中審查 AirPods Pro 的情境貫穿全場：多人在同一空間、同一保真度下看同一個資產，能拉近、解鎖、拉出底部組件、旋轉給同事看、用手勢指出重點，再收合、開啟**剖面（clipping）**檢視主機板。背後仰賴 Vision Pro 的三項能力：**即時協作**、對多維資料的**豐富表現操作**，以及把虛擬決策落地的**環境光照（environment lighting）**。這些原則不限 CAD，也適用於都市規劃、物流、房地產等任何多維資訊。","全篇圍繞四大主題。首先是**資產準備（asset preparation）**：3D 模型本質是部分與整體的關係，若匯出時把所有幾何攤平到 root（InteriorPart_01、part 25…），雖然在 viewport 看起來正常，但程式無從判斷該隱藏、顯示或操作哪個部件。正確做法是保留**深層巢狀階層（hierarchy）**，讓每個節點都被命名、分組，程式才能找到並隔離出單一活塞或曲軸。","第二是**操作階層**，靠 RealityKit 的 **ManipulationComponent** 實作。元件放在哪一層就決定行為：放 root 時整個 spread 當一個物件移動；把 ManipulationComponent 往子節點搬，就能單獨拉開上蓋、旋轉一只耳機。`openAssembly` 移除實體上的 ManipulationComponent 與 InputTargetComponent，再逐一替子實體加上，並把 `releaseBehavior` 設為 `.stay` 讓放手後留在原位；`closeAssembly` 則反向操作收合。講者特別提醒：**別忘了加 CollisionComponent**，否則事件無法處理。","第三是 visionOS 27 新增的**剪裁（clipping）**，用 **ClippingComponent**（重點屬性是 entity local space 的 `bounds`，以及 `shouldClipChildren`、`shouldClipSelf`）讓內部如外部一樣可見。互動模型是把 AABB 的六個面變成六個可拖曳平面（六平面、六個數字），並用 `.off／.on／.editing` 三態狀態機管理。難點在座標系轉換：拖曳事件發生在 clipping plane 座標系，須經 World → Model 轉換、用**投影（projection，即點積／向量長度）**約束到平面法線方向後更新 bounds，再轉回 plane 座標系移動視覺平面。第四是**自動展開（autoexpansion）**：用**體積加權位置變異數（volume-weighted position variance）**沿每個軸計算，挑變異數最大的軸（範例中是 y 軸），再以 FromToBy 動畫把子組件散開。最後鼓勵大家熟悉統計、向量數學與線性代數，並下載官方範例專案。"],"deepdive":[{"t":0,"title":"Introduction","body":"講者 Bill 以一段 SharePlay 中審查 AirPods Pro 的情境開場：多人在共享空間以相同保真度看同一資產，能拉近、解鎖、拉出底部組件、旋轉給同事看、用手勢指出重點，並開啟**剖面**看主機板。他歸納 Vision Pro 三項關鍵能力——**即時協作**、對多維資料的**豐富表現操作**、以及**環境光照**——並指出這些原則適用於 CAD 以外的都市規劃、物流、房地產等領域。全場將涵蓋資產準備、操作 assembly、clipping 與 autoexpansion 四大主題。"},{"t":175,"title":"Asset preparation","body":"重點是模型的**階層結構**。3D 模型是部分與整體的關係，若匯出時把所有幾何攤平到 root（如 InteriorPart_01、part 25），即使在 viewport 看起來完全正常，程式也無從判斷要隱藏、顯示或讓哪個部件可操作——想隔離某顆活塞根本找不到。正確做法是保留**深層巢狀的 hierarchy**，讓每個節點被命名、分組，程式才能找到並單獨動畫、highlight 或讓人徒手拉出。"},{"t":305,"title":"Manipulating the hierarchy","body":"用 RealityKit 的 **ManipulationComponent** 讓人以自然手勢選取、移動、旋轉、縮放部件，關鍵在於**元件放在樹的哪一層就決定行為**。放在 root 時整個展開的模型當作單一物件移動且內部關係不變；把元件下移到子節點，就能單獨拉開上蓋、讓兩人同時旋轉各自的耳機。這個從「觀看之物」到「探索之物」的轉變，純粹來自元件在樹中的位置。"},{"t":430,"title":"Opening an assembly","body":"對應 `openAssembly()`：先移除實體上的 **ManipulationComponent** 與 **InputTargetComponent** 讓它本身不可操作，再迭代子實體，為每個子節點加上 InputTargetComponent 與 ManipulationComponent，並把 `releaseBehavior` 設為 `.stay`，讓人放手後部件留在原位。講者特別強調：範例未顯示但**務必為實體加上 CollisionComponent**，否則事件無法被處理。"},{"t":431,"title":"Closing an assembly","body":"對應 `closeAssembly()`，流程與開啟相反：先把每個子實體的 ManipulationComponent 與 InputTargetComponent 移除，再把這兩個元件加回父實體（同樣 `releaseBehavior = .stay`）。如此一來整棵樹既能在收合時當作**單一元素**被操作，也能在開啟時當作各自獨立的實體，幾何與階層皆未改變，差別只在元件所在的位置。"},{"t":495,"title":"Interactive clipping","body":"介紹 visionOS 27 新的 **ClippingComponent**，讓內部如外部一樣可見。重點屬性是 entity local space 的 `bounds`（AABB，超出範圍每幀被丟棄），以及 `shouldClipChildren`（預設 false，子節點不剪裁多半因為它）與 `shouldClipSelf`（預設 true）。互動把六個面變成六個可拖曳平面（**六平面、六個數字**），以 `.off／.on／.editing` 三態管理，並用 ClippingBoundsCache、ClippingTransformSync 等自訂元件輔助。最難處是座標系：拖曳事件在 clipping plane 座標系，須經 World → Model 轉換、用**投影（點積除以長度平方）**約束到平面法線方向更新 bounds，再轉回 plane 座標系移動視覺平面，讓互動手感自然。"},{"t":1096,"title":"Autoexpansion","body":"示範讓組件**自動沿單一軸展開**以揭露內部結構，且不強迫使用者選方向，而是讓程式用數學決定。講者先科普**變異數（variance）**與**加權（weighting）**：把每個值的離均差平方後平均得變異數，再乘上權重得加權變異數。接著計算各軸的**體積加權位置變異數（volume-weighted position variance）**，以體積為權重，挑變異數最大的軸——範例中 x 與 z 因部件多聚在一起而變異數小，**y 軸**因大體積部件距離較遠而勝出，最後用 FromToBy 動畫把子組件沿 y 軸散開。"},{"t":1450,"title":"Next steps","body":"回顧今天涵蓋的資產階層準備、部件操作、clipping 透視與沿軸展開，並指出這套流程能打造大幅提升生產力的設計審查 app。講者鼓勵大家從 developer.apple.com 下載範例專案，並熟悉**統計、向量數學與線性代數**。延伸方向包括用 spatial preview framework 從 Mac 即時控制模型，以及結合 object tracking 把虛擬內容疊在實體物件（如賽車模擬座艙）上探索其內部結構。"}],"summary_en":["Presented by Bill, this session shows how to collaborate on **structured 3D models** on Apple Vision Pro to build design-review experiences that simply aren't possible on a flat screen. A running scenario of a SharePlay AirPods Pro design review threads through the talk: multiple people in the same space, at the same fidelity, see the same asset — pulling it closer, unlocking it, lifting out the bottom assembly, rotating it for a colleague, pointing with a gesture, then collapsing it and engaging **clipping** to expose the logic board. This rests on three things Vision Pro does well: **real-time collaboration**, **manipulation of rich representations** of multidimensional data, and **environment lighting** that grounds every virtual decision. The principles extend beyond CAD to urban planning, logistics, real estate, and more.","The talk covers four topics. First, **asset preparation**: a 3D model is a part-whole relationship, and if it's exported with everything flattened to the root (InteriorPart_01, part 25, …) it looks fine in the viewport but the code can't decide what to hide, show, or make manipulable. The fix is a deep, nested **hierarchy** where every node is named and grouped, so code can find and isolate a single piston or the crankshaft.","Second, **manipulating the hierarchy** with RealityKit's **ManipulationComponent**, where placement in the tree drives behavior: at the root the whole spread moves as one object, while moving the component down to the children lets you pull off the top enclosure or rotate one earbud independently. `openAssembly` removes the ManipulationComponent and InputTargetComponent from the entity, then adds them to each child with `releaseBehavior` set to `.stay` so parts stay where released; `closeAssembly` reverses this. The presenter stresses a key caveat: **don't forget the CollisionComponent**, which is critical for event processing.","Third is **clipping**, new in visionOS 27, via the **ClippingComponent** (key properties: `bounds` in entity local space, plus `shouldClipChildren` and `shouldClipSelf`) so the inside becomes as visible as the outside. The interaction turns the six faces of the AABB into six draggable planes (six planes, six numbers), managed by an `.off / .on / .editing` state machine. The hard part is coordinate-frame conversion: drag events arrive in the clipping-plane frame and must be transformed through World → Model, constrained to the plane normal via **projection (a dot product over length squared)** to update the bounds, then converted back to move the visual plane. Fourth is **autoexpansion**: the code computes a **volume-weighted position variance** along each axis and expands along the axis with the largest variance (y in the example), then uses FromToBy animations to fan the sub-assemblies apart. The session closes by encouraging familiarity with statistics, vector math, and linear algebra, and pointing to the downloadable sample project."],"deepdive_en":[{"t":0,"title":"Introduction","body":"Bill opens with a SharePlay AirPods Pro design-review scenario that threads through the talk: multiple people in a shared space, at the same fidelity, examine one asset — pulling it closer, unlocking it, lifting out the bottom assembly, rotating it for a colleague, pointing with a gesture, and engaging **clipping** to reveal the logic board. He distills three key Vision Pro capabilities — **real-time collaboration**, **manipulation of rich representations** of multidimensional data, and **environment lighting** — and notes these principles apply beyond CAD to urban planning, logistics, and real estate. The session will cover asset preparation, manipulating assemblies, clipping, and autoexpansion."},{"t":175,"title":"Asset preparation","body":"The focus is the model's **hierarchy**. A 3D model is a part-whole relationship, and if it's exported with all geometry flattened to the root (InteriorPart_01, part 25), it looks completely fine in the viewport but the code can't decide what to hide, show, or make manipulable — isolating a single piston becomes impossible. The right approach is a deep, nested **hierarchy** where each node is named and grouped, so code can find a part and animate, highlight, or let a person pull it free."},{"t":305,"title":"Manipulating the hierarchy","body":"RealityKit's **ManipulationComponent** lets people select, move, rotate, and scale parts with natural hand input, and the key idea is that **where the component lives in the tree drives behavior**. At the root the whole expanded model moves as a single object with internal relationships intact; moving the component down to the children lets you pull off the top enclosure or let two people rotate separate earbuds at once. That shift from 'thing to look at' to 'thing to explore' comes entirely from the component's position in the tree."},{"t":430,"title":"Opening an assembly","body":"This maps to `openAssembly()`: first remove the **ManipulationComponent** and **InputTargetComponent** from the entity so it isn't manipulable on its own, then iterate the children and add an InputTargetComponent and ManipulationComponent to each, with `releaseBehavior` set to `.stay` so a part stays where the person puts it on release. The presenter stresses a critical note not shown in the snippet: **always add a CollisionComponent**, since it's essential for event processing."},{"t":431,"title":"Closing an assembly","body":"This maps to `closeAssembly()`, the reverse of opening: remove the ManipulationComponent and InputTargetComponent from each child, then add both back to the parent entity (again with `releaseBehavior = .stay`). The tree can then be manipulated as a **single element** when closed or as independent entities when open, with neither the geometry nor the hierarchy changing — only where the component lives."},{"t":495,"title":"Interactive clipping","body":"This introduces the **ClippingComponent**, new in visionOS 27, making the inside as visible as the outside. Key properties are `bounds` (an AABB in entity local space, with anything outside discarded each frame), `shouldClipChildren` (defaults to false — the usual reason children aren't clipping), and `shouldClipSelf` (defaults to true). The interaction turns the six faces into six draggable planes (**six planes, six numbers**), managed by an `.off / .on / .editing` state machine with helper components like ClippingBoundsCache and ClippingTransformSync. The hard part is the coordinate frames: drag events arrive in the clipping-plane frame and must be transformed through World → Model, constrained to the plane normal via **projection (a dot product over length squared)** to update the bounds, then converted back to move the visual plane so the interaction feels natural."},{"t":1096,"title":"Autoexpansion","body":"This demonstrates expanding the assembly **along a single axis** to reveal its inner structure, without forcing the person to choose the direction — the code decides with math. The presenter explains **variance** and **weighting**: square each value's deviation from the mean and average them for variance, then multiply by a weight for weighted variance. It then computes a **volume-weighted position variance** along each axis using volume as the weight and picks the axis with the largest variance — x and z are small because parts cluster together, while **y** wins because large-volume parts sit farther apart — then uses FromToBy animations to fan the sub-assemblies out along y."},{"t":1450,"title":"Next steps","body":"The session recaps preparing an asset hierarchy, manipulating parts, using clipping to see through an assembly, and expanding parts along an axis, noting this workflow enables productivity-boosting design-review apps. The presenter encourages downloading the sample project from developer.apple.com and getting comfortable with **statistics, vector math, and linear algebra**. Extensions include using the spatial preview framework to control models in real time from a Mac, and combining object tracking to overlay virtual content on a physical object (like a race-car simulator cockpit) to explore its internal structure."}],"code":["func openAssembly() {\n    components[ManipulationComponent.self] = nil\n    components[InputTargetComponent.self] = nil\n\n    for child in assemblyChildren {\n        child.components.set(InputTargetComponent())\n\n        var manipulation = ManipulationComponent()\n        manipulation.releaseBehavior = .stay\n        child.manipulationComponent = manipulation\n    }\n}","func closeAssembly() {\n    for child in assemblyChildren {\n        child.manipulationComponent = nil\n        child.components[InputTargetComponent.self] = nil\n    }\n\n    components.set(InputTargetComponent())\n    var manipulation = ManipulationComponent()\n    manipulation.releaseBehavior = .stay\n    manipulationComponent = manipulation\n}"]},"related":[{"id":"279","title":"Explore advances in RealityKit","gloss":"探索 RealityKit 的最新進展","gloss_en":"Explore advances in RealityKit","category":"visionos","categoryLabel":"visionOS"},{"id":"280","title":"Iterate your spatial scenes faster with Reality Composer Pro 3","gloss":"用 Reality Composer Pro 3 更快迭代空間場景","gloss_en":"Iterate your spatial scenes faster with Reality Composer Pro 3","category":"visionos","categoryLabel":"visionOS"},{"id":"283","title":"Explore enhancements to visionOS object tracking","gloss":"探索 visionOS 物件追蹤的強化功能","gloss_en":"Explore enhancements to visionOS object tracking","category":"visionos","categoryLabel":"visionOS"},{"id":"286","title":"Use foveated streaming to bring immersive content to visionOS","gloss":"用注視點串流把沉浸式內容帶到 visionOS","gloss_en":"Use foveated streaming to bring immersive content to visionOS","category":"visionos","categoryLabel":"visionOS"},{"id":"287","title":"Build next-generation experiences with visionOS 27","gloss":"用 visionOS 27 打造次世代體驗","gloss_en":"Build next-generation experiences with visionOS 27","category":"visionos","categoryLabel":"visionOS"}]}</script>
