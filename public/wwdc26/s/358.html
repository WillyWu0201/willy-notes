<script id="d" type="application/json">{"s":{"id":"358","title":"Make your game great with touch","gloss":"用觸控讓你的遊戲更出色","category":"graphics","categoryLabel":"圖形與遊戲","duration":1463,"url":"https://developer.apple.com/videos/play/wwdc2026/358/","takeaway":"運用 TCTouchController 打造彈性的觸控版面與流暢互動，依情境動態調整按鈕與搖桿，並以自訂內容提供豐富回饋，為遊戲設計出色的觸控操作。","chapters":[[0,"Introduction"],[102,"Set up a touch controller"],[124,"GCController polling vs. change handlers"],[194,"Set up a TCTouchController"],[292,"Design flexible layouts"],[513,"Create a standard circular button B"],[617,"Design fluid interactions"],[648,"Change icon image"],[711,"Update contents for button B based on context"],[781,"Hide left thumbstick when not touched"],[799,"Show/hide the pick-up button"],[836,"Show power options as touch controls"],[934,"Use the left half of the screen for character movement"],[999,"Calculate thumbstick tilt magnitude to trigger sprint"],[1056,"Replace right thumbstick with a touchpad"],[1170,"Collapse two QTE buttons into one"],[1228,"Use button B to aim, move, and release power"],[1276,"Provide rich feedback"],[1312,"Add a halo effect with custom TCControlContents"],[1429,"Next steps"]],"points":[{"text":"以 **TCTouchController** 與各種 descriptor 設定觸控控制項，並比較 GCController 的 polling 與 change handlers 兩種輸入方式。","hot":true},{"text":"設計**彈性版面**：以 anchor 與 offset 並考量 safe area 配置按鈕，例如標準圓形的 button B。","hot":false},{"text":"打造**流暢互動**：依情境更換按鈕圖示、在未觸碰時隱藏搖桿、動態顯示拾取按鈕或能力轉盤。","hot":false},{"text":"用螢幕左半 colliderShape 控制角色移動、計算搖桿傾斜量觸發衝刺，並以 **TCTouchpadDescriptor** 取代右搖桿。","hot":false},{"text":"透過自訂 **TCControlContents**（如為搖桿加上光暈圖層）提供豐富的視覺回饋。","hot":false}],"apis":["TCTouchController","TCTouchControllerDescriptor","TCButtonDescriptor","TCThumbstickDescriptor","TCTouchpadDescriptor","TCControlContents","TCControlImage","TCControlLabel","GCController","GCControllerButtonInput"],"audience":"適合**在 Apple 平台開發遊戲、想為觸控螢幕設計優質操作體驗的遊戲開發者**。","gloss_en":"Make your game great with touch","takeaway_en":"Use TCTouchController to build flexible touch layouts and fluid interactions, adjusting buttons and sticks dynamically by context, and provide rich feedback with custom content to design great touch controls for your game.","points_en":[{"text":"Set up touch controls with **TCTouchController** and various descriptors, and compare GCController's two input approaches: polling versus change handlers.","hot":true},{"text":"Design a **flexible layout**: position buttons with anchors and offsets while accounting for the safe area, such as a standard circular button B.","hot":false},{"text":"Build **fluid interactions**: swap button icons by context, hide the stick when not being touched, and dynamically show a pickup button or ability wheel.","hot":false},{"text":"Use a colliderShape over the left half of the screen to control character movement, compute the stick's tilt amount to trigger a sprint, and replace the right stick with **TCTouchpadDescriptor**.","hot":false},{"text":"Provide rich visual feedback through custom **TCControlContents** (such as adding a glow layer to a stick).","hot":false}],"audience_en":"**Game developers building on Apple platforms who want to design great controls for touchscreens.**","summary":["這場由 Game Technology 團隊主講，主題是如何用全新的 **Touch Controller 框架**為遊戲打造出色的觸控操作。前提是：玩家會隨時隨地在 iPhone 上玩你的遊戲，但臨時起意時手邊不一定有實體控制器，因此優秀的觸控操作至關重要。Touch Controller 建立在既有的 **Game Controller 框架**之上——當啟用觸控控制時，它會以一個 **`GCController`** 物件呈現，所以你可以像對待任何控制器一樣 poll 狀態或設 value-changed handler，已支援實體控制器的遊戲幾乎不必改動遊戲邏輯。整場以講者的遊戲為例，依序示範：設定觸控控制器、設計彈性版面、打造流暢互動、提供豐富回饋。","**設定**：從 descriptor 建立 `TCTouchController` 並用 `connect` 啟用（自動啟用 game controller 邏輯），在 UIView 覆寫 `touchesBegan`／`touchesEnded`／`touchesMoved` 轉呼叫對應的 handle 函式通知控制器，並在 Metal renderer 中用 render API 把控制項畫到畫面上。**彈性版面**是關鍵：框架為每個版面提供 **九個 anchor point**，控制項以相對 anchor 的 offset 擺放，可把相關控制項群組成 section 共用同一 anchor，讓裝置形狀改變時各 section 維持一致的大小與距離。同時要設計**全螢幕**體驗、用 UIView 的 `safeAreaInsets` 避開圓角、home indicator 與 Dynamic Island，並把控制項放在拇指附近（常用）與螢幕頂端（不常用如選單），避開角色與移動／攝影機輸入區。","**流暢互動**強調讓控制項感覺原生於觸控。用動態控制項：換 system asset 的名稱讓 button B 顯示實際動作（如打擊、火球、水滴）的圖示，並在 context 改變時更新；用 `hidesWhenNotPressed`（thumbstick）或 `isEnabled = false`（按鈕）在動作不可用時整個隱藏，pickup 按鈕則因位置會變而用「加入／移除」並每次更新位置。觸控控制項可同時作為輸入與輸出——直接把可用的招式顯示成觸控控制項（power wheel）取代 overlay，並在三秒無選擇時自動消失。移動方面：把 thumbstick 的 `colliderShape` 設為 `leftSide`／`rightSide` 讓半個螢幕都能感測；把衝刺併入 thumbstick 本身、用**傾斜幅度（tilt magnitude）**判定（小幅正常、大幅衝刺），免去第二根手指;並用 **`TCTouchpad`**（label 設 rightThumbstick、`reportsRelativeValues = true`）取代右 thumbstick 控制攝影機，兼顧速度與精準、無過度旋轉。","**重新設計複雜操作**：把需多指的 QTE（如同時按 L1+R1 又推 thumbstick 脫困）**併成單一 QTE 按鈕**，因位置固定故用 `isEnabled` 顯示／隱藏；把瞄準與發射這類「瞄準—移動—放開」**合併成單一動作按鈕**——在 button B 的 valueChangedHandler 依按壓狀態呼叫 releasePower，並在 `touchesMoved` 中於 button B 按住時擷取原始 touch delta 做按住拖曳瞄準。**豐富回饋**方面，每個觸控控制項都應有可見的按下狀態（框架預設處理：thumbstick 隨移動動畫、按鈕按下高亮）；要更進一步可手動建立 **`TCControlContents`**（本質是一疊圖層 array），例如把 halo Metal 材質做成的光環 `TCControlImage` 疊在標準背景上，衝刺啟動時換上、結束時還原，給玩家強烈的視覺指示。"],"deepdive":[{"t":0,"title":"Introduction","body":"Game Technology 團隊的 Keyi Yu 開場，說明用 **Game Porting Toolkit 4** 把 Mac 遊戲移植到 iOS 很直接，但玩家臨時起意在 iPhone 上玩時不一定有實體控制器，因此**出色的觸控操作**至關重要。以 Black Salt Games 的 Dredge 為例,並預告以自己的遊戲示範四步驟：設定觸控控制器、彈性版面、流暢互動、豐富回饋。"},{"t":102,"title":"Set up a touch controller","body":"說明 **Touch Controller 框架**建立在 Game Controller 框架之上，把支援延伸到觸控輸入。它含豐富的按鈕型別與行為、每個按鈕外觀可自訂、並直接整合 Metal 以求最高效能；啟用後以一個 **`GCController`** 物件呈現，可像其他控制器一樣 poll 或設 handler。"},{"t":124,"title":"GCController polling vs. change handlers","body":"回顧 Game Controller 框架核心：對 `GCController` 連接／斷開的通知反應，然後 poll 活躍裝置的輸入狀態，或設 value-changed handler 在狀態改變時收到通知。實作好遊戲邏輯後即可在其上加觸控控制。"},{"t":194,"title":"Set up a TCTouchController","body":"示範設定：從 descriptor 建立 `TCTouchController`、用 `connect` API 啟用（自動啟用 game controller 邏輯），在 UIView 覆寫 `touchesBegan`／`touchesEnded`／`touchesMoved` 並轉呼叫對應 handle 函式通知控制器，在 Metal renderer 用 render API 渲染所有控制項，最後設好 polling 與 valueChangedHandler。"},{"t":292,"title":"Design flexible layouts","body":"強調**彈性版面**讓遊戲在任何螢幕尺寸都舒適。框架為每個版面提供 **九個 anchor point**，控制項以相對 anchor 的 offset 擺放,可把相關控制項群組成 section 共用同一 anchor，使裝置形狀改變時各 section 維持一致大小與距離。並要設計**全螢幕**、用 `safeAreaInsets` 避開圓角、home indicator 與 Dynamic Island，把常用控制放拇指附近、不常用（如選單）放頂端，避開角色與移動／攝影機區。"},{"t":513,"title":"Create a standard circular button B","body":"示範建立標準圓形 button B：初始化 `TCButtonDescriptor`、把 label 設為 `TCControlLabel.buttonB` 對應實體控制器的 B 鍵（因此免寫額外遊戲邏輯）、anchor 在 bottomRight 並設固定 offset、設定視覺內容、呼叫 `addButton`，並用 `safeAreaInsets` 調整 offset 以免被裁切。"},{"t":617,"title":"Design fluid interactions","body":"指出一對一照搬實體控制器會讓畫面雜亂、控制項互相爭空間，本節要清理並設計感覺原生於觸控的控制，因為流暢自然的互動能讓玩家沉浸。"},{"t":648,"title":"Change icon image","body":"用**動態控制項**：因螢幕控制項外觀可隨時改，換 system asset 名稱讓 button B 不顯示 buttonB 而顯示實際動作（打擊）的圖示。換掉所有 asset 後版面更直覺，玩家不必查設定或看提示就知道每個控制項的功能。"},{"t":711,"title":"Update contents for button B based on context","body":"當控制項行為隨 context 改變時應更新圖示：button B 除預設打擊外還可代表火球或水招，因此選招時圖示換成火焰或水滴。做法是寫一個更新 button B 內容的 helper，在 cyclePower 中以對應 symbolName 呼叫它。"},{"t":781,"title":"Hide left thumbstick when not touched","body":"當動作不相關時就整個從螢幕移除，別留下無法使用的控制項。thumbstick 在未被觸碰時隱藏只要在建立時設 `hidesWhenNotPressed = true`；其他按鈕則設 `isEnabled = false` 來隱藏。"},{"t":799,"title":"Show/hide the pick-up button","body":"pickup 按鈕較特別：它要出現在需撿拾物品的旁邊，因此每次顯示時更新位置，要關閉時則整個從 touchController **移除**。隱藏 thumbstick、pickup 與 QTE 按鈕後畫面乾淨許多。"},{"t":836,"title":"Show power options as touch controls","body":"觸控控制項可同時作為輸入與輸出——與其顯示 overlay 再循環切換招式，不如直接把招式顯示成觸控控制項。在 buttonX 的 press handler 直接開啟 power wheel 控制項，在 openPowerWheel 依目前可用招式加入各控制項並設 value-changed handler，且因不常用故三秒無選擇即自動消失。"},{"t":934,"title":"Use the left half of the screen for character movement","body":"角色與攝影機移動需流暢。實體 thumbstick 尺寸固定，但觸控不受限,且玩家感覺不到手指相對控制項的位置，故應盡量擴大輸入區。把 `colliderShape` 設為 `leftSide` 或 `rightSide`，讓 thumbstick 取得整個半邊螢幕的觸控偵測。"},{"t":999,"title":"Calculate thumbstick tilt magnitude to trigger sprint","body":"衝刺原本要按住 thumbstick 又同時移動，觸控上等於要兩指很難做。解法是把 thumbstick 按鈕功能內嵌進 thumbstick，用**傾斜幅度**判定：小幅正常、大幅衝刺。在 `pollInput()` 讀 `GCController` 的 leftThumbstick 取 tilt 值並做 magnitude 檢查，玩家用單一 thumbstick 即可衝刺。"},{"t":1056,"title":"Replace right thumbstick with a touchpad","body":"直接把右 thumbstick 對應攝影機會過度旋轉且遲鈍，**touchpad** 兼顧速度與精準、無延遲或起止漂移。用 **`TCTouchpad`**：初始化 descriptor、label 設 rightThumbstick 以對應既有攝影機邏輯、colliderShape 設 rightSide 覆蓋右半螢幕、`reportsRelativeValues = true` 讓任意位置觸碰皆可用，再加入 touchController，且無可見控制項佔畫面。"},{"t":1170,"title":"Collapse two QTE buttons into one","body":"處理複雜組合的第一例 QTE：大魔王凍結角色時需按住 L1+R1 脫困又用左 thumbstick 移動，兩指難管。解法是把兩鍵**併成單一 QTE 按鈕**並在事件外整個隱藏；因位置固定（不像 pickup 變位置），用 `isEnabled` 顯示／隱藏而非每次加移除。"},{"t":1228,"title":"Use button B to aim, move, and release power","body":"第二例瞄準發招原需多於兩指同時瞄準、移動、放開。解法是把瞄準與發射**合併成單一動作按鈕**：移除瞄準與發射按鈕，在 button B 的 valueChangedHandler 依按壓狀態呼叫 releasePower，並在 `touchesMoved` 中於 button B 按住時擷取原始 touch delta 做按住拖曳瞄準，放開即發火球，互動順暢許多。"},{"t":1276,"title":"Provide rich feedback","body":"玩家能觸碰任何地方，因此清楚的觸碰回饋很重要。每個觸控控制項都應有可見按下狀態，而框架預設已處理：thumbstick 隨移動動畫、按鈕按下高亮。但在視覺繁忙的遊戲中可能想要更強的自訂視覺回饋。"},{"t":1312,"title":"Add a halo effect with custom TCControlContents","body":"因衝刺時回饋不足，加一個圍繞左 thumbstick 外圈的發光光環。手動建立 **`TCControlContents`**：用 halo Metal 材質產生略大於背景的 halo `TCControlImage`，把它疊在標準背景圖層之上（`TCControlContents` 本質是一疊圖層 array），衝刺啟動時換上含光環的版本、結束時還原,讓「衝刺模式」一目了然。"},{"t":1429,"title":"Next steps","body":"總結整體成果：從實體控制器一對一照搬的雜亂畫面，到清楚易用的觸控版面——左 thumbstick 觸碰才現、pickup 按鈕有物品才現、右半螢幕為攝影機 touchpad 無過度旋轉、按鈕選招、按住拖曳單鍵瞄準發招、衝刺指示。鼓勵用 **Touch Controller 框架**設計優秀觸控操作，並建議搭配「Design great interfaces for handheld games」等延伸內容。"}],"summary_en":["Presented by the Game Technology team, this session is about crafting great touch controls for games with the new **Touch Controller framework**. The premise: players will jump into your game on iPhone anywhere, anytime, but in spontaneous moments they may not have a physical controller—so great touch controls matter. Touch Controller builds on the existing **Game Controller framework**—when enabled, it shows up as a **`GCController`** object, so you poll its state or set value-changed handlers just like any controller, meaning games that already support physical controllers barely change their game logic. Using the presenter's game, it walks through setting up a touch controller, designing flexible layouts, building fluid interactions, and providing rich feedback.","**Setup**: create a `TCTouchController` from a descriptor and enable it with `connect` (which auto-enables game controller logic), override `touchesBegan`/`touchesEnded`/`touchesMoved` in the UIView to forward to the matching handle functions, and render controls on screen with the render API in the Metal renderer. **Flexible layout** is key: the framework gives **nine anchor points** per layout, controls are placed by offset relative to an anchor, and related controls can be grouped into a section sharing one anchor so each stays at a consistent size and distance as the device shape changes. Design for **fullscreen**, use a UIView's `safeAreaInsets` to avoid rounded corners, the home indicator, and the Dynamic Island, and place controls near the thumbs (frequent) and at the top (infrequent, like menus), away from the character and movement/camera input areas.","**Fluid interactions** focus on making controls feel native to touch. Use dynamic controls: change a system asset's name so button B shows the actual action's icon (strike, fireball, water) and update it as context changes; hide controls entirely when unavailable via `hidesWhenNotPressed` (thumbsticks) or `isEnabled = false` (buttons), while the pickup button is added/removed with its position updated each time. Touch controls serve as both input and output—show available powers directly as touch controls (a power wheel) instead of an overlay, auto-dismissing after three seconds. For movement: set a thumbstick's `colliderShape` to `leftSide`/`rightSide` so half the screen senses touch; fold sprint into the thumbstick itself using **tilt magnitude** (small = normal, large = sprint) to avoid a second finger; and replace the right thumbstick with a **`TCTouchpad`** (label set to rightThumbstick, `reportsRelativeValues = true`) for camera control with speed and precision and no over-rotation.","**Redesigning complex controls**: collapse a multi-finger QTE (holding L1+R1 while moving the thumbstick to break free) into a **single QTE button**, shown/hidden via `isEnabled` since its position is fixed; combine aim-and-release into a **single action button**—call releasePower from button B's valueChangedHandler based on pressed state, and capture the raw touch delta in `touchesMoved` while button B is held for hold-and-drag aiming. For **rich feedback**, every control should have a visible pressed state (handled by default: thumbsticks animate, buttons highlight); to go further, build **`TCControlContents`** manually (essentially an array of layers)—e.g., stack a halo `TCControlImage` from a halo Metal texture over the standard background, swapping it in when sprint is active and reverting when not, for a strong visual indicator."],"deepdive_en":[{"t":0,"title":"Introduction","body":"Game Technology team's Keyi Yu opens, noting porting Mac games to iOS is straightforward with **Game Porting Toolkit 4**, but players jumping into a game on iPhone may not have a physical controller, so **great touch controls** matter. Cites Dredge by Black Salt Games and previews four steps demoed on her own game: set up a touch controller, flexible layouts, fluid interactions, and rich feedback."},{"t":102,"title":"Set up a touch controller","body":"Explains the **Touch Controller framework** builds on the Game Controller framework, extending support to touch input. It includes a rich set of button types and behaviors, each button's appearance is customizable, and it integrates with Metal for top performance; when enabled it appears as a **`GCController`** so you poll or set handlers like any controller."},{"t":124,"title":"GCController polling vs. change handlers","body":"Reviews the Game Controller core: react to `GCController` connect/disconnect notifications, then poll active devices' input state or set value-changed handlers for updates. With game logic implemented on GCController, you're ready to layer touch controls on top."},{"t":194,"title":"Set up a TCTouchController","body":"Shows setup: create a `TCTouchController` from a descriptor, enable it with the `connect` API (auto-enabling game controller logic), override `touchesBegan`/`touchesEnded`/`touchesMoved` in the UIView to forward to matching handle functions, render all controls with the render API in the Metal renderer, and set up polling and a valueChangedHandler."},{"t":292,"title":"Design flexible layouts","body":"Stresses **flexible layout** so the game feels comfortable on any screen size. The framework provides **nine anchor points** per layout; controls are placed by offset relative to an anchor, and related controls can share one anchor in a section so each stays at a consistent size and distance as the device shape changes. Also design for **fullscreen**, use `safeAreaInsets` to avoid rounded corners, the home indicator, and the Dynamic Island, placing frequent controls near the thumbs and infrequent ones (menus) at the top, away from the character and movement/camera areas."},{"t":513,"title":"Create a standard circular button B","body":"Demos a standard circular button B: initialize a `TCButtonDescriptor`, set its label to `TCControlLabel.buttonB` to map to the physical B (so no extra game logic), anchor in bottomRight with a fixed offset, set visual contents, call `addButton`, and adjust the offset with `safeAreaInsets` to avoid clipping."},{"t":617,"title":"Design fluid interactions","body":"Notes a one-to-one mapping from a physical controller clutters the screen with controls competing for space; this section cleans that up and designs controls that feel native to touch, since fluid, natural interactions immerse players."},{"t":648,"title":"Change icon image","body":"Uses **dynamic controls**: since on-screen control appearance can change, swap the system asset name so button B shows the actual action's (strike) icon instead of 'buttonB'. After swapping all assets, the layout is more intuitive and players know each control's function without checking settings or hints."},{"t":711,"title":"Update contents for button B based on context","body":"When a control's behavior changes with context, update its icon: besides strike, button B can be fireball or water, so the icon becomes a flame or water drop when that power is selected. A helper updates button B's contents, called in cyclePower with the right symbolName per power."},{"t":781,"title":"Hide left thumbstick when not touched","body":"When an action is irrelevant, remove it from the screen entirely rather than leaving unusable controls. Hide a thumbstick when untouched by setting `hidesWhenNotPressed = true` at creation; hide other buttons by setting `isEnabled = false`."},{"t":799,"title":"Show/hide the pick-up button","body":"The pickup button is special: it should appear next to the item to pick up, so its position is updated each time it's shown, and when dismissed it's **removed** from the touchController entirely. After hiding the thumbsticks, pickup, and QTE buttons, the screen is much cleaner."},{"t":836,"title":"Show power options as touch controls","body":"Touch controls serve as both input and output—rather than an overlay cycling through actions, show available powers directly as touch controls. In buttonX's press handler, open the power wheel controls directly; in openPowerWheel, add each available power with a value-changed handler, auto-dismissing after three seconds since they're used infrequently."},{"t":934,"title":"Use the left half of the screen for character movement","body":"Character and camera movement must feel smooth. Physical thumbsticks have a fixed size, but touch isn't bound by that, and players can't feel their finger's position relative to a control, so expand the input area. Set `colliderShape` to `leftSide` or `rightSide` to give the thumbstick the entire half of the screen for touch detection."},{"t":999,"title":"Calculate thumbstick tilt magnitude to trigger sprint","body":"Sprinting originally meant holding the thumbstick while moving it—two fingers on touch, which is hard. The fix embeds the thumbstick button's function into the thumbstick and uses **tilt magnitude**: small = normal, large = sprint. In `pollInput()`, read `GCController`'s leftThumbstick, get the tilt, and do a magnitude check, so players sprint with a single thumbstick."},{"t":1056,"title":"Replace right thumbstick with a touchpad","body":"Mapping the right thumbstick directly to the camera causes over-rotation and feels sluggish; a **touchpad** gives speed and precision with no latency or drift. Use **`TCTouchpad`**: initialize the descriptor, set label to rightThumbstick to map to existing camera logic, colliderShape to rightSide to cover the right half, `reportsRelativeValues = true` so it works wherever the player touches, then add it to the touchController—with no visible control cluttering the screen."},{"t":1170,"title":"Collapse two QTE buttons into one","body":"The first complex-combo case is a QTE: when the boss freezes the character, hold L1+R1 to break free while moving with the left thumbstick—hard with two fingers. The fix collapses the two buttons into a **single QTE button** and hides it when the event isn't happening; since its position is fixed (unlike pickup), use `isEnabled` to show/hide rather than add/remove each time."},{"t":1228,"title":"Use button B to aim, move, and release power","body":"The second case, aim-to-release, originally needed more than two fingers to aim, move, and release at once. The fix combines aim and release into a **single action button**: remove the aim and release buttons, call releasePower from button B's valueChangedHandler based on pressed state, and capture the raw touch delta in `touchesMoved` while button B is held for hold-and-drag aiming—releasing fires the fireball, much smoother."},{"t":1276,"title":"Provide rich feedback","body":"Since players can touch anywhere, clear feedback matters. Every control should have a visible pressed state, and the framework handles this by default: thumbsticks animate as they move and buttons highlight when pressed. But in a visually busy game you may want stronger custom visual feedback."},{"t":1312,"title":"Add a halo effect with custom TCControlContents","body":"Since sprinting gave little feedback, add a glowing halo around the left thumbstick's outer ring. Build **`TCControlContents`** manually: generate a halo `TCControlImage` from a halo Metal texture, slightly larger than the background, and stack it over the standard background layers (`TCControlContents` is essentially an array of layers), swapping in the haloed version when sprint is active and reverting when not, making sprint mode immediately clear."},{"t":1429,"title":"Next steps","body":"Summarizes the overall result: from a cluttered one-to-one mapping of a physical controller to a clear, easy-to-use touch layout—the left thumbstick appears on touch, the pickup button appears when an item is nearby, the right half is a camera touchpad with no over-rotation, buttons pick powers, a single button hold-and-drag aims and releases, and a sprint indicator helps. Encourages designing great touch controls with the **Touch Controller framework** and points to talks like 'Design great interfaces for handheld games.'"}],"code":[]},"related":[{"id":"215","title":"Get started with the HTML Model Element","gloss":"開始使用 HTML model 元素","gloss_en":"Getting started with the HTML model element","category":"graphics","categoryLabel":"圖形與遊戲"},{"id":"252","title":"Design no-code games with Reality Composer Pro 3","gloss":"用 Reality Composer Pro 3 設計無程式碼遊戲","gloss_en":"Design no-code games with Reality Composer Pro 3","category":"graphics","categoryLabel":"圖形與遊戲"},{"id":"256","title":"Discover generated subtitles and subtitle styles","gloss":"認識自動產生字幕與字幕樣式","gloss_en":"Discover generated subtitles and subtitle styles","category":"graphics","categoryLabel":"圖形與遊戲"},{"id":"285","title":"Discover USDKit and what’s new in OpenUSD","gloss":"認識 USDKit 與 OpenUSD 的新功能","gloss_en":"Discover USDKit and what's new in OpenUSD","category":"graphics","categoryLabel":"圖形與遊戲"},{"id":"304","title":"Implement high resolution photo capture","gloss":"實作高解析度照片拍攝","gloss_en":"Implement high resolution photo capture","category":"graphics","categoryLabel":"圖形與遊戲"}]}</script>
