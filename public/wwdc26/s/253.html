<script id="d" type="application/json">{"s":{"id":"253","title":"Meet the Music Understanding framework","gloss":"認識 Music Understanding 框架","category":"ai","categoryLabel":"AI 與機器學習","duration":1000,"url":"https://developer.apple.com/videos/play/wwdc2026/253/","takeaway":"用全新的 Music Understanding 框架在裝置端分析音訊的六個面向（調性、節奏、結構、樂器、響度、節奏感），打造音樂相關的智慧功能。","chapters":[[0,"Introduction"],[99,"Musical features"],[199,"Framework integration"],[235,"Music Understanding Lab"],[287,"Initialize the session"],[324,"Inside SessionResult"],[353,"TimedValue"],[358,"RangedValue"],[387,"Key analysis"],[403,"KeySignature"],[408,"Using tonic"],[419,"Using mode"],[436,"Rhythm analysis"],[522,"StructureResult"],[566,"Analyzing pace"],[613,"InstrumentActivityResult"],[705,"LoudnessResult"],[768,"Streaming API for loudness"],[775,"Streaming API for loudness"],[799,"Audio Provider"],[835,"Encode to JSON"],[887,"Suggestion for using pace"]],"points":[{"text":"全新的 **Music Understanding** 框架可在**裝置端（on device）**分析音訊的六個面向：調性、節奏、結構、樂器活動、響度與節奏感。","hot":true},{"text":"用 `MusicUnderstandingSession` 載入 `AVURLAsset` 後呼叫 `analyze()`，結果集中在 `SessionResult`，並以 `TimedValue` 與 `RangedValue` 標註時間點與時間範圍。","hot":false},{"text":"調性分析提供 `KeySignature`（`Tonic`、`Mode`），節奏分析提供 beats、bars 與 `beatsPerMinute`。","hot":false},{"text":"提供 **串流 API**（如 `loudnessResults`）與自訂 `AudioProvider`，可即時逐段取得分析結果並更新 UI。","hot":false}],"apis":["MusicUnderstanding","MusicUnderstandingSession","SessionResult","TimedValue","RangedValue","KeyResult","KeySignature","RhythmResult","StructureResult","InstrumentActivityResult","LoudnessResult","PaceResult","AVURLAsset"],"audience":"**開發音樂、健身、影音剪輯或任何需要分析音訊內容 App 的開發者**。","gloss_en":"Meet the Music Understanding framework","takeaway_en":"Use the new Music Understanding framework to analyze audio on device across six dimensions (key, rhythm, structure, instrumentation, loudness, and groove) to build smart music features.","points_en":[{"text":"The new **Music Understanding** framework analyzes audio **on device** across six dimensions: key, rhythm, structure, instrument activity, loudness, and groove.","hot":true},{"text":"Load an `AVURLAsset` with `MusicUnderstandingSession` and call `analyze()`; results are gathered in `SessionResult`, with `TimedValue` and `RangedValue` annotating points and ranges in time.","hot":false},{"text":"Key analysis provides `KeySignature` (`Tonic`, `Mode`), and rhythm analysis provides beats, bars, and `beatsPerMinute`.","hot":false},{"text":"Offers a **streaming API** (such as `loudnessResults`) and a custom `AudioProvider`, letting you obtain analysis results segment by segment in real time and update the UI.","hot":false}],"audience_en":"**Developers building music, fitness, video editing, or any app that needs to analyze audio content**.","summary":["由 Computational Music 團隊的 Conner 主講，介紹全新的 **Music Understanding** 框架——一套在所有 Apple 平台上提供「裝置端音樂智慧」的能力。它替你包辦所有訊號處理與模型推論，開發者不需具備 signal processing 或 machine learning 背景即可使用；而且因為完全 **on-device** 執行，分析的音訊保有隱私、可離線運作。Apple 內部的 Final Cut Pro 團隊已用它打造節拍偵測（beat detection）與 iPad 版的 montage 自動剪輯功能。","框架可從六大面向分析音樂：**key**（調性）、**rhythm**（節奏）、**structure**（結構）、**pace**（律動感）、**instrument activity**（樂器活動）與 **loudness**（響度）。使用上，app 透過 **MusicUnderstandingSession** 與框架互動，以 `AVAsset` 或自訂的 audio provider 初始化，呼叫 `analyze()` 並 await 結果。預設會分析全部類型；若只需特定面向，可改用 `analyze(for:)` 以避免不必要的運算、換取最佳效能。結果集中在 **SessionResult** 結構中，每個面向都是 optional 欄位。","API 大量使用兩種帶時間的泛型型別：**TimedValue**（值對應一個 `CMTime`）與 **RangedValue**（值對應一個 `CMTimeRange`）。各面向各自回傳專屬結果：KeyResult 以 RangedValue 將 **KeySignature**（tonic + mode）對應到時間區段；RhythmResult 給出每個 beat、bar 的 `CMTime` 陣列與全曲 `beatsPerMinute`；StructureResult 拆成 sections／segments／phrases 三層；PaceResult 給能量律動；InstrumentActivityResult 同時提供「樂器是否出現」的 ranges 與「強度隨時間變化」的 activity；LoudnessResult 則用業界標準 **LUFS** 提供 integrated／momentary／shortTerm 與 peak。","進階用法上，框架另提供 **loudness 的 streaming API**，以 `AsyncSequence` 每 100ms 推送一次結果，搭配符合 `AsyncSequence` 的自訂 **AudioProvider**（產出 `AVReadOnlyAudioPCMBuffer`、以 nil 收尾）即可邊讀邊算。所有結果皆 `Codable`，用 `JSONEncoder` 即可匯出 JSON。實務應用很廣：把畫面同步到 beat／loudness／pace 做影片剪輯、依 tempo 或 key 整理音樂庫驅動 DJ app、或預先計算分析資料讓遊戲隨音樂律動。建議下載官方範例 app 「Music Understanding Lab」做為起點。"],"deepdive":[{"t":0,"title":"Introduction","body":"Conner 開場介紹 **Music Understanding** 是一套跨 Apple 平台、完全 on-device 的音樂分析框架，替開發者包辦所有 signal processing 與 model inference。強調分析音訊保有隱私且可離線；並以 Apple 自家 **Final Cut Pro** 的 beat detection 與 iPad montage 自動剪輯為實際採用案例。"},{"t":99,"title":"Musical features","body":"說明框架分析的六大面向：key、rhythm、structure、pace、instrument activity、loudness。並建立樂理層級觀念：beats 組成 bars、bars 組成 phrases、phrases 組成 segments、segments 組成 sections（如 chorus、verse、intro、bridge）；同時區分全曲 **bpm**（脈動）與聽感上的快慢 **pace**。"},{"t":199,"title":"Framework integration","body":"介紹高階整合方式：app 透過 **MusicUnderstandingSession** 互動，以 `AVAsset` 或自訂 audio provider 初始化，呼叫 `analyze` 並 await 結果。預設分析所有類型；為求最高效能可指定只分析感興趣的類型，避免不必要的運算。"},{"t":235,"title":"Music Understanding Lab","body":"示範官方範例 app **Music Understanding Lab**（可於 developer.apple.com 取得）。選一首歌後，app 將分析結果轉成視覺體驗，每個面向都有獨立 tile；播放時 Rhythm 與 Structure tile 會隨歌曲更新，playhead 讓使用者跟著音樂走。"},{"t":287,"title":"Initialize the session","body":"解說 Select Song 按鈕的實作：用 SwiftUI `fileImporter` 取得檔案 URL，建立 `AVURLAsset` 時務必把 **AVURLAssetPreferPreciseDurationAndTimingKey** 設為 true 以取得最準確的結果。接著用 asset 建立 session，呼叫 `analyze()` 並 await 回傳。"},{"t":324,"title":"Inside SessionResult","body":"說明 **SessionResult** 結構：每個分析面向都有專屬欄位且皆為 optional。使用一般 `analyze()` 時全部結果都會有值；若用 `analyze(for:)` 鎖定特定面向，未要求的欄位會是 nil。"},{"t":353,"title":"TimedValue","body":"介紹 **TimedValue**：將一個值與一個 `CMTime` 關聯起來，是框架中表達「某時間點的值」的標準泛型型別。"},{"t":358,"title":"RangedValue","body":"介紹 **RangedValue**：與 TimedValue 類似，但是把值關聯到一段 `CMTimeRange`，用來表達「某時間區段內的值」。"},{"t":387,"title":"Key analysis","body":"示範 Key tile（範例曲為 D flat major）。Key 分析回傳 **KeyResult**，內含一組 ranges，以 RangedValue 將 **KeySignature** 對應到特定時間區段。"},{"t":403,"title":"KeySignature","body":"說明 **KeySignature** 由 **tonic** 與 **mode** 兩部分組成，共同描述歌曲所環繞的調性。"},{"t":408,"title":"Using tonic","body":"解釋 **tonic** 可以是任一標準半音音高（如 C、G），代表歌曲建構所環繞的根音（root note）。"},{"t":419,"title":"Using mode","body":"解釋 **mode** 只有 major 或 minor 兩種，標示調性的大小調屬性。"},{"t":436,"title":"Rhythm analysis","body":"示範 Rhythm tile：左側顯示 bpm、右側指示燈隨每個 beat 亮起。**RhythmResult** 提供每個 beat 與 bar 的 `CMTime` 陣列，以及全曲 `beatsPerMinute`；bpm 為 optional，因為若處理的音訊不足以找到至少兩個 beat，bpm 會是 nil。"},{"t":522,"title":"StructureResult","body":"說明 Structure tile 以三列矩形呈現歌曲結構階層。**StructureResult** 含 sections、segments、phrases 三個屬性，各為 `CMTimeRange` 陣列；播放時當前的 section／segment／phrase 會高亮顯示。"},{"t":566,"title":"Analyzing pace","body":"示範 Pace tile，描述音樂帶給聽者的快慢感：較有能量的段落值較高、UI 上以較高的長條呈現。**PaceResult** 僅有一個屬性，內含一組 ranged values。"},{"t":613,"title":"InstrumentActivityResult","body":"示範 instrument activity tile，可用色塊時間區段或詳細活動曲線（0 到 1）呈現。**InstrumentActivityResult** 有 ranges（每個 Instrument 對應 `CMTimeRange` 陣列，判斷是否出現）與 activity（對應 `TimedValue\u003cFloat>`，表達隨時間的演奏強度，適合驅動音訊反應式動畫）。"},{"t":705,"title":"LoudnessResult","body":"說明 Loudness tile 以業界標準 **LUFS** 衡量人耳感知音量。**LoudnessResult** 支援 integrated（全曲平均單一值）、momentary（400ms 視窗、偵測突發尖峰）與 shortTerm（3 秒視窗、較平滑的趨勢），每 100ms 一筆；另有以分貝表示的 peak 最高音量。"},{"t":768,"title":"Streaming API for loudness","body":"介紹 loudness 的 streaming API：透過 `AsyncSequence` 在每 100ms 分析後即時送出結果，適合即時顯示而非等整曲分析完。"},{"t":775,"title":"Streaming API for loudness","body":"示範用法：照常初始化 session，但開兩個 task——一個消費即時送來的 loudness 結果並更新音量、另一個呼叫 `analyze(for: [.loudness])` 開始分析，兩者並行。"},{"t":799,"title":"Audio Provider","body":"說明 **AudioProvider** 需符合 `AsyncSequence`，產出 `AVReadOnlyAudioPCMBuffer` 物件；送完所有音訊緩衝後，必須再送一個 nil 以標示完成。"},{"t":835,"title":"Encode to JSON","body":"說明所有 Music Understanding 結果皆 `Codable`。要匯出 JSON 只需建立 `JSONEncoder` 並 encode session 結果，對應 Lab 右上角的 Share 按鈕匯出完整分析資料。"},{"t":887,"title":"Suggestion for using pace","body":"示範 Video tile 如何結合 **structure** 與 **pace** 製作隨音樂同步的影片：先依 section 時間區段切分，再用各段 pace（每分鐘事件率，除以 60 得每個 clip 時長）決定 clip 數量；高能量段用較短較快的 clip、低能量段用較長較慢的 clip，使畫面切換貼合歌曲能量。"}],"summary_en":["Presented by Conner from the Computational Music team, this session introduces **Music Understanding**, a new framework that brings on-device musical intelligence to every Apple platform. It handles all the signal processing and model inference for you, so no machine-learning or DSP expertise is required, and because everything runs **on-device** the audio you analyze stays private and works offline. Apple's own Final Cut Pro team already uses it to power beat detection and the iPad montage auto-edit feature.","The framework analyzes music across six dimensions: **key**, **rhythm**, **structure**, **pace**, **instrument activity**, and **loudness**. Apps interact through a **MusicUnderstandingSession**, initialized with an `AVAsset` or a custom audio provider, then call `analyze()` and await the results. By default all types are analyzed; for best performance you can use `analyze(for:)` to request only the dimensions you need. Everything comes back in a single **SessionResult** struct where each dimension is an optional field.","Two time-aware generic types recur throughout the API: **TimedValue** (a value at a `CMTime`) and **RangedValue** (a value over a `CMTimeRange`). Each dimension has its own result: KeyResult maps a **KeySignature** (tonic + mode) to time ranges; RhythmResult gives `CMTime` arrays for beats and bars plus a global `beatsPerMinute`; StructureResult breaks the song into sections/segments/phrases; PaceResult expresses energy; InstrumentActivityResult provides both presence ranges and per-instrument intensity activity; and LoudnessResult reports integrated/momentary/shortTerm and peak values in the industry-standard **LUFS** scale.","For advanced use, the framework offers a **streaming loudness API** that delivers results via an `AsyncSequence` every 100ms, paired with a custom **AudioProvider** that conforms to `AsyncSequence`, yields `AVReadOnlyAudioPCMBuffer` objects, and sends a final nil to signal completion. All results are `Codable`, so a `JSONEncoder` exports them to JSON in a couple of lines. The practical possibilities are broad: sync visuals to beat, loudness, or pace for video editing; organize music libraries by tempo or key for a DJ app; or precompute analysis to animate a game to music. Download the sample app \"Music Understanding Lab\" to kickstart your own work."],"deepdive_en":[{"t":0,"title":"Introduction","body":"Conner introduces **Music Understanding** as a cross-platform, fully on-device music analysis framework that handles all signal processing and model inference for you. He stresses that analyzed audio stays private and works offline, and cites Apple's own **Final Cut Pro** beat detection and iPad montage auto-edit as real adopters."},{"t":99,"title":"Musical features","body":"Covers the six analysis dimensions: key, rhythm, structure, pace, instrument activity, and loudness. He builds up the musical hierarchy: beats form bars, bars form phrases, phrases form segments, and segments form sections (chorus, verse, intro, bridge), while distinguishing a song's steady **bpm** from its perceived **pace**."},{"t":199,"title":"Framework integration","body":"Explains the high-level model: apps interact via a **MusicUnderstandingSession**, initialized with an `AVAsset` or a custom audio provider, then call `analyze` and await results. All types are analyzed by default; for top performance you can specify only the types you care about to avoid unnecessary computation."},{"t":235,"title":"Music Understanding Lab","body":"Demos the official sample app **Music Understanding Lab** (available on developer.apple.com). After picking a song, the app turns analysis into a visual experience with a dedicated tile per dimension; during playback the Rhythm and Structure tiles update and a playhead ties it to the music."},{"t":287,"title":"Initialize the session","body":"Walks through the Select Song button: use the SwiftUI `fileImporter` to get a URL, build an `AVURLAsset` and be sure to set **AVURLAssetPreferPreciseDurationAndTimingKey** to true for the most accurate results, then create the session and call `analyze()`, awaiting the return."},{"t":324,"title":"Inside SessionResult","body":"Describes the **SessionResult** struct: every analyzed feature has its own optional field. The general `analyze()` populates all results, while the targeted `analyze(for:)` returns only what you asked for and leaves the rest nil."},{"t":353,"title":"TimedValue","body":"Introduces **TimedValue**, which associates a value with a single `CMTime`, the standard generic type for expressing a value at a point in time."},{"t":358,"title":"RangedValue","body":"Introduces **RangedValue**, similar to TimedValue but associating a value with a `CMTimeRange` to express a value over a span of time."},{"t":387,"title":"Key analysis","body":"Demos the Key tile (the sample song is D flat major). Key analysis returns a **KeyResult** containing an array of ranges that map a **KeySignature** to a specific time range via RangedValue."},{"t":403,"title":"KeySignature","body":"Explains that a **KeySignature** is made of a **tonic** and a **mode**, which together describe the key the song is built around."},{"t":408,"title":"Using tonic","body":"The **tonic** can be any standard chromatic pitch (like C or G) and represents the root note around which the song is built."},{"t":419,"title":"Using mode","body":"The **mode** is either major or minor, indicating the tonal quality of the key."},{"t":436,"title":"Rhythm analysis","body":"Demos the Rhythm tile: bpm on the left, beat indicators that light up on the right. **RhythmResult** provides `CMTime` arrays for every beat and bar plus a global `beatsPerMinute`; bpm is optional because if not enough audio has been processed to find at least two beats, it will be nil."},{"t":522,"title":"StructureResult","body":"Explains the Structure tile's three rows of rectangles for the structural hierarchy. **StructureResult** has sections, segments, and phrases properties, each an array of `CMTimeRange`; during playback the current section, segment, and phrase are highlighted."},{"t":566,"title":"Analyzing pace","body":"Demos the Pace tile, which conveys how fast the music feels: more energetic parts get higher values shown as taller bars. **PaceResult** has a single property holding an array of ranged values."},{"t":613,"title":"InstrumentActivityResult","body":"Demos instrument activity tiles, shown as color-coded time ranges or as a detailed activity graph (values 0 to 1). **InstrumentActivityResult** has ranges (each Instrument to an array of `CMTimeRange`, for simple presence) and activity (each Instrument to `TimedValue\u003cFloat>`, expressing intensity over time and great for audio-reactive animation)."},{"t":705,"title":"LoudnessResult","body":"Explains the Loudness tile measured in the industry-standard **LUFS**. **LoudnessResult** supports integrated (a single whole-song average), momentary (400ms window, for short spikes), and shortTerm (3-second window, smoother trend), sampled every 100ms, plus a peak maximum level in decibels."},{"t":768,"title":"Streaming API for loudness","body":"Introduces the streaming loudness API, which delivers results via an `AsyncSequence` for every 100ms of audio analyzed, suitable for live display rather than waiting for the full track."},{"t":775,"title":"Streaming API for loudness","body":"Shows the usage: initialize the session as before, then set up two tasks in parallel, one consuming streamed loudness results to update an audio level, the other calling `analyze(for: [.loudness])` to begin analysis."},{"t":799,"title":"Audio Provider","body":"Explains that an **AudioProvider** conforms to `AsyncSequence` and yields `AVReadOnlyAudioPCMBuffer` objects; once all buffers are sent it must send a final nil to signal completion."},{"t":835,"title":"Encode to JSON","body":"Notes that all Music Understanding results are `Codable`. Exporting to JSON just means creating a `JSONEncoder` and encoding the session results, which backs the Lab's Share button that exports all analysis data."},{"t":887,"title":"Suggestion for using pace","body":"Demos how the Video tile combines **structure** and **pace** to build a music-synced video: it identifies section time ranges, then uses each section's pace (an events-per-minute rate, divided by 60 to get time per clip) to decide how many clips to show, retiming longer/slower clips for low-energy parts and shorter/faster clips for high-energy parts."}],"code":[]},"related":[{"id":"121","title":"Announcing Apple’s next big step for Siri and iPhone","gloss":"宣布 Apple 為 Siri 與 iPhone 邁出的下一大步","gloss_en":"Announcing Apple's next big step for Siri and iPhone","category":"ai","categoryLabel":"AI 與機器學習"},{"id":"227","title":"Create UI prototypes using agents in Xcode","gloss":"在 Xcode 用代理人打造 UI 原型","gloss_en":"Prototype UI with agents in Xcode","category":"ai","categoryLabel":"AI 與機器學習"},{"id":"232","title":"Run local agentic AI on the Mac using MLX","gloss":"用 MLX 在 Mac 上執行本機 agentic AI","gloss_en":"Run local agentic AI on the Mac using MLX","category":"ai","categoryLabel":"AI 與機器學習"},{"id":"233","title":"Explore distributed inference and training with MLX","gloss":"用 MLX 探索分散式推論與訓練","gloss_en":"Explore distributed inference and training with MLX","category":"ai","categoryLabel":"AI 與機器學習"},{"id":"237","title":"What’s new in image understanding","gloss":"影像理解的新功能","gloss_en":"What's new in image understanding","category":"ai","categoryLabel":"AI 與機器學習"}]}</script>
