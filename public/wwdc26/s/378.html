<script id="d" type="application/json">{"s":{"id":"378","title":"Unlock in-game content with StoreKit and Background Assets","gloss":"用 StoreKit 與 Background Assets 解鎖遊戲內容","category":"appstore","categoryLabel":"App Store","duration":599,"url":"https://developer.apple.com/videos/play/wwdc2026/378/","takeaway":"透過新的 Unity StoreKit 與 Background Assets 外掛，在遊戲中接上原生 IAP 並以隨選資產包縮減下載量。","chapters":[[1,"Introduction"],[33,"Background Assets"],[95,"Localized asset packs"],[186,"Asset pack manifest for a localized asset pack"],[194,"Convert Steam depots to asset packs"],[207,"Convert a Steam depot to an asset pack manifest"],[208,"Convert an asset pack manifest to an asset pack archive"],[255,"Unity plug-ins"],[352,"StoreKit and Background Assets sample code"],[361,"Fetch and purchase products with the StoreKit plug-in"],[383,"Listen for Transaction updates with the StoreKit plug-in"],[433,"Download asset packs with the Background Assets plug-in"],[505,"Game presence"],[550,"Next steps"]],"points":[{"text":"新的 **Unity StoreKit 外掛** 讓 Unity 遊戲直接使用原生 Apple 內購（IAP）。","hot":true},{"text":"用 **Background Assets** 與本地化資產包縮減初始下載量，依語言隨選下載內容。","hot":false},{"text":"透過 **xcrun ba-package** 把 Steam depot 轉成 asset pack manifest 與封存檔。","hot":false},{"text":"以 **Product.FetchProducts／Purchase** 取得並購買商品，並驗證交易後解鎖內容。","hot":false},{"text":"監聽 **Transaction.Updates** 處理消耗型與非消耗型商品，並以 CurrentEntitlements 為權益來源。","hot":false}],"apis":["StoreKit","BackgroundAssets","Product","Transaction","AssetPackManager","ba-package"],"audience":"用 **Unity 開發遊戲** 並想整合 Apple 原生 IAP 與資產隨選下載的開發者。","gloss_en":"Unlock in-game content with StoreKit and Background Assets","takeaway_en":"Use the new Unity StoreKit and Background Assets plug-ins to wire up native IAP in your game and reduce download size with on-demand asset packs.","points_en":[{"text":"The new **Unity StoreKit plug-in** lets Unity games use native Apple In-App Purchases (IAP) directly.","hot":true},{"text":"Use **Background Assets** and localized asset packs to reduce the initial download size, downloading content on demand by language.","hot":false},{"text":"Use **xcrun ba-package** to turn a Steam depot into an asset pack manifest and archive.","hot":false},{"text":"Use **Product.FetchProducts / Purchase** to fetch and buy products, and unlock content after verifying the transaction.","hot":false},{"text":"Listen to **Transaction.Updates** to handle consumable and non-consumable products, using CurrentEntitlements as the source of truth for entitlements.","hot":false}],"audience_en":"Developers **building games with Unity** who want to integrate native Apple IAP and on-demand asset downloads.","summary":["由 StoreKit 團隊的 Sam 主講，這場介紹在 Apple 平台打造遊戲的三組新工具：**Background Assets** 的更新、全新的 **Unity 外掛**（StoreKit 與 Background Assets），以及在 App Store 與 Apple Games app 上強化遊戲曝光。以一款內容豐富的遊戲 The Coast 為例：與其一次下載所有音訊、影片、貼圖與 ML 模型佔用儲存空間，**Managed Background Assets** 會在需要時自動下載 asset pack，省下玩家的時間與空間；App Store 上的 app 更可享每 app 最高 **200 GB** 的 Apple 託管資產（含在開發者計畫會員資格內）。","iOS 27 的重點是 **localized asset packs**：系統會依玩家在「設定」選的偏好語言，只下載該語言的資產，大幅縮減下載量；若無對應語言則自動 fallback 到最接近的語言（如 English-UK 缺則用 English-US，Spanish 缺且無區域變體則退回主要語言 English）。作法是在 asset pack manifest JSON 加上 **`language`** 標籤。若你在 Steam 上以 depots 管理資產，可用 **`xcrun ba-package convert`**（傳入 asset pack ID、語言 ID、download policy 與 Steam manifest）把 depot 轉成 asset pack manifest，再用 `ba-package` 把 manifest 產生為 **`.aar`** asset pack archive；該工具即將支援 Linux 與 Windows。","Unity 開發者現可用兩個新加入 Apple 外掛家族的外掛——**StoreKit** 與 **Background Assets**（已於 GitHub 提供，用既有 Python 腳本建置，需 Xcode 27、Python 3、Unity 2022 LTS 以上）。它們以 C# API 橋接底層原生框架：StoreKit 提供 `Product.FetchProducts` 取得商品、`Purchase()` 顯示系統付款表單，購買後檢查 `IsVerified` 並 `Finish()`，並用 **`Transaction.Updates`** 序列監聽交易（consumable 內聯處理，non-consumable 與訂閱以 **`CurrentEntitlements`** 為真實來源）；Background Assets 外掛則用 `AssetPackManager` 取得 manifest、以 `DownloadStatusUpdatesAsync` 回報進度、用 `EnsureLocalAvailabilityOfAssetPackAsync` 確保本地可用。測試可用 Xcode 的 StoreKit Testing 與 **Background Assets mock server**（執行時自動啟動），以及 sandbox testing。最後，提交時可為產品頁 header 與搜尋結果加入新視覺素材（也會出現在 Apple Games app），iOS 27 重新設計的付款表單在橫向也運作良好。"],"deepdive":[{"t":1,"title":"Introduction","body":"StoreKit 團隊的 Sam 開場，預告三大主題：**Background Assets** 更新、新的 **Unity 外掛**，以及在 App Store 與 Apple Games app 強化曝光，目標是協助打造 Apple 平台上最棒的遊戲。"},{"t":33,"title":"Background Assets","body":"以遊戲 The Coast 為例：與其一次下載所有音訊、影片、紋理與 ML 模型，**Managed Background Assets** 在需要時自動下載 asset pack，省下玩家時間與儲存空間。App Store 上的 app 可享每 app 最高 **200 GB** Apple 託管資產，含在開發者計畫會員內，自 iOS/iPadOS/macOS/tvOS/visionOS 26 起提供。"},{"t":95,"title":"Localized asset packs","body":"iOS 27 的 **localized asset packs** 依玩家在設定選的偏好語言只下載該語言資產，大幅縮減下載量。若未提供對應語言則 **fallback** 到最接近者（English-UK→English-US；Spanish 無變體則退回主要語言 English）。"},{"t":186,"title":"Asset pack manifest for a localized asset pack","body":"支援 localized asset packs 的作法是在 asset pack manifest JSON 加上 **`language`** 標籤（如 \"en-US\"），其餘欄位含 assetPackID、downloadPolicy、fileSelectors、platforms 等。"},{"t":194,"title":"Convert Steam depots to asset packs","body":"若在 Steam 以 **depots** 管理資產，現可更容易把 Steam depots 轉成 asset packs 在 Apple 平台發行。"},{"t":207,"title":"Convert a Steam depot to an asset pack manifest","body":"在 macOS 裝 Xcode 27 後執行 **`xcrun ba-package convert`**，傳入 asset pack ID、語言 ID、download policy 與 Steam manifest 建置腳本，輸出 asset pack manifest。該工具即將支援 Linux 與 Windows。"},{"t":208,"title":"Convert an asset pack manifest to an asset pack archive","body":"有了 manifest 後，再次以 **`ba-package`** 用該 manifest 作輸入，產生 **`.aar`** asset pack archive，即可在遊戲中使用。"},{"t":255,"title":"Unity plug-ins","body":"宣布兩個加入 Apple Unity 外掛家族的新外掛：**Background Assets** 與 **StoreKit**（已在 GitHub 提供）。用與其他 Apple Unity 外掛相同的 Python 腳本建置；兩者皆以 **C# API** 橋接底層原生框架，需 Xcode 27、Python 3、Unity 2022 LTS 以上。"},{"t":352,"title":"StoreKit and Background Assets sample code","body":"外掛裝好後在 Unity editor 開啟遊戲；採用 **StoreKit** 即可透過 App Store 安全的商務平台向全球玩家提供 In-App Purchases。"},{"t":361,"title":"Fetch and purchase products with the StoreKit plug-in","body":"C# 版 StoreKit 用 **`Product.FetchProducts`** 取得並陳列商品，用 **`Purchase()`** 顯示系統付款表單；購買後檢查 `PurchaseResult` 成功且 `IsVerified`，交付內容後呼叫 **`Finish()`** 完成交易。"},{"t":383,"title":"Listen for Transaction updates with the StoreKit plug-in","body":"用 **`Transaction.Updates`** 序列在整個生命週期監聽交易（任何在 app 外或其他裝置建立／更新的交易都會發出）。**consumable** 檢查是否被撤銷後內聯授權；**non-consumable 與訂閱** 則以 **`CurrentEntitlements`** 為真實來源（已過濾退款／撤銷／過期），確認 verified 後授權，最後 `Finish()`。"},{"t":433,"title":"Download asset packs with the Background Assets plug-in","body":"玩家購買內容後，用 Background Assets 外掛確保 asset pack 本地可用再供應內容：用 **`AssetPackManager.GetManifestAsync`** 取 manifest 與 asset pack，用 **`DownloadStatusUpdatesAsync`** 迭代回報下載進度更新 UI，再用 **`EnsureLocalAvailabilityOfAssetPackAsync`** 確保本地可用。匯出到 Xcode 後可用 Xcode 的 StoreKit Testing 與 **Background Assets mock server**（執行時自動啟動）及 sandbox testing 進行測試。"},{"t":505,"title":"Game presence","body":"提交遊戲時可為產品頁 header 與搜尋結果加入新的圖像與影片素材，讓遊戲更突出；這些素材也會出現在 **Apple Games app**。詳見「Enhance your presence on the App Store」（WWDC26）。iOS 27 重新設計的系統付款表單在橫向模式也運作良好，玩家可邊解鎖內容邊繼續遊戲。"},{"t":550,"title":"Next steps","body":"總結後續步驟：在 App Store Connect 上傳 localized 版本的 asset packs 進一步縮減 app 大小、安裝新的 Apple Unity 外掛把原生 Managed Background Assets 與 StoreKit 帶入 Unity 遊戲，並規劃用新的圖像／影片素材在 App Store 與 Apple Games app 突顯遊戲特色。"}],"summary_en":["Presented by Sam from the StoreKit team, this session covers three new tools for building games on Apple platforms: updates to **Background Assets**, new **Unity plug-ins** (StoreKit and Background Assets), and enhancing your game's presence on the App Store and Apple Games app. Using a content-packed game called The Coast: rather than downloading all audio, video, textures, and ML models upfront and taking up storage, **Managed Background Assets** automatically downloads asset packs when needed, saving players time and space; apps on the App Store can also use up to **200 GB** of Apple-hosted assets per app, included in the Developer Program membership.","The iOS 27 highlight is **localized asset packs**: the system delivers only the assets for the player's preferred language selected in Settings, greatly reducing download size, and automatically falls back to the closest language match if none is provided (English-UK falls back to English-US; Spanish with no regional variant falls back to the primary language English). You enable this by adding a **`language`** tag to the asset pack manifest JSON. If you manage assets as Steam depots, use **`xcrun ba-package convert`** (passing the asset pack ID, language ID, download policy, and Steam manifest) to convert a depot to an asset pack manifest, then run `ba-package` to produce an **`.aar`** asset pack archive; the tool is coming soon to Linux and Windows.","Unity developers can now use two plug-ins newly joining Apple's plug-in portfolio—**StoreKit** and **Background Assets** (available on GitHub, built with the existing Python script, requiring Xcode 27, Python 3, Unity 2022 LTS or later). They expose C# APIs bridging the underlying native frameworks: StoreKit provides `Product.FetchProducts` to fetch products, `Purchase()` to show the system payment sheet, checking `IsVerified` and calling `Finish()` after purchase, and listening to transactions via the **`Transaction.Updates`** sequence (handle consumables inline, with **`CurrentEntitlements`** as the source of truth for non-consumables and subscriptions); the Background Assets plug-in uses `AssetPackManager` to get the manifest, `DownloadStatusUpdatesAsync` to report progress, and `EnsureLocalAvailabilityOfAssetPackAsync` to ensure local availability. Test with Xcode's StoreKit Testing and the **Background Assets mock server** (auto-starting at run time), plus sandbox testing. Finally, on submission you can add new visuals to your product page header and search results (which also appear in the Apple Games app), and iOS 27's redesigned payment sheet works great in landscape."],"deepdive_en":[{"t":1,"title":"Introduction","body":"Sam from the StoreKit team opens by previewing three topics: **Background Assets** updates, new **Unity plug-ins**, and enhancing presence on the App Store and Apple Games app, all aimed at helping create the best games on Apple platforms."},{"t":33,"title":"Background Assets","body":"Using the game The Coast: rather than downloading all audio, video, textures, and ML models upfront, **Managed Background Assets** downloads asset packs automatically when needed, saving players time and storage. App Store apps can use up to **200 GB** of Apple-hosted assets per app, included in the Developer Program, available since iOS/iPadOS/macOS/tvOS/visionOS 26."},{"t":95,"title":"Localized asset packs","body":"iOS 27's **localized asset packs** deliver only the player's preferred-language assets selected in Settings, greatly reducing download size. If a language isn't provided, the system **falls back** to the closest match (English-UK → English-US; Spanish with no variant falls back to the primary language English)."},{"t":186,"title":"Asset pack manifest for a localized asset pack","body":"To support localized asset packs, add a **`language`** tag (e.g. \"en-US\") to the asset pack manifest JSON, alongside fields like assetPackID, downloadPolicy, fileSelectors, and platforms."},{"t":194,"title":"Convert Steam depots to asset packs","body":"If you manage assets with **depots** on Steam, you can now more easily convert Steam depots to asset packs to distribute on Apple platforms."},{"t":207,"title":"Convert a Steam depot to an asset pack manifest","body":"On macOS with Xcode 27 installed, run **`xcrun ba-package convert`**, passing the asset pack ID, language ID, download policy, and the Steam manifest build script, to output an asset pack manifest. The tool is coming soon to Linux and Windows."},{"t":208,"title":"Convert an asset pack manifest to an asset pack archive","body":"With the manifest created, run **`ba-package`** again using that manifest as input to produce an **`.aar`** asset pack archive, ready to use in your game."},{"t":255,"title":"Unity plug-ins","body":"Announces two new plug-ins joining the Apple Unity portfolio: **Background Assets** and **StoreKit** (available on GitHub). Build them with the same Python script as other Apple Unity plug-ins; both expose a **C# API** bridging the native framework, requiring Xcode 27, Python 3, and Unity 2022 LTS or later."},{"t":352,"title":"StoreKit and Background Assets sample code","body":"Once installed, open the game in the Unity editor; adopting **StoreKit** lets you offer In-App Purchases to players worldwide through the App Store's safe, trusted commerce platform."},{"t":361,"title":"Fetch and purchase products with the StoreKit plug-in","body":"The C# StoreKit uses **`Product.FetchProducts`** to fetch and merchandise products and **`Purchase()`** to show the system payment sheet; after purchase, check that `PurchaseResult` succeeded and `IsVerified`, deliver the content, then call **`Finish()`** to complete the transaction."},{"t":383,"title":"Listen for Transaction updates with the StoreKit plug-in","body":"Use the **`Transaction.Updates`** sequence to listen for transactions throughout the lifecycle (any created/updated outside the app or on other devices). For **consumables**, check for revocation then grant access inline; for **non-consumables and subscriptions**, **`CurrentEntitlements`** is the source of truth (already filtering refunded/revoked/expired), grant access once verified, then `Finish()`."},{"t":433,"title":"Download asset packs with the Background Assets plug-in","body":"After a player buys content, use the Background Assets plug-in to ensure the asset pack is locally available before serving content: use **`AssetPackManager.GetManifestAsync`** to get the manifest and asset pack, iterate **`DownloadStatusUpdatesAsync`** to report progress in the UI, then **`EnsureLocalAvailabilityOfAssetPackAsync`**. After exporting to Xcode, test with Xcode's StoreKit Testing and the **Background Assets mock server** (auto-starting at run time) plus sandbox testing."},{"t":505,"title":"Game presence","body":"When submitting, add new image and video assets to your product page header and search results to stand out; these also appear in the **Apple Games app**. See 'Enhance your presence on the App Store' (WWDC26). iOS 27's redesigned system payment sheet works great in landscape, so players can unlock content and keep gaming."},{"t":550,"title":"Next steps","body":"Summarizes next steps: upload localized versions of asset packs in App Store Connect to further reduce app size, install the new Apple Unity plug-ins to bring native Managed Background Assets and StoreKit to your Unity game, and plan to highlight features with new image/video assets on the App Store and Apple Games app."}],"code":["// Asset pack manifest\n\n{\n   \"assetPackID\": \"voice-english\",\n   \"downloadPolicy\": { /* … */ },\n   \"language\": \"en-US\",\n   \"sourceRoot\": \".\",\n   \"fileSelectors\": [ /* … */ ],\n   \"platforms\": [ /* … */ ]\n    //… \n}","# Convert a Steam depot to an asset pack manifest\nxcrun ba-package convert --asset-pack-id voice-english -l en-US --on-demand voice-english.vdf -o voice-english.json","# Convert an asset pack manifest to an asset pack archive\nxcrun ba-package voice-english.json -o voice-english.aar","// Fetch and purchase products with the StoreKit plug-in\n\nusing UnityEngine;\nusing Apple.StoreKit;\n\nasync void Start() {\n    var products = await Product.FetchProducts(new[] {\n            \"com.thecoast.capecod\"\n    });\n}","// Fetch and purchase products with the StoreKit plug-in\n\nusing UnityEngine;\nusing Apple.StoreKit;\n\nasync void Purchase(Product product) {\n    var result = await product.Purchase();\n    if (result.Result == PurchaseResult.ResultEnum.Success\n        && result.TransactionVerification.IsVerified)\n    {\n        // Unlock access to purchased content\n\n        result.TransactionVerification.SafePayload.Finish();\n    }\n}","// Listen for Transaction updates with the StoreKit plug-in\n\nusing UnityEngine;\nusing Apple.StoreKit;\n\npublic static class TransactionListener {\n    public static void Initialize() => Transaction.Updates += OnUpdate;\n\n\n    async void OnUpdate(VerificationResult\u003cTransaction> result) {\n        if (!result.IsVerified) return;\n        var verifiedTransaction = result.SafePayload;\n\n        // Consumables are not in CurrentEntitlements, so handle them inline\n        if (verifiedTransaction.ProductType == ProductType.ProductTypeEnum.Consumable) {\n            if (verifiedTransaction.RevocationDate != null) {\n                // Revoke the consumable identified by verifiedTransaction.ProductId\n            } else {\n                // Grant access to the consumable\n            }\n        }else {\n            // Non-consumables and subscriptions: re-read CurrentEntitlements as source of truth\n            await foreach (var verificationResult in Transaction.GetCurrentEntitlements()) {\n                if (!verificationResult.IsVerified) continue;\n                // Grant access to the product\n            }\n        }\n        verifiedTransaction.Finish();\n    }\n}","// Download asset packs with the Background Assets plug-in\n\nusing Apple.BackgroundAssets;\nusing UnityEngine;\n\nasync void LoadTutorial(string language) {\n    try {\n        string assetPackId = $\"tutorial-{language}\";\n        AssetPackManifest manifest = await AssetPackManager.GetManifestAsync();\n        AssetPack assetPack = manifest.GetAssetPack(assetPackId);\n        CancellationTokenSource tokenSource = new CancellationTokenSource();\n        _ = Task.Run(async () => {\n            await foreach (AssetPackManager.DownloadStatusUpdate statusUpdate in AssetPackManager.DownloadStatusUpdatesAsync(assetPackId)) { \n            \t\t// Update download progress in UI\n            }\n        }, tokenSource.Token);\n        await AssetPackManager.EnsureLocalAvailabilityOfAssetPackAsync(assetPack);\n        tokenSource.Cancel();\n        // Start tutorial with the locally available assets\n    } catch (Exception exception) {\n        // Handle the exception\n    }\n}"]},"related":[{"id":"210","title":"What’s new in Apple In-App Purchase","gloss":"Apple App 內購買的新功能","gloss_en":"What's new in Apple In-App Purchase","category":"appstore","categoryLabel":"App Store"},{"id":"309","title":"Explore Retention Messaging in App Store Connect","gloss":"探索 App Store Connect 的挽留訊息","gloss_en":"Explore Retention Messaging in App Store Connect","category":"appstore","categoryLabel":"App Store"},{"id":"391","title":"Offer subscriptions to groups and organizations","gloss":"向群組與組織提供訂閱","gloss_en":"Offer subscriptions to groups and organizations","category":"appstore","categoryLabel":"App Store"},{"id":"205","title":"Enhance your presence on the App Store","gloss":"強化你在 App Store 上的呈現","gloss_en":"Enhance your presence on the App Store","category":"appstore","categoryLabel":"App Store"},{"id":"261","title":"Build, deliver, and automate with Xcode Cloud","gloss":"用 Xcode Cloud 建置、交付與自動化","gloss_en":"Build, deliver, and automate with Xcode Cloud","category":"appstore","categoryLabel":"App Store"}]}</script>
