<script id="d" type="application/json">{"s":{"id":"389","title":"Discover container machines","gloss":"認識 container machines","category":"other","categoryLabel":"其他","duration":667,"url":"https://developer.apple.com/videos/play/wwdc2026/389/","takeaway":"container machine 是 Container 新增的工具，在 Mac 上提供輕量、可持續存在的 Linux 環境，可建立、執行指令並進入互動式 shell。","chapters":[[0,"Introduction"],[79,"Containerization"],[134,"Design principles"],[216,"Container machine"],[276,"Demo"],[281,"Viewing container machine commands"],[300,"Creating a new container machine"],[339,"Echo hi"],[357,"Running uname"],[388,"Start interactive shell"],[481,"List container machines"],[502,"Start interactive shell"],[553,"Run the application"],[633,"Next steps"]],"points":[{"text":"**container machine** 是 Container 內建的新工具，在 Mac 上提供**輕量且可持續存在的 Linux 環境**。","hot":true},{"text":"說明背後的**容器化（Containerization）**機制與**設計原則**。","hot":false},{"text":"可用 `container machine create --name demo --set-default alpine` **建立新的 container machine**。","hot":false},{"text":"用 `container machine run` 執行指令（如 echo、uname），或**進入互動式 shell**。","hot":false},{"text":"以 `container machine list` 列出現有環境，並可在其中**執行應用程式**。","hot":false}],"apis":["container machine"],"audience":"**需要在 Mac 上跑 Linux 環境的開發者**，想用輕量持久容器做開發或測試的人。","gloss_en":"Discover container machines","takeaway_en":"A container machine is a new tool in Container that provides a lightweight, persistent Linux environment on Mac, where you can create it, run commands, and enter an interactive shell.","points_en":[{"text":"A **container machine** is a new built-in tool in Container that provides a **lightweight, persistent Linux environment** on Mac.","hot":true},{"text":"Explains the underlying **Containerization** mechanism and its **design principles**.","hot":false},{"text":"Use `container machine create --name demo --set-default alpine` to **create a new container machine**.","hot":false},{"text":"Use `container machine run` to run commands (such as echo, uname), or **enter an interactive shell**.","hot":false},{"text":"List existing environments with `container machine list`, and **run applications** inside them.","hot":false}],"audience_en":"**Developers who need to run a Linux environment on Mac** and want to use lightweight, persistent containers for development or testing.","summary":["Michael 介紹建立在 **Containerization**（一個聚焦安全、隱私與效能、用於在 macOS 上執行 Linux container 的 Swift 框架）之上的新功能 **Container machine**：在 Mac 上提供一個高度整合、持久的輕量 Linux 環境。它像 container 一樣快速輕量，又像 virtual machine 一樣持久，並透過 host 整合讓使用起來感覺原生於 macOS。","回顧 WWDC 25 開源的 Containerization：它提供 storage、networking、execution 與 Linux init system 的 API，為每個 container 提供 **VM 等級隔離**且具備 sub-second 啟動；隨附開源的 container 工具提供 image 建立、散布與生命週期管理的 CLI。Container machine 的設計原則是：快速輕量、易於管理、提供持久性可重複造訪，以及感覺像 macOS 的延伸。快速建立讓多個專案各有專屬環境，避免相依與 toolchain 衝突；持久環境讓你能隨開發週期逐步加入工具。","Container machine 是 container 工具的一級功能，使用與 container 相同的 **OCI image 格式**（demo 用 alpine）。每個 Container machine 在自己的輕量 VM 中執行，具狀態並能保存你在其中所做的修改，可依需要 start/stop 並從上次離開處接續。透過 **自動 user mapping、共享檔案系統，以及在任何終端機位置都能進入 Linux 環境**，它提供從 macOS 到 Linux 再返回的順暢轉換。","Demo 涵蓋：`container machine create --set-default` 建立並設為預設、`container machine run` 執行指令（`uname` 在 Mac 印 Darwin、在 Container machine 印 Linux）、自動鏡射使用者名稱與當前工作目錄、無參數 run 進入互動 shell、`container machine list` 列出名稱/IP/資源。最後以一個 **Vapor** web server 範例展示跨平台工作流：在 Mac 用 Xcode 編輯（含用 Icon Composer 改 icon），在 Container machine（已裝 Swift toolchain）編譯執行，並把 Vapor 設為監聽 Container machine 的外部 IP，再從 Mac 的 Safari 以 IP:8080 存取——檔案修改透過目錄共享即時可見，重新整理頁面即看到更新的 icon。鼓勵到 GitHub 下載最新 container 工具試用。"],"deepdive":[{"t":0,"title":"Introduction","body":"Michael 開場介紹建立在 **Containerization** 之上的新功能 **Container machine**：在 Mac 上提供一個高度整合的 Linux 環境，像 container 一樣快速輕量、像 VM 一樣持久，並透過 host 整合讓使用感覺原生於 macOS。"},{"t":79,"title":"Containerization","body":"回顧 WWDC 25 開源的 **Containerization**——用於在 macOS 上執行 Linux container 的 Swift 框架，提供 storage、networking、execution 與 Linux init system 的 API，為每個 container 提供 **VM 等級隔離**且具 sub-second 啟動；隨附的 container 工具提供 image 建立、散布與生命週期管理。詳見「Meet Containerization」。"},{"t":134,"title":"Design principles","body":"說明 Container machine 的設計原則：快速輕量以融入既有工作流、在 macOS 與 Linux 間切換要容易、能快速自訂與建立新環境（讓多專案各有專屬環境避免相依衝突）、提供持久性以隨開發週期加入工具，並感覺像既有工作流的延伸。"},{"t":216,"title":"Container machine","body":"說明 Container machine 如何改善跨平台工作流：每個都跑在自己的輕量 VM、使用與 container 相同的 image 格式、是 container 工具的一級功能且 UX 熟悉；具狀態並保存修改，並透過自動 user mapping、共享檔案系統與隨處進入 Linux 環境的能力提供順暢轉換。"},{"t":276,"title":"Demo","body":"進入 demo 段落，開始實際操作 Container machine 的各項指令與工作流。"},{"t":281,"title":"Viewing container machine commands","body":"執行 `container machine` 顯示可用動作總覽，包含 create、run、stop 等。"},{"t":300,"title":"Creating a new container machine","body":"用 `container machine create` 提供名稱並以 `--set-default` 設為預設機器（之後指令免再帶名稱）。Container machine 使用與 container 相同的 **OCI image**，demo 採用常見的 alpine。"},{"t":339,"title":"Echo hi","body":"用 `container machine run` 在 Container machine 內執行 `echo hi` 指令，驗證可在其中執行命令。"},{"t":357,"title":"Running uname","body":"執行 `uname`：在 macOS 印出 Darwin，而 `container machine run uname` 印出 Linux，反映其實際執行環境。"},{"t":388,"title":"Start interactive shell","body":"無額外參數的 `container machine run` 啟動互動 session。Container machine 自動鏡射 Mac 的使用者名稱與當前工作目錄，因此在內執行 `whoami` 與 `pwd` 回傳與 Mac 相同的結果，帶來無縫體驗。"},{"t":481,"title":"List container machines","body":"用 `container machine list` 顯示所有 Container machine 的名稱、IP 位址與資源資訊；講者複製 IP 供稍後使用。"},{"t":502,"title":"Start interactive shell","body":"以 `container machine run` 啟動互動 shell 進入已安裝 Swift toolchain 的環境，透過自動目錄共享，所有專案檔案（Package.swift、原始碼、Public 目錄）皆可用。"},{"t":553,"title":"Run the application","body":"以 **Vapor** web server 示範跨平台工作流：因 Container machine 有隔離網路，需在 Xcode 把 Vapor 設定的 hostname 設為 Container machine 的 IP；此 Mac 上的編輯透過共享立即可用。編譯執行後從 Safari 以 IP:8080 存取網站；再用 Icon Composer 改 icon 並覆寫，無需複製檔案，重新整理頁面即見更新。"},{"t":633,"title":"Next steps","body":"總結 Container machine 結合 container 的易用與速度及 VM 的持久性，無縫整合讓 Linux 環境像 Mac 的延伸，鼓勵到 GitHub 下載最新 container 工具試用並回饋。"}],"summary_en":["Michael introduces **Container machine**, a new feature built on top of **Containerization** (a Swift framework for running Linux containers on macOS focused on security, privacy, and performance): a highly integrated, persistent, lightweight Linux environment on Mac. It's fast and lightweight like a container, persistent like a virtual machine, and — thanks to host integrations — feels native to macOS.","It reviews Containerization, open-sourced at WWDC 25: it provides APIs for storage, networking, execution, and a Linux init system, giving each container **VM-based isolation** with sub-second start times, alongside the open-source container tool for image creation, distribution, and lifecycle management. Container machine's design principles are: fast and lightweight, simple to manage, persistent so you can revisit over time, and feeling like an extension of macOS. Quick creation lets each project have its own environment without dependency or toolchain conflicts, and persistence lets you add tools over the development lifecycle.","Container machine is a first-class feature of the container tool and uses the same **OCI image format** as containers (the demo uses alpine). Each one runs in its own lightweight VM, is stateful, and persists the modifications you make, so you can start/stop projects and continue where you left off. With **automatic user mapping, shared filesystem support, and the ability to enter the Linux environment from anywhere in a terminal**, it provides a smooth transition from macOS into Linux and back.","The demo covers `container machine create --set-default` to create and set a default, `container machine run` to execute commands (`uname` prints Darwin on Mac but Linux inside the machine), automatic mirroring of username and working directory, `container machine run` with no args for an interactive shell, and `container machine list` for name/IP/resources. It ends with a **Vapor** web server showing a cross-platform workflow: edit on Mac in Xcode (including changing the icon in Icon Composer), build and run inside the Container machine (with the Swift toolchain installed), set Vapor to listen on the machine's external IP, and access it from Safari on the Mac at IP:8080 — file edits are instantly visible via directory sharing, and refreshing shows the updated icon. It encourages downloading the latest container tool from GitHub."],"deepdive_en":[{"t":0,"title":"Introduction","body":"Michael opens, introducing **Container machine**, a new feature built on **Containerization**: a highly integrated Linux environment on Mac that's fast and lightweight like a container, persistent like a VM, and — via host integrations — feels native to macOS."},{"t":79,"title":"Containerization","body":"Reviews **Containerization**, open-sourced at WWDC 25 — a Swift framework for running Linux containers on macOS with APIs for storage, networking, execution, and a Linux init system, giving each container **VM-based isolation** with sub-second starts; the accompanying container tool handles image creation, distribution, and lifecycle. See 'Meet Containerization'."},{"t":134,"title":"Design principles","body":"Lays out the design principles: fast and lightweight to fit existing workflows, easy switching between macOS and Linux, quick customization and creation of new environments (so multiple projects each get a dedicated one without conflicts), persistence to add tools over time, and feeling like an extension of the existing workflow."},{"t":216,"title":"Container machine","body":"Explains how Container machine improves cross-platform workflows: each runs in its own lightweight VM, uses the same image format as containers, is a first-class container-tool feature with familiar UX, is stateful and persists modifications, and provides a smooth transition via automatic user mapping, shared filesystem, and entering the Linux environment from anywhere."},{"t":276,"title":"Demo","body":"Begins the demo section, moving into hands-on use of Container machine's commands and workflow."},{"t":281,"title":"Viewing container machine commands","body":"Running `container machine` shows an overview of available actions, including create, run, and stop."},{"t":300,"title":"Creating a new container machine","body":"Uses `container machine create` with a name and `--set-default` to set it as the default machine (so later commands omit the name). Container machine uses the same **OCI images** as containers; the demo uses the common alpine image."},{"t":339,"title":"Echo hi","body":"Uses `container machine run` to execute `echo hi` inside the machine, verifying commands can run within it."},{"t":357,"title":"Running uname","body":"Runs `uname`: on macOS it prints Darwin, while `container machine run uname` prints Linux, reflecting the runtime environment."},{"t":388,"title":"Start interactive shell","body":"`container machine run` with no extra arguments starts an interactive session. Container machine automatically mirrors the Mac's username and current working directory, so `whoami` and `pwd` inside return the same results as the Mac, for a seamless experience."},{"t":481,"title":"List container machines","body":"Uses `container machine list` to display each machine's name, IP address, and resource info; the presenter copies the IP for later use."},{"t":502,"title":"Start interactive shell","body":"Starts an interactive shell with `container machine run` into an environment that has the Swift toolchain installed; thanks to automatic directory sharing, all project files (Package.swift, source, Public directory) are available."},{"t":553,"title":"Run the application","body":"Demonstrates a cross-platform workflow with a **Vapor** web server: because the machine has an isolated network, Vapor's hostname is set in Xcode to the machine's IP; the Mac edit is instantly available via sharing. After compiling and running, the site is accessed from Safari at IP:8080; changing the icon in Icon Composer and overwriting it requires no file copy, and refreshing shows the update."},{"t":633,"title":"Next steps","body":"Wraps up: Container machine combines the usability and speed of containers with the persistence of a VM, with seamless integrations making the Linux environment feel like an extension of the Mac. Encourages downloading the latest container tool from GitHub and sharing feedback."}],"code":[]},"related":[{"id":"101","title":"Keynote","gloss":"主題演講","gloss_en":"Keynote","category":"other","categoryLabel":"其他"},{"id":"102","title":"Platforms State of the Union","gloss":"平台現況報告","gloss_en":"Platforms State of the Union","category":"other","categoryLabel":"其他"},{"id":"111","title":"Keynote (ASL)","gloss":"主題演講(美國手語版)","gloss_en":"Keynote (American Sign Language)","category":"other","categoryLabel":"其他"},{"id":"112","title":"Platforms State of the Union (ASL)","gloss":"平台現況報告（美國手語版）","gloss_en":"Platforms State of the Union (American Sign Language)","category":"other","categoryLabel":"其他"},{"id":"122","title":"WWDC26 Platforms State of the Union Recap","gloss":"WWDC26 平台現況演講重點回顧","gloss_en":"WWDC26 Platforms State of the Union recap","category":"other","categoryLabel":"其他"}]}</script>
