<script id="d" type="application/json">{"s":{"id":"285","title":"Discover USDKit and what’s new in OpenUSD","gloss":"認識 USDKit 與 OpenUSD 的新功能","category":"graphics","categoryLabel":"圖形與遊戲","duration":873,"url":"https://developer.apple.com/videos/play/wwdc2026/285/","takeaway":"全新 Swift 原生的 USDKit 讓你以類型安全的 API 開啟、走訪與編輯 USD Stage，並支援無障礙中繼資料與網格／紋理壓縮匯出。","chapters":[[7,"Introduction"],[53,"OpenUSD: Industry Foundation and New Standards"],[171,"Gaussian Splats and Particle Fields"],[227,"Introducing USDKit"],[246,"3D Editing in Preview and New Renderers"],[342,"Spatial Preview: Live Collaboration Between Mac and Vision Pro"],[385,"USD on the Web: The Safari Model Tag"],[417,"USDKit: Key Concepts and Swift API Walkthrough"],[492,"Opening a USD Stage"],[524,"Traversing the Stage Hierarchy"],[576,"Moving a Prim with a Transform Operation"],[605,"Accessibility Metadata in USD"],[642,"Applying Accessibility Metadata"],[679,"Asset Compression: Mesh and Texture"],[725,"Exporting with Mesh and Texture Compression"],[756,"Integration Paths: USDKit, SwiftUSD, and OpenUSD"],[804,"Next steps"]],"points":[{"text":"推出 **Swift 原生的 USDKit**，可建立／開啟 **USDStage**、走訪 prim 階層、定義 Xform 並加入檔案參照。","hot":true},{"text":"OpenUSD 採用新標準，支援 **Gaussian Splats 與 Particle Fields**；Preview 可進行 3D 編輯，並與 Vision Pro 即時協作。","hot":false},{"text":"可在 USD 中套用 **AccessibilityAPI schema**，為 3D 物件加上 label 與 description 等**無障礙中繼資料**。","hot":false},{"text":"匯出 **USDZ** 時可用 preferSmallTextureFiles 與 preferSmallMeshFiles 進行**網格與紋理壓縮**；Safari 也支援 model 標籤呈現 USD。","hot":false}],"apis":["USDKit","USDStage","USDValue","OpenUSD","SwiftUSD","USDZ","AccessibilityAPI"],"audience":"**處理 3D 內容、AR/visionOS 場景或遊戲資產管線**、需要在 Apple 平台上以 Swift 操作 USD 的開發者。","gloss_en":"Discover USDKit and what's new in OpenUSD","takeaway_en":"The new Swift-native USDKit lets you open, traverse, and edit a USD Stage with type-safe APIs, with support for accessibility metadata and mesh/texture-compressed export.","points_en":[{"text":"Introduces **Swift-native USDKit**, which can create/open a **USDStage**, traverse the prim hierarchy, define Xforms, and add file references.","hot":true},{"text":"OpenUSD adopts new standards supporting **Gaussian Splats and Particle Fields**; Preview enables 3D editing and real-time collaboration with Vision Pro.","hot":false},{"text":"Apply the **AccessibilityAPI schema** in USD to add **accessibility metadata** such as label and description to 3D objects.","hot":false},{"text":"When exporting **USDZ**, use preferSmallTextureFiles and preferSmallMeshFiles for **mesh and texture compression**; Safari also supports rendering USD via the model tag.","hot":false}],"audience_en":"**Developers working with 3D content, AR/visionOS scenes, or game asset pipelines** who need to work with USD in Swift on Apple platforms.","summary":["本場由 Apple 空間標準團隊工程師 Lee 主講，介紹 **OpenUSD** 在 Apple 平台上的最新進展，以及全新的 Swift 系統框架 **USDKit**。**USD**（Universal Scene Description）由 Pixar 創建，已成為橫跨電影、AAA 遊戲、工廠、手術室、自駕車與 AI 模擬等產業的通用 3D 語言。它並非單打獨鬥，而是與來自 Lucasfilm 的 **MaterialX**（材質描述）及今年新加入、來自 DreamWorks 的 **OpenVDB**（體積資料）整合，三者今年皆已更新。Apple 是 Academy Software Foundation 成員與 Alliance for OpenUSD 的創始成員,今年協助發布了 USD 核心的首份正式規格。","在技術亮點方面，Apple 與 NVIDIA、Adobe、Pixar 等夥伴合作，導入新的 USD primitive 型別 **Particle Fields**，能描述 **Gaussian Splats**（以數百萬顆模糊重疊粒子捕捉真實場景，各自編碼位置、顏色與透明度）等新興表示法，首度讓 splats 與 mesh、材質等傳統 3D 資料共存於同一場景。**Preview** 與 **Quick Look** 今年帶來 Mac 上的基本 3D 編輯能力與多種 renderer 選擇（**RealityKit**、Storm,以及為複雜場景打造的全新 **Raytracer**），三者皆支援比 USDPreviewSurface 更先進的 **OpenPBR**。Preview 並整合 macOS 27 的 **Spatial Preview** 框架，讓 Mac 上的編輯能即時在 Vision Pro 的 Quick Look 中呈現，並可透過 SharePlay 多人協作；Safari 也新增 **Model tag**，讓 USD 內容如同圖片或影片般原生嵌入網頁。","整場核心是全新系統框架 **USDKit**，為 Swift app 帶來一流的 USD 支援，並深度整合 RealityKit 與 Spatial Preview。講者先說明關鍵概念：**Layer**（單一資料檔）、**Composition**（組合多個 layer）、**Stage**（組合後的完整場景視窗）、**Prim**（場景中的每個物件，由 **Schema** 定義型別，並帶有 **Attributes** 與 **Metadata**）。接著以 ALab 場景示範完整流程：用 USDStage.open 載入 stage、用 descendants 遍歷階層尋找示波器、用 definePrim 定義 Xform prim 並以 references.add 加入輕量參考（展現 composition 威力，他人更新會自動反映），再用 addTransformOperation 搭配 xformOp:translate 把資產移到工作檯正確位置。","講者也強調無障礙與壓縮兩大重點。Apple 推動將 **accessibility metadata** 標準化進 USD,可對 3D 物件定義輔助標籤與描述,並已在 Blender 與 Maya 直接支援;示範以 applyAPISchema 套用 **AccessibilityAPI** schema 並建立 label 與 description 屬性。在壓縮方面,與 Alliance for Open Media 合作導入可將 mesh 縮小達 90% 的編碼,結合既有的 **AVIF** 紋理壓縮,平均資產縮小七倍而不損視覺品質,可透過 exportPackage 的選項、Preview 或 usdcrush 命令列工具達成。最後說明整合路徑:app 開發者首選 **USDKit**,進階或跨平台需求可用 **SwiftUSD**（Swift Package Manager）或直接嵌入 **OpenUSD** C++ 框架,三者共用同一基礎,USD 檔案可自由流通。"],"deepdive":[{"t":7,"title":"Introduction","body":"由 Apple 空間標準（Spatial Standards）團隊工程師 **Lee** 開場,點出 **USD** 是 Apple 創造空間體驗、表示空間場景的骨幹,從你打造的 app 到平台上的內容皆建立在 USD 之上。USD 由 Pixar 創建,Apple 很早就看出其潛力並持續合作。本場將涵蓋 USD 在 Apple 平台上的最新進展,以及一個能在 Mac 與 Vision Pro 間搭橋、帶來無縫 3D 體驗的強大新框架 **USDKit**。"},{"t":53,"title":"OpenUSD: Industry Foundation and New Standards","body":"說明 **OpenUSD** 是 USD 背後的開源專案,為描述 3D 場景的業界標準函式庫。它與來自 Lucasfilm 的 **MaterialX**（材質描述）及今年新加入、來自 DreamWorks 的 **OpenVDB**（體積資料）整合,三者今年皆更新。Apple 身為 **Academy Software Foundation** 成員與 **Alliance for OpenUSD** 創始成員,今年協助發布了 USD 核心的首份正式規格,幾何、材質與物理的領域規格也已展開,並鼓勵開發者參與這些決定 USD 未來的工作小組。"},{"t":171,"title":"Gaussian Splats and Particle Fields","body":"介紹 **Gaussian Splats** 是近年 3D 表示法的重大突破:不使用傳統幾何,而是以數百萬顆模糊重疊的粒子捕捉場景,每顆編碼位置、顏色與透明度,能忠實重建複雜真實環境並捕捉細微光照反應。Apple 與 NVIDIA、Adobe、Pixar 等 Alliance 夥伴合作,導入新的 USD primitive 型別 **Particle Fields**,可描述 Gaussian Splats 及此快速演進領域的其他表示法,首度讓 splats 與 mesh、材質等傳統 3D 資料共存於同一場景。"},{"t":227,"title":"Introducing USDKit","body":"帶出本場核心:全新框架 **USDKit** 負責處理繁重工作,讓開發者專注於內容與應用。這一切都建立在前述標準化工作的基礎之上,接下來將展示橫跨各平台的強大新體驗以及為驅動它們而打造的 USDKit。"},{"t":246,"title":"3D Editing in Preview and New Renderers","body":"**Preview** 長久以來是 Mac 上檢視圖片、PDF 與 3D 內容的首選,今年將其開箱即用的編輯哲學帶到 3D:可直接在場景中操作物件、編輯屬性與光照、處理完整場景階層、轉換與壓縮資產,無須學習專門 3D 軟體,且背後由量產品質的渲染與處理管線支撐。Preview 與 **Quick Look** 提供 renderer 選擇:**RealityKit**(跨 Mac、iPhone、iPad、Vision Pro 一致)、Storm(現有量產管線),以及為最複雜場景打造、提供精準反射陰影與物理正確光照的全新 **Raytracer**;三者皆支援比 USDPreviewSurface 更先進的 **OpenPBR**。"},{"t":342,"title":"Spatial Preview: Live Collaboration Between Mac and Vision Pro","body":"Preview 整合 macOS 27 的全新 **Spatial Preview** 框架,在 Mac 與 Vision Pro 的 Quick Look 間建立直接連線。當你在 Preview 編輯 USD 場景時,變更會即時呈現在你自己空間中的 Vision Pro Quick Look,並透過 **SharePlay** 讓整個團隊同時加入,創意總監與藝術家可一起繞著同一場景走動,即時檢視光照、構圖與空間尺度。此框架讓這類協作式空間工作流程更容易帶進你自己的 Mac app。"},{"t":385,"title":"USD on the Web: The Safari Model Tag","body":"USD 現在也進入網頁。**Safari** 推出 **Model tag**,讓 3D 內容如同圖片或影片般自然地帶進網頁。在頁面中嵌入 USD 模型後,macOS 與 iOS 使用者能在瀏覽器中獲得完全互動的 3D 體驗;在 **visionOS** 上更進一步,同一模型會突破頁面框架,在使用者空間中以空間方式呈現。"},{"t":417,"title":"USDKit: Key Concepts and Swift API Walkthrough","body":"說明 **USDKit** 為 Swift app 帶來一流 USD 支援,深度整合 RealityKit 與 Spatial Preview,既讓熟悉 USD 的開發者立刻上手,也以 Swift 既有的模式迎接初次接觸 USD 的人。接著鋪陳關鍵概念:**Layer**(單一資料檔)、**Composition**(組合多個 layer)、**Stage**(組合後的完整場景視窗),場景中每個物件都是 **Prim**,由 **Schema** 定義型別,並帶有存放實際資料的 **Attributes** 與描述 prim 本身的 **Metadata**。"},{"t":492,"title":"Opening a USD Stage","body":"示範以 USDKit 入門皆從 stage 開始。可用簡單的 **USDStage** 初始化器在記憶體中建立全新 stage;但此 demo 中講者要處理既有場景,故傳入 file URL 給 **USDStage.open**。由於涉及檔案存取會 throw,因此使用 try。場景順利載入且外觀已相當不錯,但講者發現工作檯上應有的示波器(oscilloscope)不見了。"},{"t":524,"title":"Traversing the Stage Hierarchy","body":"為了確認示波器是否已在場景中,講者先用 stage 的 **descendants** 遍歷整個 stage 階層、比對 prim.name 是否為 \"scope\"。結果並未找到,於是用 **definePrim** 在想要的路徑定義一個新的 Xform transform prim,再以 **references.add** 加入輕量參考——資產存在於他人撰寫的獨立檔案(layer)中,僅是被引入而非整份複製。這正是 **composition** 的威力:每人各自處理場景的一部分,而 USD 將其組合在一起,且他人的更新會自動反映到自己的 stage。"},{"t":576,"title":"Moving a Prim with a Transform Operation","body":"資產雖已進入場景,但位置不對。講者先呼叫 **addTransformOperation**,它會自動建立正確的 transform 屬性並更新 transform 順序;之後只需設定 **xformOp:translate** 的平移值(如 [2.5, 0.0, -1.0]),資產便移到工作檯上正確的位置。"},{"t":605,"title":"Accessibility Metadata in USD","body":"強調無障礙是 Apple 的核心價值,空間內容亦然。Apple 推動將 **accessibility metadata** 直接標準化進 USD,確立如何在 3D 物件上定義輔助標籤與描述,並以彈性設計讓其未來能演進。由於它原生於 USD,可透過任何 USD API 撰寫,且為方便採用,已在 **Blender** 與 **Maya** 直接支援。"},{"t":642,"title":"Applying Accessibility Metadata","body":"示範為新資產加入無障礙資料:先用 **applyAPISchema** 對 prim 套用 **AccessibilityAPI** schema(以 instance name \"default\"),加入必要 metadata 表明 schema 存在。由於 USDKit 未提供所有 schema 專屬 API,講者依規格定義的正確屬性名稱直接以 makeAttribute 建立 label 與 description 屬性,再設定其值——一個精簡的 label(\"Oscilloscope\")與一段豐富的 description,讓輔助技術充分理解該物件。"},{"t":679,"title":"Asset Compression: Mesh and Texture","body":"指出量產品質的 USD 場景(如 ALab)可達數 GB,分享不易。Apple 與 **Alliance for Open Media** 合作,加入最先進的 mesh 壓縮編碼,可將 mesh 大小縮減達 90%;結合既有以 **AVIF** 進行的紋理壓縮,平均資產縮小七倍而不損視覺品質,帶來更快傳遞、更低儲存成本與更佳體驗。"},{"t":725,"title":"Exporting with Mesh and Texture Compression","body":"說明壓縮支援直接內建於 **exportPackage** API:將輸出 URL 傳入 stage 的 exportPackage 方法,並透過 export options 啟用 **preferSmallTextureFiles**(紋理)與 **preferSmallMeshFiles**(mesh)壓縮,寥寥數行即可完成。若不寫程式,也可直接在 Preview 或透過 **usdcrush** 命令列工具達到相同結果;Apple 正與 Pixar 合作將此壓縮支援帶進 OpenUSD 專案,讓整個生態系受惠。"},{"t":756,"title":"Integration Paths: USDKit, SwiftUSD, and OpenUSD","body":"因整合 USD 可能複雜,講者列出多種存取技術的路徑。平台上的 app 開發者首選 **USDKit**,它由系統提供、深度整合,今日所展示的一切皆建立其上。對於更進階或超出 USDKit 範圍的跨平台工作流程,**SwiftUSD** 提供可透過 Swift Package Manager 取得的開源 Swift 綁定;跨平台 C++ 程式庫則可更輕易地直接嵌入 **OpenUSD** 框架。三條路徑都建立在同一基礎之上,USD 檔案可在它們之間自由流通。"},{"t":804,"title":"Next steps","body":"總結今年 USD 在 Apple 平台的重大進展:**Preview** 帶來基本 3D 編輯與強大渲染選項、**Spatial Preview** 讓人沉浸於內容並與他人分享、Safari 的 **Model tag** 將 USD 原生帶上網頁,而這一切的核心是讓 Swift 操作 USD 成為一流體驗的新系統框架 **USDKit**。講者建議想在 app 中創作 3D 內容者從 USDKit 著手,並指向關於 Spatial Preview、USD on the web 與 RealityKit/Reality Composer Pro 的延伸 session。"}],"summary_en":["Presented by Lee, an engineer on Apple's Spatial Standards team, this session covers the latest advances in **OpenUSD** on Apple platforms and a new Swift system framework, **USDKit**. **USD** (Universal Scene Description), created by Pixar, has become the common 3D language across industries spanning award-winning films, AAA games, factory floors, surgical suites, autonomous vehicles, and AI-driven simulations. It doesn't work alone but integrates with **MaterialX** from Lucasfilm (material descriptions) and, new this year, **OpenVDB** from DreamWorks (volumetric data), all three updated this year. Apple is a member of the Academy Software Foundation and a founding member of the Alliance for OpenUSD, and this year helped release the first formal specification for the core of USD.","Among the highlights, Apple worked with partners including NVIDIA, Adobe, and Pixar to introduce a new USD primitive type, **Particle Fields**, capable of describing **Gaussian Splats** (which capture real-world scenes as millions of fuzzy, overlapping particles each encoding position, color, and opacity), bringing splats into the same scene as meshes and materials for the first time. **Preview** and **Quick Look** bring essential 3D editing to the Mac this year along with a choice of renderers (**RealityKit**, Storm, and a brand new **Raytracer** for complex scenes), all supporting **OpenPBR**, a significant upgrade over USDPreviewSurface. Preview integrates with the macOS 27 **Spatial Preview** framework so edits on the Mac appear live in Quick Look on Vision Pro, with SharePlay enabling team collaboration, and Safari adds a **Model tag** so USD content embeds natively in web pages like images or video.","The centerpiece is the new system framework **USDKit**, which brings first-class USD support to Swift apps with deep RealityKit and Spatial Preview integration. The presenter first explains key concepts: a **Layer** (a single data file), **Composition** (combining layers), a **Stage** (the composed result, your window into the full scene), and a **Prim** (every object in the scene, typed by a **Schema** and carrying **Attributes** and **Metadata**). He then demonstrates the full flow with the ALab scene: loading a stage with USDStage.open, traversing the hierarchy via descendants to find an oscilloscope, defining an Xform prim with definePrim and adding a lightweight reference via references.add (showing composition's power, where others' updates flow through automatically), and moving the asset onto the workbench with addTransformOperation and xformOp:translate.","The talk also emphasizes accessibility and compression. Apple has driven standardizing **accessibility metadata** directly in USD, letting you define assistive labels and descriptions on 3D objects, with direct support already in Blender and Maya; the demo applies the **AccessibilityAPI** schema via applyAPISchema and creates label and description attributes. For compression, working with the Alliance for Open Media, Apple added a codec reducing mesh sizes by up to 90%, which combined with existing **AVIF** texture compression makes the average asset seven times smaller without compromising quality, achievable via exportPackage options, Preview, or the usdcrush command-line tool. Finally, on integration paths: app developers should start with **USDKit**, while advanced or cross-platform needs can use **SwiftUSD** (via Swift Package Manager) or embed **OpenUSD** C++ directly, all built on the same foundation so USD files move freely between them."],"deepdive_en":[{"t":7,"title":"Introduction","body":"Engineer **Lee** from Apple's Spatial Standards team opens by noting that **USD** is the backbone of the spatial experiences Apple creates and how it represents spatial scenes, with everything from the apps you build to the content across platforms built on top of USD. USD was created by Pixar, and Apple recognized its potential early and has collaborated ever since. The session covers the latest advances in USD on Apple platforms plus a powerful new framework, **USDKit**, that can bridge Mac and Vision Pro for seamless 3D experiences."},{"t":53,"title":"OpenUSD: Industry Foundation and New Standards","body":"Explains that **OpenUSD** is the open-source project behind USD, the industry-standard library for describing 3D scenes. It integrates with **MaterialX** from Lucasfilm (material descriptions) and, new this year, **OpenVDB** from DreamWorks (volumetric data), all three updated this year. As a member of the **Academy Software Foundation** and a founding member of the **Alliance for OpenUSD**, Apple this year helped release the first formal specification for the core of USD, with domain specifications for geometry, materials, and physics underway, and encourages developers to join these working groups shaping USD's future."},{"t":171,"title":"Gaussian Splats and Particle Fields","body":"Introduces **Gaussian Splats** as one of the most exciting recent 3D breakthroughs: rather than traditional geometry, splats capture a scene as millions of fuzzy, overlapping particles, each encoding position, color, and opacity, faithfully reconstructing complex real-world environments and capturing subtle lighting responses. Working with Alliance partners including NVIDIA, Adobe, and Pixar, Apple introduces a new USD primitive type, **Particle Fields**, capable of describing Gaussian Splats and other representations from this rapidly evolving area, bringing splats into the same scene as meshes and materials for the first time."},{"t":227,"title":"Introducing USDKit","body":"Sets up the session's centerpiece: the new framework **USDKit** takes care of the heavy lifting so developers can stay focused on their content and applications. All of this is made possible by the standardization work built towards, and the talk now turns to the powerful new experiences across platforms and the USDKit framework built to power them."},{"t":246,"title":"3D Editing in Preview and New Renderers","body":"**Preview** has long been the go-to for viewing images, PDFs, and 3D content on Mac, and this year brings its out-of-the-box editing philosophy to 3D: manipulate objects directly, edit properties and lighting, work with full scene hierarchies, and convert and compress assets without a dedicated 3D app, all backed by a production-quality pipeline. Preview and **Quick Look** offer a choice of renderer: **RealityKit** (consistent across Mac, iPhone, iPad, Vision Pro), Storm (for existing production pipelines), and a brand new **Raytracer** for the most complex scenes delivering accurate reflections, precise shadows, and physically correct lighting; all three support **OpenPBR**, a significant upgrade over USDPreviewSurface."},{"t":342,"title":"Spatial Preview: Live Collaboration Between Mac and Vision Pro","body":"Preview integrates with the new macOS 27 **Spatial Preview** framework, creating a direct connection between the Mac and Quick Look on Vision Pro. As you work on a USD scene in Preview, changes appear live in Quick Look on Vision Pro in your own space, and through **SharePlay** an entire team can join at once, with creative directors and artists walking around the same scene together to review lighting, composition, and spatial scale in real time. The framework makes this kind of collaborative spatial workflow easier to bring into your own Mac apps."},{"t":385,"title":"USD on the Web: The Safari Model Tag","body":"USD is now part of the web too. **Safari** introduces the **Model tag**, bringing 3D content to web pages as naturally as images or video. Embed a USD model in a page, and on macOS and iOS users get a fully interactive 3D experience right in the browser; on **visionOS** it goes further, with the same model breaking out of the page and presented spatially in the user's own space."},{"t":417,"title":"USDKit: Key Concepts and Swift API Walkthrough","body":"Explains **USDKit** brings first-class USD support to Swift apps with deep RealityKit and Spatial Preview integration, feeling immediately familiar to those who know USD while meeting Swift developers new to USD with patterns they already know. It then lays out key concepts: a **Layer** (a single data file), **Composition** (combining layers), a **Stage** (the composed result, your window into the full scene), with every object a **Prim** typed by a **Schema** and carrying **Attributes** (holding the actual data) and **Metadata** (describing the prim itself)."},{"t":492,"title":"Opening a USD Stage","body":"Demonstrates that getting started with USDKit begins with a stage. You can create a fresh one in memory with a simple **USDStage** initializer; but for this demo the presenter works with an existing scene, opening it by passing a file URL to **USDStage.open**. Since this involves file access it can throw, so try is used. The scene loads and looks great, but the presenter notices the oscilloscope that should be on the bench is missing."},{"t":524,"title":"Traversing the Stage Hierarchy","body":"To check whether the oscilloscope is already in the scene, the presenter first traverses the stage hierarchy using the stage's **descendants**, comparing prim.name to \"scope\". With no luck, he uses **definePrim** to define a new Xform transform prim at the desired path, then adds a lightweight reference via **references.add** — the asset lives in its own file (layer) authored by someone else and is simply pulled in rather than copied. This is the power of **composition**: everyone works on their own piece and USD brings it all together, with others' updates automatically showing up in your stage."},{"t":576,"title":"Moving a Prim with a Transform Operation","body":"The asset is in the scene but not where it should be. The presenter first calls **addTransformOperation**, which creates the correct transform attributes and updates the transform order automatically; then he only needs to set the **xformOp:translate** value (such as [2.5, 0.0, -1.0]) and the asset moves up onto the workbench, right where it should be."},{"t":605,"title":"Accessibility Metadata in USD","body":"Emphasizes that accessibility is a core value at Apple, and that includes spatial content. Apple has driven standardizing **accessibility metadata** directly in USD, establishing how assistive labels and descriptions are defined on 3D objects across the industry, designed with flexibility so it can evolve. Because it is native to USD, you can author it through any USD API, and to ease adoption there is direct support in **Blender** and **Maya**."},{"t":642,"title":"Applying Accessibility Metadata","body":"Demonstrates adding accessibility data to the new asset: first apply the **AccessibilityAPI** schema to the prim via **applyAPISchema** (with instance name \"default\"), adding the metadata that signals the schema is present. Since USDKit does not provide all schema-specific APIs, the presenter creates the label and description attributes directly with makeAttribute, using the correct attribute names from the specification, then sets their values — a concise label (\"Oscilloscope\") and a rich description giving assistive technologies everything they need to understand the object."},{"t":679,"title":"Asset Compression: Mesh and Texture","body":"Notes that production-quality USD scenes (like ALab) can grow to many gigabytes, making sharing impractical. Working with the **Alliance for Open Media**, Apple added a state-of-the-art mesh compression codec capable of reducing mesh sizes by up to 90%; combined with existing texture compression using **AVIF**, the average asset is now seven times smaller without compromising visual quality, meaning faster delivery, lower storage costs, and a better experience."},{"t":725,"title":"Exporting with Mesh and Texture Compression","body":"Explains compression support is built right into the **exportPackage** API: pass the output URL to the stage's exportPackage method and enable **preferSmallTextureFiles** (textures) and **preferSmallMeshFiles** (mesh) compression through the export options, done in a couple of lines. If you're not writing code, the same results are available directly in Preview or via the **usdcrush** command-line tool; Apple is working with Pixar to bring this compression to the OpenUSD project so the whole ecosystem benefits."},{"t":756,"title":"Integration Paths: USDKit, SwiftUSD, and OpenUSD","body":"Because integrating USD can be complex, the presenter lays out several access paths. For app developers on Apple platforms, **USDKit** is the way to go — system-provided, deeply integrated, and the basis of everything shown. For more advanced or cross-platform workflows beyond USDKit, **SwiftUSD** offers open-source Swift bindings via Swift Package Manager, and cross-platform C++ codebases can embed **OpenUSD** directly as a framework. All paths build on the same foundation, so USD files move freely between them."},{"t":804,"title":"Next steps","body":"Recaps the year's big step forward for USD on Apple platforms: **Preview** brings essential 3D editing and powerful rendering options, **Spatial Preview** lets you immerse in and share content, and Safari's **Model tag** brings USD natively to the web, all centered on the new system framework **USDKit** that makes working with USD in Swift a first-class experience. The presenter recommends starting with USDKit for authoring 3D content in your app and points to follow-up sessions on Spatial Preview, USD on the web, and RealityKit/Reality Composer Pro."}],"code":[]},"related":[{"id":"282","title":"Discover the Spatial Preview framework","gloss":"認識 Spatial Preview 框架","gloss_en":"Discover the Spatial Preview framework","category":"visionos","categoryLabel":"visionOS"},{"id":"215","title":"Get started with the HTML Model Element","gloss":"開始使用 HTML model 元素","gloss_en":"Getting started with the HTML model element","category":"graphics","categoryLabel":"圖形與遊戲"},{"id":"284","title":"Collaborate on structured 3D models in visionOS","gloss":"在 visionOS 中協作操作結構化 3D 模型","gloss_en":"Collaborate on structured 3D models in visionOS","category":"visionos","categoryLabel":"visionOS"},{"id":"252","title":"Design no-code games with Reality Composer Pro 3","gloss":"用 Reality Composer Pro 3 設計無程式碼遊戲","gloss_en":"Design no-code games with Reality Composer Pro 3","category":"graphics","categoryLabel":"圖形與遊戲"},{"id":"256","title":"Discover generated subtitles and subtitle styles","gloss":"認識自動產生字幕與字幕樣式","gloss_en":"Discover generated subtitles and subtitle styles","category":"graphics","categoryLabel":"圖形與遊戲"}]}</script>
