<script id="d" type="application/json">{"s":{"id":"269","title":"What’s new in SwiftUI","gloss":"SwiftUI 的新功能","category":"swiftui","categoryLabel":"SwiftUI","duration":1695,"url":"https://developer.apple.com/videos/play/wwdc2026/269/","takeaway":"SwiftUI 帶來全新的 Document 協定、可重新排序的清單與格線、更靈活的工具列控制，以及把 @State 改為 macro 以支援延遲初始化。","chapters":[[0,"Introduction"],[132,"Refreshed look and feel"],[200,"appearsActive environment value"],[214,"Menu icon visibility"],[312,"Prominent tab role"],[375,"Toolbar item visibility and overflow menu"],[457,"Minimize toolbar on scroll with toolbarMinimizeBehavior"],[486,"Document-based apps"],[587,"Document creation sources with context parameter"],[601,"Use the context to create a document"],[643,"Document app declaration"],[685,"Implement document writing"],[694,"Implement document writing: list writable formats"],[705,"Implement document writing: provide snapshot"],[714,"Implement document writing: represent the snapshot"],[733,"Implement document writing: provide a DocumentWriter"],[753,"DocumentWriter: Snapshot"],[756,"DocumentWriter: PageSnapshot as Snapshot"],[762,"DocumentWriter protocol implementation"],[798,"Progress reporting during writing"],[807,"Implement document reading with ReadableDocument protocol"],[875,"Add PNG to supported formats list"],[888,"Add content type checks"],[896,"Writing multiple formats including PNG"],[918,"Presentation and interaction"],[958,"Reorderable list with reorderContainer"],[974,"Apply changes to a reorderable list's data source"],[1008,"Reorderable grid with LazyVGrid"],[1092,"Swipe actions on List"],[1095,"Swipe actions on any view"],[1134,"Confirmation dialog with item binding"],[1175,"Alert with item binding"],[1198,"Data flow and performance"],[1278,"AsyncImage with URLRequest and custom URLSession"],[1388,"@State converted to macro for lazy initialization"],[1428,"@State macro init assignment error"],[1442,"Fixed @State macro init assignment error"],[1567,"@ContentBuilder"],[1645,"Next steps"]],"points":[{"text":"全新的 **Document 協定**（`ReadableDocument`、`WritableDocument`、`DocumentWriter`）讓文件型 App 直接以 `@Observable` 模型讀寫，並支援多格式（如 .png）與寫入進度回報。","hot":true},{"text":"工具列更靈活：可用 `visibilityPriority`、`ToolbarOverflowMenu` 控制顯示與溢位，並用 **`toolbarMinimizeBehavior`** 讓工具列隨捲動縮小。","hot":false},{"text":"新增**可重新排序**的清單與格線（`reorderable()`、`reorderContainer`），swipe actions 也可套用到 `List` 以外的任何 view。","hot":false},{"text":"**`@State` 改為 macro**，支援延遲初始化（只在 view 生命週期建立一次），並可在 `init` 中賦值。","hot":false},{"text":"其他改進包含 `appearsActive` 環境值、`Tab(role: .prominent)`、`AsyncImage` 支援 `URLRequest` 與自訂 `URLSession`，以及新的 `@ContentBuilder`。","hot":false}],"apis":["SwiftUI","ReadableDocument","WritableDocument","DocumentWriter","DocumentGroup","DocumentGroupLaunchScene","DocumentCreationSource","toolbarMinimizeBehavior","ToolbarOverflowMenu","visibilityPriority","reorderContainer","swipeActionsContainer","AsyncImage","State","ContentBuilder"],"audience":"**所有 SwiftUI 開發者**，特別是開發文件型 App 或想採用最新版面與資料流改進的人。","gloss_en":"What's new in SwiftUI","takeaway_en":"SwiftUI brings a brand-new Document protocol, reorderable lists and grids, more flexible toolbar control, and turns @State into a macro to support lazy initialization.","points_en":[{"text":"The new **Document protocol** (`ReadableDocument`, `WritableDocument`, `DocumentWriter`) lets document-based apps read and write directly with `@Observable` models, supporting multiple formats (such as .png) and write progress reporting.","hot":true},{"text":"Toolbars are more flexible: use `visibilityPriority` and `ToolbarOverflowMenu` to control visibility and overflow, and **`toolbarMinimizeBehavior`** to minimize the toolbar as you scroll.","hot":false},{"text":"Adds **reorderable** lists and grids (`reorderable()`, `reorderContainer`), and swipe actions can now be applied to any view beyond `List`.","hot":false},{"text":"**`@State` becomes a macro**, supporting lazy initialization (created only once per view lifecycle) and allowing assignment in `init`.","hot":false},{"text":"Other improvements include the `appearsActive` environment value, `Tab(role: .prominent)`, `AsyncImage` support for `URLRequest` and a custom `URLSession`, and the new `@ContentBuilder`.","hot":false}],"audience_en":"**All SwiftUI developers**, especially those building document-based apps or wanting to adopt the latest layout and data-flow improvements.","summary":["由 UI Frameworks 工程師 Steven 與 Julia 主講，這場以一個「貼紙 app」為貫穿範例，盤點 **2027 releases** 中 SwiftUI 的重大更新，分為四大主軸：刷新的外觀與工具列、強大的全新 Document API、呈現與互動的改進，以及資料流與效能的提升。最直接的好處是 **Liquid Glass** 的精煉外觀會在以 Xcode 27 重建後自動套用、無需改任何程式碼，並能回應新的 Liquid Glass slider 調整色調；iPhone app 在 iOS 27 也變得可調整大小，Live Previews 新增 resize handle 方便測試。","外觀與工具列方面：用 `appearsActive` 環境值在視窗非作用時降低自訂元件透明度；iPad／Mac 選單列預設精簡圖示，用 `labelStyle(.titleAndIcon)` 讓特定項目顯示圖示；新的 **prominent tab role** 讓購物車等 tab 突出顯示。工具列新增一組可調整大小友善的 API：`visibilityPriority(.high)` 指定空間有限時優先保留哪些按鈕、`ToolbarOverflowMenu` 把不常用動作收進溢位選單、`topBarPinnedTrailing` placement 讓 Share 永不隱藏，並用 `toolbarMinimizeBehavior(.onScrollDown)` 在捲動時自動收起導覽列。","**Document API** 是本場重點：在既有 `FileDocument` 基礎上擴充，搭配 **Observation**（`@Observable`）讓 view 只在依賴的屬性變動時更新。新增 **DocumentCreationSource**（如 blank／photo）讓建立文件時透過 context 參數客製初始流程；寫入端遵循 **`WritableDocument`** 協定（列出 `writableContentTypes`、提供 snapshot、提供符合 **`DocumentWriter`** 的 Writer），其 `write` 方法為 nonisolated async、可比對前後 snapshot 只寫改動部分、並用 Foundation 的 **Subprogress** 回報進度；讀取端用 **`ReadableDocument`**。加 `.png` 到 writable types 並在 writer 中以 Core Graphics 即可額外輸出 PNG。","呈現與互動：新的 **reorderable container** API（`reorderable()` + `reorderContainer(for:)`）讓 List 與 LazyVGrid 用同一段程式碼支援拖曳重排，並首度帶到 watchOS；**swipe actions** 現可用於任何 view（搭配 `swipeActionsContainer()`），且 `confirmationDialog` 與 `alert` 支援 item-binding 樣式。效能與資料流：**AsyncImage** 預設支援 HTTP 快取（尊重伺服器 cache header），並可傳入 `URLRequest` 或自訂 `URLSession`；**`@State` 改為 macro** 使以 State 儲存的類別變為 lazy、整個 view 生命週期只初始化一次（回溯到 iOS 17 起）；新的 **`@ContentBuilder`** 統一多個 builder 型別、大幅改善深層巢狀 view 的型別檢查（編譯）效能。Xcode 27 並附 SwiftUI 相關 agent skills 協助採用新 API。"],"deepdive":[{"t":0,"title":"Introduction","body":"UI Frameworks 工程師 Steven 與 Julia 開場，以熱愛貼紙的「貼紙 app」作為貫穿範例。本場將涵蓋 **2027 releases** 中 SwiftUI 的更新：刷新外觀與工具列、新的 **Document API**、呈現與互動改進，以及效能與資料流提升。"},{"t":132,"title":"Refreshed look and feel","body":"以 Xcode 27 重建即自動套用 **Liquid Glass** 精煉外觀、**無需改程式碼**，並能回應新的 Liquid Glass slider 調整色調；macOS 可把自訂元件標為 interactive 更靈敏。iPad／Mac app 非作用時自動 dim，iOS 27 起 iPhone app 也可調整大小。"},{"t":200,"title":"appearsActive environment value","body":"用 **`appearsActive`** 環境值微調外觀：sidebar 的自訂帳號按鈕在視窗非作用時降低 opacity，與其他 tab 標籤一同 dim。"},{"t":214,"title":"Menu icon visibility","body":"iPad／Mac 選單列預設只保留關鍵動作的精簡圖示；可對特定項目套用 **`labelStyle(.titleAndIcon)`**（如 Store 選單項）讓其圖示顯示、脫穎而出。"},{"t":312,"title":"Prominent tab role","body":"用新的 **`Tab(role: .prominent)`** 讓特定 tab 突出顯示——範例的購物車 tab 被放到畫面底部尾端，與含商店內容的其他 tab 區隔。"},{"t":375,"title":"Toolbar item visibility and overflow menu","body":"新工具列 API 指定空間有限時的取捨：對最重要的 Undo／Redo group 套 **`visibilityPriority(.high)`** 保持可見、把不常用動作放進 **`ToolbarOverflowMenu`**、用 **`topBarPinnedTrailing`** placement 讓 Share 永不隱藏。"},{"t":457,"title":"Minimize toolbar on scroll with toolbarMinimizeBehavior","body":"用 **`toolbarMinimizeBehavior(.onScrollDown, for: .navigationBar)`** 讓系統在向下捲動時自動把導覽列收起，瀏覽大量貼紙時騰出更多空間。"},{"t":486,"title":"Document-based apps","body":"Julia 介紹新的 **Document API**：在既有 `FileDocument`／`ReferenceFileDocument` 基礎上擴充。document-based app（如 Pages、Xcode）自帶 Cmd+N／Cmd+O、edited 指示、autosaving 等；本場聚焦三項改進：document creation context、讀寫效能、與直接 URL 存取。"},{"t":587,"title":"Document creation sources with context parameter","body":"用 **`DocumentCreationSource`** 宣告多個來源（blank、photo），各自加一個 `NewDocumentButton` 到 launch scene；選擇後 SwiftUI 透過 **context 參數** 傳入建立 closure。"},{"t":601,"title":"Use the context to create a document","body":"在 initializer 檢查 context：若 source 為 photo，文件開啟時即自動呈現照片選取器，讓使用者一鍵就能在照片上貼貼紙。"},{"t":643,"title":"Document app declaration","body":"在 app body 以 **`DocumentGroup`** 作為第一個 Scene 加入 document 架構，並用 **`@Observable`** 的 `StickerDocument` 類別描述文件型別；搭配 Observation 讓 view 只在依賴屬性變動時更新，獲得效能提升。"},{"t":685,"title":"Implement document writing","body":"讓文件符合 **`WritableDocument`** 協定以支援寫入，介紹其三項需求：可寫格式清單、提供內容的 snapshot 方法、以及提供 Writer。目標是讓讀寫盡量快速有效率。"},{"t":694,"title":"Implement document writing: list writable formats","body":"第一項需求：宣告 **`writableDocumentTypes`**（如自訂的 `.stickerDocument`，以 `UTType(exportedAs:)` 定義），列出 app 能寫的格式。"},{"t":705,"title":"Implement document writing: provide snapshot","body":"第二項需求：實作 **`snapshot(contentType:)`** 回傳當下文件內容；範例用 `@MainActor`、回傳 `sending PageSnapshot`，作為單一時間點的內容快照。"},{"t":714,"title":"Implement document writing: represent the snapshot","body":"用自訂 **`PageSnapshot`** struct 代表內容——背景圖、貼紙座標（`StickerPlacements`）與貼紙本身，包含寫入所需的一切。"},{"t":733,"title":"Implement document writing: provide a DocumentWriter","body":"第三項需求：提供符合 **`DocumentWriter`** 協定的 Writer，傳入請求的 contentType（如 stickerDocument），它知道如何把文件以指定格式寫到磁碟。"},{"t":753,"title":"DocumentWriter: Snapshot","body":"`DocumentWriter` 有 Snapshot 的概念，作為寫入時的內容型別。"},{"t":756,"title":"DocumentWriter: PageSnapshot as Snapshot","body":"把前面定義的 **`PageSnapshot`** 指定為 Writer 的 `Snapshot` associated type，完美契合寫入需求。"},{"t":762,"title":"DocumentWriter protocol implementation","body":"`DocumentWriter` 唯一需求是 **`write`** 方法：它是 **nonisolated 且 async**，可在背景執行昂貴的磁碟寫入保持 app 回應；藉比對 current 與 previous snapshot，**只寫真正需要更新的部分**。"},{"t":798,"title":"Progress reporting during writing","body":"即使最佳化後磁碟操作仍可能耗時，SwiftUI 提供 **`progress`** 參數，讓你用 Foundation 的 **`Subprogress`** API 回報寫入進度。"},{"t":807,"title":"Implement document reading with ReadableDocument protocol","body":"讓文件型別符合 **`ReadableDocument`** 協定以支援讀取，它是 WritableDocument 的對應：兩者都需支援格式清單，WritableDocument 提供 snapshot、ReadableDocument 負責套用；前者的搭檔是 DocumentWriter、後者是 DocumentReader 處理磁碟繁重工作。"},{"t":875,"title":"Add PNG to supported formats list","body":"要把頁面存成圖片分享給沒有 app 的人，先在 **`writableContentTypes`** 清單加入 **`.png`**。"},{"t":888,"title":"Add content type checks","body":"因 app 現在能處理多格式，在 `write` 方法中為每種支援型別加 **content type 檢查**（用 `contentType.conforms(to:)` 分流 stickerDocument 與 png）。"},{"t":896,"title":"Writing multiple formats including PNG","body":"PNG 分支用 **Core Graphics**（`CGContext`）把貼紙與背景照片壓平成單一影像寫到 URL。只要再加 content type 就能用任意框架寫出更多格式。"},{"t":918,"title":"Presentation and interaction","body":"進入呈現與互動段落，介紹 reorderable container、swipe actions、以及 confirmationDialog／alert 的 item-binding 等改進。"},{"t":958,"title":"Reorderable list with reorderContainer","body":"用 **reorderable container** API：對 ForEach 加 **`reorderable()`**、對 List 加 **`reorderContainer(for:)`**，在 closure 呼叫 helper 套用排序變更，SwiftUI 自動處理拖曳互動與動畫。"},{"t":974,"title":"Apply changes to a reorderable list's data source","body":"helper（`difference.apply`）底層用開源 **swift-collections** 的 `OrderedDictionary` 提交排序變更，依 `destination.position` 計算目的位移並 move keys。"},{"t":1008,"title":"Reorderable grid with LazyVGrid","body":"reorderable API 適用任何容器：把同一段 List 程式碼直接搬到 **`LazyVGrid`**，重排程式碼完全不變，即可在不同容器得到相同互動重排行為。"},{"t":1092,"title":"Swipe actions on List","body":"在 List item 套 **`swipeActions`** 並放入 Delete 按鈕，即可滑動移除清單中的貼紙。"},{"t":1095,"title":"Swipe actions on any view","body":"iOS 27 起 **swipe actions 可用於任何 view**，不限 List：把 ForEach 移到 `LazyVStack`，加 **`swipeActionsContainer()`** 來協調該 scroll view 中各 item 的滑動動作。"},{"t":1134,"title":"Confirmation dialog with item binding","body":"**`confirmationDialog`** 現支援與 sheet 相同的 **item-binding** 樣式：傳入 `item: $stickerToDelete` binding，設值（如點 context menu 的 Delete）即彈出對話框。"},{"t":1175,"title":"Alert with item binding","body":"同樣的 item-binding 樣式也適用於 **`alert`**：傳入 `item:` binding，設值時彈出警示。"},{"t":1198,"title":"Data flow and performance","body":"Steven 接手談資料流與效能。許多改進無需改程式碼即生效；謹慎處理資料流動是讓 app 保持回應與流暢的關鍵。"},{"t":1278,"title":"AsyncImage with URLRequest and custom URLSession","body":"**`AsyncImage`** 現預設支援標準 **HTTP 快取**（尊重伺服器 cache header），所有 app 自動啟用、捲回頂端不再重新載入。可傳入自訂 **`URLRequest`**（指定 cachePolicy）或用 **`asyncImageURLSession`** 傳入配置了 `URLCache` 的自訂 `URLSession`。"},{"t":1388,"title":"@State converted to macro for lazy initialization","body":"**`@State` 改為 macro**：以 State 儲存的類別現為 **lazy**，整個 view 生命週期只初始化一次；先前每次 view 重新初始化都會建立新實例再丟棄。此行為回溯到 `@Observable` 首次推出的 iOS 17／macOS 14 等版本。"},{"t":1428,"title":"@State macro init assignment error","body":"State macro 可能造成 source-breaking：若 `@State` 變數同時有預設值、又在 `init` 內賦值，Xcode 會報 use-before-initialization 錯誤。"},{"t":1442,"title":"Fixed @State macro init assignment error","body":"解法是**移除不必要的預設值賦值**（把 `@State private var page: StickerPage` 留待 init 賦值），即可消除該錯誤。"},{"t":1567,"title":"@ContentBuilder","body":"深層巢狀 view 常見「compiler unable to type-check in reasonable time」錯誤，源於 Section／Group／ForEach 各有多個 builder overload 需逐一嘗試。新的 **`@ContentBuilder`** 把常見 builder 統一為單一 builder，留下唯一直接路徑，**大幅改善型別檢查（編譯）效能**；它是 ViewBuilder 的演進，可用於任何最低部署目標。"},{"t":1645,"title":"Next steps","body":"總結行動方案：以 Xcode 27 為 2027 releases 重建專案、檢視刷新後的外觀；若是 document-based app 就導入新 Document API；並試用 Xcode 27 隨附的 **SwiftUI agent skills**（SwiftUI Specialist 與 What's New In SwiftUI），可用 `xcrun agent skills export` 匯出成 markdown 在其他工具使用。"}],"summary_en":["Presented by UI Frameworks engineers Steven and Julia, this session uses a 'sticker app' as its running example to survey the major SwiftUI updates in the **2027 releases**, across four themes: a refreshed look and toolbars, a powerful new Document API, presentation and interaction improvements, and data-flow and performance gains. The most immediate benefit is that the refined **Liquid Glass** appearance applies automatically when rebuilt with Xcode 27 with no code changes, and responds to the new Liquid Glass slider for tint; iPhone apps also become resizable in iOS 27, and Live Previews gain resize handles for testing.","On look and toolbars: use the `appearsActive` environment value to dim custom elements when a window is inactive; iPad/Mac menu bars default to minimal icons, with `labelStyle(.titleAndIcon)` to surface a specific item's icon; and the new **prominent tab role** makes tabs like a shopping cart stand out. New resizability-friendly toolbar APIs include `visibilityPriority(.high)` to choose which buttons stay visible when space is tight, `ToolbarOverflowMenu` to keep rare actions in the overflow menu, `topBarPinnedTrailing` placement so Share is never hidden, and `toolbarMinimizeBehavior(.onScrollDown)` to auto-collapse the navigation bar on scroll.","The **Document API** is the centerpiece: it extends the existing `FileDocument` foundation and works with **Observation** (`@Observable`) so views update only when a dependent property changes. A new **DocumentCreationSource** (e.g. blank/photo) lets you customize the initial flow via a context parameter on creation; the write side conforms to **`WritableDocument`** (list `writableContentTypes`, provide a snapshot, provide a Writer conforming to **`DocumentWriter`**), whose `write` method is nonisolated async, can diff current vs. previous snapshots to write only changed parts, and reports progress via Foundation's **Subprogress**; the read side uses **`ReadableDocument`**. Adding `.png` to writable types and using Core Graphics in the writer enables exporting PNG.","Presentation and interaction: the new **reorderable container** API (`reorderable()` + `reorderContainer(for:)`) gives List and LazyVGrid drag-to-reorder with the same code and brings reordering to watchOS for the first time; **swipe actions** now work on any view (with `swipeActionsContainer()`), and `confirmationDialog` and `alert` support the item-binding pattern. Performance and data flow: **AsyncImage** now supports HTTP caching by default (respecting server cache headers) and accepts a `URLRequest` or custom `URLSession`; **`@State` becomes a macro** so class instances stored in State are lazy and initialized once per view lifetime (back-ported to iOS 17+); and the new **`@ContentBuilder`** unifies multiple builder types to dramatically improve type-checking (compile) performance for deeply nested views. Xcode 27 also ships SwiftUI agent skills to help adopt the new APIs."],"deepdive_en":[{"t":0,"title":"Introduction","body":"UI Frameworks engineers Steven and Julia open with a sticker-loving 'sticker app' as the running example. The session covers SwiftUI updates in the **2027 releases**: a refreshed look and toolbars, the new **Document API**, presentation and interaction improvements, and performance and data-flow gains."},{"t":132,"title":"Refreshed look and feel","body":"Rebuilding with Xcode 27 automatically applies the refined **Liquid Glass** appearance with **no code changes**, responding to the new Liquid Glass slider for tint; on macOS you can mark custom elements interactive for more fluid response. iPad/Mac apps dim when inactive, and iPhone apps become resizable in iOS 27."},{"t":200,"title":"appearsActive environment value","body":"Use the **`appearsActive`** environment value to fine-tune appearance: the sidebar's custom account button reduces opacity when the window is inactive, dimming alongside the other tab labels."},{"t":214,"title":"Menu icon visibility","body":"iPad/Mac menu bars default to a minimal set of icons for key actions; apply **`labelStyle(.titleAndIcon)`** to a specific item (like the Store menu item) to show its icon and make it stand out."},{"t":312,"title":"Prominent tab role","body":"Use the new **`Tab(role: .prominent)`** to make a tab stand out—the cart tab is placed at the bottom trailing edge, distinguished from the other content tabs."},{"t":375,"title":"Toolbar item visibility and overflow menu","body":"New toolbar APIs specify trade-offs when space is limited: apply **`visibilityPriority(.high)`** to the important Undo/Redo group to keep it visible, put rare actions in a **`ToolbarOverflowMenu`**, and use **`topBarPinnedTrailing`** placement so Share is never hidden."},{"t":457,"title":"Minimize toolbar on scroll with toolbarMinimizeBehavior","body":"Use **`toolbarMinimizeBehavior(.onScrollDown, for: .navigationBar)`** so the system automatically collapses the navigation bar when scrolling down, freeing space when browsing many stickers."},{"t":486,"title":"Document-based apps","body":"Julia introduces the new **Document API**, expanding on the existing `FileDocument`/`ReferenceFileDocument` foundation. Document-based apps (like Pages, Xcode) get Cmd+N/Cmd+O, an edited indicator, and autosaving for free; this session focuses on three improvements: document creation context, read/write performance, and direct URL access."},{"t":587,"title":"Document creation sources with context parameter","body":"Use **`DocumentCreationSource`** to declare multiple sources (blank, photo), each with a `NewDocumentButton` in the launch scene; SwiftUI passes the chosen source to the creation closure via a **context parameter**."},{"t":601,"title":"Use the context to create a document","body":"Check the context in the initializer: if the source is photo, the document opens with the photo picker already presented, so the user is one tap from placing stickers on a photo."},{"t":643,"title":"Document app declaration","body":"Opt into the document architecture with a **`DocumentGroup`** as the first Scene in the app body, using an **`@Observable`** `StickerDocument` class to describe the document type; Observation means views update only when a dependent property changes."},{"t":685,"title":"Implement document writing","body":"Conform the document to the **`WritableDocument`** protocol for writing, with three requirements: a list of writable formats, a snapshot method returning the content, and a Writer. The goal is to make reading and writing fast and efficient."},{"t":694,"title":"Implement document writing: list writable formats","body":"First requirement: declare **`writableDocumentTypes`** (e.g. a custom `.stickerDocument` defined via `UTType(exportedAs:)`), listing the formats the app can write."},{"t":705,"title":"Implement document writing: provide snapshot","body":"Second requirement: implement **`snapshot(contentType:)`** returning current content; the example is `@MainActor` and returns `sending PageSnapshot`, a snapshot of the document at a single point in time."},{"t":714,"title":"Implement document writing: represent the snapshot","body":"Use a custom **`PageSnapshot`** struct to represent content—the background image, sticker coordinates (`StickerPlacements`), and the stickers themselves—containing everything needed for writing."},{"t":733,"title":"Implement document writing: provide a DocumentWriter","body":"Third requirement: provide a Writer conforming to the **`DocumentWriter`** protocol, given the requested contentType (e.g. stickerDocument); it knows how to write the document to disk in a specified format."},{"t":753,"title":"DocumentWriter: Snapshot","body":"`DocumentWriter` has a notion of Snapshot, serving as the content type used during writing."},{"t":756,"title":"DocumentWriter: PageSnapshot as Snapshot","body":"Assign the previously defined **`PageSnapshot`** as the Writer's `Snapshot` associated type, fitting the writing requirement perfectly."},{"t":762,"title":"DocumentWriter protocol implementation","body":"`DocumentWriter`'s only requirement is the **`write`** method: it is **nonisolated and async**, performing expensive disk writes in the background to keep the app responsive, and by diffing current vs. previous snapshots it **writes only the parts that changed**."},{"t":798,"title":"Progress reporting during writing","body":"Even after optimization, disk operations can take time, so SwiftUI provides a **`progress`** parameter to report writing progress using Foundation's **`Subprogress`** API."},{"t":807,"title":"Implement document reading with ReadableDocument protocol","body":"Conform the document type to **`ReadableDocument`** for reading, the twin of WritableDocument: both require a supported-formats list, WritableDocument provides a snapshot while ReadableDocument applies it; the former's companion is DocumentWriter, the latter's is DocumentReader doing the disk heavy lifting."},{"t":875,"title":"Add PNG to supported formats list","body":"To save pages as images for people without the app, first add **`.png`** to the **`writableContentTypes`** list."},{"t":888,"title":"Add content type checks","body":"Since the app now handles multiple formats, add **content type checks** in the `write` method for each supported type (using `contentType.conforms(to:)` to branch between stickerDocument and png)."},{"t":896,"title":"Writing multiple formats including PNG","body":"The PNG branch uses **Core Graphics** (`CGContext`) to flatten stickers and the background photo into a single image written to the URL. Adding another content type lets you write more formats with any framework."},{"t":918,"title":"Presentation and interaction","body":"Begins the presentation-and-interaction segment, covering reorderable containers, swipe actions, and the item-binding pattern for confirmationDialog/alert."},{"t":958,"title":"Reorderable list with reorderContainer","body":"Use the **reorderable container** API: add **`reorderable()`** to ForEach and **`reorderContainer(for:)`** to the List, calling a helper in the closure to apply ordering changes; SwiftUI handles the drag interaction and animation automatically."},{"t":974,"title":"Apply changes to a reorderable list's data source","body":"The helper (`difference.apply`) uses the open-source **swift-collections** `OrderedDictionary` under the hood to commit ordering changes, computing the destination offset from `destination.position` and moving keys."},{"t":1008,"title":"Reorderable grid with LazyVGrid","body":"The reorderable API works with any container: move the same List code to a **`LazyVGrid`** with the reordering code unchanged, getting the same interactive reordering in a different container."},{"t":1092,"title":"Swipe actions on List","body":"Apply **`swipeActions`** to a List item with a Delete button to swipe-remove stickers from the list."},{"t":1095,"title":"Swipe actions on any view","body":"From iOS 27, **swipe actions work on any view**, not just List: move the ForEach into a `LazyVStack` and add **`swipeActionsContainer()`** to coordinate swipe actions across items in that scroll view."},{"t":1134,"title":"Confirmation dialog with item binding","body":"**`confirmationDialog`** now supports the same **item-binding** pattern as sheets: pass an `item: $stickerToDelete` binding, and setting the value (e.g. tapping Delete in a context menu) presents the dialog."},{"t":1175,"title":"Alert with item binding","body":"The same item-binding pattern also applies to **`alert`**: pass an `item:` binding, and setting the value presents the alert."},{"t":1198,"title":"Data flow and performance","body":"Steven takes over on data flow and performance. Many improvements take effect with no code changes; being thoughtful about data flow is key to keeping an app responsive and smooth."},{"t":1278,"title":"AsyncImage with URLRequest and custom URLSession","body":"**`AsyncImage`** now supports standard **HTTP caching** by default (respecting server cache headers), enabled for every app so scrolling back to the top no longer reloads. Pass a custom **`URLRequest`** (specifying cachePolicy) or use **`asyncImageURLSession`** to supply a custom `URLSession` configured with a `URLCache`."},{"t":1388,"title":"@State converted to macro for lazy initialization","body":"**`@State` becomes a macro**: classes stored in State are now **lazy**, initialized once per view lifetime; previously a new instance was created and discarded on each reinitialization. This is back-ported to iOS 17/macOS 14 and aligned releases where `@Observable` debuted."},{"t":1428,"title":"@State macro init assignment error","body":"The State macro can be source-breaking: if a `@State` variable has both a default value and is assigned in `init`, Xcode reports a use-before-initialization error."},{"t":1442,"title":"Fixed @State macro init assignment error","body":"The fix is to **remove the unnecessary default value assignment** (leave `@State private var page: StickerPage` for the init to assign), clearing the error."},{"t":1567,"title":"@ContentBuilder","body":"Deeply nested views often hit the 'compiler unable to type-check in reasonable time' error, caused by Section/Group/ForEach each having multiple builder overloads to try. The new **`@ContentBuilder`** unifies common builders into one, leaving a single straightforward path and **dramatically improving type-checking (compile) performance**; it's an evolution of ViewBuilder usable with any minimum deployment target."},{"t":1645,"title":"Next steps","body":"Summarizes the action plan: rebuild your project with Xcode 27 for the 2027 releases and review the refreshed look; if you have a document-based app, adopt the new Document API; and try the **SwiftUI agent skills** shipped with Xcode 27 (SwiftUI Specialist and What's New In SwiftUI), exportable to markdown via `xcrun agent skills export` for other tools."}],"code":["struct SidebarFooterView: View {\n    @Environment(\\.appearsActive) private var appearsActive\n\n    var body: some View {\n        MyAccountView()\n            .opacity(appearsActive ? 1 : 0.5)\n    }\n}","CommandMenu(\"Stickers\") {\n    Button { openStore() } label: {\n        Label(\"Store\", systemImage: \"bag.fill\")\n            .labelStyle(.titleAndIcon)\n        }\n    }\n    // Other menu items\n}","TabView {\n    Tab { EventsTab() }\n    Tab { HolidaysTab() }\n    Tab { FunTab() }\n\n    Tab(role: .prominent) {\n        CartTab()\n    }\n}","// Toolbar item visibility priority\n\nStickerPageView()\n    .toolbar {\n        ToolbarItemGroup {\n            UndoButton()\n            RedoButton()\n        }\n        .visibilityPriority(.high)\n        ToolbarOverflowMenu {\n            ChoosePhotoButton()\n            ExportAsImageButton()\n            ClearAllStickersButton()\n        }\n        ToolbarItem(placement: .topBarPinnedTrailing) {\n            ShareButton()\n        }\n    }","// Minimize toolbar when scrolling\n\nScrollView {\n    StickerListView()\n}\n.toolbarMinimizeBehavior(.onScrollDown, for: .navigationBar)","// Use the context to create a document\n\n@main\nstruct Stickers: App {\n    var body: some Scene {\n        DocumentGroupLaunchScene(\"Create a Sticker Page\") {\n            NewDocumentButton(\"New Sticker Page\", source: .blank)\n            NewDocumentButton(\"Sticker Page from Photo…\", source: .photo)\n        }\n       \n        DocumentGroup { /* ... */ }\n    }\n}\n  \nextension DocumentCreationSource {\n    static let blank = Self(id: \"blank\")\n    static let photo = Self(id: \"photo\")\n}","@main\nstruct Stickers: App {\n    var body: some Scene {\n        DocumentGroupLaunchScene(\"Create a Sticker Page\") {\n            NewDocumentButton(\"New Sticker Page\", source: .blank)\n            NewDocumentButton(\"Sticker Page from Photo…\", source: .photo)\n        }\n       \n        DocumentGroup { document in\n            StickerPageDocumentView(document)\n        } { configuration, context in\n            StickerPageDocument(configuration: configuration, context: context)\n        }\n    }\n}","@main\nstruct Stickers: App {\n    var body: some Scene {\n        DocumentGroup { /* ... */ }\n        WindowGroup { /* ... */ }\n    }\n}","@Observable\nfinal class StickerDocument {\n    // ...\n}","@Observable\nfinal class StickerDocument {\n    \n    static let writableDocumentTypes: [UTType] = [.stickerDocument]\n  \n    // ...\n}\n\nimport UniformTypeIdentifiers\n\nextension UTType {\n    static let stickerDocument = UTType(exportedAs: \"stickerdocument\")\n}","@Observable\nfinal class StickerDocument {\n    \n    static let writableDocumentTypes: [UTType] = [.stickerDocument]\n  \n    @MainActor\n    func snapshot(contentType: UTType) async throws -> sending PageSnapshot { /* ... */ }\n      \n    // ...\n}","struct PageSnapshot {\n    var background: Image\n    var metadata: StickerPlacements\n    var stickers: [Image]\n}\n\nstruct StickerPlacements { /* ... */ }"]},"related":[{"id":"271","title":"Code-along: Build powerful drag and drop in SwiftUI","gloss":"程式碼共做：在 SwiftUI 打造強大的拖放功能","gloss_en":"Code-along: Build powerful drag and drop in SwiftUI","category":"swiftui","categoryLabel":"SwiftUI"},{"id":"272","title":"Use SwiftUI with AppKit and UIKit","gloss":"在 AppKit 與 UIKit 中使用 SwiftUI","gloss_en":"Use SwiftUI with AppKit and UIKit","category":"swiftui","categoryLabel":"SwiftUI"},{"id":"322","title":"Compose advanced graphics effects with SwiftUI","gloss":"用 SwiftUI 組合進階圖形效果","gloss_en":"Compose advanced graphics effects with SwiftUI","category":"swiftui","categoryLabel":"SwiftUI"},{"id":"8002","title":"SwiftUI for Beginners Group Lab","gloss":"SwiftUI 新手團體實驗室","gloss_en":"SwiftUI for Beginners Group Lab","category":"swiftui","categoryLabel":"SwiftUI"},{"id":"8006","title":"SwiftUI Group Lab","gloss":"SwiftUI 小組實驗室","gloss_en":"SwiftUI Group Lab","category":"swiftui","categoryLabel":"SwiftUI"}]}</script>
