<script id="d" type="application/json">{"s":{"id":"205","title":"Enhance your presence on the App Store","gloss":"強化你在 App Store 上的呈現","category":"appstore","categoryLabel":"App Store","duration":494,"url":"https://developer.apple.com/videos/play/wwdc2026/205/","takeaway":"透過新的素材版位與 Asset Library，把你的圖片與影片運用在 App Store 更多地方，更完整地行銷 App 與遊戲。","chapters":[[6,"Introduction"],[52,"New asset placements"],[264,"Meet Asset Library"],[455,"Next steps"]],"points":[{"text":"重新思考如何在 App Store 上行銷 App 與遊戲，把自家**圖片與影片**運用到更多新位置。","hot":false},{"text":"介紹**新的素材版位（asset placements）**，讓行銷素材出現在更多場景。","hot":false},{"text":"推出 **Asset Library** 集中管理你的行銷素材。","hot":true},{"text":"提供後續可採取的**下一步**，協助規劃素材投放。","hot":false}],"apis":[],"audience":"**負責 App Store 行銷與經營的開發者與行銷人員**，想提升商店頁面表現的人。","gloss_en":"Enhance your presence on the App Store","takeaway_en":"Use new asset placements and the Asset Library to put your images and videos in more places on the App Store, marketing your apps and games more completely.","points_en":[{"text":"Reimagine how you market your apps and games on the App Store by using your own **images and videos** in new places.","hot":false},{"text":"Introduces **new asset placements** so your marketing assets appear in more contexts.","hot":false},{"text":"Launches the **Asset Library** to manage your marketing assets in one place.","hot":true},{"text":"Offers actionable **next steps** to help you plan how you deploy your assets.","hot":false}],"audience_en":"**Developers and marketers who handle App Store marketing and growth** and want to improve their product page performance.","summary":["使用者在 App Store 上發現你的 App 時，最初幾秒看到的畫面決定了他們是想進一步了解、還是直接滑過。本場次由 App Store Connect 團隊說明全新的視覺呈現方式：除了既有的截圖與預覽影片，**Product Page Header**（產品頁標題區）讓你能放上自由發揮的圖片或影片，成為使用者進入頁面時第一眼看到的視覺元素，用來表達品牌與視覺識別；而 **Search Results**（搜尋結果）也能改用一張有衝擊力的圖片或影片取代預設截圖，讓 App 在搜尋中脫穎而出。","這些新的行銷視覺在 App Store Connect 中稱為 **creative assets**，可以是圖片或影片，並能與 **Custom Product Pages**、**Apple Ads** 搭配運用。講者以健身 App 為例：官網的瑜珈行銷橫幅可連到 Custom Product Page，header 沿用與官網相同的行銷視覺，再以 deep link 把使用者直接導向瑜珈內容，打造從發現到安裝的一致體驗。你也能針對不同搜尋關鍵字顯示不同素材，並透過 **Product Page Optimization** A/B 測試哪種視覺最能打動受眾。這些功能在 iOS 27 與 iPadOS 27 上皆可使用，適用所有類別的 App 與遊戲。","提交審核有兩種方式。第一種是熟悉的版本頁流程：在 version page 上傳素材，用新的 **Preview** 功能預覽 App 在不同 iPhone／iPad、方向與語言下的呈現，確認無誤後如常送審，版本核准上線後 header 與搜尋結果視覺也一併上線。第二種是全新的 **Asset Library**，它是集中管理所有素材的地方，涵蓋截圖、預覽影片、in-app event 媒體與新的 creative assets，你可以獨立上傳並送審素材，不需綁定版本或指定用途。","Asset Library 最大的優勢在於：已核准的素材可直接套用到 Product Page Header 與 Search Results，無需再次審核。講者示範把夏季登山素材即時換成冬季登山素材並直接發佈到 App Store，毋須新的送審。實務上的關鍵收穫是：提前準備並送審素材，就能即時、彈性地更新行銷視覺；同時這些流程都能透過 **App Store Connect API** 與 **Apple Ads Platform API**（含 Swift 開源用戶端函式庫）自動化。"],"deepdive":[{"t":6,"title":"Introduction","body":"開場點出 App Store 上**第一印象**的重要性：使用者發現 App 後最初幾秒看到的畫面，決定他們是深入了解還是直接滑過。講者預告今年將透過**圖片與影片**的全新用法來形塑這個關鍵時刻，並快速回顧目前產品頁與搜尋結果預設以截圖與預覽影片呈現的現況。"},{"t":52,"title":"New asset placements","body":"介紹兩個全新的素材版位。**Product Page Header** 是使用者進入產品頁第一眼看到的視覺，可放截圖／預覽以外的圖片或影片，用來表達品牌識別；**Search Results** 則能以有衝擊力的圖片或影片取代預設截圖。這些素材還能用於 **Apple Ads** 廣告、搭配 **Custom Product Pages** 針對關鍵字客製，並以 **Product Page Optimization** 進行 A/B 測試，於 iOS 27 與 iPadOS 27 適用所有類別。"},{"t":264,"title":"Meet Asset Library","body":"說明集中式素材管理工具 **Asset Library**，涵蓋截圖、預覽影片、in-app event 媒體與新的 **creative assets**。可獨立上傳並送審素材，不需綁定版本；最大優勢是已核准素材能直接套用到 header 與搜尋結果而免再次審核。講者以夏季登山素材即時替換為冬季素材並直接發佈的示範，凸顯**即時更新**的彈性，並指出可用 App Store Connect API 自動化。"},{"t":455,"title":"Next steps","body":"收尾給出行動清單：先準備要用於展示 App 的圖片與影片，上傳到 **Asset Library** 供 Product Page、Search Results 等版位使用，最後在送審前用 **Preview** 功能確認呈現。整體鼓勵開發者善用這些新視覺，並可結合 **App Store Connect API** 與 **Apple Ads Platform API** 自動化上傳、送審與廣告設定流程。"}],"summary_en":["When someone discovers your app on the App Store, what they see in those first few moments decides whether they explore further or scroll past. This App Store Connect session introduces new ways to use images and video beyond your screenshots and previews. The new **Product Page Header** lets you place free-form images or video as the first visual people see when they land on your page, expressing your brand and visual identity, while **Search Results** can now show an impactful image or video instead of default screenshots so your app stands out.","These new marketing visuals are called **creative assets** in App Store Connect, and they pair with **Custom Product Pages** and **Apple Ads**. The speaker walks through a fitness-app example: a website's yoga marketing banner links to a Custom Product Page, the header reuses the same website visuals, and a deep link sends users straight into the yoga offering for a consistent discovery-to-install experience. You can also show tailored assets per search keyword and use **Product Page Optimization** to A/B test which visuals resonate. Everything works on iOS 27 and iPadOS 27 across all app and game categories.","There are two ways to submit for review. First, the familiar version-page flow: upload assets on your version page, use the new **Preview** to see how your app looks across iPhone, iPad, orientations, and languages, then submit as you do today, with the header and search visuals going live when the version is approved. Second, the new **Asset Library**, a centralized place to manage all your assets, including screenshots, preview videos, in-app event media, and the new creative assets, where you can upload and submit assets standalone without tying them to a version.","The big advantage of Asset Library is that approved assets are ready to use across the Product Page Header and Search Results without another review. The speaker demonstrates swapping a summer hiking asset for a winter one and publishing directly to the App Store with no new submission. The practical takeaway: get assets approved ahead of time for real-time, flexible updates, and automate the whole pipeline via the **App Store Connect API** and the **Apple Ads Platform API**, which includes open-source client libraries for Swift."],"deepdive_en":[{"t":6,"title":"Introduction","body":"Frames the importance of the **first impression** on the App Store: the first few moments after discovery decide whether people learn more or scroll past. The speaker previews using **images and video** in new ways to shape that moment, and recaps how product pages and search results today default to screenshots and preview videos."},{"t":52,"title":"New asset placements","body":"Introduces two new placements. The **Product Page Header** is the first visual people see and can hold images or video beyond screenshots, used to express brand identity; **Search Results** can show an impactful image or video instead of default screenshots. These assets can also power **Apple Ads**, pair with **Custom Product Pages** for per-keyword tailoring, and be A/B tested with **Product Page Optimization**, available on iOS 27 and iPadOS 27 across all categories."},{"t":264,"title":"Meet Asset Library","body":"Explains **Asset Library**, a centralized asset manager covering screenshots, preview videos, in-app event media, and the new **creative assets**. Assets can be uploaded and submitted standalone without tying to a version; the key advantage is that approved assets can be applied directly to the header and search results without another review. A demo swapping a summer hiking asset for a winter one and publishing directly highlights **real-time updates**, and the API can automate the flow."},{"t":455,"title":"Next steps","body":"Closes with an action list: prepare the images and video that showcase your app, upload them to **Asset Library** for use on the Product Page, Search Results, and more, and use **Preview** to confirm presentation before submitting. It encourages adopting these new visuals and automating upload, submission, and ad setup via the **App Store Connect API** and **Apple Ads Platform API**."}],"code":[]},"related":[{"id":"210","title":"What’s new in Apple In-App Purchase","gloss":"Apple App 內購買的新功能","gloss_en":"What's new in Apple In-App Purchase","category":"appstore","categoryLabel":"App Store"},{"id":"261","title":"Build, deliver, and automate with Xcode Cloud","gloss":"用 Xcode Cloud 建置、交付與自動化","gloss_en":"Build, deliver, and automate with Xcode Cloud","category":"appstore","categoryLabel":"App Store"},{"id":"309","title":"Explore Retention Messaging in App Store Connect","gloss":"探索 App Store Connect 的挽留訊息","gloss_en":"Explore Retention Messaging in App Store Connect","category":"appstore","categoryLabel":"App Store"},{"id":"378","title":"Unlock in-game content with StoreKit and Background Assets","gloss":"用 StoreKit 與 Background Assets 解鎖遊戲內容","gloss_en":"Unlock in-game content with StoreKit and Background Assets","category":"appstore","categoryLabel":"App Store"},{"id":"391","title":"Offer subscriptions to groups and organizations","gloss":"向群組與組織提供訂閱","gloss_en":"Offer subscriptions to groups and organizations","category":"appstore","categoryLabel":"App Store"}]}</script>
