<script id="d" type="application/json">{"s":{"id":"203","title":"Read between the strokes with PencilKit","gloss":"用 PencilKit 解讀筆跡內容","category":"uikit","categoryLabel":"UIKit","duration":910,"url":"https://developer.apple.com/videos/play/wwdc2026/203/","takeaway":"用 PKStrokeRecognizer 在自家 App 中辨識手寫筆跡、產生可索引與可搜尋的文字，並支援路徑轉換與筆畫切割。","chapters":[[0,"Introduction"],[205,"Handwriting recognition"],[233,"Recognized text"],[322,"Indexable content"],[418,"Find text"],[518,"Path conversion"],[621,"Improved model access"],[685,"Stroke slicing"],[828,"Next steps"]],"points":[{"text":"用驅動 Freeform、備忘錄等 Apple App 的同一套技術，透過 **PKStrokeRecognizer** 為你的 App 解鎖**手寫辨識**。","hot":true},{"text":"呼叫 **updateDrawing** 後即可取得 **recognizedText**，把使用者的手寫筆畫轉成文字字串。","hot":false},{"text":"辨識結果可產出 **indexableContent** 供索引，並用 **search** 搜尋關鍵字、回傳可高亮的 bounds。","hot":false},{"text":"提供**路徑轉換（path conversion）**與**筆畫切割（stroke slicing）**，並改善模型存取方式。","hot":false}],"apis":["PencilKit","PKStrokeRecognizer","recognizedText","updateDrawing","indexableContent"],"audience":"**開發手寫、筆記或繪圖類 App**、想在 PencilKit 畫布上加入文字辨識與搜尋的開發者。","gloss_en":"Read handwriting content with PencilKit","takeaway_en":"Use PKStrokeRecognizer to recognize handwritten strokes in your own app, producing indexable and searchable text, with support for path conversion and stroke slicing.","points_en":[{"text":"Unlock **handwriting recognition** for your app via **PKStrokeRecognizer**, using the same technology that powers Apple apps like Freeform and Notes.","hot":true},{"text":"After calling **updateDrawing**, get **recognizedText** to turn the user's handwritten strokes into a text string.","hot":false},{"text":"Recognition results can produce **indexableContent** for indexing, and **search** lets you find keywords and return highlightable bounds.","hot":false},{"text":"Provides **path conversion** and **stroke slicing**, along with improved model access.","hot":false}],"audience_en":"Developers **building handwriting, note-taking, or drawing apps** who want to add text recognition and search on a PencilKit canvas.","summary":["在 iPad 上用 Apple Pencil 書寫如同紙筆般自然，但與紙不同的是手寫內容可以變得**可搜尋、可辨識、可互動**。這場由繪圖功能工程師 Yichen 主講，重點是 **PencilKit** 在 iOS、iPadOS、macOS 與 visionOS 27 帶來的全新 API：把手寫筆跡轉成文字的**手寫辨識**、PencilKit 筆畫路徑與標準 Bézier 路徑之間的互轉、對繪圖模型更深入的存取（筆畫身分與選取），以及切割筆畫的 stroke slicing。所有新 API 同樣適用於建立在 PencilKit 之上的 **PaperKit**。","手寫辨識的核心是 **`PKStrokeRecognizer`**，它是一個 Swift `actor`、方法皆為非同步，完全在裝置端離線執行，支援 29 種語言（Simulator 僅支援拉丁字元語言）。它提供三種能力：**recognized text** 回傳最可能的單一辨識結果（可指定 `preferredLanguages` 與 strokeIDs）；**indexable content** 把所有候選結果串接成一個字串，特別適合 Spotlight 索引（持久化時應一併儲存 `recognizerVersion` 以判斷是否需重新索引）；以及 **search()** 給定目標字串回傳比對位置，可搭配 **`UIFindInteraction`** 直接在畫布上獲得系統級尋找與高亮體驗，並能讓 VoiceOver 朗讀手寫內容、提升無障礙性。","**Path conversion** 讓 PencilKit 能用在自家畫布：PencilKit 以 cubic uniform B-spline 表示筆畫，iOS 27 起可與 Bézier path 無損互轉（Bézier 不帶 size、opacity、force，需自行為控制點補上）。把既有 Bézier 筆畫轉成 `PKStrokePath` 後即可組成 `PKDrawing` 餵給辨識器，讓手寫辨識不再侷限於 `PKCanvasView`。模型存取方面，`PKStroke` 與 `PKStrokePath` 現在符合 **`Identifiable`**（穩定 UUID，可跨 transform、編輯、undo 追蹤），並新增 `canvasViewSelectionDidChange` delegate 與可控制的 `renderGroupID`。最後的 stroke slicing 提供兩種切割：用 `PKStrokePath` 當橡皮擦的**程式化抹除**（複雜繪圖較耗效能，建議在背景執行緒處理），以及用 parametric range 的 subscript 做 **substroke 擷取**，可用來精準取出片段並打造如筆順回放的流暢動畫。"],"deepdive":[{"t":0,"title":"Introduction","body":"由繪圖功能工程師 Yichen 開場，點出手寫在 iPad 上自然如紙筆，但能變得**可搜尋、可辨識、可互動**。**PencilKit** 是 Apple 各平台 freehand 繪圖的核心框架，提供低延遲畫布、表現力豐富的墨水與底層資料模型；iOS 26 的 **PaperKit** 建立其上，而本場所有新 API 同樣適用於 PaperKit。"},{"t":205,"title":"Handwriting recognition","body":"手寫辨識是 PencilKit 最被期待的能力之一，現於 iOS、iPadOS、macOS、visionOS 27 開放。講者以自製的中英文寫字學習 app 示範：孩子在 flashcard 上書寫「心」，app 能在尚未寫完前就辨識並比對提示字，答對時確認。整段路線圖涵蓋辨識、path conversion、模型存取與 stroke slicing。"},{"t":233,"title":"Recognized text","body":"核心類別 **`PKStrokeRecognizer`** 是 Swift `actor`（執行緒安全），所有方法皆非同步。**Recognized text** 回傳最可能的單一結果，預設依裝置語言判讀，亦可用 `preferredLanguages` 指定、或只傳入特定 strokeIDs。辨識完全**在裝置端離線**執行，iOS 27 支援 29 種語言（可由 `supportedLanguages` 查詢，Simulator 僅支援拉丁字元）。"},{"t":322,"title":"Indexable content","body":"**Indexable content** 回傳代表整份繪圖內容的單一字串，特別適合 **Spotlight** 搜尋。當手寫模糊（如「1」或小寫「l」、「101」或「lol」）時，它會把所有候選結果串接，確保使用者怎麼搜都找得到。持久化時要一併儲存 **`recognizerVersion`**，載入時與當前版本比對以決定是否重新索引，並建議節流呼叫以省電。"},{"t":418,"title":"Find text","body":"**search()** 給定目標字串，回傳該詞可能出現位置的 SearchResults 陣列（含 bounds），驅動互動式搜尋與高亮。它與系統的 **`UIFindInteraction`** 自然搭配：實作 `UIFindInteractionDelegate` 並以 search() 為底層，即可在畫布直接獲得系統尋找 UI、結果導覽與高亮。這些能力也讓 VoiceOver 能朗讀手寫、輔助功能能定位特定字詞。"},{"t":518,"title":"Path conversion","body":"PencilKit 以 **cubic uniform B-spline** 表示筆畫路徑，但 Bézier path 更通用。iOS 27 起 `PKStrokePath` 支援兩者互轉，PencilKit 處理幾何，但 Bézier 不帶 size、opacity、force，需為每個控制點自行提供。從 `PKStrokePath` 出發來回轉換可得相同控制點位置，達成無損保存；自家 Bézier 畫布也能轉成 `PKStrokePath` 組成 `PKDrawing` 餵給辨識器。"},{"t":621,"title":"Improved model access","body":"`PKStroke` 與 `PKStrokePath` 現在皆符合 **`Identifiable`**，提供穩定 UUID，可跨 transform、編輯、undo 追蹤同一筆畫。有了穩定身分後即可控制 `PKCanvasView` 的選取狀態，並新增 `canvasViewSelectionDidChange` delegate 在選取改變時觸發。當墨水被快速連續繪製時，PencilKit 會以相同 **`renderGroupID`** 合成筆畫，此值在 iOS 27 亦可控制。"},{"t":685,"title":"Stroke slicing","body":"切割筆畫有兩種方式。**程式化抹除**：提供一個 `PKStrokePath` 當橡皮擦切過繪圖，把單一筆畫切成各自帶 mask 的多個獨立筆畫，效果如使用者用橡皮擦工具；複雜繪圖較耗效能，建議在背景執行緒處理。**Substroke 擷取**：iOS 27 起 `PKStroke` 與 `PKStrokePath` 支援 parametric range 的 subscript，可精準取出任意片段並維持墨水粒子一致性。"},{"t":828,"title":"Next steps","body":"行動建議：採用 **`PKStrokeRecognizer`** 帶入手寫辨識；把既有 Bézier path 轉為 `PKStrokePath`，讓辨識在無 `PKCanvasView` 時也能用；深入模型以穩定身分追蹤筆畫、回應選取變化；並善用 stroke slicing 做程式化抹除與 substroke 動畫（講者用它實作中文筆順回放）。Demo 範例程式碼可在影片資源中取得。"}],"summary_en":["Writing on iPad with Apple Pencil feels like pen on paper, but unlike paper your handwriting can become **searchable, recognizable, and interactive**. Presented by drawing-features engineer Yichen, this session covers brand-new **PencilKit** APIs across iOS, iPadOS, macOS, and visionOS 27: **handwriting recognition** that turns strokes into words, conversion between PencilKit stroke paths and standard Bézier paths, deeper access to the drawing model (stroke identity and selection), and stroke slicing. All of these APIs also work with **PaperKit**, which builds on PencilKit.","Handwriting recognition centers on **`PKStrokeRecognizer`**, a Swift `actor` with async methods that runs entirely on device and offline. It supports 29 languages in iOS 27 (Simulator handles Latin scripts only) and offers three capabilities: **recognized text** returns the single most likely result (configurable via `preferredLanguages` and strokeIDs); **indexable content** concatenates all candidates into one string ideal for Spotlight (store `recognizerVersion` alongside it to decide when to re-index, and throttle calls to save power); and **search()** returns where a target string likely appears, pairing with **`UIFindInteraction`** for a system find-and-highlight experience and enabling VoiceOver to read handwriting for accessibility.","**Path conversion** brings PencilKit to your own canvas: strokes are stored as cubic uniform B-splines, and iOS 27 supports lossless conversion to and from Bézier paths (Bézier paths don't carry size, opacity, or force, so you supply those per control point). Existing Bézier strokes can be converted to `PKStrokePath`, assembled into a `PKDrawing`, and fed to the recognizer, freeing handwriting recognition from `PKCanvasView`. For model access, `PKStroke` and `PKStrokePath` now conform to **`Identifiable`** (stable UUIDs trackable across transforms, edits, and undo), with a new `canvasViewSelectionDidChange` delegate and a controllable `renderGroupID`. Finally, stroke slicing offers programmatic erasing (use a `PKStrokePath` as the eraser; run on a background thread for complex drawings) and substroke extraction via parametric-range subscripts for precise slices and smooth animations like stroke-order replay."],"deepdive_en":[{"t":0,"title":"Introduction","body":"Drawing-features engineer Yichen opens by noting handwriting on iPad feels like pen on paper but can become **searchable, recognizable, and interactive**. **PencilKit** is the core freehand drawing framework on Apple's platforms, offering a low-latency canvas, expressive inks, and access to the underlying data model; iOS 26's **PaperKit** builds on it, and every new API here also works with PaperKit."},{"t":205,"title":"Handwriting recognition","body":"Handwriting recognition, one of PencilKit's most requested capabilities, arrives in iOS, iPadOS, macOS, and visionOS 27. The presenter demos a Chinese/English writing-practice app for kids: the child writes the character and the app recognizes and checks the work before the word is even finished. The roadmap covers recognition, path conversion, model access, and stroke slicing."},{"t":233,"title":"Recognized text","body":"The core class **`PKStrokeRecognizer`** is a thread-safe Swift `actor` with all-async methods. **Recognized text** returns the single most likely result, using device languages by default but configurable via `preferredLanguages` or a subset of strokeIDs. Recognition runs **entirely on device and offline**; iOS 27 supports 29 languages (queryable via `supportedLanguages`; Simulator handles Latin scripts only)."},{"t":322,"title":"Indexable content","body":"**Indexable content** returns a single string representing the whole drawing, ideal for **Spotlight** search. When handwriting is ambiguous (a '1' vs lowercase 'l', '101' vs 'lol'), it concatenates all candidates so users can find content however they search. Store **`recognizerVersion`** alongside the index to decide whether to re-index when models improve, and throttle calls to conserve power."},{"t":418,"title":"Find text","body":"**search()** takes a target string and returns an array of results (with bounds) indicating where the word likely appears, powering interactive search and highlighting. It pairs with the system **`UIFindInteraction`**: implement `UIFindInteractionDelegate` driven by search() to get the system find UI, result navigation, and highlighting in your canvas. These capabilities also let VoiceOver speak handwriting and let assistive features locate specific words."},{"t":518,"title":"Path conversion","body":"PencilKit represents stroke paths as **cubic uniform B-splines**, but Bézier paths are more common. iOS 27's `PKStrokePath` supports conversion both ways; PencilKit handles the geometry, but Bézier paths lack size, opacity, and force, so you supply those per control point. Round-tripping from a `PKStrokePath` yields identical control-point locations for lossless storage, and your own Bézier canvas can be converted into a `PKDrawing` for the recognizer."},{"t":621,"title":"Improved model access","body":"`PKStroke` and `PKStrokePath` now conform to **`Identifiable`** with stable UUIDs, letting you track a stroke across transforms, edits, and undo. With stable identity you can control selection state on `PKCanvasView`, and a new `canvasViewSelectionDidChange` delegate fires when selection changes. When inks are drawn together quickly, PencilKit composites strokes with an equal **`renderGroupID`**, which is now controllable in iOS 27."},{"t":685,"title":"Stroke slicing","body":"Slicing comes in two forms. **Programmatic erasing**: provide a `PKStrokePath` as the eraser to cut through a drawing, slicing one stroke into multiple independent masked strokes just like the eraser tool; slicing is expensive on complex drawings, so consider a background thread. **Substroke extraction**: iOS 27 adds parametric-range subscript access on `PKStroke` and `PKStrokePath` for precise slices that keep ink particles consistent."},{"t":828,"title":"Next steps","body":"Recommended actions: adopt **`PKStrokeRecognizer`** to bring handwriting recognition to your app; convert existing Bézier paths to `PKStrokePath` so recognition works even without `PKCanvasView`; dive into the model to track strokes with stable identity and respond to selection changes; and use stroke slicing for programmatic erasing and substroke animations (the presenter built Chinese stroke-order replay this way). Demo sample code is available in the video's resources."}],"code":[]},"related":[{"id":"212","title":"Rev up your CarPlay app","gloss":"強化你的 CarPlay App","gloss_en":"Rev up your CarPlay app","category":"uikit","categoryLabel":"UIKit"},{"id":"219","title":"Enhance the accessibility of your reading app","gloss":"強化你閱讀類 App 的無障礙體驗","gloss_en":"Enhance the accessibility of your reading app","category":"uikit","categoryLabel":"UIKit"},{"id":"221","title":"Prepare your tvOS apps for Dynamic Type","gloss":"讓你的 tvOS App 支援動態字型","gloss_en":"Prepare your tvOS app for Dynamic Type","category":"uikit","categoryLabel":"UIKit"},{"id":"226","title":"Create live communication experiences","gloss":"打造即時通訊體驗","gloss_en":"Build live communication experiences","category":"uikit","categoryLabel":"UIKit"},{"id":"278","title":"Modernize your UIKit app","gloss":"現代化你的 UIKit App","gloss_en":"Modernize your UIKit app","category":"uikit","categoryLabel":"UIKit"}]}</script>
