<script id="d" type="application/json">{"s":{"id":"112","title":"Platforms State of the Union (ASL)","gloss":"平台現況報告（美國手語版）","category":"other","categoryLabel":"其他","duration":3698,"url":"https://developer.apple.com/videos/play/wwdc2026/112/","takeaway":"這是面向開發者的年度技術總覽，一次掌握 Apple 各平台最新的開發框架與工具方向。","chapters":[],"points":[{"text":"面向開發者的年度重點場次，揭露 **Apple 各平台最新的技術進展**。","hot":true},{"text":"可作為規劃整年度採用新 API 與框架的**起點與索引**。","hot":false},{"text":"本場為**美國手語（ASL）**版本，提供無障礙的觀看選擇。","hot":false}],"apis":[],"audience":"**所有 Apple 平台的開發者**，想在主題演講之外更深入掌握技術細節的人。","gloss_en":"Platforms State of the Union (American Sign Language)","takeaway_en":"This is the annual developer-focused technical overview that brings you up to speed on the latest development frameworks and tooling direction across Apple's platforms in one session.","points_en":[{"text":"The annual developer highlight session, unveiling **the latest technical advances across Apple's platforms**.","hot":true},{"text":"Use it as a **starting point and index** for planning which new APIs and frameworks to adopt over the year.","hot":false},{"text":"This is the **American Sign Language (ASL)** version, offering an accessible viewing option.","hot":false}],"audience_en":"**Developers across all Apple platforms** who want to go deeper into the technical details beyond the keynote.","summary":["這是 2026 年的 **Platforms State of the Union**，Apple 從三大主軸介紹開發者今年最該關注的更新：**Apple Intelligence**、**平台改進**，以及**開發者生產力**。今年兩大貫穿全場的主題是去年起的 **Liquid Glass** 新設計與 Apple Intelligence，許多方向都受開發者回饋影響。Apple Intelligence 的核心是 **Apple Foundation Models**——今年 Apple 與 Google 合作、運用 Gemini 系列背後技術打造最新的 Foundation Models 來驅動 Apple Intelligence，並透過 **Foundation Models 框架**開放給 app 使用。","Foundation Models 框架今年大幅進化：新增**多模態提示**（文字＋圖片，並整合 Vision 框架提供 OCR 與條碼讀取等 on-device 工具），可呼叫 **server models**（Claude、Gemini 等，任何 provider 可做符合 Language Model protocol 的 Swift package），並讓首次 App Store 下載少於 200 萬的開發者**免雲端 API 費用**使用跑在 Private Cloud Compute 上的 Apple Foundation Model。新的開源 Swift package 提供 skills 與 context 管理等預建工具，建立在全新宣告式 API **Dynamic Profiles** 之上——可在同一個 `LanguageModelSession` 中持續切換 profile（換模型、指令、工具），共享同一份 transcript。配套還有 **Evaluations 框架**、升級的 Foundation Models instrument、FM 命令列工具、Python SDK，且框架今夏將**開源**。要在裝置上跑自有模型則用全新的 **Core AI** 框架（memory-safe Swift API、可轉換最佳化 PyTorch 模型、深度整合工具鏈）；研究與微調則有開源的 **MLX**（支援 Metal 4、可跨多台 Mac 訓練）。","系統智慧方面，**App Intents 框架**把 app 接上 Apple Intelligence：用 **entity schemas** 把內容貢獻到 Spotlight 語意索引以供 Siri 推理、用 **intent schemas** 讓使用者以自然語言觸發系統定義的常見動作（自動受惠於未來語言更新），並用新的 **View Annotations API** 讓使用者指涉並操作螢幕上的內容（如「這張照片」「第二則訊息」）。平台改進涵蓋：Liquid Glass 的可讀性調校、可調透明度滑桿、macOS 邊到邊側邊欄與帶色圖示、Icon Composer 多層設計；**iOS app 可調整大小**（iPhone Mirroring 與 iPad，以最新 SDK 重編譯即自動加入，附測試用 resizable simulator 與 coding agent skill）。**SwiftUI** 帶來 reorderable 容器、任意容器的 swipe actions、更強文字選取、佈局加速最多兩倍、lazy state、AsyncImage HTTP 快取、toolbar 的 visibilityPriority 與 overflow、新文件基礎架構，以及 Spatial Preview 框架。**Swift 6.4** 則改善警告抑制、`anyAppleOS`、defer 中 await，以及惡名昭彰的型別檢查逾時。","Apple 也宣布 macOS 全面轉向 **Apple silicon**（可上架 Apple silicon-only 二進位），並將移除舊設計選項——以 Xcode 27 重編譯後自動採用 Liquid Glass。開發者生產力方面，**Xcode** 有兩大故事：日常體驗（載入更快、修掉當機、體積縮小 30%、iCloud 同步設定、免設定即建專案、可自訂工具列與全 app 主題、Xcode Cloud 一鍵設定且快兩倍、Previews 可對任意屬性展開變體、全新 **Device Hub** 取代 Simulator 並整合實機）；以及**智慧**——agentic coding 深入每一層，新增渲染 Previews 變體、操作 simulator、在地化、除錯等工具，所有回答都以 Swift／SwiftUI／Apple 框架為基礎。示範了從 `/plan` 規劃、實作、用 agent 操作 simulator 測試、在地化（French）、到從 Organizer 抓 top crash 並修復的端到端流程。Xcode 27 內建 Apple 工程師與設計師的 skills、文件與 MCP 工具（如同各領域專家），並透過 plugins 支援 **Agent Client Protocol**、Anthropic／OpenAI／Google 的 agent，以及 Figma、GitHub 整合。其他工具更新還有 Reality Composer Pro 3 與加入 AI skills 的 Game Porting Toolkit。"],"deepdive":[],"summary_en":["This is the 2026 **Platforms State of the Union**, where Apple frames the year's most important developer updates around three areas: **Apple Intelligence**, **platform improvements**, and **developer productivity**. The two themes running throughout are last year's **Liquid Glass** design and Apple Intelligence, with much shaped by developer feedback. At the heart of Apple Intelligence are **Apple Foundation Models**—this year built in collaboration with Google using the technology behind the Gemini family of models to power Apple Intelligence, and exposed to apps through the **Foundation Models framework**.","The Foundation Models framework evolves significantly: new **multimodal prompts** (text plus images, with the Vision framework integrated for on-device OCR and barcode reading), the ability to call **server models** (Claude, Gemini, and more—any provider can ship a Swift package conforming to the Language Model protocol), and **no cloud API cost** for developers with fewer than 2 million first-time App Store downloads using the Apple Foundation Model on Private Cloud Compute. A new open-source Swift package provides pre-built tools like skills and context management, built on the new declarative **Dynamic Profiles** API—you can continuously switch profiles within one `LanguageModelSession` (swapping models, instructions, and tools) while sharing the same transcript. Supporting tools include the **Evaluations framework**, an upgraded Foundation Models instrument, an FM command-line tool, and a Python SDK, and the framework will be **open-sourced** this summer. To run your own models on device there's the new **Core AI** framework (a memory-safe Swift API, PyTorch conversion and optimization, deep toolchain integration); for research and fine-tuning there's open-source **MLX** (Metal 4, multi-Mac training).","For system intelligence, the **App Intents framework** connects apps to Apple Intelligence: use **entity schemas** to contribute content to the Spotlight semantic index for Siri to reason over, **intent schemas** to let users trigger system-defined common actions via natural language (benefiting from future language updates automatically), and the new **View Annotations API** to let users reference and act on on-screen content ('this photo', 'the second message'). Platform improvements span Liquid Glass readability tuning, an adjustable-transparency slider, edge-to-edge sidebars and colored icons on macOS, and multi-layer Icon Composer design; **resizable iOS apps** (in iPhone Mirroring and on iPad, auto-opted-in when recompiled against the latest SDK, with a resizable simulator and a coding-agent skill for testing). **SwiftUI** brings reorderable containers, swipe actions in any container, richer text selection, layouts up to 2x faster, lazy state, AsyncImage HTTP caching, toolbar visibilityPriority and overflow, new document infrastructure, and the Spatial Preview framework. **Swift 6.4** improves warning suppression, `anyAppleOS`, await in defer, and the notorious type-check timeout.","Apple also announces macOS is fully on **Apple silicon** (you can ship Apple silicon-only binaries) and will remove the old-design opt-out—recompiling with Xcode 27 adopts Liquid Glass automatically. For developer productivity, **Xcode** has two stories: the daily experience (faster project loading, fewer crashes, 30% smaller, iCloud settings sync, no-setup project creation, customizable toolbar and full-app themes, one-click Xcode Cloud that's 2x faster, Previews variants for any property, and a new **Device Hub** that replaces Simulator and integrates physical devices); and **intelligence**—agentic coding woven into every layer, with new tools to render Preview variants, drive the simulator, localize, and debug, all grounded in Swift, SwiftUI, and Apple frameworks. It demos an end-to-end flow from `/plan` to implementation, agent-driven simulator testing, French localization, and pulling top crashes from the Organizer to fix them. Xcode 27 ships Apple's engineers' and designers' expertise as skills, docs, and MCP tools (like specialists), and supports the **Agent Client Protocol**, Anthropic/OpenAI/Google agents, and Figma/GitHub integrations via plugins. Other tool updates include Reality Composer Pro 3 and a Game Porting Toolkit with AI skills."],"deepdive_en":[],"code":[]},"related":[{"id":"101","title":"Keynote","gloss":"主題演講","gloss_en":"Keynote","category":"other","categoryLabel":"其他"},{"id":"102","title":"Platforms State of the Union","gloss":"平台現況報告","gloss_en":"Platforms State of the Union","category":"other","categoryLabel":"其他"},{"id":"111","title":"Keynote (ASL)","gloss":"主題演講(美國手語版)","gloss_en":"Keynote (American Sign Language)","category":"other","categoryLabel":"其他"},{"id":"122","title":"WWDC26 Platforms State of the Union Recap","gloss":"WWDC26 平台現況演講重點回顧","gloss_en":"WWDC26 Platforms State of the Union recap","category":"other","categoryLabel":"其他"},{"id":"204","title":"What’s new in WebKit for Safari 27","gloss":"Safari 27 中 WebKit 的新功能","gloss_en":"What's new in WebKit for Safari 27","category":"other","categoryLabel":"其他"}]}</script>
