<script id="d" type="application/json">{"s":{"id":"357","title":"Speedrun your game port with agentic coding","gloss":"用代理式編碼加速遊戲移植","category":"graphics","categoryLabel":"圖形與遊戲","duration":1680,"url":"https://developer.apple.com/videos/play/wwdc2026/357/","takeaway":"用 Game Porting Toolkit 4 的新代理式技能，大幅加速把遊戲移植到 Apple 平台，並把 D3D12 對應到 Metal 4。","chapters":[[0,"Introduction"],[66,"Porting assistant workflow"],[211,"Install Game Porting Toolkit skills"],[385,"Windowing and frame pacing"],[508,"Scene rendering with Metal 4"],[624,"Register resources for residency"],[685,"Query argument buffer offsets"],[754,"Map D3D12 states to Metal 4 stages"],[864,"Query shader reflection parameter count"],[916,"Debugging with GPU command-line tools"],[1149,"Game controllers and MetalFX"],[1511,"Next steps"]],"points":[{"text":"**Game Porting Toolkit 4** 新增**代理式技能（agentic skills）**，可大幅加速遊戲移植到 Apple 平台的歷程。","hot":true},{"text":"透過 **/plugin** 安裝 game-porting-skills，並導入移植助理工作流程，處理視窗化與**影格節奏（frame pacing）**。","hot":false},{"text":"用 **Metal 4** 算繪場景：登錄資源 residency、查詢 argument buffer 位移，並把 **D3D12** 狀態對應到 Metal 4 階段。","hot":false},{"text":"用 **IRShaderReflection** 查詢著色器參數數量，並借助 GPU 命令列工具除錯。","hot":false},{"text":"整合遊戲控制器與 **MetalFX**，完善移植後的輸入與升頻體驗。","hot":false}],"apis":["Game Porting Toolkit","Metal 4","MetalFX","IRShaderReflection","D3D12"],"audience":"**要把 Windows/D3D12 遊戲移植到 Apple 平台**、想用 AI 代理加速移植與 Metal 4 轉換的遊戲開發者。","gloss_en":"Speedrun your game port with agentic coding","takeaway_en":"Use the new agentic skills in Game Porting Toolkit 4 to dramatically accelerate porting your game to Apple platforms, and map D3D12 to Metal 4.","points_en":[{"text":"**Game Porting Toolkit 4** adds **agentic skills** that can dramatically accelerate the journey of porting games to Apple platforms.","hot":true},{"text":"Install game-porting-skills via **/plugin** and adopt the porting-assistant workflow to handle windowing and **frame pacing**.","hot":false},{"text":"Render scenes with **Metal 4**: register resource residency, query argument buffer offsets, and map **D3D12** state to Metal 4 stages.","hot":false},{"text":"Use **IRShaderReflection** to query shader parameter counts, and debug with the help of GPU command-line tools.","hot":false},{"text":"Integrate game controllers and **MetalFX** to round out input and upscaling for the ported experience.","hot":false}],"audience_en":"Game developers who **want to port Windows/D3D12 games to Apple platforms** and use AI agents to accelerate the port and the Metal 4 conversion.","summary":["這場由 Metal 生態系團隊的 David Srour 主講，核心訊息是：coding agent 正在徹底改變遊戲移植的方式，過去需要數月的手動平台工作，現在能在極短時間內完成。**Game Porting Toolkit 4** 帶來全新的 **agentic skills**，讓你的 coding agent 具備把遊戲移植到 Apple 平台所需的專業知識，速度與品質都遠勝以往。整個工具組分成三類：提供技術指引的 **expert skills**、提供結構化流程的 **workflow skills**，以及把兩者串起來的 **porting assistant** 代理人。","porting assistant 採用 discover、plan、execute／validate 的三階段方法論。**discover** 會分析你的程式碼庫、從評估環境抓取 ground truth 參考擷取，並詢問你的偏好；接著與你一起規劃 **milestone** 目標（因為整套遊戲通常太大，無法一次完成）；每個 milestone 執行時會自動載入必要的 expert skills，不依賴模型是否「想到」要用，最後再透過 validation 多點檢查清單（app 是否啟動、Metal validation、螢幕擷取比對 ground truth、anti-pattern 審查、記憶體問題等）逐項把關。講者以移植 Microsoft 的 D3D12 開源引擎 **MiniEngine** 從 Windows 到 macOS 為例，全程使用 **Claude Code**。","移植過程依序攻克數個目標：以 **Metal display link** 驅動 render loop 的視窗與 frame pacing；用 **Metal 4** 的顯式記憶體管理與全新 command 結構帶起 renderer（包含把資源註冊到 **residency set**、從 **Metal shader converter** runtime 查詢 argument buffer offset、把 D3D12 狀態映射到 Metal 4 的 producer-consumer barrier 模型、用 shader reflection 查出真正的參數數量）；再加上 **GCController** 的遊戲控制器支援；以及 **MetalFX** 的 temporal upscaling 與 frame interpolation。每個環節 skill 都會擋下常見的反模式，避免無聲無息的渲染錯誤。","實務上最重要的突破是 **macOS 27** 推出的命令列工具 **gpucapture** 與 **gpudebug**，讓 agent 能完全自主地擷取並分析 GPU frame trace（檢查資源綁定、constants、資料流向），把除錯從「猜測」變成「系統化定位」。Metal HUD 也擴充了 MetalFX 的除錯能力（exposure、jitter scatter plot、可即時覆寫 motion vector scale）。講者最後把同一套 skills 套用到生產級引擎 **Godot**，幾天內就讓 Metal 4 backend 跑起來，證明此方法可擴展到大型專案。"],"deepdive":[{"t":0,"title":"Introduction","body":"由 Metal 生態系團隊的 David Srour 開場，點出 coding agent 正在根本性地改變軟體開發方式，遊戲移植也不例外。過去需要數月的手動平台工作，如今透過 **Game Porting Toolkit 4** 的全新 **agentic skills**，能在極短時間內以更高品質完成，因為這些 skill 替 agent 補上了移植到 Apple 平台所需的專業知識。"},{"t":66,"title":"Porting assistant workflow","body":"說明 porting assistant 的三階段方法論：**discover** 分析程式碼庫、抓取評估環境的 ground truth 擷取並詢問偏好；接著規劃 **milestone** 目標，把龐大的移植拆成可單場完成的單位；每個 milestone 自動載入必要的 expert skills，不依賴模型自行決定，最後以 **validation** 多點檢查清單逐項把關。agent 還會跨 milestone 儲存所學，避免知識在不同 session 間遺失。"},{"t":211,"title":"Install Game Porting Toolkit skills","body":"skills 與 assistant 以 plugin 形式提供，來自 GitHub 上的 **Game Porting Toolkit marketplace**。流程是先 `add` marketplace、再 `install` plugin，所有 skill 隨即就緒。若不確定下一步該做什麼，可直接詢問 porting assistant，它會引導你走過結構化的 discovery 與 planning 流程。"},{"t":385,"title":"Windowing and frame pacing","body":"windowing 與 frame pacing 這個 milestone 需要數個 skill 協同運作：window skill 負責視窗建立與生命週期、translating to Metal 映射 D3D12 的 swap chain 概念、presenting drawables 處理 frame pacing、metal-cpp 教導正確的 Metal 物件生命週期。技術上用 **Metal display link** 驅動 render loop、處理 focus／fullscreen 事件、最佳化 layer 的解析度與 color space，並善用 **direct-to-display** 降低延遲、妥善管理 drawable 生命週期避免卡頓。最終成果是平滑的 color clear 動畫與穩定的 frame pacing。"},{"t":508,"title":"Scene rendering with Metal 4","body":"用 **Metal 4** 帶起 renderer，鎖定 lighting、shadows、SSAO 與 tone mapping 作為 first playable。scene rendering 拆成三個 milestone：GPU resources、shader pipelines、command encoding。resources skill 教導該用哪些 storage mode（含 Apple silicon tile 架構專屬選項）、constants 透過 buffer 傳遞的配置模式，shader pipeline／converter skill 把 HLSL shader 接上 Metal 的綁定模型，synchronization skill 提供 pass 之間的同步模式。"},{"t":624,"title":"Register resources for residency","body":"示範 resources skill 如何教 agent 在使用前、且要在 application 中更早的時機，就把資源註冊進 **residency set**，確保 GPU 需要時每個資源都可存取。對照組顯示：沒有 skill 時 agent 不知道這個步驟存在，雖然程式能編譯，但 GPU 無法如預期讀取 texture，導致渲染結果錯誤。"},{"t":685,"title":"Query argument buffer offsets","body":"示範 shader pipeline／converter skill 教 agent 從 **Metal shader converter** runtime 查詢 argument buffer offset，以確保與 shader 期望的版面一致。對照組顯示：沒有 skill 時 agent 會沿用 MiniEngine 以 index 乘 size 計算 offset 的舊做法，但 Metal shader converter 的版面可能不同，導致 offset 錯誤——沒有錯誤訊息，只有不正確的渲染。"},{"t":754,"title":"Map D3D12 states to Metal 4 stages","body":"示範 synchronization skill 教 agent 把 D3D12 狀態映射到 **Metal 4** 的 producer-consumer 模型，從一開始就實作正確的同步。Metal 4 採用完全顯式的同步，單一 command buffer 內的多個 encoder 之間需要適當的 barrier。對照組顯示：沒有 skill 時 agent 只會在 encoder 邊界放上寬鬆的 blanket barrier，簡單情況或許可行，但隨著渲染管線變複雜會無聲無息地壞掉。"},{"t":864,"title":"Query shader reflection parameter count","body":"示範 shader converter skill 教 agent 利用 **Metal shader converter** 的 reflection 查詢 shader 實際的參數數量。對照組顯示：沒有 skill 時 agent 沿用引擎原本的 5 個 root parameter，但 Metal shader converter 從 HLSL shader 判定版面其實只宣告 4 個，這個不符會把 sampler table 推到錯誤的 offset，造成渲染異常。"},{"t":916,"title":"Debugging with GPU command-line tools","body":"**macOS 27** 推出支援完全自主 agent 工作流的命令列工具：**gpucapture** 擷取 GPU frame、**gpudebug** 分析擷取。在 debugging rendering issues skill 的結構化方法論下，agent 從視覺症狀（lighting 錯誤、牆面 texture 被拉伸）出發，擷取 GPU trace 並檢查資源綁定、constants、資料流向，系統化地定位偏離 ground truth 之處並修正。validation 階段再次用這些工具比對 dispatch 呼叫、pipeline 與 dispatch 維度，把原本繁瑣的人工比對自動化。"},{"t":1149,"title":"Game controllers and MetalFX","body":"controller skill 涵蓋 **GCController** 探索、input 模型與從 Windows API 的移植：相較於 XInput 固定的版面，skill 教 agent 改為查詢每個 controller 實際支援的能力與輸入，並提供正確的連線／斷線處理。接著整合 **MetalFX**：upscaling skill 處理 jitter（pixel space）、motion vector 規模與 history reprojection，frame interpolation skill 設定專屬 present thread 與精確時序。Metal HUD 在 macOS 27 擴充了 exposure、jitter scatter plot 與可即時覆寫的 motion vector scale，協助除錯整合問題。"},{"t":1511,"title":"Next steps","body":"總結 **Game Porting Toolkit 4** 的 agentic skills 如何加速把遊戲帶到 Apple 平台：porting assistant 提供結構化方法、skills 結合知識與最佳實務。講者最後展示把同一套 skills 套用到生產級引擎 **Godot**（在既有 Metal 3 backend 旁加上 Metal 4），幾天內就跑起來，證明可擴展到大型專案。行動建議是下載安裝 skills、在自己的遊戲程式碼庫上試用、並讓 porting assistant 引導整個移植流程。"}],"summary_en":["Presented by David Srour of the Metal Ecosystem Team, the core message is that coding agents are fundamentally changing how games get ported: work that used to take months of manual platform effort can now happen in a fraction of the time. **Game Porting Toolkit 4** introduces new **agentic skills** that give your coding agent the platform expertise it needs to port your game to Apple platforms, with both speed and quality far beyond before. The toolkit has three parts: **expert skills** that provide technical guidance, **workflow skills** that provide a structured approach, and the **porting assistant** agent that ties them together.","The porting assistant follows a three-stage methodology of discover, plan, and execute/validate. **Discover** analyzes your codebase, grabs ground-truth reference captures from the evaluation environment, and asks about your preferences; then you plan **milestones** together (since a whole title is too large for one session); each milestone automatically loads the necessary expert skills rather than relying on the model to choose them, and finally a validation checklist (does the app launch, Metal validation, screen captures compared against ground truth, anti-pattern review, memory issues, and more) checks each milestone. The demo ports Microsoft's D3D12 open-source engine **MiniEngine** from Windows to macOS, entirely with **Claude Code**.","The port works through several goals in order: window and frame pacing driven by a **Metal display link**; bringing up the renderer with **Metal 4**'s explicit memory management and new command structure (registering resources in a **residency set**, querying argument buffer offsets from the **Metal shader converter** runtime, mapping D3D12 states to Metal 4's producer-consumer barrier model, and using shader reflection to find the real parameter count); adding **GCController** gamepad support; and integrating **MetalFX** temporal upscaling and frame interpolation. At each step the skills act as guardrails that catch common anti-patterns and silent rendering bugs.","The most important practical breakthrough is **macOS 27**'s command-line tools **gpucapture** and **gpudebug**, which let the agent fully autonomously capture and analyze a GPU frame trace (inspecting resource bindings, constants, and data flow), turning debugging from guesswork into systematic root-causing. The Metal HUD also gains MetalFX debugging features (exposure, a jitter scatter plot, and live overrides of motion vector scale). Finally, the same skills are applied to the production-grade **Godot** engine, getting a Metal 4 backend running in a few days, proving the approach scales beyond small engines."],"deepdive_en":[{"t":0,"title":"Introduction","body":"David Srour of the Metal Ecosystem Team opens by noting that coding agents are fundamentally changing software development, and game porting is no different. What used to take months of manual platform work can now happen far faster and with better quality through **Game Porting Toolkit 4**'s new **agentic skills**, which give the agent the expertise needed to port games to Apple platforms."},{"t":66,"title":"Porting assistant workflow","body":"The porting assistant's three-stage methodology: **discover** analyzes the codebase, grabs ground-truth captures from the evaluation environment, and asks about preferences; then **milestone** goals are planned to break a huge port into single-session units; each milestone automatically loads the necessary expert skills rather than relying on the model, and a **validation** checklist verifies each one. The agent also stores what it learns across milestones so knowledge isn't lost between sessions."},{"t":211,"title":"Install Game Porting Toolkit skills","body":"The skills and assistant ship as a plugin from the **Game Porting Toolkit marketplace** on GitHub. You first add the marketplace, then install the plugin, and all skills are ready. If you're unsure what to do next, just ask the porting assistant and it will guide you through the structured discovery and planning workflow."},{"t":385,"title":"Windowing and frame pacing","body":"The windowing and frame pacing milestone needs several skills working together: the window skill for window creation and lifecycle, translating-to-Metal for mapping D3D12's swap chain concepts, presenting-drawables for frame pacing, and metal-cpp for correct Metal object lifetimes. Technically it sets up a **Metal display link** for the render loop, handles focus/fullscreen events, optimizes layer resolution and color space, and leverages **direct-to-display** for lower latency while managing drawable lifetimes to avoid stuttering. The result is a smooth color-clear animation with steady frame pacing."},{"t":508,"title":"Scene rendering with Metal 4","body":"Bringing up the renderer with **Metal 4**, targeting lighting, shadows, SSAO and tone mapping for first playable. Scene rendering splits into three milestones: GPU resources, shader pipelines, and command encoding. The resources skill teaches which storage modes to use (including options specific to Apple silicon's tile architecture) and the allocation pattern for constants passed through buffers, the shader pipeline/converter skills wire HLSL shaders through Metal's binding model, and the synchronization skill provides the patterns between passes."},{"t":624,"title":"Register resources for residency","body":"Demonstrates the resources skill teaching the agent to register resources in a **residency set** before use, much earlier in the application, so every resource is accessible when the GPU needs it. Without the skill the agent doesn't know this step is needed; the code compiles, but the GPU can't read the texture as expected, causing incorrect results."},{"t":685,"title":"Query argument buffer offsets","body":"Demonstrates the shader pipeline/converter skill teaching the agent to query argument buffer offsets from the **Metal shader converter** runtime so they match what the shader expects. Without the skill the agent copies MiniEngine's pattern of index-times-size, but the Metal shader converter layout can differ, making the offsets wrong — no error, just incorrect rendering."},{"t":754,"title":"Map D3D12 states to Metal 4 stages","body":"Demonstrates the synchronization skill teaching the agent to map D3D12 states to **Metal 4**'s producer-consumer model, implementing correct synchronization from the start. Metal 4 uses fully explicit synchronization, and multiple encoders in one command buffer need proper barriers. Without the skill the agent resorts to broad blanket barriers at encoder boundaries, which may work for simple cases but can silently break as the pipeline grows more complex."},{"t":864,"title":"Query shader reflection parameter count","body":"Demonstrates the shader converter skill teaching the agent to use **Metal shader converter**'s reflection to query the shader's actual parameter count. Without the skill the agent carries over the engine's original 5 root parameters, but the converter determines from the HLSL shader that only 4 are declared; that mismatch shifts the sampler table to the wrong offset and breaks rendering."},{"t":916,"title":"Debugging with GPU command-line tools","body":"**macOS 27** introduces command-line tools for fully autonomous agent workflows: **gpucapture** to capture a GPU frame and **gpudebug** to analyze it. Guided by the debugging-rendering-issues skill's structured methodology, the agent starts from visual symptoms (wrong lighting, stretched wall textures), captures a GPU trace, inspects resource bindings, constants and data flow, and systematically traces where things diverge from ground truth before fixing it. Validation reuses these tools to compare dispatch calls, pipelines and dispatch dimensions, automating what was previously tedious manual comparison."},{"t":1149,"title":"Game controllers and MetalFX","body":"The controller skill covers **GCController** discovery, the input model, and porting from Windows APIs: rather than XInput's fixed layout, it teaches the agent to query what each controller actually supports and to handle connect/disconnect gracefully. Then **MetalFX** integration: the upscaling skill handles jitter in pixel space, motion vector scale and conventions, MIP bias and history reprojection, while the frame interpolation skill sets up a dedicated present thread and precise timing. The Metal HUD in macOS 27 adds exposure, a jitter scatter plot, and live overrides of motion vector scale to help debug the integration."},{"t":1511,"title":"Next steps","body":"Recaps how **Game Porting Toolkit 4**'s agentic skills accelerate bringing games to Apple platforms: the porting assistant provides a structured approach and the skills combine knowledge with best practices. The talk closes by applying the same skills to the production-grade **Godot** engine (adding Metal 4 alongside its existing Metal 3 backend), getting it running in a few days and proving the approach scales. The call to action is to download and install the skills, try them on your own game's codebase, and let the porting assistant guide the process."}],"code":[]},"related":[{"id":"356","title":"Bringing Cyberpunk 2077 to Mac","gloss":"將《電馭叛客 2077》帶上 Mac","gloss_en":"Bringing Cyberpunk 2077 to Mac","category":"graphics","categoryLabel":"圖形與遊戲"},{"id":"359","title":"Build real-time neural rendering pipelines with Metal","gloss":"用 Metal 打造即時神經渲染管線","gloss_en":"Build real-time neural rendering pipelines with Metal","category":"graphics","categoryLabel":"圖形與遊戲"},{"id":"215","title":"Get started with the HTML Model Element","gloss":"開始使用 HTML model 元素","gloss_en":"Getting started with the HTML model element","category":"graphics","categoryLabel":"圖形與遊戲"},{"id":"252","title":"Design no-code games with Reality Composer Pro 3","gloss":"用 Reality Composer Pro 3 設計無程式碼遊戲","gloss_en":"Design no-code games with Reality Composer Pro 3","category":"graphics","categoryLabel":"圖形與遊戲"},{"id":"256","title":"Discover generated subtitles and subtitle styles","gloss":"認識自動產生字幕與字幕樣式","gloss_en":"Discover generated subtitles and subtitle styles","category":"graphics","categoryLabel":"圖形與遊戲"}]}</script>
