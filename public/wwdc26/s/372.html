<script id="d" type="application/json">{"s":{"id":"372","title":"Unwrap PaperKit","gloss":"深入了解 PaperKit","category":"uikit","categoryLabel":"UIKit","duration":459,"url":"https://developer.apple.com/videos/play/wwdc2026/372/","takeaway":"用 PaperKit 全新的資料模型 API 以程式存取、建立與修改畫布上的 markup 元素，並結合 adornments 與 Image Playground 打造互動式畫布應用。","chapters":[[0,"Introduction"],[82,"Data model"],[96,"Creating markup subelements"],[183,"Making template elements read-only"],[221,"Elements"],[262,"Apply style to template elements"],[317,"Adornments"],[353,"Add adornments to each panel"],[368,"Handle adornment taps"],[380,"Place the generated image"],[431,"Next steps"]],"points":[{"text":"**PaperKit** 推出全新的**資料模型 API**，可用程式存取、建立與修改畫布上的 markup 元素（`PaperMarkup`、`MarkupOrderedSet`）。","hot":true},{"text":"可建立 `ShapeMarkup` 等 subelement，並用 `allowedInteractions = .readOnly` 把模板元素設為唯讀。","hot":false},{"text":"用 **adornments**（`MarkupAdornment`）在畫布上加入可點擊的浮動按鈕，並透過 delegate 處理點擊事件。","hot":false},{"text":"結合 **Image Playground**（`ImagePlaygroundViewController`）產生圖片，再以 `ImageMarkup` 放置到對應面板中。","hot":false}],"apis":["PaperKit","PaperMarkup","PaperMarkupViewController","MarkupOrderedSet","ShapeMarkup","ImageMarkup","MarkupAdornment","ImagePlayground","ImagePlaygroundViewController"],"audience":"**開發畫布、繪圖、筆記或標註類 App，想以程式控制 PaperKit 內容的開發者**。","gloss_en":"Unwrap PaperKit","takeaway_en":"Use PaperKit's new data model APIs to programmatically access, create, and modify markup elements on the canvas, combining adornments and Image Playground to build interactive canvas apps.","points_en":[{"text":"**PaperKit** introduces new **data model APIs** to programmatically access, create, and modify markup elements on the canvas (`PaperMarkup`, `MarkupOrderedSet`).","hot":true},{"text":"You can create subelements like `ShapeMarkup` and use `allowedInteractions = .readOnly` to make template elements read-only.","hot":false},{"text":"Use **adornments** (`MarkupAdornment`) to add tappable floating buttons on the canvas, handling tap events through a delegate.","hot":false},{"text":"Combine with **Image Playground** (`ImagePlaygroundViewController`) to generate images, then place them into the corresponding panel with `ImageMarkup`.","hot":false}],"audience_en":"**Developers building canvas, drawing, note-taking, or markup apps who want to control PaperKit content programmatically**.","summary":["這場由 Pencil and Paper 團隊的工程師 Matt 主講，主題是「解開（unwrap）」**PaperKit**——也就是驅動 Apple 自家眾多畫布體驗的框架：Notes 的塗鴉與標記、Preview 中替 PDF 加簽名與螢光標記、macOS Freeform 的構思畫布，背後都是 PaperKit，整合了 pencil、shapes、text 與 images。在 iOS、macOS 與 visionOS 27，PaperKit 進一步開放，讓開發者能完全掌控自己的畫布體驗。講者以自製的漫畫編輯器為貫穿範例，依序帶過三大主題：資料模型、元素（elements），以及 adornments。","第一是**資料模型**。`PaperMarkup` 新增了 **`subelements`** 屬性，以 **`MarkupOrderedSet`**（可讀可寫的有序集合）暴露畫布上的每個元素。範例為每個漫畫格建立一個 **`ShapeMarkup`** 並寫回 markup。但預設畫布完全可互動——使用者能選取、拖曳甚至刪除範本格子，這並非所求。每個元素都遵循 **Markup** protocol，提供 frame、rotation 等共通屬性，並新增 **`allowedInteractions`**（一個 **`MarkupInteractions`** option set），可細緻控制移動／縮放／旋轉、刪除、styling、選取等行為；要一次鎖死全部就用 **`.readOnly`**，正好讓漫畫範本固定不動。","第二是**元素**。PaperMarkup 中每個元素都有具體型別——shapes、images、links、loupes、pencil strokes——同屬一個 ordered set 並遵循 Markup protocol，但各自有自訂屬性，例如 rounded rectangle 的 corner radius、curved line 的 control points。範例用 rectangle 當漫畫格，藉由迭代 subelements 設定 `strokeColor` 與 `fillColor`（並把同色套到 markup 背景）來實作色彩 styling。由於 PaperKit 建構在 **PencilKit** 之上，可用 Apple Pencil 繪製，每一筆都是 markup 元素，並可使用 PencilKit 的 model API（現支援字元辨識與 Bézier path 轉換）。","第三是 **adornments**。講者想替每格加上「建立圖稿」的按鈕，但不希望這些控制項成為文件的一部分、被儲存或匯出。**`MarkupAdornment`** 正是錨定在畫布座標的視覺覆蓋層，會自動隨 zoom 與 scroll 追蹤，且與持久化的 markup 完全分離,非常適合按鈕、註解與協作 UI。範例為每格建立錨定中心的 adornment、用 SF Symbol 當圖示，實作 delegate 的 **`didTapAdornmentWithID`**，點擊時呈現 **`ImagePlaygroundViewController`**；當 Image Playground 回傳影像時建立 **`ImageMarkup`** 插入 subelements 並更新畫布。最終以資料模型程式化讀寫畫布內容、用 adornments 加上量身打造的互動覆蓋層，就能在 app 中打造完整互動的畫布體驗。"],"deepdive":[{"t":0,"title":"Introduction","body":"由 Pencil and Paper 團隊工程師 Matt 開場，說明 **PaperKit** 驅動了 Apple 自家眾多畫布體驗：Notes 的塗鴉與標記、Preview 替 PDF 加簽名與螢光標記、macOS Freeform 的構思，整合了 pencil、shapes、text、images。在 **iOS、macOS 與 visionOS 27** PaperKit 進一步開放，本場將依序示範資料模型、elements 與 adornments 三大主題。"},{"t":82,"title":"Data model","body":"進入資料模型主題：`PaperMarkup` 新增 **`subelements`** 屬性，以 **`MarkupOrderedSet`**（可讀寫的有序集合）暴露畫布上的每個元素。講者以自製漫畫編輯器為例，已備好基本範本，接下來要把這些範本轉成 PaperMarkup。"},{"t":96,"title":"Creating markup subelements","body":"示範如何為每個漫畫格建立元素：程式碼為每個 panel frame 建立一個 **`ShapeMarkup`**、append 進 `subelements`，再寫回 markup。在 iPad 上加入三頁版面後，畫格如預期顯示，且畫布完全可互動——這也埋下下一節要解決的問題。"},{"t":183,"title":"Making template elements read-only","body":"點出問題：預設畫布可互動，使用者能選取、拖曳甚至刪除範本格子。每個元素遵循 **Markup** protocol（提供 frame、rotation 等），並新增 **`allowedInteractions`**（一個 **`MarkupInteractions`** option set）細緻控制移動／縮放／旋轉、刪除、styling、選取；用 **`.readOnly`** 可一次鎖死全部，讓範本格子固定，但仍能新增、移動與美化 speech bubble。"},{"t":221,"title":"Elements","body":"說明 PaperMarkup 中每個元素都有具體型別——shapes、images、links、loupes、pencil strokes——同屬一個 ordered set 並遵循 Markup protocol，但各自有自訂屬性。以 shapes 為例，不同 shape 型別有各自屬性，例如 rounded rectangle 的 corner radius 或 curved line 的 control points;漫畫格用的 rectangle 具有 stroke color，正是 styling 要操作的對象。"},{"t":262,"title":"Apply style to template elements","body":"示範色彩 styling 的實作：迭代 `subelements`、把每個元素的 `strokeColor` 與 `fillColor` 設為選取的顏色（fill 用 0.15 alpha），並把同色套到 markup 的 `backgroundColor` 讓畫面更有整體感，最後更新 `paperMarkupViewController.markup`。並補充 PaperKit 建構在 **PencilKit** 之上，可用 Apple Pencil 繪製、每筆皆為 markup 元素,且支援 PencilKit 的字元辨識與 Bézier path 轉換。"},{"t":317,"title":"Adornments","body":"進入 adornments 主題：講者想替每格加上建立圖稿的按鈕，但不希望這些控制項成為文件、被儲存或匯出。**`MarkupAdornment`** 是錨定在畫布座標的視覺覆蓋層，會自動隨 zoom 與 scroll 追蹤、與持久化 markup 完全分離,非常適合按鈕、註解與協作 UI。"},{"t":353,"title":"Add adornments to each panel","body":"示範如何為每格建立 **`MarkupAdornment`**：錨定到 panel 中心、透過 `imageConfiguration` 給一個 SF Symbol 圖示（`photo.badge.plus`），並設定 `dragRegion` 與 `scalesWithZoom`,再把陣列指派給 controller 的 `adornments` 屬性。同時用字典記錄 adornment id 與 panel index 的對應。"},{"t":368,"title":"Handle adornment taps","body":"示範點擊處理：實作 delegate 方法 **`didTapAdornmentWithID`**，從對應字典取得被點的 panel index，建立並呈現 **`ImagePlaygroundViewController`**（設定 delegate 為自己），讓使用者為該格產生圖稿。"},{"t":380,"title":"Place the generated image","body":"當 Image Playground 回傳影像時，於 `didCreateImageAt` 取得影像、以該格的 frame 建立 **`ImageMarkup`**，append 進 `markup.subelements` 並更新 view controller 的 markup，讓生成的圖填滿畫格。講者藉此完成漫畫第一頁（超級英雄狗狗的故事）。"},{"t":431,"title":"Next steps","body":"總結：現在可用 PaperKit 在 app 中打造完整互動的畫布體驗——用**資料模型**程式化讀寫畫布內容、用 **adornments** 建立量身打造的互動覆蓋層。鼓勵開發者動手 unwrap PaperKit。"}],"summary_en":["Presented by Matt, an engineer on the Pencil and Paper team, this session shows how to 'unwrap' **PaperKit**—the framework powering many of Apple's own canvas experiences: sketching and markup in Notes, signing and highlighting PDFs in Preview, and ideating on the Freeform canvas on macOS, all combining pencil, shapes, text, and images. In iOS, macOS, and visionOS 27, PaperKit opens up so developers can take full control of their own canvas experience. Using a homemade comic book editor as the running example, Matt walks through three topics in turn: the data model, elements, and adornments.","First is the **data model**. `PaperMarkup` gains a new **`subelements`** property that exposes every element on the canvas as a **`MarkupOrderedSet`**, an ordered collection you can read from and write to. The example creates a **`ShapeMarkup`** for each comic panel and writes the markup back. But by default the canvas is fully interactive—users can select, drag, and even delete the template panels, which isn't desired. Every element conforms to the **Markup** protocol, which provides common properties like frame and rotation, plus a new **`allowedInteractions`** property (a **`MarkupInteractions`** option set) for fine-grained control over moving/resizing/rotating, deleting, styling, and selecting; to lock everything at once you use **`.readOnly`**, which keeps the comic template fixed.","Second are **elements**. Every element in PaperMarkup has a concrete type—shapes, images, links, loupes, and pencil strokes—all part of the same ordered set and conforming to the Markup protocol, yet each with its own custom properties such as corner radius for rounded rectangles or control points for curved lines. The example uses rectangles for the panels and implements color styling by iterating over subelements to set `strokeColor` and `fillColor` (and applying the same color to the markup background). Because PaperKit is built on **PencilKit**, you can draw with Apple Pencil, where each stroke becomes a markup element and you can use the PencilKit model APIs—which now support character recognition and Bézier path conversion.","Third are **adornments**. Matt wants a button on each panel for creating artwork, but doesn't want those controls to become part of the document, saved or exported. A **`MarkupAdornment`** is a visual overlay anchored to canvas coordinates that automatically tracks zoom and scroll and is completely separate from the persisted markup—ideal for buttons, annotations, and collaboration UI. The example creates an adornment anchored to each panel's center with an SF Symbol icon, implements the delegate's **`didTapAdornmentWithID`** to present an **`ImagePlaygroundViewController`** on tap, and when Image Playground returns an image, creates an **`ImageMarkup`**, inserts it into subelements, and updates the canvas. The result: read and modify the canvas programmatically via the data model and add tailored interactive overlays with adornments to build a fully interactive canvas experience."],"deepdive_en":[{"t":0,"title":"Introduction","body":"Matt, an engineer on the Pencil and Paper team, opens by explaining that **PaperKit** powers many of Apple's own canvas experiences: sketching and markup in Notes, signing and highlighting PDFs in Preview, and ideating in Freeform on macOS, combining pencil, shapes, text, and images. In **iOS, macOS, and visionOS 27** PaperKit opens up, and this session will walk through three topics in order: the data model, elements, and adornments."},{"t":82,"title":"Data model","body":"Enters the data model: `PaperMarkup` gains a new **`subelements`** property that exposes every element on the canvas as a **`MarkupOrderedSet`**, a read/write ordered collection. Matt uses a homemade comic book editor with basic templates already set up, and now needs to turn those templates into PaperMarkup."},{"t":96,"title":"Creating markup subelements","body":"Demonstrates creating an element per panel: the code makes a **`ShapeMarkup`** for each panel frame, appends it to `subelements`, and writes the markup back. After adding a three-page layout on iPad, the panels show up as intended and the canvas is fully interactive—which sets up the problem solved in the next chapter."},{"t":183,"title":"Making template elements read-only","body":"Identifies the problem: by default the canvas is interactive, so users can select, drag, and even delete the template panels. Every element conforms to the **Markup** protocol (frame, rotation, etc.) and gains a new **`allowedInteractions`** property (a **`MarkupInteractions`** option set) for fine control over moving/resizing/rotating, deleting, styling, and selecting; **`.readOnly`** locks everything at once, keeping panels fixed while still allowing a speech bubble to be added, moved, and stylized."},{"t":221,"title":"Elements","body":"Explains that every element in PaperMarkup has a concrete type—shapes, images, links, loupes, and pencil strokes—all part of the same ordered set and conforming to the Markup protocol, yet each with its own custom properties. Taking shapes as an example, different shape types have their own properties such as corner radius for rounded rectangles or control points for curved lines; the rectangles used for the comic panels have a stroke color, which is exactly what styling will target."},{"t":262,"title":"Apply style to template elements","body":"Demonstrates color styling: iterate over `subelements`, set each element's `strokeColor` and `fillColor` to the chosen color (fill at 0.15 alpha), apply the same color to the markup's `backgroundColor` for a cohesive look, then update `paperMarkupViewController.markup`. Also notes that PaperKit is built on **PencilKit**, so Apple Pencil drawing works—each stroke is a markup element—and the PencilKit model APIs now support character recognition and Bézier path conversion."},{"t":317,"title":"Adornments","body":"Enters adornments: Matt wants a button on each panel to create artwork, but doesn't want those controls to become part of the document, saved or exported. A **`MarkupAdornment`** is a visual overlay anchored to canvas coordinates that automatically tracks zoom and scroll and is completely separate from the persisted markup—ideal for buttons, annotations, and collaboration UI."},{"t":353,"title":"Add adornments to each panel","body":"Demonstrates creating a **`MarkupAdornment`** per panel: anchor it to the panel center, give it an SF Symbol icon via `imageConfiguration` (`photo.badge.plus`), set `dragRegion` and `scalesWithZoom`, then assign the array to the controller's `adornments` property. A dictionary also records the mapping from adornment id to panel index."},{"t":368,"title":"Handle adornment taps","body":"Demonstrates tap handling: implement the delegate method **`didTapAdornmentWithID`**, look up the tapped panel index from the mapping dictionary, then create and present an **`ImagePlaygroundViewController`** (with self as delegate) so the user can generate artwork for that panel."},{"t":380,"title":"Place the generated image","body":"When Image Playground returns an image, the `didCreateImageAt` callback grabs the image, creates an **`ImageMarkup`** with that panel's frame, appends it to `markup.subelements`, and updates the view controller's markup so the generated image fills the panel. Matt uses this to complete the first page of his comic (a super hero dog story)."},{"t":431,"title":"Next steps","body":"Wraps up: you can now build a fully interactive, canvas-based experience in your app with PaperKit—use the **data model** to read and modify the canvas programmatically, and add **adornments** to create interactive overlays tailored to your app. Matt encourages developers to go unwrap PaperKit."}],"code":["import PaperKit\n\nfunc generateMarkup(pageSize: CGSize, panelFrames: [CGRect], configuration: ShapeConfiguration) -> PaperMarkup {\n    var markup = PaperMarkup(bounds: CGRect(origin: .zero, size: pageSize))\n    var subelements: MarkupOrderedSet = markup.subelements\n    for panelFrame: CGRect in panelFrames {\n        let shape = ShapeMarkup(frame: panelFrame, configuration: configuration)\n        subelements.append(shape)\n    }\n    markup.subelements = subelements\n    return markup\n}","import PaperKit\n\nfunc generateMarkup(pageSize: CGSize, panelFrames: [CGRect], configuration: ShapeConfiguration) -> PaperMarkup {\n    var markup = PaperMarkup(bounds: CGRect(origin: .zero, size: pageSize))\n    var subelements: MarkupOrderedSet = markup.subelements\n    for panelFrame: CGRect in panelFrames {\n        var shape = ShapeMarkup(frame: panelFrame, configuration: configuration)\n        shape.allowedInteractions = .readOnly\n        subelements.append(shape)\n    }\n    markup.subelements = subelements\n    return markup\n}","import PaperKit\n\nfunc updatePanelColor(_ selectedColor: CGColor) {\n    guard var markup: PaperMarkup = paperMarkupViewController.markup else { return }\n    var subelements: MarkupOrderedSet = markup.subelements\n    for element in subelements {\n        guard var shape = element as? ShapeMarkup else { continue }\n        shape.strokeColor = selectedColor\n        shape.fillColor = selectedColor.copy(alpha: 0.15)\n        subelements.updateOrAppend(shape)\n    }\n    markup.subelements = subelements\n    markup.backgroundColor = selectedColor.copy(alpha: 0.15)\n    paperMarkupViewController.markup = markup\n}","import PaperKit\n\nfunc addPanelAdornments(for page: Page) {\n    var adornments: [MarkupAdornment] = []\n    for (panelIndex, panel) in page.panels.enumerated() {\n        let adornmentID = UUID()\n        adornmentPanelMapping[adornmentID] = panelIndex\n        let center = CGPoint(x: panel.midX, y: panel.midY)\n        let adornment = MarkupAdornment(\n            id: adornmentID,\n            anchor: .canvas(location: center),\n            imageConfiguration: .systemImage(\"photo.badge.plus\"),\n            dragRegion: .fixed,\n            scalesWithZoom: false\n        )\n        adornments.append(adornment)\n    }\n    paperMarkupViewController.adornments = adornments\n}","import ImagePlayground\nimport PaperKit\n\nfunc paperMarkupViewController(_ paperMarkupViewController: PaperMarkupViewController, didTapAdornmentWithID id: UUID) {\n    guard let panelIndex = adornmentPanelMapping[id] else { return }\n    activeImageGenerationPanelIndex = panelIndex\n\n    let imagePlaygroundViewController = ImagePlaygroundViewController()\n    imagePlaygroundViewController.delegate = self\n    present(imagePlaygroundViewController, animated: true)\n}","import ImagePlayground\nimport PaperKit\n\nfunc imageViewController(_ imageViewController: ImagePlaygroundViewController, didCreateImageAt imageURL: URL) {\n    guard let panelFrame = activeGenerationPanelFrame,\n          let paperMarkupViewController = pageViewController.paperViewController,\n          var markup = paperMarkupViewController.markup,\n          let image = UIImage(contentsOfFile: imageURL.path) else { return }\n\n    let imageMarkup = ImageMarkup(frame: panelFrame, image: image)\n    markup.subelements.append(imageMarkup)\n    paperMarkupViewController.markup = markup\n}"]},"related":[{"id":"375","title":"Create high-quality images using Image Playground","gloss":"用 Image Playground 產生高品質影像","gloss_en":"Create high-quality images using Image Playground","category":"ai","categoryLabel":"AI 與機器學習"},{"id":"203","title":"Read between the strokes with PencilKit","gloss":"用 PencilKit 解讀筆跡內容","gloss_en":"Read handwriting content with PencilKit","category":"uikit","categoryLabel":"UIKit"},{"id":"212","title":"Rev up your CarPlay app","gloss":"強化你的 CarPlay App","gloss_en":"Rev up your CarPlay app","category":"uikit","categoryLabel":"UIKit"},{"id":"219","title":"Enhance the accessibility of your reading app","gloss":"強化你閱讀類 App 的無障礙體驗","gloss_en":"Enhance the accessibility of your reading app","category":"uikit","categoryLabel":"UIKit"},{"id":"221","title":"Prepare your tvOS apps for Dynamic Type","gloss":"讓你的 tvOS App 支援動態字型","gloss_en":"Prepare your tvOS app for Dynamic Type","category":"uikit","categoryLabel":"UIKit"}]}</script>
