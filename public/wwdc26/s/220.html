<script id="d" type="application/json">{"s":{"id":"220","title":"Refine accessibility for custom controls","gloss":"為自訂控制項優化無障礙體驗","category":"design","categoryLabel":"設計","duration":985,"url":"https://developer.apple.com/videos/play/wwdc2026/220/","takeaway":"為自訂控制項補上 label、value、可調整特性與自訂動作，能讓 VoiceOver 使用者完整操作你的互動元件。","chapters":[[1,"Introduction"],[62,"Guiding principles"],[301,"Improve accessibility for coffee dispenser"],[425,"Set the accessibility activation point"],[447,"Post accessibility announcements"],[521,"Complex controls"],[613,"Add custom actions"],[767,"Customize accessibility for the interactive cat surface"]],"points":[{"text":"用 **accessibilityLabel**、**accessibilityValue** 與 **.adjustable** 特性，搭配 **accessibilityAdjustableAction** 讓滑桿類控制項可被輔助技術調整。","hot":false},{"text":"透過 **accessibilityActivationPoint** 設定啟用點，讓 VoiceOver 啟用控制項時落在正確位置。","hot":false},{"text":"使用 **AccessibilityNotification.Announcement** 在數值變化時播報，並做好節流避免過度通知。","hot":false},{"text":"對複雜控制項以 **accessibilityActions** 提供「上/下/左/右」等自訂動作，取代難以操作的連續手勢。","hot":true},{"text":"針對直接觸控的互動表面，用 **accessibilityDirectTouch([.requiresActivation])** 兼顧探索與操作。","hot":false}],"apis":["accessibilityLabel","accessibilityValue","accessibilityAddTraits","accessibilityAdjustableAction","accessibilityActivationPoint","AccessibilityNotification.Announcement","accessibilityActions","accessibilityDirectTouch","SwiftUI"],"audience":"在 SwiftUI 中打造**自訂控制項與互動元件**、想讓它們完整支援 VoiceOver 的開發者。","gloss_en":"Refine accessibility for custom controls","takeaway_en":"Adding labels, values, adjustable traits, and custom actions to your custom controls lets VoiceOver users fully operate your interactive elements.","points_en":[{"text":"Use **accessibilityLabel**, **accessibilityValue**, and the **.adjustable** trait together with **accessibilityAdjustableAction** so slider-style controls can be adjusted by assistive technologies.","hot":false},{"text":"Set an activation point with **accessibilityActivationPoint** so VoiceOver activates the control at the correct location.","hot":false},{"text":"Use **AccessibilityNotification.Announcement** to announce value changes, and throttle them to avoid excessive notifications.","hot":false},{"text":"For complex controls, provide custom actions like up/down/left/right via **accessibilityActions** instead of hard-to-perform continuous gestures.","hot":true},{"text":"For direct-touch interactive surfaces, use **accessibilityDirectTouch([.requiresActivation])** to balance exploration and operation.","hot":false}],"audience_en":"Developers building **custom controls and interactive elements** in SwiftUI who want full VoiceOver support.","summary":["這場由 Apple Accessibility 團隊主講，核心訊息是：**自訂控制項**讓人能用超越標準元件的手勢做出獨特操作，但若不補上無障礙支援，使用 **VoiceOver**、**Switch Control** 等輔助技術的人就會被擋在門外。講者以一個標準 SwiftUI slider 為起點，說明視覺形態其實隱含了大量資訊——控制項的用途、目前的值、可採取的動作與互動回饋——然後把這四點訂為讓任何控制項無障礙化的**指導原則**：purpose、value、actions、feedback。","第一個範例是咖啡機 app 的填充式滑桿。透過 `accessibilityElement()`、`accessibilityLabel`、`accessibilityValue` 表達用途與目前值，再加上 **`.adjustable`** trait 與 **`accessibilityAdjustableAction`**，VoiceOver 就能像操作內建 slider 一樣上下調整。要做更精細的調整，則靠 VoiceOver 的 **passthrough gesture**——用 **`accessibilityActivationPoint`** 把手勢起點對齊目前填充高度，並在值變動時用 **`AccessibilityNotification.Announcement`** 適時播報（以節流避免過於吵雜）。","進一步的複雜控制項則需要不同工具。等化器（Background Sounds 的二維 pad）有水平與垂直兩軸，單一的 adjustable 只能涵蓋一軸，因此改用 **`accessibilityActions`** 自訂動作（Move Up/Down/Left/Right），讓使用者透過熟悉的動作探索 2D 空間。最後的互動虛擬貓 surface 支援撫摸、輕點、捏等多種手勢，passthrough 並不適合，於是採用 **`accessibilityDirectTouch`** 直接觸控 API，搭配 **`.requiresActivation`** 與 **`.silentOnTouch`** 選項把觸控事件直接交給控制項。實務建議：打開 VoiceOver 親自體驗自己的 app，並盡量同時提供 custom actions，讓無法做直接觸控的人也有替代路徑。"],"deepdive":[{"t":1,"title":"Introduction","body":"由 Accessibility 團隊的 Khin 開場，說明**自訂 UI 控制項**讓人能用超越標準元件的手勢與互動做出獨特操作，但也因此更需顧及 **VoiceOver**、**Switch Control** 等輔助技術。核心理念：技術要對所有人都好用，讓每個人都能存取 app 真正想提供的功能。本場將先講指導原則，再套用到幾個複雜控制項上。"},{"t":62,"title":"Guiding principles","body":"以一個標準 SwiftUI slider 拆解視覺形態隱含的資訊：軌道、把手與位置讓人一眼看懂這是連續值、目前值約一半、把手可拖曳且有即時回饋。對照 **VoiceOver** 的描述（「Brightness, 50%, adjustable」與調整提示），歸納出四個指導原則：讓控制項的 **purpose**、**value**、**actions** 與 **feedback** 都能被輔助技術取得。"},{"t":301,"title":"Improve accessibility for coffee dispenser","body":"以咖啡機 app 的填充式滑桿為例，預設下 VoiceOver 只讀出「Button、6 ounces」，看不懂如何互動。解法是先 `accessibilityElement()`，用 **`accessibilityLabel`**（\"Coffee Dispenser\"）表達用途、**`accessibilityValue`** 報出目前盎司數，再加上 **`.adjustable`** trait 與 **`accessibilityAdjustableAction`**——closure 依 `.increment`／`.decrement` 方向各自處理，讓使用者用上下滑一次調整一盎司。"},{"t":425,"title":"Set the accessibility activation point","body":"為了做到半盎司的精細調整，引入 VoiceOver 的 **passthrough gesture**：雙擊並按住後，手勢會從控制項的 **`accessibilityActivationPoint`** 開始，VoiceOver 把觸控事件直接傳給控制項。範例用 `UnitPoint(x: 0.5, y: 1 - coffee)` 把起點對齊目前填充高度，讓使用者往任一方向都有調整空間。"},{"t":447,"title":"Post accessibility announcements","body":"passthrough 過程中要給予回饋，做法是在 `onChange(of: coffee)` 時用 **`AccessibilityNotification.Announcement(...).post()`** 播報新值。但不是每次變動都播——範例會追蹤上次播報的值與時間，只有在值確實改變且距離上次至少 0.3 秒時才播報，避免過於吵雜，確保使用者聽到的是有意義的更新。"},{"t":521,"title":"Complex controls","body":"進入更複雜的範例：iOS Background Sounds 設定裡的等化器，是一個可同時調整兩個維度（頻率與振幅）的二維 pad。問題在於 **`.adjustable`** trait 的 increment／decrement 只能涵蓋單一軸，對於有水平與垂直兩軸的控制項並不理想，因此需要改用其他機制。"},{"t":613,"title":"Add custom actions","body":"解法是 **custom actions**：在 EqualizerPad 上用 **`accessibilityActions`** 加入四個有描述性名稱的動作（Move Up／Right／Down／Left），各自把單一軸移動固定步數並 clamp 在範圍內。custom actions 不限於單軸，可暴露任意自訂操作，VoiceOver 會把動作名稱讀出、雙擊即執行，讓人用熟悉的方式探索 2D 空間。"},{"t":767,"title":"Customize accessibility for the interactive cat surface","body":"最後是支援撫摸、輕點、捏等多種手勢的互動虛擬貓 surface，預設 VoiceOver 只當成一張圖片。先用 `accessibilityLabel`（\"Virtual Cat\"）與 `accessibilityValue`（貓目前反應）表達用途與狀態；因為使用者可能反覆或多手勢操作，passthrough 不適合，改用 **`accessibilityDirectTouch`** 直接觸控。搭配 **`.requiresActivation`**（雙擊後才響應、避免誤觸）與 **`.silentOnTouch`**（讓控制項自己的音效不被 VoiceOver 蓋掉），並建議盡量同時提供 custom actions 作為替代路徑。"}],"summary_en":["Presented by Apple's Accessibility team, the central message is that **custom controls** let people do unique, creative things with gestures that go beyond standard elements — but without accessibility support, people relying on **VoiceOver**, **Switch Control**, and other assistive technologies are locked out of the very thing the app was built to do. Starting from a standard SwiftUI slider, the speaker shows how visual form implicitly conveys a control's purpose, current value, possible actions, and feedback, then turns those into the **guiding principles** for making any control accessible: purpose, value, actions, and feedback.","The first example is a coffee maker's fill-style slider. Using `accessibilityElement()`, `accessibilityLabel`, and `accessibilityValue` to express purpose and current value, plus the **`.adjustable`** trait and **`accessibilityAdjustableAction`**, VoiceOver can adjust it just like a built-in slider. For finer adjustment, VoiceOver's **passthrough gesture** is used — **`accessibilityActivationPoint`** aligns the gesture's start with the current fill level, and **`AccessibilityNotification.Announcement`** posts value updates, throttled so they aren't noisy.","More complex controls need different tools. The equalizer (Background Sounds' two-dimensional pad) has horizontal and vertical axes, and a single adjustable action only covers one axis, so **`accessibilityActions`** custom actions (Move Up/Down/Left/Right) let people explore the 2D space through familiar actions. The final interactive virtual cat surface supports patting, tapping, and pinching, where passthrough isn't a good fit, so it adopts the **`accessibilityDirectTouch`** API with the **`.requiresActivation`** and **`.silentOnTouch`** options to pass touch events straight to the control. The practical advice: turn on VoiceOver and try your own app, and provide custom actions wherever possible so people who can't perform direct touch still have a path."],"deepdive_en":[{"t":1,"title":"Introduction","body":"Khin from the Accessibility team opens by noting that **custom UI controls** empower unique, creative interactions beyond standard elements, which makes assistive technologies like **VoiceOver** and **Switch Control** all the more important to support. The core belief: technology works best when it works for everyone, giving access to the very thing the app was built to do. The session first covers guiding principles, then applies them to several complex controls."},{"t":62,"title":"Guiding principles","body":"Using a standard SwiftUI slider, the speaker breaks down the information implied by visual form: track, handle, and position make it clear this is a continuous value at about half, with a draggable handle and immediate feedback. Contrasting that with **VoiceOver**'s description (\"Brightness, 50%, adjustable\" plus an adjustment hint), they derive four guiding principles: make a control's **purpose**, **value**, **actions**, and **feedback** available to assistive technologies."},{"t":301,"title":"Improve accessibility for coffee dispenser","body":"With the coffee maker's fill-style slider, by default VoiceOver only reads \"Button, 6 ounces\" and gives no sense of how to interact. The fix is `accessibilityElement()`, then **`accessibilityLabel`** (\"Coffee Dispenser\") for purpose, **`accessibilityValue`** for the current ounces, plus the **`.adjustable`** trait and **`accessibilityAdjustableAction`** — whose closure handles the `.increment`/`.decrement` direction so swiping up or down changes the amount one ounce at a time."},{"t":425,"title":"Set the accessibility activation point","body":"For half-ounce precision, VoiceOver's **passthrough gesture** is introduced: after a double-tap-and-hold, the gesture begins at the control's **`accessibilityActivationPoint`** and VoiceOver sends touch events straight to the control. The example uses `UnitPoint(x: 0.5, y: 1 - coffee)` to align the start with the current fill level, giving room to adjust in either direction."},{"t":447,"title":"Post accessibility announcements","body":"Feedback during the passthrough gesture is provided by posting **`AccessibilityNotification.Announcement(...).post()`** in `onChange(of: coffee)`. Not every change is announced, though — the example tracks the last spoken value and time, announcing only when the value has actually changed and at least 0.3 seconds have passed, keeping updates meaningful rather than noisy."},{"t":521,"title":"Complex controls","body":"The session moves to more complex examples: the equalizer in iOS Background Sounds settings, a two-dimensional pad that adjusts two values (frequency and amplitude) at once. The problem is that the **`.adjustable`** trait's increment/decrement only covers a single axis, which isn't ideal for a control with both horizontal and vertical axes, motivating a different mechanism."},{"t":613,"title":"Add custom actions","body":"The solution is **custom actions**: on the EqualizerPad, **`accessibilityActions`** adds four descriptively named actions (Move Up/Right/Down/Left), each moving a single axis by a fixed step clamped within range. Custom actions aren't limited to one axis and can expose any operation — VoiceOver reads each name aloud and a double-tap activates it — letting people navigate the 2D space using familiar actions."},{"t":767,"title":"Customize accessibility for the interactive cat surface","body":"The final example is an interactive virtual cat surface supporting patting, tapping, and pinching, which VoiceOver treats only as an image by default. After `accessibilityLabel` (\"Virtual Cat\") and `accessibilityValue` (the cat's current reaction), passthrough isn't a good fit since people may repeat or combine gestures, so **`accessibilityDirectTouch`** is used. The **`.requiresActivation`** option (responds only after a double-tap, avoiding accidental activation) and **`.silentOnTouch`** option (so the control's own audio isn't talked over) are explained, with advice to also expose custom actions as an alternative path."}],"code":[]},"related":[{"id":"269","title":"What’s new in SwiftUI","gloss":"SwiftUI 的新功能","gloss_en":"What's new in SwiftUI","category":"swiftui","categoryLabel":"SwiftUI"},{"id":"271","title":"Code-along: Build powerful drag and drop in SwiftUI","gloss":"程式碼共做：在 SwiftUI 打造強大的拖放功能","gloss_en":"Code-along: Build powerful drag and drop in SwiftUI","category":"swiftui","categoryLabel":"SwiftUI"},{"id":"272","title":"Use SwiftUI with AppKit and UIKit","gloss":"在 AppKit 與 UIKit 中使用 SwiftUI","gloss_en":"Use SwiftUI with AppKit and UIKit","category":"swiftui","categoryLabel":"SwiftUI"},{"id":"286","title":"Use foveated streaming to bring immersive content to visionOS","gloss":"用注視點串流把沉浸式內容帶到 visionOS","gloss_en":"Use foveated streaming to bring immersive content to visionOS","category":"visionos","categoryLabel":"visionOS"},{"id":"322","title":"Compose advanced graphics effects with SwiftUI","gloss":"用 SwiftUI 組合進階圖形效果","gloss_en":"Compose advanced graphics effects with SwiftUI","category":"swiftui","categoryLabel":"SwiftUI"}]}</script>
