<script id="d" type="application/json">{"s":{"id":"289","title":"Modernize your AppKit app","gloss":"現代化你的 AppKit App","category":"uikit","categoryLabel":"UIKit","duration":1081,"url":"https://developer.apple.com/videos/play/wwdc2026/289/","takeaway":"用手勢辨識、控制事件、現代拖放與狀態還原把 AppKit App 更新到當代 macOS 慣例，並導入 macOS 27 的 Liquid Glass 與同心圓角。","chapters":[[0,"Introduction"],[66,"Modern input"],[87,"Modern event handling with gesture recognizers"],[145,"Selection, context menus, and drag and drop"],[215,"Modern dragging delegate"],[232,"Text selection in custom views"],[266,"Control events and gesture recognizers"],[295,"Control events"],[344,"hitTest override"],[351,"Keyboard navigation and status items"],[384,"autorecalculatesKeyViewLoop"],[457,"Expanded interface delegate — setup"],[472,"Expanded interface delegate — methods"],[496,"Expanded interface delegate — cancel"],[537,"Continuity across launches"],[548,"Graceful app termination"],[585,"preventsApplicationTerminationWhenModal"],[595,"State restoration"],[618,"Set window identifiers for state restoration"],[664,"encodeRestorableState"],[710,"invalidateRestorableState"],[746,"restoreWindow(withIdentifier:)"],[809,"restoreState"],[849,"Design updates"],[864,"Liquid Glass updates in macOS 27"],[941,"Concentricity"],[971,"cornerConfiguration"],[1019,"Next steps"]],"points":[{"text":"以**手勢辨識器（gesture recognizers）**處理現代輸入，並用 **NSPasteboardWriting** 採用現代拖放委派。","hot":false},{"text":"使用 **control events**（如 `.trackingEndedOutside`）與 hitTest 覆寫，改善控制項互動。","hot":false},{"text":"以 **autorecalculatesKeyViewLoop** 與 **NSStatusItemExpandedInterfaceDelegate** 強化鍵盤導覽與狀態列項目。","hot":false},{"text":"透過 **encodeRestorableState / restoreState** 與視窗識別碼做**狀態還原**，並優雅處理 App 終止。","hot":false},{"text":"導入 **macOS 27 的 Liquid Glass**，以 **cornerConfiguration** 實現同心圓角（concentricity）。","hot":true}],"apis":["AppKit","NSGestureRecognizer","NSPasteboardWriting","NSPasteboardItem","NSControl.EventType.trackingEndedOutside","NSView.hitTest","autorecalculatesKeyViewLoop","NSStatusItem","NSStatusItemExpandedInterfaceDelegate","preventsApplicationTerminationWhenModal","NSWindowRestoration","encodeRestorableState","restoreState","NSViewCornerConfiguration"],"audience":"**維護既有 AppKit macOS App 的開發者**，想跟上現代 macOS 慣例與 Liquid Glass 外觀的人。","gloss_en":"Modernize your AppKit app","takeaway_en":"Bring your AppKit app up to contemporary macOS conventions with gesture recognition, control events, modern drag and drop, and state restoration, and adopt macOS 27's Liquid Glass and concentric corners.","points_en":[{"text":"Handle modern input with **gesture recognizers**, and adopt modern drag and drop with **NSPasteboardWriting**.","hot":false},{"text":"Use **control events** (such as `.trackingEndedOutside`) and hitTest overrides to improve control interactions.","hot":false},{"text":"Strengthen keyboard navigation and status bar items with **autorecalculatesKeyViewLoop** and **NSStatusItemExpandedInterfaceDelegate**.","hot":false},{"text":"Do **state restoration** via **encodeRestorableState / restoreState** and window identifiers, and handle app termination gracefully.","hot":false},{"text":"Adopt **macOS 27's Liquid Glass**, achieving concentric corners (concentricity) with **cornerConfiguration**.","hot":true}],"audience_en":"**Developers maintaining an existing AppKit macOS app** who want to keep up with modern macOS conventions and the Liquid Glass look.","summary":["Mac UI 框架工程師 Ujjaini 在這場「Modernize your AppKit app」中，從三個面向幫你的 **AppKit** app 與現代 macOS 和諧共處：人們如何操作你的 app（輸入）、系統如何管理它（退出與還原），以及它在螢幕上的外觀（look and feel）。核心觀念是現代 app 善用 AppKit 與 Mac 的介接方式，讓形式與功能都與系統其餘部分一致。","在**現代輸入**上，傳統的 `mouseDown` 與 tracking loop 應讓位給 **gesture recognizers**——這是 SwiftUI、UIKit（透過 Mac Catalyst）與 AppKit 三者共通的事件處理語言。針對常見的 `mouseDown` override 用途，AppKit 提供更可靠的專用 API：選取改為觀察 `NSCollectionViewItem`／`NSTableRowView` 的 `selected` 屬性或 delegate callback；context menu 用 `defaultMenu`／`menu`／`menuForEvent`；拖放用現代 dragging delegate（如 `tableView pasteboardWriterForRow`）；NSTextView 之外的文字選取用 macOS 27 新的 **NSTextSelectionManager**。此外 UIKit 的 **control events** 來到 AppKit，可直接對按鈕等標準控制項註冊 target／action 反應 tracking 狀態變化，不需子類化；重疊的 sibling view 會默默吃掉點擊，可重設大小或 override `hitTest` 回傳 nil 讓事件穿透。鍵盤導覽則建議開啟 window 的 `autorecalculatesKeyViewLoop`，並用 `NSStatusItemExpandedInterfaceDelegate` 管理 status item 展開自訂視窗時的鍵盤焦點生命週期。","在**跨啟動的延續性**上，好的 Mac app 能順暢退出、快速還原。app 應只在真正必要時阻擋退出——對不需強制介入的 sheet／modal 把 `preventsApplicationTerminationWhenModal` 設為 false，讓系統（如隔夜更新重開機）能優雅終止。**state restoration** 分三步：用 `NSWindowRestoration` opt-in（設 window identifier、autosave name、`isRestorable`、`restorationClass`）、用 `encodeRestorableState` 編碼 UI 狀態（只存重建 UI 所需、不重新序列化整個 app，並在視圖階層變動時呼叫 `invalidateRestorableState`），以及重啟後用 `restoreWindow(withIdentifier:)` 重建視窗、`restoreState` 還原各視窗 UI（務必呼叫 completionHandler）。最後是 macOS 27 的**設計更新**：採用 Liquid Glass 的 app 多數變化自動生效（硬邊 scroll edge effect、側邊欄延伸到邊緣、玻璃點擊回彈效果），並有新的 **cornerConfiguration** API 讓視圖圓角與容器同心（`.containerConcentric` 搭配最小半徑）。"],"deepdive":[{"t":0,"title":"Introduction","body":"Mac UI 框架工程師 Ujjaini 開場，定義現代 app 善用 AppKit 與 Mac 的介接，使形式與功能都與系統和諧。和諧展現在三處：人們如何操作 app、系統如何管理 app、app 在螢幕上的外觀——本場依序分享這三方面的建議。"},{"t":66,"title":"Modern input","body":"從輸入裝置談起：Mac 自始就有鍵盤與滑鼠，而 `mouseDown` 與 tracking loop 長年是實作互動行為的慣用模式。但 AppKit 並非 Mac 上唯一框架，現代做法是改用 gesture recognizers 作為跨框架共通的事件處理語言。"},{"t":87,"title":"Modern event handling with gesture recognizers","body":"**gesture recognizers** 讓 AppKit 不必自行打造即享進階行為，並支援跨框架相容。講者將介紹三種與其良好介接的方案：view-based API、control events 與自訂 gesture recognizer，提供與 tracking loop 同等的客製能力。"},{"t":145,"title":"Selection, context menus, and drag and drop","body":"常見的 `mouseDown` override 用途各有更可靠的專用 API：選取改觀察 `NSCollectionViewItem`／`NSTableRowView` 的 `selected` 屬性或用 `NSTableViewDelegate`／`NSOutlineViewDelegate` callback；context menu 用 `NSView` 的 `defaultMenu`、`NSResponder` 的 `menu` 或 `menuForEvent` 動態建立。"},{"t":215,"title":"Modern dragging delegate","body":"若用 collection 容器 view，改用現代 dragging delegate 方法（如 `tableView pasteboardWriterForRow`）：建立 `NSPasteboardItem`、設好資料並回傳；`NSCollectionView`、`NSOutlineView`、`NSBrowser` 也有類似方法。"},{"t":232,"title":"Text selection in custom views","body":"若需在 `NSTextView` 之外做文字選取，用 macOS 27 新的 **NSTextSelectionManager**：它善用 gesture recognizers，把經典 macOS 文字選取行為帶到任何 view。掛上並設定 text selection data source 後，即支援雙向選取、文字拖放、toggling 等。"},{"t":266,"title":"Control events and gesture recognizers","body":"下一個方案對熟悉 UIKit 的人很眼熟：**control events** 來到 AppKit，可加到按鈕、slider 等標準控制項，讓程式反應使用者驅動的 tracking 狀態變化，不必實作複雜的 `mouseDown` 邏輯。"},{"t":295,"title":"Control events","body":"範例：實例化 `NSButton` 並對某 control event 註冊 target 與 action——**無需子類化 NSButton** 即可運作。多數 control events 自 OS 10.11 起即可用，AppKit 在事件觸發時呼叫註冊的 target／action。"},{"t":344,"title":"hitTest override","body":"因 gesture recognizers 作用於 view 及其子 view，重疊的 sibling view 會默默擋住滑鼠事件。若控制項對點擊無反應，先確認沒有重疊的 sibling；可重設大小，或若是 overlay 不應縮放，則 override `hitTest` 回傳 `nil` 讓 hit testing 穿透到底下內容。"},{"t":351,"title":"Keyboard navigation and status items","body":"鍵盤導覽對速度與無障礙都重要。可在系統設定開啟，焦點以 tab／shift-tab 在控制項間移動，其順序即 key view loop。導覽也延伸到選單列與 status items——後者與主選單項略有不同。"},{"t":384,"title":"autorecalculatesKeyViewLoop","body":"要在每次新增／移除 view 時自動重算 key view loop，於 window 開啟 **`autorecalculatesKeyViewLoop`**；若不設，則需自行建立與維護 loop。會顯示選單的 status item 行為已像選單列上的選單，但 status item 也可作為觸發動作或顯示暫時 UI 的觸發器。"},{"t":457,"title":"Expanded interface delegate — setup","body":"當 status item 顯示自訂視窗時，AppKit 需知道該 UI 何時作用以正確處理鍵盤焦點。第一步：在建立 item 時設定 **expanded interface delegate**（範例在 `applicationDidFinishLaunching` 對 `NSStatusItem` 設 `expandedInterfaceDelegate`）。"},{"t":472,"title":"Expanded interface delegate — methods","body":"實作 `NSStatusItemExpandedInterfaceDelegate` 的方法：在 `statusItem(_:didBegin:)` 顯示視窗、在 `statusItemDidEndExpandedInterfaceSession` 隱藏視窗。這些由 AppKit 呼叫以管理 expanded interface session 的生命週期。"},{"t":496,"title":"Expanded interface delegate — cancel","body":"當需要結束 session（例如已選取某動作），對 `expandedInterfaceSession?` 呼叫 `.cancel` 請求關閉視窗。注意若焦點自然移往他處，session 可能會被系統自動取消。SwiftUI 的 menu bar extra 會替你處理許多此類工作。"},{"t":537,"title":"Continuity across launches","body":"談跨啟動延續性：好的 Mac app 能順暢退出、快速還原——退出不拖泥帶水，回來時彷彿從未退出。人們應能隨時退出 app（自願或因系統需重開機，如隔夜軟體更新）。"},{"t":548,"title":"Graceful app termination","body":"app 應只在真正必要時阻擋退出。當呈現 sheet 時 window 可能無法關閉，連帶讓 app 無法退出。`NSWindow` 的 `preventsApplicationTerminationWhenModal` 預設為 true（為避免遺失資料，如需存檔的文件）。"},{"t":585,"title":"preventsApplicationTerminationWhenModal","body":"對不需強制介入的 modal／sheet，把 **`preventsApplicationTerminationWhenModal`** 設為 `false`，以允許更優雅的應用程式終止。"},{"t":595,"title":"State restoration","body":"用 `NSWindowRestoration` 客製 app 如何回來。**state restoration** 需三步：opt-in、編碼 UI 狀態、解碼以還原視窗與 UI。接著走過使用 `NSWindowRestoration` 的程式碼。"},{"t":618,"title":"Set window identifiers for state restoration","body":"在 window controller 為 window 設 identifier；常見視窗（主視窗、偏好設定）設 autosave name 以還原到同一 space 與 frame（文件視窗不需）。確保 `window.isRestorable = true` 讓 AppKit 能呼叫 encode／restore，並設 `restorationClass` 供重啟時還原視窗本身。"},{"t":664,"title":"encodeRestorableState","body":"用 **`encodeRestorableState`** 保存重建視窗狀態所需的一切，並呼叫 super。範例以 `productIdentifier` key 編碼所選項目的 identifier。避免編碼存在文件或資料庫的資料——目標是重建 UI 狀態，而非重新序列化整個 app。所有 `NSResponder` 都有可 override 的 encode 方法。"},{"t":710,"title":"invalidateRestorableState","body":"`encodeRestorableState` 僅在物件狀態被標記失效時呼叫。每當視圖階層有應改變已存狀態的變動，呼叫 **`invalidateRestorableState()`**（範例在側邊欄選取不同產品時呼叫），稍後 AppKit 才會對所有被失效者呼叫 encode。"},{"t":746,"title":"restoreWindow(withIdentifier:)","body":"重啟後先還原視窗：在 window restoration class 實作 **`restoreWindow(withIdentifier:)`** 重建各視窗，參數含 identifier 與須呼叫的 completionHandler。依 identifier 重建 window controller 與 window（主視窗已在 app delegate 上）。即使建立失敗也務必以 error 呼叫 completionHandler——AppKit 會等待每個可還原視窗。"},{"t":809,"title":"restoreState","body":"視窗還原後，最後在 window controller 的 **`restoreState`** 還原各視窗 UI：AppKit 交回先前編碼的 coder，於此取回重建狀態所需資料、解碼 identifier 並交給對應 view controller，完成後視窗即回到先前狀態。可參考 sample「Restoring your app's state with AppKit」。"},{"t":849,"title":"Design updates","body":"進入第三面向——UI。macOS 26 引入的 **Liquid Glass** 材質持續演進，許多更新會自動套用，不必重建 app 即可受惠。"},{"t":864,"title":"Liquid Glass updates in macOS 27","body":"若在 macOS 26 採用了 Liquid Glass，於 macOS 27 會自動獲得多項變化：自動的 `NSScrollEdgeEffectStyle` 在有自由浮動文字（如標題列的視窗標題）時解析為硬邊效果；側邊欄延伸到視窗邊緣、選取使用半粗體強調、內容仍流動於其後；側邊欄上的 bordered toolbar item 也採用 Liquid Glass。"},{"t":941,"title":"Concentricity","body":"macOS 27 新增點擊時玻璃微微回彈的效果，給人控制項正在回應互動之感（Maps 用於部分自訂控制項），但只應用於控制項、按鈕或互動控制項的玻璃容器。圓角矩形是 Apple 生態長年標誌，AppKit 為**同心**（concentricity）提供新 API：角落內容可隨容器形狀調整。"},{"t":971,"title":"cornerConfiguration","body":"view 越靠近容器角落，其圓角半徑就應越貼合容器曲線。用 **`cornerConfiguration`** API 達成：建立自訂 view 子類，override `cornerConfiguration` 回傳 `NSViewCornerConfiguration?`，半徑用 `NSViewCornerRadius` 的 `.containerConcentric`（依容器計算並設最小值確保總是圓角），並可用 `.uniformCorners` 維持四角一致。"},{"t":1019,"title":"Next steps","body":"總結重點：找出 app 中 override `mouseDown` 之處改用 view API、control events 或 gesture recognizers；以使用者意圖取代 tracking loop；確保鍵盤與滑鼠操作同樣好用；讓退出與重啟無縫銜接；並在 view 與按鈕採用同心圓角。"}],"summary_en":["Mac UI frameworks engineer Ujjaini's \"Modernize your AppKit app\" helps your **AppKit** app feel in harmony with modern macOS across three areas: how people drive your app (input), how the system manages it (termination and restoration), and how it looks on screen. The core idea is that a modern app takes advantage of how AppKit interfaces with the Mac so its form and function feel consistent with the rest of the system.","For **modern input**, the traditional `mouseDown` and tracking loops should give way to **gesture recognizers** — the common event-handling language shared across SwiftUI, UIKit (via Mac Catalyst), and AppKit. For common `mouseDown` override uses, AppKit offers more reliable dedicated APIs: observe the `selected` property on `NSCollectionViewItem`/`NSTableRowView` or use delegate callbacks for selection; use `defaultMenu`/`menu`/`menuForEvent` for context menus; use modern dragging delegate methods (like `tableView pasteboardWriterForRow`) for drag and drop; and use the new macOS 27 **NSTextSelectionManager** for text selection outside NSTextView. UIKit's **control events** also come to AppKit, letting you register target/action on standard controls to react to user-driven tracking changes without subclassing; overlapping sibling views silently block clicks, so resize them or override `hitTest` to return nil so events fall through. For keyboard navigation, enable the window's `autorecalculatesKeyViewLoop`, and use `NSStatusItemExpandedInterfaceDelegate` to manage keyboard focus lifecycle when a status item shows a custom window.","For **continuity across launches**, a great Mac app quits gracefully and restores quickly. An app should block quit only when truly necessary — set `preventsApplicationTerminationWhenModal` to false for sheets/modals that don't strictly require intervention so the system (e.g. an overnight update reboot) can terminate gracefully. **State restoration** has three steps: opt in with `NSWindowRestoration` (set the window identifier, autosave name, `isRestorable`, and `restorationClass`), encode UI state with `encodeRestorableState` (store only what's needed to rebuild the UI, not re-serialize the whole app, and call `invalidateRestorableState` when the view hierarchy changes), and after relaunch recreate windows with `restoreWindow(withIdentifier:)` and restore each window's UI with `restoreState` (always call the completionHandler). Finally, macOS 27's **design updates**: apps that adopted Liquid Glass get most changes automatically (hard-edge scroll edge effect, sidebars extending to edges, a click-bounce glass effect), plus a new **cornerConfiguration** API to make a view's corners concentric with its container (`.containerConcentric` with a minimum radius)."],"deepdive_en":[{"t":0,"title":"Introduction","body":"Mac UI frameworks engineer Ujjaini opens, defining a modern app as one that takes advantage of how AppKit interfaces with the Mac so form and function feel in harmony with the system. That harmony shows up in three places: how people drive the app, how the system manages it, and how it looks on screen — covered in turn."},{"t":66,"title":"Modern input","body":"Starts at the input device: the Mac has always had a keyboard and mouse, and `mouseDown` with tracking loops has long been the go-to for interactive behavior. But AppKit isn't the only framework on Mac, so the modern approach is gesture recognizers as a cross-framework common event-handling language."},{"t":87,"title":"Modern event handling with gesture recognizers","body":"**Gesture recognizers** let AppKit provide advanced behaviors without building them yourself, with cross-framework compatibility. The talk covers three solutions that interface well with them — view-based APIs, control events, and custom gesture recognizers — offering the same customizability as tracking loops."},{"t":145,"title":"Selection, context menus, and drag and drop","body":"Common `mouseDown` override uses each have more reliable dedicated APIs: for selection, observe the `selected` property on `NSCollectionViewItem`/`NSTableRowView` or use `NSTableViewDelegate`/`NSOutlineViewDelegate` callbacks; for context menus, use `NSView`'s `defaultMenu`, `NSResponder`'s `menu`, or `menuForEvent` to build dynamically."},{"t":215,"title":"Modern dragging delegate","body":"For collection container views, use modern dragging delegate methods (like `tableView pasteboardWriterForRow`): create an `NSPasteboardItem`, set the data, and return it; similar methods exist on `NSCollectionView`, `NSOutlineView`, and `NSBrowser`."},{"t":232,"title":"Text selection in custom views","body":"For text selection outside `NSTextView`, use the new macOS 27 **NSTextSelectionManager**: it leverages gesture recognizers and brings classic macOS text selection behaviors to any view. Attach it and set up a text selection data source for bidirectional selection, drag and drop with text, toggling, and more."},{"t":266,"title":"Control events and gesture recognizers","body":"The next solution is familiar to UIKit developers: **control events** come to AppKit and can be added to standard controls like buttons and sliders, letting code react to user-driven tracking state changes without complex `mouseDown` logic."},{"t":295,"title":"Control events","body":"Example: instantiate an `NSButton` and register a target and action for a control event — it works **without subclassing NSButton**. Most control events have been available since OS 10.11, and AppKit calls the registered target/action when the event triggers."},{"t":344,"title":"hitTest override","body":"Because gesture recognizers operate on a view and its subviews, overlapping sibling views can silently block mouse events. If a control doesn't respond to a click, check for an overlapping sibling; resize it, or if it's an overlay that shouldn't be resized, override `hitTest` to return `nil` so hit testing falls through to the content underneath."},{"t":351,"title":"Keyboard navigation and status items","body":"Keyboard navigation matters for speed and accessibility. It can be enabled in system settings, with focus moving between controls via tab/shift-tab in the order of the key view loop. Navigation also extends to the menu bar and status items — the latter behaving a bit differently from main menu items."},{"t":384,"title":"autorecalculatesKeyViewLoop","body":"To automatically recalculate the key view loop whenever a view is added or removed, enable **`autorecalculatesKeyViewLoop`** on the window; otherwise you maintain the loop yourself. Status items that show a menu already behave like menu bar menus, but a status item can also be a trigger for actions or transient UI."},{"t":457,"title":"Expanded interface delegate — setup","body":"When a status item shows a custom window, AppKit needs to know when that UI is active for correct keyboard focus. Step one: set the **expanded interface delegate** when the item is created (the example sets `expandedInterfaceDelegate` on `NSStatusItem` in `applicationDidFinishLaunching`)."},{"t":472,"title":"Expanded interface delegate — methods","body":"Implement the `NSStatusItemExpandedInterfaceDelegate` methods: show the window in `statusItem(_:didBegin:)` and hide it in `statusItemDidEndExpandedInterfaceSession`. AppKit calls these to manage the expanded interface session's lifecycle."},{"t":496,"title":"Expanded interface delegate — cancel","body":"When it's time to end the session (e.g. an action was selected), call `.cancel` on `expandedInterfaceSession?` to request dismissal. Note the session may be canceled for you if focus naturally moves elsewhere. SwiftUI menu bar extras do a lot of this for you."},{"t":537,"title":"Continuity across launches","body":"On continuity across launches: a great Mac app quits without pushback and comes back as if never quit. People should be able to quit at any time — because they want to, or because the system needs to reboot (e.g. an overnight software update)."},{"t":548,"title":"Graceful app termination","body":"An app should block quit only when genuinely necessary. When presenting a sheet, the window might not close, which prevents the app from quitting. `NSWindow`'s `preventsApplicationTerminationWhenModal` defaults to true (for good reason — to avoid losing data, e.g. a document that needs saving)."},{"t":585,"title":"preventsApplicationTerminationWhenModal","body":"For modals/sheets that don't strictly require intervention, set **`preventsApplicationTerminationWhenModal`** to `false` to allow more graceful application termination."},{"t":595,"title":"State restoration","body":"Use `NSWindowRestoration` to customize how your app comes back. **State restoration** requires three steps: opt in, encode UI state, and decode to restore windows and UI. The talk then walks through code using `NSWindowRestoration`."},{"t":618,"title":"Set window identifiers for state restoration","body":"Set an identifier for the window in the window controller; for common windows (main, preferences) set an autosave name to restore to the same space and frame (not needed for document windows). Ensure `window.isRestorable = true` so AppKit can call encode/restore, and set a `restorationClass` invoked at relaunch to restore the window itself."},{"t":664,"title":"encodeRestorableState","body":"Use **`encodeRestorableState`** to preserve everything needed to recreate the window's state, calling super. The example encodes the selected item's identifier with a `productIdentifier` key. Avoid encoding data that lives in your document or database — the goal is to reconstruct UI state, not re-serialize the whole app. All `NSResponder`s have an overridable encode method."},{"t":710,"title":"invalidateRestorableState","body":"`encodeRestorableState` is only called when an object's state has been invalidated. Whenever a view hierarchy change should alter the saved state, call **`invalidateRestorableState()`** (the example does so when a different product is selected in the sidebar); later AppKit calls encode on everything invalidated."},{"t":746,"title":"restoreWindow(withIdentifier:)","body":"After relaunch, restore windows first: implement **`restoreWindow(withIdentifier:)`** in the window restoration class to recreate each window, with parameters including the identifier and a completionHandler you must call. Recreate the window controller and window by identifier (the main window is already on the app delegate). Even if creation fails, always call the completionHandler with the error — AppKit waits on every restorable window."},{"t":809,"title":"restoreState","body":"Once windows are restored, finally restore each window's UI in the window controller's **`restoreState`**: AppKit hands back the same coder you encoded, where you fetch the data to reconstruct state, decode identifiers, and hand them to the corresponding view controllers, returning windows to their prior state. See the sample \"Restoring your app's state with AppKit\"."},{"t":849,"title":"Design updates","body":"Moves to the third area — the UI. The **Liquid Glass** material introduced in macOS 26 continues to evolve, with many updates applying automatically so your app benefits without rebuilding."},{"t":864,"title":"Liquid Glass updates in macOS 27","body":"If you adopted Liquid Glass in macOS 26, you get several changes automatically on macOS 27: the automatic `NSScrollEdgeEffectStyle` resolves to a hard-edge effect when there's free-floating text (like a title bar window title); sidebars extend to the window's edges, selection uses semi-bold text for emphasis, and content flows behind them; bordered toolbar items over the sidebar also adopt Liquid Glass."},{"t":941,"title":"Concentricity","body":"macOS 27 adds an effect where glass subtly bounces when clicked, giving a sense the control is responding (Maps uses it for some custom controls), but it should apply only to controls, buttons, or glass containers of interactive controls. Rounded rectangles are a long-standing Apple signature, and AppKit has new API for **concentricity**: corner content can adapt to the shape of its container."},{"t":971,"title":"cornerConfiguration","body":"The closer a view sits to its container's corner, the more its radius should match the container's curve. Achieve this with the **`cornerConfiguration`** API: create a custom view subclass, override `cornerConfiguration` to return an `NSViewCornerConfiguration?`, use `.containerConcentric` on `NSViewCornerRadius` for the radius (computed from the container, with a minimum so corners are always rounded), and use `.uniformCorners` for the same radii across all four corners."},{"t":1019,"title":"Next steps","body":"Recap: identify where your app overrides `mouseDown` and use view APIs, control events, or gesture recognizers instead; prioritize user intent over tracking loops; make the app work as well from the keyboard as the mouse; make quit and relaunch feel seamless; and adopt concentricity in views and buttons."}],"code":[]},"related":[{"id":"203","title":"Read between the strokes with PencilKit","gloss":"用 PencilKit 解讀筆跡內容","gloss_en":"Read handwriting content with PencilKit","category":"uikit","categoryLabel":"UIKit"},{"id":"212","title":"Rev up your CarPlay app","gloss":"強化你的 CarPlay App","gloss_en":"Rev up your CarPlay app","category":"uikit","categoryLabel":"UIKit"},{"id":"219","title":"Enhance the accessibility of your reading app","gloss":"強化你閱讀類 App 的無障礙體驗","gloss_en":"Enhance the accessibility of your reading app","category":"uikit","categoryLabel":"UIKit"},{"id":"221","title":"Prepare your tvOS apps for Dynamic Type","gloss":"讓你的 tvOS App 支援動態字型","gloss_en":"Prepare your tvOS app for Dynamic Type","category":"uikit","categoryLabel":"UIKit"},{"id":"226","title":"Create live communication experiences","gloss":"打造即時通訊體驗","gloss_en":"Build live communication experiences","category":"uikit","categoryLabel":"UIKit"}]}</script>
