<script id="d" type="application/json">{"s":{"id":"246","title":"LLM search using Core Spotlight","gloss":"使用 Core Spotlight 的 LLM 搜尋","category":"ai","categoryLabel":"AI 與機器學習","duration":985,"url":"https://developer.apple.com/videos/play/wwdc2026/246/","takeaway":"結合 SpotlightSearchTool 與 LanguageModelSession，可把基本搜尋升級為以 App 索引為依據的檢索增強（RAG）系統。","chapters":[[0,"Introduction"],[59,"Ask the model with a Foundation Models session"],[101,"Grounding answers with Spotlight tool-calling"],[240,"Configure and add SpotlightSearchTool"],[260,"Set up SpotlightSearchTool"],[290,"Add SpotlightSearchTool to a session"],[384,"Implement an index delegate"],[404,"Displaying results and partial replies"],[406,"Provide full items with an index delegate"],[457,"Track the query token for refresh"],[492,"Customizing with guidance profiles"],[522,"Set a dynamic guidance profile"],[572,"Implement a ContactResolver"],[662,"Reference resolution with a contact resolver"],[684,"Custom pipeline stages"],[694,"Define a custom stage"],[730,"Handle a reply data types"],[767,"Evaluating response quality"],[827,"Define an evaluation dataset with ModelSampleProtocol"],[906,"Define the trajectory expectation"],[917,"Run the evaluation test —"],[953,"Next steps"]],"points":[{"text":"把 **SpotlightSearchTool** 加入 **LanguageModelSession** 的 tools，即可讓模型以 App 的 Core Spotlight 索引為依據回答問題。","hot":true},{"text":"透過 **CSSearchableIndexDelegate** 提供完整項目，並追蹤 query token 來刷新逐步顯示的結果。","hot":false},{"text":"用 **GuidanceProfile** 調整搜尋導引層級，裝置端模型 context 較小時宜採用 focused 導引。","hot":false},{"text":"可實作 **ContactResolver** 做指代解析，並以 **CustomStage** 自訂搜尋管線階段。","hot":false},{"text":"使用 **Evaluations** 框架與 **ModelSampleProtocol**、**TrajectoryExpectation** 建立資料集，量化評估回應品質。","hot":false}],"apis":["CoreSpotlight","SpotlightSearchTool","FoundationModels","LanguageModelSession","CSSearchableIndexDelegate","CSSearchableItem","ContactResolver","CustomStage","Evaluations","ModelSampleProtocol","TrajectoryExpectation"],"audience":"適合**想在 App 中以裝置端模型打造 RAG 搜尋體驗、並善用 Spotlight 索引的開發者**。","gloss_en":"LLM search using Core Spotlight","takeaway_en":"Combining SpotlightSearchTool with LanguageModelSession lets you upgrade basic search into a retrieval-augmented (RAG) system grounded in your app's index.","points_en":[{"text":"Add **SpotlightSearchTool** to a **LanguageModelSession**'s tools so the model can answer questions grounded in your app's Core Spotlight index.","hot":true},{"text":"Provide full items via **CSSearchableIndexDelegate**, and track the query token to refresh results as they're shown incrementally.","hot":false},{"text":"Use **GuidanceProfile** to tune the search guidance level; favor focused guidance when the on-device model's context is small.","hot":false},{"text":"Implement a **ContactResolver** for reference resolution, and use **CustomStage** to customize stages of the search pipeline.","hot":false},{"text":"Use the **Evaluations** framework with **ModelSampleProtocol** and **TrajectoryExpectation** to build datasets and quantitatively assess response quality.","hot":false}],"audience_en":"For **developers who want to build a RAG search experience in their app using on-device models and make good use of the Spotlight index**.","summary":["這場由 Spotlight 工程團隊主講，主題是把 app 既有的搜尋升級成一套**檢索增強（RAG）**的對話式體驗：不再自己拼搜尋字串，而是把 app 內容開放給語言模型推理並生成回應。講者以一個「健行步道」app 為例——它已經把州立公園與步道、完成日期、個人筆記等內容索引進 **Core Spotlight**。一開始只用 Foundation Models 的 **LanguageModelSession** 提問，模型只會憑自身世界知識作答；要讓答案紮根在 app 自己的資料上，就得透過 **tool-calling** 讓模型去查 Spotlight 索引。","核心新 API 是 **SpotlightSearchTool**，它採用 Foundation Models 的 Tool 協定，一行就能讓模型直接搜尋 app 的 Core Spotlight 索引（支援 iOS、iPadOS、macOS、visionOS）。導入分三件事：先**設定工具**（預設搜尋 Spotlight 索引，或用 configuration 指定 file source 等來源）並把它加進 session；接著補強模型在搜尋期間看得到的**額外脈絡**——因為索引裡像文字、HTML 等高度壓縮的資料模型讀不回來，所以要在 index delegate 新增的 **searchableItems(forIdentifiers:)** 裡用 id 取回完整的 **CSSearchableItem** 並補上屬性；最後**呈現結果**，可直接訂閱 `tool.searchResults` 這個 async sequence，逐批拿回結果，並用每筆 reply 的 **queryToken** 判斷何時該刷新 UI（因為一次回應模型可能多次呼叫工具）。","工具還能依所選模型與內容客製。**GuidanceProfile** 能把模型可用的搜尋能力縮小到 app 真正需要的範圍（例如關掉 people、指定要考慮的 attributes），on-device 模型 context 較小時更適合用 focused guidance。**ContactResolver** 提供世界知識做指代消解，把「我」或某人對應到可比對索引 metadata 的身分資訊。針對複雜請求，**custom pipeline stage** 讓模型不只下單純查詢，而是組合查詢與運算（計數、建表、求平均等）；stage 是 **@Generable** 的，模型會按 prompt 即時生成，例如示範中用情感分析算出每段健行的「快樂分數」再排序。Pipeline stage 也可能透過 reply 回傳 count、table、text、statistic 等資料型別，每筆都附上 LLM 生成的 label 供 UI 自由運用。","最後講者用 **Evaluations** 框架說明如何衡量這套體驗的品質。重點放在 **result coverage**：給定一份已索引進 Core Spotlight 的資料集，模型生成的回應有沒有涵蓋我們預期它該找到的項目。流程是先用 **ModelSampleProtocol** 定義含自然語言 input、期望 output 與預期 item identifiers 的資料集（沒有真實資料時可用 Sample Generation API 大量擴充種子樣本），再以 **TrajectoryExpectation** 宣告期望軌跡（例如必須呼叫一次 SpotlightSearchTool 做查詢），最後在測試裡索引資料、跑評估，並對 coverage 等 metric 設定門檻。整場的核心訊息很清楚：我們不再寫搜尋查詢，而是提供內容，把其餘交給智慧處理。"],"deepdive":[{"t":0,"title":"Introduction","body":"講者 Jennifer 開場點出今年用 **Foundation Models** 搭配 **Core Spotlight** 把搜尋帶到新層次：只要把 app 內容開放給大型語言模型推理與生成，就能打造對話式體驗。她以自己的健行步道 app 為貫穿範例——已能瀏覽州立公園與步道、並在完成後寫下個人筆記，現在希望能直接問模型關於去過或該嘗試的健行。"},{"t":59,"title":"Ask the model with a Foundation Models session","body":"示範最基本的起點：在 app 裡引入 **LanguageModelSession**，就能對模型提出廣泛問題，但它只會憑自身**世界知識**作答。講者強調她其實只想要關於 app 已知步道的答案，這就帶出後續用 Spotlight 為答案紮根的需求。"},{"t":101,"title":"Grounding answers with Spotlight tool-calling","body":"說明 Foundation Models 的 **Tool 協定**如何擴充模型能力：工具宣告自己的 arguments、output 與用途說明，模型決定要用時就生成呼叫參數、再用其 output 生成回應。據此推出能讓模型對 app 的 Core Spotlight 索引下搜尋的 **SpotlightSearchTool**，並提醒前提是 app 已透過 Core Spotlight 捐贈可搜尋內容。"},{"t":240,"title":"Configure and add SpotlightSearchTool","body":"概述採用 SpotlightSearchTool 的三個面向：為想要的搜尋類型**設定工具**、在搜尋進行時補上**額外脈絡**以取得最佳回應、以及在 UI 中以不同方式**呈現結果**。以「我去過哪些健行？」這類需要按完成日期、地點等屬性搜尋的問題作為動機。"},{"t":260,"title":"Set up SpotlightSearchTool","body":"設定工具與直接做 Spotlight 查詢差別不大：import **CoreSpotlight** 與 **FoundationModels** 後，一行 `SpotlightSearchTool()` 就能搜尋 app 索引。也可傳入 configuration 自訂來源，例如指定 **.files** 來搜尋 app sandbox 內的檔案路徑。"},{"t":290,"title":"Add SpotlightSearchTool to a session","body":"選定模型（**SystemLanguageModel** 或透過 Model Provider API 自選）後，把 tool 實例加進 **LanguageModelSession** 即可開始取得回應。講者拆解其「魔法」其實是一條 tool-calling 軌跡：模型決定使用工具、生成查詢、Spotlight 執行並回傳結果集描述、模型再據此推理生成最終回應。"},{"t":384,"title":"Implement an index delegate","body":"點出問題：索引裡像文字內容與 HTML 採高度壓縮表示，可被搜尋卻無法還原成模型讀得懂的形式。因此為 **CSSearchableIndexDelegate** 新增 **searchableItems(forIdentifiers:)**，讓工具能依 unique identifier 取回完整 **CSSearchableItem**，以便在數百萬筆結果中有效率地管理回應。"},{"t":404,"title":"Displaying results and partial replies","body":"說明兩種呈現方式：session 回應是對結果集的簡潔描述，適合 assistant 風格介面直接顯示；而搜尋結果本身也可直接從 SpotlightSearchTool 取得，對大型結果集的清單式顯示最適合。搜尋會以批次回傳結果。"},{"t":406,"title":"Provide full items with an index delegate","body":"延伸 index delegate 的用途：這也是替模型補上**不適合捐贈做搜尋、但有助推理的 metadata** 的好時機，在 delegate 回傳 item 時為其設定額外屬性供模型參考。讓模型在生成回應時能看到原本壓縮、無法還原的細節。"},{"t":457,"title":"Track the query token for refresh","body":"搜尋 reply 是一連串 async sequence 事件，每筆可能含一批結果直到工具呼叫完成。由於同一次回應模型可能多次呼叫 SpotlightSearchTool，因此要用每筆 reply 的 **queryToken** 判斷何時開新的顯示區段、何時刷新 UI，確保介面與模型同步。"},{"t":492,"title":"Customizing with guidance profiles","body":"概述三種客製方式：**guidance profile** 縮小工具的搜尋能力範圍、提供**世界知識**協助指代消解、以及實作 **custom pipeline stage** 改善模型對 app 內容的推理。SpotlightSearchTool 預設把全套搜尋能力交給模型做 guided generation，但 profile 可只保留 app 需要的部分。"},{"t":522,"title":"Set a dynamic guidance profile","body":"用 **GuidanceProfile** 選擇性開啟 people、dates 等能力，甚至指定模型該考慮的確切 attribute 清單；健行 app 不捐贈人際關係，就可略過作者／收件人的搜尋引導。建立工具時以 profile 設 **.dynamic** guide level；on-device 模型 context 受限時，則建議用 **.focused** 處理較簡單的搜尋能力。"},{"t":572,"title":"Implement a ContactResolver","body":"示範用 **ContactResolver** 提供索引裡沒有的脈絡來做**指代消解**：當使用者問到同行的某人時，模型需要知道那是誰。resolver 回傳與使用者身分相關的聯絡資訊（顯示名稱、email、暱稱等），來源可以是帳號 profile、Contacts 框架或登入 session，再設給 `tool.contactResolver`。"},{"t":662,"title":"Reference resolution with a contact resolver","body":"進一步說明 resolver 回傳的聯絡資訊會被拿去比對索引中的 metadata，協助工具把結果過濾到正確的集合。例如 app 若有捐贈人際關係，使用者就能詢問同行夥伴，而模型靠 resolver 把「那個人」對應到實際身分。"},{"t":684,"title":"Custom pipeline stages","body":"針對很複雜的請求，模型可能放棄單純查詢，改用 **pipeline search**：把對索引的查詢與對結果集的運算結合以求最高效率。以「今年走了幾條步道、每月平均幾英里」為例，模型可拆成搜尋已完成健行、按月計數建表、再對所有計數求平均等階段。"},{"t":694,"title":"Define a custom stage","body":"示範自訂的 **HappinessStage**：以 CSSearchableItem 為 input、回傳 scored 版本為 output，分數可由對 notes 屬性跑情感分析、或結合五星評等等自訂邏輯算出。stage 是 **@Generable**，可用 **@Guide** 屬性（如 threshold）告訴模型偏好哪些結果，最後加進工具 configuration 的 customStages 即可註冊。"},{"t":730,"title":"Handle a reply data types","body":"說明模型可能在 reply 中回傳 pipeline stage 的 output data 作為另一種部分結果。資料型別涵蓋 **items、scoredItems、groupedItems、count、table、statistic、text** 等，app 可顯示其中部分或全部；每筆 reply 還附帶 LLM 生成的 **label** 描述內容，讓 UI 有最大彈性。"},{"t":767,"title":"Evaluating response quality","body":"在這麼多客製選項下，講者用 **Evaluations** 框架來廣泛驗證模型在 app 中的回應品質：不只能評估工具呼叫是否得當、回應是否有意義，還能快速反覆調整 app 的可搜尋內容搭配不同 guidance profile。本場聚焦以 **result coverage** 衡量健行對話體驗。"},{"t":827,"title":"Define an evaluation dataset with ModelSampleProtocol","body":"用採用 **ModelSampleProtocol** 的 **TrailRequest** 定義資料集，包含自然語言 input、模型回應 output、軌跡的 expectation，以及一組預期工具應回傳的 item identifiers。沒有真實資料時可用 **Sample Generation API** 從種子樣本（以 JSON 序列化的 query 與預期 id）大量擴充出多種變化。"},{"t":906,"title":"Define the trajectory expectation","body":"說明如何宣告期望軌跡：對這些樣本，回應軌跡應包含一次呼叫 SpotlightSearchTool 做查詢的動作，於是用 **TrajectoryExpectation** 搭配 **ToolExpectation**（如 unordered、針對 query 參數做 keyOnly 比對）來表達。同時概覽會把「最終回應涵蓋多少預期項目」納入考量的評估流程。"},{"t":917,"title":"Run the evaluation test —","body":"在測試 target 中載入步道 items 與 samples、把 items 捐贈進 Core Spotlight、並為此評估設定 SpotlightSearchTool，然後執行 evaluation。跑完後對任一納入的 metric（如 **ResultCoverage**）設定期望，例如以 `#expect(coverageMean >= 0.5)` 要求跨查詢的結果涵蓋率至少達 50%。"},{"t":953,"title":"Next steps","body":"鼓勵下載健行步道 app 範例程式碼實際操作、嘗試加入自己的自訂功能，並參考 evaluations agentic 深入講座為 app 建立自己的評估套件。結語點題：我們不再寫搜尋查詢，而是提供內容，讓智慧完成其餘的事。"}],"summary_en":["Presented by the Spotlight engineering team, this session is about upgrading an app's basic search into a retrieval-augmented, conversational experience: instead of hand-writing search queries, you make your app's content available to a language model to reason over and generate responses. The running example is a hiking-trails app that has already indexed state parks, trails, completion dates, and personal notes into **Core Spotlight**. Starting with just a Foundation Models **LanguageModelSession**, the model answers only from its own world knowledge; to ground answers in the app's own data, you use **tool-calling** to let the model search the Spotlight index.","The key new API is **SpotlightSearchTool**, which adopts the Foundation Models Tool protocol so that, in a single line, a model can search your app's Core Spotlight index (available on iOS, iPadOS, macOS, and visionOS). Adoption is three things: **configure the tool** (search the Spotlight index by default, or use a configuration to specify sources like file paths) and add it to a session; **add context** the model can see during the search — because compact representations like text and HTML can't be recovered for the model, you implement the new **searchableItems(forIdentifiers:)** on your index delegate to return the full **CSSearchableItem** by id and attach extra attributes; and **display results** by subscribing to `tool.searchResults`, an async sequence that delivers results in batches, using each reply's **queryToken** to know when to refresh the UI (since one response may call the tool multiple times).","The tool can be customized for the chosen model and content. A **GuidanceProfile** scopes the model's search capabilities to only what the app needs (e.g. disabling people, listing specific attributes); on-device models with smaller context are better served by focused guidance. A **ContactResolver** supplies world knowledge for reference resolution, mapping a person reference to identity info that can be matched against index metadata. For complex requests, a **custom pipeline stage** lets the model combine queries with computation (counting, table-building, averaging); stages are **@Generable**, generated on demand from the prompt — the demo computes a sentiment-based \"happiness score\" per hike and sorts. Pipeline stages can also return data types like count, table, text, and statistic via replies, each carrying an LLM-generated label for flexible UI.","Finally the **Evaluations** framework is used to measure the experience's quality, focused on **result coverage**: given a dataset indexed in Core Spotlight, how well does the model's response cover the items we expect it to find. You define a dataset with **ModelSampleProtocol** (natural-language input, expected output, and expected item identifiers — expandable from seed samples with the Sample Generation APIs when real data is scarce), declare the expected path with a **TrajectoryExpectation** (e.g. one SpotlightSearchTool query call), then index the data, run the evaluation, and assert thresholds on metrics like coverage. The closing message is clear: we no longer write search queries — we provide the content and let intelligence do the rest."],"deepdive_en":[{"t":0,"title":"Introduction","body":"Jennifer opens by noting that this year **Foundation Models** plus **Core Spotlight** take search to a new level: simply make your app's content available to a large language model for reasoning and response generation to build conversational experiences. She frames it with her hiking-trails app — which already browses state parks and trails and lets her write personal notes after a hike — and her wish to ask a model about hikes she's done or should try."},{"t":59,"title":"Ask the model with a Foundation Models session","body":"She shows the simplest starting point: introducing a **LanguageModelSession** lets the app ask broad questions, but the model answers only from its own **world knowledge**. She stresses she really only wants answers about the trails her app knows about, motivating the need to ground answers using Spotlight."},{"t":101,"title":"Grounding answers with Spotlight tool-calling","body":"Explains the Foundation Models **Tool protocol**: a tool declares its arguments, output, and instructions; when the model decides to use it, it generates the call arguments and uses the output for response generation. This leads to **SpotlightSearchTool**, which lets a model search the app's Core Spotlight index, with the prerequisite that the app already donates searchable content to Core Spotlight."},{"t":240,"title":"Configure and add SpotlightSearchTool","body":"Outlines the three aspects of adopting SpotlightSearchTool: **configure** the tool for the kind of search wanted, add **context** while the search is active for the best response, and **display results** in the UI in different ways. The motivating question — \"What hikes have I gone on?\" — requires searching by attributes like completion date and location."},{"t":260,"title":"Set up SpotlightSearchTool","body":"Configuring the tool isn't far from a direct Spotlight query: after importing **CoreSpotlight** and **FoundationModels**, one line of `SpotlightSearchTool()` is ready to search the app's index. A custom configuration can also be supplied, e.g. specifying a **.files** source to search file paths in the app's sandbox."},{"t":290,"title":"Add SpotlightSearchTool to a session","body":"After choosing a model (the **SystemLanguageModel** or one via the new Model Provider APIs), add the tool instance to a **LanguageModelSession** to start getting responses. She breaks down the \"magic\" as a tool-calling trajectory: the model decides to use the tool, generates a query, Spotlight executes and returns a description of the result set, and the model reasons over it to generate its final response."},{"t":384,"title":"Implement an index delegate","body":"Names the problem: index data like text content and HTML is stored in a highly compact representation that can be searched but not recovered for the model to read. So a new **searchableItems(forIdentifiers:)** is added to **CSSearchableIndexDelegate** to recover the full **CSSearchableItem** by unique identifier, letting the model efficiently manage responses over potentially millions of results."},{"t":404,"title":"Displaying results and partial replies","body":"Describes two display paths: the session response is a concise description of the result set, ideal to show directly in an assistant-style interface, while the searchable items are also available directly on SpotlightSearchTool — best for list-style display, especially when the result set is large. Search replies pass back results in batches."},{"t":406,"title":"Provide full items with an index delegate","body":"Extends the index delegate's role: it's also the right moment to attach **metadata that doesn't make sense to donate for search but is useful for the model to reason about**, setting additional attributes on the item when the delegate returns it. This lets the model see details that were otherwise compacted and unrecoverable."},{"t":457,"title":"Track the query token for refresh","body":"Search replies arrive as an async sequence of events, each possibly including a batch of results until the tool call completes. Because the model may call SpotlightSearchTool more than once for a single response, use each reply's **queryToken** to decide when to start a new display section and when to refresh the UI so it stays in sync with the model."},{"t":492,"title":"Customizing with guidance profiles","body":"Overviews three customization paths: a **guidance profile** to scope the tool's search capabilities, providing **world knowledge** to help reference resolution, and implementing **custom pipeline stages** to improve reasoning over app content. SpotlightSearchTool gives its full capability set to the model for guided generation, but a profile narrows it to what the app needs."},{"t":522,"title":"Set a dynamic guidance profile","body":"Use a **GuidanceProfile** to selectively enable capabilities like people and dates, even specifying the exact attribute list the model should consider; since the hiking app donates no person relationships, author/recipient search can be skipped. Create the tool with a **.dynamic** guide level using the profile; for on-device models with restricted context, prefer **.focused** for simpler search capabilities."},{"t":572,"title":"Implement a ContactResolver","body":"Demonstrates a **ContactResolver** to provide context not in the index for **reference resolution**: when a user asks about another participant, the model needs to know who that is. The resolver returns contact info tied to the user's identity (display name, emails, nicknames) sourced from an account profile, the Contacts framework, or a sign-in session, then is set on `tool.contactResolver`."},{"t":662,"title":"Reference resolution with a contact resolver","body":"Further explains that the resolver's contact info is matched against metadata in the index to filter results to the right set. For example, if the app donated person relationships, a user could ask about trail companions, and the resolver maps \"that person\" to a concrete identity."},{"t":684,"title":"Custom pipeline stages","body":"For really complex requests the model may forgo a simple query in favor of a **pipeline search**: combining index queries with computation over the result set for maximal efficiency. The example \"how many trails this year, and average miles per month\" can be broken into searching completed hikes, a counting stage that builds a table by month, then a stage averaging the counts."},{"t":694,"title":"Define a custom stage","body":"Demonstrates a custom **HappinessStage**: input is CSSearchableItem and output a scored version, with the score computed by sentiment analysis over the notes attribute or custom logic like five-star ratings. The stage is **@Generable**, using **@Guide** properties (e.g. threshold) to inform which results to prefer, and is registered by adding it to the tool configuration's customStages."},{"t":730,"title":"Handle a reply data types","body":"Explains the model may send back a pipeline stage's output data in a reply as another kind of partial result. The data types span **items, scoredItems, groupedItems, count, table, statistic, and text**, and the app can display some or all; each reply also carries an LLM-generated **label** describing the content for maximum UI flexibility."},{"t":767,"title":"Evaluating response quality","body":"With so many customization options, she turns to the **Evaluations** framework to verify response quality broadly: not only how well the model calls the tool and how meaningful the response is, but also rapidly iterating on searchable content paired with different guidance profiles. This session focuses on **result coverage** for the hiking conversational experience."},{"t":827,"title":"Define an evaluation dataset with ModelSampleProtocol","body":"A **TrailRequest** adopting **ModelSampleProtocol** defines the dataset with natural-language input, the model-response output, a trajectory expectation, and a set of expected item identifiers the tool should return. Without real data, the **Sample Generation APIs** expand seed samples (query and expected ids serialized as JSON) into many variations."},{"t":906,"title":"Define the trajectory expectation","body":"Shows how to declare the expected path: for these samples the response trajectory should include one call to SpotlightSearchTool to perform a query, expressed with a **TrajectoryExpectation** plus a **ToolExpectation** (e.g. unordered, key-only match on the query argument). It also previews an evaluation flow that accounts for how many expected items appear in the final response."},{"t":917,"title":"Run the evaluation test —","body":"In the test target, load the trail items and samples, donate the items to Core Spotlight, and configure SpotlightSearchTool for the evaluation, then run it. After the run, set expectations on any included metric such as **ResultCoverage**, e.g. `#expect(coverageMean >= 0.5)` to require at least 50% coverage across queries."},{"t":953,"title":"Next steps","body":"Encourages downloading the hiking-trails sample code, trying your own custom functionality, and building an evaluation suite with inspiration from the evaluations agentic deep dive. The closing line: we're not writing search queries anymore — we provide the content and let intelligence do the rest."}],"code":[]},"related":[{"id":"241","title":"What’s new in the Foundation Models framework","gloss":"Foundation Models 框架的新功能","gloss_en":"What's new in the Foundation Models framework","category":"ai","categoryLabel":"AI 與機器學習"},{"id":"242","title":"Build agentic app experiences with the Foundation Models framework","gloss":"用 Foundation Models 框架打造 agentic App 體驗","gloss_en":"Build agentic app experiences with Foundation Models","category":"ai","categoryLabel":"AI 與機器學習"},{"id":"299","title":"Create robust evaluations for agentic apps","gloss":"為 agentic App 建立穩健的評估","gloss_en":"Create robust evaluations for agentic apps","category":"ai","categoryLabel":"AI 與機器學習"},{"id":"319","title":"Build with the new Apple Foundation Model on Private Cloud Compute","gloss":"在 Private Cloud Compute 上使用全新 Apple Foundation Model 開發","gloss_en":"Build with the new Apple Foundation Model on Private Cloud Compute","category":"ai","categoryLabel":"AI 與機器學習"},{"id":"326","title":"Integrate on-device AI models into your app using Core AI","gloss":"用 Core AI 把裝置端 AI 模型整合進你的 App","gloss_en":"Integrate on-device AI models with Core AI","category":"ai","categoryLabel":"AI 與機器學習"}]}</script>
