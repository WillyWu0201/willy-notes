<script id="d" type="application/json">{"s":{"id":"268","title":"Profile, fix, and verify: Improve app responsiveness with Instruments","gloss":"用 Instruments 剖析、修正並驗證 App 反應速度","category":"swift","categoryLabel":"Swift","duration":1603,"url":"https://developer.apple.com/videos/play/wwdc2026/268/","takeaway":"用 Swift Concurrency instrument、Time Profiler 與 System Trace 建立「剖析→修正→驗證」的流程,把卡頓工作移出 main actor 來提升反應速度。","chapters":[[0,"Introduction"],[72,"Diagnostic flow"],[341,"Add signpost interval around Lasso Selection"],[426,"Sampling data visualization"],[731,"Existentials"],[759,"Concrete Types"],[766,"Concrete Types + Generics"],[769,"Concrete Types + Generics + Enums"],[961,"Execution contention"],[1104,"Thumbnail Rendering"],[1109,"Thumbnail Rendering Off Main Actor"],[1229,"System blocking"],[1452,"File Saving"],[1465,"File Saving off Main thread"],[1567,"Next steps"]],"points":[{"text":"建立清楚的**診斷流程(profile → fix → verify)**,用 **Swift Concurrency instrument、Time Profiler、System Trace** 三件工具搭配。","hot":false},{"text":"用 **OSSignposter** 標出關鍵區間(如 Lasso Selection),讓取樣資料更容易對應到實際操作。","hot":false},{"text":"比較 **existential(any Foo)、concrete types、generics、enums** 對效能的影響,協助選擇正確的型別表示。","hot":false},{"text":"把昂貴工作標成 **@concurrent** 移出 main actor:例如縮圖渲染從 Task 改為 Task { @concurrent } 可避免阻塞 UI。","hot":true},{"text":"**System blocking / 檔案寫入**也應移出主執行緒:把 PropertyListEncoder 編碼與 data.write 放進 Task { @concurrent }。","hot":false}],"apis":["Instruments","OSSignposter","Swift Concurrency","Time Profiler","System Trace","Task","@concurrent","MainActor","PropertyListEncoder"],"audience":"**遇到捲動卡頓、UI 反應遲鈍,想系統化用 Instruments 找出並修正主執行緒瓶頸的 Swift 開發者。**","gloss_en":"Profile, fix, and verify: Improve app responsiveness with Instruments","takeaway_en":"Use the Swift Concurrency instrument, Time Profiler, and System Trace to build a profile-fix-verify workflow, moving stuttering work off the main actor to improve responsiveness.","points_en":[{"text":"Establish a clear **diagnostic workflow (profile → fix → verify)**, pairing the three tools: **Swift Concurrency instrument, Time Profiler, and System Trace**.","hot":false},{"text":"Use **OSSignposter** to mark key intervals (such as Lasso Selection) so sampled data maps more easily to actual operations.","hot":false},{"text":"Compare the performance impact of **existentials (any Foo), concrete types, generics, and enums** to help choose the right type representation.","hot":false},{"text":"Mark expensive work as **@concurrent** to move it off the main actor: for example, changing thumbnail rendering from Task to Task { @concurrent } avoids blocking the UI.","hot":true},{"text":"**System blocking / file writes** should also move off the main thread: put PropertyListEncoder encoding and data.write inside Task { @concurrent }.","hot":false}],"audience_en":"Swift developers **facing scroll stutter or sluggish UI who want to systematically use Instruments to find and fix main-thread bottlenecks**.","summary":["由 Xcode 團隊的 Art 與 Instruments 團隊的 Harjas 共同主講，主題是用 **Instruments 27** 系統化地診斷與修復 app 的反應性（responsiveness）問題。講者先建立一套心智模型：你寫的 Swift 程式碼其實隱藏了 dynamic dispatch、safety checks、reference counting，再往下依賴 OS 的記憶體配置、行程排程與 I/O，最後才到硬體。掉幀或卡頓（hang）時的第一步永遠是 **Time Profiler**——若 CPU 使用率高，代表程式碼執行過久（程式碼效能瓶頸）；若 CPU 閒置卻仍卡住，代表 main thread 在等待某項資源（File I/O、同步鎖、IPC）。","全場以一個正在原型開發的筆記 app 為例，重現三個 hang：存檔不靈敏、捲動不流暢、套索（lasso）工具卡頓。重點實務原則是務必對 **release build** 進行 profiling，並善用 **os_signpost**（透過 `OSSignposter` 標記 interval，設定 subsystem 與 category 為 points of interest）讓事件自動出現在時間軸上，便於把 trace 過濾到特定時段。Instruments 27 的介面有時間軸、依選取而變的 detail 區，以及全新的 Inspector 面板。","三個 hang 對應三種症狀與解法。第一個套索 hang 的 main thread CPU 接近 100%，用新的 **Top Functions** 模式（以 self weight 把分散在各 call path 的同一函式合併）找出兇手是 `swift_project_boxed_opaque_existential`——也就是 existential（`any` 協定型別）的拆箱成本太高；改用 concrete types 與 generics 後，再以全新的 **Run Comparisons** 直接在同一份文件中比對 baseline 與優化後的 trace，綠色代表改善、紅色代表退化，確認 overhead 已消除。第二個捲動 hang 用新的 **Swift executors instrument** 看出多個 renderThumbnail task 全擠在 **Main Actor** 上，替 task 加上 **@concurrent** 屬性即可移到 global executor 並行渲染。","第三個存檔 hang 的 CPU 反而只有約 20%，代表 main thread 被「阻塞（blocked）」而非忙碌。講者用 **System Trace** 模板觀察執行緒的 running／runnable／blocked 狀態轉換，發現一個 write system call 橫跨 on-core 與 off-core 時間；Inspector 顯示它正在 main thread 上同步寫入超過 **1.7 GB** 資料、耗時逾 500ms（其中近 300ms 在等磁碟）。把 `data.write` 包進 `Task { @concurrent }` 移到背景後即解除阻塞。總結：依症狀挑工具——CPU 過載用 Top Functions、資源爭用用 Swift Concurrency instrument、執行緒閒置卡住用 System Trace；並謹記永遠 profile release build、用 os_signpost 標好可靠的 interval。"],"deepdive":[{"t":0,"title":"Introduction","body":"Art 與 Harjas 開場，點出流暢的 UI 是好 app 的基本盤，但背後牽涉整個軟體堆疊。強調即使簡單的程式碼也隱藏 compiler 與 runtime 注入的 **dynamic dispatch、safety checks、reference counting**，再往下依賴 OS 與硬體；**Instruments 27** 的目標就是讓人更容易看懂並優化這些層次。"},{"t":72,"title":"Diagnostic flow","body":"建立核心診斷流程：掉幀或卡頓時先用 **Time Profiler** 取得高階全貌。CPU 高 → 程式碼跑太久，靠重構演算法或把工作移到背景解決；CPU 閒置卻仍卡 → main thread 在等資源（**File I/O、同步鎖、IPC**），而 Time Profiler 只看活躍 CPU 週期、看不到這類阻塞。並介紹將用一個筆記 app 重現三個 hang。"},{"t":341,"title":"Add signpost interval around Lasso Selection","body":"示範用 **OSSignposter** 在套索選取前後標記一個 interval（`beginInterval`／`endInterval`），subsystem 設為 \"Demo App\"、category 設為 points of interest，讓資料自動出現在 points of interest track。接著可在時間軸上找到該 interval 並用 context menu 把 trace 過濾到此時段，確認 main thread CPU 接近 100%。"},{"t":426,"title":"Sampling data visualization","body":"Art 解釋 Time Profiler 如何把原始執行轉成 call tree：用硬體計時器（預設每 1ms）對所有核心取樣當前 call stack，每個函式累加 weight、堆疊最底的函式得到 self-weight。極快、在兩次取樣間就結束的呼叫（如 `swift_retain`）可能完全不被記錄。"},{"t":731,"title":"Existentials","body":"對應介紹中的 call tree／flame graph 概念與 existential 主題。flame graph 把 call tree 映成空間區塊（垂直為 call stack、水平為彙總 CPU 時間、越寬越貴）；但被到處呼叫的 runtime 函式其成本會被拆散到各分支，難以判斷誰最耗時——這正是 Top Functions 要解決的問題。並以 `any Foo` 說明 existential。"},{"t":759,"title":"Concrete Types","body":"示範用 **concrete types** 取代 existential 的替代寫法：為每個具體型別（TypeA、TypeB）各自提供多載函式，讓編譯器掌握更多資訊以做更佳最佳化。"},{"t":766,"title":"Concrete Types + Generics","body":"進一步加入 **generics**（`func bar\u003cT: Foo>(_:)`）作為兼顧彈性與效能的替代方案，避免 existential 的拆箱開銷；並提及可參考 WWDC22 的 \"Embrace Swift generics\"。"},{"t":769,"title":"Concrete Types + Generics + Enums","body":"補上第三種替代方案 **enums**（以 case 包裝不同具體型別），在合適情境下也能取代 existential，同樣給編譯器更多資訊以利最佳化。"},{"t":961,"title":"Execution contention","body":"回到資料分析：flame graph 顯示時間分散在 canvas 渲染的多條 codepath、沒有單一明顯瓶頸。改用新的 **Top Functions** 模式（以 self weight 合併各處節點），找出最耗時的是 `swift_project_boxed_opaque_existential`，於是請 Xcode coding assistant 把繪圖碼改用 concrete types 與 generics，再以 **Run Comparisons** 在同份文件中比對 baseline 與優化後 trace（紅退化、綠改善），確認該 overhead 已完全移除。"},{"t":1104,"title":"Thumbnail Rendering","body":"處理第二個 hang：對應的 points of interest 沒有 log，改用 Instruments 27 全新的 **Swift executors instrument** 觀察 Main Actor。發現每次 hang 都有名為 renderThumbnail 的 Swift task 在 **Main Actor** 上各跑數百 ms，且 CPU 仍接近 100%——這些 task 因從 SwiftUI 呼叫而繼承了 Main Actor context，與關鍵 UI 更新爭用資源。"},{"t":1109,"title":"Thumbnail Rendering Off Main Actor","body":"解法是把縮圖渲染移出 Main Actor：在 `Task` initializer 加上 **@concurrent** 屬性，讓它移到 global executor；Swift 編譯器會檢查此改動不引入 race condition。更新後的 trace 中，渲染 task 已從 Main Actor track 移到 global executor track，不僅消除 hang 還能並行渲染。"},{"t":1229,"title":"System blocking","body":"處理第三個存檔 hang：用 Writing To File signpost interval 定位後發現 CPU 僅約 20%，代表 main thread 是被「阻塞」而非忙碌。講者解說執行緒在 **running／runnable／blocked** 之間的狀態轉換——資源未就緒時 kernel 會把執行緒逐出 CPU，就緒後先進 runnable 排隊等排程器分配核心；那 20% 正是執行緒短暫醒來協調下一階段所致。"},{"t":1452,"title":"File Saving","body":"用 **System Trace** 模板檢視該 hang：activity lane 出現大量空白代表執行緒被阻塞；紫色 interval 是 system call，點選會一併高亮整個橫跨 on-core 與 off-core 的連續 write call。Inspector 顯示其參數——file descriptor、buffer 位址、以及最關鍵的 size，正在 main thread 上同步寫入逾 **1.7 GB**，單次操作耗時逾 500ms、其中近 300ms 在等磁碟。"},{"t":1465,"title":"File Saving off Main thread","body":"示範修復：原本用 `PropertyListEncoder` 序列化後在 main thread 上同步呼叫 `data.write(options: .atomic)`，正是阻塞元兇。把整段編碼與寫檔包進 `Task { @concurrent }` 移到背景 thread pool，即可解除 Main Actor 阻塞；新 trace 中 main thread 不再有 write system call，該 syscall 出現在背景執行緒上。"},{"t":1567,"title":"Next steps","body":"總結：依症狀匹配工具——CPU 過載用 **Top Functions** 找分散的軟體 overhead、用 **Run Comparison** 驗證改善；task 爭用資源用 **Swift Concurrency instrument** 找 actor 壅塞；執行緒閒置卡住用 **System Trace** 與 Inspector 揪出同步阻塞（如 file I/O）。並再次強調永遠 profile release build、用 os_signpost 確保 interval 可靠；延伸推薦 WWDC23 \"Analyze hangs with Instruments\"。"}],"summary_en":["Presented jointly by Art from the Xcode team and Harjas from the Instruments team, this session shows how to diagnose and fix app responsiveness problems systematically with **Instruments 27**. They first establish a mental model: the Swift you write hides dynamic dispatch, safety checks, and reference counting, then relies on the OS for memory, scheduling, and I/O, and finally on hardware. When an app drops frames or hangs, the first stop is always the **Time Profiler**: high CPU means code is taking too long (a code bottleneck), while a hang with an idle CPU means the main thread is blocked waiting on a resource (File I/O, a lock, or IPC).","The whole talk works through a prototype note-taking app that exhibits three hangs: unresponsive saving, janky scrolling, and a stuttering lasso tool. Two key practices: always profile a **release build**, and use **os_signpost** (mark an interval with `OSSignposter`, setting subsystem and category to points of interest) so events show up on the timeline and you can filter the trace to a specific window. The Instruments 27 UI has a timeline, a selection-driven detail area, and a brand-new Inspector panel.","Each hang maps to a distinct symptom and fix. For the lasso hang the main thread sits near 100% CPU; the new **Top Functions** mode (which merges the same function scattered across call paths by self weight) reveals the culprit is `swift_project_boxed_opaque_existential`, the cost of unwrapping existentials (the `any` protocol type). After switching to concrete types and generics, the new **Run Comparisons** feature diffs the baseline and optimized traces in a single document, marking improvements green and regressions red, confirming the overhead is gone. For the scrolling hang, the new **Swift executors instrument** shows multiple renderThumbnail tasks crowding the **Main Actor**; adding the **@concurrent** attribute moves them onto the global executor to render in parallel.","The save hang shows only ~20% CPU, meaning the main thread is blocked rather than busy. Using the **System Trace** template to watch running/runnable/blocked transitions, they find a write system call spanning on- and off-core time; the Inspector reveals it is synchronously writing over **1.7 GB** on the main thread, taking more than 500ms (nearly 300 of them waiting on disk). Wrapping `data.write` in a `Task { @concurrent }` moves it to the background and unblocks the UI. The takeaway: match the tool to the symptom: Top Functions for CPU overload, the Swift Concurrency instrument for contention, System Trace for idle-thread blocking, and always profile a release build with reliable os_signpost intervals."],"deepdive_en":[{"t":0,"title":"Introduction","body":"Art and Harjas open by noting that a fluid UI is the baseline for a great app, yet a lot happens behind the scenes. They stress that even simple code hides compiler- and runtime-injected **dynamic dispatch, safety checks, and reference counting**, then relies on the OS and hardware; **Instruments 27** aims to make these layers easier to understand and optimize."},{"t":72,"title":"Diagnostic flow","body":"Establishes the core flow: when frames drop or the app hangs, start with the **Time Profiler** for a high-level view. High CPU means code is taking too long, fixed by refactoring algorithms or offloading work; an idle CPU during a hang means the main thread is waiting on a resource (**File I/O, a lock, or IPC**), which the Time Profiler can't see since it only watches active CPU cycles. Introduces the note-taking app with three hangs."},{"t":341,"title":"Add signpost interval around Lasso Selection","body":"Demos using **OSSignposter** to mark an interval around lasso selection (`beginInterval`/`endInterval`), with subsystem \"Demo App\" and category points of interest so it surfaces automatically in the points of interest track. The interval can then be found on the timeline and used to filter the trace, confirming the main thread runs near 100% CPU."},{"t":426,"title":"Sampling data visualization","body":"Art explains how the Time Profiler turns raw execution into a call tree: a hardware timer (default 1ms) samples the call stack on every core, each function gains weight and the bottom-most gets self-weight. Very fast calls like `swift_retain` that start and finish between samples may never be recorded."},{"t":731,"title":"Existentials","body":"Covers the flame graph and the existential topic. A flame graph maps the call tree to spatial blocks (vertical is the call stack, horizontal is aggregated CPU time, wider is more expensive); but runtime functions called from everywhere have their cost fractured across branches, making it hard to see what burned the most cycles, which is exactly what Top Functions addresses. Illustrates an existential with `any Foo`."},{"t":759,"title":"Concrete Types","body":"Shows replacing existentials with **concrete types**: provide overloaded functions for each concrete type (TypeA, TypeB) so the compiler has more information for better optimizations."},{"t":766,"title":"Concrete Types + Generics","body":"Adds **generics** (`func bar\u003cT: Foo>(_:)`) as an alternative that keeps flexibility while avoiding existential unboxing overhead; references WWDC22's \"Embrace Swift generics\" for more."},{"t":769,"title":"Concrete Types + Generics + Enums","body":"Adds a third alternative, **enums** (wrapping distinct concrete types in cases), which can replace existentials where appropriate and likewise give the compiler more information to optimize."},{"t":961,"title":"Execution contention","body":"Back in the data: the flame graph shows time scattered across canvas-rendering codepaths with no single obvious culprit. The new **Top Functions** mode (merging scattered nodes by self weight) surfaces `swift_project_boxed_opaque_existential` as the top cost, so Xcode's coding assistant rewrites the drawing code to use concrete types and generics, and **Run Comparisons** diffs baseline vs optimized in one document (red regressions, green improvements), confirming the overhead is removed."},{"t":1104,"title":"Thumbnail Rendering","body":"For the second hang, the points of interest track has no logs, so the new **Swift executors instrument** is used to inspect the Main Actor. It shows a renderThumbnail Swift task running a few hundred ms on the **Main Actor** during each hang, with CPU still near 100%; the tasks inherited the Main Actor context because they were called from SwiftUI, competing with critical UI updates."},{"t":1109,"title":"Thumbnail Rendering Off Main Actor","body":"The fix moves thumbnail rendering off the Main Actor by adding the **@concurrent** attribute to the `Task` initializer, sending it to the global executor; the Swift compiler verifies the change introduces no data races. In the updated trace the rendering tasks move from the Main Actor track to the global executor track, eliminating the hang and enabling parallel rendering."},{"t":1229,"title":"System blocking","body":"For the third (save) hang, the Writing To File signpost shows CPU at only ~20%, meaning the main thread is blocked rather than busy. They explain thread transitions among **running/runnable/blocked**: when a resource isn't ready the kernel evicts the thread, and once ready it enters runnable to wait for a core; that 20% is the thread briefly waking to coordinate the next stage."},{"t":1452,"title":"File Saving","body":"Uses the **System Trace** template: large blank space in the activity lane signals a blocked thread; purple intervals are system calls, and selecting one highlights a single continuous write call spanning on- and off-core time. The Inspector shows its arguments, file descriptor, buffer address, and crucially the size, revealing a synchronous write of over **1.7 GB** on the main thread, costing more than 500ms with nearly 300ms off-core waiting on disk."},{"t":1465,"title":"File Saving off Main thread","body":"Demos the fix: the code used `PropertyListEncoder` then called `data.write(options: .atomic)` synchronously on the main thread, the exact cause of the block. Wrapping the encode-and-write in a `Task { @concurrent }` pushes it onto the background thread pool and unblocks the Main Actor; the new trace shows no write system call on the main thread, with the syscall now on a background thread."},{"t":1567,"title":"Next steps","body":"Wraps up: match the tool to the symptom, **Top Functions** to isolate scattered software overhead and **Run Comparison** to verify improvements; the **Swift Concurrency instrument** for actor contention; and **System Trace** with the Inspector to uncover synchronous blocking like file I/O. Reiterates always profiling a release build and using reliable os_signpost intervals, and recommends WWDC23's \"Analyze hangs with Instruments.\""}],"code":[]},"related":[{"id":"258","title":"What’s new in Xcode 27","gloss":"Xcode 27 的新功能","gloss_en":"What's new in Xcode 27","category":"swift","categoryLabel":"Swift"},{"id":"243","title":"Debug and profile agentic app experiences with Instruments","gloss":"用 Instruments 除錯與分析代理式 App 體驗","gloss_en":"Debug and profile agentic app experiences with Instruments","category":"ai","categoryLabel":"AI 與機器學習"},{"id":"201","title":"Secure your apps with App Attest","gloss":"運用 App Attest 保護你的 App","gloss_en":"Protect your app with App Attest","category":"swift","categoryLabel":"Swift"},{"id":"213","title":"Translate your app using agents in Xcode","gloss":"在 Xcode 中運用 agent 翻譯你的 App","gloss_en":"Translate your app using agents in Xcode","category":"swift","categoryLabel":"Swift"},{"id":"262","title":"What's new in Swift","gloss":"Swift 有什麼新東西","gloss_en":"What's new in Swift","category":"swift","categoryLabel":"Swift 語言"}]}</script>
