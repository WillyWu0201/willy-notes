<script id="d" type="application/json">{"s":{"id":"101","title":"Keynote","gloss":"主題演講","category":"other","categoryLabel":"其他","duration":4574,"url":"https://developer.apple.com/videos/play/wwdc2026/101/","takeaway":"這是 WWDC 2026 的開場主題演講，揭露 Apple 各平台軟體的全新功能與技術方向。","chapters":[[0,"Introduction"],[304,"Platform improvements"],[1016,"Trust and safety"],[1673,"Apple Intelligence and Siri"]],"points":[{"text":"揭露最新的 Apple 軟體與技術，是掌握本屆 WWDC 全貌的**開場主題演講**。","hot":true},{"text":"涵蓋各平台的**平台改進（Platform improvements）**，預告整年度的開發方向。","hot":false},{"text":"說明在**信任與安全（Trust and safety）**方面的進展。","hot":false},{"text":"聚焦 **Apple Intelligence 與 Siri** 的新能力。","hot":false}],"apis":[],"audience":"**所有 Apple 平台的開發者**，想一次掌握本屆 WWDC 重點方向的人。","gloss_en":"Keynote","takeaway_en":"This is the WWDC 2026 opening keynote, revealing the new features and technical direction across Apple's platform software.","points_en":[{"text":"Reveals the latest Apple software and technologies; the **opening keynote** for grasping the full picture of this year's WWDC.","hot":true},{"text":"Covers **platform improvements** across every platform, previewing the development direction for the year ahead.","hot":false},{"text":"Explains progress on **trust and safety**.","hot":false},{"text":"Focuses on the new capabilities of **Apple Intelligence and Siri**.","hot":false}],"audience_en":"**Developers across all Apple platforms** who want to grasp this year's WWDC priorities in one go.","summary":["這是 **WWDC 2026 Keynote**，Apple 一年一度向全球開發者與使用者揭曉新一代軟體與技術的開場主題演講。內容橫跨各大作業系統平台的更新、信任與安全（Trust and Safety）的強化，以及本屆最受矚目的 **Apple Intelligence** 與全新 **Siri** 體驗。","演講依序帶過幾條主線：首先是各平台（iOS、iPadOS、macOS、watchOS、visionOS 等）的整體**功能與體驗改進**；接著聚焦在使用者**隱私、安全與信任**機制的演進；最後以 **Apple Intelligence** 與更具情境理解能力的 Siri 收尾，描繪裝置端與雲端協作的智慧化方向。","對開發者而言，Keynote 是定調全週方向的指南針：它預告了後續眾多技術場次會深入的 API 與框架。建議把它當成**索引**，記下與自家 App 相關的主題（例如 Apple Intelligence、平台新體驗或安全機制），再到對應的深入場次與 Group Lab 補齊細節。"],"deepdive":[{"t":0,"title":"Introduction","body":"**Keynote** 開場，Apple 揭開本屆 WWDC 的序幕，預告接下來將公布的軟體與技術重點。此段為整場定調，鋪陳後續平台、安全與智慧化三大主軸。"},{"t":304,"title":"Platform improvements","body":"綜覽各大作業系統平台的**功能與體驗更新**，涵蓋系統介面、App 生態與跨裝置協作的整體進化。這些改進通常會在週間的專門場次中逐一展開細節。"},{"t":1016,"title":"Trust and safety","body":"聚焦使用者的**隱私、安全與信任**機制，說明 Apple 在資料保護與平台安全上的最新作法。對開發者而言預示了權限、隱私揭露與安全相關 API 的方向。"},{"t":1673,"title":"Apple Intelligence and Siri","body":"本屆重頭戲：**Apple Intelligence** 與全新 **Siri** 體驗，強調更深的情境理解與裝置端／雲端協作的智慧能力。為後續 App Intents、Foundation Models 等開發場次埋下伏筆。"}],"summary_en":["This is the **WWDC 2026 Keynote**, Apple's annual opening address unveiling the next generation of software and technologies to developers and users worldwide. It spans updates across the operating system platforms, advances in Trust and Safety, and the headline topics of this year: **Apple Intelligence** and a reimagined **Siri**.","The talk moves through a few main threads: first the overall **feature and experience improvements** across platforms (iOS, iPadOS, macOS, watchOS, visionOS, and more); then a focus on user **privacy, security, and trust**; and finally **Apple Intelligence** and a more context-aware Siri, sketching a direction of on-device and cloud collaboration.","For developers, the Keynote is the compass for the whole week: it previews the APIs and frameworks that later technical sessions dive into. Treat it as an **index** — note the themes relevant to your own app (Apple Intelligence, new platform experiences, or security mechanisms) and follow up in the corresponding deep-dive sessions and Group Labs."],"deepdive_en":[{"t":0,"title":"Introduction","body":"The **Keynote** opens WWDC, with Apple setting the stage for the software and technologies to be announced. This segment frames the three main threads that follow: platforms, safety, and intelligence."},{"t":304,"title":"Platform improvements","body":"An overview of **feature and experience updates** across the operating systems, covering system UI, the app ecosystem, and cross-device collaboration. These improvements are typically expanded in dedicated sessions throughout the week."},{"t":1016,"title":"Trust and safety","body":"A focus on user **privacy, security, and trust**, outlining Apple's latest approaches to data protection and platform security. For developers it foreshadows the direction of permissions, privacy disclosures, and security-related APIs."},{"t":1673,"title":"Apple Intelligence and Siri","body":"The marquee topic: **Apple Intelligence** and a new **Siri** experience, emphasizing deeper context understanding and on-device/cloud collaboration. It lays groundwork for later sessions on App Intents, Foundation Models, and more."}],"code":[]},"related":[{"id":"102","title":"Platforms State of the Union","gloss":"平台現況報告","gloss_en":"Platforms State of the Union","category":"other","categoryLabel":"其他"},{"id":"111","title":"Keynote (ASL)","gloss":"主題演講(美國手語版)","gloss_en":"Keynote (American Sign Language)","category":"other","categoryLabel":"其他"},{"id":"112","title":"Platforms State of the Union (ASL)","gloss":"平台現況報告（美國手語版）","gloss_en":"Platforms State of the Union (American Sign Language)","category":"other","categoryLabel":"其他"},{"id":"122","title":"WWDC26 Platforms State of the Union Recap","gloss":"WWDC26 平台現況演講重點回顧","gloss_en":"WWDC26 Platforms State of the Union recap","category":"other","categoryLabel":"其他"},{"id":"204","title":"What’s new in WebKit for Safari 27","gloss":"Safari 27 中 WebKit 的新功能","gloss_en":"What's new in WebKit for Safari 27","category":"other","categoryLabel":"其他"}]}</script>
