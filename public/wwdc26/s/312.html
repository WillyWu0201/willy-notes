<script id="d" type="application/json">{"s":{"id":"312","title":"Meet the Now Playing framework","gloss":"認識 Now Playing 框架","category":"other","categoryLabel":"其他","duration":756,"url":"https://developer.apple.com/videos/play/wwdc2026/312/","takeaway":"用全新的 Now Playing 框架，讓 App 的媒體播放透過 MediaSession 連接到鎖定畫面等系統介面，並支援遠端播放與裝置控制。","chapters":[[0,"Introduction"],[68,"Media sessions"],[117,"Existing PlayerModel implementation"],[126,"Adopt MediaSessionRepresentable"],[271,"MediaSession initialization"],[303,"Remote media sessions"],[402,"App extension entry point"],[443,"Existing RemotePlayerModel implementation"],[460,"Adopt RemoteMediaSessionRepresentable in app extension"],[631,"Media sharing extensions"]],"points":[{"text":"全新的 **Now Playing** 框架讓 App 的播放狀態連接到**鎖定畫面等系統介面**，是現代化的 Swift 媒體整合方式。","hot":true},{"text":"讓 `@Observable` 的播放模型採用 **`MediaSessionRepresentable`**，提供 content、`playbackSnapshot` 與 `commands`，再以 `MediaSession` 建立連結。","hot":false},{"text":"透過 App extension 與 **`RemoteMediaSessionRepresentable`** 支援遠端媒體 session，並以 `MediaDevice` 描述喇叭與音量等裝置能力。","hot":false},{"text":"藝術圖透過 `Artwork` 以非同步方式依尺寸提供，命令（play／pause／next／previous）可直接綁定播放器或送往伺服器。","hot":false}],"apis":["NowPlaying","MediaSession","MediaSessionRepresentable","RemoteMediaSessionRepresentable","RemoteMediaSessionExtension","MediaContentRepresentable","MediaPlaybackSnapshot","MediaCommand","MediaDevice","Artwork"],"audience":"**開發音樂、Podcast、影音或任何媒體播放 App 的開發者**，想整合系統播放控制與遠端播放的人。","gloss_en":"Meet the Now Playing framework","takeaway_en":"Use the new Now Playing framework to connect your app's media playback to system surfaces like the Lock Screen through MediaSession, with support for remote playback and device control.","points_en":[{"text":"The new **Now Playing** framework connects your app's playback state to **system surfaces like the Lock Screen**, a modern Swift approach to media integration.","hot":true},{"text":"Have your `@Observable` playback model adopt **`MediaSessionRepresentable`**, providing content, `playbackSnapshot`, and `commands`, then establish the connection with `MediaSession`.","hot":false},{"text":"Support remote media sessions through an App extension and **`RemoteMediaSessionRepresentable`**, using `MediaDevice` to describe device capabilities like speakers and volume.","hot":false},{"text":"Artwork is provided asynchronously by size through `Artwork`, and commands (play/pause/next/previous) can bind directly to your player or be sent to a server.","hot":false}],"audience_en":"**Developers building music, podcast, video, or any media playback apps** who want to integrate system playback controls and remote playback.","summary":["這場由 Media Frameworks 團隊主講，介紹全新的 **NowPlaying** Swift 框架——讓 app 的媒體播放輕鬆接上系統的 now-playing 體驗，出現在 **Lock Screen**、**Control Center**、**Dynamic Island**、**StandBy**、**CarPlay**，以及 Apple Watch、Apple Vision Pro 與 Apple TV。講者以自己開發、播放環境音幫助專注放鬆的 app 為例，貫穿三大主題：用 media sessions 把本地播放內容呈現到系統、用 remote media sessions 把在其他裝置（如智慧喇叭）上播放的內容帶進系統，以及用 **Media Sharing Extensions** 簡化把媒體從 iPhone 送到其他裝置。","本地播放的核心是 **media sessions API**。讓你的播放模型（如 `@Observable` 的 `PlayerModel`）符合 **`MediaSessionRepresentable`** 協定——這是 app 與系統間的「合約」，讓系統理解正在播什麼、以及如何處理 skip／pause 等互動。每個 session 表示需有唯一 identifier；用 `content` 描述播放內容（NowPlaying 提供 Music、Podcast、MovieContent 等專用型別，環境音用 **`GenericContent`** 即可，含 title、subtitle、media type 與 duration，連續播放設 `.continuous`），用 async closure 提供 **Artwork**，用 **`PlaybackSnapshot`** 表示播放狀態（含 isPlaying、有明確長度時加 elapsedTime），並透過 **`commands`** 定義 app 支援的所有動作（每個 command 有系統在使用者操作時呼叫的 closure）。最後用 **`MediaSession`** 以你的 model 初始化，它會開始觀察 model 並自動讓 now-playing 介面保持同步。","若內容是在其他裝置上播放（例如透過 app 控制的智慧喇叭），用 **remote media sessions API**。它靠**app extension 加推播通知**運作：喇叭狀態改變時通知伺服器，伺服器用 **APNs** 推播到 iPhone，系統以推播 payload 啟動 app extension，extension 再回傳更新後的 session 表示；反之若互動來自 iPhone 系統 UI，系統會呼叫 extension 中的 command handler、由 extension 通知伺服器再到喇叭。實作上建立符合 `RemoteMediaSessionExtension` 的 app extension（用 `RemoteMediaSessionExtensionConfiguration` 與 remote-media extension point），並讓 model 符合 **`RemoteMediaSessionRepresentable`**，整體與本地 media session 很相似。","remote session 多了幾項專屬能力：用 **`devices`** 屬性告訴系統該 session 中播放的裝置（把伺服器裝置清單對應成 **`MediaDevice`**，含跨 session 穩定的 identifier、名稱、device type 如 `.speaker`、以及 volume 控制等 capability），於 Control Center 顯示裝置名與音量、調整時呼叫 volume change closure 送請求到伺服器；`update(_:)` 在收到帶新狀態的推播時被呼叫（`RemotePlayerState` 符合 `RemoteMediaSessionAttributes`），因 model 為 observable，NowPlaying 偵測變化後自動更新系統。最後介紹 **Media Sharing Extensions**：讓 app 用系統裝置選擇器支援多種媒體協定，協定實作改由系統管理、活在 app bundle 之外，app 只需專注於內容；隨著更多協定加入，app 不必再嵌入新 SDK 即可使用。"],"deepdive":[{"t":0,"title":"Introduction","body":"Media Frameworks 工程師 Leo Formaggio 開場，點出媒體無處不在——出現在 Lock Screen、Control Center、Dynamic Island，放下充電時於 **StandBy** 可一眼掌握，上車時在 **CarPlay** 居中顯示，並橫跨 Apple Watch、Vision Pro、Apple TV。預告 **NowPlaying** 框架的三大主題：media sessions、remote media sessions、Media Sharing Extensions，並以自製的環境音 app 為示範。"},{"t":68,"title":"Media sessions","body":"介紹 **media sessions API** 為把本地播放內容呈現到系統 now-playing 體驗的方式。以播放環境音、可選音、暫停與恢復的範例 app 帶出，後續逐步說明如何用此 API 讓內容出現在系統各表面。"},{"t":117,"title":"Existing PlayerModel implementation","body":"展示既有的 `PlayerModel`——一個 `@Observable` 類別，持有 app 音訊引擎的參照與一個追蹤目前播放哪個音效的屬性。這是後續接上系統的基礎。"},{"t":126,"title":"Adopt MediaSessionRepresentable","body":"讓 `PlayerModel` 符合 **`MediaSessionRepresentable`**——app 與系統間的「合約」，使系統理解播什麼、如何處理 skip/pause 等互動。每個 session 表示需唯一 identifier；用 `content` 描述內容，NowPlaying 提供 Music、Podcast、MovieContent 等型別，環境音用 **`GenericContent`**（以 sound.id 識別、sound.name 為 title、description 為 subtitle，media type 為 .audio、duration 設 .continuous），並用 async closure 提供 **Artwork**。再用 **`PlaybackSnapshot`** 表示播放狀態（連續音效只需 isPlaying，有長度的內容要加 elapsedTime），用 **`commands`** 定義所有支援動作，每個 command 的 closure 在使用者於 Lock Screen 操作（pause/play/next）時被系統呼叫。"},{"t":271,"title":"MediaSession initialization","body":"採用 `MediaSessionRepresentable` 後，還需用 **`MediaSession`** 把 session 表示接上系統。在設定音訊引擎的同處以 `PlayerModel` 初始化 `MediaSession`；完成後它會開始觀察 model，自動讓 now-playing 各表面保持最新。詳見 Apple 文件的 Publishing Media Sessions 文章。"},{"t":303,"title":"Remote media sessions","body":"情境轉到把音訊引擎放上智慧喇叭、由 app 控制：從裝置選單選喇叭，透過 web server 連到喇叭請求播放狀態並送指令。介紹 **remote media sessions API**——用 app extension 與推播通知接收喇叭更新，把該內容呈現到系統。"},{"t":402,"title":"App extension entry point","body":"說明 remote 的互動流程：使用者操作喇叭→喇叭通知伺服器→伺服器用 **APNs** 推播到 iPhone→系統以推播 payload 啟動 app extension→extension 回傳更新後的 session 表示。反向：互動來自 iPhone 系統 UI 時，系統呼叫 extension 的 command handler，extension 送指令給伺服器、再到喇叭。"},{"t":443,"title":"Existing RemotePlayerModel implementation","body":"展示 `RemotePlayerModel`——一個 `@Observable` 類別，持有與伺服器溝通的 `ServerClient` 參照並追蹤伺服器狀態，作為建立 remote media session 表示的基礎。"},{"t":460,"title":"Adopt RemoteMediaSessionRepresentable in app extension","body":"示範採用：先建立符合 **`RemoteMediaSessionExtension`** 的 app extension，用 `RemoteMediaSessionExtensionConfiguration` 與 remote-media extension point 設定；`session(:)` 方法在系統需互動時被呼叫，可用 `RemotePlayerState` 建立並回傳 model。接著讓 model 符合 **`RemoteMediaSessionRepresentable`**，內容（GenericContent）、media type、duration、Artwork、PlaybackSnapshot 的用法與本地 media session 幾乎相同，差別在每個 command closure 會送請求到伺服器、由伺服器在喇叭上執行對應動作。"},{"t":631,"title":"Media sharing extensions","body":"說明 remote session 的專屬屬性與方法：**`devices`** 告訴系統 session 中播放的裝置（對應成 **`MediaDevice`**，含跨 session 穩定的 identifier、名稱、device type 如 .speaker、volume capability），於 Control Center 顯示裝置名與音量、調整時呼叫 volume change closure；**`update(:)`** 在收到帶新狀態的推播時被呼叫（`RemotePlayerState` 符合 `RemoteMediaSessionAttributes`），model 為 observable 故 NowPlaying 自動更新系統。最後介紹 **Media Sharing Extensions**——用系統裝置選擇器支援所有 app 支援的媒體協定，協定實作活在 app bundle 之外由系統管理，app 專注於內容；新協定加入時不必再嵌入新 SDK。"}],"summary_en":["Presented by the Media Frameworks team, this session introduces the new **NowPlaying** Swift framework, which connects your app's media playback to the system now-playing experience—the **Lock Screen**, **Control Center**, **Dynamic Island**, **StandBy**, and **CarPlay**, plus Apple Watch, Apple Vision Pro, and Apple TV. Using an ambient-sound focus/relaxation app he built, the presenter covers three topics: surfacing local playback with media sessions, bringing content playing on other devices (like smart speakers) into the system with remote media sessions, and simplifying sending media from iPhone with **Media Sharing Extensions**.","Local playback centers on the **media sessions API**. Make your player model (e.g., an `@Observable` `PlayerModel`) conform to **`MediaSessionRepresentable`**—a contract between app and system so it understands what's playing and how to handle interactions like skip or pause. Each representation needs a unique identifier; describe playback with `content` (NowPlaying offers Music, Podcast, and MovieContent types; ambient sounds use **`GenericContent`** with title, subtitle, media type, and duration set to `.continuous`), provide **Artwork** via an async closure, represent state with a **`PlaybackSnapshot`** (isPlaying, plus elapsedTime for content with a defined duration), and define all supported actions via **`commands`** (each with a closure the system calls). Finally, **`MediaSession`** is initialized with your model, observing it and keeping the now-playing surfaces in sync automatically.","When content plays on another device (like a smart speaker controlled by the app), use the **remote media sessions API**. It works via an **app extension plus push notifications**: when the speaker state changes it notifies a server, which uses **APNs** to push to iPhone, the system launches the app extension with the push payload, and the extension returns an updated session representation; conversely, when interaction originates from iPhone system UI, the system calls a command handler in the extension, which notifies the server and then the speaker. In code, create an app extension conforming to `RemoteMediaSessionExtension` (with `RemoteMediaSessionExtensionConfiguration` and the remote-media extension point) and make the model conform to **`RemoteMediaSessionRepresentable`**, which feels very similar to local media sessions.","Remote sessions add a few extras: the **`devices`** property tells the system which devices are playing (mapping the server's device list into **`MediaDevice`** values with stable identifiers, names, a device type like `.speaker`, and capabilities like volume control), shown in Control Center with name and volume, with a volume-change closure sending a request to the server; `update(_:)` is called when a push arrives with new state (`RemotePlayerState` conforms to `RemoteMediaSessionAttributes`), and since the model is observable, NowPlaying detects the change and updates the system automatically. Finally, **Media Sharing Extensions** let your app use the system device picker for all the media protocols it supports, with protocol implementations managed by the system outside your app bundle so you focus on content—and as more protocols arrive, your app uses them without adopting another SDK."],"deepdive_en":[{"t":0,"title":"Introduction","body":"Media Frameworks engineer Leo Formaggio opens, noting media is everywhere—on the Lock Screen, Control Center, and Dynamic Island, glanceable in **StandBy** when charging, front and center in **CarPlay** in the car, and across Apple Watch, Vision Pro, and Apple TV. Previews the three topics of the **NowPlaying** framework—media sessions, remote media sessions, and Media Sharing Extensions—demoed with a homemade ambient-sound app."},{"t":68,"title":"Media sessions","body":"Introduces the **media sessions API** as the way to surface local playback in the system now-playing experience, using the ambient-sound app (select sounds, pause and resume) as the running example for the steps that follow."},{"t":117,"title":"Existing PlayerModel implementation","body":"Shows the existing `PlayerModel`—an `@Observable` class with a reference to the app's audio engine and a property tracking which sound is playing—as the foundation for connecting to the system."},{"t":126,"title":"Adopt MediaSessionRepresentable","body":"Conforms `PlayerModel` to **`MediaSessionRepresentable`**, a contract so the system understands what's playing and how to handle skip/pause. Each representation needs a unique identifier; describe content with `content` (Music, Podcast, MovieContent types exist; ambient sounds use **`GenericContent`** with sound.id, sound.name as title, description as subtitle, media type .audio, duration .continuous) and provide **Artwork** via an async closure. A **`PlaybackSnapshot`** represents state (just isPlaying for continuous, plus elapsedTime for content with duration), and **`commands`** defines all supported actions, each closure called by the system on Lock Screen pause/play/next."},{"t":271,"title":"MediaSession initialization","body":"After adopting `MediaSessionRepresentable`, **`MediaSession`** connects the representation to the system. Initialize it with `PlayerModel` where the audio engine is set up; it then observes the model and keeps now-playing surfaces up to date automatically. See the Publishing Media Sessions article in Apple Developer Documentation."},{"t":303,"title":"Remote media sessions","body":"Shifts to making the audio engine available on smart speakers controlled by the app: choose a speaker from a device picker and connect via a web server to request playback state and send commands. Introduces the **remote media sessions API**—using an app extension and push notifications to receive speaker updates and surface that content in the system."},{"t":402,"title":"App extension entry point","body":"Explains the remote interaction flow: a user interacts with the speaker → the speaker notifies the server → the server uses **APNs** to push to iPhone → the system launches the app extension with the payload → the extension returns an updated representation. In reverse, when interaction comes from iPhone system UI, the system calls a command handler in the extension, which notifies the server and then the speaker."},{"t":443,"title":"Existing RemotePlayerModel implementation","body":"Shows `RemotePlayerModel`—an `@Observable` class with a reference to `ServerClient` for server communication, tracking server state—as the foundation for building the remote media session representation."},{"t":460,"title":"Adopt RemoteMediaSessionRepresentable in app extension","body":"Shows adoption: create an app extension conforming to **`RemoteMediaSessionExtension`**, configured with `RemoteMediaSessionExtensionConfiguration` and the remote-media extension point; its `session(:)` method is called when the system needs to interact, returning a model built from `RemotePlayerState`. The model conforms to **`RemoteMediaSessionRepresentable`**, with content (GenericContent), media type, duration, Artwork, and PlaybackSnapshot nearly identical to local sessions—except each command closure sends a request to the server, which performs the action on the speaker."},{"t":631,"title":"Media sharing extensions","body":"Covers remote-specific properties and methods: **`devices`** tells the system which devices are playing (mapped into **`MediaDevice`** values with stable identifiers, names, a device type like .speaker, and volume capabilities), shown in Control Center with name and volume and a volume-change closure; **`update(:)`** is called on a push with new state (`RemotePlayerState` conforms to `RemoteMediaSessionAttributes`), and the observable model lets NowPlaying update the system automatically. Finally introduces **Media Sharing Extensions**—using the system device picker for all supported media protocols, with implementations managed by the system outside the app bundle so the app focuses on content, and new protocols usable without adopting another SDK."}],"code":[]},"related":[{"id":"101","title":"Keynote","gloss":"主題演講","gloss_en":"Keynote","category":"other","categoryLabel":"其他"},{"id":"102","title":"Platforms State of the Union","gloss":"平台現況報告","gloss_en":"Platforms State of the Union","category":"other","categoryLabel":"其他"},{"id":"111","title":"Keynote (ASL)","gloss":"主題演講(美國手語版)","gloss_en":"Keynote (American Sign Language)","category":"other","categoryLabel":"其他"},{"id":"112","title":"Platforms State of the Union (ASL)","gloss":"平台現況報告（美國手語版）","gloss_en":"Platforms State of the Union (American Sign Language)","category":"other","categoryLabel":"其他"},{"id":"122","title":"WWDC26 Platforms State of the Union Recap","gloss":"WWDC26 平台現況演講重點回顧","gloss_en":"WWDC26 Platforms State of the Union recap","category":"other","categoryLabel":"其他"}]}</script>
