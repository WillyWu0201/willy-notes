<script id="d" type="application/json">{"s":{"id":"304","title":"Implement high resolution photo capture","gloss":"實作高解析度照片拍攝","category":"graphics","categoryLabel":"圖形與遊戲","duration":1078,"url":"https://developer.apple.com/videos/play/wwdc2026/304/","takeaway":"運用 AVFoundation 設定 maxPhotoDimensions 與品質優先級，並預先準備管線，在 App 中拍出超高解析度照片同時維持回應速度。","chapters":[[0,"Introduction"],[52,"High-resolution photos"],[247,"Types of captures"],[320,"Configure a capture session"],[326,"Configure the AVCaptureSession"],[371,"Configure AVCapturePhotoOutput"],[398,"Add maxPhotoDimensions to AVCapturePhotoOutput"],[441,"Update AVCapturePhotoSettings"],[539,"Prepare resources for the capture"],[581,"Responsive capture best practices"]],"points":[{"text":"介紹三種拍攝選項與各自適用時機，協助為高解析度照片做正確選擇。","hot":false},{"text":"在 **AVCapturePhotoOutput** 上設定 **maxPhotoDimensions**，並從 activeFormat 取得支援的最大尺寸。","hot":true},{"text":"透過 **AVCapturePhotoSettings** 的 **photoQualityPrioritization** 在畫質與速度間取得平衡。","hot":false},{"text":"以 **setPreparedPhotoSettingsArray** 預先準備管線，並在實際拍攝時建立全新的 settings，維持回應式拍攝。","hot":false}],"apis":["AVFoundation","AVCaptureSession","AVCapturePhotoOutput","AVCapturePhotoSettings","maxPhotoDimensions","photoQualityPrioritization","AVCapturePhotoCaptureDelegate"],"audience":"適合**開發相機或攝影類 App、需要拍攝高解析度照片的開發者**。","gloss_en":"Implement high resolution photo capture","takeaway_en":"Use AVFoundation to set maxPhotoDimensions and quality prioritization, and prepare the pipeline ahead of time to capture super high resolution photos in your app while staying responsive.","points_en":[{"text":"Introduces three capture options and when each is appropriate, helping you make the right choice for high resolution photos.","hot":false},{"text":"Set **maxPhotoDimensions** on **AVCapturePhotoOutput**, and get the maximum supported dimensions from activeFormat.","hot":true},{"text":"Balance quality against speed with **AVCapturePhotoSettings**' **photoQualityPrioritization**.","hot":false},{"text":"Prepare the pipeline ahead of time with **setPreparedPhotoSettingsArray**, and create a fresh settings object for each actual capture to stay responsive.","hot":false}],"audience_en":"**Developers building camera or photography apps who need to capture high resolution photos.**","summary":["這場由 Camera Software 團隊的 Mohit Setia 主講，主題是用 **AVFoundation** 在 app 中實作高解析度照片拍攝，核心是管理「處理時間」與「最終畫質」之間的取捨。preview stream 只給螢幕解析度的影像，但拍照情境需要更高細節與低雜訊，才能支援裁切、放大細節與影像分析。講者先定義高解析度照片的層級：典型的 **12MP**、進階的 **24MP** 與 **48MP**。自 iPhone 14 Pro 起的 48MP Quad sensor 可單張全解析度拍攝；自 iPhone 15 起的 24MP 則由 **Photonic Engine** 把多幀融合的 12MP HDR 影像與全感光元件的 48MP 影像結合，畫質加倍而檔案僅約增 50%。","可請求的拍攝型別有四種：最常見的 **fully processed**（多幀融合、經 Photonic Engine）、**exposure brackets**（多張不同曝光）、**Bayer RAW**（感光元件最小處理原始資料），以及 Apple 的 **ProRAW**（結合 RAW 彈性與 iPhone 影像處理）。","設定流程上：先建立 **AVCaptureSession** 並用 `.photo` preset（只有此 preset 支援 24／48MP）；在 **AVCapturePhotoOutput** 上設定 `maxPhotoQualityPrioritization`（讓系統為 speed／balanced／quality 三級預備資源）；用 `activeFormat.supportedMaxPhotoDimensions` 選最大尺寸並設給 `maxPhotoDimensions`，務必在 commit 前完成設定，否則會觸發冗長的管線重設。拍攝時在 **AVCapturePhotoSettings** 上設定 `maxPhotoDimensions` 與 `photoQualityPrioritization`——這是「請求」而非保證，實際尺寸會回傳於 delegate 的 **AVCaptureResolvedSettings**。可用 `setPreparedPhotoSettingsArray` 提前預配資源，避免拍攝當下才配置而拖慢速度（注意 prepare 與 capture 必須用不同但設定相符的 settings 物件）。","最後是讓 app 保持流暢的最佳化。quality／balanced／speed 三種 prioritization 在處理時間與畫質間取捨；48MP 因為單張只需 balanced 或 quality，18／24MP 為多幀融合則只在 quality 可用。透過 **responsive capture** 讓拍攝可重疊（觀察 `captureReadiness`）、**deferred photo processing** 先交付 proxy 照片再於背景完成最終處理（`didFinishCapturingDeferredPhotoProxy`），以及 **fast capture prioritization** 在連拍時自動把畫質從 quality 降到 balanced，都能大幅縮短 shot-to-shot delay。實務結論是：先決定要的解析度，再選對 prioritization，需要最高畫質時務必開啟 deferred 與 responsive capture，才不會每張都卡住下一張、錯過難以重來的瞬間。"],"deepdive":[{"t":0,"title":"Introduction","body":"由 Camera Software 團隊的工程師 Mohit Setia 開場，點出相機硬體與計算攝影讓高解析度拍攝成為可能，但要善用畫質就得管理 **處理時間與最終畫質** 之間的取捨。本場路線圖為：先介紹高解析度照片的種類，接著示範如何設定與拍攝，最後談如何在整個過程中讓 app 保持流暢回應。"},{"t":52,"title":"High-resolution photos","body":"說明 preview stream 只提供螢幕解析度影像，而拍照需要更高細節、低雜訊以支援裁切、放大與影像分析。定義解析度層級：**12MP**、**24MP**、**48MP**。自 iPhone 14 Pro／14 Pro Max 起採用 **48MP Quad sensor**，可單張全解析度拍攝或以 2x2 同色像素群組吸收更多光；24MP 自 iPhone 15 起由 **Photonic Engine** 將多幀融合的 12MP HDR 與全解析度 48MP 結合，畫質加倍而檔案僅約增 50%，並已延伸到 iPhone 16 Pro 望遠與 iPhone 17 超廣角鏡頭。"},{"t":247,"title":"Types of captures","body":"列出 app 可請求的四種拍攝型別：最常見的 **fully processed photo**（多幀融合、經 Photonic Engine 擴展動態範圍與細節）、**exposure brackets**（同場景多張不同曝光，用於 HDR 或挑選曝光）、**Bayer RAW**（感光元件最小處理的原始資料，適合後製）、以及 **ProRAW**（結合 RAW 彈性與 iPhone 影像處理，編輯曝光、色彩、細節更有彈性）。"},{"t":320,"title":"Configure a capture session","body":"進入設定環節的概觀：講者先建立 **AVCaptureSession**，再依序設定 session、AVCapturePhotoOutput 與每次拍攝的 AVCapturePhotoSettings，作為後續各小節的鋪陳。"},{"t":326,"title":"Configure the AVCaptureSession","body":"建立 `AVCaptureSession` 並呼叫 `beginConfiguration()`，將 `sessionPreset` 設為 **`.photo`**。特別提醒：只有 photo preset 支援 24 與 48MP 照片，其他 preset 並不支援，因此高解析度拍攝必須採用此 preset。"},{"t":371,"title":"Configure AVCapturePhotoOutput","body":"在 **AVCapturePhotoOutput** 上選擇適合 app 的 prioritization：speed 最快、處理最少，balanced 速度與畫質折衷，quality 最久但畫質最佳。示範把 `maxPhotoQualityPrioritization` 設為 `.quality`，這會讓 session 為 speed、balanced、quality 三級都預備資源，且部分高解析度的可用性取決於此設定。"},{"t":398,"title":"Add maxPhotoDimensions to AVCapturePhotoOutput","body":"選擇此 session 會請求的最大尺寸：自 iOS 16 起可透過裝置 `activeFormat.supportedMaxPhotoDimensions` 查詢目前格式支援的所有尺寸，範例以面積（width×height）挑出最大者設給 `photoOutput.maxPhotoDimensions`。務必在 `commitConfiguration()` 前完成所有 photo output 設定，commit 後再改會觸發冗長的管線重設。"},{"t":441,"title":"Update AVCapturePhotoSettings","body":"準備拍攝時，在 **AVCapturePhotoSettings** 上設定 `maxPhotoDimensions` 與 `photoQualityPrioritization`，再設定 delegate 並呼叫 `capturePhoto(with:delegate:)`。強調設定 `maxPhotoDimensions` 是「請求」而非保證——系統會依光線、場景與可用處理能力挑最佳路徑，實際尺寸回傳於 delegate 的 **AVCaptureResolvedSettings**，且每次拍攝都能客製畫質與尺寸而無須重設管線。"},{"t":539,"title":"Prepare resources for the capture","body":"高解析度拍攝需依 `photoQualityPrioritization` 與 `maxPhotoDimensions` 做特定資源配置；若系統未預配，會在拍攝當下才配置而拖慢速度。解法是儘早用 **`setPreparedPhotoSettingsArray`** 告知未來打算如何拍攝（例如 48MP 模式啟用時就呼叫）。關鍵：prepare 用的 settings 物件不能重用，拍攝時須另建一個設定相符的新 settings 物件，才能對齊預配的資源。"},{"t":581,"title":"Responsive capture best practices","body":"高解析度拍攝需處理大量像素、可能耗時數秒，因此介紹保持流暢的最佳實務。照片會先經 capture 階段再進 processing 階段，**AVCapturePhotoCaptureDelegate** 全程以 `didCapturePhotoFor` 與 `didFinishCaptureFor` 等回呼通報。可用 `photoProcessingTimeRange` 預估交付時間；開啟 **responsive capture** 讓拍攝重疊（觀察 `captureReadiness`）、**deferred photo processing** 先交付 proxy（`didFinishCapturingDeferredPhotoProxy`）再於背景完成（這也是 18／24MP 多幀融合得以實現的關鍵），以及 **fast capture prioritization** 在連拍時自動由 quality 轉 balanced，全面縮短 shot-to-shot delay。"}],"summary_en":["Presented by Mohit Setia from the Camera Software team, this session covers implementing high-resolution photo capture in your app with **AVFoundation**, centered on managing the tradeoff between processing time and final image quality. The preview stream only gives a screen-resolution image, but photography needs more detail and lower noise to support cropping, zooming into details, and image analysis. He defines the tiers of high-resolution photos: the typical **12MP**, the more advanced **24MP**, and **48MP**. The 48MP Quad sensor (since iPhone 14 Pro) captures full resolution in a single frame, while 24MP (since iPhone 15) uses the **Photonic Engine** to combine a multi-frame-fused 12MP HDR image with a full-sensor 48MP image — doubling resolution for only about a 50% increase in file size.","There are four capture types you can request: the most common **fully processed** photo (multi-frame fused, through the Photonic Engine), **exposure brackets** (multiple exposures of the same scene), **Bayer RAW** (minimally processed sensor data), and Apple's **ProRAW** (combining RAW flexibility with iPhone image processing).","For configuration: create an **AVCaptureSession** with the `.photo` preset (only this preset supports 24/48MP); set `maxPhotoQualityPrioritization` on **AVCapturePhotoOutput** so the system prepares resources for all three levels (speed, balanced, quality); query `activeFormat.supportedMaxPhotoDimensions` to pick the largest size and set `maxPhotoDimensions`, completing this before commit to avoid a lengthy pipeline reconfiguration. At capture time, set `maxPhotoDimensions` and `photoQualityPrioritization` on **AVCapturePhotoSettings** — a request, not a guarantee, with the actual dimensions returned in the delegate's **AVCaptureResolvedSettings**. Use `setPreparedPhotoSettingsArray` to preallocate resources ahead of time (the prepare and capture settings objects must differ but match in configuration).","Finally, optimizing for responsiveness. The quality/balanced/speed prioritizations trade processing time against fidelity; 48MP (single frame) is available with balanced or quality, while 18/24MP (multi-frame fused) require quality. Enabling **responsive capture** allows overlapping captures (observe `captureReadiness`), **deferred photo processing** delivers a proxy immediately and finishes in the background (`didFinishCapturingDeferredPhotoProxy`), and **fast capture prioritization** automatically drops from quality to balanced during rapid bursts — all of which dramatically reduce shot-to-shot delay. The takeaway: decide the resolution you want, pick the right prioritization, and for highest-quality captures turn on deferred and responsive capture so each photo doesn't block the next and people don't miss moments they can't get back."],"deepdive_en":[{"t":0,"title":"Introduction","body":"Mohit Setia, an engineer on the Camera Software team, opens by noting that camera hardware and computational photography make high-resolution captures possible, but taking advantage of that quality means managing the tradeoff between **processing time and final image quality**. The roadmap: first the types of high-resolution photos, then how to configure and capture them, and finally how to keep the app responsive throughout the process."},{"t":52,"title":"High-resolution photos","body":"Explains that the preview stream gives only a screen-resolution image, whereas photography needs higher detail and low noise for cropping, zooming, and image analysis. Defines the tiers — **12MP**, **24MP**, **48MP**. Since iPhone 14 Pro / 14 Pro Max, the **48MP Quad sensor** can capture full resolution in a single frame or group pixels in 2x2 clusters to gather more light; 24MP (since iPhone 15) uses the **Photonic Engine** to combine a multi-frame-fused 12MP HDR image with a full-resolution 48MP image, doubling resolution for only ~50% more file size, and has been extended to the iPhone 16 Pro telephoto and iPhone 17 ultra-wide cameras."},{"t":247,"title":"Types of captures","body":"Lists the four capture types an app can request: the most common **fully processed photo** (multi-frame fused, through the Photonic Engine to extend dynamic range and detail), **exposure brackets** (multiple exposures of the same scene, for HDR or selecting an exposure), **Bayer RAW** (minimally processed sensor data, ideal for post-processing), and **ProRAW** (combining RAW flexibility with iPhone image processing for more latitude editing exposure, color, and detail)."},{"t":320,"title":"Configure a capture session","body":"An overview of the configuration section: the presenter first creates an **AVCaptureSession**, then configures the session, the AVCapturePhotoOutput, and the per-capture AVCapturePhotoSettings, setting up the subsequent subsections."},{"t":326,"title":"Configure the AVCaptureSession","body":"Creates an `AVCaptureSession`, calls `beginConfiguration()`, and sets `sessionPreset` to **`.photo`**. The key note: only the photo preset supports 24 and 48MP photos; other presets do not, so high-resolution capture must use this preset."},{"t":371,"title":"Configure AVCapturePhotoOutput","body":"On **AVCapturePhotoOutput**, choose the right prioritization for your app: speed is fastest with least processing, balanced gives medium speed and good quality, quality takes longest but delivers the best. The demo sets `maxPhotoQualityPrioritization` to `.quality`, which tells the session to prepare resources for all three levels (speed, balanced, quality); the availability of some high resolutions depends on this setting."},{"t":398,"title":"Add maxPhotoDimensions to AVCapturePhotoOutput","body":"Selects the largest dimensions the session will request: since iOS 16 you can query the device's `activeFormat.supportedMaxPhotoDimensions` for all sizes supported on the current format, and the example picks the largest by area (width×height) and sets it on `photoOutput.maxPhotoDimensions`. Complete all photo output configuration before `commitConfiguration()` — changing these after commit triggers a lengthy pipeline reconfiguration."},{"t":441,"title":"Update AVCapturePhotoSettings","body":"When ready to capture, set `maxPhotoDimensions` and `photoQualityPrioritization` on **AVCapturePhotoSettings**, set up the delegate, and call `capturePhoto(with:delegate:)`. Emphasizes that setting `maxPhotoDimensions` is a request, not a guarantee — the system looks at light level, scene, and available processing to pick the best path, with the actual dimensions returned in the delegate's **AVCaptureResolvedSettings** — and that quality and dimensions can be customized per capture with no lengthy reconfiguration between captures."},{"t":539,"title":"Prepare resources for the capture","body":"High-resolution captures need specific resource allocations based on `photoQualityPrioritization` and `maxPhotoDimensions`; if the system hasn't preallocated them, allocation happens at capture time and slows things down. The fix is to call **`setPreparedPhotoSettingsArray`** as early as possible to signal how you plan to capture (e.g., as soon as 48MP mode activates). Key point: you cannot reuse the prepare settings object for the actual capture — create a new settings object whose configuration matches so the capture aligns with the preallocated resources."},{"t":581,"title":"Responsive capture best practices","body":"Because high-resolution captures process many pixels and can take several seconds, this section covers keeping the app responsive. A photo goes through a capture stage then a processing stage, with the **AVCapturePhotoCaptureDelegate** notified throughout via callbacks like `didCapturePhotoFor` and `didFinishCaptureFor`. Use `photoProcessingTimeRange` to estimate delivery; enable **responsive capture** for overlapping captures (observe `captureReadiness`), **deferred photo processing** to deliver a proxy immediately (`didFinishCapturingDeferredPhotoProxy`) and finish in the background (what makes 18/24MP multi-frame fusion feasible), and **fast capture prioritization** to automatically shift from quality to balanced during rapid bursts — all reducing shot-to-shot delay."}],"code":["import AVFoundation\n\nprivate let session = AVCaptureSession()\nprivate func configureSession() {\n    session.beginConfiguration()\n    session.sessionPreset = .photo\n}","import AVFoundation\n\nprivate let photoOutput = AVCapturePhotoOutput()\nprivate let configurePhotoOutput: () -> Void = {\n    photoOutput.maxPhotoQualityPrioritization = .quality // or .balanced\n}","import AVFoundation\n\nlet supportedMaxPhotoDimensions = device?.activeFormat.supportedMaxPhotoDimensions ?? []\nif let largestDimension = supportedMaxPhotoDimensions.max(by: { lhs, rhs in\n    Int(lhs.width) * Int(lhs.height) \u003c Int(rhs.width) * Int(rhs.height)\n} ) {\n    photoOutput?.maxPhotoDimensions = largestDimension\n}\n\nsession?.commitConfiguration()\nsession?.startRunning()","import AVFoundation\n\nlet settings = AVCapturePhotoSettings()\nsettings.maxPhotoDimensions = dimension.cmVideoDimensionsValue\nsettings.photoQualityPrioritization = .quality\n\nvar delegate: AVCapturePhotoCaptureDelegate?\n\n// Configure photo request delegate\n\nif let delegate {\n photoOutput?.capturePhoto(with: settings, delegate: delegate)\n}","import AVFoundation\n\nlet prepareSettings = AVCapturePhotoSettings()\nprepareSettings.maxPhotoDimensions = photoOutput.maxPhotoDimensions\nprepareSettings.photoQualityPrioritization = .quality\n\nphotoOutput.setPreparedPhotoSettingsArray([prepareSettings]) { prepared, error in\n  if let error = error {\n    print(\"Failed to prepare: \\(error)\")\n      return\n  }\n  print(\"Pipeline prepared: \\(prepared)\")\n}\n\n// Later, when ready to capture — create NEW settings\nlet captureSettings = AVCapturePhotoSettings()\ncaptureSettings.maxPhotoDimensions = photoOutput.maxPhotoDimensions\ncaptureSettings.photoQualityPrioritization = quality\nphotoOutput.capturePhoto(with: captureSettings, delegate: self)"]},"related":[{"id":"303","title":"Build a responsive camera app that launches quickly","gloss":"打造啟動快速且反應靈敏的相機 App","gloss_en":"Build a responsive camera app that launches quickly","category":"other","categoryLabel":"其他"},{"id":"256","title":"Discover generated subtitles and subtitle styles","gloss":"認識自動產生字幕與字幕樣式","gloss_en":"Discover generated subtitles and subtitle styles","category":"graphics","categoryLabel":"圖形與遊戲"},{"id":"341","title":"Support the Center Stage front camera in your iOS app","gloss":"在 iOS App 中支援人物居中前置鏡頭","gloss_en":"Support the Center Stage front camera in your iOS app","category":"other","categoryLabel":"其他"},{"id":"215","title":"Get started with the HTML Model Element","gloss":"開始使用 HTML model 元素","gloss_en":"Getting started with the HTML model element","category":"graphics","categoryLabel":"圖形與遊戲"},{"id":"252","title":"Design no-code games with Reality Composer Pro 3","gloss":"用 Reality Composer Pro 3 設計無程式碼遊戲","gloss_en":"Design no-code games with Reality Composer Pro 3","category":"graphics","categoryLabel":"圖形與遊戲"}]}</script>
