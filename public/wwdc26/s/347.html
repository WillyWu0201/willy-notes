<script id="d" type="application/json">{"s":{"id":"347","title":"Secure your app: mitigate risks to agentic features","gloss":"保護你的 App：降低 agentic 功能的風險","category":"ai","categoryLabel":"AI 與機器學習","duration":1512,"url":"https://developer.apple.com/videos/play/wwdc2026/347/","takeaway":"針對間接提示注入進行威脅建模，並用工具確認、spotlighting、redaction 與 App Intents 驗證政策來保護 agentic 功能。","chapters":[[0,"Introduction"],[126,"Risks"],[392,"Threat modeling"],[716,"Implementing mitigations"],[723,"Foundation Models"],[770,"Tools"],[793,"Profile"],[808,"Session"],[873,"Confirmation via onToolCall"],[956,"Spotlighting via historyTransform"],[1008,"Redaction via historyTransform"],[1075,"App Intents"],[1388,"Intent authentication policy"],[1407,"Schema authentication policy"]],"points":[{"text":"解析 **間接提示注入（indirect prompt injection）** 帶來的資料外洩與非預期行為風險。","hot":true},{"text":"以 **威脅建模** 區分高風險工具（如有財務影響的下單）與會回傳不可信資料的工具。","hot":false},{"text":"用 **onToolCall** 在執行高風險工具前要求使用者確認，避免未授權動作。","hot":false},{"text":"透過 **historyTransform** 對不可信工具輸出做 spotlighting 標記與 PII redaction。","hot":false},{"text":"為 App Intents 設定 **authenticationPolicy（.requiresAuthentication）**，保護刪除等敏感操作。","hot":false}],"apis":["FoundationModels","LanguageModelSession","DynamicProfile","Tool","onToolCall","historyTransform","AppIntents","IntentAuthenticationPolicy"],"audience":"正在 App 中加入 **LLM 工具呼叫或 agentic 功能**、需要把關安全性的開發者。","gloss_en":"Secure your app: mitigate risks to agentic features","takeaway_en":"Threat-model indirect prompt injection and protect agentic features with tool confirmation, spotlighting, redaction, and App Intents authentication policies.","points_en":[{"text":"Breaks down the data-exfiltration and unintended-action risks posed by **indirect prompt injection**.","hot":true},{"text":"Use **threat modeling** to distinguish high-risk tools (such as placing an order with financial impact) from tools that return untrusted data.","hot":false},{"text":"Use **onToolCall** to require user confirmation before running high-risk tools, preventing unauthorized actions.","hot":false},{"text":"Use **historyTransform** to apply spotlighting tags and PII redaction to untrusted tool output.","hot":false},{"text":"Set an **authenticationPolicy (.requiresAuthentication)** for App Intents to protect sensitive operations like deletion.","hot":false}],"audience_en":"Developers adding **LLM tool calls or agentic features** to their app who need to enforce security.","summary":["本場由 Willy 與 Akshay 主講，主題是辨識並緩解 app 中 **agentic 功能**帶來的新安全風險。當 LLM 成為 app 的關鍵元件、能依使用者請求與額外 context 執行一或多個動作後再回應，它就引入一個強大但**可能被騙**的機率引擎。講者明確界定範圍：不談 model safety、不談 guardrail 繞過，而是聚焦於**外部攻擊者**試圖破壞你的應用。攻擊者覬覦 app 的原因在於它可能持有敏感資料、執行金流交易、存取麥克風／相機等系統資源，甚至控制實體裝置。","核心風險是 **indirect prompt injection**（間接提示注入）：嵌在提供給模型之額外 context 或 tool 結果中、意圖改變控制流的指令。以虛構社群 app **Loose Leaf** 的「Organize a tea party」功能為例——它從多處取得 context（行事曆、好友動態）並能代使用者呼叫多個帶副作用的動作。注入可造成兩種效果：**data poisoning**（影響動作的參數，如把訊息改送給攻擊者）與 **action poisoning**（影響執行哪個動作，如把摘要 email 改成把內容附在攻擊者網址後開啟）。對應 Simon Willison 的 **Lethal Trifecta**：同時具備存取私密資料、接觸不可信內容、能對外通訊（可泛化為任何有副作用的動作）時風險最高。講者強調 prompt injection 仍是活躍研究領域，目前最佳做法是評估風險並設法緩解。","緩解前先做 **threat modeling**：對 agentic loop 的輸入（prompt）做資料流分析，找出所有不可信 context 來源（凡來自外部實體者皆為攻擊面，如行事曆邀請與好友動態）；再檢視 agent 可用的動作與其副作用（OrderTea 有金流風險、PostAndFetchPublicFeed 有資料外洩風險、BrewingTimer 的 label 可能被寫入後續攻擊指令、Delete Photo 有資料遺失風險）。緩解應**優先採用確定性（deterministic）手段**（安全保證易稽核），其次才是機率性手段；可在 prompt 層（redact PII、spotlighting 標示不可信內容）或動作執行階段（使用者確認、要求裝置解鎖）設檢查點。","Akshay 接著示範平台上的具體 API。**Foundation Models** 端用 **lifecycle event modifiers** 在 agent 執行中注入安全檢查點：**`onToolCall`** 在工具實際執行前觸發，丟錯即可阻止執行——適合對 OrderTea 這類有金流影響的工具強制使用者確認；**`historyTransform`** 在 transcript 送入推論前觸發，可對不可信的 tool 輸出加上 **spotlighting** 分隔標籤、或把敏感資料 **redact** 成佔位字串（注意轉換僅限當次推論、需重複套用，昂貴轉換則用 `@SessionProperty` 持久化）。**App Intents** 端：當 intent 採用 schema 而成為 Siri 工具時，系統以**風險導向、情境化的確認機制**——結合 intent 的風險 metadata（隨採用的 schema 自動指派，依副作用判定）與動態系統狀態決定是否需要確認（連 createTimer 這種看似無害、但 label 可被注入的也會被情境化評估）；並用 **authentication policy**（`.requiresAuthentication`）防範鎖定畫面攻擊，schema 有預設政策、可覆寫但只能更嚴格。下一步：建立威脅模型、找出不可信 context、依副作用評估各動作風險，再用兩個框架實作最適緩解。"],"deepdive":[{"t":0,"title":"Introduction","body":"Willy 開場：隨 LLM 普及，許多 app 用它打造智慧功能而使 LLM 成為關鍵元件——可依使用者請求與額外 context 執行一或多個動作後再回應。但這引入一個強大卻**可能被騙**的機率引擎。明確界定範圍：不談 model safety 與 guardrail 繞過，而聚焦於**外部攻擊者**破壞你的應用；後半由 Akshay 講平台上可用的具體 API。"},{"t":126,"title":"Risks","body":"說明攻擊者為何鎖定你的 app：它可能持有敏感資料、執行金流、存取麥克風／相機、甚至控制實體裝置。以虛構社群 app **Loose Leaf** 的「Organize a tea party」為例（查行事曆找時間、依好友 profile 決定邀請與茶款、並下單），點出兩個性質：從多處取得 context、能代使用者呼叫帶副作用的動作。由此帶出 **indirect prompt injection**——嵌在額外 context 或 tool 結果中、意圖改變控制流的指令（如行事曆事件內含刪除使用者資料的指令）。"},{"t":392,"title":"Threat modeling","body":"進入威脅建模：對 agentic loop 的輸入（prompt）做資料流分析，找出構成 prompt 的資料來源並指認哪些**不可信**（凡來自外部實體者皆為攻擊面）。Loose Leaf 的來源含 instructions、使用者 prompt、額外 context（過往訂單、茶譜、行事曆、好友動態），其中**行事曆內容與好友動態**被判為不可信（任何人都能寄行事曆邀請或在動態發文）。接著檢視動作與副作用：OrderTea 有金流風險、PostAndFetchPublicFeed 有資料外洩風險、BrewingTimer 的 label 可被寫入後續攻擊指令、Delete Photo 有資料遺失風險。並對應 Simon Willison 的 **Lethal Trifecta**（私密資料＋不可信內容＋對外通訊／任何副作用）。"},{"t":716,"title":"Implementing mitigations","body":"概述緩解原則：**優先採用確定性（deterministic）緩解**作為基線，因其安全保證較易稽核與推理；鑑於模型能力快速演進，也可輔以機率性緩解。可在 prompt 層或動作執行階段設檢查點，Apple 設計 Siri AI 時也用了其中部分手段。"},{"t":723,"title":"Foundation Models","body":"Akshay 接手，聚焦 Foundation Models 框架，將以 **lifecycle event modifier** API 注入安全 guardrail（假設讀者已具基本認識）。先為 Loose Leaf 建立簡單 agent。"},{"t":770,"title":"Tools","body":"定義工具：符合 Tool 協定、指定 name／description／Arguments（模型靠這些 metadata 理解用途與呼叫方式）並提供實作。示範 OrderTea 工具與 PostAndFetchPublicFeed 工具（會把訊息貼到公開動態並取回新貼文）。"},{"t":793,"title":"Profile","body":"建立 **Profile**：加入模型 instructions 與剛定義的工具，再附上 session properties（如指定使用哪個模型，此處用 on-device 模型）。此 Profile 用來實例化 LanguageModelSession，供 agentic loop 使用。"},{"t":808,"title":"Session","body":"有了基本 agent 後開始注入安全政策：用 **lifecycle event modifiers**——這些 callback 會在 session 執行的特定生命週期點**確定性地**觸發，故可作為實作安全政策的檢查點。接著介紹其中兩個。"},{"t":873,"title":"Confirmation via onToolCall","body":"第一個 modifier 是 **`onToolCall`**：保證在 LLM 輸出 tool call、executor 實際執行工具**之前**觸發；若此 callback 丟錯，工具就不會執行、控制權立即回到迴圈，因此是強制**確認**的最佳位置。範例對有金流影響的 OrderTea 加上 onToolCall：先判斷是否為該工具，是則向使用者確認，未確認就丟錯阻止執行。只在這一處加確認邏輯，就能涵蓋所有 tool call。"},{"t":956,"title":"Spotlighting via historyTransform","body":"第二個 modifier **`historyTransform`** 在 transcript 送入推論前觸發（新請求與每次迴圈迭代皆會），轉換 transcript 尾端。因 PostAndFetchPublicFeed 會回傳公開動態（攻擊者易在此植入注入），需以特殊標籤標示為不可信：在 callback 中只針對該工具的 toolOutput entry、逐 segment 加上 **spotlighting** 分隔標籤（範例用角括號），其餘 entry 原樣複製。"},{"t":1008,"title":"Redaction via historyTransform","body":"同樣的 historyTransform 思路也可用於 **redaction**：把 `delimit()` 換成把敏感資料替換為佔位字串的 redaction 函式即可。重點提醒：轉換後的 entry 僅限**當次推論迭代**、下次推論不可見，必須重複套用；若想持久化昂貴的轉換，改用 `@SessionProperty` 註記做有狀態的 history 轉換。並指出框架還有更多 modifier 與可自製、可打包重用的 profile modifier。"},{"t":1075,"title":"App Intents","body":"切換到 **App Intents**：它讓 app 整合 Apple Intelligence 與 Siri、Spotlight、Shortcuts 等系統體驗。當 App Intent 採用 intent schema（如 DeletePhotoIntent 採用 photos 領域的 deleteAssets schema），它就成為 Siri 模型可用的工具——但因由模型決定呼叫哪個 intent，prompt injection 可能濫用你的 app 做資料外洩等惡意目的（如在外部 context 下擅自執行 Delete Photo）。系統提供多種 guardrail，將介紹 confirmations 與 lock-screen authentication 兩者。"},{"t":1388,"title":"Intent authentication policy","body":"講 lock screen authentication：Siri 可在鎖定畫面互動，意味著實體持有鎖定裝置的攻擊者可能透過 Siri 觸發你的 intent，主要緩解是在執行高風險動作前要求解鎖。自訂 App Intent 可設 **`authenticationPolicy`**（如把 destructive 的 DeletePhotoIntent 設為 `.requiresAuthentication`）。先前也談到 confirmation：系統以風險導向、情境化機制，結合靜態風險 metadata（隨採用的 schema 自動指派、依副作用判定，如 deleteAssets 屬 destructive）與動態系統狀態決定是否確認，連 createTimer 這種 label 可被注入的也會被情境評估。"},{"t":1407,"title":"Schema authentication policy","body":"當 @AppIntent 採用 schema 時情況略有不同：schema 有依其敏感度與處理資料而內部設定的**預設 authenticationPolicy**，會自動指派給你的 intent；你可覆寫，但**只能更嚴格**（設更弱會得到 build error 並提示最低允許政策）。小結：認證是鎖定畫面攻擊的重要緩解，請依鎖定畫面行為檢視你的 intent。最後 Willy 總結下一步：建立威脅模型、找出 prompt 中不可信 context、依副作用判定各動作風險，再用 Foundation Models 與 App Intents 框架實作最適緩解。"}],"summary_en":["Presented by Willy and Akshay, this session is about identifying and mitigating new security risks from **agentic features** in your app. When an LLM becomes a key component that can execute one or more actions on the user's request plus extra context before responding, it introduces a powerful but **trickable** probabilistic engine. The speakers explicitly scope out model safety and guardrail circumvention, focusing instead on an **external attacker** trying to compromise your app. Attackers target apps because they may hold sensitive data, perform financial transactions, access system resources like the microphone or camera, or even control physical devices.","The core risk is **indirect prompt injection**: instructions embedded in extra context or tool results provided to the model, intended to redirect control flow. Using the fictional social app **Loose Leaf** and its 'Organize a tea party' feature—which pulls context from multiple places (calendar, friend feed) and can call multiple side-effecting actions on the user's behalf—the talk shows two effects: **data poisoning** (influencing an action's parameters, e.g., redirecting a message to the attacker) and **action poisoning** (influencing which action runs, e.g., turning 'summarize an email' into opening an attacker URL with the email appended). This maps to Simon Willison's **Lethal Trifecta**: risk is highest when an agent has access to private data, exposure to untrusted content, and the ability to communicate externally (generalizable to any side-effecting action). The speakers stress prompt injection is an active research area, so the best approach is to assess and mitigate risk.","Before mitigating, do **threat modeling**: a data-flow analysis of the agentic loop's input (the prompt) to find all untrusted context sources (anything from an external entity is attack surface, like calendar invites and the friend feed), then examine the actions available and their side effects (OrderTea has financial risk, PostAndFetchPublicFeed has data-exfiltration risk, BrewingTimer's label can be written with future attack instructions, Delete Photo has data-loss risk). Mitigations should **favor deterministic approaches** (easier to audit) over probabilistic ones, with checkpoints at the prompt level (redact PII, spotlighting untrusted content) or the action-execution stage (user confirmation, requiring an unlocked device).","Akshay then demonstrates concrete platform APIs. On **Foundation Models**, use **lifecycle event modifiers** to inject security checkpoints into agent execution: **`onToolCall`** fires before a tool actually runs, and throwing an error blocks it—perfect for forcing user confirmation on financially impactful tools like OrderTea; **`historyTransform`** fires before the transcript is rendered to the model, letting you add **spotlighting** delimiters around untrusted tool output or **redact** sensitive data to a placeholder (note transforms are scoped to the current inference and must be reapplied; use `@SessionProperty` to persist expensive ones). On **App Intents**: when an intent adopts a schema and becomes a Siri tool, the system uses a **risk-based, contextual confirmation** mechanism—combining the intent's risk metadata (auto-assigned by the adopted schema based on side effects) with dynamic system state to decide if confirmation is needed (even createTimer, whose label can be injected, is evaluated contextually); and **authentication policy** (`.requiresAuthentication`) guards against lock-screen attacks, with schemas providing defaults you can override only to be stricter. Next steps: build a threat model, find untrusted context, rate each action's risk by side effects, then implement the best mitigations with both frameworks."],"deepdive_en":[{"t":0,"title":"Introduction","body":"Willy opens: as LLMs become commonplace, many apps use them for intelligent features, making the LLM a key component that can execute one or more actions on the user's request plus extra context before responding—introducing a powerful but **trickable** probabilistic engine. He scopes out model safety and guardrail circumvention, focusing on an **external attacker** compromising your app; Akshay covers concrete platform APIs in the second half."},{"t":126,"title":"Risks","body":"Explains why attackers target your app: it may hold sensitive data, perform financial transactions, access the mic/camera, or control physical devices. The fictional **Loose Leaf** app's 'Organize a tea party' (check calendar for timing, choose invitees and teas from friend profiles, place orders) highlights two properties: it pulls context from many places and can call side-effecting actions on the user's behalf. This introduces **indirect prompt injection**—instructions embedded in extra context or tool results to redirect control flow (e.g., a calendar event with instructions to delete user data)."},{"t":392,"title":"Threat modeling","body":"Enters threat modeling: a data-flow analysis of the loop's input (the prompt) to find its data sources and identify which are **untrusted** (anything from an external entity is attack surface). Loose Leaf's sources include instructions, the user prompt, and extra context (past orders, recipes, calendar, friend feed), with **calendar content and the friend feed** deemed untrusted (anyone can send an invite or post). It then examines actions and side effects: OrderTea (financial), PostAndFetchPublicFeed (data exfiltration), BrewingTimer's label (can carry future attack instructions), Delete Photo (data loss)—mapping to Simon Willison's **Lethal Trifecta** (private data + untrusted content + external communication/any side effect)."},{"t":716,"title":"Implementing mitigations","body":"Overviews the principle: **favor deterministic mitigations** as a baseline because their guarantees are easier to audit and reason about, supplemented by probabilistic ones given fast-moving model capabilities. Checkpoints can be added at the prompt level or the action-execution stage—some of which Apple used designing Siri AI."},{"t":723,"title":"Foundation Models","body":"Akshay takes over, focusing on Foundation Models and using its **lifecycle event modifier** API to inject security guardrails (assuming basic familiarity). He first builds a simple agent for Loose Leaf."},{"t":770,"title":"Tools","body":"Defines tools: conform to the Tool protocol, specify name/description/Arguments (metadata the model uses to understand purpose and how to call), and provide an implementation. Shows an OrderTea tool and a PostAndFetchPublicFeed tool (posts a message to the public feed and retrieves new posts)."},{"t":793,"title":"Profile","body":"Builds a **Profile**: add model instructions and the defined tools, then attach session properties (like which model—here the on-device model). This Profile instantiates a LanguageModelSession for use in an agentic loop."},{"t":808,"title":"Session","body":"With a basic agent, injects security policy via **lifecycle event modifiers**—callbacks that **deterministically** trigger at certain lifecycle points, usable as security-policy checkpoints. Two are introduced next."},{"t":873,"title":"Confirmation via onToolCall","body":"The first modifier, **`onToolCall`**, is guaranteed to fire after the LLM outputs a tool call but **before** the executor runs it; if the callback throws, the tool never runs and control returns to the loop—making it the perfect place for **confirmation**. The example adds onToolCall for the financially impactful OrderTea: check if it's that tool, and if so ask the user to confirm, throwing to block execution if they decline. Adding confirmation at this one point covers all tool calls."},{"t":956,"title":"Spotlighting via historyTransform","body":"The second modifier, **`historyTransform`**, fires before the transcript is rendered to the model (on new requests and each loop iteration), transforming the transcript's tail. Since PostAndFetchPublicFeed returns a public feed (easy to inject into), demarcate it as untrusted: in the callback, focus only on that tool's toolOutput entries, add **spotlighting** delimiters per segment (angle brackets in the example), and copy all other entries unmodified."},{"t":1008,"title":"Redaction via historyTransform","body":"The same historyTransform idea applies to **redaction**: swap `delimit()` for a redaction function that replaces sensitive data with a placeholder. Key reminder: transformed entries are scoped to the **current inference iteration** only and aren't visible to the next call, so reapply them; to persist expensive transformations, use the `@SessionProperty` annotation. Notes the framework has many more modifiers and lets you build reusable custom profile modifiers."},{"t":1075,"title":"App Intents","body":"Switches to **App Intents**, which integrate apps with Apple Intelligence and system experiences like Siri, Spotlight, and Shortcuts. When an App Intent adopts an intent schema (e.g., DeletePhotoIntent adopting the photos deleteAssets schema), it becomes a tool for the Siri model—but since the model decides which intent to call, a prompt injection can misuse the app for data exfiltration or other goals (e.g., running Delete Photo under external context). The system offers several guardrails; confirmations and lock-screen authentication are covered."},{"t":1388,"title":"Intent authentication policy","body":"On lock-screen authentication: Siri works on the lock screen, so an attacker with physical possession of a locked device could invoke your intent via Siri—the main mitigation is requiring the device to be unlocked before risky actions. Custom App Intents can set **`authenticationPolicy`** (e.g., the destructive DeletePhotoIntent set to `.requiresAuthentication`). Earlier, confirmations: the system uses a risk-based, contextual mechanism combining static risk metadata (auto-assigned by the adopted schema based on side effects, e.g., deleteAssets is destructive) with dynamic system state to decide on confirmation, even evaluating createTimer (whose label can be injected) contextually."},{"t":1407,"title":"Schema authentication policy","body":"When an @AppIntent adopts a schema, it's slightly different: schemas have a **default authenticationPolicy** set internally based on sensitivity and data handled, automatically assigned to your intent; you can override it but **only to be stricter** (a weaker policy yields a build error citing the minimum allowed). Recap: authentication is an important mitigation for lock-screen attacks—review your intents with lock-screen behavior in mind. Willy closes with next steps: build a threat model, find untrusted context in the prompt, rate each action's risk by side effects, then implement the best mitigations with the Foundation Models and App Intents frameworks."}],"code":["// Tools\n\nstruct OrderTeaTool: Tool {\n  let name = \"orderTeaTool\"\n  let description: String = \"Orders a particular quantity of a tea from the store.\"\n  // Arguments\n  // Implementation\n}\n\nstruct PostAndFetchPublicFeedTool: Tool {\n  let name = \"postAndFetchPublicFeedTool\"\n  let description: String = \"Posts a message to the public feed.”\n  // Arguments\n  // Implementation\n}","// Profile\n\nclass LooseLeafAgent {\n  struct DefaultProfile: LanguageModelSession.DynamicProfile {\n    var body: some DynamicProfile {\n      Profile {\n        Instructions(\"You are a helpful, tea-loving assistant ... \")\n\n        OrderTeaTool()\n        PostAndFetchPublicFeedTool()\n      }\n      .model(SystemLanguageModel())\n    }\n  }\n}","// Session \n\nclass LooseLeafAgent {\n  struct DefaultProfile: LanguageModelSession.DynamicProfile {\n    var body: some DynamicProfile {\n      Profile {\n        Instructions(\"You are a helpful, tea-loving assistant ... \")\n\n        OrderTeaTool()\n        PostAndFetchPublicFeedTool()\n      }\n      .model(SystemLanguageModel())\n    }\n  }\n\n  let session: LanguageModelSession\n\n  public init() {\n    self.session = LanguageModelSession(profile: DefaultProfile())\n  }\n}","// Confirmation via onToolCall\n\nvar body: some DynamicProfile {\n  Profile {\n    Instructions(\"You are a helpful, tea-loving assistant ... \")\n\n    OrderTeaTool() // Financial impact; risky tool.\n    // Other Tools\n  }\n  \n  .onToolCall { call in\n    guard call.toolName == \"orderTeaTool\" else {\n      return\n    }\n    guard ConfirmationAction.confirmWithUser() else {\n      throw LooseLeafError.userConfirmationDenied\n    }\n  }\n}","// Spotlighting via historyTransform\n\nvar body: some DynamicProfile {\n  Profile {\n    Instructions(\"You are a helpful, tea-loving assistant ... \")\n\n    PostAndFetchPublicFeedTool() // Returns untrusted data; requires spotlighting\n    // Other Tools\n  }\n\n  .historyTransform {γentries in\n    entries.map { entry in\n      guard case .toolOutput(var toolOutput) = entry,\n        toolOutput.toolName == \"postAndFetchPublicFeedTool\"\n      else {\n        return entry\n      }\n    }\n    toolOutput.segments = toolOutput.segments.map { segment in\n      delimit(segment: segment,\n              startDelimiter: \"\u003c\u003cUNTRUSTED>>\",\n              endDelimiter: \"\u003c\u003c/UNTRUSTED>>\")\n    }\n    return .toolOutput(toolOutput)\n  }\n}\n\nfunc delimit(segment: Transcript.Segment,\n             startDelimiter: String,\n             endDelimiter: String) -> Transcript.Segment","// Redaction via historyTransform\n\nvar body: some DynamicProfile {\n  Profile {\n    Instructions(\"You are a helpful, tea-loving assistant ... \")\n\n    PostAndFetchPublicFeedTool() // Returns untrusted data; requires spotlighting\n    // Other Tools\n  }\n\n  .historyTransform {γentries in\n    entries.map { entry in\n      guard case .toolOutput(var toolOutput) = entry,\n        toolOutput.toolName == \"postAndFetchPublicFeedTool\"\n      else {\n        return entry\n      }\n    }\n    toolOutput.segments = toolOutput.segments.map { segment in\n      redactPII(segment: segment,\n                placeHolder: \"[REDACTED]\")\n    }\n    return .toolOutput(toolOutput)\n  }\n}\n\nfunc redactPII(segment: Transcript.Segment,\n               placeHolder: String) -> Transcript.Segment","// Intent authentication policy\n\nstruct DeletePhotoIntent: DeleteIntent {\n    var entities: [LooseLeafPhoto]\n\n    static var authenticationPolicy: IntentAuthenticationPolicy = .requiresAuthentication\n\n    func perform() async throws -> some IntentResult {\n        // Implementation\n    }\n}","// Schema authentication policy\n\n@AppIntent(schema: .photos.deleteAssets)\nstruct DeletePhotoIntent {\n    var entities: [LooseLeafPhoto]\n\n    // Example: Schema default authentication policy is .requiresAuthentication\n\n    func perform() async throws -> some IntentResult {\n        // Implementation\n    }\n}"]},"related":[{"id":"242","title":"Build agentic app experiences with the Foundation Models framework","gloss":"用 Foundation Models 框架打造 agentic App 體驗","gloss_en":"Build agentic app experiences with Foundation Models","category":"ai","categoryLabel":"AI 與機器學習"},{"id":"241","title":"What’s new in the Foundation Models framework","gloss":"Foundation Models 框架的新功能","gloss_en":"What's new in the Foundation Models framework","category":"ai","categoryLabel":"AI 與機器學習"},{"id":"319","title":"Build with the new Apple Foundation Model on Private Cloud Compute","gloss":"在 Private Cloud Compute 上使用全新 Apple Foundation Model 開發","gloss_en":"Build with the new Apple Foundation Model on Private Cloud Compute","category":"ai","categoryLabel":"AI 與機器學習"},{"id":"237","title":"What’s new in image understanding","gloss":"影像理解的新功能","gloss_en":"What's new in image understanding","category":"ai","categoryLabel":"AI 與機器學習"},{"id":"246","title":"LLM search using Core Spotlight","gloss":"使用 Core Spotlight 的 LLM 搜尋","gloss_en":"LLM search using Core Spotlight","category":"ai","categoryLabel":"AI 與機器學習"}]}</script>
