<script id="d" type="application/json">{"s":{"id":"286","title":"Use foveated streaming to bring immersive content to visionOS","gloss":"用注視點串流把沉浸式內容帶到 visionOS","category":"visionos","categoryLabel":"visionOS","duration":862,"url":"https://developer.apple.com/videos/play/wwdc2026/286/","takeaway":"用 FoveatedStreaming 框架把遠端算繪的場景以全保真度串流到 Apple Vision Pro，並與 SwiftUI、RealityKit 內容整合。","chapters":[[0,"Introduction"],[248,"How Foveated Streaming works"],[286,"Set up the streaming endpoint"],[318,"Create a visionOS receiver app"],[363,"Connect to a streaming endpoint"],[404,"Display a Foveated Streaming session in your immersive space"],[415,"Compose SwiftUI content with Foveated Streaming"],[482,"Integrate with the streaming endpoint"],[688,"Measure performance"],[716,"Enhance with visionOS features"],[822,"Compose RealityKit content with Foveated Streaming"],[836,"Next steps"]],"points":[{"text":"**注視點串流（Foveated Streaming）**能把遠端算繪的場景以**全保真度**串流到 Apple Vision Pro。","hot":true},{"text":"了解其運作原理，並設定**串流端點（streaming endpoint）**與打造 visionOS 接收端 App。","hot":false},{"text":"用 **FoveatedStreamingSession** 連線，並透過 **ImmersiveSpace(foveatedStreaming:)** 在沉浸式空間中顯示。","hot":false},{"text":"可與 **SwiftUI** 及 **RealityKit** 內容合成，並量測效能、結合更多 visionOS 功能強化體驗。","hot":false}],"apis":["FoveatedStreaming","FoveatedStreamingSession","ImmersiveSpace","RealityKit","SwiftUI"],"audience":"**開發 visionOS 沉浸式體驗、需要串流遠端高保真算繪內容**到 Vision Pro 的開發者。","gloss_en":"Use foveated streaming to bring immersive content to visionOS","takeaway_en":"Use the FoveatedStreaming framework to stream remotely rendered scenes to Apple Vision Pro in full fidelity, integrating with SwiftUI and RealityKit content.","points_en":[{"text":"**Foveated Streaming** can stream remotely rendered scenes to Apple Vision Pro in **full fidelity**.","hot":true},{"text":"Understand how it works, set up the **streaming endpoint**, and build the visionOS receiving app.","hot":false},{"text":"Connect with **FoveatedStreamingSession** and display it in an immersive space via **ImmersiveSpace(foveatedStreaming:)**.","hot":false},{"text":"Compose it with **SwiftUI** and **RealityKit** content, measure performance, and combine it with more visionOS features to enhance the experience.","hot":false}],"audience_en":"Developers **building immersive visionOS experiences who need to stream remotely rendered, high-fidelity content** to Vision Pro.","summary":["這場介紹 visionOS 26.4 引入、本場深入的 **Foveated Streaming**——讓 Apple Vision Pro 連到 PC 等外部裝置，把 **OpenXR** 內容以視訊與音訊串流過來，同時 visionOS 自動把手部、控制器位置與麥克風等輸入資料回傳給外部裝置。已有不少優秀案例，例如 Laminar Research 的 X-Plane 12 飛行模擬、iRacing 的賽車模擬，以及 Innoactive 把 Autodesk VRED 帶到 Vision Pro 讓設計師以 1:1 尺度檢視 Kia 車款。畫質之所以驚人，是因為系統會依使用者眼睛凝視處做 **foveated**（中央凹）壓縮——你正注視的區域以更高細節串流，這套處理內建於 visionOS。","底層採用內建的 **NVIDIA CloudXR™** 串流，以高效能、低延遲協定運作，甚至能無線透過 Wi-Fi 從本機 PC 或雲端串流沉浸式內容。架構分兩端：你的 OpenXR app（streaming endpoint）需實作 Apple 的 **Foveated Streaming Protocol**（處理配對與認證）並使用 CloudXR SDK 提供的 OpenXR runtime；visionOS 端的 receiver app 則用 **FoveatedStreaming** 框架連線，並可整合 ARKit、SwiftUI、RealityKit。Apple 在 GitHub 與 developer.apple.com 提供 Windows 與 visionOS 的開源範例，講者強調「一個下午」就能讓串流跑起來、「一天」內開始串流自家 OpenXR app、「一週」內加上 visionOS 專屬能力。","receiver app 採 **session-based API**：建立 `FoveatedStreamingSession` 並呼叫 `connect`，框架會自動列出可連的 endpoint；配對時 endpoint 顯示含 client token 與安全連線憑證 hash 的 **QR code**（皆由 CloudXR SDK 提供），使用者用「看」的方式掃描即可。連上後用 SwiftUI 的 **ImmersiveSpace** 呈現串流內容，可加入一般視窗（含 volumetric window）與原生空間手勢，並建議搭配 **progressive immersion** 風格，讓人透過 portal 在實體環境中檢視體驗。endpoint 端的協定是輕量 TCP、JSON 編碼、採 request-acknowledge 模式，並需密切監看 session status（例如脫下裝置入睡時會先通知 paused，並保持可重連）。","效能可用 Xcode 新的 **Foveated Streaming instrument** 量測頻寬、pose 延遲、frame rate 等。進階強化包含 **message channels API**（visionOS 端在 `FoveatedStreamingSession` 上、endpoint 端透過 CloudXR 的 OpenXR 擴充），訊息為不透明資料 blob 可任意傳遞——例如用 SwiftUI 選關卡後送指令讓 OpenXR app 載入、回報進度，或傳 ARKit 資料對齊真實空間（X-Plane 12 即以此把實體飛行模擬器與虛擬座艙對齊；`FoveatedStreamingSession` 提供 OpenXR 與 ARKit 座標系互轉）。也可在 ImmersiveSpace 加 RealityView 讓 RealityKit 內容與串流內容無縫合成，若提供 depth 甚至能互相遮擋；別忘了提供 alpha channel 以與環境混合。"],"deepdive":[{"t":0,"title":"Introduction","body":"Apple 工程師 Adrian 開場，說明部分既有空間 app 需仰賴 PC 或 OpenXR 等外部技術，而 **Foveated Streaming**（visionOS 26.4 引入）讓 Vision Pro 連到外部裝置串流 OpenXR 內容、並自動回傳手部與控制器位置與麥克風。以 **X-Plane 12**、**iRacing**、Innoactive 帶來的 **Autodesk VRED**（Kia 1:1 檢視）為案例。關鍵是依眼動凝視做 **foveated 壓縮**，注視區域以更高細節串流，全部內建於 visionOS。"},{"t":248,"title":"How Foveated Streaming works","body":"用方塊圖說明兩端要建構的框架。底層是內建的 **NVIDIA CloudXR™**，提供高效能、低延遲、可無線（Wi-Fi、本機 PC 或雲端）的串流。你的 OpenXR app 需實作 Apple 的 **Foveated Streaming Protocol**（管理配對）並用 CloudXR SDK 的 OpenXR runtime；visionOS 端用 **FoveatedStreaming** 框架連線並可整合 ARKit、SwiftUI、RealityKit。"},{"t":286,"title":"Set up the streaming endpoint","body":"Apple 在 GitHub 提供端到端開源範例：Windows 範例含 Foveated Streaming Protocol 的參考實作、一個範例 OpenXR app，以及設定 NVIDIA CloudXR runtime 的指南。直接複製參考實作即可在一個下午內把 endpoint 設定好。"},{"t":318,"title":"Create a visionOS receiver app","body":"receiver app 是體驗的入口，用 **FoveatedStreaming.framework** 連到 endpoint，並透過 visionOS 框架加入專屬功能。可從 developer.apple.com 下載 visionOS 範例，搭配 Windows 範例就能在一個下午內讓 app 開始串流。"},{"t":363,"title":"Connect to a streaming endpoint","body":"框架採 **session-based API**：建立 `FoveatedStreamingSession`，呼叫 `connect` 時框架自動列出可連的 endpoint。配對需 endpoint 顯示含配對資訊的 **QR code**，框架會自動呈現掃描 UI，使用者用「看」的方式掃描即完成連線並開始呈現串流內容。"},{"t":404,"title":"Display a Foveated Streaming session in your immersive space","body":"用 SwiftUI 呈現串流內容：在 visionOS 上以 **ImmersiveSpace** 呈現空間內容，把 `FoveatedStreamingSession` 傳給 ImmersiveSpace 即會納入串流內容，並可像一般 SwiftUI app 一樣加上其他視窗。"},{"t":415,"title":"Compose SwiftUI content with Foveated Streaming","body":"範例 app 加了暫停／恢復的視窗、ImmersiveSpace 內重開主視窗的 widget，並設定 **progressive immersion** 風格——很適合 Foveated Streaming，讓人透過 portal 在實體環境中檢視。使用 Foveated Streaming 時可用 SwiftUI 全部功能：原生空間手勢、volumetric window、各種 immersion style。"},{"t":482,"title":"Integrate with the streaming endpoint","body":"endpoint 端要做兩件事：實作處理認證與配對的 **Foveated Streaming Protocol**，以及使用 CloudXR SDK 的 OpenXR runtime。協定是輕量 **TCP** 連線、與串流連線分開建立，用來認證安全的 foveated stream 並在兩端傳遞 session 狀態；GitHub 有參考實作。連線流程：endpoint 以 Bonjour 對本地網路可見、visionOS 建立連線、配對、串流開始後 `connect()` 返回。配對訊息為 **JSON 編碼**、採 request-acknowledge，barcode 含 client token 與憑證 hash（皆由 CloudXR 提供）。務必監看 session status（脫下裝置入睡前會通知 paused，且應保持可重連）。CloudXR 自動把 visionOS 輸入餵給 OpenXR（手部追蹤、PS VR2 Sense 控制器），建議用 depth buffer 並提供 alpha channel。"},{"t":688,"title":"Measure performance","body":"Xcode 提供 **Foveated Streaming instrument** 量測串流的頻寬、pose 延遲、frame rate 等統計，可用來診斷串流內容問題；詳見 developer.apple.com 的文章。"},{"t":716,"title":"Enhance with visionOS features","body":"用 **message channels API** 讓兩端溝通——visionOS 端在 `FoveatedStreamingSession` 上、endpoint 端透過 CloudXR 的 OpenXR 擴充。訊息為不透明資料 blob，可任意傳遞，例如用 SwiftUI 選關卡送指令讓 OpenXR app 載入並回報進度，或傳 **ARKit** 資料對齊真實空間。X-Plane 12 即用 ARKit 定位實體飛行模擬器並以 message channel 同步到 PC；`FoveatedStreamingSession` 提供 OpenXR 與 ARKit 座標系互轉，控制器與手部追蹤已內建，並用 alpha channel 與環境混合。"},{"t":822,"title":"Compose RealityKit content with Foveated Streaming","body":"可把串流內容與原生 **RealityKit** 渲染合成：只要在 ImmersiveSpace 加一個 **RealityView**，RealityKit 內容就會與串流內容無縫合成；若為 OpenXR 場景提供 depth，兩者甚至能互相遮擋。"},{"t":836,"title":"Next steps","body":"邀請大家下載並研究範例程式，試著建立自己的 receiver app 並把 OpenXR client 整合進 Apple 的協定，輕鬆上手 Foveated Streaming。"}],"summary_en":["This session dives into **Foveated Streaming**, introduced in visionOS 26.4, which lets Apple Vision Pro connect to an external device like a PC to stream **OpenXR** content as video and audio, while visionOS automatically sends back input data—hands, controller positions, and microphone. Standout examples include Laminar Research's X-Plane 12 flight sim, iRacing's sim racing, and Innoactive bringing Autodesk VRED to Vision Pro so designers view Kia cars at 1:1 scale. Quality is striking because the system applies **foveated** compression based on where you're looking—the focused region streams at higher detail—and this processing is built into visionOS.","Under the hood it uses built-in **NVIDIA CloudXR™** streaming, a high-performance, low-latency protocol that can stream immersive content wirelessly over Wi-Fi, from a local PC or the cloud. The architecture has two sides: your OpenXR app (the streaming endpoint) implements Apple's **Foveated Streaming Protocol** (pairing and authentication) and uses the OpenXR runtime from the CloudXR SDK, while the visionOS receiver app uses the **FoveatedStreaming** framework to connect and can integrate ARKit, SwiftUI, and RealityKit. Apple provides open-source Windows and visionOS samples on GitHub and developer.apple.com; you can get streaming working in an afternoon, start streaming your own OpenXR app in a day, and add visionOS-only capabilities in a week.","The receiver app uses a **session-based API**: create a `FoveatedStreamingSession` and call `connect`, and the framework presents a list of endpoints; pairing shows a **QR code** containing a client token and the secure connection's certificate hash (both from the CloudXR SDK), which you scan just by looking at it. Once connected, present the streamed content in a SwiftUI **ImmersiveSpace**, adding regular windows (including volumetric ones) and native spatial gestures, ideally with a **progressive immersion** style so people view the experience through a portal grounded in their environment. The endpoint protocol is a lightweight, JSON-encoded TCP connection using a request-acknowledge pattern, and you must monitor session status (e.g., it reports paused just before the device sleeps and should stay available for reconnection).","Performance can be measured with Xcode's new **Foveated Streaming instrument** for bandwidth, pose latency, frame rate, and more. Enhancements include the **message channels API** (on `FoveatedStreamingSession` on visionOS, via a CloudXR OpenXR extension on the endpoint), where messages are opaque data blobs—e.g., pick a level in SwiftUI and tell the OpenXR app to load it and report progress, or send **ARKit** data to align the scene to real space (X-Plane 12 uses this to align a physical flight sim with the virtual cockpit; `FoveatedStreamingSession` converts between OpenXR and ARKit coordinate frames). You can also add a RealityView to the ImmersiveSpace to compose RealityKit content with the stream, with mutual occlusion if you supply depth, and provide an alpha channel to blend with the environment."],"deepdive_en":[{"t":0,"title":"Introduction","body":"Apple engineer Adrian opens, noting some spatial apps rely on a PC or OpenXR, and that **Foveated Streaming** (introduced in visionOS 26.4) lets Vision Pro connect to an external device to stream OpenXR content while automatically sending back hand and controller positions and microphone. Cites **X-Plane 12**, **iRacing**, and Innoactive's **Autodesk VRED** (Kia at 1:1) as examples. The key is **foveated compression** driven by eye tracking—the focused area streams in higher detail—all built into visionOS."},{"t":248,"title":"How Foveated Streaming works","body":"A block diagram shows the frameworks each side builds on. At the base is built-in **NVIDIA CloudXR™**, a high-performance, low-latency, wireless-capable (Wi-Fi, local PC, or cloud) protocol. Your OpenXR app implements Apple's **Foveated Streaming Protocol** (pairing) and uses CloudXR's OpenXR runtime; the visionOS app uses the **FoveatedStreaming** framework to connect and integrates ARKit, SwiftUI, and RealityKit."},{"t":286,"title":"Set up the streaming endpoint","body":"Apple provides an end-to-end open-source sample on GitHub: the Windows sample has a reference implementation of the Foveated Streaming Protocol, an example OpenXR app, and guides for setting up the NVIDIA CloudXR runtime. Copy the reference implementation to set up the endpoint in an afternoon."},{"t":318,"title":"Create a visionOS receiver app","body":"The receiver app is the entry point, using **FoveatedStreaming.framework** to connect to endpoints and adding unique features via visionOS frameworks. Download the visionOS sample from developer.apple.com; with the Windows sample you can get the app streaming in an afternoon."},{"t":363,"title":"Connect to a streaming endpoint","body":"The framework uses a **session-based API**: create a `FoveatedStreamingSession`, and calling `connect` automatically presents a list of endpoints. Pairing requires the endpoint to display a **QR code** with pairing info; the framework presents a scanning UI, and you scan by looking at the code to connect and begin presenting the stream."},{"t":404,"title":"Display a Foveated Streaming session in your immersive space","body":"Present streamed content with SwiftUI: on visionOS use an **ImmersiveSpace**, passing the `FoveatedStreamingSession` to it to include the stream, and add additional windows just like any SwiftUI app."},{"t":415,"title":"Compose SwiftUI content with Foveated Streaming","body":"The sample adds a pause/resume window, a widget in the ImmersiveSpace to reopen the main window, and a **progressive immersion** style—a great fit for Foveated Streaming, letting people view through a portal grounded in their environment. With Foveated Streaming you get all of SwiftUI: native spatial gestures, volumetric windows, and immersion styles."},{"t":482,"title":"Integrate with the streaming endpoint","body":"The endpoint does two things: implement the **Foveated Streaming Protocol** (authentication and pairing) and use the CloudXR SDK's OpenXR runtime. The protocol is a lightweight **TCP** connection established separately from the stream, authenticating the secure foveated stream and communicating session state; a reference implementation is on GitHub. Flow: the endpoint is visible via Bonjour, visionOS connects, pairing occurs, streaming begins, and `connect()` returns. Pairing messages are **JSON-encoded** request-acknowledge; the barcode holds a client token and certificate hash (both from CloudXR). Monitor session status (paused before sleep; stay available for reconnect). CloudXR auto-feeds visionOS input to OpenXR (hand tracking, PS VR2 Sense controllers); use a depth buffer and provide an alpha channel."},{"t":688,"title":"Measure performance","body":"Xcode provides a **Foveated Streaming instrument** that reports the stream's bandwidth, pose latency, frame rate, and more to diagnose issues; see the article on developer.apple.com."},{"t":716,"title":"Enhance with visionOS features","body":"Use the **message channels API** to let both sides communicate—on `FoveatedStreamingSession` on visionOS, via a CloudXR OpenXR extension on the endpoint. Messages are opaque data blobs you can use freely, e.g., select a level in SwiftUI and command the OpenXR app to load it and report progress, or send **ARKit** data to align the scene to real space. X-Plane 12 uses ARKit to locate a physical flight sim and message channels to sync it to the PC; `FoveatedStreamingSession` converts between OpenXR and ARKit coordinate frames, controller and hand tracking are built in, and an alpha channel blends with the environment."},{"t":822,"title":"Compose RealityKit content with Foveated Streaming","body":"Compose the stream with native **RealityKit** rendering: simply add a **RealityView** to the ImmersiveSpace, and RealityKit content composes seamlessly with the streamed content; supply depth to the OpenXR scene and the two can even occlude each other."},{"t":836,"title":"Next steps","body":"An invitation to download and review the sample code, set up your own receiver app, and integrate your OpenXR client with Apple's protocol to get started easily with Foveated Streaming."}],"code":[]},"related":[{"id":"279","title":"Explore advances in RealityKit","gloss":"探索 RealityKit 的最新進展","gloss_en":"Explore advances in RealityKit","category":"visionos","categoryLabel":"visionOS"},{"id":"280","title":"Iterate your spatial scenes faster with Reality Composer Pro 3","gloss":"用 Reality Composer Pro 3 更快迭代空間場景","gloss_en":"Iterate your spatial scenes faster with Reality Composer Pro 3","category":"visionos","categoryLabel":"visionOS"},{"id":"283","title":"Explore enhancements to visionOS object tracking","gloss":"探索 visionOS 物件追蹤的強化功能","gloss_en":"Explore enhancements to visionOS object tracking","category":"visionos","categoryLabel":"visionOS"},{"id":"284","title":"Collaborate on structured 3D models in visionOS","gloss":"在 visionOS 中協作操作結構化 3D 模型","gloss_en":"Collaborate on structured 3D models in visionOS","category":"visionos","categoryLabel":"visionOS"},{"id":"287","title":"Build next-generation experiences with visionOS 27","gloss":"用 visionOS 27 打造次世代體驗","gloss_en":"Build next-generation experiences with visionOS 27","category":"visionos","categoryLabel":"visionOS"}]}</script>
