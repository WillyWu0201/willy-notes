<script id="d" type="application/json">{"s":{"id":"210","title":"What’s new in Apple In-App Purchase","gloss":"Apple App 內購買的新功能","category":"appstore","categoryLabel":"App Store","duration":806,"url":"https://developer.apple.com/videos/play/wwdc2026/210/","takeaway":"新增「**附 12 個月承諾的月繳訂閱**」，讓使用者以更實惠的月付方式訂閱，並可用 StoreKit 完整呈現與購買。","chapters":[[1,"Introduction"],[51,"Overview of monthly subscriptions with a 12-month commitment"],[102,"Set up in App Store Connect"],[148,"Merchandise with StoreKit"],[209,"Merchandise pricing terms with StoreKit views"],[242,"Get subscription pricing terms and make a purchase"],[305,"Sheet to manage subscriptions by subscriptionGroupID"],[415,"Monitor subscriptions with App Store Server APIs"],[465,"JWSTransaction (decoded) for a monthly subscription with a 12-month commitment"],[479,"JWSRenewalInfo (decoded) for a monthly subscription with a 12-month commitment"],[530,"Bundles and Suites"],[566,"Offer code redemption"],[598,"Sheet to redeem an offer code"],[635,"Enhanced submission experience"],[758,"Next steps"]],"points":[{"text":"推出**附 12 個月承諾的月繳訂閱（monthly subscription with a 12-month commitment）**，提供比年繳更易入手的付費選項。","hot":true},{"text":"可在 **App Store Connect** 設定此方案，並透過 `SubscriptionStoreView` 的 `preferredSubscriptionPricingTerms` 呈現月價與總承諾金額。","hot":false},{"text":"以 `Product.purchase` 搭配 `billingPlanType(.monthly)` 進行購買，並用 `manageSubscriptionsSheet` 依 `subscriptionGroupID` 管理訂閱。","hot":false},{"text":"後端可用 **App Store Server API** 監控，解碼後的 `JWSTransaction` 與 `JWSRenewalInfo` 帶有 `commitmentInfo` 承諾資訊。","hot":false},{"text":"涵蓋 **Bundles 與 Suites**、優惠代碼兌換（`offerCodeRedemption`）以及更完善的送審體驗。","hot":false}],"apis":["StoreKit","SubscriptionStoreView","Product","manageSubscriptionsSheet","offerCodeRedemption","JWSTransaction","JWSRenewalInfo","App Store Server API"],"audience":"**販售訂閱制的 App 開發者與商務團隊**，想導入更彈性月繳方案的人。","gloss_en":"What's new in Apple In-App Purchase","takeaway_en":"Adds **monthly subscriptions with a 12-month commitment**, giving users a more affordable monthly way to subscribe, with full StoreKit presentation and purchasing.","points_en":[{"text":"Introduces the **monthly subscription with a 12-month commitment**, offering a more accessible payment option than an annual plan.","hot":true},{"text":"Configure this plan in **App Store Connect** and present the monthly price and total commitment amount via `SubscriptionStoreView`'s `preferredSubscriptionPricingTerms`.","hot":false},{"text":"Purchase with `Product.purchase` using `billingPlanType(.monthly)`, and manage subscriptions with `manageSubscriptionsSheet` keyed by `subscriptionGroupID`.","hot":false},{"text":"On the backend, monitor with the **App Store Server API**; the decoded `JWSTransaction` and `JWSRenewalInfo` carry `commitmentInfo`.","hot":false},{"text":"Covers **Bundles and Suites**, offer code redemption (`offerCodeRedemption`), and a more refined review submission experience.","hot":false}],"audience_en":"**App developers and business teams selling subscriptions** who want to adopt a more flexible monthly plan.","summary":["這場由 StoreKit 工程師 Sam 主講的 session，圍繞三大主軸介紹 In-App Purchase 的新功能：擴充訂閱定價選項、更新 **offer code** 兌換 API，以及 App Store Connect 強化後的送審體驗。最核心的亮點是 iOS 26.5 推出的「**月繳但綁定 12 個月承諾**」（monthly subscriptions with a 12-month commitment）訂閱方案，讓使用者可以選擇按月分期付款來購買原本的年訂閱，藉此降低門檻、觸及更廣的客群。此方案可加到新的或既有的一年期自動續訂訂閱上，並在 App Store Connect 中為每種 billing plan 個別設定 offer（例如只給承諾方案的免費試用）。","在 app 端，**SubscriptionInfo** 新增了 **pricingTerms** 屬性，陣列會列出該產品所有可用的 billing plan；每個自動續訂訂閱至少有一個預設 billingPlanType 為 `.upFront` 的方案，若設定了承諾方案則會多回傳一個 `.monthly` 的方案。透過 StoreKit views 的 `.preferredSubscriptionPricingTerms` modifier 可在 **SubscriptionStoreView** 上篩選並行銷月繳方案；自訂 UI 則用 **Product** API 取得 `billingDisplayPrice` 與 `commitmentInfo.price`，並在購買時帶入 `.billingPlanType(.monthly)` purchase option。系統會在首次訂閱承諾方案前自動顯示一次性的揭露 sheet（每個 Apple Account 一次），並提供 `.manageSubscriptionsSheet` 讓使用者管理方案與查看剩餘付款次數。","伺服器端方面，**Transaction** 與 **RenewalInfo** 新增 `commitmentInfo`、`billingPlanType`、`renewalBillingPlanType` 等欄位（自 OS 26.4 起），decoded 的 **JWSTransaction** 與 **JWSRenewalInfo** 也帶有對應的承諾資訊（billingPeriodNumber、totalBillingPeriods、commitmentPrice、commitmentRenewalDate 等）。App Store Server APIs、Server Notifications V2 與 Retention Messaging API 都支援此新方案。開發者可從 Xcode 26.5 起用 StoreKit configuration 檔的 Billing Plan picker 在本機測試，並用 Transaction inspector 驗證 `commitmentInfo`。","此外，Sam 也預告了 **Bundles and Suites**（跨 app 組合訂閱，Xcode 27 可測試）、更新後會回傳 `verificationResult` 的 **OfferCodeRedemption** API，以及強化的送審流程——可將多個 In-App Purchase 與 in-app events、custom product pages 等 review item 合併為單一 App Review submission，並透過擴充的 **reviewSubmissions** API 統一自動化。實務上建議盡早為年訂閱加上月繳方案、更新 offer code 兌換呼叫點，並在 Xcode 27 與 sandbox 中開始測試。"],"deepdive":[{"t":1,"title":"Introduction","body":"由 StoreKit 團隊工程師 **Sam** 開場，說明 App Store 提供安全可信賴的市集，透過 App Store APIs 開發者可販售數位商品與服務，並交由 App Store commerce 平台處理金流與付款。Sam 預告本場三大主題：擴充訂閱定價選項、更新 **offer code** 兌換 API，以及強化的 App Store Connect 送審體驗。"},{"t":51,"title":"Overview of monthly subscriptions with a 12-month commitment","body":"介紹 iOS 26.5 推出的「**月繳但綁定 12 個月承諾**」方案，讓使用者可按月分期付款購買年訂閱。此 billing plan 可加到新或既有的一年期自動續訂訂閱，提供「upfront 一次付清」與「monthly 分期」兩種選擇以觸及更廣客群。App 以 26.5 SDK 編譯後，可用市場中執行 iOS、iPadOS、macOS、tvOS 或 visionOS 26.4 的使用者即可訂閱。"},{"t":102,"title":"Set up in App Store Connect","body":"示範在 App Store Connect 的 Subscriptions 區為 **SKDemo** app 設定方案：選擇一年期產品，在「monthly with a 12-month commitment availability」下選 Set Up Availability 並依步驟設定 billing plan。建立後可為每種 billing plan type 個別設定 offer，例如只針對 12 個月承諾方案提供免費試用。"},{"t":148,"title":"Merchandise with StoreKit","body":"介紹 **SubscriptionInfo** 上新的 **pricingTerms** 屬性，此陣列列出產品所有可用 billing plan。每個自動續訂訂閱至少有一個預設 billingPlanType 為 `.upFront` 的方案；因為 SKDemo+ 設定了承諾方案，陣列會多回傳一個 billingPlanType 為 `.monthly` 的物件，而 `.monthly` 僅適用於 12 個月承諾的月繳訂閱。"},{"t":209,"title":"Merchandise pricing terms with StoreKit views","body":"示範用 StoreKit views 行銷定價，新增 SwiftUI view modifier `.preferredSubscriptionPricingTerms` 並附加到既有的 **SubscriptionStoreView**，再篩選出 billingPlanType 為 `.monthly` 的 pricingTerms。StoreKit views 會自動處理產品 metadata 載入與跨平台版面調整，讓 store 在各平台都有原生感。"},{"t":242,"title":"Get subscription pricing terms and make a purchase","body":"示範在自訂 store UI 中用 **Product** API 取得產品後，篩選 `.monthly` billingPlanType 的 pricingTerms，並取得 `billingDisplayPrice`（月繳價）與 `commitmentInfo.price`（承諾總價）顯示給使用者。需注意 billing plan metadata 僅在客戶 storefront 有供應時才回傳；購買時要帶入 `.billingPlanType(.monthly)` purchase option 並處理結果。"},{"t":305,"title":"Sheet to manage subscriptions by subscriptionGroupID","body":"說明首次訂閱承諾方案前，App Store 會自動顯示揭露 sheet（每個 Apple Account 僅一次），內含完成承諾所需的付款次數與取消指引。訂閱啟用後系統也提供管理 UI，可查看所有方案、剩餘付款次數與承諾續訂時間；可用 SwiftUI 的 `.manageSubscriptionsSheet` 或 UIKit 的 `showManageSubscriptions` 直接在 app 內呈現。"},{"t":415,"title":"Monitor subscriptions with App Store Server APIs","body":"說明在 app 內可用 **Transaction** 新欄位取得 billing plan 專屬 metadata：`.upfront` 方案的 `commitmentInfo` 為 nil，`.monthly` 方案則回傳 12 個月承諾的進度、價格與到期資訊，可用來檢查 entitlement 或自建承諾進度指示器。**RenewalInfo** 上的 `renewalBillingPlanType` 與 `commitmentInfo` 則提供整體承諾續訂資訊，這些欄位自 OS 26.4 起可用，並務必使用 latest transaction 取得正確 expirationDate。"},{"t":465,"title":"JWSTransaction (decoded) for a monthly subscription with a 12-month commitment","body":"展示伺服器回傳的單一帳期購買的 decoded **JWSTransaction** 範例，內含與前述 StoreKit 對應的新欄位，例如 `billingPlanType: MONTHLY` 以及 `commitmentInfo`（billingPeriodNumber、totalBillingPeriods、commitmentExpiresDate、commitmentPrice）。這些欄位可用來偵測帳期購買，並理解其在整體承諾中的位置。"},{"t":479,"title":"JWSRenewalInfo (decoded) for a monthly subscription with a 12-month commitment","body":"展示 signed renewal info 物件，內含反映承諾結束後客戶續訂偏好的類似欄位（如 `renewalBillingPlanType`、`commitmentRenewalDate`、`commitmentRenewalPrice`、`commitmentRenewalBillingPlanType`），這些欄位僅在訂閱目前處於承諾中時才出現。範例中客戶將訂閱改為承諾完成後續訂進不同的 `BILLED_UPFRONT` 方案。"},{"t":530,"title":"Bundles and Suites","body":"預告另一項擴充訂閱供應的新功能 **Bundles and Suites**。**Bundle** 是一組可個別購買、但以單次購買組合銷售並提供較優惠價格的訂閱；**Suite** 則是一組只存在於 Suite 情境、無法個別購買、通常為一系列相關 app 提供服務的訂閱。可從 Xcode 27 開始測試其 API，更多細節將於 2026 年稍晚公布。"},{"t":566,"title":"Offer code redemption","body":"說明 offer code 可加到 consumable、non-consumable、自動續訂或非續訂訂閱產品，提供特定期間的免費或折扣 IAP。更新後的 **OfferCodeRedemption** API 在兌換完成時會像購買一樣回傳 `verificationResult`，並接受一組 **RedeemOption** 值來設定兌換；成功回傳 transaction、失敗則回傳描述原因的 error，UIKit 版本為 `presentOfferCodeRedeemSheet`。"},{"t":598,"title":"Sheet to redeem an offer code","body":"示範用 `.offerCodeRedemption` SwiftUI modifier 呈現兌換 sheet，並在 closure 中處理 `.success`（再驗證內含的 verificationResult）與 `.failure`（處理 error）。可從 Xcode 27 開始用新的兌換 API 在所有適用產品類型上測試兌換流程。"},{"t":635,"title":"Enhanced submission experience","body":"介紹 App Store Connect 強化的 IAP 送審體驗：可將多個產品作為 review item 合併成單一 App Review submission，並與 in-app events、custom product pages、product page optimizations 等其他 review item 一起送審，送出後可在集中視圖查看狀態。同時 **reviewSubmissions** API 擴充支援 IAP、subscription 與 subscription group 資源，舊有資源將被棄用，建議盡早遷移。"},{"t":758,"title":"Next steps","body":"Sam 總結下一步：為年訂閱產品加上新 billing plan 以提供月繳彈性同時鎖定長期承諾；更新 app 各處的 offer code 兌換呼叫點以善用擴充的 API；從今天起在 Xcode 27 與 sandbox 測試這些新功能；準備好後用強化的 App Review 體驗送審更新後的 IAP 產品。"}],"summary_en":["Presented by StoreKit engineer Sam, this session covers three themes for In-App Purchase: expanded subscription pricing options, an updated **offer code** redemption API, and the enhanced App Store Connect submission experience. The headline feature is **monthly subscriptions with a 12-month commitment**, introduced in iOS 26.5, which lets customers pay monthly for an annual subscription—lowering the barrier to entry and reaching a wider audience. These billing plans can be added to new or existing one-year auto-renewable subscriptions in App Store Connect, with offers configurable per billing plan type (for example, a free trial only for the 12-month commitment plan).","On the app side, **SubscriptionInfo** gains a new **pricingTerms** property listing all available billing plans for a product; every auto-renewable subscription carries at least one default plan with billingPlanType `.upFront`, and a `.monthly` plan is returned when a commitment plan is configured. StoreKit views' `.preferredSubscriptionPricingTerms` modifier filters and merchandises the monthly plan on a **SubscriptionStoreView**, while custom UI uses the **Product** API to read `billingDisplayPrice` and `commitmentInfo.price`, passing `.billingPlanType(.monthly)` as a purchase option. The App Store automatically presents a one-time disclosure sheet (once per Apple Account) before a first commitment purchase, and `.manageSubscriptionsSheet` lets customers manage plans and check remaining payments.","On the server side, **Transaction** and **RenewalInfo** gain `commitmentInfo`, `billingPlanType`, and `renewalBillingPlanType` fields (starting OS 26.4), and the decoded **JWSTransaction** and **JWSRenewalInfo** carry matching commitment data (billingPeriodNumber, totalBillingPeriods, commitmentPrice, commitmentRenewalDate, etc.). The App Store Server APIs, Server Notifications V2, and Retention Messaging API all support the new plan. Developers can test locally from Xcode 26.5 using the StoreKit configuration file's Billing Plan picker and verify `commitmentInfo` in the Transaction inspector.","Sam also previews **Bundles and Suites** (cross-app grouped subscriptions, testable in Xcode 27), the updated **OfferCodeRedemption** API that now returns a `verificationResult`, and an enhanced submission flow—multiple IAPs can be grouped with in-app events, custom product pages, and other review items into a single App Review submission, automated through the expanded **reviewSubmissions** API. Practical next steps: add monthly plans to annual subscriptions soon, update offer code redemption call sites, and start testing in Xcode 27 and sandbox."],"deepdive_en":[{"t":1,"title":"Introduction","body":"StoreKit team engineer **Sam** opens by noting the App Store provides a safe, trusted marketplace, and that App Store APIs let developers sell digital goods and services while the App Store commerce platform handles transactions and payment processing. Sam previews the three topics: expanding subscription pricing options, updates to the **offer code** redemption API, and the enhanced App Store Connect submission experience."},{"t":51,"title":"Overview of monthly subscriptions with a 12-month commitment","body":"Introduces the iOS 26.5 capability of **monthly subscriptions with a 12-month commitment**, letting customers pay monthly for annual subscriptions. The billing plan can be added to new or existing one-year auto-renewable subscriptions, offering both upfront and monthly choices to reach a larger customer base. Once compiled against the 26.5 SDK, customers in available markets running iOS, iPadOS, macOS, tvOS, or visionOS 26.4 can subscribe."},{"t":102,"title":"Set up in App Store Connect","body":"Demonstrates setup in App Store Connect's Subscriptions section for the **SKDemo** app: selecting a one-year product, choosing Set Up Availability under monthly-with-a-12-month-commitment availability, and following the steps to configure the billing plan. Once created, offers can be configured per billing plan type—for example, a free trial added only for customers on the 12-month commitment plan."},{"t":148,"title":"Merchandise with StoreKit","body":"Introduces the new **pricingTerms** property on **SubscriptionInfo**, an array listing all available billing plans for a product. Every auto-renewable subscription carries at least one plan with a default billingPlanType of `.upFront`; because SKDemo+ has a commitment plan configured, a second object with billingPlanType `.monthly` is returned, which applies only to monthly subscriptions with a 12-month commitment."},{"t":209,"title":"Merchandise pricing terms with StoreKit views","body":"Shows merchandising with StoreKit views by adding the `.preferredSubscriptionPricingTerms` SwiftUI view modifier to an existing **SubscriptionStoreView** and filtering for pricingTerms with a `.monthly` billingPlanType. StoreKit views handle loading product metadata and adjusting layout automatically so the store feels native across all platforms."},{"t":242,"title":"Get subscription pricing terms and make a purchase","body":"Demonstrates custom store UI using the **Product** API to fetch products, filter pricingTerms for `.monthly` billingPlanType, and read `billingDisplayPrice` (monthly price) and `commitmentInfo.price` (total commitment price) to display to the customer. Billing plan metadata is only returned when available in the customer's storefront; to purchase, pass the `.billingPlanType(.monthly)` purchase option and handle the result."},{"t":305,"title":"Sheet to manage subscriptions by subscriptionGroupID","body":"Explains that before a first commitment purchase, the App Store automatically presents a disclosure sheet (once per Apple Account) with the number of payments required and cancellation guidance. Once active, the system also provides UI to view all plans, remaining payments, and commitment renewal timing; this can be presented in-app via SwiftUI's `.manageSubscriptionsSheet` or UIKit's `showManageSubscriptions` API."},{"t":415,"title":"Monitor subscriptions with App Store Server APIs","body":"Explains that in-app, new **Transaction** fields provide billing-plan-specific metadata: for `.upfront` plans `commitmentInfo` is nil, while `.monthly` plans return the progress, price, and expiration for the 12-month commitment—usable to check entitlements or build a commitment progress indicator. **RenewalInfo** exposes `renewalBillingPlanType` and `commitmentInfo` for overall commitment renewal; these fields are available starting OS 26.4, and the latest transaction should always be used for an accurate expirationDate."},{"t":465,"title":"JWSTransaction (decoded) for a monthly subscription with a 12-month commitment","body":"Shows a server-side decoded **JWSTransaction** payload for a single billing-period purchase, including new fields matching the StoreKit ones—such as `billingPlanType: MONTHLY` and `commitmentInfo` (billingPeriodNumber, totalBillingPeriods, commitmentExpiresDate, commitmentPrice). These fields let you detect billing-period purchases and understand their place within the overall commitment."},{"t":479,"title":"JWSRenewalInfo (decoded) for a monthly subscription with a 12-month commitment","body":"Shows the signed renewal info object containing similar fields reflecting the customer's renewal preferences after the commitment ends (e.g. `renewalBillingPlanType`, `commitmentRenewalDate`, `commitmentRenewalPrice`, `commitmentRenewalBillingPlanType`), which are present only while the subscription is currently in a commitment. In the example, the customer changed their subscription to renew into a different `BILLED_UPFRONT` plan once the commitment completes."},{"t":530,"title":"Bundles and Suites","body":"Previews **Bundles and Suites** as another way to expand subscription offerings. A **Bundle** is a group of subscriptions that can be bought individually but are sold together in a single purchase at a better price; a **Suite** is a group that exists only within the Suite, cannot be purchased individually, and typically serves a related set of apps. The API can be tested starting in Xcode 27, with more program details coming later in 2026."},{"t":566,"title":"Offer code redemption","body":"Explains that offer codes can be added to consumable, non-consumable, auto-renewable, or non-renewing subscription products to provide free or discounted IAPs for a set duration. The updated **OfferCodeRedemption** API now returns a `verificationResult` on completion and accepts a set of **RedeemOption** values; success yields a transaction in the verificationResult, failure yields a descriptive error, and a UIKit variant is available via `presentOfferCodeRedeemSheet`."},{"t":598,"title":"Sheet to redeem an offer code","body":"Demonstrates presenting the redemption sheet with the `.offerCodeRedemption` SwiftUI modifier and handling `.success` (verifying the contained verificationResult) and `.failure` (handling the error) in the closure. Offer code redemption can be tested with the new API across all applicable product types starting in Xcode 27."},{"t":635,"title":"Enhanced submission experience","body":"Introduces the enhanced IAP submission experience in App Store Connect: multiple products can be grouped as review items into a single App Review submission and combined with in-app events, custom product pages, and product page optimizations, with status viewable in a centralized view. The **reviewSubmissions** API is also expanding to support IAP, subscription, and subscription group resources, with existing resources being deprecated in favor of reviewSubmission and reviewSubmissionItems—so migration should start now."},{"t":758,"title":"Next steps","body":"Sam summarizes the next steps: add new billing plans to give annual subscription products monthly flexibility while securing a long-term commitment; update offer code redemption call sites across the app to use the extended API; begin testing these features today in Xcode 27 and sandbox; and submit updated IAP products with the enhanced App Review experience when ready."}],"code":[]},"related":[{"id":"378","title":"Unlock in-game content with StoreKit and Background Assets","gloss":"用 StoreKit 與 Background Assets 解鎖遊戲內容","gloss_en":"Unlock in-game content with StoreKit and Background Assets","category":"appstore","categoryLabel":"App Store"},{"id":"309","title":"Explore Retention Messaging in App Store Connect","gloss":"探索 App Store Connect 的挽留訊息","gloss_en":"Explore Retention Messaging in App Store Connect","category":"appstore","categoryLabel":"App Store"},{"id":"391","title":"Offer subscriptions to groups and organizations","gloss":"向群組與組織提供訂閱","gloss_en":"Offer subscriptions to groups and organizations","category":"appstore","categoryLabel":"App Store"},{"id":"205","title":"Enhance your presence on the App Store","gloss":"強化你在 App Store 上的呈現","gloss_en":"Enhance your presence on the App Store","category":"appstore","categoryLabel":"App Store"},{"id":"261","title":"Build, deliver, and automate with Xcode Cloud","gloss":"用 Xcode Cloud 建置、交付與自動化","gloss_en":"Build, deliver, and automate with Xcode Cloud","category":"appstore","categoryLabel":"App Store"}]}</script>
