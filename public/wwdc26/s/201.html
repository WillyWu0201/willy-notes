pitfalls** and **fraud metrics** to help you assess protection effectiveness and avoid implementation mistakes.","hot":false}],"audience_en":"Developers who **need to defend against fraud and app tampering on the server side**, especially for services involving payments, accounts, or sensitive data.","summary":["這場由 Trust and Safety 團隊主講，核心在於：你把 app 設計成在 Apple 平台的安全環境中運作，但詐騙者會逆向工程、修改並重新簽署你的 app，讓篡改過的副本送出「看起來合法」的請求到你的伺服器。講者用兩個情境點題——作弊者偽造測驗答案、或在遊戲注入作弊選單衝榜——並說明 **App Attest** 能讓伺服器辨識並拒絕來自被修改 client 的請求。它的三大保護是：證明 app 跑在**真正的 Apple 硬體**上、揭露 app 是否被修改（透過 relying party、launch category、bundle version），以及用 assertion 保護從 app 到伺服器的 payload 不被竄改。","整個流程分三步。第一步用 **DCAppAttestService** 的 `generateKey()` 產生一把 **Secure Enclave**-bound 金鑰，私鑰留在 Secure Enclave，app 把回傳的 **key ID** 存進 **Keychain**；最佳實務是帳號型 app 每位使用者一把、或整個 app 一把，且 key 會在重裝、還原或從 iCloud 備份回復時失效。第二步呼叫 `attestKey(keyId:clientDataHash:)` 做 **attestation**，伺服器先發 challenge，attestation 物件含 format、attestation statement（憑證鏈與 receipt）、authenticator data；iOS 27 起 authenticator data 末端新增 **extensions**（launch validation category 與 bundle version），macOS 27 起 leaf 憑證帶有 **ACL Blob OID** 反映 full security mode 與 System Integrity Protection。第三步用 `generateAssertion(keyId:clientDataHash:)` 為後續 payload 簽出 **assertion**，伺服器須驗證其中**嚴格遞增的 counter** 以防重放攻擊。","講者特別提醒幾個常見陷阱：所有驗證都必須在**伺服器端**進行，因為一旦 app 被攻陷就不可信；面對既有使用者的新 key 不要直接拒絕，因為重裝或還原都會造成合法的 key rotation；attestation 應由伺服器控制發動並用 exponential back-off 重試、跑在背景以避開全域 rate limit。最後介紹 **fraud metric**——它回報某裝置在過去 30 天內與你 app 關聯的不重複 attested key 概略數量，可揪出被當成 broker 的受感染裝置，但只應作為**風險評估**的調查訊號，而非直接封鎖使用者的依據。"],"deepdive":[{"t":0,"title":"Introduction","body":"由 Trust and Safety 團隊的 Manthan 開場，點出威脅情境：詐騙者會逆向工程你的 app、修改並重新簽署，讓被攻陷的副本送出看似合法的請求竊取敏感資料。以**測驗監考 app 被偽造作答**與**屠龍遊戲被注入作弊選單衝榜**兩個例子說明，並預告本場會涵蓋 App Attest 保護什麼、整合步驟、最佳實務、常見陷阱與 fraud metric。"},{"t":95,"title":"Protections","body":"說明 **App Attest** 的三大保護：以 attestation 提供 app 跑在**真正 Apple 硬體**上的密碼學證明；揭露 app 是否被修改——透過 **relying party identifier**（Team Identifier 與 bundle identifier 串接）、iOS 27 新增的 **launch validation category**、以及 **bundle version**;以及用 **assertion** 保護從 app 到伺服器的 payload 不被中途竄改。"},{"t":244,"title":"Availability","body":"App Attest 支援所有 Apple 平台，**macOS 27 起也新增支援**。但並非所有 app 類型都能用，因此要先以 **isSupported** API gate 你的使用——例如 Action 與 SSO app extension 支援，其他 extension 則不支援。isSupported 的回應本身也可當 fraud signal：若某使用者突然大量回傳 unsupported，可能代表篡改。"},{"t":302,"title":"Key generation","body":"流程第一步是產生 **key ID**：App Attest 代為建立 **Secure Enclave**-bound 金鑰對，私鑰留在 Secure Enclave，回傳公鑰的 hash 給 app，app 再把 key ID 存入 **Keychain**。這些 key 是後續 attestation 與 assertion 的基礎。"},{"t":307,"title":"Generate a Secure Enclave–bound key","body":"示範 `DCAppAttestService.shared.generateKey()` 的呼叫，並列出金鑰最佳實務：帳號型 app **每位使用者一把 key**、或整個 app 在裝置上共用一把，切勿跨使用者族群共享。Key ID 隨 app 安裝存在、可跨 app 更新存活，但**重裝、還原或從 iCloud 備份回復都會使其失效**,且 key 綁定單一裝置、不跨裝置同步。"},{"t":372,"title":"Attestation","body":"進入 attestation 流程：app 從 Keychain 取出 key ID,向伺服器請求 attestation，伺服器回發 **challenge**;app 帶著 key ID 與 challenge 呼叫 attestation API，App Attest 取出金鑰對與來自 Secure Enclave、無法被修改的裝置硬體快照資料，向 Apple 服務驗證後回傳 attestation 物件給 app，再由 app 送交伺服器**儲存並與使用者關聯**。"},{"t":392,"title":"Attestation API","body":"示範 `attestKey(keyId:clientDataHash:)`，並強調最佳實務：由**伺服器控制發動** attestation 以維持安全的 requests-per-second 上限;失敗時用 **exponential back-off** 重試、不要在 app 內 hard-code retry 以免衝撞全域 rate limit;將 attestation 操作放在**背景工作**、避開使用者流程;且 attestation **必須由伺服器驗證**,因為被攻陷的 app 不可信。"},{"t":730,"title":"Assertion","body":"在伺服器已驗證 attestation 並儲存公鑰後，app 可用這把已 attest 的 key 透過 **assertion** 保護後續通訊：伺服器發 challenge，app 取 key ID 呼叫 assertion API 取得 assertion 物件，嵌入 payload 送交伺服器驗證後決定接受或拒絕內容。"},{"t":753,"title":"Assertion API","body":"示範 `generateAssertion(keyId:clientDataHash:)`,並提醒：assertion **在裝置本地產生、不會 round-trip Apple 伺服器**,應於需要時 on demand 產生;它有 **CPU 成本**,避免短時間大量產生;伺服器須驗證其中嵌入的 **counter** 並確保**嚴格遞增**,以提供 anti-replay 保護——若 counter 持平或下降，可能代表被攻陷的副本不知道伺服器記錄的值。"},{"t":898,"title":"Common pitfalls","body":"點出常見陷阱：面對既有使用者的**新 key 不要直接拒絕**,因為重裝或裝置還原都會造成合法的 key rotation，也不要立即作廢先前的 key;若伺服器拒絕 attestation 或 assertion，app 應**優雅降級**(限縮 App Attest 相關功能、提高監控)而非直接封鎖;任何懷疑都應走完整的**風險評估**流程，貿然封鎖會侵蝕信任並波及合法使用者。"},{"t":987,"title":"Fraud metric","body":"介紹 **fraud metric**：受感染裝置可能仍通過 attestation，並當成 **broker** 替其他裝置上的篡改 app 產生合法 attestation。Fraud metric 回報某裝置過去 **30 天**內與你 app 關聯的不重複 attested key 概略數量;伺服器用某筆 attestation 的 **receipt** 向 App Attest data server 發 POST 取得含 metric 的 receipt(其 not before 與 expiration 欄位規範刷新時機)。應將其視為**調查訊號**、建立 baseline 找出 spike，而非直接封鎖使用者。"},{"t":1147,"title":"Next steps","body":"收尾的行動建議：先用最新 SDK 重新建置 app 以取得最新 App Attest 功能;找出可受益於 attestation 的區域(如認證流程或付費內容的敏感 payload)並以 assertion 強化;設定伺服器去**驗證 attestation、儲存 receipt、追蹤 assertion counter**;並把 **fraud metric** 納入風險評估管線，藉由 Apple 硬體驗證 app 完整性、保護 app 與伺服器間通訊並偵測詐騙跡象。"}],"summary_en":["Presented by the Trust and Safety team, this session centers on a clear threat: you build your app to run in a secure environment on Apple's platforms, but fraudsters reverse-engineer, modify, and re-sign it so tampered copies send legitimate-looking requests to your server. Two examples frame the problem—a cheater submitting falsified quiz answers, and a game with an injected cheat menu climbing the leaderboard—and the takeaway is that **App Attest** lets your server detect and reject requests from modified clients. Its three protections are: cryptographic proof the app runs on **genuine Apple hardware**, visibility into whether the app was modified (via relying party, launch category, and bundle version), and securing app-to-server payloads with assertions.","The flow has three steps. First, call **DCAppAttestService**'s `generateKey()` to create a **Secure Enclave**-bound key—the private key stays in the Secure Enclave and the app stores the returned **key ID** in **Keychain**; best practice is one key per user for account-based apps (or one per app), and keys are invalidated on reinstall, restore, or iCloud-backup restore. Second, call `attestKey(keyId:clientDataHash:)` for an **attestation** against a server-vended challenge; the attestation contains format, an attestation statement (certificate chain and receipt), and authenticator data—on iOS 27 the authenticator data gains an **extensions** structure (launch validation category and bundle version), and on macOS 27 the leaf certificate carries an **ACL Blob OID** reflecting full security mode and System Integrity Protection. Third, call `generateAssertion(keyId:clientDataHash:)` to sign subsequent payloads with an **assertion**, whose **strictly-increasing counter** the server must verify for anti-replay protection.","The talk flags key pitfalls: all validation must happen **server-side**, since a compromised app can't be trusted; don't reject a new key for an existing user outright, because reinstall and restore cause legitimate key rotation; and the server should control when attestations are initiated, use exponential back-off on retry, and run them on background tasks to avoid global rate limits. It closes with the **fraud metric**—an approximate count of unique attested keys tied to your app on a device over the past 30 days, useful for spotting a compromised device acting as a broker, but to be treated only as an investigation signal in your **risk assessment**, never as grounds to block a user directly."],"deepdive_en":[{"t":0,"title":"Introduction","body":"Manthan from the Trust and Safety team opens by framing the threat: fraudsters reverse-engineer, modify, and re-sign your app so compromised copies send legitimate-looking requests that steal sensitive data. He illustrates with a **quiz-proctoring app submitting falsified answers** and a **dragon-slayer game with an injected cheat menu climbing the leaderboard**, then previews the agenda: what App Attest protects, integration steps, best practices, common pitfalls, and the fraud metric."},{"t":95,"title":"Protections","body":"Describes App Attest's three protections: an **attestation** provides cryptographic proof the app runs on **genuine Apple hardware**; it surfaces app modifications via the **relying party identifier** (Team Identifier concatenated with bundle identifier), the iOS 27 **launch validation category**, and the **bundle version**; and **assertions** secure app-to-server payloads against tampering in transit."},{"t":244,"title":"Availability","body":"App Attest is supported on all Apple platforms, now including **macOS 27**. Not every app type can use it, so gate usage with the **isSupported** API—for example, Action and SSO app extensions are supported while other extensions are not. The isSupported response itself can be a fraud signal: a spike in unsupported responses from a user may indicate tampering."},{"t":302,"title":"Key generation","body":"The first step is generating a **key ID**: App Attest creates a **Secure Enclave**-bound key pair on the app's behalf, keeping the private key in the Secure Enclave and returning a hash of the public key, which the app stores in **Keychain**. These keys form the basis for attestations and assertions."},{"t":307,"title":"Generate a Secure Enclave–bound key","body":"Shows the `DCAppAttestService.shared.generateKey()` call and lists key best practices: **one key per user** for account-based apps (or one per app on the device), never shared across the user population. Key IDs persist for the app's installation and survive updates, but are **invalidated on reinstall, restore, or iCloud-backup restore**, and are per-device—they don't sync across a user's devices."},{"t":372,"title":"Attestation","body":"Walks the attestation flow: the app fetches the key ID from Keychain, requests an attestation from the server, and the server vends a **challenge**; the app calls the attestation API with key ID and challenge, App Attest gathers the key pair plus unmodifiable device data derived from the Secure Enclave, validates it with an Apple service, and returns the attestation object, which the app sends to the server to **validate, store, and associate with the user**."},{"t":392,"title":"Attestation API","body":"Demonstrates `attestKey(keyId:clientDataHash:)` and stresses best practices: the **server controls initiation** to stay within a safe requests-per-second bound; use **exponential back-off** on failure rather than hard-coded retry logic to avoid global rate limits; perform attestation on a **background task** outside user flows; and the attestation **must be validated by the server**, since a compromised app can't be trusted."},{"t":730,"title":"Assertion","body":"Once the server has validated the attestation and stored the public key, the app uses that attested key to secure ongoing communication via **assertions**: the server vends a challenge, the app fetches the key ID and calls the assertion API to get an assertion object, embeds it in the payload, and the server validates it before accepting or rejecting the contents."},{"t":753,"title":"Assertion API","body":"Demonstrates `generateAssertion(keyId:clientDataHash:)` and notes assertions are **generated locally on the device—they don't round-trip Apple servers**—so generate them on demand; they have **CPU cost**, so avoid generating too many; and the server must verify the embedded **counter** is **strictly increasing** for anti-replay protection—a steady or decreasing counter may indicate a compromised copy unaware of the server's recorded value."},{"t":898,"title":"Common pitfalls","body":"Calls out pitfalls: don't reject a **new key for an existing user** outright, since reinstall or device restore cause legitimate key rotation, and don't immediately invalidate prior keys; if the server rejects an attestation or assertion, the app should **gracefully degrade** App Attest-tied functionality with heightened monitoring rather than block directly; and any suspicion should go through a full **risk assessment**, since blocking without proper evaluation erodes trust and can hurt legitimate users."},{"t":987,"title":"Fraud metric","body":"Introduces the **fraud metric**: a compromised device can still pass attestations and act as a **broker**, generating valid attestations for tampered app instances on other devices. The fraud metric gives an approximate count of unique attested keys tied to your app on a device over the past **30 days**; the server uses an attestation **receipt** to POST to the App Attest data server and receive a receipt carrying the metric (with not-before and expiration fields governing refresh). Treat it as an **investigation signal**—baseline it and watch for spikes—not as grounds to block users."},{"t":1147,"title":"Next steps","body":"Closing action items: rebuild against the latest SDKs to access the newest App Attest features; identify areas that benefit from attestation (authentication flows or sensitive payloads for premium content) and strengthen them with assertions; set up the server to **validate attestations, store receipts, and track assertion counters**; and fold the **fraud metric** into your risk-assessment pipeline—verifying app integrity, securing app-to-server communication, and detecting fraud, all backed by Apple hardware."}],"code":["import DeviceCheck\n\nlet keyID = try await DCAppAttestService.shared.generateKey()","import DeviceCheck\n\nlet keyId: String = ...\nlet clientDataHash: Data = ...\nlet attestation = try await DCAppAttestService.shared.attestKey(keyId: keyId, clientDataHash: clientDataHash)","import DeviceCheck\n\nlet keyId: String = ...\nlet clientDataHash: Data = ...\nlet assertion = try await DCAppAttestService.shared.generateAssertion(keyId: String, clientDataHash: Data)"]},"related":[{"id":"213","title":"Translate your app using agents in Xcode","gloss":"在 Xcode 中運用 agent 翻譯你的 App","gloss_en":"Translate your app using agents in Xcode","category":"swift","categoryLabel":"Swift"},{"id":"258","title":"What’s new in Xcode 27","gloss":"Xcode 27 的新功能","gloss_en":"What's new in Xcode 27","category":"swift","categoryLabel":"Swift"},{"id":"262","title":"What's new in Swift","gloss":"Swift 有什麼新東西","gloss_en":"What's new in Swift","category":"swift","categoryLabel":"Swift 語言"},{"id":"265","title":"Build real-time apps and services with gRPC and Swift","gloss":"用 gRPC 與 Swift 打造即時 App 與服務","gloss_en":"Build real-time apps and services with gRPC and Swift","category":"swift","categoryLabel":"Swift"},{"id":"268","title":"Profile, fix, and verify: Improve app responsiveness with Instruments","gloss":"用 Instruments 剖析、修正並驗證 App 反應速度","gloss_en":"Profile, fix, and verify: Improve app responsiveness with Instruments","category":"swift","categoryLabel":"Swift"}]}</script>
