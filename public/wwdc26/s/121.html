<script id="d" type="application/json">{"s":{"id":"121","title":"Announcing Apple’s next big step for Siri and iPhone","gloss":"宣布 Apple 為 Siri 與 iPhone 邁出的下一大步","category":"ai","categoryLabel":"AI 與機器學習","duration":91,"url":"https://developer.apple.com/videos/play/wwdc2026/121/","takeaway":"iOS 27 將帶來全新一代的 **Siri AI** 與生成式影像能力，是本屆 Apple Intelligence 的重大方向預告。","chapters":[],"points":[{"text":"iOS 27 推出能力更強的全新 **Siri AI**，象徵 Apple 智慧助理的重大躍進。","hot":true},{"text":"導入**新一代生成式 AI 影像**技術，可轉換並重新詮釋使用者的相片。","hot":false},{"text":"強調能產生**逼真影像（photorealistic imagery）**的生成式模型。","hot":false},{"text":"屬於簡短的公告影片，後續可關注更深入的開發者技術場次。","hot":false}],"apis":["Siri","Apple Intelligence"],"audience":"**關注 Apple Intelligence 與 Siri 未來方向**的開發者與決策者。","gloss_en":"Announcing Apple's next big step for Siri and iPhone","takeaway_en":"iOS 27 brings a new generation of **Siri AI** and generative imagery, serving as the major directional preview of this year's Apple Intelligence.","points_en":[{"text":"iOS 27 introduces a more capable new **Siri AI**, marking a major leap forward for Apple's intelligent assistant.","hot":true},{"text":"Brings in **next-generation generative AI imagery** that can transform and reinterpret users' photos.","hot":false},{"text":"Highlights generative models capable of producing **photorealistic imagery**.","hot":false},{"text":"This is a short announcement video; watch for the more in-depth developer technical sessions to follow.","hot":false}],"audience_en":"Developers and decision-makers **focused on the future direction of Apple Intelligence and Siri**.","summary":["這是一支電影預告片風格的宣傳短片，正式預告 iOS 27 上的 **Siri AI** 與新一代 **Apple Intelligence**。核心訊息是 Siri 將迎來大幅進化，扮演真正的「個人助理」角色：使用者可以向 Siri AI 詢問任何問題，並透過一個全新的專屬 app 輕鬆回顧過往的對話紀錄。短片以詢問餐點營養資訊、協助安排足球觀賽派對等生活情境，凸顯 Siri 更貼近個人脈絡的能力。","影像處理是另一大重點：新一代 Apple Intelligence 能 **extend（延伸）**、**reframe（重新構圖）** 與 **clean up（清理）** 你的相片，並在全新的 **Image Playground** 中產生擬真（photorealistic）影像，應用範圍從 Contact Posters 到自訂桌布。Safari 也以 topics 整理內容、以 **Notify Me** 在適當時機提醒；密碼若外洩可一鍵自動更新。","短片同時強調 **隱私保護** 是整套體驗的基礎——Apple Intelligence 如同守門人般守護你的私人資訊，讓資料在提供智慧功能的同時仍受到保護。由於這是預告性質的內容、沒有技術章節，開發者應將其視為 iOS 27 AI 方向的高層次預覽，後續再從各場專門 session 取得實作細節。"],"deepdive":[],"summary_en":["This is a cinematic, trailer-style promo formally announcing **Siri AI** and next-generation **Apple Intelligence** on iOS 27. The core message is that Siri is getting a major glow-up to become a true \"personal assistant\": users can ask Siri AI anything and revisit past conversations through a new dedicated app. The clip uses everyday scenarios—asking for the nutritional details of a meal, handling a soccer watch party—to highlight Siri's more personal, context-aware capabilities.","Image processing is another major theme: next-generation Apple Intelligence can **extend**, **reframe**, and **clean up** your photos, and create photorealistic imagery in the all-new **Image Playground**, spanning everything from Contact Posters to custom wallpapers. Safari is more organized with topics and more timely with **Notify Me**, and compromised passwords can be automatically updated with a single tap.","The clip also stresses that **privacy** underpins the whole experience—Apple Intelligence acts as a faithful sentinel guarding your private information so your data stays protected while still delivering intelligent features. Since this is a teaser with no technical chapters, developers should treat it as a high-level preview of iOS 27's AI direction and look to the dedicated technical sessions for implementation details."],"deepdive_en":[],"code":[]},"related":[{"id":"227","title":"Create UI prototypes using agents in Xcode","gloss":"在 Xcode 用代理人打造 UI 原型","gloss_en":"Prototype UI with agents in Xcode","category":"ai","categoryLabel":"AI 與機器學習"},{"id":"232","title":"Run local agentic AI on the Mac using MLX","gloss":"用 MLX 在 Mac 上執行本機 agentic AI","gloss_en":"Run local agentic AI on the Mac using MLX","category":"ai","categoryLabel":"AI 與機器學習"},{"id":"233","title":"Explore distributed inference and training with MLX","gloss":"用 MLX 探索分散式推論與訓練","gloss_en":"Explore distributed inference and training with MLX","category":"ai","categoryLabel":"AI 與機器學習"},{"id":"237","title":"What’s new in image understanding","gloss":"影像理解的新功能","gloss_en":"What's new in image understanding","category":"ai","categoryLabel":"AI 與機器學習"},{"id":"240","title":"Build intelligent Siri experiences with App Schemas","gloss":"用 App Schemas 打造智慧 Siri 體驗","gloss_en":"Build intelligent Siri experiences with App Schemas","category":"ai","categoryLabel":"AI 與機器學習"}]}</script>
