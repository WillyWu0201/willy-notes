<script id="d" type="application/json">{"s":{"id":"271","title":"Code-along: Build powerful drag and drop in SwiftUI","gloss":"程式碼共做：在 SwiftUI 打造強大的拖放功能","category":"swiftui","categoryLabel":"SwiftUI","duration":921,"url":"https://developer.apple.com/videos/play/wwdc2026/271/","takeaway":"透過打造接龍遊戲，學會 SwiftUI 全新的**拖放與重排序 API**：`reorderable`、`dragContainer` 與 `dropDestination`。","chapters":[[0,"Introduction"],[102,"Reordering"],[220,"Add reorderable to the preview"],[280,"Add reorder container to the GameView"],[358,"Add reorderable to PileView"],[410,"Drag multiple items"],[470,"Add dragContainer to customize the reorderContainer modifier."],[525,"Add dragPreviewsFormation to customize how the dragged cards appear"],[554,"Add dropPreviewsFormation to customize how dragged cards appear over a destination"],[599,"Drag configuration"],[700,"Add a drag configuration to allow move."],[725,"Add a drop destination modifier and configure it"],[869,"Next steps"]],"points":[{"text":"用 **`reorderable()`** 搭配 `reorderContainer(for:)` 即可在集合內重排序，並以 `apply(difference:)` 套用變更。","hot":true},{"text":"以 `dragContainer(for:)` 客製化拖曳來源，支援一次**拖曳多張卡片**的堆疊。","hot":false},{"text":"透過 `dragPreviewsFormation(.stack)` 與 `dropPreviewsFormation(.stack)` 控制拖曳與放置時的預覽外觀。","hot":false},{"text":"用 `DragConfiguration(allowMove: true)` 設定拖曳行為，允許移動而非僅複製。","hot":false},{"text":"以 `dropDestination(for:)` 接收放置，並用 `dropConfiguration` 計算目的地與是否允許 `.move` 操作。","hot":false}],"apis":["SwiftUI","reorderable","reorderContainer","dragContainer","dropDestination","dropConfiguration","DragConfiguration","ReorderDifference","dragPreviewsFormation","dropPreviewsFormation"],"audience":"**想在 SwiftUI 中實作進階拖放與清單重排序**的 iOS 開發者。","gloss_en":"Code-along: Build powerful drag and drop in SwiftUI","takeaway_en":"By building a game of Solitaire, learn SwiftUI's new **drag-and-drop and reordering APIs**: `reorderable`, `dragContainer`, and `dropDestination`.","points_en":[{"text":"Use **`reorderable()`** together with `reorderContainer(for:)` to reorder within a collection, applying changes with `apply(difference:)`.","hot":true},{"text":"Customize the drag source with `dragContainer(for:)`, supporting stacks that **drag multiple cards** at once.","hot":false},{"text":"Control the preview appearance during dragging and dropping with `dragPreviewsFormation(.stack)` and `dropPreviewsFormation(.stack)`.","hot":false},{"text":"Configure drag behavior with `DragConfiguration(allowMove: true)` to allow moving rather than just copying.","hot":false},{"text":"Receive drops with `dropDestination(for:)`, using `dropConfiguration` to compute the destination and whether to allow `.move` operations.","hot":false}],"audience_en":"iOS developers who **want to implement advanced drag and drop and list reordering in SwiftUI**.","summary":["自 iOS 16 起，SwiftUI 就以 **draggable** 與 **dropDestination** 兩個 modifier 搭配 **Transferable** 協定提供拖放能力，但這場 code-along 帶來 2027 版本三大新進化：全新的**重新排序（reordering）API**、可一次拖曳多個項目的 **Drag Container API**，以及能精細控制資料在拖曳與放置時如何傳輸的**設定（configuration）API**。講者以從零打造一局「接龍（Solitaire）」為主軸，示範如何在既有的 reorderable 之上層層疊加自訂行為，就算你不做接龍也能套用。","重新排序的核心是兩個 modifier：在 ForEach 上加 **reorderable()** 讓每張卡可被拖曳並在原位留下佔位符，在容器上加 **reorderContainer(for:)** 並在 closure 收到 difference 後更新資料。要讓多個牌堆共享同一個排序容器，可把 reorderContainer 加在包住所有 PileView 的 HStack，並用 **Card.Group** 這類型別唯一識別每一堆；當同一容器有多個 reorderable，需用 collectionID 區分。一個巧妙細節：接龍不能重排蓋著的牌，講者不靠進階 API，而是把卡片陣列切成兩個 ForEach——蓋著的牌那段不加 reorderable，翻開的牌那段才加，乾淨地擋掉不該被拖的牌。","要一次拖多張牌，reorderContainer 雖隱含自帶 dragContainer 與 dropDestination，但可自行加上 **dragContainer(for:)**（型別需與容器一致）並在 closure 回傳該卡上方整疊的 transferable 資料。拖曳與放置時的外觀則用 **dragPreviewsFormation(.stack)** 與 **dropPreviewsFormation(.stack)** 統一，後者建議下在 GameView 根層以確保整個遊玩區一致。注意 dragContainer 為 iOS、iPadOS、visionOS 27 新增，三個 formation modifier 則於 macOS 26 起可用。","最後用 **Drag Configuration API** 補上把新牌移入牌堆的規則。預設拖曳資料以複製（copy）傳輸，但卡牌應該是「移動」而非複製，故在來源卡上加 **dragConfiguration(DragConfiguration(allowMove: true))** 表達移動意圖；由於目的地的 reorderContainer 預設只接受容器內的移動，需自行補一個 **dropDestination(for:)** 讀取 reorderDestination 並呼叫遊戲邏輯插入新牌，再用 **dropConfiguration** 在 closure 中做三件事：依拖曳位置算出目標牌堆、只允許 move 傳輸、並驗證該移動是否合法（不合法回傳 forbidden 讓 SwiftUI 擋下）。實務帶走的重點：先用 reorderable／reorderContainer 把基本排序跑起來，再以 drag/drop 的 container 與 configuration modifier 逐步客製，就能做出順手又有規則的拖放體驗。"],"deepdive":[{"t":0,"title":"Introduction","body":"回顧 iOS 16 起 SwiftUI 透過 **draggable** 與 **dropDestination** 提供拖放，資料只要符合 **Transferable** 協定即可在系統間拖曳並被其他 App 接受（如把 card 型別 conform Transferable）。本場次宣告三大擴充：reordering API、可拖多項的 Drag Container API，以及可設定資料傳輸方式的 configuration API，並以打造接龍遊戲為示範主線，附可下載的範例專案。"},{"t":102,"title":"Reordering","body":"說明 App 內容通常有既定順序、但使用者想自行重排。示範拖曳一張牌時，它會從 view hierarchy 被「抬起」、原位留下空白佔位符，拖過其他牌時它們會讓出空間、佔位符也更新到放下後的位置。講者策略是先不套遊戲規則把 reordering 跑通，再回頭加入規則。"},{"t":220,"title":"Add reorderable to the preview","body":"先在檔案底部的 Preview（綠底四張牌）試水溫：在建立卡片的 **ForEach** 加 **reorderable()**，在 HStack 加 **reorderContainer**，指定 item 型別為 **CardValue**（與 ForEach 一致），closure 收到 difference 後更新 cards 陣列。完成後即可在 Preview 把梅花 A 從左拖到尾端重排。"},{"t":280,"title":"Add reorder container to the GameView","body":"為了讓所有牌堆同屬一個排序容器，把 **reorderContainer** 加到包住所有 PileView 的 HStack，沿用 **CardValue** 為 item 型別。因為有多個牌堆，需用 **Card.Group** 型別唯一識別每一堆，並在 closure 處理跨多堆的 difference，呼叫 game.moveCards(difference:) 更新資料。"},{"t":358,"title":"Add reorderable to PileView","body":"到 **PileView** 在卡片的 ForEach 加 **reorderable**；由於同一容器內有多個 reorderable，需提供唯一識別（collectionID: Card.Group.pile(index)）。如此即可把方塊 4 拖放到有黑桃 5 的牌堆，完成跨堆重排。"},{"t":410,"title":"Drag multiple items","body":"處理接龍不能重排蓋著牌的需求。講者不用進階 API，而是把 cards 陣列以 firstFaceUpIndex 切成兩個 **ForEach**：前段是蓋著的牌、不加 reorderable，後段是翻開的牌、加上 reorderable（並以 id: \\.value 識別）。如此翻開的牌可重排、拖蓋著的牌則無反應；這些 API 在所有支援拖放的 Apple 平台皆可用。"},{"t":470,"title":"Add dragContainer to customize the reorderContainer modifier.","body":"為了一次拖多張牌，雖然 reorderContainer 隱含自帶 dragContainer 與 dropDestination，仍在其下方自行宣告 **dragContainer(for: CardValue.self)** 以客製行為，型別須與容器一致。closure 收到 item identifier 後，呼叫遊戲邏輯（game.cardStack(startingAt:)）找出疊在該牌上方的整疊卡並回傳其 transferable 資料；如此拖梅花 4 時其上的方塊 3 會一起被帶走。"},{"t":525,"title":"Add dragPreviewsFormation to customize how the dragged cards appear","body":"多張牌一起拖時預設會收成一疊（pile，首張在上）。講者用 **dragPreviewsFormation** 改變外觀，可選 pile、list、stack 等，選 **.stack** 因為它精簡又有疊牌的手感，拖梅花 4 時卡片便排成整齊的一疊。"},{"t":554,"title":"Add dropPreviewsFormation to customize how dragged cards appear over a destination","body":"拖到牌堆上方時外觀會還原成預設，因為此時受 reorderContainer 的 dropDestination 之 drop formation 影響。講者用 **dropPreviewsFormation(.stack)** 統一，並把它下在 **GameView** 根層以套用到 App 內所有 dropDestination，使拖曳外觀在整個遊玩區一致。注意 dragContainer 為 iOS／iPadOS／visionOS 27 新增，三個 modifier 皆於 macOS 26 起可用。"},{"t":599,"title":"Drag configuration","body":"說明加上拖曳能力時要先想「資料如何移動」。預設 SwiftUI 建議以複製（copy）傳輸，適合跨 App 移動或插入新資料，但接龍中把牌拖進牌堆不該產生複本，而應從牌庫「移動」過去。由於這些 view 是與 reorderContainer 分離的拖曳來源與 dropDestination，需改用新的 **Drag Configuration API** 才能達成。"},{"t":700,"title":"Add a drag configuration to allow move.","body":"在 **RemainderView** 目前翻開的卡片已有拖曳 modifier、預設以 copy 傳輸。講者加上 **dragConfiguration(DragConfiguration(allowMove: true))** 表達此卡的意圖是以 move 傳輸，但實際如何傳輸仍由 dropDestination 決定。"},{"t":725,"title":"Add a drop destination modifier and configure it","body":"因為 reorderContainer 預設只接受容器內的移動，要接受新項目須自行在 dragContainer 下加 **dropDestination(for: CardValue.self)**，讀取 session 的 **reorderDestination** 並呼叫 game.insertCards 插入新牌（堆間移動仍由 reorderContainer closure 處理）。再加 **dropConfiguration** 做三件事：依 session.location 算出目標牌堆並建立 Destination、只表達 move 意圖、用 game.validateMove 驗證合法性，不合法回傳 .forbidden 讓 SwiftUI 擋下。如此方塊 6 只在規則允許時才能拖到黑桃 7 上，非法移動（如方塊 Q）則彈回牌庫。"},{"t":869,"title":"Next steps","body":"總結：本案從只有 reorderable 與 reorderContainer 起步，再以堆疊 drag/drop modifier 完整客製出一局接龍。鼓勵開發者即使不做接龍，也可考慮為 App 內容加入重排、用 Drag Container API 支援一次拖多項，並以 drag/drop 設定微調，讓 App 的拖放體驗更順手好用。"}],"summary_en":["Since iOS 16, SwiftUI has offered drag and drop via the **draggable** and **dropDestination** modifiers backed by the **Transferable** protocol, but this code-along introduces three major advances in the 2027 releases: a new **reordering API**, a **Drag Container API** for dragging multiple items at once, and **configuration APIs** for fine-grained control over how data transfers during drags and drops. The speaker builds a game of Solitaire from scratch to show how to layer custom behavior on top of basic reordering—techniques that apply even if you aren't building Solitaire.","Reordering centers on two modifiers: add **reorderable()** to a ForEach so each card can be lifted and leaves a placeholder, and add **reorderContainer(for:)** to the container, updating your data from the difference in the closure. To share one reorder container across multiple piles, place reorderContainer on the HStack wrapping all PileViews and use a type like **Card.Group** to uniquely identify each pile; when a container holds multiple reorderables, distinguish them with a collectionID. A neat detail: since face-down cards can't be reordered in Solitaire, rather than reaching for advanced API the speaker slices the cards array into two ForEach views—one for face-down cards without reorderable, one for face-up cards with it—cleanly preventing the wrong cards from being dragged.","To drag multiple cards at once, although reorderContainer implicitly provides its own dragContainer and dropDestination, you can add your own **dragContainer(for:)** (matching the container's type) and return the transferable data for the whole stack above a card in the closure. Drag and drop appearance is unified with **dragPreviewsFormation(.stack)** and **dropPreviewsFormation(.stack)**, the latter best declared on the GameView root for consistency across the playing area. Note that dragContainer is new on iOS, iPadOS, and visionOS 27, while the three formation modifiers are available on macOS 26 and newer.","Finally, the **Drag Configuration API** adds the rules for moving new cards into piles. By default drag data transfers by copy, but a card should move rather than be copied, so the source card gets **dragConfiguration(DragConfiguration(allowMove: true))** to express move intent; because the destination reorderContainer accepts only moves within the container by default, you add a **dropDestination(for:)** that reads the reorderDestination and calls game logic to insert new cards, then a **dropConfiguration** whose closure does three things: compute the target pile from the drag location, allow only move transfers, and validate whether the move is legal (returning forbidden lets SwiftUI block it). The practical takeaway: get basic reordering working with reorderable/reorderContainer first, then customize step by step with the drag/drop container and configuration modifiers to build a rule-aware, delightful drag-and-drop experience."],"deepdive_en":[{"t":0,"title":"Introduction","body":"Recaps that since iOS 16 SwiftUI has provided drag and drop through **draggable** and **dropDestination**, with data conforming to the **Transferable** protocol so it can be dragged across the system and accepted by other apps (e.g. conforming a card type to Transferable). The session announces three expansions—a reordering API, a Drag Container API for multiple items, and configuration APIs for data transfer—using a Solitaire game as the running example, with a downloadable sample project."},{"t":102,"title":"Reordering","body":"Explains that app content usually has an order but people want to rearrange it. Demonstrates that dragging a card lifts it from the view hierarchy, leaving an empty placeholder, and that other cards make space as you drag over them while the placeholder updates to the drop location. The strategy is to get reordering working without game rules first, then add the rules back in."},{"t":220,"title":"Add reorderable to the preview","body":"Tries it out in the bottom-of-file Preview (four cards on green): add **reorderable()** to the **ForEach** creating the cards, add **reorderContainer** to the HStack, specify the item type as **CardValue** (matching the ForEach), and update the cards array from the difference in the closure. The preview can then reorder the ace of clubs from the left to the end."},{"t":280,"title":"Add reorder container to the GameView","body":"To put all piles in one reorder container, the **reorderContainer** is added to the HStack containing every PileView, reusing **CardValue** as the item type. Because there are multiple piles, the **Card.Group** type uniquely identifies each, and the closure handles a difference across piles by calling game.moveCards(difference:)."},{"t":358,"title":"Add reorderable to PileView","body":"In **PileView**, **reorderable** is added to the cards' ForEach; since multiple reorderables share one container, each needs a unique identifier (collectionID: Card.Group.pile(index)). This enables dragging the four of diamonds onto the pile with the five of spades for cross-pile reordering."},{"t":410,"title":"Drag multiple items","body":"Handles the rule that face-down cards can't be reordered. Instead of advanced API, the speaker slices the cards array at firstFaceUpIndex into two **ForEach** views: the first holds face-down cards without reorderable, the second holds face-up cards with it (identified by id: \\.value). Face-up cards reorder while face-down cards don't respond; these APIs are available on all Apple platforms that support drag and drop."},{"t":470,"title":"Add dragContainer to customize the reorderContainer modifier.","body":"To drag multiple cards, even though reorderContainer implicitly provides its own dragContainer and dropDestination, a **dragContainer(for: CardValue.self)** is declared below it to customize behavior, matching the container's type. Its closure receives an item identifier and calls game logic (game.cardStack(startingAt:)) to find the cards stacked above and return their transferable data, so dragging the four of clubs brings the three of diamonds along."},{"t":525,"title":"Add dragPreviewsFormation to customize how the dragged cards appear","body":"By default dragged cards collapse into a pile (first card on top). The speaker uses **dragPreviewsFormation** to change the appearance—options include pile, list, and stack—choosing **.stack** because it's compact and has the feel of stacked cards, so the four of clubs forms a neat stack when dragged."},{"t":554,"title":"Add dropPreviewsFormation to customize how dragged cards appear over a destination","body":"Over the piles the appearance reverts to default because the cards then use the reorderContainer's dropDestination drop formation. The speaker unifies it with **dropPreviewsFormation(.stack)** declared on the **GameView** root so it applies to every dropDestination, keeping the dragged appearance consistent across the playing area. Note dragContainer is new on iOS/iPadOS/visionOS 27, and all three modifiers are available on macOS 26 and newer."},{"t":599,"title":"Drag configuration","body":"Explains thinking about how a card's value should move when adding drag. SwiftUI defaults to transfer by copy, which suits moving data between apps or inserting something new, but in Solitaire dragging a card into a pile shouldn't create a copy—it should move from the deck. Because these views are a separate drag source and dropDestination from the reorderContainer, the new **Drag Configuration API** is needed."},{"t":700,"title":"Add a drag configuration to allow move.","body":"In **RemainderView** the current face-up card already has drag modifiers and defaults to transfer by copy. The speaker adds **dragConfiguration(DragConfiguration(allowMove: true))** to express the intent that this card transfers by move, though the dropDestination ultimately decides how the data is transferred."},{"t":725,"title":"Add a drop destination modifier and configure it","body":"Because the reorderContainer accepts only moves within the container by default, accepting new items requires a **dropDestination(for: CardValue.self)** below the dragContainer that reads the session's **reorderDestination** and calls game.insertCards (moves between piles stay handled by the reorderContainer closure). A **dropConfiguration** then does three things: compute the target pile from session.location and build a Destination, express move-only intent, and validate legality with game.validateMove, returning .forbidden so SwiftUI blocks invalid drops. Thus the six of diamonds can land on the seven of spades only when allowed, while an illegal move like the queen of diamonds returns to the deck."},{"t":869,"title":"Next steps","body":"Wraps up: the app started with just reorderable and reorderContainer, then composed drag/drop modifiers on top to fully build Solitaire. Even if you aren't building Solitaire, consider letting people reorder content, supporting multi-item drags with the Drag Container API, and fine-tuning with drag/drop configurations to make your app's drag and drop a delight to use."}],"code":[]},"related":[{"id":"269","title":"What’s new in SwiftUI","gloss":"SwiftUI 的新功能","gloss_en":"What's new in SwiftUI","category":"swiftui","categoryLabel":"SwiftUI"},{"id":"272","title":"Use SwiftUI with AppKit and UIKit","gloss":"在 AppKit 與 UIKit 中使用 SwiftUI","gloss_en":"Use SwiftUI with AppKit and UIKit","category":"swiftui","categoryLabel":"SwiftUI"},{"id":"322","title":"Compose advanced graphics effects with SwiftUI","gloss":"用 SwiftUI 組合進階圖形效果","gloss_en":"Compose advanced graphics effects with SwiftUI","category":"swiftui","categoryLabel":"SwiftUI"},{"id":"8002","title":"SwiftUI for Beginners Group Lab","gloss":"SwiftUI 新手團體實驗室","gloss_en":"SwiftUI for Beginners Group Lab","category":"swiftui","categoryLabel":"SwiftUI"},{"id":"8006","title":"SwiftUI Group Lab","gloss":"SwiftUI 小組實驗室","gloss_en":"SwiftUI Group Lab","category":"swiftui","categoryLabel":"SwiftUI"}]}</script>
