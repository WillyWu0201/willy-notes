<script id="d" type="application/json">{"s":{"id":"262","title":"What's new in Swift","gloss":"Swift 有什麼新東西","category":"swift","categoryLabel":"Swift 語言","duration":1965,"url":"https://developer.apple.com/videos/play/wwdc2026/262/","takeaway":"語言層大豐收——日常 ergonomics(anyAppleOS、@diagnose、module selector ::)、並行與記憶體安全、@specialized / @inline 等效能控制,跨平台(C / Java / Wasm / Embedded)也大推進。","chapters":[[7,"Introduction"],[44,"Everyday Language Improvements"],[72,"Better Swift Concurrency diagnostics (catching in the task)"],[81,"Better Swift Concurrency diagnostics (saving the task for later)"],[87,"Better 'Sendable' conformances"],[108,"More accessible memberwise initializers"],[115,"anyAppleOS Availability"],[123,"'anyAppleOS' availability (before)"],[137,"'anyAppleOS' availability (after)"],[160,"Controlling warnings with '@diagnose'"],[182,"@diagnose Attribute"],[227,"Clarifying code with module selectors"],[232,"Module Selectors (::)"],[300,"Clarifying code with module selectors (module selectors work on members, too)"],[359,"Library Updates"],[376,"Standard Library"],[386,"Task cancellation"],[400,"Task cancellation shield"],[413,"Constructing a new dictionary"],[426,"Dictionary.mapKeyedValues"],[434,"The new FilePath type"],[451,"Swift Testing Updates"],[461,"Issue Severity"],[472,"Test Cancellation"],[514,"XCTest interoperability: Using XCTest from Swift Testing"],[528,"XCTest interoperability: Using Swift Testing from XCTest"],[569,"Subprocess 1.0"],[601,"Subprocess Output Stream"],[614,"Foundation"],[637,"Progress Manager - Concurrency"],[719,"Beyond Apple Platforms"],[755,"Swift–C Interoperability (@C attribute)"],[909,"Swift-Java"],[963,"Editor support"],[1004,"WebAssembly (Wasm) & JavascriptKit"],[1088,"Embedded Swift"],[1199,"Performance Tuning"],[1256,"Directly control inlining (source code)"],[1261,"Directly control inlining (inlined, but not optimized)"],[1267,"Directly control inlining (inlined and optimized)"],[1289,"Optimizer Control: @inline(always) & @specialized"],[1290,"Directly control inlining (preventing inlining)"],[1299,"Directly control inlining (forcing inlining)"],[1315,"Making generic functions faster with '@specialized'​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​"],[1337,"Making generic functions faster with '@specialized'​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​ (explicitly requesting specialization)"],[1469,"Ownership System & Noncopyable Types"],[1546,"Associated types can be '~Copyable' and '~Escapable'"],[1578,"Iterable Protocol & Borrow/Mutate Accessors"],[1648,"The problem with existing accessors"],[1699,"'borrow' and 'mutate' accessors"],[1737,"New Standard Library Types: UniqueBox, UniqueArray, Ref"],[1814,"Using 'MutableRef' to eliminate repeated accesses (with un-hoisted access)"],[1834,"Using 'MutableRef' to eliminate repeated accesses (hoisted by 'inout' parameter)"],[1841,"Using 'MutableRef' to eliminate repeated accesses (hoisted by 'MutableRef')"],[1871,"The Future of Swift"]],"points":[{"text":"日常語法:**@available(anyAppleOS 27, *)** 一行取代列舉所有 OS;**@diagnose** 精準控制個別警告(ignored / warning / error);**module selector Module::Symbol** 解決跨模組同名衝突;memberwise init 會依存取層級產生多個版本。"},{"text":"並行:更好的診斷與 Sendable 推斷(**~Sendable、@unchecked Sendable**);**withTaskCancellationShield** 保護不可中斷的關鍵區段。"},{"text":"標準庫:新 **FilePath** 型別、**Dictionary.mapKeyedValues**、init(uniqueKeysWithValues:)。"},{"text":"Swift Testing 同步更新:**Issue severity(.warning)**、Test.cancel、**雙向 XCTest 互通**(呼應 267)。"},{"text":"效能與記憶體:**@inline(always/never)、@specialized(where:)** 直接控制最佳化;**InlineArray** 與 [256 of Int] 固定大小陣列;ownership 強化——~Copyable / ~Escapable、**borrow / mutate accessor**、新型別 UniqueBox / UniqueArray / Ref。"},{"text":"跨平台:**@C** 強化 Swift-C 互通、Swift-Java、**WebAssembly + JavaScriptKit**、Embedded Swift;另有 Subprocess 1.0(串流輸出)與 Foundation 的 ProgressManager / Subprogress。"}],"apis":["@available(anyAppleOS)","@diagnose","Module::Symbol","~Sendable","withTaskCancellationShield","FilePath","mapKeyedValues","@specialized","@inline(always)","InlineArray","~Copyable","borrow / mutate","UniqueBox","Subprocess","ProgressManager"],"audience":"**所有 Swift 開發者;尤其關心 concurrency 安全、效能調校的人。** 32 分鐘塞了 20+ 主題,屬於「先看一句話總結、再用章節軸跳到在意段落」的典型大場。","gloss_en":"What's new in Swift","takeaway_en":"A big haul at the language level—everyday ergonomics (anyAppleOS, @diagnose, the :: module selector), concurrency and memory safety, performance controls like @specialized / @inline, plus major cross-platform progress (C / Java / Wasm / Embedded).","points_en":[{"text":"Everyday syntax: **@available(anyAppleOS 27, *)** replaces enumerating every OS in one line; **@diagnose** precisely controls individual warnings (ignored / warning / error); the **module selector Module::Symbol** resolves same-name conflicts across modules; memberwise init generates multiple versions based on access level.","hot":false},{"text":"Concurrency: better diagnostics and Sendable inference (**~Sendable, @unchecked Sendable**); **withTaskCancellationShield** protects critical sections that must not be interrupted.","hot":false},{"text":"Standard library: the new **FilePath** type, **Dictionary.mapKeyedValues**, and init(uniqueKeysWithValues:).","hot":false},{"text":"Swift Testing updates in step: **Issue severity(.warning)**, Test.cancel, and **bidirectional XCTest interop** (echoing 267).","hot":false},{"text":"Performance and memory: **@inline(always/never), @specialized(where:)** directly control optimization; **InlineArray** and [256 of Int] fixed-size arrays; stronger ownership—~Copyable / ~Escapable, the **borrow / mutate accessor**, and new types UniqueBox / UniqueArray / Ref.","hot":false},{"text":"Cross-platform: **@C** strengthens Swift-C interop, Swift-Java, **WebAssembly + JavaScriptKit**, Embedded Swift; plus Subprocess 1.0 (streaming output) and Foundation's ProgressManager / Subprogress.","hot":false}],"audience_en":"**All Swift developers; especially those who care about concurrency safety and performance tuning.** With 20+ topics packed into 32 minutes, this is a classic large session—read the one-sentence summary first, then jump to the sections you care about via the chapter track.","summary":["Swift 團隊的 Becca 與 Evan 回顧 **Swift 6.3 與 6.4** 開發期間的進展，分四大塊：日常語言改善、重要函式庫更新、跨平台與互通性，以及效能調校。日常改善多半是「惱人小事消失」：optional 用 `some`／`any` 不必再加括號、忽略 Task 拋出的錯誤會警告、defer 內可呼叫 async、weak 屬性可用 `weak let` 而不必 `@unchecked Sendable`、可用 `~Sendable` 明確宣告不可傳遞，以及 internal/private 混用的 struct 會多一個 memberwise initializer。","幾個明顯的新語法：**`anyAppleOS`** 讓你把多個平台名稱濃縮成一個 availability 與 `#if os` 條件；**`@diagnose`** 屬性可在單一宣告內把特定警告群組改成 ignored、warning 或 error（例如暫時關掉 deprecation、開啟 strict memory safety、把未來才會報錯的東西提前當 error）；**module selector（`::`）** 用雙冒號明確指定模組名稱，解決兩個模組同名型別或成員的衝突（如 SwiftUI 與資料庫套件都有 `View`）。","函式庫方面：標準庫新增 **task cancellation shield**、`mapKeyedValues`（同時拿到 key 與 value）、以及新的 **`FilePath`** 型別；**Swift Testing** 加入 issue severity（`.warning`）、`Test.cancel` 動態跳過、與 XCTest 雙向互通；**Subprocess 1.0** 提供更簡潔的 API 與以 AsyncBufferSequence 串流輸出；**Foundation** 推出與 async/await 契合的 **ProgressManager**，並持續把 Data、NSURL/CFURL 等以 Swift 重寫。跨平台部分包含 **`@C`** 屬性把 Swift 函式暴露給 C、Swift-Java 支援 async/throwing、官方 Android SDK、VSCode/OpenVSX 編輯器支援、WebAssembly 與 JavaScriptKit（Goodnotes 案例顯示安全橋接快 35–40 倍），以及 Embedded Swift 新增 existential 與 untyped throws。","效能調校聚焦兩塊：直接控制 optimizer 決策——新增 **`@inline(always)`**（搭配 `final`）與 **`@specialized`** where 子句強制特化；以及大幅擴充 **ownership 系統**——`~Copyable`／`~Escapable` 可用於 associated type、新的 **Iterable** 協定讓 for loop 用 borrow 取代複製、**`borrow`／`mutate` accessor** 取代 get/set 以避免大型值複製，並推出 **UniqueBox、UniqueArray、Ref/MutableRef** 等新標準庫型別。最後 Evan 介紹 Swift Build 成為 SwiftPM 預設後端、新增工作組，以及如何在 forums.swift.org 參與貢獻。"],"deepdive":[{"t":7,"title":"Introduction","body":"Becca 與 Evan 開場，預告本場涵蓋 **Swift 6.3 與 6.4** 的語言改善、函式庫更新、跨平台支援，以及效能調校四大主題，並說明兩人輪流主講的安排。"},{"t":44,"title":"Everyday Language Improvements","body":"概覽一連串日常小改善的開端，目標是讓你「表達確切意圖、不帶多餘雜訊」。先從幾乎察覺不到、像是惱人小事消失的細節談起，例如 optional 搭配 `some`／`any` 不再需要括號。"},{"t":72,"title":"Better Swift Concurrency diagnostics (catching in the task)","body":"現在若你**默默忽略** Swift Concurrency task 拋出的錯誤，編譯器會給警告，提醒你在 task 內處理錯誤。對應的解法之一是在 task 的 `do/catch` 內妥善處理。"},{"t":81,"title":"Better Swift Concurrency diagnostics (saving the task for later)","body":"另一個解法是把 task 存下來稍後檢查其錯誤；同時舊有「不能在 defer block 內呼叫 async 函式」的限制也已移除。"},{"t":87,"title":"Better 'Sendable' conformances","body":"需要 `@unchecked Sendable` 的 class（因為有 `weak var`）現在可把屬性改成 **`weak let`** 使其不可變，便能正常通過 Sendable 檢查；若型別不該是 Sendable，可用新的 **`~Sendable`** 語法明確宣告，且不會阻止子類別變成 Sendable。"},{"t":108,"title":"More accessible memberwise initializers","body":"混用 internal 與 private 屬性的 struct，現在會額外產生一個可從專案其他檔案使用的 memberwise initializer。"},{"t":115,"title":"anyAppleOS Availability","body":"introduces **`anyAppleOS`**：隨著 Apple OS 版本號對齊，可把多個平台名稱濃縮成單一 availability 標註，減少冗長的平台清單。"},{"t":123,"title":"'anyAppleOS' availability (before)","body":"示範改用前的寫法：每個函式都要逐一列出 macOS/iOS/watchOS/tvOS/visionOS 版本，並用 `#if os(...)` 條件編譯，相當冗長。"},{"t":137,"title":"'anyAppleOS' availability (after)","body":"示範改用後：以 `@available(anyAppleOS 27, *)` 一次涵蓋所有平台，再對例外（如 tvOS unavailable）加上更具體的標註；`#if os(anyAppleOS)` 亦同。"},{"t":160,"title":"Controlling warnings with '@diagnose'","body":"introduces **`@diagnose`** 屬性，可在單一宣告內改變特定警告群組的行為，無需影響整個專案。"},{"t":182,"title":"@diagnose Attribute","body":"示範 `@diagnose` 的三種用法：把 DeprecatedDeclaration 設為 ignored 以暫時關掉警告、把 StrictMemorySafety 設為 warning 以稽核 unsafe API、把 ErrorInFutureSwiftVersion 設為 error 以提前攔截未來會報錯的程式碼。"},{"t":227,"title":"Clarifying code with module selectors","body":"說明兩個模組有同名 API 的問題：例如 Rocket 與 GiftShopToys 都有 `SaturnV` 型別，匯入兩者會造成歧義錯誤。"},{"t":232,"title":"Module Selectors (::)","body":"introduces **module selector `::`**：`Rocket::SaturnV` 中冒號左側一律當作模組名稱，可正確解析；相較 `Rocket.SaturnV` 在模組與型別同名時會誤判。"},{"t":300,"title":"Clarifying code with module selectors (module selectors work on members, too)","body":"module selector 也可用在方法或屬性名稱上，例如 `launchPadTechnician.HumanResources::fire()`，用來區分來自不同模組 extension 的同名成員。建議用於防禦性場景（如 macro 展開），但不鼓勵刻意設計同名 API 再依賴它。"},{"t":359,"title":"Library Updates","body":"Evan 接手，說明函式庫更新延續同一目標：幫你表達確切意圖。涵蓋標準庫、Swift Testing、Subprocess 與 Foundation。"},{"t":376,"title":"Standard Library","body":"概覽標準庫三大新工具：task cancellation、dictionary 轉換、與 filepath 操作。"},{"t":386,"title":"Task cancellation","body":"說明有時即使 task 被取消，仍想完成工作（如把資料寫完以免檔案損毀），引出 task cancellation shield。"},{"t":400,"title":"Task cancellation shield","body":"introduces **`withTaskCancellationShield`**：在 shield 區塊內，取消狀態檢查一律回傳 false。建議讓此區域保持簡短，專注於完成或回滾已開始的工作。"},{"t":413,"title":"Constructing a new dictionary","body":"說明 `mapValues` 只把舊 value 傳入閉包，若計算新值需要 key，就得手動重建字典的痛點。"},{"t":426,"title":"Dictionary.mapKeyedValues","body":"introduces **`mapKeyedValues`**：同時把 key 與舊 value 傳入閉包來計算新值，省去手動重建字典。"},{"t":434,"title":"The new FilePath type","body":"introduces 標準庫新的 **`FilePath`** 型別（源自 Swift System），處理不同平台對 filepath 表示的細微差異，例如以 `components` 安全增刪路徑分段。"},{"t":451,"title":"Swift Testing Updates","body":"概覽 Swift 6.4 的 Testing 更新，讓你更能控制測試行為：surface 非致命問題與動態跳過 test case。"},{"t":461,"title":"Issue Severity","body":"可為 `Issue.record` 設定 severity，設為 `.warning` 可呈現值得調查、但不應阻擋 CI 的問題。"},{"t":472,"title":"Test Cancellation","body":"introduces **`Test.cancel`** 可動態取消測試，尤其在 parameterized test 中可只取消不該跑的個別參數，而非整題失敗或全跑完。`swift test` 也新增重複執行直到通過或失敗的功能。"},{"t":514,"title":"XCTest interoperability: Using XCTest from Swift Testing","body":"Swift 6.4 起，從 Swift Testing 呼叫 XCTest assertion 失敗時會被回報為 test issue，讓你遷移時不會悄悄失去測試覆蓋。"},{"t":528,"title":"XCTest interoperability: Using Swift Testing from XCTest","body":"反向亦然：`#expect` 等 Swift Testing API 可在 XCTestCase 中使用。這些互通問題預設以警告回報，可在 Xcode build setting 升級為失敗。詳見「Migrate to Swift Testing」。"},{"t":569,"title":"Subprocess 1.0","body":"introduces **Subprocess 1.0**：簡化的 execution 型別、改善的錯誤處理、便利的輸出串流 API，以及更完整的跨平台支援（平台專屬的 process file descriptor 與終止狀態）。"},{"t":601,"title":"Subprocess Output Stream","body":"示範以 AsyncBufferSequence 取得 stdout/stderr，並用新的 `strings()` 方法逐行讀取輸出；該 API 尊重 grapheme cluster 邊界，不會切斷多位元組字元。"},{"t":614,"title":"Foundation","body":"概覽 Foundation 改善，重點是新的 ProgressManager，以及持續以 Swift 重寫的進度。"},{"t":637,"title":"Progress Manager - Concurrency","body":"introduces **`ProgressManager`**：為 async/await 設計的進度回報型別，清楚分離進度組合與進度回報，並以結構化、型別安全的方式附加 metadata（如 deltaV）。"},{"t":719,"title":"Beyond Apple Platforms","body":"說明 Swift 廣泛用於每一層軟體堆疊（OS、app、服務、kernel、firmware）。Swift 6.4 擴充語言互通、改善跨平台 IDE 支援，並讓帶 Swift 到 web 與 embedded 更安全。"},{"t":755,"title":"Swift–C Interoperability (@C attribute)","body":"introduces **`@C`** 屬性：類似 `@objc`，但把 Swift 函式暴露給 C，限於 C 相容型別。以 rocket launch window 範例示範用 `@C` 與 `@implementation` 實作既有 C header 的函式，並用 span 取代 array+count 取得安全互通。"},{"t":909,"title":"Swift-Java","body":"**Swift-Java** 現支援從 Java 呼叫 async 與 throwing 的 Swift 函式、捕捉更多泛型特性，讓在 Android 上呼叫 Swift 更自然；swift.org 也提供官方 Android Swift SDK。"},{"t":963,"title":"Editor support","body":"VSCode 的 Swift 擴充整合 **Swiftly** 方便安裝 toolchain，並上架 **OpenVSX**，讓 VSCodium、Cursor、Kiro、Antigravity 等編輯器都能用；新版還有引導式 checklist。"},{"t":1004,"title":"WebAssembly (Wasm) & JavascriptKit","body":"開源 toolchain 可編譯到 **WebAssembly**，讓同一語言寫原生 app、後端與前端。JavaScriptKit 的安全橋接更快更安全；Goodnotes 把既有 Swift 程式以 Wasm 編譯上 web，benchmark 顯示安全橋接比動態橋接快 35–40 倍。"},{"t":1088,"title":"Embedded Swift","body":"**Embedded Swift** 新增 existential 型別與 untyped throws；並把必要的 type layout metadata 存入 DWARF debug info 而非 binary，兼顧 binary 大小與 coredump 除錯體驗。`@diagnose` 可控制 EmbeddedRestrictions 警告。"},{"t":1199,"title":"Performance Tuning","body":"Becca 回來談效能調校。Swift 預設就有好效能，但在大量運算或受限環境下，有時值得複雜化程式碼換取效能。聚焦兩塊：明確控制 optimizer 決策，以及擴充 ownership 系統避免不必要複製。"},{"t":1256,"title":"Directly control inlining (source code)","body":"以 histogram 與 makeInts 範例作為起點，說明 inlining 是把函式呼叫換成其實作再針對呼叫點最佳化的重要最佳化。"},{"t":1261,"title":"Directly control inlining (inlined, but not optimized)","body":"示範 inlining 後但尚未最佳化的中間狀態：makeInts 的內容被內聯進 histogram，但 if/else 仍保留。"},{"t":1267,"title":"Directly control inlining (inlined and optimized)","body":"示範 inlining 並最佳化後：常數傳遞使 `InlineArray(repeating: 0)` 被選定，整段化簡為一行，展示 inlining 成功時程式做更少工作得到相同結果。"},{"t":1289,"title":"Optimizer Control: @inline(always) & @specialized","body":"概覽兩個 optimizer 控制屬性。除既有 `@inline(never)` 外，Swift 6.4 新增 **`@inline(always)`** 強制內聯；對可能被覆寫的 class 方法，建議搭配 `final`。"},{"t":1290,"title":"Directly control inlining (preventing inlining)","body":"示範 `@inline(never)`：完全禁止內聯 makeInts，適用於你確定內聯永遠不划算時。"},{"t":1299,"title":"Directly control inlining (forcing inlining)","body":"示範 `@inline(always)`：即使 optimizer 不確定划算也強制內聯 makeInts。"},{"t":1315,"title":"Making generic functions faster with '@specialized'​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​","body":"說明 specialization：為特定具體型別複製泛型函式以消除泛型開銷並開啟後續最佳化，但 optimizer 有時（尤其在函式庫）看不到使用方式。"},{"t":1337,"title":"Making generic functions faster with '@specialized'​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​ (explicitly requesting specialization)","body":"introduces **`@specialized`**：用 where 子句明確要求對某些具體型別產生特化版本，讓常與一兩種型別搭配使用的慢速泛型程式碼得到優先特化。"},{"t":1469,"title":"Ownership System & Noncopyable Types","body":"回顧 ownership 系統的核心：許多效能問題源於不必要的資料複製。若儲存會持續存在、且雙方遵守 exclusivity 規則，就可只授予存取而非複製。介紹 borrow（雙方僅可讀）與 mutate（獨占存取）兩種安全共享儲存的方式，皆可在編譯期驗證。"},{"t":1546,"title":"Associated types can be '~Copyable' and '~Escapable'","body":"Equatable/Comparable/Hashable 現可用於 noncopyable 型別（Equatable/Comparable 也可用於 non-escapable）；associated type 也可宣告為 `~Copyable` 或 `~Escapable`，為高效能協定導向開發開啟新能力，如 Iterable 協定。"},{"t":1578,"title":"Iterable Protocol & Borrow/Mutate Accessors","body":"introduces Swift 6.4 的 **Iterable** 協定：for loop 改以 **borrow** 取出元素而非複製，因此可用於 noncopyable 元素、避免 reference counting，並可在迴圈中拋錯。但 exclusivity 檢查禁止迴圈中改動 Iterable；for loop 優先用 Sequence，否則 fall back 到 Iterable，並以批次 span 提取元素。"},{"t":1648,"title":"The problem with existing accessors","body":"以 UniqueBox 為例說明既有 get/set accessor 的效能問題：存取一個含 256 個 Int 的 InlineArray（2KB struct）時，改一個元素得整份複製進出。"},{"t":1699,"title":"'borrow' and 'mutate' accessors","body":"introduces **`borrow`／`mutate` accessor** 取代 get/set：borrow 給予不複製的唯讀共享存取，mutate 給予就地修改的獨占存取，讓 UniqueBox 直接改動原陣列元素而不複製，並順帶支援 noncopyable 值。"},{"t":1737,"title":"New Standard Library Types: UniqueBox, UniqueArray, Ref","body":"introduces 多個新標準庫型別：**UniqueBox**（真實型別）、不可複製的 **UniqueArray**、以 OutputSpan 的安全 withTemporaryAllocation、只能 resume 一次的 Continuation，以及像單值版 Span 的 **Ref/MutableRef**，可存於變數、傳遞與用於泛型。"},{"t":1814,"title":"Using 'MutableRef' to eliminate repeated accesses (with un-hoisted access)","body":"以 updateCount 為例：每次遞增都重複查找同一個 dictionary key，是可以 hoist 出迴圈的重複工作。"},{"t":1834,"title":"Using 'MutableRef' to eliminate repeated accesses (hoisted by 'inout' parameter)","body":"示範過去唯一能 hoist 查找的方式：把迴圈搬進函式並以 inout 參數傳入查找結果——一個相當冷門的技巧。"},{"t":1841,"title":"Using 'MutableRef' to eliminate repeated accesses (hoisted by 'MutableRef')","body":"示範用 **`MutableRef`** 的更好做法：在迴圈前先從 dictionary 查找建立一個 MutableRef，迴圈內直接用它修改。Ref 為 non-escapable，Swift 知道存取在變數離開作用域時結束。"},{"t":1871,"title":"The Future of Swift","body":"Evan 收尾談 Swift 的未來：Swift Build 成為 SwiftPM 預設後端、新增 build/packaging、networking、Windows 等工作組、首個 Android Swift SDK，並邀請大家到 forums.swift.org 參與貢獻。"}],"summary_en":["Swift's Becca and Evan recap progress across **Swift 6.3 and 6.4** in four parts: everyday language improvements, key library updates, cross-platform and interop, and performance tuning. The everyday wins are mostly small annoyances going away: no more parentheses for `some`/`any` with optionals, a warning when you silently ignore a Task's thrown error, async calls allowed in `defer`, `weak let` instead of `@unchecked Sendable`, an explicit `~Sendable` syntax, and a second memberwise initializer for structs mixing internal and private properties.","Notable new syntax: **`anyAppleOS`** condenses many platform names into one availability and `#if os` condition; the **`@diagnose`** attribute changes a specific warning group to ignored, warning, or error within a single declaration (e.g. temporarily silencing deprecation, enabling strict memory safety, or promoting future errors early); and the **module selector `::`** treats the left-hand name as a module to resolve clashes when two modules share a type or member name (like SwiftUI and a database package both having `View`).","On libraries: the standard library adds a **task cancellation shield**, `mapKeyedValues` (key and value in the closure), and a new **`FilePath`** type; **Swift Testing** gains issue severity (`.warning`), `Test.cancel` for dynamic skipping, and two-way XCTest interop; **Subprocess 1.0** brings a cleaner API and streaming output via AsyncBufferSequence; and **Foundation** ships **ProgressManager** for async/await and keeps rewriting Data, NSURL/CFURL, and more in Swift. Cross-platform work includes the **`@C`** attribute to expose Swift functions to C, Swift-Java support for async/throwing, an official Android SDK, VSCode/OpenVSX editor support, WebAssembly and JavaScriptKit (Goodnotes saw safe bridging 35–40x faster), and Embedded Swift gaining existentials and untyped throws.","Performance tuning targets two areas: directly controlling optimizer decisions — the new **`@inline(always)`** (pair with `final`) and the **`@specialized`** where-clause to force specialization — and a major expansion of the **ownership system**: `~Copyable`/`~Escapable` associated types, a new **Iterable** protocol so for-loops borrow rather than copy, **`borrow`/`mutate` accessors** replacing get/set to avoid copying large values, and new standard-library types **UniqueBox, UniqueArray, Ref/MutableRef**. Evan closes with Swift Build as SwiftPM's default backend, new workgroups, and how to contribute at forums.swift.org."],"deepdive_en":[{"t":7,"title":"Introduction","body":"Becca and Evan open, previewing four themes across **Swift 6.3 and 6.4**: language improvements, library updates, cross-platform support, and performance tuning, with the two presenters trading off."},{"t":44,"title":"Everyday Language Improvements","body":"Begins the run of everyday small wins, aimed at expressing exactly what you mean without extra noise — starting with barely-noticeable annoyances going away, like no longer needing parentheses for `some`/`any` with optionals."},{"t":72,"title":"Better Swift Concurrency diagnostics (catching in the task)","body":"Silently ignoring an error thrown from a Swift Concurrency task now produces a warning, nudging you to handle it inside the task's do/catch."},{"t":81,"title":"Better Swift Concurrency diagnostics (saving the task for later)","body":"The other fix is to save the task and check its error later; also, the old restriction on calling async functions from a `defer` block is removed."},{"t":87,"title":"Better 'Sendable' conformances","body":"A class that needed `@unchecked Sendable` due to a `weak var` can change it to **`weak let`** to pass Sendable checking; if a type shouldn't be Sendable, the new **`~Sendable`** syntax states it explicitly without blocking subclasses from being Sendable."},{"t":108,"title":"More accessible memberwise initializers","body":"A struct mixing internal and private properties now gets a second memberwise initializer usable from other files in the project."},{"t":115,"title":"anyAppleOS Availability","body":"Introduces **`anyAppleOS`**: with OS version numbers aligned, you can condense many platform names into a single availability annotation, cutting long platform lists."},{"t":123,"title":"'anyAppleOS' availability (before)","body":"Shows the before: each function spells out macOS/iOS/watchOS/tvOS/visionOS versions and uses `#if os(...)`, which is verbose."},{"t":137,"title":"'anyAppleOS' availability (after)","body":"Shows the after: `@available(anyAppleOS 27, *)` covers all platforms at once, with more specific attributes for carve-outs (like tvOS unavailable); `#if os(anyAppleOS)` works too."},{"t":160,"title":"Controlling warnings with '@diagnose'","body":"Introduces the **`@diagnose`** attribute, which changes the behavior of specific warning groups within a single declaration without affecting the whole project."},{"t":182,"title":"@diagnose Attribute","body":"Demonstrates three uses: setting DeprecatedDeclaration to ignored to silence it, StrictMemorySafety to warning to audit unsafe APIs, and ErrorInFutureSwiftVersion to error to catch future errors early."},{"t":227,"title":"Clarifying code with module selectors","body":"Frames the same-name problem: Rocket and GiftShopToys both define a `SaturnV` type, so importing both yields an ambiguity error."},{"t":232,"title":"Module Selectors (::)","body":"Introduces the **module selector `::`**: in `Rocket::SaturnV` the left side is always a module name and resolves correctly, unlike `Rocket.SaturnV` which misfires when a module and type share a name."},{"t":300,"title":"Clarifying code with module selectors (module selectors work on members, too)","body":"Module selectors also work on method/property names, e.g. `launchPadTechnician.HumanResources::fire()`, to disambiguate identically-named members from different modules. Recommended defensively (macro expansions) but not for intentionally clashing API design."},{"t":359,"title":"Library Updates","body":"Evan takes over, noting the library updates share the goal of expressing intent. Covers the standard library, Swift Testing, Subprocess, and Foundation."},{"t":376,"title":"Standard Library","body":"Overviews three new standard-library tools: task cancellation, dictionary transformations, and filepath manipulation."},{"t":386,"title":"Task cancellation","body":"Explains that sometimes you want to finish work even after cancellation (e.g. finishing a disk write to avoid corruption), motivating the cancellation shield."},{"t":400,"title":"Task cancellation shield","body":"Introduces **`withTaskCancellationShield`**: inside the shield, cancellation checks always return false. Keep the region short, focused on finishing or rolling back already-started work."},{"t":413,"title":"Constructing a new dictionary","body":"Explains the pain that `mapValues` only passes the old value, so computing a new value from the key forced you to rebuild the dictionary by hand."},{"t":426,"title":"Dictionary.mapKeyedValues","body":"Introduces **`mapKeyedValues`**, which passes both the key and old value into the closure to compute the new value, avoiding a manual rebuild."},{"t":434,"title":"The new FilePath type","body":"Introduces the standard library's new **`FilePath`** type (based on Swift System), handling subtle cross-platform filepath differences, e.g. safely appending path segments via `components`."},{"t":451,"title":"Swift Testing Updates","body":"Overviews Swift 6.4 Testing updates for more control over test behavior: surfacing non-fatal issues and dynamically skipping test cases."},{"t":461,"title":"Issue Severity","body":"`Issue.record` can take a severity; setting `.warning` surfaces issues worth investigating without blocking CI."},{"t":472,"title":"Test Cancellation","body":"Introduces **`Test.cancel`** to dynamically cancel tests — especially powerful in parameterized tests to skip individual arguments rather than fail or run to completion. `swift test` also adds repeat-until-pass/fail."},{"t":514,"title":"XCTest interoperability: Using XCTest from Swift Testing","body":"From Swift 6.4, XCTest assertion failures called from Swift Testing are reported as test issues, so migrating doesn't silently lose coverage."},{"t":528,"title":"XCTest interoperability: Using Swift Testing from XCTest","body":"The reverse works too: `#expect` and other Swift Testing APIs work from an XCTestCase. These interop issues are warnings by default, promotable to failures in Xcode build settings. See 'Migrate to Swift Testing'."},{"t":569,"title":"Subprocess 1.0","body":"Introduces **Subprocess 1.0**: a simplified execution type, improved error handling, convenient output-streaming APIs, and greatly improved cross-platform support (platform-specific process file descriptors and termination statuses)."},{"t":601,"title":"Subprocess Output Stream","body":"Shows stdout/stderr as AsyncBufferSequences and the new `strings()` method to read output line-by-line, respecting grapheme cluster boundaries so multi-byte characters aren't split."},{"t":614,"title":"Foundation","body":"Overviews Foundation improvements, centered on the new ProgressManager and the ongoing rewrite in Swift."},{"t":637,"title":"Progress Manager - Concurrency","body":"Introduces **`ProgressManager`**: a progress-reporting type built for async/await that cleanly separates progress composition from reporting and attaches metadata (like deltaV) in a structured, type-safe way."},{"t":719,"title":"Beyond Apple Platforms","body":"Notes Swift runs at every layer of the stack (OS, apps, services, kernel, firmware). Swift 6.4 extends interop, improves cross-platform IDE support, and makes bringing Swift to web and embedded safer."},{"t":755,"title":"Swift–C Interoperability (@C attribute)","body":"Introduces the **`@C`** attribute: like `@objc` but exposing Swift functions to C, limited to C-compatible types. The rocket launch-window example uses `@C` with `@implementation` to implement existing C-header functions and passes a span instead of array+count for safe interop."},{"t":909,"title":"Swift-Java","body":"**Swift-Java** now supports calling async and throwing Swift functions from Java and captures more generics features, making Swift feel natural from Android; swift.org also offers an official Android Swift SDK."},{"t":963,"title":"Editor support","body":"The VSCode Swift extension integrates **Swiftly** for easy toolchain installs and is now on **OpenVSX**, reaching VSCodium, Cursor, Kiro, and Antigravity; a guided checklist eases getting started."},{"t":1004,"title":"WebAssembly (Wasm) & JavascriptKit","body":"The open-source toolchain compiles to **WebAssembly**, letting one language write native apps, backends, and frontends. JavaScriptKit's safe bridging is faster and safer; Goodnotes compiled existing Swift to the web via Wasm and benchmarked safe bridging 35–40x faster than dynamic bridging."},{"t":1088,"title":"Embedded Swift","body":"**Embedded Swift** adds existential types and untyped throws, and stores type-layout metadata in DWARF debug info rather than the binary, balancing binary size with coredump debugging. `@diagnose` controls EmbeddedRestrictions warnings."},{"t":1199,"title":"Performance Tuning","body":"Becca returns on performance tuning. Swift performs well by default, but heavy computation or constrained environments sometimes make complicating code worthwhile. Two areas: explicitly controlling optimizer decisions, and extending ownership to avoid copies."},{"t":1256,"title":"Directly control inlining (source code)","body":"Uses histogram and makeInts as the starting point to explain inlining: replacing a call with its implementation, then optimizing it for the call site."},{"t":1261,"title":"Directly control inlining (inlined, but not optimized)","body":"Shows the intermediate state after inlining but before optimization: makeInts's body is inlined into histogram, but the if/else remains."},{"t":1267,"title":"Directly control inlining (inlined and optimized)","body":"Shows after inlining and optimization: constant propagation selects `InlineArray(repeating: 0)`, collapsing the block to one line — illustrating less work for the same result when inlining pays off."},{"t":1289,"title":"Optimizer Control: @inline(always) & @specialized","body":"Overviews two optimizer-control attributes. Alongside existing `@inline(never)`, Swift 6.4 adds **`@inline(always)`** to force inlining; for potentially-overridable class methods, pair it with `final`."},{"t":1290,"title":"Directly control inlining (preventing inlining)","body":"Shows `@inline(never)`: completely forbids inlining makeInts, useful when you know inlining will never be a win."},{"t":1299,"title":"Directly control inlining (forcing inlining)","body":"Shows `@inline(always)`: forces inlining of makeInts even when the optimizer isn't sure it'll help."},{"t":1315,"title":"Making generic functions faster with '@specialized'​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​","body":"Explains specialization: cloning a generic function for a concrete type to eliminate generic overhead and enable further optimization, though the optimizer (especially in libraries) sometimes can't see how it's used."},{"t":1337,"title":"Making generic functions faster with '@specialized'​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​ (explicitly requesting specialization)","body":"Introduces **`@specialized`**: a where clause explicitly requests a specialized version for given concrete types, so slow generic code used heavily with one or two types gets prioritized."},{"t":1469,"title":"Ownership System & Noncopyable Types","body":"Reviews ownership: many performance problems are unnecessary copies. If storage stays allocated and both sides follow exclusivity rules, you can grant access instead of copying. Introduces borrow (both read-only) and mutate (exclusive) as safe ways to share storage, verifiable at compile time."},{"t":1546,"title":"Associated types can be '~Copyable' and '~Escapable'","body":"Equatable/Comparable/Hashable now work on noncopyable types (Equatable/Comparable also on non-escapable); associated types can be `~Copyable` or `~Escapable`, enabling high-performance protocol-driven development like the Iterable protocol."},{"t":1578,"title":"Iterable Protocol & Borrow/Mutate Accessors","body":"Introduces Swift 6.4's **Iterable** protocol: for-loops **borrow** elements instead of copying, so they work with noncopyable elements, avoid reference counting, and can throw mid-loop. Exclusivity forbids mutating the Iterable while looping; for-loops prefer Sequence and fall back to Iterable, retrieving elements in batched spans."},{"t":1648,"title":"The problem with existing accessors","body":"Uses UniqueBox to show the get/set performance problem: accessing an InlineArray of 256 Ints (a 2KB struct) requires copying the whole thing out and back to change one element."},{"t":1699,"title":"'borrow' and 'mutate' accessors","body":"Introduces **`borrow`/`mutate` accessors** replacing get/set: borrow gives non-copying read-only shared access, mutate gives in-place exclusive access, letting UniqueBox mutate the original array element without copying — and handle noncopyable values too."},{"t":1737,"title":"New Standard Library Types: UniqueBox, UniqueArray, Ref","body":"Introduces new standard-library types: the real **UniqueBox**, the noncopyable **UniqueArray**, a safe withTemporaryAllocation using OutputSpan, a Continuation that's resume-once at compile time, and **Ref/MutableRef** — like a single-value Span that can be stored, passed, and used generically."},{"t":1814,"title":"Using 'MutableRef' to eliminate repeated accesses (with un-hoisted access)","body":"Uses updateCount to show repeated lookups of the same dictionary key on every increment — work that could be hoisted out of the loop."},{"t":1834,"title":"Using 'MutableRef' to eliminate repeated accesses (hoisted by 'inout' parameter)","body":"Shows the previously-only way to hoist the lookup: moving the loop into a function and passing the lookup as an inout parameter — a fairly obscure trick."},{"t":1841,"title":"Using 'MutableRef' to eliminate repeated accesses (hoisted by 'MutableRef')","body":"Shows the better approach with **`MutableRef`**: make one MutableRef from the lookup before the loop, then mutate through it inside. Refs are non-escapable, so Swift knows the access ends when the variable leaves scope."},{"t":1871,"title":"The Future of Swift","body":"Evan closes on Swift's future: Swift Build as SwiftPM's default backend, new build/packaging, networking, and Windows workgroups, the first Android Swift SDK, and an invitation to contribute at forums.swift.org."}],"code":[]},"related":[{"id":"201","title":"Secure your apps with App Attest","gloss":"運用 App Attest 保護你的 App","gloss_en":"Protect your app with App Attest","category":"swift","categoryLabel":"Swift"},{"id":"213","title":"Translate your app using agents in Xcode","gloss":"在 Xcode 中運用 agent 翻譯你的 App","gloss_en":"Translate your app using agents in Xcode","category":"swift","categoryLabel":"Swift"},{"id":"258","title":"What’s new in Xcode 27","gloss":"Xcode 27 的新功能","gloss_en":"What's new in Xcode 27","category":"swift","categoryLabel":"Swift"},{"id":"265","title":"Build real-time apps and services with gRPC and Swift","gloss":"用 gRPC 與 Swift 打造即時 App 與服務","gloss_en":"Build real-time apps and services with gRPC and Swift","category":"swift","categoryLabel":"Swift"},{"id":"268","title":"Profile, fix, and verify: Improve app responsiveness with Instruments","gloss":"用 Instruments 剖析、修正並驗證 App 反應速度","gloss_en":"Profile, fix, and verify: Improve app responsiveness with Instruments","category":"swift","categoryLabel":"Swift"}]}</script>
