<script id="d" type="application/json">{"s":{"id":"233","title":"Explore distributed inference and training with MLX","gloss":"用 MLX 探索分散式推論與訓練","category":"ai","categoryLabel":"AI 與機器學習","duration":1326,"url":"https://developer.apple.com/videos/play/wwdc2026/233/","takeaway":"用 MLX 把推論與微調工作分散到多台 Mac，可執行單機放不下的大型模型。","chapters":[[0,"Introduction"],[129,"Distributed communication"],[272,"Setting up your cluster"],[511,"Hostfile format for a 4-node MLX cluster"],[536,"Generate the cluster hostfile with mlx.distributed_config"],[633,"Distributed inference and fine-tuning"],[664,"Run distributed LLM inference with mlx_lm.chat"],[815,"Model parallelism strategies"],[903,"Run distributed inference with pipeline parallelism"],[953,"Distributed fine-tuning"],[1038,"Run distributed fine-tuning with mlx_lm.lora"],[1114,"CLI, Python, Swift, and C++ APIs"],[1141,"Distributed inference with the MLX LM Python API"],[1171,"Shard a layer with the MLX Python API"],[1187,"All-reduce across devices in Python, Swift, and C++"],[1206,"Standalone distributed sum with the JACCL C++ API"],[1245,"Next steps"]],"points":[{"text":"用 **mlx.distributed_config** 產生叢集 hostfile，並透過 **jaccl** 後端與 **RDMA** 達成高效節點互連。","hot":false},{"text":"以 **mlx.launch** 搭配 **mlx_lm.chat** 在多台 Mac 上跑分散式 LLM 推論，執行單機放不下的大模型。","hot":true},{"text":"支援兩種模型平行策略：預設的**張量平行（tensor parallelism）**與加上 `--pipeline` 的**管線平行（pipeline parallelism）**。","hot":false},{"text":"用 **mlx_lm.lora** 做分散式微調，並依裝置數放大 `--batch-size`。","hot":false},{"text":"提供 **CLI、Python、Swift 與 C++** 多語言 API，包含 **all_sum** 等集合通訊與 **sharded_load** 分片載入。","hot":false}],"apis":["MLX","mlx.distributed_config","mlx.launch","mlx_lm.chat","mlx_lm.lora","mx.distributed.init","mx.distributed.all_sum","sharded_load","shard_linear","JACCL","DistributedGroup"],"audience":"想在**多台 Mac 上擴展大型模型推論與微調**、熟悉 MLX 的機器學習工程師。","gloss_en":"Explore distributed inference and training with MLX","takeaway_en":"Use MLX to distribute inference and fine-tuning across multiple Macs, running large models that won't fit on a single machine.","points_en":[{"text":"Use **mlx.distributed_config** to generate a cluster hostfile, and achieve efficient node interconnect through the **jaccl** backend and **RDMA**.","hot":false},{"text":"Use **mlx.launch** with **mlx_lm.chat** to run distributed LLM inference across multiple Macs, running large models that won't fit on a single machine.","hot":true},{"text":"Supports two model-parallel strategies: the default **tensor parallelism** and **pipeline parallelism** with `--pipeline`.","hot":false},{"text":"Use **mlx_lm.lora** for distributed fine-tuning, scaling up `--batch-size` according to the number of devices.","hot":false},{"text":"Provides multi-language APIs across **CLI, Python, Swift, and C++**, including collective communication like **all_sum** and sharded loading via **sharded_load**.","hot":false}],"audience_en":"Machine learning engineers familiar with MLX who want to **scale large-model inference and fine-tuning across multiple Macs**.","summary":["本場由 MLX 團隊深入講解如何用桌上的多台 Mac 組成 cluster，跨機器做**分散式推論與微調**。問題背景是：本機 LLM 越來越大、能力越強，但單機的記憶體、運算或頻寬終會成為瓶頸。講者先鋪陳完整的軟硬體 stack：機器間需要實體 interconnect 與傳輸協定，macOS 26.2 起支援 **Thunderbolt 5 上的 RDMA**（直接記憶體互傳、繞過大部分 CPU/OS 開銷）；其上是 Apple 開源的集合通訊函式庫 **JACCL**（提供 send 與 all-reduce 等通訊原語，且不限於 ML）；最頂是 **MLX** 與 **MLX LM**，負責跨 cluster 協調分散式工作。","接著以四台 M3 Ultra 實際組 cluster。**拓樸**會直接影響通訊時間：通訊時間由固定的 latency 與隨資料量成長的 transfer time 組成；JACCL 支援 **mesh**（每台直連每台，latency 最低）與 **ring**（只連兩個鄰居，省線省埠、可多線增頻寬但 latency 較高），並會依訊息大小與操作**自動選擇**最佳拓樸，因此建議全部連成 mesh。組好後在系統設定開啟 RDMA 並重開機；以 **`mlx.launch`** 搭配 JSON hostfile 透過 SSH 啟動各節點，hostfile 可用 **`mlx.distributed_config`** 自動產生（含 `--auto-setup` 自動設定 Thunderbolt 網路、`--backend jaccl`／`jaccl-ring` 決定 mesh 或 ring）。","最後是重頭戲：分散式推論與微調。把單機的 `mlx_lm.chat` 用 `mlx.launch --hostfile` 包起來即可跨 cluster 跑，模型自動分片——27B 的 Qwen 在四台上比單台快近三倍。模型太大時（如 1 兆參數的 Kimi）可用兩種策略分片：**pipeline parallelism**（按深度切，通訊單純但不加速）與 **tensor parallelism**（按寬度切，每層每 token 都通訊、可加速，故需 mesh 低延遲，且為預設）。微調走 **data-parallel**：每台複製模型、各吃不同 batch、再平均梯度，用 `mlx_lm.lora` 並把 `--batch-size` 乘上裝置數即可，實測四台快三倍以上。除了 CLI，分散式通訊也透過 **Python、Swift、C++ API** 開放（含直接呼叫 JACCL 的 all-sum），方便嵌入自己的 app。"],"deepdive":[{"t":0,"title":"Introduction","body":"MLX 團隊研究員 Tatiana 開場：本機 LLM 持續變大變強，最終會撞到單機的記憶體、運算或頻寬上限。本場承接「Run local agentic AI on the Mac using MLX」，深入講如何用桌上的多台 Mac 跨機器擴展——跑更大的模型或加速推論與訓練。路線是先 CLI、再 Python API、最後 Swift 嵌入 app。"},{"t":129,"title":"Distributed communication","body":"鋪陳通訊 stack：機器間需要實體 **interconnect** 與傳輸協定。macOS 26.2 起支援 **Thunderbolt 5 上的 RDMA**，直接把資料從一台的記憶體搬到另一台、繞過多數 CPU/OS 開銷，提供高頻寬低延遲。其上是 Apple 開源的集合通訊函式庫 **JACCL**，提供跨機器送資料與彙整結果的通訊原語（不限 ML）；最頂是用 JACCL 做分散式推論與訓練的 **MLX**。"},{"t":272,"title":"Setting up your cluster","body":"以四台 M3 Ultra 組 cluster：用 Thunderbolt 5 線連接，而連法（拓樸）直接影響通訊時間。概述接下來的步驟——先談決定通訊時間的因素，再看 JACCL 支援哪些拓樸與取捨，接著在機器上啟用 RDMA，最後用 MLX 啟動分散式工作。"},{"t":511,"title":"Hostfile format for a 4-node MLX cluster","body":"解析描述 cluster 的 JSON hostfile：每個節點一筆，`ssh` 是 `mlx.launch` 連線用的 hostname、`ips` 是 JACCL 初始協調用的本地網路 IP、`rdma` 是各 Thunderbolt peer 連線的 RDMA 裝置名稱清單。可手寫，但更建議用工具自動產生。"},{"t":536,"title":"Generate the cluster hostfile with mlx.distributed_config","body":"用 **`mlx.distributed_config`** 自動產生 hostfile：傳入 hostname 清單與輸出路徑，可用 `--env` 內嵌環境變數（例如 `MLX_METAL_FAST_SYNCH=1` 加速 GPU↔CPU 同步，對分散式很關鍵）。`--auto-setup` 會自動關閉 Thunderbolt Bridge、把各連線設定為 RDMA；`--backend` 設 `jaccl` 為 mesh、`jaccl-ring` 為 ring。執行時會先檢查 SSH 可達、探測各埠連線拓樸，最後寫出 hostfile。"},{"t":633,"title":"Distributed inference and fine-tuning","body":"進入重頭戲——分散式語言模型推論與微調，最簡單的入口是 CLI 與 **MLX LM**（建在 MLX 之上的開源套件，提供 CLI 與 Python API 在 Apple silicon 本機跑模型）。"},{"t":664,"title":"Run distributed LLM inference with mlx_lm.chat","body":"單機用 `mlx_lm.chat` 指定模型與 max-tokens；要跨 cluster，只要用 **`mlx.launch --hostfile`** 包住、在 `--` 後接同樣的 `mlx_lm.chat`（但指向各節點上的遠端路徑），MLX LM 自動分片並協調。實測 27B 的 Qwen 在四台 M3 Ultra 上生成速度約為單台的三倍。注意每台都要裝好 MLX 等函式庫且可存取執行檔。"},{"t":815,"title":"Model parallelism strategies","body":"處理模型太大（如 1 兆參數的 Kimi、8-bit 仍需約 1TB 記憶體）的兩種分片：**pipeline parallelism** 按深度切，每台持有一組層、資料循序通過，通訊單純（只在層組邊界交換 activation）但不加速；**tensor parallelism** 按寬度切，每台持有每層的一部分、同時處理同一 token，可加速但每層每 token 都要通訊，故低延遲很重要、必須用 mesh。"},{"t":903,"title":"Run distributed inference with pipeline parallelism","body":"tensor parallelism 是 MLX LM 預設策略；要改用 pipeline parallelism 只需在指令後加 `--pipeline`（並非所有模型都支援）。示範用 `mlx.launch` 在 cluster 上跑 1 兆參數的 Kimi（未加 `--pipeline`，即用 tensor parallelism）：mlx.launch 連上每台、MLX LM 載入並分片模型，一行指令就讓巨型模型在本機多台 Mac 上回答問題。"},{"t":953,"title":"Distributed fine-tuning","body":"說明微調原理：單機把訓練資料切成 batch，每個 batch 算梯度並更新權重，重複多輪直到品質達標。要用多台加速，採 **data-parallel**——每台複製模型、各吃不同 batch、各自算梯度，再平均梯度讓更新涵蓋所有 batch，因此 N 台理論上可快 N 倍。"},{"t":1038,"title":"Run distributed fine-tuning with mlx_lm.lora","body":"與單機唯一差別是用 `mlx.launch` 啟動、指向各節點上的 `mlx_lm.lora`，資料分片由 MLX LM 處理，指令幾乎相同——把 `--batch-size` 乘上裝置數，讓每台每步仍處理相同樣本數。實測微調 9B 的 Qwen：單台約 180 tokens/秒、四台約 600 tokens/秒，超過三倍加速，等於把桌上裝置變成本機訓練 cluster。"},{"t":1114,"title":"CLI, Python, Swift, and C++ APIs","body":"前面以 CLT 為主，但 MLX 也透過彈性的 **Python、Swift、C++ API** 對分片與分散式操作提供細緻控制，可在 Python／C++ 實驗或用 Swift 嵌入 app。"},{"t":1141,"title":"Distributed inference with the MLX LM Python API","body":"用 Python API 做分散式推論：先以 `mx.distributed.init(backend=\"jaccl\")` 初始化通訊群組，再定義平行策略（如 tensor parallelism），用 `sharded_load` 分片載入模型，之後就像單機一樣使用——MLX LM 在底層處理所有分散式通訊。"},{"t":1171,"title":"Shard a layer with the MLX Python API","body":"要更細緻控制可用 MLX 本身的低階原語：示範定義一個簡單 `nn.Linear` 後，以 `shard_linear`（strategy=\"all-to-sharded\"）按欄分片，餵入資料即得分片運算結果。"},{"t":1187,"title":"All-reduce across devices in Python, Swift, and C++","body":"示範跨裝置的基礎集合操作 all-reduce：在 Python／Swift／C++ 中先用 JACCL 初始化 distributed group，再用對應 MLX 原語（如 `mx.distributed.all_sum`）對 tensor 做跨機器的集合求和。"},{"t":1206,"title":"Standalone distributed sum with the JACCL C++ API","body":"強調 **JACCL 可獨立使用**、不需 MLX，適用任何需要分散式通訊的應用（含非 ML）。示範純 C++ API：初始化 JACCL group 後，直接用 JACCL（而非 MLX）對 tensor 做跨機器集合求和。"},{"t":1245,"title":"Next steps","body":"總結：本場走過讓 Apple silicon 分散式訓練與推論成真的完整 stack，從 Thunderbolt 上的 RDMA 一路到 MLX 與 MLX LM，並展示如何用最少的單機程式改動就從單台擴到多台，換來更快推論、能跑兆級參數模型與更快微調，且涵蓋 CLI、Python、Swift、C++。延伸推薦「Run local agentic AI on the Mac using MLX」與相關文件。"}],"summary_en":["The MLX team takes a deep dive into turning the Macs on your desk into a cluster for **distributed inference and fine-tuning**. The motivation: local LLMs keep getting larger and more capable, but a single machine's memory, compute, or bandwidth eventually becomes the limit. The talk first lays out the full stack: machines need a physical interconnect and a transport protocol, and macOS 26.2 adds **RDMA over Thunderbolt 5** (moving data directly between machines' memory, bypassing most CPU/OS overhead); on top sits **JACCL**, Apple's open-source collective communication library (send and all-reduce primitives, not limited to ML); and at the top, **MLX** and **MLX LM** orchestrate distributed work across the cluster.","It then builds a real cluster from four M3 Ultras. **Topology** directly affects communication time, which is made of fixed latency plus transfer time that grows with data size. JACCL supports a **mesh** (every machine directly connected to every other, lowest latency) and a **ring** (each node connects only to its two neighbors—fewer cables/ports, extra bandwidth via multiple cables, but higher latency), and it **automatically picks** the best topology per message size and operation, so connecting everything as a mesh is recommended. After enabling RDMA in Settings and rebooting, you launch nodes over SSH with **`mlx.launch`** plus a JSON hostfile, which **`mlx.distributed_config`** can generate for you (with `--auto-setup` to configure the Thunderbolt network and `--backend jaccl`/`jaccl-ring` to choose mesh or ring).","The payoff is distributed inference and fine-tuning. Wrapping single-device `mlx_lm.chat` in `mlx.launch --hostfile` runs it across the cluster with automatic sharding—a 27B Qwen runs nearly 3x faster on four machines than on one. For models too large for one machine (like the 1-trillion-parameter Kimi), two strategies shard it: **pipeline parallelism** (split by depth—simple communication but no speedup) and **tensor parallelism** (split by width—communicates every layer per token, speeds up inference, needs mesh low latency, and is the default). Fine-tuning uses **data-parallel** training: each machine replicates the model, takes a different batch, and gradients are averaged—done with `mlx_lm.lora` and `--batch-size` scaled by device count, giving over 3x speedup on four machines. Beyond the CLI, distributed communication is also exposed via **Python, Swift, and C++ APIs** (including JACCL all-sum directly) for embedding in your own apps."],"deepdive_en":[{"t":0,"title":"Introduction","body":"MLX research scientist Tatiana opens: local LLMs keep getting bigger and smarter, eventually hitting a single machine's memory, compute, or bandwidth limits. Building on 'Run local agentic AI on the Mac using MLX', this session dives into scaling across multiple Macs on your desk—running larger models or accelerating inference and training. The path: CLI first, then the Python API, then Swift for embedding in apps."},{"t":129,"title":"Distributed communication","body":"Lays out the communication stack: machines need a physical **interconnect** and a transport protocol. macOS 26.2 adds **RDMA over Thunderbolt 5**, moving data directly from one machine's memory to another's and bypassing most CPU/OS overhead for high-bandwidth, low-latency transfer. Above it sits **JACCL**, Apple's open-source collective communication library with primitives for sending and combining data across the group (not ML-only); at the top is **MLX**, which uses JACCL for distributed inference and training."},{"t":272,"title":"Setting up your cluster","body":"Builds a cluster from four M3 Ultras connected with Thunderbolt 5 cables, where wiring (topology) directly affects communication time. Outlines the steps: what determines communication time, which topologies JACCL supports and their trade-offs, enabling RDMA, and launching distributed jobs with MLX."},{"t":511,"title":"Hostfile format for a 4-node MLX cluster","body":"Walks through the JSON hostfile describing the cluster: one entry per node, with `ssh` (the hostname mlx.launch uses), `ips` (the local-network IP JACCL uses for initial coordination), and `rdma` (a list of RDMA device names per Thunderbolt peer connection). You can write it by hand, but a helper can generate it."},{"t":536,"title":"Generate the cluster hostfile with mlx.distributed_config","body":"Uses **`mlx.distributed_config`** to auto-generate the hostfile: pass the host list and an output path, optionally embedding env vars with `--env` (e.g., `MLX_METAL_FAST_SYNCH=1` for faster GPU↔CPU sync, critical for distributed work). `--auto-setup` disables the Thunderbolt Bridge and configures each link for RDMA; `--backend jaccl` means mesh, `jaccl-ring` means ring. The run checks SSH reachability, probes ports to map topology, and writes the hostfile."},{"t":633,"title":"Distributed inference and fine-tuning","body":"Enters the main event—distributed LLM inference and fine-tuning—with the easiest entry point being the CLI and **MLX LM** (an open-source package on top of MLX providing CLI tools and a Python API to run models locally on Apple silicon)."},{"t":664,"title":"Run distributed LLM inference with mlx_lm.chat","body":"Single-device `mlx_lm.chat` takes a model and max-tokens; to go across the cluster, wrap it with **`mlx.launch --hostfile`** and after `--` pass the same `mlx_lm.chat` (pointing to the remote executable path on each node), with MLX LM sharding and coordinating automatically. A 27B Qwen generates roughly 3x faster on four M3 Ultras than on one. Note that all libraries like MLX must be installed and the executable accessible on every machine."},{"t":815,"title":"Model parallelism strategies","body":"Handles models too large for one machine (the 1-trillion-parameter Kimi needs ~1TB even at 8-bit) with two sharding approaches: **pipeline parallelism** splits by depth—each machine holds a group of layers and data flows sequentially, with simple communication (only at boundaries) but no speedup; **tensor parallelism** splits by width—each machine holds part of every layer and all process the same token at once, speeding up inference but communicating every layer per token, making low latency (mesh) crucial."},{"t":903,"title":"Run distributed inference with pipeline parallelism","body":"Tensor parallelism is MLX LM's default; switching to pipeline parallelism just appends `--pipeline` (not all models support it). The demo runs the 1-trillion-parameter Kimi on the cluster via `mlx.launch` without `--pipeline` (so tensor parallelism): mlx.launch connects to every machine, MLX LM loads and shards the model, and one command has a massive model answering questions across local Macs."},{"t":953,"title":"Distributed fine-tuning","body":"Explains fine-tuning: on a single machine you split data into batches, compute gradients and update weights per batch, repeating for passes until quality is reached. To speed up with multiple machines, use **data-parallel** training—replicate the model on each Mac, give each a different batch, compute gradients locally, then average them so the update uses all batches, giving up to N-times speedup with N machines."},{"t":1038,"title":"Run distributed fine-tuning with mlx_lm.lora","body":"The only difference from single-device is launching with `mlx.launch` pointing to `mlx_lm.lora` on each node; MLX LM handles data sharding and the command is nearly identical—scale `--batch-size` by device count so each machine still processes the same samples per step. Fine-tuning a 9B Qwen runs ~180 tokens/sec on one M3 Ultra vs ~600 on the cluster, over 3x faster, turning desk devices into a local training cluster."},{"t":1114,"title":"CLI, Python, Swift, and C++ APIs","body":"The examples so far used the CLI, but MLX also exposes fine-grained control over sharding and distributed operations via flexible **Python, Swift, and C++ APIs**—for experimenting in Python/C++ or embedding models in apps with Swift."},{"t":1141,"title":"Distributed inference with the MLX LM Python API","body":"For distributed inference in Python: initialize the communication group with `mx.distributed.init(backend=\"jaccl\")`, define the parallelism (e.g., tensor parallelism), shard-load the model with `sharded_load`, then use it exactly as on a single device—MLX LM handles all distributed communication under the hood."},{"t":1171,"title":"Shard a layer with the MLX Python API","body":"For finer control, use MLX's low-level primitives: after defining a simple `nn.Linear`, shard it column-wise with `shard_linear` (strategy=\"all-to-sharded\"), then feed data to get the sharded computation result."},{"t":1187,"title":"All-reduce across devices in Python, Swift, and C++","body":"Demonstrates the basic collective all-reduce: in Python/Swift/C++, initialize the distributed group via JACCL, then perform a collective sum across machines with the corresponding MLX primitive (e.g., `mx.distributed.all_sum`)."},{"t":1206,"title":"Standalone distributed sum with the JACCL C++ API","body":"Stresses that **JACCL works on its own**, without MLX, for any distributed workload (including non-ML). The pure C++ example initializes a JACCL group and performs a collective sum across machines via JACCL directly rather than MLX."},{"t":1245,"title":"Next steps","body":"Wrap-up: the session covered the full stack making distributed training and inference possible on Apple silicon, from RDMA over Thunderbolt up to MLX and MLX LM, and showed scaling from one device to many with minimal single-device code changes—yielding faster inference, trillion-parameter models, and faster fine-tuning across CLI, Python, Swift, and C++. It points to 'Run local agentic AI on the Mac using MLX' and the docs for advanced features."}],"code":[]},"related":[{"id":"232","title":"Run local agentic AI on the Mac using MLX","gloss":"用 MLX 在 Mac 上執行本機 agentic AI","gloss_en":"Run local agentic AI on the Mac using MLX","category":"ai","categoryLabel":"AI 與機器學習"},{"id":"328","title":"Explore numerical computing in Swift with MLX","gloss":"用 MLX 探索 Swift 的數值計算","gloss_en":"Explore numerical computing in Swift with MLX","category":"ai","categoryLabel":"AI 與機器學習"},{"id":"382","title":"Inside Apple Intelligence and Xcode: Special Presentation","gloss":"深入 Apple Intelligence 與 Xcode：特別發表","gloss_en":"Inside Apple Intelligence and Xcode: Special Presentation","category":"ai","categoryLabel":"AI 與機器學習"},{"id":"121","title":"Announcing Apple’s next big step for Siri and iPhone","gloss":"宣布 Apple 為 Siri 與 iPhone 邁出的下一大步","gloss_en":"Announcing Apple's next big step for Siri and iPhone","category":"ai","categoryLabel":"AI 與機器學習"},{"id":"227","title":"Create UI prototypes using agents in Xcode","gloss":"在 Xcode 用代理人打造 UI 原型","gloss_en":"Prototype UI with agents in Xcode","category":"ai","categoryLabel":"AI 與機器學習"}]}</script>
