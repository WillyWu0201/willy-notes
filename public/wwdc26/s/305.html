<script id="d" type="application/json">{"s":{"id":"305","title":"Enhance RAW image processing with Core Image","gloss":"用 Core Image 強化 RAW 影像處理","category":"graphics","categoryLabel":"圖形與遊戲","duration":988,"url":"https://developer.apple.com/videos/play/wwdc2026/305/","takeaway":"Core Image RAW 第 9 版大幅提升畫質與效能，並讓 CIImageProcessor 支援自訂輸出 tile 大小與暫存 PixelBuffer，打造更佳的互動式編輯。","chapters":[[0,"Introduction"],[52,"How Core Image supports RAW"],[168,"The evolution of RAW support"],[213,"RAW 9 overview"],[236,"RAW 9 quality improvements"],[350,"Enable and edit RAW 9 with CIRAWFilter API"],[513,"RAW 9 performance overview"],[559,"Interactive editing"],[652,"Exporting to other formats"],[668,"Contact for exports"],[710,"New CIImageProcessor features"],[743,"CIImageProcessor with explicit output tile sizes"],[864,"CIImageProcessor using temporary PixelBuffer"]],"points":[{"text":"Core Image **RAW 第 9 版**大幅改善影像**畫質**，並回顧 RAW 支援的演進。","hot":true},{"text":"以 **CIRAWFilter API** 啟用並編輯 RAW 9，搭配說明其**效能**特性。","hot":false},{"text":"針對**互動式編輯**與匯出其他格式提供建議，例如以 `.cacheIntermediate: false` 與 memoryLimit 設定匯出用的 CIContext。","hot":false},{"text":"**CIImageProcessorKernel** 新增以明確 tile 大小套用處理（`apply(withTiledExtent:)`）的能力。","hot":false},{"text":"可向 Core Image 取得**暫存 PixelBuffer**（temporaryPixelBuffer）作為運算 scratch 緩衝。","hot":false}],"apis":["CoreImage","CIRAWFilter","CIContext","CIImageProcessorKernel","CIImageProcessorInput","CIImageProcessorOutput"],"audience":"**開發相機、相片編輯或專業影像 App 的開發者**，需處理 RAW 與自訂影像管線的人。","gloss_en":"Enhance RAW image processing with Core Image","takeaway_en":"Core Image RAW version 9 dramatically improves image quality and performance, and lets CIImageProcessor support custom output tile sizes and temporary PixelBuffers for better interactive editing.","points_en":[{"text":"Core Image **RAW version 9** dramatically improves image **quality**, with a look back at the evolution of RAW support.","hot":true},{"text":"Enable and edit RAW 9 with the **CIRAWFilter API**, along with an explanation of its **performance** characteristics.","hot":false},{"text":"Offers recommendations for **interactive editing** and exporting to other formats, such as configuring an export CIContext with `.cacheIntermediate: false` and a memoryLimit.","hot":false},{"text":"**CIImageProcessorKernel** adds the ability to apply processing with an explicit tile size (`apply(withTiledExtent:)`).","hot":false},{"text":"You can request a **temporary PixelBuffer** (temporaryPixelBuffer) from Core Image to use as a scratch buffer for computation.","hot":false}],"audience_en":"**Developers building camera, photo editing, or professional imaging apps** who need to handle RAW and custom image pipelines.","summary":["由 Core Image 工程師 David Hayward 主講，介紹 Core Image 對相機 **RAW** 影像檔支援的重大更新。講者先回顧 Apple 平台處理 RAW 的完整管線：解析中繼資料與解包感測器值（此時每個像素僅有 R、G 或 B 的馬賽克）、**demosaic** 補齊三色、**denoise** 去除光子／讀取／熱噪、套用 convolution 銳化與局部對比，最後調整白平衡、曝光、色彩與色調。這些演算法內建於 iOS、iPadOS、macOS 與 visionOS，凡使用 Image IO API 的 app 都能自動獲得 RAW 支援；而用 **CIRAWFilter** API 的 app（如 Photos、Pixelmator Pro）更能提供進階編輯控制。","本次最大亮點是 **RAW 9**——史上最大幅度的更新。它建構在一個 tiled 的 **Core ML** 模型上，把 demosaic 與 denoise 合併以求最佳品質，並在 **Apple Neural Engine** 上執行以兼顧效能。講者以三組對比展示：低噪的 Sony Alpha 7 II 影像在 RAW 9 下更銳利、文字更清楚；高噪 ISO 51,200 的 Canon 5D Mark III 蠟筆照在 RAW 9 下顏色準確、連高光都還原；非傳統感測器 pattern 的 Fujifilm X-T5 影像在 RAW 9 下細節與紋理皆明顯更好。RAW 的核心價值在於——多年前拍的舊照都能用最新演算法重新處理。","啟用 RAW 9 只需幾行：用 CIRAWFilter 載入檔案後，檢查 **supportedDecoderVersions** 是否含 `version9`，再把 **decoderVersion** 設為 `version9`（預設不啟用）；可用新的類別方法 **supportedCameraModels** 查詢支援機型，清單會透過 OTA 更新持續成長，原生拍 DNG 的相機（如 iPhone）自動支援。編輯上有 20 個校準屬性，最重要的是 exposure、luminanceNoiseReductionAmount、sharpnessAmount 與 contrastAmount；而 colorNoiseReductionAmount 在 RAW 9 已無作用（Core ML 自動處理色噪），detailAmount 與 moireReductionAmount 也不再支援，可用 isSupported 系列屬性檢查。","由於 RAW 9 每張影像會跑 Core ML 模型數百次，較耗資源，但因 Core Image 會 cache 中間結果，調整屬性後的後續 render 仍快速。講者依兩大情境給出效能建議：**互動式編輯**（同一張在螢幕解析度反覆 render）應善用 `scaleFactor`、每個 view 用一個 `CIContext` 並開啟 `cacheIntermediates`、加上 Extended Virtual Addressing entitlement、直接 render 到 Metal-backed view；**匯出**（多張各以全解析度 render 一次）則應把 `cacheIntermediates` 設為 false、調高 `memoryLimit`（iOS 預設 256MB，設 512 或 1024MB 更快）、並用 context 的 `heifRepresentation`／`jpegRepresentation`。最後介紹為 RAW 9 而擴充的 **CIImageProcessor** 新功能：可明確指定 output tile sizes（自行建立 512×512 等 tile 陣列傳給 `apply`），以及由 Core Image 代管生命週期的 temporary buffers（用 `temporaryPixelBuffer(identifier:)` 取得暫存區，避免重複建立／銷毀的開銷）。"],"deepdive":[{"t":0,"title":"Introduction","body":"David Hayward 開場，預告四大主題：Core Image 如何支援 RAW、iOS／iPadOS／macOS／visionOS 27 即將帶來的 RAW 品質大幅提升、render RAW 的最佳效能做法，以及為 RAW 而新增的 **CIImageProcessor** 功能。"},{"t":52,"title":"How Core Image supports RAW","body":"回顧 RAW 處理管線：先解析中繼資料並解包感測器值（此時每像素僅有 R、G 或 B 的馬賽克 pattern），接著 **demosaic** 讓每像素都有 RGB、**denoise** 去除 photon／read／thermal noise，再用 convolution 銳化邊緣與加局部對比，最後調整白平衡、曝光、色彩與色調成為討喜的成品。"},{"t":168,"title":"The evolution of RAW support","body":"說明這些演算法內建於各 Apple 平台，因此 Finder、Preview、Freeform 等系統 app 都能檢視 RAW；凡用 **Image IO** API 的 app 或框架皆自動獲得支援，而用 **CIRAWFilter** 的 app（如 Photos、Pixelmator Pro、Nitro、Acorn）可提供進階編輯。RAW 支援自 2006 年的 21 款機型成長到 784 款，且涵蓋 iPhone 的 Apple ProRAW。"},{"t":213,"title":"RAW 9 overview","body":"介紹 RAW 是 Apple 第 8 次更新後迄今最大的躍進——**RAW 9**。它建構在 tiled 的 **Core ML** 模型上，將 demosaic 與 denoise 結合以求最佳品質，並在 **Apple Neural Engine** 核心上執行以取得最佳效能。RAW 的關鍵價值在於舊照可用最新演算法重新處理。"},{"t":236,"title":"RAW 9 quality improvements","body":"以三組放大對比展示品質提升：低噪的 Sony Alpha 7 II 影像在 RAW 9 下更銳利、細小文字更易讀；高噪 ISO 51,200 的 Canon 5D Mark III 蠟筆照在 RAW 8 僅勉強還原顏色，RAW 9 則色彩準確、連蠟筆上的高光都可見；非傳統感測器 pattern 的 Fujifilm X-T5（ISO 12,800）在 RAW 9 下文字更清楚、紗線紋理更分明。"},{"t":350,"title":"Enable and edit RAW 9 with CIRAWFilter API","body":"示範啟用步驟：用 **CIRAWFilter** 載入 RAW 檔，檢查 **supportedDecoderVersions** 是否含 `version9`（預設不啟用），符合則把 **decoderVersion** 設為 `version9`。新類別方法 **supportedCameraModels** 可查詢某版本支援的機型；清單透過 OTA 更新成長，原生拍 DNG 的相機（如 iPhone）自動支援。並說明 20 個可調校準屬性中最重要的 exposure、luminanceNoiseReductionAmount、sharpnessAmount、contrastAmount，以及在 RAW 9 已失效或不再支援的 colorNoiseReductionAmount、detailAmount、moireReductionAmount（可用 isSupported 屬性檢查）。"},{"t":513,"title":"RAW 9 performance overview","body":"說明 RAW 9 因每張影像跑 Core ML 模型數百次而更耗效能與資源，但因 Core Image 會 cache 中間結果，使用者在編輯 CIRAWFilter 屬性後的後續 render 仍快速且靈敏。接著針對兩大常見情境給出最佳實務。"},{"t":559,"title":"Interactive editing","body":"互動式編輯（同一張 RAW 在螢幕解析度反覆 render，例如調整 exposure 或 sharpness）的建議：用 **scaleFactor** 以縮小尺寸顯示、減少超過螢幕像素的渲染量；每個 view 用一個 **CIContext** 並把 **cacheIntermediates** 設為 true 以略過密集的 Core ML 工作；加上 **Extended Virtual Addressing entitlement** 讓 Core Image 用更多記憶體做 cache；並直接 render 到 **Metal-backed view** 以便在前一幀完成前就開始下一幀。"},{"t":652,"title":"Exporting to other formats","body":"匯出情境（多張 RAW 各以全解析度 render 一次成 HEIF／JPEG）的建議：用 **cacheIntermediates 設為 false** 的 CIContext；調高 context 的 **memoryLimit**（iOS 預設保守的 256MB，設 512 或 1024MB 可顯著加速）；並用 context 的 **heifRepresentation** 或 **jpegRepresentation** 方法取代直接呼叫 Image IO 以省記憶體。"},{"t":668,"title":"Contact for exports","body":"延續匯出最佳實務，補充以 context 方法產生 HEIF／JPEG 表示形式可比直接走 Image IO 取得額外的記憶體節省，是匯出大量 RAW 時的關鍵手法。"},{"t":710,"title":"New CIImageProcessor features","body":"介紹 RAW 9 之所以使用 **CIImageProcessor** API，是因為它能讓 Core ML 與其他 CIKernel 協同運作。為此 Core Image 團隊替 CIImageProcessor 新增兩項功能：明確的 output tile sizes 與 temporary buffers，開發者也可在自己的 app 中採用。"},{"t":743,"title":"CIImageProcessor with explicit output tile sizes","body":"說明典型 CIImageProcessor 會實作 region of interest callback 與在 process callback 中處理 input.region／output.region；記憶體充足時 Core Image 會一次處理整張、受限時則切小。新功能讓 processor 可明確控制 output tile 大小：自行建立陣列填入要覆蓋影像的所有 tile（範例以 512×512 切分），再呼叫 **apply** 並傳入該 tile 陣列。"},{"t":864,"title":"CIImageProcessor using temporary PixelBuffer","body":"說明呼叫 Core ML 的 processor 常需 temporary buffer，因為 Core Image 用 interleaved 緩衝、Core ML 需 planar 資料；逐 tile 反覆建立／銷毀會傷效能。**CIImageProcessorOutput** 新增方法可用 **temporaryPixelBuffer(identifier:)** 取得暫存 CVPixelBuffer（多個暫存區時 identifier 很重要），由 Core Image 代管其生命週期、自動釋放並在下一個 tile 回收。"}],"summary_en":["Presented by Core Image engineer David Hayward, this session covers a major update to Core Image's support for camera **RAW** files. He first reviews the full RAW pipeline on Apple platforms: parse metadata and unpack sensor values (where each pixel holds only an R, G, or B value in a mosaic), **demosaic** to give every pixel full RGB, **denoise** to remove photon/read/thermal noise, apply convolutions for sharpening and local contrast, and finally adjust white balance, exposure, color, and tone. These algorithms are built into iOS, iPadOS, macOS, and visionOS, so any app using the Image IO API gets RAW support automatically, while apps using the **CIRAWFilter** API (like Photos and Pixelmator Pro) can offer advanced editing controls.","The headline is **RAW 9**, the biggest update yet. It is built atop a tiled **Core ML** model that combines demosaic with denoise for best quality and runs on the **Apple Neural Engine** for performance. He shows three before/after crops: a low-noise Sony Alpha 7 II image looks sharper with more legible text under RAW 9; a high-noise ISO 51,200 Canon 5D Mark III crayon shot recovers accurate colors and even specular highlights; and a Fujifilm X-T5 image with a non-traditional sensor pattern shows clearly better detail and texture. The core value of RAW is that a photo shot years ago can be reprocessed with the latest algorithms.","Enabling RAW 9 takes only a few lines: load the file with CIRAWFilter, check that **supportedDecoderVersions** contains `version9`, then set **decoderVersion** to `version9` (it is not on by default). The new class method **supportedCameraModels** lists supported models, the list grows via OTA updates, and cameras that shoot DNG natively (like iPhones) are supported automatically. There are 20 calibrated editing properties; the most important are exposure, luminanceNoiseReductionAmount, sharpnessAmount, and contrastAmount. Note that colorNoiseReductionAmount now has no effect (the Core ML model handles color noise automatically), and detailAmount and moireReductionAmount are no longer supported, check with the isSupported properties.","Because RAW 9 runs the Core ML model hundreds of times per image, it is more resource-intensive, but since Core Image caches intermediate results, subsequent renders after a property change stay fast. He gives guidance for two cases. For **interactive editing** (one image rendered repeatedly at screen resolution): use the `scaleFactor` property, use one `CIContext` per view with `cacheIntermediates` set to true, add the Extended Virtual Addressing entitlement, and render directly to a Metal-backed view. For **exporting** (many files each rendered once at full resolution): use a `CIContext` with `cacheIntermediates` set to false, raise the `memoryLimit` (the iOS default of 256MB can go to 512 or 1024MB), and use the context's `heifRepresentation`/`jpegRepresentation` methods. Finally he covers two **CIImageProcessor** additions made for RAW 9: explicit output tile sizes (build your own tile array, e.g. 512×512, and pass it to `apply`) and temporary buffers whose lifecycle Core Image manages (request one with `temporaryPixelBuffer(identifier:)` to avoid repeated create/destroy overhead)."],"deepdive_en":[{"t":0,"title":"Introduction","body":"David Hayward opens by previewing four topics: how Core Image supports RAW, the RAW quality improvements coming in iOS/iPadOS/macOS/visionOS 27, how to get optimal performance when rendering RAW, and the **CIImageProcessor** features added for RAW."},{"t":52,"title":"How Core Image supports RAW","body":"Reviews the RAW pipeline: parse metadata and unpack sensor values (each pixel only an R, G, or B mosaic value), **demosaic** so every pixel has RGB, **denoise** to remove photon/read/thermal noise, apply convolutions to sharpen edges and add local contrast, and finally adjust white balance, exposure, color, and tone for a pleasing result."},{"t":168,"title":"The evolution of RAW support","body":"Explains these algorithms are built into every Apple platform, so system apps like Finder, Preview, and Freeform can view RAW; any app using **Image IO** gets support automatically, while apps using **CIRAWFilter** (Photos, Pixelmator Pro, Nitro, Acorn) offer advanced editing. Support has grown from 21 models in 2006 to 784 models, including iPhone's Apple ProRAW."},{"t":213,"title":"RAW 9 overview","body":"Introduces **RAW 9** as the biggest leap after Apple's eighth update. It is built atop a tiled **Core ML** model that combines demosaic with denoise for best quality, running on the **Apple Neural Engine** for optimal performance. The key value of RAW is that older photos can be reprocessed with the latest algorithms."},{"t":236,"title":"RAW 9 quality improvements","body":"Shows three zoomed crops: a low-noise Sony Alpha 7 II image is sharper with more legible fine text under RAW 9; a high-noise ISO 51,200 Canon 5D Mark III crayon shot, only acceptably recovered by RAW 8, gets accurate colors and visible specular highlights under RAW 9; and a Fujifilm X-T5 (ISO 12,800) with a non-traditional sensor pattern shows clearer text and yarn texture under RAW 9."},{"t":350,"title":"Enable and edit RAW 9 with CIRAWFilter API","body":"Demos enabling: load the RAW with **CIRAWFilter**, check that **supportedDecoderVersions** contains `version9` (not on by default), then set **decoderVersion** to `version9`. The new class method **supportedCameraModels** lists supported models; the list grows via OTA updates and DNG-native cameras (like iPhones) are supported automatically. Covers the most important of the 20 calibrated properties (exposure, luminanceNoiseReductionAmount, sharpnessAmount, contrastAmount) and those deprecated in RAW 9 (colorNoiseReductionAmount, detailAmount, moireReductionAmount), checkable via the isSupported properties."},{"t":513,"title":"RAW 9 performance overview","body":"Notes RAW 9 is more performance- and resource-intensive because it runs the Core ML model hundreds of times per image, but since Core Image caches intermediate results, subsequent renders after editing CIRAWFilter properties stay fast and responsive. Sets up best practices for two common cases."},{"t":559,"title":"Interactive editing","body":"For interactive editing (one RAW rendered repeatedly at screen resolution while adjusting properties like exposure or sharpness): use the **scaleFactor** property when displaying smaller to cut work for over-resolution images; use one **CIContext** per view with **cacheIntermediates** true to skip the intensive Core ML work; add the **Extended Virtual Addressing entitlement** for more cache memory; and render directly to a **Metal-backed view** so the next frame can start before the previous one finishes."},{"t":652,"title":"Exporting to other formats","body":"For exporting (many RAWs each rendered once at full resolution to HEIF/JPEG): use a CIContext with **cacheIntermediates set to false**; raise the context's **memoryLimit** (the conservative iOS default of 256MB can go to 512 or 1024MB for a significant speedup); and use the context's **heifRepresentation** or **jpegRepresentation** methods instead of calling Image IO directly to save memory."},{"t":668,"title":"Contact for exports","body":"Continues the export best practices, noting that generating HEIF/JPEG representations via the context methods yields extra memory savings over going through Image IO directly, a key technique when exporting many RAW files."},{"t":710,"title":"New CIImageProcessor features","body":"Explains that RAW 9 uses the **CIImageProcessor** API because it lets Core ML work in conjunction with other CIKernels. As a result the Core Image team added two features you may want in your own app: explicit output tile sizes and temporary buffers."},{"t":743,"title":"CIImageProcessor with explicit output tile sizes","body":"Describes a typical CIImageProcessor implementing the region-of-interest callback and handling input.region/output.region in process; with plenty of memory Core Image processes the whole image, with limited memory it tiles smaller. The new feature lets a processor explicitly control output tile sizes: build an array of tiles covering the image (the example uses 512×512), then call **apply** passing that tile array."},{"t":864,"title":"CIImageProcessor using temporary PixelBuffer","body":"Explains that Core ML processors often need temporary buffers because Core Image uses interleaved buffers that must be converted to planar data for Core ML; repeatedly creating and destroying them per tile hurts performance. **CIImageProcessorOutput** now offers **temporaryPixelBuffer(identifier:)** to request a scratch CVPixelBuffer (the identifier matters when using more than one), with Core Image managing its lifecycle, releasing it automatically and recycling it for the next tile."}],"code":[]},"related":[{"id":"215","title":"Get started with the HTML Model Element","gloss":"開始使用 HTML model 元素","gloss_en":"Getting started with the HTML model element","category":"graphics","categoryLabel":"圖形與遊戲"},{"id":"252","title":"Design no-code games with Reality Composer Pro 3","gloss":"用 Reality Composer Pro 3 設計無程式碼遊戲","gloss_en":"Design no-code games with Reality Composer Pro 3","category":"graphics","categoryLabel":"圖形與遊戲"},{"id":"256","title":"Discover generated subtitles and subtitle styles","gloss":"認識自動產生字幕與字幕樣式","gloss_en":"Discover generated subtitles and subtitle styles","category":"graphics","categoryLabel":"圖形與遊戲"},{"id":"285","title":"Discover USDKit and what’s new in OpenUSD","gloss":"認識 USDKit 與 OpenUSD 的新功能","gloss_en":"Discover USDKit and what's new in OpenUSD","category":"graphics","categoryLabel":"圖形與遊戲"},{"id":"304","title":"Implement high resolution photo capture","gloss":"實作高解析度照片拍攝","gloss_en":"Implement high resolution photo capture","category":"graphics","categoryLabel":"圖形與遊戲"}]}</script>
