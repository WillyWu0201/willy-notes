<script id="d" type="application/json">{"s":{"id":"221","title":"Prepare your tvOS apps for Dynamic Type","gloss":"讓你的 tvOS App 支援動態字型","category":"uikit","categoryLabel":"UIKit","duration":608,"url":"https://developer.apple.com/videos/play/wwdc2026/221/","takeaway":"tvOS 也要支援 Dynamic Type,改用標準 text styles 與彈性 constraints,並在進入無障礙字級時切換成適配版面。","chapters":[[1,"Introduction"],[166,"Identify common issues"],[298,"Adopt standard text styles"],[310,"Use flexible constraints"],[355,"Dynamic Type with text styles in UIKit"],[373,"Adapt your layout"],[429,"Adapt layout in response to dynamic type"],[487,"Provide a conditional layout for when larger sizes are turned on"],[511,"UIKit adaptive layout that responds to content size changes"]],"points":[{"text":"**Dynamic Type** 讓使用者自選文字大小,tvOS App 也應支援以提升閱讀與操作舒適度。","hot":true},{"text":"常見問題來自**寫死的字體大小與固定寬度 frame**;改用 .frame(maxWidth: .infinity) 等彈性 constraints。","hot":false},{"text":"採用**標準 text styles**:SwiftUI 用 .font(.caption) 等,UIKit 用 UIFont.preferredFont(forTextStyle:) 並開啟 adjustsFontForContentSizeCategory。","hot":false},{"text":"在 SwiftUI 監看 **@Environment(\\.dynamicTypeSize)**,用 isAccessibilitySize 調整 containerRelativeFrame 的欄數或以 AnyLayout 切換 H/V Stack。","hot":false},{"text":"UIKit 用 **registerForTraitChanges** 監聽 UITraitPreferredContentSizeCategory,在無障礙字級時把 stack 軸向改為垂直。","hot":false}],"apis":["dynamicTypeSize","isAccessibilitySize","UIFont.preferredFont(forTextStyle:)","adjustsFontForContentSizeCategory","registerForTraitChanges","UITraitPreferredContentSizeCategory","containerRelativeFrame","AnyLayout"],"audience":"**開發 tvOS App、想兼顧無障礙與不同字級下版面正確性的開發者。**","gloss_en":"Prepare your tvOS app for Dynamic Type","takeaway_en":"tvOS apps should support Dynamic Type too—switch to standard text styles and flexible constraints, and adapt the layout when accessibility text sizes are in use.","points_en":[{"text":"**Dynamic Type** lets users choose their text size, and tvOS apps should support it to make reading and interaction more comfortable.","hot":true},{"text":"Common problems come from **hard-coded font sizes and fixed-width frames**; switch to flexible constraints like .frame(maxWidth: .infinity).","hot":false},{"text":"Adopt **standard text styles**: in SwiftUI use .font(.caption) and the like; in UIKit use UIFont.preferredFont(forTextStyle:) and enable adjustsFontForContentSizeCategory.","hot":false},{"text":"In SwiftUI, observe **@Environment(\\.dynamicTypeSize)** and use isAccessibilitySize to adjust the column count in containerRelativeFrame, or switch between H/V Stacks with AnyLayout.","hot":false},{"text":"In UIKit, use **registerForTraitChanges** to observe UITraitPreferredContentSizeCategory and switch the stack axis to vertical at accessibility text sizes.","hot":false}],"audience_en":"**Developers building tvOS apps who want correct layouts across text sizes while supporting accessibility.**","summary":["**tvOS 27** 首度帶來系統層級的 **Large Text（Dynamic Type）** 支援，讓使用者能在「設定 > 輔助使用 > 顯示 > 文字大小」把字級從 Large 一路調到 Accessibility XXXL，全平台每個 app 都受惠。由 Accessibility 團隊的 Isis 主講，重點是：tvOS 的 Dynamic Type 與 iOS 運作方式相同，標準的 `Label`、`Button`、tab bar 等元件會自動縮放，開發者的工作是找出並修正**自訂元件**。支援後還能在 App Store 的 **Accessibility Nutrition Labels** 標示 Larger Text，觸及特別尋找無障礙 app 的使用者。","常見問題有三類：避免**固定字級**（hard-coded font size）導致文字無法縮放、避免**固定寬高 constraint** 造成截斷或裁切，以及在元件放大後調整 padding 與 spacing。修法是把 hard-coded 字型換成語意化的 **text style**（SwiftUI 用 `.caption` 等；UIKit 用 `UIFont.preferredFont(forTextStyle:)` 並設 `adjustsFontForContentSizeCategory = true`），並把固定寬度改成 **flexible constraint**（SwiftUI 將 `frame(width:)` 改為 `frame(maxWidth: .infinity)`）。","光修固定值有時不夠，還需依文字大小**調整版面**。透過讀取 `@Environment(\\.dynamicTypeSize)`，可在 accessibility size 時改變 `containerRelativeFrame` 的欄數（如電影海報從 6 欄改 4 欄），給每格更寬空間；更進一步可用 **`AnyLayout`** 在 `HStackLayout` 與 `VStackLayout` 間切換，讓 card 在大字級時改為垂直堆疊。UIKit 則改 `UIStackView.axis` 並用 `registerForTraitChanges` 監聽 `UITraitPreferredContentSizeCategory` 即時更新。行動方案：用標準 text style、系統性地以 Large Text 測試、必要時調整版面，並在 tvOS 的 Accessibility Nutrition Labels 標示支援。"],"deepdive":[{"t":1,"title":"Introduction","body":"由 Accessibility 團隊工程經理 Isis 開場，宣布 **tvOS 27** 首度支援系統層級的 Large Text 文字縮放。許多人需要或偏好不同字級，使用者可在「設定 > 輔助使用 > 顯示 > 文字大小」從 Large 調到 Accessibility XXXL；標準 UIKit／SwiftUI 元件會自動適應，且支援後可在 App Store 的 **Accessibility Nutrition Labels** 標示 Larger Text。"},{"t":166,"title":"Identify common issues","body":"說明三類需檢查的問題：**固定字級** 讓文字無法縮放、不適應 Dynamic Type 的 hard-coded 尺寸或 constraint 會造成 **截斷或裁切**，以及元件放大後需調整 **padding 與 spacing**。以媒體 app 中「Signup information」caption 因 hard-coded 字級而不縮放為例。"},{"t":298,"title":"Adopt standard text styles","body":"把 hard-coded 字型換成 **語意化 text style**（如 `.caption`），文字才會隨偏好縮放。示範把該 caption 改用 caption 樣式，字級開始動態成長。"},{"t":310,"title":"Use flexible constraints","body":"改用 text style 後若仍截斷，是因固定寬度（300 點）不夠。將 `frame(width: 300)` 改為 **`frame(maxWidth: .infinity)`**，讓 SwiftUI 依內容使用所需寬度，文字便能完整顯示。"},{"t":355,"title":"Dynamic Type with text styles in UIKit","body":"UIKit 的作法類似但多一步：把 hard-coded font 換成 **`UIFont.preferredFont(forTextStyle:)`**，並設定 **`adjustsFontForContentSizeCategory = true`**，UIKit 才會在偏好變更時自動更新字級。"},{"t":373,"title":"Adapt your layout","body":"有時修固定值不夠，需在大字級時**調整版面**同時保留預設尺寸的原版面。以六張電影海報的 collection view 為例，大字級下橫向放不下六個標題，需要適配。"},{"t":429,"title":"Adapt layout in response to dynamic type","body":"讀取 **`dynamicTypeSize`** 環境值，在 `containerRelativeFrame` 修飾器中調整欄數：accessibility size 時顯示 4 欄而非 6 欄，給每格更寬尺寸與更多標題空間；更長文字可考慮 marquee 策略。"},{"t":487,"title":"Provide a conditional layout for when larger sizes are turned on","body":"針對 content card（圖、標題、副標）在大字級下 padding 不足且易截斷，提供**條件式版面**：讀 `dynamicTypeSize` 判斷是否為 accessibility size，再用 **`AnyLayout`** 在 `VStackLayout` 與 `HStackLayout` 間切換，像一般 stack 一樣使用。"},{"t":511,"title":"UIKit adaptive layout that responds to content size changes","body":"UIKit 用 **`UIStackView`** 並依 `preferredContentSizeCategory.isAccessibilityCategory` 切換 `axis`（垂直／水平）。呼叫 **`registerForTraitChanges`** 傳入 `UITraitPreferredContentSizeCategory`，即可在執行期隨字級變化即時更新版面；大字級時改為垂直堆疊讓標題佔滿寬度。"}],"summary_en":["**tvOS 27** brings system-wide **Large Text (Dynamic Type)** support for the first time, letting users scale text from Large up to Accessibility XXXL in Settings > Accessibility > Display > Text Size, benefiting every app on the platform. Presented by Isis from the Accessibility team, the key point is that tvOS Dynamic Type works the same as iOS: standard `Label`, `Button`, and tab bar components scale automatically, so the developer's job is to find and fix **custom elements**. Once supported, you can indicate Larger Text in your App Store **Accessibility Nutrition Labels** to reach users seeking accessible apps.","There are three common issue types: avoid **hard-coded font sizes** that prevent text from scaling, avoid **fixed width/height constraints** that cause truncation or clipping, and adjust padding and spacing once elements grow. The fixes: replace hard-coded fonts with semantic **text styles** (SwiftUI `.caption` etc.; UIKit `UIFont.preferredFont(forTextStyle:)` with `adjustsFontForContentSizeCategory = true`), and replace fixed widths with **flexible constraints** (in SwiftUI, change `frame(width:)` to `frame(maxWidth: .infinity)`).","Fixing hard-coded values isn't always enough—you may need to **adapt layout** in response to text size. By reading `@Environment(\\.dynamicTypeSize)`, you can change `containerRelativeFrame`'s column count at accessibility sizes (e.g., movie posters from 6 to 4 columns) for wider cells; going further, use **`AnyLayout`** to switch between `HStackLayout` and `VStackLayout` so cards stack vertically at large sizes. In UIKit, change `UIStackView.axis` and use `registerForTraitChanges` to observe `UITraitPreferredContentSizeCategory` for live updates. Action plan: use standard text styles, test systematically with Large Text, adapt layouts when needed, and indicate support in your tvOS Accessibility Nutrition Labels."],"deepdive_en":[{"t":1,"title":"Introduction","body":"Isis, an engineering manager on the Accessibility team, opens by announcing **tvOS 27** brings system-wide Large Text scaling for the first time. Many people need or prefer different text sizes; users set them in Settings > Accessibility > Display > Text Size from Large up to Accessibility XXXL. Standard UIKit/SwiftUI components adapt automatically, and you can indicate Larger Text in App Store **Accessibility Nutrition Labels**."},{"t":166,"title":"Identify common issues","body":"Covers three issue types to check: **hard-coded font sizes** that block scaling, hard-coded sizes/constraints that cause **truncation or clipping**, and the need to adjust **padding and spacing** as elements grow. Uses the example of a 'Signup information' caption in a media app that won't scale due to a hard-coded font size."},{"t":298,"title":"Adopt standard text styles","body":"Replace hard-coded fonts with **semantic text styles** (like `.caption`) so text scales with preferences. Demonstrates switching the caption to the caption style, after which the size begins growing dynamically."},{"t":310,"title":"Use flexible constraints","body":"If text still truncates after adopting a text style, the cause is a fixed width (300 points). Change `frame(width: 300)` to **`frame(maxWidth: .infinity)`** so SwiftUI uses as much width as the content needs and the text displays fully."},{"t":355,"title":"Dynamic Type with text styles in UIKit","body":"The UIKit approach is similar with one extra step: replace hard-coded fonts with **`UIFont.preferredFont(forTextStyle:)`** and set **`adjustsFontForContentSizeCategory = true`** so UIKit updates the font size automatically when preferences change."},{"t":373,"title":"Adapt your layout","body":"Sometimes fixing fixed values isn't enough—you need to **adapt the layout** at large sizes while preserving the original for default sizes. Uses a six-poster collection view that can't fit six titles horizontally at large text and needs adaptation."},{"t":429,"title":"Adapt layout in response to dynamic type","body":"Read the **`dynamicTypeSize`** environment value and adjust the column count in the `containerRelativeFrame` modifier: show 4 columns instead of 6 at accessibility sizes for wider cells and more title room; consider a marquee strategy for even longer text."},{"t":487,"title":"Provide a conditional layout for when larger sizes are turned on","body":"For content cards (image, title, subtitle) that lack padding and truncate at large sizes, provide a **conditional layout**: read `dynamicTypeSize` to detect accessibility sizes, then use **`AnyLayout`** to switch between `VStackLayout` and `HStackLayout`, using it like any normal stack."},{"t":511,"title":"UIKit adaptive layout that responds to content size changes","body":"In UIKit, use **`UIStackView`** and switch `axis` (vertical/horizontal) based on `preferredContentSizeCategory.isAccessibilityCategory`. Call **`registerForTraitChanges`** passing `UITraitPreferredContentSizeCategory` to update the layout live as size changes; at large sizes it switches to a vertical stack so titles span the full width."}],"code":[]},"related":[{"id":"278","title":"Modernize your UIKit app","gloss":"現代化你的 UIKit App","gloss_en":"Modernize your UIKit app","category":"uikit","categoryLabel":"UIKit"},{"id":"203","title":"Read between the strokes with PencilKit","gloss":"用 PencilKit 解讀筆跡內容","gloss_en":"Read handwriting content with PencilKit","category":"uikit","categoryLabel":"UIKit"},{"id":"212","title":"Rev up your CarPlay app","gloss":"強化你的 CarPlay App","gloss_en":"Rev up your CarPlay app","category":"uikit","categoryLabel":"UIKit"},{"id":"219","title":"Enhance the accessibility of your reading app","gloss":"強化你閱讀類 App 的無障礙體驗","gloss_en":"Enhance the accessibility of your reading app","category":"uikit","categoryLabel":"UIKit"},{"id":"226","title":"Create live communication experiences","gloss":"打造即時通訊體驗","gloss_en":"Build live communication experiences","category":"uikit","categoryLabel":"UIKit"}]}</script>
