<script id="d" type="application/json">{"s":{"id":"282","title":"Discover the Spatial Preview framework","gloss":"認識 Spatial Preview 框架","category":"visionos","categoryLabel":"visionOS","duration":885,"url":"https://developer.apple.com/videos/play/wwdc2026/282/","takeaway":"用全新的 Spatial Preview 框架把 Mac 上的文件與 USD 內容即時串到 visionOS 預覽，並搭配 USDKit 進行即時編輯與標註。","chapters":[[0,"Introduction"],[157,"Learn about Spatial Preview"],[210,"Document Preview"],[238,"Document Preview Session with Device Picker"],[320,"Update Document Contents"],[396,"USD Preview"],[456,"Edit USD Live"],[536,"Opt out of optimization"],[556,"Editing Features"],[610,"USD Layout Variants"],[617,"Edit USD live using USDKit and Spatial Preview"],[649,"USD Stage Observations"],[673,"Annotation Spec"],[693,"Metadata for Object Manipulation"],[736,"Session Options and Events"],[758,"Observe Session Progress"],[808,"Next steps"]],"points":[{"text":"全新的 **Spatial Preview** 框架可把 Mac 上的內容直接送到 **visionOS** 預覽，透過 `SpatialPreviewDevicePicker` 選擇目標裝置。","hot":true},{"text":"支援 **Document Preview**（`DocumentPreviewSession`）即時更新內容，並可觀察 session 狀態以在失效時清理。","hot":false},{"text":"搭配 **USDKit** 進行 **USD 即時編輯**（`USDPreviewSession`、`USDStage`），可切換 layout variants 並透過 stage observation 監看變更。","hot":false},{"text":"支援標註（annotation）、逐物件操作與匯出等 session 選項，並可用 `Observations` 觀察傳輸進度。","hot":false}],"apis":["SpatialPreview","USDKit","DocumentPreviewSession","USDPreviewSession","SpatialPreviewDevicePicker","ConnectedSpatialEndpointObserver","SpatialPreviewEndpoint","USDStage","Observations"],"audience":"**開發 visionOS 空間內容或 3D／USD 工作流程的開發者與創作者**。","gloss_en":"Discover the Spatial Preview framework","takeaway_en":"Use the new Spatial Preview framework to stream documents and USD content from your Mac directly into a visionOS preview, paired with USDKit for live editing and annotation.","points_en":[{"text":"The new **Spatial Preview** framework sends content from your Mac directly to a **visionOS** preview, choosing the target device with `SpatialPreviewDevicePicker`.","hot":true},{"text":"Supports **Document Preview** (`DocumentPreviewSession`) for live content updates, and you can observe session state to clean up when it becomes invalid.","hot":false},{"text":"Pairs with **USDKit** for **live USD editing** (`USDPreviewSession`, `USDStage`), letting you switch layout variants and watch changes through stage observation.","hot":false},{"text":"Supports session options like annotation, per-object manipulation, and export, and you can observe transfer progress with `Observations`.","hot":false}],"audience_en":"**Developers and creators building visionOS spatial content or 3D/USD workflows**.","summary":["這場由 visionOS 團隊主講，介紹全新的 **Spatial Preview** 框架——讓人能把 Mac 上的內容直接「延伸」到 Apple Vision Pro 的周遭空間中。核心情境延續 **Mac Virtual Display**：透過虛擬螢幕一邊用 Mac 工作，一邊把 3D 設計、Apple 沉浸式影片畫格、spatial photo、PDF 等內容串流到 Vision Pro，由 visionOS 上的 **QuickLook** 接收並讓使用者沉浸地檢視，例如在客廳場景裡走動、切換不同攝影機視角。這些原本只在 macOS 的 Preview app 中可用的能力，現在也以 API 的形式開放給開發者，可用來強化內容創作或審閱類 app。","導入流程相當精簡。第一步是取得 **endpoint**：若正在使用 Mac Virtual Display 可直接沿用該裝置，否則加入 device picker UI 讓使用者挑選同一 iCloud 帳號下的任一台 Vision Pro。第二步建立 preview session，分兩種：**`DocumentPreviewSession`** 處理 spatial photo、影片、PDF 等文件類型，**`USDPreviewSession`** 處理 3D 內容。session 一啟動，QuickLook 就會在 Vision Pro 上開啟並顯示內容，**visionOS 端不需要任何程式碼**。文件類型可用 `updateContents(url:)` 在同一個場景內換頁，做出像沉浸式建築渲染圖庫的即時切換效果，並用 task 觀察 session 狀態（場景被關閉時會收到 invalidated）。","3D 部分建議搭配新的 **USDKit** Swift API 使用。把 USD 載入成 stage 交給 `USDPreviewSession` 啟動後，Vision Pro 會以 volumetric view 顯示，可旋轉檢視或進入沉浸式看 1:1 尺度，並內建攝影機視角切換與 wireframe 等 material override。預設會自動最佳化（mesh decimation、texture 降採樣、必要時重建場景）以確保效能，若不想被改動可傳 `.unmodified` 參數，但過於複雜的場景可能因此無法分享而拋錯。最關鍵的是**雙向即時編輯**：透過 live USD stage，Mac 與 visionOS 兩端都能改動並自動同步——切換 layout variant 重排家具、加 annotation、移動帶有 `spatialEditable` metadata 的物件，都會反映到另一端。","進階能力包含用 `addObserver` 監聽 `UsdStage.ObjectsDidChange` 通知來接收 visionOS 端的變更、用 session options（`.annotations`、`.perObjectManipulation`、`.export`）控制 QuickLook 上開放的功能、訂閱動畫播放時間等非 USD 事件，以及用 Progress Reporter 顯示大型資料同步的載入進度。Spatial Preview 在 visionOS 上**內建 SharePlay 支援**，協作者可加入同一個 live session 一起即時審閱與編輯。實務建議：採用 USDKit Swift API，若 app 已有自己的 USD 安裝可做 bridging，並善用 material override、攝影機視角、object manipulation、variant 與 annotation 等審閱工具。"],"deepdive":[{"t":0,"title":"Introduction","body":"由 visionOS 工程師 Quincy German 開場，以自己最常用的 **Mac Virtual Display** 帶出主題：在 macOS 與 visionOS 27 上，把 Mac 內容預覽到 Vision Pro 變得更容易。介紹全新 **Spatial Preview** 框架，能讓使用者在處理 Mac 上內容時運用 visionOS 的空間運算能力，並以 macOS 的 Preview app 為示範，支援 3D 編輯、擬真渲染、攝影機視角與 spatial media 輸出。"},{"t":157,"title":"Learn about Spatial Preview","body":"概覽框架組成：先選定指向某台裝置的 **endpoint**（沿用 Mac Virtual Display 連線或加入 device picker 選附近的 Vision Pro），再為內容建立 preview session。session 分 **document**（spatial photo、影片、PDF）與 **USD**（3D 內容）兩類；啟動後 QuickLook 會在 Vision Pro 上開啟並顯示內容，**visionOS 端完全免寫程式**。"},{"t":210,"title":"Document Preview","body":"以 Apple 沉浸式影片的靜態畫格為例示範文件預覽。用 `ConnectedSpatialEndpointObserver` 取得 Mac Virtual Display 的 endpoint，建立 **`DocumentPreviewSession`**（指定 contentType 與名稱），再 `start` 並提供 content URL，內容就會出現在 QuickLook 中以沉浸模式檢視。"},{"t":238,"title":"Document Preview Session with Device Picker","body":"因為 Mac Virtual Display 不一定總是啟用，建議把 Spatial Preview 的 **device picker** 當成一個 view 整合進 UI。用 SwiftUI 的 sheet 控制它何時出現，使用者在 picker 中選好裝置 endpoint 後，再照前面流程建立 document preview session。"},{"t":320,"title":"Update Document Contents","body":"示範建立一個沉浸式建築渲染圖庫。`updateContents` 會**重用**啟動時的同一場景，因此圖庫用一排按鈕呼叫 `updateContents(url:)` 在同一場景內換檔。另設一個 task 觀察 session 狀態，場景在 visionOS 被關閉時會收到 invalidated；用完呼叫 `close` 結束 session、visionOS 會自動關閉場景。"},{"t":396,"title":"USD Preview","body":"轉入 3D 內容主題，建議先看 Understand USD Fundamentals 與 Discover USDKit 等基礎影片。建立 **`USDPreviewSession`** 與文件類似，差別在內容是 USDKit 的 **stage**；`start` 後 Vision Pro 以 volumetric view 顯示，可進入沉浸式看 1:1 尺度，並內建攝影機視角切換與 wireframe material override，皆免額外設定。"},{"t":456,"title":"Edit USD Live","body":"說明 USD scene 可能高擬真到 Vision Pro 難以渲染，因此預設會自動最佳化（**mesh decimation**、**texture 降採樣**、必要時整場重建）。被重建的場景不可編輯但仍可檢視與加 annotation。接著介紹從任一端編輯、靠 **live USD stage** 在 macOS 與 visionOS 間複製內容的機制。"},{"t":536,"title":"Opt out of optimization","body":"若想跳過自動最佳化，在建立 session 時傳 **`.unmodified`** 參數。但停用最佳化後，複雜場景可能無法分享到 Vision Pro，`start` 會拋出 `assetUnshareable` 錯誤需自行處理；如何降低內容渲染成本可參考開發者文件。"},{"t":556,"title":"Editing Features","body":"回顧 USD 術語：一個 **stage** 由一或多個 **layer** 組成，layer 含 **prim**（可代表 3D 變換、mesh 等），而 **variant set** 可在 prim 上換入替代資料。為後續示範以 variant 改變家具位置與旋轉鋪陳基礎概念。"},{"t":610,"title":"USD Layout Variants","body":"示範在客廳場景設定改變家具位置與旋轉的 **layout variant**。在 USDKit 中選某個 variant 會改動 stage，編輯結果在 macOS 與 visionOS 間同步；macOS 工具列按鈕切換 variant、visionOS 反映新家具佈局，也可從 QuickLook 選單選 variant 反映回 Mac。"},{"t":617,"title":"Edit USD live using USDKit and Spatial Preview","body":"程式碼層面：用 USDKit 取得對應 prim 後，呼叫 `prim.variantSets?.setSelection(\"Layout\", variantName:)` 來套用指定的 layout variant，變更會透過 live stage 自動雙向同步。"},{"t":649,"title":"USD Stage Observations","body":"示範如何監聽來自 visionOS 的變更。用 `stage.addObserver(for: UsdStage.ObjectsDidChange.self)` 訂閱**標準 USD notice**，可從 `resyncedPaths` 取得哪些 prim path 改變，再逐一找出 annotation 並更新 UI。"},{"t":673,"title":"Annotation Spec","body":"說明文字 annotation 需要的資料：除了實際文字外，還要 author 與唯一 identifier（`AppleTextAnnotation` 規格）。只要 annotation 是被指定為 document annotation group 的 prim 的子節點，就能在 visionOS 上顯示。"},{"t":693,"title":"Metadata for Object Manipulation","body":"要讓 USD prim 在 visionOS 上能用手勢編輯，需在其上設定 **`spatialEditable`** metadata（customData 中 `apple` 字典的布林值）。使用者也可直接在 macOS 的 Preview 為 USD 資產設定此 metadata，之後就能在兩端移動該物件（示範把椅子移出窗外）。"},{"t":736,"title":"Session Options and Events","body":"用 `session.start` 的 **options** 控制 QuickLook 上開放的功能，預設啟用 `.annotations`、`.perObjectManipulation`、`.export`。同時可透過 `session.events` 訂閱非 USD 事件，例如動畫播放時間的變化（`timeChanged`）。"},{"t":758,"title":"Observe Session Progress","body":"用 **Progress Reporter** 監看 session 的分享進度，適合在大型資料同步到 Vision Pro 時於 macOS 顯示載入條。示範把播放與時間事件接上後，按播放鍵就能在兩端同步看到蜂鳥在窗外動畫。最後提到 visionOS 內建 **SharePlay**，協作者可加入同一 live session 一起即時審閱編輯。"},{"t":808,"title":"Next steps","body":"行動建議：採用 **USDKit Swift API**（Spatial Preview 與其無縫整合），既有 USD 安裝可做 bridging 轉移編輯。逐一探索 document 與 USD 兩種 preview session，僅需幾行程式即可整合進 Mac app，並善用 material override、攝影機視角、object manipulation、variant 與 annotation 等審閱工具。"}],"summary_en":["Presented by the visionOS team, this session introduces the new **Spatial Preview** framework, which lets people extend content from their Mac into the space around them on Apple Vision Pro. Building on **Mac Virtual Display**, you can stream 3D designs, Apple Immersive Video frames, spatial photos, and PDFs from a Mac while visionOS receives them in **QuickLook**, letting users inspect content immersively—walking around a living-room scene or switching camera viewpoints. Capabilities that previously lived only in the macOS Preview app are now exposed as an API for content creation and review apps.","Adoption is concise. First obtain an **endpoint**: reuse the active Mac Virtual Display device, or add a device picker UI to choose any nearby Vision Pro on the same iCloud account. Then create a preview session—**`DocumentPreviewSession`** for spatial photos, videos, and PDFs, or **`USDPreviewSession`** for 3D content. Once started, QuickLook opens and shows the content on Vision Pro with **no code required on the visionOS side**. For documents, `updateContents(url:)` swaps files within the same scene (e.g., a gallery of immersive renders), and a task observes session state, receiving an invalidated change when the scene is closed.","For 3D, pair Spatial Preview with the new **USDKit** Swift API. Load USD into a stage, start a `USDPreviewSession`, and Vision Pro shows it in a volumetric view—rotatable, or viewable at full scale immersively, with built-in camera viewpoints and wireframe material overrides. By default the content is automatically optimized (mesh decimation, texture downsampling, possible scene reconstruction); pass `.unmodified` to opt out, though very complex scenes may then become unshareable and throw an error. The headline feature is **live two-way editing**: a live USD stage syncs changes from both Mac and visionOS—switching layout variants, adding annotations, and moving objects marked with `spatialEditable` metadata all replicate across devices.","Advanced features include observing visionOS-side changes via `addObserver` for `UsdStage.ObjectsDidChange`, controlling exposed QuickLook capabilities with session options (`.annotations`, `.perObjectManipulation`, `.export`), subscribing to non-USD events like animation playback time, and reporting large-data sync progress with a Progress Reporter. **SharePlay is built in** on visionOS, so collaborators can join the same live session to review and edit together. The recommended path: use the USDKit Swift APIs, bridge from an existing USD installation if needed, and leverage material overrides, camera viewpoints, object manipulation, variants, and annotations as review tools."],"deepdive_en":[{"t":0,"title":"Introduction","body":"visionOS engineer Quincy German opens with his most-used feature, **Mac Virtual Display**, to frame the topic: in macOS and visionOS 27 it's even easier to preview Mac content on Vision Pro. He introduces the new **Spatial Preview** framework for leveraging visionOS spatial computing while working with Mac content, demoed via the macOS Preview app with 3D editing, photorealistic rendering, camera viewpoints, and spatial media output."},{"t":157,"title":"Learn about Spatial Preview","body":"Overview of the components: first select an **endpoint** pointing to a device (reuse an active Mac Virtual Display or add a device picker for nearby Vision Pros), then create a preview session. Sessions come in **document** (spatial photos, video, PDF) and **USD** (3D) flavors; once started, QuickLook launches and shows the content on Vision Pro with **no code needed on visionOS**."},{"t":210,"title":"Document Preview","body":"Demonstrates document preview with a still from Apple Immersive Video. Use `ConnectedSpatialEndpointObserver` to get the Mac Virtual Display endpoint, create a **`DocumentPreviewSession`** (with contentType and name), then `start` it and provide the content URL so it appears in QuickLook in immersive mode."},{"t":238,"title":"Document Preview Session with Device Picker","body":"Since Mac Virtual Display isn't always active, integrate the Spatial Preview **device picker** as a view in your UI. Use a SwiftUI sheet to control when it appears, then create the document preview session with the device endpoint selected in the picker."},{"t":320,"title":"Update Document Contents","body":"Builds a gallery of immersive architectural renders. `updateContents` **reuses** the scene launched at start, so the gallery uses a row of buttons calling `updateContents(url:)` to swap files in the same scene. A task observes session state—an invalidated change arrives when the scene is closed on visionOS; calling `close` ends the session and visionOS dismisses the scene."},{"t":396,"title":"USD Preview","body":"Shifts to 3D content, recommending USD fundamentals and USDKit videos first. Creating a **`USDPreviewSession`** mirrors documents but the content is a USDKit **stage**; after `start`, Vision Pro shows it in a volumetric view, with immersive full-scale viewing plus built-in camera viewpoints and wireframe material overrides, all with no extra setup."},{"t":456,"title":"Edit USD Live","body":"Notes that USD scenes can be too high-fidelity to render on Vision Pro, so the system auto-optimizes (**mesh decimation**, **texture downsampling**, full reconstruction if needed). Reconstructed scenes are non-editable but still viewable and annotatable. Introduces editing from either device via a **live USD stage** that replicates content between macOS and visionOS."},{"t":536,"title":"Opt out of optimization","body":"To skip auto-optimization, pass **`.unmodified`** when creating the session. With optimization off, complex scenes may be unshareable and `start` throws an `assetUnshareable` error to handle; see the docs for reducing rendering cost."},{"t":556,"title":"Editing Features","body":"Reviews USD terminology: a **stage** is composed of one or more **layers**, layers contain **prims** (transforms, meshes, etc.), and **variant sets** swap alternative data on a prim. Sets the stage for demonstrating furniture repositioning via variants."},{"t":610,"title":"USD Layout Variants","body":"Demonstrates **layout variants** that change furniture position and rotation in a living-room scene. Selecting a variant in USDKit changes the stage and syncs edits between macOS and visionOS; macOS toolbar buttons switch variants while visionOS reflects the new layout, and variants can also be picked from the QuickLook menu."},{"t":617,"title":"Edit USD live using USDKit and Spatial Preview","body":"In code, get the relevant prim via USDKit and call `prim.variantSets?.setSelection(\"Layout\", variantName:)` to apply the chosen layout variant; the change syncs both ways via the live stage."},{"t":649,"title":"USD Stage Observations","body":"Shows how to listen for changes from visionOS. Subscribe to **standard USD notices** with `stage.addObserver(for: UsdStage.ObjectsDidChange.self)`, iterate the `resyncedPaths` to find changed prims, and update annotations in the UI."},{"t":673,"title":"Annotation Spec","body":"Explains the data a text annotation needs: besides the text, an author and a unique identifier (`AppleTextAnnotation` spec). Annotations appear on visionOS as long as they're children of a prim designated as a document annotation group."},{"t":693,"title":"Metadata for Object Manipulation","body":"To make a USD prim editable via gestures on visionOS, set the **`spatialEditable`** metadata on it (a boolean in customData's `apple` dictionary). Users can also set this in macOS Preview, after which the object can be moved on both devices (demoed by moving a chair out the window)."},{"t":736,"title":"Session Options and Events","body":"Use the **options** on `session.start` to control which QuickLook features are available—`.annotations`, `.perObjectManipulation`, and `.export` are on by default. You can also subscribe to non-USD events via `session.events`, such as animation playback time (`timeChanged`)."},{"t":758,"title":"Observe Session Progress","body":"Use a **Progress Reporter** to monitor a session's sharing progress, ideal for a loading bar on macOS while large data syncs to Vision Pro. After wiring up time and playback events, pressing play animates a hummingbird outside the window on both apps. Notes that **SharePlay** is built in on visionOS so collaborators can review and edit in one live session."},{"t":808,"title":"Next steps","body":"Recommendations: adopt the **USDKit Swift API** (which Spatial Preview works seamlessly with), bridging from an existing USD installation to transfer edits. Explore both document and USD preview sessions—only a few lines to integrate into a Mac app—and take advantage of material overrides, camera viewpoints, object manipulation, variants, and annotations."}],"code":["// Send and update documents using the Spatial Preview framework\n\nimport SwiftUI\nimport SpatialPreview\nlet deviceObserver = ConnectedSpatialEndpointObserver()\n\nlet previewSession = DocumentPreviewSession(name: \"Immersive.aivu\", contentType: .aivu)\n\nfunc startPreview(contentURL: URL, endpoint: SpatialPreviewEndpoint) async throws {\n    let endpoint = try await deviceObserver.endpoint\n    try await previewSession.start(endpoint: endpoint)\n    try await previewSession.updateContents(url: contentURL)\n}\n\n@State var showDevicePicker: Bool = false\n\nvar body: some View {\n    ...\n    .sheet(isPresented: $showDevicePicker) {\n        SpatialPreviewDevicePicker(isPresented: $showDevicePicker) { endpoint in\n            showDevicePicker = false\n            Task {\n                try await startPreview(filename: filename, endpoint: endpoint)\n            }\n        }\n    }\n}","// Send and update documents using the Spatial Preview framework\n\nimport SwiftUI\nimport SpatialPreview\n\nForEach(contentURLs, id: \\.self) { url in\n    Button {\n        Task { try await previewSession?.updateContents(url: url) }\n    }\n}\n.task(id: previewSession.map { ObjectIdentifier($0) }) {\n    for await state in Observations({ session.state }) {\n        if state.isInvalidated {\n            previewSession = nil\n            break\n        }\n    }\n}\n\ntry await previewSession?.close()","// Edit USD live using USDKit and Spatial Preview\n\nimport SpatialPreview\nimport USDKit\n\nlet deviceObserver = ConnectedSpatialEndpointObserver()\n\nvar usdSession: USDPreviewSession?\n\nfunc shareStage(to endpoint: SpatialPreviewEndpoint) async throws -> USDPreviewSession {\n    let endpoint = try await deviceObserver.endpoint\n\n    let stageURL = Bundle.main.url(forResource: \"sampleScene\", withExtension: \"usdz\")\n    let stage = try USDStage.open(stageURL)\n    usdSession = USDPreviewSession(stage: stage)\n\n    try await usdSession?.start(endpoint: endpoint)\n}","// Optimization\n\nimport SpatialPreview\n\n\n\n\nlet endpoint = try await deviceObserver.endpoint\ndo {\n    try await usdSession.start(endpoint: endpoint, parameters: .unmodified)\n} catch USDPreviewSession.Error.assetUnshareable {\n    // Handle Asset Unshareable error\n}","// LayoutVariants.usda\n#usda 1.0\nover \"furniture\" (\n    variantSets = \"Layout\"\n    variants = { string Layout = \"LayoutA\" }\n)\n{\n    variantSet \"Layout\" = {\n        \"LayoutA\" {\n            // Default furniture position and rotation\n        }\n        \"LayoutB\" {\n            // Moves furniture prims to a different position and rotation\n        }\n        ...\n    }\n}","// Edit USD live using USDKit and Spatial Preview\n\nimport SpatialPreview\nimport USDKit\n\nfunc applyLayoutVariant(named layoutVariantName: String) throws {\n    let prim = stage.prim(at: SdfPath(\"/root/furniture\"))\n    try prim.variantSets?.setSelection(\"Layout\", variantName: layoutVariantName)\n}","// Edit USD live using Spatial Preview\n\nimport SpatialPreview\nimport USDKit\n\nlet observerToken: ObservationToken\n\nobserverToken = stage.addObserver(for: UsdStage.ObjectsDidChange.self) { notice in\n    for path in notice.resyncedPaths {\n        let prim = notice.stage.prim(at: path)\n        guard prim.isValid else { continue }\n        if prim.isAnnotation {\n            // Handle annotation change\n            break\n        }\n    }\n}","// Annotation spec example\n\nAppleTextAnnotation {\n    // The textual representation of this annotation\n    string text\n\n    // The identifier for this specific author\n    uniform string author\n\n    // An identifier that is unique to your data tracking system\n    uniform string identifier\n}\n\n/__documentAnnotationGroup__","// Metadata required for object manipulation in Quick Look\n\ncustomData = {\n    dictionary apple = {\n        bool spatialEditable = 1\n    }\n}","// Spatial Preview session options and events\n\nimport SpatialPreview\nimport USDKit\n\nsession.start(endpoint: endpoint, options: [.annotations, .perObjectManipulation, .export])\n\nfunc listenForEvents(session: USDPreviewSession) async {\n    for await event in session.events {\n        if case .timeChanged(let time) = event {\n            playbackModel.timeCode = time\n        } else if case .playbackStateChanged(let isPlaying) = event {\n            playbackModel.playbackStateChanged(isPlaying)\n        }\n    }\n}","// Observe Spatial Preview session progress\n\nimport SpatialPreview\nimport USDKit\n\n@State private var sessionProgress: Double = 0\n\nvar body: some View {\n    ...\n    .task(id: usdSession.map { ObjectIdentifier($0) }) {\n        guard let session = usdSession else { return }\n        for await fraction in Observations({ session.progress.fractionCompleted }) {\n            sessionProgress = fraction\n
