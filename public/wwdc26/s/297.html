<script id="d" type="application/json">{"s":{"id":"297","title":"Best practices for integrating visual intelligence in your app","gloss":"在 App 中整合視覺智慧的最佳實務","category":"ai","categoryLabel":"AI 與機器學習","duration":1065,"url":"https://developer.apple.com/videos/play/wwdc2026/297/","takeaway":"用 **Visual Intelligence** 搭配 App Intents 與 Vision 特徵比對，讓使用者以相機影像在你的 App 中探索內容。","chapters":[[7,"Introduction"],[122,"Defining your content"],[201,"Define the content you want to return as an App Entity"],[303,"Implementing a query"],[339,"Adopt IntentValueQuery to return results"],[384,"Build a catalog of albums with precomputed feature prints"],[405,"Search the catalog for albums matching the captured image"],[498,"Opening results"],[507,"Create an open intent to land users on the right screen"],[603,"Mac and iPad adoption"],[725,"Use UnionValue to return multiple visual search result types"],[738,"Expand the IntentValueQuery to return the UnionValue"],[747,"Returning multiple result types"],[776,"Continuing search in your app"],[793,"Provide a link to in-app search"],[867,"System store integrations"],[924,"Request calendar access and fetch upcoming concerts"],[942,"Filter for upcoming events that match known artists in our catalog"],[944,"Observe newly created events"],[1036,"Next steps"]],"points":[{"text":"把可回傳的內容定義成 **`AppEntity`**，並用 `IntentValueQuery` 接收 `SemanticContentDescriptor` 回傳視覺搜尋結果。","hot":true},{"text":"以 Vision 的 `GenerateImageFeaturePrintRequest` 預先計算**特徵指紋（feature print）**，再用 `distance(to:)` 比對拍攝影像。","hot":false},{"text":"用 `OpenIntent` 讓搜尋結果直接開啟到正確畫面，並用 `@UnionValue` 回傳多種結果類型（如專輯與演唱會）。","hot":false},{"text":"透過 `@AppIntent(schema: .visualIntelligence.semanticContentSearch)` 提供「**在 App 中繼續搜尋**」的入口。","hot":false},{"text":"整合系統 store 與 **EventKit**，請求行事曆權限抓取演唱會並監聽 `EKEventStoreChanged` 更新。","hot":false}],"apis":["VisualIntelligence","AppIntents","AppEntity","IntentValueQuery","SemanticContentDescriptor","Vision","GenerateImageFeaturePrintRequest","FeaturePrintObservation","OpenIntent","UnionValue","EventKit"],"audience":"**想讓 App 內容能透過相機與視覺智慧被探索**的 iOS／iPad／Mac 開發者。","gloss_en":"Best practices for integrating visual intelligence in your app","takeaway_en":"Use **Visual Intelligence** together with App Intents and Vision feature matching to let users discover content in your app from camera imagery.","points_en":[{"text":"Define returnable content as an **`AppEntity`**, and use `IntentValueQuery` to receive a `SemanticContentDescriptor` and return visual search results.","hot":true},{"text":"Precompute a **feature print** with Vision's `GenerateImageFeaturePrintRequest`, then compare it against the captured image using `distance(to:)`.","hot":false},{"text":"Use `OpenIntent` to open search results directly to the right screen, and `@UnionValue` to return multiple result types (such as albums and concerts).","hot":false},{"text":"Provide a \"**continue searching in the app**\" entry point via `@AppIntent(schema: .visualIntelligence.semanticContentSearch)`.","hot":false},{"text":"Integrate the system store with **EventKit**, requesting calendar access to fetch concerts and listening for `EKEventStoreChanged` updates.","hot":false}],"audience_en":"iOS/iPad/Mac developers who want **their app's content to be discoverable through the camera and visual intelligence**.","summary":["本場由 System Experience 團隊的 ML 工程師 David 主講，示範如何讓你的 App 接入 **Visual Intelligence**。今年除了新增加入聯絡人、儲存多筆行事曆事件、醫療裝置讀數記錄等能力，更把 Visual Intelligence 帶到 iPadOS 與 macOS。主講以一款音樂探索 App 為例：使用者只要對專輯封面拍照或截圖、按下「反白搜尋」，就能在 Visual Intelligence 裡看到比對到的專輯與相關演唱會，甚至擷取演唱會貼文後自動把事件加進行事曆，再回到 App 中看到對應內容。","整合的核心建立在 **App Intents** 與 **VisualIntelligence** 兩個框架之上，分四步走。首先把要回傳的內容定義成 **App Entity**（例如 AlbumEntity），並透過 displayRepresentation 提供標題、副標與縮圖，因為結果列只有約三行文字與一張縮圖的空間。接著實作 **IntentValueQuery**，它的 values(for:) 會收到系統傳來、內含擷取影像的 **SemanticContentDescriptor**；範例用 **Vision** 框架的 **GenerateImageFeaturePrintRequest** 先為目錄中的專輯預先計算 **feature print**，查詢時再對輸入影像產生 feature print 並以距離門檻比對、依相似度排序回傳。最後用 **OpenIntent** 讓使用者點選結果時直接落在正確畫面。","同一套程式碼幾乎不需修改即可跨 iOS、iPadOS、macOS 運作，但要留意平台差異：iOS 多半透過相機拍攝實體物件，Mac 與 iPad 則以截圖為主，且 Mac 的輸入 pixel buffer 可能大上許多，必要時應考慮縮放。想一次回傳多種結果型別（專輯與演唱會）時，可用 **@UnionValue** 列舉包裝；若想讓使用者延伸搜尋，採用 **semanticContentSearch** schema 帶著同樣的影像情境跳進 App 內完整搜尋畫面並預先填入結果。","除了「提供結果給 Visual Intelligence」，另一個整合方向是「從 Visual Intelligence 接收資料」——透過 **system store integrations**。Visual Intelligence 擷取的事件會寫入系統儲存，App 端只要照常用 **EventKit**（行事曆）、**Contacts**（聯絡人）、**HealthKit**（醫療讀數）讀取即可自動取得這些資料。範例用 EKEventStore 請求權限、篩出與目錄藝人相符的近期活動，並監聽 .EKEventStoreChanged 讓新事件自動出現。實務重點是：結果要快且依相關性排序、善用兩種整合點覆蓋使用者跨裝置的情境。"],"deepdive":[{"t":7,"title":"Introduction","body":"David 開場說明 **Visual Intelligence** 自推出以來讓人們快速了解周遭環境或 iPhone 螢幕上的內容，今年更新增加入聯絡人、儲存多筆行事曆事件、醫療裝置記錄等能力，並擴展到 **iPad 與 macOS**。他以自己想做的音樂探索 App 為例，預告整場將從定義內容、實作查詢、跨平台到 system store 整合逐步建構。"},{"t":122,"title":"Defining your content","body":"整合 Image Search 同時用到 **App Intents** 與 **VisualIntelligence** 框架。第一步是用 **App entities**（App 中的「名詞」）定義要回傳的內容，本例先定義代表專輯的 entity，作為搜尋結果的回傳型別。"},{"t":201,"title":"Define the content you want to return as an App Entity","body":"在程式中定義 **AlbumEntity**，加入標準的 defaultQuery 與 typeDisplayRepresentation，並以 id、name、artistName、封面縮圖資料描述內容。**displayRepresentation** 決定結果如何呈現——這是使用者第一眼看到的東西，空間只有約三行文字與縮圖，因此應放最關鍵的辨識資訊（專輯名與藝人），並建議使用縮圖尺寸而非全解析度圖。"},{"t":303,"title":"Implementing a query","body":"定義好 entity 後，靠 **IntentValueQuery** 讓 Visual Intelligence 查詢 App。它是一個輕量查詢協定，若先前已為 Siri 採用 App Intents 可能已有此查詢；與一般查詢的關鍵差異在於輸入是內含擷取影像資訊的 **SemanticContentDescriptor**。"},{"t":339,"title":"Adopt IntentValueQuery to return results","body":"採用 **IntentValueQuery** 協定並實作 values(for:)，輸入為 SemanticContentDescriptor。實作中從 input 取出 **pixelBuffer**，傳給 catalog.search 取得相符專輯，再以 VisualSearchResult.album 包裝回傳。"},{"t":384,"title":"Build a catalog of albums with precomputed feature prints","body":"本例選擇在裝置上以本地目錄搜尋，並使用 **Vision** 框架的預訓練電腦視覺模型。每筆目錄項目存有一個 **feature print**（影像的精簡數值表示），透過 **GenerateImageFeaturePrintRequest** 產生；關鍵是預先為目錄中所有專輯算好 feature print，避免在查詢當下才計算而拖慢速度。"},{"t":405,"title":"Search the catalog for albums matching the captured image","body":"查詢時先用 **VideoToolbox** 把 pixelBuffer 轉成 CGImage，再為它產生 feature print，與目錄中預算好的 feature print 逐一以 **distance** 比較，套用最大距離門檻濾掉不相似的結果，最後依相似度排序回傳前幾筆。建議限制回傳數量以確保相關性，找不到時回傳空陣列由系統處理。"},{"t":498,"title":"Opening results","body":"為了讓使用者點選結果後落在 App 正確畫面，需要一個 **OpenIntent**。當使用者在 Image Search 結果中點選某張專輯時，系統會帶著選取的 entity 呼叫此 intent。"},{"t":507,"title":"Create an open intent to land users on the right screen","body":"**OpenAlbumIntent** 採用 OpenIntent，以 @Parameter 接收 AlbumEntity，在 perform 中導向專輯詳情頁。若已為其他功能採用 App Intents 而有同一 entity 的 OpenIntent，可直接重用；並建議保持輕量，因為它在 App 進入前景時執行，沉重載入應留到畫面出現後。"},{"t":603,"title":"Mac and iPad adoption","body":"今年 Visual Intelligence 也登上 iPadOS 與 macOS，且 IntentValueQuery、entities、OpenIntent 等同一套程式碼幾乎不需改動即可跨平台。差異在於入口：iOS 多用相機拍實體物件，Mac 與 iPad 主要透過截圖；此外 Mac 的輸入 pixel buffer 可能遠大於 iPhone，必要時應考慮縮放。"},{"t":725,"title":"Use UnionValue to return multiple visual search result types","body":"由於一個 App 只能有一個接受 SemanticContentDescriptor 的 IntentValueQuery，要回傳多種型別時用 **@UnionValue** 列舉，為每種 entity（album 與 concert）各一個 case。有了兩種 entity，也需要為每種各自準備一個 **OpenIntent**。"},{"t":738,"title":"Expand the IntentValueQuery to return the UnionValue","body":"更新查詢以回傳 union 型別：先搜出最相符的專輯，再用這些專輯的藝人名找出附近的演唱會，把兩者合併成單一結果清單。這示範了如何超越單純像素比對，依情境衍生出完全不同類型（演唱會）的結果。"},{"t":747,"title":"Returning multiple result types","body":"鼓勵開發者思考 App 適不適合回傳多種結果，以及除了像素相符之外還能回傳哪些內容。本例透過影像相似度找到專輯，再用藝人名串接出附近演唱會，展現依情境發揮創意的回傳設計。"},{"t":776,"title":"Continuing search in your app","body":"若使用者沒有立刻找到想要的結果，應提供延伸到 App 內繼續搜尋的途徑，這可用 **semanticContentSearch** schema 達成。"},{"t":793,"title":"Provide a link to in-app search","body":"建立符合 **semanticContentSearch** schema 的 intent，系統會自動提供 semanticContent 屬性（即先前帶有 pixel buffer 的 SemanticContentDescriptor）。在 perform 中導向 App 內搜尋畫面並預先填入結果，讓使用者按下「More results」即進入完整搜尋體驗，可呈現比結果列更深入的篩選與分類。"},{"t":867,"title":"System store integrations","body":"除了提供結果給 Visual Intelligence，App 也能透過 **system store integrations** 接收資料。Visual Intelligence 的其他動作會把資料寫入系統儲存，作為共享系統資料的橋樑：事件以 **EventKit** 讀取、聯絡人以 **Contacts**、醫療裝置讀數以 **HealthKit**。若 App 已從這些框架讀資料，Visual Intelligence 會自動成為新的輸入來源。"},{"t":924,"title":"Request calendar access and fetch upcoming concerts","body":"本例的 **UpcomingConcertManager** 使用 EKEventStore，透過 requestFullAccessToEvents 請求行事曆讀取權限，授權後才抓取近期活動並更新授權狀態。"},{"t":942,"title":"Filter for upcoming events that match known artists in our catalog","body":"以 predicateForEvents 查詢未來約 90 天內的事件，再篩出標題與目錄中藝人名相符的活動，讓 App 只關注與使用者音樂興趣相關的演唱會。"},{"t":944,"title":"Observe newly created events","body":"加入對 **.EKEventStoreChanged** 通知的監聽，透過 NotificationCenter 的 async 通知序列，讓包含由 Visual Intelligence 建立在內的新事件能自動重新抓取並出現在 App 中。相同模式也適用於 Contacts（CNContactStore）與 HealthKit（HKHealthStore）。"},{"t":1036,"title":"Next steps","body":"總結 Visual Intelligence 提供兩個強大整合點：透過 **Image Search** 提供結果、透過 **system store integrations** 接收資料；並隨著它登上 iOS、iPadOS、macOS 讓整合觸及跨裝置的使用者。建議查閱開發者文件，並延伸觀看 App Intents 與 Vision 框架的相關場次。"}],"summary_en":["Presented by David, an ML engineer on the System Experience team, this session shows how to bring your app into **Visual Intelligence**. This year Apple adds new capabilities like adding to contacts, saving multiple calendar events, and medical-device logging, and extends Visual Intelligence to iPadOS and macOS. Using a music-discovery app as the example, a user can photograph or screenshot album artwork, tap Highlight to Search, and see matching albums and nearby concerts inside Visual Intelligence — and even capture a concert post so the event lands in the calendar and shows up automatically back in the app.","The integration is built on the **App Intents** and **VisualIntelligence** frameworks in four steps. First, model the content you return as an **App Entity** (e.g. AlbumEntity) with a displayRepresentation supplying title, subtitle, and thumbnail, since the result row only affords about three lines of text and one image. Next, implement an **IntentValueQuery** whose values(for:) receives a **SemanticContentDescriptor** holding the captured image; the example uses the **Vision** framework's **GenerateImageFeaturePrintRequest** to precompute **feature prints** for the catalog, then at query time generates a feature print for the input and ranks candidates by distance under a threshold. Finally, an **OpenIntent** takes users straight to the right screen when they tap a result.","The same code runs across iOS, iPadOS, and macOS with minimal change, but mind the platform differences: iOS users mostly capture physical objects with the camera while Mac and iPad lean on screenshots, and the Mac input pixel buffer can be much larger, so consider resizing. To return more than one result type (albums and concerts) wrap them in a **@UnionValue** enum, and to let users keep searching, adopt the **semanticContentSearch** schema to carry the same image context into your full in-app search experience with pre-populated results.","Beyond providing results, the other direction is receiving data via **system store integrations**. Visual Intelligence writes extracted data into system stores that your app reads normally with **EventKit** (events), **Contacts**, and **HealthKit** (medical readings) — so an app that already reads those frameworks gains Visual Intelligence as a new input source for free. The example requests calendar access with EKEventStore, filters for upcoming events matching catalog artists, and observes .EKEventStoreChanged so new events appear automatically. The practical takeaways: return results fast and ranked, and use both integration points to cover users across their devices."],"deepdive_en":[{"t":7,"title":"Introduction","body":"David opens by noting how **Visual Intelligence** lets people learn about their surroundings or what's on their iPhone screen, with this year adding contacts, multiple calendar events, and medical-device logging plus expansion to **iPad and macOS**. He frames the whole session around building a music-discovery app, walking from defining content through implementing a query, cross-platform support, and system store integrations."},{"t":122,"title":"Defining your content","body":"Image Search integration uses both the **App Intents** and **VisualIntelligence** frameworks. The first step is defining the content to return using **App entities** — the nouns of your app — here an album entity that serves as the result type."},{"t":201,"title":"Define the content you want to return as an App Entity","body":"An **AlbumEntity** is defined with a standard defaultQuery and typeDisplayRepresentation, plus id, name, artistName, and cover-art thumbnail data. Its **displayRepresentation** controls how each result appears — the first thing people see, with room for only about three lines of text and a thumbnail — so put the key identifying info (album name and artist) there and prefer thumbnail-sized images over full-resolution assets."},{"t":303,"title":"Implementing a query","body":"After defining the entity, an **IntentValueQuery** lets Visual Intelligence query the app. It's a lightweight query protocol you may already have from adopting App Intents for Siri; the key difference for Visual Intelligence is the input — a **SemanticContentDescriptor** carrying information about the captured image."},{"t":339,"title":"Adopt IntentValueQuery to return results","body":"Adopt the **IntentValueQuery** protocol and implement values(for:) with a SemanticContentDescriptor input. The body grabs the **pixelBuffer** from the input, passes it to catalog.search to get matching albums, and returns them wrapped as VisualSearchResult.album."},{"t":384,"title":"Build a catalog of albums with precomputed feature prints","body":"The example searches on device against a local catalog using the **Vision** framework's pretrained models. Each catalog entry stores a **feature print** — a compact numerical representation of an image — produced via **GenerateImageFeaturePrintRequest**; crucially these are precomputed for every album so no computation happens at query time, keeping the query fast."},{"t":405,"title":"Search the catalog for albums matching the captured image","body":"At query time the pixelBuffer is converted to a CGImage with **VideoToolbox**, a feature print is generated for it, and it's compared against the precomputed prints by **distance** under a maximum threshold, then sorted by similarity and returned top-N. Apple recommends limiting the result count for relevance and returning an empty array when there are no good matches, which the system handles."},{"t":498,"title":"Opening results","body":"To land people on the right screen after they tap a result, you need an **OpenIntent**. When a user taps an album in the Image Search results, the system calls this intent with the selected entity."},{"t":507,"title":"Create an open intent to land users on the right screen","body":"**OpenAlbumIntent** adopts OpenIntent, takes an AlbumEntity via @Parameter, and navigates to the album detail page in perform. If you already have an OpenIntent for the entity from adopting App Intents, reuse it; keep it lightweight since it runs as the app comes to the foreground, deferring heavy loading until after the view appears."},{"t":603,"title":"Mac and iPad adoption","body":"Visual Intelligence comes to iPadOS and macOS this year, and the same IntentValueQuery, entities, and OpenIntent code works across platforms with minimal change. The differences are entry points — iOS favors camera capture of physical objects while Mac and iPad lean on screenshots — and the Mac input pixel buffer can be much larger than on iPhone, so consider resizing."},{"t":725,"title":"Use UnionValue to return multiple visual search result types","body":"Since an app can have only one IntentValueQuery accepting a SemanticContentDescriptor, returning multiple types uses a **@UnionValue** enum with a case per entity (album and concert). With two entity types you also need a separate **OpenIntent** for each."},{"t":738,"title":"Expand the IntentValueQuery to return the UnionValue","body":"The query is updated to return the union type: search for the top matching albums first, then use those albums' artists to find nearby concerts, and combine both into one results list — showing how to go beyond pixel matching to derive a completely different kind of result."},{"t":747,"title":"Returning multiple result types","body":"Consider whether returning multiple result types makes sense, and what content your app can return beyond pixel matches. The example finds albums by image similarity and then surfaces nearby concerts via artist names, illustrating creative, context-driven result design."},{"t":776,"title":"Continuing search in your app","body":"If people don't immediately find what they want, provide an easy way to continue the search inside the app, which the **semanticContentSearch** schema enables."},{"t":793,"title":"Provide a link to in-app search","body":"Create an intent conforming to the **semanticContentSearch** schema; the system supplies the semanticContent property automatically — the same SemanticContentDescriptor with the pixel buffer. In perform, navigate to an in-app search view pre-populated with results so tapping More results drops users into the full search experience with filters and categories beyond the results sheet."},{"t":867,"title":"System store integrations","body":"Besides providing results, an app can receive data through **system store integrations**. Visual Intelligence's other actions write data to system stores that bridge to shared system data: events via **EventKit**, contacts via **Contacts**, medical-device readings via **HealthKit**. An app that already reads those frameworks gets Visual Intelligence as a new input source automatically."},{"t":924,"title":"Request calendar access and fetch upcoming concerts","body":"The **UpcomingConcertManager** uses EKEventStore, requesting calendar read access via requestFullAccessToEvents, and only after authorization fetches upcoming events and updates the authorization status."},{"t":942,"title":"Filter for upcoming events that match known artists in our catalog","body":"It queries events in roughly the next 90 days with predicateForEvents, then filters for those whose title matches an artist name in the catalog, so the app focuses only on concerts relevant to the user's music interests."},{"t":944,"title":"Observe newly created events","body":"A notification observer on **.EKEventStoreChanged** via NotificationCenter's async sequence re-fetches so that new events — including ones created by Visual Intelligence — appear automatically. The same pattern applies to Contacts (CNContactStore) and HealthKit (HKHealthStore)."},{"t":1036,"title":"Next steps","body":"The recap: Visual Intelligence offers two integration points — providing results via **Image Search** and receiving data via **system store integrations** — and now reaches users across iOS, iPadOS, and macOS. Apple points to the developer documentation and related App Intents and Vision sessions to go further."}],"code":[]},"related":[{"id":"344","title":"Code-along: Make your app available to Siri","gloss":"程式碼實作：讓你的 App 可被 Siri 使用","gloss_en":"Code-along: Make your app available to Siri","category":"ai","categoryLabel":"AI 與機器學習"},{"id":"240","title":"Build intelligent Siri experiences with App Schemas","gloss":"用 App Schemas 打造智慧 Siri 體驗","gloss_en":"Build intelligent Siri experiences with App Schemas","category":"ai","categoryLabel":"AI 與機器學習"},{"id":"310","title":"What’s new in Shortcuts","gloss":"捷徑有什麼新東西","gloss_en":"What's new in Shortcuts","category":"ai","categoryLabel":"AI 與機器學習"},{"id":"343","title":"Explore advanced App Intents features for Siri and Apple Intelligence","gloss":"探索 Siri 與 Apple Intelligence 的進階 App Intents 功能","gloss_en":"Explore advanced App Intents features for Siri and Apple Intelligence","category":"ai","categoryLabel":"AI 與機器學習"},{"id":"345","title":"Discover new capabilities in the App Intents framework","gloss":"探索 App Intents 框架的新能力","gloss_en":"Discover new capabilities in the App Intents framework","category":"other","categoryLabel":"其他"}]}</script>
