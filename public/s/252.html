<script id="d" type="application/json">{"s":{"id":"252","title":"Design no-code games with Reality Composer Pro 3","gloss":"用 Reality Composer Pro 3 設計無程式碼遊戲","category":"graphics","categoryLabel":"圖形與遊戲","duration":1133,"url":"https://developer.apple.com/videos/play/wwdc2026/252/","takeaway":"用 Reality Composer Pro 3 的 ScriptGraph 不寫程式就能做出 3D 互動內容與遊戲,必要時再用程式碼接收事件做進階整合。","chapters":[[0,"Introduction"],[62,"Meet ScriptGraph"],[110,"A wish..."],[156,"Build the game"],[676,"Advanced techniques"],[1043,"Squirrel Talk"],[1112,"Next steps"]],"points":[{"text":"**ScriptGraph** 讓你在 Reality Composer Pro 3 裡用**節點視覺化、不寫程式**就能建立 3D 互動內容與遊戲。","hot":true},{"text":"課程以實作示範**從零打造一款遊戲**的完整流程。","hot":false},{"text":"「Advanced techniques」展示進階用法,讓 no-code 內容也能更靈活。","hot":false},{"text":"可用程式碼透過 **scene.subscribe(forEventName:)** 接收 ScriptGraph 發出的自訂事件(如 \"squirrelTalk\")。","hot":false},{"text":"事件可搭配 RealityView 的 **Attachment** 把 SwiftUI 視圖綁到 3D 內容上呈現。","hot":false}],"apis":["ScriptGraph","RealityKit","Scene.subscribe(forEventName:)","Attachment"],"audience":"**想用 Reality Composer Pro 3 製作 3D 遊戲或互動內容、但不想寫大量程式的設計師與創作者。**","gloss_en":"Design no-code games with Reality Composer Pro 3","takeaway_en":"Use ScriptGraph in Reality Composer Pro 3 to build interactive 3D content and games without writing code, then drop into code to receive events for advanced integration when needed.","points_en":[{"text":"**ScriptGraph** lets you build interactive 3D content and games in Reality Composer Pro 3 **visually with nodes, no code required**.","hot":true},{"text":"The session walks through the complete process of **building a game from scratch** with a hands-on demo.","hot":false},{"text":"The \"Advanced techniques\" section shows advanced usage that makes no-code content even more flexible.","hot":false},{"text":"From code, receive custom events emitted by ScriptGraph (such as \"squirrelTalk\") via **scene.subscribe(forEventName:)**.","hot":false},{"text":"Events can pair with RealityView's **Attachment** to bind SwiftUI views onto 3D content for presentation.","hot":false}],"audience_en":"**Designers and creators who want to build 3D games or interactive content with Reality Composer Pro 3 without writing much code.**","summary":["Apple 創意總監 Saschka Unseld 示範如何在 **Reality Composer Pro 3** 裡，完全不寫程式地用 **ScriptGraph** 從零打造一款 RealityKit 遊戲。ScriptGraph 是 Reality Composer Pro 的節點式視覺化腳本系統，採用 **event-driven** 邏輯：監聽 Pinch、Drag 等事件，用節點做運算，再透過 Set 節點修改 entity 的 component。最棒的是能直接在編輯器與 Vision Pro 上即時測試與迭代。","全場以一隻睡著守著堅果的小松鼠為主軸，玩家可以伸手把堅果偷走並拖動，引導松鼠回家。建構流程從讓堅果可拖曳開始：先加上 **Input Target**、**Collision**、**Hover Effect** component，再建一個 dragNut ScriptGraph，用 `On Drag` 事件驅動 `Set Transform`。接著用 Multiply 與 public **Input variable**（dragSpeed）微調手感，並透過 **Override** 讓同一份邏輯在不同 Nut 上有各自設定。為了更有重量感，再加入 **Physics Body**，改用 `Add Force`、計算 dragDelta，並在拖曳時用 `Set PhysicsBodyComponent` 關掉重力、調高 linear damping。","進階段落示範如何用 **Prototyped Subgraph** 整理並重用邏輯（例如「偵測 bool 變化」），以及用 **Custom Node Library** 建立帶參數的 **Custom Event**（nutIsDragged），讓 Nut 的 ScriptGraph 把世界座標傳給松鼠的 ScriptGraph 來驅動旋轉。松鼠生氣的表情則透過 `Set Material Parameter` 切換 Shader Graph 裡的材質。最後要做 SwiftUI 對話泡泡時，因為 ScriptGraph 的 Scene Event 也能從 Swift 收送，講者改用 `Run with Xcode`，由 Reality Composer Pro 3 自動產生 Xcode 專案，並用 Coding Intelligence 產生訂閱 `squirrelTalk` event、以 SwiftUI Attachment 顯示泡泡的程式碼。","整體要點是：ScriptGraph 讓設計師能快速 mock up 並反覆迭代互動感受，無需寫程式即可完成大部分遊戲邏輯，而在需要 SwiftUI 介面或自訂行為時，又能無縫橋接到 Swift。延伸資源包含下載 Reality Composer Pro 3 與 Apple Developer 網站上的完整 Squirrel 範例專案。"],"deepdive":[{"t":0,"title":"Introduction","body":"創意總監 Saschka Unseld 開場，強調快速 mock up 與反覆迭代對創意工作的重要性，並表示 **Reality Composer Pro 3** 讓他不寫一行程式就能從零做出 RealityKit 遊戲。本場聚焦於 ScriptGraph，適合想快速把點子做出來的創作者。"},{"t":62,"title":"Meet ScriptGraph","body":"介紹 **ScriptGraph** 是 Reality Composer Pro 的節點式視覺化腳本，透過 **event-driven** 邏輯運作：監聽 Pinch、Drag 與自訂事件來驅動動畫與互動。最大優勢是可直接在編輯器與 **Vision Pro** 上即時測試與迭代。"},{"t":110,"title":"A wish...","body":"以「願望」起點說明遊戲構想：一隻守著堅果睡著、卻沒注意夜幕將至的小松鼠。玩家可在 Vision Pro 上伸手偷走堅果並自由拖動，藉此引導松鼠回家。"},{"t":156,"title":"Build the game","body":"開始建構：為堅果加上 **Input Target**、**Collision**、**Hover Effect** component 使其可注視與高亮，再建立 dragNut ScriptGraph，用 `On Drag` 事件觸發 `Set Transform`，把 Scene Location 接到 translation。接著用 Play 與 Preview on Device 在 Vision Pro 即時測試。"},{"t":676,"title":"Advanced techniques","body":"進階技巧：用 `Multiply by Number` 與 public **Input variable** dragSpeed 微調手感、以 **Override** 讓不同 Nut 各有設定；加入 **Physics Body** 後改用 `Add Force` 並計算 dragDelta，拖曳時以 `Set PhysicsBodyComponent` 關閉重力、提高 linear damping。再以 **Prototyped Subgraph** 重用邏輯，並用 **Custom Node Library** 建立帶 nutPosition 參數的 **Custom Event** nutIsDragged，跨 entity 傳遞並驅動松鼠旋轉與材質切換。"},{"t":1043,"title":"Squirrel Talk","body":"為松鼠加上 SwiftUI 語音泡泡。因 ScriptGraph 的 **Scene Event** 也能從 Swift 收送，講者切到 `Run with Xcode`，讓 Reality Composer Pro 3 自動產生 Xcode 專案，並用 `Send Scene Event`（squirrelTalk，帶 sayThis 字串）通知 Swift。再以 Coding Intelligence 產生訂閱該 event 並用 SwiftUI **Attachment** 顯示泡泡的程式碼。"},{"t":1112,"title":"Next steps","body":"總結 ScriptGraph 如何幫助快速勾勒點子、迭代互動感受並實現願望，並預告還能加入松鼠行走跳躍、可拖曳的葉子與 visionOS ornament 等。鼓勵下載 Reality Composer Pro 3 與 Apple Developer 網站上的完整 Squirrel 範例專案。"}],"summary_en":["Apple Creative Director Saschka Unseld shows how to build a RealityKit game from scratch in **Reality Composer Pro 3** without writing a single line of code, using **ScriptGraph** — its node-based visual scripting. ScriptGraph works through **event-driven** logic: listen to events like Pinch and Drag, run logic on the data with nodes, then write back to an entity's components with Set nodes. The standout is being able to test and iterate live, both in the editor and on Vision Pro.","The session centers on a sleeping squirrel guarding a nut; the player reaches out, steals the nut, and drags it to guide the squirrel home. Making the nut draggable starts with adding **Input Target**, **Collision**, and **Hover Effect** components, then a dragNut ScriptGraph using `On Drag` to drive `Set Transform`. A `Multiply` node and a public **Input variable** (dragSpeed) tune the feel, with **Overrides** letting one graph behave differently per nut. For weight, a **Physics Body** is added, switching to `Add Force`, computing a dragDelta, and using `Set PhysicsBodyComponent` to disable gravity and raise linear damping while dragging.","Advanced techniques cover **Prototyped Subgraphs** for cleaning up and reusing logic (e.g. detecting a bool change), and a **Custom Node Library** for a parameterized **Custom Event** (nutIsDragged) so the nut's graph passes its world position to the squirrel's graph to drive rotation. The squirrel's upset face is driven via `Set Material Parameter` toggling a Shader Graph texture. For a SwiftUI speech bubble, because ScriptGraph Scene Events can also be sent and received from Swift, the presenter switches to `Run with Xcode` — Reality Composer Pro 3 generates the Xcode project — and uses Coding Intelligence to write code that subscribes to the `squirrelTalk` event and shows the bubble as a SwiftUI Attachment.","The takeaway: ScriptGraph lets designers quickly mock up and iterate on how interactions feel, covering most game logic with no code, while bridging seamlessly to Swift when a SwiftUI interface or custom behavior is needed. Follow-ups include downloading Reality Composer Pro 3 and the full Squirrel sample project from the Apple Developer website."],"deepdive_en":[{"t":0,"title":"Introduction","body":"Creative Director Saschka Unseld opens by stressing how fast mock-ups and iteration matter for creative work, noting that **Reality Composer Pro 3** lets him build a RealityKit game from scratch without a single line of code. The session is aimed at creatives who want to quickly bring an idea to life with ScriptGraph."},{"t":62,"title":"Meet ScriptGraph","body":"Introduces **ScriptGraph** as Reality Composer Pro's node-based visual scripting that works through **event-driven** logic: listening to Pinch, Drag, and custom events to drive animation and interaction. The key advantage is testing and iterating live in the editor and on **Vision Pro**."},{"t":110,"title":"A wish...","body":"Frames the game as starting from a wish: a little squirrel asleep guarding a nut, unaware night is falling. On Vision Pro the player can reach out, steal the nut, and freely drag it to guide the squirrel back home."},{"t":156,"title":"Build the game","body":"Building begins: the nut gets **Input Target**, **Collision**, and **Hover Effect** components to be gaze-able and highlighted, then a dragNut ScriptGraph uses `On Drag` to trigger `Set Transform`, wiring Scene Location into translation. It's tested live via Play and Preview on Device on Vision Pro."},{"t":676,"title":"Advanced techniques","body":"Advanced techniques: a `Multiply by Number` node plus a public **Input variable** dragSpeed tune feel, with **Overrides** per nut; adding a **Physics Body** switches to `Add Force` with a computed dragDelta, and `Set PhysicsBodyComponent` disables gravity and raises linear damping while dragging. **Prototyped Subgraphs** reuse logic, and a **Custom Node Library** defines a **Custom Event** nutIsDragged (with nutPosition) to pass data across entities and drive the squirrel's rotation and material change."},{"t":1043,"title":"Squirrel Talk","body":"Adds a SwiftUI speech bubble for the squirrel. Since ScriptGraph **Scene Events** can be sent/received from Swift, the presenter switches to `Run with Xcode` — Reality Composer Pro 3 auto-generates the project — and uses `Send Scene Event` (squirrelTalk, carrying a sayThis string). Coding Intelligence then writes the code to subscribe to the event and show the bubble as a SwiftUI **Attachment**."},{"t":1112,"title":"Next steps","body":"Wraps up on how ScriptGraph helps sketch ideas, iterate on interaction feel, and realize a wish, previewing additions like the squirrel walking and jumping, draggable leaves, and a visionOS ornament. Encourages downloading Reality Composer Pro 3 and the full Squirrel sample project from the Apple Developer website."}],"code":["// Advanced techniques\n\nif let scene = entity.scene {\n    scene.subscribe(forEventName: \"squirrelTalk\", on: { event in\n        if let sayThis: String = try? event.value(\"sayThis\") {\n            self.sayThis = sayThis\n        }\n     } ).store(in: &cancellables)\n}\n\n...\n} attachments: {\n    Attachment(id: \"squirrelTalk\") {\n        SquirrelTalkAttachmentView(text: sayThis)\n   }\n}"]},"related":[{"id":"237","title":"What’s new in image understanding","gloss":"影像理解的新功能","gloss_en":"What's new in image understanding","category":"ai","categoryLabel":"AI 與機器學習"},{"id":"241","title":"What’s new in the Foundation Models framework","gloss":"Foundation Models 框架的新功能","gloss_en":"What's new in the Foundation Models framework","category":"ai","categoryLabel":"AI 與機器學習"},{"id":"279","title":"Explore advances in RealityKit","gloss":"探索 RealityKit 的最新進展","gloss_en":"Explore advances in RealityKit","category":"visionos","categoryLabel":"visionOS"},{"id":"280","title":"Iterate your spatial scenes faster with Reality Composer Pro 3","gloss":"用 Reality Composer Pro 3 更快迭代空間場景","gloss_en":"Iterate your spatial scenes faster with Reality Composer Pro 3","category":"visionos","categoryLabel":"visionOS"},{"id":"283","title":"Explore enhancements to visionOS object tracking","gloss":"探索 visionOS 物件追蹤的強化功能","gloss_en":"Explore enhancements to visionOS object tracking","category":"visionos","categoryLabel":"visionOS"}]}</script>
