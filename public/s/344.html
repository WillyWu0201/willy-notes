<script id="d" type="application/json">{"s":{"id":"344","title":"Code-along: Make your app available to Siri","gloss":"程式碼實作：讓你的 App 可被 Siri 使用","category":"ai","categoryLabel":"AI 與機器學習","duration":1460,"url":"https://developer.apple.com/videos/play/wwdc2026/344/","takeaway":"跟著 Xcode 專案一步步採用 App Schemas 與 App Intents，建立日曆、出席者與事件等 entity，讓使用者能用 Siri 開啟、建立、更新與刪除事件。","chapters":[[0,"Introduction"],[103,"App Schemas and the plan"],[224,"Build the CalendarEntity"],[480,"Build the AttendeeEntity"],[630,"Build the EventEntity"],[874,"Open events with OpenIntent"],[930,"Onscreen awareness"],[1038,"Create events with Siri"],[1164,"Update events"],[1290,"Custom snippet views"],[1350,"Delete events"],[1415,"Next steps"]],"points":[{"text":"這是一場 **code-along**，跟著實際 Xcode 專案採用 **App Schemas**，讓 App 的功能可被 Siri 觸發。","hot":true},{"text":"逐步建立 **CalendarEntity、AttendeeEntity 與 EventEntity** 等 App Intents entity，作為 Siri 操作的資料模型。","hot":false},{"text":"示範用 **OpenIntent 開啟事件**並加入**畫面感知（onscreen awareness）**，讓 Siri 理解使用者當下看到的內容。","hot":false},{"text":"完整涵蓋以 Siri **建立、更新與刪除事件**的流程，並加入**自訂 snippet view** 呈現結果。","hot":false}],"apis":["AppIntents","AppEntity","OpenIntent"],"audience":"**想讓 App 深度整合 Siri、跟著動手實作 App Intents 與 App Schemas 的開發者**。","gloss_en":"Code-along: Make your app available to Siri","takeaway_en":"Follow along in an Xcode project to adopt App Schemas and App Intents step by step, creating calendar, attendee, and event entities so users can open, create, update, and delete events with Siri.","points_en":[{"text":"This is a **code-along** that follows a real Xcode project to adopt **App Schemas**, making your app's features available to Siri.","hot":true},{"text":"Builds App Intents entities step by step, including **CalendarEntity, AttendeeEntity, and EventEntity**, as the data model for Siri operations.","hot":false},{"text":"Demonstrates using **OpenIntent to open an event** and adding **onscreen awareness** so Siri understands what the user is currently looking at.","hot":false},{"text":"Fully covers **creating, updating, and deleting events** with Siri, and adds a **custom snippet view** to present the results.","hot":false}],"audience_en":"**Developers who want deep Siri integration and want to follow along implementing App Intents and App Schemas hands-on**.","summary":["由 Swift Intelligence Frameworks 團隊工程師 Justin 主講的 code-along，逐步把一個名為 **CometCal** 的 SwiftUI 行事曆 app 變得「可被 Siri 使用」。願景是：對 Siri 說「誰會來野餐？」就能查到出席名單、說「移到 11:30」就能改時間、說「傳訊息給所有人」就能通知、問「我需要帶什麼？」「開車過去要多久？」都能直接得到答案。這一切由 Apple Intelligence 透過 **App Intents** 框架達成，核心關鍵字是 **App Schemas**——以 Siri 早已理解的結構描述 app 的內容與動作，無需訓練語句或自寫 NLP。","第一階段是讓 Siri **理解內容**，依序建立三個 entity。**CalendarEntity** 用 `calendar_calendar` snippet 帶出 `@AppEntity` 結構，id 設為 UUID，conform **`IndexedEntity`** 以便用 Spotlight 語意索引被捐贈（donate）；在 query 中用 `@Dependency` 注入 main-actor 的 `CalendarManager`，並 conform `EnumerableEntityQuery` 提供 `allEntities`。關鍵是在 `CalendarManager` 的 create／update／delete 中用 `CSSearchableIndex` 的 `indexAppEntities`／`deleteAppEntities` **捐贈與移除** entity。**AttendeeEntity** 改 conform **`TransientAppEntity`**（暫時、無需 id、不被查詢，因 attendee 代表某事件中的參與而非人本身），用到 `IntentPerson` 型別與兩個 schema 化 `@AppEnum`（status、type）。**EventEntity** 是核心、conform `IndexedEntity`，組合了 CalendarEntity 與 AttendeeEntity 陣列，並處理 recurrence（`Calendar.RecurrenceRule`）與 location／alarm 的 **union value**。","第二階段讓 Siri 能**導覽與感知畫面**。**`OpenEventIntent`** conform `system.open` schema，以 EventEntity 為 target 呼叫 NavigationManager 導到該事件，讓在 Siri/Spotlight 點事件能直接開到詳情頁。**Onscreen awareness** 只需兩個 view modifier：在事件列表用 `.appEntityIdentifier` 把每列對應到 entity、在詳情頁用 `.userActivity` 帶 `EntityIdentifier` 標示當前單一事件，如此就能對 Siri 說「開那第三個事件」或「email 這個事件裡的人」而不必念出標題。","第三階段給 Siri **行動能力**。三個 intent 皆用對應 snippet（`calendar_createEvent`／`updateEvent`／`deleteEvent`）以 `@AppIntent` macro 生成，perform 流程一致：把參數解析成資料層能懂的形式、執行動作、回傳 entity。Update intent 多數參數為 optional，靠 `IntentParameter` 的 **`valueState`**（`.set` 帶值＝更新、`.set` 帶 nil＝清除、`.unset`＝不在請求中）分辨「不改」與「清空」。Delete 最簡單，Siri 會自動處理確認對話與多筆消歧。最後用 **snippet view**（回傳型別加 `ShowsSnippetView` 並傳入自訂 SwiftUI view）把 Siri 預設結果卡換成有 app 風格的自訂卡片。"],"deepdive":[{"t":0,"title":"Introduction","body":"由 Swift Intelligence Frameworks 團隊的 Justin 開場，以一段與 Siri 的對話情境（查野餐出席者、改時間、傳訊息、問要帶什麼、問車程）描繪本場目標：把現有 app 變得可被 Siri 使用。說明 Siri 由 Apple Intelligence 驅動，開發者透過 **App Intents** 框架讓 app 內容與動作出現在 Siri 等系統體驗中，並指引可先看 App Schemas 與 Get to know App Intents 的基礎影片。"},{"t":103,"title":"App Schemas and the plan","body":"介紹範例專案 **CometCal**（SwiftUI 行事曆，原本只能用螢幕操作），計畫讓 Siri 能理解內容並採取動作。關鍵是 **App Schemas**：以 Siri 已理解的結構描述 entity、action 與輸出，無需訓練語句或自寫 NLP。Schema 依 **domain** 組織，calendar domain 涵蓋 events、calendars、attendees 與相關動作。"},{"t":224,"title":"Build the CalendarEntity","body":"建立 **CalendarEntity**：新檔 import AppIntents，輸入 `calendar_` 由 Xcode autocomplete 選 `calendar_calendar` snippet 帶出 `@AppEntity`、屬性、DisplayRepresentation 與 query stub。把 id 設為 UUID 對應資料模型，conform **`IndexedEntity`** 以用 Spotlight 語意索引被捐贈、讓 Siri 依名稱／屬性／脈絡解析。query 中用 `@Dependency` 注入 main-actor 的 `CalendarManager`、conform `EnumerableEntityQuery` 加 `allEntities`，DisplayRepresentation 設標題與系統圖示。"},{"t":480,"title":"Build the AttendeeEntity","body":"建立 **AttendeeEntity**，用 `calendar_attendee` snippet。與 CalendarEntity 不同，它 conform **`TransientAppEntity`**——暫時、無需唯一 id、不被查詢；因為 attendee 代表某人在特定事件的參與而非人本身，獨立索引會在 Spotlight 產生重複結果。用到系統標準的 **`IntentPerson`** 型別（含姓名與聯絡資訊，方便跨 app 分享如把 email 傳給 Mail），以及兩個 schema 化 `@AppEnum`：用 `calendar_attendeeStatus` 與 `calendar_attendeeType` snippet 建立 status 與 type。"},{"t":630,"title":"Build the EventEntity","body":"建立核心的 **EventEntity**，用 `calendar_event` snippet 並 conform `IndexedEntity`，讓 Siri 能搜尋標題（「crew lunch 何時？」）或 note 內容（「哪些事件提到 oxygen？」）。schema 定義哪些屬性必填／選填（title、startDate 必填；travelTime、virtualLocation 不用可不設）；非 schema 但模型有的屬性（如 isFavorite）也可加。它組合 **CalendarEntity** 與 **AttendeeEntity 陣列**，recurrence 用 Foundation 的 `Calendar.RecurrenceRule` 互轉 app 的 frequency enum，location／alarm 則用 **union value**（location 可為 GeoToolbox 的 PlaceDescriptor 或 String；alarm 可為 Duration 或 Date），並有 EventEntityStatus 等 schema 化 enum。"},{"t":874,"title":"Open events with OpenIntent","body":"內容層完成後，Siri 已能回答事件相關問題（如「流星派對快到了嗎？」「峰值觀賞時間？」），但點結果只會開到主畫面。於是加入 **`OpenEventIntent`**：conform `system.open` schema、以 EventEntity 為 target、呼叫 NavigationManager 導到該事件。當有人在 Spotlight／Siri 點事件或請 Siri 開啟時系統會呼叫它，現在點事件即直達詳情頁。"},{"t":930,"title":"Onscreen awareness","body":"加入 **onscreen awareness** 讓對話更自然（如「email 這個事件的人」不必念標題），只需兩個 view modifier：在 CalendarListView 對 list 加 **`.appEntityIdentifier`** 為每個 event entity 帶 EntityIdentifier，連結列表與其 entity；在事件詳情頁加 **`.userActivity`** 帶 EntityIdentifier 標示當前單一事件，讓 Siri 解析到正在檢視的那一個。示範「開那第三個事件」與「email 這個事件的人請他帶巧克力與棉花糖」。"},{"t":1038,"title":"Create events with Siri","body":"進入動作層，先做建立事件。用 `calendar_createEvent` snippet 生成帶 `@AppIntent` macro、schema 必填參數與 perform stub 的 intent。填好型別、加 `@Dependency` 的 `CalendarManager`，perform 標 `@MainActor`、回傳型別設 EventEntity。一般模式：把參數（如從 union value 取 location、轉換 recurrence）解析成資料層能懂的形式、呼叫 createEvent、回傳 EventEntity。示範對 Siri 說在 Lunar Orbit Log 建立 6/15 早上 8 點的 Zero Gravity Yoga。"},{"t":1164,"title":"Update events","body":"做 **UpdateEventIntent**（`calendar_updateEvent` snippet）。結構類似 create，但多數參數為 optional（使用者可能只改一兩項），event 由 Siri 解析、其餘選填。perform 同樣解析有提供的參數再交給 CalendarManager 的 updateEvent。示範以多輪對話改時間、改週期、換 calendar、取消重複。"},{"t":1290,"title":"Custom snippet views","body":"更新後 Siri 顯示預設結果卡，CometCal 想要更有風格的。預設卡由 DisplayRepresentation 建構，**snippet view** 可換成自訂 SwiftUI view。在 UpdateEventIntent 的 perform 回傳型別加 **`ShowsSnippetView`**，並在回傳時傳入接受 EventEntity 的 `EventSnippetView`（宇宙漸層、深藍背景、星形圖示）；同法可用於 create 等回傳結果的 intent。提醒保持輕量。"},{"t":1350,"title":"Delete events","body":"做最後也最簡單的 **DeleteEventIntent**：只有 event 與 recurring 事件的 optional span，perform 找到事件並刪除。Siri 會自動在刪除前處理**確認對話**，並在多筆事件符合時自動**消歧**。示範刪派對與依日期刪事件、以及「算了，不要」的取消。"},{"t":1415,"title":"Next steps","body":"總結：三個 entity、三個 intent 加上少量 snippet，就把 CometCal 從只能用螢幕變成可語音操作。下一步：下載 CometCal 範例專案探索完整實作、瀏覽 App Intents 文件了解所有 App Schemas 與 domain、用 AppIntentsTesting 框架寫測試、並看「Explore advanced App Intents features for Siri and Apple Intelligence」深入未涵蓋的進階主題。"}],"summary_en":["This code-along, presented by Swift Intelligence Frameworks engineer Justin, steps through making a SwiftUI calendar app called **CometCal** available to Siri. The vision: asking Siri 'Who's coming to my picnic?' surfaces the guest list, 'Move it to 11:30' changes the time, 'Text everyone going' notifies them, and 'What did I need to bring?' / 'How long will it take to drive there?' get direct answers. All of this is achieved through Apple Intelligence via the **App Intents** framework, with the key concept being **App Schemas**—describing the app's content and actions in structures Siri already understands, with no training phrases and no custom NLP.","The first phase makes Siri **understand content** by building three entities. **CalendarEntity** uses the `calendar_calendar` snippet for an `@AppEntity` structure, sets id to UUID, and conforms to **`IndexedEntity`** so it can be donated via the Spotlight semantic index; its query injects a main-actor `CalendarManager` with `@Dependency` and conforms to `EnumerableEntityQuery` for `allEntities`. Crucially, the `CalendarManager`'s create/update/delete **donate and remove** entities using `CSSearchableIndex`'s `indexAppEntities`/`deleteAppEntities`. **AttendeeEntity** instead conforms to **`TransientAppEntity`** (temporary, no id, not queried, since an attendee represents participation in an event, not the person), using the `IntentPerson` type and two schematized `@AppEnum`s (status, type). **EventEntity** is the core, conforms to `IndexedEntity`, composes a CalendarEntity and an array of AttendeeEntity, and handles recurrence (`Calendar.RecurrenceRule`) and **union values** for location/alarms.","The second phase gives Siri **navigation and onscreen awareness**. **`OpenEventIntent`** conforms to the `system.open` schema, takes an EventEntity as its target, and calls the NavigationManager to navigate to that event, so tapping an event in Siri/Spotlight opens straight to its detail view. **Onscreen awareness** takes just two view modifiers: `.appEntityIdentifier` on the event list to map each row to its entity, and `.userActivity` with an `EntityIdentifier` on the detail view to mark the single onscreen event—so you can say 'open that third event' or 'email the people in this event' without naming the title.","The third phase gives Siri the ability to **act**. Three intents are generated from their snippets (`calendar_createEvent`/`updateEvent`/`deleteEvent`) with the `@AppIntent` macro, following the same perform pattern: resolve parameters into something the data layer understands, perform the action, and return an entity. The update intent's mostly-optional parameters use `IntentParameter`'s **`valueState`** (`.set` with a value = update, `.set` with nil = clear, `.unset` = not part of the request) to distinguish 'don't change' from 'remove'. Delete is the simplest—Siri automatically handles the confirmation dialog and disambiguation. Finally, **snippet views** (add `ShowsSnippetView` to the return type and pass a custom SwiftUI view) replace Siri's default result card with an on-brand one."],"deepdive_en":[{"t":0,"title":"Introduction","body":"Swift Intelligence Frameworks engineer Justin opens with a Siri conversation scenario (checking picnic attendees, changing the time, texting everyone, asking what to bring, asking the drive time) framing the goal: make an existing app available to Siri. Siri is powered by Apple Intelligence, and developers integrate through the **App Intents** framework so app content and actions appear in Siri and other system experiences; he points to the App Schemas and Get to know App Intents foundational videos."},{"t":103,"title":"App Schemas and the plan","body":"Introduces the sample project **CometCal** (a SwiftUI calendar, previously screen-only) and the plan to let Siri understand content and take actions. The key is **App Schemas**: describing entities, actions, and outputs in structures Siri already understands, with no training phrases or custom NLP. Schemas are organized into **domains**, and the calendar domain covers events, calendars, attendees, and their actions."},{"t":224,"title":"Build the CalendarEntity","body":"Builds **CalendarEntity**: a new file imports AppIntents, and typing `calendar_` lets Xcode autocomplete the `calendar_calendar` snippet with `@AppEntity`, properties, DisplayRepresentation, and a query stub. Set id to UUID to match the model and conform to **`IndexedEntity`** so it can be donated via the Spotlight semantic index and resolved by name/property/context. The query injects a main-actor `CalendarManager` via `@Dependency`, conforms to `EnumerableEntityQuery` with `allEntities`, and DisplayRepresentation sets the title and a system image."},{"t":480,"title":"Build the AttendeeEntity","body":"Builds **AttendeeEntity** with the `calendar_attendee` snippet. Unlike CalendarEntity, it conforms to **`TransientAppEntity`**—temporary, no unique id, not queried—because an attendee represents a person's participation in a specific event, not the person, and indexing each separately would duplicate Spotlight results. It uses the system-standard **`IntentPerson`** type (name and contact info, handy for sharing across apps like sending an email to Mail) and two schematized `@AppEnum`s: status and type via the `calendar_attendeeStatus` and `calendar_attendeeType` snippets."},{"t":630,"title":"Build the EventEntity","body":"Builds the core **EventEntity** with the `calendar_event` snippet, conforming to `IndexedEntity` so Siri can search the title ('when is my crew lunch?') or note content ('what events mention oxygen?'). The schema defines required vs optional properties (title, startDate required; travelTime, virtualLocation can stay unset); non-schema model properties like isFavorite can be added. It composes a **CalendarEntity** and an **array of AttendeeEntity**, with recurrence converting to/from Foundation's `Calendar.RecurrenceRule`, and **union values** for location/alarms (location is a GeoToolbox PlaceDescriptor or String; alarm is a Duration or Date), plus schematized enums like EventEntityStatus."},{"t":874,"title":"Open events with OpenIntent","body":"With the content layer done, Siri answers event questions (e.g., 'is the Meteor Shower Party soon?', 'peak viewing time?'), but tapping a result only opens the main screen. So add **`OpenEventIntent`**: conform to the `system.open` schema, take an EventEntity target, and call the NavigationManager to navigate to that event. The system calls it when someone taps an event in Spotlight/Siri or asks Siri to open one, so tapping now lands on the detail view."},{"t":930,"title":"Onscreen awareness","body":"Adds **onscreen awareness** for more natural conversation (e.g., 'email the people in this event' without the title), via two view modifiers: on CalendarListView's list, add **`.appEntityIdentifier`** with an EntityIdentifier for each event entity to connect the list to its entities; on the detail view, add **`.userActivity`** with an EntityIdentifier marking the single onscreen event so Siri resolves the one being viewed. Demos 'open that third event' and 'email the people in this event and ask someone to bring chocolate and marshmallows'."},{"t":1038,"title":"Create events with Siri","body":"Enters the action layer with creating events. The `calendar_createEvent` snippet scaffolds an intent with the `@AppIntent` macro, the schema's required parameters, and a perform stub. Fill in types, add a `@Dependency` `CalendarManager`, mark perform `@MainActor`, and set EventEntity as the return type. The general pattern: resolve parameters (e.g., extract location from a union value, convert recurrence) into data-layer terms, call createEvent, and return an EventEntity. Demos asking Siri to create Zero Gravity Yoga in the Lunar Orbit Log for June 15th, 8am."},{"t":1164,"title":"Update events","body":"Builds **UpdateEventIntent** (`calendar_updateEvent` snippet). Similar to create, but most parameters are optional (someone may change just one or two things); the event is what Siri resolves, the rest optional. Perform resolves each provided parameter then passes everything to CalendarManager's updateEvent. Demos multi-turn changes to time, recurrence, calendar, and turning off repeat."},{"t":1290,"title":"Custom snippet views","body":"After updates Siri shows a default result card, but CometCal wants more personality. The default card is built from the DisplayRepresentation; a **snippet view** replaces it with a custom SwiftUI view. Add **`ShowsSnippetView`** to UpdateEventIntent's perform return type and pass an `EventSnippetView` (cosmic gradient, dark blue background, star icon) that takes an EventEntity; the same works for any intent returning a result, like create. Keep it lightweight."},{"t":1350,"title":"Delete events","body":"Builds the last and simplest **DeleteEventIntent**: just the event and an optional span for recurring events; perform finds and deletes the event. Siri automatically handles the **confirmation dialog** before deletion and **disambiguates** when more than one event matches. Demos deleting a party, deleting an event by date, and an 'actually, never mind' cancellation."},{"t":1415,"title":"Next steps","body":"Recap: three entities, three intents, and a few snippets take CometCal from screen-bound to voice-piloted. Next steps: download the CometCal sample project to explore the full implementation, browse the App Intents documentation for all App Schemas and domains, write tests with the AppIntentsTesting framework, and watch 'Explore advanced App Intents features for Siri and Apple Intelligence' for advanced topics not covered here."}],"code":[]},"related":[{"id":"297","title":"Best practices for integrating visual intelligence in your app","gloss":"在 App 中整合視覺智慧的最佳實務","gloss_en":"Best practices for integrating visual intelligence in your app","category":"ai","categoryLabel":"AI 與機器學習"},{"id":"310","title":"What’s new in Shortcuts","gloss":"捷徑有什麼新東西","gloss_en":"What's new in Shortcuts","category":"ai","categoryLabel":"AI 與機器學習"},{"id":"240","title":"Build intelligent Siri experiences with App Schemas","gloss":"用 App Schemas 打造智慧 Siri 體驗","gloss_en":"Build intelligent Siri experiences with App Schemas","category":"ai","categoryLabel":"AI 與機器學習"},{"id":"343","title":"Explore advanced App Intents features for Siri and Apple Intelligence","gloss":"探索 Siri 與 Apple Intelligence 的進階 App Intents 功能","gloss_en":"Explore advanced App Intents features for Siri and Apple Intelligence","category":"ai","categoryLabel":"AI 與機器學習"},{"id":"347","title":"Secure your app: mitigate risks to agentic features","gloss":"保護你的 App：降低 agentic 功能的風險","gloss_en":"Secure your app: mitigate risks to agentic features","category":"ai","categoryLabel":"AI 與機器學習"}]}</script>
