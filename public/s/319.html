<script id="d" type="application/json">{"s":{"id":"319","title":"Build with the new Apple Foundation Model on Private Cloud Compute","gloss":"在 Private Cloud Compute 上使用全新 Apple Foundation Model 開發","category":"ai","categoryLabel":"AI 與機器學習","duration":658,"url":"https://developer.apple.com/videos/play/wwdc2026/319/","takeaway":"只需一行改用 PrivateCloudComputeLanguageModel，即可在保護隱私的前提下取用前沿級模型，並享有更大 context、推理層級控制與用量限制處理。","chapters":[[0,"Introduction"],[83,"What is Private Cloud Compute"],[163,"Integrating PCC with Foundation Models"],[169,"Prompt the on-device model"],[182,"Switch to the PCC server model (one-line change)"],[205,"Structured output and tools work the same"],[231,"Check availability"],[240,"Deciding between on-device and PCC"],[272,"Reasoning levels and context size"],[326,"Set a reasoning level"],[358,"Read the context size"],[375,"Evaluating and combining models"],[430,"Handling usage limits"],[581,"Handle usage limits"],[615,"Next steps"]],"points":[{"text":"**Private Cloud Compute（PCC）** 讓你存取**前沿級模型**同時保護使用者隱私，只需把模型換成 **PrivateCloudComputeLanguageModel**（一行變更）。","hot":true},{"text":"**結構化輸出（@Generable）與工具呼叫**在 PCC 上用法完全相同；可用 model.isAvailable 檢查可用性。","hot":false},{"text":"可透過 **ContextOptions(reasoningLevel:)** 設定 .light/.moderate/.deep 推理層級；PCC 的 **contextSize 達 32768**，遠大於裝置端。","hot":false},{"text":"用 **quotaUsage** 處理**用量限制**：偵測接近上限、超出，並可顯示 limitIncreaseSuggestion 引導使用者。","hot":false}],"apis":["FoundationModels","PrivateCloudComputeLanguageModel","LanguageModelSession","SystemLanguageModel","ContextOptions","Generable","Tool","quotaUsage"],"audience":"**想在 App 中使用更強大模型、又需兼顧隱私**的開發者，尤其需要大 context 或深度推理的情境。","gloss_en":"Build with the new Apple Foundation Model on Private Cloud Compute","takeaway_en":"With a single line switching to PrivateCloudComputeLanguageModel, you can access frontier-class models while protecting privacy, gaining a larger context, reasoning-level control, and quota handling.","points_en":[{"text":"**Private Cloud Compute (PCC)** lets you access **frontier-class models** while protecting user privacy; just swap the model for **PrivateCloudComputeLanguageModel** (a one-line change).","hot":true},{"text":"**Structured output (@Generable) and tool calling** work exactly the same on PCC; use model.isAvailable to check availability.","hot":false},{"text":"Set the reasoning level to .light/.moderate/.deep via **ContextOptions(reasoningLevel:)**; PCC's **contextSize reaches 32768**, far larger than on-device.","hot":false},{"text":"Use **quotaUsage** to handle **usage limits**: detect approaching the cap or exceeding it, and show limitIncreaseSuggestion to guide the user.","hot":false}],"audience_en":"**Developers who want to use more powerful models in their apps while balancing privacy**, especially in scenarios needing large context or deep reasoning.","summary":["這場由 Louis 主講的 session 介紹如何在 app 中透過 **Private Cloud Compute (PCC)** 使用一個強大的全新伺服器端 LLM。去年 Apple 以 **Foundation Models** 框架開放了 on-device LLM,今年不僅讓 on-device 模型更強(支援圖片輸入、更好的指令遵循與自訂 tool 呼叫),還新增了一個跑在 PCC 上的伺服器模型,用來處理更複雜的使用情境——例如需要對大量使用者輸入做推理的助理、或大量 tool 呼叫與大型輸出的功能,甚至可從 watchOS 呼叫。","PCC 最大的價值在於兼顧能力與隱私:它以端對端隱私設計,確保使用者資料絕不被儲存、僅用於當次請求,且經獨立研究者驗證。因為 PCC 與 OS 及 iCloud 整合,開發者完全不需處理 authentication 或 API key,使用者只要有支援 **Apple Intelligence** 的裝置即可;對開發者也沒有 token 費用,每位使用者有每日額度,可升級 **iCloud+** 取得更高上限。此功能開放給下載量低於 2M 的 app,可即日於開發者網站申請。","整合極為簡單:原本用 Foundation Models 呼叫 on-device LLM 只需 3 行(建立 session、呼叫 respond),要切換到 PCC 伺服器模型只要改 1 行——把 model 換成 **PrivateCloudComputeLanguageModel()**。框架提供統一的 Swift API,**@Generable** 的結構化輸出與 **Tool** 呼叫在兩種模型上用法完全相同,可輕鬆切換而不必改寫程式碼。同樣地,PCC 也僅在 Apple Intelligence 裝置上可用,務必檢查 availability 並優雅處理不可用情況。on-device 與 PCC 的差異包括:前者離線可用、無請求限制、context 為 4K;後者需網路連線、有每日額度、context 達 32K 且支援 reasoning。","PCC 的 reasoning 讓模型在產生回應前先「思考」,即在 transcript 的獨立區段生成額外文字,分為 **.light**、**.moderate**、**.deep** 三級,可透過 respond 的 `ContextOptions` 設定;reasoning 文字會占用 token 與 context size,可觀察 transcript 顯示進度。新增的 `contextSize` 屬性可程式化讀取模型 context 大小。講者強調選擇模型或 reasoning 等級應依資料而非感覺,因此推出全新的 **Evaluations** 框架(整合於 Xcode)來評估你的功能品質。最後是 usage limit 處理:請求以使用者的 iCloud 帳號計算,應檢查 model 的 `quotaUsage`(`isLimitReached`、`isApproachingLimit`、`limitIncreaseSuggestion`),用持續存在的 UI(如按鈕下方的 label,而非 alert)告知使用者並提供提升額度的選項;Xcode 的 scheme Debug Options 還能模擬額度狀態以便測試。"],"deepdive":[{"t":0,"title":"Introduction","body":"主講人 **Louis** 開場說明這支影片要教你如何透過 **Private Cloud Compute** 在 app 中使用強大的全新伺服器 LLM。去年的 **Foundation Models** 框架帶來 on-device LLM,今年該模型更強(支援圖片輸入、更好的指令遵循與 tool 呼叫),並針對更複雜需求新增 PCC 伺服器模型,可建構會對大量輸入做推理的助理、或需大量 tool 呼叫與大型輸出的功能,甚至能從 watchOS 呼叫。"},{"t":83,"title":"What is Private Cloud Compute","body":"**Private Cloud Compute** 原本驅動系統功能,把複雜任務送到 Apple 伺服器,現在也開放給 app 使用,讓你存取強大伺服器 LLM 而不犧牲隱私。它以端對端隱私設計,使用者資料絕不被儲存、只用於當次請求,並經獨立研究者驗證。因與 OS 及 iCloud 整合,無需 authentication 或 API key,使用者只要有 Apple Intelligence 裝置即可;對開發者沒有 token 費用,每位使用者有每日額度,可升級 **iCloud+** 提高上限,且開放給下載量低於 2M 的 app 申請。"},{"t":163,"title":"Integrating PCC with Foundation Models","body":"進入如何用 **Foundation Models** 框架整合 PCC 的環節。重點是整套整合都建立在去年既有的 Foundation Models API 之上,讓既有 app 能以最小改動取得伺服器模型的能力。"},{"t":169,"title":"Prompt the on-device model","body":"回顧既有用法:用 Foundation Models 呼叫 on-device LLM 只需 3 行——建立 **LanguageModelSession**,再呼叫 `respond(to:)` 傳入 prompt(例如請它摘要一篇文章)。這作為對照,凸顯接下來切換到 PCC 有多容易。"},{"t":182,"title":"Switch to the PCC server model (one-line change)","body":"只要改 1 行就能切到 PCC 伺服器模型:在 LanguageModelSession 的初始化傳入 `model: PrivateCloudComputeLanguageModel()`。改完這行,你就在和一個更大、context 更大、推理能力更強的模型對話,其餘程式碼維持不變。"},{"t":205,"title":"Structured output and tools work the same","body":"框架提供統一的 Swift API,不論呼叫哪個模型都一致。用 **@Generable** 取得結構化輸出(例如含 oneLineSummary 與 keyPoints 的 ArticleSummary)、或呼叫 **Tool**(如 FindRelatedArticlesTool),在 PCC 模型上的用法與 on-device 完全相同,讓你能輕鬆在兩者間切換而不必改寫程式碼。"},{"t":231,"title":"Check availability","body":"與 on-device 模型一樣,PCC 也只在 Apple Intelligence 裝置上可用。務必檢查 availability API 並優雅處理 Apple Intelligence 不可用的情況,範例以 `model.isAvailable` 在 view 中決定要顯示發送請求的 UI 還是 fallback。"},{"t":240,"title":"Deciding between on-device and PCC","body":"比較 on-device System 模型與 PCC 模型:兩者皆保有隱私,但 on-device 可離線、無請求限制、context 為 4K;PCC 需網路連線、有每日額度、context 達 32K 且支援 reasoning。選哪個模型是撰寫功能時的重要決定。"},{"t":272,"title":"Reasoning levels and context size","body":"解釋 reasoning:一般 LLM 讀 prompt 後直接生成回應,而 reasoning 讓模型先「思考」,在 transcript 的獨立區段生成額外文字。PCC 提供三級:**.light** 蒐集一些額外脈絡、**.moderate** 推理稍深、**.deep** 的推理文字甚至可能比實際回應還長。但要記得 reasoning 是額外生成的文字,會用掉 token 並計入 context size 上限。"},{"t":326,"title":"Set a reasoning level","body":"示範在對 session 呼叫 respond 時透過 `ContextOptions(reasoningLevel:)` 設定 reasoning 等級(.light/.moderate/.deep)。session 的 transcript 會包含 reasoning 區段,可觀察 transcript 顯示進度——對可能耗時較久的 **.deep** 等級尤其有用。"},{"t":358,"title":"Read the context size","body":"介紹方便的 `contextSize` 屬性,可程式化取得模型的 context 大小:`SystemLanguageModel().contextSize` 在 26.0 為 4096、27.0(較新裝置)為 8192,而 `PrivateCloudComputeLanguageModel().contextSize` 為 32768。這讓你能依模型實際容量做決策。"},{"t":375,"title":"Evaluating and combining models","body":"強調選擇 on-device 或 PCC、以及決定 reasoning 等級,應依資料而非「憑感覺」。你可能會驚訝今年更新後的 on-device 模型在某些任務表現得多好,但唯有評估才能確知。為此推出全新、整合於 Xcode 的 **Evaluations** 框架(詳見 \"Meet the Evaluations framework\");並可將 on-device 與伺服器模型搭配使用(詳見 \"Build agentic app experiences with Foundation Models\")。"},{"t":430,"title":"Handling usage limits","body":"說明使用 PCC 時妥善處理 usage limit 的重要性:請求以使用者的 iCloud 帳號計算。以一個用 PCC 摘要文章(含文字與圖片)的 app 為例,當使用者達到上限時請求會丟出錯誤,若只是把錯誤顯示在 UI 上對使用者並不友善、也不夠 actionable,因此需要更好的處理方式。"},{"t":581,"title":"Handle usage limits","body":"具體做法是檢查 model 的 `quotaUsage`:用 `isLimitReached` 判斷是否超限並以自訂 UI(如按鈕下方的 label)處理,超限時顯示按鈕讓使用者管理額度(例如升級帳號);也可用 `isApproachingLimit` 偵測接近上限。應整合進既有 UI、避免用會被關閉的 alert,改以持續存在的狀態(如停用發送按鈕、顯示低調 label)呈現。Xcode 的 scheme Debug Options 提供 \"Simulate Apple Foundation Models Availability\",可模擬 Quota Usage Limit Reached 與 Nearing Usage Limit 兩種狀態以便測試。"},{"t":615,"title":"Next steps","body":"總結整合 PCC 的概觀,並鼓勵想使用此新伺服器模型者即日於開發者網站申請。建議從 \"What's new in the Foundation Models framework\" 開始了解全貌,並可參考 \"Debug and profile agentic app experiences with Instruments\" 以理解模型在執行期的行為。"}],"summary_en":["In this session, Louis shows how to access a powerful new server-side LLM in your apps via **Private Cloud Compute (PCC)**. Last year Apple opened up an on-device LLM through the **Foundation Models** framework; this year the on-device model is even better (image input, improved instruction following, better custom tool calling), and a new server model running on PCC is added for more complex use cases—assistants that reason over large user input, or features that make many tool calls with large outputs—and it can even be called from watchOS.","PCC's key value is combining capability with privacy: it's designed for end-to-end privacy, ensuring user data is never stored and only used for the request, independently verified by researchers. Because PCC is integrated into the OS together with iCloud, developers don't deal with authentication or API keys—users just need a device that supports **Apple Intelligence**. There are no token costs to the developer; each user gets a daily limit and can upgrade to **iCloud+** for higher limits. The feature is available for apps with under 2M downloads, and you can apply on the developer website today.","Integration is remarkably simple: prompting the on-device LLM with Foundation Models takes just 3 lines (create a session, call respond), and switching to the PCC server model takes just 1 line—swap in **PrivateCloudComputeLanguageModel()**. The framework offers a unified Swift API, so structured output with **@Generable** and **Tool** calling work the same on both models, letting you switch without rewriting code. Like the on-device model, PCC is only available on Apple Intelligence devices, so you must check availability and gracefully handle when it's unavailable. Differences: on-device works offline, has no request limits, and a 4K context; PCC needs an internet connection, has a daily limit, a 32K context, and supports reasoning.","PCC's reasoning lets the model \"think\" before responding by generating extra text in a separate transcript segment, across three levels—**.light**, **.moderate**, **.deep**—set via `ContextOptions` on respond; reasoning text consumes tokens and counts toward context size, and you can observe the transcript to show progress. A new `contextSize` property reads a model's context size programmatically. Louis stresses choosing a model or reasoning level based on data, not vibes, introducing the new **Evaluations** framework integrated into Xcode to assess your feature's quality. Finally, on usage limits: requests count against the user's iCloud account, so check the model's `quotaUsage` (`isLimitReached`, `isApproachingLimit`, `limitIncreaseSuggestion`) and surface it with persistent UI (a label under the button, not an alert) that offers a way to raise the limit; Xcode's scheme Debug Options can even simulate the quota states for testing."],"deepdive_en":[{"t":0,"title":"Introduction","body":"**Louis** opens by explaining the video teaches how to use a powerful new server LLM in your apps via **Private Cloud Compute**. Last year's **Foundation Models** framework brought an on-device LLM; this year that model is stronger (image input, better instruction following and tool calling), and a new PCC server model is added for more complex needs—assistants that reason over large input, or features with many tool calls and large outputs—even callable from watchOS."},{"t":83,"title":"What is Private Cloud Compute","body":"**Private Cloud Compute** already powers system features by sending complex tasks to Apple's servers, and is now opened to apps, giving access to a powerful server LLM without compromising privacy. It's designed for end-to-end privacy—user data is never stored, only used for the request—and independently verified. Integrated with the OS and iCloud, it needs no authentication or API keys; users just need an Apple Intelligence device. There are no token costs to developers, each user gets a daily limit, **iCloud+** raises it, and the feature is open to apps with under 2M downloads."},{"t":163,"title":"Integrating PCC with Foundation Models","body":"This section turns to integrating PCC using the **Foundation Models** framework. The point is that the whole integration builds on last year's existing Foundation Models API, letting existing apps gain server-model capability with minimal changes."},{"t":169,"title":"Prompt the on-device model","body":"A recap of existing usage: prompting the on-device LLM with Foundation Models takes just 3 lines—create a **LanguageModelSession** and call `respond(to:)` with your prompt (e.g., asking it to summarize an article). This serves as the baseline that highlights how easy switching to PCC is."},{"t":182,"title":"Switch to the PCC server model (one-line change)","body":"Switching to the PCC server model takes just 1 line: pass `model: PrivateCloudComputeLanguageModel()` when initializing the LanguageModelSession. With that single change you're talking to a much larger model with larger context and stronger reasoning, while the rest of the code stays the same."},{"t":205,"title":"Structured output and tools work the same","body":"The framework offers a unified Swift API regardless of which model you call. Getting structured output with **@Generable** (e.g., an ArticleSummary with oneLineSummary and keyPoints) or calling a **Tool** (like FindRelatedArticlesTool) works exactly the same on the PCC model as on-device, letting you switch between them without rewriting code."},{"t":231,"title":"Check availability","body":"Just like the on-device model, PCC is only available on Apple Intelligence devices. You must check the availability API and gracefully handle when Apple Intelligence isn't available; the example uses `model.isAvailable` in a view to decide whether to show the request UI or a fallback."},{"t":240,"title":"Deciding between on-device and PCC","body":"A comparison of the on-device System model and the PCC model: both offer privacy, but on-device works offline, has no request limits, and a 4K context; PCC needs an internet connection, has a daily per-user limit, a 32K context, and supports reasoning. Choosing which model to use is an important decision when writing a feature."},{"t":272,"title":"Reasoning levels and context size","body":"Reasoning is explained: a normal LLM reads the prompt and generates a response, while reasoning lets the model \"think\" first by generating extra text in a separate transcript segment. PCC offers three levels: **.light** gathers some extra context, **.moderate** reasons a little deeper, and **.deep** may produce reasoning text even longer than the response. But reasoning is extra generated text, so it uses tokens and counts toward the context size limit."},{"t":326,"title":"Set a reasoning level","body":"Demonstrates setting the reasoning level via `ContextOptions(reasoningLevel:)` (.light/.moderate/.deep) when calling respond on a session. The session's transcript includes the reasoning segment, which you can observe to show progress—especially useful with the potentially slower **.deep** level."},{"t":358,"title":"Read the context size","body":"Introduces the convenient `contextSize` property to get a model's context size programmatically: `SystemLanguageModel().contextSize` is 4096 on 26.0 and 8192 on 27.0 (newer devices), while `PrivateCloudComputeLanguageModel().contextSize` is 32768. This lets you make decisions based on a model's actual capacity."},{"t":375,"title":"Evaluating and combining models","body":"Stresses deciding between on-device and PCC, and the reasoning level, based on data rather than vibes. You may be surprised how well this year's updated on-device model performs at certain tasks, but only evaluation tells for sure. Hence the new **Evaluations** framework integrated into Xcode (see \"Meet the Evaluations framework\"), and you can even use on-device and server models together (see \"Build agentic app experiences with Foundation Models\")."},{"t":430,"title":"Handling usage limits","body":"Explains the importance of handling usage limits well with PCC: requests are counted against the user's iCloud account. Using an app that summarizes an article (text and images) with PCC as the example, when a user hits a limit the request throws an error—just showing that error in the UI isn't a great experience since it isn't actionable, so a better approach is needed."},{"t":581,"title":"Handle usage limits","body":"The concrete approach is to check the model's `quotaUsage`: use `isLimitReached` and handle it with custom UI (like a label under the button), showing a button that lets the user manage their limit (e.g., upgrade their account) when exceeded; you can also detect `isApproachingLimit`. Integrate this with existing UI and avoid a dismissible alert—instead use persistent state (disable the request button, show a subtle label). Xcode's scheme Debug Options provide \"Simulate Apple Foundation Models Availability\" to simulate Quota Usage Limit Reached and Nearing Usage Limit for testing."},{"t":615,"title":"Next steps","body":"Wraps up the overview of integrating PCC and encourages those who want the new server model to apply on the Developer website today. It suggests starting with \"What's new in the Foundation Models framework\" for an overview, and \"Debug and profile agentic app experiences with Instruments\" to understand model behavior at runtime."}],"code":["import FoundationModels\n\n  let session = LanguageModelSession()\n  let response = try await session.respond(to: \"Summarize this article: \\(article)\")","import FoundationModels\n  \n  let session = LanguageModelSession(\n      model: PrivateCloudComputeLanguageModel()\n  )\n  let response = try await session.respond(to: \"Summarize this article: \\(article)\")","import FoundationModels\n\n  @Generable\n  struct ArticleSummary {\n      let oneLineSummary: String\n      let keyPoints: [String]\n  }\n\n  struct FindRelatedArticlesTool: Tool {\n\n  }\n  \n  let session = LanguageModelSession(\n      model: PrivateCloudComputeLanguageModel(),\n      tools: [FindRelatedArticlesTool.self]\n  )\n\n  let response = try await session.respond(\n      to: \"Summarize this article: \\(article)\",\n      generating: ArticleSummary.self\n  )","import FoundationModels\n  \n  struct ArticleSummarizationView: View {\n      private var model = PrivateCloudComputeLanguageModel()\n\n      var body: some View {\n          if model.isAvailable {\n              // Show UI for making request\n          } else {\n              // Fall back\n          }\n      }\n  }","let response = try await session.respond(\n      to: prompt,\n      contextOptions: ContextOptions(reasoningLevel: .light)\n  )\n  // Reasoning levels: .light, .moderate, .deep","SystemLanguageModel().contextSize\n  // 4096 on 26.0\n  // 8192 on 27.0 (newer devices)\n\n  PrivateCloudComputeLanguageModel().contextSize\n  // 32768","struct ArticleSummarizationView: View {\n      private var model = PrivateCloudComputeLanguageModel()\n\n      var body: some View {\n          if case .belowLimit(let info) = model.quotaUsage.status {\n              if info.isApproachingLimit {\n                  Text(\"Nearing usage limit.\")\n                      .foregroundStyle(Color.orange)\n              }\n          }\n          if model.quotaUsage.isLimitReached {\n              Text(\"Usage limit exceeded.\")\n                  .foregroundStyle(Color.red)\n          }\n          if let suggestion = model.quotaUsage.limitIncreaseSuggestion {\n              Button(\"Show options\") {\n                  suggestion.show()\n              }\n          }\n      }\n  }"]},"related":[{"id":"241","title":"What’s new in the Foundation Models framework","gloss":"Foundation Models 框架的新功能","gloss_en":"What's new in the Foundation Models framework","category":"ai","categoryLabel":"AI 與機器學習"},{"id":"242","title":"Build agentic app experiences with the Foundation Models framework","gloss":"用 Foundation Models 框架打造 agentic App 體驗","gloss_en":"Build agentic app experiences with Foundation Models","category":"ai","categoryLabel":"AI 與機器學習"},{"id":"326","title":"Integrate on-device AI models into your app using Core AI","gloss":"用 Core AI 把裝置端 AI 模型整合進你的 App","gloss_en":"Integrate on-device AI models with Core AI","category":"ai","categoryLabel":"AI 與機器學習"},{"id":"335","title":"Improve your prompts by hill-climbing with Evaluations","gloss":"用評估爬坡法改進你的提示詞","gloss_en":"Improve your prompts by hill-climbing with Evaluations","category":"ai","categoryLabel":"AI 與機器學習"},{"id":"339","title":"Bring an LLM provider to the Foundation Models framework","gloss":"把 LLM 供應商接入 Foundation Models 框架","gloss_en":"Bring an LLM provider to the Foundation Models framework","category":"ai","categoryLabel":"AI 與機器學習"}]}</script>
