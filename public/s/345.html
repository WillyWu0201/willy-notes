<script id="d" type="application/json">{"s":{"id":"345","title":"Discover new capabilities in the App Intents framework","gloss":"探索 App Intents 框架的新能力","category":"other","categoryLabel":"其他","duration":1082,"url":"https://developer.apple.com/videos/play/wwdc2026/345/","takeaway":"App Intents 新增 **ValueRepresentation、EntityCollection、SyncableEntity、LongRunningIntent 與 ExecutionTargets**，讓 intent 更快、更彈性也更貼近情境。","chapters":[[0,"Introduction"],[1,"Share structured entities with ValueRepresentation"],[160,"Share entities across apps with ValueRepresentation"],[225,"Register relevant entities with RelevantEntities"],[318,"Register relevant entities with RelevantEntities"],[425,"Handle entities efficiently with EntityCollection"],[435,"Handle large entity sets with EntityCollection"],[535,"Use entities across devices with SyncableEntity"],[614,"Make entity IDs stable with SyncableEntity"],[661,"Richer parameter types"],[718,"Accept multiple types with @UnionValue"],[758,"Union value parameters"],[806,"Extend execution with LongRunningIntent"],[821,"Run beyond 30 s with LongRunningIntent + CancellableIntent"],[927,"Target the right process with ExecutionTargets"],[1014,"Control which process runs your intent with ExecutionTargets"],[1034,"Next steps"]],"points":[{"text":"用 **`ValueRepresentation`** 分享結構化實體（如以 `PlaceDescriptor` 表示地點），可用 key-path 大幅減少程式碼。","hot":false},{"text":"以 **`EntityCollection`** 取代 `[Entity]` 高效處理大量實體，只在需要時取用識別碼。","hot":true},{"text":"透過 **`SyncableEntity`** 與 `SyncableEntityIdentifier` 讓實體 ID 跨裝置穩定一致。","hot":false},{"text":"用 `LongRunningIntent` 搭配 `CancellableIntent` 讓 intent 執行**超過 30 秒**並回報進度、可取消。","hot":false},{"text":"以 **`ExecutionTargets`** 指定 intent 執行於主 App、App Intents extension 或 widget extension。","hot":false}],"apis":["App Intents","AppEntity","ValueRepresentation","RelevantEntities","EntityCollection","SyncableEntity","SyncableEntityIdentifier","UnionValue","LongRunningIntent","CancellableIntent","ExecutionTargets"],"audience":"**已採用 App Intents、想用進階功能提升彈性與效能**的 iOS 開發者。","gloss_en":"Discover new capabilities in the App Intents framework","takeaway_en":"App Intents adds **ValueRepresentation, EntityCollection, SyncableEntity, LongRunningIntent, and ExecutionTargets**, making intents faster, more flexible, and more relevant.","points_en":[{"text":"Use **`ValueRepresentation`** to share structured entities (such as representing a place with `PlaceDescriptor`), with key paths to greatly reduce code.","hot":false},{"text":"Use **`EntityCollection`** instead of `[Entity]` to efficiently handle large numbers of entities, fetching identifiers only when needed.","hot":true},{"text":"Keep entity IDs stable and consistent across devices with **`SyncableEntity`** and `SyncableEntityIdentifier`.","hot":false},{"text":"Use `LongRunningIntent` with `CancellableIntent` to let an intent run **longer than 30 seconds** while reporting progress and being cancellable.","hot":false},{"text":"Use **`ExecutionTargets`** to specify whether an intent runs in the main app, an App Intents extension, or a widget extension.","hot":false}],"audience_en":"iOS developers who **have already adopted App Intents and want to use advanced features to improve flexibility and performance**.","summary":["**App Intents** 是讓 app 把自身動作與內容表達給系統其他部分（Siri、Shortcuts、Spotlight、Widgets）的框架，也是 **Apple Intelligence** 的核心支柱。本場由 App Intents 團隊的 Moe 介紹 2027 版本中、由開發者需求驅動的新能力，主軸聚焦三大領域：entities、更豐富的 parameter 型別，以及 intent 的執行控制。內容延續 WWDC25 的 Landmarks 旅遊追蹤範例 app 來逐步示範。","在 entities 方面，新增 **ValueRepresentation** 讓 entity 能把如座標等結構化資料（透過 GeoToolbox 的 **PlaceDescriptor**）分享給像 Maps 這類需要結構化資訊的 app，補足既有 file/data representation 只適用已知格式的限制。**RelevantEntities** 讓你主動告訴系統某些 entity 在特定情境（如開始跑步）下相關，補足 Spotlight 索引與 interaction donation 都無法涵蓋「全新、從未被搜尋或使用過的內容」的缺口。針對效能，**EntityCollection** 只傳遞 entity 識別碼而非完整解析的 entities，讓批次處理上千筆 entity 從緩慢變為近乎即時。**SyncableEntity** 則為跨裝置的 Siri 對話提供穩定 ID，搭配 **SyncableEntityIdentifier** 把 local 與 stable ID 配對。","在 parameter 型別上，框架為更多原生型別（如 **Duration**、**PersonNameComponents**）提供內建 picker、Siri 理解與在地化，免去自製選擇器。**@UnionValue** 巨集讓單一 parameter 能接受多種型別——以 enum 每個 case 包裝不同 entity 型別，自動產生型別資訊、case metadata 與 picker 支援，並可在 Widgets、Shortcuts 等所有 intent 出現之處運作。","在執行控制上，**LongRunningIntent** 突破 intent 預設 30 秒上限、管理背景任務生命週期，並把進度自動呈現為 **Live Activity**（須回報 progress）；搭配 **CancellableIntent** 可在使用者取消、系統逾時或需回收資源時，透過 onCancel 優雅清理。**ExecutionTargets** 則讓你明確指定 intent 該在哪個 process 執行（主 app、App Intents extension、WidgetKit extension 或其組合），覆寫系統的預設啟發式選擇——例如把寫入操作鎖定在主 app 以避免多 process 寫同一資料而衝突。"],"deepdive":[{"t":0,"title":"Introduction","body":"由 App Intents 團隊工程師 **Moe** 開場，說明 **App Intents** 是把 app 動作與內容自然且深度整合地表達給系統的框架，橫跨 Siri、Shortcuts、Spotlight、Widgets，並已成為 **Apple Intelligence** 的關鍵支柱。預告 2027 版本帶來更多控制、彈性與更順暢的開發體驗，涵蓋 entities、原生型別與 union values、以及執行控制三大主題，並以 WWDC25 的 Landmarks 旅遊追蹤 app 為基礎延伸。"},{"t":1,"title":"Share structured entities with ValueRepresentation","body":"說明使用者會在 app 間移動，但 entity（如 landmark）原本只活在自己的 app 裡。既有的 Transferable file/data representation 適用 PDF、影像等已知格式，卻無法承載沒有檔案格式的結構化型別（如座標），導致「取得到該地點的路線（交給 Maps）」這類需求行不通。"},{"t":160,"title":"Share entities across apps with ValueRepresentation","body":"**ValueRepresentation** 是新的 representation 型別，可分享系統已理解的結構化型別。範例在 **LandmarkEntity** 既有 Transferable 旁加上 ValueRepresentation，把座標與名稱匯出為 GeoToolbox 的 **PlaceDescriptor**（內含 Maps 導航所需的座標與 metadata）；若 entity 已有 PlaceDescriptor 的 @Property，更可直接用 key-path 省去 closure。如此一來 shortcut 執行時 landmark 便以 PlaceDescriptor 流向 Maps 並開啟導航。"},{"t":225,"title":"Register relevant entities with RelevantEntities","body":"以音樂 app CosmoTunes 的全新高節奏跑步歌單為例，提出如何讓它出現在 Fitness app 設定跑步時的建議清單。既有兩種讓內容曝光的方式——用 **Spotlight** 索引內容（也是 Siri 檢索的主要途徑），以及透過 **IntentDonationManager** 做 interaction donation 讓系統學習使用模式——但全新歌單因從未被搜尋或播放，兩者都無法涵蓋。"},{"t":318,"title":"Register relevant entities with RelevantEntities","body":"**RelevantEntities** 讓你主動向系統建議 entity 並提供相關情境。做法是先選出相關 entity（跑步歌單），建立 context 告訴系統這些歌單在開始跑步時相關，再呼叫 `updateEntities` 註冊，系統便會在對的情境下把它們當建議浮現，即使從未被播放過。entity 會保持註冊直到移除，可針對特定 context 或全部 context 清除。並總結三者取捨：Spotlight 用於可搜尋與 Siri 檢索、donation 用於教系統學使用模式、RelevantEntities 用於提示特定情境下相關的內容。"},{"t":425,"title":"Handle entities efficiently with EntityCollection","body":"回到旅遊追蹤 app，新增讓使用者儲存自己旅遊照片的相簿，並定義帶 photos app schema 的 **PhotoEntity**，以及一個用關鍵字為照片加標籤的 intent。隨著照片庫變大，發現一次標記大量照片比預期慢，引出對問題成因的探討。"},{"t":435,"title":"Handle large entity sets with EntityCollection","body":"問題根源在於 App Intents 在 intent 執行前會解析每個 entity（呼叫 entity query 填滿所有屬性），即使這個標籤 intent 只需要 entity ID，仍會解析成千上萬個 photo entity。**EntityCollection** 解法是儲存 entity 識別碼陣列而非完整解析的 entities，將 @Parameter 改為 EntityCollection 後系統只把識別碼傳給 perform，用 `photos.identifiers` 直接更新資料模型；實測標記 1000 張照片由緩慢變為近乎即時。"},{"t":535,"title":"Use entities across devices with SyncableEntity","body":"2027 版本讓 Siri 能跨裝置延續對話，entity 也要能參與其中。問題在於 entity 的 ID 常是各裝置本地產生，同一 entity 在不同裝置會有不同 ID，導致在 iPhone 加入相簿的照片，換到另一裝置請 Siri 加標籤時可能找不到。Siri 跨裝置引用 entity 需要一個處處相同的 **stableID**（可來自伺服器或 CloudKit record ID）。"},{"t":614,"title":"Make entity IDs stable with SyncableEntity","body":"**SyncableEntity** 用來向系統宣告 entity 的 ID 是穩定、可跨裝置使用的。採用方式是讓 entity 遵循 SyncableEntity 協定：若 ID 本就跨裝置相同（如伺服器 UUID 或 CloudKit record ID）即可直接使用；若用的是本地識別碼（如 CoreData row ID），則以 **SyncableEntityIdentifier** 把 local 與 stable ID 配成單一 ID，裝置上用 local、跨裝置時系統用 stable。"},{"t":661,"title":"Richer parameter types","body":"說明宣告 @Parameter 即可免費獲得原生 picker、Siri 理解與在地化，而此次把同樣支援擴展到更多原生型別。新增對 **Duration** 的原生支援（不必再自製時間選擇器）、用 **PersonNameComponents** 取代純字串做結構化姓名輸入等，每個型別都附帶原生 picker，並在 Siri、Shortcuts、Widgets 等 intent 出現處皆可運作。"},{"t":718,"title":"Accept multiple types with @UnionValue","body":"說明 union value 是一個 Swift enum、每個 case 包裝不同型別，讓單一 parameter 能代表多個選項之一。以同時擁有 landmarks 與旅遊照片的需求為例，想用單一 widget 同時顯示相簿或 landmark collection 的照片，**@UnionValue** 對輸入 parameter 的支援正好讓一個 widget 涵蓋兩者。"},{"t":758,"title":"Union value parameters","body":"示範以 **@UnionValue** 巨集將 enum 定義為 union value，兩個 case 分別包裝 LandmarkCollectionEntity 與 PhotoAlbumEntity；巨集自動產生型別資訊、case metadata 與 picker 支援。並用 **typeDisplayRepresentation** 設定整體型別標籤、**caseDisplayRepresentations** 對應各 case 在 picker 顯示的名稱，且此能力不限 Widgets，在 Shortcuts 等所有 intent 出現之處皆可運作。"},{"t":806,"title":"Extend execution with LongRunningIntent","body":"指出 intent 從任何系統介面執行時只有 30 秒可完成，對多數日常動作足夠但非全部。以「不開 app 就把旅遊照片上傳到共享相簿」的上傳 intent 為例，大照片上傳因超過 30 秒上限而持續失敗，引出對 LongRunningIntent 的需求。"},{"t":821,"title":"Run beyond 30 s with LongRunningIntent + CancellableIntent","body":"**LongRunningIntent** 讓 intent 突破 30 秒上限並管理 app 背景任務生命週期，進度會自動以 **Live Activity** 呈現；它建構於 ProgressReportingIntent 之上，須回報 progress（範例以 performBackgroundTask 包裝工作、計算 chunk 數並逐塊更新進度）。Live Activity 上有停止鈕讓使用者隨時取消，而 **CancellableIntent** 透過 onCancel handler 在取消、逾時或系統回收資源時取得原因並優雅清理部分上傳。LongRunningIntent 在支援裝置上亦支援背景 GPU 存取（需加入對應 entitlement）。"},{"t":927,"title":"Target the right process with ExecutionTargets","body":"說明隨 app 成長，intent 可能被移到 Widget extension 或 App Intents extension 等輕量獨立 process，且常把 intent、entity、query 放進共享 Swift package 供 app 與 extension 匯入。此時系統需依啟發式（如 app 已在執行就偏好 app、否則啟動 extension）決定由哪個 process 執行，但這未必正確——例如想在 widget 加最愛按鈕，但兩個 process 同時寫同一資料庫會衝突，故 widget 設唯讀、寫入交由主 app。"},{"t":1014,"title":"Control which process runs your intent with ExecutionTargets","body":"**ExecutionTargets** 讓你明確告訴系統哪個 process 該執行 intent：可指定主 app、appIntentsExtension、widgetKitExtension 或任意組合（透過 `allowedExecutionTargets`），藉此覆寫系統的啟發式選擇。例如寫入操作鎖定 `.main`、獨立下載走 extension、純顯示走 widget extension，或允許多個目標讓系統自選。"},{"t":1034,"title":"Next steps","body":"總結建議的後續行動：為 entity 加上 **ValueRepresentation** 以攜帶結構化資料跨 app、用 **RelevantEntities** 向系統註冊相關內容、採用 **EntityCollection** 加速大量 entity 的處理、為需超過 30 秒的 intent 加上 **LongRunningIntent**。並指向「Code-along: Make your app available to Siri」以逐步建構 Siri 體驗，以及用 **AppIntentsTesting** 框架測試 intent 的相關專場。"}],"summary_en":["**App Intents** is the framework that exposes your app's actions and content to the rest of the system (Siri, Shortcuts, Spotlight, Widgets) and is now a core pillar of **Apple Intelligence**. App Intents engineer Moe introduces the new, feature-request-driven capabilities in the 2027 releases, focused on three areas: entities, richer parameter types, and intent execution control. The session builds on the WWDC25 Landmarks travel tracking sample app to demonstrate each step.","On entities, the new **ValueRepresentation** lets an entity share structured data such as coordinates (via GeoToolbox's **PlaceDescriptor**) with apps like Maps that need structured info, filling the gap left by file/data representations that only work for known formats. **RelevantEntities** lets you proactively tell the system which entities are relevant in a context (like starting a run), covering brand-new content that Spotlight indexing and interaction donation can't reach because it was never searched or used. For performance, **EntityCollection** passes only entity identifiers instead of fully resolved entities, turning batch operations over thousands of entities from slow to nearly instant. **SyncableEntity** provides stable IDs for cross-device Siri conversations, pairing local and stable IDs with **SyncableEntityIdentifier**.","For parameter types, the framework adds native pickers, Siri understanding, and localization to more native types (like **Duration** and **PersonNameComponents**), removing the need for custom pickers. The **@UnionValue** macro lets a single parameter accept multiple types, an enum whose cases each wrap a different entity type, with type info, case metadata, and picker support generated automatically, working everywhere your intent does including Widgets and Shortcuts.","For execution control, **LongRunningIntent** breaks past the default 30-second limit, manages the app's background task lifecycle, and surfaces progress automatically as a **Live Activity** (it must report progress); paired with **CancellableIntent**, an onCancel handler cleans up gracefully when the user cancels, the system times out, or resources are reclaimed. **ExecutionTargets** lets you specify exactly which process runs an intent (main app, App Intents extension, WidgetKit extension, or a combination), overriding the system's heuristics, for example pinning write operations to the main app to avoid conflicts from multiple processes writing the same data."],"deepdive_en":[{"t":0,"title":"Introduction","body":"App Intents engineer **Moe** opens by describing **App Intents** as the framework that expresses your app's actions and content naturally and deeply across Siri, Shortcuts, Spotlight, and Widgets, now a key pillar of **Apple Intelligence**. He previews the 2027 releases bringing more control, flexibility, and a smoother developer experience across three themes, entities, native types and union values, and execution control, building on the WWDC25 Landmarks travel tracking app."},{"t":1,"title":"Share structured entities with ValueRepresentation","body":"Explains that people move between apps but entities (like a landmark) originally live only inside their own app. Existing Transferable file/data representations work for known formats like PDFs and images but can't carry structured types with no file format (such as coordinates), so a need like getting directions to a landmark (handing it to Maps) doesn't work."},{"t":160,"title":"Share entities across apps with ValueRepresentation","body":"**ValueRepresentation** is a new representation type for sharing structured types the system already understands. The example adds a ValueRepresentation alongside **LandmarkEntity**'s existing Transferable, exporting the coordinate and name as GeoToolbox's **PlaceDescriptor** (carrying the coordinates and metadata Maps needs to navigate); if the entity already has a PlaceDescriptor @Property, a key-path replaces the closure entirely. Running the shortcut then flows the landmark to Maps as a PlaceDescriptor and opens directions."},{"t":225,"title":"Register relevant entities with RelevantEntities","body":"Using the CosmoTunes music app's brand-new high-tempo running playlist, the question is how to get it into the Fitness app's suggestions when someone sets up a run. The two existing ways to surface content, indexing with **Spotlight** (also the primary path for Siri retrieval) and interaction donation via **IntentDonationManager** so the system learns patterns, both miss the new playlist since it was never searched or played."},{"t":318,"title":"Register relevant entities with RelevantEntities","body":"**RelevantEntities** lets you proactively suggest entities and provide context for when they're relevant. You identify the relevant entities (running playlists), create a context telling the system they're relevant when someone starts a run, then call `updateEntities` to register them, and the system surfaces them as suggestions in the right context even if never played. Entities stay registered until removed, per context or across all contexts. The talk summarizes the tradeoff: Spotlight for searchable/Siri-retrievable content, donation to teach usage patterns, and RelevantEntities to hint context-specific relevance."},{"t":425,"title":"Handle entities efficiently with EntityCollection","body":"Back in the travel tracking app, a photo album lets people save their own travel photos, with a **PhotoEntity** defined using the photos app schema, plus an intent to tag photos by keyword. As the library grew, tagging many photos at once turned out slower than expected, motivating a look at why."},{"t":435,"title":"Handle large entity sets with EntityCollection","body":"The cause is that App Intents resolves every entity before an intent runs (calling the entity query to populate all properties), so even though the tagging intent only needs the entity ID, it resolves thousands of photo entities. **EntityCollection** stores an array of entity identifiers instead of fully resolved entities; switching the @Parameter to EntityCollection makes the system pass just identifiers to perform, using `photos.identifiers` directly, and tagging 1000 photos went from slow to almost instant."},{"t":535,"title":"Use entities across devices with SyncableEntity","body":"The 2027 releases let Siri continue conversations across devices, and entities should take part. The challenge is that entity IDs are often generated locally per device, so the same entity ends up with different IDs, meaning a photo added to an album on iPhone might not be findable when asking Siri to tag it on another device. Cross-device referencing needs a **stableID** that's the same everywhere, from a server or CloudKit record ID."},{"t":614,"title":"Make entity IDs stable with SyncableEntity","body":"**SyncableEntity** declares to the system that an entity's ID is stable and usable across devices. To adopt it, conform the entity to SyncableEntity: if the ID is already the same across devices (a server UUID or CloudKit record ID) no further change is needed; if you use local identifiers (like CoreData row IDs), **SyncableEntityIdentifier** pairs a local and a stable ID into one, using the local ID on-device and the stable one across devices."},{"t":661,"title":"Richer parameter types","body":"Declaring a @Parameter gives you a native picker, Siri understanding, and localization for free, and this support is now extended to more native types. New native support for **Duration** removes the need for custom time pickers, **PersonNameComponents** enables structured name input instead of a plain string, and more, each getting a native picker and working everywhere the intent does, Siri, Shortcuts, and Widgets."},{"t":718,"title":"Accept multiple types with @UnionValue","body":"A union value is a Swift enum whose cases each wrap a different type, letting one parameter represent one of several options. With both landmarks and travel photos in the app, the goal is a single widget showing photos from either a photo album or a landmark collection, and **@UnionValue** support for input parameters lets one widget cover both."},{"t":758,"title":"Union value parameters","body":"Demonstrates defining a union value enum with the **@UnionValue** macro, with cases wrapping LandmarkCollectionEntity and PhotoAlbumEntity; the macro generates type information, case metadata, and picker support. **typeDisplayRepresentation** sets the overall type label and **caseDisplayRepresentations** maps each case to its picker name, and this isn't limited to Widgets, working everywhere the intent does including Shortcuts."},{"t":806,"title":"Extend execution with LongRunningIntent","body":"Notes that an intent run from any system surface has only 30 seconds to finish, fine for most everyday actions but not all. With an upload intent to share travel photos to a shared album without opening the app, large photos kept failing because the upload couldn't finish within 30 seconds, motivating LongRunningIntent."},{"t":821,"title":"Run beyond 30 s with LongRunningIntent + CancellableIntent","body":"**LongRunningIntent** lets an intent run past the 30-second limit and manages the app's background task lifecycle, with progress shown automatically as a **Live Activity**; built on ProgressReportingIntent, it requires reporting progress (the example wraps work in performBackgroundTask, computes chunk counts, and updates progress per chunk). The Live Activity has a stop button to cancel anytime, and **CancellableIntent**'s onCancel handler receives the reason to clean up partial uploads on cancel, timeout, or resource reclamation. LongRunningIntent also supports background GPU access on supported devices (requiring the corresponding entitlement)."},{"t":927,"title":"Target the right process with ExecutionTargets","body":"As an app grows, intents may move into lightweight separate processes like a Widget extension or App Intents extension, with intents, entities, and queries often living in a shared Swift package imported by the app and extensions. The system then decides which process runs each intent via heuristics (prefer the app if running, otherwise launch the extension), but that isn't always right, for example a favorite button in a widget where two processes writing the same data store would conflict, so the widget gets read-only access and the main app handles writes."},{"t":1014,"title":"Control which process runs your intent with ExecutionTargets","body":"**ExecutionTargets** lets you tell the system exactly which process runs an intent: target the main app, appIntentsExtension, widgetKitExtension, or any combination (via `allowedExecutionTargets`), overriding the system's heuristics. For example pin a write operation to `.main`, run a standalone download in the extension, a display-only intent in the widget extension, or allow multiple targets so the system chooses."},{"t":1034,"title":"Next steps","body":"Summarizes recommended next steps: add **ValueRepresentation** so entities carry structured data across apps, register relevant content with **RelevantEntities**, adopt **EntityCollection** to speed up intents over many entities, and add **LongRunningIntent** for any intent needing more than 30 seconds. It points to \"Code-along: Make your app available to Siri\" for building the Siri experience step by step, and the **AppIntentsTesting** framework session for testing intents."}],"code":["struct LandmarkEntity: AppEntity, Transferable {\n      var id: Int\n      var landmark: Landmark  // contains CLLocationCoordinate2D\n\n      static var transferRepresentation: some TransferRepresentation {\n          ValueRepresentation(\n              exporting: { entity in\n                  PlaceDescriptor(\n                      representations: [.coordinate(entity.landmark.locationCoordinate)],\n                      commonName: entity.landmark.name\n                  )\n              }\n          )\n      }\n  }\n\n  // If the entity already has a PlaceDescriptor property, use a key-path — much less code:\n  struct LandmarkEntity: AppEntity, Transferable {\n      var id: Int\n      @Property var placeDescriptor: PlaceDescriptor\n\n      static var transferRepresentation: some TransferRepresentation {\n          ValueRepresentation(exporting: \\.placeDescriptor)\n      }\n  }","// Suggest playlists for the workout session\n  let playlistEntities = [dailyRun, runningMix]\n  let workoutContext = AppEntityContext.audio(.workout(activityType: .running))\n\n  try await RelevantEntities.shared.updateEntities(\n      playlistEntities, for: workoutContext\n  )\n  \n  // Clear all entities for a context\n  try await RelevantEntities.shared.removeAllEntities(for: workoutContext)\n\n  // Remove specific entities from a context\n  try await RelevantEntities.shared.removeEntities(playlistEntities, from: workoutContext)\n\n  // Or remove all entities across all contexts\n  try await RelevantEntities.shared.removeAllEntities()","struct TagPhotosIntent: AppIntent {\n      static let title: LocalizedStringResource = \"Tag Travel Photos\"\n\n      @Parameter var photos: EntityCollection\u003cPhotoEntity>   // was: [PhotoEntity]\n      @Parameter var tag: String\n\n      func perform() async throws -> some IntentResult {\n          modelData.tagPhotos(ids: photos.identifiers, tag: tag)   // was: tagPhotos(photos, tag: tag)\n          return .result()\n      }\n  }","// If your ID is already stable across devices (server UUID, CloudKit record ID):\n  struct PhotoEntity: AppEntity, SyncableEntity {\n      var id: Int  // Already stable across devices — that's it\n  }\n  \n  // If you use local IDs, pair a local and a stable ID:\n  struct PhotoEntity: AppEntity, SyncableEntity {\n      var id: SyncableEntityIdentifier\u003cString, String>\n\n      init(localID: String, stableID: String) {\n          self.id = SyncableEntityIdentifier(local: localID, stable: stableID)\n      }\n  }","@UnionValue\n  enum TravelGalleryContent {\n      case landmarkCollection(LandmarkCollectionEntity)\n      case photoAlbum(PhotoAlbumEntity)\n\n      static let typeDisplayRepresentation: TypeDisplayRepresentation = \"Travel Gallery\"\n      static let caseDisplayRepresentations: [Cases: DisplayRepresentation] = [\n          .landmarkCollection: \"Landmark Collection\",\n          .photoAlbum: \"Photo Album\"\n      ]\n  }","struct UploadPhotoIntent: LongRunningIntent, CancellableIntent {\n      static let title: LocalizedStringResource = \"Upload Photo\"\n\n      @Parameter var photo: IntentFile\n  \n      func perform() async throws -> some IntentResult & ProvidesDialog {\n          let result = try await performBackgroundTask {\n              let chunks = calculateChunks(for: photo)\n              progress.totalUnitCount = Int64(chunks)\n\n              for chunk in 1...chunks {\n                  try Task.checkCancellation()\n                  try await uploadChunk(chunk)\n                  progress.completedUnitCount = Int64(chunk)\n              }\n              return \"Upload complete!\"\n          } onCancel: { reason in\n              cleanup(for: reason)\n          }\n          return .result(dialog: \"\\(result)\")\n      }\n  }","// Write operation — needs the main app\n  struct UpdateFavoriteIntent: AppIntent {\n      static var allowedExecutionTargets: ExecutionTargets { .main }\n  }\n\n  // Standalone download — runs in the extension\n  struct DownloadPhotoIntent: AppIntent {\n      static var allowedExecutionTargets: ExecutionTargets { .appIntentsExtension }\n  }\n\n  // Display-only — runs in the widget extension\n  struct GetLandmarkStatusIntent: AppIntent {\n      static var allowedExecutionTargets: ExecutionTargets { .widgetKitExtension }\n  }\n\n  // Works in either — lets the system choose\n  struct TagPhotosIntent: AppIntent {\n      static var allowedExecutionTargets: ExecutionTargets { [.main, .appIntentsExtension] }\n  }"]},"related":[{"id":"240","title":"Build intelligent Siri experiences with App Schemas","gloss":"用 App Schemas 打造智慧 Siri 體驗","gloss_en":"Build intelligent Siri experiences with App Schemas","category":"ai","categoryLabel":"AI 與機器學習"},{"id":"297","title":"Best practices for integrating visual intelligence in your app","gloss":"在 App 中整合視覺智慧的最佳實務","gloss_en":"Best practices for integrating visual intelligence in your app","category":"ai","categoryLabel":"AI 與機器學習"},{"id":"310","title":"What’s new in Shortcuts","gloss":"捷徑有什麼新東西","gloss_en":"What's new in Shortcuts","category":"ai","categoryLabel":"AI 與機器學習"},{"id":"344","title":"Code-along: Make your app available to Siri","gloss":"程式碼實作：讓你的 App 可被 Siri 使用","gloss_en":"Code-along: Make your app available to Siri","category":"ai","categoryLabel":"AI 與機器學習"},{"id":"382","title":"Inside Apple Intelligence and Xcode: Special Presentation","gloss":"深入 Apple Intelligence 與 Xcode：特別發表","gloss_en":"Inside Apple Intelligence and Xcode: Special Presentation","category":"ai","categoryLabel":"AI 與機器學習"}]}</script>
