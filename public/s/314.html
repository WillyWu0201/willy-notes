<script id="d" type="application/json">{"s":{"id":"314","title":"Learn CSS Grid Lanes","gloss":"認識 CSS Grid Lanes","category":"other","categoryLabel":"其他","duration":625,"url":"https://developer.apple.com/videos/play/wwdc2026/314/","takeaway":"全新的 **CSS Grid Lanes** 讓你用 `display: grid-lanes` 排列各種形狀大小的內容，打造能自適應的網頁版面。","chapters":[[0,"Introduction"],[95,"CSS Flexbox and Grid"],[165,"CSS Grid Lanes"],[235,"Build a Grid Lanes container"],[238,"Create a Grid Lanes Container"],[242,"Create a Grid Lanes Container"],[266,"Create a Grid Lanes Container"],[271,"Implement brick variation"],[273,"Implement a Brick Variation"],[276,"Implement a Brick Variation"],[289,"Experiment with different layouts"],[298,"Experiment with different layouts"],[302,"Experiment with different layouts"],[310,"Experiment with different layouts"],[324,"Experiment with different layouts"],[340,"Control individual items"],[345,"Control Individual Items"],[359,"Control Individual Items"],[367,"Control Individual Items"],[382,"Integrate Subgrid"],[394,"Integrate Subgrid"],[408,"Integrate Subgrid"],[425,"Flow Tolerance"],[517,"Improve item positioning"],[521,"Improve item positioning"],[526,"Web Inspector"],[560,"Next steps"]],"points":[{"text":"用 **`display: grid-lanes`** 建立容器，結合 `grid-template-columns` 與 `gap` 即可排列不同形狀的內容。","hot":true},{"text":"搭配 `repeat(auto-fill, minmax(...))` 做出能自適應的**磚塊式（brick）**版面與多種欄寬組合。","hot":false},{"text":"以 `grid-column: span 2` 或 `grid-column: 2 / span 2` 控制個別項目的跨欄與位置。","hot":false},{"text":"整合 **Subgrid**（`grid-template-columns: subgrid`）讓子項目對齊父層格線。","hot":false},{"text":"用新的 **`flow-tolerance`** 屬性調整項目排列的容差，並可在 Web Inspector 中檢視 Grid Lanes。","hot":false}],"apis":["grid-lanes","grid-template-columns","grid-column","subgrid","flow-tolerance"],"audience":"**使用 Safari／WebKit 開發自適應網頁版面**的前端開發者。","gloss_en":"Learn CSS Grid Lanes","takeaway_en":"The new **CSS Grid Lanes** lets you arrange content of all shapes and sizes with `display: grid-lanes` to build adaptive web layouts.","points_en":[{"text":"Create a container with **`display: grid-lanes`**, then combine `grid-template-columns` and `gap` to arrange differently-shaped content.","hot":true},{"text":"Pair it with `repeat(auto-fill, minmax(...))` to build adaptive **brick** layouts and varied column-width combinations.","hot":false},{"text":"Control an individual item's column span and position with `grid-column: span 2` or `grid-column: 2 / span 2`.","hot":false},{"text":"Integrate **Subgrid** (`grid-template-columns: subgrid`) to align child items to the parent grid lines.","hot":false},{"text":"Adjust the tolerance of item placement with the new **`flow-tolerance`** property, and inspect Grid Lanes in Web Inspector.","hot":false}],"audience_en":"**Front-end developers building adaptive web layouts with Safari/WebKit**.","summary":["這場由 Safari 團隊工程師 Brandon 主講，主題是 CSS 的全新版面模式 **Grid Lanes**。它解決的是一個長期讓網頁開發者頭痛的需求：當內容（尤其是圖片）有著各種不同的形狀與尺寸時，如何讓它們自然地填入可用空間、緊密堆疊而不留下大片空白。這種版型過去常被稱為 **masonry layout**（瀑布流／磚牆排版），開發者往往得仰賴 JavaScript 函式庫，或勉強用 floats、Flexbox 拼湊，結果總是「差一點就能用」。Grid Lanes 從根本上把這件事變成幾行 CSS 就能完成，而且自 **Safari 26.4** 起就已可使用，其他瀏覽器則在 flag 之後支援。","理解 Grid Lanes 的關鍵，是把它放在 **Flexbox** 與 **Grid** 之間來看。每種版面模式都在回答兩個問題：項目放在哪裡、能拿到多少空間。Flexbox 給你一個軸、單一通道流動；Grid 給你欄與列兩個維度、把項目放進交叉的儲存格，但遇到不同長寬比的內容就會留下空白。Grid Lanes 折衷其間——只結構化單一方向（欄或列，二擇一），另一方向放任自由，項目逐一被放進「目前最短的那一欄」，於是形成緊湊、交錯且保留各自原始比例的版型。用法上以 `display: grid-lanes` 起手，搭配 `grid-template-columns` 與 `gap`，把欄換成 `grid-template-rows` 就從瀑布流變成磚牆。","Grid Lanes 最貼心的地方在於它幾乎完全沿用既有的 Grid 語法與心智模型。你可以用 `fr` 單位調整各欄比例、用 `repeat(auto-fill, minmax(...))` 讓瀏覽器自動決定欄數、用 `grid-column: span 2` 或明確的 `grid-column: 2 / span 2` 讓單一項目跨欄（但列由系統決定，無法手動指定）。卡片內部還能透過 `grid-template-columns: subgrid` 加入 **Subgrid**，讓子內容也對齊父層版面。","進階控制則靠 **flow-tolerance**。預設情況下瀏覽器永遠把下一個項目塞進最短的欄，但當兩欄高度只差幾像素時，這會造成視覺順序與 tab 順序錯位，進而傷害**無障礙**體驗。flow-tolerance（預設 `1em`）就是放寬這條規則的旋鈕：只要較高欄不超過較矮欄加上容差，就仍填入原欄，避免左右來回跳動。當結果不如預期時，**Web Inspector** 已完整支援 Grid Lanes，可疊加顯示欄列線、每個項目的排列順序編號與間距。整體而言，Grid Lanes 用幾行 CSS 取代了過去得靠 JavaScript 的版型，並讓版面去適應內容，而非反過來。"],"deepdive":[{"t":0,"title":"Introduction","body":"Safari 團隊的 Brandon 開場介紹 **Grid Lanes** 這個網頁全新版面模式，目標是讓任意尺寸的項目自然流入可用空間。他點明這正是大家熟知的 **masonry layout**：縱向看是內容如瀑布般落下的瀑布流，翻轉方向則成為橫向流動的磚牆。重點訊息是「不必再等」——此功能自 **Safari 26.4** 起已可使用，其他瀏覽器則在 flag 之後支援。"},{"t":95,"title":"CSS Flexbox and Grid","body":"講者退一步說明每種版面模式都在回答兩個問題：項目放在哪、能拿到多少空間。**Flexbox** 只有一個軸、單一通道，項目依序流動並換行；**Grid** 則提供欄與列兩個維度，把項目放進交叉儲存格。問題在於當內容長寬比不同時，Grid 會留下大片空白，而拉伸、放大裁切或縮放都會破壞圖片，凸顯出需要一個折衷方案。"},{"t":165,"title":"CSS Grid Lanes","body":"正式定義 **Grid Lanes**：它介於 Grid 與 Flex 之間，只結構化單一方向、另一方向放任自由，但又不像 Flex 只有單一通道，而是把內容分配到多條 lane。項目逐一被放進「能讓它離頂端最近」的那一欄，因此較早的項目位置較高、後面的填補在下方，形成緊湊交錯且保留各自原始比例的版型。它不挑內容，圖片或文字皆可，文字會自動換行並由瀏覽器決定高度，需要突顯的標題還能跨欄。"},{"t":235,"title":"Build a Grid Lanes container","body":"進入實作環節，示範如何從零建立一個 Grid Lanes 容器，作為後續逐步加上欄定義與屬性的起點。"},{"t":238,"title":"Create a Grid Lanes Container","body":"以 `display: grid-lanes` 宣告容器，這是啟用整個版面模式的第一步。"},{"t":242,"title":"Create a Grid Lanes Container","body":"加入 `grid-template-columns: repeat(3, 1fr)` 定義欄軌。講者解釋 **`fr`**（fractional unit）會把容器可用空間切成等分，此處即切成三等分形成三個等寬欄。"},{"t":266,"title":"Create a Grid Lanes Container","body":"補上 `gap: 10px` 設定項目間距，用法與 Grid 完全相同，至此三行 CSS 就完成一個基本的 Grid Lanes 容器。"},{"t":271,"title":"Implement brick variation","body":"示範如何把瀑布流轉成磚牆變體，關鍵只是切換主結構方向。"},{"t":273,"title":"Implement a Brick Variation","body":"把 `grid-template-columns` 換成 `grid-template-rows`，版面立刻從垂直瀑布流翻轉成水平流動的磚牆。"},{"t":276,"title":"Implement a Brick Variation","body":"強調唯一的限制：方向只能擇一，不能同時對欄與列都做結構化，這正是 Grid Lanes 與雙維度 Grid 的本質差異。"},{"t":289,"title":"Experiment with different layouts","body":"展示這三行 CSS 其實能變化出意料之外的多種版型，鼓勵開發者動手嘗試。"},{"t":298,"title":"Experiment with different layouts","body":"從三個等寬欄出發，示範各欄寬度不必相等，例如用 `1fr 2fr 1fr` 讓中間欄佔據左右兩欄兩倍的空間。"},{"t":302,"title":"Experiment with different layouts","body":"改用 `repeat(auto-fill, minmax(200px, 1fr))` 讓瀏覽器自行決定欄數：**`auto-fill`** 盡可能塞入欄，**`minmax()`** 規定每欄至少 200px、可成長以填滿空間。"},{"t":310,"title":"Experiment with different layouts","body":"進一步以 `minmax` 組合出窄欄與寬欄交替的重複樣式，展現只用少量 CSS 就能做到的彈性。"},{"t":324,"title":"Experiment with different layouts","body":"講者總結最欣賞的是這套版面模式的高表達力——少量 CSS 就能做出豐富變化，鼓勵觀眾自行探索。"},{"t":340,"title":"Control individual items","body":"從整體版面轉向單一項目的塑形，說明 Grid Lanes 也能控制個別 item 的呈現。"},{"t":345,"title":"Control Individual Items","body":"回到三個等寬欄的容器，示範要給某個項目更多空間時，可直接沿用 Grid 既有的屬性來達成。"},{"t":359,"title":"Control Individual Items","body":"用 `grid-column: span 2` 讓項目橫跨兩欄，其餘版面會自動環繞調整。"},{"t":367,"title":"Control Individual Items","body":"改用 `grid-column: 2 / span 2` 精確指定項目從第 2 欄開始、橫跨第 2 與第 3 欄。重點提示：你能控制**欄**的位置，但**列**由 Grid Lanes 自行決定。"},{"t":382,"title":"Integrate Subgrid","body":"示範把某個跨兩欄的項目做成食譜卡，卡片內含圖片與文字，但這些子內容預設並不參與父層 Grid Lanes 版面。"},{"t":394,"title":"Integrate Subgrid","body":"在卡片上加入 `display: grid-lanes` 與 `grid-template-columns: subgrid`，讓卡片內容以各自獨立的 item 身份加入父層版面：圖片佔一欄、文字佔另一欄，各依內容自動調整大小。"},{"t":408,"title":"Integrate Subgrid","body":"強調可任意巢狀：Grid Lanes 容器內放一般 Grid，或反過來都行。既有的工具與語法直接沿用，因此 **Subgrid** 與 Grid Lanes 能無縫整合。"},{"t":425,"title":"Flow Tolerance","body":"引入 **flow-tolerance**。瀏覽器預設總把下一個項目放進最短欄，但當兩欄高度只差幾像素時，會讓視覺排列在第一列左到右、最後一列右到左，造成與 tab 順序錯位、傷害**無障礙**。flow-tolerance 是放寬此規則的旋鈕：對每個新項目都問「較高欄是否小於較矮欄加上容差？」，是則仍填入原欄、否則才落入較矮欄。預設值為 `1em`，建議依內容調整。"},{"t":517,"title":"Improve item positioning","body":"延續 flow-tolerance 的概念，示範如何透過調整容差值來改善項目落點，讓視覺順序更符合預期。"},{"t":521,"title":"Improve item positioning","body":"把 `flow-tolerance` 設成具體數值（如 `2.1em`），實際比較不同容差對排列結果的影響，找出最適合自身內容的設定。"},{"t":526,"title":"Web Inspector","body":"說明當瀏覽器的彈性導致結果出乎意料時，可開啟 **Web Inspector** 除錯。它已完整支援 Grid Lanes，疊加 overlay 後會顯示欄列線、投影在每個項目上的排列順序編號，以及項目之間的間距。"},{"t":560,"title":"Next steps","body":"結語強調 Grid Lanes 用幾行 CSS 取代了過去得靠 JavaScript 的版型，並讓版面去適應內容。講者推薦 WebKit 團隊製作的 **Grid Lanes Field Guide**（含互動範例），鼓勵在專案中試用、透過 Feedback 回報，並延伸觀看「What's new in WebKit for Safari 27」。"}],"summary_en":["Presented by Safari engineer Brandon, this session introduces **Grid Lanes**, a new CSS layout mode. It solves a long-standing pain point: arranging content (especially images) of differing shapes and sizes so it flows naturally into available space, packing tightly without leaving large empty gaps. This pattern is widely known as **masonry layout** (a waterfall or brick-wall arrangement), and developers have historically reached for JavaScript libraries or improvised with floats and Flexbox that 'almost works.' Grid Lanes reduces it to a few lines of CSS, and it is available starting in **Safari 26.4** (behind a flag in other browsers).","The key to understanding Grid Lanes is positioning it between **Flexbox** and **Grid**. Every layout mode answers two questions: where do items go, and how much space do they get. Flexbox gives one axis and a single lane; Grid gives two dimensions placing items into intersecting cells, but leaves empty space when aspect ratios differ. Grid Lanes splits the difference—it structures only one direction (columns or rows, your choice) and leaves the other free, placing each item into whichever column currently leaves it closest to the top. The result is a tightly packed, staggered layout that preserves each item's natural proportions. You start with `display: grid-lanes`, add `grid-template-columns` and `gap`; swap columns for `grid-template-rows` to turn a waterfall into a brick wall.","Grid Lanes deliberately reuses existing Grid syntax and mental models. You can adjust column ratios with the `fr` unit, let the browser pick the column count with `repeat(auto-fill, minmax(...))`, and span an item across columns with `grid-column: span 2` or an explicit `grid-column: 2 / span 2` (you control column placement but not the row—Grid Lanes decides that). Inside a card, `grid-template-columns: subgrid` brings **Subgrid** in so child content aligns with the parent layout, and you can nest grids and grid-lanes inside one another freely.","Advanced control comes from **flow-tolerance**. By default the browser always drops the next item into the shortest column, but when two columns differ by only a few pixels this can flip visual order against tab order, hurting **accessibility**. flow-tolerance (default `1em`) is the dial that loosens this rule: if the taller column is still within the shorter column plus tolerance, the item stays put, avoiding left-right ping-ponging. When results surprise you, **Web Inspector** has full Grid Lanes support—overlaying column and row lines, per-item order numbers, and the gaps between items. Overall Grid Lanes replaces what used to require JavaScript with a few lines of CSS, and adapts the layout to your content rather than the other way around."],"deepdive_en":[{"t":0,"title":"Introduction","body":"Safari engineer Brandon introduces **Grid Lanes**, a new web layout mode that lets items of any size flow naturally into available space. He frames it as the familiar **masonry layout**: vertically it reads like a waterfall, and flipped it becomes a brick wall of items flowing across rows. The key message is that there's no need to wait—it ships in **Safari 26.4** and is available behind a flag in other browsers."},{"t":95,"title":"CSS Flexbox and Grid","body":"He steps back to note that every layout mode answers two questions: where items go and how much space they get. **Flexbox** offers one axis and a single lane with wrapping; **Grid** offers two dimensions, placing items into intersecting cells. The problem is that differing aspect ratios leave large empty areas in Grid, and stretching, zoom-cropping, or scaling all damage images—motivating a middle ground."},{"t":165,"title":"CSS Grid Lanes","body":"He defines **Grid Lanes** as sitting between Grid and Flex: it structures only one direction and leaves the other free, but unlike Flex it distributes content across multiple lanes. Items are placed one by one into whichever column leaves them closest to the top, so earlier items sit higher and later ones fill below, producing a tightly packed staggered layout that preserves proportions. It works with any content—images or text, where text wraps and the browser sizes heights, and headlines can span columns."},{"t":235,"title":"Build a Grid Lanes container","body":"The demo section begins, building a Grid Lanes container from scratch as the foundation for adding column definitions and properties step by step."},{"t":238,"title":"Create a Grid Lanes Container","body":"Declare the container with `display: grid-lanes`, the first step that activates the entire layout mode."},{"t":242,"title":"Create a Grid Lanes Container","body":"Add `grid-template-columns: repeat(3, 1fr)` to define the tracks. He explains that **`fr`** (fractional unit) divides the container's available space into fractions—here three equal columns."},{"t":266,"title":"Create a Grid Lanes Container","body":"Add `gap: 10px` for spacing between items, identical to Grid usage, completing a basic Grid Lanes container in three lines of CSS."},{"t":271,"title":"Implement brick variation","body":"Demonstrates converting the waterfall into a brick-wall variation, where the key is simply switching the structured direction."},{"t":273,"title":"Implement a Brick Variation","body":"Replace `grid-template-columns` with `grid-template-rows`, instantly flipping the layout from a vertical waterfall into a horizontally flowing brick wall."},{"t":276,"title":"Implement a Brick Variation","body":"He stresses the one catch: you pick one direction, not both—you cannot structure columns and rows simultaneously, which is the essential difference from two-dimensional Grid."},{"t":289,"title":"Experiment with different layouts","body":"Shows that these three lines of CSS can yield surprisingly varied layouts, encouraging developers to experiment."},{"t":298,"title":"Experiment with different layouts","body":"Starting from three equal columns, he shows columns need not be equal—using `1fr 2fr 1fr` makes the center column take twice the space of the sides."},{"t":302,"title":"Experiment with different layouts","body":"Switching to `repeat(auto-fill, minmax(200px, 1fr))` lets the browser decide the column count: **`auto-fill`** packs in as many columns as fit, while **`minmax()`** keeps each at least 200px but lets it grow to fill space."},{"t":310,"title":"Experiment with different layouts","body":"He extends the idea into a repeating pattern of narrow and wide columns via `minmax`, showing the flexibility achievable with minimal CSS."},{"t":324,"title":"Experiment with different layouts","body":"He wraps up the experimentation by noting what he loves most is the expressiveness—rich variety from a few lines of CSS—and invites viewers to explore."},{"t":340,"title":"Control individual items","body":"The focus shifts from the overall layout to shaping individual items, noting Grid Lanes can also control how a single item renders."},{"t":345,"title":"Control Individual Items","body":"Back at a three-equal-column container, he shows that giving one item more space is done with properties that already exist in Grid."},{"t":359,"title":"Control Individual Items","body":"Using `grid-column: span 2`, an item stretches across two columns and the rest of the layout adjusts around it automatically."},{"t":367,"title":"Control Individual Items","body":"Switching to `grid-column: 2 / span 2` places the item precisely starting in column 2 and spanning columns 2 and 3. Key note: you control **column** placement, but Grid Lanes decides the **row** for you."},{"t":382,"title":"Integrate Subgrid","body":"He demonstrates a two-column recipe card containing an image and text—content that by default does not participate in the parent Grid Lanes layout."},{"t":394,"title":"Integrate Subgrid","body":"Adding `display: grid-lanes` and `grid-template-columns: subgrid` to the card lets its contents join the parent layout as their own items: the image takes one column, the text the other, each sized to its content."},{"t":408,"title":"Integrate Subgrid","body":"He stresses arbitrary nesting: a regular Grid inside a Grid Lanes container or vice versa. The same tools and syntax carry over, so **Subgrid** and Grid Lanes integrate seamlessly."},{"t":425,"title":"Flow Tolerance","body":"He introduces **flow-tolerance**. By default the browser always places the next item in the shortest column, but when columns differ by only a few pixels this can make rows read left-to-right then right-to-left, mismatching tab order and hurting **accessibility**. flow-tolerance loosens the rule: for each new item it asks whether the taller column is less than the shorter plus tolerance—if so the item stays, otherwise it drops into the shorter column. The default is `1em`, and he advises tuning it to your content."},{"t":517,"title":"Improve item positioning","body":"Continuing the flow-tolerance idea, he shows how adjusting the tolerance value improves where items land so visual order better matches expectations."},{"t":521,"title":"Improve item positioning","body":"Setting `flow-tolerance` to a concrete value (such as `2.1em`), he compares how different tolerances affect the arrangement to find what works for the content."},{"t":526,"title":"Web Inspector","body":"He explains that when the browser's flexibility produces unexpected results, you can debug with **Web Inspector**. It fully supports Grid Lanes—turning on the overlay shows column and row lines, order numbers projected over each item, and the gaps between items."},{"t":560,"title":"Next steps","body":"He concludes that Grid Lanes replaces JavaScript-dependent layouts with a few lines of CSS and adapts to your content. He recommends the WebKit team's **Grid Lanes Field Guide** with interactive demos, encourages trying it in projects and sending feedback, and points to 'What's new in WebKit for Safari 27.'"}],"code":[".container {\n\tdisplay: grid-lanes;\n}",".container {\n\tdisplay: grid-lanes;\n  grid-template-columns: repeat(3, 1fr);\n}",".container {\n\tdisplay: grid-lanes;\n  grid-template-columns: repeat(3, 1fr);\n  gap: 10px;\n}",".container {\n\tdisplay: grid-lanes;\n  grid-template-columns: repeat(3, 1fr);\n  gap: 10px;\n}",".container {\n\tdisplay: grid-lanes;\n  grid-template-rows: repeat(3, 1fr);\n  gap: 10px;\n}",".container {\n\tdisplay: grid-lanes;\n  grid-template-columns: 1fr 1fr 1fr;\n  gap: 10px;\n}",".container {\n\tdisplay: grid-lanes;\n  grid-template-columns: 1fr 2fr 1fr;\n  gap: 10px;\n}",".container {\n\tdisplay: grid-lanes;\n  grid-template-columns:\n    repeat(auto-fill,\n      minmax(200px, 1fr));\n  gap: 10px;\n}",".container {\n\tdisplay: grid-lanes;\n  grid-template-columns:\n    repeat(auto-fill,\n      minmax(8rem, 1fr)\n      minmax(14rem, 2fr);\n  gap: 10px;\n}",".container {\n\tdisplay: grid-lanes;\n  grid-template-columns: 1fr 1fr 1fr;\n  gap: 10px;\n}",".container {\n\tdisplay: grid-lanes;\n  grid-template-columns: 1fr 1fr 1fr;\n  gap: 10px;\n}\n\n.item {\n  grid-column: span 2;\n}",".container {\n\tdisplay: grid-lanes;\n  grid-template-columns: 1fr 1fr 1fr;\n  gap: 10px;\n}\n\n.item {\n  grid-column: 2 / span 2;\n}"]},"related":[{"id":"101","title":"Keynote","gloss":"主題演講","gloss_en":"Keynote","category":"other","categoryLabel":"其他"},{"id":"102","title":"Platforms State of the Union","gloss":"平台現況報告","gloss_en":"Platforms State of the Union","category":"other","categoryLabel":"其他"},{"id":"111","title":"Keynote (ASL)","gloss":"主題演講(美國手語版)","gloss_en":"Keynote (American Sign Language)","category":"other","categoryLabel":"其他"},{"id":"112","title":"Platforms State of the Union (ASL)","gloss":"平台現況報告（美國手語版）","gloss_en":"Platforms State of the Union (American Sign Language)","category":"other","categoryLabel":"其他"},{"id":"122","title":"WWDC26 Platforms State of the Union Recap","gloss":"WWDC26 平台現況演講重點回顧","gloss_en":"WWDC26 Platforms State of the Union recap","category":"other","categoryLabel":"其他"}]}</script>
