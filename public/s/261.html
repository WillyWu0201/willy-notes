<script id="d" type="application/json">{"s":{"id":"261","title":"Build, deliver, and automate with Xcode Cloud","gloss":"用 Xcode Cloud 建置、交付與自動化","category":"appstore","categoryLabel":"App Store","duration":829,"url":"https://developer.apple.com/videos/play/wwdc2026/261/","takeaway":"認識 Xcode Cloud 的最新更新，快速上手建置與交付，並用 webhooks 與額外儲存庫把 CI／CD 流程自動化。","chapters":[[0,"Introduction"],[73,"Essential concepts"],[127,"Getting started"],[402,"Distribution"],[561,"Webhooks"],[682,"Additional repositories"],[780,"Next steps"]],"points":[{"text":"介紹 **Xcode Cloud** 的最新更新，協助你快速開始建置與交付 App。","hot":false},{"text":"從**核心概念與快速上手**講起，建立 CI／CD 的基礎認識。","hot":false},{"text":"說明**交付（Distribution）**流程，把建置成果送到測試與發佈管道。","hot":false},{"text":"用 **webhooks** 串接外部系統，將流程自動化。","hot":true},{"text":"支援**額外儲存庫（additional repositories）**，因應多 repo 的專案結構。","hot":false}],"apis":["Xcode Cloud"],"audience":"**想導入或優化 CI／CD 的 iOS／macOS 開發者與團隊**，希望自動化建置與交付的人。","gloss_en":"Build, deliver, and automate with Xcode Cloud","takeaway_en":"Get to know the latest Xcode Cloud updates, get started quickly with building and delivery, and automate your CI/CD pipeline with webhooks and additional repositories.","points_en":[{"text":"Introduces the latest **Xcode Cloud** updates to help you quickly start building and delivering your apps.","hot":false},{"text":"Starts from **core concepts and getting started** to build a foundational understanding of CI/CD.","hot":false},{"text":"Explains the **distribution** flow that delivers your build output to testing and release channels.","hot":false},{"text":"Use **webhooks** to integrate with external systems and automate your pipeline.","hot":true},{"text":"Supports **additional repositories** to accommodate multi-repo project structures.","hot":false}],"audience_en":"**iOS/macOS developers and teams looking to adopt or optimize CI/CD** who want to automate building and delivery.","summary":["**Xcode Cloud** 是內建於 Xcode、專為 Apple 開發者打造的持續整合與交付服務：在雲端建置與測試你的 app，並提供順暢的流程把成果送上 **TestFlight** 或 App Store。今年聚焦打磨基本功，從建置、測試到 distribution 每一環都有有感的改進。在 agent 進駐 Xcode、開發者寫程式比以往更快的當下，講者把 Xcode Cloud 定位為「品質的夥伴」——相較本機開發，它能在雲端跨多裝置與 OS 版本平行建置測試，及早在 bug 與效能問題抵達使用者前攔截。","上手非常簡單：在 Report navigator 的 **Cloud** 分頁選 Get Started，沿著 Onboarding assistant 連接原始碼 repository，Xcode Cloud 就會建立 product 與預設 workflow 並啟動第一次 build。第二個（macOS）app 因共用同一個 workspace 與 style framework，用 Create Workflow 即可加入、且不需再次連接 repository。講者特別強調安全性：build 跑在**短暫的 VM** 上，原始碼只在 build 開始時抓取、結束即丟棄，Apple 不會儲存也無從存取。","**Distribution** 同樣簡化：在 Cloud navigator 對 app 選 Set Up Distribution，填入 app 名稱、Bundle ID 與 SKU（被占用會即時提示並可當場修改），背景就會建立 App Store Connect 的 app record、註冊 Bundle ID 與 SKU，並產生一個 internal TestFlight 的 distribution workflow。另一條路是在 Manage Workflows 中新增 workflow 並加入 distribution 必備的 **archive action**，系統會引導完成 onboarding。","最後是把工作流程推向進階的兩項能力。**Webhooks** 讓 Xcode Cloud 在 build 的各階段（created／started／completed）自動把含 build 資訊的 payload 送到你指定的端點，適合驅動自製 dashboard 等自動化，且每次投遞都有成功與否的紀錄。**Additional repositories** 讓你在主 repository 之外加入更多 repo（如被拆分出去獨立成 repo 的 style framework），用 Manage Repositories 貼上 Git remote URL 即可，因先前已授權故不需再次授權，確保 build 取得正確的相依。延伸推薦「Create practical workflows in Xcode Cloud」「Extend your Xcode Cloud workflows」與「Simplify distribution in Xcode and Xcode Cloud」。"],"deepdive":[{"t":0,"title":"Introduction","body":"Xcode Cloud 團隊工程師 Tony 開場，定義 **Xcode Cloud** 是內建於 Xcode、專為 Apple 開發者打造的 CI/CD 服務：在雲端建置測試 app，並順暢地把成果送上 TestFlight 或 App Store。今年聚焦打磨基本功，從建置、測試到 distribution 對新手與老用戶都有有感改進。"},{"t":73,"title":"Essential concepts","body":"鋪陳基本概念：隨 agent 進駐 Xcode，開發者寫程式、迭代功能的速度前所未有，如何在規模化的同時及早攔截 bug 與效能問題成為課題。Xcode Cloud 是「品質的夥伴」——相較本機，它在雲端跨多裝置與 OS 版本平行建置測試，並讓 distribution 到 TestFlight 與 App Store 變得簡單。"},{"t":127,"title":"Getting started","body":"以講者自製的辦公室咖啡訂單 iOS app 為例上手：在 Report navigator 選 **Cloud** 分頁、Get Started，看到 workspace 中的 product，Developer Team 已自動對應簽章設定，按 Next 後由 Onboarding assistant 載入並連接 repository（步驟依原始碼供應商而異），完成後即建立 product 與預設 workflow 並啟動第一次 build。強調安全性：build 跑在**短暫 VM**，原始碼只在 build 開始時抓取、結束即丟棄，Apple 不儲存也無從存取。接著示範把同一 workspace 內、共用 style framework 的 macOS app 用 Create Workflow 加入，且無需再次連接 repository。"},{"t":402,"title":"Distribution","body":"示範 distribution 的兩種設定法。其一：在 Cloud navigator 對 iOS app 選 Set Up Distribution，填入 app 名稱、Bundle ID 與 SKU（被占用會即時提示、可當場修改），背景自動建立 App Store Connect 的 app record、驗證並註冊 Bundle ID 與 SKU，產生一個 internal TestFlight 的 distribution workflow。其二：對 macOS app 用 Manage Workflows 新建 workflow，加入 distribution 必備的 **archive action** 時系統會提供 Set Up 引導，依相同流程完成 onboarding。"},{"t":561,"title":"Webhooks","body":"**Webhooks** 是打造進階自動化的利器：設定後，Xcode Cloud 會在 build 的各階段（created、started、completed）自動把含 build 資訊的 payload 送到你選的服務端點。示範對 iOS app 用 Manage Webhooks 新增名為「Dashboard」的 webhook、填入可公開解析的 Payload URL，跑一次 build 後即可在 Webhooks 視圖看到對應 lifecycle 的三筆事件，綠色代表投遞成功，適合餵自製 dashboard。"},{"t":682,"title":"Additional repositories","body":"隨 app 成長，常見作法是把共用功能拆成獨立 repository 以維持模組化。講者把 style framework 拆成獨立 repo 後，需讓 Xcode Cloud 同步：對 iOS app 用 Manage Repositories，主 repository 已在最上方、Additional 區為空，按 Add 貼上 style framework 的 Git remote URL 即可（因先前已授權故不需再次授權），讓 build 取得正確相依。"},{"t":780,"title":"Next steps","body":"收尾：重溫 Xcode Cloud 概念，先把 app onboard 到建置、測試與 distribution，再用 webhooks 與 additional repositories 自動化、規模化你的專案。延伸推薦「Extend your Xcode Cloud workflows」與「Simplify distribution in Xcode and Xcode Cloud」——Xcode Cloud 讓你更有信心、更快、更安心地以品質出貨。"}],"summary_en":["**Xcode Cloud** is a continuous integration and delivery service built into Xcode and designed for Apple developers: it builds and tests your app in the cloud and offers a seamless path to **TestFlight** or the App Store. This year focuses on polishing the fundamentals, with meaningful refinements across building, testing, and distribution. With agents arriving in Xcode and developers writing code faster than ever, the speaker positions Xcode Cloud as your 'companion for quality'—unlike local development, it builds and tests in parallel across multiple devices and OS versions, catching bugs and performance issues before they reach users.","Getting started is simple: in the Report navigator's **Cloud** tab, choose Get Started, follow the Onboarding assistant to connect your source repository, and Xcode Cloud creates a product and default workflow and kicks off the first build. A second (macOS) app sharing the same workspace and style framework is added via Create Workflow with no need to reconnect the repository. The speaker stresses security: builds run on **ephemeral VMs**, source code is fetched only when a build starts and discarded when done, and Apple never stores it or has any way to access it.","**Distribution** is equally streamlined: in the Cloud navigator, choose Set Up Distribution on an app, provide the app name, Bundle ID, and SKU (with live conflict prompts you can edit on the spot), and the system creates the App Store Connect app record, registers the Bundle ID and SKU, and produces an internal TestFlight distribution workflow. An alternative path is creating a new workflow in Manage Workflows and adding the **archive action** required for distribution, with the system guiding the onboarding.","Finally, two capabilities take workflows further. **Webhooks** have Xcode Cloud automatically send a payload with build info to an endpoint of your choice at each build stage (created/started/completed), great for driving custom dashboards and automations, with delivery history showing success per event. **Additional repositories** let you add repos beyond the primary one (like a style framework split into its own repo) via Manage Repositories by pasting a Git remote URL—no re-authorization needed since access was already granted—so builds get exactly the right dependencies. Related sessions: 'Create practical workflows in Xcode Cloud', 'Extend your Xcode Cloud workflows', and 'Simplify distribution in Xcode and Xcode Cloud'."],"deepdive_en":[{"t":0,"title":"Introduction","body":"Xcode Cloud engineer Tony opens, defining **Xcode Cloud** as a CI/CD service built into Xcode for Apple developers: it builds and tests your app in the cloud and seamlessly delivers to TestFlight or the App Store. This year focuses on polishing the fundamentals, with meaningful refinements for newcomers and longtime users alike across building, testing, and distribution."},{"t":73,"title":"Essential concepts","body":"Frames the basics: with agents arriving in Xcode, developers iterate faster than ever, raising the challenge of scaling while catching bugs and performance issues early. Xcode Cloud is your 'companion for quality'—compared to local development, it builds and tests in parallel across many devices and OS versions in the cloud and makes distribution to TestFlight and the App Store simple."},{"t":127,"title":"Getting started","body":"Onboards the speaker's office coffee-order iOS app: in the Report navigator's **Cloud** tab, Get Started shows the workspace product with the Developer Team already matching signing settings; after Next, the Onboarding assistant loads and connects the repository (steps vary by provider), creating a product and default workflow and starting the first build. Stresses security: builds run on **ephemeral VMs**, source is fetched only when a build starts and discarded afterward, with Apple never storing or accessing it. Then adds a macOS app in the same workspace (sharing a style framework) via Create Workflow without reconnecting the repository."},{"t":402,"title":"Distribution","body":"Shows two ways to set up distribution. First: in the Cloud navigator, Set Up Distribution on the iOS app, providing app name, Bundle ID, and SKU (with live conflict prompts you can edit in place), and the system creates the App Store Connect app record, verifies and registers the Bundle ID and SKU, and produces an internal TestFlight distribution workflow. Second: for the macOS app, use Manage Workflows to create a new workflow, and when adding the **archive action** required for distribution the system offers a Set Up flow that completes onboarding the same way."},{"t":561,"title":"Webhooks","body":"**Webhooks** power advanced automation: once configured, Xcode Cloud automatically sends a payload with build info to your chosen endpoint at each stage (created, started, completed). The demo adds a webhook named 'Dashboard' on the iOS app with a publicly resolvable Payload URL; after a build, the Webhooks view shows three events for the build lifecycle, with green indicating successful deliveries—ideal for feeding a custom dashboard."},{"t":682,"title":"Additional repositories","body":"As an app grows, splitting shared functionality into separate repositories keeps the codebase modular. After splitting the style framework into its own repo, the speaker keeps Xcode Cloud in sync: on the iOS app, Manage Repositories shows the primary repository at the top with an empty Additional section, and Add lets you paste the framework's Git remote URL (no re-authorization needed) so builds get the right dependencies."},{"t":780,"title":"Next steps","body":"Wrap-up: revisit Xcode Cloud concepts, onboard your app to build, test, and distribute, then take it further with webhooks and additional repositories to automate and scale. It recommends 'Extend your Xcode Cloud workflows' and 'Simplify distribution in Xcode and Xcode Cloud'—Xcode Cloud builds your confidence to ship with quality, faster and worry-free."}],"code":[]},"related":[{"id":"258","title":"What’s new in Xcode 27","gloss":"Xcode 27 的新功能","gloss_en":"What's new in Xcode 27","category":"swift","categoryLabel":"Swift"},{"id":"205","title":"Enhance your presence on the App Store","gloss":"強化你在 App Store 上的呈現","gloss_en":"Enhance your presence on the App Store","category":"appstore","categoryLabel":"App Store"},{"id":"210","title":"What’s new in Apple In-App Purchase","gloss":"Apple App 內購買的新功能","gloss_en":"What's new in Apple In-App Purchase","category":"appstore","categoryLabel":"App Store"},{"id":"309","title":"Explore Retention Messaging in App Store Connect","gloss":"探索 App Store Connect 的挽留訊息","gloss_en":"Explore Retention Messaging in App Store Connect","category":"appstore","categoryLabel":"App Store"},{"id":"378","title":"Unlock in-game content with StoreKit and Background Assets","gloss":"用 StoreKit 與 Background Assets 解鎖遊戲內容","gloss_en":"Unlock in-game content with StoreKit and Background Assets","category":"appstore","categoryLabel":"App Store"}]}</script>
