<script id="d" type="application/json">{"s":{"id":"122","title":"WWDC26 Platforms State of the Union Recap","gloss":"WWDC26 平台現況演講重點回顧","category":"other","categoryLabel":"其他","duration":272,"url":"https://developer.apple.com/videos/play/wwdc2026/122/","takeaway":"用五分鐘快速掌握 WWDC26 為 App 與遊戲帶來的最新平台進展。","chapters":[],"points":[{"text":"這是 **Platforms State of the Union** 的濃縮回顧，一次掃過今年所有重大平台更新。","hot":false},{"text":"內容同時涵蓋 **App 與遊戲**，協助開發者快速判斷哪些新技術值得深入。","hot":false},{"text":"全片僅約 **五分鐘**，適合作為當週議程的導覽起點。","hot":false},{"text":"看完後可依興趣再前往對應的深入議程取得實作細節。","hot":false}],"apis":[],"audience":"想要**快速綜覽今年平台更新**、再決定深入方向的所有 Apple 平台開發者。","gloss_en":"WWDC26 Platforms State of the Union recap","takeaway_en":"Get up to speed in five minutes on the latest platform advances WWDC26 brings to apps and games.","points_en":[{"text":"A condensed recap of the **Platforms State of the Union**, sweeping through all of this year's major platform updates at once.","hot":false},{"text":"Covers both **apps and games**, helping developers quickly judge which new technologies are worth digging into.","hot":false},{"text":"The whole thing runs only about **five minutes**, making it a great starting point for navigating the week's sessions.","hot":false},{"text":"Afterward, you can head to the corresponding deep-dive sessions based on your interests for implementation details.","hot":false}],"audience_en":"All Apple platform developers who want a **quick overview of this year's platform updates** before deciding where to dive deeper.","summary":["這是 WWDC26 **Platforms State of the Union** 的五分鐘濃縮回顧，串起今年三大主軸：智慧、平台、工具。最大的變化是 **Apple Intelligence** 從頭重建——Apple 與 Google 合作，借助 Gemini 系列模型背後的技術打造新一代 **Apple Foundation Models**。Foundation Models framework 同時擴充到支援**圖片輸入**與**雲端模型**，當任務複雜、需要更強的前沿模型時，API 可串接你選擇的雲端模型供應商；新增的 **dynamic profiles** 則讓你用更少的程式碼建構 AI agent 與 skill，能即時抽換工具、動態更新指令。","底層方面，全新的 **Core AI** framework 內建於 OS、充分發揮 Apple Silicon 效能，成為在 app 中執行裝置端模型的最佳途徑；而 **App Intents** 把 app 接上 Apple Intelligence，讓內容可被探索、動作可透過自然語言在 **Siri** 中觸發，新的 **View Annotations API** 更讓使用者只要開口就能操作螢幕上的內容。設計上，**Liquid Glass** 變得更一致、更可個人化也更耐讀；macOS 每個視窗共用更緊緻的圓角，App 圖示自動以更銳利的方式呈現，並可在 **Icon Composer** 加上折射效果。iOS app 現在可調整大小，在 iPad 或透過 iPhone 鏡像在 Mac 上都能善用更大的螢幕，新的可調整大小 iOS 模擬器與預覽讓跨尺寸測試更輕鬆。","**SwiftUI** 帶來更快的速度與更豐富的互動：拖曳重新排序與滑動操作現在可用於任何容器，巢狀版面 resize 速度最高快兩倍，async image 會自動快取，toolbar 對空間縮小時哪些元素保留有更細的控制；在 Apple Vision Pro 上，新的 **Spatial Preview Framework** 能把 3D 模型從 Mac 串流到你周遭的空間。**Xcode** 今年有兩條主線：日常體驗與 agentic coding。Xcode 27 因為僅支援 Apple Silicon 而體積縮小 30%、載入更快，設定透過 iCloud 同步、toolbar 完全可自訂、並可用主題（Emerald、Neon Noir、Coral Reef）讓色彩貫穿全 app；**Xcode Cloud** 更易設定、建置最高快兩倍並支援 Apple Vision Pro 與 Metal；全新的 **Device Hub** 取代 Simulator，把虛擬與實體裝置整合在一處。","在 agentic coding 上，Apple 與領先的模型供應商合作把 agent 帶進 Xcode——**Anthropic**、**OpenAI**，今年再加上 **Google**。與 agent 的對話現在像一般檔案，可開啟、分割、堆疊在 Navigator 中；agent 會先擬定計畫讓你維持架構主導權，能執行測試、在 playground 試做、自訂預覽以驗證明暗模式、方向、文字大小與在地化的 UI，甚至能驅動執行中的 app（點擊、捲動、滑動、輸入）做端對端測試。Xcode 27 內建 Apple 工程師與設計師的專業（SwiftUI、無障礙、尺寸、測試、效能等 specialist），agent 可隨時取用；你也能透過 **plugin** 擴充——帶入 skill、MCP 工具與任何遵循 agent-client protocol 的 agent，Figma 與 GitHub 都提供一鍵安裝的版本。一句話總結：智慧重建、平台精修、工具脫胎換骨。"],"deepdive":[],"summary_en":["This is the five-minute condensed recap of the WWDC26 **Platforms State of the Union**, tying together the year's three themes: intelligence, platforms, and tools. The biggest change is that **Apple Intelligence** has been rebuilt from the ground up — Apple worked with Google, leveraging the technologies behind the Gemini family of models, to create the new **Apple Foundation Models**. The Foundation Models framework expands to support **image input** and **cloud models**: when a task is complex and needs a more advanced frontier model, the API can now integrate with the cloud model provider of your choice. New **dynamic profiles** let you build AI agents and skills with far less code, swapping tools in and out and updating instructions on the fly.","Under the hood, the all-new **Core AI** framework is built into the OS and takes full advantage of Apple Silicon, making it the best way to run on-device models in your apps; **App Intents** connect your app to Apple Intelligence so content becomes discoverable and actions are available through natural language in **Siri**, and the new **View Annotations API** lets people act on what's on screen just by asking. On design, **Liquid Glass** is more consistent, more personalizable, and better tuned for readability; every macOS window shares a tighter corner radius, app icons render more sharply automatically, and you can add refraction effects in **Icon Composer**. iOS apps are now resizable, so users can take advantage of larger displays on iPads or on Macs via iPhone mirroring, and the new resizable iOS simulator and previews make cross-size testing easy.","**SwiftUI** brings more speed and richer interactions: drag-to-reorder and swipe actions now work in any container, nested layouts resize up to twice as fast, async images cache automatically, and toolbars get finer control over what stays visible as space shrinks; on Apple Vision Pro, the new **Spatial Preview Framework** streams 3D models from your Mac into the space around you. **Xcode** has two big stories this year: the daily experience and agentic coding. Xcode 27 is 30% smaller because it's Apple Silicon only, so projects load faster; settings sync via iCloud, the toolbar is fully customizable, and color flows through the whole app via themes (Emerald, Neon Noir, Coral Reef). **Xcode Cloud** is easier to set up with builds up to twice as fast and support for Apple Vision Pro and Metal, and the all-new **Device Hub** replaces Simulator, uniting virtual and physical devices in one place.","On agentic coding, Apple is working with leading model providers to bring their agents into Xcode — **Anthropic**, **OpenAI**, and now **Google**. Conversations with agents now behave like any other file: open, split, and stack them in the Navigator; the agent lays out its plan before writing code so you stay the architect, can run your tests, try things in playgrounds, customize previews to validate UI across light/dark mode, orientations, text sizes, and localizations, and can even drive your running app (tap, scroll, swipe, type) for end-to-end testing. Xcode 27 ships with the expertise of Apple's engineers and designers built in (specialists for SwiftUI, accessibility, sizing, testing, and performance) that agents can draw on, and you can extend Xcode with **plugins** that bring skills, MCP tools, and any agent via the agent-client protocol — Figma and GitHub ship their own with one-click setup. In short: intelligence rebuilt, platforms refined, tools transformed."],"deepdive_en":[],"code":[]},"related":[{"id":"101","title":"Keynote","gloss":"主題演講","gloss_en":"Keynote","category":"other","categoryLabel":"其他"},{"id":"102","title":"Platforms State of the Union","gloss":"平台現況報告","gloss_en":"Platforms State of the Union","category":"other","categoryLabel":"其他"},{"id":"111","title":"Keynote (ASL)","gloss":"主題演講(美國手語版)","gloss_en":"Keynote (American Sign Language)","category":"other","categoryLabel":"其他"},{"id":"112","title":"Platforms State of the Union (ASL)","gloss":"平台現況報告（美國手語版）","gloss_en":"Platforms State of the Union (American Sign Language)","category":"other","categoryLabel":"其他"},{"id":"204","title":"What’s new in WebKit for Safari 27","gloss":"Safari 27 中 WebKit 的新功能","gloss_en":"What's new in WebKit for Safari 27","category":"other","categoryLabel":"其他"}]}</script>
