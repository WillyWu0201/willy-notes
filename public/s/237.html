<script id="d" type="application/json">{"s":{"id":"237","title":"What’s new in image understanding","gloss":"影像理解的新功能","category":"ai","categoryLabel":"AI 與機器學習","duration":946,"url":"https://developer.apple.com/videos/play/wwdc2026/237/","takeaway":"用 Vision 的 tap-to-segment 以點選方式分割影像，並把影像當作輸入餵給 Foundation Models 產生說明或進行 image-based tool calling。","chapters":[[0,"Introduction"],[96,"Segment images with tap-to-segment"],[255,"Segment images (tap-to-segment)"],[350,"Image inputs for Foundation Models"],[401,"Generate an image caption with Foundation Models"],[477,"Image-based tool calling"],[595,"Create an image-based tool"],[729,"Use Vision tools"],[789,"Vision on watchOS"],[834,"Create a crop that highlights a prominent subject (watchOS / saliency)"],[879,"Next steps"]],"points":[{"text":"用 **tap-to-segment**（`GenerateIterativeSegmentationRequest`）以種子點產生物件遮罩，並可加點逐步修正結果。","hot":true},{"text":"**Foundation Models** 現可接收影像輸入，透過 `Prompt` 搭配 `Attachment(image)` 直接產生影像說明文字。","hot":false},{"text":"支援 **image-based tool calling**：自訂 `Tool` 以 `ImageReference` 解析影像，讓模型呼叫如植物辨識等工具。","hot":false},{"text":"Vision 現可在 **watchOS** 使用，並以 `GenerateObjectnessBasedSaliencyImageRequest` 依顯著主體自動裁切影像。","hot":false}],"apis":["Vision","FoundationModels","ImageRequestHandler","GenerateIterativeSegmentationRequest","Prompt","Attachment","ImageReference","Tool","GenerateObjectnessBasedSaliencyImageRequest"],"audience":"**想在 App 中加入影像分割、影像理解或多模態模型功能的開發者**。","gloss_en":"What's new in image understanding","takeaway_en":"Segment images by tapping with Vision's tap-to-segment, and feed images as input to Foundation Models to generate captions or perform image-based tool calling.","points_en":[{"text":"Use **tap-to-segment** (`GenerateIterativeSegmentationRequest`) to produce object masks from seed points, refining the result step by step by adding more points.","hot":true},{"text":"**Foundation Models** can now accept image input, generating image captions directly via a `Prompt` paired with `Attachment(image)`.","hot":false},{"text":"Support **image-based tool calling**: define a custom `Tool` that resolves images via `ImageReference`, letting the model call tools such as plant identification.","hot":false},{"text":"Vision is now available on **watchOS**, and `GenerateObjectnessBasedSaliencyImageRequest` can automatically crop images based on their salient subject.","hot":false}],"audience_en":"**Developers who want to add image segmentation, image understanding, or multimodal model features to their app**.","summary":["由 Vision 框架團隊的 Megan Williams 主講，主題是今年 image understanding 的多項進展，讓 app 能打造前所未有的影像體驗。重點有四：Vision 全新的 **tap-to-segment** 互動式去背 API、**Foundation Models** 框架現在支援影像輸入（image inputs）、可讓 LLM 呼叫的 **image-based tool calling**，以及 Vision 現已登陸 **watchOS**。整體訊息是：分析影像不再只有 Vision 或只有大型語言模型可選，兩者可以互補搭配。","**Tap-to-segment** 讓你只要點一下就能隔離影像中任意物件，選取方式包含單點、bounding box、lasso、scribble，並能用增減點來精修 mask。技術上用 **`ImageRequestHandler`** 持有影像，建立 **`GenerateIterativeSegmentationRequest`**（以物件內一個點作 seed）執行後產生 PixelBuffer mask，可再加入新點重複執行精修。要注意：Vision 用左下為原點的 normalized 座標（0–1）、lasso 線寬至少為影像寬的 1%，且首次使用前需以 **`downloadAssets`** 下載模型並以 `assetStatus` 檢查就緒狀態。","**Foundation Models** 框架今年支援把影像當作 prompt 的 attachment，用 prompt builder 語法即可請模型生成圖片說明、室內設計建議、甚至看冰箱照片給食譜。更進一步是 **image-based tool calling**：自訂 tool 以 **`ImageReference`** 為參數（代表 chat session 中既有影像的參照），在 `call` 方法內透過 session 的 history transcript 把 reference 解析回 imageAttachment 再轉成 pixelBuffer 分析。Vision 直接提供兩個內建 tool——**barcode reader**（讀條碼／QR code）與 **OCR**（讀細密文字，支援 30+ 語言），只要 `import Vision` 並把 tool 設定到 session、為附加影像加上 label 即可。","最後，**Vision 登上 watchOS**。講者以野生動物 app 為例：手錶螢幕小、動物照片看不清，便用 **`GenerateObjectnessBasedSaliencyImageRequest`** 做 saliency 分析，從 observation 取得 salient 物件的 bounding box，挑最顯著的來裁切，讓使用者在手錶上看到放大且聚焦主體的畫面。Vision 支援 30 多種影像分析（臉部、姿態、偵測分類、軌跡與物件追蹤等），可用來打造自家 tool。"],"deepdive":[{"t":0,"title":"Introduction","body":"Vision 框架團隊的 Megan 以一段「找不到議程、用 AI 從便利貼照片生成議程」的情境開場，點出今年 image understanding 的多項進展。她以**遺失議程**的小故事帶出 **Foundation Models** 今年支援影像輸入，並預告四大主題：tap-to-segment、Foundation Models 影像分析、image-based tools，以及 Vision 登上 watchOS。"},{"t":96,"title":"Segment images with tap-to-segment","body":"示範 Vision 既有的 person segmentation 之外，新的 **tap-to-segment** 能去背任意物件（花瓶、桌遊、衣物、地板）。在咖啡廳照片中以單點隔離咖啡杯；複雜主體則改用 **bounding box**（同時取杯與盤）、**lasso**（可頌）或 **scribble**（一次塗過多個物件）。已有 mask 後還能加點納入盤子、或減點只保留咖啡而排除杯子。"},{"t":255,"title":"Segment images (tap-to-segment)","body":"API 流程：用 **`ImageRequestHandler`** 持有影像，建立 **`GenerateIterativeSegmentationRequest`**、以物件內一點作 seed，performRequest 後得到顯示物件像素的 PixelBuffer mask；加入新點重新執行即可精修。注意事項：Vision 採左下原點的 normalized 座標（0–1）、lasso 線寬至少為影像寬的 1%，首次去背前需用 **`downloadAssets`** 下載模型並以 `assetStatus` 確認就緒。"},{"t":350,"title":"Image inputs for Foundation Models","body":"介紹用大型語言模型分析影像的新方式：除了生成圖片 caption，還能做室內設計建議、看冰箱照片產生食譜等描述性任務，可能性無窮。比較傳統 **Vision**（固定的電腦視覺 API、為特定任務微調、快到能即時處理影格）與 **Foundation Models**（versatile，幾乎能回答任何要求），並指出兩者可透過 tool calling 互補。"},{"t":401,"title":"Generate an image caption with Foundation Models","body":"用 Foundation Models 的 **prompt builder** 語法生成圖片說明：一段帶處理指示的文字 prompt，把影像當 **attachment** 加進 prompt，再請模型回應即可得到 caption。API 非常簡單，鼓勵開發者用自己的 prompt 嘗試各種描述性任務。"},{"t":477,"title":"Image-based tool calling","body":"先複習 tool calling：模型遇到自己答不了的問題（如天氣）時會呼叫外部 tool 取得結果再回答。今年 tool calling **支援影像參數**：例如植物辨識，模型不把整張圖當參數，而是傳一個影像的**參照**給自訂 tool，由 tool 分析後回傳植物名稱，模型再據此回應。"},{"t":595,"title":"Create an image-based tool","body":"自訂 tool 需符合 Foundation Models 的 tool protocol 並定義輸入參數，這裡用 **`ImageReference`** 表示參數需指向 chat session 中既有影像。在 `call` 方法內取出 imageReference 後須**解析**：因為 reference 只在其產生的 transcript 脈絡中有效，要透過 session 的 history 屬性取得 transcript，把 reference 還原成 imageAttachment，再轉成 pixelBuffer 分析。"},{"t":729,"title":"Use Vision tools","body":"Vision 直接提供現成 tool。以活動傳單為例，未啟用 tool 時模型讀得到地點與日期卻讀不出 QR code；啟用 Vision 的 **barcode reader tool** 後模型即可呼叫它取得網址。Vision 提供兩個 tool：barcode reader 與 **OCR**（適合細密文字、支援 30+ 語言）。使用時只需 `import Vision`、把 tool 設定到 session，並**為附加影像加 label** 供模型指定要傳給 tool 的影像。"},{"t":789,"title":"Vision on watchOS","body":"今年 Vision 可用於更多地方，包含 **watchOS**。以本地野生動物 app 為例：手錶螢幕小、動物照片難看清，可用 Vision 的 saliency 分析找出影像中的興趣主體，再裁切讓主體更突出。"},{"t":834,"title":"Create a crop that highlights a prominent subject (watchOS / saliency)","body":"程式做法：建立 **`GenerateObjectnessBasedSaliencyImageRequest`**、對影像 performRequest 得到 saliency observation，從中取得偵測到的 salient 物件 bounding box，挑最顯著的物件作裁切。更新後 app 只顯示影像中最突出的部分，在手錶上呈現放大聚焦的視圖。"},{"t":879,"title":"Next steps","body":"回顧：tap-to-segment 可互動式去背任意物件；Foundation Models 現支援影像輸入帶來全新分析方式；可建立使用 Vision 等框架的 tool 強化影像分析；Vision 也能在所有平台（含 watchOS）強化 app。可下載 watchOS 與 tap-to-segment 範例 app，並參考「Discover Swift enhancements in the Vision framework」與「What's new in the Foundation Models framework」。"}],"summary_en":["Presented by Megan Williams of the Vision framework team, this session covers this year's advances in image understanding for building incredible app experiences. There are four highlights: Vision's new interactive **tap-to-segment** API, **Foundation Models** framework now supporting image inputs, **image-based tool calling** that lets LLMs invoke tools, and Vision arriving on **watchOS**. The overarching message: analyzing images is no longer an either/or choice between Vision and large language models—the two complement each other.","**Tap-to-segment** lets you isolate any object in an image with a single tap, supporting selection by point, bounding box, lasso, and scribble, with refinement by adding or subtracting points. Technically, hold the image in an **`ImageRequestHandler`**, build a **`GenerateIterativeSegmentationRequest`** with a seed point inside the object, and perform it to get a PixelBuffer mask, then add points and re-run to refine. Keep in mind Vision uses normalized coordinates with origin at lower-left (values 0–1), lasso stroke width should be at least 1% of image width, and you must download the model with **`downloadAssets`** (checking `assetStatus`) before the first segmentation.","**Foundation Models** now supports including an image as an attachment in your prompt; with the prompt builder syntax you can generate image captions, interior-decorating suggestions, or even a recipe from a photo of your fridge. Going further, **image-based tool calling** lets a custom tool take an **`ImageReference`** argument (a reference to an existing image in the chat session); inside the tool's `call` method you resolve the reference back to an imageAttachment via the session's history transcript, then convert it to a pixelBuffer for analysis. Vision ships two built-in tools—a **barcode reader** (barcodes/QR codes) and **OCR** (fine or dense text in 30+ languages)—and using them is just `import Vision`, configuring the session with the tools, and giving attached images a label.","Finally, **Vision comes to watchOS**. The presenter's wildlife app has tiny photos hard to see on the small screen, so she uses **`GenerateObjectnessBasedSaliencyImageRequest`** for saliency analysis, pulls the bounding boxes of salient objects from the observation, and crops to the most prominent one for a zoomed-in, subject-focused view. Vision supports over 30 types of image analysis (facial analysis, pose estimation, detection and classification, trajectory analysis, object tracking) you can wrap into your own tools."],"deepdive_en":[{"t":0,"title":"Introduction","body":"Megan of the Vision framework team opens with a scenario—her agenda is missing, so she uses AI to generate one from a photo of her sticky notes—introducing this year's image-understanding advances. The **missing agenda** story leads into Foundation Models now supporting image inputs, and she previews four topics: tap-to-segment, Foundation Models image analysis, image-based tools, and Vision on watchOS."},{"t":96,"title":"Segment images with tap-to-segment","body":"Beyond existing person segmentation, the new **tap-to-segment** can isolate any object (vase, board game, clothing, even the floor). In a cafe photo she isolates a coffee cup with a single point; for complex subjects she uses a **bounding box** (cup plus plate), a **lasso** (a croissant), or a **scribble** (multiple objects at once). With a mask in hand she adds a point to include the plate, or subtracts one to keep just the coffee, excluding the cup."},{"t":255,"title":"Segment images (tap-to-segment)","body":"API flow: hold the image in an **`ImageRequestHandler`**, create a **`GenerateIterativeSegmentationRequest`** with a seed point inside the object, and perform it to get a PixelBuffer mask of the object's pixels; add a point and re-run to refine. Notes: Vision uses normalized coordinates with origin at lower-left (0–1), lasso width should be at least 1% of image width, and the model must be downloaded via **`downloadAssets`** (check `assetStatus`) before first use."},{"t":350,"title":"Image inputs for Foundation Models","body":"A new way to analyze images with LLMs: beyond captions, it handles descriptive tasks like interior-decorating advice or generating a recipe from a fridge photo—the possibilities are endless. She contrasts traditional **Vision** (fixed CV APIs, fine-tuned per task, fast enough for real-time video) with **Foundation Models** (versatile, able to do almost anything asked), noting the two combine via tool calling."},{"t":401,"title":"Generate an image caption with Foundation Models","body":"Generating a caption uses Foundation Models' **prompt builder** syntax: a text prompt with processing instructions, the image included as an **attachment**, then asking the model to respond yields a caption. The API is very simple, and developers are encouraged to try their own descriptive prompts."},{"t":477,"title":"Image-based tool calling","body":"A refresher on tool calling: when the model can't answer (e.g., weather) it invokes an external tool, gets a result, and responds. This year tool calling **supports image arguments**: for plant identification the model passes a **reference** to an image to a custom tool rather than the whole image, the tool analyzes it and returns the plant name, and the model responds with the right information."},{"t":595,"title":"Create an image-based tool","body":"A custom tool conforms to the Foundation Models tool protocol and defines input arguments—here an **`ImageReference`**, signaling the argument must reference an existing image in the session. Inside `call`, the imageReference must be **resolved**: because a reference is valid only within the transcript that generated it, you use the session's history property to get the transcript, resolve the reference back to an imageAttachment, then convert it to a pixelBuffer for analysis."},{"t":729,"title":"Use Vision tools","body":"Vision provides ready-made tools. With an event flyer, the model without tools reads the date and location but not the QR code; enabling Vision's **barcode reader tool** lets the model call it to get the website. Vision offers two tools: the barcode reader and **OCR** (good for fine, dense text in 30+ languages). Usage is just `import Vision`, configure the session with the tools, and **label attached images** so the model can specify which image to pass."},{"t":789,"title":"Vision on watchOS","body":"Vision is now available in more places, including **watchOS**. With a local-wildlife app, photos are hard to see on the small watch screen, so Vision's saliency analysis identifies the subject of interest so the image can be cropped to feature it more prominently."},{"t":834,"title":"Create a crop that highlights a prominent subject (watchOS / saliency)","body":"The code creates a **`GenerateObjectnessBasedSaliencyImageRequest`**, performs it on the image to get a saliency observation, reads the bounding boxes of detected salient objects, and uses the most prominent one for the crop. The updated app shows only the most salient portion, giving a zoomed-in view on the watch."},{"t":879,"title":"Next steps","body":"Recap: tap-to-segment interactively segments any object; Foundation Models now supports image inputs for new kinds of analysis; you can build tools using frameworks like Vision to improve image analysis; and Vision enhances apps on all platforms including watchOS. Download the watchOS and tap-to-segment sample apps, and watch 'Discover Swift enhancements in the Vision framework' and 'What's new in the Foundation Models framework'."}],"code":["// Generate a segmentation mask of an object with a seed point\nlet handler = ImageRequestHandler(image)\nlet request = GenerateIterativeSegmentationRequest(seed: point)\nlet observation = try await handler.perform(request)\nlet mask = observation?.pixelBuffer\n\n// Refine the mask with a new point\nrequest.addIncludedPoint(newPoint)\nlet refinedObservation = try await handler.perform(request)","// Generate an image caption with Foundation Models\nimport FoundationModels\n\nlet prompt = Prompt {\n    \"Generate a caption for this image\"\n    Attachment(image)\n}\nlet response = try await session.respond(to: prompt)\nlet caption = response.content","// Create an image-based tool\nstruct PlantIdentifierTool: Tool {\n    @SessionProperty(\\.history) var history\n\n    @Generable\n    struct Arguments {\n        var image: ImageReference\n    }\n\n    func call(arguments: Arguments) async throws -> String {\n        let imageReference = arguments.image\n        let transcript = Transcript(history)\n        guard let imageAttachment = imageReference.resolve(in: transcript) else {\n            throw AppError.imageNotFound\n        }\n        let image = try imageAttachment.pixelBuffer()\n        return classifyPlant(image)\n    }\n}","// Use Vision tools\nimport FoundationModels\nimport Vision\n\nlet session = LanguageModelSession(model: model, tools: [BarcodeReaderTool()])\nlet response = try await session.respond(generating: EventInfo.self) {\n    \"Get the date, location, and website from this flyer\"\n    Attachment(image)\n        .label(\"flyer\")\n}","// Create a crop that highlights a prominent subject\nfunc generateImageCrop(in image: CGImage) async throws -> NormalizedRect? {\n    let request = GenerateObjectnessBasedSaliencyImageRequest()\n    let observation = try await request.perform(on: image)\n    let prominentObjects = observation.salientObjects\n    return prominentObjects.first\n}"]},"related":[{"id":"241","title":"What’s new in the Foundation Models framework","gloss":"Foundation Models 框架的新功能","gloss_en":"What's new in the Foundation Models framework","category":"ai","categoryLabel":"AI 與機器學習"},{"id":"242","title":"Build agentic app experiences with the Foundation Models framework","gloss":"用 Foundation Models 框架打造 agentic App 體驗","gloss_en":"Build agentic app experiences with Foundation Models","category":"ai","categoryLabel":"AI 與機器學習"},{"id":"319","title":"Build with the new Apple Foundation Model on Private Cloud Compute","gloss":"在 Private Cloud Compute 上使用全新 Apple Foundation Model 開發","gloss_en":"Build with the new Apple Foundation Model on Private Cloud Compute","category":"ai","categoryLabel":"AI 與機器學習"},{"id":"347","title":"Secure your app: mitigate risks to agentic features","gloss":"保護你的 App：降低 agentic 功能的風險","gloss_en":"Secure your app: mitigate risks to agentic features","category":"ai","categoryLabel":"AI 與機器學習"},{"id":"243","title":"Debug and profile agentic app experiences with Instruments","gloss":"用 Instruments 除錯與分析代理式 App 體驗","gloss_en":"Debug and profile agentic app experiences with Instruments","category":"ai","categoryLabel":"AI 與機器學習"}]}</script>
