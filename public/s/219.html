<script id="d" type="application/json">{"s":{"id":"219","title":"Enhance the accessibility of your reading app","gloss":"強化你閱讀類 App 的無障礙體驗","category":"uikit","categoryLabel":"UIKit","duration":1200,"url":"https://developer.apple.com/videos/play/wwdc2026/219/","takeaway":"運用文字導覽 API、連結群組與自訂 UITextInput，為 VoiceOver 與 Speak Screen 打造順暢、可選取且能自動翻頁的閱讀體驗。","chapters":[[1,"Introduction"],[86,"Characteristics"],[225,"Standard views"],[449,"Link text elements together with navigation APIs"],[479,"Link text elements together with a linked group"],[590,"Turn pages automatically after reading"],[705,"Add actions to the editor rotor"],[845,"Custom text"],[970,"Adopt UITextInput"]],"points":[{"text":"為 **VoiceOver**、**Speak Screen** 等輔助技術打造穩固的閱讀體驗，提供直覺的文字選取。","hot":false},{"text":"用 **accessibilityNextTextNavigationElement**／**accessibilityPreviousTextNavigationElement** 把段落串連，讓導覽依閱讀順序前後移動。","hot":false},{"text":"以 **accessibilityLinkedGroup** 在 SwiftUI 中把同一頁的文字元素群組起來。","hot":false},{"text":"插入 **causesPageTurn** 特徵並回應 **accessibilityScroll**，朗讀完畢後自動翻頁。","hot":false},{"text":"為自訂文字（如掃描頁面）採用 **UITextInput**，讓輔助技術能正確選取與讀取內容。","hot":true}],"apis":["UIAccessibility","accessibilityNextTextNavigationElement","accessibilityPreviousTextNavigationElement","accessibilityLinkedGroup","UIAccessibilityTraits.causesPageTurn","accessibilityScroll","UIAccessibilityCustomAction","UITextInput","UITextInteraction"],"audience":"**開發閱讀、文件或電子書類 App 的 UIKit／SwiftUI 工程師**，想完善無障礙閱讀體驗的人。","gloss_en":"Enhance the accessibility of your reading app","takeaway_en":"Use text navigation APIs, linked groups, and custom UITextInput to build a smooth, selectable reading experience with automatic page turns for VoiceOver and Speak Screen.","points_en":[{"text":"Build robust reading experiences for assistive technologies like **VoiceOver** and **Speak Screen**, with intuitive text selection.","hot":false},{"text":"Use **accessibilityNextTextNavigationElement**/**accessibilityPreviousTextNavigationElement** to chain paragraphs so navigation moves forward and backward in reading order.","hot":false},{"text":"Use **accessibilityLinkedGroup** in SwiftUI to group the text elements on a single page together.","hot":false},{"text":"Add the **causesPageTurn** trait and respond to **accessibilityScroll** to turn the page automatically once reading finishes.","hot":false},{"text":"Adopt **UITextInput** for custom text (such as scanned pages) so assistive technologies can correctly select and read the content.","hot":true}],"audience_en":"**UIKit/SwiftUI engineers building reading, document, or e-book apps** who want to perfect the accessible reading experience.","deepdive":[{"t":1,"title":"Introduction","body":"由 Accessibility 團隊的 Josh 開場，點出**長篇閱讀內容**與一般 UI 導覽的本質差異：閱讀是在文字間「流暢移動」，而非在控制項之間跳轉。講者以一個 Chicago 旅遊導覽 app 為範例，貫穿全場示範如何讓使用 **VoiceOver** 與 **Speak Screen** 的人也能順暢閱讀。"},{"t":86,"title":"Characteristics","body":"說明兩種內建輔助技術：**VoiceOver** 是給失明／弱視者的螢幕報讀器，朗讀游標所在處；**Speak Screen** 則從上到下朗讀整頁並同步高亮。講者據此訂出三個目標：**granular text navigation**（逐行／逐字導覽）、**continuous reading**（不被頁面打斷的連續閱讀）、與 **comprehensive text selection**（完整的文字選取）。"},{"t":225,"title":"Standard views","body":"強調 UIKit 與 SwiftUI 的標準文字元件**開箱即具備無障礙能力**：iOS 用 `UITextView`、SwiftUI 用 `TextEditor` 或開啟 selection 的 `Text`、macOS 用 `NSTextView`。本場聚焦比 `UIAccessibilityReadingContent` 更高保真的 **`UITextInput`** 協定。範例 app 因版面需求對每個段落各用一個 `UITextView`，也埋下後續跨段落導覽的問題。"},{"t":449,"title":"Link text elements together with navigation APIs","body":"點出問題：段落各自獨立成 view 時，VoiceOver 會卡在段落內無法逐行跨段。解法是 iOS 18 起的 **text navigation APIs**——在各元素實作 `accessibilityNextTextNavigationElement` 與 `accessibilityPreviousTextNavigationElement`，回傳上一個／下一個應前往的文字元素。範例在 `configureNavigationElements` 流程中為每頁段落設定雙向連結。"},{"t":479,"title":"Link text elements together with a linked group","body":"對應的 SwiftUI 作法：iOS 27 起用 **`accessibilityLinkedGroup`** modifier，將多個文字元素以相同的 `id` 與 `namespace` 串起即可獲得同樣的跨元素導覽行為。macOS 上的 AppKit 則對應 **`accessibilitySharedTextUIElements`**。"},{"t":590,"title":"Turn pages automatically after reading","body":"處理分頁內容的**連續朗讀**：對每頁最後一段套用 **`causesPageTurn`** trait（UIKit／SwiftUI 皆有），並搭配 **`accessibilityScroll`**，Speak Screen 與 VoiceOver 讀到頁尾就會自動翻頁，像有聲書一樣連續往下讀，而非停在頁底。"},{"t":705,"title":"Add actions to the editor rotor","body":"讓文字選取功能更易被發現：範例的「Save recommendation」原本只是工具列按鈕，講者改用 **custom action** 並指定 **edit category**，覆寫 `UITextView` 子類的 `accessibilityCustomActions`，把動作加進 VoiceOver 的 **edit rotor**。重點：與選取文字相關的動作要用 edit category，而非一般動作。"},{"t":845,"title":"Custom text","body":"進入無法使用標準 view 的情境——進階排版、跨 app 共用文字繪製、或顯示掃描頁面。範例把段落換成手寫筆記的掃描圖後，連最基本的「讀出文字」都失去了。解法是在任意 accessibility element 上採用 **`UITextInput`** 協定，讓繪製文字或圖片中的文字也能像原生文字 view 一樣可讀、可導覽、可選取。"},{"t":970,"title":"Adopt UITextInput","body":"完整實作 `UITextInput` 的關鍵：用 `selectionRects` 計算選取範圍的矩形（範例以每行已知寬高搭配 `selectionRectFromImage` 推算）、用 `textInRange` 回傳對應子字串、並提供 **tokenizer**（子類化 `UITextInputStringTokenizer`）管理逐行／句／字導覽；再加上 `UITextInteraction` 與 input delegate 補齊選取把手與高亮視覺。協定需**完整實作**才能拿到全部好處，且能與 `causesPageTurn`、導覽 API 並用。最後呼籲：開著 VoiceOver 親自稽核自己的 app。"}],"code":["// Link text elements together with navigation APIs\n\nimport UIKit\n\nclass TravelGuidePageController: UIViewController {\n\n    var paragraphs: [TravelGuideParagraph]\n\n    func configureNavigationElements() {\n        for (index, paragraph) in paragraphs.enumerated() {\n            if index + 1 \u003c paragraphs.count {\n                paragraph.accessibilityNextTextNavigationElement = paragraphs[index + 1]\n            }\n            if index - 1 >= 0 {\n                paragraph.accessibilityPreviousTextNavigationElement = paragraphs[index - 1]\n            }\n        }\n    }\n}","// Link text elements together with a linked group\n\nimport SwiftUI\n\nstruct PageView : View {\n    @Namespace private var pageNamespace\n    var paragraphs: [String\n    var pageNumber: Int\n\n    var body: some View {\n        Text(paragraphs[0])\n            .textSelection(.enabled)\n            .accessibilityLinkedGroup(id: pageNumber, in: pageNamespace)\n\n        Text(paragraphs[1])\n            .textSelection(.enabled)\n            .accessibilityLinkedGroup(id: pageNumber, in: pageNamespace)\n    }\n}","// Turn pages automatically after reading\n\nimport UIKit\n\nclass TravelGuidePageController: UIViewController {\n\n    override func viewDidLoad() {\n        super.viewDidLoad()\n        self.lastParagraphView.accessibilityTraits.insert(.causesPageTurn)\n    }\n\n    override func accessibilityScroll(_ direction: UIAccessibilityScrollDirection) -> Bool {\n        moveToPage(direction)\n        var scrollString = \"Page \\(currentPage) of \\(pages.count)\"\n        UIAccessibility.post(notification: .pageScrolled, argument: scrollString)\n        return true\n    }\n}","// Add actions to the editor rotor\n\nimport UIKit\n\nclass TravelGuideParagraph: UITextView {\n\n    override var accessibilityCustomActions: [UIAccessibilityCustomAction]? {\n        get {\n            let saveAction = UIAccessibilityCustomAction(name: \"Save Recommendation\") { _ in\n                self.saveRecommendation()\n            }\n            saveAction.category = UIAccessibilityCustomAction.editCategory\n            return (super.accessibilityCustomActions ?? []) + [saveAction]\n        }\n        set { }\n    }\n\n    private func saveRecommendation() -> Bool {\n        ...\n        return true\n    }\n}","// Adopt UITextInput\n\nimport UIKit\n\nclass ScannedPage: UIView, UITextInput {\n\n    override init(frame: CGRect) {\n        super.init(frame: frame)\n        let interaction = UITextInteraction(for: .nonEditable)\n        interaction.textInput = self\n        addInteraction(interaction)\n    }\n   \n    func selectionRects(for range: UITextRange) -> [UITextSelectionRect] {\n        var rects: [UITextSelectionRect] = []\n\n        let startLine = lineIndex(for: range.start)\n        let endLine = lineIndex(for: range.end)\n\n        for line in startLine...endLine {\n            let rect = selectionRectFromImage(for: range, in: line)\n            rects.append(rect)\n        }\n\n        return rects\n    }\n  \n    func text(in range: UITextRange) -> String? {\n        let nsRange = nsRange(from: range)\n        guard let range = Range(nsRange, in: scannedText) else {\n            return nil\n        }\n        return String(scannedText[range])\n    }\n\n    var tokenizer: any UITextInputTokenizer { CustomHandwritingTokenizer(textInput: self) }\n\n    weak var inputDelegate: UITextInputDelegate?\n  \n      var selectedTextRange: UITextRange? {\n        // Update visuals when assistive technologies change selection\n        willSet { inputDelegate?.selectionWillChange(self) }\n        didSet { inputDelegate?.selectionDidChange(self) }\n    }\n  \n}"]},"related":[{"id":"203","title":"Read between the strokes with PencilKit","gloss":"用 PencilKit 解讀筆跡內容","gloss_en":"Read handwriting content with PencilKit","category":"uikit","categoryLabel":"UIKit"},{"id":"212","title":"Rev up your CarPlay app","gloss":"強化你的 CarPlay App","gloss_en":"Rev up your CarPlay app","category":"uikit","categoryLabel":"UIKit"},{"id":"221","title":"Prepare your tvOS apps for Dynamic Type","gloss":"讓你的 tvOS App 支援動態字型","gloss_en":"Prepare your tvOS app for Dynamic Type","category":"uikit","categoryLabel":"UIKit"},{"id":"226","title":"Create live communication experiences","gloss":"打造即時通訊體驗","gloss_en":"Build live communication experiences","category":"uikit","categoryLabel":"UIKit"},{"id":"278","title":"Modernize your UIKit app","gloss":"現代化你的 UIKit App","gloss_en":"Modernize your UIKit app","category":"uikit","categoryLabel":"UIKit"}]}</script>
