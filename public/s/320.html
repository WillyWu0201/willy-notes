<script id="d" type="application/json">{"s":{"id":"320","title":"Explore immersive website environments in visionOS","gloss":"探索 visionOS 的沉浸式網站環境","category":"visionos","categoryLabel":"visionOS","duration":1149,"url":"https://developer.apple.com/videos/play/wwdc2026/320/","takeaway":"用 JavaScript 的新 Immersive API 搭配 model 元素，把網站訪客帶進 Apple Vision Pro 的虛擬環境中。","chapters":[[0,"Introduction"],[106,"Meet the immersive API"],[111,"Basic model element"],[126,"Model element with environment map"],[256,"Preview environments inline"],[280,"Adding the environment model on the page for inline preview"],[314,"Reset the model entity transform"],[342,"Translate the model down"],[400,"Build the seat transform"],[421,"Go immersive"],[436,"Detect feature availability"],[454,"Request the immersive transition on the model"],[504,"Build immersive transform"],[541,"Update the entity transform and the layout on immersive state updates"],[653,"Hide the inline preview"],[685,"Request an immersive transition on the escape room model"],[712,"Handle the request result and show a loading animation"],[724,"Optimize the experience"],[796,"Dock the video in the environment with the fullscreen API"],[841,"Play the model animation"],[998,"Compress your USDZ with usdcrush"],[1037,"Image controls"],[1089,"Next steps"]],"points":[{"text":"JavaScript 的新 **Immersive API** 可把網站訪客**帶進 Apple Vision Pro 的虛擬環境**中。","hot":true},{"text":"用 **\u003cmodel>** 元素搭配 **environmentmap** 載入環境，先在頁面內做**內嵌預覽（inline preview）**。","hot":false},{"text":"透過 **entityTransform** 與 **DOMMatrix** 調整模型位置與座位視角，打造合適的眼平視角。","hot":false},{"text":"用 **document.immersiveEnabled** 偵測可用性，呼叫 **requestImmersive** 切換沉浸狀態，並監聽 **immersivechange** 更新版面。","hot":false},{"text":"最佳化體驗：用 **usdcrush** 壓縮 USDZ、用 fullscreen API 嵌入影片，並控制載入動畫與影像。","hot":false}],"apis":["model","entityTransform","DOMMatrix","requestImmersive","immersivechange","usdcrush"],"audience":"**想為 Vision Pro 打造沉浸式網頁體驗**、在網站中嵌入 3D 環境的網頁開發者。","gloss_en":"Explore immersive website environments in visionOS","takeaway_en":"Use JavaScript's new Immersive API together with the model element to transport website visitors into virtual environments on Apple Vision Pro.","points_en":[{"text":"JavaScript's new **Immersive API** can **transport website visitors into virtual environments** on Apple Vision Pro.","hot":true},{"text":"Use the **\u003cmodel>** element with **environmentmap** to load an environment, starting with an **inline preview** within the page.","hot":false},{"text":"Adjust the model's position and seated viewing angle via **entityTransform** and **DOMMatrix** to create an appropriate eye-level perspective.","hot":false},{"text":"Detect availability with **document.immersiveEnabled**, call **requestImmersive** to toggle the immersive state, and listen for **immersivechange** to update the layout.","hot":false},{"text":"Optimize the experience: compress USDZ with **usdcrush**, embed video with the fullscreen API, and control loading animations and images.","hot":false}],"audience_en":"Web developers who **want to build immersive web experiences for Vision Pro** and embed 3D environments in their websites.","summary":["由 visionOS Safari 團隊的 Jean 主講，這場介紹如何用全新的 **JavaScript Immersive API** 在 Apple Vision Pro 的 Safari 中，把網站訪客帶進虛擬環境，成為說故事與吸引顧客的全新方式。兩個貫穿範例：售票網站讓訪客選位時先看到 inline 預覽，再「走進劇院」站在自己選的座位；以及一款 visionOS 密室逃脫遊戲的行銷網站，把訪客送進昏暗密室，TV 螢幕播放神秘影片誘導下載。整套 API 的核心是 HTML **`\u003cmodel>` 元素**（指定 USDZ 3D 資產，並可加 **`environmentmap`** 360 度 HDR 環境貼圖提供照明與反射）。","**Immersive API 刻意模仿大家熟悉的 Fullscreen API**：用 `model.requestImmersive()` 請求 model 進入沉浸式（必須由使用者互動觸發，如點按按鈕），並有 `document.immersiveEnabled` 偵測支援、`document.immersiveElement` 查詢當前沉浸元素、`immersivechange` 事件、CSS 偽類客製版面等對應能力。與 Fullscreen 不同的是，它把 model 帶到瀏覽器邊界之外、同時保留網頁可見，且兩者可同時作用。Inline 預覽透過設定 model 的 **`entityTransform`**（DOMMatrix）來客製——先用 identity matrix 移除預設縮放、向下平移到人眼高度，再依座位 JSON 的位移與角度建出對應視角。","進入沉浸式時要注意 inline 與 immersive 有**不同參考座標系**（原點與比例不同：inline 原點在 layer 中央依 CSS，immersive 原點在使用者腳下、真實世界比例），因此 transform 需依沉浸狀態重算，並監聽 `immersivechange` 同步更新版面與顯示 exit 按鈕（Vision Pro 也可用 Digital Crown 隨時退出）。密室範例則把 model 設 `display: none` 隱藏 inline、直到請求才下載資產以省頻寬，並在等待時顯示 loading 動畫。最後是優化體驗：用 **Fullscreen API 把影片 dock** 到環境中的螢幕（搭配 Blender 外掛加 RealityKit 標註做 video docking 與光溢出）、用 `model.play()` 播放門開啟動畫、用 Scene Understanding 標註讓 Safari 視窗在環境投下陰影；效能上則減少頂點與實體數、用 low-poly mesh、把光照 bake 進材質、用 **`usdcrush`** 壓縮 USDZ。此外 image 元素加 `controls` 屬性即可在 visionOS 把全景／空間照片環繞展開。"],"deepdive":[{"t":0,"title":"Introduction","body":"visionOS Safari 團隊的 Jean 開場，展示如何用沉浸式環境提升網站。以售票網站（選位後可走進劇院站在選定座位）與密室逃脫行銷網站（被送進昏暗密室、TV 播神秘影片誘導下載）兩個範例，預告本場將涵蓋 API 概覽、inline 預覽、進入沉浸式、以及優化。"},{"t":106,"title":"Meet the immersive API","body":"概覽 **Immersive API**：一切始於 HTML **`\u003cmodel>` 元素**，用來在網站顯示 3D 模型。"},{"t":111,"title":"Basic model element","body":"最基本用法：`\u003cmodel src=\"teapot.usdz\">`，指定 USDZ 3D 資產即可在網頁顯示模型。"},{"t":126,"title":"Model element with environment map","body":"加上 **`environmentmap`** 屬性（一張 360 度 HDR 影像捕捉場景周圍光照），可為茶壺等光滑物件帶來戲劇性的反射與照明。資產可用 Blender 等任何能匯出 USDZ 的工具製作。"},{"t":256,"title":"Preview environments inline","body":"說明 **inline 預覽**是把環境介紹給訪客的好開端，能在頁面中先呈現環境的一個視角作為第一步。"},{"t":280,"title":"Adding the environment model on the page for inline preview","body":"在空的 HTML div 加入 `\u003cmodel>`，提供劇院 USDZ 與其 lighting map。預設模型會縮放以塞進元素邊界，因此一開始顯示的是從外部看的整座劇院。"},{"t":314,"title":"Reset the model entity transform","body":"要擺脫預設塞入行為，需客製 **`entityTransform`**（控制位置、旋轉、縮放）：取得 model、等待 `ready` 後，建立 **identity matrix** 並設給 entityTransform，移除所有變換。"},{"t":342,"title":"Translate the model down","body":"因劇院模型原點在地板，移除變換後地板位於 layer 中央；目標是以人眼高度呈現環境，故用 `translateSelf(0, -1.0, 0)` 把模型**向下平移 1 公尺**到坐姿眼高。"},{"t":400,"title":"Build the seat transform","body":"為讓預覽視角對應實際選位，準備座位 JSON（每座位含原點位移與朝向角度，採右手 Y-up 座標）。在 `buildTransform` 中依座位的 x/y/z 與 ry 套用旋轉與平移，再加眼高平移，讓視角符合該座位。"},{"t":421,"title":"Go immersive","body":"Inline 預覽在 macOS、iOS 也適用，但真正的魔法是讓買票者**走進劇院**，釋放 visionOS 等空間平台的全部潛力。"},{"t":436,"title":"Detect feature availability","body":"先用 **`document.immersiveEnabled`** 檢查目前瀏覽器是否支援沉浸式呈現，據此才顯示沉浸式按鈕，確保按鈕只在實際支援處出現。"},{"t":454,"title":"Request the immersive transition on the model","body":"在使用者互動（如點按沉浸式按鈕）中呼叫 **`model.requestImmersive()`** 請求進入沉浸式——此操作必須回應使用者互動才能觸發。"},{"t":504,"title":"Build immersive transform","body":"注意 inline 與 immersive 有**不同參考座標系**（原點與比例不同）。在 `buildTransform` 加第二個 immersive 參數：沉浸時加些微旋轉讓主視覺（舞台）不被 Safari 視窗擋住，眼高平移則只在 inline 時套用。"},{"t":541,"title":"Update the entity transform and the layout on immersive state updates","body":"因 entityTransform 取決於沉浸狀態，須在進出沉浸時重算。監聽 model 的 **`immersivechange`** 事件，依 `document.immersiveElement` 判斷當前狀態重算 transform，並用 CSS class 切換更新頁面版面（調整介面、顯示 exit 按鈕）。Vision Pro 使用者也可用 Digital Crown 隨時退出。"},{"t":653,"title":"Hide the inline preview","body":"密室範例為保留驚喜，把 `\u003cmodel>` 設 **`display: none`** 隱藏 inline layer；這不影響請求沉浸式，且有實際好處——資產在沉浸請求真正發生前不會下載或解碼，對重型環境模型可省下大量頻寬與記憶體。"},{"t":685,"title":"Request an immersive transition on the escape room model","body":"只需在按鈕的 click 事件呼叫 **`escapeRoom.requestImmersive()`** 即可請求密室模型進入沉浸式，程式碼出乎意料地少。"},{"t":712,"title":"Handle the request result and show a loading animation","body":"因模型未預先 inline 載入，沉浸請求可能需時（重型資產更甚）。用 try／finally 在請求前 `showLoadingAnimation()`、完成後 `hideLoadingAnimation()`，給訪客「正在進行」的回饋。"},{"t":724,"title":"Optimize the experience","body":"進入讓密室「活起來」的細節：影片、動畫、陰影投射等小細節讓簡單體驗大放異彩。"},{"t":796,"title":"Dock the video in the environment with the fullscreen API","body":"用 **video docking** 把影片放進環境中的螢幕（TV／投影／看板），而非 inline 播放，還能讓影片光線溢出到場景材質。需在 USDZ 加 RealityKit 標註（講者用自製 Blender 外掛標記 TV 為 docking region），再對影片 `requestFullscreen()` 即自動送到正確位置並隱藏 Safari 視窗。"},{"t":841,"title":"Play the model animation","body":"讓神秘的門滑開：在 Blender 預先做好開門動畫，監聽影片 `ended` 事件，先 `exitFullscreen()` 取消 dock、再 **`escapeRoom.play()`** 播放模型動畫。可用 `currentTime` 在動畫時間軸導覽，串成多階段環境變換。"},{"t":998,"title":"Compress your USDZ with usdcrush","body":"效能優化：減少頂點數（不匯出原點處看不到的 mesh）、減少實體數（合併桌面與裝飾）、適時用 low-poly mesh、保持 shader 簡單（把光照 bake 進材質做 unlit）；最後用 **`usdcrush`** 命令列工具壓縮 USDZ 紋理，直接縮短載入時間。Safari 視窗的陰影投射則需 Scene Understanding 標註並用專用 low-poly mesh。"},{"t":1037,"title":"Image controls","body":"另一個可組合的 API：在 `\u003cimg>` 元素加 **`controls`** 屬性，瀏覽器即提供原生控制項——在 visionOS 可把全景照片全螢幕環繞展開，也支援用 Vision Pro 或 iPhone 拍的空間照片。"},{"t":1089,"title":"Next steps","body":"總結行動方案：用 Apple Vision Pro 試玩 webkit.org 的線上 demo、建立你的第一個網站環境（參考 session 附的 API 規格資源）、並在 bugs.webkit.org 提交功能需求或錯誤回報。並推薦觀看「Design immersive environments for visionOS apps and the spatial web」。"}],"summary_en":["Presented by Jean from the visionOS Safari team, this session shows how to use the new **JavaScript Immersive API** to transport website visitors into virtual environments in Apple Vision Pro's Safari—a new way to tell stories and engage customers. Two running examples: a ticket-sales site that gives an inline preview as visitors pick a seat, then lets them 'enter the theater' and stand at their chosen spot; and a marketing site for a visionOS escape-room game that drops visitors into a dim chamber where a TV plays a mysterious video to drive downloads. The API centers on the HTML **`\u003cmodel>` element** (specifying a USDZ 3D asset, optionally with an **`environmentmap`** 360-degree HDR map for lighting and reflections).","The **Immersive API deliberately mirrors the familiar Fullscreen API**: call `model.requestImmersive()` to go immersive (must be triggered by user interaction, like a button tap), with `document.immersiveEnabled` to detect support, `document.immersiveElement` to query the current immersive element, an `immersivechange` event, and CSS pseudo-classes for layout. Unlike Fullscreen, it transports the model beyond the browser bounds while keeping the page visible, and both can be active simultaneously. Inline previews are customized via the model's **`entityTransform`** (a DOMMatrix)—first an identity matrix to remove default scaling, a downward translate to eye level, then per-seat translation and rotation from a seat JSON to match the chosen viewpoint.","When going immersive, note that inline and immersive use **different reference frames** (different origins and scales: inline's origin is at the layer center per CSS, immersive's is at the user's feet at real-world scale), so the transform must be recomputed per immersive state, listening to `immersivechange` to update layout and show an exit button (Vision Pro users can also exit anytime with the Digital Crown). The escape-room example sets the model to `display: none` to hide the inline preview and avoid downloading the asset until requested, showing a loading animation while waiting. Finally, optimizing the experience: use the **Fullscreen API to dock video** onto a screen in the environment (with RealityKit annotations added via a Blender plugin for video docking and light spill), `model.play()` to play a door-opening animation, and a Scene Understanding annotation so the Safari window casts a shadow; for performance, reduce vertex and entity counts, use low-poly meshes, bake lighting into materials, and compress USDZ with **`usdcrush`**. An `\u003cimg>` element with the `controls` attribute also lets you wrap panoramas/spatial photos around the viewer on visionOS."],"deepdive_en":[{"t":0,"title":"Introduction","body":"Jean from the visionOS Safari team opens by showing how to elevate websites with immersive environments. Using a ticket site (enter the theater and stand at your chosen seat) and an escape-room marketing site (dropped into a dim chamber with a mysterious TV video driving downloads), the session previews an API overview, inline previews, going immersive, and optimization."},{"t":106,"title":"Meet the immersive API","body":"Overviews the **Immersive API**: it all starts with the HTML **`\u003cmodel>` element** for displaying 3D models on a website."},{"t":111,"title":"Basic model element","body":"The most basic usage: `\u003cmodel src=\"teapot.usdz\">`, specifying a USDZ 3D asset to display a model on the page."},{"t":126,"title":"Model element with environment map","body":"Adding the **`environmentmap`** attribute (a 360-degree HDR image capturing the scene's lighting) brings dramatic reflections and lighting to shiny objects like a teapot. Assets can be made with any tool that exports USDZ, such as Blender."},{"t":256,"title":"Preview environments inline","body":"Explains that **inline previews** are a great first step to introduce an environment to visitors, presenting a viewpoint of the environment within the page."},{"t":280,"title":"Adding the environment model on the page for inline preview","body":"Add a `\u003cmodel>` to an empty HTML div with the theater USDZ and its lighting map. By default the model scales to fit the element bounds, so it initially shows the whole theater from the outside."},{"t":314,"title":"Reset the model entity transform","body":"To remove the default fitting, customize the **`entityTransform`** (position, rotation, scale): get the model, await `ready`, create an **identity matrix**, and assign it to entityTransform, removing all transformations."},{"t":342,"title":"Translate the model down","body":"Because the theater model's origin is on its floor, after removing transforms the floor sits at the layer center; to present at human eye level, use `translateSelf(0, -1.0, 0)` to **translate the model down 1 meter** to seated eye height."},{"t":400,"title":"Build the seat transform","body":"To match the preview viewpoint to the actual seat, prepare a seat JSON (each seat's origin offset and orientation angle, in right-handed Y-up coordinates). In `buildTransform`, apply the seat's rotation and translation from x/y/z and ry plus the eye-level translation so the view matches that seat."},{"t":421,"title":"Go immersive","body":"Inline previews also work on macOS and iOS, but the real magic is letting the buyer **step inside the theater**, unlocking the full potential of spatial platforms like visionOS."},{"t":436,"title":"Detect feature availability","body":"First check **`document.immersiveEnabled`** to see whether the current browser supports immersive presentations, and only then show the immersive button so it appears only where actually supported."},{"t":454,"title":"Request the immersive transition on the model","body":"Call **`model.requestImmersive()`** within a user interaction (like tapping the immersive button) to request going immersive—this must happen in response to user interaction."},{"t":504,"title":"Build immersive transform","body":"Note that inline and immersive have **different reference frames** (different origins and scales). Add a second immersive parameter to `buildTransform`: when immersive, add a slight rotation so the main focus (the stage) isn't hidden behind the Safari window, and apply the eye-level translation only when inline."},{"t":541,"title":"Update the entity transform and the layout on immersive state updates","body":"Since entityTransform depends on immersive state, recompute it when entering/exiting immersive. Listen to the model's **`immersivechange`** event, recompute the transform based on `document.immersiveElement`, and toggle a CSS class to update the page layout (adjust UI, show an exit button). Vision Pro users can also exit anytime with the Digital Crown."},{"t":653,"title":"Hide the inline preview","body":"The escape-room example keeps the surprise by setting the `\u003cmodel>` to **`display: none`** to hide the inline layer; this doesn't prevent requesting immersive and has a practical benefit—the asset isn't downloaded or decoded until the immersive request actually happens, saving significant bandwidth and memory for heavy environment models."},{"t":685,"title":"Request an immersive transition on the escape room model","body":"Simply call **`escapeRoom.requestImmersive()`** in the button's click event to request the escape-room model go immersive—it takes surprisingly little code."},{"t":712,"title":"Handle the request result and show a loading animation","body":"Since the model isn't preloaded inline, the immersive request may take time (more so for heavy assets). Use try/finally to `showLoadingAnimation()` before the request and `hideLoadingAnimation()` after, giving visitors feedback that something is happening."},{"t":724,"title":"Optimize the experience","body":"Moves to the details that bring the escape room alive: video, animations, and shadow casting—small touches that make a simple experience go a long way."},{"t":796,"title":"Dock the video in the environment with the fullscreen API","body":"Use **video docking** to place the video on a screen in the environment (TV/projector/billboard) instead of inline, and let its light spill onto scene materials. This needs RealityKit annotations in the USDZ (the speaker uses a custom Blender plugin to tag the TV as the docking region); calling `requestFullscreen()` on the video then transports it to the right location and hides the Safari window."},{"t":841,"title":"Play the model animation","body":"To make the mysterious door slide open: author the door-opening animation in Blender, listen for the video's `ended` event, call `exitFullscreen()` to undock, then **`escapeRoom.play()`** to play the model animation. Use `currentTime` to navigate the timeline for multi-stage environment transformations."},{"t":998,"title":"Compress your USDZ with usdcrush","body":"Performance: reduce vertex count (don't export meshes invisible from the origin), reduce entity count (merge the desk with its decorations), use low-poly meshes where appropriate, and keep shaders simple (bake lighting into materials for unlit); finally use the **`usdcrush`** command-line tool to compress USDZ textures, directly cutting load time. Safari window shadow casting needs a Scene Understanding annotation with a dedicated low-poly mesh."},{"t":1037,"title":"Image controls","body":"Another composable API: add the **`controls`** attribute to an `\u003cimg>` element and the browser provides native controls—on visionOS this lets you make a panorama fullscreen and wrap it around you, and it also supports spatial photos captured on Vision Pro or iPhone."},{"t":1089,"title":"Next steps","body":"Summarizes the action plan: try the online demos on webkit.org with Apple Vision Pro, build your first website environment (using the API specs attached to the session), and file feature requests or bug reports at bugs.webkit.org. Also recommends watching 'Design immersive environments for visionOS apps and the spatial web'."}],"code":["\u003cmodel src=\"teapot.usdz\">\n\u003c/model>","\u003cmodel src=\"teapot.usdz\"\n\tenvironmentmap=\"kitchen.hdr\">\n\u003c/model>","\u003cdiv class=\"seat-preview\">\n\t\u003cmodel id=\"theater\"\n\t\t   src=\"theater-model.usdz\"\n\t\t   environmentmap=\"theater-lighting.hdr\">\n\t\u003c/model>\n\u003c/div>","const theater = document.getElementById(\"theater\");\n\nasync function updateModelTransform() {\n\t// Make sure the model is loaded\n\tawait theater.ready;\n\t// Create a transform matrix\n\tconst identity = new DOMMatrix();\n\t// Apply the transform matrix to the model\n\ttheater.entityTransform = identity;\n}\n\nupdateModelTransform();","const theater = document.getElementById(\"theater\");\n\nasync function updateModelTransform() {\n\t// Make sure the model is loaded\n\tawait theater.ready;\n\t// Create a transform matrix\n\tconst transform = new DOMMatrix();\n\t// Translate model down, for eye level preview\n\ttransform.translateSelf(\n\t\t0, \t\t\t// x\n\t\t-1.0, \t// y\n\t\t0 \t\t\t// z\n\t);\n\t// Apply the transform matrix to the model\n\ttheater.entityTransform = transform;\n}\n\nupdateModelTransform();","function buildTransform(seat) {\n\tconst transform = new DOMMatrix();\n\tconst { x, y, z, ry } = seat;\n\t// Rotate and translate the model to match \n  // the seat's origin and orientation\n\ttransform.rotateSelf(0, -ry, 0);\n\ttransform.translateSelf(-x, -y, -z);\n\t// Translate the model down, for eye level preview\n\ttransform.translateSelf(0, -1.0, 0);\n\treturn transform;\n}","if (document.immersiveEnabled) {\n\timmersiveButton.hidden = false;\n}","immersiveButton.addEventListener(\"click\", async () => {\n\tawait model.requestImmersive();\n});","function buildTransform(seat, immersive) {\n\tconst transform = new DOMMatrix();\n\t// [...] Seat transform logic\n\tif (immersive) {\n\t\t// Rotate to the left\n\t\ttransform.rotateSelf(\n\t\t\t0,\t\t// x\n\t\t\t45,\t\t// y\n\t\t\t0\t\t\t// z\n\t\t);\n\t} else {\n\t\t// [...] Eye level translation\n\t}\n\treturn transform;\n}","theater.addEventListener(\"immersivechange\", () => {\n\tconst isImmersive = !!document.immersiveElement;\n\tconst transform = buildTransform(isImmersive, currentSeat);\n\ttheater.entityTransform = transform;\n  document.body.classList.toggle(\"immersive\", isImmersive);\n});","\u003cmodel id=\"escapeRoom\"\n\t   src=\"escape-room.usdz\"\n\t   environmentmap=\"room-lighting.hdr\"\n\t   style=\"display: none\">\n\u003c/model>","const enterButton = document.getElementById(\"enterButton\");\nconst escapeRoom = document.getElementById(\"escapeRoom\");\n\nenterButton.addEventListener(\"click\", () => {\n    await escapeRoom.requestImmersive();\n});"]},"related":[{"id":"215","title":"Get started with the HTML Model Element","gloss":"開始使用 HTML model 元素","gloss_en":"Getting started with the HTML model element","category":"graphics","categoryLabel":"圖形與遊戲"},{"id":"234","title":"Design immersive environments for visionOS apps and the spatial web","gloss":"為 visionOS App 與空間網頁設計沉浸式環境","gloss_en":"Design immersive environments for visionOS apps and the spatial web","category":"visionos","categoryLabel":"visionOS"},{"id":"279","title":"Explore advances in RealityKit","gloss":"探索 RealityKit 的最新進展","gloss_en":"Explore advances in RealityKit","category":"visionos","categoryLabel":"visionOS"},{"id":"280","title":"Iterate your spatial scenes faster with Reality Composer Pro 3","gloss":"用 Reality Composer Pro 3 更快迭代空間場景","gloss_en":"Iterate your spatial scenes faster with Reality Composer Pro 3","category":"visionos","categoryLabel":"visionOS"},{"id":"281","title":"Extend Reality Composer Pro 3 functionality with Xcode","gloss":"用 Xcode 擴充 Reality Composer Pro 3 的功能","gloss_en":"Extend Reality Composer Pro 3 functionality with Xcode","category":"visionos","categoryLabel":"visionOS"}]}</script>
