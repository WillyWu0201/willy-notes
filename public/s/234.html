<script id="d" type="application/json">{"s":{"id":"234","title":"Design immersive environments for visionOS apps and the spatial web","gloss":"為 visionOS App 與空間網頁設計沉浸式環境","category":"visionos","categoryLabel":"visionOS","duration":958,"url":"https://developer.apple.com/videos/play/wwdc2026/234/","takeaway":"用前期、製作、後期三階段的工作流,為 visionOS App、網站與 SharePlay 體驗打造擬真的沉浸式環境。","chapters":[[0,"Introduction"],[77,"Pre-production"],[307,"Production"],[521,"Post-production"],[907,"Next steps"]],"points":[{"text":"教你為 App、網站與 **SharePlay** 體驗打造**擬真(photoreal)的 visionOS 環境**。","hot":true},{"text":"**Pre-production(前期)**:規劃環境概念、參考與設計方向。","hot":false},{"text":"**Production(製作)**:實際建構環境資產與場景。","hot":false},{"text":"**Post-production(後期)**:潤飾與最佳化沉浸式呈現效果。","hot":false},{"text":"內容同時涵蓋 App 與**空間網頁(spatial web)**的沉浸式環境設計。","hot":false}],"apis":[],"audience":"**為 visionOS 或空間網頁打造沉浸式環境的設計師與 3D 內容創作者。**","gloss_en":"Design immersive environments for visionOS apps and the spatial web","takeaway_en":"Use a three-phase workflow—pre-production, production, and post-production—to build photoreal immersive environments for visionOS apps, websites, and SharePlay experiences.","points_en":[{"text":"Learn to build **photoreal visionOS environments** for apps, websites, and **SharePlay** experiences.","hot":true},{"text":"**Pre-production**: plan the environment concept, references, and design direction.","hot":false},{"text":"**Production**: actually build the environment assets and scene.","hot":false},{"text":"**Post-production**: polish and optimize the immersive presentation.","hot":false},{"text":"The content covers immersive environment design for both apps and the **spatial web**.","hot":false}],"audience_en":"**Designers and 3D content creators building immersive environments for visionOS or the spatial web.**","summary":["這場由 Apple 人機介面設計師 Michael Breymann 主講，主題是如何為 visionOS app、網站與 SharePlay 體驗設計**沉浸式環境（immersive environments）**。他先點出 visionOS 的系統環境並非單純的背景圖：它是為空間運算打造的**寫實自然場景**，具備真正的**深度與視差（parallax）**，會隨視角改變而回應，再加上動態與**空間音訊（spatial audio）**，讓場景彷彿活著。整場以 Mount Hood、Moon、Jupiter、Yosemite、Thorsmork、Bora Bora 六個系統環境為例，貫穿 **pre-production、production、post-production** 三個階段的設計流程。","**Pre-production（前期）**強調先釐清意圖：為何要做這個環境、想呈現什麼特質、使用者會怎麼用這個空間。接著實地勘景，注意 visionOS 全沉浸時視野約 **81°**，思考主視角與轉身後看到的內容，並標記要替換的元素（如道路、雜亂植被）。無法親臨的場景（如月球）則仰賴 Apollo 任務照片等參考素材；團隊也用 Yosemite 的 **Digital Elevation Models** 做光照研究。規劃時要以**圖層（layers）**思維從背景到前景構圖，並預先想好動態與音訊。","**Production（製作）**核心是在源頭就拍到高品質照片。建議用三腳架、相機離地 1 公尺並水平、深景深，若可能再架一台離地 2 公尺的相機同步觸發以利後期補景；用涵蓋全視角的 rig 與鏡頭產出 360° 拼接全景，並拍**包圍曝光（bracketed exposures）**保留動態範圍。visionOS 環境在 **40 ppd（pixels per degree）**下清晰，理想目標是 **14,400 × 7,200** 的 360° 全景。此外用 photogrammetry／LiDAR 取得點雲做距離量測，並拍 Macbeth 色卡、鉻球與灰球當光照參考；若無法拍攝則用 DCC 工具製作算圖全景。","**Post-production（後期）**從清理全景開始，移除相機 rig、腳印、人物與干擾構圖的元素，再透過 digital matte painting 與 CG 算圖反覆精修，特別留意色彩平衡與光照一致性。為了營造視差，需把全景投到 UV 空間的 3D mesh，用次要照片與 CG 補上看不到的部分，並持續做 A/B 比對確保材質轉移品質；翻轉場景、套用極端 gamma／gain 可揪出色偏與資料流失。最後以**自訂 shader** 高效率地做出動態：UV flow maps 驅動雲與植物、scrolling mask 模擬雲影、flip book 紋理近似柔和陰影、hierarchical vertex animation 加上分層 sine 波讓樹幹與葉片擺動有層次。實務心法是**凡事有意圖、構圖要成立、用聲音與動態把場景綁在一起**，並勇於打破自己的設計、擁抱意外。"],"deepdive":[{"t":0,"title":"Introduction","body":"講者開宗明義說明 visionOS 的系統環境**不只是背景**，而是為空間運算設計的**寫實自然景觀**。以 Haleakala 為例，它不像平面媒體或全景圖那樣對視角無反應，而是提供真正的**深度與視差（parallax）**，再結合動態與音訊讓場景彷彿活著。整場將以六個系統環境為例，帶過 pre-production、production、post-production 三階段。"},{"t":77,"title":"Pre-production","body":"前期先問三個問題：**為何**做這個環境、想帶出**哪些特質**、使用者會**如何使用**這個空間。講者以大尺寸觀影（雕塑地形、研究最佳中心觀看線）與 Keynote 環境（刻意無聲、聚光於舞台以利練習演講）說明意圖如何驅動設計。實地勘景時要考量 visionOS 全沉浸約 **81°** 視野的主視角與轉身視野，月球這類場景則靠 Apollo 照片，Yosemite 則用 **Digital Elevation Models** 做光照研究；並提醒以**圖層**思維構圖、預先規劃動態與音訊。"},{"t":307,"title":"Production","body":"製作階段強調在源頭拍到可直接使用的高品質素材。技巧包含三腳架相機離地 1 公尺水平、深景深，並架第二台離地 2 公尺相機同步觸發供後期補景；用全視角 rig 產出 360° 拼接全景，拍**包圍曝光**保留從太陽到陰影的動態範圍。目標解析度為 **40 ppd**、約 **14,400 × 7,200** 的全景；另以 photogrammetry／LiDAR 點雲做距離量測（例如發現地形其實有坡度），並拍 Macbeth 色卡與鉻／灰球當光照參考，必要時改用算圖全景。"},{"t":521,"title":"Post-production","body":"後期先**清理全景**：移除相機 rig、腳印、人物與過於搶眼的植被，再以 matte painting 與 CG 反覆精修並維持色彩與光照一致。為製造視差需把全景轉到 UV 空間的 **3D mesh**，用次要照片與 CG 補齊不可見區域，並以 A/B 比對、翻轉場景、極端 gamma／gain 檢查品質。動態與音訊是沉浸的關鍵：空間音訊放置 emitter（如河水流經岩石處），而 Bora Bora 的雲、棕櫚、海浪則用 **UV flow maps、scrolling mask 雲影、flip book 陰影、hierarchical vertex animation 加分層 sine 波**等技巧，在即時算圖預算內做出可信動態。"},{"t":907,"title":"Next steps","body":"收尾以設計心法作結：**凡事有意圖**，能解釋每個元素的增刪理由；**構圖要成立**，每個元素都該屬於它所在之處；並以**聲音與動態**把整個場景綁在一起。這套原則不分個人、小團隊或大工作室皆適用。最後的提醒是：別太執著於單一想法，試著去**打破自己的設計**、做點意外之舉並接受結果，最好的成果往往來自途中擁抱的驚喜。"}],"summary_en":["Presented by Apple human interface designer Michael Breymann, this session is about designing **immersive environments** for visionOS apps, websites, and SharePlay experiences. He opens by stressing that visionOS system environments are far more than backdrops: they are **photoreal natural landscapes** built for spatial computing, with true **depth and parallax** that respond to a change in perspective, and combined with motion and **spatial audio** the scene feels alive. The talk walks through the full design process across **pre-production, production, and post-production**, illustrated with six system environments: Mount Hood, the Moon, Jupiter, Yosemite, Thorsmork, and Bora Bora.","**Pre-production** is about getting clear on intent: why you're building the environment, what qualities you want to bring out, and how the viewer will use the space. You then scout the location, keeping in mind that visionOS shows roughly **81°** of field of view when fully immersed, considering the primary viewpoint and what's behind the viewer, and flagging elements to replace (roads, busy vegetation). Inaccessible scenes like the Moon rely on reference material such as Apollo photography, while Yosemite used **Digital Elevation Models** for a lighting study. Plan composition in terms of **layers** from background to foreground, and think early about motion and audio.","**Production** centers on capturing high-quality photography at the source. Tips include a tripod with the camera leveled 1 meter off the ground, deep depth of field, and a second camera at 2 meters triggered simultaneously to fill in the scene later; use a rig and lens covering all views to produce a stitched 360° panorama, and shoot **bracketed exposures** to preserve dynamic range. visionOS environments are sharp at **40 pixels per degree**, so an ideal 360° target is **14,400 × 7,200**. Capture photogrammetry/LiDAR point clouds for distance measurements, and shoot Macbeth charts plus chrome and gray spheres as lighting reference, or build a rendered panorama in a DCC tool when shooting isn't possible.","**Post-production** starts with cleanup of the panorama, removing the camera rig, footprints, people, and elements that interfere with the composition, then refining through digital matte painting and CG renders while watching color balance and lighting consistency. To create parallax you move the panorama onto a 3D mesh in UV space, filling unseen areas with secondary photography and CG, and constantly A/B comparing to retain quality; flopping the scene and pushing extreme gamma/gain values reveals color shifts and data loss. Finally, custom **shaders** deliver efficient motion: UV flow maps drive clouds and foliage, a scrolling mask fakes cloud shadows, flip book textures approximate soft shadows, and hierarchical vertex animation with layered sine waves makes trunks and leaflets sway with variety. The guiding principles: **be intentional, build a composition that works, and tie everything together with sound and motion** — and don't be afraid to break your own designs and embrace the surprises."],"deepdive_en":[{"t":0,"title":"Introduction","body":"The presenter states up front that visionOS system environments are **not just backdrops** but photoreal natural landscapes designed for spatial computing. Using Haleakala as an example, he contrasts them with flat media or panoramic images that don't respond to perspective, emphasizing the true **depth and parallax** they provide, which combined with motion and audio makes the scene feel alive. The talk will use six system environments to walk through the pre-production, production, and post-production stages."},{"t":77,"title":"Pre-production","body":"Pre-production starts with three questions: **why** you're building this environment, what **qualities** you want to bring to life, and **how** the viewer will use the space. Examples include large-format media viewing (sculpting terrain, researching the optimal center line) and the Keynote environment (intentionally silent, lit on the stage for speech practice). Scouting must account for the roughly **81°** field of view at full immersion for both the primary and turn-around views; the Moon relied on Apollo photography while Yosemite used **Digital Elevation Models** for a lighting study. The advice is to compose in **layers** and plan motion and audio ahead of time."},{"t":307,"title":"Production","body":"Production is about capturing directly usable, high-quality source imagery. Tips include a tripod with the camera leveled 1 meter off the ground and deep depth of field, plus a second camera at 2 meters triggered simultaneously to fill in the scene during post; use an all-view rig to produce a stitched 360° panorama and shoot **bracketed exposures** to capture the range from sun to shadow. The target is **40 ppd**, around **14,400 × 7,200**; photogrammetry/LiDAR point clouds aid distance measurement (e.g. discovering a slope), and Macbeth charts with chrome/gray spheres serve as lighting reference, with a rendered panorama as the fallback."},{"t":521,"title":"Post-production","body":"Post-production begins with **cleaning up the panorama**: removing the camera rig, footprints, people, and overly dominant vegetation, then refining through matte painting and CG while keeping color and lighting consistent. To create parallax the panorama is moved onto a **3D mesh** in UV space, with secondary photography and CG filling unseen areas, validated via A/B comparison, scene flopping, and extreme gamma/gain checks. Motion and audio complete immersion: spatial audio emitters are placed (e.g. where the river flows around rocks), and Bora Bora's clouds, palms, and waves use techniques like **UV flow maps, a scrolling cloud-shadow mask, flip book shadows, and hierarchical vertex animation with layered sine waves** to achieve believable motion within the real-time render budget."},{"t":907,"title":"Next steps","body":"The session closes with design principles: **be intentional** and able to justify every element you add or remove; **create a composition that works** where every element belongs; and tie the whole scene together with **sound and motion**. These apply equally to an individual, a small team, or a large studio. The final thought is to not get too attached to any one idea — try to **break your own designs**, do something unexpected, and be receptive to the surprises that often produce your best work."}],"code":[]},"related":[{"id":"279","title":"Explore advances in RealityKit","gloss":"探索 RealityKit 的最新進展","gloss_en":"Explore advances in RealityKit","category":"visionos","categoryLabel":"visionOS"},{"id":"280","title":"Iterate your spatial scenes faster with Reality Composer Pro 3","gloss":"用 Reality Composer Pro 3 更快迭代空間場景","gloss_en":"Iterate your spatial scenes faster with Reality Composer Pro 3","category":"visionos","categoryLabel":"visionOS"},{"id":"281","title":"Extend Reality Composer Pro 3 functionality with Xcode","gloss":"用 Xcode 擴充 Reality Composer Pro 3 的功能","gloss_en":"Extend Reality Composer Pro 3 functionality with Xcode","category":"visionos","categoryLabel":"visionOS"},{"id":"282","title":"Discover the Spatial Preview framework","gloss":"認識 Spatial Preview 框架","gloss_en":"Discover the Spatial Preview framework","category":"visionos","categoryLabel":"visionOS"},{"id":"283","title":"Explore enhancements to visionOS object tracking","gloss":"探索 visionOS 物件追蹤的強化功能","gloss_en":"Explore enhancements to visionOS object tracking","category":"visionos","categoryLabel":"visionOS"}]}</script>
