<script id="d" type="application/json">{"s":{"id":"281","title":"Extend Reality Composer Pro 3 functionality with Xcode","gloss":"用 Xcode 擴充 Reality Composer Pro 3 的功能","category":"visionos","categoryLabel":"visionOS","duration":1322,"url":"https://developer.apple.com/videos/play/wwdc2026/281/","takeaway":"用 Xcode 寫自訂 component、system、action 與 Script Graph 節點,透過 RealityComposerProPlugin 註冊進 Reality Composer Pro 3,打造更大型的空間專案。","chapters":[[0,"Introduction"],[120,"Extending the editor"],[291,"Custom components and systems"],[368,"Cauldron component"],[402,"CauldronSystem"],[420,"RCPCustomComponentsPlugin"],[632,"Controlling the water surface"],[649,"Cauldron component with vortex properties"],[665,"CauldronSystem update with ShaderGraph"],[799,"Custom animation actions"],[805,"SetWaterLevelAction"],[845,"SetWaterLevelAction subscribe"],[896,"RCPCustomComponentsPlugin with action"],[1032,"Custom Script Graph nodes"],[1052,"Cauldron with @Scriptable macro"],[1088,"Register scripting module"],[1276,"Next steps"]],"points":[{"text":"Reality Composer Pro 3 可用 **Xcode 撰寫專案專屬的編輯器擴充**,支援更大、更有野心的空間專案。","hot":false},{"text":"自訂 **Component(如 Cauldron)+ System(CauldronSystem)** 控制實體狀態,並用 EntityComponentQuery 在 update 中查詢。","hot":false},{"text":"透過 **RealityComposerProPlugin 的 setup(context:)** 以 registerComponent / registerSystem 把擴充註冊進編輯器(搭配 @_cdecl 進入點)。","hot":true},{"text":"自訂動畫用 **EntityAction(SetWaterLevelAction)**,以 subscribe(to: .updated) 依 normalizedTime 內插水位。","hot":false},{"text":"用 **@Scriptable macro** 將 component 暴露給 **Script Graph**,再以 RKS.Configuration 註冊 scripting module。","hot":false}],"apis":["RealityComposerProPlugin","Component","System","EntityComponentQuery","registerComponent","registerSystem","registerAction","EntityAction","ShaderGraphMaterial","@Scriptable","RealityKitScripting","RKS.Configuration"],"audience":"**已用 Reality Composer Pro 製作空間內容、想用 Xcode 加入自訂元件/系統/腳本節點的 visionOS 開發者。**","gloss_en":"Extend Reality Composer Pro 3 functionality with Xcode","takeaway_en":"Write custom components, systems, actions, and Script Graph nodes in Xcode, register them into Reality Composer Pro 3 via RealityComposerProPlugin, and build larger spatial projects.","points_en":[{"text":"Reality Composer Pro 3 lets you **author project-specific editor extensions in Xcode**, supporting bigger, more ambitious spatial projects.","hot":false},{"text":"Use a custom **Component (such as Cauldron) plus a System (CauldronSystem)** to control entity state, querying it in update with EntityComponentQuery.","hot":false},{"text":"Register extensions into the editor via **RealityComposerProPlugin's setup(context:)** using registerComponent / registerSystem (with an @_cdecl entry point).","hot":true},{"text":"For custom animation, use an **EntityAction (SetWaterLevelAction)** and subscribe(to: .updated) to interpolate the water level by normalizedTime.","hot":false},{"text":"Use the **@Scriptable macro** to expose a component to **Script Graph**, then register the scripting module via RKS.Configuration.","hot":false}],"audience_en":"**visionOS developers already building spatial content with Reality Composer Pro who want to add custom components, systems, and script nodes using Xcode.**","summary":["由 Niklas 主講，主題是用 **Xcode 撰寫的 plug-in** 來擴充 **Reality Composer Pro 3**（RealityKit 的遊戲與 3D 內容編輯器，今年稍晚推出），讓你的專案專屬內容直接出現在編輯器中，供美術與設計師即時調整、快速迭代。核心情境是 Chaparral Village 遊戲裡的一個 cauldron（大釜）：工程師寫好 plug-in 後，美術不需重新 build 與部署 app，就能在編輯器裡拖動 water level 或 rotation speed 看到水面即時反應。","工作流上，Reality Composer Pro 專案與 Xcode 專案放在同一個 git repo、可從編輯器的 simulation bar 互相連結啟動。匯入檔案會轉成 JSON 內部格式存於磁碟（編輯器附帶比標準 git merge 衝突更少的自訂合併工具），最終以 **Reality File** 匯出供 app 載入。Xcode 專案設兩個 scheme：`ChaparralVillage` build app、`RCPCustomComponents` build 給編輯器用的 plug-in framework，兩者共享所有 custom component 與 system。","擴充編輯器的關鍵機制是實作 **`RealityComposerProPlugin`** protocol，在其 `setup` 方法中用編輯器給的 context 註冊你的 component、system、action 與 scripting module；並提供一個標記為 C 函式、有 exported name 的 `createRealityComposerProPlugin()` 回傳 raw pointer 以供 plug-in loader 找到。Custom component（如儲存 waterLevel 的 Cauldron）需符合 `Component` 與 `Codable`；對應的 custom system 在 update 中找出帶該 component 的 entity 並調整水面位置，甚至取得 **Shader Graph** material 把 vortex 參數餵給 tech artist 做的渦流 shader。每次重 build plug-in 都需重啟編輯器並信任專案。","除了 component 與 system，plug-in 還能擴充兩處：在動畫 sequencer 中加入**自訂 animation action**（實作 `EntityAction` 與 `Codable`、定義 animated value type、用靜態 `subscribe()` 訂閱 `.updated` 事件在動畫期間以 normalized 時間插值更新水位），以及為 **Script Graph** 加入自訂節點（用 `@Scriptable` macro 標記 component，import `RealityKitScripting` 與 `RealityKitScriptingMacros`，在主執行緒建立 scripting configuration／module 並註冊到 `RealityKitScripting`）。如此美術與設計師就能在不寫程式的 Script Graph 裡用按鍵控制水位。"],"deepdive":[{"t":0,"title":"Introduction","body":"由 Niklas 開場，說明如何用 plug-in 擴充 **Reality Composer Pro 3**，讓美術與內容創作者直接在編輯器裡操作專案資產、快速迭代。以 cauldron 為例：工程師寫好 plug-in 後，美術可即時調整 water level 或 rotation speed 並看到大釜反應，無需 build 與部署 app。本場專注於「用程式碼能做什麼」，姊妹場另有無程式碼的 Script Graph 介紹。"},{"t":120,"title":"Extending the editor","body":"介紹擴充機制與團隊協作流程。Reality Composer Pro 專案與 Xcode 專案共處同一 git repo，可透過 simulation bar 連結並從編輯器啟動 app。匯入檔案轉為 **JSON** 內部格式存於磁碟，編輯器附帶比標準 git merge 衝突更少的自訂合併工具；內容最終以 **Reality File** 匯出給 app 載入。`RCPCustomComponents.framework` 把開發者寫的 component 與 system 帶進編輯器供美術編輯。"},{"t":291,"title":"Custom components and systems","body":"說明 Xcode 專案設兩個 scheme：`ChaparralVillage`（build app）與 `RCPCustomComponents`（build plug-in framework），兩者共享所有 custom component 與 system。目標是為 cauldron 做效果：控制水位升降，並加入攪拌時的渦流。講者比較 Script Graph 與 Swift 程式碼——能力相近、多為偏好問題，但巨大的 Script Graph 難維護，且程式碼能用 SwiftUI 等 Script Graph 沒有的 API，故選擇寫程式。"},{"t":368,"title":"Cauldron component","body":"建立一個簡單的 **Cauldron** component，只有一個 `waterLevel` 屬性。除了 `Component` protocol，還需符合 **`Codable`** 才能在編輯器中表示並序列化到 Reality File。對於有不該出現在編輯器的 runtime 屬性的進階 component，可實作 `CodingKeys`，但這個簡單 component 想序列化全部屬性，故不需要。"},{"t":402,"title":"CauldronSystem","body":"建立 custom system 設定水位：在 system update 中找出帶 Cauldron component 的 entity，再找到 water mesh 子 entity，依 Cauldron component 的 waterLevel 調整水面位置。這是把資料屬性轉成實際視覺變化的核心邏輯。"},{"t":420,"title":"RCPCustomComponentsPlugin","body":"建立實作 **`RealityComposerProPlugin`** protocol 的 plugin class（protocol 來自 RealityComposerPro Swift 套件，於用 Run With Xcode 連結時自動加入）。在 `setup` 方法用編輯器給的 context 註冊 component 與 system；並實作標記為 C 函式、有 exported name 的 `createRealityComposerProPlugin()` 回傳 raw pointer 供 plug-in loader 找到。build plug-in scheme 產生動態庫後開啟專案，編輯器詢問是否信任、選 Trust 載入，匯入的 component 即可加到 Cauldron entity，拖動 waterLevel 就看到水面反應；可設中斷點 attach 到編輯器除錯。"},{"t":632,"title":"Controlling the water surface","body":"基本水面完成後，要進一步加入攪拌時的渦流效果：玩家攪動大釜時水面彎成 vortex 形狀。tech artist 已用 Reality Composer Pro 3 的 **Shader Graph** 建好 vortex shader，帶有 rotation speed 等參數，講者希望從 custom component 控制這些參數。"},{"t":649,"title":"Cauldron component with vortex properties","body":"為 Cauldron component 新增引導渦流形狀的屬性（如 rotation speed、vortex coefficient），以便驅動 Shader Graph 的形狀運算。這些屬性會成為美術在編輯器中可調的旋鈕。"},{"t":665,"title":"CauldronSystem update with ShaderGraph","body":"修改 system 把參數傳遞給 **Shader Graph**：先取得 Shader Graph material，用 helper function 依 Cauldron 屬性算出水面形狀，把結果設到 Shader Graph 參數，再把 material 指回 model。重 build plug-in 後需重啟編輯器、信任專案，並接受 component 變更的 diff 對話框；之後增加 rotation speed 就能看到渦流變深。"},{"t":799,"title":"Custom animation actions","body":"進入動畫系統的擴充：animation sequencer 支援在 plug-in 中定義、再加到 sequencer 時間軸的 **custom animation action**。講者要做一個設定 cauldron 水位的 action。"},{"t":805,"title":"SetWaterLevelAction","body":"實作 **`EntityAction`** protocol、並符合 `Codable` 以存入 Reality File。action 取 start 與 end 兩個水位參數以便在兩值間動畫，並需回傳 animated value type 為 **`Transform`**（以便在 animation executor 中存取 entity）。"},{"t":845,"title":"SetWaterLevelAction subscribe","body":"撰寫執行 action 的程式碼：在 entity action 中建立靜態 **`subscribe()`** 函式，用 `EntityAction` 的 subscribe 方法訂閱 RealityKit 執行動畫時觸發的 **`.updated`** 事件。取得 normalized（0–1）的 elapsed 時間，據此在 start 與 end 水位間插值，取出 cauldron component 更新 waterLevel，再寫回 entity。"},{"t":896,"title":"RCPCustomComponentsPlugin with action","body":"把 custom animation 註冊到 Reality Composer Pro 3：如同 component 與 system，在 plugin 的 setup 用 context 註冊 action，並呼叫先前建立的 subscribe 函式讓 action 在動畫更新時執行。重啟編輯器開專案後可建 sequence、設根 entity 為含 cauldron 的場景、加 animation track，把 SetWaterLevelAction 拖入時間軸並設 start 0.3、stop 0.5，播放即見水位依 action 變化。"},{"t":1032,"title":"Custom Script Graph nodes","body":"說明 plug-in 也能為 **Script Graph** 加入自訂節點，讓設計師在不寫程式下使用。最快的方式是用 **`@Scriptable`** macro 把 custom component 暴露給 Script Graph。"},{"t":1052,"title":"Cauldron with @Scriptable macro","body":"import **`RealityKitScripting`** 與 **`RealityKitScriptingMacros`** 模組（macro 定義處，套件在從編輯器建立 Xcode 專案時自動設好），再把 component struct 標上 **`@Scriptable`** macro。macro 會展開出描述 component 的 schema 變數，供之後註冊到 scripting 系統。"},{"t":1088,"title":"Register scripting module","body":"在 plugin 的 setup 函式註冊 scripting module（須在**主執行緒**）：先建立專案的 scripting configuration，在其 initializer 回傳所有 scripting module 清單（這裡一個含 Cauldron schema 的 module，schema 由 @Scriptable 產生），再把 configuration 加到 RealityKitScripting。之後在 Cauldron entity 加 Scripting component、開 Script Graph，用 update 節點＋If 節點接 keypress，按 a 設水位 0.25、按 z 設 0.5，於 simulation view 測試。"},{"t":1276,"title":"Next steps","body":"總結：用 Xcode 寫 plug-in 即可擴充編輯器、操作 app 資料、甚至在編輯器內執行你的程式碼。建議延伸觀看「Explore advances in RealityKit」了解最新 RealityKit 功能，以及「Supercharge your spatial workflows with Reality Composer Pro 3」提升編輯器生產力。"}],"summary_en":["Presented by Niklas, this session shows how **plug-ins written in Xcode** can extend **Reality Composer Pro 3** (RealityKit's game and 3D content editor, shipping later this year) so your project-specific content appears inside the editor for artists and designers to tweak in real time and iterate fast. The running example is a cauldron in the Chaparral Village game: once engineers write the plug-in, artists can drag the water level or rotation speed and watch the water surface react—without rebuilding and deploying the app.","On workflow, the Reality Composer Pro project and the Xcode project live in the same git repo and can be linked and launched from the editor's simulation bar. Imported files are saved on disk as JSON (the editor ships a custom merge tool with fewer conflicts than standard git merge) and content is finally exported as a **Reality File** for the app to load. The Xcode project has two schemes: `ChaparralVillage` builds the app, and `RCPCustomComponents` builds the plug-in framework for the editor, with all custom components and systems shared between them.","The key extension mechanism is implementing the **`RealityComposerProPlugin`** protocol and, in its `setup` method, using the editor-provided context to register your components, systems, actions, and scripting modules; you also provide a `createRealityComposerProPlugin()` function marked as a C function with an exported name returning a raw pointer so the plug-in loader can find it. A custom component (like a Cauldron storing waterLevel) must conform to `Component` and `Codable`; the matching custom system finds entities with that component in its update and adjusts the water surface, and can even fetch the **Shader Graph** material to feed vortex parameters to a tech artist's swirl shader. Rebuilding the plug-in requires restarting the editor and trusting the project.","Beyond components and systems, plug-ins can extend two more areas: **custom animation actions** in the sequencer (implement `EntityAction` and `Codable`, return the animated value type, and use a static `subscribe()` to subscribe to the `.updated` event, interpolating the water level by normalized time during the animation), and **custom Script Graph nodes** (tag a component with the `@Scriptable` macro, import `RealityKitScripting` and `RealityKitScriptingMacros`, build a scripting configuration/module on the main thread, and register it with `RealityKitScripting`). This lets artists and designers control the water level via key presses in a no-code Script Graph."],"deepdive_en":[{"t":0,"title":"Introduction","body":"Niklas opens by explaining how plug-ins extend **Reality Composer Pro 3** so artists and content creators can work with project assets directly in the editor and iterate quickly. Using the cauldron example: once engineers write the plug-in, artists can adjust water level or rotation speed and see the cauldron react in real time, without building and deploying an app. This session focuses on what code can do; a companion session covers no-code Script Graph."},{"t":120,"title":"Extending the editor","body":"Introduces the extension mechanism and team workflow. The Reality Composer Pro project and Xcode project share one git repo and can be linked via the simulation bar to launch the app from the editor. Imported files become an internal **JSON** format on disk, with a custom merge tool that conflicts less than standard git merge; content is finally exported as a **Reality File** for the app. The `RCPCustomComponents.framework` brings developer-written components and systems into the editor for artists to edit."},{"t":291,"title":"Custom components and systems","body":"The Xcode project has two schemes: `ChaparralVillage` (builds the app) and `RCPCustomComponents` (builds the plug-in framework), sharing all custom components and systems. The goal is a cauldron effect: control the rising/falling water level plus a swirl when stirring. The presenter compares Script Graph and Swift code—similar capabilities, often a matter of preference—but very large Script Graphs are hard to maintain, and code can use APIs like SwiftUI that Script Graph lacks, so he chooses code."},{"t":368,"title":"Cauldron component","body":"Create a simple **Cauldron** component with a single `waterLevel` property. Beyond the `Component` protocol, it must conform to **`Codable`** to be representable in the editor and serialized to Reality Files. Advanced components with runtime properties that shouldn't appear in the editor could implement `CodingKeys`, but this simple component serializes all properties, so that isn't needed."},{"t":402,"title":"CauldronSystem","body":"Create a custom system to set the water level: in the system update, find entities with the Cauldron component, find the water mesh child entity, and adjust the water mesh position based on the component's waterLevel. This is the core logic turning a data property into actual visual change."},{"t":420,"title":"RCPCustomComponentsPlugin","body":"Create a plugin class implementing the **`RealityComposerProPlugin`** protocol (from the RealityComposerPro Swift package, auto-added when linking via Run With Xcode). In `setup`, register the component and system using the editor's context, and implement a `createRealityComposerProPlugin()` function marked as a C function with an exported name returning a raw pointer so the plug-in loader finds it. After building the plug-in scheme, open the project, choose Trust to load, add the imported component to the Cauldron entity, and drag waterLevel to see the surface react; set a breakpoint and attach to the editor to debug."},{"t":632,"title":"Controlling the water surface","body":"With the basic surface working, the next step adds a swirl when stirring: the surface bends into a vortex shape as the player stirs. A tech artist already built a vortex shader in Reality Composer Pro 3's **Shader Graph** with parameters like rotation speed, and the presenter wants to drive those from the custom component."},{"t":649,"title":"Cauldron component with vortex properties","body":"Add properties to the Cauldron component to guide the vortex shape (such as rotation speed and vortex coefficient) so they can drive the Shader Graph's shape computation. These become the knobs artists adjust in the editor."},{"t":665,"title":"CauldronSystem update with ShaderGraph","body":"Modify the system to propagate parameters to the **Shader Graph**: retrieve the Shader Graph material, use a helper to compute the surface shape from the Cauldron properties, set the result as Shader Graph parameters, and assign the material back to the model. After rebuilding the plug-in, restart the editor, trust the project, and accept the component-changes dialog; increasing rotation speed then makes the vortex deeper."},{"t":799,"title":"Custom animation actions","body":"Extending the animation system: the sequencer supports **custom animation actions** defined in the plug-in and added to the timeline. The presenter wants an action that sets the cauldron's water level."},{"t":805,"title":"SetWaterLevelAction","body":"Implement the **`EntityAction`** protocol and conform to `Codable` to be saved in a Reality File. The action takes start and end water levels so it can animate between them, and must return the animated value type as a **`Transform`** to access the entity in the animation executor."},{"t":845,"title":"SetWaterLevelAction subscribe","body":"Write the code that executes the action: create a static **`subscribe()`** function in the entity action that uses `EntityAction`'s subscribe to subscribe to the **`.updated`** event fired when RealityKit runs animations. Get the normalized (0–1) elapsed time, interpolate between start and end water levels, fetch the cauldron component, update waterLevel, and set it back on the entity."},{"t":896,"title":"RCPCustomComponentsPlugin with action","body":"Register the custom animation with Reality Composer Pro 3: as with components and systems, register the action in the plugin's setup via the context, and call the subscribe function so the action executes on animation updates. After restarting and opening the project, create a sequence, set the root entity to a scene containing the cauldron, add an animation track, drag SetWaterLevelAction into the timeline, set start 0.3 and stop 0.5, and play to see the level change per the action."},{"t":1032,"title":"Custom Script Graph nodes","body":"Plug-ins can also add custom nodes to **Script Graph** for designers to use without code. The quickest way to expose a custom component to Script Graph is the **`@Scriptable`** macro."},{"t":1052,"title":"Cauldron with @Scriptable macro","body":"Import the **`RealityKitScripting`** and **`RealityKitScriptingMacros`** modules (where the macro is defined; the package is auto-set-up when creating the Xcode project from the editor), then tag the component struct with the **`@Scriptable`** macro. The macro expands to a schema variable describing the component for later registration with the scripting system."},{"t":1088,"title":"Register scripting module","body":"Register the scripting module in the plugin's setup (must be on the **main thread**): create a scripting configuration whose initializer returns the list of all modules (here one module holding the Cauldron schema generated by @Scriptable), then add the configuration to RealityKitScripting. Then add a Scripting component to the Cauldron entity, open Script Graph, wire an update node and an If node to a keypress—'a' sets the level to 0.25, 'z' to 0.5—and test in a simulation view."},{"t":1276,"title":"Next steps","body":"Recap: writing plug-ins in Xcode lets you extend the editor, work with your app's data, and even run your code inside the editor. The presenter recommends 'Explore advances in RealityKit' for the latest RealityKit features and 'Supercharge your spatial workflows with Reality Composer Pro 3' for editor productivity."}],"code":["// Add a component to represent the water level\n\nimport RealityKit\n\npublic struct Cauldron: Component, Codable {\n    public var waterLevel: Float\n\n    enum CodingKeys: CodingKey {\n        case waterLevel\n    }\n}","// Add a system to control the water level\n\nimport RealityKit\n\npublic struct CauldronSystem: System {\n    let query = EntityComponentQuery(Cauldron.self)\n    public init(scene: Scene) {}\n\n    public func update(context: SceneUpdateContext) {\n        for (entity, cauldron) in context.entities(matching: query) {\n            guard let water = entity.findEntity(named: \"Cauldron_Water_mesh\")\n                else { continue }\n            water.setPosition(SIMD3\u003cFloat>(0, 1, 0) * cauldron.waterLevel, relativeTo: entity)\n        }\n    }\n}","// Make sure that Reality Composer Pro 3 knows about the Cauldron and CauldronSystem\n\nimport RealityComposerPro\n\nfinal class RCPCustomComponentsPlugin: RealityComposerProPlugin {\n    public func setup(context: any RealityComposerProContext) {\n        context.registerComponent(Cauldron.self)\n        context.registerSystem(CauldronSystem.self)\n    }\n}\n\n@_cdecl(\"createRealityComposerProPlugin\")\npublic func createRealityComposerProPlugin() -> UnsafeMutableRawPointer {\n    return RCPCustomComponentsPlugin().passRetained()\n}","// Properties to control water surface\n\nimport RealityKit\n\npublic struct Cauldron: Component, Codable {\n    public var waterLevel: Float\n    public var rotationSpeed: Float\n    public var minWaterLevel: Float\n    public var maxWaterLevel: Float\n    public var vortexCoeff: Float\n}","public func update(context: SceneUpdateContext) {\n    for (entity, cauldron) in context.entities(matching: query) {\n        guard let water = entity.findEntity(named: \"Cauldron_Water_mesh\") else { continue }\n        water.setPosition(SIMD3\u003cFloat>(0, 1, 0) * cauldron.waterLevel, relativeTo: entity)\n\n        guard var model = water.components[ModelComponent.self] else { continue }\n        guard var mat = model.materials.first as? ShaderGraphMaterial else { continue }\n        let surface = computeSurface(cauldron: cauldron)\n        try? mat.setParameter(name: \"Level Radius\", value: .float(surface.levelRadius))\n        try? mat.setParameter(name: \"Lowest Point\",\n            value: .float(cauldron.waterLevel - surface.lowestPoint))\n        try? mat.setParameter(name: \"Height Change\", value: .float(surface.heightChange))\n        try? mat.setParameter(name: \"Level Coeff\", value: .float(surface.levelCoeff))\n        try? mat.setParameter(name: \"Is Level\", value: .bool(surface.isLevel))\n        model.materials[0] = mat\n        water.components.set(model)\n    }\n}","// Custom action for setting the water level of the Cauldron\n\nimport RealityKit\n\npublic struct SetWaterLevelAction: EntityAction, Codable {\n    // Parameters for the action\n    public let startWaterLevel: Float\n    public let endWaterLevel: Float\n\n    // Required by EntityAction protocol\n    public var animatedValueType: (any AnimatableData.Type)? { Transform.self }\n}","extension SetWaterLevelAction {\n    static func subscribe() {\n        Task { @MainActor in\n            SetWaterLevelAction.subscribe(to: .updated) { event in\n                let normalizedTime = (event.playbackController.time - event.startTime) /\n                    event.duration\n                let action = event.action\n                let currentLevel = action.startWaterLevel +\n                    Float(normalizedTime) * (action.endWaterLevel - action.startWaterLevel)\n                guard let entity = event.targetEntity else { return }\n                guard var cauldron = entity.components[Cauldron.self] else { return }\n                cauldron.waterLevel = currentLevel\n                entity.components.set(cauldron)\n            }\n        }\n    }\n}","// Make sure that Reality Composer Pro 3 knows about the SetWaterLevelAction\n\nimport RealityComposerPro\n\nfinal class RCPCustomComponentsPlugin: RealityComposerProPlugin {\n    public func setup(context: any RealityComposerProContext) {\n        context.registerComponent(Cauldron.self)\n        context.registerSystem(CauldronSystem.self)\n\n        context.registerAction(SetWaterLevelAction.self)\n        SetWaterLevelAction.subscribe()\n    }\n}\n\n@_cdecl(\"createRealityComposerProPlugin\")\npublic func createRealityComposerProPlugin() -> UnsafeMutableRawPointer {\n    return RCPCustomComponentsPlugin().passRetained()\n}","// Expose Cauldron to Script Graphs\n\nimport RealityKit\nimport RealityKitScripting\nimport RealityKitScriptingMacros\n\n@Scriptable\npublic struct Cauldron: Component, Codable {\n    public var waterLevel: Float\n    public var rotationSpeed: Float\n    public var minWaterLevel: Float\n    public var maxWaterLevel: Float\n    public var vortexCoeff: Float\n}","// Register scripting module\n\npublic func setup(context: any RealityComposerProContext) {\n    context.registerComponent(Cauldron.self)\n    context.registerSystem(CauldronSystem.self)\n\n    context.registerAction(SetWaterLevelAction.self)\n    SetWaterLevelAction.subscribe()\n\n    Task { @MainActor in\n        let config = RKS.Configuration(id: \"ChaparralVillage\")\n            .onInitialize { _ in\n            [\n                Module(\"ChaparralVillage\") {\n                    Cauldron.SchemaProvider.schema\n                }\n            ]\n        }\n        try! RKS.addConfiguration(config)\n    }\n}"]},"related":[{"id":"234","title":"Design immersive environments for visionOS apps and the spatial web","gloss":"為 visionOS App 與空間網頁設計沉浸式環境","gloss_en":"Design immersive environments for visionOS apps and the spatial web","category":"visionos","categoryLabel":"visionOS"},{"id":"279","title":"Explore advances in RealityKit","gloss":"探索 RealityKit 的最新進展","gloss_en":"Explore advances in RealityKit","category":"visionos","categoryLabel":"visionOS"},{"id":"280","title":"Iterate your spatial scenes faster with Reality Composer Pro 3","gloss":"用 Reality Composer Pro 3 更快迭代空間場景","gloss_en":"Iterate your spatial scenes faster with Reality Composer Pro 3","category":"visionos","categoryLabel":"visionOS"},{"id":"282","title":"Discover the Spatial Preview framework","gloss":"認識 Spatial Preview 框架","gloss_en":"Discover the Spatial Preview framework","category":"visionos","categoryLabel":"visionOS"},{"id":"283","title":"Explore enhancements to visionOS object tracking","gloss":"探索 visionOS 物件追蹤的強化功能","gloss_en":"Explore enhancements to visionOS object tracking","category":"visionos","categoryLabel":"visionOS"}]}</script>
