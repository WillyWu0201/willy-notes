<script id="d" type="application/json">{"s":{"id":"278","title":"Modernize your UIKit app","gloss":"現代化你的 UIKit App","category":"uikit","categoryLabel":"UIKit","duration":963,"url":"https://developer.apple.com/videos/play/wwdc2026/278/","takeaway":"iOS 27 起 iPhone App 在 iPhone Mirroring 與 iPad 上可自由縮放,要全面改用 size class、丟掉一票 legacy API,Xcode 27 還附了能自動改的 agent skill。","chapters":[[0,"Introduction"],[34,"App adaptivity"],[130,"Legacy API: App lifecycle"],[171,"Legacy API: Main screen"],[204,"Use local screen references"],[229,"Replace screen scale with displayScale"],[276,"Register for trait changes"],[319,"Monitor effective geometry changes"],[335,"Check available space using view bounds"],[346,"Full-screen mode for games"],[377,"Legacy API: User interface idiom"],[410,"Legacy API: Interface orientation"],[475,"UIView Body protocols for motion & location"],[492,"Configure motion and location body"],[499,"Test your resizable iPhone app"],[558,"Tab bars and sidebars"],[591,"Opt into sidebar layout"],[622,"Check sidebar availability"],[652,"Navigation bars"],[653,"Set prominent tab identifier"],[690,"Customize bar minimization behavior"],[757,"Menus"],[781,"Integrate with Apple Intelligence"],[847,"Agentic coding"],[905,"Export Xcode skills for use in other tools"],[932,"Next steps"]],"points":[{"text":"App 必須能即時適應任意 scene 尺寸;四個要稽核的點:**scene lifecycle、main screen 參照、UI idiom 判斷、interface orientation 判斷**。"},{"text":"**UIScene lifecycle 變成必要**——用最新 SDK 建置時,沒採用的 App 會無法啟動。"},{"text":"**UIScreen.main 不可靠**:改用 windowScene 的 screen、trait collection 的 displayScale、windowScene.effectiveGeometry 取可用空間,並用 registerForTraitChanges 監聽。"},{"text":"UI idiom 與 interface orientation 對 layout 都不再有意義 → **一律改用 size class**(iPhone App 跑在 iPad 仍是 phone idiom 但可縮放;orientation 只是偏好會被忽略)。"},{"text":"導覽列捲動時會自動收合,用 **barMinimizationBehavior** 控制;分頁列新增 sidebar.preferredPlacement 與 prominentTabIdentifier。**.automatic 的 scroll edge effect 視覺有變,之前覆寫成 .soft 的要重新評估**。","hot":true},{"text":"Xcode 27 內建 app modernization skill 可自動轉 mainScreen、orientation→size class、遷移 scene lifecycle;xcrun agent skills export 可匯出給其他工具(如 Claude Code)用。"}],"apis":["UIScene","effectiveGeometry","displayScale","registerForTraitChanges","UITraitSizeClass","sidebar.preferredPlacement","prominentTabIdentifier","barMinimizationBehavior","scrollEdgeEffectStyle","xcrun agent skills export"],"audience":"**還在用 UIKit、且有 legacy lifecycle / orientation 假設的成熟專案(像 CUB App)。** 第 10:52「Navigation bars」段落直接對應 iOS 26 導覽列透明問題——很可能就是 scroll edge effect 改版造成的。","gloss_en":"Modernize your UIKit app","takeaway_en":"Starting in iOS 27, iPhone apps can be freely resized with iPhone Mirroring and on iPad, so you must move fully to size classes, drop a pile of legacy APIs—and Xcode 27 ships an agent skill that can do the migration for you.","points_en":[{"text":"Your app must adapt to any scene size on the fly; the four things to audit: **scene lifecycle, main screen references, UI idiom checks, and interface orientation checks**.","hot":false},{"text":"**The UIScene lifecycle is now required**—when building with the latest SDK, apps that haven't adopted it will fail to launch.","hot":false},{"text":"**UIScreen.main is unreliable**: instead use the windowScene's screen, the trait collection's displayScale, and windowScene.effectiveGeometry for available space, and observe changes with registerForTraitChanges.","hot":false},{"text":"UI idiom and interface orientation no longer mean anything for layout → **always use size classes** (an iPhone app running on iPad is still the phone idiom but resizable; orientation is just a preference that gets ignored).","hot":false},{"text":"Navigation bars now collapse automatically on scroll, controlled with **barMinimizationBehavior**; tab bars add sidebar.preferredPlacement and prominentTabIdentifier. **The .automatic scroll edge effect looks different now, so reassess anything you previously overrode to .soft.**","hot":true},{"text":"Xcode 27's built-in app modernization skill can automatically convert mainScreen, migrate orientation→size class, and migrate the scene lifecycle; xcrun agent skills export can export it for use with other tools (like Claude Code).","hot":false}],"audience_en":"**Mature projects (like the CUB App) still on UIKit with legacy lifecycle / orientation assumptions.** The 10:52 \"Navigation bars\" segment maps directly to the iOS 26 transparent navigation bar issue—very likely caused by the scroll edge effect changes.","summary":["這場由 UI Frameworks 團隊的 Michael Ochs 主講，核心訊息是：在 iOS 與 macOS 27，iPhone app 變成**完全可調整大小**——無論是在 Mac 上透過 **iPhone Mirroring** 拉動視窗邊緣，或是 iPhone-only app 跑在 iPad 上，都會像原生 app 一樣自由縮放。因此 app 必須在執行期動態適應任何 scene 尺寸，而不能再依賴固定的螢幕假設。","適應性改造的基礎是從 app lifecycle 遷移到 **scene lifecycle**：用最新 SDK 建置時 **UIScene** 已是必要條件，沒有 **UISceneDelegate** app 將無法啟動。接著要清掉所有對 **main screen** 的引用，改從 window 的 windowScene 動態取得 screen；更好的做法是直接移除 screen 引用，例如以 trait collection 的 **displayScale** 取代 screen scale（搭配 **automatic trait tracking** 或 **registerForTraitChanges**），以 windowScene 的 **effectiveGeometry** 或 view bounds 取代 screen bounds。最關鍵的觀念轉變是：**user interface idiom** 與 **interface orientation** 都不再適合用於任何 layout 決策，應一律改用 **size classes**。遊戲則可用 UIRequiresFullscreen 取得 honor 後的離散式 resizing，每次尺寸變動都切到對應的螢幕配置以維持全畫質。","UI 控制項也有更新。iPhone 的 tab bar 在 iOS 27 可透過 `sidebar.preferredPlacement = .sidebar` 選擇加入 **sidebar**（由系統依空間決定是否顯示，並用 `sidebar.isAvailable` 查詢可用性）；可用 **prominentTabIdentifier** 指定捲動時仍恆常可見的突出 tab；navigation bar 可用 **barMinimizationBehavior** 強制隱藏行為，scroll edge effect 的 `.automatic` 樣式也已更新，先前覆寫過 `.soft` 的設計應重新評估。在 Liquid Glass 下，menu element 的 image 可能預設不顯示，需要時用 **preferredImageVisibility** 覆寫。","在 Apple Intelligence 方面，menu 會自動出現 **Ask Siri** 入口，並可用 **View Annotations API** 將 view 標註為 **AppEntity** 以提供更相關的脈絡；支援 drag and drop 的 app，Siri 會透過 drag delegate 載入內容，因此狀態相關 UI 應移到 sessionDidMove 而非 sessionWillBegin。最後，Xcode 27 新增了 **app modernization skill**，能自動把 main screen 呼叫改成 trait／scene bounds、把 orientation 檢查改成 size class、甚至轉換成 scene lifecycle，並可用 `xcrun agent skills export` 匯出成 markdown 供其他工具使用。實務上的行動：以 iOS 27 SDK 建置，用 Device Hub 的 resizable simulator 測試，並在 macOS 27 的 iPhone Mirroring 上實測。"],"deepdive":[{"t":0,"title":"Introduction","body":"由 UI Frameworks 團隊的 engineering manager **Michael Ochs** 開場，預告本場涵蓋四大主題：**app adaptivity** 需求的重大改變與 iPhone app 完全可調整大小、tab bar／navigation bar／menu 的新 API、如何支援 **Apple Intelligence**，以及一個能自動處理大部分現代化工作的新 agentic skill。"},{"t":34,"title":"App adaptivity","body":"說明 app 早已身處多種環境——不同螢幕尺寸、並排執行、外接顯示器。iOS 與 macOS 27 進一步強化：**iPhone Mirroring** 讓使用者可自由縮放 iPhone 視窗，iPhone-only app 跑在 iPad 上也完全可調整大小，因此 app 必須在執行期動態適應任何 scene 尺寸。"},{"t":130,"title":"Legacy API: App lifecycle","body":"適應性的基礎是從 app lifecycle 遷移到 **scene lifecycle**。用最新 SDK 建置時 **UIScene** 已成必要條件，缺少 **UISceneDelegate** app 將無法啟動。講者指引尚未遷移者參考 WWDC25 的「Make your UIKit app more flexible」與相關文件。"},{"t":171,"title":"Legacy API: Main screen","body":"當 iPhone app 在 Mac 上被 mirror、或在 iPad 上移到外接顯示器時，scene 關聯的 screen 會改變，任何對 **main screen** 的引用都會給出錯誤資訊。應改從 window 的 windowScene 動態取得 screen，並在無法就近取得時把 screen reference 當參數傳入需要的 method。"},{"t":204,"title":"Use local screen references","body":"示範以 `window?.windowScene?.screen` 動態取得正確的 screen，取代寫死的 main screen。對於 thumbnail 產生這類 method，則把 **UIScreen** 當參數傳入，確保在當前執行環境拿到對的螢幕資訊。"},{"t":229,"title":"Replace screen scale with displayScale","body":"更好的做法是完全移除 screen 引用。存取螢幕 scale 應改用 trait collection 的 **displayScale**：view 與 view controller 會自動更新 trait collection 並提供合理 fallback。系統還會追蹤 **layoutSubviews**、**drawRect** 等常見覆寫點中用到的 trait，變動時自動重新呼叫，UI 即自動更新。"},{"t":276,"title":"Register for trait changes","body":"在 automatic trait tracking 不適用之處，可用 **registerForTraitChanges** 觀察特定 trait 變化。範例對 **UITraitDisplayScale** 註冊一個 closure，於變化時 invalidate cache 或更新與該 view 相關的資料。"},{"t":319,"title":"Monitor effective geometry changes","body":"檢查可用空間不應再用 screen bounds，因為在適應性環境中 scene 的可用空間未必是整個螢幕。改用 windowScene 的 **effectiveGeometry**，並在 scene delegate 實作 `windowScene:didUpdateEffectiveGeometry:` 來監看變化。"},{"t":335,"title":"Check available space using view bounds","body":"在 view 與 view controller 內部，應以 view 或 superview 的可用尺寸（如 `view.bounds.size`）判斷空間，而非引用 scene bounds。這讓 UI 較不依賴呈現方式，放進 **split view controller** 等其他脈絡時能更好地調整。"},{"t":346,"title":"Full-screen mode for games","body":"對遊戲而言縮放較具挑戰，因此 iOS 27 起在可調整大小環境仍 honor **UIRequiresFullscreen**，但行為更新為不再完全退出 resizing，而是啟用尊重所支援 interface orientation 的**離散式 resizing**：每次尺寸變動系統就切到對應的螢幕配置，讓遊戲始終以全畫質渲染於可用空間。"},{"t":377,"title":"Legacy API: User interface idiom","body":"**user interface idiom** trait 對任何 layout 決策都已不再有意義。iPhone app 跑在 iPad 或 iPhone Mirroring 上雖完全可調整大小，卻仍以 phone idiom 執行。應停止以 idiom 做 layout 判斷，改用 **size classes**（必要時用周圍 view 的尺寸做更細的控制）。"},{"t":410,"title":"Legacy API: Interface orientation","body":"**interface orientation** 同樣不再適合用於 layout。iOS 27 中所支援的方向只是給系統的偏好，在可調整大小環境會被忽略；iPhone Mirroring 上 app 永遠以 portrait 執行。所有 orientation 檢查都應改用 size classes。講者引用 2014 年 Bruce Nilo 的名言「裝置旋轉只是一次帶動畫的 bounds 變化」呼應此觀念。"},{"t":475,"title":"UIView Body protocols for motion & location","body":"iOS 27 中 **UIView** 也遵循 CoreMotion 與 CoreLocation 的新 **Body protocol**，讓設定 motion 與 location manager 更容易。把它們連接到視覺化資料的 view（如指南針或地圖），可確保資料始終位於正確的座標空間，不受 interface orientation 影響。"},{"t":492,"title":"Configure motion and location body","body":"示範在 **viewDidLoad** 中把 `motionManager.deviceMotionBody` 與 `locationManager.headingBody` 設為 view。如此一來方向資料自動對齊該 view 的座標空間，無需手動處理旋轉換算。"},{"t":499,"title":"Test your resizable iPhone app","body":"Xcode 27 讓你不必在多個模擬器或裝置上安裝，就能跨不同尺寸迭代。在新的 **Device Hub** app 與 Xcode Previews 中點「enter resize mode」即可拖動邊緣自由縮放；滿意後務必以實機測試 iPhone Mirroring 與 iPad。"},{"t":558,"title":"Tab bars and sidebars","body":"在 iPad 上 tab bar 可在環境支援時展開為完整 **sidebar** 以呈現更多層級。iPhone 預設在所有尺寸顯示底部 tab bar，iOS 27 起也可選擇加入 sidebar。"},{"t":591,"title":"Opt into sidebar layout","body":"iPhone app 透過設定 tab bar controller 的 `sidebar.preferredPlacement = .sidebar` 選擇加入 sidebar。與 iPad 不同，這是 app 的選擇且 UI 上無法切換；系統會依空間（例如 horizontal size class 為 regular 時）決定是否顯示 sidebar。"},{"t":622,"title":"Check sidebar availability","body":"用 sidebar 的 **isAvailable** 屬性判斷 sidebar 表現形式目前是否可顯示。若不可用，應把原本要藏在 sidebar 的 UI 改以巢狀 tab 在 app 其他地方呈現。"},{"t":652,"title":"Navigation bars","body":"切換到 navigation bar 主題。navigation bar 可在捲動時互動式滑出，為內容騰出更多空間，預設在系統定義的條件下 minimize。"},{"t":653,"title":"Set prominent tab identifier","body":"**UITabBarController** 可自訂突出的 tab，該 tab 即使在捲動使 tab bar 收合時仍恆常可見。iOS 27 透過設定 **prominentTabIdentifier**（範例設為 \"cart\"）讓任一 tab 變得突出。"},{"t":690,"title":"Customize bar minimization behavior","body":"可在 navigation item 上以 **barMinimizationBehavior** 設為 `.always` 或 `.never` 強制 bar 的最小化行為。若自行處理 safe area 避讓，將 **barMinimizationSafeAreaAdjustment** 設為 `.never` 以免最小化自動更新 inset。此外 scroll edge effect 的 `.automatic` 樣式已更新，先前覆寫過（尤其是 `.soft`）的設計應重新評估。"},{"t":757,"title":"Menus","body":"在 **Liquid Glass** 的精緻外觀下，設定於 menu element 的 image 在某些脈絡（如 iPadOS 與 macOS 的 menu bar）可能預設不顯示。若仍需顯示，設定 **preferredImageVisibility** 覆寫系統行為，並參考更新後的 HIG 決定何時該顯示。"},{"t":781,"title":"Integrate with Apple Intelligence","body":"iOS 27 的 menu 內建 **Ask Siri** 按鈕，於有相關內容時自動顯示，讓人直接從 app 開啟 Siri 對話。可用新的 **View Annotations API** 把特定 view 標註為 **AppEntity** 以提供更相關資訊；支援 drag and drop 時 Siri 會透過 drag delegate 載入內容，因此有狀態的 UI 應放在 **sessionDidMove** 而非 sessionWillBegin，因為 drag session 可能在無使用者手勢下啟動。"},{"t":847,"title":"Agentic coding","body":"Xcode 27 新增 **app modernization skill**，對前述 adaptivity 任務有深入理解，能依專案脈絡自動完成大量改動：把 main screen 呼叫轉成 traitCollection 或 scene bounds 檢查並加上 invalidation 邏輯、把 orientation 檢查改成 size class、甚至轉換成 scene lifecycle；複雜任務會提出澄清問題，過大的工作則加註解協助追蹤剩餘進度。"},{"t":905,"title":"Export Xcode skills for use in other tools","body":"可用 `xcrun agent skills export` 把 Xcode 使用的 skill 匯出為 markdown 檔，再匯入到自己的工作流程中於其他工具使用。這類 skill 是為可調整大小環境準備 app 的有力方式。"},{"t":932,"title":"Next steps","body":"總結行動建議：以 iOS 27 SDK 建置 app、在新的 **Device Hub** app 試用 resizable simulator、並在 macOS 27 的 iPhone Mirroring 上實測，找出需要更有彈性的區域；若喜歡 agentic coding，也試試新 skill 看它能自動完成多少工作。"}],"summary_en":["Presented by Michael Ochs of the UI Frameworks team, the core message is that in iOS and macOS 27 iPhone apps become **fully resizable**—whether resized on a Mac via **iPhone Mirroring** by dragging the window edges, or an iPhone-only app running on iPad. Apps must therefore adapt dynamically to any scene size at runtime rather than relying on fixed screen assumptions.","The foundation of adaptivity is migrating from app lifecycle to **scene lifecycle**: building with the latest SDK now requires **UIScene**, and without a **UISceneDelegate** the app will no longer launch. Next, remove all references to the **main screen**—fetch the screen dynamically from the window's windowScene, or better yet remove screen references entirely: replace screen scale with the trait collection's **displayScale** (using **automatic trait tracking** or **registerForTraitChanges**), and replace screen bounds with windowScene's **effectiveGeometry** or view bounds. The key conceptual shift is that the **user interface idiom** and **interface orientation** are no longer meaningful for any layout decision—use **size classes** instead. Games can rely on the now-honored UIRequiresFullscreen for discrete resizing that keeps full render quality at every size.","UI controls also get updates. On iPhone in iOS 27, the tab bar can opt into a **sidebar** via `sidebar.preferredPlacement = .sidebar` (the system decides whether to show it based on space, queryable with `sidebar.isAvailable`); a scroll-persistent **prominentTabIdentifier** can be set; navigation bars expose **barMinimizationBehavior** to force minimization, and the scroll edge effect's `.automatic` style has changed, so prior `.soft` overrides should be re-evaluated. Under Liquid Glass, menu element images may be hidden by default—override with **preferredImageVisibility** when needed.","For Apple Intelligence, menus automatically surface an **Ask Siri** entry point, and the new **View Annotations API** lets you annotate views as **AppEntity** for richer context; for drag-and-drop apps Siri loads content via drag delegate methods, so stateful UI belongs in sessionDidMove rather than sessionWillBegin. Finally, Xcode 27 adds an **app modernization skill** that automatically converts main-screen calls to trait/scene-bounds checks, orientation checks to size classes, and even converts the app to scene lifecycle; it can be exported as markdown with `xcrun agent skills export` for use in other tools. Practical next steps: build with the iOS 27 SDK, test with Device Hub's resizable simulator, and verify in iPhone Mirroring on macOS 27."],"deepdive_en":[{"t":0,"title":"Introduction","body":"UI Frameworks engineering manager **Michael Ochs** opens, previewing four topics: major changes to **app adaptivity** requirements and fully resizable iPhone apps, new APIs in tab bars/navigation bars/menus, how to support **Apple Intelligence**, and a new agentic skill that automates most of the modernization work."},{"t":34,"title":"App adaptivity","body":"Apps already run in many environments—varied screen sizes, side by side, and external displays. iOS and macOS 27 push further: **iPhone Mirroring** lets users freely resize the iPhone window, and an iPhone-only app on iPad is fully resizable, so apps must adjust dynamically to any scene size at runtime."},{"t":130,"title":"Legacy API: App lifecycle","body":"The basis of adaptivity is moving from app lifecycle to **scene lifecycle**. Building with the latest SDK now requires **UIScene**, and without a **UISceneDelegate** the app won't launch. Developers who haven't migrated are pointed to WWDC25's \"Make your UIKit app more flexible\" and the docs."},{"t":171,"title":"Legacy API: Main screen","body":"When an iPhone app is mirrored on a Mac or moved to an external display on iPad, the scene's associated screen changes, so any reference to the **main screen** gives incorrect information. Fetch the screen dynamically from the window's windowScene, and pass a screen reference into methods when the context isn't immediately available."},{"t":204,"title":"Use local screen references","body":"Demonstrates fetching the correct screen via `window?.windowScene?.screen` instead of hardcoding the main screen. For methods like thumbnail generation, pass a **UIScreen** as a parameter so the correct screen info is used for the current environment."},{"t":229,"title":"Replace screen scale with displayScale","body":"Better still, remove screen references entirely. Replace screen scale with the trait collection's **displayScale**: views and view controllers update their trait collections automatically with reasonable fallbacks. The system also tracks traits used inside common override points like **layoutSubviews** and **drawRect**, re-invoking them on change so the UI updates automatically."},{"t":276,"title":"Register for trait changes","body":"Where automatic trait tracking isn't available, use **registerForTraitChanges** to observe specific trait changes. The example registers a closure on **UITraitDisplayScale** to invalidate a cache or update view-related data when it changes."},{"t":319,"title":"Monitor effective geometry changes","body":"Don't use screen bounds to check available space, since in an adaptive environment the scene's space isn't always the full screen. Use windowScene's **effectiveGeometry**, and implement `windowScene:didUpdateEffectiveGeometry:` in the scene delegate to monitor changes."},{"t":335,"title":"Check available space using view bounds","body":"Inside views and view controllers, determine space from the view's or superview's available size (e.g. `view.bounds.size`) rather than referencing scene bounds. This makes the UI less dependent on presentation and adjusts better in other contexts like a **split view controller**."},{"t":346,"title":"Full-screen mode for games","body":"Because resizing is challenging for games, iOS 27 honors **UIRequiresFullscreen** in resizable environments but with updated behavior: instead of fully opting out of resizing, it enables **discrete resizing** that respects supported interface orientations—each size change transitions the scene to a matching screen configuration so the game always renders at full quality."},{"t":377,"title":"Legacy API: User interface idiom","body":"The **user interface idiom** trait is no longer meaningful for any layout decision. An iPhone app on iPad or in iPhone Mirroring is fully resizable yet still runs under the phone idiom. Stop checking the idiom for layout—use **size classes** instead (and the surrounding view's size for finer control)."},{"t":410,"title":"Legacy API: Interface orientation","body":"**Interface orientation** is likewise no longer useful for layout. In iOS 27 supported orientation is just a preference and is ignored in resizable environments; in iPhone Mirroring the app always runs in portrait. All orientation checks should switch to size classes, echoing Bruce Nilo's 2014 line that \"a device rotation is only an animated bounds change.\""},{"t":475,"title":"UIView Body protocols for motion & location","body":"In iOS 27 **UIView** conforms to the new **Body protocols** from CoreMotion and CoreLocation, making it easier to configure motion and location managers. Connecting them to the view that visualizes the data (a compass or map) keeps the data in the correct coordinate space regardless of interface orientation."},{"t":492,"title":"Configure motion and location body","body":"Shows setting `motionManager.deviceMotionBody` and `locationManager.headingBody` to the view in **viewDidLoad**. Orientation data then automatically aligns to that view's coordinate space without manual rotation handling."},{"t":499,"title":"Test your resizable iPhone app","body":"Xcode 27 lets you iterate across sizes without installing on multiple simulators or devices. In the new **Device Hub** app and Xcode Previews, click \"enter resize mode\" to drag the edges and resize freely; once satisfied, test iPhone Mirroring and iPad on real devices."},{"t":558,"title":"Tab bars and sidebars","body":"On iPad a tab bar can expand into a full **sidebar** when the environment supports it, surfacing more of the app hierarchy. iPhone shows the bottom tab bar across all sizes by default, and new in iOS 27 can also opt into sidebars."},{"t":591,"title":"Opt into sidebar layout","body":"An iPhone app opts in by setting the tab bar controller's `sidebar.preferredPlacement = .sidebar`. Unlike iPad this is an app choice with no UI toggle; the system decides whether to show the sidebar based on space, such as when the horizontal size class is regular."},{"t":622,"title":"Check sidebar availability","body":"Use the sidebar's **isAvailable** property to determine whether the sidebar representation can currently be shown. If unavailable, surface the UI intended for the sidebar behind nested tabs elsewhere in the app."},{"t":652,"title":"Navigation bars","body":"Switches to navigation bars, which can interactively slide away as people scroll to give content more room, minimizing by default under system-defined conditions."},{"t":653,"title":"Set prominent tab identifier","body":"**UITabBarController** lets you customize the prominent tab, which stays visible even when the tab bar collapses during scrolling. In iOS 27, set **prominentTabIdentifier** (example: \"cart\") to make any tab prominent."},{"t":690,"title":"Customize bar minimization behavior","body":"Force the navigation item's minimization with **barMinimizationBehavior** set to `.always` or `.never`. If you handle safe-area avoidance yourself, set **barMinimizationSafeAreaAdjustment** to `.never` so minimization doesn't auto-update insets. The scroll edge effect's `.automatic` style has also changed, so prior `.soft` overrides should be re-evaluated."},{"t":757,"title":"Menus","body":"Under the refined look of **Liquid Glass**, images set on menu elements may not be shown by default in some contexts like the menu bars on iPadOS and macOS. If you still need them visible, set **preferredImageVisibility** to override the system behavior, consulting the updated HIG for when to show them."},{"t":781,"title":"Integrate with Apple Intelligence","body":"iOS 27 menus feature an **Ask Siri** button that appears automatically when relevant content exists, letting people start a Siri conversation from the app. Use the new **View Annotations API** to annotate views with **AppEntity** for more relevant info; for drag-and-drop, Siri loads content via drag delegate methods, so stateful UI belongs in **sessionDidMove** rather than sessionWillBegin since drag sessions can begin without a user gesture."},{"t":847,"title":"Agentic coding","body":"Xcode 27 adds an **app modernization skill** with deep understanding of the adaptivity tasks above, able to make many changes automatically from project context: converting main-screen calls to traitCollection or scene-bounds checks with invalidation logic, replacing orientation checks with size classes, and even converting to scene lifecycle. It asks clarifying questions for complex tasks and leaves comments to track remaining work for tasks too large for one session."},{"t":905,"title":"Export Xcode skills for use in other tools","body":"Run `xcrun agent skills export` to export the skills Xcode uses as markdown files you can import into your own workflows in other tools. Skills like this are a powerful way to prepare an app for resizable environments."},{"t":932,"title":"Next steps","body":"Closing recommendations: build with the iOS 27 SDK, try the resizable simulator in the new **Device Hub** app, and test in iPhone Mirroring on macOS 27 to find areas needing more flexibility; and if you like agentic coding, try the new skill to see how much it can do automatically."}],"code":["// Use local screen references\n// Access the correct screen through a windowScene\nlet screen = window?.windowScene?.screen\n\n// Pass in local screen references\nfunc generateThumbnail(_ image: UIImage, screen: UIScreen) -> UIImage {\n    // existing code, replacing main screen with local screen reference\n    // ...\n}","// Replace the screen's scale with trait collection's displayScale\noverride func layoutSubviews() {\n    super.layoutSubviews()\n\n    // layoutSubviews will be called again automatically when displayScale changes\n    let displayScale = traitCollection.displayScale\n    // ...\n}","// Manually register for trait changes\nlet displayScaleTrait: [UITrait] = [UITraitDisplayScale.self]\nregisterForTraitChanges(displayScaleTrait) {\n    (view: GalleryView, previousTraitCollection: UITraitCollection) in\n    view.cache.invalidate()\n}","// UIWindowSceneDelegate\nfunc windowScene(\n    _ windowScene: UIWindowScene,\n    didUpdateEffectiveGeometry previousEffectiveGeometry: UIWindowScene.Geometry\n) {\n    let geometry = windowScene.effectiveGeometry\n    let availableSpace = geometry.coordinateSpace.bounds\n    // ...\n}","// Checking available space\noverride func viewDidLayoutSubviews() {\n    super.viewDidLayoutSubviews()\n\n    let availableSpace = view.bounds.size\n    // ...\n}","// Configure motion and heading bodies\noverride func viewDidLoad() {\n    super.viewDidLoad()\n\n    motionManager.deviceMotionBody = view\n    locationManager.headingBody = view\n}","tabBarController.sidebar.preferredPlacement = .sidebar","tabBarController.sidebar.isAvailable","// Set the prominent tab\nlet tabs = [\n    // ...\n]\nlet tabBarController = UITabBarController(tabs: tabs)\ntabBarController.prominentTabIdentifier = \"cart\"","// Customize bar minimization behavior\noverride init(\n    nibName nibNameOrNil: String?,\n    bundle nibBundleOrNil: Bundle?\n) {\n    super.init(nibName: nibNameOrNil, bundle: nibBundleOrNil)\n\n    navigationItem.barMinimizationBehavior = .always\n    navigationItem.barMinimizationSafeAreaAdjustment = .never\n}","xcrun agent skills export"]},"related":[{"id":"221","title":"Prepare your tvOS apps for Dynamic Type","gloss":"讓你的 tvOS App 支援動態字型","gloss_en":"Prepare your tvOS app for Dynamic Type","category":"uikit","categoryLabel":"UIKit"},{"id":"203","title":"Read between the strokes with PencilKit","gloss":"用 PencilKit 解讀筆跡內容","gloss_en":"Read handwriting content with PencilKit","category":"uikit","categoryLabel":"UIKit"},{"id":"212","title":"Rev up your CarPlay app","gloss":"強化你的 CarPlay App","gloss_en":"Rev up your CarPlay app","category":"uikit","categoryLabel":"UIKit"},{"id":"219","title":"Enhance the accessibility of your reading app","gloss":"強化你閱讀類 App 的無障礙體驗","gloss_en":"Enhance the accessibility of your reading app","category":"uikit","categoryLabel":"UIKit"},{"id":"226","title":"Create live communication experiences","gloss":"打造即時通訊體驗","gloss_en":"Build live communication experiences","category":"uikit","categoryLabel":"UIKit"}]}</script>
