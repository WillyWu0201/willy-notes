<script id="d" type="application/json">{"s":{"id":"303","title":"Build a responsive camera app that launches quickly","gloss":"打造啟動快速且反應靈敏的相機 App","category":"other","categoryLabel":"其他","duration":1520,"url":"https://developer.apple.com/videos/play/wwdc2026/303/","takeaway":"用 AVFoundation 的延遲啟動、反應式擷取與確定性檔案寫入，打造瞬間啟動、不錯失畫面的相機 App。","chapters":[[0,"Introduction"],[122,"Fast Launch"],[412,"Adopt deferred start"],[554,"Automatic deferred start delegate"],[586,"Adopt automatic deferred start"],[690,"Adopt manual deferred start"],[713,"Manage runDeferredStartWhenNeeded"],[847,"Enable responsive capture"],[906,"Steady preview"],[1084,"Sustained performance"],[1216,"Monitor for system pressure"],[1274,"Deterministic file writing"],[1337,"Manage pro video storage"],[1363,"Adopt AVProVideoStorage for deterministic file write speeds"]],"points":[{"text":"用**延遲啟動（deferred start）**讓相機**瞬間啟動**：先顯示預覽，再延後啟動非必要的輸出，避免錯失關鍵畫面。","hot":true},{"text":"可採**自動**或**手動**延遲啟動，透過 **automaticallyRunsDeferredStart**、isDeferredStartEnabled 與 **runDeferredStartWhenNeeded** 控制時機。","hot":false},{"text":"啟用**反應式擷取（responsive capture）**與穩定預覽，讓 **AVCapturePhotoOutput** 能立即拍照。","hot":false},{"text":"監控 **hardwareCost** 與 **systemPressureState** 維持持續效能，必要時改用低成本設定。","hot":false},{"text":"用 **AVProVideoStorage** 達成確定性的檔案寫入速度，妥善管理專業影片儲存空間。","hot":false}],"apis":["AVFoundation","AVCaptureSession","AVCapturePhotoOutput","AVProVideoStorage","automaticallyRunsDeferredStart","runDeferredStartWhenNeeded"],"audience":"**開發相機或影音擷取 App**、在意啟動速度、拍攝反應與錄影效能的開發者。","gloss_en":"Build a responsive camera app that launches quickly","takeaway_en":"Use AVFoundation's deferred start, responsive capture, and deterministic file writing to build a camera app that launches instantly and never misses the shot.","points_en":[{"text":"Use **deferred start** to launch the camera **instantly**: show the preview first, then defer starting non-essential outputs to avoid missing the key moment.","hot":true},{"text":"Use **automatic** or **manual** deferred start, controlling the timing via **automaticallyRunsDeferredStart**, isDeferredStartEnabled, and **runDeferredStartWhenNeeded**.","hot":false},{"text":"Enable **responsive capture** and a stable preview so **AVCapturePhotoOutput** can take photos immediately.","hot":false},{"text":"Monitor **hardwareCost** and **systemPressureState** to maintain sustained performance, switching to lower-cost settings when necessary.","hot":false},{"text":"Use **AVProVideoStorage** to achieve deterministic file-write speeds and properly manage professional video storage.","hot":false}],"audience_en":"Developers **building camera or audio/video capture apps** who care about launch speed, capture responsiveness, and recording performance.","summary":["這場由相機效能團隊主講，核心訊息：相機 app 的「快」最關鍵的指標，是**第一張 preview 畫面多快出現在螢幕上**——慢一點點，使用者就會錯過瞬間（講者以掉落的骨牌示範）。整場聚焦四大主題：加速啟動、流暢渲染 preview、在嚴苛環境下維持效能，以及高位元率錄影的確定性寫檔。啟動序列分四階段：app 啟動、設定並啟動 session、初始化 AV capture output、preview 開始串流。","啟動最佳化的關鍵思維是把工作分成「**preview 顯示前必需**」與「**preview 跑起來後再做**」兩階段。UI 上只先建立 camera preview 與 shutter button，其餘（image well、mode picker 等）等啟動完成後淡入。`AVCaptureSession` 因為協調所有物件要最先建立，但它的建立、`startRunning`、`stopRunning` 都會**阻塞主執行緒**，必須 dispatch 到背景並只 commit 一次設定。最耗時的是**初始化 outputs**——只有 preview layer 或單一 output 是 preview 必需的；因此 iOS 26 新增 **Deferred Start API**：在不需於啟動時用到的 output 上設 `isDeferredStartEnabled = true`，把它們延後到 preview 出現後再初始化。實測啟動時間可**減半（2 倍快）**。","Deferred Start 有自動與手動兩種模式。**自動模式**（以 iOS 26+ SDK 重編譯後預設啟用，`automaticallyRunsDeferredStart = true`）由系統在 preview 出現後挑最佳時機初始化，並透過 `sessionWillRunDeferredStart` 與 `sessionDidRunDeferredStart` 兩個 delegate callback 通知；**手動模式**（設為 false）由 app 自行在準備好時呼叫 `runDeferredStartWhenNeeded`，適合需先讀偏好設定、或用 `AVCaptureVideoDataOutput` 自行渲染 preview 的情況（此時要追蹤第一張 frame 是否已呈現）。但延後 photo output 有個代價：preview 變快但首拍時間不變，因此要在 `AVCapturePhotoOutput` 設 **`isResponsiveCaptureEnabled = true`**，在開始拍攝與處理間加入緩衝，讓使用者即使 output 尚未就緒也能捕捉到瞬間。","渲染 preview 兩種選擇：`AVCaptureVideoPreviewLayer`（最簡單、低延遲、自動處理 HDR tone mapping，但無逐幀存取；用 iOS 26+ 重編譯自動納入 deferred start）與 `AVCaptureVideoDataOutput`（可逐幀處理、套 UI overlay、整合 Metal，但需手動採用 deferred start）。維持效能方面，用 **hardware cost** 與 **system pressure cost** 兩個 0–1 的 API 評估設定是否可持續（超過 1 即不支援），並觀察 `AVCaptureDevice` 的 **systemPressureState** 在壓力升高時降 frame rate、節流 GPU/ANE、減少 UI 工作；可用 frameRateOverride 與 binned format 降低成本。最後是 iOS 27 新增的 **`AVProVideoStorage`**——一個系統共用、預先配置的儲存資源，搭配既有錄影 API（在 `AVCaptureMovieFileOutput` 或 asset writer 設 `usesProVideoStorage`）為 ProRes 等高位元率編碼提供**確定性的寫檔速度**，避免掉幀。"],"deepdive":[{"t":0,"title":"Introduction","body":"相機效能團隊工程師 Jake 開場，點出啟動慢使用者一定有感，而讓相機「感覺快」的單一最重要因素是 **preview 畫面多快出現**。以中間放紅色骨牌的掉落示範說明：preview 太慢就會錯過瞬間。預告四大主題：加速啟動、渲染 preview 的最佳實務、維持效能的 API，以及高位元率錄影的確定性寫檔。"},{"t":122,"title":"Fast Launch","body":"拆解啟動四階段：**app 啟動**（linker 載入、static initializer、建立 UI scene）、**設定並啟動 session**、**初始化 AV capture outputs**、**preview 開始串流**。建議把 UI 工作分兩階段：preview 必需的（camera preview、shutter button）先做，image well 與 mode picker 等啟動後再淡入；任何在 preview 渲染前建立的資源都會拖慢啟動。"},{"t":412,"title":"Adopt deferred start","body":"初始化 outputs 是啟動最耗時的部分，但 preview 只需 preview layer 或單一 output。iOS 26+ 的 **Deferred Start API** 讓 app 把非啟動必需的 output 延後到 preview 出現後初始化——在每個 output（與 preview layer）上設 `isDeferredStartEnabled`，除渲染 preview 的 output 外全部延後。"},{"t":554,"title":"Automatic deferred start delegate","body":"說明自動模式：以 iOS 26+ SDK 重編譯的 app 預設用自動模式（`automaticallyRunsDeferredStart` 為 true），系統在 preview 出現後不久挑最佳時機初始化延後的 output，並發出兩個 delegate callback：`sessionWillRunDeferredStart`（初始化前，適合建立背景資源）與 `sessionDidRunDeferredStart`（完成後，所有 output 就緒）。"},{"t":586,"title":"Adopt automatic deferred start","body":"示範採用：先建立處理 delegate callback 的類別，在設定時於 `AVCaptureSession` 設 `automaticallyRunsDeferredStart = true`（iOS 26+ 重編譯已自動設好），對所有非啟動必需的 output（如 photo output）啟用 deferred start、用 preview layer 渲染 preview，掛上 delegate 後 commit 設定並 `startRunning`。"},{"t":690,"title":"Adopt manual deferred start","body":"介紹手動模式，適合想先讀偏好設定或先設定 UI 再做重初始化的 app，或用 `AVCaptureVideoDataOutput` 自行渲染 preview 的情況。把 `automaticallyRunsDeferredStart` 設為 false，並在渲染 preview 的 output 上停用 deferred start，由 app 在啟動工作完成後自行呼叫 `runDeferredStartWhenNeeded`。"},{"t":713,"title":"Manage runDeferredStartWhenNeeded","body":"示範手動模式的時機掌控：用 `AVCaptureVideoDataOutput` 自行渲染時，追蹤第一張 frame 是否已呈現（範例用 CAMetalLayer）。一旦第一張 frame 呈現，就設定非關鍵 UI 並呼叫 session 的 `runDeferredStartWhenNeeded` 啟動延後的 output；之後便無需特別處理。"},{"t":847,"title":"Enable responsive capture","body":"點出延後 photo output 的代價：preview 變快但首拍時間不變，因為系統得先初始化完 photo output 才能拍。解法是在 `AVCapturePhotoOutput` 設 **`isResponsiveCaptureEnabled = true`**，在開始拍攝與處理間加入緩衝，讓使用者即使 output 尚未完全就緒也能捕捉到瞬間（綠機因此拍到骨牌、紫機則錯過）。"},{"t":906,"title":"Steady preview","body":"preview 跑起來後維持穩定 framerate 與節奏很重要，否則相機會卡。最簡單的渲染方式是 **`AVCaptureVideoPreviewLayer`**：為渲染 preview 最佳化、自動處理 HDR tone mapping、低 CPU/GPU 負擔、低延遲，但代價是無逐幀存取。需要更多控制（逐幀處理、自訂 overlay、整合 Metal 與分析 frame 資料）則改用 **`AVCaptureVideoDataOutput`**，但需自行採用手動 deferred start 才能拿到同樣的啟動加速。渲染時每幀工作要短以避免掉幀。"},{"t":1084,"title":"Sustained performance","body":"隨著加入更多相機或輸入裝置，設定的效能成本上升。介紹 **hardware cost** API（0–1，回報 session 硬體實際使用比例，超過 1 表示系統無法支援），影響因素包含相機數量、active format（1080p vs 4K）、frame rate（假設 format 的最大 frame rate，可用 frameRateOverride 降低）與是否用 binned format（分組像素、較省頻寬）。"},{"t":1216,"title":"Monitor for system pressure","body":"介紹 **system pressure cost** API（0–1，代表目前設定的成本，超過 1 即不可持續），並建議觀察 `AVCaptureDevice` 的 **systemPressureState**：壓力升高時降低裝置 frame rate、節流 GPU 或 Apple Neural Engine、減少 UI 工作。建議在初始設定後使用這些 API——commit 設定後確認 hardware cost 不超過裝置能力，再註冊 state 變化處理器隨系統狀態調整。"},{"t":1274,"title":"Deterministic file writing","body":"說明傳統檔案 I/O 因系統要兼顧多項操作、記憶體碎片與儲存磨損而**非確定性**，而 ProRes 等高位元率錄影需要持續的高頻寬 I/O 才能不掉幀。引出 iOS 27 新增、用來解決此問題的 `AVProVideoStorage`。"},{"t":1337,"title":"Manage pro video storage","body":"**`AVProVideoStorage`** 是追蹤並管理預先配置儲存的系統級共用資源，搭配既有錄影 API：在 `AVCaptureMovieFileOutput`（或用 video data output 錄影時的 asset writer）設 `usesProVideoStorage` 即可,由系統處理配置與 I/O，讓高位元率編碼的寫檔速度保持一致。相機設定新增讓使用者控制配置多少儲存，並提供 remaining capacity 與 open settings 方法。"},{"t":1363,"title":"Adopt AVProVideoStorage for deterministic file write speeds","body":"示範採用流程：先以 `isProVideoStorageSupported` 確認支援、用 `shared` 取得單例，建立 movie file output、session、connection 並選 format，用 `isProVideoStorageSupported`（在 output 上）確認相容，錄影前確認儲存非忙於 resize 或處理檔案請求，最後開啟 pro video storage 並開始錄影。錄影寫入預配置儲存、結束後再搬到指定位置；同樣適用於 `AVAssetWriter`。最後建議搭配高品質 photo output 採用 deferred start、用 instruments 量測效能，並在真實嚴苛環境（如大熱天）測試。"}],"summary_en":["Presented by the camera performance team, the central message is that the single most important factor in a camera app feeling fast is **how quickly the first preview frame appears on screen**—a small delay and the user misses the moment (demoed with falling dominoes). The session covers four topics: accelerating launch, rendering preview smoothly, sustaining performance under stress, and deterministic file writing for high-bit-rate recording. The launch sequence has four stages: app launch, session configure and start, AV capture output initialization, and preview streaming.","The key launch idea is to split work into what's **needed before preview displays** and what can wait **after preview is running**. In the UI, create only the camera preview and shutter button first, fading in the rest (image well, mode picker) after launch. `AVCaptureSession` must be created first since it coordinates everything, but its creation, `startRunning`, and `stopRunning` all **block the main thread**, so dispatch off-main and commit configuration once. The most expensive step is **initializing outputs**—only a preview layer or single output is needed for preview—so iOS 26 adds the **Deferred Start API**: set `isDeferredStartEnabled = true` on outputs not needed at launch to postpone them until after preview appears. Measured launch time can be **halved (2x faster)**.","Deferred Start has automatic and manual modes. **Automatic** (default when recompiled against the iOS 26+ SDK, `automaticallyRunsDeferredStart = true`) lets the system pick the best time after preview appears, with `sessionWillRunDeferredStart` and `sessionDidRunDeferredStart` delegate callbacks; **manual** (set to false) has the app call `runDeferredStartWhenNeeded` when ready—useful for reading preferences first or rendering preview yourself with `AVCaptureVideoDataOutput` (tracking when the first frame is presented). Deferring the photo output has a catch: preview is faster but time-to-first-capture stays the same, so set **`isResponsiveCaptureEnabled = true`** on `AVCapturePhotoOutput` to buffer between starting a capture and processing, letting people grab the moment even before the output is fully ready.","For rendering preview there are two choices: `AVCaptureVideoPreviewLayer` (simplest, low-latency, automatic HDR tone mapping, but no per-frame access; auto-opted into deferred start when recompiled for iOS 26+) and `AVCaptureVideoDataOutput` (per-frame processing, UI overlays, Metal integration, but needs manual deferred start). To sustain performance, use the **hardware cost** and **system pressure cost** APIs (both 0–1; above 1 is unsupported) to check whether a configuration is sustainable, and observe `AVCaptureDevice`'s **systemPressureState** to reduce frame rate, throttle GPU/ANE, and minimize UI work as pressure rises; frameRateOverride and binned formats lower cost. Finally, iOS 27 adds **`AVProVideoStorage`**—a system-wide, pre-allocated storage resource that works with existing recording APIs (set `usesProVideoStorage` on `AVCaptureMovieFileOutput` or an asset writer) to deliver deterministic write speeds for high-bit-rate codecs like ProRes, avoiding dropped frames."],"deepdive_en":[{"t":0,"title":"Introduction","body":"Camera performance engineer Jake opens, noting people notice slow launches and that the single most important factor in feeling fast is **how quickly preview appears**. A falling-dominoes demo (with a red domino in the middle) shows that slow preview misses the moment. Previews the four topics: accelerating launch, preview rendering best practices, performance-sustaining APIs, and deterministic file writing for high-bit-rate recording."},{"t":122,"title":"Fast Launch","body":"Breaks launch into four stages: **app launch** (linker load, static initializers, UI scene creation), **configure and start the session**, **initialize AV capture outputs**, and **preview streaming**. Split UI work into two phases—create preview-critical UI (camera preview, shutter button) first, fade in image well and mode picker after; any resource created before preview renders slows launch."},{"t":412,"title":"Adopt deferred start","body":"Initializing outputs is the most expensive launch step, but preview only needs a preview layer or single output. The iOS 26+ **Deferred Start API** lets apps postpone non-launch outputs until after preview appears—set `isDeferredStartEnabled` on each output (and the preview layer), deferring all except the one rendering preview."},{"t":554,"title":"Automatic deferred start delegate","body":"Explains automatic mode: apps recompiled against iOS 26+ default to it (`automaticallyRunsDeferredStart` true), with the system initializing deferred outputs shortly after preview appears and firing two delegate callbacks: `sessionWillRunDeferredStart` (before init, good for background resources) and `sessionDidRunDeferredStart` (after, all outputs ready)."},{"t":586,"title":"Adopt automatic deferred start","body":"Shows adoption: create a delegate-handling class, set `automaticallyRunsDeferredStart = true` on `AVCaptureSession` during configuration (already true if recompiled for iOS 26+), enable deferred start on non-launch outputs (e.g., the photo output) while rendering preview with the preview layer, attach the delegate, commit, and `startRunning`."},{"t":690,"title":"Adopt manual deferred start","body":"Introduces manual mode for apps that want to read preferences or set up UI before heavy init, or that render preview with `AVCaptureVideoDataOutput`. Set `automaticallyRunsDeferredStart` to false and disable deferred start on the preview-rendering output, then call `runDeferredStartWhenNeeded` once startup work is done."},{"t":713,"title":"Manage runDeferredStartWhenNeeded","body":"Shows timing control in manual mode: when rendering preview yourself, track whether the first frame is presented (the example uses a CAMetalLayer). Once it is, set up non-critical UI and call the session's `runDeferredStartWhenNeeded` for the postponed outputs; no special handling is needed afterward."},{"t":847,"title":"Enable responsive capture","body":"Notes the catch of deferring the photo output: preview is faster but time-to-first-capture stays the same, since the system must finish initializing it before capturing. The fix is `isResponsiveCaptureEnabled = true` on `AVCapturePhotoOutput`, which buffers between starting a capture and processing so people can grab the moment even if the output isn't fully ready (the green phone catches the dominoes; the purple one misses)."},{"t":906,"title":"Steady preview","body":"Once preview runs, a steady framerate and cadence matter or the camera feels laggy. The simplest renderer is **`AVCaptureVideoPreviewLayer`**: optimized for preview, automatic HDR tone mapping, low CPU/GPU overhead, low latency—at the cost of no per-frame access. For more control (per-frame processing, custom overlays, Metal, frame analysis), use **`AVCaptureVideoDataOutput`**, but adopt manual deferred start to keep the launch gains. Keep per-frame work short to avoid drops."},{"t":1084,"title":"Sustained performance","body":"As more cameras or inputs are added, the configuration's performance cost grows. Introduces the **hardware cost** API (0–1, the share of session hardware in use; above 1 the system can't support it), affected by camera count, active formats (1080p vs 4K), frame rate (assumes the format's max; lower it with frameRateOverride), and binned formats (grouped pixels, less bandwidth)."},{"t":1216,"title":"Monitor for system pressure","body":"Introduces the **system pressure cost** API (0–1, the cost of the current configuration; above 1 is unsustainable) and recommends observing `AVCaptureDevice`'s **systemPressureState**: as it rises, reduce the device frame rate, throttle GPU or Apple Neural Engine, and minimize UI work. Use these APIs after initial setup—after committing, confirm hardware cost is at or below 1, then register a handler for state changes to adapt."},{"t":1274,"title":"Deterministic file writing","body":"Explains that traditional file I/O is **non-deterministic** because the system juggles competing operations, memory fragmentation, and storage wear, while high-bit-rate recording like ProRes needs sustained high-bandwidth I/O to avoid dropped frames. Leads into iOS 27's new `AVProVideoStorage`."},{"t":1337,"title":"Manage pro video storage","body":"**`AVProVideoStorage`** is a system-wide shared resource tracking and managing pre-allocated storage, working with existing recording APIs: set `usesProVideoStorage` on `AVCaptureMovieFileOutput` (or the asset writer when recording with a video data output) and the system handles allocation and I/O so high-bit-rate write performance stays consistent. Camera settings let people control allocation, with remaining-capacity and open-settings methods."},{"t":1363,"title":"Adopt AVProVideoStorage for deterministic file write speeds","body":"Shows adoption: check support with `isProVideoStorageSupported`, get the singleton via `shared`, create the movie file output, session, connections, and format, confirm compatibility with `isProVideoStorageSupported` on the output, ensure storage isn't busy resizing or servicing requests before recording, then enable pro video storage and start. Recording writes to pre-allocated storage and is moved to the target location afterward; this also works with `AVAssetWriter`. Closes by recommending deferred start with a quality photo output, measuring with instruments, and testing in real, harsh conditions like a hot day."}],"code":["import AVFoundation\n\nclass DeferredStartDelegate: NSObject, AVCaptureSessionDeferredStartDelegate {\n    func sessionWillRunDeferredStart(_ session: AVCaptureSession)\n    {\n        // This is called before deferred start begins for the deferred outputs\n    }\n\n    func sessionDidRunDeferredStart(_ session: AVCaptureSession)\n    {\n        // This is called after deferred start completes for all outputs\n    }\n}","import AVFoundation\n\nlet captureSession = AVCaptureSession()\ncaptureSession.beginConfiguration()\ncaptureSession.automaticallyRunsDeferredStart = true\n\nlet videoPreviewLayer = AVCaptureVideoPreviewLayer(session: captureSession)\nvideoPreviewLayer.isDeferredStartEnabled = false\n\nlet photoOutput = AVCapturePhotoOutput()\nphotoOutput.isDeferredStartEnabled = true\ncaptureSession.addOutput(photoOutput)\n\ncaptureSession.setDeferredStartDelegate(deferredStartDelegate, deferredStartDelegateCallbackQueue: sessionQueue)\n\ncaptureSession.commitConfiguration()\ncaptureSession.startRunning()","import AVFoundation\n\nlet captureSession = AVCaptureSession()\ncaptureSession.beginConfiguration()\ncaptureSession.automaticallyRunsDeferredStart = false\n\nlet videoOutput = AVCaptureVideoDataOutput()\ncaptureSession.addOutput(videoOutput)\nvideoOutput.isDeferredStartEnabled = false\n\nlet photoOutput = AVCapturePhotoOutput()\nphotoOutput.isDeferredStartEnabled = true\ncaptureSession.addOutput(photoOutput)\n\ncaptureSession.setDeferredStartDelegate(deferredStartDelegate, deferredStartDelegateCallbackQueue: sessionQueue)\n\ncaptureSession.commitConfiguration()\ncaptureSession.startRunning()","import AVFoundation\nimport QuartzCore\n\nprivate var firstFramePresented = false\nguard let drawable = layer.nextDrawable()\nif (!firstFramePresented) {\n    drawable.addPresentedHandler({ drawable in\n        // Set up postponed UI elements\n        captureSession.runDeferredStartWhenNeeded()\n    })\n    firstFramePresented = true\n}","import AVFoundation\n\nfunc configurePhotoOutput(for session: AVCaptureSession, device: AVCaptureDevice) {\n    let photoOutput = AVCapturePhotoOutput()\n\n    guard session.canAddOutput(photoOutput) else { return }\n    session.addOutput(photoOutput)\n\n    photoOutput.maxPhotoQualityPrioritization = .quality\n    // Responsive capture lets the photo output capture immediately\n    photoOutput.isResponsiveCaptureEnabled = photoOutput.isResponsiveCaptureSupported\n}","import AVFoundation\n\nlet captureSession = AVCaptureSession()\nlet device = activeVideoInput?.device\ncaptureSession.beginConfiguration()\n// ...\ncaptureSession.commitConfiguration()\n\nguard captureSession.hardwareCost \u003c= 1.0 else {\n    print(\"hardwareCost \\(captureSession.hardwareCost) — cannot start session. Reconfiguring.\")\n    setupLowCostConfiguration()\n}\n\ncaptureSession.startRunning()\nlet systemPressureObserver = device?.observe(\\.systemPressureState,\n                                               options: [.initial, .new],\n                                               changeHandler: { /* Handle state change */ })","import AVFoundation\n\nfunc configureProVideoStorage() {\n    guard AVProVideoStorage.isSupported else { return }\n    let storage = AVProVideoStorage.shared\n    guard storage.remainingCapacity != 0 else {\n        storage.openSettings()\n        return\n    }\n}","import AVFoundation\n\nguard AVProVideoStorage.isSupported else { return }\nguard let pvs = AVProVideoStorage.shared else { return }\n\n// Configure and set up AVCaptureSession, AVCaptureConnections and format\n// ...\nlet movieOutput = AVCaptureMovieFileOutput()\n\nguard movieOutput.isProVideoStorageSupported else { return }\nguard !pvs.isBusy else { return }\n\nlet movieFileURL = FileManager.default.temporaryDirectory\n            .appendingPathComponent(UUID().uuidString)\n            .appendingPathExtension(\"mov\")\n\nmovieOutput.usesProVideoStorage = true // Also available with AVAssetWriter\nmovieOutput.startRecording(to: movieFileURL, recordingDelegate: delegate)"]},"related":[{"id":"304","title":"Implement high resolution photo capture","gloss":"實作高解析度照片拍攝","gloss_en":"Implement high resolution photo capture","category":"graphics","categoryLabel":"圖形與遊戲"},{"id":"341","title":"Support the Center Stage front camera in your iOS app","gloss":"在 iOS App 中支援人物居中前置鏡頭","gloss_en":"Support the Center Stage front camera in your iOS app","category":"other","categoryLabel":"其他"},{"id":"256","title":"Discover generated subtitles and subtitle styles","gloss":"認識自動產生字幕與字幕樣式","gloss_en":"Discover generated subtitles and subtitle styles","category":"graphics","categoryLabel":"圖形與遊戲"},{"id":"101","title":"Keynote","gloss":"主題演講","gloss_en":"Keynote","category":"other","categoryLabel":"其他"},{"id":"102","title":"Platforms State of the Union","gloss":"平台現況報告","gloss_en":"Platforms State of the Union","category":"other","categoryLabel":"其他"}]}</script>
