<script id="d" type="application/json">{"s":{"id":"290","title":"Craft clear names for features and labels in your app","gloss":"為 App 的功能與標籤取清楚的名稱","category":"design","categoryLabel":"設計","duration":904,"url":"https://developer.apple.com/videos/play/wwdc2026/290/","takeaway":"好的功能與標籤命名能直接影響使用者是否看得懂、找得到，值得用明確準則與流程來打磨。","chapters":[[0,"Introduction"],[78,"Criteria"],[325,"Process"],[634,"Evaluation"]],"points":[{"text":"命名會決定使用者如何**理解與瀏覽**你的 App，是體驗的一部分而非小事。","hot":false},{"text":"提出評估名稱好壞的**準則（Criteria）**，作為取名時的判斷依據。","hot":false},{"text":"介紹一套可重複的**命名流程（Process）**，協助團隊系統化地產生候選名稱。","hot":false},{"text":"說明如何**評估（Evaluation）**候選名稱並做出選擇。","hot":false}],"apis":[],"audience":"負責 App 功能命名、UX 文案與資訊架構的**設計師、產品與工程團隊**。","gloss_en":"Craft clear names for features and labels in your app","takeaway_en":"Good feature and label naming directly affects whether users understand and can find things, and is worth refining with clear criteria and a process.","points_en":[{"text":"Naming determines how users **understand and navigate** your app; it's part of the experience, not a minor detail.","hot":false},{"text":"Presents **criteria** for evaluating whether a name is good, to guide your naming decisions.","hot":false},{"text":"Introduces a repeatable **naming process** to help teams generate candidate names systematically.","hot":false},{"text":"Explains how to **evaluate** candidate names and make a choice.","hot":false}],"audience_en":"**Designers, product, and engineering teams** responsible for feature naming, UX copy, and information architecture.","summary":["命名往往被當成設計的最後一步，但其實它和版面、互動與視覺一樣，深刻影響使用者怎麼理解與操作你的 app。Apple HI 設計團隊的 UX writer 指出，從 app 名稱到選單、分頁列、設定項目，每一層的命名都會累積成使用者對 app 的整體感受。好的命名讓人「一打開就知道往哪裡去」，那種篤定感其實是被設計出來的。","本場提出三個檢視名稱好壞的核心標準：**Belongs**（是否真正契合 app、和你已命名的其他事物和諧共存）、**Expectations**（是否清楚地預告使用者會找到什麼、進而建立信任）、以及 **Works everywhere**（能否跨語言、市場與平台情境而不出現摩擦）。講者強調這三者是「指南而非規則」，名稱不必每項都滿足，你可以依功能所在的脈絡決定要偏向清晰還是偏向品牌表達。以 Apple Cash 的餘額為例，Spending Power 太抽象又可能變成評判、Current Funds 像試算表用語，最終選用業界標準、清楚又中性的 **Balance**。","在「如何想出好名字」上，講者提供一套可操作的練習：先確立**受眾**，再以便利貼寫下「希望他們 think／feel／do 什麼」，盡量發散不要過早篩選，接著依主題分群，最後把候選名稱放進真實對話句子裡做「自然度測試」。以 Apple Maps 為例，從 ease／excitement／security 等主題出發，最終選定 **Visited Places**——描述清楚、契合既有以 places 為核心的介面、傳達擁有權，也好翻譯。","命名不必侷限於直白描述：Photos 的 **Memories** 用情感而非解釋來達成清晰、Podcasts 的 **Enhance Dialogue** 用動詞把使用者放在主導位置並同時回答「強化什麼、為了誰」、Apple Music 的 **AutoMix** 則用 Auto 加 Mix 造出一個雖不存在卻能秒懂的新詞。三種風格（描述、情感、品牌）的標準不變，差別只在你如何權衡。最後的收穫是:命名和版面同等基礎，最好的名字不只描述功能,更能對說使用者本身,而每個好名字都會讓下一個更容易,逐漸累積成你 app 的語言。"],"deepdive":[{"t":0,"title":"Introduction","body":"由 Human Interface 設計團隊的 UX writer Heej 開場，點出**命名**是個容易被忽略卻極具威力的設計工具。她以 Mac、iPhone、iCloud 等 Apple 五十年來的經典名稱破題，但強調命名其實發生在**每一個層級**——從選單、分頁列到設定項目，這些大小選擇加總起來決定使用者對 app 的感受。本場將依序談標準、流程與評估三部分。"},{"t":78,"title":"Criteria","body":"提出三個檢視名稱的標準：**Belongs**（契合度，名字要在每個層級都站得住、和其他命名和諧共存）、**Expectations**（清晰與信任，讀到名字就能預測會找到什麼）、與 **Works everywhere**（跨語言、市場、平台皆可用）。講者強調這是指南而非規則，名稱不必全中。隨後以 Apple Cash 為例，否決抽象且可能變評判的 Spending Power、像試算表的 Current Funds，最終選用業界標準、中性清楚的 **Balance**；並以健身房 app 的 Lightweight／Heavyweight 說明何時可為品牌承擔額外的學習成本。"},{"t":325,"title":"Process","body":"示範一套發想流程：先釐清**受眾**（新手父母？馬拉松訓練者？），再用便利貼分別寫下希望他們 **think／feel／do** 什麼，盡量發散、暫不篩選，然後依重複出現的**主題**分群。以 Apple Maps 記錄造訪地點的功能為例，歸納出 ease、excitement、security 三個主題，並用「把名字放進和朋友說的句子」做自然度測試，最終選定描述清楚、契合介面、傳達擁有權又好翻譯的 **Visited Places**。"},{"t":634,"title":"Evaluation","body":"用三個實例說明如何評估名稱，且風格不必只有直白描述：Photos 的 **Memories** 以情感而非解釋達成清晰；Podcasts 的人聲強化功能因為是「使用者去做的動作」而採動詞，從 Isolate Vocals、Clarify Speech 一路淘汰，選定同時回答「強化什麼、為了誰」且已用於 Apple TV 的 **Enhance Dialogue**；Apple Music 的 **AutoMix** 則用 Auto＋Mix 造出可秒懂的新詞。結語點出命名與版面同等基礎，好名字會累積成 app 的語言。"}],"summary_en":["Naming is often treated as an afterthought, but it shapes how people understand and navigate your app just as much as layout, interaction, and visual design. A UX writer on Apple's Human Interface design team explains that naming happens at every level—from the app name down to menus, tab bars, and settings—and all those choices add up to how someone feels about your app. That feeling of opening an app and just knowing where to go is, in fact, designed.","The session offers three criteria for judging a name: **Belongs** (it fits your app and lives well among everything else you've named), **Expectations** (it clearly predicts what people will find and thereby builds trust), and **Works everywhere** (it holds up across languages, markets, and platforms without friction). These are a guide, not a rulebook—a name needn't check every box, and you decide whether to lean into clarity or brand based on where a feature lives. With Apple Cash, Spending Power is too abstract and can feel like a judgment, Current Funds sounds like a spreadsheet, and the winner is **Balance**: the clear, neutral, industry-standard term.","For generating names, the talk gives a concrete exercise: define your **audience** first, then write down on sticky notes what you want them to **think, feel, and do**—diverging freely without filtering—then group the ideas by recurring theme, and finally drop candidate names into natural conversational sentences as a gut check. For an Apple Maps feature that remembers places you've been, themes of ease, excitement, and security led to **Visited Places**: descriptive, at home in an interface built around \"places,\" conveying ownership, and easy to translate.","Names don't have to be purely descriptive: Photos' **Memories** earns clarity from emotion rather than explanation, Podcasts' **Enhance Dialogue** uses a verb to put the person in control while answering both \"what's enhanced\" and \"for whom,\" and Apple Music's **AutoMix** invents a word from Auto + Mix that you understand instantly. The criteria don't change across descriptive, emotional, and branded styles—only how you weigh them. The takeaway: naming is as fundamental as layout, the best names speak to the person and not just the function, and every good name makes the next one easier, gradually becoming the language of your app."],"deepdive_en":[{"t":0,"title":"Introduction","body":"Heej, a UX writer on the Human Interface design team, opens by framing **naming** as a powerful but easily overlooked design tool. She cites 50 years of iconic Apple names—Mac, iPhone, iCloud—but stresses that naming happens at **every level**, from menus to tab bars to settings, and those choices add up to how someone feels about the app. The session will cover criteria, process, and evaluation in turn."},{"t":78,"title":"Criteria","body":"Three criteria are introduced: **Belongs** (fit—the name works at every level and lives well among your others), **Expectations** (clarity and trust—the name predicts what people will find), and **Works everywhere** (holds up across languages, markets, and platforms). These are a guide, not a rulebook. Using Apple Cash, the talk rejects the abstract, judgment-prone Spending Power and the spreadsheet-like Current Funds in favor of the clear, neutral, industry-standard **Balance**; a gym app's Lightweight/Heavyweight plans illustrate when leaning into brand is worth the extra learning curve."},{"t":325,"title":"Process","body":"A generative exercise is demonstrated: clarify the **audience** first, then use sticky notes to capture what you want them to **think, feel, and do**, diverging freely without filtering, then group ideas by recurring **theme**. For an Apple Maps feature that remembers visited places, the themes ease, excitement, and security emerge, and a \"say it to a friend\" naturalness test helps narrow down to **Visited Places**—descriptive, at home in the interface, conveying ownership, and easy to translate."},{"t":634,"title":"Evaluation","body":"Three examples show how to evaluate a name, and that styles need not be purely descriptive: Photos' **Memories** achieves clarity through emotion; the Podcasts voice-isolation feature uses a verb because it's something you *do*, progressing from Isolate Vocals and Clarify Speech to **Enhance Dialogue**, which answers both \"what's enhanced\" and \"for whom\" and already ships on Apple TV; Apple Music's **AutoMix** invents an instantly understandable word from Auto + Mix. The close: naming is as fundamental as layout and accumulates into the language of your app."}],"code":[]},"related":[{"id":"220","title":"Refine accessibility for custom controls","gloss":"為自訂控制項優化無障礙體驗","gloss_en":"Refine accessibility for custom controls","category":"design","categoryLabel":"設計"},{"id":"250","title":"Principles of great design","gloss":"卓越設計的原則","gloss_en":"Principles of great design","category":"design","categoryLabel":"設計"},{"id":"251","title":"Communicate your brand identity on iOS","gloss":"在 iOS 上傳達品牌識別","gloss_en":"Communicate your brand identity on iOS","category":"design","categoryLabel":"設計"},{"id":"292","title":"Design intuitive search experiences","gloss":"設計直覺的搜尋體驗","gloss_en":"Design intuitive search experiences","category":"design","categoryLabel":"設計"},{"id":"8005","title":"Accessibility Technologies Group Lab","gloss":"無障礙技術小組實驗室","gloss_en":"Accessibility Technologies Group Lab","category":"design","categoryLabel":"設計"}]}</script>
