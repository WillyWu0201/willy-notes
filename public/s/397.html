<script id="d" type="application/json">{"s":{"id":"397","title":"Dub Dub Daily: Day 2","gloss":"WWDC 每日精選：第 2 天","category":"other","categoryLabel":"其他","duration":352,"url":"https://developer.apple.com/videos/play/wwdc2026/397/","takeaway":"一次回顧 WWDC26 第 2 天的**重大公告與年度主題**，快速掌握當天重點。","chapters":[],"points":[{"text":"彙整 WWDC26 **第 2 天的最大公告**，一次看完當天揭曉的重點。","hot":false},{"text":"深入今年塑造方向的**年度主題（themes）**。","hot":false},{"text":"屬於約 6 分鐘的**每日精選短片**，適合快速補課。","hot":false}],"apis":[],"audience":"**想快速掌握 WWDC26 每日重點**、無暇看完所有場次的開發者。","gloss_en":"Dub Dub Daily: Day 2","takeaway_en":"A one-stop recap of Day 2's **major announcements and yearly themes** at WWDC26, to quickly catch up on the day's highlights.","points_en":[{"text":"Rounds up the **biggest announcements of WWDC26 Day 2**, so you can catch everything revealed that day in one place.","hot":false},{"text":"Goes deeper on the **themes** shaping this year's direction.","hot":false},{"text":"A roughly 6-minute **daily highlights short**, ideal for catching up quickly.","hot":false}],"audience_en":"Developers who **want to quickly catch up on WWDC26's daily highlights** and don't have time to watch every session.","summary":["本集是 **Dub Dub Daily** 第二天節目，由 Worldwide Developer Relations 的 Lauren Grimm 從 Apple Park 主持，帶大家快速掌握 WWDC26 的重點動態。她先提醒第一天的 **Keynote** 與 **Platform State of the Union（SOTU）**已可在 Apple Developer 網站與 app 上隨選觀看，還有一支 SOTU 精華回顧影片與一篇整理所有重點的文章供時間有限的人參考。","本集核心是與 Platform Technologies 資深總監 **Josh Schaffer**（同時是今年 SOTU 主持人）的訪談。他把今年的標題濃縮為三大主題：**rebuilt intelligence（重建的智慧）、refined platforms（精煉的平台）、transformed tools（轉型的工具）**。談到工具轉型，他指出 intelligence 正改變開發方式，工具本身今年朝 **agentic coding（代理式編碼）**大幅進化，讓打造 app 變得容易許多——一打開 **Xcode** 就能試用全新的 agent 與開發方式，是相當大的躍進。","Josh 也闡述「智慧平台」的概念：app 內的 intelligence 讓 app 更強大、帶來過去做不到的能力；系統層級的 intelligence（如 **Siri**）則讓全系統互動更強，兩者互補。他特別點名今年最自豪、但外界未必一眼看見的亮點——**Foundation Models framework**：過去用 frontier model 門檻不低（要搞定商業模式、token 費用、連接伺服器等），現在可在 **Private Cloud Compute** 上幾乎零設定、零摩擦地存取 frontier model，將大幅降低門檻、催生原本不會出現的 app。","節目最後預告當天行程：全天進行 **Group Labs**（由打造這些技術的 Apple 工程師與設計師主持的線上簡報與 Q&A，任何人都能即時或隨選觀看）。Lauren 也提到實用資源：developer.apple.com 上由 AI 驅動的搜尋答案、Apple Music 上的「WWDC26」整週播放清單，以及第一天已上線、涵蓋 Core AI、Xcode 27、design foundations 等超過 100 場的 sessions，全部正在串流中。"],"deepdive":[],"summary_en":["This is day two of **Dub Dub Daily**, hosted by Lauren Grimm from Worldwide Developer Relations at Apple Park, giving a quick rundown of what's happening at WWDC26. She reminds viewers that day one's **Keynote** and **Platform State of the Union (SOTU)** are available on demand on the Apple Developer website and app, along with a SOTU recap video and an article of all the big takeaways for those short on time.","The heart of the episode is an interview with **Josh Schaffer**, Senior Director of Platform Technologies and this year's SOTU host. He distills the year into three themes: **rebuilt intelligence, refined platforms, and transformed tools**. On transformed tools, he notes that intelligence is changing how development is done and that the tools themselves have undergone a huge transformation toward **agentic coding**, making it far easier to build things—you download **Xcode** and try out the new agents and ways to code, a remarkable leap forward.","Josh also explains the \"intelligent platform\" idea: intelligence inside apps makes them more powerful and adds capabilities that weren't previously possible, while system-level intelligence (like **Siri**) makes system-wide interactions more powerful, and the two are complementary. He highlights what he's most proud of but that may not be outwardly obvious—the **Foundation Models framework**: building with frontier models used to carry real barriers (figuring out a business model, token costs, connecting to servers), but now you can access a frontier model in **Private Cloud Compute** with almost no setup or friction, democratizing access and enabling apps that might not otherwise have happened.","The episode closes by previewing the day's schedule: **Group Labs** running all day (live online presentations and Q&A hosted by the Apple engineers and designers who build these technologies, watchable live or on demand by anyone). Lauren also points to useful resources: AI-powered answers on developer.apple.com, the week's \"WWDC26\" playlists on Apple Music, and the more than 100 sessions that dropped on day one—covering Core AI, Xcode 27, design foundations, and more—all streaming now."],"deepdive_en":[],"code":[]},"related":[{"id":"101","title":"Keynote","gloss":"主題演講","gloss_en":"Keynote","category":"other","categoryLabel":"其他"},{"id":"102","title":"Platforms State of the Union","gloss":"平台現況報告","gloss_en":"Platforms State of the Union","category":"other","categoryLabel":"其他"},{"id":"111","title":"Keynote (ASL)","gloss":"主題演講(美國手語版)","gloss_en":"Keynote (American Sign Language)","category":"other","categoryLabel":"其他"},{"id":"112","title":"Platforms State of the Union (ASL)","gloss":"平台現況報告（美國手語版）","gloss_en":"Platforms State of the Union (American Sign Language)","category":"other","categoryLabel":"其他"},{"id":"122","title":"WWDC26 Platforms State of the Union Recap","gloss":"WWDC26 平台現況演講重點回顧","gloss_en":"WWDC26 Platforms State of the Union recap","category":"other","categoryLabel":"其他"}]}</script>
