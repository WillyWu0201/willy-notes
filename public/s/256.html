<script id="d" type="application/json">{"s":{"id":"256","title":"Discover generated subtitles and subtitle styles","gloss":"認識自動產生字幕與字幕樣式","category":"graphics","categoryLabel":"圖形與遊戲","duration":660,"url":"https://developer.apple.com/videos/play/wwdc2026/256/","takeaway":"運用自動產生字幕讓影片內容更易讀，並讓使用者在 App 中即時預覽與套用字幕樣式。","chapters":[[0,"Introduction"],[70,"Media authoring"],[134,"Subtitle generation methods"],[183,"Availability and support"],[271,"Presenting subtitles in your app"],[339,"Subtitle style preview"],[463,"Implement subtitle style preview"],[535,"Demo"],[620,"Next steps"]],"points":[{"text":"新的 **自動產生字幕** 功能可轉錄口語音訊，甚至翻譯，提升影片內容的無障礙程度。","hot":true},{"text":"說明字幕的 **產生方式、可用性與支援條件**，協助評估如何整合到既有影片流程。","hot":false},{"text":"透過 **MediaAccessibility** 的 MACaptionAppearanceCopyProfileIDs 取得可用字幕樣式設定檔。","hot":false},{"text":"以 **setCaptionPreviewProfileID** 在 AVPlayerLayer 上即時預覽字幕樣式，並可停止預覽。","hot":false},{"text":"使用 **MACaptionAppearanceSetActiveProfileID** 套用使用者選定的字幕外觀。","hot":false}],"apis":["AVFoundation","MediaAccessibility","MACaptionAppearanceCopyProfileIDs","MACaptionAppearanceSetActiveProfileID","AVPlayerLayer"],"audience":"開發 **影片播放或媒體製作 App**、想加入字幕產生與樣式自訂的開發者。","gloss_en":"Discover generated subtitles and subtitle styles","takeaway_en":"Use generated subtitles to make video content more readable, and let users preview and apply subtitle styles in real time within your app.","points_en":[{"text":"The new **generated subtitles** feature can transcribe spoken audio, and even translate it, improving the accessibility of your video content.","hot":true},{"text":"Explains how subtitles are **generated, their availability, and supported conditions**, helping you assess how to integrate them into an existing video pipeline.","hot":false},{"text":"Retrieve available subtitle style profiles via **MediaAccessibility**'s MACaptionAppearanceCopyProfileIDs.","hot":false},{"text":"Use **setCaptionPreviewProfileID** on an AVPlayerLayer to preview subtitle styles in real time, and to stop previewing.","hot":false},{"text":"Use **MACaptionAppearanceSetActiveProfileID** to apply the caption appearance the user selected.","hot":false}],"audience_en":"Developers building **video playback or media production apps** who want to add subtitle generation and style customization.","summary":["AVFoundation 團隊工程師 James 介紹兩項讓影片內容更無障礙的字幕功能。第一項是 **Apple AI-generated subtitles**（產生字幕）：在裝置上、播放當下即時、本地產生字幕，協助當原始內容沒有觀眾需要的字幕語言時補上缺口。它有兩種用途——從音訊以 on-device Speech-To-Text 模型產生字幕（**Speech transcription**），以及從既有字幕用 on-device 翻譯模型產生另一種語言字幕（**Language translation**）。最棒的是開發者**無需實作任何東西**即可在播放時自動啟用；authored（人工製作）字幕仍為優先且不變，產生字幕只是額外提供更多語言。","支援範圍涵蓋 HTTP Live Streaming（直播、隨選影片、體育等）與檔案型內容（app 內建或下載），內容類型從專業電影影集到使用者自拍與社群影片皆可。語言／裝置方面，自 iOS／macOS／tvOS／visionOS 27 起可由英文音訊產生英文字幕，並可在 iOS／macOS 由英文字幕產生多種語言字幕。要讓使用者用到，app 需提供字幕選擇 UI：iOS 的 **AVPlayerViewController** 與 macOS 的 **AVPlayerView** 已完整實作（含播放控制）；若想加進既有播放 UI 但不要播放控制，可用 **AVLegibleMediaOptionsMenuController**；也可自行實作客製控制項。","第二項是 **subtitle style preview**（字幕樣式預覽）。多年來 Settings app 已可選擇與自訂字幕樣式（如使用者自建的 Bold Yellow），但在觀看影片時就近切換更方便、更無障礙。此功能讓使用者直接在播放時的字幕選單裡切換樣式，並即時預覽效果。實作選項包括：iOS 的 AVPlayerViewController／macOS 的 AVPlayerView（完整實作）、AVLegibleMediaOptionsMenuController（加進既有 UI），以及較底層的 **AVPlayerLayer**（自行驅動）與需自行渲染的 **AVCaptionRenderer**。AVPlayerLayer 流程是：以 `MACaptionAppearanceCopyProfileIDs` 取得各樣式的 profile ID 填入 UI、選取時用 `setCaptionPreviewProfileID` 顯示預覽（傳 nil 文字會顯示本地化系統文字，並用 position 避開控制項）、結束時 `stopShowingCaptionPreview`，最後以 `MACaptionAppearanceSetActiveProfileID` 套用所選樣式。"],"deepdive":[{"t":0,"title":"Introduction","body":"AVFoundation 工程師 James 開場，說明人們因無障礙需求、輔助理解、或環境吵雜等各種原因使用字幕。**Apple AI-generated subtitles** 可在裝置上、播放當下本地即時產生。本場先示範產生字幕如何在 app 中呈現，再介紹讓使用者在播放時自訂字幕樣式的 subtitle style preview。"},{"t":70,"title":"Media authoring","body":"回顧媒體製作流程：先拍攝與剪輯影音，再人工製作 **authored subtitles**（每種語言一份，也可有多語音軌），最終媒體把影像、音訊與 authored 字幕包在一起。即使有多語字幕，觀眾仍可能沒有看得懂的語言，這正是產生字幕補足缺口之處。"},{"t":134,"title":"Subtitle generation methods","body":"產生字幕有兩種用途：**Speech transcription**——音訊經 on-device Speech-To-Text 模型產生字幕；**Language translation**——既有字幕（如英文）經 on-device 翻譯模型產生另一語言（如義大利文）。產生字幕僅額外提供語言，**authored 字幕仍優先且不變**。"},{"t":183,"title":"Availability and support","body":"好消息是開發者**無需實作**即可在播放時自動啟用產生字幕。支援多種場景：HTTP Live Streaming（直播、隨選影片、體育直播）與檔案型內容（app 內建或下載）；內容類型含專業電影影集與使用者自拍、社群影片。自 iOS／macOS／tvOS／visionOS 27 起可由英文音訊產生英文字幕，iOS／macOS 還可由英文字幕產生多語字幕。"},{"t":271,"title":"Presenting subtitles in your app","body":"強調 app 應在播放時提供字幕選擇 UI。選項包括：iOS 的 **AVPlayerViewController** 與 macOS 的 **AVPlayerView**（完整實作字幕選擇與播放控制，無需額外處理）；**AVLegibleMediaOptionsMenuController**（提供字幕選擇但不含播放控制，適合加進既有 UI）；或自行實作客製控制項以配合 app 風格。"},{"t":339,"title":"Subtitle style preview","body":"字幕的呈現方式同樣重要。Settings app 多年來可選擇與自訂字幕樣式（如自建的 Bold Yellow——黃字加邊框更易讀），但在觀看影片時就近切換更方便無障礙。**subtitle style preview** 讓使用者直接在播放時的字幕選單切換樣式並即時預覽效果。"},{"t":463,"title":"Implement subtitle style preview","body":"實作選項：iOS 的 AVPlayerViewController／macOS 的 AVPlayerView（完整實作）、AVLegibleMediaOptionsMenuController（加進既有 UI），以及較底層、需自行驅動的 **AVPlayerLayer** 與需自行渲染的 **AVCaptionRenderer**。AVPlayerLayer 流程：用 `MACaptionAppearanceCopyProfileIDs` 取得各樣式 profile ID 填入 UI、選取時 `setCaptionPreviewProfileID` 顯示預覽（傳 nil 文字顯示本地化系統文字、用 position 避開控制項）、結束 `stopShowingCaptionPreview`，最後 `MACaptionAppearanceSetActiveProfileID` 套用。"},{"t":535,"title":"Demo","body":"示範同時使用兩項功能：觀看一支英文字幕的露營影片，從 Subtitles 選單的 Language 切換到標記 sparkle 與「Translated」的義大利文**產生字幕**；再從 Style 選單嘗試 Large Text，現有字幕被替換成義大利文 placeholder 預覽，最後套用自建的 Bold Yellow 樣式。"},{"t":620,"title":"Next steps","body":"建議：實際探索產生字幕（如看旅遊影片並開啟）、確保 app 有字幕選擇 UI，並實作 subtitle style preview，讓需要調整字幕樣式的使用者能在觀看時就近完成。"}],"summary_en":["AVFoundation engineer James covers two subtitle features that make video content more accessible. The first is **Apple AI-generated subtitles**: created live, locally on the device as media plays, to fill the gap when the original content lacks the subtitle language a viewer needs. There are two use cases — generating subtitles from audio via an on-device Speech-To-Text model (**Speech transcription**) and generating another language from existing subtitles via an on-device translation model (**Language translation**). Best of all, developers **don't need to implement anything** — they're available automatically during playback; authored subtitles remain preferred and unchanged, with generated subtitles simply offering more languages.","Support spans HTTP Live Streaming (live streams, video on demand, sports) and file-based content (app-bundled or downloaded), across content from professional movies and series to user-captured and social media videos. For languages and devices, starting in iOS/macOS/tvOS/visionOS 27 English subtitles can be generated from English audio, and on iOS/macOS multiple languages can be generated from English subtitles. To let users access them, the app should provide a subtitle-selection UI: iOS's **AVPlayerViewController** and macOS's **AVPlayerView** fully implement it (with player controls); to add it to existing player UI without controls, use **AVLegibleMediaOptionsMenuController**; or implement custom controls.","The second feature is **subtitle style preview**. The Settings app has long let people select and customize subtitle styling (like a user-made Bold Yellow), but changing it while watching is more convenient and accessible. This feature lets users switch styles right from the playback subtitle menu, with a live preview of each. Implementation options include iOS's AVPlayerViewController / macOS's AVPlayerView (fully implemented), AVLegibleMediaOptionsMenuController (for existing UI), and the lower-level **AVPlayerLayer** (you drive it) and **AVCaptionRenderer** (you render it). The AVPlayerLayer flow: fetch each style's profile ID with `MACaptionAppearanceCopyProfileIDs` to populate the UI, show a preview on selection with `setCaptionPreviewProfileID` (passing nil text shows localized system text, and position avoids controls), stop with `stopShowingCaptionPreview`, and apply the chosen style with `MACaptionAppearanceSetActiveProfileID`."],"deepdive_en":[{"t":0,"title":"Introduction","body":"AVFoundation engineer James opens, noting people use subtitles for accessibility, comprehension, or noisy environments. **Apple AI-generated subtitles** are created live and locally on-device as media plays. The session first shows how generated subtitles appear in your app, then the subtitle style preview that lets users customize styling during playback."},{"t":70,"title":"Media authoring","body":"Reviews the media creation flow: filming and editing video and audio, then manually creating **authored subtitles** (one per language, with possible multiple audio languages), with the final media bundling video, audio, and authored subtitles. Even with multiple languages, a viewer may lack one they understand — exactly where generated subtitles fill the gap."},{"t":134,"title":"Subtitle generation methods","body":"Generated subtitles have two use cases: **Speech transcription** — audio runs through an on-device Speech-To-Text model to produce subtitles; **Language translation** — existing subtitles (e.g. English) run through an on-device translation model to produce another language (e.g. Italian). Generated subtitles only add languages; **authored subtitles remain preferred and unchanged**."},{"t":183,"title":"Availability and support","body":"The good news: developers **don't need to implement anything** — generated subtitles are available automatically during playback. Supported scenarios include HTTP Live Streaming (live streams, video on demand, live sports) and file-based content (app-bundled or downloaded), across professional movies/series and user-captured/social videos. From iOS/macOS/tvOS/visionOS 27, English subtitles can be generated from English audio; iOS/macOS can also generate multiple languages from English subtitles."},{"t":271,"title":"Presenting subtitles in your app","body":"Stresses providing a subtitle-selection UI during playback. Options include iOS's **AVPlayerViewController** and macOS's **AVPlayerView** (fully implementing selection and player controls), **AVLegibleMediaOptionsMenuController** (selection without player controls, good for existing UI), or custom controls to match the app's style."},{"t":339,"title":"Subtitle style preview","body":"How subtitles look matters too. The Settings app has long let people select and customize subtitle styles (like a custom Bold Yellow — yellow text with extra border for readability), but changing it while watching is more convenient and accessible. **Subtitle style preview** lets users switch styles right in the playback subtitle menu with a live preview."},{"t":463,"title":"Implement subtitle style preview","body":"Implementation options: iOS's AVPlayerViewController / macOS's AVPlayerView (fully implemented), AVLegibleMediaOptionsMenuController (for existing UI), and the lower-level **AVPlayerLayer** (you drive it) and **AVCaptionRenderer** (you render it). The AVPlayerLayer flow: get profile IDs with `MACaptionAppearanceCopyProfileIDs` to populate the UI, show a preview on selection with `setCaptionPreviewProfileID` (nil text shows localized system text, position avoids controls), stop with `stopShowingCaptionPreview`, and apply via `MACaptionAppearanceSetActiveProfileID`."},{"t":535,"title":"Demo","body":"Demonstrates both features together: watching an English-subtitled camping video, switching via the Subtitles menu's Language to the Italian **generated** subtitles marked with a sparkle and \"Translated\"; then trying Large Text from the Style menu, with existing subtitles replaced by an Italian placeholder preview, and finally applying the custom Bold Yellow style."},{"t":620,"title":"Next steps","body":"Recommends exploring generated subtitles (e.g. turning them on while watching travel videos), ensuring your app has a subtitle-selection UI, and implementing subtitle style preview so users who need to adjust styling can do so right while watching."}],"code":["// Implement subtitle style preview\n\nimport AVFoundation\nimport MediaAccessibility\n\nfunc updateProfileList() {\n    subtitleStyleProfileIDs = MACaptionAppearanceCopyProfileIDs() as? [String] ?? []\n}\n\nfunc showPreviewStyle(subtitleStyleProfileID: String) {\n    playerLayer.setCaptionPreviewProfileID(subtitleStyleProfileID, position: .zero, text: nil)\n}\n\nfunc stopPreviewStyle() {\n    playerLayer.stopShowingCaptionPreview()\n}\n\nfunc setSubtitleStyle(subtitleStyleProfileID: CFString) {\n    MACaptionAppearanceSetActiveProfileID(subtitleStyleProfileID)\n}"]},"related":[{"id":"304","title":"Implement high resolution photo capture","gloss":"實作高解析度照片拍攝","gloss_en":"Implement high resolution photo capture","category":"graphics","categoryLabel":"圖形與遊戲"},{"id":"303","title":"Build a responsive camera app that launches quickly","gloss":"打造啟動快速且反應靈敏的相機 App","gloss_en":"Build a responsive camera app that launches quickly","category":"other","categoryLabel":"其他"},{"id":"341","title":"Support the Center Stage front camera in your iOS app","gloss":"在 iOS App 中支援人物居中前置鏡頭","gloss_en":"Support the Center Stage front camera in your iOS app","category":"other","categoryLabel":"其他"},{"id":"215","title":"Get started with the HTML Model Element","gloss":"開始使用 HTML model 元素","gloss_en":"Getting started with the HTML model element","category":"graphics","categoryLabel":"圖形與遊戲"},{"id":"252","title":"Design no-code games with Reality Composer Pro 3","gloss":"用 Reality Composer Pro 3 設計無程式碼遊戲","gloss_en":"Design no-code games with Reality Composer Pro 3","category":"graphics","categoryLabel":"圖形與遊戲"}]}</script>
