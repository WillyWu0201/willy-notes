<script id="d" type="application/json">{"s":{"id":"391","title":"Offer subscriptions to groups and organizations","gloss":"向群組與組織提供訂閱","category":"appstore","categoryLabel":"App Store","duration":476,"url":"https://developer.apple.com/videos/play/wwdc2026/391/","takeaway":"用 Group Purchases 讓單一付款人為整個群組或組織購買訂閱，觸及更多客戶。","chapters":[[0,"Introduction"],[137,"Availability"],[204,"Pricing"],[283,"Purchasing"],[325,"Seat Management"],[326,"Next steps"]],"points":[{"text":"**Group Purchases** 讓一位付款人為群組或組織購買訂閱，拓展面向團隊與機構的客群。","hot":true},{"text":"說明此功能的**適用範圍（Availability）**與可採用的情境。","hot":false},{"text":"涵蓋群組訂閱的**定價（Pricing）與購買（Purchasing）**流程。","hot":false},{"text":"提供**席次管理（Seat Management）**，讓購買者分配與管理成員名額。","hot":false}],"apis":["StoreKit"],"audience":"想把訂閱**販售給團隊、企業或機構**的 App Store 開發者與商業團隊。","gloss_en":"Offer subscriptions to groups and organizations","takeaway_en":"Use Group Purchases to let a single payer buy a subscription for an entire group or organization, reaching more customers.","points_en":[{"text":"**Group Purchases** lets one payer buy a subscription for a group or organization, expanding your reach to teams and institutions.","hot":true},{"text":"Explains the **availability** of this feature and the scenarios where you can adopt it.","hot":false},{"text":"Covers the **pricing and purchasing** flow for group subscriptions.","hot":false},{"text":"Provides **seat management** so purchasers can assign and manage member seats.","hot":false}],"audience_en":"App Store developers and business teams who want to **sell subscriptions to teams, enterprises, or institutions**.","summary":["本場由 Apple 商務團隊的 Andrew 主講,說明如何把訂閱販售給群組與組織。訂閱已成為持續提供價值的重要方式,但有時訂閱者希望讓自己的社交群組、團隊或公司一起使用你的 app(例如公司想替剪輯團隊購買影片軟體,或跑步社團想互相督促)。為此 Apple 推出兩條全新途徑:在 app 內進行的 **Group Purchases**,以及透過 **Apple Business Manager** 與 **Apple School Manager** 的 **volume purchasing**(大量採購)。前者適合小型團隊或社交群組,後者則適合具規模與管理、身分需求的組織,可用既有的 device management service 以分配 app 的相同流程指派席次。","在可用性方面,這些新選項適用於所有使用 **StoreKit 2** 的自動續訂訂閱,對多數新舊訂閱預設為開啟;若訂閱已啟用 **Family Sharing**,則預設為退出(opted-out),讓你自行掌控兩種選項如何運作。你可在 **App Store Connect** 中調整,例如讓某訂閱僅在 Apple School Manager 上架以針對驗證過的教育機構制定特定價格,或完全關閉對群組與組織的販售(但仍可賣給個人)。","在定價上,預設每個席次以 App Store Connect 的現行價格出售;若要提供大量折扣,可使用全新的 **volume pricing** 配置,最多設定 5 個價格區間(price bands),完全掌控每個區間所需數量與價格。講者以三個區間為例:前 20 席每月每席 $19.99、第 21–40 席降為 $13.99、第 41 席以上為 $10.99,在購買 50 席的情境下平均每席約比基礎價降低 20%,藉此鼓勵買方涵蓋更大群組並整合採購。","在購買與席次管理上,**volume purchasing** 由 Apple Business/School Manager 顯示訂閱並處理購買,你只需確保訂閱對組織開放;**group purchases** 則由你自建 app 內 UI 觸發 **StoreKit 2** 購買流程,取得所需席次數後傳入購買請求。購買完成後,volume purchasing 由組織透過 device management service 指派席次,group purchases 則產生 **邀請連結** 供初始購買者分享。預設提供內建的席次管理系統(處理邀請連結、追蹤接受與指派、以及取消等生命週期);若已有自家系統,則可透過新的 **App Store Server API** 端點整合自訂邀請流程與群組成員查詢。"],"deepdive":[{"t":0,"title":"Introduction","body":"Apple 商務團隊的 **Andrew** 說明訂閱是持續提供價值的好方式,但訂閱者有時希望讓社交群組、團隊或公司一起使用 app。為此 Apple 推出兩條購買與管理途徑:在 app 內的 **Group Purchases**(如同今日的 in-app purchase,但一次購買多個席次,再以邀請連結分享),以及透過 **Apple Business Manager** 與 **Apple School Manager** 的 **volume purchasing**,讓組織以分配 app 的相同工作流程,經 device management service 大規模指派席次。"},{"t":137,"title":"Availability","body":"這些新選項適用於所有使用 **StoreKit 2** 的自動續訂訂閱,對多數新舊訂閱預設開啟;若已啟用 **Family Sharing** 則預設退出,讓你掌控兩者如何並存。在 **App Store Connect** 中可調整:例如讓訂閱僅於 **Apple School Manager** 上架以針對驗證過的教育機構制定價格,或完全關閉對群組與組織的販售(此時仍可賣給個人)。"},{"t":204,"title":"Pricing","body":"預設每個席次以現行價格出售;要提供大量折扣可使用新的 **volume pricing**,最多設 5 個價格區間並完全掌控數量門檻與價格。講者示範三個區間:前 20 席每月每席 **$19.99**、第 21–40 席 **$13.99**、第 41 席以上 **$10.99**;在 50 席的購買情境下平均每席約比基礎價降低 **20%**,藉此鼓勵買方涵蓋更大群組並整合採購,設定直接在 App Store Connect 完成。"},{"t":283,"title":"Purchasing","body":"**volume purchasing** 由 Apple Business/School Manager 顯示訂閱並處理購買,你只需確保訂閱對組織開放。**group purchases** 則需自建 app 內 UI 觸發 **StoreKit 2** 購買流程,並在 merchandising 中凸顯群組購買的價值,接著取得顧客所需的席次數,傳入 StoreKit 2 購買請求。"},{"t":325,"title":"Seat Management","body":"購買後,**volume purchasing** 由組織透過 device management service 以指派 app 的相同方式分配席次,適合大規模且確保由組織擁有與管理;**group purchases** 則為初始購買者產生 **邀請連結** 供分享。當任一類型完成指派,App Store 會為每位成員建立交易,你便可授予存取權。"},{"t":326,"title":"Next steps","body":"預設的內建席次管理系統會處理邀請連結產生、成員接受與指派追蹤,以及取消等生命週期管理;若已有自家邀請與成員管理系統,可透過新的 **App Store Server API** 端點整合自訂邀請流程,並以群組管理端點查詢單一顧客所屬的所有群組與群組中所有成員。講者最後提醒:務必改用 **StoreKit 2**(這是必要條件),並重新評估可用性、定價策略與可加入的協作體驗。"}],"summary_en":["Presented by Andrew from Apple's commerce team, this session explains how to offer subscriptions to groups and organizations. Subscriptions are a great way to deliver continuous value, but sometimes a subscriber wants to get their social group, team, or company onto your app (for example, a company buying video editing software for its editors, or a run club keeping each other accountable). To address this, Apple introduces two new paths: **Group Purchases** made within your app, and **volume purchasing** through **Apple Business Manager** and **Apple School Manager**. The former suits small teams or social groups, while the latter suits organizations with scale and management/identity needs, who can assign seats through the same device management service workflows they already use to distribute apps.","On availability, these options apply to all auto-renewable subscriptions using **StoreKit 2** and are on by default for most new and existing subscriptions; if a subscription has **Family Sharing** enabled it is opted-out by default so you control how the two work together. You can adjust this in **App Store Connect**, for example making a subscription available only on Apple School Manager to create plans with specific pricing for verified educational institutions, or turning off selling to groups and organizations entirely (while still selling to individuals).","For pricing, every seat sells at the current App Store Connect price by default; to offer bulk discounts you can use the new **volume pricing** configuration with up to 5 price bands and full control over quantities and prices. The presenter's example uses three bands: $19.99 per seat per month for the first 20 seats, $13.99 for seats 21–40, and $10.99 for seat 41 and above, so a 50-seat purchase brings the average cost per seat down about 20% from the base price, incentivizing buyers to cover larger groups and consolidate purchasing.","For purchasing and seat management, **volume purchasing** has Apple Business/School Manager display the subscriptions and handle the purchase, so you only need to make the subscription available to organizations; **group purchases** require your own in-app UI to trigger the **StoreKit 2** purchase flow, passing in the requested seat count. After purchase, volume purchasing lets the organization assign seats via a device management service, while group purchases generate an **invitation link** for the initial purchaser to share. A built-in seat management system handles invitation links, acceptance/assignment tracking, and lifecycle events like cancellations by default; if you already have your own system, you can integrate custom invitation flows and query group membership through new **App Store Server API** endpoints."],"deepdive_en":[{"t":0,"title":"Introduction","body":"**Andrew** from Apple's commerce team explains that subscriptions are a great way to deliver continuous value, but subscribers sometimes want their social group, team, or company on the app. Apple introduces two paths to purchase and manage: **Group Purchases** within the app (like an in-app purchase today, but buying multiple seats and sharing an invite link), and **volume purchasing** through **Apple Business Manager** and **Apple School Manager**, where organizations assign seats at scale via a device management service using the same workflows they use to distribute apps."},{"t":137,"title":"Availability","body":"These options apply to all auto-renewable subscriptions using **StoreKit 2** and are on by default for most new and existing subscriptions; if **Family Sharing** is enabled they are opted-out by default so you control how both coexist. In **App Store Connect** you can adjust this, for example making a subscription available only on **Apple School Manager** to price for verified educational institutions, or turning off selling to groups and organizations entirely (while still selling to individuals)."},{"t":204,"title":"Pricing","body":"By default every seat sells at the current price; to offer bulk discounts you can use the new **volume pricing** with up to 5 price bands and full control over quantity thresholds and prices. The presenter demonstrates three bands: **$19.99** per seat per month for the first 20 seats, **$13.99** for seats 21–40, and **$10.99** for seat 41 and above; for a 50-seat purchase the average per-seat cost drops about **20%** from the base price, encouraging buyers to cover larger groups and consolidate purchasing, all configured in App Store Connect."},{"t":283,"title":"Purchasing","body":"**volume purchasing** has Apple Business/School Manager display the subscriptions and handle the purchase, so you just need to make the subscription available to organizations. **group purchases** require building your own in-app UI to trigger the **StoreKit 2** purchase flow, highlighting the value of a group purchase during merchandising, then getting the customer's requested seat count and passing it into the StoreKit 2 purchase request."},{"t":325,"title":"Seat Management","body":"After purchase, **volume purchasing** lets the organization assign seats via a device management service the same way they assign apps, ideal for large scale and ensuring org ownership; **group purchases** generate an **invitation link** for the initial purchaser to share. When assignments complete from either type, the App Store assigns a transaction for each member so you can grant them access."},{"t":326,"title":"Next steps","body":"The default built-in seat management system handles invitation link generation, member acceptance and assignment tracking, and lifecycle management like cancellations; if you already have your own invitation and member system, you can integrate custom invitation flows via new **App Store Server API** endpoints and use group management endpoints to query all groups a customer is in and all members in a group. The presenter closes by urging developers to move to **StoreKit 2** (a requirement) and to reconsider availability, pricing strategy, and collaborative experiences they could add."}],"code":[]},"related":[{"id":"210","title":"What’s new in Apple In-App Purchase","gloss":"Apple App 內購買的新功能","gloss_en":"What's new in Apple In-App Purchase","category":"appstore","categoryLabel":"App Store"},{"id":"309","title":"Explore Retention Messaging in App Store Connect","gloss":"探索 App Store Connect 的挽留訊息","gloss_en":"Explore Retention Messaging in App Store Connect","category":"appstore","categoryLabel":"App Store"},{"id":"378","title":"Unlock in-game content with StoreKit and Background Assets","gloss":"用 StoreKit 與 Background Assets 解鎖遊戲內容","gloss_en":"Unlock in-game content with StoreKit and Background Assets","category":"appstore","categoryLabel":"App Store"},{"id":"205","title":"Enhance your presence on the App Store","gloss":"強化你在 App Store 上的呈現","gloss_en":"Enhance your presence on the App Store","category":"appstore","categoryLabel":"App Store"},{"id":"261","title":"Build, deliver, and automate with Xcode Cloud","gloss":"用 Xcode Cloud 建置、交付與自動化","gloss_en":"Build, deliver, and automate with Xcode Cloud","category":"appstore","categoryLabel":"App Store"}]}</script>
