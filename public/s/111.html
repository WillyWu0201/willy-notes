<script id="d" type="application/json">{"s":{"id":"111","title":"Keynote (ASL)","gloss":"主題演講(美國手語版)","category":"other","categoryLabel":"其他","duration":4574,"url":"https://developer.apple.com/videos/play/wwdc2026/111/","takeaway":"WWDC26 開場主題演講,一次揭曉今年 Apple 各平台軟體與技術的重點走向,適合先看完掌握全貌再深入個別 session。","chapters":[[0,"Introduction"],[304,"Platform improvements"],[1016,"Trust and safety"],[1673,"Apple Intelligence and Siri"]],"points":[{"text":"**Keynote** 是 WWDC26 的開場,揭曉今年最新的 Apple 軟體與技術方向。","hot":false},{"text":"「**Platform improvements**」章節涵蓋各平台(iOS / iPadOS / macOS 等)的整體更新。","hot":false},{"text":"「**Trust and safety**」聚焦隱私、安全與使用者信任相關的新功能。","hot":false},{"text":"「**Apple Intelligence and Siri**」是壓軸,呈現 AI 與 Siri 的最新進展。","hot":true},{"text":"本場為 **ASL(美國手語)** 版本,內容與標準 Keynote 相同。","hot":false}],"apis":[],"audience":"**所有想一次掌握 WWDC26 全貌的開發者**,看完再依興趣深入各專門 session。","gloss_en":"Keynote (American Sign Language)","takeaway_en":"The WWDC26 opening keynote reveals this year's direction for Apple's software and technologies across all platforms—watch it first to get the big picture before diving into individual sessions.","points_en":[{"text":"The **Keynote** opens WWDC26, revealing this year's latest Apple software and technology direction.","hot":false},{"text":"The \"**Platform improvements**\" chapter covers the overall updates across each platform (iOS / iPadOS / macOS, etc.).","hot":false},{"text":"\"**Trust and safety**\" focuses on new features around privacy, security, and user trust.","hot":false},{"text":"\"**Apple Intelligence and Siri**\" is the finale, showcasing the latest advances in AI and Siri.","hot":true},{"text":"This is the **ASL (American Sign Language)** version, with the same content as the standard Keynote.","hot":false}],"audience_en":"**Any developer who wants to grasp the full picture of WWDC26 in one go**, then dive into the specialized sessions based on their interests.","summary":["這是 WWDC26 的 **Keynote（ASL 美國手語版）**，也是整場開發者大會的開場主軸演說，向開發者與一般觀眾揭曉 Apple 最新的軟體與技術方向。由於這是手語呈現的版本，沒有逐字稿可供分析，本篇內容依官方章節與描述歸納主題脈絡。","從章節結構看，演說涵蓋四大段落：先以 **Platform improvements**（平台改進）說明 iOS、iPadOS、macOS 等各平台的更新；接著進入 **Trust and safety**（信任與安全），談隱私與安全相關的政策與功能；最後以 **Apple Intelligence and Siri** 收尾，呈現 Apple 在裝置端與雲端 AI 能力以及全新 Siri 體驗的進展。","對開發者而言，Keynote 是掌握當年度技術風向的起點：平台層級的新框架與設計語言、隱私與安全的預設要求，以及 **Apple Intelligence** 帶來的智慧功能，往往是後續各場技術 session 深入展開的源頭。建議搭配當年度的 Platforms State of the Union 與各專場一併觀看，才能把這裡點到的方向落實到實際開發。"],"deepdive":[{"t":0,"title":"Introduction","body":"Keynote 的開場引言，揭開整場大會的主題與節奏。這是 **ASL 美國手語版**，以手語方式呈現給觀眾，因此沒有逐字稿；定位上是 Apple 一年一度向全球開發者與使用者揭曉新軟體與新技術的核心演說。"},{"t":304,"title":"Platform improvements","body":"聚焦各 **平台層級的改進**，涵蓋 iOS、iPadOS、macOS 等系統的新功能與體驗更新。這一段通常會帶出當年度的設計語言走向與系統能力，是後續各專場技術 session 展開的基礎。"},{"t":1016,"title":"Trust and safety","body":"談 **信任與安全**，呈現 Apple 在隱私保護、安全機制與使用者資料處理上的立場與新措施。這些原則往往會轉化為開發者必須遵循的預設要求與 API 行為。"},{"t":1673,"title":"Apple Intelligence and Siri","body":"以 **Apple Intelligence** 與全新 **Siri** 體驗作結，展示 Apple 在裝置端與雲端的智慧能力進展。對開發者而言，這通常預示著可在 app 中整合的智慧功能與相關框架更新。"}],"summary_en":["This is the WWDC26 **Keynote (ASL, American Sign Language version)**, the main opening address of the conference, revealing Apple's latest software and technologies to developers and the broader audience. Because this is the signed version, there is no transcript to analyze; the notes below are grounded in the official chapter structure and description.","The structure points to four major segments: it opens with **Platform improvements** covering updates across iOS, iPadOS, macOS and other platforms; moves into **Trust and safety**, addressing privacy and security policies and features; and closes with **Apple Intelligence and Siri**, showcasing Apple's on-device and cloud AI capabilities along with the new Siri experience.","For developers, the Keynote is the starting point for reading the year's technical direction: platform-level frameworks and design language, privacy and security defaults, and the intelligent features unlocked by **Apple Intelligence** are typically expanded on in the dedicated technical sessions that follow. Pair it with the Platforms State of the Union and the topic-specific talks to turn these directions into real implementation."],"deepdive_en":[{"t":0,"title":"Introduction","body":"The opening of the Keynote sets the theme and pacing for the whole conference. This is the **ASL (American Sign Language) version**, presented in sign language, so there is no transcript; it is Apple's annual flagship address revealing new software and technologies to developers and users worldwide."},{"t":304,"title":"Platform improvements","body":"Focuses on **platform-level improvements** across iOS, iPadOS, macOS and other systems, covering new features and experience updates. This segment typically surfaces the year's design-language direction and system capabilities that later technical sessions build upon."},{"t":1016,"title":"Trust and safety","body":"Covers **trust and safety**, presenting Apple's stance and new measures around privacy protection, security mechanisms and user data handling. These principles often translate into default requirements and API behaviors developers must follow."},{"t":1673,"title":"Apple Intelligence and Siri","body":"Closes with **Apple Intelligence** and the new **Siri** experience, demonstrating Apple's on-device and cloud intelligence progress. For developers this usually previews intelligent features and related frameworks that can be integrated into apps."}],"code":[]},"related":[{"id":"101","title":"Keynote","gloss":"主題演講","gloss_en":"Keynote","category":"other","categoryLabel":"其他"},{"id":"102","title":"Platforms State of the Union","gloss":"平台現況報告","gloss_en":"Platforms State of the Union","category":"other","categoryLabel":"其他"},{"id":"112","title":"Platforms State of the Union (ASL)","gloss":"平台現況報告（美國手語版）","gloss_en":"Platforms State of the Union (American Sign Language)","category":"other","categoryLabel":"其他"},{"id":"122","title":"WWDC2
