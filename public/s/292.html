<script id="d" type="application/json">{"s":{"id":"292","title":"Design intuitive search experiences","gloss":"設計直覺的搜尋體驗","category":"design","categoryLabel":"設計","duration":977,"url":"https://developer.apple.com/videos/play/wwdc2026/292/","takeaway":"從搜尋欄的呈現、放置位置到最佳實務,設計讓人快速找到內容的直覺搜尋體驗。","chapters":[[0,"Introduction"],[99,"Search field"],[172,"Patterns and placement"],[630,"Best practices"],[920,"Next steps"]],"points":[{"text":"探討在 App 中實作搜尋的**新模式與最佳實務**,讓搜尋在「幫人找到內容」上扮演關鍵角色。","hot":true},{"text":"**Search field(搜尋欄)**:說明搜尋欄本身的設計與呈現方式。","hot":false},{"text":"**Patterns and placement(模式與放置)**:這是最長的章節,聚焦搜尋入口要放在哪、用何種模式呈現。","hot":false},{"text":"**Best practices(最佳實務)**:歸納設計搜尋體驗時應遵循的原則。","hot":false},{"text":"整體偏**設計導向**,著重使用者如何更快速、直覺地找到所需內容。","hot":false}],"apis":[],"audience":"**負責 App 搜尋體驗的設計師與產品團隊,想了解搜尋入口的擺放與互動模式。**","gloss_en":"Design intuitive search experiences","takeaway_en":"From how the search field is presented to where it's placed and the best practices, design intuitive search experiences that help people find content fast.","points_en":[{"text":"Explores **new patterns and best practices** for implementing search in your app, where search plays a key role in helping people find content.","hot":true},{"text":"**Search field**: covers the design and presentation of the search field itself.","hot":false},{"text":"**Patterns and placement**: the longest chapter, focused on where to put the search entry point and which patterns to present it with.","hot":false},{"text":"**Best practices**: distills the principles to follow when designing search experiences.","hot":false},{"text":"Overall it's **design-oriented**, emphasizing how users can find what they need more quickly and intuitively.","hot":false}],"audience_en":"**Designers and product teams responsible for an app's search experience who want to understand search entry-point placement and interaction patterns.**","summary":["這場由 Apple Design 團隊主講，主題是如何設計直覺的 **search（搜尋）** 體驗。搜尋是使用者開啟 app 時最常尋找的功能，能讓人不必花時間翻找就直達所需內容；隨著 app 內容愈來愈豐富，一個好的搜尋設計變得格外重要。配合 **Liquid Glass**，iOS 推出更符合人因的新搜尋模式，並充分善用 iPad 與 Mac 的大螢幕。","Apple 提供的 **Search Field** 元件內含使用者已習慣的核心元素：前導的放大鏡 **Search icon**、placeholder 提示文字、輸入後出現的 **clear button**，以及 iOS 上 focus 時出現、可退出搜尋並收起鍵盤的 **Cancel button**。Search Field 會依放置位置自動採用正確呈現樣式——放在 Toolbar 用 glass、放在捲動區則用標準內容樣式。若 app 有自家品牌圖示，務必保留搜尋的核心元素，自訂圖示也要貼近原本符號，因為放大鏡已是全球公認的搜尋象徵。","在版面模式上，**放置位置直接影響 focus 後欄位的動畫去向**。iOS 上搜尋可放在底部 Toolbar（最符合可及性、focus 時欄位上浮到鍵盤之上，如 Mail）、頂部 Toolbar（底部被 sheet 佔據時，如 Stocks）、tab bar 中的 **Search Tab**（標準 tab 進入 landing page，或 prominent 按鈕樣式立即叫出鍵盤如 Phone），或直接 inline 在內容中（範圍限定於該分頁，如 Apple Music 資料庫）。iPad 與 Mac 共用相近的導覽模型，建議兩者體驗盡量一致：主要搜尋可放在 Toolbar 的 trailing 位置（Split View 如 Mail、Files）、sidebar 頂部（過濾 sidebar 內容如 Settings、Stocks），或專屬的 Search Tab／section。","最佳實務聚焦於降低摩擦：focus 時即顯示 **recent searches**（並允許滑動或標頭按鈕清除），輸入時盡快顯示結果並整合 **predictive suggestions**（在視覺上區分使用者輸入與預測補完）。過濾方面，由廣到窄，輕量過濾用 **scope bar**（如 Mail 切換信箱），多類別用情境相關的 filters（如 Maps），或用 **search tokens** 以接近自然語言的方式組合條件（如 Photos 看「2021 年 Joshua Tree」的照片）——但 token 較不易被發現，不應取代可見的過濾 UI。最後要優雅地處理無結果：用 **content unavailable view** 顯示搜尋符號、標題與副標，並帶出目前搜尋字串以利使用者發現拼字錯誤。"],"deepdive":[{"t":0,"title":"Introduction","body":"Apple Design 團隊的 Rob 開場，定位 **search** 是幫助人們尋找、導覽與探索內容最重要的工具之一，讓使用者擁有直達所需、不必花時間翻找的「超能力」。搜尋常是開啟 app 後第一個被尋找的功能（如 Pages 找文件、Apple TV 找電影、Apple Music 探索新歌手）。配合 **Liquid Glass**，iOS 推出更符合人因的新搜尋模式，並善用 iPad 與 Mac 的大螢幕。"},{"t":99,"title":"Search field","body":"Apple 提供的 **Search Field** 元件包含使用者期待的核心元素：建立搜尋視覺識別的前導放大鏡 icon、placeholder 提示文字、輸入後出現的 clear button，以及 iOS 上 focus 時出現、可退出搜尋並收起鍵盤的 **Cancel button**。欄位會依放置位置自動採用正確樣式——在 Toolbar 用 **glass**、在捲動區用標準內容樣式。若 app 有自家品牌圖示，須保留核心元素且自訂圖示要貼近原符號，因為放大鏡已是公認的搜尋象徵。"},{"t":172,"title":"Patterns and placement","body":"本段概觀各種搜尋版面，核心觀念是**放置位置直接決定 focus 後欄位動畫的去向**。iOS 上：底部 Toolbar 最符合可及性，欄位 focus 時上浮到鍵盤之上（如 Mail，寬度依相鄰項目自動調整，項目過多時可先當按鈕再展開成欄位）；底部被 sheet 佔據時改放頂部 Toolbar（如 Stocks）。Tabbed app 建議建立單一 **Search Tab** 作為主要入口：標準 tab 會進到帶建議內容的 landing page（適合探索型，如 Apple TV 先呈現分類），prominent 按鈕樣式則立即叫出鍵盤（適合明確目標，如 Phone）；也可把搜尋直接 inline 於內容以限定範圍（如 Apple Music 只搜資料庫）。iPad 與 Mac 導覽相近、建議體驗一致：主要欄位可放 Toolbar 的 trailing 位置（Split View 如 Mail、Notes、Files，或結果出現在 detail view 如 Freeform）、sidebar 頂部（過濾 sidebar 內容如 Settings、Stocks），或專屬 Search Tab／section（多區塊 app 如 Apple Music）。"},{"t":630,"title":"Best practices","body":"降低摩擦的關鍵實務：focus 時顯示 **recent searches**（iOS inline、iPad/Mac 在 Toolbar/Sidebar 用選單或在 Search Tab 與建議並列），可選擇性只顯示使用者實際看過或互動過的結果，並允許滑動或標頭按鈕清除。輸入時盡快顯示結果並整合 **predictive suggestions**，在視覺上區分使用者輸入與預測補完並限制數量。過濾由廣到窄：輕量用 **scope bar**（如 Mail 切換信箱）、多類別用情境相關 filters（如 Maps）、或用 **search tokens** 以近自然語言組合條件（如 Photos 的「2021 年 Joshua Tree」），但 token 較不易發現、不應取代可見的過濾 UI，與 scope bar 搭配最佳。無結果時用 **content unavailable view** 顯示搜尋符號、標題與副標，並帶出目前搜尋字串以利發現拼字錯誤。"},{"t":920,"title":"Next steps","body":"結尾鼓勵開發者檢視自家 app 的機會：是否有可把搜尋移到底部以提升可及性之處？tabbed app 是否該加入 **Search Tab**？是否充分運用 suggestions 與 filters 讓搜尋更不費力？並建議參閱 **Human Interface Guidelines**、design resources，以及往年的設計系統相關場次延伸學習。"}],"summary_en":["Presented by the Apple Design team, this session is about designing an intuitive **search** experience. Search is one of the most important tools for helping people find, navigate, and discover content, giving users the superpower of getting straight to what they need without frustration; as apps offer ever-richer content, great search design matters more than ever. With **Liquid Glass**, iOS introduces new, more ergonomic search patterns and takes fuller advantage of the larger displays on iPad and Mac.","Apple's **Search Field** component includes the core elements people expect: a leading magnifying-glass **Search icon**, placeholder text, a **clear button** once text is entered, and on iOS a **Cancel button** when focused that exits search and dismisses the keyboard. The field automatically adopts the right presentation for its placement—glass in a Toolbar, standard content styling in a scroll region. If your app has its own brand iconography, keep the core search elements intact and make custom icons closely resemble the originals, since the magnifying glass is universally recognized as search.","For placement, **where you put search directly impacts where the field animates when active**. On iOS, search can live in the bottom Toolbar (most ergonomic, animating up over the keyboard, as in Mail), the top Toolbar (when the bottom is occupied by a sheet, as in Stocks), a **Search Tab** in the tab bar (a standard tab leading to a landing page, or a prominent button that immediately raises the keyboard, as in Phone), or inline in content to scope search to that section (as in the Apple Music library). iPad and Mac share similar navigation models and should be kept aligned: place the primary field in the trailing Toolbar position (Split View apps like Mail and Files), at the top of the sidebar (to filter sidebar content, as in Settings and Stocks), or in a dedicated Search Tab or section.","Best practices focus on reducing friction: show **recent searches** on focus (and let people clear them via swipe or a header button), show results quickly on typing, and integrate **predictive suggestions** (visually distinguishing user input from the predicted completion). For filtering, start broad and narrow: use a **scope bar** for lightweight filtering (Mail switching mailboxes), contextual filters for multiple categories (Maps), or **search tokens** to combine criteria in near-natural language (Photos showing \"Joshua Tree in 2021\")—but tokens are less discoverable and shouldn't replace visible filter UI. Finally, fail gracefully with a **content unavailable view** showing a search symbol, title, and subtitle, surfacing the current query so users can catch typos."],"deepdive_en":[{"t":0,"title":"Introduction","body":"Apple Design team's Rob opens by positioning **search** as one of the most important tools for finding, navigating, and discovering content, giving users the superpower of reaching exactly what they need without wasting time. Search is often the first thing people look for when opening an app (getting back to a Pages document, finding a movie on Apple TV, exploring artists in Apple Music). With **Liquid Glass**, iOS introduces more ergonomic search patterns and takes fuller advantage of iPad and Mac displays."},{"t":99,"title":"Search field","body":"Apple's **Search Field** component includes the elements people expect: a leading magnifying-glass icon that visually establishes the UI as search, placeholder text, a clear button once text is entered, and on iOS a **Cancel button** when focused that exits search and dismisses the keyboard. The field automatically adopts the correct styling for its placement—**glass** in a Toolbar, standard content styling in a scroll region. If your app has its own brand iconography, keep the core elements intact and make custom icons closely resemble the originals, since the magnifying glass is universally recognized as search."},{"t":172,"title":"Patterns and placement","body":"This section surveys search layouts, with the core idea that **placement directly determines where the field animates when active**. On iOS: the bottom Toolbar is most ergonomic, floating the field up over the keyboard (as in Mail, with width adapting to adjacent items and the option to start as a button then expand when there are many items); when the bottom is occupied by a sheet, use the top Toolbar (as in Stocks). Tabbed apps should create a single **Search Tab** as the primary entry point: a standard tab leads to a landing page with helpful suggestions (good for exploratory use, as Apple TV surfaces genres first), while a prominent button appearance immediately raises the keyboard (good for known intent, as in Phone); search can also be placed inline in content to scope it (as Apple Music searches only the library). iPad and Mac have similar navigation and should stay aligned: place the primary field in the trailing Toolbar position (Split View apps like Mail, Notes, Files, or where results appear in the detail view as in Freeform), at the top of the sidebar (to filter sidebar content as in Settings and Stocks), or in a dedicated Search Tab or section (multi-section apps like Apple Music)."},{"t":630,"title":"Best practices","body":"Key friction-reducing practices: show **recent searches** on focus (inline on iOS; in a menu in the Toolbar/Sidebar on iPad/Mac, or alongside suggestions in a Search Tab), optionally surfacing only results the user actually viewed or engaged with, and letting people clear them via swipe or a header button. On typing, show results quickly and integrate **predictive suggestions**, visually distinguishing user input from the predicted completion and limiting their number. Filter from broad to narrow: a **scope bar** for lightweight filtering (Mail switching mailboxes), contextual filters for multiple categories (Maps), or **search tokens** to combine criteria in near-natural language (Photos' \"Joshua Tree in 2021\")—but tokens are less discoverable, shouldn't replace visible filter UI, and pair well with a scope bar. When there are no results, use a **content unavailable view** showing a search symbol, title, and subtitle, surfacing the current query so users can catch typos."},{"t":920,"title":"Next steps","body":"The session closes by encouraging developers to look for opportunities in their own apps: are there places to move search to the bottom for reachability? Would a tabbed app benefit from a **Search Tab**? Are you leveraging suggestions and filters to make search feel effortless? It points to the **Human Interface Guidelines**, design resources, and prior-year design-system talks for going deeper."}],"code":[]},"related":[{"id":"220","title":"Refine accessibility for custom controls","gloss":"為自訂控制項優化無障礙體驗","gloss_en":"Refine accessibility for custom controls","category":"design","categoryLabel":"設計"},{"id":"250","title":"Principles of great design","gloss":"卓越設計的原則","gloss_en":"Principles of great design","category":"design","categoryLabel":"設計"},{"id":"251","title":"Communicate your brand identity on iOS","gloss":"在 iOS 上傳達品牌識別","gloss_en":"Communicate your brand identity on iOS","category":"design","categoryLabel":"設計"},{"id":"290","title":"Craft clear names for features and labels in your app","gloss":"為 App 的功能與標籤取清楚的名稱","gloss_en":"Craft clear names for features and labels in your app","category":"design","categoryLabel":"設計"},{"id":"8005","title":"Accessibility Technologies Group Lab","gloss":"無障礙技術小組實驗室","gloss_en":"Accessibility Technologies Group Lab","category":"design","categoryLabel":"設計"}]}</script>
