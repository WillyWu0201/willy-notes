<script id="d" type="application/json">{"s":{"id":"325","title":"Dive into Core AI model authoring and optimization","gloss":"深入 Core AI 模型編寫與最佳化","category":"ai","categoryLabel":"AI 與機器學習","duration":1761,"url":"https://developer.apple.com/videos/play/wwdc2026/325/","takeaway":"用全新的 Core AI 框架走完自訂模型部署流程:從 PyTorch 轉換、最佳化、除錯,到寫自訂 Metal kernel 與重新編寫模型,部署到 Apple silicon。","chapters":[[0,"Introduction"],[109,"Models and skills"],[207,"Python workflow"],[242,"Convert, optimize and run inference with Core AI"],[354,"Model optimization"],[640,"Core AI Debugger"],[1167,"Advanced authoring"],[1243,"Custom Metal kernels"],[1272,"Define a SiLU Metal kernel with PyTorch reference"],[1329,"Use a custom Metal kernel and convert with TorchConverter"],[1381,"Model re-authoring"],[1726,"Next steps"]],"points":[{"text":"全新 **Core AI 框架**提供 Apple silicon 上**完整的自訂模型部署工作流**。","hot":true},{"text":"**Python 工作流**:用 torch.export 匯出模型,再以 coreai_torch.TorchConverter 轉成 Core AI 並 optimize()、存成 .aimodel。","hot":false},{"text":"在裝置端以 **AIModel.load 載入 .aimodel**、load_function 取得函式並執行 inference(NDArray 輸入)。","hot":false},{"text":"提供 **Core AI Debugger** 協助檢視與診斷模型,並有 model optimization 段落講最佳化技巧。","hot":false},{"text":"進階可寫**自訂 Metal kernel(TorchMetalKernel,如 fused SiLU)**,經 register_custom_kernels 把 MSL 整合進 asset,並支援 model re-authoring。","hot":false}],"apis":["Core AI","coreai","coreai_torch","TorchConverter","AIModel","NDArray","torch.export","TorchMetalKernel","MetalParameter","Metal"],"audience":"**要把自訂機器學習模型最佳化並部署到 Apple silicon、熟悉 PyTorch 的 ML 工程師。**","gloss_en":"Dive into Core AI model authoring and optimization","takeaway_en":"Walk through the full custom model deployment workflow with the new Core AI framework: from PyTorch conversion, optimization, and debugging to writing custom Metal kernels and re-authoring models, deployed to Apple silicon.","points_en":[{"text":"The new **Core AI framework** provides a **complete custom model deployment workflow** on Apple silicon.","hot":true},{"text":"**Python workflow**: export the model with torch.export, then convert it to Core AI with coreai_torch.TorchConverter, optimize(), and save as .aimodel.","hot":false},{"text":"On device, **load the .aimodel with AIModel.load**, get a function with load_function, and run inference (with NDArray inputs).","hot":false},{"text":"Provides the **Core AI Debugger** to help inspect and diagnose models, plus a model optimization section covering optimization techniques.","hot":false},{"text":"For advanced cases, write a **custom Metal kernel (TorchMetalKernel, such as a fused SiLU)**, integrate the MSL into the asset via register_custom_kernels, and support model re-authoring.","hot":false}],"audience_en":"**ML engineers familiar with PyTorch who need to optimize and deploy custom machine learning models to Apple silicon.**","summary":["這場由 Core AI 團隊的 Sachin 與 Nicole 主講，聚焦 **Core AI** 的 Python 生態系，帶你把自訂模型完整部署到 Apple Silicon——從轉換、最佳化、除錯到進階改寫。Core AI 是涵蓋整個模型部署生命週期的技術套件；本場介紹各種 Python 函式庫與工具，以及全新的 **Core AI Debugger**。若你用過 **Core ML**，整套以 Python／**PyTorch** 為中心的流程會相當熟悉。","起點是 **coreai-models** 開源儲存庫，內含可直接執行 LLM 的 Swift package、各種使用情境的範例模型、可重用元件，以及一組 **Core AI skills**——把這些 skills 裝進你的 coding assistant，就能像專家一樣上手 Core AI（本場多數程式碼正是與 agent 協作產出）。基本流程以 `pip install coreai-torch` 安裝後，把 PyTorch 的 **exported program**（`torch.export`）交給 **TorchConverter** 轉成 Core AI program，再 `optimize()` 並存成可在 Apple Silicon 執行的 **.aimodel** asset，最後直接從 Python 載入 function 做推論。","最佳化以 **coreai-opt** 進行 config-driven 壓縮，支援 int4／int8／FP4／FP8 與彈性 granularity，也提供校準資料或 quantization aware training 的量化 API。講者以 8.5 億參數的 **SAM3** 影像分割模型示範，用 `presets.w4`（4-bit per-channel）把 3GB 模型壓到約 430MB，但有一朵被遮蔽的花漏偵測了——問題出在對每一層都套用同樣激進壓縮。接著 Nicole 用 **Core AI Debugger** 這個獨立 app 把模型以圖形化結構檢視、在真實硬體上執行，並透過新的 **save intermediates** API 與 baseline 比對 **PSNR**，找出大量低分 sync point 集中在只占 4% 參數的 detector decoder，於是改成讓量化忽略 detector，便在數分鐘內恢復 baseline 品質且維持小體積。","最後是進階改寫。除了把多個 op **fuse** 成單一 kernel dispatch、沿用 Core AI 內建的快速 primitive（如 Scaled Dot Product Attention），還能用 **custom Metal 4 kernel**：以 MSL 寫 kernel、提供 PyTorch reference，透過 **TorchMetalKernel** 註冊後，MSL 會直接內嵌進 asset 隨模型發行。更進一步的 **model re-authoring** 則為特定目標（尤其 iOS）重寫整個模型——採用 static shapes、channels-first layout、convolutional 投影、KV cache in-place 更新等模式，並輔以嚴謹的單元／整合測試。講者把 SAM3 改寫成 image_encode／text_encode／detect 三個獨立 function，搭配 4-bit palettization 壓縮兩個 encoder、保留未壓縮的 detector，換 prompt 時只需重跑 text encoder 與 detector，第二次推論快了 76%。"],"deepdive":[{"t":0,"title":"Introduction","body":"由 Core AI 工程師 Sachin 開場（稍後 Nicole 加入），說明本場聚焦 **Core AI** 的 Python 生態系，帶你把模型高效部署到 Apple Silicon。Core AI 涵蓋從最佳化、轉換到除錯與整合的完整部署生命週期；你將認識各種 Python 函式庫與工具，以及可成為工作流核心的 **Core AI Debugger**。"},{"t":109,"title":"Models and skills","body":"介紹生態系前沿的 **coreai-models** 開源儲存庫：內含可在 app 中執行 LLM 的 Swift package、針對各種情境工程化的範例模型與可重用元件，以及一組 **Core AI skills**。把這些 skills 裝進你慣用的 coding assistant，它便能依你鎖定的硬體與限制把高階構想轉成清楚的部署計畫，讓你像專家一樣運用 Core AI——本場多數程式碼正是與 agent 協作產出。"},{"t":207,"title":"Python workflow","body":"說明以 **coreai-torch** 為核心的入口：`pip install coreai-torch` 會同時裝上 coreai 與 coreai-torch。你把 PyTorch 的 **exported program** 交給它即可直接轉成 Core AI 模型，並支援把多個模型組成單一 artifact、為特定 op 註冊 custom lowering、內嵌 **Metal 4** kernel，最後 specialize 成最佳化 asset 並完全從 Python 在 Apple Silicon 上執行。"},{"t":242,"title":"Convert, optimize and run inference with Core AI","body":"以一個兩層 linear 加 relu 的 MLP 走過完整流程：先用 **`torch.export`** 傳入模型與 example_input 取得 **exported_program**（含完整計算圖、權重、shapes），再以 **TorchConverter** 搭配 input／output 名稱轉成 core_ai program，`optimize()` 後存成 **.aimodel** asset。要推論只需載入 function 並傳入「名稱對 numpy tensor」的字典即可，整個轉換、最佳化、執行都在 Python 完成。"},{"t":354,"title":"Model optimization","body":"以 8.5 億參數的 **SAM3**（image encoder＋text encoder 占 96% 參數，再加 DETR detector 與 mask decoder）示範 **coreai-opt** 的 config-driven 壓縮，支援 int4／int8／FP4／FP8 與彈性 granularity。轉換 helper 會以 Core AI 的 decomposition table 保留 attention 等高階語意，並可用 coreai-opt 轉 16-bit。baseline 32-bit 模型逾 3GB，用 **`presets.w4`**（EAGER 模式、4-bit per-channel）壓到約 430MB 後，卻有一朵被遮蔽的花漏偵測——因為對每一層都套同樣激進壓縮。"},{"t":640,"title":"Core AI Debugger","body":"Nicole 介紹獨立 app **Core AI Debugger**：可用圖形化檢視模型結構、在真實硬體上執行、並對照 reference run 驗證推論正確性。它以 PyTorch module 分組 operations、structure viewer 顯示連結與執行順序、source viewer 對應原始 Python 行。她用新的 **save intermediates** API 抓取 baseline 各 op 的中間 tensor，再以 **PSNR** 比對 sync point，發現低分集中在僅占 4% 參數的 **detector decoder**，於是改讓量化忽略 detector，數分鐘內恢復 baseline 品質且維持極小體積。"},{"t":1167,"title":"Advanced authoring","body":"Sachin 回來談進階模型改寫：把目光深入到定義輸入到輸出計算圖的 PyTorch source 本身，調整它在硬體上的執行方式。最簡單的形式是把一組 op **fuse** 成單一 kernel dispatch；Core AI 已內建如 **Scaled Dot Product Attention** 等重運算的快速 kernel 與 primitive，範例可在 coreai-models 儲存庫找到。"},{"t":1243,"title":"Custom Metal kernels","body":"若想更高度客製，Core AI 支援 **custom Metal 4 kernel**。流程上為 coreai-torch 加入第二個輸入——以 **MSL（Metal Shading Language）** 撰寫的 kernel 原始碼；converter 同時吃 PyTorch 模型與 kernel，把兩者打包成單一 asset，MSL 直接內嵌、隨模型一起發行。"},{"t":1272,"title":"Define a SiLU Metal kernel with PyTorch reference","body":"以 **SiLU**（Sigmoid Linear Unit，生成式 transformer 常見激活函數）為例：先用 `x * torch.sigmoid(x)` 定義 torch.export 追蹤所見的 **PyTorch reference**，再以 MSL 實作一個每 thread 處理一個元素、在 GPU 上算 fused activation 的 element-wise kernel。最後以 **TorchMetalKernel** 註冊，給定 Metal source、PyTorch reference 與輸入輸出名稱（此例為 x 與 y，與 MSL 中使用的名稱一致）。"},{"t":1329,"title":"Use a custom Metal kernel and convert with TorchConverter","body":"在模型中像呼叫一般 Python function 一樣使用此 kernel：傳入輸入、指定 thread grid 即可，並對每次實例化傳入 **result_shapes**，讓 Core AI 在 dynamic shape 下也能從輸入推導輸出 shape。轉換時先以 **`register_custom_kernels`** 向 TorchConverter 註冊，再 add exported program；Metal source 會直接嵌入 asset，kernel 隨模型同行。更多高效 Metal kernel 寫法見「Optimize custom machine learning operations with Metal tensors」。"},{"t":1381,"title":"Model re-authoring","body":"比 fuse 更進一步的 **model re-authoring**：為特定目標（尤其 iOS）重寫整個模型，可能更換 operations、採用新的 tensor layout、甚至改變模型介面。手法包含用預定義 pattern 告知 Core AI 特定概念（如 LLM 的 **KV cache in-place 更新**），以及採用 **static tensor shapes**、**channels-first** layout 與 convolutional op pattern 以善用底層 primitive。講者把 SAM3 拆成 image_encode／text_encode／detect 三個獨立 function，對兩個 encoder 套 4-bit palettization（**KMeansPalettizer**）、保留未壓縮 detector，並把影像由 1008 縮到 336 以在 iPhone 執行；換 prompt 時只重跑 text encoder 與 detector，第二次推論快了 76%，並強調 module 與 model 層級的嚴謹測試。"},{"t":1726,"title":"Next steps","body":"總結今日可立即著手的事：用 Core AI 的 Python 函式庫轉換 PyTorch 模型、以 **coreai-opt** 最佳化、需要看清模型內部時用 **Core AI Debugger**、以 **coreai-models** 的範例為基礎，並把 **Core AI Skills** 接進你慣用的 AI agent，讓它像專家一樣協助你運用這個新框架。"}],"summary_en":["Presented by Sachin and Nicole from the Core AI team, this session zooms in on **Core AI**'s Python ecosystem and walks through deploying a custom model end-to-end on Apple Silicon—from conversion and optimization to debugging and advanced authoring. Core AI is a complete suite covering the model deployment lifecycle; the talk introduces the Python libraries and tools plus the new **Core AI Debugger**. If you've used **Core ML** before, this Python/**PyTorch**-centric flow will feel familiar.","The starting point is the open-source **coreai-models** repository: a Swift package for running LLMs in your app, example models for various use cases, reusable components, and a set of **Core AI skills** you install into your coding assistant to use Core AI like an expert from day one (most of the talk's code was co-developed with an agent). The basic flow: after `pip install coreai-torch`, hand a PyTorch **exported program** (`torch.export`) to the **TorchConverter** to get a Core AI program, call `optimize()`, save an **.aimodel** asset that runs on Apple Silicon, and load a function to run inference directly from Python.","Optimization uses **coreai-opt** for config-driven compression—supporting int4/int8/FP4/FP8 and flexible granularity, plus quantization APIs that work with calibration data or quantization-aware training. The driving example is the 850-million-parameter **SAM3** segmentation model: `presets.w4` (4-bit per-channel) shrinks a 3GB model to ~430MB, but one occluded flower goes undetected because the same aggressive compression was applied to every layer. Nicole then uses the standalone **Core AI Debugger** app to visualize the model graph, run on real hardware, and—via the new **save intermediates** API—compare against the baseline by **PSNR**, finding the low-scoring sync points concentrated in the detector decoder, which holds only 4% of parameters; ignoring the detector during quantization restores baseline quality in minutes while staying tiny.","Finally, advanced authoring. Beyond **fusing** ops into a single kernel dispatch and reusing Core AI's built-in fast primitives (like Scaled Dot Product Attention), you can write a **custom Metal 4 kernel**: author the kernel in MSL, provide a PyTorch reference, register it via **TorchMetalKernel**, and the MSL is embedded directly into the asset and ships with the model. Going further, **model re-authoring** rewrites the whole model for a specific target (especially iOS) using static shapes, channels-first layouts, convolutional projections, and in-place KV-cache updates, backed by rigorous module- and model-level testing. The speaker re-authors SAM3 into three independent functions—image_encode, text_encode, and detect—compressing the two encoders with 4-bit palettization while leaving the detector uncompressed; swapping the prompt only re-runs the text encoder and detector, making the second inference 76% faster."],"deepdive_en":[{"t":0,"title":"Introduction","body":"Core AI engineer Sachin opens (Nicole joins later), framing the session around **Core AI**'s Python ecosystem and deploying models efficiently on Apple Silicon. Core AI spans the full deployment lifecycle—from optimization and conversion to debugging and integration—and you'll meet its Python libraries and tools plus the **Core AI Debugger**, which can become an integral part of the workflow."},{"t":109,"title":"Models and skills","body":"Introduces the open-source **coreai-models** repository at the forefront of the ecosystem: a Swift package for running LLMs in your app, example models engineered for various use cases, reusable components, and a set of **Core AI skills**. Installed into your coding assistant, the skills turn high-level ideas into a clear deployment plan based on your target hardware and constraints—most of the talk's code was co-developed with an agent using them."},{"t":207,"title":"Python workflow","body":"Describes the **coreai-torch**-centered entry point: `pip install coreai-torch` installs both coreai and coreai-torch. You hand it a PyTorch **exported program** and it converts directly to a Core AI model, with advanced features to assemble multiple models into one artifact, register custom lowerings for specific ops, inline **Metal 4** kernels, and finally specialize into optimized assets that run natively on Apple Silicon entirely from Python."},{"t":242,"title":"Convert, optimize and run inference with Core AI","body":"Walks a two-layer-linear-plus-relu MLP through the whole pipeline: **`torch.export`** with the model and an example_input yields an **exported_program** (full graph, weights, shapes), then **TorchConverter** with input/output names converts to a core_ai program, which is `optimize()`d and saved as an **.aimodel** asset. Inference just needs a function loaded from the program and a dictionary mapping input names to numpy tensors—conversion, optimization, and execution all from Python."},{"t":354,"title":"Model optimization","body":"Uses the 850M-parameter **SAM3** (image and text encoders are 96% of parameters, plus a DETR detector and mask decoder) to showcase **coreai-opt**'s config-driven compression with int4/int8/FP4/FP8 and flexible granularity. The conversion helper runs decompositions with Core AI's custom table to preserve high-level semantics like attention and can cast to 16-bit. The 32-bit baseline exceeds 3GB; **`presets.w4`** (EAGER mode, 4-bit per-channel) shrinks it to ~430MB, but one occluded flower goes undetected—because the same aggressive compression hit every layer."},{"t":640,"title":"Core AI Debugger","body":"Nicole introduces the standalone **Core AI Debugger**: visualize model structure as a graph, execute on specific hardware for true runtime results, and validate inference against a reference run. Operations are grouped by PyTorch module; the structure viewer shows connectivity and execution order, and the source viewer grounds you in the original Python. Using the new **save intermediates** API to capture baseline tensors, she compares sync points by **PSNR**, finds the low-scoring ones concentrated in the **detector decoder** (only 4% of parameters), and changes the scheme to ignore the detector—restoring baseline quality in minutes while staying a fraction of the size."},{"t":1167,"title":"Advanced authoring","body":"Sachin returns to advanced re-authoring: zooming into the PyTorch source itself—the graph of computations from inputs to outputs—and tuning how it runs on hardware. The simplest form is **fusing** a group of ops into a single kernel dispatch. Core AI already ships fast kernels and primitives for heavy operations like **Scaled Dot Product Attention** common in Transformers, with examples in the coreai-models repository."},{"t":1243,"title":"Custom Metal kernels","body":"For deeper customization, Core AI supports **custom Metal 4 kernels**. This adds a second input to coreai-torch—your kernel's source written in **MSL (Metal Shading Language)**. The converter takes both the PyTorch model and the kernel and bundles them into a single asset, with the MSL embedded right inside so it ships with the model."},{"t":1272,"title":"Define a SiLU Metal kernel with PyTorch reference","body":"Uses **SiLU** (Sigmoid Linear Unit, a common activation in generative transformers) as the example: first a **PyTorch reference** `x * torch.sigmoid(x)` that torch.export sees during tracing, then an element-wise MSL kernel (one thread per element) computing the fused activation on the GPU. It's registered as a **TorchMetalKernel** with the Metal source, PyTorch reference, and input/output names (here x and y, matching the names used in the MSL)."},{"t":1329,"title":"Use a custom Metal kernel and convert with TorchConverter","body":"The kernel is called like any Python function—pass the input and specify the thread grid—and each instantiation passes **result_shapes** so Core AI can bake in output-shape computation for dynamic-shaped inputs. At conversion you **`register_custom_kernels`** with the TorchConverter, then add the exported program; the Metal source is embedded directly in the asset so the kernel travels with the model. See \"Optimize custom machine learning operations with Metal tensors\" for efficient kernel writing."},{"t":1381,"title":"Model re-authoring","body":"Beyond fusing, **model re-authoring** rewrites the entire model for a specific target (especially iOS), possibly swapping operations, adopting new tensor layouts, and changing interfaces. Techniques include predefined patterns that tell Core AI about a concept (like **in-place KV-cache updates** in LLMs) and using **static tensor shapes**, **channels-first** layouts, and convolutional op patterns to leverage native primitives. The speaker splits SAM3 into three independent functions—image_encode, text_encode, detect—applies 4-bit palettization (**KMeansPalettizer**) to the two encoders while leaving the detector uncompressed, and shrinks the image from 1008 to 336 for iPhone; swapping the prompt re-runs only the text encoder and detector, making the second inference 76% faster, with rigorous module- and model-level testing emphasized."},{"t":1726,"title":"Next steps","body":"Wraps up with what you can do today: convert PyTorch models with Core AI's Python libraries, optimize with **coreai-opt**, use the **Core AI Debugger** when you need to see inside the model, build on the examples in **coreai-models**, and plug **Core AI Skills** into your favorite AI agent to leverage the new framework like an expert."}],"code":["import torch\nimport torch.nn as nn\n\n# Define a simple model\nclass MLP(nn.Module):\n    def __init__(self):\n        super().__init__()\n        self.fc1 = nn.Linear(256, 512)\n        self.fc2 = nn.Linear(512, 10)\n\n    def forward(self, x):\n        return self.fc2(torch.relu(self.fc1(x)))\n\n# Export with torch.export\nmodel = MLP().eval()\nexample_input = (torch.randn(1, 256),)\nexported_program = torch.export.export(model, example_input)","import coreai\nimport coreai_torch\nfrom coreai.runtime import NDArray\n\n# Convert to Core AI\nconverter = coreai_torch.TorchConverter()\nconverter.add_exported_program(\n    exported_program,\n    input_names=[\"features\"], output_names=[\"logits\"])\ncore_ai_program = converter.to_coreai()\n\n# Optimize and save to .aimodel\ncore_ai_program.optimize()\nasset = core_ai_program.save_asset(\"mlp.aimodel\")\n\n# Run inference\nspecialized_model = await AIModel.load(\"mlp.aimodel\")\nspecialized_function = specialized_model.load_function(\"main\")\nresult = await specialized_function({\"features\": NDArray(example[0].numpy())})","import torch\nfrom coreai_torch.dsl import TorchMetalKernel, MetalParameter\n\ndef silu_torch(x):\n    return x * torch.sigmoid(x)\n\nSILU_MSL = \"\"\"\nfloat val = float(x[gid]);\nfloat sig = 1.0f / (1.0f + exp(-val));\ny[gid] = TYPE(val * sig);\n\"\"\"\n\nsilu_kernel = TorchMetalKernel(\n    name=\"fused_silu\",\n    input_names=[\"x\"],\n    result_names=[\"y\"],\n    src=SILU_MSL,\n    torch_defn=silu_torch,\n    metal_params=[MetalParameter(\"gid\", \"uint\", \"thread_position_in_grid\")],\n    template_dtypes={\"x\": \"TYPE\"},\n)","class MyModel(torch.nn.Module):\n    def __init__(self):\n        super().__init__()\n        self.linear = torch.nn.Linear(256, 256)\n\n    def forward(self, x):\n        h = self.linear(x)\n        n = h.numel()\n        return silu_kernel(\n            h,\n            threads_per_grid_size=(n, 1, 1),\n            threads_per_thread_group=(min(n, 256), 1, 1),\n            result_shapes=[h.shape],\n        )\n\nexported_program = torch.export.export(MyModel(), (torch.randn(1, 256),))\n\nconverter = coreai_torch.TorchConverter()\nconverter.register_custom_kernels([silu_kernel])\nconverter.add_exported_program(exported_program,\n                               input_names=[\"x\"], output_names=[\"y\"])\ndeployable = converter.to_coreai()  # MSL integrated into asset"]},"related":[{"id":"324","title":"Meet Core AI","gloss":"認識 Core AI","gloss_en":"Meet Core AI","category":"ai","categoryLabel":"AI 與機器學習"},{"id":"326","title":"Integrate on-device AI models into your app using Core AI","gloss":"用 Core AI 把裝置端 AI 模型整合進你的 App","gloss_en":"Integrate on-device AI models with Core AI","category":"ai","categoryLabel":"AI 與機器學習"},{"id":"382","title":"Inside Apple Intelligence and Xcode: Special Presentation","gloss":"深入 Apple Intelligence 與 Xcode：特別發表","gloss_en":"Inside Apple Intelligence and Xcode: Special Presentation","category":"ai","categoryLabel":"AI 與機器學習"},{"id":"322","title":"Compose advanced graphics effects with SwiftUI","gloss":"用 SwiftUI 組合進階圖形效果","gloss_en":"Compose advanced graphics effects with SwiftUI","category":"swiftui","categoryLabel":"SwiftUI"},{"id":"330","title":"Optimize custom machine learning operations with Metal tensors","gloss":"用 Metal tensors 最佳化自訂機器學習運算","gloss_en":"Optimize custom machine learning operations with Metal tensors","category":"graphics","categoryLabel":"圖形與遊戲"}]}</script>
