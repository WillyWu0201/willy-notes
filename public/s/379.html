<script id="d" type="application/json">{"s":{"id":"379","title":"Meet Trust Insights","gloss":"認識 Trust Insights","category":"swift","categoryLabel":"Swift","duration":837,"url":"https://developer.apple.com/videos/play/wwdc2026/379/","takeaway":"全新的 Trust Insights 框架以隱私保護方式評估使用者是否正遭社交詐騙或脅迫，協助 App 在風險情境中增加保護摩擦。","chapters":[[0,"Introduction"],[155,"Generating insights"],[181,"Generating insights"],[337,"Handling results for IsLikelyBeingCoachedInsight"],[410,"Feedback requirements"],[425,"Real-time consumption feedback"],[565,"Privacy"],[634,"Best practices"],[768,"Next steps"]],"points":[{"text":"**Trust Insights** 是全新框架，以**隱私保護**方式協助偵測使用者是否正遭**社交詐騙或脅迫**。","hot":true},{"text":"透過 **InsightEvaluator** 先 requestAuthorization 取得授權，再用 **IsLikelyBeingCoachedInsight** 請求評估。","hot":false},{"text":"結果為 .unknown／.medium／.high 等風險等級，App 可據此調整流程（例如增加確認步驟）。","hot":false},{"text":"需以 **reportConsumption**（如 .usedIncreasedFriction）提供**即時消費回饋**，並遵循隱私與最佳實務。","hot":false}],"apis":["TrustInsights","InsightEvaluator","IsLikelyBeingCoachedInsight","InsightContext","InsightEvaluation","reportConsumption"],"audience":"**開發金融、轉帳或通訊類 App**、希望保護使用者免於社交工程詐騙與脅迫的工程師。","gloss_en":"Meet Trust Insights","takeaway_en":"The new Trust Insights framework assesses, in a privacy-preserving way, whether a user is being socially scammed or coerced, helping apps add protective friction in risky situations.","points_en":[{"text":"**Trust Insights** is a new framework that helps detect, in a **privacy-preserving** way, whether a user is being **socially scammed or coerced**.","hot":true},{"text":"Use **InsightEvaluator** to first requestAuthorization for permission, then request an assessment with **IsLikelyBeingCoachedInsight**.","hot":false},{"text":"Results are risk levels such as .unknown/.medium/.high, so the app can adjust its flow accordingly (for example, adding a confirmation step).","hot":false},{"text":"You must provide **real-time consumption feedback** via **reportConsumption** (such as .usedIncreasedFriction) and follow privacy and best practices.","hot":false}],"audience_en":"**Engineers building finance, money-transfer, or messaging apps** who want to protect users from social-engineering scams and coercion.","summary":["這場由 Apple 工程經理 Mike Armstrong 主講，介紹 iOS 27 全新框架 **Trust Insights**，用來偵測並回應針對「人」而非「系統」的**社交工程**攻擊。社交詐騙鎖定的是人的心理弱點：使用者可能在被施壓、恐嚇或欺騙下，完成一個技術上完全合法的操作，而 app 本身根本分辨不出這是真實意圖還是被脅迫的結果。常見的脅迫模式包括假冒技術支援誘導遠端存取、冒充銀行／政府／執法機關套取敏感資訊，以及利用親情、結合 AI deepfake 的家庭緊急詐騙。最棘手的是**即時教唆（real-time coaching）**——攻擊者透過電話或訊息一步步引導受害者親自操作，使得 MFA、生物辨識等既有防護全部失效，因為動手的正是使用者本人。","Trust Insights 提供一種全新的訊號：**行為脈絡（behavioral context）**，用來區分自由意志下的操作與被脅迫的行為。框架結合裝置端與雲端基礎設施，但整合完全是 client-side 的 Swift API。整合流程是：在 Xcode 宣告 entitlement 後 `import TrustInsights`，建立含所需 insight 的 parameter pack（須指定 schema、modelVersion 可選），再透過 `InsightEvaluator.InsightContext` 指定 **operationCategory** 與要請求的 evaluations。operationCategory 告訴系統使用者在做哪類動作、決定套用哪套模型邏輯，共有五類：**payment、account、resourceUse、communication、other**。接著建立 `InsightEvaluator`、檢查授權（使用者可完全掌控），最後非同步呼叫 `requestEvaluation`——這需要網路連線、可能耗時數秒，因此應安排在動畫或過場畫面等適當時機。","以 `IsLikelyBeingCoachedInsight` 為例，結果有三種值：**unknown**（無詐騙風險證據，但不可解讀為低風險）、**medium**（有部分教唆風險證據，可考慮增加摩擦或額外驗證）、**high**（顯著風險，應在使用者繼續前告知）。回饋是整合的必要環節：必須對每次 evaluation 呼叫 **`reportConsumption`** 回報 app 如何回應（六種值如 `usedIncreasedFriction`、`notUsedNotNeeded` 等），否則 app 可能被 rate-limit；另有 offline feedback，透過 **Apple Business Register** 的 server-to-server API 在事後（可能數天到數月）回報確認為詐騙的案例，以協助模型改進。","**隱私**是整套設計的核心：採資料最小化，裝置端資料就地處理、評估後立即丟棄，僅單一輸出值離開裝置，最終結果可能再結合 Apple Account 訊號與 velocity check。框架分析的是互動模式、時間、脈絡與基本感測資料，**絕不**觸及 Photos、Messages、Mail 的內容；使用者可在設定中關閉，且關閉後有冷卻期以保護被教唆關閉的受害者。**最佳實踐**包括：把 Trust Insights 整合進既有風險與決策邏輯而非當成唯一依據、在高價值金流／不可逆操作／權限授予／敏感資料分享等關鍵時刻才呼叫、絕不把 unknown 或缺值當成低風險，並完整處理 evaluation 與 insight 兩層各自不同的錯誤。"],"deepdive":[{"t":0,"title":"Introduction","body":"Apple 工程經理 Mike Armstrong 開場說明 **Trust Insights** 用來偵測並回應**社交工程**威脅——這類攻擊鎖定人而非系統，利用心理而非技術漏洞。他列舉三大脅迫模式：假冒技術支援誘導遠端存取、冒充銀行／政府／執法機關套取資訊，以及結合 AI deepfake 的家庭緊急詐騙。核心難題是**即時教唆**：使用者在攻擊者引導下親自、經授權地完成操作，使 MFA 與生物辨識失效，因此需要能判斷「是否出於自由意志」的全新訊號，且此訊號必須兼顧隱私。"},{"t":155,"title":"Generating insights","body":"進入整合流程，說明 Trust Insights 結合裝置與雲端，但整合完全是 client-side 的 Swift API。第一步是設定：產生 insight 需要 **entitlement**，要在 Xcode 為 app target 宣告該 capability。"},{"t":181,"title":"Generating insights","body":"`import TrustInsights` 後建立含所請求 insight 的 parameter pack（**schema** 必填、**modelVersion** 選填，同時指定當前與先前版本可支援模型治理與驗證）。透過 `InsightEvaluator.InsightContext` 指定 **operationCategory** 與 evaluations，類別共五種：**payment**（資產／金錢交換，含遊戲內購）、**account**（更新帳戶或安全資訊）、**resourceUse**（昂貴或受限的基礎設施如 AI 推論）、**communication**（傳訊、送出表單、簽署文件）與 **other**（後備）。接著建立 `InsightEvaluator`、檢查授權（使用者可完全掌控），再非同步呼叫 **`requestEvaluation`**——需網路、可能耗時數秒，宜安排在動畫或過場時機；開發時打到 sandbox，上架後改用 production 模型，並可用 Xcode build scheme 覆寫值與錯誤來測試。"},{"t":337,"title":"Handling results for IsLikelyBeingCoachedInsight","body":"回應每個請求對應一個結果。以 `IsLikelyBeingCoachedInsight` 為例有三種值：**unknown**（無詐騙風險證據，但不可當作低風險）、**medium**（有部分教唆風險證據，可考慮加摩擦、額外驗證或調整風險評分）、**high**（顯著風險，應在使用者繼續前告知）。並強調需獨立處理 evaluation 層與 insight 層兩種不同意義的錯誤。"},{"t":410,"title":"Feedback requirements","body":"說明整合需要兩種回饋：即時 consumption feedback（回報 app 對 insight 的回應方式）與 offline feedback（事後發現交易其實為詐騙時回報）。背後是一套精密的 ML 模型，裝置端資料就地處理、評估後立即丟棄，僅單一輸出值離開裝置，最終可能再納入 Apple Account 訊號與 velocity check。"},{"t":425,"title":"Real-time consumption feedback","body":"對每次 evaluation 結果呼叫 **`reportConsumption`** 提交即時回饋，此呼叫為強制；若省略 app 可能被 rate-limit。六種值：**usedReducedFriction**、**usedUnchangedFriction**、**usedIncreasedFriction**（增加檢查，但不建議僅憑 insight 直接封鎖）、**notUsedNotNeeded**（使用者取消）、**notUsedError**（技術失敗如結果太晚到）與 **usedEvaluationOnly**。offline label 對模型改進至關重要：經 **Apple Business Register** 的 server-to-server API、依含 insight identifier 的 schema 提交確認詐騙案例，且不得夾帶 PII 等多餘資訊、需對殘留值施以隱私保護以防 fingerprinting；offline 提交非必要但能強化整體生態。"},{"t":565,"title":"Privacy","body":"**資料最小化**是 Trust Insights 的核心：只處理必要資料、輸入立即丟棄、所有裝置來源資料都留在裝置上。框架分析的是互動模式、時間、脈絡與基本感測資料，**絕不**觸及 Photos、Messages、Mail 的內容，這些裝置衍生訊號也不與 Apple 或第三方分享。使用者在設定中有完整控制權可關閉，且關閉後可能有**冷卻期**，以保護那些被教唆去關閉此功能的受害者；app 應查詢授權狀態以確認使用者是否已啟用。"},{"t":634,"title":"Best practices","body":"以實例說明：使用者正設定一筆大額轉帳給自稱是家人主治醫師的對象，app 在背景請求了 trust insight，**medium** 結果促使 app 顯示警告並對交易加入延遲；也可改為伺服器端處理、加入人工審查或調整風險而不打斷使用者。建議在最有價值的時刻才呼叫：高價值金流（如 P2P 付款）、不可逆操作（如刪除帳戶、匯出個資）、權限授予（如遠端存取、新裝置授權）與敏感資料分享。其他要點：把 Trust Insights 整合進既有風險邏輯而非當成唯一依據、善用跨版本模型抽樣、各層分別處理錯誤、**絕不**把 unknown 或缺值當成低風險，並務必在 app 內提交即時回饋以避免 rate limit、盡量透過 Apple Business Register 貢獻 offline 詐騙標籤。"},{"t":768,"title":"Next steps","body":"結語呼籲找出 app 中 Trust Insights 能與既有邏輯協同保護使用者的關鍵時刻，依最佳實踐與文件採用框架，並到 **Apple Business Register** 註冊以了解 Partner Data Services。並推薦關注 **App Attest**（驗證伺服器請求來自合法 app 實例），鼓勵此刻透過 Feedback Assistant 對框架、能力或高流量使用案例提供回饋。"}],"summary_en":["Presented by Apple Engineering Manager Mike Armstrong, this session introduces **Trust Insights**, a new framework in iOS 27 for detecting and responding to **social engineering** attacks that target people rather than systems. Social scams exploit human psychology: users may be pressured, frightened, or deceived into performing an action that is technically legitimate, and the app itself cannot tell genuine intent from coerced intent apart. Common coercion patterns include tech-support scams that prompt remote access, authority impersonation of banks, government, or law enforcement to collect sensitive data, and family-emergency fraud increasingly using AI deepfakes. The hardest case is **real-time coaching**—attackers guide victims step by step to act themselves, defeating MFA and biometrics because the user is the one acting.","Trust Insights provides a new signal—**behavioral context**—to distinguish freely-made actions from coerced ones. The framework combines on-device and cloud infrastructure, but integration is entirely client-side via a Swift API. The flow: declare an entitlement in Xcode, `import TrustInsights`, build a parameter pack of requested insights (schema required, modelVersion optional), then specify the **operationCategory** and evaluations through `InsightEvaluator.InsightContext`. The operation category tells the system what kind of action the user is taking and which model logic applies; five exist: **payment, account, resourceUse, communication, other**. You then create an `InsightEvaluator`, check authorization (the user has full control), and asynchronously call `requestEvaluation`—which needs Internet, can take a couple of seconds, and should be placed during animations or interstitials.","For `IsLikelyBeingCoachedInsight`, results take three values: **unknown** (no evidence of scam risk, but not to be read as low risk), **medium** (some coaching-risk evidence; consider friction or extra verification), and **high** (significant risk; inform the user before proceeding). Feedback is mandatory: call **`reportConsumption`** on every evaluation to report how the app responded (six values such as `usedIncreasedFriction` and `notUsedNotNeeded`), or risk being rate-limited. Offline feedback is submitted later—days to months afterward—via a server-to-server API through **Apple Business Register** for transactions confirmed as fraud, helping improve the model.","**Privacy** is foundational: data minimization means device-sourced inputs are processed locally and discarded immediately, with only a single output value leaving the device, possibly combined with Apple Account signals and velocity checks. The framework analyzes interaction patterns, timing, context, and basic sensor data—**never** content in Photos, Messages, or Mail. Users can disable it in Settings, with a cooldown to protect those coached into turning it off. **Best practices**: integrate Trust Insights into existing risk and decision logic rather than treating it as the sole factor, call it only at the moments that matter (high-value financial transactions, irreversible actions, permission grants, sensitive data sharing), never treat unknown or a missing value as low risk, and handle the distinct evaluation-level and insight-level errors separately."],"deepdive_en":[{"t":0,"title":"Introduction","body":"Apple Engineering Manager Mike Armstrong opens by explaining that **Trust Insights** detects and responds to **social engineering** threats—attacks that target people not systems, exploiting psychology rather than technical flaws. He lists three coercion patterns: tech-support scams prompting remote access, authority impersonation of banks/government/law enforcement, and family-emergency fraud using AI deepfakes. The core difficulty is **real-time coaching**: users act themselves, authenticated and legitimately, defeating MFA and biometrics—so a new signal is needed to tell whether they're acting freely, and it must preserve privacy."},{"t":155,"title":"Generating insights","body":"He begins the integration, noting Trust Insights combines device and cloud but integrates entirely client-side via Swift. The first step is configuration: generating insights requires an **entitlement**, declared as a capability on the app target in Xcode."},{"t":181,"title":"Generating insights","body":"After `import TrustInsights`, build a parameter pack of requested insights (**schema** required, **modelVersion** optional—specifying current and prior versions supports model governance and validation). Through `InsightEvaluator.InsightContext` you set **operationCategory** and evaluations; five categories exist: **payment** (asset/money exchange, including IAP), **account** (updating account or security info), **resourceUse** (costly or constrained infrastructure such as AI inference), **communication** (messaging, form submission, document signing), and **other** (fallback). Then create an `InsightEvaluator`, check authorization (the user has full control), and asynchronously call **`requestEvaluation`**—it needs Internet, can take seconds, and is best placed during animations or interstitials; development hits a sandbox, distribution uses production models, and Xcode build schemes can override values and errors for testing."},{"t":337,"title":"Handling results for IsLikelyBeingCoachedInsight","body":"The response has one result per requested evaluation. For `IsLikelyBeingCoachedInsight` there are three values: **unknown** (no scam-risk evidence, but not to be interpreted as low risk), **medium** (some coaching-risk evidence; consider friction, extra verification, or adjusting risk scoring), and **high** (significant risk; inform the user before proceeding). He stresses handling evaluation-level and insight-level errors independently, as they carry different meaning."},{"t":410,"title":"Feedback requirements","body":"Two kinds of feedback complete the integration: real-time consumption feedback reporting how the app responded, and offline feedback for transactions that later prove fraudulent. Behind the three values is a sophisticated ML model; device-sourced data is processed locally and discarded immediately, with only a single output value leaving the device, which may incorporate Apple Account signals and velocity checks."},{"t":425,"title":"Real-time consumption feedback","body":"Submit real-time feedback by calling **`reportConsumption`** on each evaluation result—mandatory per request, or the app may be rate-limited. Six values: **usedReducedFriction**, **usedUnchangedFriction**, **usedIncreasedFriction** (added checks, though blocking solely on an insight is discouraged), **notUsedNotNeeded** (user cancelled), **notUsedError** (technical failure such as a late result), and **usedEvaluationOnly**. Offline labels are vital for model improvement: submitted via a server-to-server API through **Apple Business Register** using a schema with the original insight identifier, excluding PII and applying privacy-preserving techniques against fingerprinting—optional but strengthening the ecosystem."},{"t":565,"title":"Privacy","body":"**Data minimization** is central: only what's needed is processed, inputs are discarded immediately, and all device-sourced data stays on the device. The framework analyzes interaction patterns, timing, context, and basic sensor data—**never** content in Photos, Messages, or Mail—and none of these signals are shared with Apple or third parties. Users have full control to disable it in Settings, with a possible **cooldown** afterward to protect victims coached into turning it off; apps should query authorization status to check whether it's enabled."},{"t":634,"title":"Best practices","body":"He gives an example: a user sets up a large transfer to someone claiming to be a family member's doctor; the app requested a trust insight in the background, and the **medium** result prompts it to show a warning and add a delay—alternatively handled server-side, with manual review, or by adjusting risk without disruption. Call it at the moments of most value: high-value financial transactions (P2P payments), irreversible actions (account deletion, data export), permission grants (remote access, new device authorization), and sensitive data sharing. Other points: integrate Trust Insights into existing risk logic rather than as the sole factor, sample model versions over time, handle each error level, **never** treat unknown or a missing value as low risk, and submit real-time feedback in-app to avoid rate limits while contributing offline fraud labels via Apple Business Register."},{"t":768,"title":"Next steps","body":"He closes by urging developers to identify the moments where Trust Insights can work alongside existing logic to protect users, adopt the framework per best practices and documentation, and register on **Apple Business Register** to learn about Partner Data Services. He points to **App Attest** for verifying server requests come from legitimate app instances, and encourages submitting feedback now via Feedback Assistant on the framework, its capabilities, or high-volume use cases."}],"code":["import TrustInsights\n\nlet request = IsLikelyBeingCoachedInsight.request(schema: .version1, modelVersion: .current)\nlet context = InsightEvaluator.InsightContext(operationCategory: .resourceUse,\n                                              requestedEvaluations: request)\n\nlet evaluator = InsightEvaluator()\nguard try await evaluator.requestAuthorization(for: context) == .authorized else { return }\n\nlet assessment = try await evaluator.requestEvaluation(context: context)\ndo {\n    try handleAssessment(assessment)\n} catch {\n    // Handle error\n}\n\nassessment.reportConsumption(.usedIncreasedFriction)","func handleAssessment(_ assessment: InsightEvaluation\u003cIsLikelyBeingCoachedInsight>) throws {\n\tswitch try assessment.insight.outcome.get() {\n\t\tcase .unknown:\n\t\t\n\t\tcase .medium:\n\n\t\tcase .high:\n\n\t\t@unknown default:\n\n\t}\n}","import TrustInsights\n\nlet request = IsLikelyBeingCoachedInsight.request(schema: .version1, modelVersion: .current)\nlet context = InsightEvaluator.InsightContext(operationCategory: .resourceUse,\n                                              requestedEvaluations: request)\n\nlet evaluator = InsightEvaluator()\nguard try await evaluator.requestAuthorization(for: context) == .authorized else { return }\n\nlet assessment = try await evaluator.requestEvaluation(context: context)\ndo {\n    try handleAssessment(assessment)\n} catch {\n    // Handle error\n}\n\nassessment.reportConsumption(.usedIncreasedFriction)"]},"related":[{"id":"201","title":"Secure your apps with App Attest","gloss":"運用 App Attest 保護你的 App","gloss_en":"Protect your app with App Attest","category":"swift","categoryLabel":"Swift"},{"id":"213","title":"Translate your app using agents in Xcode","gloss":"在 Xcode 中運用 agent 翻譯你的 App","gloss_en":"Translate your app using agents in Xcode","category":"swift","categoryLabel":"Swift"},{"id":"258","title":"What’s new in Xcode 27","gloss":"Xcode 27 的新功能","gloss_en":"What's new in Xcode 27","category":"swift","categoryLabel":"Swift"},{"id":"262","title":"What's new in Swift","gloss":"Swift 有什麼新東西","gloss_en":"What's new in Swift","category":"swift","categoryLabel":"Swift 語言"},{"id":"265","title":"Build real-time apps and services with gRPC and Swift","gloss":"用 gRPC 與 Swift 打造即時 App 與服務","gloss_en":"Build real-time apps and services with gRPC and Swift","category":"swift","categoryLabel":"Swift"}]}</script>
