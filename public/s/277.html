<script id="d" type="application/json">{"s":{"id":"277","title":"WidgetKit foundations","gloss":"WidgetKit 基礎入門","category":"swiftui","categoryLabel":"SwiftUI","duration":1220,"url":"https://developer.apple.com/videos/play/wwdc2026/277/","takeaway":"掌握 WidgetKit 的基本概念，從 StaticConfiguration、支援尺寸、深層連結到隨系統調整的著色渲染模式，打造融入系統的 Widget。","chapters":[[1,"Introduction"],[63,"Fundamentals"],[230,"DailyReadingGoalWidget"],[745,"Supported Families"],[795,"Integrate with your app"],[843,"Adding deep links"],[1024,"Adapt with the system"],[1097,"Accented rendering mode"]],"points":[{"text":"以 **StaticConfiguration** 搭配 provider 與 SwiftUI 視圖建立 Widget，並用 **containerBackground** 設定背景。","hot":false},{"text":"透過 **supportedFamilies** 宣告支援的 Widget 尺寸，例如 systemMedium。","hot":false},{"text":"使用 **widgetURL** 加入深層連結，讓使用者點按 Widget 直接進入 App 對應內容。","hot":true},{"text":"搭配 **widgetAccentedRenderingMode** 控制著色渲染模式，使 Widget 隨系統外觀調整。","hot":false}],"apis":["WidgetKit","Widget","StaticConfiguration","WidgetConfiguration","containerBackground","supportedFamilies","widgetURL","widgetAccentedRenderingMode"],"audience":"適合**第一次開發 Widget、想學會 WidgetKit 基礎的 SwiftUI 開發者**。","gloss_en":"WidgetKit foundations","takeaway_en":"Master the basics of WidgetKit—from StaticConfiguration, supported sizes, and deep links to accented rendering that adapts to the system—to build widgets that blend into the system.","points_en":[{"text":"Build a widget with **StaticConfiguration** together with a provider and a SwiftUI view, and set the background using **containerBackground**.","hot":false},{"text":"Declare the widget sizes you support, such as systemMedium, via **supportedFamilies**.","hot":false},{"text":"Use **widgetURL** to add a deep link so tapping the widget takes the user directly to the corresponding content in your app.","hot":true},{"text":"Use **widgetAccentedRenderingMode** to control the accented rendering mode so the widget adapts to the system appearance.","hot":false}],"audience_en":"Ideal for **SwiftUI developers building a widget for the first time who want to learn the WidgetKit foundations**.","summary":["本場由系統體驗團隊工程師 Jonathan Long 主講，從零開始介紹 **WidgetKit** 的基礎觀念與第一個 widget 的建構流程。Widget 之所以令人印象深刻有三個特質：**glanceable**（一眼可懂）、**relevant**（內容隨時間、習慣與位置而相關）以及 **personalizable**（可依個人喜好設定）。無論 app 是用 SwiftUI 或 UIKit 開發，widget 本身都以 SwiftUI 建構，並透過獨立的 **widget extension** 行程提供給系統。由於 extension 與主 app 是分離的行程，必須透過 **app group** 的 shared container（例如共享資料庫或 user defaults）來傳遞資料。","Widget 的內容核心是 **timeline**，由多個 **timeline entry** 組成，每個 entry 攜帶在特定時間點渲染畫面所需的資料。講者以讀書會 app 的 reading goals widget 為例，說明 widget 的兩種設定方式：可由使用者設定的 **AppIntentConfiguration**，以及最單純、自動帶入目前書籍的 **StaticConfiguration**。StaticConfiguration 需要 kind（唯一識別碼）、timeline provider 與回傳 View 的 closure，並以 **containerBackground** modifier 標示背景，讓系統在著色或透明 tint 環境下能替換為玻璃材質。Timeline provider 須提供三種狀態：snapshot（gallery 預覽）、placeholder（同步、不需資料的暫位畫面，常用 SwiftUI 的 redacted modifier）以及 timeline entry。","Timeline 的更新由 **reload policy** 決定，分為 **atEnd**（entry 用盡時重載，適合 reading goals widget）、**afterDate**（指定特定時間重載，適合 reading schedule widget）以及 **never**（不自動重載，適合只在互動後更新的 reading log widget，可用 WidgetCenter 的 reload API 或 push notification 觸發）。最佳實務包括盡量提供多筆 entry、留意系統會依使用習慣分配更新預算（budget）並節流前景的頻繁重載。需要密集更新與提醒能力的短暫內容（如體育賽事）則應改用 **Live Activities**。","後半段聚焦於整合與適應。透過 **supportedFamilies** modifier 可支援多種尺寸（包含 macOS、iOS、iPadOS 27 新增的 system extra large portrait），iOS widget 也能出現在 CarPlay 與 macOS remote widget。整合手段包括 **widgetURL** 做 deep link、以 App Intents 做可設定 widget、以及用 button 與 toggle 加入互動元素（透過 App Intent 由系統代為執行）。最後強調要在 full color、tinted 與 clear 等各種環境測試 widget；當 accented rendering mode 無法正確著色圖片時（如書封變成白色方塊），可用 **widgetAccentedRenderingMode(.fullColor)** 保留原始色彩。"],"deepdive":[{"t":1,"title":"Introduction","body":"由系統體驗團隊工程師 **Jonathan Long** 開場，說明 widget 能在使用者最常造訪的便利位置提供相關內容，並橫跨 iOS、iPadOS、watchOS、visionOS 與 macOS 等多個平台。本場將涵蓋 **WidgetKit** 的基礎、如何建構第一個 widget、如何更好地整合 app 與 widget，以及如何在系統環境（如 tinted 環境）改變時讓 widget 自動適應。"},{"t":63,"title":"Fundamentals","body":"定義讓 widget 令人難忘的三個特質：**glanceable**（如天氣 widget 一眼掌握預報）、**relevant**（如行事曆 widget 隨時間更新顯示下一個事件）與 **personalizable**（如照片回憶 widget）。講者以自製的讀書會 app 為情境，介紹 reading goals、reading log 與 reading schedule 三個 widget。重點說明 widget 透過獨立行程的 **widget extension** 提供給系統，並須以 **app group** 的 shared container 跨行程傳遞資料；內容則以 **timeline** 與其中的 timeline entry 形式提供。"},{"t":230,"title":"DailyReadingGoalWidget","body":"逐步拆解 reading goals widget 的程式碼。Xcode 建立 widget extension target 時會自動產生骨架，body 回傳 **WidgetConfiguration**；因 widget 自動帶入目前書籍，故選用最單純的 **StaticConfiguration**，需提供 kind、timeline provider 與回傳 View 的 closure，並以 **containerBackground** 標示背景以支援玻璃材質替換。Timeline provider 須提供 snapshot（gallery 以 Atomic Habits 作預覽）、placeholder（同步、用 redacted modifier）與 timeline entry（攜帶激勵訊息、已讀頁數、書名與封面）。Reload policy 採 **atEnd**，因激勵訊息在一天中於不固定時間更新、結束時間未知。"},{"t":745,"title":"Supported Families","body":"Widget extension 與 timeline provider 接好後，便能支援多種 widget family。建議盡量支援多種尺寸讓使用者有更多擺放選擇，並介紹 visionOS 26 引入、macOS/iOS/iPadOS 27 新增的 **system extra large portrait** family，能更完整呈現 app 內容（reading schedule 可重用 medium widget 的資料）。可用 **supportedFamilies** modifier 列出支援的尺寸，新增 family 時可重用同一 widget 與 timeline provider，只需為新尺寸建構合適的 SwiftUI view。"},{"t":795,"title":"Integrate with your app","body":"說明 widget 是 app 的延伸，可透過三種方式更緊密整合：**deep links**、可設定（configurable）的 widget，以及互動元素（interactive elements）。Widget 預設的互動是開啟 app，這是很好的起點；若 widget 顯示 app 內特定內容，則可進一步提供直達該內容的 deep link。"},{"t":843,"title":"Adding deep links","body":"回到 reading goals widget 的程式碼，因 widget 顯示目前正在讀的書，講者用 **widgetURL** modifier 指定 deep link URL，URL 中編碼書籍 ID（bookclub://reading/{bookID}），讓 app 啟動時直接導向該書的詳情頁。Deep link 能在 app 與 widget 間移動時保留使用者的情境脈絡。"},{"t":1024,"title":"Adapt with the system","body":"說明 widget 須能適應使用者對系統的客製化。在 iOS 上，系統可被設定為以特定顏色 tint 或採用 clear tint，此時系統會透過玻璃材質渲染 widget、為內容著色並以自適應玻璃效果取代背景，讓 Home Screen 上的所有 widget 視覺一致。SwiftUI 處理了大部分繁重工作，但仍須測試以確保呈現正確。"},{"t":1097,"title":"Accented rendering mode","body":"示範實機測試發現問題：在 clear mode 下 reading goals widget 的書封變成一塊白色方塊，因為在 accented rendering mode 下系統無法正確著色該圖片。解法是在 BookCoverImage view 對圖片套用 **widgetAccentedRenderingMode(.fullColor)**，讓書封以原始全彩呈現。講者強調要在 full color、tinted、clear 各環境測試，記得 iOS widget 也會以 remote widget 出現在 macOS,並善用 SwiftUI previews 與 WidgetKit developer mode 加速迭代。"}],"summary_en":["Presented by Jonathan Long, an engineer on the system experience team, this session introduces the fundamentals of **WidgetKit** and how to build your first widget from scratch. Three qualities make widgets memorable: they are **glanceable** (understood at a glance), **relevant** (content matching time, personal patterns, and location), and **personalizable** (configurable with content that matters to you). Whether an app is built with SwiftUI or UIKit, the widgets themselves are built in SwiftUI and provided to the system from a separate **widget extension** process. Because the extension runs separately from your app, you must use a shared container in an **app group** (such as a shared database or user defaults) to pass data from the app to the extension.","A widget's content is delivered through a **timeline**, made up of multiple **timeline entries**, each carrying the data needed to render the view at a specific point in time. Using a book club app's reading goals widget as an example, the talk covers the two configuration types: **AppIntentConfiguration** for user-configurable widgets, and the simplest **StaticConfiguration** that auto-configures with the current book. StaticConfiguration needs a kind (unique identifier), a timeline provider, and a closure returning a View, with the **containerBackground** modifier marking the background so the system can swap in a glass material under colored or clear tints. The timeline provider supplies three states: snapshot (the gallery preview), placeholder (a synchronous, data-free stand-in often built with SwiftUI's redacted modifier), and timeline entries.","Timeline updates are governed by a **reload policy**: **atEnd** (reload when entries are exhausted, suiting the reading goals widget), **afterDate** (reload at a specific known time, suiting the reading schedule widget), and **never** (no automatic reload, suiting the reading log widget that only updates on interaction, triggered via WidgetCenter's reload APIs or a push notification). Best practices include providing multiple entries whenever possible and being aware that the system allocates an update budget based on viewing habits and may throttle frequent foreground reloads. Ephemeral content needing frequent updates and alerting (like a sporting event) should use **Live Activities** instead.","The latter half focuses on integration and adaptation. The **supportedFamilies** modifier lets you support multiple sizes (including the new system extra large portrait family on macOS, iOS, and iPadOS 27), and iOS widgets also appear on CarPlay and as macOS remote widgets. Integration techniques include **widgetURL** for deep links, App Intents for configurable widgets, and buttons and toggles for interactive elements (executed by the system via an App Intent). Finally, the talk stresses testing widgets in full color, tinted, and clear environments; when accented rendering mode can't tint an image correctly (such as a book cover rendering as a white rectangle), **widgetAccentedRenderingMode(.fullColor)** preserves the original colors."],"deepdive_en":[{"t":1,"title":"Introduction","body":"Engineer **Jonathan Long** from the system experience team opens by explaining that widgets surface relevant content in the convenient places people visit most, spanning iOS, iPadOS, watchOS, visionOS, and macOS. The session will cover **WidgetKit** fundamentals, how to build your first widget, how to better integrate your app and widget experience, and how to ensure widgets adapt when the system environment changes, such as to a tinted environment."},{"t":63,"title":"Fundamentals","body":"Defines the three qualities that make widgets memorable: **glanceable** (like Weather conveying just enough at a glance), **relevant** (like Calendar updating to show the next event by time), and **personalizable** (like a Photos memory widget). Using a self-built book club app as the running scenario, the talk introduces the reading goals, reading log, and reading schedule widgets. It explains widgets are provided to the system from a separate-process **widget extension**, which must pass data across processes via a shared container in an **app group**, and that content is delivered as a **timeline** of timeline entries."},{"t":230,"title":"DailyReadingGoalWidget","body":"Walks through the reading goals widget code. Xcode generates a skeleton when you create the widget extension target, with body returning a **WidgetConfiguration**; because the widget auto-configures to the current book, the simplest **StaticConfiguration** is used, needing a kind, a timeline provider, and a closure returning a View, with **containerBackground** marking the background to support glass material swapping. The provider supplies a snapshot (gallery preview featuring Atomic Habits), a placeholder (synchronous, using the redacted modifier), and timeline entries (carrying the motivational message, pages read, title, and cover). The reload policy is **atEnd**, because the motivational message updates at varied, non-fixed times throughout the day."},{"t":745,"title":"Supported Families","body":"Once the widget extension and timeline provider are wired up, many widget families become available. It is recommended to support as many sizes as possible to give people placement choices, and the talk introduces the **system extra large portrait** family (introduced in visionOS 26, new in macOS/iOS/iPadOS 27) that gives a fuller look at app content (the reading schedule reuses the medium widget's data). The **supportedFamilies** modifier lists supported sizes, and adding a family lets you reuse the same widget and timeline provider while building a SwiftUI view suited to the new shape and size."},{"t":795,"title":"Integrate with your app","body":"Explains the widget is an extension of your app and can be integrated more tightly through three means: **deep links**, configurable widgets, and interactive elements. The default widget interaction is to open the app, a great starting point; if the widget shows specific content from within the app, it can go further and provide a deep link directly to that content."},{"t":843,"title":"Adding deep links","body":"Back in the reading goals widget code, because the widget shows the current book, the presenter uses the **widgetURL** modifier to specify a deep link URL that encodes the book's ID (bookclub://reading/{bookID}), so the app launches directly to that book's details page. Deep links keep people in context as they move between the app and the widget."},{"t":1024,"title":"Adapt with the system","body":"Explains that widgets must adapt to user customization of the system. On iOS the system can be tinted with a specific color or set to a clear tint, in which case the system renders the widget through a glass material, tinting the content and replacing the background with an adaptive glass effect so all widgets on the Home Screen feel cohesive. SwiftUI does much of the heavy lifting, but the widget still needs testing to confirm it renders as expected."},{"t":1097,"title":"Accented rendering mode","body":"Demonstrates an on-device test revealing a problem: in clear mode the reading goals widget's book cover becomes a large white rectangle, because in accented rendering mode the system cannot accent that image appropriately. The fix is applying **widgetAccentedRenderingMode(.fullColor)** to the image in the BookCoverImage view so covers render in full original color. The presenter stresses testing in full color, tinted, and clear environments, remembering iOS widgets also appear as remote widgets on macOS, and leaning on SwiftUI previews and WidgetKit developer mode to iterate faster."}],"code":["struct DailyReadingGoalWidget: Widget {\n    let kind = \"DailyReadingGoalWidget\"\n    \n    var body: some WidgetConfiguration {\n        StaticConfiguration(\n            kind: kind,\n            provider: DailyReadingGoalProvider()\n        ) { entry in\n            DailyReadingGoalView(book: entry.book,\n                                 message: entry.message,\n                                 timeOfDay: entry.timeOfDay)\n            .environment(\\.colorScheme, .dark)\n            .containerBackground(for: .widget) {\n                Background()\n            }\n        }\n    }\n}","struct DailyReadingGoalWidget: Widget {\n    let kind = \"DailyReadingGoalWidget\"\n\n    var body: some WidgetConfiguration {\n        StaticConfiguration(\n            kind: kind,\n            provider: DailyReadingGoalProvider()\n        ) { entry in\n            DailyReadingGoalView(book: entry.book,\n                                 message: entry.message,\n                                 timeOfDay: entry.timeOfDay)\n            .environment(\\.colorScheme, .dark)\n            .containerBackground(for: .widget) {\n                Background()\n            }\n        }\n        .supportedFamilies([.systemMedium])\n    }\n}","struct DailyReadingGoalWidget: Widget {\n    let kind = \"DailyReadingGoalWidget\"\n\n    var body: some WidgetConfiguration {\n        StaticConfiguration(\n            kind: kind,\n            provider: DailyReadingGoalProvider()\n        ) { entry in\n            DailyReadingGoalView(book: entry.book,\n                                 message: entry.message,\n                                 timeOfDay: entry.timeOfDay)\n            .environment(\\.colorScheme, .dark)\n            .containerBackground(for: .widget) {\n                Background()\n            }\n            .widgetURL(URL(string: \"bookclub://reading/\\(book.bookID)\"))\n        }\n        .supportedFamilies([.systemMedium])\n    }\n}","struct BookCoverImage: View {\n    let imageName: String\n\n    var body: some View {\n        Image(imageName: bundle: .main)\n            .widgetAccentedRenderingMode(.fullColor)\n    }\n}"]},"related":[{"id":"223","title":"Live Activities essentials","gloss":"Live Activities 核心要點","gloss_en":"Live Activities essentials","category":"swiftui","categoryLabel":"SwiftUI"},{"id":"269","title":"What’s new in SwiftUI","gloss":"SwiftUI 的新功能","gloss_en":"What's new in SwiftUI","category":"swiftui","categoryLabel":"SwiftUI"},{"id":"271","title":"Code-along: Build powerful drag and drop in SwiftUI","gloss":"程式碼共做：在 SwiftUI 打造強大的拖放功能","gloss_en":"Code-along: Build powerful drag and drop in SwiftUI","category":"swiftui","categoryLabel":"SwiftUI"},{"id":"272","title":"Use SwiftUI with AppKit and UIKit","gloss":"在 AppKit 與 UIKit 中使用 SwiftUI","gloss_en":"Use SwiftUI with AppKit and UIKit","category":"swiftui","categoryLabel":"SwiftUI"},{"id":"275","title":"Code-along: Add persistence with SwiftData","gloss":"程式碼實作：用 SwiftData 加入持久化","gloss_en":"Code-along: Add persistence with SwiftData","category":"swiftui","categoryLabel":"SwiftUI"}]}</script>
