<script id="d" type="application/json">{"s":{"id":"283","title":"Explore enhancements to visionOS object tracking","gloss":"探索 visionOS 物件追蹤的強化功能","category":"visionos","categoryLabel":"visionOS","duration":845,"url":"https://developer.apple.com/videos/play/wwdc2026/283/","takeaway":"visionOS 大幅強化**物件追蹤**，支援高更新率追蹤移動物件，並導入空間配件（spatial accessories）輸入。","chapters":[[0,"Introduction"],[140,"Object tracking"],[230,"Enable high frame rate tracking"],[290,"Extended training mode via command-line"],[325,"Object pose coordinate spaces"],[382,"Implement object tracking in iOS"],[440,"Spatial accessories"],[467,"Creating a spatial accessory"],[708,"Plug-and-play accessories"],[742,"Implementing in your app"],[746,"Discover and connect a spatial accessory"],[783,"Next steps"]],"points":[{"text":"以 `ReferenceObject.Configuration` 開啟 **`highFrameRateTrackingEnabled`**，追蹤移動與手持物件。","hot":true},{"text":"在 Mac 上用命令列 `xrun createml objecttracker` 的**擴充訓練模式（extended，all-angles）**產生 `.referenceobject`。","hot":false},{"text":"用 `coordinateSpace(correction:)` 取得 `.rendered` 或 `.none` 的物件姿態座標，分別對應顯示校正與公制空間。","hot":false},{"text":"物件追蹤也可在 **iOS** 上以 ARKit 實作，用 `detectionObjects`（低更新率）與 `trackingObjects`（高更新率）。","hot":false},{"text":"透過 GameController 的 `GCSpatialAccessory` 與 `AccessoryTrackingProvider` 探索並連接**空間配件**，支援隨插即用與動態更新。","hot":false}],"apis":["ARKit","RealityKit","ReferenceObject","ARReferenceObject","ARObjectAnchor","GCSpatialAccessory","AccessoryTrackingProvider","GameController"],"audience":"**開發 visionOS 空間運算或 AR 物件追蹤、配件互動**的開發者。","gloss_en":"Explore enhancements to visionOS object tracking","takeaway_en":"visionOS significantly enhances **object tracking**, supporting high-frame-rate tracking of moving objects and introducing spatial accessory input.","points_en":[{"text":"Enable **`highFrameRateTrackingEnabled`** via `ReferenceObject.Configuration` to track moving and handheld objects.","hot":true},{"text":"Generate a `.referenceobject` on Mac using the command-line `xrun createml objecttracker` with its **extended (all-angles) training mode**.","hot":false},{"text":"Use `coordinateSpace(correction:)` to get object pose coordinates in `.rendered` or `.none`, corresponding to display correction and metric space respectively.","hot":false},{"text":"Object tracking can also be implemented on **iOS** with ARKit, using `detectionObjects` (low frame rate) and `trackingObjects` (high frame rate).","hot":false},{"text":"Discover and connect **spatial accessories** through GameController's `GCSpatialAccessory` and `AccessoryTrackingProvider`, with support for hot-plugging and dynamic updates.","hot":false}],"audience_en":"Developers **building visionOS spatial computing or AR object tracking and accessory interactions**.","summary":["本場介紹 visionOS 27 在 **object tracking**（物件追蹤）與 **spatial accessories**（空間配件）上的進展，承接 visionOS 2.0 起的物件追蹤——只要有物件的 USDZ 模型，就能在 Mac 的 **Create ML** 透過機器學習訓練出 reference object，讓 app 取得實體物件的位置與方向來打造沉浸式體驗。visionOS 27 把追蹤擴展到**移動中與手持物件**，例如用手持醫療探針精準量測脊椎模型上椎骨間的距離，可應用於手術訓練、居家改造或引導組裝。","object tracking 有四項更新。其一，新增 **high frame rate tracking**，透過 ARKit 的 **Reference Object Configuration** API 對單一 reference object 啟用，且因非訓練設定，可依需求套在任何 reference object 上。其二，Create ML 新增 **extended training mode**，提升追蹤的準確度與穩健度（尤其手持時），建議搭配高幀率追蹤使用，但訓練時間明顯較長，CLI 亦可設定以便遠端機器訓練。其三，新增 **ARKit Coordinate Space Correction** API，可取得帶或不帶顯示校正的 anchor transform：`rendered` 維持虛擬內容與實體對齊，`none` 則回傳不受顯示校正影響的 **metric space** 姿態，這對量測類用途至關重要。其四，**object tracking 今年登陸 iOS**——同一份 reference object 在 iOS 與 visionOS 通用，用 world tracking configuration 搭配 `detectionObjects`／`trackingObjects`，並在 delegate 的 `didAdd`／`didUpdate`／`didRemove` 處理 `ARObjectAnchor`。","後半深入 **spatial accessories**：一個空間配件需含一塊電路板，上有供 Vision Pro 追蹤的 **LED 星座**、捕捉方向與加速度的 **IMU**，以及傳訊號的 **Bluetooth** 晶片，並可選配按鈕、觸控板與 haptics。相較物件追蹤，配件提供更高刷新率、更低延遲，在遮擋與低光下仍穩定追蹤，且能用實體按鈕與 haptics 強化互動。設計上要把 LED 散布成從各角度都獨特的圖樣、LED 與 IMU 須剛性固定、並依使用方式（手持／遠距）考量握持區、電池與 LED 數量大小。","驗證與導入流程：先用 Bluetooth 連上 Vision Pro，以開發者模式下的 **ARKit accessory tracking debug view** 透過 IR 相機檢查 LED、用即時指標驗證 IMU、並用 IR 照明器除錯時序。接著用 Create ML bundle 把標註了 IMU 與 LED 位置的 photorealistic USDZ 透過 CLI 產生 **reference accessory** 檔，作為製造商以 exported UTType 在 Info.plist 宣告即可系統層級註冊（第三方開發者則以 imported type 自行 bundle）。也可先用 DFRobot、MIKROE 等廠商即將推出的 **plug-and-play** 配件開發。app 端用新的 **`GCSpatialAccessory`** 探索配件、`Accessory(device)` 由 ARKit 自動解析、跑 `AccessoryTrackingProvider`，並用新的 `updateAccessories` 在不中斷追蹤下切換配件。最後比較四種追蹤路徑的取捨：物件追蹤適合需精準量測的情境（無 3D 模型時可用 marker），空間配件則適合需高刷新、低延遲、快速移動與更強互動的體驗。"],"deepdive":[{"t":0,"title":"Introduction","body":"visionOS 團隊的 Nathan Kong 開場：回顧 visionOS 2.0 起的 **object tracking**——用物件的 USDZ 在 Mac 的 Create ML 訓練出 reference object，讓 app 取得實體位置與方向。visionOS 27 把追蹤擴展到**移動中與手持物件**（如用手持醫療探針量測脊椎模型上椎骨間距），並擴大 **spatial accessories** 支援讓任何人都能打造自己的配件（如把 Spatial Anchor 裝進方向盤對齊全尺寸數位車內裝）。"},{"t":140,"title":"Object tracking","body":"概述 object tracking 的四項更新：支援**高幀率追蹤**讓 app 更掌握移動物件位置；Create ML 新增 **extended training mode** 提升準確度與穩健度（尤其手持時）；新增可取得**metric space** 物件姿態（不受顯示校正影響）的 API 以支援量測；以及**今年把 object tracking 帶上 iOS**。並以手電筒為例：有 photorealistic 3D 模型時可作 reference object，搭配 RealityKit 的 Physical Surroundings Light 即時打光；或 3D 列印一個 marker 貼上以追蹤任何手持物，即使手部部分遮擋仍穩定。"},{"t":230,"title":"Enable high frame rate tracking","body":"新增 ARKit on visionOS 的 **Reference Object Configuration** API：在建立追蹤 session 前對單一 reference object 啟用高幀率追蹤，並在載入該 reference object 時把此 configuration 物件當額外參數傳入。因為這不是訓練設定，可依 app 需求套在任何 reference object 上。"},{"t":290,"title":"Extended training mode via command-line","body":"Create ML 訓練 reference object 時可在 standard 與 **extended** training mode 間選擇：extended 提升追蹤準確度與穩健度、建議搭配高幀率追蹤，但訓練時間明顯較長。設定位於 Create ML app 的 Object Tracking 範本中、viewing angle 設定下方；其餘訓練流程不變，並可透過 CLI 設定 training mode，方便在遠端機器執行訓練。"},{"t":325,"title":"Object pose coordinate spaces","body":"預設的 object anchor transform 為了在 mixed immersion 下讓虛擬內容對齊實體，會略微調整姿態以匹配顯示的相機影像，因而影響其在絕對世界座標的準確度，限制了量測用途。visionOS 27 新增 **ARKit Coordinate Space Correction** API：查詢姿態時可選 `rendered`（套用顯示校正、保持視覺對齊）或 `none`（回傳不含校正的 **metric space** 姿態），後者適合量測物件間距或判定物件在實體空間的位置。"},{"t":382,"title":"Implement object tracking in iOS","body":"今年把 object tracking 帶上 iOS：iOS 27 的 ARKit API 支援 reference object，且因機器學習訓練與平台無關，訓練好的 reference object 在 iOS 與 visionOS 通用。做法是載入 reference object、建立 world tracking configuration，把物件指派給 `detectionObjects`（多為靜止）或 `trackingObjects`（移動物件的高幀率追蹤），跑 session 後在 delegate 處理 anchor——`didAdd` 取得 `ARObjectAnchor` 附加內容、`didUpdate` 提供最新姿態、`didRemove` 清理。"},{"t":440,"title":"Spatial accessories","body":"進入 spatial accessories：一個空間配件需含一塊電路板，上有供 Vision Pro 追蹤的 **LED 星座**、捕捉方向與加速度的 **IMU**、以及傳訊號的 **Bluetooth** 晶片，並可選配按鈕、觸控板等輸入與 haptics 等輸出。以裝上這些元件的手電筒示範：快速揮動時數位光束仍因 IMU 帶來的低延遲追蹤而平順跟隨，並可用實體按鈕開關數位光。"},{"t":467,"title":"Creating a spatial accessory","body":"說明配件的好處與設計考量。好處：可達全顯示刷新率的高頻、低延遲追蹤，支援快速運動；遮擋時仍穩定；低光下仍可追蹤；按鈕與 haptics 強化互動沉浸。設計：把 LED 散布成從各角度都獨特的圖樣；LED 與 IMU 須剛性固定於板上以求準確；依主要使用方式安排（手持配件把多數 LED 放在不會被握住處、留意電池大小與位置以求人體工學；遠距使用的大型配件要考量 LED 數量、大小與間距以確保遠處仍可追蹤）。詳見 Accessory Design Guidelines 的 Spatial Accessories 章節。"},{"t":708,"title":"Plug-and-play accessories","body":"在從零打造前，可先用 plug-and-play 配件開發：DFRobot、MIKROE 等廠商今年稍晚將推出現成的 reference 硬體與開發套件，可立即用於測試或實作於 visionOS app。示範把 seeMote Cap 之類的配件直接裝到手電筒上，用 Spatial Accessories API 實現同樣的數位重打光體驗。"},{"t":742,"title":"Implementing in your app","body":"概述驗證與導入流程：先用 ARKit accessory tracking debug view 驗證裝置訊號，再用 Create ML bundle 訓練出 reference accessory 檔並準備好給 app 使用。"},{"t":746,"title":"Discover and connect a spatial accessory","body":"先用 Bluetooth 連上 Vision Pro，並用開發者模式下設定中的 **ARKit accessory tracking debug view** 做三件事：透過頭戴 IR 相機確認 LED 明亮、清晰、同步；以頻率、延遲、各軸即時指標驗證 IMU 的尺度、對齊與動作反應；用裝置 IR 照明器作同步參考除錯時序。接著用 Create ML bundle：把標註 IMU 與 LED 位置的 photorealistic USDZ 經 CLI 產生 reference accessory 檔——製造商以 exported UTType 在 Info.plist 宣告即可系統層級註冊，第三方開發者則以 imported type 自行 bundle。app 端用新的 **`GCSpatialAccessory`** 探索配件，`Accessory(device)` 由 ARKit 自動解析後跑 `AccessoryTrackingProvider`，並用新的 `updateAccessories` 在不中斷追蹤下切換配件。"},{"t":783,"title":"Next steps","body":"收尾比較四種追蹤路徑的取捨：**object tracking** 適合需精準量測的情境，無 photorealistic 3D 模型時可在物件上貼 marker 來訓練 reference object；**spatial accessories** 提供更高刷新率與更低延遲，最適合需快速移動的體驗，若想更互動沉浸還可自製帶按鈕與 haptics 的配件。鼓勵打造工作與娛樂的轉化性體驗。"}],"summary_en":["This session covers visionOS 27 advances in **object tracking** and **spatial accessories**, building on object tracking since visionOS 2.0—where a USDZ model of an object lets you train a reference object via machine learning in **Create ML** on a Mac, so your app can get a physical object's position and orientation for immersive experiences. visionOS 27 extends tracking to **moving and handheld objects**, such as using a handheld medical probe to precisely measure the distance between vertebrae on a spine model, enabling uses like surgical training, home remodeling, or guided assembly.","Object tracking gets four updates. First, **high frame rate tracking**, enabled per reference object via ARKit's **Reference Object Configuration** API—and since it's not a training setting, it can be applied to any reference object as needed. Second, Create ML adds an **extended training mode** that improves accuracy and robustness (especially when holding objects), recommended with high frame rate tracking but taking significantly longer, and configurable via the CLI for training on a remote machine. Third, the new **ARKit Coordinate Space Correction** API returns the anchor transform with or without display corrections: `rendered` keeps virtual content aligned, while `none` returns the **metric space** pose unaffected by display corrections, essential for measuring. Fourth, **object tracking comes to iOS** this year—the same reference object works on both iOS and visionOS, using a world tracking configuration with `detectionObjects`/`trackingObjects` and handling `ARObjectAnchor` in the delegate's `didAdd`/`didUpdate`/`didRemove`.","The second half dives into **spatial accessories**: an accessory needs a board with a **constellation of LEDs** visible to Vision Pro for tracking, an **IMU** capturing orientation and acceleration, and a **Bluetooth** chip to send signals, plus optional buttons, a touchpad, and haptics. Compared to object tracking, accessories offer higher refresh rates and lower latency, track robustly through occlusion and in low light, and add interactivity via physical buttons and haptics. Design-wise, spread LEDs into a pattern that's distinct from every angle, rigidly fix the LEDs and IMU, and account for how users hold or view the device when placing the grip area, battery, and LED count/size.","Validation and adoption flow: connect over Bluetooth and use the developer-mode **ARKit accessory tracking debug view** to check LEDs via the IR camera, validate the IMU with live metrics, and debug timing with IR illuminators. Then use the Create ML bundle to generate a **reference accessory** file from a photorealistic USDZ annotated with IMU and LED positions via the CLI—as the manufacturer, declare it as an exported UTType in Info.plist for system-wide registration (third-party developers bundle it as an imported type). You can also start with **plug-and-play** accessories from vendors like DFRobot and MIKROE arriving later this year. In your app, discover accessories with the new **`GCSpatialAccessory`** class, let ARKit resolve `Accessory(device)`, run an `AccessoryTrackingProvider`, and use the new `updateAccessories` to switch accessories without interrupting tracking. The session closes by comparing four tracking approaches: object tracking suits precise measurement (use a marker when there's no 3D model), while spatial accessories suit high-refresh, low-latency, fast-motion, and more interactive experiences."],"deepdive_en":[{"t":0,"title":"Introduction","body":"visionOS team's Nathan Kong opens by recapping **object tracking** since visionOS 2.0—training a reference object from an object's USDZ in Create ML on a Mac so apps can get physical position and orientation. visionOS 27 extends tracking to **moving and handheld objects** (e.g., a handheld medical probe measuring distances between vertebrae on a spine model) and broadens **spatial accessories** so anyone can build their own (like mounting a Spatial Anchor in a steering wheel to align a full-scale digital car interior)."},{"t":140,"title":"Object tracking","body":"Overviews four updates: **high frame rate tracking** for better understanding of moving objects; Create ML's new **extended training mode** for accuracy and robustness (especially handheld); a new API to get the object's pose in **metric space** unaffected by display corrections for measuring; and bringing object tracking to **iOS** this year. The flashlight example shows using a photorealistic 3D model as the reference object with RealityKit's Physical Surroundings Light for real-time relighting, or 3D-printing a marker to track any handheld object robustly even when partly occluded."},{"t":230,"title":"Enable high frame rate tracking","body":"Adds a **Reference Object Configuration** API in ARKit on visionOS: enable high frame rate tracking per reference object before creating the tracking session, passing the configuration as an extra parameter when loading the reference object. Since it's not a training setting, it can be applied to any reference object as the app needs."},{"t":290,"title":"Extended training mode via command-line","body":"When training a reference object in Create ML, you can choose between standard and **extended** training mode: extended improves accuracy and robustness and is recommended with high frame rate tracking but takes significantly longer. The setting lives in Create ML's Object Tracking template below viewing angles; everything else is unchanged, and the training mode can be set via the CLI to run training on a remote machine."},{"t":325,"title":"Object pose coordinate spaces","body":"By default, object anchor transforms are tuned to align virtual content with the object in mixed immersion, slightly altering the pose to match the displayed camera images and thus affecting accuracy in absolute world coordinates—limiting measurement. visionOS 27 adds the **ARKit Coordinate Space Correction** API: querying a pose offers `rendered` (display corrections applied, keeping visual alignment) or `none` (the **metric space** pose without corrections), the latter ideal for measuring distances between objects or locating an object in physical space."},{"t":382,"title":"Implement object tracking in iOS","body":"Object tracking comes to iOS: iOS 27's ARKit APIs support reference objects, and since ML training is platform-agnostic, trained reference objects work on both iOS and visionOS. Load the reference objects, create a world tracking configuration, assign objects to `detectionObjects` (mostly stationary) or `trackingObjects` (high frame rate tracking of moving objects), run the session, and handle anchors in the delegate—`didAdd` gives an `ARObjectAnchor` to attach content, `didUpdate` provides latest poses, `didRemove` cleans up."},{"t":440,"title":"Spatial accessories","body":"Enters spatial accessories: an accessory needs a board with a **constellation of LEDs** visible to Vision Pro for tracking, an **IMU** for orientation and acceleration, and a **Bluetooth** chip to send signals, plus optional button/touchpad inputs and haptic outputs. A flashlight fitted with these components shows the digital beam following smoothly even when waved fast (low-latency IMU tracking), with a physical button toggling the digital light."},{"t":467,"title":"Creating a spatial accessory","body":"Covers benefits and design considerations. Benefits: high-frequency, low-latency tracking up to full display rate for fast motion; robust tracking through occlusion; tracking in low light; and buttons/haptics for interactivity. Design: spread LEDs into a pattern distinct from every angle; rigidly fix LEDs and IMU to the board for accuracy; and account for primary use (handheld accessories keep most LEDs away from grip areas, with battery size/position for ergonomics; larger far-field accessories need attention to LED count, size, and spacing for accurate distant tracking). See the Spatial Accessories chapter of the Accessory Design Guidelines."},{"t":708,"title":"Plug-and-play accessories","body":"Before building from scratch, you can develop with plug-and-play accessories: vendors like DFRobot and MIKROE will release off-the-shelf reference hardware and dev kits later this year, usable immediately for testing or in your app. The demo mounts a seeMote Cap onto the flashlight and uses the Spatial Accessories API for the same digital relighting experience."},{"t":742,"title":"Implementing in your app","body":"Overviews the validation and adoption flow: first validate the device's signals with the ARKit accessory tracking debug view, then train a reference accessory file with the Create ML bundle to prepare it for the app."},{"t":746,"title":"Discover and connect a spatial accessory","body":"Connect over Bluetooth and use the developer-mode **ARKit accessory tracking debug view** to do three things: confirm LEDs are bright, distinct, and synchronized via the headset's IR camera; validate the IMU with live frequency/latency/per-axis metrics for scale, alignment, and motion; and debug timing using the device's IR illuminators as a sync reference. Then use the Create ML bundle: generate a reference accessory file via the CLI from a photorealistic USDZ annotated with IMU and LED positions—manufacturers declare it as an exported UTType in Info.plist for system-wide registration, third-party developers bundle it as an imported type. In the app, discover accessories with the new **`GCSpatialAccessory`** class, let ARKit resolve `Accessory(device)` and run an `AccessoryTrackingProvider`, and use the new `updateAccessories` to switch accessories without interrupting tracking."},{"t":783,"title":"Next steps","body":"Closes by comparing four tracking approaches: **object tracking** excels where accurate, precise tracking is needed, and without a photorealistic 3D model you can train a reference object on a marker mounted to the object; **spatial accessories** offer higher refresh rates and lower latency, ideal for fast-moving experiences, and you can build your own with buttons and haptics for more interactivity. It encourages creating transformational experiences for work and play."}],"code":["// Enable high frame rate tracking\n\n// Create reference object configuration\nvar configuration = ReferenceObject.Configuration()\nconfiguration.highFrameRateTrackingEnabled = true\n\n// Load the reference object with ARKit API\nlet refObjURL = Bundle.main.url(forResource: \"flashlight\", withExtension: \".referenceobject\")\nlet refObject = try? await ReferenceObject(from: refObjURL!, configuration: configuration)","// Extended training mode on Mac using command-line interface\n\n% xrun createml objecttracker --source flashlight.usdz --output flashlight.referenceobject --training-mode extended --all-angles","// Different object pose spaces\n\n// Obtain anchor transform with display corrections\n\nlet renderingPose = myObjectAnchor.coordinateSpace(correction: .rendered)\n\n// Obtain anchor transform in metric space\n\nlet metricPose = myObjectAnchor.coordinateSpace(correction: .none)","// Implement object tracking in iOS\n\nimport ARKit\nimport RealityKit\n\nclass ObjectTrackingARSessionDelegate: NSObject, ARSessionDelegate {\n        let arView = ARView(frame: .zero)\n        var entities: [UUID: AnchorEntity] = [:]\n\n        func start() throws {\n                let stationaryObject = try ARReferenceObject(archiveURL:\n                        Bundle.main.url(forResource: \"stationary\", withExtension: \"referenceobject\")!)\n                let movingObject = try ARReferenceObject(archiveURL:\n                        Bundle.main.url(forResource: \"moving\", withExtension: \"referenceobject\")!)\n\n                let configuration = ARWorldTrackingConfiguration()\n                configuration.detectionObjects = [stationaryObject]   // Low frame rate\n                configuration.trackingObjects = [movingObject]        // High frame rate\n\n                arView.session.delegate = self\n                arView.session.run(configuration)\n        }\n\n\t\t\t\tfunc session(_ session: ARSession, didAdd anchors: [ARAnchor]) {\n                for case let anchor as ARObjectAnchor in anchors {\n                        let entity = AnchorEntity(anchor: anchor)\n                        entities[anchor.identifier] = entity\n                        arView.scene.addAnchor(entity)\n                }\n        }\n\n        func session(_ session: ARSession, didUpdate anchors: [ARAnchor]) {\n                for case let anchor as ARObjectAnchor in anchors {\n                        entities[anchor.identifier]?.isEnabled = anchor.isTracked\n                }\n        }\n\n        func session(_ session: ARSession, didRemove anchors: [ARAnchor]) {\n                for case let anchor as ARObjectAnchor in anchors {\n                        if let entity = entities.removeValue(forKey: anchor.identifier) {\n                                arView.scene.removeAnchor(entity)\n                        }\n                }\n        }\n}","import ARKit\nimport GameController\n\n// Generic accessory discovery\n\nif let device = GCSpatialAccessory.spatialAccessories.first {\n\n        // Resolves the .referenceaccessory bundle automatically\n        \n        let accessory = try await Accessory(device: device)\n        let provider = AccessoryTrackingProvider(accessories: [accessory])\n        try await arkitSession.run([provider])\n}\n\n// Update tracked accessories without restarting the session                             \n\ntry await provider.updateAccessories([newAccessory])"]},"related":[{"id":"279","title":"Explore advances in RealityKit","gloss":"探索 RealityKit 的最新進展","gloss_en":"Explore advances in RealityKit",
