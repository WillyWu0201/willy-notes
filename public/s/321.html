<script id="d" type="application/json">{"s":{"id":"321","title":"Dive into lazy stacks and scrolling with SwiftUI","gloss":"深入 SwiftUI 的 lazy stacks 與捲動","category":"swiftui","categoryLabel":"SwiftUI","duration":1270,"url":"https://developer.apple.com/videos/play/wwdc2026/321/","takeaway":"理解 LazyVStack／LazyHStack 如何估算尺寸與延遲載入子視圖，並善用 scroll transition、prefetch 與程式化捲動打造流暢的捲動體驗。","chapters":[[0,"Introduction"],[83,"Origami app"],[84,"Layout"],[311,"Horizontally scrolling showcase"],[390,"Showcase section"],[424,"Scroll effect"],[456,"Scroll effect"],[500,"Scroll to Showcase button"],[531,"Scroll to Showcase button"],[553,"Subview loading"],[569,"One resolved subview"],[603,"Multiple resolved subviews"],[652,"Dynamic number of subviews"],[706,"Filtering on the view level"],[735,"Filtering on the data level"],[755,"Optional unwrapping"],[768,"Optional unwrapping"],[795,"Prefetching"],[928,"Loading more content"],[953,"Setting up lazy stack subview in onAppear"],[974,"Lazy stack subview ready before onAppear"],[983,"Loading diagram with task modifier"],[1000,"Loading diagram in initializer"],[1036,"Highlight @State variable"],[1053,"Highlight @Binding"],[1060,"Programmatic scrolling"],[1078,"Programmatically scroll to showcase"],[1104,"Dynamic number of views"],[1133,"Filter at the data level"],[1156,"Using onGeometryChange in lazy stack subview"],[1157,"Using custom layout in lazy stack subview"],[1195,"Next steps"]],"points":[{"text":"深入解析 **LazyVStack** 與 **LazyHStack** 如何估算尺寸並延遲載入子視圖，是流暢捲動的關鍵。","hot":true},{"text":"建議**在資料層而非視圖層做過濾**（例如以 @Query 的 #Predicate），避免子視圖數量在出現後才改變。","hot":false},{"text":"用 **scrollTransition** 製作捲動特效，並以 **onScrollGeometryChange** 與 **onScrollTargetVisibilityChange** 觀測捲動狀態。","hot":false},{"text":"在 **initializer** 而非 onAppear 設定子視圖狀態與載入工作，可在出現前就準備好內容、減少跳動。","hot":false},{"text":"透過 **ScrollPosition** 搭配 scrollTo 做程式化捲動，並避免在視圖出現後改變版面。","hot":false}],"apis":["LazyVStack","LazyHStack","ScrollView","scrollTransition","onScrollGeometryChange","onScrollTargetVisibilityChange","ScrollPosition","onGeometryChange","Layout","Query"],"audience":"適合**已熟悉 SwiftUI、想深入優化長列表與捲動效能的開發者**。","gloss_en":"Dive into lazy stacks and scrolling with SwiftUI","takeaway_en":"Understand how LazyVStack / LazyHStack estimate sizes and lazily load subviews, and make good use of scroll transitions, prefetching, and programmatic scrolling to build a smooth scrolling experience.","points_en":[{"text":"A deep dive into how **LazyVStack** and **LazyHStack** estimate sizes and lazily load subviews—the key to smooth scrolling.","hot":true},{"text":"Recommends **filtering at the data layer rather than the view layer** (for example with @Query's #Predicate) to avoid the subview count changing after they appear.","hot":false},{"text":"Use **scrollTransition** for scroll effects, and observe scroll state with **onScrollGeometryChange** and **onScrollTargetVisibilityChange**.","hot":false},{"text":"Set subview state and kick off loading work in the **initializer** rather than onAppear, so content is ready before it appears and there's less jumping.","hot":false},{"text":"Do programmatic scrolling with **ScrollPosition** and scrollTo, and avoid changing layout after a view appears.","hot":false}],"audience_en":"**Developers already familiar with SwiftUI who want to dig deeper into optimizing long lists and scrolling performance.**","summary":["這場由 UI Frameworks 工程師 Rens 主講，是對 SwiftUI **lazy stacks** 與捲動的深度複習。**LazyVStack** 與 **LazyHStack** 是任何需要長篇、自訂捲動內容的 app 的核心元件，其威力來自簡單性——能與 reorderable、swipe actions 等其他元件自由組合。講者以一個摺紙（Origami）教學 app 貫穿全場，逐步拆解 lazy stack 的內部運作：它只會評估、渲染**可見區域**內的 view，把離畫面的 view 移除，因此比 VStack 更有效率；但代價是離畫面 view 的高度與寬度都是**估算**的，捲動位置（content offset）也因此不精確、會隨著學到更多 view 而變動。","接著講者示範了**版面與佈局**的注意事項：LazyVStack 的理想寬度取自第一個 subview，LazyHStack 的理想高度亦然，所以遇到可變高度（如多行字幕）應**固定高度**；用 `pinnedViews` 可釘住 section header。在效能反模式上，`scrollTransition` 不要把原本不可見的 view 推進可見區（lazy stack 會誤判而提早消失）；判斷按鈕顯示與否應避免用絕對 content offset，改用 **`onScrollTargetVisibilityChange`** 這類以**相對可見性**為基準的 API。更關鍵的洞見是：一個 view struct 不一定對應一個 lazy stack subview——body 裡多個頂層 view 會各自被載入；而在 leaf view 裡用條件式（如依 `detailLevel`、optional unwrapping）產生**動態數量的 subview** 會害 lazy stack 為了維持 index 而把 view 留得比預期久，正解是在**資料層過濾**（例如 SwiftData `Query` 的 `#Predicate`）。","後半段談 **prefetching**：lazy stack 會在 view 真正出現前先做部分渲染工作，把成本分散到多個 frame，避免捲動掉幀（hitch）。因此你應在 **initializer** 而非 `onAppear` 就把 view 設定到合理狀態，否則 prefetch 的成果會被丟棄;`task` 或搭配 cache 的 observable loader 也能讓資料更早載入。同時要記得離畫面的 view 狀態最終會被釋放，重要狀態（如 highlight）應移到 model 或用 **`@Binding`** 提升到外層。最後在**程式化捲動**上，`ScrollPosition` 可捲到尚未載入的 view；要捲得順暢，務必讓每個 ForEach 元素**穩定對應單一 subview**、在資料層過濾、並避免 view 出現後才用 `onGeometryChange` 改變佈局（必要時改用 custom **`Layout`**）。理解這些機制，才能把 lazy stack 用到極致。"],"deepdive":[{"t":0,"title":"Introduction","body":"UI Frameworks 工程師 Rens 開場，指出 **lazy stacks** 是任何顯示長篇、自訂捲動內容的 SwiftUI app 的核心元件，其威力來自**簡單性**——能與其他元件自由組合，例如 2027 的 reorderable 拖拉重排、以及 list 之外的 swipe actions。本場將深入講解 lazy stack 如何運作、能做什麼、又該避免什麼。"},{"t":83,"title":"Origami app","body":"介紹貫穿全場的範例：一個顯示摺紙教學步驟的 **Origami app**，目前只示範摺天鵝的步驟。"},{"t":84,"title":"Layout","body":"說明主畫面結構：`ScrollView` 內放 `LazyVStack`，再對每個步驟放一個 `StepView`。**LazyVStack** 與 VStack 不同——它不評估或渲染不可見的 view，只由上到下擺放直到填滿可見區，捲動時再依需要加入/移除 view，因此更有效率。代價是離畫面 view 的高度需**估算**（依已擺放 view 的平均尺寸與剩餘數量），寬度則取自第一個 subview；估算不精確，使得整體高度與**捲動位置**會隨捲動變動，例如 iPhone 轉向後捲回頂端時 lazy stack 必須沿途修正估算的上方空間並同步調整 content offset。"},{"t":311,"title":"Horizontally scrolling showcase","body":"為了讓使用者分享成品照片，新增一個 **Showcase** view：內含水平 `ScrollView` 加 `LazyHStack`，於是出現 LazyHStack 巢狀在外層 LazyVStack 的結構。這種巢狀對效能有利（不是每個人都會捲到這些額外 view）。LazyHStack 的理想高度同樣取自第一個 subview，所以若每張照片有可變行數的說明文字，較長的會被裁掉——最佳解是**固定 view 高度**（例如設 line limit 並預留空間）。"},{"t":390,"title":"Showcase section","body":"改把照片以較大尺寸直向排在步驟下方，並放進一個 **Section**。透過 LazyVStack 的 **`pinnedViews: [.sectionHeaders]`** 參數，捲動時 Showcase 的 section header 會釘在頂端。"},{"t":424,"title":"Scroll effect","body":"示範一個**反模式**：用 `.scrollTransition` 對照片加上 `rotationEffect` 與 `scaleEffect`。由於 lazy stack 只依 view 的**原始位置**載入，這種 transform 把 view 推出了原本的 frame，導致 lazy stack 誤以為它離畫面而提早消失——示範中粉紅天鵝太早不見。"},{"t":456,"title":"Scroll effect","body":"給出正確做法：改用不會把 view 推出可見區的 `scaleEffect`（依 `phase.value` 縮放但不位移），運作正常。原則是：對 lazy stack 內的 view 套 scroll transition 時，**別讓原本不可見的 view 被 transform 推進可見區**，因為 lazy stack 不會察覺。"},{"t":500,"title":"Scroll to Showcase button","body":"新增一顆「捲到 Showcase」按鈕，希望只在接近頂端時顯示。第一版用 `.onScrollGeometryChange` 取**絕對 content offset**，捲超過 100 點就隱藏按鈕。雖然能動，但因 lazy stack 的 content offset 是估算的，按鈕消失的確切位置會隨估算改變而飄移。"},{"t":531,"title":"Scroll to Showcase button","body":"給出較佳做法：改用以**相對可見性**為基準的 **`.onScrollTargetVisibilityChange`**，當可見區內的 subview 可見性改變時觸發。按鈕的顯示只取決於哪些 subview 可見（threshold 設 0.8），避開了估算 content offset 的不穩定。"},{"t":553,"title":"Subview loading","body":"提出本段核心觀念：lazy stack 在 view 即將進入可見區時才載入它，但它個別載入的 subview **不一定**直接對應你在程式碼裡定義的 view struct。"},{"t":569,"title":"One resolved subview","body":"回到最初的簡單 `ContentView`：此時 `StepView` 與 LazyVStack 看到的 subview 是 **1 對 1** 的。`ScrollView` 內有 LazyVStack，LazyVStack 內有 ForEach，而 ForEach 會 resolve 成每個步驟一個 StepView——這些通常就是 lazy stack 載入的 subview。"},{"t":603,"title":"Multiple resolved subviews","body":"示範較複雜的情況：當 `StepView` 的 body 在頂層放了 `StepDiagram` 與 `StepInstructions` 兩個 view 且未包在 VStack 裡時，每個 StepView 會 **resolve 成兩個 view**。LazyVStack 會**分別**評估與載入這兩者（但仍需先評估 StepView 才能建立任一個)。"},{"t":652,"title":"Dynamic number of subviews","body":"示範要小心的情況：`StepView` 依 `detailLevel` 環境值決定是否顯示，於是每個 StepView 會 resolve 成**一個或零個 subview**。雖然內容仍是 lazy 載入，但因為 lazy stack 用 **index** 定址可見 subview，它必須把較早的 StepView 留著（以防 detailLevel 改變而影響 index）。結論：在 ForEach 中大量建立的 leaf view 裡，**避免產生動態數量的 subview**。"},{"t":706,"title":"Filtering on the view level","body":"進一步說明前述反模式的代價：若 StepView body 還用了像 `writingStyle` 這種不相關的環境值，當它改變時，連已捲離畫面的 view 都可能被重新評估 body，造成不必要的 view update，且 lazy stack 不會釋放這些 StepView 的狀態。"},{"t":735,"title":"Filtering on the data level","body":"給出正解：**在資料層過濾**。若使用 SwiftData，就用 `#Predicate` 過濾 `Query`（這裡把 `detailLevel` 放進 predicate）。如此 LazyVStack 能立即得知 subview 數量，不必為了計算數量或 index 而建構 view。"},{"t":755,"title":"Optional unwrapping","body":"提醒在 view body 裡 **unwrap optional** 也有同樣效果：這裡用 `if let token` 解開 `apiToken` 環境值，body 只在 token 非 nil 時回傳內容——這同樣造成動態數量的 subview。"},{"t":768,"title":"Optional unwrapping","body":"給出較佳結構：token 可由 `NetworkClient` model 物件處理；若未驗證，應在**更上層**的 view 顯示 `ContentUnavailableView`，而不是一開始就放 lazy stack。也提到 lazy stack 因只保留少量資料在記憶體，不需做完整 diff，只對可見 view 做最小變更檢查。"},{"t":795,"title":"Prefetching","body":"介紹 **prefetching**：當捲動方向到達已擺放內容的邊緣時，lazy stack 會在 view 上畫面前就先做部分渲染工作。捲動時 ScrollView 必須在 frame deadline 內穩定畫出每一幀，若擺放新 view 的工作超時就會**掉幀（hitch）**;prefetching 會先檢查是否有足夠時間，預先評估 body 與佈局（甚至預先處理巢狀 LazyHStack），把工作分散到多個 frame，等 view 真正出現時大半工作已完成。"},{"t":928,"title":"Loading more content","body":"示範 `onAppear` 的合理用途之一——**無限捲動**：最後一個 `ProgressView` 加上 `.onAppear`，當它出現時 `pager.fetchPage()` 抓取下一頁照片。"},{"t":953,"title":"Setting up lazy stack subview in onAppear","body":"示範**反模式**：在每個 view 的 `onAppear` 裡才用 `viewModel.configure(with: id)` 做設定，使得 view 的尺寸與大部分內容在擺放後才劇烈改變。如此 prefetching 先做的工作會被丟棄、出現時得重做，lazy stack 還可能載入比需要更多的 view，影響捲動。"},{"t":974,"title":"Lazy stack subview ready before onAppear","body":"給出正解：在 **initializer** 就把 view 設好（用 `State(initialValue:)` 建立帶 id 的 viewModel），讓 view 在出現前就處於合理狀態。也補充：body 通常先被呼叫、`onAppear` 稍後才在擺放時呼叫；若捲動方向反轉，body 甚至可能因 prefetching 被呼叫但 `onAppear` 從未被呼叫。"},{"t":983,"title":"Loading diagram with task modifier","body":"示範用 **`task`** modifier 在 view 出現時從網路遠端載入 diagram（`diagram = await diagramLoader.loadDiagram(id:)`）。這可行，但仍是在出現時才開始載入。"},{"t":1000,"title":"Loading diagram in initializer","body":"示範如何善用 prefetching 讓資料**更早**載入：用一個連到 cache 的 `DiagramLoader` observable 物件，在其 **initializer** 中（cache 沒命中時）就立刻開始載入 diagram，因此會比等到出現時稍早抓到，提高出現時已就緒的機率。"},{"t":1036,"title":"Highlight @State variable","body":"示範**狀態保存**的陷阱：`StepView` 用 `@State var isHighlighted`。離畫面的 view 雖會保留數次更新以備捲回，但最終會從記憶體刪除、連帶刪除其 state——所以一旦捲走，highlight 狀態就遺失。結論：別把需在捲動後存活的資料放在 view state。"},{"t":1053,"title":"Highlight @Binding","body":"給出正解：把重要狀態移到 model 物件，或用 **`@Binding`** 提升到外層 view。這裡 `ContentView` 持有 `@State var highlighted: Set\u003cStep.ID>`，StepView 透過 `@Binding` 共享，highlight 就不會因捲動而遺失。"},{"t":1060,"title":"Programmatic scrolling","body":"進入**程式化捲動**主題，並給出讓 lazy stack 內捲動順暢的建議。"},{"t":1078,"title":"Programmatically scroll to showcase","body":"示範用 **`ScrollPosition`** binding 程式化捲到 showcase 的 section header（`scrollPosition.scrollTo(id:)`）。即使目標 view 不在畫面上也能捲到——lazy stack 會估算其位置，並在動畫捲動的每一幀更新該估算。"},{"t":1104,"title":"Dynamic number of views","body":"重申**動態數量 subview** 對程式化捲動也有效能衝擊。若每個 ForEach 元素都**穩定 resolve 成單一 subview**，lazy stack 就能直接查 ForEach 找到要捲到的 ID 而不必建構任何 view，捲動最有效率。"},{"t":1133,"title":"Filter at the data level","body":"再次強調：捲到接近結尾的 subview 時，若 lazy stack 能快速數出 subview 數量會更順——所以別在 view body 用條件式過濾，要在**資料層過濾**（例如用 `Query` 的 predicate）。"},{"t":1156,"title":"Using onGeometryChange in lazy stack subview","body":"示範另一個讓捲動變不順的常見模式：用 **`onGeometryChange`** 把量到的字幕高度存進 state（`subtitleHeight`），再於另一次佈局 pass 用它算 diagram 的 frame。lazy stack 先量到 view 的原始高度，但高度在出現後才改變、把其他內容往下推，使捲動不可靠。"},{"t":1157,"title":"Using custom layout in lazy stack subview","body":"給出正解：當無法只靠 SwiftUI 佈局基本元件時，改用**自訂 `Layout`**（這裡是 `StepLayout`）來一次算好佈局，避免 view 出現後才改變高度。並指向「Compose custom layouts with SwiftUI」場次深入了解。"},{"t":1195,"title":"Next steps","body":"總結全場：涵蓋 lazy stack 的佈局、view struct 不一定對應單一 subview 及其影響、prefetching 如何提升捲動效能、以及程式化捲到離畫面 view。最佳實務包括：避免依賴估算且不穩的絕對 content size/offset、別在 leaf view 用條件式過濾資料、盡量在 `onAppear` 前設好 subview、以及別在 view 出現後改變佈局。"}],"summary_en":["Presented by UI Frameworks Engineer Rens, this session is a deep refresher on SwiftUI **lazy stacks** and scrolling. **LazyVStack** and **LazyHStack** are essential for any app showing long, custom scrolling content, and their power comes from simplicity — they compose freely with other components like reorderable and swipe actions. Using an Origami tutorial app throughout, the talk dissects how lazy stacks work internally: they only evaluate and render views in the **visible region**, removing off-screen views, which makes them more efficient than a VStack. The cost is that off-screen view heights and widths are **estimated**, so the scroll position (content offset) is imprecise and shifts as the stack learns more about new views.","The session then covers **layout** caveats: a LazyVStack's ideal width comes from its first subview, as does a LazyHStack's ideal height, so variable heights (e.g. multi-line captions) should be **fixed**; `pinnedViews` pins section headers. On performance anti-patterns, a `scrollTransition` must not push normally-invisible views into the visible rect (the lazy stack thinks they're off-screen and they vanish too early); deciding button visibility should avoid absolute content offset in favor of relative-visibility APIs like **`onScrollTargetVisibilityChange`**. A key insight: one view struct doesn't always map to one lazy stack subview — multiple top-level views in a body are each loaded; and using conditionals in leaf views (e.g. by `detailLevel` or optional unwrapping) to produce a **dynamic number of subviews** keeps views alive longer than expected, since the stack addresses subviews by index. The fix is to **filter at the data level** (e.g. a SwiftData `Query` with a `#Predicate`).","The second half explains **prefetching**: lazy stacks perform part of a view's rendering work before it appears, spreading the cost across frames to avoid scroll hitches. So you should configure a view to a reasonable state in its **initializer** rather than `onAppear`, or the prefetched work is discarded; a `task` or a cache-backed observable loader can load data earlier too. Remember that off-screen view state is eventually released, so important state (like highlight) should move to a model or be lifted via **`@Binding`**. Finally, on **programmatic scrolling**, `ScrollPosition` can scroll to a not-yet-loaded view; for smoothness, ensure each ForEach element **resolves to a single stable subview**, filter at the data level, and avoid changing layout after a view appears with `onGeometryChange` (use a custom **`Layout`** instead). Understanding these mechanisms lets you get the most out of lazy stacks."],"deepdive_en":[{"t":0,"title":"Introduction","body":"UI Frameworks Engineer Rens opens by noting that **lazy stacks** are essential to any SwiftUI app showing long, custom scrolling content, and that their power comes from **simplicity** — they compose freely with other components, such as 2027's reorderable drag-and-reorder and swipe actions outside of List. The session will dive into how lazy stacks work, what you can do with them, and what to avoid."},{"t":83,"title":"Origami app","body":"Introduces the running example: an **Origami app** showing instructions for folding origami pieces, currently demonstrating only the steps to make a swan."},{"t":84,"title":"Layout","body":"Explains the main view: a `ScrollView` containing a `LazyVStack` with a `StepView` per step. Unlike a VStack, a **LazyVStack** doesn't evaluate or render invisible views — it lays them out top to bottom until the visible rect is filled, adding/removing views as you scroll, making it more efficient. The cost is that off-screen view heights are **estimated** (from the average size of placed views and remaining count), the width comes from the first subview, and because estimates are imprecise the overall height and **scroll position** shift while scrolling — e.g. after an iPhone orientation change, scrolling back to the top forces the stack to correct the estimated space above and adjust content offset accordingly."},{"t":311,"title":"Horizontally scrolling showcase","body":"To let users share photos of their creations, a **Showcase** view is added: a horizontal `ScrollView` with a `LazyHStack`, producing a LazyHStack nested inside the outer LazyVStack. This nesting is good for performance (not everyone scrolls to these extra views). A LazyHStack's ideal height also comes from its first subview, so if each photo had a variable-line caption, longer ones would be cut off — the best fix is to **fix view heights** (e.g. set a line limit and reserve space)."},{"t":390,"title":"Showcase section","body":"The photos are instead placed larger and vertically below the steps, inside a **Section**. Using the LazyVStack's **`pinnedViews: [.sectionHeaders]`** parameter, the Showcase section header sticks to the top while scrolling."},{"t":424,"title":"Scroll effect","body":"Demonstrates an **anti-pattern**: applying `.scrollTransition` with `rotationEffect` and `scaleEffect` to the photos. Because the lazy stack loads views based on their **original position**, this transform pushes views out of their frame, making the stack believe they're off-screen so they disappear too early — the pink swan vanishes prematurely in the demo."},{"t":456,"title":"Scroll effect","body":"Shows the correct approach: a `scaleEffect` that doesn't push views out of the visible rect (scaling by `phase.value` without displacement), which works fine. The principle: when applying a scroll transition to views in a lazy stack, **don't let normally-invisible views get pushed into the visible rect**, because the lazy stack won't be aware of it."},{"t":500,"title":"Scroll to Showcase button","body":"Adds a \"scroll to Showcase\" button that should only be visible near the top. The first version uses `.onScrollGeometryChange` to read the **absolute content offset**, hiding the button when scrolled past 100 points. It works, but because the lazy stack's content offset is estimated, the exact point where the button disappears shifts as estimates change."},{"t":531,"title":"Scroll to Showcase button","body":"Shows the better approach: use the relative-visibility based **`.onScrollTargetVisibilityChange`**, whose closure fires when the visibility of subviews in the visible region changes. The button's visibility depends only on which subviews are visible (threshold 0.8), avoiding the instability of estimated content offset."},{"t":553,"title":"Subview loading","body":"Raises the key idea for this segment: lazy stacks load a view when it's about to enter the visible region, but the individual subviews they load do **not** always correspond directly to the view structs you define in code."},{"t":569,"title":"One resolved subview","body":"Returns to the simple `ContentView`: here `StepView` instances and the subviews the LazyVStack sees are **1-to-1**. The `ScrollView` has a LazyVStack, which has a ForEach, and the ForEach resolves to one StepView per step — usually exactly the subviews the lazy stack loads."},{"t":603,"title":"Multiple resolved subviews","body":"Demonstrates a more complex case: when `StepView`'s body has two top-level views, `StepDiagram` and `StepInstructions`, not wrapped in a VStack, each StepView **resolves to two views**. The LazyVStack evaluates and loads both **separately** (though StepView still has to be evaluated to create either)."},{"t":652,"title":"Dynamic number of subviews","body":"Demonstrates a case to watch out for: `StepView` checks a `detailLevel` environment value to decide visibility, so each StepView resolves to **one or zero subviews**. Although contents are still loaded lazily, because the lazy stack addresses visible subviews by **index**, it must keep earlier StepViews alive in case detailLevel changes and shifts the indices. Conclusion: in leaf views created many times in a ForEach, **avoid a dynamic number of subviews**."},{"t":706,"title":"Filtering on the view level","body":"Elaborates on the cost of that anti-pattern: if the StepView body also uses an unrelated environment value like `writingStyle`, a change to it can trigger body evaluations even for views scrolled off-screen, causing unnecessary view updates, and the lazy stack won't release these StepViews' state."},{"t":735,"title":"Filtering on the data level","body":"Gives the fix: **filter at the data level**. With SwiftData, filter the `Query` with a `#Predicate` (here placing `detailLevel` in the predicate). This makes the subview count immediately clear to the LazyVStack, which no longer has to construct views just to compute counts or indices."},{"t":755,"title":"Optional unwrapping","body":"Warns that **unwrapping an optional** in a view body has the same effect: here `if let token` unwraps an `apiToken` environment value and the body only returns content when it's non-nil — also producing a dynamic number of subviews."},{"t":768,"title":"Optional unwrapping","body":"Shows a better structure: the token could be handled by a `NetworkClient` model object; if unauthenticated, a view **higher up** the hierarchy should show a `ContentUnavailableView` rather than placing the lazy stack at all. Also notes that since lazy stacks keep little data in memory, they don't perform a full diff — only a minimal check for changes in visible views."},{"t":795,"title":"Prefetching","body":"Introduces **prefetching**: when scrolling reaches the edge of placed content, the lazy stack performs part of a view's rendering work before it's on screen. While scrolling, the ScrollView must draw frames within a deadline; if placing new views overruns it, a frame is dropped — a visible **hitch**. Prefetching checks whether there's enough time to pre-evaluate a view's body and layout (even a nested LazyHStack), spreading the work across frames so most of it is done by the time the view appears."},{"t":928,"title":"Loading more content","body":"Shows a legitimate use of `onAppear` — **infinite scrolling**: the final `ProgressView` has an `.onAppear` that calls `pager.fetchPage()` to fetch the next page of photos when it appears."},{"t":953,"title":"Setting up lazy stack subview in onAppear","body":"Demonstrates an **anti-pattern**: configuring each view only in `onAppear` via `viewModel.configure(with: id)`, so the view's size and most of its content change dramatically after placement. The work prefetching did is thrown away and redone on appear, the lazy stack may load more views than needed, and scrolling suffers."},{"t":974,"title":"Lazy stack subview ready before onAppear","body":"Gives the fix: set up the view in the **initializer** (building the viewModel with `State(initialValue:)` from the id) so it's in a reasonable state before appearing. Also notes body is generally called first and `onAppear` only later when placed; if scroll direction reverses, body may be called via prefetching while `onAppear` is never called."},{"t":983,"title":"Loading diagram with task modifier","body":"Demonstrates using the **`task`** modifier to remotely load a diagram from the internet when the view appears (`diagram = await diagramLoader.loadDiagram(id:)`). This works but still starts loading only on appear."},{"t":1000,"title":"Loading diagram in initializer","body":"Shows how to leverage prefetching to load data **earlier**: a cache-backed `DiagramLoader` observable object starts loading the diagram in its **initializer** (when the cache misses), so it's fetched slightly sooner and is more likely to be ready by the time the view appears."},{"t":1036,"title":"Highlight @State variable","body":"Demonstrates a **state-preservation** pitfall: `StepView` uses `@State var isHighlighted`. Off-screen views are kept for a few updates in case they scroll back, but are eventually deleted from memory along with their state — so once scrolled away, the highlight is lost. Conclusion: don't keep data that must survive scrolling in view state."},{"t":1053,"title":"Highlight @Binding","body":"Gives the fix: move important state to a model object, or lift it to an outer view via **`@Binding`**. Here `ContentView` holds `@State var highlighted: Set\u003cStep.ID>` and StepView shares it through a `@Binding`, so the highlight isn't lost on scroll."},{"t":1060,"title":"Programmatic scrolling","body":"Moves into **programmatic scrolling**, offering tips to make scrolling work well in lazy stacks."},{"t":1078,"title":"Programmatically scroll to showcase","body":"Demonstrates using a **`ScrollPosition`** binding to programmatically scroll to the showcase's section header (`scrollPosition.scrollTo(id:)`). This works even when the target view isn't on screen — the lazy stack estimates its position and updates that estimate on every frame of an animated scroll."},{"t":1104,"title":"Dynamic number of views","body":"Reiterates that a **dynamic number of subviews** also hurts programmatic scrolling. If each ForEach element **reliably resolves to a single subview**, the lazy stack can query the ForEach to find the ID to scroll to without constructing any views — the most performant case."},{"t":1133,"title":"Filter at the data level","body":"Stresses again that scrolling to a subview near the end is smoother if the lazy stack can quickly count subviews — so don't filter with a conditional in the view body; **filter at the data level** (e.g. a predicate on a `Query`)."},{"t":1156,"title":"Using onGeometryChange in lazy stack subview","body":"Demonstrates another common pattern that hurts scrolling: using **`onGeometryChange`** to store a measured subtitle height in state (`subtitleHeight`), then using it in another layout pass to compute the diagram's frame. The lazy stack measures the view's original height, but it changes after appearing and pushes other content down, making scrolling unreliable."},{"t":1157,"title":"Using custom layout in lazy stack subview","body":"Gives the fix: when SwiftUI's layout primitives aren't enough, use a custom **`Layout`** (here `StepLayout`) to compute the layout in one pass and avoid changing height after the view appears. Points to the \"Compose custom layouts with SwiftUI\" session for more."},{"t":1195,"title":"Next steps","body":"Wraps up the whole session: covering lazy stack layout, how view structs don't always resolve to a single subview and the consequences, how prefetching improves scrolling performance, and programmatic scrolling to off-screen views. Best practices include avoiding the estimated, unstable absolute content size/offset, not filtering data with conditionals in leaf views, setting up subviews before `onAppear` where possible, and not changing layout after subviews appear."}],"code":["// Origami app\n\nstruct ContentView: View {\n    var body: some View {\n        ScrollView {\n            LazyVStack {\n                ForEach(steps) { step in\n                    StepView(step: step)\n                }\n            }\n        }\n    }\n}\n\nstruct StepView: View { /* ... */ }","// Horizontally scrolling showcase\n\nstruct ContentView: View {\n    var body: some View {\n        ScrollView {\n            LazyVStack {\n                ForEach(steps) { step in\n                    StepView(step: step)\n                }\n                Showcase()\n            }\n        }\n    }\n}\n\nstruct StepView: View { /* ... */ }\n\nstruct Showcase: View {\n    var body: some View {\n        ScrollView(.horizontal) {\n            LazyHStack {\n                ForEach(photos) { photo in\n                    PhotoView(photo: photo)\n                }\n            }\n        }\n    }\n}","// Showcase section\n\nstruct ContentView: View {\n    var body: some View {\n        ScrollView {\n            LazyVStack(pinnedViews: [.sectionHeaders]) {\n                ForEach(steps) { step in\n                    StepView(step: step)\n                }\n                Showcase()\n            }\n        }\n    }\n}\n\nstruct StepView: View { /* ... */ }\n  \nstruct Showcase: View {\n    var body: some View {\n        Section {\n            ForEach(photos) { photo in\n                PhotoView(photo: photo)\n            }\n        } header: { /* ... */ }\n    }\n}","// Scroll effect\n\nstruct ContentView: View { /* ... */ }\n\nstruct StepView: View { /* ... */ }\n\nstruct Showcase: View {\n    var body: some View {\n        Section {\n            ForEach(photos) { photo in\n                PhotoView(photo: photo)\n                    .scrollTransition { effect, phase in\n                        effect\n                            .rotationEffect(.degrees(phase.value * 20))\n                            .scaleEffect(1 + phase.value * 0.2)\n                    }\n            }\n        } header: { /* ... */ }\n    }\n}","// Scroll effect\n\nstruct ContentView: View { /* ... */ }\n\nstruct StepView: View { /* ... */ }\n\nstruct Showcase: View {\n    var body: some View {\n        Section {\n            ForEach(photos) { photo in\n                PhotoView(photo: photo)\n                    .scrollTransition { effect, phase in\n                        effect\n                            .scaleEffect(1 - abs(phase.value) * 0.1)\n                    }\n            }\n        } header: { /* ... */ }\n    }\n}","// Absolute offset\n\nstruct ContentView: View {\n    @State var isScrollToShowcaseVisible = false\n\n    var body: some View {\n        ScrollView { /* ... */ }\n            .overlay(alignment: .bottom) { /* ... */ }\n            .onScrollGeometryChange(for: Bool.self) { geo in\n                geo.contentOffset.y \u003c= 100\n            } action: { _, newValue in\n                self.isScrollToShowcaseVisible = newValue\n            }\n    }\n}","// Absolute offset\n\nstruct ContentView: View {\n    @State var isScrollToShowcaseVisible = false\n\n    var body: some View {\n        ScrollView { /* ... */ }\n            .overlay(alignment: .bottom) { /* ... */ }\n            .onScrollTargetVisibilityChange(\n                idType: Step.ID.self,\n                threshold: 0.8\n            ) { visibleIDs in\n                isScrollToShowcaseVisible = shouldShowScrollButton(visibleIDs: visibleIDs)\n            }\n    }\n}","// Origami\n\nstruct ContentView: View {\n    var body: some View {\n        ScrollView {\n            LazyVStack {\n                ForEach(steps) { step in\n                    StepView(step: step)\n                }\n            }\n        }\n    }\n}\n\nstruct StepView: View { /* ... */ }","// Multiple subviews\n\nstruct ContentView: View { /* ... */ }\n\nstruct StepView: View {\n    let step: Step\n\n    var body: some View {\n        StepDiagram(/* ... */)\n        StepInstructions(/* ... */)\n    }\n}","// Dynamic number of views\n\nstruct ContentView: View { /* ... */ }\n\nstruct StepView: View {\n    let step: Step\n\n    @Environment(\\.detailLevel) var detailLevel\n\n    var body: some View {\n        if step.isVisible(in: detailLevel) {\n            VStack { /* ... */ }\n        }\n    }\n}","// Dynamic number of views\n\nstruct ContentView: View { /* ... */ }\n\nstruct StepView: View {\n    let step: Step\n\n    @Environment(\\.detailLevel) var detailLevel\n    @Environment(\\.writingStyle) var writingStyle\n\n    var body: some View {\n        if step.isVisible(in: detailLevel) { /* ... */ }\n    }\n}","// Filter at the data level\n\nstruct ContentView: View {\n    @Query var steps: [Step]\n\n    init(detailLevel: DetailLevel) {\n        _steps = Query(filter: #Predicate\u003cStep> { step in\n            step.detailLevel >= detailLevel\n        })\n    }\n\n    var body: some View { /* ... */ }\n}\n\nstruct StepView: View { /* ... */ }"]},"related":[{"id":"274","title":"What’s new in SwiftData","gloss":"SwiftData 的新功能","gloss_en":"What's new in SwiftData","category":"swift","categoryLabel":"Swift"},{"id":"223","title":"Live Activities essentials","gloss":"Live Activities 核心要點","gloss_en":"Live Activities essentials","category":"swiftui","categoryLabel":"SwiftUI"},{"id":"269","title":"What’s new in SwiftUI","gloss":"SwiftUI 的新功能","gloss_en":"What's new in SwiftUI","category":"swiftui","categoryLabel":"SwiftUI"},{"id":"271","title":"Code-along: Build powerful drag and drop in SwiftUI","gloss":"程式碼共做：在 SwiftUI 打造強大的拖放功能","gloss_en":"Code-along: Build powerful drag and drop in SwiftUI","category":"swiftui","categoryLabel":"SwiftUI"},{"id":"272","title":"Use SwiftUI with AppKit and UIKit","gloss":"在 AppKit 與 UIKit 中使用 SwiftUI","gloss_en":"Use SwiftUI with AppKit and UIKit","category":"swiftui","categoryLabel":"SwiftUI"}]}</script>
