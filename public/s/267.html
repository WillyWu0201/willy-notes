<script id="d" type="application/json">{"s":{"id":"267","title":"Migrate to Swift Testing","gloss":"遷移到 Swift Testing","category":"testing","categoryLabel":"測試","duration":1285,"url":"https://developer.apple.com/videos/play/wwdc2026/267/","takeaway":"用新的「互通模式」讓 XCTest 與 Swift Testing 共存,不必一次全改,漸進式遷移。","chapters":[[7,"Introduction"],[68,"Swift Testing basics"],[72,"Name a test using a raw identifier"],[170,"Migration strategy"],[303,"Wrap XCTFail in a test helper function"],[348,"Test framework interoperability"],[463,"Interoperability modes"],[612,"Replace XCTFail with Issue.record in the test helper"],[735,"Run Swift Package tests with the strict interoperability mode from Terminal"],[782,"Common migration patterns"],[790,"Common migration: skipping tests"],[821,"Common migration: halting after test failures"],[934,"Parameterized tests"],[957,"Example of nested loops which can be converted into a parameterized @Test function"],[1007,"Refactor nested loops into a parameterized @Test function"],[1082,"Exit tests"],[1101,"Precondition check on empty input name in an initializer"],[1167,"Add coverage for precondition failure with exit test"],[1204,"Next steps"]],"points":[{"text":"遷移策略是**漸進式**:既有 XCTest 原地保留,新測試直接用 Swift Testing 寫,不必先大改。"},{"text":"互通(interoperability)讓你在某框架的測試裡安全呼叫另一框架的 API;四種模式 **Limited / Complete / Strict / None**,在 Xcode Test Plan 或 SPM 設定。"},{"text":"常見轉換對照:**XCTSkip → Test.cancel 或 .enabled(if:) trait**;中止行為 → **try #require**;helper 裡的 XCTFail → **Issue.record(sourceLocation:)**。"},{"text":"參數化測試把巢狀迴圈改成 **@Test(arguments:)**,平行執行更快、失敗報告更清楚。"},{"text":"**Exit tests**:#expect(processExitsWith: .failure) 可覆蓋 preconditionFailure / crash 路徑,在子行程中安全執行。"}],"apis":["@Test","#expect","#require","Issue.record","Test.cancel","@Test(arguments:)","processExitsWith","SWIFT_TESTING_XCTEST_INTEROP_MODE"],"audience":"**手上有大量 XCTest、想導入 Swift Testing 但怕一次全改的團隊。** 可以先用 Strict 模式把新舊測試並行跑起來。","gloss_en":"Migrate to Swift Testing","takeaway_en":"Use the new interoperability modes to let XCTest and Swift Testing coexist, so you can migrate incrementally instead of converting everything at once.","points_en":[{"text":"The migration strategy is **incremental**: keep existing XCTest in place, and write new tests directly in Swift Testing without a big upfront rewrite.","hot":false},{"text":"Interoperability lets you safely call one framework's APIs from within the other's tests; four modes **Limited / Complete / Strict / None**, configured in an Xcode Test Plan or SPM.","hot":false},{"text":"Common conversion mappings: **XCTSkip → Test.cancel or the .enabled(if:) trait**; aborting behavior → **try #require**; XCTFail inside helpers → **Issue.record(sourceLocation:)**.","hot":false},{"text":"Parameterized testing turns nested loops into **@Test(arguments:)**, running in parallel for more speed and clearer failure reports.","hot":false},{"text":"**Exit tests**: #expect(processExitsWith: .failure) can cover preconditionFailure / crash paths, running safely in a child process.","hot":false}],"audience_en":"**Teams with a large XCTest suite who want to adopt Swift Testing but fear converting everything at once.** You can start with Strict mode to run old and new tests side by side.","summary":["**Swift Testing** 是 Xcode 16 推出的現代測試框架，介面更精簡、表達力更強，且為 Swift concurrency 而生（測試預設平行執行，回饋更快）。由 Swift Testing 團隊的 Jerry 主講，核心訊息是：在 **Xcode 27**，藉由全新的 **test framework interoperability**（測試框架互通），你可以無痛地與既有 XCTest 並存、逐步遷移。基礎建構是用 `@Test` 巨集宣告測試、用 `#expect` 建立期望（取代多數 XCTest assertion），而無條件失敗的 `XCTFail` 對應到 **`Issue.record`**；`@Test` 也支援用反引號 raw identifier 寫出含空格的可讀測試名。少數情境仍須留在 XCTest：UI automation、performance testing、以及處理 Objective-C exception。","遷移策略是「小步前進」：大多數 XCTest 留在原處，只在準備好時、優先挑常更新的測試逐個改寫；新測試直接用 Swift Testing 寫（但不能放進 XCTest class 內）。**interoperability** 讓你在一個框架的測試 body 中安全呼叫另一框架的 API，例如重用包裝了 `XCTFail` 的 helper（`assertUnique`）。當回報 API 與所在測試分屬不同框架就產生 **cross-framework issue**，Xcode 27 預設啟用互通並提供四種模式：**limited**（XCTest 的跨框架 issue 為警告，Xcode 27 前的 test plan 沿用此模式）、**complete**（升為 error，新專案預設）、**strict**（直接以 fatal error 中止，幫你找出該換掉的 XCTest API）、**none**（停用，僅建議短暫使用）。在 Swift Package 中也可用，升到 swift-tools-version 6.4 啟用 complete，或用環境變數 `SWIFT_TESTING_XCTEST_INTEROP_MODE` 覆寫。","常見遷移樣式：跳過測試把 `XCTSkip` 換成 `Test.cancel`，更佳作法是用 **trait**（`.enabled(if:)`／`.disabled`）把啟用邏輯移出 body；首次失敗即中止把 `continueAfterFailure = false` 換成 **`#require`**（失敗即丟錯中止，且可逐項選擇是否中止）。遷移後還能享受 Swift Testing 的強化工具：**parameterized tests** 用 `@Test(arguments:)` 把巢狀迴圈拆成各自獨立、平行執行的測試案例，能清楚看出哪組輸入失敗；**exit tests** 用 `#expect(processExitsWith:)` 在子行程中執行會 crash 的程式碼（如 `preconditionFailure`），安全地為這類路徑補上測試覆蓋（限 macOS、Linux、FreeBSD、Windows）。Swift Testing 為開源、由 Testing Workgroup 治理，鼓勵透過 Swift Forums 與 Swift Evolution 參與。"],"deepdive":[{"t":7,"title":"Introduction","body":"由 Swift Testing 團隊的 Jerry 開場，回顧 **Swift Testing**（Xcode 16 推出）是表達力強、精簡的現代測試框架，為 Swift concurrency 而生、預設平行執行。本場將回顧基礎、把 Swift Testing 加進 XCTest 專案、用 **interoperability** 重用既有測試碼，並介紹 Swift Testing 的進階能力。"},{"t":68,"title":"Swift Testing basics","body":"示範基礎：import Testing 與 `@testable import`，用 **`@Test`** 巨集宣告測試函式、用 **`#expect`** 建立期望。`@Test` 與 `#expect` 是多數測試的核心建構塊。"},{"t":72,"title":"Name a test using a raw identifier","body":"Swift 的 **raw identifier**（反引號）讓測試名可含空格與標點，提升較長測試名的可讀性，如 `` `Default climate: tropical` ``。"},{"t":170,"title":"Migration strategy","body":"遷移策略是小步前進：改舊測試有風險，故大多數 **XCTest 留在原處**，準備好時優先改常更新的測試。同一 target 可同時含兩框架測試，新測試直接用 Swift Testing 寫（但不能放進 XCTest class 內）。"},{"t":303,"title":"Wrap XCTFail in a test helper function","body":"以鳥類送水果 app 為例，示範把多步驟 assertion 抽成 helper（`assertUnique`），讓測試「說清楚在測什麼」。helper 內用 `XCTFail` 並傳入 file／line 參數，讓 Xcode 把失敗歸因到呼叫 helper 的那一行。"},{"t":348,"title":"Test framework interoperability","body":"想在 Swift Testing 測試中重用包了 `XCTFail` 的 helper，靠 **interoperability**：可在一框架的測試 body 安全呼叫另一框架的 API。兩個方向都可能產生 **cross-framework issue**，Xcode 27 預設啟用互通來處理。"},{"t":463,"title":"Interoperability modes","body":"說明四種模式：**limited**（XCTest 跨框架 issue 為警告，Xcode 27 前 test plan 沿用）、**complete**（升為 error，新專案預設）、**strict**（fatal error 中止，找出該替換的 XCTest API）、**none**（停用，僅短暫使用）。可在 Test Plan Settings 的 Test Execution 切換。來自 Swift Testing 的跨框架 issue 在所有模式都維持 error。"},{"t":612,"title":"Replace XCTFail with Issue.record in the test helper","body":"示範把 helper 從 XCTest 遷到 Swift Testing：改 import、把 **`XCTFail` 換成 `Issue.record`**，並用 **`sourceLocation`** 取代原本的 file／line 參數，讓新舊測試都如預期失敗。"},{"t":735,"title":"Run Swift Package tests with the strict interoperability mode from Terminal","body":"在 Swift Package 也可用互通：Swift 6.4 toolchain 預設 limited，升到 **swift-tools-version 6.4** 啟用 complete；用環境變數 **`SWIFT_TESTING_XCTEST_INTEROP_MODE`**（值為小寫模式名）從終端機覆寫，搭配 `swift test` 執行。"},{"t":782,"title":"Common migration patterns","body":"進入常見遷移樣式段落，提供把 XCTest 慣用寫法轉成 Swift Testing 的實務技巧。"},{"t":790,"title":"Common migration: skipping tests","body":"跳過測試：XCTest 的 `XCTSkip` 換成 **`Test.cancel`**；新測試更建議用 **trait**（`.enabled(if:)` 或 `.disabled`）把啟用邏輯移出測試 body。"},{"t":821,"title":"Common migration: halting after test failures","body":"首次失敗即中止：XCTest 設 `continueAfterFailure = false`；Swift Testing 改用 **`#require`**，失敗即丟錯中止測試，且可逐項選擇哪些期望會中止、哪些不會。"},{"t":934,"title":"Parameterized tests","body":"介紹 **parameterized tests**：以不同引數重複執行，每組引數成為獨立測試案例，且預設平行執行、比序列更快。"},{"t":957,"title":"Example of nested loops which can be converted into a parameterized @Test function","body":"以鳥類拍翅測試（每隻鳥拍 40~100 次）為例，原本用**巢狀迴圈**產生所有組合；執行慢、失敗時還看不出是哪隻鳥失敗。"},{"t":1007,"title":"Refactor nested loops into a parameterized @Test function","body":"把迴圈移除，將 bird 與 count 定為**測試函式參數**，用 `@Test(arguments:)` 提供輸入，Swift Testing 自動配對並平行執行。結果幾乎瞬間完成，且可在 Test navigator 過濾出失敗組合（swallow 拍不到 43 次）。"},{"t":1082,"title":"Exit tests","body":"介紹 **exit tests**（限 macOS、Linux、FreeBSD、Windows）：用來為會使行程結束的程式碼（如 `preconditionFailure`）補測試覆蓋。"},{"t":1101,"title":"Precondition check on empty input name in an initializer","body":"在 `Bird.init` 中，空名稱會以 `preconditionFailure` 中止程式；用 Code Coverage 檢視可見該行為紅色（未被任何測試執行）。"},{"t":1167,"title":"Add coverage for precondition failure with exit test","body":"用 **`#expect(processExitsWith: .failure)`** 定義 exit test，body 內建立空名稱的 Bird。Swift Testing 在**子行程**執行該段，crash 不影響其他測試，等待子行程結束並檢查 exit status。執行後覆蓋率該行轉綠，代表已被測試。"},{"t":1204,"title":"Next steps","body":"總結無痛遷移之道：不急著改舊 XCTest、新測試用 Swift Testing、靠互通重用 helper 並逐步把 XCTest API 換成 Swift Testing API，升到 complete 或 strict 模式。Swift Testing 為**開源**、屬 SwiftLang 組織、由 Testing Workgroup 治理，今年起完整支援 FreeBSD，鼓勵透過 Swift Forums 與 Swift Evolution 參與。"}],"summary_en":["**Swift Testing**, introduced in Xcode 16, is a modern testing library with a concise, expressive interface built for Swift concurrency (tests run in parallel by default for faster results). Presented by Jerry from the Swift Testing team, the core message is that in **Xcode 27**, the new **test framework interoperability** lets you fearlessly coexist with existing XCTest and migrate gradually. The building blocks: declare tests with the `@Test` macro and create expectations with `#expect` (replacing most XCTest assertions), while the unconditional `XCTFail` maps to **`Issue.record`**; `@Test` also supports backtick raw identifiers for readable test names with spaces. A few scenarios stay in XCTest: UI automation, performance testing, and handling Objective-C exceptions.","The migration strategy is small steps: leave most XCTests in place, modifying them a few at a time when ready, prioritizing the ones you update most; write new tests directly in Swift Testing (just not inside an XCTest class). **Interoperability** lets you safely call one framework's API from the other's test body—for example reusing a helper (`assertUnique`) that wraps `XCTFail`. When the issue-reporting API and the test belong to different frameworks you get a **cross-framework issue**; Xcode 27 enables interoperability by default with four modes: **limited** (XCTest cross-framework issues are warnings; pre-Xcode 27 test plans inherit this), **complete** (elevated to errors; default for new projects), **strict** (halts with a fatal error to surface XCTest API to replace), and **none** (opt out, only temporarily). It also works in Swift Packages—bump to swift-tools-version 6.4 for complete, or override via the `SWIFT_TESTING_XCTEST_INTEROP_MODE` environment variable.","Common migration patterns: for skipping tests, replace `XCTSkip` with `Test.cancel`, though preferring a **trait** (`.enabled(if:)`/`.disabled`) to move enablement logic out of the body; for halting on first failure, replace `continueAfterFailure = false` with **`#require`** (it throws to halt, and lets you choose per-expectation whether to halt). After migrating, enjoy Swift Testing's power tools: **parameterized tests** use `@Test(arguments:)` to turn nested loops into independent, parallel test cases that clearly show which input failed; **exit tests** use `#expect(processExitsWith:)` to run crashing code (like `preconditionFailure`) in a child process, safely adding coverage for such paths (macOS, Linux, FreeBSD, Windows only). Swift Testing is open source, governed by the Testing Workgroup, and they encourage contributing via the Swift Forums and Swift Evolution."],"deepdive_en":[{"t":7,"title":"Introduction","body":"Jerry from the Swift Testing team opens by reviewing **Swift Testing** (introduced in Xcode 16) as an expressive, concise modern testing library built for Swift concurrency that runs tests in parallel by default. The session reviews basics, adds Swift Testing to an XCTest project, reuses test code via **interoperability**, and previews Swift Testing's advanced features."},{"t":68,"title":"Swift Testing basics","body":"Demonstrates the basics: import Testing with `@testable import`, declare a test function with the **`@Test`** macro, and create an expectation with **`#expect`**. `@Test` and `#expect` are the core building blocks for most tests."},{"t":72,"title":"Name a test using a raw identifier","body":"Swift's **raw identifiers** (backticks) let test names include spaces and punctuation, improving readability of longer names like `` `Default climate: tropical` ``."},{"t":170,"title":"Migration strategy","body":"The strategy is small steps: modifying old tests carries risk, so leave most **XCTests in place** and prioritize frequently updated ones when ready. A single target can hold both frameworks' tests; write new tests in Swift Testing (just not inside an XCTest class)."},{"t":303,"title":"Wrap XCTFail in a test helper function","body":"Using a bird fruit-delivery app, shows extracting a multi-step assertion into a helper (`assertUnique`) so the test clearly states what it tests. The helper uses `XCTFail` with file/line parameters so Xcode attributes the failure to the helper's call site."},{"t":348,"title":"Test framework interoperability","body":"To reuse the `XCTFail`-wrapping helper in a Swift Testing test, use **interoperability**: safely call one framework's API from the other's test body. Both directions can create a **cross-framework issue**, which Xcode 27 handles with interoperability enabled by default."},{"t":463,"title":"Interoperability modes","body":"Explains four modes: **limited** (XCTest cross-framework issues are warnings; pre-Xcode 27 test plans inherit it), **complete** (errors; default for new projects), **strict** (fatal error halt to find XCTest API to replace), and **none** (opt out, temporary only). Change it under Test Execution in Test Plan Settings. Cross-framework issues from Swift Testing remain errors in all modes."},{"t":612,"title":"Replace XCTFail with Issue.record in the test helper","body":"Shows migrating the helper to Swift Testing: change the import, replace **`XCTFail` with `Issue.record`**, and use **`sourceLocation`** instead of the original file/line parameters, so both old and new tests fail as expected."},{"t":735,"title":"Run Swift Package tests with the strict interoperability mode from Terminal","body":"Interoperability works in Swift Packages too: the Swift 6.4 toolchain defaults to limited; bump to **swift-tools-version 6.4** for complete; override from the terminal with the **`SWIFT_TESTING_XCTEST_INTEROP_MODE`** environment variable (lowercase mode name) when running `swift test`."},{"t":782,"title":"Common migration patterns","body":"Begins the common-patterns segment, offering practical tips for converting XCTest idioms to Swift Testing."},{"t":790,"title":"Common migration: skipping tests","body":"Skipping tests: replace XCTest's `XCTSkip` with **`Test.cancel`**; for new tests, prefer a **trait** (`.enabled(if:)` or `.disabled`) to move enablement logic out of the body."},{"t":821,"title":"Common migration: halting after test failures","body":"Halting on first failure: XCTest sets `continueAfterFailure = false`; Swift Testing uses **`#require`**, which throws to halt the test, and lets you choose per-expectation which ones halt and which don't."},{"t":934,"title":"Parameterized tests","body":"Introduces **parameterized tests**: they repeat with different arguments, each becoming a separate test case, and run in parallel by default—faster than serial."},{"t":957,"title":"Example of nested loops which can be converted into a parameterized @Test function","body":"Using a bird wing-flap test (each bird flaps 40–100 times), the original uses **nested loops** to generate all combinations; it runs slowly and can't tell which bird failed."},{"t":1007,"title":"Refactor nested loops into a parameterized @Test function","body":"Remove the loops, define bird and count as **test function parameters**, and supply inputs via `@Test(arguments:)`; Swift Testing pairs them and runs in parallel. It finishes almost instantly, and the Test navigator can filter failing combinations (the swallow can't flap under 43 times)."},{"t":1082,"title":"Exit tests","body":"Introduces **exit tests** (macOS, Linux, FreeBSD, Windows only): used to add coverage for code that terminates the process (like `preconditionFailure`)."},{"t":1101,"title":"Precondition check on empty input name in an initializer","body":"In `Bird.init`, an empty name halts via `preconditionFailure`; Code Coverage shows that line in red (run by no test)."},{"t":1167,"title":"Add coverage for precondition failure with exit test","body":"Define an exit test with **`#expect(processExitsWith: .failure)`**, creating a Bird with an empty name in the body. Swift Testing runs it in a **child process** so the crash is isolated, waits for it to finish, and checks the exit status. Afterward the coverage line turns green, indicating it's tested."},{"t":1204,"title":"Next steps","body":"Summarizes fearless migration: don't rush to change old XCTests, write new tests in Swift Testing, reuse helpers via interoperability and gradually replace XCTest API with Swift Testing API, upgrading to complete or strict mode. Swift Testing is **open source** under the SwiftLang org, governed by the Testing Workgroup, with full FreeBSD support this year; contribute via the Swift Forums and Swift Evolution."}],"code":["import Testing\n\n@testable import DemoApp\n\n@Test func `Default climate: tropical`() async throws {\n    let fruit = Fruit(name: \"Coconut\")\n    #expect(fruit.climate == .tropical)\n}","func testUniqueFruitNames() async throws {\n    assertUnique(Market.fruits + [Fruit.lychee])\n}\n\n// TestHelpers.swift\n\nfunc assertUnique(_ fruits: [Fruit], file: StaticString = #filePath, line: UInt = #line) {\n    var uniqueNames = Set\u003cString>()\n    for name in fruits.map(\\.name) {\n        if !uniqueNames.insert(name).inserted {\n            XCTFail(\"Duplicate name: \\(name)\", file: file, line: line)\n        }\n    }\n}","import Testing\n\nfunc assertUnique(_ fruits: [Fruit], sourceLocation: SourceLocation = ...) {\n    var uniqueNames = Set\u003cString>()\n    for name in fruits.map(\\.name) {\n        if !uniqueNames.insert(name).inserted {\n            Issue.record(\"Duplicate name: \\(name)\", sourceLocation: sourceLocation)\n        }\n    }\n}","> SWIFT_TESTING_XCTEST_INTEROP_MODE=strict swift test","let isFall = false\n\n// XCTest\nfunc testSwallowFallMigration() async throws {\n    try XCTSkipIf(!isFall, \"Wrong season for migration\")\n    // ...\n}\n\n// Test.cancel interoperability from Swift Testing\nfunc testSwallowFallMigration() async throws {\n    if !isFall {\n        try Test.cancel(\"Wrong season for migration\")\n    }\n    // ...\n}\n\n// ✅ Prefer test trait in Swift Testing\n@Test(.enabled(if: isFall, \"Wrong season for migration\"))\nfunc `Swallow fall migration`() async throws {\n   // ...\n}","func testExample() async throws {\n    #expect(Fruit.banana.climate == .temperate)\n\n    try #require(Fruit.banana == Fruit.plantain)\n    XCTFail(\"This is never reached\")\n}","struct BirdTests {\n\n    @Test func `Birds flap wings successfully`() async throws {\n        for bird in Aviary.birds {\n            for count in (40...100) {\n                try await bird.flapWings(count: count)\n            }\n        }\n    }\n\n}","struct BirdTests {\n\n    @Test(arguments: Aviary.birds, 40...100)\n    func `Birds flap wings successfully`(bird: Bird, count: Int) async throws {\n        try await bird.flapWings(count: count)\n    }\n\n}","// In `Bird.init(...)`\nif name.isEmpty {\n    preconditionFailure(\"Bird name cannot be empty\")\n}","extension BirdTests {\n\n    @Test func `Bird with empty name crashes`() async throws {\n        await #expect(processExitsWith: .failure) {\n            _ = Bird(name: \"\")\n        }\n    }\n\n}"]},"related":[{"id":"295","title":"Validate your App Intents adoption with AppIntentsTesting","gloss":"用 AppIntentsTesting 驗證你的 App Intents","gloss_en":"Validate your App Intents with AppIntentsTesting","category":"testing","categoryLabel":"測試"}]}</script>
