<script id="d" type="application/json">{"s":{"id":"240","title":"Build intelligent Siri experiences with App Schemas","gloss":"用 App Schemas 打造智慧 Siri 體驗","category":"ai","categoryLabel":"AI 與機器學習","duration":1643,"url":"https://developer.apple.com/videos/play/wwdc2026/240/","takeaway":"用 **App Intents 與 App Schemas** 把 App 的內容與動作交給 Siri 與 Apple Intelligence，並支援跨 App 的螢幕感知與內容傳遞。","chapters":[[0,"Introduction"],[66,"What's new in Siri"],[246,"Contributing content with App Entities"],[381,"Entity resolution and IndexedEntity"],[479,"Contributing message content to Apple Intelligence"],[516,"An interface that locates entities using arbitrary string input"],[589,"Making actions available"],[723,"Adopting a schema domain in UnicornChat"],[939,"Moving content across apps"],[960,"Working across apps: onscreen awareness"],[1039,"Working across apps - View annotations"],[1098,"Working across apps - Exporting content to another app"],[1161,"Working across apps - IntentValueQuery"],[1200,"Working across apps - IntentValueRepresentation"],[1269,"Best practices"],[1458,"Testing your integration"],[1581,"Next steps"]],"points":[{"text":"用 **App Entities** 建模資料、`IndexedEntity` 建立索引，讓 Siri 與 Apple Intelligence 能存取你的內容。","hot":false},{"text":"採用 **App Schemas** 領域（如 `.messages.message`）即可獲得系統內建的智慧能力，無需自行設計介面。","hot":true},{"text":"以 `EntityStringQuery` 用任意字串解析實體，並透過 `#Predicate` 與 SwiftData 查詢比對。","hot":false},{"text":"跨 App 運作：用 `appEntityIdentifier` 做**螢幕感知（onscreen awareness）**與視圖註記，讓 Siri 知道畫面上有什麼。","hot":false},{"text":"透過 `IntentValueQuery` 與 `IntentValueRepresentation`（搭配 `Transferable`）在 App 之間匯出與匯入內容。","hot":false}],"apis":["App Intents","AppEntity","IndexedEntity","EntityStringQuery","IntentValueQuery","IntentValueRepresentation","Transferable","appEntityIdentifier","SwiftData"],"audience":"**想讓 App 內容與動作深度整合進 Siri 與 Apple Intelligence** 的 iOS 開發者。","gloss_en":"Build intelligent Siri experiences with App Schemas","takeaway_en":"Use **App Intents and App Schemas** to hand your app's content and actions to Siri and Apple Intelligence, with support for cross-app onscreen awareness and content transfer.","points_en":[{"text":"Model your data with **App Entities** and index it with `IndexedEntity` so Siri and Apple Intelligence can access your content.","hot":false},{"text":"Adopt an **App Schemas** domain (such as `.messages.message`) to gain the system's built-in intelligence without designing the interface yourself.","hot":true},{"text":"Resolve entities from arbitrary strings with `EntityStringQuery`, matching via `#Predicate` and SwiftData queries.","hot":false},{"text":"Works across apps: use `appEntityIdentifier` for **onscreen awareness** and view annotation, so Siri knows what's on screen.","hot":false},{"text":"Export and import content between apps with `IntentValueQuery` and `IntentValueRepresentation` (paired with `Transferable`).","hot":false}],"audience_en":"iOS developers **who want to deeply integrate their app's content and actions into Siri and Apple Intelligence**.","summary":["這場由 Swift Intelligence Frameworks 團隊的 Dan Niemeyer 主講，主題是如何用 **App Intents** 把 app 帶到 Siri。在 27 系列中，由 Apple Intelligence 驅動的 Siri 變得更強大、更具情境、更個人化，而 App Intents 正是這一切的基礎。今年 Siri 在三方面躍進：能存取你 app 的 **entity**（真正有意義的內容），能用你 app 的 **intent** 採取行動，還能理解**螢幕上的情境**。整場以一個與虛構獨角獸聊天的範例 app **UnicornChat** 貫穿示範。","一切的核心是 **AppEntity**——對 app 內既有內容的結構化描述，說明「那是什麼、如何被辨識、哪些屬性重要」。但光建模還不夠，entity 必須符合 **AppSchema**，Siri 才知道它屬於哪一類（如 messages、contacts、documents）。要讓 Siri 找到正確的 entity，主要途徑是採用 **IndexedEntity**，把內容索引進系統的語意索引，支援以「意義」而非字串比對來搜尋（用 `indexingKey` 告訴 Spotlight 哪些屬性可搜尋）；當資料量太大、在伺服器上或變動太頻繁而無法事先索引時，則改用 **EntityStringQuery**，由 app 自行比對。有了 entity 之後，再把它與**動作**結合：定義 **App Intent** 就能讓動作出現在 Shortcuts、Spotlight、Widgets 等系統各處；而要讓 Siri 直接執行，動作需採用 **app schema**（schema 是 App Intent 的特化），並把多個 schema 歸入 **AppSchema domain**（如 messages）。示範中 UnicornChat 採用 messages domain 的 **sendMessage** schema，把 schema 參數對應到既有送訊流程，Siri 即可在不開啟 app 的情況下完成「傳訊息給 Glow」。","下半場談**跨 app 工作流程**，例如「把 Bubbles 的這則回覆 email 給我太太」，由兩項能力組成：**onscreen awareness** 與 **content transfer**。螢幕情境用 **UserActivity**（畫面上只有一個主要項目時）或 **View annotations**（`appEntityIdentifier`，畫面上有多個有意義項目時）把可見內容連到 entity；內容傳輸則靠 **Transferable** 搭配 **IntentValueRepresentation** 把 entity 匯出（例如把 ContactEntity 匯出為 IntentPerson）。內容進入你的 app 時有兩條路：用 **IntentValueQuery** 把傳入值解析到既有 entity，或用 `IntentValueRepresentation` 的 **importing** 建立全新 entity。最後是最佳實務與測試：Xcode 會在你採用 sendMessage 卻漏掉相關的 **draftMessage** schema 時以建置錯誤與 fix-it 提示你補齊；測試則建議由 **AppIntentsTesting**（隔離驗證商業邏輯）開始，再依序到 **Shortcuts**、**Spotlight**，最後用 **Siri** 做端對端驗證。"],"deepdive":[{"t":0,"title":"Introduction","body":"由 Swift Intelligence Frameworks 團隊的軟體工程師 Dan Niemeyer 開場，說明如何用 Apple Intelligence 驅動的新能力把 app 帶到 **Siri**。今年 Siri 更強大、更具情境也更個人化，而 **App Intents** 是讓這一切成真的基礎。本場將涵蓋 Siri 與 App Intents 的新功能、Siri 如何理解內容並採取行動，以及跨 app 的使用情境與最佳實務。"},{"t":66,"title":"What's new in Siri","body":"說明 Siri 由 **Apple Intelligence** 驅動後在三方面變強：能存取 app 的 **entity** 回答如「我下一場會議何時何地」這類問題；能用 app 的 **intent** 採取行動如「把最新報告寄給 Mary」；還能理解**螢幕情境**如「解釋這段文字」。開發者參與 Apple Intelligence 的方式就是透過 App Intents 框架，本場將以範例 app **UnicornChat**（一個與虛構獨角獸聊天的 messaging app）貫穿示範。"},{"t":246,"title":"Contributing content with App Entities","body":"所有體驗的核心是 **AppEntity**——對 app 內既有內容的結構化表示，描述「那是什麼、如何被辨識、哪些屬性重要」（如標題、日期、文字），它不是新的資料模型而是描述既有內容的方式。但光建模不足以讓 Siri 找到或談論它，entity 還必須符合 **AppSchema**，Siri 才知道它代表哪一類概念。UnicornChat 中的 Contact、Conversation、Message 都建模為符合 schema 的 entity，因此 Siri 能理解「顯示 Flare 的最後一則訊息」這類請求。"},{"t":381,"title":"Entity resolution and IndexedEntity","body":"**Entity resolution** 是 Siri 把使用者所說的話解析成 app 內真實 entity 的過程，例如把「Glow」解析為特定獨角獸 contact 並填入其屬性值。但人們常以概念與描述而非精確名稱表達，因此 Siri 需要語意搜尋，而這正是 **IndexedEntity** 所提供的——它把 entity 索引進系統語意索引，讓 Siri 依意義比對、理解 entity 間關係，甚至能對內容回答問題。"},{"t":479,"title":"Contributing message content to Apple Intelligence","body":"示範把 schematized entity 進一步符合 **IndexedEntity** 協定來取得語意比對能力。以 **`indexingKey`** 告訴 Spotlight 哪些屬性（如 message body）應可被搜尋，索引後 Siri 就能搜尋、推理並用內容回答問題，例如「顯示與 Flare 關於電影的訊息」這類非字串比對的語意查詢。IndexedEntity 帶來最佳的 Siri 體驗：語意比對、更少追問、更自然的語言理解。"},{"t":516,"title":"An interface that locates entities using arbitrary string input","body":"說明當資料量太大、位於伺服器或變動太頻繁而無法事先索引時，可改用 **EntityStringQuery**。此時 Siri 把使用者輸入交給你的 app，由 app 自行負責尋找並回傳符合的 entity，雖然失去語意理解，但能完全掌控搜尋與比對方式。範例的 `ContactQuery` 以 `localizedStandardContains` 對 Person 名稱做比對後回傳對應 entity。"},{"t":589,"title":"Making actions available","body":"說明 **App Intents** 是 app 對系統暴露動作的方式，但動作分兩種待遇。定義一個 app intent 後，動作會出現在 Shortcuts、Spotlight、Widgets 等系統各處，讓人們即使不用 Siri 也能發現並觸發。而要讓 Siri 能直接執行，動作需採用 **schema**（schema 是 App Intent 的特化），schema 定義 Siri 理解的動作種類、預期結構與如何對應到自然語言。"},{"t":723,"title":"Adopting a schema domain in UnicornChat","body":"示範在 UnicornChat 端對端採用一個 domain。個別 schema 定義個別動作，但 app 通常需要完整的一組，因此 schema 被歸入 **AppSchema domain**（如 mail、photos、messages）。在 Xcode 中輸入 schema 名稱時可用自動完成挑選，這裡選 messages domain 的 **sendMessage** schema，把 schema 參數對應到既有送訊流程：處理參數、傳入 UnicornChat 介面送出、再把新訊息以 entity 回傳，Siri 即可在不開啟 app 下完成「傳訊息給 Glow」。"},{"t":939,"title":"Moving content across apps","body":"切入跨 app 工作流程，說明許多真實請求會橫跨多個 app——從一個 app 開始、在另一個延續、最後在別處完成，例如「Hey Siri，把 Bubbles 的這則回覆 email 給我太太」。這類體驗結合兩項能力：理解人們正在看什麼（**onscreen awareness**），以及把內容移到另一個 app（**content transfer**），接下來會分別說明。"},{"t":960,"title":"Working across apps: onscreen awareness","body":"說明 **onscreen awareness** 把畫面上可見的內容連到系統能理解的結構化資訊，核心仍是 **app entity**——當 view 與 entity 關聯後，Siri 能解析「這則訊息」「那段對話」這類指涉而毋須使用者明確命名。註解螢幕內容有兩種 API：畫面上只有一個主要項目（如檢視文件或撰寫訊息）時用 **UserActivity**；同時有多個有意義項目（如對話中的訊息或清單項目）時用 **View annotations**。"},{"t":1039,"title":"Working across apps - View annotations","body":"示範以 **View annotations** 把清單中每一列連到對應的 entity。範例對每個 message row 用 **`appEntityIdentifier`** 標註其 MessageEntity，明確把螢幕內容連到同一批用於 intent 的 entity，讓使用者能說「編輯這則訊息」或「轉發最後一則」，Siri 直接從 view 解析 entity。"},{"t":1098,"title":"Working across apps - Exporting content to another app","body":"說明 **content transfer** 讓其他 app 能對你的 entity 採取行動，做法是用 **Transferable** 搭配 **IntentValueRepresentation** 匯出 entity，告訴系統如何以其他 app 能理解的形式表示你的內容。範例把 ContactEntity 匯出為 IntentPerson，匯出後系統就能把內容傳入其他 app 的動作，支援如「打給這位聯絡人」的情境；你的 app 毋須知道後續發生什麼，只需準確描述內容。"},{"t":1161,"title":"Working across apps - IntentValueQuery","body":"說明內容傳入你的 app 時有兩種可能：指涉既有事物，或代表全新事物。若是比對既有內容，用 **IntentValueQuery**，概念上類似 entity query 但範圍限於 intent 參數。範例的 `ContactEntityQuery` 接收其他 app 傳來的 IntentPerson，依顯示名稱比對到既有的 ContactEntity，適用於內容已存在或要從既有資料中挑選的情況。"},{"t":1200,"title":"Working across apps - IntentValueRepresentation","body":"說明若傳入內容應在你的 app 中建立全新事物，則用 **`IntentValueRepresentation`** 的 **importing**，把傳入值轉換成全新的 app entity。範例在需要時用 IntentPerson 建立一隻新的獨角獸並加入 ContactManager。匯入內容時的原則是：若內容已存在就 resolve、不存在就 import，許多 app 會視 intent 與工作流程兩者並用。"},{"t":1269,"title":"Best practices","body":"示範一個關鍵最佳實務：在採用 **sendMessage** schema 後嘗試建置，Xcode 會出現建置錯誤，提示你尚未採用相關的 **draftMessage** schema——因為某些 Siri 情境（尤其需要確認時）需要多個 schema 才能提供完整體驗。這不只是編譯錯誤而是設計提示，點進去 Xcode 會提供 **fix-it** 產生 draftMessage 的範例採用（intent 定義、必要參數與 stub），你只需填入 app 專屬部分（連接 entity、注入相依、處理輸入、開啟建立訊息畫面，並因會變更 UI 狀態而在 main actor 執行）。"},{"t":1458,"title":"Testing your integration","body":"說明採用 schema 後測試變得關鍵，建議的循序路徑：先用新的 **AppIntentsTesting** 框架在完全隔離（不涉及 Siri）下呼叫 intent、傳入參數並驗證結果，這是最快也最可靠地驗證商業邏輯的方式；接著到 **Shortcuts** 驗證 intent 的形狀與呈現；再到 **Spotlight** 確認 entity 已正確索引、可被發現與連結；最後用 **Siri** 做涵蓋自然語言、entity resolution、螢幕情境與跨 app 工作流程的端對端測試。"},{"t":1581,"title":"Next steps","body":"總結具體後續步驟：把 entity 建模並索引到 Spotlight 讓 Siri 找得到內容、採用符合 app 核心體驗的 **app schema domain**、採用 **Transferable** 以啟用內容匯入匯出，並依 AppIntentsTesting → Shortcuts → Spotlight → Siri 的順序儘早且頻繁地測試。這些 API 今日皆已可用，且設計成能隨 app 與 Siri 的演進而擴展——把 app 帶到 Siri 不只是加上語音支援，更是讓 app 在整個系統中更快、更易存取、更好用。"}],"summary_en":["Presented by Dan Niemeyer of the Swift Intelligence Frameworks team, this session shows how to bring your app to Siri using **App Intents**. In the 27 releases, Siri—powered by Apple Intelligence—is more capable, more contextual, and more personal, and App Intents are the foundation that makes that possible. This year Siri advances in three ways: it can access your app's **entities** (the meaningful content inside your app), take action using your app's **intents**, and understand **on-screen context**. The whole talk is grounded in a sample app, **UnicornChat**, for chatting with fictional unicorn characters.","Everything centers on the **AppEntity**—a structured description of content your app already works with, describing what the thing is, how it's identified, and which properties matter. But modeling alone isn't enough; an entity must conform to an **AppSchema** so Siri knows what category it represents (messages, contacts, documents). The primary way to let Siri find the right entity is adopting **IndexedEntity**, which indexes content into the system semantic index for meaning-based search (with `indexingKey` telling Spotlight which properties are searchable); when data is too large, lives on a server, or changes too frequently to pre-index, use **EntityStringQuery** and match it yourself. Once entities exist, combine them with **actions**: defining an **App Intent** surfaces an action across Shortcuts, Spotlight, Widgets, and more, while making it executable by Siri requires an **app schema** (a specialization of App Intents), grouped into **AppSchema domains** like messages. The demo adopts the messages domain's **sendMessage** schema, mapping its parameters onto UnicornChat's existing send flow so Siri completes \"send a message to Glow\" without opening the app.","The second half covers **cross-app workflows**, such as \"email my wife this reply from Bubbles,\" built from two capabilities: **on-screen awareness** and **content transfer**. On-screen context uses **UserActivity** (when one primary item is visible) or **View annotations** (`appEntityIdentifier`, when multiple meaningful items are visible) to connect what's shown to entities; content transfer uses **Transferable** with **IntentValueRepresentation** to export an entity (e.g., a ContactEntity as an IntentPerson). When content arrives in your app there are two paths: use **IntentValueQuery** to resolve incoming values to an existing entity, or use **importing** on `IntentValueRepresentation` to create something new. Finally, best practices and testing: Xcode surfaces a build error and fix-it when you adopt sendMessage but miss the related **draftMessage** schema, and testing should start with **AppIntentsTesting** (isolated logic validation), then **Shortcuts**, **Spotlight**, and finally end-to-end with **Siri**."],"deepdive_en":[{"t":0,"title":"Introduction","body":"Dan Niemeyer, a software engineer on the Swift Intelligence Frameworks team, opens by explaining how to bring your app to **Siri** using new capabilities powered by Apple Intelligence. This year Siri is more capable, more contextual, and more personal, and **App Intents** are the foundation that makes that possible. The session covers what's new with Siri and App Intents, how Siri understands content and takes action, and cross-app use cases plus best practices."},{"t":66,"title":"What's new in Siri","body":"Explains the three ways Siri, powered by **Apple Intelligence**, becomes more powerful: it can access your app's **entities** to answer questions like \"when and where is my next meeting,\" take action using your app's **intents** like \"send my latest report to Mary,\" and understand **on-screen context** like \"explain this text.\" Developers participate in Apple Intelligence through the App Intents framework, and the talk uses the sample app **UnicornChat**—a messaging app for chatting with fictional unicorns—throughout."},{"t":246,"title":"Contributing content with App Entities","body":"At the center of every experience is the **AppEntity**—a structured representation of content already inside your app, describing what the thing is, how it's identified, and which properties matter (title, date, text); it's not a new data model but a way to describe existing content. Modeling alone isn't enough for Siri to find or talk about it—the entity must also conform to an **AppSchema** so Siri knows what kind of thing it is. In UnicornChat, Contact, Conversation, and Message are all entities conforming to schemas, letting Siri understand requests like \"show my last message from Flare.\""},{"t":381,"title":"Entity resolution and IndexedEntity","body":"**Entity resolution** is how Siri resolves what the user says into real entities inside your app—for example resolving \"Glow\" to a specific unicorn contact and filling in its property values. But people often speak in concepts and descriptions rather than exact names, so Siri needs semantic search, which is exactly what **IndexedEntity** enables—indexing entities into the system semantic index so Siri can match by meaning, understand relationships, and even answer questions over your content."},{"t":479,"title":"Contributing message content to Apple Intelligence","body":"Demonstrates conforming a schematized entity to the **IndexedEntity** protocol to gain semantic matching. The **`indexingKey`** tells Spotlight which properties (like the message body) should be searchable; once indexed, Siri can search, reason over, and use content to answer questions—such as \"show the messages with Flare about movies,\" a semantic query rather than a string match. IndexedEntity delivers the best Siri experience: semantic matching, fewer follow-ups, and more natural language understanding."},{"t":516,"title":"An interface that locates entities using arbitrary string input","body":"Explains that when a dataset is too large, lives on a server, or changes too frequently to pre-index, you can use **EntityStringQuery**. Siri hands you the person's input, and your app is responsible for finding and returning matching entities—you lose semantic understanding but gain full control over how you search and match. The example `ContactQuery` matches Person names with `localizedStandardContains` and returns the corresponding entities."},{"t":589,"title":"Making actions available","body":"Explains that **App Intents** are how your app exposes actions to the system, but not all actions are treated the same. Defining an app intent surfaces the action across the system in places like Shortcuts, Spotlight, and Widgets, so people can discover and trigger it even without Siri. To make an action executable by Siri, it must adopt a **schema** (a specialization of App Intents) that defines the action kinds Siri understands, the structure it expects, and how it maps to natural language."},{"t":723,"title":"Adopting a schema domain in UnicornChat","body":"Demonstrates wiring a domain end-to-end in UnicornChat. Individual schemas define individual actions, but apps usually need a full set, so schemas are grouped into **AppSchema domains** (mail, photos, messages). In Xcode, autocomplete helps pick a schema; here the **sendMessage** schema from the messages domain is chosen and its parameters mapped onto the existing send flow: process the parameters, pass them into UnicornChat's interface to send, and return the new message as an entity—so Siri completes \"send a message to Glow\" without opening the app."},{"t":939,"title":"Moving content across apps","body":"Introduces cross-app workflows, noting that many real requests span multiple apps—starting in one, continuing in another, and finishing elsewhere, like \"Hey Siri, email my wife this reply from Bubbles.\" These experiences combine two capabilities: understanding what people are looking at (**on-screen awareness**) and moving that content into another app (**content transfer**), each covered in turn."},{"t":960,"title":"Working across apps: onscreen awareness","body":"Explains that **on-screen awareness** connects what's visible to structured information the system understands, with the **app entity** at its core—when views are associated with entities, Siri can resolve references like \"this message\" or \"that conversation\" without people naming them. There are two annotation APIs: use **UserActivity** when one primary thing is on screen (viewing a document, composing a message), and use **View annotations** when multiple meaningful items are visible (messages in a conversation, items in a list)."},{"t":1039,"title":"Working across apps - View annotations","body":"Demonstrates **View annotations** connecting each list row to its corresponding entity. The example annotates each message row with its MessageEntity via **`appEntityIdentifier`**, explicitly linking what's on screen to the same entities used for intents, so users can say \"edit this message\" or \"forward the last one\" and Siri resolves the entity directly from the view."},{"t":1098,"title":"Working across apps - Exporting content to another app","body":"Explains that **content transfer** lets other apps act on your entities by exporting them with **Transferable** and an **IntentValueRepresentation**, telling the system how to represent your content in a form other apps understand. The example exports a ContactEntity as an IntentPerson; once exported, the system can pass that content into other apps' actions, enabling cases like \"call this contact.\" Your app doesn't need to know what happens next—it just describes its content accurately."},{"t":1161,"title":"Working across apps - IntentValueQuery","body":"Explains that when content comes into your app there are two possibilities: it refers to something existing, or represents something new. To match existing content, use **IntentValueQuery**—conceptually similar to entity query but scoped to intent parameters. The example `ContactEntityQuery` receives an IntentPerson from another app and matches it by display name to an existing ContactEntity, ideal when the content already exists or you want to select from existing data."},{"t":1200,"title":"Working across apps - IntentValueRepresentation","body":"Explains that when incoming content should create something new, use **importing** on **`IntentValueRepresentation`** to convert the incoming value into a brand-new app entity. The example creates a new unicorn from an IntentPerson when needed and appends it to ContactManager. The principle when importing content: if it already exists, resolve it; if not, import it—and many apps use both depending on the intent and workflow."},{"t":1269,"title":"Best practices","body":"Demonstrates a key best practice: after adopting the **sendMessage** schema, building produces an error because the related **draftMessage** schema hasn't been adopted—some Siri scenarios (especially when confirmation is required) need multiple schemas for a complete experience. This isn't just a compiler error but a design hint; clicking in, Xcode offers a **fix-it** generating a sample draftMessage adoption (intent definition, required parameters, stub). You then fill in app-specific pieces—connect entities, inject dependencies, process input, open the message creation view, and run on the main actor since it mutates UI state."},{"t":1458,"title":"Testing your integration","body":"Explains that once schemas are adopted, testing becomes critical, and recommends a sequence: start with the new **AppIntentsTesting** framework to invoke intents in full isolation (no Siri), passing parameters and validating results—the fastest, most reliable way to validate business logic; then **Shortcuts** to validate the shape and presentation of the intent; then **Spotlight** to confirm entities are indexed, discoverable, and linkable; and finally **Siri** for end-to-end testing of natural language, entity resolution, on-screen context, and cross-app workflows."},{"t":1581,"title":"Next steps","body":"Summarizes the concrete next steps: model and index your entities to Spotlight so Siri can find your content, adopt the **app schema domains** matching your core experiences, adopt **Transferable** to enable content import and export, and test early and often in the order AppIntentsTesting, Shortcuts, Spotlight, then Siri. All these APIs are available today and are designed to scale as Siri evolves—bringing your app to Siri isn't just adding voice support, it makes your app faster, more accessible, and easier to use across the system."}],"code":["// Contributing message content to Apple Intelligence\n  \n  @AppEntity(schema: .messages.message)\n  struct MessageEntity: IndexedEntity {\n\n      // The text content of the message\n      @Property(indexingKey: \\.textContent)\n      var body: AttributedString?\n  }","// An interface that locates entities using arbitrary string input\n\n  struct ContactQuery: EntityStringQuery {\n      func entities(matching string: String) async throws -> [ContactEntity] {\n          let predicate = #Predicate\u003cPerson> { person in\n              person.name.localizedStandardContains(string)\n          }\n          let descriptor = FetchDescriptor\u003cPerson>(predicate: predicate)\n          let matches = try modelContext.fetch(descriptor)\n          return matches.map(\\.entity)\n      }\n  }","// Working across apps - View annotations\n  \n  List {\n      ForEach(messages) { message in\n          MessageRow(message: message)\n              .appEntityIdentifier(\n                  EntityIdentifier(\n                      for: MessageEntity.self,\n                      identifier: message.id\n                  )\n              )\n      }\n  }","// Working across apps - Exporting content to another app\n  \n  extension ContactEntity: Transferable {\n\n      static var transferRepresentation: some TransferRepresentation {\n          IntentValueRepresentation(\n              exporting: \\.person\n          )\n      }\n  }","// Working across apps - IntentValueQuery\n\n  struct ContactEntityQuery: IntentValueQuery {\n\n      func values(for input: [IntentPerson]) async throws -> [ContactEntity] {\n          let names = input.map(\\.displayName)\n          let descriptor = FetchDescriptor\u003cContact>()\n          let contacts = try model.mainContext.fetch(descriptor)\n          let matches = contacts.filter { contact in\n              names.contains(where: { name in\n                  contact.name.localizedStandardContains(name)\n              })\n          }\n          return matches.map(\\.entity)\n      }\n  }","// Working across apps - IntentValueRepresentation\n\n  extension ContactEntity: Transferable {\n\n      static var transferRepresentation: some TransferRepresentation {\n          IntentValueRepresentation(exporting: \\.person, importing: { intentPerson in                    \n              let contact = Contact(importing: intentPerson)\n              ContactManager.shared.contacts.append(contact)\n              return contact.entity\n          })\n      }\n  }"]},"related":[{"id":"343","title":"Explore advanced App Intents features for Siri and Apple Intelligence","gloss":"探索 Siri 與 Apple Intelligence 的進階 App Intents 功能","gloss_en":"Explore advanced App Intents features for Siri and Apple Intelligence","category":"ai","categoryLabel":"AI 與機器學習"},{"id":"297","title":"Best practices for integrating visual intelligence in your app","gloss":"在 App 中整合視覺智慧的最佳實務","gloss_en":"Best practices for integrating visual intelligence in your app","category":"ai","categoryLabel":"AI 與機器學習"},{"id":"345","title":"Discover new capabilities in the App Intents framework","gloss":"探索 App Intents 框架的新能力","gloss_en":"Discover new capabilities in the App Intents framework","category":"other","categoryLabel":"其他"},{"id":"310","title":"What’s new in Shortcuts","gloss":"捷徑有什麼新東西","gloss_en":"What's new in Shortcuts","category":"ai","categoryLabel":"AI 與機器學習"},{"id":"344","title":"Code-along: Make your app available to Siri","gloss":"程式碼實作：讓你的 App 可被 Siri 使用","gloss_en":"Code-along: Make your app available to Siri","category":"ai","categoryLabel":"AI 與機器學習"}]}</script>
