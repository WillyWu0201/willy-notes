<script id="d" type="application/json">{"s":{"id":"330","title":"Optimize custom machine learning operations with Metal tensors","gloss":"用 Metal tensors 最佳化自訂機器學習運算","category":"graphics","categoryLabel":"圖形與遊戲","duration":973,"url":"https://developer.apple.com/videos/play/wwdc2026/330/","takeaway":"運用 Metal Tensor API 與 MPP Tensor Ops，以量化張量與 cooperative tensor 打造高效能的自訂 ML 運算核心。","chapters":[[0,"Introduction"],[21,"Apple's ML software stack"],[145,"Managing quantized data"],[233,"Create a quantized MTLTensor"],[263,"Multi-plane tensors"],[288,"Declare a multi-plane tensor with scale factors"],[317,"Quantized matrix multiplication"],[367,"MSL type aliases for an MXFP8 tensor handle"],[411,"Declare an inline MXFP8 tensor on the stack"],[439,"Slice tensors and run a quantized matmul"],[571,"Building advanced ops"],[627,"Set up simdgroup-scoped QxK multiplication"],[678,"Compute row-wise reduction for SoftMax"],[716,"Compute element-wise SoftMax with map_iterator"],[753,"Reuse cooperative tensor as matmul input"],[815,"Integrating custom ops into Core AI"],[925,"Next steps"]],"points":[{"text":"介紹 Apple 的 ML 軟體堆疊，並說明 **Metal Tensor API** 與 MPP Tensor Ops 的定位。","hot":false},{"text":"用 **MTLTensor** 搭配量化資料型別（如 MetalFloat8E4M3）管理量化資料。","hot":false},{"text":"透過 **auxiliary plane** 宣告帶 scale factors 的 multi-plane tensor，支援 MXFP8 區塊量化。","hot":true},{"text":"以 **matmul2d** 執行量化矩陣乘法，TensorOps 會自動處理反量化。","hot":false},{"text":"用 **cooperative tensor** 與 map_iterator 打造 SoftMax 等進階運算，並可整合進 Core AI。","hot":false}],"apis":["Metal","MTLTensor","MTLTensorDescriptor","MTLTensorAuxiliaryPlaneDescriptor","matmul2d","metal_tensor","MetalPerformancePrimitives"],"audience":"撰寫 **自訂 Metal ML 核心或高效能推論運算** 的進階圖形與機器學習開發者。","gloss_en":"Optimize custom machine learning operations with Metal tensors","takeaway_en":"Use the Metal Tensor API and MPP Tensor Ops with quantized tensors and cooperative tensors to build high-performance custom ML compute kernels.","points_en":[{"text":"Introduces Apple's ML software stack and explains where the **Metal Tensor API** and MPP Tensor Ops fit in.","hot":false},{"text":"Use **MTLTensor** with quantized data types (such as MetalFloat8E4M3) to manage quantized data.","hot":false},{"text":"Declare a multi-plane tensor with scale factors via an **auxiliary plane** to support MXFP8 block quantization.","hot":true},{"text":"Use **matmul2d** to perform quantized matrix multiplication; TensorOps handles dequantization automatically.","hot":false},{"text":"Use a **cooperative tensor** with map_iterator to build advanced operations like SoftMax, and integrate them into Core AI.","hot":false}],"audience_en":"Advanced graphics and machine learning developers writing **custom Metal ML kernels or high-performance inference operations**.","summary":["這場由 GPU 軟體工程師 Shiyao 主講，主題是如何用 **Metal tensors** 與 **TensorOps**（Metal Performance Primitives 的一部分）寫出高效能的自訂 ML kernel。整個 Apple ML 軟體堆疊從高階的 **Core AI**、**MLX**，到較底層的 **Metal Performance Shaders**，最終都建立在 **MPP** 與 **TensorOps** 之上。會想下探到 Metal 層的理由通常是：ML 研究進展飛快，你想實作能掛進 Core AI 的自訂運算，或正在為 MLX、llama.cpp 等框架貢獻 kernel。TensorOps 是一套 Metal Shading Language API，會自動利用各世代 Apple Silicon GPU 的硬體加速，特別是 M5 晶片中位於每個 shader core 內的 **neural accelerator**。","第一大主題是**量化資料**的最佳實務。現代模型越來越大，推論階段通常受記憶體頻寬限制，因此壓縮權重變得必要。標準做法是**量化**：把高精度權重降為低精度型別（例如 16-bit 降到 4-bit），並搭配 **scale factors** 把量化值還原回原始範圍。TensorOps 除了 16/32-bit 浮點外，現也原生支援量化型別——macOS/iOS 26 加入 4/8-bit 整數，27 再擴充到 4/8-bit 浮點與 2-bit 整數。建立量化 tensor 與一般 tensor 幾乎相同，只要在 descriptor 指定量化 `dataType`；scale 則透過 **auxiliary scale plane**（支援 FP8 E8M0 block-wise 格式）打包進同一個 `MTLTensor`。在 kernel 內用 type alias 宣告 `scales_plane` 與量化 tensor 型別後，呼叫 `slice` 切出 tile，再丟給 `matmul2d`，TensorOps 會**自動處理 dequantization**。","第二大主題是用 TensorOps 打造像 **FlashAttention** 這樣的進階自訂運算。Attention 的流程是先做 Q×K 矩陣相乘、對中間矩陣的列做 SoftMax、再乘上 V；FlashAttention 把這些融合成單一 kernel。實作上要用 **execution_simdgroup** scope 讓每個 simd group 擁有完整的列，如此計算 SoftMax 時不必跨 simd group 交換資料。中間結果存進 **cooperative tensor**（分散在參與執行緒的私有 register），避免寫回記憶體；列縮減用 `reduce_rows`，再以 `map_iterator` 對應兩個不同形狀 cooperative tensor 的元素來算 SoftMax。macOS 27 起 cooperative tensor 可直接當作下一個 matmul 的輸入（先用 `is_compatible_as_left_input` 檢查相容性，不相容才透過 threadgroup memory 轉換）。最後示範用 Core AI 把這個自訂 FlashAttention kernel 整合進 **Sam3** 影像分割模型，完成端到端推論。"],"deepdive":[{"t":0,"title":"Introduction","body":"GPU 軟體工程師 Shiyao 開場，預告本場會帶大家認識 **Metal tensors**，並學會用 **TensorOps** 寫出最佳化的自訂 ML kernel。重點放在量化資料的處理，以及打造像 FlashAttention 這類進階運算。"},{"t":21,"title":"Apple's ML software stack","body":"說明 Apple 各層 ML 軟體堆疊：高階的 **Core AI**、**MLX** 讓你用最少程式碼部署模型，較低階的 **Metal Performance Shaders** 提供高效能 kernel，而這些全都建立在 **Metal Performance Primitives** 與 **TensorOps** 之上。會想下探 Metal 層，通常是為了實作能掛進高階框架的自訂運算、為 MLX/llama.cpp 等框架貢獻 kernel，或開發 Metal 應用。TensorOps 會自動利用各世代 GPU 的硬體加速，特別是 M5 每個 shader core 內專為密集 compute-bound 工作（如 LLM 的 prefill 階段）設計的 **neural accelerator**。"},{"t":145,"title":"Managing quantized data","body":"點出現代模型越來越大、推論受**記憶體頻寬**限制，因此壓縮權重變得必要。標準做法是**量化**：把高精度權重（如 16-bit half）降為低精度型別（如 4-bit），再配上 **scale factors** 把量化值還原回原始範圍。TensorOps 已原生支援多種量化型別——26 版加入 4/8-bit 整數，27 版再擴充 4/8-bit 浮點與 2-bit 整數。"},{"t":233,"title":"Create a quantized MTLTensor","body":"建立量化 tensor 與一般 tensor 幾乎相同：照常填好 descriptor 屬性，只要把 `dataType` 設成量化型別（例如 `MTLTensorDataTypeMetalFloat8E4M3`），再呼叫 `newTensorWithDescriptor` 即可。這只是處理量化的**元素資料**部分，scale factors 留待後續說明。"},{"t":263,"title":"Multi-plane tensors","body":"macOS/iOS 27 起，單一 `MTLTensor` 物件可用額外的 **scale plane** 把 scales 與量化資料一起表示。此 plane 支援熱門的 **FP8 E8M0** block-wise scale factor 格式，scale plane 的每個元素對應 data plane 中的一個 block。量化資料、scales 與 metadata 全部打包進同一個 tensor 物件。"},{"t":288,"title":"Declare a multi-plane tensor with scale factors","body":"示範宣告 scale plane 的步驟：先建立 `MTLTensorAuxiliaryPlaneDescriptor`，填入 `dataType`（如 `MetalFloat8UE8M0`）與 `blockFactors`（例如 32×1）；再建立 auxiliary plane map 指定此 plane 為 **scales**；最後把 map 透過 `auxiliaryPlanes` 掛到原本的 tensor descriptor 上。"},{"t":317,"title":"Quantized matrix multiplication","body":"矩陣乘法是 ML 工作的核心運算，LLM 推論時會做數百萬次。基本做法是把輸入矩陣切成較小的 **tile**，再用 TensorOps 做 tile-wise 相乘，以最大化平行度並讓資料留在 cache。配合量化能進一步減少記憶體流量、把更大的模型塞進記憶體。"},{"t":367,"title":"MSL type aliases for an MXFP8 tensor handle","body":"在 kernel 內綁定 tensor 前，先用 **type alias** 宣告型別會更清楚。這裡宣告一個 `fp8_e8m0` 資料型別、block size 32×1 的 `scales_plane`（即每 32 個元素共用一個 scale），再宣告指定 FP8 資料型別並帶上該 scales_plane 的完整 tensor 型別，最後綁定到 buffer binding point。"},{"t":411,"title":"Declare an inline MXFP8 tensor on the stack","body":"如果不想在 host 端建立完整的 `MTLTensor`，可以直接在 shader 的 **stack** 上建立暫時 tensor。語法幾乎一樣，只要把 tag 從 `tensor_handle` 換成 **`tensor_inline`**，再把 buffer 指標與其他 metadata 傳給 tensor 建構子即可。"},{"t":439,"title":"Slice tensors and run a quantized matmul","body":"把問題分給多個 threadgroup 以增加平行度：用 threadgroup ID 對輸入與輸出 tensor 呼叫 `slice`，**data 與 scales plane 會依 block size 同步被切**。接著設定 `matmul2d_descriptor`（tile 尺寸等參數）、建立指定 simdgroup 數的 `matmul2d` op，再把量化 tensor 傳入，TensorOps 會**自動完成 dequantization**。"},{"t":571,"title":"Building advanced ops","body":"進階主題：用 TensorOps 打造更複雜的完整自訂運算。以 **Attention** 為例——它是每個 transformer（含 LLM）的核心：先把 Q、K 兩矩陣相乘，再對中間矩陣的列做 **SoftMax** reduction，最後乘上第三個矩陣 V。熱門的 **FlashAttention** 演算法把這些步驟融合進單一 kernel。"},{"t":627,"title":"Set up simdgroup-scoped QxK multiplication","body":"要實作 FlashAttention，先設定自訂的 simd group 對應，讓**每個 simd group 擁有中間矩陣的完整列**，如此算 SoftMax 時無需跨 simd group 交換資料。透過 **`execution_simdgroup`** scope 讓每個 simd group 獨立平行做矩陣乘法，用 simd group ID 切出 Q/K/V 的 tile，並用 **cooperative tensor** 儲存 Q×K 的結果，以便不寫回記憶體就接到下一步。"},{"t":678,"title":"Compute row-wise reduction for SoftMax","body":"計算 SoftMax 需要對 cooperative tensor 做幾次 reduction。TensorOps 提供 **`reduce_rows`** 函式，讓執行緒彼此交換資料來算出每一列的最大值，結果回傳到另一個 cooperative tensor。這裡用 `max` 的 reduction operation，初始值設為負無限大。"},{"t":716,"title":"Compute element-wise SoftMax with map_iterator","body":"由於 Q×K tile 與 row-max 兩個 cooperative tensor 形狀不同，TensorOps 提供 **`map_iterator`** 來對應：給定指向 2D tensor 元素的 iterator，回傳指向對應 reduction 目的元素的 iterator。做法是用 iterator 走訪 2D cooperative tensor，對每個元素 `map_iterator` 找到其 row max，再解參考相減並取 `exp`，把 SoftMax 結果寫回 cooperative tensor。"},{"t":753,"title":"Reuse cooperative tensor as matmul input","body":"現在要把這個 cooperative tensor 乘上 V。macOS 26 時必須先存到 threadgroup memory，但 27 起可**直接把 cooperative tensor 當作 matmul 的輸入**：呼叫 `get_left_input_cooperative_tensor`。要注意並非每個 cooperative tensor 都能重用——layout 可能因資料型別等因素而異，所以要先用 **`is_compatible_as_left_input`** 檢查；若不相容，就透過 threadgroup memory 存取以轉成正確 layout，但無論哪種路徑，`op.run` 的呼叫都一樣。"},{"t":815,"title":"Integrating custom ops into Core AI","body":"**Core AI** 提供工具讓 Python 開發者把 PyTorch 模型轉成 Core AI 模型，並支援自訂 Metal kernel。講者依「Deep Dive into Core AI Model authoring and Optimization」的步驟，把自訂 FlashAttention kernel 整合進 **Sam3** 影像分割模型：在 Python 中以字串定義 kernel body 並註冊 `TorchMetalKernel`，替換掉預設的 huggingface attention，再從 PyTorch 匯出成最佳化的 Core AI 資產。最後示範以圖片加文字 prompt（標出所有汽車像素）做 promptable 概念分割，結果正確把車子標成藍色，證明 kernel 已完整整合。"},{"t":925,"title":"Next steps","body":"總結今天涵蓋的工具：從量化資料型別，到 cooperative tensors、reductions 等進階 TensorOps 功能，再到與 Core AI 的整合。建議進一步查閱 **Metal Performance Primitives** 文件與 programming guide，並下載 TensorOps 範例程式碼，同時參考相關的 Core AI 與 Metal 場次。"}],"summary_en":["Presented by GPU Software Engineer Shiyao, this session covers how to write high-performance custom ML kernels using **Metal tensors** and **TensorOps** (part of Metal Performance Primitives). Apple's entire ML software stack — from high-level **Core AI** and **MLX** down to **Metal Performance Shaders** — ultimately builds on **MPP** and **TensorOps**. You'd drop down to the Metal level when ML research moves fast and you want to implement custom operations that plug into Core AI, or when contributing kernels to frameworks like MLX or llama.cpp. TensorOps is a Metal Shading Language API that automatically exploits hardware acceleration across all Apple Silicon GPU generations, especially the **neural accelerator** inside each shader core of the M5 chip.","The first major topic is best practices for **quantized data**. Models keep growing and inference is typically memory-bandwidth bound, so compressing weights becomes necessary. The standard approach is **quantization** — reducing high-precision weights to lower-precision types (e.g. 16-bit down to 4-bit), paired with **scale factors** to map values back to the original range. Beyond 16/32-bit floats, TensorOps now natively supports quantized types: 4/8-bit integers in macOS/iOS 26, and 4/8-bit floats plus 2-bit integers in 27. Creating a quantized tensor is nearly identical to a regular one — just specify a quantized `dataType` in the descriptor; scales are packed into the same `MTLTensor` as an **auxiliary scale plane** (supporting the FP8 E8M0 block-wise format). In the kernel you declare type aliases for the `scales_plane` and quantized tensor, call `slice` to extract tiles, and hand them to `matmul2d`, which **handles dequantization automatically**.","The second major topic is building advanced custom operations like **FlashAttention** with TensorOps. Attention multiplies Q×K, computes SoftMax over the rows of the intermediate matrix, then multiplies by V; FlashAttention fuses all of this into a single kernel. The implementation uses the **execution_simdgroup** scope so each simd group owns complete rows, avoiding cross-simdgroup data exchange during SoftMax. Intermediate results live in a **cooperative tensor** (distributed across participating threads' private registers) to avoid writing to memory; row reductions use `reduce_rows`, and `map_iterator` maps elements between two differently shaped cooperative tensors to compute SoftMax. Since macOS 27, a cooperative tensor can feed directly into the next matmul (check with `is_compatible_as_left_input`; only fall back through threadgroup memory if incompatible). Finally, the session integrates this custom FlashAttention kernel into a **Sam3** image segmentation model via Core AI for end-to-end inference."],"deepdive_en":[{"t":0,"title":"Introduction","body":"GPU Software Engineer Shiyao opens by previewing an exploration of **Metal tensors** and how to write optimized custom ML kernels with **TensorOps**. The focus is on working with quantized data and building advanced operations like FlashAttention."},{"t":21,"title":"Apple's ML software stack","body":"Lays out Apple's layered ML stack: high-level **Core AI** and **MLX** for deploying models with minimal code, lower-level **Metal Performance Shaders** for high-performance kernels, all built on **Metal Performance Primitives** and **TensorOps**. Reasons to work at the Metal level include implementing custom ops that plug into higher frameworks, contributing kernels to MLX/llama.cpp, or building a Metal app. TensorOps automatically uses hardware acceleration across GPU generations, notably the M5 **neural accelerator** in each shader core, designed for dense compute-bound work like an LLM's prefill stage."},{"t":145,"title":"Managing quantized data","body":"Notes that models keep growing and inference is **memory-bandwidth bound**, making weight compression necessary. The standard approach is **quantization** — reducing high-precision weights (e.g. 16-bit half) to lower precision (e.g. 4-bit), paired with **scale factors** to restore the original range. TensorOps natively supports many quantized types — 4/8-bit integers added in 26, with 4/8-bit floats and 2-bit integers in 27."},{"t":233,"title":"Create a quantized MTLTensor","body":"Creating a quantized tensor is nearly identical to a regular one: fill in descriptor properties as usual but set `dataType` to a quantized type (e.g. `MTLTensorDataTypeMetalFloat8E4M3`), then call `newTensorWithDescriptor`. This handles the quantized **element data**; scale factors are covered next."},{"t":263,"title":"Multi-plane tensors","body":"Starting in macOS/iOS 27, a single `MTLTensor` can represent scales alongside quantized data via an additional **scale plane**. This plane supports the popular **FP8 E8M0** block-wise scale factor format, where each scale-plane element applies to a block of data-plane elements. Quantized data, scales, and metadata are all packed into one tensor object."},{"t":288,"title":"Declare a multi-plane tensor with scale factors","body":"Demonstrates declaring the scale plane: create an `MTLTensorAuxiliaryPlaneDescriptor`, set its `dataType` (e.g. `MetalFloat8UE8M0`) and `blockFactors` (e.g. 32×1); build an auxiliary plane map specifying the plane is for **scales**; then attach the map to the original tensor descriptor via `auxiliaryPlanes`."},{"t":317,"title":"Quantized matrix multiplication","body":"Matrix multiplication is the core ML operation — LLMs perform millions per inference. The basic approach slices input matrices into smaller **tiles** and performs tile-wise multiplications with TensorOps to maximize parallelism and keep data in cache. Quantization further reduces memory traffic and fits larger models in memory."},{"t":367,"title":"MSL type aliases for an MXFP8 tensor handle","body":"Before binding tensors in the kernel, defining **type aliases** up front helps. Here a `scales_plane` is declared with `fp8_e8m0` data type and a 32×1 block size (every 32 elements share one scale), then a full tensor type specifying an FP8 data type along with that scales_plane, finally bound to a buffer binding point."},{"t":411,"title":"Declare an inline MXFP8 tensor on the stack","body":"If you don't want to create a full `MTLTensor` on the host, you can build a temporary tensor right on the shader's **stack**. The syntax is almost identical — just swap the tag `tensor_handle` for **`tensor_inline`** and pass buffer pointers plus other metadata to the tensor constructor."},{"t":439,"title":"Slice tensors and run a quantized matmul","body":"Divide the problem across many threadgroups for parallelism: call `slice` on input and output tensors using the threadgroup ID, and **both data and scales planes are sliced together** per the block size. Then set up the `matmul2d_descriptor` (tile sizes, etc.), create a `matmul2d` op specifying the number of simdgroups, and pass in the quantized tensors — TensorOps **handles dequantization for you**."},{"t":571,"title":"Building advanced ops","body":"Advanced topic: building a fuller, more complex custom operation with TensorOps. Using **Attention** as the example — core to every transformer including LLMs: multiply matrices Q and K, compute **SoftMax** via reductions on the rows of the intermediate matrix, then multiply by a third matrix V. The popular **FlashAttention** algorithm fuses all these into a single kernel."},{"t":627,"title":"Set up simdgroup-scoped QxK multiplication","body":"To implement FlashAttention, set up a custom simd group mapping so **each simd group owns complete rows** of the intermediate matrix, letting SoftMax be computed without exchanging data between simd groups. The **`execution_simdgroup`** scope makes each simd group perform an independent matmul in parallel; use the simd group ID to slice Q/K/V tiles, and store the Q×K result in a **cooperative tensor** to feed the next step without writing to memory."},{"t":678,"title":"Compute row-wise reduction for SoftMax","body":"Computing SoftMax needs a couple of reductions on the cooperative tensor. TensorOps provides **`reduce_rows`**, where threads exchange data to compute the max for each row, returning the result in another cooperative tensor. Here the `max` reduction operation is used with an initial value of negative infinity."},{"t":716,"title":"Compute element-wise SoftMax with map_iterator","body":"Because the Q×K tile and the row-max cooperative tensors have different shapes, TensorOps provides **`map_iterator`** to bridge them: given an iterator to a 2D tensor element, it returns one pointing to the corresponding reduction-destination element. Loop over the 2D cooperative tensor with iterators, `map_iterator` each element to its row max, then dereference, subtract, and `exp` to compute SoftMax, storing the result back."},{"t":753,"title":"Reuse cooperative tensor as matmul input","body":"Now multiply this cooperative tensor by V. In macOS 26 you'd first store it to threadgroup memory, but since 27 you can **use a cooperative tensor directly as a matmul input** via `get_left_input_cooperative_tensor`. Not every cooperative tensor can be reused — layouts may differ by data type and other factors — so check first with **`is_compatible_as_left_input`**; if incompatible, store and reload through threadgroup memory to convert layout, though either way the `op.run` call is the same."},{"t":815,"title":"Integrating custom ops into Core AI","body":"**Core AI** provides tools for Python developers to convert PyTorch models to Core AI models, with support for custom Metal kernels. Following the \"Deep Dive into Core AI Model authoring and Optimization\" steps, the speaker integrates the custom FlashAttention kernel into a **Sam3** image segmentation model: defining the kernel body as a string in Python and registering a `TorchMetalKernel`, replacing the default huggingface attention, then exporting from PyTorch as an optimized Core AI asset. A demo runs promptable concept segmentation on an image with text (labeling all car pixels), correctly highlighting the car in blue — proving the kernel is fully integrated."},{"t":925,"title":"Next steps","body":"Recaps the tools covered: from quantized data types to advanced TensorOps features like cooperative tensors and reductions, to Core AI integration. Suggests exploring the **Metal Performance Primitives** documentation and programming guide, downloading the TensorOps sample code, and checking related Core AI and Metal sessions."}],"code":["// Creating a tensor with a quantized data type from device\n\n#define RANK 2\n\nMTLTensorDescriptor *tensorDesc = [MTLTensorDescriptor new];\n\ntensorDesc.dataType = MTLTensorDataTypeMetalFloat8E4M3;\ntensorDesc.usage = MTLTensorUsageCompute;\n\nNSInteger dimensions[RANK] = {NumCols, NumRows};\ntensorDesc.dimensions = [[MTLTensorExtents alloc] initWithRank:RANK values:dimensions];\n\nNSError *err = nil;\nid \u003cMTLTensor> tensor = [device newTensorWithDescriptor:tensorDesc error:&err];","// Creating a tensor with a scales auxiliary plane from device\n\n#define RANK 2\n\nMTLTensorAuxiliaryPlaneDescriptor *planeDesc = [MTLTensorAuxiliaryPlaneDescriptor new];\nplaneDesc.dataType = MTLTensorDataTypeMetalFloat8UE8M0;\n\nNSInteger blockFactors[RANK] = {32, 1};\nplaneDesc.blockFactors = [[MTLTensorExtents alloc] initWithRank:RANK values:blockFactors];\n\nMTLTensorAuxiliaryPlaneDescriptorMap *auxiliaryPlanes =\n    [MTLTensorAuxiliaryPlaneDescriptorMap new];\n[auxiliaryPlanes setDescriptor:planeDesc forPlane:MTLTensorPlaneTypeScales];\n\nMTLTensorDescriptor *tensorDesc = [MTLTensorDescriptor new];\ntensorDesc.dataType = MTLTensorDataTypeMetalFloat8E4M3;\ntensorDesc.usage = MTLTensorUsageCompute;\n\nNSInteger dimensions[RANK] = {NumCols, NumRows};\ntensorDesc.dimensions = [[MTLTensorExtents alloc] initWithRank:RANK values:dimensions];\ntensorDesc.auxiliaryPlanes = auxiliaryPlanes;\n\nNSError *err = nil;\nid \u003cMTLTensor> tensor = [device newTensorWithDescriptor:tensorDesc error:&err];","// Type aliases for a MXFP8 multi-plane tensor handle\n\n#include \u003cmetal_tensor>\n\nusing namespace metal;\n\nusing scales_plane = tensor_blockwise\u003ctensor_plane_scales,\n                                      device metal_fp8_ue8m0_format,\n                                      32, 1>;\n\nusing mxfp8_tensor = tensor\u003cdevice metal_fp8_e4m3_format,\n                            dextents\u003cint, 2>,\n                            tensor_handle,\n                            scales_plane>;\n\nkernel void matmul(mxfp8_tensor matrixA [[buffer(0)]],\n                   mxfp8_tensor matrixB [[buffer(1)]],\n                   tensor\u003cdevice half, dextents\u003cint, 2>> matrixC [[buffer(2)]])\n{\n    // ...\n}","// Type aliases for a MXFP8 multi-plane tensor inline\n\n#include \u003cmetal_tensor>\n\nusing namespace metal;\n\nusing scales_plane = tensor_blockwise\u003ctensor_plane_scales,\n                                      device metal_fp8_ue8m0_format,\n                                      32, 1>;\n\nusing mxfp8_tensor_inline = tensor\u003cdevice metal_fp8_e4m3_format,\n                                   dextents\u003cint, 2>,\n                                   tensor_inline,\n                                   scales_plane>;\n\n// Construct tensor on the stack from buffer pointers\nmxfp8_tensor_inline matrixA(dataBufferA,\n                             dextents\u003cint, 2>(K, M),\n                             array\u003cint, 2>({ 1, K }),\n                             scales_plane(scalesBufferA));","// Slice the tensors to extract the relevant tile\nauto tA = matrixA.slice(0, tgid.y * TILEM);\nauto tB = matrixB.slice(tgid.x * TILEN, 0);\nauto tC = matrixC.slice(tgid.x * TILEN, tgid.y * TILEM);\n\n// Set up the matmul descriptor\nconstexpr auto descriptor = matmul2d_descriptor(TILEM,                  // M\n                                                TILEN,                  // N\n                                                dynamic_length_v\u003cint>,  // K\n                                                false,   // Left matrix transposed\n                                                false);  // Right matrix transposed\n\nmatmul2d\u003cdescriptor, execution_simdgroups\u003c4>> op;\n\n// Run the op — TensorOps handles dequantization automatically\nop.run(tA, tB, tC);","// Setup QxK matrix multiplication op\nconstexpr auto mul_qk_op_desc = matmul2d_descriptor(/* ... */);\nmatmul2d\u003cmul_qk_op_desc, execution_simdgroups> mul_qk_op;\n\n// Slice Q, K, V\nauto tQSlice = tQ.slice\u003cD, ROWS_PER_SIMD>(0, sgid * ROWS_PER_SIMD);\nauto tKSlice = tK.slice\u003cD, BK>(0, k);\nauto tVSlice = tV.slice\u003cD, BK>(0, k);\n\n// Create cooperative tensor to store tile of QxK\nauto ctQK = mul_qk_op.get_destination_cooperative_tensor\u003cdecltype(tQSlice),\n                                                         decltype(tKSlice),\n                                                         float>();\n\n// Multiply QxK\nmul_qk_op.run(tQSlice, tKSlice, ctQK);","// Create a cooperative tensor to store row reduction output\nauto ctTileRowMax = mul_qk_op.get_row_reduction_destination_cooperative_tensor\u003c\n                        decltype(tQSlice),\n                        decltype(tKSlice),\n                        float>();\n\n// Compute max over each row of QxK tile\nreduce_rows(ctQK, ctTileRowMax, reduction_operation::max, -INFINITY);","// Iterate over elements of QxK tile\n#pragma clang loop unroll(full)\nfor (auto it = ctQK.begin(); it != ctQK.end(); it++) {\n    // Fetch row max corresponding to this element\n    auto row_it = ctRowMax.map_iterator(it);\n\n    // Subtract row max from each element and compute exponent\n    *it = exp(*it - *row_it);\n}","constexpr auto mul_sv_op_desc = matmul2d_descriptor(/* ... */);\nmatmul2d\u003cmul_sv_op_desc, metal::execution_simdgroup> mul_sv_op;\n\nif (mul_sv_op.is_compatible_as_left_input\u003cfloat, half, float>(ctQK)) {\n    // Directly reuse cooperative tensor as input\n    auto ctQKIn = mul_sv_op.get_left_input_cooperative_tensor\u003cfloat, half, float>(ctQK);\n    mul_sv_op.run(ctQKIn, tVSlice, ctO);\n} else {\n    // Store and reload through threadgroup memory if layout is not compatible\n    ctQK.store(tgTensor);\n    simdgroup_barrier(mem_flags::mem_threadgroup);\n\n    auto ctQKIn = mul_sv_op.get_left_input_cooperative_tensor\u003cfloat, half, float>();\n    ctQKIn.load(tgTensor);\n    mul_sv_op.run(ctQKIn, tVSlice, ctO);\n}"]},"related":[{"id":"356","title":"Bringing Cyberpunk 2077 to Mac","gloss":"將《電馭叛客 2077》帶上 Mac","gloss_en":"Bringing Cyberpunk 2077 to Mac","category":"graphics","categoryLabel":"圖形與遊戲"},{"id":"359","title":"Build real-time neural rendering pipelines with Metal","gloss":"用 Metal 打造即時神經渲染管線","gloss_en":"Build real-time neural rendering pipelines with Metal","category":"graphics","categoryLabel":"圖形與遊戲"},{"id":"388","title":"Find and fix performance issues in your Metal games","gloss":"找出並修復 Metal 遊戲的效能問題","gloss_en":"Find and fix performance issues in your Metal games","category":"graphics","categoryLabel":"圖形與遊戲"},{"id":"322","title":"Compose advanced graphics effects with SwiftUI","gloss":"用 SwiftUI 組合進階圖形效果","gloss_en":"Compose advanced graphics effects with SwiftUI","category":"swiftui","categoryLabel":"SwiftUI"},{"id":"325","title":"Dive into Core AI model authoring and optimization","gloss":"深入 Core AI 模型編寫與最佳化","gloss_en":"Dive into Core AI model authoring and optimization","category":"ai","categoryLabel":"AI 與機器學習"}]}</script>
