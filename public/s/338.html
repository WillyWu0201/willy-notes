<script id="d" type="application/json">{"s":{"id":"338","title":"Build live production tools for Apple Immersive Video","gloss":"為 Apple Immersive Video 打造直播製作工具","category":"graphics","categoryLabel":"圖形與遊戲","duration":983,"url":"https://developer.apple.com/videos/play/wwdc2026/338/","takeaway":"了解如何封裝沉浸式影片、空間音訊與場景中繼資料，並透過即時媒體傳輸與 VideoToolbox 壓縮設定打造 Apple Immersive Video 的直播製作流程。","chapters":[[0,"Introduction"],[128,"Live production overview"],[316,"What makes immersive live different"],[425,"Immersive live format"],[549,"Real-time media transport"],[685,"Recording and playback"],[797,"Set compression properties for vexu metadata"]],"points":[{"text":"概覽 **Apple Immersive Video** 的直播製作流程，並說明沉浸式直播與一般直播的差異。","hot":false},{"text":"介紹沉浸式直播格式，整合沉浸式影片、**spatial audio** 與場景中繼資料。","hot":false},{"text":"說明 **real-time media transport** 以及錄製與播放的處理方式。","hot":false},{"text":"透過 **VideoToolbox** 設定壓縮屬性 **kVTCompressionPropertyKey_ProjectionKind** 為 AppleImmersiveVideo 來寫入 vexu 中繼資料。","hot":true}],"apis":["VideoToolbox","kVTCompressionPropertyKey_ProjectionKind","kVTProjectionKind_AppleImmersiveVideo"],"audience":"適合**從事沉浸式影片直播製作、需要封裝與傳輸 Apple Immersive Video 的開發者與工程團隊**。","gloss_en":"Build live production tools for Apple Immersive Video","takeaway_en":"Learn how to package immersive video, spatial audio, and scene metadata, and build a live production workflow for Apple Immersive Video using real-time media transport and VideoToolbox compression settings.","points_en":[{"text":"Overviews the live production workflow for **Apple Immersive Video** and explains how immersive live broadcasts differ from ordinary ones.","hot":false},{"text":"Introduces the immersive live format, combining immersive video, **spatial audio**, and scene metadata.","hot":false},{"text":"Explains **real-time media transport** and how recording and playback are handled.","hot":false},{"text":"Write vexu metadata by setting the **VideoToolbox** compression property **kVTCompressionPropertyKey_ProjectionKind** to AppleImmersiveVideo.","hot":true}],"audience_en":"**Developers and engineering teams working on immersive video live production who need to package and transport Apple Immersive Video.**","summary":["這場由 Apple Immersive Video Live Engineering 團隊主講，背景是 Apple 今年首度把 LA Lakers 球賽以 **Apple Immersive Video** 即時串流進 Apple Vision Pro（透過 Spectrum SportsNet 與 NBA app）。講者的目標是啟發大家打造下一代沉浸式直播工具與工作流程，並先用一段時間說明傳統直播製作管線（production domain 與 delivery domain），介紹攝影機、圖卡、replay、video switcher、麥克風、audio console，以及把所有設備串在一起的中央 media router，作為理解沉浸式製作的基礎。","接著講者點出沉浸式直播與傳統 2D 製作的根本差異：為了符合人眼視覺敏銳度，影像解析度是一般 2D 製作的 **32 倍**且以兩倍幀率產製，音訊則改用最多可達 64 聲道以上的 **ASAF（Apple Spatial Audio Format）**。這些龐大的格式與品質需求讓傳統工具與傳輸方式無法直接沿用，必須重建整套工作流程。為此他歸納三個關鍵概念：一套媒體格式標準、一套即時傳輸方法，以及錄製與播放回放（playout）的機制。","媒體格式由三個既有標準組合而成：影像是串流的 **ProRes** 影格（而非未壓縮影格，且 Apple Silicon 對 ProRes 處理特別最佳化）、音訊是承載高階 ambisonics 與 spatial audio objects 的未壓縮 PCM（即 ASAF）、metadata 則是每影格的 JSON 物件，描述鏡頭校正、創意事件、空間音訊行為等。傳輸層採用業界標準 **SMPTE 2110**：壓縮影像走 **2110-22**（左右眼以兩個獨立 essence 包在同一 stream，免去 frame packing 或雙串流管理）、ASAF 音訊走 **2110-30**、JSON metadata 走 **2110-41**。","錄製與回放是直播的核心能力，傳統 2D 工作流程因反覆編解碼會累積世代損失，但沉浸式格式因「全部都已是 ProRes」而免去額外編解碼——同一批 ProRes 影格直接複製進 MOV 檔再讀回 2110 串流，全程零品質損失。實作上以 AVFoundation 的 **AVAssetWriter** 寫入影像、音訊與 MEBX metadata 軌；寫影像軌時要在 `AVVideoCompressionPropertiesKey` 設定新的 VideoToolbox 常數 `kVTProjectionKind_AppleImmersiveVideo`，加上正確的 vexu 靜態 metadata；metadata 則需先反序列化、解析後，用 visionOS 26 引入的 **Immersive Media Support（IMS）** 框架建立 lens calibration、camera ID 等物件並與影音同步寫入。實務上鼓勵以 AVFoundation、VideoToolbox、AudioToolbox 與 IMS 自行打造工具，並深入 SMPTE 2110 把工具串成完整直播工作流程。"],"deepdive":[{"t":0,"title":"Introduction","body":"由 Apple Immersive Video Live Engineering 團隊負責人 Jared King 開場，以今年首度把 LA Lakers 球賽即時串流進 **Apple Vision Pro** 的案例切入，說明沉浸式攝影機讓球迷坐進難以企及的座位、資料驅動圖卡強化賽事、**spatial audio** 把觀眾包進現場人聲中。背後是 Apple 自建的直播平台。講者把目標定為啟發大家打造下一代沉浸式工具與直播體驗。"},{"t":128,"title":"Live production overview","body":"先建立直播管線的整體圖像：影音與資料在 **production domain** 被擷取與創意製作，再於 **delivery domain** 編碼並即時串流給觀眾。規模可大可小，從 TV 攝影棚、轉播車到 podcast 工作室或小型音樂場館皆然，但目標一致——即時把製作好的內容傳給觀眾。本場聚焦 production domain 的獨特之處。"},{"t":316,"title":"What makes immersive live different","body":"逐一介紹製作工作流程中的創意工具：多台 **live cameras** 捕捉不同角度、**graphics** 鍵控疊加下三分之一字幕或計分板、**replay** 系統錄影與回放、**video switcher** 讓操作員切換鏡頭並疊圖產出最終創意串流。音訊端由麥克風收音、**audio console** 把各音源混成最終的 mix。所有工具都透過中央 **media router** 像統一網路層般彼此交換訊號。"},{"t":425,"title":"Immersive live format","body":"點出沉浸式與 2D 製作分道揚鑣的關鍵在於 fidelity 與 presence：影像解析度是 2D 製作的 **32 倍**並以兩倍幀率產製以匹配人眼視覺敏銳度，音訊以 **ASAF** 取代立體聲或 5.1，可含 **64 聲道以上**。這些龐大格式讓傳統工具與傳輸方式無法支撐，因此必須重建整套工作流程，並歸納出格式標準、即時傳輸、錄製回放三大主題。"},{"t":549,"title":"Real-time media transport","body":"說明任何製作中設備分為輸出、輸入、兩者兼具三類，全部須對齊統一格式才能透過 media router 即時交換。媒體格式由三個既有標準合成：串流 **ProRes** 影格（在畫質與頻寬間取得平衡，且 Apple Silicon 已最佳化）、承載高階 ambisonics 與 audio objects 的 PCM（即 ASAF）、每影格 JSON metadata（鏡頭校正、創意事件等）。傳輸採 **SMPTE 2110**：壓縮影像走 **2110-22**（左右眼為兩個獨立 essence 同包一 stream，免 frame packing）、ASAF 走 **2110-30**、JSON 走 **2110-41**。"},{"t":685,"title":"Recording and playback","body":"傳統 2D 工作流程反覆編解碼會累積世代損失，對沉浸式體驗影響尤甚；但因沉浸式格式「全部已是 **ProRes**」，錄製到磁碟無需額外編解碼，同一批 ProRes 影格直接複製進 MOV 再讀回 2110 串流，全程不被觸碰、零品質損失。實務上一段內容可被攝影、傳輸、錄製、剪輯並反覆 live 播出而品質不變。播放時所有流程反向操作，從 MOV 各軌讀出影音與 metadata 再送回 2110 輸出。"},{"t":797,"title":"Set compression properties for vexu metadata","body":"說明以 AVFoundation 的 **AVAssetWriter** 把影像寫入 QuickTime MOV 影像軌、PCM 音訊寫入音訊軌、JSON 寫入 **MEBX** metadata 軌。寫影像軌時要在 `AVVideoCompressionPropertiesKey` 設定新的 VideoToolbox 常數 **`kVTProjectionKind_AppleImmersiveVideo`**，為檔案加上正確的 **vexu** 靜態 metadata 將其標記為 immersive。JSON 須先反序列化解析後，以 visionOS 26 引入的 **Immersive Media Support（IMS）** 框架建立 lens calibration、camera ID 等物件並與影音同步寫入。"}],"summary_en":["Presented by Apple's Immersive Video Live Engineering team, this session is grounded in a milestone: Apple streamed select LA Lakers games live into Apple Vision Pro this year (via the Spectrum SportsNet and NBA apps), placing fans courtside with immersive cameras, data-driven graphics, and crowd-enveloping **spatial audio**. The speaker's goal is to inspire developers to build the next generation of immersive production tools, starting with a primer on the traditional live pipeline split into a **production domain** and a **delivery domain**, and the creative tools within it: cameras, graphics, replay, the video switcher, microphones, audio consoles, and the central **media router** that ties every device together.","He then explains how immersive live diverges from traditional 2D production. To match human visual acuity, video resolution is **32 times** that of a typical 2D broadcast and runs at twice the frame rate, while audio moves to **ASAF (Apple Spatial Audio Format)** mixes carrying 64 or more channels. These massive formats break traditional tools and transports, forcing an entirely rebuilt workflow. Three key concepts anchor it: a media format standard, a real-time transport method, and a record/playout mechanism.","The media format combines three existing standards: streamed **ProRes** frames for video (not uncompressed frames, and Apple Silicon is optimized for ProRes), uncompressed PCM carrying high-order ambisonics and spatial audio objects for ASAF, and per-frame JSON metadata describing lens calibrations, creative events, and spatial audio behavior. Transport rides on the industry-standard **SMPTE 2110**: compressed video as **2110-22** (left and right eye as two separate essences inside one stream, eliminating frame packing and dual-stream management), ASAF audio as **2110-30**, and JSON metadata as **2110-41**.","Recording and playback are core to any broadcast. Traditional 2D workflows accumulate generational loss through repeated encode/decode cycles, but the immersive format avoids this because everything is already **ProRes**: the same frames are copied straight into MOV files and read back into 2110 streams, untouched and lossless. In practice this is done with AVFoundation's **AVAssetWriter** for video, audio, and MEBX metadata tracks. When writing the video track, set the new VideoToolbox constant `kVTProjectionKind_AppleImmersiveVideo` in `AVVideoCompressionPropertiesKey` to add the correct vexu static metadata. The streamed JSON must be deserialized and parsed, then turned into lens calibration objects, camera IDs, and other metadata via the **Immersive Media Support (IMS)** framework introduced in visionOS 26, written in sync with the audio and video. Developers are encouraged to build their own tools with AVFoundation, VideoToolbox, AudioToolbox, and IMS, and to go deeper on SMPTE 2110 to wire tools into a real live workflow."],"deepdive_en":[{"t":0,"title":"Introduction","body":"Jared King, who leads the Apple Immersive Video Live Engineering team, opens with this year's first live streaming of LA Lakers games into **Apple Vision Pro**, noting how immersive cameras gave fans unreachable seats, data-driven graphics augmented the action, and **spatial audio** placed viewers inside the roaring crowd. Behind it all was a live broadcast platform built by Apple. His stated goal is to inspire developers to build the next generation of immersive tools and live experiences."},{"t":128,"title":"Live production overview","body":"He frames the overall pipeline: video, audio, and data are captured and creatively produced in the **production domain**, then encoded and streamed live to viewers in the **delivery domain**. Productions scale from TV studios and broadcast trucks to podcast studios and small venues, but the goal is the same — capture, produce, and transmit live content in real time. The session concentrates on what makes the production domain unique for immersive."},{"t":316,"title":"What makes immersive live different","body":"He walks through the creative tools of a production workflow: multiple **live cameras** for different angles, **graphics** keyed over video (lower thirds, scoreboards), **replay** systems for recording and playout, and a **video switcher** for cutting between cameras and overlaying graphics into the final stream. On the audio side, microphones capture sources and **audio consoles** blend them into the final mix. Every tool exchanges signals through a central **media router** acting as a unified network layer."},{"t":425,"title":"Immersive live format","body":"The divergence from 2D production hinges on fidelity and presence: video resolution is **32 times** that of a typical 2D broadcast and produced at twice the frame rate to match human visual acuity, while audio uses **ASAF** instead of stereo or 5.1, supporting **64 or more channels**. These massive formats and quality requirements mean traditional tools and transports can't keep up, so an entirely different workflow is required — distilled into format standard, real-time transport, and record/playback."},{"t":549,"title":"Real-time media transport","body":"Every device falls into three classes — output, ingest, or both — and all must agree on a unified format to exchange content through the media router in real time. That format fuses three standards: streamed **ProRes** frames (balancing quality and bandwidth, with Apple Silicon optimized for ProRes), PCM carrying high-order ambisonics and audio objects (ASAF), and per-frame JSON metadata. Transport uses **SMPTE 2110**: compressed video as **2110-22** (left and right eye as two separate essences in one stream, no frame packing), ASAF as **2110-30**, and JSON as **2110-41**."},{"t":685,"title":"Recording and playback","body":"Traditional 2D workflows lose quality through repeated encode/decode cycles, which compound as generational loss and hurt the immersive experience. Because the immersive format is already **ProRes** end to end, recording to disk needs no extra encode or decode — the same frames are copied directly into MOV files and read back into 2110 streams during playout, untouched. In practice, a clip can be captured, transported, recorded, edited, and replayed live on repeat with no quality impact. On playback every step is reversed: media types are read from their MOV tracks and retransmitted into 2110 output streams."},{"t":797,"title":"Set compression properties for vexu metadata","body":"Video is written to QuickTime MOV video tracks with AVFoundation's **AVAssetWriter**, PCM audio into the audio tracks, and JSON into **MEBX** metadata tracks. When writing the video track, set the new VideoToolbox constant **`kVTProjectionKind_AppleImmersiveVideo`** in `AVVideoCompressionPropertiesKey` so the file gets the correct **vexu** static metadata signaling it as immersive. The streamed JSON must first be deserialized and parsed, then turned into lens calibration objects, camera IDs, and other metadata using the **Immersive Media Support (IMS)** framework introduced in visionOS 26, written in sync with the audio and video."}],"code":["import VideoToolbox\n\nlet compressionProperties: [String: Any] = [\n    // ...\n    kVTCompressionPropertyKey_ProjectionKind as String: kVTProjectionKind_AppleImmersiveVideo\n    // ...\n]"]},"related":[{"id":"215","title":"Get started with the HTML Model Element","gloss":"開始使用 HTML model 元素","gloss_en":"Getting started with the HTML model element","category":"graphics","categoryLabel":"圖形與遊戲"},{"id":"252","title":"Design no-code games with Reality Composer Pro 3","gloss":"用 Reality Composer Pro 3 設計無程式碼遊戲","gloss_en":"Design no-code games with Reality Composer Pro 3","category":"graphics","categoryLabel":"圖形與遊戲"},{"id":"256","title":"Discover generated subtitles and subtitle styles","gloss":"認識自動產生字幕與字幕樣式","gloss_en":"Discover generated subtitles and subtitle styles","category":"graphics","categoryLabel":"圖形與遊戲"},{"id":"285","title":"Discover USDKit and what’s new in OpenUSD","gloss":"認識 USDKit 與 OpenUSD 的新功能","gloss_en":"Discover USDKit and what's new in OpenUSD","category":"graphics","categoryLabel":"圖形與遊戲"},{"id":"304","title":"Implement high resolution photo capture","gloss":"實作高解析度照片拍攝","gloss_en":"Implement high resolution photo capture","category":"graphics","categoryLabel":"圖形與遊戲"}]}</script>
