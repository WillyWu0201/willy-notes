<script id="d" type="application/json">{"s":{"id":"258","title":"What’s new in Xcode 27","gloss":"Xcode 27 的新功能","category":"swift","categoryLabel":"Swift","duration":1680,"url":"https://developer.apple.com/videos/play/wwdc2026/258/","takeaway":"Xcode 27 帶來工作區自訂、編輯器內 coding agent、Device Hub、在地化、Organizer 與 Instruments Top Functions 等多項生產力提升。","chapters":[[7,"Introduction"],[61,"Workspace & Toolbar"],[133,"Themes"],[304,"Inline Issues"],[368,"New Project Workflows"],[520,"Coding Agents in the Editor"],[577,"Device Hub"],[793,"Localization"],[1017,"Organizer"],[1267,"Instruments & Top Functions"],[1548,"Xcode Cloud"],[1671,"Next steps"]],"points":[{"text":"編輯器內整合 **Coding Agents**，可直接在程式碼旁進行 AI 輔助開發。","hot":true},{"text":"**工作區與工具列**可自訂、新增**主題（Themes）**與 **Inline Issues**（行內問題顯示），改善編輯體驗。","hot":false},{"text":"新增 **Device Hub** 集中管理裝置，並更新**新專案工作流程**與在地化（Localization）工具。","hot":false},{"text":"**Organizer** 與 **Instruments** 強化，新增 **Top Functions** 協助快速定位效能熱點。","hot":false},{"text":"**Xcode Cloud** 也獲得更新，持續整合 CI/CD 流程。","hot":false}],"apis":["Xcode","Instruments","Xcode Cloud"],"audience":"**所有使用 Xcode 的 Apple 平台開發者**，想了解最新 IDE 生產力功能與工作流程改進者。","gloss_en":"What's new in Xcode 27","takeaway_en":"Xcode 27 brings workspace customization, in-editor coding agents, Device Hub, localization, Organizer, and Instruments Top Functions, among many productivity improvements.","points_en":[{"text":"**Coding Agents** are integrated right into the editor, enabling AI-assisted development alongside your code.","hot":true},{"text":"The **workspace and toolbar** are customizable, with new **Themes** and **Inline Issues** to improve the editing experience.","hot":false},{"text":"Adds **Device Hub** to centrally manage devices, and updates the **new project workflow** and Localization tools.","hot":false},{"text":"**Organizer** and **Instruments** are enhanced, with a new **Top Functions** view to help you quickly pinpoint performance hot spots.","hot":false},{"text":"**Xcode Cloud** also gets updates to keep CI/CD integration moving.","hot":false}],"audience_en":"**All Apple platform developers using Xcode** who want to learn about the latest IDE productivity features and workflow improvements.","summary":["Xcode 27 由設計師 Jake 與工程師 Breckin 以「紙飛機艦隊」app 為主軸，串起從原型發想到上線維運的完整生命週期。前半段聚焦於工作環境的全新外觀與高度客製化：**Toolbar** 與 **Themes** 經過重新設計，歷史導覽、編輯器控制項都移上 Toolbar，分支選擇器則改放底部以容納長分支名稱；主題系統可透過幾條滑桿調整文字與背景強度，甚至產生漸層背景，並支援為不同 workspace 套用不同主題以一眼辨識專案。編輯時的 **Inline Issues** 也改為低調的「預測式 (live) issues」，在打字時以融入主題的淡色背景呈現，建置後才轉為全強度的 warning/error。","在開發流程上，Xcode 27 讓「靈感一來就開專案」變得極為輕鬆：File 選單可直接建立 App、Command Line Tool、Swift Package 或 Playground，甚至產生免命名的 untitled 專案隨意嘗試；單獨開啟一個 Swift 檔也能在 canvas 顯示 playground 結果與 UI preview。最大的升級在於 **Coding Agents** 深度整合到編輯器：agent 對話以 editor 形式存在，可搭配 tab 與分割視窗組織，支援 `/plan` 指令先擬定計畫、派生 sub-agents 平行探索，所有改動與產出 (檔案、screenshot) 即時顯示於右側，側邊欄則彙整所有平行進行的對話。執行 app 時會進入 **Device Hub**，以貼合裝置尺寸的視窗呈現，可展開檢視器測試 accessibility 設定、Dynamic Type、深色外觀與 iPhone Mirroring 縮放，並能在同一介面同時操作 simulator 與實體裝置 (如已配對的 iPad Pro)。","後半段由 Breckin 接手，說明 app 上線後如何持續維運。**Localization** 借助 coding agent 自動檢查字串、建立 **String Catalog** 並翻譯整份 UI，String Catalog 中選定語言後按 Generate Translations 即可在背景補上新語言 (如簡體中文)，搭配 TestFlight 讓母語使用者回饋。**Organizer** 帶來四項更新：重新設計的 Overview 將診斷與 metrics 並置、新增 Storage 與 animation hitches metrics、把 recommendations 升級為依同類 app 校準的 **Metric Goals**，並可用 coding agent 進行 Generate Recommendations 引導式效能分析。","效能調校方面，**Instruments** 的 **Top Functions** 能快速找出被頻繁呼叫的昂貴函式 — 範例中直接指向 `paperPhysics`，搭配 CMD+Shift+O Quick Open 找到那段迴圈迭代過多的除錯殘留程式碼並修正。最後以 **Xcode Cloud** 收尾，這個內建的 CI/CD 服務在 Xcode 27 中只需幾步即可連接遠端 repo，讓 Unit/UI Tests 在每次 commit 時於雲端跨裝置平行執行以捕捉回歸，並無縫銜接 TestFlight 與 App Store。整體而言，Xcode 27 從原型、協作、在地化到上線後問題追蹤都能陪伴開發者，讓人專注於打造真正特別的 app。"],"deepdive":[{"t":7,"title":"Introduction","body":"設計師 **Jake** 與工程師 **Breckin** 以他們正在開發的紙飛機艦隊管理 app 為貫穿全場的例子開場。他們預告 Xcode 27 三大亮點：更容易透過 **Coding Agents** 啟動任務、更快速地嘗試新專案點子，以及前所未有可客製化的 workspace，並依序帶到工作環境、新專案、agent、Device Hub 與上線後維運。"},{"t":61,"title":"Workspace & Toolbar","body":"**Toolbar** 經過重新設計，將原本藏在 jump bar 的歷史導覽與編輯器控制項移上來，建置進度等活動資訊顯示於視窗標題下方，中央放置 coding agent 入口與 scheme/destination 選擇器，右上則有 tab、編輯器分割與三段式編輯模式切換 (preview/playground、Assistant Editor、原始碼變更檢視)。分支選擇器移到底部以容納長分支名稱，而最大特點是 Toolbar 完全可自訂，能自由增刪與重排項目。"},{"t":133,"title":"Themes","body":"新的 **Appearance** 設定面板可用兩條滑桿調整文字色彩強度與背景強度，背景拉到最高甚至會變成鮮豔漸層，且可自選色調 (如粉紅) 讓整個調色盤自動更新。所有個別顏色都由 base palette 生成，手動修改某色 (如 keyword 設為粉紅) 會鎖定該值且可一鍵 reset；字型也採同樣的 palette 機制。主題會影響整個 workspace 視窗，並可為不同 workspace 套用不同主題以一眼區分專案，深色外觀下尤其鮮明。"},{"t":304,"title":"Inline Issues","body":"warning 與 error 重新設計以配合新主題。**預測式 (live) issues** 採用融入主題的低調淡色背景，讓使用者打字時保持專注且能與建置後的 issue 區別。當你修改程式碼時 Xcode 會像要重新建置般自動預測問題，實際 build 後這些預測會轉為全強度色彩的 warning/error，或在已解決時自動消失。"},{"t":368,"title":"New Project Workflows","body":"從 File 選單可依需求選擇起點：要 SwiftUI 就用 **App**、不需 UI 用 macOS **Command Line Tool**、要做給他人用的函式庫選 **Swift Package**、只想要單一含 Playground macro 的 Swift 檔則選 **Playground**。Xcode 27 會直接建立免命名的 untitled 專案讓你盡情試驗，之後再決定命名儲存或整個捨棄；甚至單獨開啟一個 Swift 檔就能在 canvas 顯示 playground 結果與 UI preview，方便分享輕量點子。"},{"t":520,"title":"Coding Agents in the Editor","body":"**Coding agents** 全面強化，對話與任務以 editor 形式進入編輯區，可搭配 tab、分割視窗自由組織。透過 Toolbar 按鈕啟動對話，使用 `/plan` 指令會呼叫 plan tool 先蒐集脈絡、派生 sub-agents 平行探索而不立即改動，待計畫完成可審閱、給 inline 回饋或放行實作；agent 的所有改動、產出檔案與 screenshot 即時顯示右側，coding assistant 側邊欄則彙整所有平行對話並標示未讀。講者並推薦延伸觀看「Xcode, agents, and you」。"},{"t":577,"title":"Device Hub","body":"啟動 app 時會在 **Device Hub** 以貼合裝置尺寸的精簡視窗開啟，提供回主畫面、截圖、旋轉等快速動作，展開後可開啟 Inspector 測試提高對比、放大 Dynamic Type、深色外觀等 **accessibility** 設定。也能驗證 macOS 27 上可調整大小的 iPhone Mirroring 縮放模式與不同長寬比，而 SwiftUI 標準視圖讓 app 已具備良好的 resizable 支援。最重要的是側邊欄整合 simulator 與實體裝置 (如已配對運行中的 iPad Pro)，可直接在 Mac 上控制多種尺寸機型。"},{"t":793,"title":"Localization","body":"**Localization** 由 coding agent 大幅分擔工作：因 agent 是大型語言模型，特別適合建議合適翻譯。新建對話後請 agent 設定在地化，它會讀過程式碼、確保字串字面值可被在地化引用、建立涵蓋所有 UI 字串的 **String Catalog** 並翻成指定語言 (示範為西班牙文)，翻譯時運用整個專案脈絡與 Xcode 的語言風格指引。String Catalog 中選定語言 (如簡體中文) 按 Generate Translations 即可在背景補完，並建議先從一兩種語言開始、務必實測版面與截斷問題，並用 TestFlight 收集母語回饋。"},{"t":1017,"title":"Organizer","body":"**Organizer** 從只收集報告進化到能協助行動，帶來四項新東西：重新設計的 **Overview** 把最高影響力問題與診斷、metrics 並置於同一畫面 (上方圖表尖峰示警、下方診斷指出程式位置)；新增 **Storage** metric (拆解 documents、data、binary size) 與更全面的 animation **hitches** metric (涵蓋 Liquid Glass 與 SwiftUI 動畫，不限捲動)；recommendations 升級為依同類 app 與自身歷史基準校準的 **Metric Goals** (涵蓋 hang rate、disk writes、battery、storage、hitches)；並可用 coding agent 執行 Generate Recommendations 進行引導式效能分析。"},{"t":1267,"title":"Instruments & Top Functions","body":"**Instruments** 在 Xcode 27 中更貼合工作流程，新功能 **Top Functions** 讓效能模式更快浮現，特別適合找出被執行多次的昂貴操作。示範中重現 Organizer 標示的動畫 hitch，選取 CPU profile 中活動密集的時間範圍後按 Top Functions，發現大量時間花在動畫管線、最頂端是昂貴的 `paperPhysics`。透過 CMD+Shift+O Quick Open 找到該函式，原來是除錯時遺留的迴圈迭代過多，改回 5 次後 hitch 消失、Top Functions 中也不再出現自家方法。"},{"t":1548,"title":"Xcode Cloud","body":"**Xcode Cloud** 是內建於 Xcode、專為 Apple 平台打造的 CI/CD 服務，可在雲端跨多裝置、Xcode 與 OS 版本平行建置與測試，Xcode 27 中更易上手。示範以 Get Started 按鈕幾步完成設定：確認 app 與開發團隊、連接遠端原始碼 repo，按 Start First Build 後即可在 main 或 feature 分支每次 commit 自動跑 Unit/UI Tests 作為回歸訊號，並無縫整合 TestFlight 與 App Store 交付。"},{"t":1671,"title":"Next steps","body":"Jake 總結 Xcode 27 在 app 生命週期每一步都陪伴開發者：從把初步點子化為原型、與 agent 協作、在地化，到上線後解決現場問題，都讓人能專注於打造特別的 app。最後鼓勵下載 Xcode 27、依自己的工作流程客製化，並參考 release notes 與本場 session 資源探索更多新功能。"}],"summary_en":["Xcode 27 is presented by designer Jake and engineer Breckin around their paper-airplane fleet app, tracing the full lifecycle from prototyping to post-launch maintenance. The first half focuses on the redesigned, highly customizable workspace: the **Toolbar** and **Themes** are revamped, with history navigation and editor controls moved up into the Toolbar, build activity shown under the window title, and the branch picker relocated to the bottom bar to fit long branch names. The theme system lets you tune text and background intensity with a couple of sliders (even producing a vibrant gradient background) and apply different themes per workspace to tell projects apart at a glance. While editing, **Inline Issues** become subtle predictive (live) issues that blend into the theme as you type, only turning into full-intensity warnings and errors after a build.","On workflow, Xcode 27 makes starting a project effortless: the File menu offers App, Command Line Tool, Swift Package, and Playground starting points, and can create an untitled project with no questions asked for quick experiments; even a standalone Swift file shows playground results and UI previews in the canvas. The biggest upgrade is the deep integration of **Coding Agents** into the editor: agent conversations live as editors you compose with tabs and splits, support the `/plan` command to gather context and spawn parallel sub-agents before making changes, surface all edits and artifacts (files, screenshots) on the right, and roll up parallel conversations in a sidebar. Running an app opens it in **Device Hub**, a compact device-sized window where you can expand the Inspector to test accessibility settings, Dynamic Type, dark appearance, and resizable iPhone Mirroring, and control simulators and physical devices (like a paired iPad Pro) side by side.","Breckin takes the second half, covering life after launch. **Localization** leans on the coding agent to audit strings, build a **String Catalog**, and translate the entire UI; selecting a language in the String Catalog and clicking Generate Translations adds a new language (such as Simplified Chinese) in the background, with TestFlight enabling native-speaker feedback. The **Organizer** gains four things: a redesigned Overview placing diagnostics and metrics together, new Storage and animation hitches metrics, recommendations elevated into **Metric Goals** calibrated against similar apps and your own history, and Generate Recommendations powered by a coding agent for guided performance analysis.","For performance, **Instruments** gains **Top Functions**, which quickly surfaces expensive, frequently-called functions — in the demo pointing straight at `paperPhysics`, where CMD+Shift+O Quick Open reveals a debug leftover looping far too many times, fixed by reducing the count. The talk closes with **Xcode Cloud**, the built-in CI/CD service that in Xcode 27 takes just a few steps to connect to a remote repo, running Unit/UI tests in parallel across devices on every commit to catch regressions and integrating seamlessly with TestFlight and the App Store. Overall, Xcode 27 supports developers from prototype through collaboration, localization, and field issues so they can focus on making something special."],"deepdive_en":[{"t":7,"title":"Introduction","body":"Designer **Jake** and engineer **Breckin** open with the paper-airplane fleet app that runs throughout the session. They preview Xcode 27's three highlights — easier task kickoff with **Coding Agents**, faster iteration on new project ideas, and a more customizable workspace than ever — then map out the journey through workspace, new projects, agents, Device Hub, and post-launch maintenance."},{"t":61,"title":"Workspace & Toolbar","body":"The **Toolbar** is redesigned, pulling history navigation and editor controls out of the jump bar, showing build activity under the window title, centering the coding agent entry point and scheme/destination picker, and placing tab, split, and a three-way editor-mode chooser (preview/playground, Assistant Editor, source-control review) at top right. The branch picker moves to the bottom bar to fit long names, and the standout feature is that the Toolbar is fully customizable — you can add, remove, and reorder items freely."},{"t":133,"title":"Themes","body":"The new **Appearance** settings panel offers two sliders to tune text color intensity and background intensity, with the background turning into a vibrant gradient at maximum, plus custom tints (like pink) that update the whole palette. Every individual color is generated from a base palette; manually editing one (e.g. setting keywords to pink) locks it and can be reset, and fonts follow the same palette mechanism. Themes affect the entire workspace window and can differ per workspace to distinguish projects at a glance, looking especially vibrant in dark appearance."},{"t":304,"title":"Inline Issues","body":"Warnings and errors are redesigned to work with the new themes. Predictive (live) issues use a subtle background that blends into your theme to reduce distraction while typing and to distinguish them from build-time issues. As you edit, Xcode predicts issues as if a build were starting; after you actually build, those predictions turn into full-intensity warnings and errors or are dismissed if resolved."},{"t":368,"title":"New Project Workflows","body":"The File menu offers starting points by need: **App** for SwiftUI, a macOS **Command Line Tool** when no UI is needed, a **Swift Package** for libraries others can use, and **Playground** for a single Swift file with a Playground macro. Xcode 27 creates an untitled project with no questions asked so you can experiment freely and later name and save or discard it; even opening a standalone Swift file shows playground results and UI previews in the canvas, making it easy to share lightweight ideas."},{"t":520,"title":"Coding Agents in the Editor","body":"**Coding agents** are supercharged, with conversations and tasks entering the editor area as editors you compose with tabs and splits. A Toolbar button starts a conversation, and the `/plan` command invokes the plan tool to gather context and spawn parallel sub-agents without making changes, letting you review the plan, give inline feedback, or approve implementation; all agent edits, produced files, and screenshots appear live on the right, while the coding assistant sidebar rolls up parallel conversations and flags unread messages. The presenter recommends the session 'Xcode, agents, and you' for the full picture."},{"t":577,"title":"Device Hub","body":"Launching an app opens it in **Device Hub** as a compact device-sized window with quick actions (home, screenshot, rotate); expanding it reveals an Inspector to test **accessibility** settings like increased contrast, larger Dynamic Type, and dark appearance. You can also exercise the resizable iPhone Mirroring mode on macOS 27 with different aspect ratios, helped by SwiftUI standard views giving the app solid resizable support. Best of all, the sidebar combines simulators and physical devices (like a paired iPad Pro already running the app), so you can control many form factors right on your Mac."},{"t":793,"title":"Localization","body":"**Localization** is largely offloaded to the coding agent, which, being an LLM, is ideal for suggesting appropriate translations. After creating a conversation and asking it to set up localization, the agent reads the code, makes string literals localization-ready, builds a **String Catalog** of every UI string, and translates them (Spanish in the demo) using full project context plus Xcode's language-specific style guidance. Selecting a language (like Simplified Chinese) and clicking Generate Translations fills it in the background; the advice is to start with one or two languages, always test for layout and truncation issues, and use TestFlight for native-speaker feedback."},{"t":1017,"title":"Organizer","body":"The **Organizer** evolves from collecting reports to helping you act, with four new things: a redesigned **Overview** placing the highest-impact issues, diagnostics, and metrics in one view (a chart spike up top signals trouble, diagnostics below point to the code); new **Storage** metric (breaking down documents, data, binary size) and a more complete animation **hitches** metric (covering Liquid Glass and SwiftUI animations beyond scrolling); recommendations elevated into **Metric Goals** calibrated against similar apps and your own historical baselines (covering hang rate, disk writes, battery, storage, hitches); and Generate Recommendations using a coding agent for guided performance analysis."},{"t":1267,"title":"Instruments & Top Functions","body":"**Instruments** fits better alongside the rest of the work in Xcode 27, and the new **Top Functions** makes performance patterns jump out faster, ideal for finding expensive operations performed many times. Reproducing the hitch the Organizer flagged, the presenter selects the busy time range in a CPU profile and presses Top Functions, finding lots of time in the animation pipeline with `paperPhysics` at the top. CMD+Shift+O Quick Open opens the function, revealing a debug leftover looping far too many times; reducing it to 5 makes the hitch disappear and removes the app's methods from Top Functions."},{"t":1548,"title":"Xcode Cloud","body":"**Xcode Cloud** is a CI/CD service built into Xcode expressly for shipping to Apple platforms, building and testing in the cloud in parallel across devices, Xcode, and OS versions, and easier to start in Xcode 27. The demo uses Get Started to confirm the app and team, connect the remote source repo, and click Start First Build, after which Unit/UI tests run automatically on every commit to main or feature branches as a regression signal, integrating seamlessly with TestFlight and the App Store."},{"t":1671,"title":"Next steps","body":"Jake wraps up that Xcode 27 is there at every step of the app lifecycle — from fleshing out ideas into prototypes, collaborating with agents, and localizing, to resolving field issues — letting developers focus on making something special. He encourages downloading Xcode 27, customizing it for your workflow, and exploring more via the release notes and this session's resources."}],"code":[]},"related":[{"id":"268","title":"Profile, fix, and verify: Improve app responsiveness with Instruments","gloss":"用 Instruments 剖析、修正並驗證 App 反應速度","gloss_en":"Profile, fix, and verify: Improve app responsiveness with Instruments","category":"swift","categoryLabel":"Swift"},{"id":"243","title":"Debug and profile agentic app experiences with Instruments","gloss":"用 Instruments 除錯與分析代理式 App 體驗","gloss_en":"Debug and profile agentic app experiences with Instruments","category":"ai","categoryLabel":"AI 與機器學習"},{"id":"261","title":"Build, deliver, and automate with Xcode Cloud","gloss":"用 Xcode Cloud 建置、交付與自動化","gloss_en":"Build, deliver, and automate with Xcode Cloud","category":"appstore","categoryLabel":"App Store"},{"id":"382","title":"Inside Apple Intelligence and Xcode: Special Presentation","gloss":"深入 Apple Intelligence 與 Xcode：特別發表","gloss_en":"Inside Apple Intelligence and Xcode: Special Presentation","category":"ai","categoryLabel":"AI 與機器學習"},{"id":"399","title":"Dub Dub Daily: Day 4","gloss":"Dub Dub 每日精選：第 4 天","gloss_en":"Dub Dub Daily: Day 4","category":"other","categoryLabel":"其他"}]}</script>
